    _cleanupCurrentBeat: function () {
      var sceneEl = this._els.stageScene;
      if (!sceneEl) return;
      if (typeof sceneEl._cleanup === "function") {
        try {
          sceneEl._cleanup();
        } catch (e) {}
        sceneEl._cleanup = null;
      }
      var curBeat = this.beats[this.currentIndex];
      if (curBeat && typeof curBeat.onLeave === "function") {
        try {
          curBeat.onLeave(sceneEl);
        } catch (e) {}
      }
    },

    _renderBeat: function (targetIndex, prevBeat, direction, silent) {
      var beat = this.beats[targetIndex];
      if (!beat) return;

      var sceneEl = this._els.stageScene;
      var sameStage = Boolean(
        prevBeat &&
          prevBeat.stageId &&
          beat.stageId &&
          prevBeat.stageId === beat.stageId
      );

      // 1. Sync mood & ambient particle canvas immediately
      var mood = beat.mood || "dusk";
      this._els.shell.setAttribute("data-mood", mood);
      if (this._canvasCtrl) {
        this._canvasCtrl.setMood(mood);
      }

      // 2. Render visual stage HTML into .stage-scene with smart transition class
      if (this._animTimer) {
        clearTimeout(this._animTimer);
        this._animTimer = null;
      }

      sceneEl.classList.remove("same-stage-morph", "new-stage-enter-next", "new-stage-enter-prev");

      var visualMarkup = "";
      try {
        if (typeof beat.visualHtml === "function") {
          visualMarkup = beat.visualHtml();
        } else if (typeof beat.renderStage === "function") {
          visualMarkup = beat.renderStage();
        } else if (typeof beat.html === "string") {
          visualMarkup = beat.html;
        }
      } catch (err) {
        console.error("Error rendering beat " + (beat.num || targetIndex + 1), err);
        visualMarkup = "";
      }

      sceneEl.innerHTML = toWesternDigits(visualMarkup || "");
      sceneEl.setAttribute("data-stage-id", beat.stageId || "");
      sceneEl.setAttribute("data-beat-num", String(beat.num || targetIndex + 1));
      sceneEl.setAttribute("data-chapter", String(typeof beat.chapter === "number" ? beat.chapter : 0));

      var animClass = sameStage
        ? "same-stage-morph"
        : direction === "prev"
          ? "new-stage-enter-prev"
          : "new-stage-enter-next";

      // Force clean reflow so rapid key presses reliably restart CSS animations
      void sceneEl.offsetWidth;
      sceneEl.classList.add(animClass);

      var animDuration = sameStage ? 360 : 540;
      this._animTimer = setTimeout(function () {
        sceneEl.classList.remove("same-stage-morph", "new-stage-enter-next", "new-stage-enter-prev");
      }, animDuration);

      // 3. Update single-sentence caption (.caption-text + .caption-pop) & optional .source-chip
      var captionEl = this._els.captionText;
      if (captionEl) {
        captionEl.classList.remove("caption-pop");
        captionEl.textContent = toWesternDigits(beat.caption || "");
        void captionEl.offsetWidth;
        captionEl.classList.add("caption-pop");
      }

      var chipEl = this._els.sourceChip;
      var srcTag = toWesternDigits(beat.sourceTag || "").trim();
      if (chipEl) {
        if (srcTag) {
          chipEl.textContent = srcTag;
          chipEl.hidden = false;
          chipEl.classList.add("is-visible");
        } else {
          chipEl.textContent = "";
          chipEl.hidden = true;
          chipEl.classList.remove("is-visible");
        }
      }

      // 4. Sync Topbar & Bottombar HUD
      this._syncHUD(beat, targetIndex);

      // 5. Play beat SFX (or whisper-subtle transition cue)
      if (!silent) {
        if (beat.sfx) {
          SoundSynth.play(beat.sfx);
        } else {
          SoundSynth.play(sameStage ? "morph" : "whoosh");
        }
      }

      // 6. Attach interactive handlers if beat defines onEnter(stageRoot)
      var enterFn = beat.onEnter || beat.onMount;
      if (typeof enterFn === "function") {
        try {
          enterFn.call(beat, sceneEl, this);
        } catch (err) {
          console.error("Error in onEnter for beat " + (beat.num || targetIndex + 1), err);
        }
      }
    },

    _syncHUD: function (beat, idx) {
      var total = this.beats.length;
      var chNum = typeof beat.chapter === "number" ? beat.chapter : 0;
      var chTitle = toWesternDigits(beat.chapterTitle || CHAPTER_NAMES[chNum] || "الفصل " + (chNum + 1));

      if (this._els.chapterTitle) {
        this._els.chapterTitle.textContent = chTitle;
      } else if (this._els.chapterPill) {
        this._els.chapterPill.textContent = chTitle;
      }

      if (this._els.counter) {
        this._els.counter.textContent = (idx + 1) + " / " + total;
      }

      if (this._els.progressFill) {
        var pct = total <= 1 ? 100 : ((idx + 1) / total) * 100;
        this._els.progressFill.style.width = pct.toFixed(2) + "%";
      }

      if (this._els.prevBtn) {
        this._els.prevBtn.disabled = idx <= 0;
      }
      if (this._els.nextBtn) {
        this._els.nextBtn.disabled = idx >= total - 1;
      }

      for (var i = 0; i < this._els.chapterTicks.length; i++) {
        var tick = this._els.chapterTicks[i];
        var tickCh = parseInt(tick.getAttribute("data-chapter-tick"), 10);
        var tickIdx = parseInt(tick.getAttribute("data-goto-index"), 10);
        tick.classList.toggle("is-current", tickCh === chNum);
        tick.classList.toggle("is-reached", idx >= tickIdx);
      }

      for (var c = 0; c < this._els.drawerChips.length; c++) {
        var chip = this._els.drawerChips[c];
        chip.classList.toggle("is-active", parseInt(chip.getAttribute("data-drawer-chapter"), 10) === chNum);
      }

      for (var b = 0; b < this._els.beatTiles.length; b++) {
        this._els.beatTiles[b].classList.toggle("is-current", b === idx);
      }
    },

    goTo: function (targetIndex, opts) {
      var options = opts || {};
      var total = this.beats.length;
      if (!total) return false;

      var clamped = Math.max(0, Math.min(total - 1, targetIndex));
      if (clamped !== targetIndex && !options.clamp) return false;
      if (clamped === this.currentIndex && !options.force) return false;

      var prevBeat = this.beats[this.currentIndex] || null;
      var direction = options.direction || (clamped >= this.currentIndex ? "next" : "prev");

      this._cleanupCurrentBeat();
      this.currentIndex = clamped;
      this._renderBeat(clamped, prevBeat, direction, Boolean(options.silent));

      if (this.autoPlaying) {
        this._scheduleAutoAdvance();
      }
      return true;
    },

    goToBeat: function (beatNum) {
      var n = parseInt(toWesternDigits(beatNum), 10);
      if (isNaN(n)) return false;
      for (var i = 0; i < this.beats.length; i++) {
        if (Number(this.beats[i].num) === n) {
          return this.goTo(i);
        }
      }
      if (n >= 1 && n <= this.beats.length) {
        return this.goTo(n - 1);
      }
      return false;
    },

    goToSceneNum: function (num) {
      return this.goToBeat(num);
    },

    next: function () {
      if (this.currentIndex >= this.beats.length - 1) return false;
      return this.goTo(this.currentIndex + 1, { direction: "next" });
    },

    goNext: function () {
      return this.next();
    },

    prev: function () {
      if (this.currentIndex <= 0) {
        this._showBeatOneArrowHint();
        return false;
      }
      return this.goTo(this.currentIndex - 1, { direction: "prev" });
    },

    goPrev: function () {
      return this.prev();
    },

    nextChapter: function () {
      if (!this.chapters.length) return false;
      var curBeat = this.beats[this.currentIndex];
      var curCh = curBeat && typeof curBeat.chapter === "number" ? curBeat.chapter : 0;

      for (var i = 0; i < this.chapters.length; i++) {
        if (this.chapters[i].chapter > curCh) {
          var target = this.chapters[i];
          this.goTo(target.firstIndex, { direction: "next" });
          this.showToast("⏭ الفصل " + (target.chapter + 1) + ": " + target.title, 2100);
          return true;
        }
      }

      if (this.currentIndex < this.beats.length - 1) {
        return this.goTo(this.beats.length - 1, { direction: "next" });
      }
      this.showToast("✨ أنت في الفصل الختامي", 1800);
      return false;
    },

    prevChapter: function () {
      if (!this.chapters.length) return false;
      var curBeat = this.beats[this.currentIndex];
      var curCh = curBeat && typeof curBeat.chapter === "number" ? curBeat.chapter : 0;

      // Find current chapter entry
      var curChIndex = 0;
      for (var i = 0; i < this.chapters.length; i++) {
        if (this.chapters[i].chapter === curCh) {
          curChIndex = i;
          break;
        }
      }

      var currentChapterObj = this.chapters[curChIndex];
      // If deep inside current chapter, jump to start of current chapter; if already at start, jump to previous chapter
      var targetChapterObj =
        currentChapterObj && this.currentIndex > currentChapterObj.firstIndex
          ? currentChapterObj
          : curChIndex > 0
            ? this.chapters[curChIndex - 1]
            : this.chapters[0];

      if (!targetChapterObj) return false;
      if (this.currentIndex === 0) {
        this._showBeatOneArrowHint();
        return false;
      }

      this.goTo(targetChapterObj.firstIndex, { direction: "prev" });
      this.showToast("⏮ الفصل " + (targetChapterObj.chapter + 1) + ": " + targetChapterObj.title, 2100);
      return true;
    },

    restart: function () {
      this.closeRefs();
      this.closeDrawer();
      if (this.autoPlaying) {
        this.toggleAutoPlay(false);
      }
      SoundSynth.play("chime");
      return this.goTo(0, { direction: "prev", force: true, silent: true });
    },

    _showBeatOneArrowHint: function () {
      SoundSynth.play("ping");
      if (!this.arrowReversed) {
        this.showToast("💡 أنت في اللقطة 1 — اضغط السهم الأيمن (→) للمتابعة، أو ⇄ لعكس اتجاه الأسهم", 3400);
      } else {
        this.showToast("💡 أنت في اللقطة 1 — اضغط السهم الأيسر (←) للمتابعة، أو ⇄ لإعادة وضع PowerPoint", 3400);
      }
    },

    toggleTheme: function () {
      this.theme = this.theme === "dark" ? "light" : "dark";
      this._els.shell.setAttribute("data-theme", this.theme);
      document.documentElement.setAttribute("data-theme", this.theme);
      if (this._els.themeBtn) {
        this._els.themeBtn.textContent = this.theme === "light" ? "🌙" : "☀️";
      }
      if (this._canvasCtrl) {
        this._canvasCtrl.setTheme(this.theme);
      }
      SoundSynth.play("ui");
      this.showToast(
        this.theme === "light" ? "☀️ الوضع النهاري عالي التباين" : "🌙 الوضع الليلي السينمائي",
        2000
      );
    },

    toggleSound: function () {
      SoundSynth.enabled = !SoundSynth.enabled;
      if (this._els.soundBtn) {
        this._els.soundBtn.textContent = SoundSynth.enabled ? "🔊" : "🔇";
        this._els.soundBtn.classList.toggle("is-active", SoundSynth.enabled);
        this._els.soundBtn.setAttribute("aria-pressed", SoundSynth.enabled ? "true" : "false");
      }
      if (SoundSynth.enabled) {
        SoundSynth.play("ui");
      }
      this.showToast(SoundSynth.enabled ? "🔊 المؤثرات الصوتية مفعّلة" : "🔇 تم كتم المؤثرات الصوتية", 1900);
    },

    togglePolarity: function () {
      this.arrowReversed = !this.arrowReversed;
      if (this._els.polarityBtn) {
        this._els.polarityBtn.classList.toggle("is-active", this.arrowReversed);
        this._els.polarityBtn.setAttribute("aria-pressed", this.arrowReversed ? "true" : "false");
      }
      SoundSynth.play("ui");
      this.showToast(
        this.arrowReversed
          ? "⇄ تم عكس الأسهم: (←) للقطة التالية • (→) للقطة السابقة"
          : "⇄ وضع PowerPoint الافتراضي: (→) للقطة التالية • (←) للقطة السابقة",
        2900
      );
    },

    toggleArrowPolarity: function () {
      return this.togglePolarity();
    },

    _scheduleAutoAdvance: function () {
      if (this._autoTimer) {
        clearTimeout(this._autoTimer);
        this._autoTimer = null;
      }
      if (!this.autoPlaying) return;

      var self = this;
      this._autoTimer = setTimeout(function () {
        if (!self.autoPlaying) return;
        if (self.currentIndex < self.beats.length - 1) {
          self.next();
        } else {
          self.toggleAutoPlay(false);
          self.showToast("✨ اكتمل العرض التلقائي عند اللقطة 80", 2800);
        }
      }, AUTOPLAY_INTERVAL_MS);
    },

    toggleAutoPlay: function (forceState) {
      var nextState = typeof forceState === "boolean" ? forceState : !this.autoPlaying;
      this.autoPlaying = nextState;

      if (this._autoTimer) {
        clearTimeout(this._autoTimer);
        this._autoTimer = null;
      }

      if (this._els.autoplayBtn) {
        this._els.autoplayBtn.textContent = this.autoPlaying ? "⏸" : "▶";
        this._els.autoplayBtn.classList.toggle("is-active", this.autoPlaying);
        this._els.autoplayBtn.setAttribute("aria-pressed", this.autoPlaying ? "true" : "false");
      }

      SoundSynth.play("ui");
      if (this.autoPlaying) {
        if (this.currentIndex >= this.beats.length - 1) {
          this.goTo(0, { direction: "next", force: true, silent: true });
        }
        this.showToast("▶ تشغيل قصصي تلقائي (3.8 ثانية للقطة — اضغط P للإيقاف)", 2400);
        this._scheduleAutoAdvance();
      } else if (forceState === undefined) {
        this.showToast("⏸ تم إيقاف التشغيل التلقائي", 1700);
      }
    },

    toggleAutoplay: function (forceState) {
      return this.toggleAutoPlay(forceState);
    },

    toggleFullscreen: function () {
      var doc = document;
      var root = doc.documentElement;
      if (!doc.fullscreenElement && !doc.webkitFullscreenElement) {
        var req = root.requestFullscreen || root.webkitRequestFullscreen;
        if (req) {
          try {
            var p = req.call(root);
            if (p && typeof p.catch === "function") p.catch(function () {});
          } catch (e) {}
        }
      } else {
        var exit = doc.exitFullscreen || doc.webkitExitFullscreen;
        if (exit) {
          try {
            var q = exit.call(doc);
            if (q && typeof q.catch === "function") q.catch(function () {});
          } catch (e) {}
        }
      }
      SoundSynth.play("ui");
    },

    /* ---- Chapter & Beat Jump Drawer (#jump-drawer) ---- */
    openDrawer: function () {
      this.toggleDrawer(true);
    },

    closeDrawer: function () {
      this.toggleDrawer(false);
    },

    toggleDrawer: function (forceState) {
      var open = typeof forceState === "boolean" ? forceState : !this.drawerOpen;
      if (open && this.refsOpen) {
        this.closeRefs();
      }
      this.drawerOpen = open;

      var el = this._els.jumpDrawer;
      if (!el) return;
      el.classList.toggle("is-open", open);
      el.classList.toggle("open", open);
      el.classList.toggle("is-active", open);
      el.classList.toggle("is-visible", open);
      el.setAttribute("aria-hidden", open ? "false" : "true");

      if (this._els.drawerBtn) {
        this._els.drawerBtn.classList.toggle("is-active", open);
      }

      if (open) {
        if (this.autoPlaying) this.toggleAutoPlay(false);
        var activeTile = this._els.beatTiles[this.currentIndex];
        if (activeTile && typeof activeTile.scrollIntoView === "function") {
          setTimeout(function () {
            activeTile.scrollIntoView({ block: "nearest", behavior: "smooth" });
          }, 40);
        }
      }
      SoundSynth.play("ui");
    },

    openSorter: function () {
      this.openDrawer();
    },

    closeSorter: function () {
      this.closeDrawer();
    },

    toggleSorter: function (forceState) {
      this.toggleDrawer(forceState);
    },

    /* ---- Searchable 79 Academic References Modal (#refs-modal) ---- */
    openRefs: function () {
      if (this.drawerOpen) {
        this.closeDrawer();
      }
      // Refresh references in case a later script populated window.STORY_REFERENCES
      this.references = resolveReferencesList();
      this.refsOpen = true;

      var modal = this._els.refsModal;
      if (!modal) return;
      modal.classList.toggle("is-open", true);
      modal.classList.toggle("open", true);
      modal.classList.toggle("is-active", true);
      modal.classList.toggle("is-visible", true);
      modal.setAttribute("aria-hidden", "false");

      if (this.autoPlaying) {
        this.toggleAutoPlay(false);
      }

      this._renderRefsList();
      SoundSynth.play("ui");

      var searchEl = this._els.refsSearch;
      if (searchEl) {
        setTimeout(function () {
          try {
            searchEl.focus();
          } catch (e) {}
        }, 50);
      }
    },

    openReferences: function () {
      this.openRefs();
    },

    closeRefs: function () {
      if (!this.refsOpen) return;
      this.refsOpen = false;
      var modal = this._els.refsModal;
      if (!modal) return;
      modal.classList.remove("is-open", "open", "is-active", "is-visible");
      modal.setAttribute("aria-hidden", "true");
      SoundSynth.play("ui");
    },

    toggleRefs: function (forceState) {
      var open = typeof forceState === "boolean" ? forceState : !this.refsOpen;
      if (open) this.openRefs();
      else this.closeRefs();
    },

    _renderRefsList: function () {
      var listEl = this._els.refsList;
      if (!listEl) return;

      var qNorm = normalizeSearchText(this.refQuery);
      var activeCat = this.refCategory || "all";

      var filtered = this.references.filter(function (ref) {
        if (activeCat !== "all" && ref.cat !== activeCat) return false;
        if (!qNorm) return true;
        var numStr = String(ref.num);
        if (numStr === qNorm || "#" + numStr === qNorm) return true;
        var hay = normalizeSearchText(
          numStr +
            " " +
            (ref.title || "") +
            " " +
            (ref.kw || "") +
            " " +
            (CAT_LABELS[ref.cat] || "") +
            " " +
            (ref.url || "")
        );
        return hay.indexOf(qNorm) !== -1;
      });

      if (this._els.refsCount) {
        this._els.refsCount.textContent =
          filtered.length === this.references.length
            ? this.references.length + " مرجعاً"
            : filtered.length + " من " + this.references.length;
      }

      if (this._els.refsClear) {
        this._els.refsClear.hidden = !this.refQuery;
      }

      if (!filtered.length) {
        listEl.innerHTML =
          '<div class="se-empty-refs">لا توجد مراجع مطابقة لعبارة البحث الحالية — جرّب كلمة مفتاحية أخرى أو مسح التصفية.</div>';
        return;
      }

      listEl.innerHTML = filtered
        .map(function (ref) {
          var domain = extractDomain(ref.url);
          var catName = CAT_LABELS[ref.cat] || CAT_LABELS.general;
          return (
            '<div class="se-ref-card">' +
            '<div class="se-ref-top">' +
            '<span class="se-ref-num">#' +
            ref.num +
            "</span>" +
            '<span class="se-ref-cat">' +
            escapeHtml(catName) +
            "</span>" +
            "</div>" +
            '<div class="se-ref-title">' +
            escapeHtml(ref.title) +
            "</div>" +
            (ref.url
              ? '<div class="se-ref-foot">' +
                '<span class="se-ref-domain">' +
                escapeHtml(domain) +
                "</span>" +
                '<a class="se-ref-link" href="' +
                escapeHtml(ref.url) +
                '" target="_blank" rel="noopener noreferrer">فتح المصدر ↗</a>' +
                "</div>"
              : "") +
            "</div>"
          );
        })
        .join("");
    },

    /* ---- SFX & Toast Public API ---- */
    playSfx: function (name) {
      SoundSynth.play(name);
    },

    sfx: function (name) {
      SoundSynth.play(name);
    },

    jumpTo: function (index) {
      return this.goTo(index);
    },

    playSound: function (name) {
      SoundSynth.play(name);
    },

    playEffect: function (name) {
      SoundSynth.play(name);
    },

    showToast: function (message, durationMs) {
      var toast = this._els.toast;
      if (!toast) return;
      if (this._toastTimer) {
        clearTimeout(this._toastTimer);
        this._toastTimer = null;
      }
      toast.textContent = toWesternDigits(message);
      toast.classList.add("is-visible", "visible", "show", "is-open");
      this._toastTimer = setTimeout(function () {
        toast.classList.remove("is-visible", "visible", "show", "is-open");
      }, durationMs || 2800);
    },

    getState: function () {
      return {
        currentIndex: this.currentIndex,
        beatNum: this.beats[this.currentIndex] ? this.beats[this.currentIndex].num : this.currentIndex + 1,
        totalBeats: this.beats.length,
        theme: this.theme,
        soundEnabled: SoundSynth.enabled,
        arrowReversed: this.arrowReversed,
        autoPlaying: this.autoPlaying,
        drawerOpen: this.drawerOpen,
        refsOpen: this.refsOpen
      };
    },

    /* ----------------------------------------------------------------------
       7. Event Binding (PowerPoint Keyboard, Stage Click, Scrub, Touch, Modals)
       ---------------------------------------------------------------------- */
    _bindEvents: function () {
      var self = this;
      var shell = this._els.shell;

      // Delegated Shell Clicks (HUD controls, Modals, Declarative hooks)
      shell.addEventListener("click", function (e) {
        // 1. Close modal buttons
        var closeBtn = e.target.closest("[data-close]");
        if (closeBtn) {
          var targetModal = closeBtn.getAttribute("data-close");
          if (targetModal === "drawer") self.closeDrawer();
          else if (targetModal === "refs") self.closeRefs();
          return;
        }

        // 2. Backdrop clicks on open modals
        if (e.target === self._els.jumpDrawer) {
          self.closeDrawer();
          return;
        }
        if (e.target === self._els.refsModal) {
          self.closeRefs();
          return;
        }

        // 3. Declarative open-refs or restart triggers (e.g. Beat 80 buttons)
        if (e.target.closest('[data-ctrl="refs"], [data-open-refs], [data-action="open-refs"], .open-refs-btn, #open-refs-btn')) {
          e.preventDefault();
          self.openRefs();
          return;
        }
        if (e.target.closest('[data-action="restart"], [data-restart-story], .restart-story-btn')) {
          e.preventDefault();
          self.restart();
          return;
        }

        // 4. Jump targets inside drawer or chapter ticks
        var gotoBtn = e.target.closest("[data-goto-index]");
        if (gotoBtn) {
          e.stopPropagation();
          var targetIdx = parseInt(gotoBtn.getAttribute("data-goto-index"), 10);
          if (self.drawerOpen) self.closeDrawer();
          if (!isNaN(targetIdx)) {
            self.goTo(targetIdx);
          }
          return;
        }

        // 5. Reference category filter pills
        var refCatBtn = e.target.closest("[data-ref-cat]");
        if (refCatBtn) {
          self.refCategory = refCatBtn.getAttribute("data-ref-cat") || "all";
          for (var i = 0; i < self._els.refsCatBtns.length; i++) {
            self._els.refsCatBtns[i].classList.toggle("is-active", self._els.refsCatBtns[i] === refCatBtn);
          }
          self._renderRefsList();
          return;
        }

        // 6. Clear references search
        if (e.target.closest('[data-role="refs-clear"]')) {
          self.refQuery = "";
          if (self._els.refsSearch) {
            self._els.refsSearch.value = "";
            self._els.refsSearch.focus();
          }
          self._renderRefsList();
          return;
        }

        // 7. Topbar & Bottombar [data-ctrl] buttons
        var ctrlBtn = e.target.closest("[data-ctrl]");
        if (ctrlBtn) {
          var ctrl = ctrlBtn.getAttribute("data-ctrl");
          if (ctrl === "next") self.next();
          else if (ctrl === "prev") self.prev();
          else if (ctrl === "theme") self.toggleTheme();
          else if (ctrl === "sound") self.toggleSound();
          else if (ctrl === "polarity") self.togglePolarity();
          else if (ctrl === "autoplay") self.toggleAutoPlay();
          else if (ctrl === "drawer") self.toggleDrawer();
          else if (ctrl === "fullscreen") self.toggleFullscreen();

          // Release pointer focus on HUD controls so pressing Space afterwards advances the story!
          if (e.detail > 0 && typeof ctrlBtn.blur === "function") {
            ctrlBtn.blur();
          }
          return;
        }
      });

      // PowerPoint-style Click on Empty Stage Space (#stage-viewport) -> next()
      if (this._els.viewport) {
        this._els.viewport.addEventListener("click", function (e) {
          if (self.drawerOpen || self.refsOpen) return;
          if (e.defaultPrevented) return;

          // Ignore if user selected text
          if (window.getSelection) {
            var sel = String(window.getSelection());
            if (sel && sel.trim().length > 0) return;
          }

          // Never advance when clicking interactive controls inside stage beats (76, 77, 78, 80)
          var interactive =
            e.target &&
            e.target.closest &&
            e.target.closest(
              'button, a, input, select, textarea, label, summary, [role="button"], [data-interactive], [data-no-advance], .interactive-btn, .choice-btn'
            );
          if (interactive) return;

          if (self.currentIndex < self.beats.length - 1) {
            self.next();
          }
        });
      }

      // Progress Bar Scrubbing (.beat-progress-track)
      if (this._els.progressTrack) {
        this._els.progressTrack.addEventListener("click", function (e) {
          if (e.target && e.target.closest && e.target.closest(".chapter-tick")) return;
          var rect = self._els.progressTrack.getBoundingClientRect();
          if (!rect.width) return;
          var isRtl = getComputedStyle(self._els.progressTrack).direction === "rtl";
          var ratio = isRtl
            ? (rect.right - e.clientX) / rect.width
            : (e.clientX - rect.left) / rect.width;
          ratio = Math.max(0, Math.min(1, ratio));
          var targetIdx = Math.round(ratio * (self.beats.length - 1));
          self.goTo(targetIdx);
        });
      }

      // Instant Search Input inside #refs-modal
      if (this._els.refsSearch) {
        this._els.refsSearch.addEventListener("input", function (e) {
          self.refQuery = e.target.value || "";
          self._renderRefsList();
        });
      }

      // PowerPoint-Grade Keyboard Controller
      document.addEventListener("keydown", function (e) {
        if (e.metaKey || e.ctrlKey || e.altKey) return;

        var key = e.key;
        var editable =
          e.target &&
          e.target.closest &&
          e.target.closest('input, textarea, select, [contenteditable="true"]');

        // 1. Escape closes active modals or blurs search input
        if (key === "Escape") {
          if (self.refsOpen) {
            e.preventDefault();
            self.closeRefs();
            return;
          }
          if (self.drawerOpen) {
            e.preventDefault();
            self.closeDrawer();
            return;
          }
          if (editable) {
            e.target.blur();
            return;
          }
          if (self.autoPlaying) {
            self.toggleAutoPlay(false);
          }
          return;
        }

        // Never hijack typing inside search/form fields
        if (editable) return;

        // While a modal is open, only allow M/G toggle for drawer; block slide navigation behind modal
        if (self.refsOpen) return;
        if (self.drawerOpen) {
          if (key === "m" || key === "M" || key === "g" || key === "G" || key === "ة" || key === "ل") {
            e.preventDefault();
            self.closeDrawer();
          }
          return;
        }

        // 2. Shift + ArrowRight / Shift + ArrowLeft -> Fast Chapter Jump!
        if (e.shiftKey && key === "ArrowRight") {
          e.preventDefault();
          if (!self.arrowReversed) self.nextChapter();
          else self.prevChapter();
          return;
        }

        if (e.shiftKey && key === "ArrowLeft") {
          e.preventDefault();
          if (!self.arrowReversed) self.prevChapter();
          else self.nextChapter();
          return;
        }

        // 3. ArrowRight / ArrowLeft (PowerPoint default + reversible polarity + Beat 1 toast)
        if (key === "ArrowRight") {
          e.preventDefault();
          if (!self.arrowReversed) {
            self.next();
          } else {
            self.prev();
          }
          return;
        }

        if (key === "ArrowLeft") {
          e.preventDefault();
          if (!self.arrowReversed) {
            self.prev();
          } else {
            self.next();
          }
          return;
        }

        // 4. Space / PageDown / ArrowDown -> next()
        if (key === " " || key === "Spacebar") {
          var focusedStageControl =
            e.target &&
            e.target.closest &&
            e.target.closest('#stage-viewport button, #stage-viewport a, #stage-viewport [role="button"]');
          if (focusedStageControl) return;
          e.preventDefault();
          self.next();
          return;
        }

        if (key === "PageDown" || key === "ArrowDown") {
          e.preventDefault();
          self.next();
          return;
        }

        // 5. Backspace / PageUp / ArrowUp -> prev()
        if (key === "Backspace" || key === "PageUp" || key === "ArrowUp") {
          e.preventDefault();
          self.prev();
          return;
        }

        // 6. Home / End
        if (key === "Home") {
          e.preventDefault();
          self.goTo(0, { direction: "prev" });
          return;
        }

        if (key === "End") {
          e.preventDefault();
          self.goTo(self.beats.length - 1, { direction: "next" });
          return;
        }

        // 7. Single-key Presenter Shortcuts: S (Sound), P (Autoplay 3.8s), F (Fullscreen), M/G (Jump Drawer)
        if (key === "s" || key === "S" || key === "س") {
          e.preventDefault();
          self.toggleSound();
          return;
        }

        if (key === "p" || key === "P" || key === "ح") {
          e.preventDefault();
          self.toggleAutoPlay();
          return;
        }

        if (key === "f" || key === "F" || key === "ب") {
          e.preventDefault();
          self.toggleFullscreen();
          return;
        }

        if (key === "m" || key === "M" || key === "g" || key === "G" || key === "ة" || key === "ل") {
          e.preventDefault();
          self.toggleDrawer();
        }
      });

      // Touch Swipe Support on #stage-viewport
      var touchStartX = 0;
      var touchStartY = 0;
      var touchActive = false;

      if (this._els.viewport) {
        this._els.viewport.addEventListener(
          "touchstart",
          function (e) {
            if (self.drawerOpen || self.refsOpen) {
              touchActive = false;
              return;
            }
            if (!e.touches || e.touches.length !== 1) {
              touchActive = false;
              return;
            }
            if (
              e.target &&
              e.target.closest &&
              e.target.closest('button, a, input, select, textarea, [role="button"]')
            ) {
              touchActive = false;
              return;
            }
            touchActive = true;
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
          },
          { passive: true }
        );

        this._els.viewport.addEventListener(
          "touchend",
          function (e) {
            if (!touchActive || !e.changedTouches || !e.changedTouches.length) return;
            touchActive = false;
            var dx = e.changedTouches[0].clientX - touchStartX;
            var dy = e.changedTouches[0].clientY - touchStartY;
            if (Math.abs(dx) > 48 && Math.abs(dx) > Math.abs(dy) * 1.3) {
              if (dx < 0) {
                if (!self.arrowReversed) self.next();
                else self.prev();
              } else {
                if (!self.arrowReversed) self.prev();
                else self.next();
              }
            }
          },
          { passive: true }
        );
      }
    }
  };

  /* ------------------------------------------------------------------------
     8. Expose Global Contracts & Convenience Hooks
     ------------------------------------------------------------------------ */
  window.StoryEngine = StoryEngine;
  window.PresentationEngine = window.StoryEngine;

  window.StoryActions = Object.assign(window.StoryActions || {}, {
    openRefs: function () {
      StoryEngine.openRefs();
    },
    restartStory: function () {
      StoryEngine.restart();
    },
    goToBeat: function (num) {
      StoryEngine.goToBeat(num);
    },
    goToScene: function (num) {
      StoryEngine.goToBeat(num);
    }
  });
})();


  (function bootStoryV2() {
    function start() {
      if (window.StoryEngine && typeof window.StoryEngine.init === 'function') {
        window.StoryEngine.init();
      } else if (window.PresentationEngine && typeof window.PresentationEngine.init === 'function') {
        window.PresentationEngine.init();
      }
    }
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', start);
    } else {
      start();
    }
  })();
  </script>
</body>
