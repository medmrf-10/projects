<!DOCTYPE html>
<html lang="fr" dir="ltr" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet" />
  <meta name="referrer" content="no-referrer" />
  <meta name="theme-color" content="#f5f7fa" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230f766e'/%3E%3Cpath d='M16 8v16M8 16h16' stroke='%23ffffff' stroke-width='3.2' stroke-linecap='round'/%3E%3C/svg%3E" />
  <title>Dossier Clinique — الملف السريري</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&family=Readex+Pro:wght@500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      color-scheme: light;
      --font-ar: "IBM Plex Sans Arabic", system-ui, -apple-system, sans-serif;
      --font-display-ar: "Readex Pro", "IBM Plex Sans Arabic", system-ui, sans-serif;
      --font-fr: "Inter", "IBM Plex Sans Arabic", system-ui, -apple-system, sans-serif;
      --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;

      --bg: #f5f7fa;
      --bg-grid: rgba(15, 23, 42, 0.032);
      --surface: #ffffff;
      --surface-2: #f8fafc;
      --surface-hover: #f1f5f9;
      --topbar: rgba(255, 255, 255, 0.88);
      --border: #e5e9f0;
      --border-strong: #cfd8e3;

      --text: #0f172a;
      --text-2: #334155;
      --text-3: #64748b;

      --accent: #0f766e;
      --accent-hover: #115e59;
      --accent-soft: #ecfdf5;
      --accent-border: #99f6e4;
      --accent-text: #0f766e;

      --ok-bg: #ecfdf5;
      --ok-border: #a7f3d0;
      --ok-text: #065f46;
      --ok-bar: #10b981;

      --danger-bg: #fef2f2;
      --danger-border: #fecaca;
      --danger-accent: #dc2626;
      --danger-text: #991b1b;

      --warn-bg: #fffbeb;
      --warn-border: #fde68a;
      --warn-accent: #d97706;
      --warn-text: #92400e;

      --info-bg: #f0f9ff;
      --info-border: #bae6fd;
      --info-accent: #0284c7;
      --info-text: #075985;

      --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.04);
      --shadow-md: 0 8px 28px -6px rgba(15, 23, 42, 0.06), 0 2px 6px rgba(15, 23, 42, 0.03);
      --radius-lg: 18px;
      --radius-md: 13px;
      --radius-sm: 9px;
      --ease: cubic-bezier(0.22, 1, 0.36, 1);
    }

    html[data-theme="dark"] {
      color-scheme: dark;
      --bg: #0b1019;
      --bg-grid: rgba(148, 163, 184, 0.04);
      --surface: #121926;
      --surface-2: #182234;
      --surface-hover: #1e2a3f;
      --topbar: rgba(11, 16, 25, 0.86);
      --border: #233046;
      --border-strong: #334663;

      --text: #f1f5f9;
      --text-2: #cbd5e1;
      --text-3: #94a3b8;

      --accent: #14b8a6;
      --accent-hover: #2dd4bf;
      --accent-soft: rgba(20, 184, 166, 0.12);
      --accent-border: rgba(45, 212, 191, 0.3);
      --accent-text: #5eead4;

      --ok-bg: rgba(16, 185, 129, 0.12);
      --ok-border: rgba(16, 185, 129, 0.32);
      --ok-text: #6ee7b7;
      --ok-bar: #34d399;

      --danger-bg: rgba(220, 38, 38, 0.11);
      --danger-border: rgba(248, 113, 113, 0.32);
      --danger-accent: #f87171;
      --danger-text: #fca5a5;

      --warn-bg: rgba(217, 119, 6, 0.11);
      --warn-border: rgba(251, 191, 36, 0.3);
      --warn-accent: #fbbf24;
      --warn-text: #fde68a;

      --info-bg: rgba(2, 132, 199, 0.12);
      --info-border: rgba(56, 189, 248, 0.3);
      --info-accent: #38bdf8;
      --info-text: #bae6fd;

      --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.22);
      --shadow-md: 0 14px 36px -8px rgba(0, 0, 0, 0.45);
    }

    *, *::before, *::after { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      font-family: var(--font-ar);
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.74;
      -webkit-font-smoothing: antialiased;
      font-variant-numeric: lining-nums tabular-nums;
      transition: background-color 0.25s ease, color 0.2s ease;
    }
    html[dir="ltr"] body { font-family: var(--font-fr); line-height: 1.64; }

    button, input { font-family: inherit; }
    .ltr-iso { direction: ltr; unicode-bidi: isolate; display: inline-block; }

    /* ===== ACCESS GATE ===== */
    .gate-wrap {
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 1.5rem;
      background-color: var(--bg);
      background-image:
        linear-gradient(to right, var(--bg-grid) 1px, transparent 1px),
        linear-gradient(to bottom, var(--bg-grid) 1px, transparent 1px);
      background-size: 36px 36px;
    }
    .gate-card {
      width: 100%;
      max-width: 380px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 2.25rem 1.85rem 2rem;
      box-shadow: var(--shadow-md);
      text-align: center;
      animation: fadeUp 0.4s var(--ease) both;
    }
    .gate-emblem {
      width: 50px;
      height: 50px;
      margin: 0 auto 1.15rem;
      border-radius: 14px;
      display: grid;
      place-items: center;
      background: var(--accent-soft);
      border: 1px solid var(--accent-border);
      color: var(--accent-text);
    }
    .gate-title {
      margin: 0 0 0.2rem;
      font-family: var(--font-fr);
      font-size: 1.16rem;
      font-weight: 700;
      color: var(--text);
    }
    .gate-sub {
      margin: 0 0 1.45rem;
      font-size: 0.92rem;
      color: var(--text-3);
      font-family: var(--font-display-ar);
    }
    .pin-field-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }
    .pin-input {
      width: 100%;
      padding: 0.88rem 2.75rem 0.88rem 2.75rem;
      border-radius: var(--radius-md);
      border: 1.5px solid var(--border-strong);
      background: var(--surface-2);
      color: var(--text);
      font-family: var(--font-mono);
      font-size: 1.25rem;
      font-weight: 600;
      letter-spacing: 0.24em;
      text-align: center;
      direction: ltr;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s, background-color 0.2s;
    }
    .pin-input:focus {
      border-color: var(--accent);
      background: var(--surface);
      box-shadow: 0 0 0 4px rgba(15, 118, 110, 0.12);
    }
    .pin-eye {
      position: absolute;
      right: 0.65rem;
      width: 34px;
      height: 34px;
      border: none;
      border-radius: 9px;
      background: transparent;
      color: var(--text-3);
      display: grid;
      place-items: center;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }
    .pin-eye:hover { background: var(--surface-hover); color: var(--text); }
    .gate-btn {
      width: 100%;
      margin-top: 0.95rem;
      padding: 0.88rem 1rem;
      border: none;
      border-radius: var(--radius-md);
      background: var(--accent);
      color: #ffffff;
      font-size: 0.94rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.18s, transform 0.15s, opacity 0.18s;
    }
    .gate-btn:hover { background: var(--accent-hover); }
    .gate-btn:active { transform: scale(0.99); }
    .gate-btn:disabled { opacity: 0.65; cursor: wait; }
    .gate-err {
      margin-top: 0.8rem;
      font-size: 0.84rem;
      font-weight: 500;
      color: var(--danger-accent);
      min-height: 1.3em;
    }
    .shake { animation: shake 0.36s ease; }

    /* ===== PRINT-ONLY HEADER ===== */
    .print-header { display: none; }

    /* ===== TOP NAVIGATION BAR ===== */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 50;
      background: var(--topbar);
      backdrop-filter: blur(18px) saturate(150%);
      -webkit-backdrop-filter: blur(18px) saturate(150%);
      border-bottom: 1px solid var(--border);
    }
    .topbar-inner {
      max-width: 1120px;
      margin: 0 auto;
      padding: 0.68rem 1.25rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.65rem;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 0.58rem;
      min-width: 0;
      flex: 1 1 auto;
    }
    .brand-mark {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      background: var(--accent-soft);
      border: 1px solid var(--accent-border);
      color: var(--accent-text);
      display: grid;
      place-items: center;
      flex-shrink: 0;
    }
    .brand-info {
      display: flex;
      align-items: baseline;
      gap: 0.6rem;
      min-width: 0;
      overflow: hidden;
    }
    .brand-title {
      font-family: var(--font-display-ar);
      font-size: 1rem;
      font-weight: 700;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    html[dir="ltr"] .brand-title { font-family: var(--font-fr); letter-spacing: -0.01em; }
    .brand-date {
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--accent-text);
      background: var(--accent-soft);
      border: 1px solid var(--accent-border);
      padding: 0.1rem 0.55rem;
      border-radius: 999px;
      white-space: nowrap;
    }
    .top-actions {
      display: flex;
      align-items: center;
      gap: 0.42rem;
      flex-shrink: 0;
    }
    .seg-lang {
      display: inline-flex;
      padding: 3px;
      border-radius: 999px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      flex-shrink: 0;
    }
    .seg-btn {
      border: none;
      background: transparent;
      color: var(--text-3);
      font-size: 0.78rem;
      font-weight: 600;
      padding: 0.32rem 0.74rem;
      border-radius: 999px;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.18s, color 0.18s, box-shadow 0.18s;
    }
    .seg-btn.is-active {
      background: var(--accent);
      color: #ffffff;
      box-shadow: var(--shadow-sm);
    }
    .icon-btn, .pill-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.36rem;
      height: 36px;
      padding: 0 0.78rem;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-2);
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      flex-shrink: 0;
      transition: border-color 0.18s, background 0.18s, color 0.18s;
    }
    .icon-btn { width: 36px; padding: 0; }
    .icon-btn:hover, .pill-btn:hover {
      border-color: var(--border-strong);
      background: var(--surface-hover);
      color: var(--text);
    }

    /* Mobile Section Jump Strip */
    .mobile-nav {
      display: none;
      position: sticky;
      top: 55px;
      z-index: 40;
      background: var(--topbar);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border);
      overflow-x: auto;
      scrollbar-width: none;
      padding: 0.52rem 0.9rem;
      gap: 0.42rem;
    }
    .mobile-nav::-webkit-scrollbar { display: none; }
    .mob-pill {
      white-space: nowrap;
      padding: 0.34rem 0.78rem;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-2);
      font-size: 0.78rem;
      font-weight: 600;
      text-decoration: none;
      transition: background 0.15s, color 0.15s, border-color 0.15s;
    }
    .mob-pill.is-active {
      background: var(--accent-soft);
      border-color: var(--accent-border);
      color: var(--accent-text);
    }

    /* ===== MAIN LAYOUT ===== */
    .shell {
      max-width: 1120px;
      margin: 0 auto;
      padding: 1.75rem 1.25rem 4rem;
      display: grid;
      grid-template-columns: 224px minmax(0, 1fr);
      gap: 2rem;
      align-items: start;
    }

    /* Desktop Side Rail */
    .side-rail {
      position: sticky;
      top: 84px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 1rem 0.75rem;
      box-shadow: var(--shadow-sm);
    }
    .rail-head {
      padding: 0 0.65rem 0.6rem;
      font-size: 0.73rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--text-3);
      border-bottom: 1px solid var(--border);
      margin-bottom: 0.5rem;
    }
    .rail-list { list-style: none; padding: 0; margin: 0; display: grid; gap: 0.2rem; }
    .rail-link {
      display: flex;
      align-items: center;
      gap: 0.55rem;
      padding: 0.5rem 0.65rem;
      border-radius: 10px;
      color: var(--text-2);
      text-decoration: none;
      font-size: 0.84rem;
      font-weight: 500;
      transition: background 0.15s, color 0.15s;
    }
    .rail-link:hover { background: var(--surface-hover); color: var(--text); }
    .rail-link.is-active {
      background: var(--accent-soft);
      color: var(--accent-text);
      font-weight: 700;
    }
    .rail-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--border-strong);
      flex-shrink: 0;
      transition: background 0.15s, transform 0.15s;
    }
    .rail-link.is-active .rail-dot { background: var(--accent); transform: scale(1.25); }

    /* Content Column */
    .content-col { display: grid; gap: 1.5rem; min-width: 0; }

    .section-block {
      scroll-margin-top: 88px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 1.6rem 1.7rem;
      box-shadow: var(--shadow-md);
      animation: fadeUp 0.45s var(--ease) both;
      min-width: 0;
    }
    .sec-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      padding-bottom: 0.95rem;
      margin-bottom: 1.25rem;
      border-bottom: 1px solid var(--border);
      flex-wrap: wrap;
    }
    .sec-title {
      margin: 0;
      font-family: var(--font-display-ar);
      font-size: 1.14rem;
      font-weight: 700;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }
    html[dir="ltr"] .sec-title { font-family: var(--font-fr); letter-spacing: -0.015em; }
    .sec-accent-bar {
      width: 4px;
      height: 20px;
      border-radius: 4px;
      background: var(--accent);
      flex-shrink: 0;
    }

    /* Framing Banner */
    .framing-banner {
      background: var(--info-bg);
      border: 1px solid var(--info-border);
      border-inline-start: 4px solid var(--info-accent);
      border-radius: var(--radius-sm);
      padding: 0.76rem 1rem;
      margin-bottom: 1.15rem;
      font-size: 0.86rem;
      font-weight: 500;
      color: var(--info-text);
      line-height: 1.62;
    }

    /* ===== KPI OVERVIEW GRID ===== */
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0.85rem;
    }
    .kpi-card {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 0.95rem 1.1rem;
      display: flex;
      flex-direction: column;
      gap: 0.22rem;
    }
    .kpi-label {
      font-size: 0.76rem;
      font-weight: 600;
      color: var(--text-3);
    }
    .kpi-val {
      font-size: 1.04rem;
      font-weight: 700;
      color: var(--text);
      font-family: var(--font-display-ar);
    }
    html[dir="ltr"] .kpi-val { font-family: var(--font-fr); }
    .kpi-sub {
      font-size: 0.8rem;
      color: var(--text-2);
    }
    .family-strip {
      margin-top: 0.9rem;
      padding: 0.8rem 1.05rem;
      border-radius: var(--radius-md);
      background: var(--surface-2);
      border: 1px dashed var(--border-strong);
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 0.45rem;
      font-size: 0.88rem;
    }
    .family-k { font-weight: 700; color: var(--text); }
    .family-v { color: var(--text-2); }

    /* ===== CLINICAL ALERTS & DRUG SAFETY GATES ===== */
    .alerts-stack { display: grid; gap: 0.95rem; }
    .alert-card {
      border-radius: var(--radius-md);
      padding: 1.05rem 1.2rem;
      border: 1px solid;
      border-inline-start-width: 4px;
    }
    .alert-danger { background: var(--danger-bg); border-color: var(--danger-border); border-inline-start-color: var(--danger-accent); }
    .alert-warn   { background: var(--warn-bg);   border-color: var(--warn-border);   border-inline-start-color: var(--warn-accent); }
    .alert-info   { background: var(--info-bg);   border-color: var(--info-border);   border-inline-start-color: var(--info-accent); }
    .alert-meta {
      display: flex;
      align-items: center;
      gap: 0.55rem;
      margin-bottom: 0.4rem;
      flex-wrap: wrap;
    }
    .alert-pill {
      display: inline-flex;
      align-items: center;
      padding: 0.16rem 0.62rem;
      border-radius: 999px;
      font-size: 0.72rem;
      font-weight: 700;
      color: #ffffff;
    }
    .alert-danger .alert-pill { background: var(--danger-accent); }
    .alert-warn .alert-pill   { background: var(--warn-accent); }
    .alert-info .alert-pill   { background: var(--info-accent); }
    .alert-title {
      margin: 0;
      font-size: 0.96rem;
      font-weight: 700;
      color: var(--text);
    }
    .alert-quote {
      margin: 0.65rem 0;
      padding: 0.72rem 0.95rem;
      border-radius: 9px;
      background: rgba(255, 255, 255, 0.78);
      border: 1px solid var(--danger-border);
      font-family: var(--font-fr);
      font-size: 0.84rem;
      font-weight: 600;
      line-height: 1.55;
      color: var(--danger-text);
      direction: ltr;
      text-align: left;
      overflow-wrap: anywhere;
    }
    html[data-theme="dark"] .alert-quote { background: rgba(15, 23, 42, 0.58); }
    .alert-body {
      margin: 0.35rem 0 0;
      font-size: 0.89rem;
      color: var(--text-2);
    }
    .safety-list {
      list-style: none;
      margin: 0.8rem 0 0;
      padding: 0;
      display: grid;
      gap: 0.58rem;
    }
    .safety-row {
      background: rgba(255, 255, 255, 0.82);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0.72rem 0.9rem;
      display: grid;
      gap: 0.28rem;
    }
    html[data-theme="dark"] .safety-row {
      background: rgba(15, 23, 42, 0.56);
      border-color: var(--border-strong);
    }
    .safety-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      flex-wrap: wrap;
    }
    .safety-name {
      font-size: 0.88rem;
      font-weight: 700;
      color: var(--text);
    }
    .safety-tag {
      font-size: 0.7rem;
      font-weight: 700;
      padding: 0.14rem 0.56rem;
      border-radius: 999px;
      border: 1px solid;
      white-space: nowrap;
    }
    .safety-tag-ban  { background: var(--danger-bg); color: var(--danger-text); border-color: var(--danger-border); }
    .safety-tag-gate { background: var(--warn-bg);   color: var(--warn-text);   border-color: var(--warn-border); }
    .safety-tag-ok   { background: var(--ok-bg);     color: var(--ok-text);     border-color: var(--ok-border); }
    .safety-desc {
      margin: 0;
      font-size: 0.84rem;
      color: var(--text-2);
      line-height: 1.58;
    }

    /* ===== LABS & BIOMARKERS ===== */
    .sub-heading {
      margin: 0 0 0.8rem;
      font-size: 0.88rem;
      font-weight: 700;
      color: var(--text-2);
    }
    .sub-block { margin-bottom: 1.45rem; }
    .sub-block:last-child { margin-bottom: 0; }

    .recovery-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 0.8rem;
    }
    .lab-card {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 0.95rem 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.48rem;
    }
    .lab-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 0.4rem;
    }
    .lab-name { font-size: 0.83rem; font-weight: 700; color: var(--text); }
    .lab-sub-latin {
      display: block;
      font-family: var(--font-fr);
      font-size: 0.73rem;
      font-weight: 500;
      color: var(--text-3);
      direction: ltr;
      unicode-bidi: isolate;
    }
    html[dir="rtl"] .lab-sub-ar {
      font-family: var(--font-ar);
      direction: rtl;
    }
    .status-chip {
      font-size: 0.69rem;
      font-weight: 700;
      padding: 0.14rem 0.52rem;
      border-radius: 999px;
      background: var(--ok-bg);
      color: var(--ok-text);
      border: 1px solid var(--ok-border);
      white-space: nowrap;
      flex-shrink: 0;
    }
    .status-chip-alert {
      background: var(--danger-bg);
      color: var(--danger-text);
      border-color: var(--danger-border);
    }
    .status-chip-warn {
      background: var(--warn-bg);
      color: var(--warn-text);
      border-color: var(--warn-border);
    }
    .status-chip-info {
      background: var(--info-bg);
      color: var(--info-text);
      border-color: var(--info-border);
    }
    .delta-row {
      display: flex;
      align-items: baseline;
      gap: 0.4rem;
      flex-wrap: wrap;
      direction: ltr;
      justify-content: flex-start;
    }
    html[dir="rtl"] .delta-row { justify-content: flex-end; }
    .val-old {
      font-family: var(--font-mono);
      font-size: 0.82rem;
      color: var(--text-3);
      text-decoration: line-through;
    }
    .val-arrow { color: var(--ok-bar); font-weight: 700; font-size: 0.85rem; }
    .val-new {
      font-family: var(--font-mono);
      font-size: 1.08rem;
      font-weight: 700;
      color: var(--text);
    }
    .val-unit { font-family: var(--font-mono); font-size: 0.73rem; color: var(--text-3); }
    .range-track {
      position: relative;
      height: 7px;
      border-radius: 999px;
      background: var(--border);
      overflow: hidden;
    }
    .range-fill {
      height: 100%;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--accent), var(--ok-bar));
    }
    .lab-ref { font-size: 0.74rem; color: var(--text-3); }
    .lab-footnote {
      margin: 0.75rem 0 0;
      font-size: 0.83rem;
      color: var(--text-2);
      background: var(--surface-2);
      border: 1px dashed var(--border-strong);
      border-radius: var(--radius-sm);
      padding: 0.68rem 0.9rem;
      line-height: 1.62;
    }

    .liver-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 0.75rem;
    }
    .mini-lab {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 0.85rem 0.9rem;
      display: flex;
      flex-direction: column;
      gap: 0.36rem;
      min-width: 0;
    }
    .mini-lab-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.28rem 0.45rem;
    }
    .mini-lab-name {
      font-family: var(--font-fr);
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--text);
      direction: ltr;
      unicode-bidi: isolate;
      display: inline-block;
      min-width: 0;
      overflow-wrap: anywhere;
    }
    .mini-val {
      font-family: var(--font-mono);
      font-size: 1.12rem;
      font-weight: 700;
      color: var(--text);
      direction: ltr;
    }
    html[dir="rtl"] .mini-val { text-align: right; }

    .baseline-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0.7rem;
    }
    .base-row {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 0.75rem 0.95rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.75rem;
      flex-wrap: wrap;
    }
    .base-row > div:first-child { min-width: 0; flex: 1 1 160px; }
    .base-k { font-size: 0.84rem; font-weight: 600; color: var(--text); }
    .base-s { font-size: 0.74rem; color: var(--text-3); margin-top: 0.14rem; line-height: 1.48; }
    .base-v {
      font-family: var(--font-mono);
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--accent-text);
      white-space: nowrap;
      direction: ltr;
      unicode-bidi: isolate;
    }

    .exams-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0.9rem;
    }
    .exam-card {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 1.05rem 1.15rem;
    }
    .exam-card:last-child:nth-child(odd) {
      grid-column: 1 / -1;
    }
    .exam-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 0.5rem;
      margin-bottom: 0.55rem;
      flex-wrap: wrap;
    }
    .exam-title { font-size: 0.93rem; font-weight: 700; color: var(--text); }
    .exam-date {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      color: var(--text-3);
      margin-top: 0.16rem;
      direction: ltr;
      unicode-bidi: isolate;
    }
    .clean-ol {
      margin: 0.5rem 0 0;
      padding-inline-start: 1.25rem;
      display: grid;
      gap: 0.42rem;
    }
    .clean-ol li { font-size: 0.87rem; color: var(--text-2); line-height: 1.62; }

    /* ===== OPEN 4-WAY DIFFERENTIAL ===== */
    .diff-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0.9rem;
    }
    .diff-card {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 1.05rem 1.15rem;
      display: flex;
      flex-direction: column;
      gap: 0.55rem;
    }
    .diff-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      flex-wrap: wrap;
    }
    .diff-axis {
      font-family: var(--font-mono);
      font-size: 0.74rem;
      font-weight: 700;
      color: var(--accent-text);
    }
    html[dir="rtl"] .diff-axis { font-family: var(--font-ar); }
    .diff-title {
      margin: 0;
      font-size: 0.94rem;
      font-weight: 700;
      color: var(--text);
      line-height: 1.42;
    }
    .diff-next {
      margin-top: auto;
      padding-top: 0.6rem;
      border-top: 1px dashed var(--border-strong);
      font-size: 0.82rem;
      color: var(--text-2);
      line-height: 1.56;
    }
    .diff-next-k {
      font-weight: 700;
      color: var(--accent-text);
    }

    /* ===== COGNITIVE PROFILE VISUALS ===== */
    .asrs-box {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 1rem 1.15rem;
      margin-bottom: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 0.65rem;
    }
    .asrs-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 0.75rem;
    }
    .asrs-dots { display: inline-flex; align-items: center; gap: 0.42rem; direction: ltr; }
    .asrs-dot {
      width: 14px;
      height: 14px;
      border-radius: 4px;
      background: var(--border-strong);
    }
    .asrs-dot.is-pos { background: var(--accent); }
    .asrs-score {
      font-family: var(--font-mono);
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--accent-text);
      margin-left: 0.35rem;
      direction: ltr;
      unicode-bidi: isolate;
    }
    .asrs-badges {
      display: flex;
      flex-wrap: wrap;
      gap: 0.42rem;
    }
    .asrs-badge {
      font-size: 0.74rem;
      font-weight: 600;
      padding: 0.2rem 0.6rem;
      border-radius: 999px;
      background: var(--surface);
      border: 1px solid var(--border-strong);
      color: var(--text-2);
    }
    .asrs-desc { margin: 0; font-size: 0.88rem; color: var(--text-2); }

    .cog-split {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 1rem;
    }
    .cog-col {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 1rem 1.1rem;
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
    }
    .cog-col-head {
      font-size: 0.82rem;
      font-weight: 700;
      padding-bottom: 0.5rem;
      border-bottom: 1px solid var(--border);
    }
    .cog-col-ok .cog-col-head { color: var(--ok-text); }
    .cog-col-imp .cog-col-head { color: var(--danger-text); }
    .bar-row { display: grid; gap: 0.35rem; }
    .bar-labels {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 0.6rem;
    }
    .bar-title-col { min-width: 0; }
    .bar-name { font-size: 0.84rem; color: var(--text); font-weight: 600; line-height: 1.35; }
    .bar-score {
      font-family: var(--font-mono);
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--ok-text);
      white-space: nowrap;
      direction: ltr;
      unicode-bidi: isolate;
      flex-shrink: 0;
    }
    .cog-col-note {
      margin-top: auto;
      padding-top: 0.68rem;
      border-top: 1px dashed var(--border-strong);
      font-size: 0.8rem;
      color: var(--text-2);
      line-height: 1.56;
    }
    .imp-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.45rem 0.65rem;
      padding: 0.68rem 0.82rem;
      border-radius: 9px;
      background: var(--danger-bg);
      border: 1px solid var(--danger-border);
    }
    .imp-item > div:first-child { min-width: 0; flex: 1 1 160px; }
    .imp-name { font-size: 0.84rem; font-weight: 600; color: var(--text); line-height: 1.35; }
    .imp-tag {
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--danger-text);
      white-space: nowrap;
      flex-shrink: 0;
    }

    .wm-box {
      margin-top: 1.15rem;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 1rem 1.15rem;
    }

    /* ===== SYMPTOM DOMAIN CARDS ===== */
    .domains-stack { display: grid; gap: 0.95rem; }
    .domain-card {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 1.1rem 1.25rem;
      transition: border-color 0.2s;
    }
    .domain-card:hover { border-color: var(--border-strong); }
    .domain-head {
      display: flex;
      align-items: center;
      gap: 0.7rem;
      margin-bottom: 0.65rem;
    }
    .domain-icon {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      background: var(--accent-soft);
      border: 1px solid var(--accent-border);
      color: var(--accent-text);
      display: grid;
      place-items: center;
      flex-shrink: 0;
    }
    .domain-num {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--accent-text);
    }
    .domain-title {
      margin: 0;
      font-size: 0.98rem;
      font-weight: 700;
      color: var(--text);
    }
    .domain-ol {
      margin: 0;
      padding-inline-start: 1.35rem;
      display: grid;
      gap: 0.5rem;
    }
    .domain-ol li { font-size: 0.9rem; color: var(--text-2); line-height: 1.66; }

    /* ===== FOLLOW-UP QUESTIONS ===== */
    .q-list { list-style: none; padding: 0; margin: 0; display: grid; gap: 0.85rem; }
    .q-item {
      display: flex;
      align-items: flex-start;
      gap: 0.85rem;
      padding: 1rem 1.15rem;
      border-radius: var(--radius-md);
      background: var(--surface-2);
      border: 1px solid var(--border);
    }
    .q-num {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: var(--accent-soft);
      border: 1px solid var(--accent-border);
      color: var(--accent-text);
      font-family: var(--font-mono);
      font-size: 0.8rem;
      font-weight: 700;
      display: grid;
      place-items: center;
      flex-shrink: 0;
      margin-top: 0.1rem;
    }
    .q-body-wrap { min-width: 0; display: grid; gap: 0.3rem; }
    .q-title { font-size: 0.93rem; font-weight: 700; color: var(--text); line-height: 1.45; }
    .q-text { font-size: 0.89rem; color: var(--text-2); line-height: 1.68; }

    /* Animations */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 960px) {
      .side-rail { display: none; }
      .mobile-nav { display: flex; }
      .shell { grid-template-columns: 1fr; padding: 1.15rem 0.95rem 3.5rem; gap: 1.15rem; }
      .section-block { scroll-margin-top: 118px; }
    }
    @media (max-width: 720px) {
      .kpi-grid, .recovery-grid, .baseline-grid, .exams-grid, .diff-grid, .cog-split { grid-template-columns: 1fr; }
      .exam-card:last-child:nth-child(odd) { grid-column: auto; }
      .liver-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0.6rem; }
      .mini-lab { padding: 0.74rem 0.76rem; }
      .section-block { padding: 1.15rem 1.05rem; }
      .brand-date { display: none; }
      .pill-label-hide { display: none; }
      .pill-btn { width: 34px; height: 34px; padding: 0; }
      .icon-btn { width: 34px; height: 34px; }
    }
    @media (max-width: 520px) {
      .topbar-inner { padding: 0.55rem 0.75rem; gap: 0.4rem; }
      .brand { gap: 0.42rem; }
      .brand-mark { width: 30px; height: 30px; border-radius: 8px; }
      .brand-title { font-size: 0.88rem; }
      .top-actions { gap: 0.28rem; }
      .seg-lang { padding: 2px; }
      .seg-btn { padding: 0.28rem 0.5rem; font-size: 0.72rem; }
      .icon-btn, .pill-btn { width: 32px; height: 32px; }
      .mobile-nav { top: 49px; padding: 0.48rem 0.75rem; }
    }

    /* ===== PRINT / A4 PDF ===== */
    @page { size: A4; margin: 12mm; }
    @media print {
      * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
      :root, html[data-theme="dark"] {
        color-scheme: light;
        --bg: #ffffff;
        --surface: #ffffff;
        --surface-2: #f8fafc;
        --border: #cbd5e1;
        --border-strong: #94a3b8;
        --text: #0f172a;
        --text-2: #1e293b;
        --text-3: #475569;
        --accent: #0f766e;
        --accent-soft: #ecfdf5;
        --accent-border: #99f6e4;
        --accent-text: #0f766e;
        --ok-bg: #ecfdf5;
        --ok-border: #a7f3d0;
        --ok-text: #065f46;
        --ok-bar: #10b981;
        --danger-bg: #fef2f2;
        --danger-border: #fecaca;
        --danger-accent: #dc2626;
        --danger-text: #991b1b;
        --warn-bg: #fffbeb;
        --warn-border: #fde68a;
        --warn-accent: #d97706;
        --warn-text: #92400e;
        --info-bg: #f0f9ff;
        --info-border: #bae6fd;
        --info-accent: #0284c7;
        --info-text: #075985;
      }
      .topbar, .side-rail, .mobile-nav, .gate-wrap { display: none !important; }
      .print-header {
        display: flex !important;
        justify-content: space-between;
        align-items: baseline;
        gap: 1rem;
        padding-bottom: 0.55rem;
        margin-bottom: 0.85rem;
        border-bottom: 2px solid #0f766e;
      }
      .print-header-title { font-size: 13pt; font-weight: 700; color: #0f172a; }
      .print-header-date { font-size: 9.5pt; font-weight: 600; color: #0f766e; }
      body { background: #ffffff !important; color: #0f172a !important; font-size: 9.8pt; line-height: 1.54; }
      .shell { display: block; max-width: 100%; padding: 0; }
      .content-col { gap: 0.85rem; }
      .section-block {
        box-shadow: none !important;
        border: 1px solid #cbd5e1 !important;
        padding: 0.85rem 1rem !important;
        margin-bottom: 0.75rem;
        animation: none !important;
      }
      .sec-head, .sub-heading {
        break-after: avoid;
        page-break-after: avoid;
      }
      .liver-grid { gap: 0.55rem; }
      .mini-lab { padding: 0.68rem 0.72rem; }
      .kpi-card, .family-strip, .alert-card, .safety-row, .lab-card, .mini-lab,
      .base-row, .exam-card, .diff-card, .asrs-box, .cog-col, .wm-box, .domain-card, .q-item,
      .lab-footnote, .framing-banner {
        break-inside: avoid;
        page-break-inside: avoid;
      }
      .safety-row, .alert-quote { background: #ffffff !important; }
    }
  </style>
</head>
<body>
  <section id="gateScreen" class="gate-wrap">
    <form id="gateForm" class="gate-card" autocomplete="off">
      <div class="gate-emblem" aria-hidden="true">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
          <polyline points="14 2 14 8 20 8"></polyline>
          <line x1="12" y1="11" x2="12" y2="17"></line>
          <line x1="9" y1="14" x2="15" y2="14"></line>
        </svg>
      </div>
      <h1 class="gate-title">Code d'accès</h1>
      <p class="gate-sub">رمز الدخول</p>
      <div class="pin-field-wrap">
        <input id="pinInput" class="pin-input" type="password" inputmode="numeric" placeholder="••••••••" required autofocus />
        <button id="toggleEye" class="pin-eye" type="button" aria-label="Show code">
          <svg id="eyeOpen" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
            <circle cx="12" cy="12" r="3"></circle>
          </svg>
          <svg id="eyeClosed" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" hidden>
            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"></path>
            <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"></path>
            <line x1="1" y1="1" x2="23" y2="23"></line>
          </svg>
        </button>
      </div>
      <button id="gateBtn" class="gate-btn" type="submit">Ouvrir • دخول</button>
      <div id="gateErr" class="gate-err" role="alert"></div>
    </form>
  </section>

  <div id="appShell" hidden>
    <header class="topbar">
      <div class="topbar-inner">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
              <polyline points="14 2 14 8 20 8"></polyline>
              <line x1="12" y1="11" x2="12" y2="17"></line>
              <line x1="9" y1="14" x2="15" y2="14"></line>
            </svg>
          </div>
          <div class="brand-info">
            <span id="navTitle" class="brand-title"></span>
            <span id="navDate" class="brand-date"></span>
          </div>
        </div>

        <div class="top-actions">
          <div class="seg-lang" role="group" aria-label="Language">
            <button id="btnFr" class="seg-btn is-active" type="button">FR</button>
            <button id="btnAr" class="seg-btn" type="button">عربي</button>
          </div>
          <button id="themeBtn" class="icon-btn" type="button" aria-label="Theme">
            <svg id="icoMoon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
            </svg>

      function setHidden(el, isHidden) {
        if (isHidden) el.setAttribute("hidden", "");
        else el.removeAttribute("hidden");
      }

      function b64ToBytes(b64) {
        const bin = atob(b64);
        const arr = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
        return arr;
      }

      function esc(s) {
        return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
      }

      function chipClass(type) {
        if (type === "alert") return "status-chip status-chip-alert";
        if (type === "warn") return "status-chip status-chip-warn";
        if (type === "info") return "status-chip status-chip-info";
        return "status-chip";
      }

      async function unlock(rawPin) {
        const clean = String(rawPin || "").replace(/\s+/g, "");
        const keyMat = await crypto.subtle.importKey("raw", new TextEncoder().encode(clean), { name: "PBKDF2" }, false, ["deriveKey"]);
        const aesKey = await crypto.subtle.deriveKey(
          { name: "PBKDF2", salt: b64ToBytes(BUNDLE.salt), iterations: BUNDLE.iter, hash: "SHA-256" },
          keyMat,
          { name: "AES-GCM", length: 256 },
          false,
          ["decrypt"]
        );
        const buf = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64ToBytes(BUNDLE.iv) }, aesKey, b64ToBytes(BUNDLE.ct));
        return JSON.parse(new TextDecoder().decode(buf));
      }

      function setActiveNav(id) {
        document.querySelectorAll(".rail-link, .mob-pill").forEach(function (el) {
          el.classList.toggle("is-active", el.getAttribute("href") === "#" + id);
        });
      }

      function setupScrollSpy() {
        if (observer) observer.disconnect();
        const sections = document.querySelectorAll(".section-block[id]");
        if (!sections.length) return;
        setActiveNav(sections[0].id);
        observer = new IntersectionObserver(function (entries) {
          entries.forEach(function (entry) {
            if (entry.isIntersecting) setActiveNav(entry.target.id);
          });
        }, { rootMargin: "-20% 0px -65% 0px", threshold: 0.01 });
        sections.forEach(function (s) { observer.observe(s); });
      }

        /* 1. Overview KPI Section */
        html += '<section id="sec-overview" class="section-block">';
        html += '<div class="sec-head"><h2 class="sec-title"><span class="sec-accent-bar"></span>' + esc(d.nav[0].label) + '</h2></div>';
        html += '<div class="kpi-grid">' + d.kpis.map(function (k) {
          const valHtml = k.valLtr ? '<span class="kpi-val"><span class="ltr-iso">' + esc(k.value) + '</span></span>' : '<span class="kpi-val">' + esc(k.value) + '</span>';
          return '<div class="kpi-card"><span class="kpi-label">' + esc(k.label) + '</span>' + valHtml + '<span class="kpi-sub">' + esc(k.sub) + '</span></div>';
        }).join("") + '</div>';
        html += '<div class="family-strip"><span class="family-k">' + esc(d.familyNote.label) + ':</span><span class="family-v">' + esc(d.familyNote.text) + '</span></div>';
        html += '</section>';

        /* 2. Important Medical Notes & Drug Safety Gates */
        html += '<section id="sec-alerts" class="section-block">';
        html += '<div class="sec-head"><h2 class="sec-title"><span class="sec-accent-bar"></span>' + esc(d.alertsTitle) + '</h2></div>';
        html += '<div class="alerts-stack">' + d.alerts.map(function (a) {
          const cls = a.level === "danger" ? "alert-danger" : a.level === "warn" ? "alert-warn" : "alert-info";
          let listHtml = "";
          if (a.items && a.items.length) {
            listHtml = '<ol class="safety-list">' + a.items.map(function (it) {
              const tCls = it.tagType === "ban" ? "safety-tag-ban" : it.tagType === "ok" ? "safety-tag-ok" : "safety-tag-gate";
              return '<li class="safety-row">'
                + '<div class="safety-head"><span class="safety-name">' + esc(it.name) + '</span><span class="safety-tag ' + tCls + '">' + esc(it.tag) + '</span></div>'
                + '<p class="safety-desc">' + esc(it.detail) + '</p>'
                + '</li>';
            }).join("") + '</ol>';
          }
          return '<article class="alert-card ' + cls + '">'
            + '<div class="alert-meta"><span class="alert-pill">' + esc(a.badge) + '</span></div>'
            + '<h3 class="alert-title">' + esc(a.title) + '</h3>'
            + (a.quote ? '<blockquote class="alert-quote" dir="ltr">' + esc(a.quote) + '</blockquote>' : '')
            + '<p class="alert-body">' + esc(a.body) + '</p>'
            + listHtml
            + '</article>';
        }).join("") + '</div>';
        html += '</section>';

        /* 3. Labs & Documented Exams */
        const L = d.labsSection;
        html += '<section id="sec-labs" class="section-block">';
        html += '<div class="sec-head"><h2 class="sec-title"><span class="sec-accent-bar"></span>' + esc(L.title) + '</h2></div>';

        html += '<div class="sub-block"><h3 class="sub-heading">' + esc(L.recoveryTitle) + '</h3><div class="recovery-grid">' + L.recoveryCards.map(function (c) {
          const isArSub = (lang === "ar" && c.sub && /[\u0600-\u06FF]/.test(c.sub));
          const subHtml = c.sub ? (isArSub ? '<span class="lab-sub-latin lab-sub-ar">' + esc(c.sub) + '</span>' : '<span class="lab-sub-latin" dir="ltr"><bdi dir="ltr">' + esc(c.sub) + '</bdi></span>') : '';
          return '<div class="lab-card">'
            + '<div class="lab-top"><div><span class="lab-name">' + esc(c.name) + '</span>' + subHtml + '</div><span class="status-chip">' + esc(c.status) + '</span></div>'
            + '<div class="delta-row" dir="ltr"><span class="val-old">' + esc(c.before) + '</span><span class="val-arrow">→</span><span class="val-new">' + esc(c.after) + '</span><span class="val-unit">' + esc(c.unit) + '</span></div>'
            + '<div class="range-track"><div class="range-fill" style="width:' + c.pctAfter + '%"></div></div>'
            + '<div class="lab-ref">' + esc(c.ref) + '</div>'
            + '</div>';
        }).join("") + '</div><p class="lab-footnote">' + esc(L.recoveryNote) + '</p></div>';

        html += '<div class="sub-block"><h3 class="sub-heading">' + esc(L.liverTitle) + '</h3><div class="liver-grid">' + L.liverCards.map(function (c) {
          return '<div class="mini-lab">'
            + '<div class="mini-lab-head"><span class="mini-lab-name" dir="ltr"><bdi dir="ltr">' + esc(c.name) + '</bdi></span><span class="status-chip">' + esc(c.status) + '</span></div>'
            + '<div class="mini-val" dir="ltr"><bdi dir="ltr">' + esc(c.val) + ' <span class="val-unit">' + esc(c.unit) + '</span></bdi></div>'
            + '<div class="range-track"><div class="range-fill" style="width:' + c.pct + '%"></div></div>'
            + '<div class="lab-ref">' + esc(c.ref) + '</div>'
            + '</div>';
        }).join("") + '</div>' + (L.liverNote ? '<p class="lab-footnote">' + esc(L.liverNote) + '</p>' : '') + '</div>';

        html += '<div class="sub-block"><h3 class="sub-heading">' + esc(L.baselineTitle) + '</h3><div class="baseline-grid">' + L.baselineItems.map(function (b) {
          return '<div class="base-row"><div><div class="base-k">' + esc(b.k) + '</div><div class="base-s">' + esc(b.sub) + '</div></div><div class="base-v" dir="ltr"><bdi dir="ltr">' + esc(b.v) + '</bdi></div></div>';
        }).join("") + '</div></div>';

        html += '<div class="sub-block"><h3 class="sub-heading">' + esc(L.examsTitle) + '</h3><div class="exams-grid">' + L.exams.map(function (e) {
          const isArSub = (lang === "ar" && e.sub && /[\u0600-\u06FF]/.test(e.sub));
          const subHtml = e.sub ? (isArSub ? '<span class="lab-sub-latin lab-sub-ar">' + esc(e.sub) + '</span>' : '<span class="lab-sub-latin" dir="ltr"><bdi dir="ltr">' + esc(e.sub) + '</bdi></span>') : '';
          return '<article class="exam-card">'
            + '<div class="exam-head"><div><div class="exam-title">' + esc(e.title) + '</div>' + subHtml + '<div class="exam-date" dir="ltr"><bdi dir="ltr">' + esc(e.date) + '</bdi></div></div><span class="' + chipClass(e.pillType) + '">' + esc(e.pill) + '</span></div>'
            + '<ol class="clean-ol">' + e.points.map(function (pt) { return '<li>' + esc(pt) + '</li>'; }).join("") + '</ol>'
            + '</article>';
        }).join("") + '</div></div>';
        html += '</section>';

        /* 4. Open 4-Way Differential */
        const DF = d.differentialSection;
        html += '<section id="sec-differential" class="section-block">';
        html += '<div class="sec-head"><h2 class="sec-title"><span class="sec-accent-bar"></span>' + esc(DF.title) + '</h2></div>';
        html += '<div class="framing-banner">' + esc(DF.framing) + '</div>';
        html += '<div class="diff-grid">' + DF.axes.map(function (ax) {
          return '<article class="diff-card">'
            + '<div class="diff-top"><span class="diff-axis">' + esc(ax.axis) + '</span><span class="' + chipClass(ax.pillType) + '">' + esc(ax.pill) + '</span></div>'
            + '<h3 class="diff-title">' + esc(ax.title) + '</h3>'
            + '<ol class="clean-ol">' + ax.points.map(function (pt) { return '<li>' + esc(pt) + '</li>'; }).join("") + '</ol>'
            + '<div class="diff-next"><span class="diff-next-k">' + esc(ax.nextLabel) + '</span> ' + esc(ax.nextText) + '</div>'
            + '</article>';
        }).join("") + '</div>';
        html += '</section>';

        /* 5. Exploratory Cognitive Measures */
        const C = d.cognitiveSection;
        html += '<section id="sec-cognitive" class="section-block">';
        html += '<div class="sec-head"><h2 class="sec-title"><span class="sec-accent-bar"></span>' + esc(C.title) + '</h2></div>';
        if (C.framing) html += '<div class="framing-banner">' + esc(C.framing) + '</div>';
        let dots = "";
        for (let i = 0; i < C.asrsTotal; i++) dots += '<span class="asrs-dot' + (i < C.asrsPositive ? ' is-pos' : '') + '"></span>';
        html += '<div class="asrs-box"><div class="asrs-top"><span class="lab-name">' + esc(C.asrsTitle) + '</span><div class="asrs-dots" dir="ltr">' + dots + '<span class="asrs-score" dir="ltr"><bdi dir="ltr">' + esc(C.asrsScore) + '</bdi></span></div></div>';
        if (C.asrsBadges && C.asrsBadges.length) {
          html += '<div class="asrs-badges">' + C.asrsBadges.map(function (bg) { return '<span class="asrs-badge">' + esc(bg) + '</span>'; }).join("") + '</div>';
        }
        html += '<p class="asrs-desc">' + esc(C.asrsDetail) + '</p></div>';

        html += '<h3 class="sub-heading">' + esc(C.dissociationTitle) + '</h3>';
        html += '<div class="cog-split">';
        html += '<div class="cog-col cog-col-ok"><div class="cog-col-head">' + esc(C.preservedLabel) + '</div>' + C.preserved.map(function (p) {
          const isArSub = (lang === "ar" && p.sub && /[\u0600-\u06FF]/.test(p.sub));
          const pSubHtml = isArSub ? '<span class="lab-sub-latin lab-sub-ar">' + esc(p.sub) + '</span>' : '<span class="lab-sub-latin" dir="ltr"><bdi dir="ltr">' + esc(p.sub) + '</bdi></span>';
          return '<div class="bar-row"><div class="bar-labels"><div class="bar-title-col"><div class="bar-name">' + esc(p.name) + '</div>' + pSubHtml + '</div><span class="bar-score" dir="ltr"><bdi dir="ltr">' + esc(p.score) + ' (' + p.pct + '%)</bdi></span></div><div class="range-track"><div class="range-fill" style="width:' + p.pct + '%"></div></div></div>';
        }).join("") + (C.preservedNote ? '<div class="cog-col-note">' + esc(C.preservedNote) + '</div>' : '') + '</div>';
        html += '<div class="cog-col cog-col-imp"><div class="cog-col-head">' + esc(C.impairedLabel) + '</div>' + C.impaired.map(function (im) {
          const isArSub = (lang === "ar" && im.sub && /[\u0600-\u06FF]/.test(im.sub));
          const imSubHtml = isArSub ? '<span class="lab-sub-latin lab-sub-ar">' + esc(im.sub) + '</span>' : '<span class="lab-sub-latin" dir="ltr"><bdi dir="ltr">' + esc(im.sub) + '</bdi></span>';
          const tagHtml = /^\d/.test(im.status) ? '<span class="imp-tag ltr-iso" dir="ltr"><bdi dir="ltr">' + esc(im.status) + '</bdi></span>' : '<span class="imp-tag">' + esc(im.status) + '</span>';
          return '<div class="imp-item"><div><div class="imp-name">' + esc(im.name) + '</div>' + imSubHtml + '</div>' + tagHtml + '</div>';
        }).join("") + '</div>';
        html += '</div>';

        if (C.wmPoints && C.wmPoints.length) {
          html += '<div class="wm-box"><h3 class="sub-heading">' + esc(C.wmTitle) + '</h3><ol class="clean-ol">' + C.wmPoints.map(function (wp) { return '<li>' + esc(wp) + '</li>'; }).join("") + '</ol></div>';
        }
        html += '</section>';

        /* 6. Daily Symptoms */
        const S = d.symptomsSection;
        html += '<section id="sec-symptoms" class="section-block">';
        html += '<div class="sec-head"><h2 class="sec-title"><span class="sec-accent-bar"></span>' + esc(S.title) + '</h2></div>';
        html += '<div class="domains-stack">' + S.domains.map(function (dom) {
          return '<article class="domain-card">'
            + '<div class="domain-head"><div class="domain-icon" aria-hidden="true">' + (ICONS[dom.icon] || ICONS.focus) + '</div><div><div class="domain-num">' + esc(dom.num) + '</div><h3 class="domain-title">' + esc(dom.title) + '</h3></div></div>'
            + '<ol class="domain-ol">' + dom.items.map(function (it) { return '<li>' + esc(it) + '</li>'; }).join("") + '</ol>'
            + '</article>';
        }).join("") + '</div>';
        html += '</section>';

        /* 7. Consultation Pillars & Follow-up Questions */
        const Q = d.questionsSection;
        html += '<section id="sec-questions" class="section-block">';
        html += '<div class="sec-head"><h2 class="sec-title"><span class="sec-accent-bar"></span>' + esc(Q.title) + '</h2></div>';
        html += '<ol class="q-list">' + Q.items.map(function (item, idx) {
          const inner = (typeof item === "string")
            ? '<span class="q-text">' + esc(item) + '</span>'
            : '<div class="q-body-wrap"><div class="q-title">' + esc(item.title) + '</div><div class="q-text">' + esc(item.body) + '</div></div>';
          return '<li class="q-item"><span class="q-num">0' + (idx + 1) + '</span>' + inner + '</li>';
        }).join("") + '</ol>';
        html += '</section>';

        contentCol.innerHTML = html;
        setupScrollSpy();
      }

      toggleEye.addEventListener("click", function () {
        const show = pinInput.type === "password";
        pinInput.type = show ? "text" : "password";
        setHidden(eyeOpen, show);
        setHidden(eyeClosed, !show);
        toggleEye.setAttribute("aria-label", show ? "Hide code" : "Show code");
        pinInput.focus();
      });

      gateForm.addEventListener("submit", async function (e) {
        e.preventDefault();
        gateErr.textContent = "";
        gateBtn.disabled = true;
        try {
          data = await unlock(pinInput.value);
          pinInput.value = "";
          gateForm.reset();
          gateScreen.hidden = true;
          appShell.hidden = false;
          render();
          window.scrollTo({ top: 0, behavior: "instant" });
        } catch (err) {
          gateErr.textContent = "Code incorrect • الرمز غير صحيح";
          gateForm.classList.remove("shake");
          void gateForm.offsetWidth;
          gateForm.classList.add("shake");
          pinInput.select();
        } finally {
          gateBtn.disabled = false;
        }
      });

      btnFr.addEventListener("click", function () { if (lang !== "fr") { lang = "fr"; render(); } });
      btnAr.addEventListener("click", function () { if (lang !== "ar") { lang = "ar"; render(); } });

      themeBtn.addEventListener("click", function () {
        const next = root.getAttribute("data-theme") === "dark" ? "light" : "dark";
        root.setAttribute("data-theme", next);
        setHidden(icoMoon, next === "dark");
        setHidden(icoSun, next === "light");
        const meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute("content", next === "dark" ? "#0b1019" : "#f5f7fa");
      });

      printBtn.addEventListener("click", function () { window.print(); });

      closeBtn.addEventListener("click", function () {
        data = null;
        lang = "fr";
        if (observer) observer.disconnect();
        contentCol.innerHTML = "";
        railList.innerHTML = "";
        mobileNav.innerHTML = "";
        railHead.textContent = "";
        navTitle.textContent = "";
        navDate.textContent = "";
        appShell.hidden = true;
        gateScreen.hidden = false;
        root.lang = "fr";
        root.dir = "ltr";
        document.title = "Dossier Clinique — الملف السريري";
        pinInput.type = "password";
        setHidden(eyeOpen, false);
        setHidden(eyeClosed, true);
        toggleEye.setAttribute("aria-label", "Show code");
        pinInput.value = "";
        gateForm.reset();
        if (window.location.hash) {
          try { history.replaceState(null, "", window.location.pathname + window.location.search); } catch (e) {}
        }
        pinInput.focus();
      });
    })();
  </script>
</body>
</html>
