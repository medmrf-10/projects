<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet" />
  <meta name="referrer" content="no-referrer" />
  <meta name="theme-color" content="#0f172a" />
  <title>ملف طبي محمي — Dossier Clinique Protégé</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f4f6f9;
      --surface: #ffffff;
      --surface-soft: #f8fafc;
      --border: #e2e8f0;
      --border-strong: #cbd5e1;
      --text: #0f172a;
      --text-sec: #334155;
      --text-muted: #64748b;
      --accent: #0369a1;
      --accent-soft: #e0f2fe;
      --danger-bg: #fef2f2;
      --danger-border: #fecaca;
      --danger-text: #991b1b;
      --danger-badge: #dc2626;
      --warn-bg: #fffbeb;
      --warn-border: #fde68a;
      --warn-text: #92400e;
      --warn-badge: #d97706;
      --info-bg: #eff6ff;
      --info-border: #bfdbfe;
      --info-text: #1e40af;
      --info-badge: #2563eb;
      --shadow: 0 10px 30px rgba(15, 23, 42, 0.06);
      --radius: 14px;
    }
    *, *::before, *::after { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "IBM Plex Sans Arabic", "Inter", system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.72;
      -webkit-font-smoothing: antialiased;
      font-variant-numeric: lining-nums tabular-nums;
    }
    html[dir="ltr"] body {
      font-family: "Inter", "IBM Plex Sans Arabic", system-ui, -apple-system, sans-serif;
    }

    /* Lock Screen */
    .lock-wrap {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 1.5rem;
      background:
        radial-gradient(ellipse 70% 50% at 50% -10%, rgba(3, 105, 161, 0.14), transparent 70%),
        linear-gradient(180deg, #0b1120 0%, #111827 100%);
      color: #f8fafc;
    }
    .lock-card {
      width: 100%;
      max-width: 420px;
      background: rgba(15, 23, 42, 0.88);
      border: 1px solid rgba(148, 163, 184, 0.22);
      border-radius: 20px;
      padding: 2rem 1.75rem;
      box-shadow: 0 24px 64px rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(14px);
      text-align: center;
    }
    .lock-icon {
      width: 56px;
      height: 56px;
      margin: 0 auto 1rem;
      border-radius: 16px;
      display: grid;
      place-items: center;
      background: rgba(56, 189, 248, 0.14);
      border: 1px solid rgba(56, 189, 248, 0.32);
      color: #38bdf8;
    }
    .lock-title {
      margin: 0 0 0.3rem;
      font-size: 1.25rem;
      font-weight: 700;
    }
    .lock-sub {
      margin: 0 0 1.4rem;
      font-size: 0.88rem;
      color: #94a3b8;
      line-height: 1.6;
    }
    .pin-input {
      width: 100%;
      padding: 0.9rem 1rem;
      border-radius: 12px;
      border: 1.5px solid rgba(148, 163, 184, 0.3);
      background: rgba(2, 6, 23, 0.65);
      color: #f8fafc;
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: 0.22em;
      text-align: center;
      direction: ltr;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .pin-input:focus {
      border-color: #38bdf8;
      box-shadow: 0 0 0 4px rgba(56, 189, 248, 0.16);
    }
    .unlock-btn {
      width: 100%;
      margin-top: 0.9rem;
      padding: 0.88rem 1rem;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, #0284c7, #0369a1);
      color: #ffffff;
      font-size: 0.96rem;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.15s;
    }
    .unlock-btn:hover { opacity: 0.95; }
    .unlock-btn:active { transform: scale(0.99); }
    .unlock-btn:disabled { opacity: 0.6; cursor: wait; }
    .lock-error {
      margin-top: 0.8rem;
      font-size: 0.86rem;
      color: #fca5a5;
      min-height: 1.3em;
    }
    .crypto-badge {
      margin-top: 1.25rem;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.3rem 0.75rem;
      border-radius: 999px;
      background: rgba(16, 185, 129, 0.12);
      border: 1px solid rgba(16, 185, 129, 0.28);
      color: #6ee7b7;
      font-size: 0.74rem;
      font-weight: 600;
    }

    /* Main Clinical Dossier */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 40;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border);
    }
    .topbar-inner {
      max-width: 980px;
      margin: 0 auto;
      padding: 0.75rem 1.1rem;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 0.65rem;
    }
    .topbar-brand {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      font-weight: 700;
      font-size: 0.95rem;
      color: var(--text);
    }
    .topbar-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--accent);
      flex-shrink: 0;
    }
    .topbar-actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.5rem;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.48rem 0.9rem;
      border-radius: 999px;
      border: 1px solid var(--border-strong);
      background: var(--surface);
      color: var(--text);
      font-size: 0.84rem;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      transition: background 0.15s, border-color 0.15s;
    }
    .btn:hover { background: var(--surface-soft); border-color: var(--accent); }
    .btn-primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }
    .btn-primary:hover { background: #075985; border-color: #075985; }
    .btn-danger {
      color: var(--danger-text);
      border-color: var(--danger-border);
      background: var(--danger-bg);
    }

    .container {
      max-width: 980px;
      margin: 0 auto;
      padding: 1.5rem 1.1rem 3.5rem;
    }
    .hero {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.5rem;
      box-shadow: var(--shadow);
      margin-bottom: 1.25rem;
    }
    .hero h1 {
      margin: 0 0 0.35rem;
      font-size: clamp(1.25rem, 2.8vw, 1.65rem);
      line-height: 1.35;
      color: var(--text);
    }
    .hero p {
      margin: 0;
      color: var(--text-muted);
      font-size: 0.92rem;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.35rem 1.45rem;
      box-shadow: var(--shadow);
      margin-bottom: 1.15rem;
    }
    .card-header {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      margin-bottom: 1rem;
      padding-bottom: 0.7rem;
      border-bottom: 1px solid var(--border);
    }
    .tag {
      padding: 0.22rem 0.65rem;
      border-radius: 999px;
      background: var(--accent-soft);
      color: var(--accent);
      font-size: 0.75rem;
      font-weight: 700;
      white-space: nowrap;
    }
    .card h2 {
      margin: 0;
      font-size: 1.08rem;
      font-weight: 700;
    }

    .meta-list {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 0.75rem;
      list-style: none;
      padding: 0;
      margin: 0;
    }
    .meta-item {
      background: var(--surface-soft);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0.75rem 0.95rem;
    }
    .meta-k {
      display: block;
      font-size: 0.76rem;
      font-weight: 700;
      color: var(--text-muted);
      margin-bottom: 0.15rem;
    }
    .meta-v {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text);
    }

    /* Safety alerts */
    .safety-grid {
      display: grid;
      gap: 0.8rem;
    }
    .alert-box {
      border-radius: 12px;
      padding: 0.95rem 1.1rem;
      border: 1px solid;
    }
    .alert-danger { background: var(--danger-bg); border-color: var(--danger-border); color: var(--danger-text); }
    .alert-warn   { background: var(--warn-bg);   border-color: var(--warn-border);   color: var(--warn-text); }
    .alert-info   { background: var(--info-bg);   border-color: var(--info-border);   color: var(--info-text); }
    .alert-top {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.55rem;
      margin-bottom: 0.35rem;
    }
    .alert-badge {
      padding: 0.16rem 0.55rem;
      border-radius: 6px;
      color: #fff;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.02em;
    }
    .alert-danger .alert-badge { background: var(--danger-badge); }
    .alert-warn   .alert-badge { background: var(--warn-badge); }
    .alert-info   .alert-badge { background: var(--info-badge); }
    .alert-head { font-weight: 700; font-size: 0.93rem; }
    .alert-body { margin: 0; font-size: 0.89rem; line-height: 1.65; color: var(--text); }

    .group { margin-bottom: 1.15rem; }
    .group:last-child { margin-bottom: 0; }
    .group h3 {
      margin: 0 0 0.55rem;
      font-size: 0.96rem;
      font-weight: 700;
      color: var(--accent);
    }
    .num-list {
      margin: 0;
      padding-inline-start: 1.35rem;
    }
    .num-list li {
      margin-bottom: 0.48rem;
      font-size: 0.92rem;
      color: var(--text-sec);
    }
    .num-list li:last-child { margin-bottom: 0; }

    @media print {
      .topbar, .lock-wrap { display: none !important; }
      body { background: #fff; }
      .container { max-width: 100%; padding: 0; }
      .card, .hero { box-shadow: none; break-inside: avoid; border-color: #cbd5e1; }
    }
  </style>
</head>
<body>
  <section id="lockScreen" class="lock-wrap">
    <form id="unlockForm" class="lock-card" autocomplete="off">
      <div class="lock-icon" aria-hidden="true">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="4" y="11" width="16" height="10" rx="2.5"></rect>
          <path d="M8 11V7a4 4 0 0 1 8 0v4"></path>
        </svg>
      </div>
      <h1 class="lock-title">ملف سريري محمي برقم سري</h1>
      <p class="lock-sub">Dossier Clinique Chiffré (AES-256-GCM)<br/>أدخل الرقم السري لفتح الملف الطبي • Entrez le code secret</p>
      <input id="pinInput" class="pin-input" type="password" inputmode="numeric" placeholder="••••••••" required autofocus />
      <button id="unlockBtn" class="unlock-btn" type="submit">فتح الملف • Déverrouiller</button>
      <div id="lockError" class="lock-error" role="alert"></div>
      <div class="crypto-badge">AES-256-GCM • PBKDF2-SHA256 • Zero Plaintext</div>
    </form>
  </section>

  <div id="appShell" hidden>
    <header class="topbar">
      <div class="topbar-inner">
        <div class="topbar-brand">
          <span class="topbar-dot" aria-hidden="true"></span>
          <span id="navBrand"></span>
        </div>
        <div class="topbar-actions">
          <button id="langToggleBtn" class="btn btn-primary" type="button"></button>
          <button id="printBtn" class="btn" type="button"></button>
          <button id="lockBtn" class="btn btn-danger" type="button"></button>
        </div>
      </div>
    </header>
    <main id="dossierRoot" class="container"></main>
  </div>

      let decryptedData = null;
      let currentLang = "ar";

      const lockScreen = document.getElementById("lockScreen");
      const appShell = document.getElementById("appShell");
      const unlockForm = document.getElementById("unlockForm");
      const pinInput = document.getElementById("pinInput");
      const unlockBtn = document.getElementById("unlockBtn");
      const lockError = document.getElementById("lockError");
      const dossierRoot = document.getElementById("dossierRoot");
      const navBrand = document.getElementById("navBrand");
      const langToggleBtn = document.getElementById("langToggleBtn");
      const printBtn = document.getElementById("printBtn");
      const lockBtn = document.getElementById("lockBtn");

      function b64ToBytes(b64) {
        const bin = atob(b64);
        const bytes = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
        return bytes;
      }

      function esc(str) {
        return String(str)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      async function decryptWithPin(rawPin) {
        const cleanPin = String(rawPin || "").replace(/\s+/g, "");
        const enc = new TextEncoder();
        const keyMat = await crypto.subtle.importKey(
          "raw",
          enc.encode(cleanPin),
          { name: "PBKDF2" },
          false,
          ["deriveKey"]
        );
        const aesKey = await crypto.subtle.deriveKey(
          {
            name: "PBKDF2",
            salt: b64ToBytes(BUNDLE.salt),
            iterations: BUNDLE.iter,
            hash: "SHA-256"
          },
          keyMat,
          { name: "AES-GCM", length: 256 },
          false,
          ["decrypt"]
        );
        const plainBuf = await crypto.subtle.decrypt(
          { name: "AES-GCM", iv: b64ToBytes(BUNDLE.iv) },
          aesKey,
          b64ToBytes(BUNDLE.ct)
        );
        return JSON.parse(new TextDecoder().decode(plainBuf));
      }

      function render() {
        if (!decryptedData) return;
        const d = decryptedData[currentLang];
        document.documentElement.lang = currentLang;
        document.documentElement.dir = d.dir;
        document.title = d.title;
        navBrand.textContent = d.title;
        langToggleBtn.textContent = d.langBtn;
        printBtn.textContent = d.printBtn;
        lockBtn.textContent = d.lockBtn;

        let html = "";
        html += `<section class="hero"><h1>${esc(d.title)}</h1><p>${esc(d.subtitle)}</p></section>`;

        html += `<section class="card"><div class="card-header"><h2>${esc(d.patientCardTitle)}</h2></div><ul class="meta-list">`;
        for (const item of d.patientItems) {
          html += `<li class="meta-item"><span class="meta-k">${esc(item.k)}</span><span class="meta-v">${esc(item.v)}</span></li>`;
        }
        html += `</ul></section>`;

        html += `<section class="card"><div class="card-header"><h2>${esc(d.safetyTitle)}</h2></div><div class="safety-grid">`;
        for (const s of d.safetyItems) {
          const cls = s.level === "danger" ? "alert-danger" : s.level === "warn" ? "alert-warn" : "alert-info";
          html += `<article class="alert-box ${cls}"><div class="alert-top"><span class="alert-badge">${esc(s.badge)}</span><span class="alert-head">${esc(s.head)}</span></div><p class="alert-body">${esc(s.body)}</p></article>`;
        }
        html += `</div></section>`;

        for (const sec of d.sections) {
          html += `<section class="card"><div class="card-header"><span class="tag">${esc(sec.tag)}</span><h2>${esc(sec.title)}</h2></div>`;
          for (const g of sec.groups) {
            html += `<div class="group"><h3>${esc(g.head)}</h3><ol class="num-list">`;
            for (const line of g.items) {
              html += `<li>${esc(line)}</li>`;
            }
            html += `</ol></div>`;
          }
          html += `</section>`;
        }
        dossierRoot.innerHTML = html;
      }

      unlockForm.addEventListener("submit", async function (e) {
        e.preventDefault();
        lockError.textContent = "";
        unlockBtn.disabled = true;
        try {
          decryptedData = await decryptWithPin(pinInput.value);
          pinInput.value = "";
          lockScreen.hidden = true;
          appShell.hidden = false;
          render();
          window.scrollTo({ top: 0, behavior: "instant" });
        } catch (err) {
          lockError.textContent = "الرقم السري غير صحيح • Code secret incorrect";
          pinInput.select();
        } finally {
          unlockBtn.disabled = false;
        }
      });

      langToggleBtn.addEventListener("click", function () {
        currentLang = currentLang === "ar" ? "fr" : "ar";
        render();
      });

      printBtn.addEventListener("click", function () {
        window.print();
      });

      lockBtn.addEventListener("click", function () {
        decryptedData = null;
        dossierRoot.innerHTML = "";
        appShell.hidden = true;
        lockScreen.hidden = false;
        document.documentElement.lang = "ar";
        document.documentElement.dir = "rtl";
        document.title = "ملف طبي محمي — Dossier Clinique Protégé";
        pinInput.value = "";
        pinInput.focus();
      });
    })();
  </script>
