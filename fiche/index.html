  <meta name="mobile-web-app-capable" content="yes" />

  <title>Fiche clinique · مذكرة سريرية · Clinical Note</title>
  <script>
    (function(){
      try {
        var r = document.documentElement;
        var themes = { light: '#F7F8F7', dark: '#0A0E14', paper: '#F5EFE4', contrast: '#FFFFFF' };
        var t = localStorage.getItem('fiche_theme');
        if (!themes[t]) t = 'light';
        r.dataset.theme = t;
        var m = document.querySelector('meta[name="theme-color"]');
        if (m) m.setAttribute('content', themes[t]);
        var l = localStorage.getItem('fiche_lang');
        if (l === 'fr' || l === 'ar' || l === 'en') {
          r.lang = l;
          r.dir = l === 'ar' ? 'rtl' : 'ltr';
        }
        var f = localStorage.getItem('fiche_font');
        if (f === 'sm' || f === 'md' || f === 'lg') r.dataset.font = f;
        var s = localStorage.getItem('fiche_spacing');
        if (s === 'compact' || s === 'normal' || s === 'relaxed') r.dataset.spacing = s;
        var c = localStorage.getItem('fiche_cards');
        if (c === 'compact' || c === 'spacious') r.dataset.cards = c;
      } catch (e) {}
    })();
  </script>

    /* Dynamic Font Size */

    *, *::before, *::after { box-sizing: border-box; }
    html {
      -webkit-text-size-adjust: 100%;
      scroll-behavior: smooth;
    }
    body {
      margin: 0;
      min-height: 100dvh;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
      font-size: var(--fs-body);
      line-height: var(--lh-body);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      transition: background-color 180ms var(--ease), color 180ms var(--ease);
    }
    html[dir="rtl"] body {
      font-family: var(--font-ar);
      line-height: var(--lh-body-rtl);
    }
    html[dir="rtl"] * {
      letter-spacing: 0 !important;
      text-transform: none !important;
    }
    bdi.ltr-tok {
      unicode-bidi: isolate;
      direction: ltr;
      font-variant-numeric: tabular-nums;
      display: inline;
    }
    button, input, textarea, select {
      font: inherit;
      color: inherit;
    }
    button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible {
      outline: 2px solid var(--teal);
      outline-offset: 2px;
    }
    [hidden] { display: none !important; }

    /* High-contrast crisp structural lines */
    html[data-theme="contrast"] .card,
    html[data-theme="contrast"] .gate-card,
    html[data-theme="contrast"] .prefs-sheet,
    html[data-theme="contrast"] .disclosure-bar,
    html[data-theme="contrast"] .trans-card,
    html[data-theme="contrast"] .watch-card,
    html[data-theme="contrast"] .ws-card {
      border-width: 1.5px;
      box-shadow: none;
    }
    html[data-theme="contrast"] .plan-chip.is-on,
    html[data-theme="contrast"] .hyp-pill[data-prio="primary"],
    html[data-theme="contrast"] .seg-btn.is-active,
    html[data-theme="contrast"] .swatch-btn.is-active {
      outline: 2px solid var(--teal);
      outline-offset: -2px;
    }

    /* ================= PIN GATE ================= */
    .gate-wrap {
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 24px 16px;
    }
    .gate-card {
      width: 100%;
      max-width: 392px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 24px 22px 20px;
      box-shadow: var(--card-highlight), var(--shadow-gate);
    }
    .gate-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 22px;
    }
    .gate-theme-btn {
      width: 44px;
      height: 44px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--text-2);
      display: inline-grid;
      place-items: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: background-color 150ms var(--ease), border-color 150ms var(--ease);
    }
    .gate-theme-btn:hover { background: var(--surface-3); border-color: var(--border-strong); }
    .gate-emblem {
      width: 46px;
      height: 46px;
      border-radius: 13px;
      background: var(--teal-soft);
      border: 1px solid var(--teal-border);
      color: var(--teal-text);
      display: grid;
      place-items: center;
      margin: 0 auto 14px;
    }
    .gate-title {
      margin: 0;
      text-align: center;
      font-family: var(--font-display);
      font-size: 1.24rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--text);
    }
    html[dir="rtl"] .gate-title { font-family: var(--font-ar); }
    .gate-sub {
      margin: 6px 0 20px;
      text-align: center;
      font-size: 0.87rem;
      color: var(--text-3);
    }
    .pin-field {
      position: relative;
      display: flex;
      align-items: center;
      margin-bottom: 12px;
    }
    .pin-input {
      width: 100%;
      min-height: 48px;
      padding: 10px 48px 10px 14px;
      border-radius: 11px;
      border: 1px solid var(--border-strong);
      background: var(--bg);
      color: var(--text);
      font-size: 16px;
      transition: border-color 150ms var(--ease), box-shadow 150ms var(--ease);
    }
    html[dir="rtl"] .pin-input { padding: 10px 14px 10px 48px; }
    .pin-input:focus {
      outline: none;
      border-color: var(--teal);
      box-shadow: 0 0 0 3px var(--teal-soft);
    }
    .pin-eye {
      position: absolute;
      inset-inline-end: 2px;
      width: 44px;
      height: 44px;
      border: 0;
      background: transparent;
      color: var(--text-3);
      display: grid;
      place-items: center;
      cursor: pointer;
      border-radius: 9px;
    }
    .pin-eye:hover { color: var(--text); }
    .gate-err {
      min-height: 20px;
      margin: 0 0 10px;
      font-size: 0.83rem;
      font-weight: 600;
      color: var(--err);
      text-align: center;
    }
    .gate-submit {
      width: 100%;
      min-height: 48px;
      border: 0;
      border-radius: 11px;
      background: var(--teal-btn);
      color: #FFFFFF;
      font-size: 0.96rem;
      font-weight: 650;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background-color 150ms var(--ease), transform 120ms var(--ease);
    }
    .gate-submit:hover { background: var(--teal-btn-hover); }
    .gate-submit:active { transform: scale(0.99); }
    .gate-submit:disabled { opacity: 0.65; cursor: wait; }
    .gate-install {
      width: 100%;
      min-height: 44px;
      margin-top: 10px;
      border-radius: 11px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text-2);
      font-size: 0.87rem;
      font-weight: 600;
      cursor: pointer;
    }
    .gate-install:hover { background: var(--surface-2); }
    .gate-foot {
      margin: 18px 0 0;
      text-align: center;
      font-family: var(--font-mono);
      font-size: 0.72rem;
      color: var(--text-3);
      font-variant-numeric: tabular-nums;
    }

    /* ================= SHARED LANGUAGE PILL ================= */
    .lang-pill {
      display: inline-flex;
      align-items: center;
      padding: 3px;
      border-radius: 10px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      gap: 2px;
    }
    .lang-btn {
      border: 0;
      background: transparent;
      color: var(--text-3);
      min-height: 32px;
      min-width: 36px;
      padding: 0 10px;
      border-radius: 7px;
      font-size: 0.81rem;
      font-weight: 650;
      cursor: pointer;
      transition: background-color 140ms var(--ease), color 140ms var(--ease);
    }
    .lang-btn:hover { color: var(--text); }
    .lang-btn.is-active {
      background: var(--surface);
      color: var(--text);
      box-shadow: 0 1px 2px rgba(12, 22, 34, 0.08);
    }

    /* ================= ULTRA-MINIMAL TOP UTILITY STRIP ================= */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 40;
      background: var(--chrome);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border-subtle);
    }
    .topbar-inner {
      max-width: var(--col-w);
      margin: 0 auto;
      padding: 8px var(--page-px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .prefs-trigger {
      min-height: 38px;
      min-width: 46px;
      padding: 0 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-family: var(--font-display);
      font-size: 0.92rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      cursor: pointer;
      transition: background-color 150ms var(--ease), border-color 150ms var(--ease), color 150ms var(--ease);
    }
    .prefs-trigger:hover { background: var(--surface-2); border-color: var(--border-strong); }
    .prefs-trigger[aria-expanded="true"] {
      background: var(--teal-soft);
      border-color: var(--teal-border);
      color: var(--teal-text);
    }

    /* ================= MAIN EDITORIAL COLUMN ================= */
    .main-col {
      max-width: var(--col-w);
      margin: 0 auto;
      padding: 18px var(--page-px) calc(48px + env(safe-area-inset-bottom));
    }
    .print-doc-header { display: none; }
    .print-summary-box { display: none; }

    .block { margin-top: var(--sec-gap); }
    .block:first-of-type { margin-top: 0; }
    .block-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }
    .block-title {
      margin: 0;
      font-size: 0.77rem;
      font-weight: 750;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-3);
    }
    html[dir="rtl"] .block-title {
      font-size: 0.90rem;
      font-weight: 700;
    }
    .ghost-pill {
      min-height: 36px;
      padding: 0 12px;
      border-radius: 9px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text-2);
      font-size: var(--fs-sm);
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: background-color 140ms var(--ease), border-color 140ms var(--ease);
    }
    .ghost-pill:hover { background: var(--surface-2); border-color: var(--border-strong); color: var(--text); }

    /* ================= BLOCK 1: PRESENTING PROBLEMS ================= */
    .prob-list {
      display: flex;
      flex-direction: column;
      gap: var(--card-gap);
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r-lg);
      box-shadow: var(--card-highlight), var(--shadow-card);
      overflow: hidden;
    }
    .prob-card.is-alert {
      border-inline-start: 3.5px solid var(--coral);
    }
    .prob-body {
      padding: var(--card-py) var(--card-px);
    }
    .prob-head {
      display: flex;
      align-items: flex-start;
      gap: 11px;
      margin-bottom: 8px;
    }
    .prob-num {
      flex-shrink: 0;
      font-family: var(--font-mono);
      font-size: 0.75rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      padding: 2px 7px;
      margin-top: 2px;
      border-radius: 6px;
      background: var(--teal-soft);
      color: var(--teal-text);
      border: 1px solid var(--teal-border);
    }
    .prob-card.is-alert .prob-num {
      background: var(--coral-soft);
      color: var(--coral-text);
      border-color: var(--coral-border);
    }
    .prob-title {
      margin: 0;
      font-family: var(--font-display);
      font-size: var(--fs-title);
      font-weight: 700;
      line-height: 1.32;
      letter-spacing: -0.015em;
      color: var(--text);
    }
    html[dir="rtl"] .prob-title {
      font-family: var(--font-ar);
      line-height: 1.46;
    }
    .prob-summary {
      margin: 0;
      color: var(--text-2);
    }
    .card-toggle {
      width: 100%;
      min-height: 42px;
      padding: 9px var(--card-px);
      border: 0;
      border-top: 1px solid var(--border-subtle);
      background: var(--bg);
      color: var(--teal-text);
      font-size: var(--fs-sm);
      font-weight: 650;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      text-align: start;
      transition: background-color 140ms var(--ease), color 140ms var(--ease);
    }
    .card-toggle:hover { background: var(--surface-2); }
    .prob-card.is-alert .card-toggle {
      background: var(--coral-wash);
      color: var(--coral-text);
    }
    .prob-card.is-alert .card-toggle:hover { background: var(--coral-soft); }
    .chev {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
      transition: transform 200ms var(--ease);
    }
    [aria-expanded="true"] .chev { transform: rotate(180deg); }

    .prob-details {
      padding: 4px var(--card-px) var(--card-py);
      border-top: 1px solid var(--border-subtle);
      background: var(--surface);
    }
    .detail-item {
      padding: 12px 0;
      border-bottom: 1px solid var(--border-subtle);
    }
    .detail-item:last-child { border-bottom: 0; padding-bottom: 2px; }
    .detail-label {
      font-size: var(--fs-sub);
      font-weight: 700;
      color: var(--text);
      margin-bottom: 4px;
    }
    .detail-text {
      margin: 0;
      color: var(--text-2);
      font-size: var(--fs-body);
    }

    /* ================= BLOCK 2: SAFETY & A -> B LABS ================= */
    .safety-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: var(--card-gap);
      margin-bottom: 16px;
    }
    .safety-card {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .safety-card.is-full { grid-column: 1 / -1; }
    .safety-card.sev-warn { border-inline-start: 3px solid var(--amber); }
    .safety-card.sev-info { border-inline-start: 3px solid var(--info); }
    .safety-body { padding: var(--card-py) var(--card-px); }
    .safety-top {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 7px;
    }
    .sev-badge {
      display: inline-flex;
      align-items: center;
      padding: 2px 8px;
      border-radius: 6px;
      font-size: 0.74rem;
      font-weight: 700;
      white-space: nowrap;
    }
    .sev-warn .sev-badge {
      background: var(--amber-soft);
      color: var(--amber-text);
      border: 1px solid var(--amber-border);
    }
    .sev-info .sev-badge {
      background: var(--info-soft);
      color: var(--info-text);
      border: 1px solid var(--info-border);
    }
    .safety-title {
      margin: 0;
      font-size: 0.98rem;
      font-weight: 700;
      color: var(--text);
      line-height: 1.35;
    }
    .safety-summary {
      margin: 0;
      color: var(--text-2);
      font-size: var(--fs-sub);
    }
    .safety-detail {
      padding: 12px var(--card-px) var(--card-py);
      border-top: 1px solid var(--border-subtle);
      color: var(--text-2);
      font-size: var(--fs-sub);
      background: var(--surface);
    }

    /* Watch Lab */
    .watch-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-inline-start: 3.5px solid var(--amber);
      border-radius: var(--r-lg);
      box-shadow: var(--card-highlight), var(--shadow-card);
      padding: var(--card-py) var(--card-px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 20px;
    }
    .watch-info { min-width: 0; flex: 1; }
    .watch-head {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 5px;
    }
    .watch-label {
      font-weight: 700;
      font-size: 0.98rem;
      color: var(--text);
    }
    .watch-badge {
      padding: 2px 8px;
      border-radius: 6px;
      font-size: 0.74rem;
      font-weight: 700;
      background: var(--amber-soft);
      color: var(--amber-text);
      border: 1px solid var(--amber-border);
    }
    .watch-note {
      margin: 0;
      font-size: var(--fs-sm);
      color: var(--text-2);
    }
    .watch-metric {
      flex-shrink: 0;
      text-align: end;
      padding: 8px 14px;
      border-radius: 10px;
      background: var(--amber-wash);
      border: 1px solid var(--amber-border);
    }
    .watch-val {
      display: block;
      font-family: var(--font-display);
      font-size: 1.48rem;
      font-weight: 750;
      line-height: 1.15;
      color: var(--amber-text);
      font-variant-numeric: tabular-nums;
      direction: ltr;
    }
    .watch-val small {
      font-size: 0.78rem;
      font-weight: 600;
      opacity: 1;
    }
    .watch-meta {
      display: block;
      margin-top: 3px;
      font-size: 0.75rem;
      color: var(--text-3);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    /* Crystal-Clear Before (A) -> After (B) Lab Transitions */
    .sub-heading {
      margin: 0 0 4px;
      font-size: 0.98rem;
      font-weight: 700;
      color: var(--text);
    }
    .sub-note {
      margin: 0 0 12px;
      font-size: var(--fs-sm);
      color: var(--text-3);
    }
    .trans-list {
      display: flex;
      flex-direction: column;
      gap: 11px;
      margin-bottom: 16px;
    }
    .trans-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r-lg);
      box-shadow: var(--card-highlight), var(--shadow-card);
      padding: 14px var(--card-px);
    }
    .trans-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
      flex-wrap: wrap;
    }
    .trans-name {
      font-weight: 700;
      font-size: 0.96rem;
      color: var(--text);
    }
    .trans-ref {
      font-size: 0.78rem;
      color: var(--text-3);
      font-variant-numeric: tabular-nums;
    }
    .trans-flow {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
      align-items: center;
      gap: 10px;
    }
    .trans-node {
      border-radius: 10px;
      padding: 10px 12px;
      border: 1px solid var(--border);
      min-width: 0;
    }
    .trans-node.is-before {
      background: var(--amber-wash);
      border-color: var(--amber-border);
    }
    .trans-node.is-after {
      background: var(--teal-wash);
      border-color: var(--teal-border);
    }
    .trans-node-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      margin-bottom: 4px;
      flex-wrap: wrap;
    }
    .trans-kicker {
      font-size: 0.72rem;
      font-weight: 750;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--amber-text);
    }
    .trans-node.is-after .trans-kicker { color: var(--teal-text); }
    .trans-date {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      color: var(--text-3);
      font-variant-numeric: tabular-nums;
    }
    .trans-val {
      font-family: var(--font-display);
      font-size: 1.38rem;
      font-weight: 750;
      line-height: 1.18;
      color: var(--amber-text);
      font-variant-numeric: tabular-nums;
      direction: ltr;
      text-align: start;
      margin-bottom: 5px;
    }
    html[dir="rtl"] .trans-val { text-align: end; }
    .trans-node.is-after .trans-val { color: var(--teal-text); }
    .trans-unit {
      font-size: 0.78rem;
      font-weight: 600;
      opacity: 1;
    }
    .trans-tag {
      display: inline-block;
      font-size: 0.73rem;
      font-weight: 700;
      padding: 1.5px 7px;
      border-radius: 5px;
    }
    .trans-tag.is-before {
      background: var(--amber-soft);
      color: var(--amber-text);
    }
    .trans-tag.is-after {
      background: var(--teal-soft);
      color: var(--teal-text);
    }
    .trans-arrow {
      display: grid;
      place-items: center;
      color: var(--teal);
      flex-shrink: 0;
    }
    .trans-arrow svg { width: 40px; height: 18px; display: block; }
    html[dir="rtl"] .trans-arrow svg { transform: scaleX(-1); }
    .trans-note {
      margin-top: 9px;
      font-size: 0.78rem;
      color: var(--text-3);
    }

    /* Collapsed Disclosure Bars (Normal Labs & Patient Baseline) */
    .disclosure-wrap {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r-lg);
      box-shadow: var(--card-highlight), var(--shadow-card);
      overflow: hidden;
    }
    .disclosure-bar {
      width: 100%;
      min-height: 48px;
      padding: 12px var(--card-px);
      border: 0;
      background: transparent;
      color: var(--text);
      font-size: var(--fs-sub);
      font-weight: 650;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      text-align: start;
      transition: background-color 140ms var(--ease);
    }
    .disclosure-bar:hover { background: var(--surface-2); }
    .disclosure-label {
      display: inline-flex;
      align-items: center;
      gap: 9px;
    }
    .teal-dot {
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: var(--teal);
      flex-shrink: 0;
    }
    .normal-labs-panel {
      border-top: 1px solid var(--border-subtle);
      padding: 6px var(--card-px) 12px;
    }
    .nlab-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0 22px;
    }
    .nlab-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 10px;
      padding: 9px 0;
      border-bottom: 1px solid var(--border-subtle);
    }
    .nlab-row:last-child { border-bottom: 0; }
    @media (min-width: 620px) {
      .nlab-row:nth-last-child(2):nth-child(odd) { border-bottom: 0; }
    }
    .nlab-name {
      font-size: var(--fs-sm);
      font-weight: 600;
      color: var(--text);
    }
    .nlab-right {
      text-align: end;
      flex-shrink: 0;
    }
    .nlab-val {
      display: block;
      font-size: var(--fs-sm);
      font-weight: 700;
      color: var(--teal-text);
      font-variant-numeric: tabular-nums;
      direction: ltr;
    }
    .nlab-meta {
      display: block;
      font-size: 0.72rem;
      color: var(--text-3);
      font-variant-numeric: tabular-nums;
    }

    /* ================= BLOCK 3: DIAGNOSTIC HYPOTHESES & PLAN BUILDER ================= */
    .saved-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 9px;
      border-radius: 999px;
      background: var(--teal-soft);
      border: 1px solid var(--teal-border);
      color: var(--teal-text);
      font-size: 0.74rem;
      font-weight: 650;
    }
    .ws-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r-lg);
      box-shadow: var(--card-highlight), var(--shadow-card);
      padding: var(--card-py) var(--card-px);
    }
    .ws-zone {
      padding: 18px 0;
      border-bottom: 1px solid var(--border-subtle);
    }
    .ws-zone:first-child { padding-top: 2px; }
    .ws-zone:last-child { border-bottom: 0; padding-bottom: 2px; }
    .ws-zone-title {
      margin: 0 0 4px;
      font-size: 0.98rem;
      font-weight: 700;
      color: var(--text);
    }
    .ws-hint {
      margin: 0 0 12px;
      font-size: var(--fs-sm);
      color: var(--text-3);
    }

    .chip-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 11px;
    }
    .chip-wrap {
      display: inline-flex;
      align-items: stretch;
      max-width: 100%;
    }
    .hyp-pill, .plan-chip {
      min-height: 40px;
      padding: 7px 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text-2);
      font-size: var(--fs-sm);
      font-weight: 600;
      line-height: 1.3;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 7px;
      text-align: start;
      max-width: 100%;
      transition: background-color 140ms var(--ease), border-color 140ms var(--ease), color 140ms var(--ease);
    }
    .hyp-pill:hover, .plan-chip:hover {
      background: var(--surface-2);
      border-color: var(--border-strong);
      color: var(--text);
    }
    .chip-wrap .hyp-pill,
    .chip-wrap .plan-chip {
      border-start-end-radius: 0;
      border-end-end-radius: 0;
    }
    .chip-del {
      min-width: 36px;
      min-height: 40px;
      padding: 0 8px;
      border: 1px solid var(--border);
      border-inline-start: 0;
      border-start-end-radius: 10px;
      border-end-end-radius: 10px;
      background: var(--surface-2);
      color: var(--text-3);
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-grid;
      place-items: center;
      transition: background-color 140ms var(--ease), color 140ms var(--ease);
    }
    .chip-del:hover { background: var(--coral-soft); color: var(--coral-text); border-color: var(--coral-border); }

    /* Hypothesis Priority States */
    .hyp-pill[data-prio="primary"] {
      background: var(--teal-soft);
      border-color: var(--teal);
      color: var(--teal-text);
    }
    .hyp-pill[data-prio="secondary"] {
      background: var(--info-soft);
      border-color: var(--info-border);
      color: var(--info-text);
    }
    .hyp-pill[data-prio="ruled_out"] {
      background: var(--surface-2);
      border-color: var(--border-strong);
      color: var(--text-2);
    }
    .hyp-pill[data-prio="ruled_out"] .hyp-text {
      text-decoration: line-through;
    }
    .prio-tag {
      font-size: 0.72rem;
      font-weight: 750;
      padding: 1.5px 7px;
      border-radius: 999px;
      white-space: nowrap;
    }
    .hyp-pill[data-prio="primary"] .prio-tag {
      background: var(--teal);
      color: #FFFFFF;
    }
    html[data-theme="dark"] .hyp-pill[data-prio="primary"] .prio-tag {
      color: #062825;
    }
    .hyp-pill[data-prio="secondary"] .prio-tag {
      background: var(--info-soft);
      border: 1px solid var(--info-border);
      color: var(--info-text);
    }
    .hyp-pill[data-prio="ruled_out"] .prio-tag {
      background: var(--coral-soft);
      color: var(--coral-text);
    }

    /* Plan Chips */
    .plan-group {
      margin-bottom: 18px;
    }
    .plan-group:last-child { margin-bottom: 0; }
    .plan-group-title {
      margin: 0 0 9px;
      font-size: var(--fs-sub);
      font-weight: 700;
      color: var(--text);
    }
    .plan-chip.is-on {
      background: var(--teal-soft);
      border-color: var(--teal);
      color: var(--teal-text);
    }
    .plan-ind {
      width: 15px;
      height: 15px;
      flex-shrink: 0;
      border: 1.5px solid var(--border-strong);
      border-radius: 4px;
      display: inline-grid;
      place-items: center;
      font-size: 10px;
      font-weight: 800;
      transition: background-color 140ms var(--ease), border-color 140ms var(--ease);
    }
    .plan-ind.is-radio { border-radius: 999px; }
    .plan-chip.is-on .plan-ind {
      background: var(--teal);
      border-color: var(--teal);
      color: #FFFFFF;
    }
    html[data-theme="dark"] .plan-chip.is-on .plan-ind { color: #062825; }

    /* Inline Custom Composers */
    .custom-add-row {
      display: flex;
      align-items: stretch;
      gap: 7px;
      flex-wrap: wrap;
    }
    .inline-input {
      flex: 1 1 190px;
      min-width: 0;
      min-height: 40px;
      padding: 7px 12px;
      border-radius: 9px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-size: 15px;
      transition: border-color 140ms var(--ease), box-shadow 140ms var(--ease);
    }
    .inline-input::placeholder { color: var(--text-3); }
    .inline-input:focus {
      outline: none;
      border-color: var(--teal);
      box-shadow: 0 0 0 2.5px var(--teal-soft);
    }
    .prio-select {
      min-height: 40px;
      padding: 0 10px;
      border-radius: 9px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-size: var(--fs-sm);
      font-weight: 600;
      cursor: pointer;
    }
    .add-btn {
      min-height: 40px;
      padding: 0 14px;
      border-radius: 9px;
      border: 1px solid var(--teal-border);
      background: var(--teal-soft);
      color: var(--teal-text);
      font-size: var(--fs-sm);
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      transition: background-color 140ms var(--ease);
    }
    .add-btn:hover { background: var(--teal); color: #FFFFFF; border-color: var(--teal); }
    html[data-theme="dark"] .add-btn:hover { color: #062825; }

    /* Free Note */
    .field-label {
      display: block;
      margin-bottom: 7px;
      font-size: var(--fs-sub);
      font-weight: 700;
      color: var(--text);
    }
    .note-area {
      width: 100%;
      min-height: 82px;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-size: 15px;
      line-height: 1.55;
      resize: vertical;
      transition: border-color 140ms var(--ease), box-shadow 140ms var(--ease);
    }
    .note-area::placeholder { color: var(--text-3); }
    .note-area:focus {
      outline: none;
      border-color: var(--teal);
      box-shadow: 0 0 0 2.5px var(--teal-soft);
    }

    /* Live Consultation Summary */
    .summary-box {
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--bg);
      padding: 15px 16px;
      transition: border-color 160ms var(--ease);
    }
    .summary-box.has-data {
      border-color: var(--teal-border);
      background: var(--teal-wash);
    }
    .summary-title {
      margin: 0 0 10px;
      font-size: 0.94rem;
      font-weight: 750;
      color: var(--text);
    }
    .summary-empty {
      margin: 0;
      font-size: var(--fs-sm);
      color: var(--text-3);
    }
    .sum-sec { margin-bottom: 10px; }
    .sum-sec:last-child { margin-bottom: 0; }
    .sum-k {
      font-size: 0.76rem;
      font-weight: 750;
      color: var(--teal-text);
      margin-bottom: 3px;
    }
    .sum-line {
      margin: 2px 0;
      font-size: var(--fs-sm);
      color: var(--text-2);
    }
    .summary-actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      margin-top: 14px;
    }
    .btn-primary, .btn-secondary, .btn-danger {
      min-height: 40px;
      padding: 0 14px;
      border-radius: 9px;
      font-size: var(--fs-sm);
      font-weight: 650;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: background-color 140ms var(--ease), border-color 140ms var(--ease), opacity 140ms var(--ease);
    }
    .btn-primary {
      border: 0;
      background: var(--teal-btn);
      color: #FFFFFF;
    }
    .btn-primary:hover:not(:disabled) { background: var(--teal-btn-hover); }
    .btn-secondary {
      border: 1px solid var(--border-strong);
      background: var(--surface);
      color: var(--text);
    }
    .btn-secondary:hover:not(:disabled) { background: var(--surface-2); }
    .btn-danger {
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text-3);
      margin-inline-start: auto;
    }
    .btn-danger:hover:not(:disabled) {
      border-color: var(--coral-border);
      background: var(--coral-soft);
      color: var(--coral-text);
    }
    .btn-danger.is-confirm {
      border-color: var(--coral);
      background: var(--coral);
      color: #FFFFFF;
    }
    .btn-primary:disabled, .btn-secondary:disabled, .btn-danger:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }
    .print-toggle-row {
      margin-top: 12px;
      padding-top: 11px;
      border-top: 1px solid var(--border-subtle);
    }
    .switch-label {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      cursor: pointer;
      font-size: var(--fs-sm);
      font-weight: 600;
      color: var(--text-2);
      min-height: 36px;
    }
    .switch-label input {
      width: 17px;
      height: 17px;
      accent-color: var(--teal);
      cursor: pointer;
      flex-shrink: 0;
    }

    /* ================= BLOCK 4: COLLAPSED PATIENT BASELINE ================= */
    .baseline-panel {
      border-top: 1px solid var(--border-subtle);
      padding: 6px var(--card-px) 14px;
    }
    .baseline-list {
      margin: 0;
    }
    .baseline-row {
      display: grid;
      grid-template-columns: minmax(140px, 195px) minmax(0, 1fr);
      gap: 6px 16px;
      padding: 10px 0;
      border-bottom: 1px solid var(--border-subtle);
    }
    .baseline-row:last-child { border-bottom: 0; padding-bottom: 2px; }
    .baseline-row dt {
      font-size: var(--fs-sm);
      font-weight: 700;
      color: var(--text-3);
    }
    .baseline-row dd {
      margin: 0;
      font-size: var(--fs-sub);
      color: var(--text-2);
    }

    /* ================= UNIFIED Aa PREFERENCES SHEET / POPOVER ================= */
    .prefs-backdrop {
      position: fixed;
      inset: 0;
      z-index: 90;
      background: var(--backdrop);
    }
    .prefs-sheet {
      position: fixed;
      z-index: 100;
      width: 344px;
      max-width: calc(100vw - 24px);
      max-height: calc(100dvh - 84px);
      overflow-y: auto;
      background: var(--glass-bg);
      border: 1px solid var(--border-strong);
      border-radius: 16px;
      box-shadow: var(--card-highlight), var(--shadow-pop);
      padding: 16px 16px 14px;
    }
    .prefs-handle { display: none; }
    .prefs-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 14px;
    }
    .prefs-title {
      margin: 0;
      font-size: 0.96rem;
      font-weight: 750;
      color: var(--text);
    }
    .prefs-close {
      width: 38px;
      height: 38px;
      border-radius: 9px;
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--text-2);
      font-size: 1.15rem;
      line-height: 1;
      display: grid;
      place-items: center;
      cursor: pointer;
    }
    .prefs-close:hover { background: var(--surface-3); color: var(--text); }
    .pref-group { margin-bottom: 13px; }
    .pref-label {
      display: block;
      margin-bottom: 6px;
      font-size: 0.76rem;
      font-weight: 700;
      color: var(--text-3);
    }
    .swatch-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 7px;
    }
    .swatch-btn {
      min-height: 42px;
      padding: 7px 10px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-2);
      font-size: 0.82rem;
      font-weight: 650;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      text-align: start;
      transition: border-color 140ms var(--ease), background-color 140ms var(--ease);
    }
    .swatch-btn:hover { border-color: var(--border-strong); color: var(--text); }
    .swatch-btn.is-active {
      border-color: var(--teal);
      background: var(--teal-soft);
      color: var(--teal-text);
    }
    .swatch-dot {
      width: 18px;
      height: 18px;
      border-radius: 999px;
      flex-shrink: 0;
      border: 1.5px solid rgba(12, 22, 34, 0.22);
    }
    .swatch-dot.sw-light { background: linear-gradient(135deg, #F7F8F7 50%, #0D6B63 50%); }
    .swatch-dot.sw-dark { background: linear-gradient(135deg, #0A0E14 50%, #2DD4BF 50%); border-color: rgba(241, 245, 249, 0.35); }
    .swatch-dot.sw-paper { background: linear-gradient(135deg, #F5EFE4 50%, #13625A 50%); }
    .swatch-dot.sw-contrast { background: linear-gradient(135deg, #FFFFFF 50%, #000000 50%); border-color: #000000; }

    .seg-row {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 4px;
      padding: 3px;
      border-radius: 10px;
      background: var(--surface-2);
      border: 1px solid var(--border);
    }
    .seg-row.cols-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .seg-btn {
      min-height: 36px;
      padding: 6px 6px;
      border: 0;
      border-radius: 7px;
      background: transparent;
      color: var(--text-3);
      font-size: 0.79rem;
      font-weight: 650;
      line-height: 1.22;
      white-space: normal;
      text-align: center;
      cursor: pointer;
      transition: background-color 140ms var(--ease), color 140ms var(--ease);
    }
    .seg-btn:hover { color: var(--text); }
    .seg-btn.is-active {
      background: var(--surface);
      color: var(--text);
      box-shadow: 0 1px 2px rgba(12, 22, 34, 0.08);
    }

    .prefs-actions {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 7px;
      padding-top: 12px;
      margin-top: 12px;
      border-top: 1px solid var(--border-subtle);
    }
    .pref-act-btn {
      min-height: 40px;
      padding: 7px 8px;
      border-radius: 9px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-2);
      font-size: 0.78rem;
      font-weight: 650;
      line-height: 1.2;
      text-align: center;
      cursor: pointer;
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      transition: background-color 140ms var(--ease), border-color 140ms var(--ease), color 140ms var(--ease);
    }
    .pref-act-btn:hover { background: var(--surface-2); border-color: var(--border-strong); color: var(--text); }
    .pref-act-btn.is-lock:hover { background: var(--coral-soft); border-color: var(--coral-border); color: var(--coral-text); }
    .prefs-reset {
      display: block;
      width: 100%;
      margin-top: 10px;
      min-height: 36px;
      border: 0;
      background: transparent;
      color: var(--text-3);
      font-size: 0.79rem;
      font-weight: 600;
      cursor: pointer;
      border-radius: 8px;
    }
    .prefs-reset:hover { background: var(--surface-2); color: var(--text); }

    /* ================= TOAST ================= */
    .toast {
      position: fixed;
      bottom: calc(20px + env(safe-area-inset-bottom));
      left: 50%;
      transform: translateX(-50%);
      z-index: 140;
      padding: 10px 18px;
      border-radius: 999px;
      background: var(--text);
      color: var(--surface);
      font-size: 0.85rem;
      font-weight: 650;
      box-shadow: var(--shadow-pop);
      pointer-events: none;
    }

    /* ================= MOBILE RESPONSIVENESS (320px–767px) ================= */
    @media (max-width: 767px) {
      :root {
        --page-px: 14px;
      }
      .lang-btn { min-height: 44px; min-width: 44px; font-size: 0.85rem; }
      .prefs-trigger { min-height: 44px; min-width: 48px; }
      .ghost-pill { min-height: 44px; }
      .card-toggle { min-height: 46px; }
      .hyp-pill, .plan-chip { min-height: 44px; }
      .chip-del { min-height: 44px; min-width: 42px; }
      .inline-input, .prio-select, .add-btn { min-height: 44px; font-size: 16px; }
      .note-area { font-size: 16px; }
      .btn-primary, .btn-secondary, .btn-danger { min-height: 44px; }
      .prefs-close { width: 44px; height: 44px; }
      .swatch-btn { min-height: 46px; }
      .seg-btn { min-height: 44px; }
      .pref-act-btn { min-height: 48px; }
      .prefs-reset { min-height: 44px; }

      .prefs-sheet {
        left: 0 !important;
        right: 0 !important;
        top: auto !important;
        bottom: 0;
        width: 100%;
        max-width: 100%;
        max-height: 86dvh;
        border-radius: 20px 20px 0 0;
        border-inline: 0;
        border-bottom: 0;
        padding: 10px 16px calc(18px + env(safe-area-inset-bottom));
      }
      .prefs-handle {
        display: block;
        width: 38px;
        height: 4px;
        border-radius: 999px;
        background: var(--border-strong);
        margin: 0 auto 12px;
      }
    }
    @media (max-width: 639px) {
      .safety-grid { grid-template-columns: minmax(0, 1fr); }
      .nlab-grid { grid-template-columns: minmax(0, 1fr); }
      .watch-card { flex-direction: column; align-items: stretch; gap: 12px; }
      .watch-metric { display: flex; align-items: baseline; justify-content: space-between; text-align: start; gap: 10px; }
      .baseline-row { grid-template-columns: minmax(0, 1fr); gap: 3px; }
      .btn-danger { margin-inline-start: 0; }
    }
    @media (max-width: 400px) {
      :root { --page-px: 12px; --card-px: 14px; }
      .trans-flow { gap: 6px; }
      .trans-node { padding: 8px 9px; }
      .trans-val { font-size: 1.12rem; }
      .trans-arrow svg { width: 28px; height: 16px; }
    }

    /* ================= LEGIBLE PUBLICATION-GRADE A4 PRINT ================= */
    @page {
      size: A4;
      margin: 12mm 13mm;
    }
    @media print {
      * {
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
        box-shadow: none !important;
      }
      html, html[data-theme="dark"], html[data-theme="paper"], html[data-theme="contrast"] {
        color-scheme: light !important;
        --bg: #FFFFFF !important;
        --surface: #FFFFFF !important;
        --surface-2: #F4F6F7 !important;
        --border: #CBD5E1 !important;
        --border-subtle: #E2E8F0 !important;
        --border-strong: #94A3B8 !important;
        --text: #0C1622 !important;
        --text-2: #1E293B !important;
        --text-3: #475569 !important;
        --teal: #0D6B63 !important;
        --teal-text: #0B5C55 !important;
        --teal-soft: #E6F4F2 !important;
        --teal-wash: #F1FAF8 !important;
        --teal-border: #8CD3CA !important;
        --coral: #C2410C !important;
        --coral-text: #9F2D10 !important;
        --coral-soft: #FDECE6 !important;
        --coral-wash: #FFF5F2 !important;
        --coral-border: #F2B5A0 !important;
        --amber: #B45309 !important;
        --amber-text: #8F4306 !important;
        --amber-soft: #FEF3E2 !important;
        --amber-wash: #FFF9F0 !important;
        --amber-border: #F1C98C !important;
        --info: #1D4ED8 !important;
        --info-text: #1B45B5 !important;
        --info-soft: #EBF2FE !important;
        --info-border: #B5CEF9 !important;
      }
      body {
        background: #FFFFFF !important;
        color: #0C1622 !important;
        font-size: 9.2pt !important;
        line-height: 1.44 !important;
      }
      html[dir="rtl"] body { line-height: 1.58 !important; }
      #gate, .topbar, #prefsBackdrop, #prefsSheet, #toast,
      .ghost-pill, .card-toggle, .disclosure-bar .chev, #block-workspace {
        display: none !important;
      }
      .disclosure-bar {
        display: flex !important;
        min-height: 0 !important;
        padding: 6pt 10pt !important;
        background: var(--surface-2) !important;
        font-size: 8.8pt !important;
      }
      .main-col {
        max-width: 100% !important;
        padding: 0 !important;
      }
      .print-doc-header {
        display: block !important;
        padding-bottom: 7pt;
        margin-bottom: 12pt;
        border-bottom: 1.5pt solid #0D6B63;
        font-size: 12.5pt;
        font-weight: 700;
        color: #0C1622;
      }
      .block { margin-top: 14pt !important; }
      .block:first-of-type { margin-top: 0 !important; }
      .block-head { margin-bottom: 7pt !important; }
      .block-title { font-size: 8.5pt !important; }
      .prob-list, .trans-list { gap: 8pt !important; }
      .card, .watch-card, .trans-card, .disclosure-wrap {
        border-radius: 6pt !important;
        break-inside: avoid;
        page-break-inside: avoid;
      }
      .prob-card { break-inside: auto; page-break-inside: auto; }
      .prob-body { padding: 9pt 11pt !important; break-inside: avoid; break-after: avoid; }
      .prob-title { font-size: 10.2pt !important; }
      .prob-details, .safety-detail, .normal-labs-panel, .baseline-panel {
        display: block !important;
      }
      .prob-details { padding: 2pt 11pt 8pt !important; }
      .detail-item { padding: 5pt 0 !important; break-inside: avoid; }
      .detail-label { font-size: 9pt !important; margin-bottom: 2pt !important; }
      .detail-text { font-size: 8.8pt !important; }
      .safety-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr)) !important;
        gap: 8pt !important;
        margin-bottom: 9pt !important;
      }
      .safety-body { padding: 8pt 10pt !important; }
      .safety-detail { padding: 6pt 10pt 8pt !important; font-size: 8.6pt !important; }
      .watch-card { padding: 8pt 10pt !important; margin-bottom: 10pt !important; flex-direction: row !important; }
      .watch-val { font-size: 12pt !important; }
      .trans-card { padding: 8pt 10pt !important; }
      .trans-node { padding: 6pt 8pt !important; }
      .trans-val { font-size: 11pt !important; }
      .nlab-grid { grid-template-columns: repeat(3, minmax(0, 1fr)) !important; gap: 0 14pt !important; }
      .nlab-row { padding: 4.5pt 0 !important; border-bottom: 0.5pt solid var(--border-subtle) !important; }
      .nlab-row:nth-last-child(-n+3) { border-bottom: 0 !important; }
      .baseline-row { padding: 5pt 0 !important; grid-template-columns: 130pt minmax(0, 1fr) !important; }
      body.print-with-notes .print-summary-box.has-data {
        display: block !important;
        margin-top: 14pt;
        padding: 10pt 12pt;
        border: 1pt solid #0D6B63;
        border-radius: 6pt;
        background: #F1FAF8 !important;
        break-inside: avoid;
      }
    }
  </style>
</head>
<body>
  <!-- PIN GATE -->
  <main id="gate" class="gate-wrap">
    <section class="gate-card" aria-labelledby="gateTitle">
      <div class="gate-top">
        <div class="lang-pill" dir="ltr" role="group" aria-label="Language">
          <button type="button" class="lang-btn" data-lang="fr">FR</button>
          <button type="button" class="lang-btn" data-lang="ar">ع</button>
          <button type="button" class="lang-btn" data-lang="en">EN</button>
        </div>
        <button type="button" id="gateThemeBtn" class="gate-theme-btn" aria-label="Theme">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
        </button>
      </div>
      <div class="gate-emblem" aria-hidden="true">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      </div>
      <h1 id="gateTitle" class="gate-title">Fiche clinique</h1>
      <p id="gateSub" class="gate-sub">Document médical chiffré — accès par code</p>
      <form id="pinForm" autocomplete="off">
        <div class="pin-field">
          <input id="pinInput" class="pin-input" type="password" inputmode="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Code d'accès" required />
          <button type="button" id="pinEyeBtn" class="pin-eye" aria-label="Afficher le code" aria-pressed="false">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
        <p id="gateErr" class="gate-err" role="alert" aria-live="polite"></p>
        <button type="submit" id="unlockBtn" class="gate-submit">Ouvrir</button>
      </form>
      <button type="button" id="installBtn" class="gate-install" hidden></button>
      <p id="gateFoot" class="gate-foot">AES-256-GCM · PBKDF2-SHA256</p>
    </section>
  </main>

  <!-- APP SHELL -->
  <div id="app" hidden>
    <header class="topbar">
      <div class="topbar-inner">
        <div class="lang-pill" dir="ltr" role="group" aria-label="Language">
          <button type="button" class="lang-btn" data-lang="fr">FR</button>
          <button type="button" class="lang-btn" data-lang="ar">ع</button>
          <button type="button" class="lang-btn" data-lang="en">EN</button>
        </div>
        <button type="button" id="prefsBtn" class="prefs-trigger" aria-haspopup="dialog" aria-expanded="false" aria-controls="prefsSheet">Aa</button>
      </div>
    </header>
    <main id="appMain" class="main-col"></main>
  </div>

  <!-- UNIFIED Aa PREFERENCES POPOVER / MOBILE SHEET -->
  <div id="prefsBackdrop" class="prefs-backdrop" hidden></div>
  <section id="prefsSheet" class="prefs-sheet" role="dialog" aria-modal="true" aria-labelledby="prefsTitle" hidden></section>

  <!-- TOAST -->
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <script>

    function createEmptyWorkspace() {
      return {
        hypPrio: {},

        printIncludeSummary: false
      };

    function normalizeWorkspace(raw) {
      const base = createEmptyWorkspace();
      if (!raw || typeof raw !== 'object') return base;
      if (raw.hypPrio && typeof raw.hypPrio === 'object') {
        for (const [k, v] of Object.entries(raw.hypPrio)) {
          if (v === 'primary' || v === 'secondary' || v === 'ruled_out') base.hypPrio[k] = v;
        }
      }
      if (Array.isArray(raw.customHypotheses)) {
        base.customHypotheses = raw.customHypotheses
          .filter(x => x && typeof x.id === 'string' && typeof x.label === 'string' && x.label.trim())
          .map(x => ({ id: x.id, label: x.label.trim().slice(0, 140) }));
      }
      for (const gid of ['grp-timing', 'grp-tests', 'grp-care']) {
        if (raw.planSelected && Array.isArray(raw.planSelected[gid])) {
          base.planSelected[gid] = [...new Set(raw.planSelected[gid].filter(x => typeof x === 'string'))];
        }
        if (raw.customOptions && Array.isArray(raw.customOptions[gid])) {
          base.customOptions[gid] = raw.customOptions[gid]
            .filter(x => x && typeof x.id === 'string' && typeof x.label === 'string' && x.label.trim())
            .map(x => ({ id: x.id, label: x.label.trim().slice(0, 140) }));
        }
      }
      if (typeof raw.freeNote === 'string') base.freeNote = raw.freeNote.slice(0, 4000);
      base.printIncludeSummary = Boolean(raw.printIncludeSummary);
      return base;
    }

    // ================= CRYPTO HELPERS =================
    function fromB64(b64) {
      const bin = atob(b64);
      const out = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
      return out;
    }
    function toB64(u8) {
      let s = '';
      for (let i = 0; i < u8.length; i++) s += String.fromCharCode(u8[i]);
      return btoa(s);
    }
    async function deriveAesKey(pin, saltU8, iter) {
      const base = await crypto.subtle.importKey('raw', enc.encode(pin), 'PBKDF2', false, ['deriveKey']);
      return crypto.subtle.deriveKey(
        { name: 'PBKDF2', salt: saltU8, iterations: iter, hash: 'SHA-256' },
        base,
        { name: 'AES-GCM', length: 256 },
        false,
        ['encrypt', 'decrypt']
      );
    }
    async function decryptBundle(pin) {
      const key = await deriveAesKey(pin, fromB64(BUNDLE.salt), BUNDLE.iter);
      const buf = await crypto.subtle.decrypt(
        { name: 'AES-GCM', iv: fromB64(BUNDLE.iv) },
        key,
        fromB64(BUNDLE.ct)
      );
      return JSON.parse(dec.decode(buf));
    }
    async function ensureWsKey(pin) {
      if (wsKeyCache && wsKeyCache.key) return wsKeyCache;
      const salt = crypto.getRandomValues(new Uint8Array(16));
      const key = await deriveAesKey(pin, salt, WS_ITER);
      wsKeyCache = { saltB64: toB64(salt), key };
      return wsKeyCache;
    }
    async function loadEncryptedWorkspace(pin) {
      await saveChain.catch(() => {});
      try {
        const raw = localStorage.getItem(WS_KEY);
        if (!raw) {
          ws = createEmptyWorkspace();
          await ensureWsKey(pin);
          return;
        }
        const obj = JSON.parse(raw);
        if (!obj || !obj.salt || !obj.iv || !obj.ct) {
          ws = createEmptyWorkspace();
          await ensureWsKey(pin);
          return;
        }
        const key = await deriveAesKey(pin, fromB64(obj.salt), obj.iter || WS_ITER);
        const plain = await crypto.subtle.decrypt(
          { name: 'AES-GCM', iv: fromB64(obj.iv) },
          key,
          fromB64(obj.ct)
        );
        wsKeyCache = { saltB64: obj.salt, key };
        ws = normalizeWorkspace(JSON.parse(dec.decode(plain)));
      } catch {
        ws = createEmptyWorkspace();
        await ensureWsKey(pin);
      }
    }
    function enqueueEncryptedSave(snapshot, keyInfo) {
      if (!keyInfo || !keyInfo.key) return Promise.resolve();
      const { saltB64, key } = keyInfo;
      saveChain = saveChain.then(async () => {
        const iv = crypto.getRandomValues(new Uint8Array(12));
        const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, enc.encode(snapshot));
        try {
          localStorage.setItem(WS_KEY, JSON.stringify({
            v: 2,
            iter: WS_ITER,
            salt: saltB64,
            iv: toB64(iv),
            ct: toB64(new Uint8Array(ct))
          }));
        } catch {}
      }).catch(() => {});
      return saveChain;
    }
    function persistWorkspaceNow() {
      if (!sessionPin || !wsKeyCache || !wsKeyCache.key) return Promise.resolve();
      return enqueueEncryptedSave(JSON.stringify(ws), wsKeyCache);
    }
    function scheduleWorkspaceSave() {
      if (saveTimer) clearTimeout(saveTimer);
      saveTimer = setTimeout(() => {
        saveTimer = null;
        persistWorkspaceNow();
      }, 220);
    }

    // ================= HTML & BIDI HELPERS =================
    function esc(str) {
      return String(str == null ? '' : str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }
    function fmt(str) {
      const s = String(str == null ? '' : str);
      if (prefs.lang !== 'ar') return esc(s);
      const re = /([~<>\u00B5]?[A-Za-z0-9\u00C0-\u024F][A-Za-z0-9\u00C0-\u024F\u00B5._/%:+\u00D7\-\u2013]*(?:(?:\s+|\s+[\-\u2013\u2014]\s+)[~<>\u00B5]?[A-Za-z0-9\u00C0-\u024F][A-Za-z0-9\u00C0-\u024F\u00B5._/%:+\u00D7\-\u2013]*)*)/g;
      let out = '';
      let last = 0;
      let m;
      while ((m = re.exec(s)) !== null) {
        if (m.index > last) out += esc(s.slice(last, m.index));
        out += '<bdi class="ltr-tok" dir="ltr">' + esc(m[0]) + '</bdi>';
        last = re.lastIndex;
      }
      if (last < s.length) out += esc(s.slice(last));
      return out;
    }
    function uid(prefix) {
      return prefix + '-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 6);
    }

    // ================= GATE LOGIC =================
    function renderGateText() {
      const g = GATE_UI[prefs.lang] || GATE_UI.fr;
      $('gateTitle').textContent = g.title;
      $('gateSub').textContent = g.sub;
      $('pinInput').placeholder = g.placeholder;
      if (!$('unlockBtn').disabled) $('unlockBtn').textContent = g.btn;
      $('gateFoot').textContent = g.foot;
      $('installBtn').textContent = g.install;
      const shown = $('pinInput').type === 'text';
      $('pinEyeBtn').setAttribute('aria-label', shown ? g.hidePin : g.showPin);
    }

    async function handleUnlock(e) {
      e.preventDefault();
      const g = GATE_UI[prefs.lang] || GATE_UI.fr;
      if (!window.crypto || !window.crypto.subtle) {
        $('gateErr').textContent = g.badCrypto;
        return;
      }
      const pin = $('pinInput').value.trim();
      if (!pin) return;
      $('gateErr').textContent = '';
      $('unlockBtn').disabled = true;
      $('unlockBtn').textContent = g.busy;
      try {
        const decrypted = await decryptBundle(pin);
        DATA = decrypted;
        sessionPin = pin;
        await loadEncryptedWorkspace(pin);
        $('pinInput').value = '';
        $('pinInput').type = 'password';
        $('pinEyeBtn').setAttribute('aria-pressed', 'false');
        $('gate').hidden = true;
        $('app').hidden = false;
        applyDisplayPrefs();
        renderApp();
        window.scrollTo(0, 0);
      } catch {
        $('gateErr').textContent = g.err;
        $('pinInput').focus();
        $('pinInput').select();
      } finally {
        $('unlockBtn').disabled = false;
        $('unlockBtn').textContent = g.btn;
      }
    }

    function lockApp() {
      closePrefsSheet(false);
      // Capture final snapshot + cached CryptoKey synchronously BEFORE scrubbing RAM/DOM
      if (saveTimer) {
        clearTimeout(saveTimer);
        saveTimer = null;
      }
      if (clearConfirmTimer) {
        clearTimeout(clearConfirmTimer);
        clearConfirmTimer = null;
      }
      clearConfirmArmed = false;
      const finalSnapshot = sessionPin && wsKeyCache ? JSON.stringify(ws) : null;
      const finalKeyInfo = wsKeyCache ? { saltB64: wsKeyCache.saltB64, key: wsKeyCache.key } : null;

      // Instant synchronous RAM & DOM scrub (< 5ms, zero clinical DOM remains after tap)
      DATA = null;
      sessionPin = null;
      wsKeyCache = null;
      ws = createEmptyWorkspace();
      openProbs.clear();
      openSafety.clear();
      normalLabsOpen = false;
      baselineOpen = false;
      document.body.classList.remove('print-with-notes');
      $('appMain').innerHTML = '';
      $('prefsSheet').innerHTML = '';
      $('app').hidden = true;
      $('gate').hidden = false;
      $('gateErr').textContent = '';
      $('pinInput').value = '';
      $('pinInput').type = 'password';
      $('pinEyeBtn').setAttribute('aria-pressed', 'false');
      document.title = 'Fiche clinique · مذكرة سريرية · Clinical Note';
      renderGateText();
      $('pinInput').focus();

      // Race-safe background encrypted flush (awaited by loadEncryptedWorkspace on re-unlock)
      if (finalSnapshot && finalKeyInfo) {
        enqueueEncryptedSave(finalSnapshot, finalKeyInfo);
      }
    }

    function positionPrefsSheet() {
      const sheet = $('prefsSheet');

        sheet.style.top = '';

      const btnRect = $('prefsBtn').getBoundingClientRect();
      const sw = Math.min(344, window.innerWidth - 24);
      const isRtl = document.documentElement.dir === 'rtl';
      let left = isRtl ? btnRect.left : (btnRect.right - sw);
      left = Math.max(12, Math.min(left, window.innerWidth - sw - 12));
      const top = Math.max(12, btnRect.bottom + 8);
      sheet.style.left = left + 'px';
      sheet.style.top = top + 'px';
    }

    // ================= SUMMARY GENERATION =================
    function getPrioLabel(prio, ui) {
      if (prio === 'primary') return ui.prioPrimary;
      if (prio === 'secondary') return ui.prioSecondary;
      if (prio === 'ruled_out') return ui.prioRuledOut;
      return '';
    }

    function buildSummaryModel() {
      const d = DATA[prefs.lang];
      const ui = d.ui;
      const allHyps = [...d.workspace.hypotheses, ...ws.customHypotheses];
      const hypsByPrio = { primary: [], secondary: [], ruled_out: [] };
      for (const h of allHyps) {
        const pr = ws.hypPrio[h.id];
        if (pr && hypsByPrio[pr]) hypsByPrio[pr].push(h.label);
      }

      const planLines = [];
      for (const g of d.workspace.planGroups) {
        const selIds = new Set(ws.planSelected[g.id] || []);
        if (!selIds.size) continue;
        const allOpts = [...g.options, ...(ws.customOptions[g.id] || [])];
        const picked = allOpts.filter(o => selIds.has(o.id)).map(o => o.label);
        if (picked.length) planLines.push({ title: g.title, items: picked });
      }

      const note = (ws.freeNote || '').trim();
      const hasHyps = hypsByPrio.primary.length + hypsByPrio.secondary.length + hypsByPrio.ruled_out.length > 0;
      const hasData = hasHyps || planLines.length > 0 || note.length > 0;
      return { ui, hypsByPrio, hasHyps, planLines, note, hasData };
    }

    function buildSummaryPlainText() {
      const d = DATA[prefs.lang];
      const m = buildSummaryModel();
      if (!m.hasData) return '';
      const out = [d.docTitle, m.ui.summaryTitle, ''];
      if (m.hasHyps) {
        out.push(m.ui.summaryHypotheses + ':');
        for (const pr of ['primary', 'secondary', 'ruled_out']) {
          if (m.hypsByPrio[pr].length) {
            out.push('  - ' + getPrioLabel(pr, m.ui) + ': ' + m.hypsByPrio[pr].join(' ; '));
          }
        }
        out.push('');
      }
      if (m.planLines.length) {
        out.push(m.ui.summaryPlan + ':');
        for (const g of m.planLines) {
          out.push('  - ' + g.title + ': ' + g.items.join(' ; '));
        }
        out.push('');
      }
      if (m.note) {
        out.push(m.ui.summaryNote + ':');
        out.push('  ' + m.note);
      }
      return out.join('\n').trim();
    }

    function buildSummaryHtml(m) {
      if (!m.hasData) {
        return '<p class="summary-empty">' + esc(m.ui.summaryEmpty) + '</p>';
      }
      const parts = [];
      if (m.hasHyps) {
        let rows = '';
        for (const pr of ['primary', 'secondary', 'ruled_out']) {
          if (m.hypsByPrio[pr].length) {
            rows += '<p class="sum-line"><strong>' + esc(getPrioLabel(pr, m.ui)) + ':</strong> ' + m.hypsByPrio[pr].map(fmt).join(' · ') + '</p>';
          }
        }
        parts.push('<div class="sum-sec"><div class="sum-k">' + esc(m.ui.summaryHypotheses) + '</div>' + rows + '</div>');
      }
      if (m.planLines.length) {
        const rows = m.planLines.map(g => '<p class="sum-line"><strong>' + fmt(g.title) + ':</strong> ' + g.items.map(fmt).join(' · ') + '</p>').join('');
        parts.push('<div class="sum-sec"><div class="sum-k">' + esc(m.ui.summaryPlan) + '</div>' + rows + '</div>');
      }
      if (m.note) {
        parts.push('<div class="sum-sec"><div class="sum-k">' + esc(m.ui.summaryNote) + '</div><p class="sum-line">' + fmt(m.note).replace(/\n/g, '<br />') + '</p></div>');
      }
      return parts.join('');
    }

    function updateSummaryDOM() {
      if (!DATA) return;
      const m = buildSummaryModel();
      const box = $('summaryBox');
      const prev = $('summaryPreview');
      const printBox = $('printSummaryBox');
      if (!box || !prev) return;

      box.classList.toggle('has-data', m.hasData);
      prev.innerHTML = buildSummaryHtml(m);
      $('copySummaryBtn').disabled = !m.hasData;
      $('exportTxtBtn').disabled = !m.hasData;
      $('clearWsBtn').disabled = !m.hasData;

      if (!m.hasData && clearConfirmArmed) disarmClearConfirm();

      if (printBox) {
        printBox.classList.toggle('has-data', m.hasData);
        printBox.innerHTML = m.hasData
          ? '<h3 class="summary-title">' + esc(m.ui.summaryTitle) + '</h3>' + buildSummaryHtml(m)
          : '';
      }
    }
