      function renderSummaryCtaInner(ui) {
        const cnt = getTotalNotesCount();
        const hasAny = hasAnyWorkspaceData();
        const countTxt = cnt > 0
          ? (ui.decisionsPickedCount || "{n} mark(s) recorded").replace("{n}", String(cnt))
          : (ui.localSavedBadge || "Encrypted local save");
        return '<span class="q-summary-cta-txt">' + ICO_LOCK_SM + "<span>" + esc(countTxt) + "</span></span>"
          + '<span class="q-summary-cta-acts">'
            + '<button class="drawer-act-btn is-primary" type="button" data-quick-copy-sum="1"' + (hasAny ? "" : " disabled") + ">" + ICO_COPY + "<span>" + esc(ui.notesCopy || "Copy summary") + "</span></button>"
            + '<button class="drawer-act-btn" type="button" data-open-notes="1">' + ICO_NOTE + "<span>" + esc(ui.viewSummaryCta || "View summary") + "</span></button>"
          + "</span>";
      }

      function renderPrintNotesHtml(ui) {
        const isRtl = Boolean(data && data[lang] && data[lang].dir === "rtl");
        const d = data && data[lang];
        const secs = (d && d.sections) || {};
        const qItems = (secs.questions && secs.questions.items) || [];
        const screens = (d && Array.isArray(d.quickScreens)) ? d.quickScreens : [];
        const gen = generalNote.trim();

        const blocks = [];

        // 1. Consultation Decisions (Section 06)
        const decLines = [];
        qItems.forEach((q, i) => {
          const k = "q-" + i;
          const set = decisionChoices.get(k);
          const labels = set ? Array.from(set).map((oid) => getDecisionOptionLabel(k, oid)) : [];
          const note = (itemNotes.get(k) || "").trim();
          const done = discussedQuestions.has(k);
          if (labels.length || done || note) {
            decLines.push(
              '<li><strong><bdi dir="ltr">[' + String(i + 1).padStart(2, "0") + "]</bdi> " + fmt(q.lead, isRtl, "") + "</strong>"
              + (labels.length ? " — " + labels.map((lb) => fmt(lb, isRtl, "")).join(" · ") : (done ? " — ✓ " + esc(ui.discussedDone || "Discussed") : ""))
              + (note ? " (" + esc(note) + ")" : "")
              + "</li>"
            );
          }
        });
        if (decLines.length) {
          blocks.push('<h4 class="print-notes-subhead">' + esc(ui.summaryDecisionsTitle || "Consultation Decisions") + '</h4><ul class="print-notes-list">' + decLines.join("") + "</ul>");
        }

        // 2. Quick Verbal Screening Verdicts
        const qsLines = [];
        screens.forEach((sc) => {
          const v = quickVerdicts.get(sc.id);
          const vm = getVerdictMeta(v, ui);
          if (vm) {
            qsLines.push("<li><strong>" + esc(vm.label) + "</strong> — " + fmt(sc.label, isRtl, "") + "</li>");
          }
        });
        if (qsLines.length) {
          blocks.push('<h4 class="print-notes-subhead">' + esc(ui.summaryScreensTitle || "Quick Verbal Screening") + '</h4><ul class="print-notes-list">' + qsLines.join("") + "</ul>");
        }

        // 3. Stamped / Annotated Clinical Cards + Saved Passages + Probe Answers
        const otherLines = [];
        ALL_ITEM_KEYS.filter((k) => !k.startsWith("q-")).forEach((k) => {
          const st = cardStamps.get(k);
          const note = (itemNotes.get(k) || "").trim();
          const saved = pinnedItems.has(k);
          const asked = askedItems.has(k);
          if (!st && !note && !saved && !asked) return;
          const meta = getItemMeta(k);
          if (!meta) return;
          const stm = getStampMeta(st, ui);
          const tag = stm ? "[" + stm.glyph + " " + stm.short + "] " : "";
          const marks = (saved ? "★ " : "") + (asked ? "? " : "");
          otherLines.push("<li><strong>" + esc(tag) + marks + '<bdi dir="ltr">[' + esc(meta.secNum) + "]</bdi> " + fmt(meta.title, isRtl, "") + "</strong>" + (note ? " — " + esc(note) : "") + "</li>");
        });
        savedPassages.forEach((p) => {
          otherLines.push('<li><strong><bdi dir="ltr">[' + esc(p.secNum) + "]</bdi> « " + esc(p.text.slice(0, 140)) + (p.text.length > 140 ? "…" : "") + " »</strong>" + (p.note ? " — " + esc(p.note) : "") + "</li>");
        });
        if (d && Array.isArray(d.interviewProbes)) {
          d.interviewProbes.forEach((pr) => {
            const done = probeDone.has(pr.id);
            const ans = (probeAnswers.get(pr.id) || "").trim();
            if (done || ans) {
              otherLines.push('<li><strong>' + (done ? "✓ " : "") + '<bdi dir="ltr">[' + esc(pr.secNum) + "]</bdi> " + fmt(pr.title, isRtl, "") + "</strong>" + (ans ? " — " + esc(ans) : "") + "</li>");
            }
          });
        }
        if (otherLines.length) {
          blocks.push('<h4 class="print-notes-subhead">' + esc(ui.summaryStampsTitle || "Clinical Marks & Notes") + '</h4><ul class="print-notes-list">' + otherLines.join("") + "</ul>");
        }

        if (!gen && !blocks.length) return "";
        return '<section class="print-notes-section" aria-label="' + esc(ui.notesPrintHeading || "Clinician Summary") + '">'
          + '<h3 class="print-notes-title">' + esc(ui.notesPrintHeading || "Consultation Decisions Summary & Notes") + "</h3>"
          + (gen ? '<p class="print-notes-gen" dir="auto">' + esc(gen) + "</p>" : "")
          + blocks.join("")
        + "</section>";
      }

      function syncPrintNotesDOM() {
        if (!data || !data[lang]) return;
        const holder = document.getElementById("printNotesHolder");
        if (holder) holder.innerHTML = renderPrintNotesHtml(data[lang].ui || {});
      }

      function syncAllBadges() {
        if (!data || !data[lang]) return;
        const ui = data[lang].ui || {};
        const noteTotal = getTotalNotesCount();
        const savedTotal = getSavedTotalCount();
        const askTotal = askedItems.size;
        const itemCnt = getAnnotatedItemKeys().length;

        if (notesBadge) {
          notesBadge.textContent = String(noteTotal);
          setHidden(notesBadge, noteTotal === 0);
        }
        if (notesBtn) {
          notesBtn.classList.toggle("is-active", notesOpen || noteTotal > 0);
        }
        if (tabBadgeInterview) {
          tabBadgeInterview.textContent = String(askTotal);
          setHidden(tabBadgeInterview, askTotal === 0);
        }
        if (tabBadgeSaved) {
          tabBadgeSaved.textContent = String(savedTotal);
          setHidden(tabBadgeSaved, savedTotal === 0);
        }
        if (tabBadgeNotes) {
          tabBadgeNotes.textContent = String(noteTotal);
          setHidden(tabBadgeNotes, noteTotal === 0);
        }
        const railNotes = document.getElementById("railNotesBtn");
        if (railNotes) {
          const lbl = ui.notesShort || ui.notesTitle || "Notes";
          railNotes.textContent = noteTotal > 0 ? (lbl + " (" + noteTotal + ")") : lbl;
        }
        const lensIvCnt = document.getElementById("lensIvCnt");
        if (lensIvCnt) {
          lensIvCnt.textContent = String(askTotal);
          setHidden(lensIvCnt, askTotal === 0);
        }
        const lensSavedCnt = document.getElementById("lensSavedCnt");
        if (lensSavedCnt) {
          lensSavedCnt.textContent = String(savedTotal);
          setHidden(lensSavedCnt, savedTotal === 0);
        }
        const lensPillsWrap = document.getElementById("lensPills");
        if (lensPillsWrap) {
          let annotPill = lensPillsWrap.querySelector('[data-lens="annotated"]');
          if (itemCnt > 0 || activeLens === "annotated") {
            const txt = (ui.lensAnnotated || "Annotated ({n})").replace("{n}", String(itemCnt));
            if (!annotPill) {
              annotPill = document.createElement("button");
              annotPill.type = "button";
              annotPill.className = "lens-pill is-annot" + (activeLens === "annotated" ? " is-active" : "");
              annotPill.dataset.lens = "annotated";
              annotPill.setAttribute("aria-pressed", activeLens === "annotated" ? "true" : "false");
              const sep = lensPillsWrap.querySelector(".lens-sep");
              if (sep) lensPillsWrap.insertBefore(annotPill, sep);
              else lensPillsWrap.appendChild(annotPill);
            }
            annotPill.textContent = txt;
          } else if (annotPill) {
            annotPill.remove();
          }
        }
        syncPrintNotesDOM();
      }

      function syncCardAnnotationDOM(key, skipSlot) {
        if (!data || !data[lang]) return;
        const ui = data[lang].ui || {};
        const card = document.getElementById("item-" + key);
        if (!card) return;
        const saved = pinnedItems.has(key);
        const asked = askedItems.has(key);
        const noted = hasItemNote(key);
        const editing = openCommentEditors.has(key);
        const stamp = cardStamps.get(key) || "";

        card.classList.toggle("is-pinned-card", saved);
        card.classList.toggle("is-asked-card", asked && !saved);
        card.classList.toggle("is-stamped-confirm", stamp === "confirm");
        card.classList.toggle("is-stamped-follow", stamp === "follow");
        card.classList.toggle("is-stamped-exclude", stamp === "exclude");

        card.querySelectorAll('.stamp-btn[data-stamp-key="' + key + '"]').forEach((sb) => {
          const on = sb.dataset.stampVal === stamp;
          sb.classList.toggle("is-active", on);
          sb.setAttribute("aria-pressed", on ? "true" : "false");
        });

        const saveBtn = card.querySelector('.card-act-btn[data-save-card="' + key + '"]');
        if (saveBtn) {
          saveBtn.classList.toggle("is-saved", saved);
          saveBtn.setAttribute("aria-pressed", saved ? "true" : "false");
          const lbl = saved ? (ui.saveCardRemove || "Remove") : (ui.saveCardAdd || "Save card");
          saveBtn.setAttribute("aria-label", lbl);
          saveBtn.setAttribute("title", lbl);
        }
        const askBtn = card.querySelector('.card-act-btn[data-ask-key="' + key + '"]');
        if (askBtn) {
          askBtn.classList.toggle("is-asked", asked);
          askBtn.setAttribute("aria-pressed", asked ? "true" : "false");
          const lbl = asked ? (ui.askRemove || "Remove ask") : (ui.askAdd || "Ask patient");
          askBtn.setAttribute("aria-label", lbl);
          askBtn.setAttribute("title", lbl);
        }
        const noteBtn = card.querySelector('.card-act-btn[data-comment-key="' + key + '"]');
        if (noteBtn) {
          noteBtn.classList.toggle("has-note", noted);
          noteBtn.classList.toggle("is-editing", editing);
          noteBtn.setAttribute("aria-expanded", editing ? "true" : "false");
          const lbl = noted ? (ui.commentEdit || "Edit note") : (ui.commentAdd || "Add note");
          noteBtn.setAttribute("aria-label", lbl);
          noteBtn.setAttribute("title", lbl);
        }
        if (!skipSlot) {
          const slot = card.querySelector(".card-note-slot");
          if (slot) slot.innerHTML = renderCardNoteSlotInner(key, ui);
        }
      }

      function syncQuestionDoneBadgeDOM() {
        if (!data || !data[lang]) return;
        const d = data[lang];
        const ui = d.ui || {};
        const totalQ = (d.sections && d.sections.questions && d.sections.questions.items) ? d.sections.questions.items.length : 4;
        const doneCount = discussedQuestions.size;
        const qBadge = document.getElementById("qCountBadge");
        if (qBadge) {
          qBadge.textContent = (ui.discussedCount || "{done}/{total}").replace("{done}", String(doneCount)).replace("{total}", String(totalQ));
          setHidden(qBadge, doneCount === 0);
        }
        const ivDecCnt = document.getElementById("ivDecCount");
        if (ivDecCnt) {
          ivDecCnt.textContent = "(" + doneCount + "/" + totalQ + ")";
        }
      }

      function syncDecisionChipsDOM(qKey) {
        if (!data || !data[lang]) return;
        const selSet = decisionChoices.get(qKey);
        const isDone = discussedQuestions.has(qKey);
        document.querySelectorAll('.q-chip[data-dec-q="' + qKey + '"]').forEach((btn) => {
          const on = Boolean(selSet && selSet.has(btn.dataset.decOpt));
          btn.classList.toggle("is-selected", on);
          btn.setAttribute("aria-pressed", on ? "true" : "false");
          const mark = btn.querySelector(".q-chip-mark");
          if (mark) mark.textContent = on ? "✓" : "";
        });
        document.querySelectorAll('[data-q-toggle="' + qKey + '"]').forEach((chk) => {
          chk.setAttribute("aria-pressed", isDone ? "true" : "false");
          const card = chk.closest(".q-item, .iv-card");
          if (card) card.classList.toggle("is-done", isDone);
        });
        syncQuestionDoneBadgeDOM();
      }

      function toggleDecisionChip(qKey, optId) {
        if (!data || !data[lang]) return;
        const cfg = data[lang].decisionConfig && data[lang].decisionConfig[qKey];
        if (!cfg) return;
        let selSet = decisionChoices.get(qKey);
        if (!selSet) {
          selSet = new Set();
          decisionChoices.set(qKey, selSet);
        }
        if (cfg.mode === "single") {
          if (selSet.has(optId)) selSet.clear();
          else {
            selSet.clear();
            selSet.add(optId);
          }
        } else {
          if (selSet.has(optId)) selSet.delete(optId);
          else selSet.add(optId);
        }
        if (selSet.size === 0) {
          decisionChoices.delete(qKey);
          if (!hasItemNote(qKey)) discussedQuestions.delete(qKey);
        } else {
          discussedQuestions.add(qKey);
        }
        scheduleWorkspaceSave();
        if (activeView === "brief" && activeLens === "annotated" && !isItemAnnotated(qKey)) {
          renderBrief(false);
        } else {
          syncDecisionChipsDOM(qKey);
        }
        syncAllBadges();
        renderNotesFeedInAllTargets();
      }

      function toggleCardStamp(key, stampVal) {
        if (cardStamps.get(key) === stampVal) cardStamps.delete(key);
        else cardStamps.set(key, stampVal);
        scheduleWorkspaceSave();
        if (activeView === "brief") {
          if (activeLens === "annotated" && !isItemAnnotated(key)) renderBrief(false);
          else syncCardAnnotationDOM(key, openCommentEditors.has(key));
        }
        syncAllBadges();
        renderNotesFeedInAllTargets();
      }

      function syncQuickScreensDOM() {
        const screens = (data && data[lang] && Array.isArray(data[lang].quickScreens)) ? data[lang].quickScreens : [];
        const answeredCount = screens.filter((sc) => quickVerdicts.has(sc.id)).length;
        document.querySelectorAll('[data-qs-counter="1"]').forEach((el) => {
          el.innerHTML = '<bdi dir="ltr">' + answeredCount + "/" + screens.length + "</bdi>";
        });
        screens.forEach((sc) => {
          const cur = quickVerdicts.get(sc.id) || "";
          document.querySelectorAll('[data-qs-row="' + sc.id + '"]').forEach((row) => {
            row.classList.toggle("has-verdict", Boolean(cur));
            row.querySelectorAll(".qs-btn[data-qs-val]").forEach((btn) => {
              const on = btn.dataset.qsVal === cur;
              btn.classList.toggle("is-active", on);
              btn.setAttribute("aria-pressed", on ? "true" : "false");
            });
          });
        });
      }

      function toggleQuickVerdict(qsId, val) {
        if (quickVerdicts.get(qsId) === val) quickVerdicts.delete(qsId);
        else quickVerdicts.set(qsId, val);
        scheduleWorkspaceSave();
        syncQuickScreensDOM();
        syncAllBadges();
        renderNotesFeedInAllTargets();

      function toggleSaveCard(key) {

          if (activeLens === "annotated" && !isItemAnnotated(key)) renderBrief(false);
          else syncCardAnnotationDOM(key, openCommentEditors.has(key));

      /* =======================================================================
         HIGHLIGHT-TO-SAVE FLOATING SELECTION PILL
         ======================================================================= */
      function hideSelPop() {
        pendingSel = null;
        if (selPop) {
          selPop.classList.remove("is-visible");
          selPop.style.transform = "translate3d(-9999px, -9999px, 0)";
        }
      }

      function evaluateTextSelection() {
        if (!data || !data[lang] || appShell.hidden || activeView !== "brief") { hideSelPop(); return; }
        const sel = window.getSelection && window.getSelection();
        if (!sel || sel.isCollapsed || sel.rangeCount === 0) { hideSelPop(); return; }
        const txt = String(sel.toString() || "").replace(/\s+/g, " ").trim();
        if (txt.length < 10) { hideSelPop(); return; }

        const range = sel.getRangeAt(0);
        const anchorNode = range.commonAncestorContainer;
        const anchorEl = anchorNode.nodeType === 1 ? anchorNode : anchorNode.parentElement;
        if (!anchorEl || !briefMain.contains(anchorEl)) { hideSelPop(); return; }
        if (anchorEl.closest("input, textarea, .note-editor, .lens-bar, .mob-sec-strip, .triage-strip, .card-stamp-bar, .q-chips-wrap, .quick-screen-card, .q-summary-cta")) { hideSelPop(); return; }

        const rect = range.getBoundingClientRect();
        if (!rect || (rect.width === 0 && rect.height === 0)) { hideSelPop(); return; }

        const cardEl = anchorEl.closest("[id^='item-']");
        const secEl = anchorEl.closest("section[id^='sec-']");
        const sourceKey = cardEl ? cardEl.id.replace(/^item-/, "") : "";
        const meta = sourceKey ? getItemMeta(sourceKey) : null;
        const secId = (meta && meta.secId) || (secEl ? secEl.id.replace(/^sec-/, "") : "priorities");
        const secObj = (data[lang].sections && data[lang].sections[secId]) || data[lang].sections.priorities;

        pendingSel = {
          text: txt,
          sourceKey,
          secId,
          secNum: (meta && meta.secNum) || (secObj && secObj.num) || "01",
          sourceTitle: (meta && meta.title) || (secObj && secObj.title) || ""
        };

        const ui = data[lang].ui || {};
        if (selSaveTxt) selSaveTxt.textContent = ui.selSaveBtn || "Save passage";
        if (selNoteTxt) selNoteTxt.textContent = ui.selNoteBtn || "Annotate";

        selPop.classList.add("is-visible");
        const pw = selPop.offsetWidth || 210;
        const ph = selPop.offsetHeight || 38;
        const pad = 10;
        let x = rect.left + rect.width / 2 - pw / 2;
        x = Math.max(pad, Math.min(window.innerWidth - pw - pad, x));
        const minTop = (stickyChrome ? Math.max(0, stickyChrome.getBoundingClientRect().bottom) : 0) + 6;
        const maxBottom = Math.max(minTop, window.innerHeight - ph - (isMobileViewport() ? 72 : 16));
        let y = rect.top - ph - 10;
        if (y < minTop) y = rect.bottom + 10;
        y = Math.max(minTop, Math.min(maxBottom, y));
        selPop.style.transform = "translate3d(" + Math.round(x) + "px," + Math.round(y) + "px,0)";
      }

      document.addEventListener("selectionchange", () => {
        clearTimeout(selDebounce);
        selDebounce = window.setTimeout(evaluateTextSelection, 90);
      });
      document.addEventListener("mouseup", () => {
        clearTimeout(selDebounce);
        selDebounce = window.setTimeout(evaluateTextSelection, 40);
      });
      document.addEventListener("touchend", () => {
        clearTimeout(selDebounce);
        selDebounce = window.setTimeout(evaluateTextSelection, 140);
      });

      if (selPop) {
        selPop.addEventListener("pointerdown", (e) => { e.preventDefault(); });
      }
      if (selSaveBtn) {
        selSaveBtn.addEventListener("click", () => {
          if (!pendingSel || !data || !data[lang]) return;
          const payload = pendingSel;
          addSavedPassage({
            sourceKey: payload.sourceKey,
            secId: payload.secId,
            secNum: payload.secNum,
            sourceTitle: payload.sourceTitle,
            text: payload.text,
            kind: "excerpt"
          });
          const sel = window.getSelection && window.getSelection();
          if (sel) { try { sel.removeAllRanges(); } catch {} }
          hideSelPop();
          showMiniToast((data[lang].ui && data[lang].ui.savedPassageToast) || "Passage saved ✓");
        });
      }
      if (selNoteBtn) {
        selNoteBtn.addEventListener("click", () => {
          if (!pendingSel || !data || !data[lang]) return;
          const payload = pendingSel;
          const saved = addSavedPassage({
            sourceKey: payload.sourceKey,
            secId: payload.secId,
            secNum: payload.secNum,
            sourceTitle: payload.sourceTitle,
            text: payload.text,
            kind: "excerpt"
          });
          const sel = window.getSelection && window.getSelection();
          if (sel) { try { sel.removeAllRanges(); } catch {} }
          hideSelPop();
          savedTab = "passages";
          switchView("saved", false);
          if (saved) {
            requestAnimationFrame(() => {
              const inp = briefMain.querySelector('input[data-saved-note="' + saved.id + '"]');
              if (inp) inp.focus();
            });
          }
        });
      }

      function clampPopover(popEl) {
        if (!popEl || popEl.hidden) return;
        popEl.style.insetInlineStart = "";
        popEl.style.insetInlineEnd = "";
        const w = popEl.offsetWidth;
        if (!w) return;
        const r = popEl.getBoundingClientRect();
        const cx = r.left + r.width / 2;
        const left0 = cx - w / 2;
        const right0 = cx + w / 2;
        const pad = 12;
        let shift = 0;
        if (right0 > window.innerWidth - pad) shift = (window.innerWidth - pad) - right0;
        if (left0 + shift < pad) shift = pad - left0;
        if (Math.abs(shift) > 0.5) {
          const pr = (popEl.offsetParent || document.documentElement).getBoundingClientRect();
          const isRtl = root.dir === "rtl";
          popEl.style.insetInlineEnd = "auto";
          popEl.style.insetInlineStart = (isRtl
            ? Math.round(pr.right - (right0 + shift))
            : Math.round(left0 - pr.left + shift)) + "px";
        }
      }

      function toggleReadPop(forceOpen) {
        const next = typeof forceOpen === "boolean" ? forceOpen : readPop.hidden;
        if (next) {
          hideQuickPop();
          renderReadPop();
          setHidden(readPop, false);
          clampPopover(readPop);
          readBtn.setAttribute("aria-expanded", "true");
        } else {
          setHidden(readPop, true);
          readPop.style.insetInlineStart = "";
          readPop.style.insetInlineEnd = "";
          readBtn.setAttribute("aria-expanded", "false");
        }
        applyReadingPrefs(false);
      }

      /* =======================================================================
         AUTOMATIC CONSULTATION DECISIONS SUMMARY & LOCAL ENCRYPTED WORKSPACE
         ======================================================================= */
      function buildSummaryText() {
        if (!data || !data[lang]) return "";
        const d = data[lang];
        const ui = d.ui || {};
        const secs = d.sections || {};
        const qItems = (secs.questions && secs.questions.items) || [];
        const screens = Array.isArray(d.quickScreens) ? d.quickScreens : [];
        const lines = [];

        lines.push("# " + (ui.notesPrintHeading || "Consultation Decisions Summary") + " — " + d.title + " (" + d.date + ")");
        lines.push("Date: " + new Date().toISOString().slice(0, 16).replace("T", " "));

        // 1. Consultation Decisions (Section 06)
        const decLines = [];
        qItems.forEach((q, i) => {
          const k = "q-" + i;
          const set = decisionChoices.get(k);
          const labels = set ? Array.from(set).map((oid) => getDecisionOptionLabel(k, oid)) : [];
          const note = (itemNotes.get(k) || "").trim();
          const done = discussedQuestions.has(k);
          if (labels.length || done || note) {
            decLines.push("- [" + (done ? "x" : " ") + "] " + String(i + 1).padStart(2, "0") + ". " + q.lead + (labels.length ? " : " + labels.join(" · ") : ""));
            if (note) decLines.push("  → " + note.replace(/\n/g, "\n    "));
          }
        });
        if (decLines.length) {
          lines.push("");
          lines.push("## " + (ui.summaryDecisionsTitle || (secs.questions ? secs.questions.num + " · " + secs.questions.title : "Consultation Decisions")));
          lines.push.apply(lines, decLines);
        }

        // 2. Quick Verbal Screening Verdicts (Yes / No / Later)
        const qsLines = [];
        screens.forEach((sc) => {
          const v = quickVerdicts.get(sc.id);
          const vm = getVerdictMeta(v, ui);
          if (vm) {
            qsLines.push("- [" + vm.label + "] [" + sc.secNum + "] " + sc.label);
          }
        });
        if (qsLines.length) {
          lines.push("");
          lines.push("## " + (ui.summaryScreensTitle || "Quick Verbal Screening"));
          lines.push.apply(lines, qsLines);
        }

        // 3. Stamped Clinical Cards (✓ / ? / ✕)
        const stampLines = [];
        ALL_ITEM_KEYS.filter((k) => cardStamps.has(k)).forEach((k) => {
          const meta = getItemMeta(k);
          const stm = getStampMeta(cardStamps.get(k), ui);
          if (!meta || !stm) return;
          const note = (itemNotes.get(k) || "").trim();
          stampLines.push("- [" + stm.glyph + " " + stm.short + "] [" + meta.secNum + "] " + meta.title);
          if (note) stampLines.push("  → " + note.replace(/\n/g, "\n    "));
        });
        if (stampLines.length) {
          lines.push("");
          lines.push("## " + (ui.summaryStampsTitle || "Stamped Clinical Items"));
          lines.push.apply(lines, stampLines);
        }

        // 4. Optional Free-Text General Note
        if (generalNote.trim()) {
          lines.push("");
          lines.push("## " + (ui.notesGeneralLabel || "Additional note"));
          lines.push(generalNote.trim());
        }

        // 5. Saved Passages & Excerpts
        if (savedPassages.length) {
          lines.push("");
          lines.push("## " + (ui.savedTitle || "Saved Passages"));
          savedPassages.forEach((p) => {
            lines.push("> [" + p.secNum + "] " + p.sourceTitle + (p.label ? " · " + p.label : ""));
            lines.push("> " + p.text);
            if (p.note && p.note.trim()) lines.push("  → " + p.note.trim());
          });
        }

        // 6. Clinical Probes
        if (Array.isArray(d.interviewProbes)) {
          const probeLines = [];
          d.interviewProbes.forEach((pr) => {
            const done = probeDone.has(pr.id);
            const ans = (probeAnswers.get(pr.id) || "").trim();
            if (done || ans) {
              probeLines.push((done ? "- [x] " : "- [ ] ") + "[" + pr.secNum + "] " + pr.title);
              if (ans) probeLines.push("  → " + ans.replace(/\n/g, "\n    "));
            }
          });
          if (probeLines.length) {
            lines.push("");
            lines.push("## " + (ui.interviewProbesTitle || "Clinical Probes"));
            lines.push.apply(lines, probeLines);
          }
        }

        // 7. Other Saved / Asked / Commented Cards (not already listed under Decisions or Stamps)
        const otherKeys = getAnnotatedItemKeys().filter((k) => !k.startsWith("q-") && !cardStamps.has(k));
        if (otherKeys.length) {
          lines.push("");
          lines.push("## " + (ui.notesItemsLabel || "Saved, Asked & Commented Items"));
          otherKeys.forEach((k) => {
            const meta = getItemMeta(k);
            if (!meta) return;
            const marks = (pinnedItems.has(k) ? "★ " : "") + (askedItems.has(k) ? (askedDone.has(k) ? "[?✓] " : "[?] ") : "");
            const note = (itemNotes.get(k) || "").trim();
            lines.push("- " + marks + "[" + meta.secNum + "] " + meta.title);
            if (note) lines.push("  → " + note.replace(/\n/g, "\n    "));
          });
        }

        return lines.join("\n");
      }

      async function copySummaryToClipboard(btnEl) {
        if (!data || !data[lang]) return;
        const ui = data[lang].ui || {};
        const txt = buildSummaryText();
        if (!txt) return;
        let ok = false;
        try {
          if (navigator.clipboard && navigator.clipboard.writeText) {
            await navigator.clipboard.writeText(txt);
            ok = true;
          }
        } catch {}
        if (!ok) {
          const tmp = document.createElement("textarea");
          tmp.value = txt;
          tmp.style.position = "fixed";
          tmp.style.opacity = "0";
          document.body.appendChild(tmp);
          tmp.select();
          try { document.execCommand("copy"); } catch {}
          tmp.remove();
        }
        const span = btnEl ? btnEl.querySelector("span") : null;
        if (span) span.textContent = ui.notesCopied || "Copied ✓";
        showMiniToast(ui.notesCopied || "Copied ✓");
        clearTimeout(copyResetTimer);
        copyResetTimer = window.setTimeout(() => {
          if (!data || !data[lang]) return;
          const lbl = (data[lang].ui && data[lang].ui.notesCopy) || "Copy summary";
          document.querySelectorAll("[data-notes-copy] span, [data-quick-copy-sum] span").forEach((sp) => {
            sp.textContent = lbl;
          });
        }, 2000);
      }

            ? groups.join("")
            : '<p class="drawer-empty">' + esc(ui.notesEmpty || "Tap any decision chip, Yes/No/Later check, or card stamp to build the summary automatically.") + "</p>")
        + "</div>";
      }

      function renderNotesFeedHtml(ui) {
        const feedKeys = ALL_ITEM_KEYS.filter((k) => pinnedItems.has(k) || askedItems.has(k) || hasItemNote(k));
        if (!feedKeys.length && !savedPassages.length) {
          return "";
        }
        const parts = [];
        savedPassages.slice(0, 8).forEach((p) => {
          parts.push(
            '<div class="drawer-item is-pinned">'
              + '<div class="drawer-item-top">'
                + '<button class="drawer-item-jump" type="button" data-drawer-jump="' + esc(p.sourceKey) + '" data-drawer-sec="' + esc(p.secId) + '">'
                  + '<span class="drawer-item-num"><bdi dir="ltr">' + esc(p.secNum) + "</bdi></span>"
                  + '<span class="drawer-item-title">« ' + esc(p.text.slice(0, 72)) + (p.text.length > 72 ? "…" : "") + " »</span>"
                + "</button>"
                + '<span class="drawer-item-acts">'
                  + '<button class="drawer-mini-btn is-del" type="button" data-del-passage="' + esc(p.id) + '" title="' + esc(ui.commentDelete || "Delete") + '">' + ICO_TRASH + "</button>"
                + "</span>"
              + "</div>"
              + (p.note ? '<p class="drawer-item-note" dir="auto">' + esc(p.note) + "</p>" : "")
            + "</div>"
          );
        });
        feedKeys.forEach((k) => {
          const meta = getItemMeta(k);
          if (!meta) return;
          const saved = pinnedItems.has(k);
          const asked = askedItems.has(k);
          const note = (itemNotes.get(k) || "").trim();
          parts.push(
            '<div class="drawer-item' + (saved ? " is-pinned" : "") + '">'
              + '<div class="drawer-item-top">'
                + '<button class="drawer-item-jump" type="button" data-drawer-jump="' + esc(k) + '" data-drawer-sec="' + esc(meta.secId) + '">'
                  + '<span class="drawer-item-num"><bdi dir="ltr">' + esc(meta.secNum) + "</bdi></span>"
                  + '<span class="drawer-item-title">' + esc(meta.title) + "</span>"
                + "</button>"
                + '<span class="drawer-item-acts">'
                  + '<button class="drawer-mini-btn' + (saved ? " is-pinned" : "") + '" type="button" data-drawer-pin="' + esc(k) + '" title="' + esc(saved ? (ui.saveCardRemove || "Remove") : (ui.saveCardAdd || "Save")) + '">' + ICO_BM + "</button>"
                  + '<button class="drawer-mini-btn" type="button" data-drawer-edit="' + esc(k) + '" data-drawer-sec="' + esc(meta.secId) + '" title="' + esc(ui.commentEdit || "Edit") + '">' + ICO_NOTE + "</button>"
                  + (note ? '<button class="drawer-mini-btn is-del" type="button" data-drawer-del="' + esc(k) + '" title="' + esc(ui.commentDelete || "Delete") + '">' + ICO_TRASH + "</button>" : "")
                + "</span>"
              + "</div>"
              + (note
                ? '<p class="drawer-item-note" dir="auto">' + esc(note) + "</p>"
                : '<div class="drawer-item-pin-lbl">' + (saved ? "🔖 " + esc(ui.tabSaved || "Saved") : "") + (asked ? (saved ? " · " : "") + "? " + esc(ui.askShort || "Ask") : "") + "</div>")
            + "</div>"
          );
        });
        return parts.join("");
      }

      function renderNotesCoreInnerHtml(ui, isInlineMobile) {
        const tpls = Array.isArray(ui.notesTemplates) ? ui.notesTemplates : [];
        const hasAny = hasAnyWorkspaceData();

        return (isInlineMobile

          : '<div class="drawer-head">'
              + '<div>'
                + '<h2 id="notesDrawerTitle" class="drawer-title">' + esc(ui.notesTitle || "Decisions & Notes") + "</h2>"
                + '<p class="drawer-sub">' + esc(ui.notesSub || "") + "</p>"
              + "</div>"
              + '<button class="ico-btn" type="button" data-close-notes="1" aria-label="' + esc(ui.dismiss || "Close") + '">' + ICO_X + "</button>"
            + "</div>")
          + '<div class="' + (isInlineMobile ? "notes-inline-card" : "drawer-body") + '">'
            + '<div data-auto-summary-wrap="1">' + renderAutoSummaryCardHtml(ui) + "</div>"

                  + "</div>"
                : "")

            + "</div>"

          + '<div class="' + (isInlineMobile ? "notes-inline-card" : "drawer-foot") + '">'
            + '<div class="drawer-print-toggle" data-print-toggle-row="1">'
              + '<span>' + esc(ui.notesPrintToggle || "Include decisions summary when printing") + "</span>"
              + '<button class="read-switch" type="button" role="switch" data-print-switch="1" aria-checked="' + (includeNotesInPrint ? "true" : "false") + '" aria-label="' + esc(ui.notesPrintToggle || "Include decisions summary when printing") + '"></button>'

              + '<button class="drawer-act-btn is-danger" type="button" data-notes-clear="1"' + (hasAny ? "" : " disabled") + ">" + esc(clearConfirmArmed ? (ui.notesClearConfirm || "Confirm?") : (ui.notesClear || "Clear")) + "</button>"
            + "</div>"
            + '<div class="drawer-acts-sec">'
              + '<button class="drawer-act-btn" type="button" data-notes-exp-txt="1"' + (hasAny ? "" : " disabled") + ">" + ICO_DL + "<span>" + esc(ui.notesExport || "Export .txt") + "</span></button>"

      function renderNotesFeedInAllTargets() {
        if (!data || !data[lang]) return;
        const ui = data[lang].ui || {};
        const autoHtml = renderAutoSummaryCardHtml(ui);
        const feedHtml = renderNotesFeedHtml(ui);
        const hasAny = hasAnyWorkspaceData();
        document.querySelectorAll('[data-auto-summary-wrap="1"]').forEach((el) => { el.innerHTML = autoHtml; });
        document.querySelectorAll('[data-notes-feed="1"]').forEach((el) => { el.innerHTML = feedHtml; });
        document.querySelectorAll('[data-notes-feed-wrap="1"]').forEach((el) => { setHidden(el, !feedHtml); });
        document.querySelectorAll('[data-summary-cta="1"]').forEach((el) => { el.innerHTML = renderSummaryCtaInner(ui); });
        document.querySelectorAll("[data-notes-copy], [data-notes-share], [data-notes-exp-txt], [data-notes-clear]").forEach((btn) => {
          btn.disabled = !hasAny;
        });
      }

      function renderNotesWorkspaceInAllTargets() {
        if (!data || !data[lang]) return;
        const ui = data[lang].ui || {};
        if (notesOpen) {
          notesDrawer.innerHTML = renderNotesCoreInnerHtml(ui, false);
        }
        if (activeView === "notes") {
          briefMain.innerHTML = '<div class="ws-view">' + renderNotesCoreInnerHtml(ui, true) + "</div>";
        }
      }

      function setNotesOpen(open, restoreFocus) {
        if (!data || !data[lang]) return;
        if (isMobileViewport() && open) {
          switchView("notes", false);
          return;
        }
        const wasOpen = notesOpen;
        notesOpen = Boolean(open);
        clearConfirmArmed = false;
        clearTimeout(clearConfirmTimer);
        if (notesOpen) {
          if (!wasOpen) lastFocusBeforeOverlay = document.activeElement;
          toggleReadPop(false);
          closeMobileSheet(false);
          closeShortcutsModal(false);
          notesDrawer.innerHTML = renderNotesCoreInnerHtml(data[lang].ui || {}, false);
          setHidden(notesDrawer, false);
          setHidden(notesBackdrop, false);
          document.body.classList.add("notes-open");
          notesBtn.setAttribute("aria-expanded", "true");
          syncOverlayBodyLock();
          syncAllBadges();
        } else {
          setHidden(notesDrawer, true);
          setHidden(notesBackdrop, true);
          document.body.classList.remove("notes-open");
          notesBtn.setAttribute("aria-expanded", "false");
          syncOverlayBodyLock();
          syncAllBadges();
          if (restoreFocus && lastFocusBeforeOverlay && typeof lastFocusBeforeOverlay.focus === "function") {
            try { lastFocusBeforeOverlay.focus({ preventScroll: true }); } catch {}
          }
          lastFocusBeforeOverlay = null;
        }
        requestAnimationFrame(() => {
          syncAllPills(true);
          updateScrollUI();
        });
      }

      async function handleNotesContainerClick(e, container) {
        if (!data || !data[lang]) return false;
        const ui = data[lang].ui || {};
        if (e.target.closest("[data-close-notes]")) {
          setNotesOpen(false, true);
          return true;
        }
        const rmDec = e.target.closest("[data-sum-rm-dec]");
        if (rmDec) {
          const qKey = rmDec.dataset.sumRmDec;
          decisionChoices.delete(qKey);
          discussedQuestions.delete(qKey);
          scheduleWorkspaceSave();
          if (activeView === "brief" && activeLens === "annotated" && !isItemAnnotated(qKey)) renderBrief(false);
          else syncDecisionChipsDOM(qKey);
          syncAllBadges();
          renderNotesFeedInAllTargets();
          return true;
        }
        const rmQs = e.target.closest("[data-sum-rm-qs]");
        if (rmQs) {
          quickVerdicts.delete(rmQs.dataset.sumRmQs);
          scheduleWorkspaceSave();
          syncQuickScreensDOM();
          syncAllBadges();
          renderNotesFeedInAllTargets();
          return true;
        }
        const rmStamp = e.target.closest("[data-sum-rm-stamp]");
        if (rmStamp) {
          const k = rmStamp.dataset.sumRmStamp;
          cardStamps.delete(k);
          scheduleWorkspaceSave();
          if (activeView === "brief") {
            if (activeLens === "annotated" && !isItemAnnotated(k)) renderBrief(false);
            else syncCardAnnotationDOM(k, openCommentEditors.has(k));
          }
          syncAllBadges();
          renderNotesFeedInAllTargets();
          return true;
        }
        const rmProbe = e.target.closest("[data-sum-rm-probe]");
        if (rmProbe) {
          const pid = rmProbe.dataset.sumRmProbe;
          probeDone.delete(pid);
          probeAnswers.delete(pid);
          openIvNotes.delete("probe:" + pid);
          scheduleWorkspaceSave();
          if (activeView === "interview") renderInterviewView(false);
          syncAllBadges();
          renderNotesFeedInAllTargets();
          return true;
        }
        const tplBtn = e.target.closest("[data-drawer-tpl]");
        if (tplBtn) {
          const ta = container.querySelector('[data-general-note="1"]');
          if (ta) {
            const tpl = tplBtn.dataset.drawerTpl;
            const sep = ta.value && !ta.value.endsWith("\n") ? "\n" : "";
            ta.value = ta.value + sep + tpl;
            generalNote = ta.value;
            scheduleWorkspaceSave();
            ta.focus();
            ta.setSelectionRange(ta.value.length, ta.value.length);
            syncAllBadges();
            renderNotesFeedInAllTargets();
          }
          return true;
        }
        const delPass = e.target.closest("[data-del-passage]");
        if (delPass) {
          removeSavedPassage(delPass.dataset.delPassage);
          return true;
        }
        const qsJump = e.target.closest("[data-drawer-qs]");
        if (qsJump) {
          const qsId = qsJump.dataset.drawerQs;
          if (window.innerWidth < 1180) setNotesOpen(false, false);
          if (activeView !== "brief" && activeView !== "interview") {
            activeView = "brief";
            renderBrief(false);
            syncMobileTabBar();
          }
          let rowEl = briefMain.querySelector('[data-qs-row="' + qsId + '"]');
          if (!rowEl && activeView === "brief") {
            searchQuery = "";
            searchInput.value = "";
            activeLens = "all";
            renderBrief(false);
            rowEl = briefMain.querySelector('[data-qs-row="' + qsId + '"]');
          }
          if (rowEl) {
            if (activeView === "brief") {
              spyLockUntil = Date.now() + 780;
              setActiveNav("questions", true);
            }
            const top = Math.max(0, rowEl.getBoundingClientRect().top + window.scrollY - getStickyOffset() - 12);
            window.scrollTo({ top, behavior: "smooth" });
            rowEl.classList.remove("is-pulsed");
            void rowEl.offsetWidth;
            rowEl.classList.add("is-pulsed");
          }
          return true;
        }
        const probeJump = e.target.closest("[data-drawer-probe]");
        if (probeJump) {
          const pid = probeJump.dataset.drawerProbe;
          if (window.innerWidth < 1180) setNotesOpen(false, false);
          if (activeView !== "interview") {
            activeView = "interview";
            renderInterviewView(false);
            syncMobileTabBar();
          }
          const cardEl = briefMain.querySelector('[data-iv-probe-card="' + pid + '"]');
          if (cardEl) {
            const top = Math.max(0, cardEl.getBoundingClientRect().top + window.scrollY - getStickyOffset() - 12);
            window.scrollTo({ top, behavior: "smooth" });
            cardEl.classList.remove("is-pulsed");
            void cardEl.offsetWidth;
            cardEl.classList.add("is-pulsed");
          }
          return true;
        }
        const jumpBtn = e.target.closest("[data-drawer-jump]");
        if (jumpBtn) {
          const k = jumpBtn.dataset.drawerJump;
          const s = jumpBtn.dataset.drawerSec;
          if (window.innerWidth < 1180) setNotesOpen(false, false);
          jumpToSection(s, { itemKey: k });
          return true;
        }
        const pinBtn = e.target.closest("[data-drawer-pin]");
        if (pinBtn) {
          toggleSaveCard(pinBtn.dataset.drawerPin);
          return true;
        }
        const editBtn = e.target.closest("[data-drawer-edit]");
        if (editBtn) {
          const k = editBtn.dataset.drawerEdit;
          const s = editBtn.dataset.drawerSec;
          if (window.innerWidth < 1180) setNotesOpen(false, false);
          jumpToSection(s, { itemKey: k });
          window.setTimeout(() => openInlineComment(k, true), 260);
          return true;
        }
        const delBtn = e.target.closest("[data-drawer-del]");
        if (delBtn) {
          deleteItemNote(delBtn.dataset.drawerDel);
          return true;
        }
        if (e.target.closest("[data-print-toggle-row]") || e.target.closest("[data-print-switch]")) {
          includeNotesInPrint = !includeNotesInPrint;
          document.body.classList.toggle("print-with-notes", includeNotesInPrint);
          document.querySelectorAll("[data-print-switch]").forEach((sw) => {
            sw.setAttribute("aria-checked", includeNotesInPrint ? "true" : "false");
          });
          scheduleWorkspaceSave();
          syncPrintNotesDOM();
          return true;
        }
        const copyBtn = e.target.closest("[data-notes-copy]");
        if (copyBtn) {
          await copySummaryToClipboard(copyBtn);
          return true;
        }
        if (e.target.closest("[data-notes-share]")) {
          const txt = buildSummaryText();
          if (!txt) return true;
          if (navigator.share) {
            try {
              await navigator.share({ title: data[lang].title || "Fiche Clinique", text: txt });
              return true;
            } catch {}
          }
          await copySummaryToClipboard(null);
          return true;
        }
        if (e.target.closest("[data-notes-exp-txt]")) {
          const txt = buildSummaryText();
          if (!txt) return true;
          const blob = new Blob([txt], { type: "text/plain;charset=utf-8" });
          const url = URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.href = url;
          a.download = "synthese-consultation-" + lang + ".txt";
          document.body.appendChild(a);
          a.click();
          a.remove();
          window.setTimeout(() => URL.revokeObjectURL(url), 1000);
          return true;
        }
        const clrBtn = e.target.closest("[data-notes-clear]");
        if (clrBtn) {
          if (!clearConfirmArmed) {
            clearConfirmArmed = true;
            clrBtn.textContent = ui.notesClearConfirm || "Confirm clear?";
            clearTimeout(clearConfirmTimer);
            clearConfirmTimer = window.setTimeout(() => {
              clearConfirmArmed = false;
              document.querySelectorAll("[data-notes-clear]").forEach((b) => {
                if (data && data[lang]) b.textContent = (data[lang].ui && data[lang].ui.notesClear) || "Clear all";
              });
            }, 4000);
          } else {
            clearConfirmArmed = false;
            clearTimeout(clearConfirmTimer);
            wsSaveSeq++;
            wsDirty = false;
            clearTimeout(wsSaveTimer);
            wsSaveTimer = 0;
            pinnedItems.clear();
            askedItems.clear();
            askedDone.clear();
            probeDone.clear();
            discussedQuestions.clear();
            decisionChoices.clear();
            cardStamps.clear();
            quickVerdicts.clear();
            openIvNotes.clear();
            itemNotes.clear();
            probeAnswers.clear();
            openCommentEditors.clear();
            savedPassages = [];
            generalNote = "";
            includeNotesInPrint = false;
            document.body.classList.remove("print-with-notes");
            if (activeLens === "annotated") activeLens = "all";
            try { localStorage.removeItem(WS_STORE_KEY); } catch {}
            renderActiveView(false);
            renderNotesWorkspaceInAllTargets();
            syncAllBadges();
          }
          return true;
        }
        return false;
      }

      /* =======================================================================
         MOBILE 4-TAB BAR, NAV & SCROLL-SPY
         ======================================================================= */
      function syncMobileTabBar() {
        if (!data || !data[lang]) return;
        const ui = data[lang].ui || {};
        if (tabLblBrief) tabLblBrief.textContent = ui.tabBrief || "Dossier";
        if (tabLblInterview) tabLblInterview.textContent = ui.tabInterview || "Entretien";
        if (tabLblSaved) tabLblSaved.textContent = ui.tabSaved || "Favoris";
        if (tabLblNotes) tabLblNotes.textContent = ui.tabNotes || "Notes";
        mobTabBtns.forEach((btn) => {
          const active = btn.dataset.tab === activeView;
          btn.classList.toggle("is-active", active);
          btn.setAttribute("aria-selected", active ? "true" : "false");
        });
        syncAllBadges();
      }

      function syncNavFade() {
        if (!navLinks) return;
        const maxSl = navLinks.scrollWidth - navLinks.clientWidth;
        navLinks.classList.remove("fade-left", "fade-right", "fade-both");
        if (maxSl <= 2) return;
        const r = navLinks.getBoundingClientRect();
        const first = navLinks.firstElementChild;
        const last = navLinks.lastElementChild;
        if (!first || !last) return;
        const fRect = first.getBoundingClientRect();
        const lRect = last.getBoundingClientRect();
        const minL = Math.min(fRect.left, lRect.left);
        const maxR = Math.max(fRect.right, lRect.right);
        const clipL = minL < r.left - 2;
        const clipR = maxR > r.right + 2;
        if (clipL && clipR) navLinks.classList.add("fade-both");
        else if (clipL) navLinks.classList.add("fade-left");
        else if (clipR) navLinks.classList.add("fade-right");
      }

      function scrollNavItemIntoView(btn) {
        if (!btn || !navLinks) return;
        if (getComputedStyle(stickyChrome).position === "static") return;
        if (navLinks.scrollWidth <= navLinks.clientWidth + 1) return;
        const cRect = navLinks.getBoundingClientRect();
        const bRect = btn.getBoundingClientRect();
        if (bRect.left >= cRect.left + 8 && bRect.right <= cRect.right - 8) return;
        const delta = (bRect.left - cRect.left) - (cRect.width - bRect.width) / 2;
        navLinks.scrollTo({ left: navLinks.scrollLeft + delta, behavior: "smooth" });
      }

      function syncNavDimming() {
        const visSet = new Set(getVisibleNavIds());
        navLinks.querySelectorAll(".nav-link").forEach((b) => {
          b.classList.toggle("is-dimmed", activeView === "brief" && !visSet.has(b.dataset.target));
        });
        marginRail.querySelectorAll(".rail-item").forEach((b) => {
          b.style.opacity = (activeView !== "brief" || visSet.has(b.dataset.target)) ? "" : "0.45";
        });
      }

      function setActiveNav(id, scrollNavIntoView) {
        activeNav = id;
        navLinks.querySelectorAll(".nav-link").forEach((b) => {
          const active = activeView === "brief" && b.dataset.target === id;
          b.classList.toggle("is-active", active);
          if (active) b.setAttribute("aria-current", "location");
          else b.removeAttribute("aria-current");
          if (active && scrollNavIntoView) scrollNavItemIntoView(b);
        });
        marginRail.querySelectorAll(".rail-item").forEach((b) => {
          const active = activeView === "brief" && b.dataset.target === id;
          b.classList.toggle("is-active", active);
          if (active) b.setAttribute("aria-current", "location");
          else b.removeAttribute("aria-current");
        });
        briefMain.querySelectorAll(".mob-sec-chip[data-jump-sec]").forEach((c) => {
          c.classList.toggle("is-active", c.dataset.jumpSec === id);
        });
      }

      function showReturnToast(fromSecId, prevScrollY) {
        if (!data || !data[lang]) return;
        const d = data[lang];
        const ui = d.ui || {};
        const sec = d.sections && d.sections[fromSecId];
        if (!sec) return;
        const label = sec.num + " " + ((ui.nav && ui.nav[fromSecId]) || sec.title);
        returnOrigin = { secId: fromSecId, scrollY: prevScrollY };
        returnGoBtn.innerHTML = ICO_RETURN + "<span>" + esc((ui.returnTo || "Back to {sec}").replace("{sec}", label)) + "</span>";
        returnDismissBtn.setAttribute("aria-label", ui.dismiss || "Close");
        returnToast.classList.add("is-visible");
        clearTimeout(returnTimer);
        returnTimer = window.setTimeout(hideReturnToast, 12000);
      }

      function hideReturnToast() {
        clearTimeout(returnTimer);
        returnToast.classList.remove("is-visible");
        returnOrigin = null;
      }

      function switchView(nextView, animate) {
        if (!data || !data[lang]) return;
        if (nextView === "notes" && !isMobileViewport()) {
          setNotesOpen(!notesOpen, false);
          return;
        }
        hideSelPop();
        hideQuickPop();
        toggleReadPop(false);
        if (nextView !== "brief") setMobileSearchOpen(false, false);
        activeView = nextView;
        renderActiveView(Boolean(animate));
        syncMobileTabBar();
        setActiveNav(activeNav, false);
        syncNavDimming();
        window.scrollTo({ top: 0, behavior: "instant" });
        updateScrollUI();
      }

      function jumpToSection(id, opts) {
        const options = opts || {};
        if (document.activeElement === searchInput) searchInput.blur();
        hideQuickPop();
        toggleReadPop(false);
        hideSelPop();

        if (activeView !== "brief") {
          activeView = "brief";
          renderBrief(false);
          syncMobileTabBar();
        }
        const itemKey = options.itemKey || "";
        let targetEl = itemKey ? document.getElementById("item-" + itemKey) : document.getElementById("sec-" + id);
        if (!targetEl && (searchQuery || activeLens !== "all")) {
          searchQuery = "";
          searchInput.value = "";
          activeLens = "all";
          renderBrief(false);
          targetEl = itemKey ? document.getElementById("item-" + itemKey) : document.getElementById("sec-" + id);
        }
        if (!targetEl) targetEl = document.getElementById("sec-" + id);
        if (!targetEl) return;

        if (options.fromSec && (options.fromSec !== id || window.scrollY < 160)) {
          showReturnToast(options.fromSec, window.scrollY);
        }
        if (itemKey && density === "brief" && targetEl.hasAttribute("data-exp-card")) {
          toggleItemInPlace(itemKey, true);
        }
        spyLockUntil = Date.now() + 780;
        setActiveNav(id, true);
        const extraPad = itemKey ? 8 : 0;
        const top = Math.max(0, targetEl.getBoundingClientRect().top + window.scrollY - getStickyOffset() - extraPad);
        window.scrollTo({ top, behavior: "smooth" });
        targetEl.classList.remove("is-pulsed");
        void targetEl.offsetWidth;
        targetEl.classList.add("is-pulsed");
      }

      function stepSection(dir) {
        if (activeView !== "brief") { switchView("brief", false); return; }
        const vis = getVisibleNavIds();
        if (!vis.length) return;
        let idx = vis.indexOf(activeNav);
        if (idx === -1) idx = 0;
        const nextIdx = Math.max(0, Math.min(vis.length - 1, idx + dir));
        if (nextIdx !== idx || !document.getElementById("sec-" + activeNav)) {
          jumpToSection(vis[nextIdx]);
        }
      }

      function scrollToTopSmooth() {
        spyLockUntil = Date.now() + 650;
        const vis = getVisibleNavIds();
        if (vis.length) setActiveNav(vis[0], true);
        window.scrollTo({ top: 0, behavior: "smooth" });
      }

      function updateScrollUI() {
        if (!data || appShell.hidden) return;
        const sy = window.scrollY || 0;
        const maxScroll = Math.max(1, document.documentElement.scrollHeight - window.innerHeight);
        const pct = Math.max(0, Math.min(1, sy / maxScroll));
        const tf = "scaleX(" + pct.toFixed(4) + ")";
        readProgressFill.style.transform = tf;
        mobProgressFill.style.transform = tf;

        stickyChrome.classList.toggle("is-scrolled", sy > 10);
        floatTopBtn.classList.toggle("is-visible", sy > 360);

        const railTop = marginRail.querySelector(".rail-top-btn");
        if (railTop) railTop.classList.toggle("is-dim", sy < 240);
        const railFill = marginRail.querySelector(".rail-progress-fill");
        if (railFill) railFill.style.transform = "scaleY(" + pct.toFixed(4) + ")";

        if (activeView !== "brief" || Date.now() < spyLockUntil) return;
        const vis = getVisibleNavIds();
        if (!vis.length) return;

        if (sy + window.innerHeight >= document.documentElement.scrollHeight - 28) {
          const lastId = vis[vis.length - 1];
          if (lastId !== activeNav) setActiveNav(lastId, true);
          return;
        }

        const offset = getStickyOffset() + 42;
        let bestId = vis[0];
        let bestTop = -Infinity;
        for (let i = 0; i < vis.length; i++) {
          const id = vis[i];
          const el = document.getElementById("sec-" + id);
          if (!el) continue;
          const top = el.getBoundingClientRect().top;
          if (top <= offset && top > bestTop) {
            bestTop = top;
            bestId = id;
          }
        }
        if (bestId !== activeNav) setActiveNav(bestId, true);
      }

      /* Search Match Stepper & Quick Filters */
      function refreshSearchMarks(preserveIdx) {
        const prevIdx = preserveIdx ? activeMarkIdx : -1;
        searchMarks = Array.from(briefMain.querySelectorAll("mark.hl")).filter((m) => {
          if (m.closest(".brief-root.is-brief .expandable:not(.is-open):not(.is-search-open) .detail-collapse")) return false;
          const rect = m.getBoundingClientRect();
          return rect.width > 0 && rect.height > 0;
        });
        if (prevIdx >= 0 && prevIdx < searchMarks.length) {
          activeMarkIdx = prevIdx;
          searchMarks[activeMarkIdx].classList.add("is-current");
          searchCount.textContent = (activeMarkIdx + 1) + "/" + searchMarks.length;
        } else {
          activeMarkIdx = -1;
        }
        setHidden(searchStepGroup, !searchQuery.trim() || searchMarks.length === 0);
      }

      function stepSearchMatch(dir) {
        if (!searchMarks.length) return;
        if (activeMarkIdx >= 0 && searchMarks[activeMarkIdx]) {
          searchMarks[activeMarkIdx].classList.remove("is-current");
        }
        if (activeMarkIdx === -1) activeMarkIdx = dir >= 0 ? 0 : searchMarks.length - 1;
        else activeMarkIdx = (activeMarkIdx + dir + searchMarks.length) % searchMarks.length;
        const cur = searchMarks[activeMarkIdx];
        cur.classList.add("is-current");
        cur.scrollIntoView({ behavior: "smooth", block: "center" });
        searchCount.textContent = (activeMarkIdx + 1) + "/" + searchMarks.length;
      }

        if (!data || !data[lang]) return;

      function formatSearchCountText(matchTotal, ui) {
        const fullTxt = matchTotal === 0
          ? (ui && ui.searchNoMatch ? ui.searchNoMatch : "0")
          : (ui && ui.searchMatches ? ui.searchMatches.replace("{n}", String(matchTotal)) : String(matchTotal));
        return {
          fullTxt,
          displayTxt: window.innerWidth <= 639 ? fullTxt : String(matchTotal)
        };
      }

      function updateSearchChrome(matchTotal, qNorm, preserveMarkIdx) {
        const ui = data && data[lang] && data[lang].ui;
        const hasQ = Boolean(qNorm);
        lastSearchMatchTotal = hasQ ? matchTotal : 0;
        searchShell.classList.toggle("has-query", hasQ);
        setHidden(searchKbd, hasQ);
        setHidden(searchClear, !hasQ);
        setHidden(searchCount, !hasQ);
        if (hasQ && ui) {
          const fmtCnt = formatSearchCountText(matchTotal, ui);
          searchCount.textContent = fmtCnt.displayTxt;
          searchCount.setAttribute("title", fmtCnt.fullTxt);
          searchCount.setAttribute("aria-label", fmtCnt.fullTxt);
          searchCount.classList.toggle("is-zero", matchTotal === 0);
          searchPrev.setAttribute("aria-label", ui.matchPrev || "Previous match");
          searchPrev.setAttribute("title", ui.matchPrev || "Previous match");
          searchNext.setAttribute("aria-label", ui.matchNext || "Next match");
          searchNext.setAttribute("title", ui.matchNext || "Next match");
        } else {
          searchCount.textContent = "";
          searchCount.classList.remove("is-zero");
          searchCount.removeAttribute("title");
          searchCount.removeAttribute("aria-label");
        }
        refreshSearchMarks(Boolean(preserveMarkIdx));
        requestAnimationFrame(syncNavFade);
      }

      /* Mobile Sheet & Keyboard Shortcuts Modal */
      function syncOverlayBodyLock() {
        const mobileDrawerOpen = notesOpen && window.innerWidth < 1180;

        document.body.classList.toggle("has-overlay", open);

      function getFocusables(container) {
        return Array.from(container.querySelectorAll('button:not([disabled]), [href], input:not([disabled]), textarea:not([disabled]), [tabindex]:not([tabindex="-1"])'))
          .filter((el) => el.offsetParent !== null);
      }

      function trapDialogFocus(e, container) {
        if (e.key !== "Tab") return;
        const focusables = getFocusables(container);
        if (!focusables.length) return;
        const first = focusables[0];
        const last = focusables[focusables.length - 1];
        if (e.shiftKey) {
          if (document.activeElement === first || !container.contains(document.activeElement)) {
            e.preventDefault();
            last.focus();
          }
        } else if (document.activeElement === last || !container.contains(document.activeElement)) {
          e.preventDefault();
          first.focus();
        }
      }

      /* Interactive Tooltip Engine (Lab Gauges & Biomarkers) */
      function showTooltip(title, body, clientX, clientY) {
        if (!title && !body) return;
        const isRtlTip = root.dir === "rtl";
        vizTooltip.innerHTML =
          (title ? '<div class="viz-tip-title">' + fmt(title, isRtlTip, "") + "</div>" : "")
          + (body ? '<div class="viz-tip-body">' + fmt(body, isRtlTip, "") + "</div>" : "");
        vizTooltip.classList.add("is-visible");
        vizTooltip.setAttribute("aria-hidden", "false");
        const tw = vizTooltip.offsetWidth || 200;
        const th = vizTooltip.offsetHeight || 46;
        const pad = 12;
        let x = clientX - tw / 2;
        if (x < pad) x = pad;
        if (x + tw > window.innerWidth - pad) x = window.innerWidth - tw - pad;
        const minTop = Math.max(pad, stickyChrome ? Math.ceil(stickyChrome.getBoundingClientRect().bottom) + 6 : pad);
        const maxBottom = Math.max(minTop, window.innerHeight - th - (isMobileViewport() ? 68 : pad));
        let y = clientY - th - 14;
        if (y < minTop) y = clientY + 18;
        y = Math.max(minTop, Math.min(maxBottom, y));
        vizTooltip.style.transform = "translate3d(" + Math.round(x) + "px," + Math.round(y) + "px,0)";
      }

      function hideTooltip() {
        vizTooltip.classList.remove("is-visible");
        vizTooltip.setAttribute("aria-hidden", "true");
      }

      /* =======================================================================
         LAB BIOMARKER GAUGES
         ======================================================================= */
      function renderSpotlightGauge(lb, refLbl) {
        const span = Math.max(0.1, lb.max - lb.min);
        const pct = (v) => Math.max(0, Math.min(100, ((v - lb.min) / span) * 100));
        const zL = pct(lb.rLow);
        const zR = pct(lb.rHigh);
        const cX = Math.max(2, Math.min(98, pct(lb.curr)));

        const tipT = esc(lb.label + " (" + lb.date + ")");
        const tipB = esc(lb.currStr + " " + lb.unit + " · " + (refLbl || "Ref") + " " + lb.ref + (lb.note ? " — " + lb.note : ""));

        return '<div class="spot-gauge" dir="ltr" role="img" aria-label="' + tipT + ": " + tipB + '">'
          + '<div class="spot-track">'
            + '<span class="spot-caution" style="width:' + zL.toFixed(2) + '%"></span>'
            + '<span class="spot-zone" style="left:' + zL.toFixed(2) + "%;width:" + Math.max(3, zR - zL).toFixed(2) + '%"></span>'
            + '<span class="spot-marker" tabindex="0" style="left:' + cX.toFixed(2) + '%" data-tip-title="' + tipT + '" data-tip-body="' + tipB + '"></span>'
          + "</div>"
          + '<div class="spot-ticks" aria-hidden="true">'
            + '<span class="spot-tick" style="left:' + Math.max(6, Math.min(94, zL)).toFixed(2) + '%">' + esc(lb.rLow.toFixed(1)) + "</span>"
            + '<span class="spot-tick" style="left:' + Math.max(6, Math.min(94, zR)).toFixed(2) + '%">' + esc(lb.rHigh.toFixed(1)) + "</span>"
          + "</div>"
        + "</div>";
      }

      function renderMiniBar(lb, qNorm) {
        const span = Math.max(0.01, lb.max - lb.min);
        const clamp = (v) => Math.max(2, Math.min(98, ((v - lb.min) / span) * 100));
        const zL = Math.max(0, Math.min(100, ((lb.rLow - lb.min) / span) * 100));
        const zR = Math.max(0, Math.min(100, ((lb.rHigh - lb.min) / span) * 100));
        const cP = clamp(lb.curr);
        let prevHtml = "";
        if (typeof lb.prev === "number") {
          const pP = clamp(lb.prev);
          const dL = Math.min(pP, cP);
          const dW = Math.abs(cP - pP);
          prevHtml = '<span class="mini-delta" style="left:' + dL.toFixed(1) + "%;width:" + dW.toFixed(1) + '%"></span>'
            + '<span class="mini-dot-prev" style="left:' + pP.toFixed(1) + '%"></span>';
        }
        return '<div class="mini-viz" dir="ltr">'
          + '<div class="mini-track" aria-hidden="true">'
            + '<span class="mini-zone" style="left:' + zL.toFixed(1) + "%;width:" + Math.max(3, zR - zL).toFixed(1) + '%"></span>'
            + prevHtml
            + '<span class="mini-dot-curr" style="left:' + cP.toFixed(1) + '%"></span>'
          + "</div>"
          + (lb.ref ? '<span class="mini-ref">' + fmt(lb.ref, false, qNorm) + "</span>" : "")
          + "</div>";
      }

      /* =======================================================================

      function renderExpandBtn(key, expandedNow, ui, hideForSearch) {
        if (density !== "brief" || hideForSearch) return "";
        const fullLbl = expandedNow ? (ui.collapseDetail || "Hide detail") : (ui.expandDetail || "Show detail");
        const shortLbl = expandedNow ? (ui.collapseShort || "Hide") : (ui.expandShort || "Details");
        return '<button class="item-expand" type="button" data-item-key="' + esc(key) + '" aria-expanded="' + (expandedNow ? "true" : "false") + '" aria-label="' + esc(fullLbl) + '" title="' + esc(fullLbl) + '"><span>' + esc(shortLbl) + "</span>" + ICO_CHEV + "</button>";
      }

      function renderTags(tags, isRtl, qNorm) {
        if (!Array.isArray(tags) || !tags.length) return "";
        return '<div class="item-tags">'
          + tags.map((t) => '<span class="item-tag">' + fmt(t, isRtl, qNorm) + "</span>").join("")
          + "</div>";
      }

      function renderDetailBlock(item, itemKey, secId, ui, isRtl, qNorm) {
        if (!hasItemDetail(item)) return "";
        const colonSep = lang === "fr" ? "\u00A0: " : ": ";
        let inner = "";
        if (Array.isArray(item.detailPoints) && item.detailPoints.length) {
          inner = '<ul class="detail-points">'
            + item.detailPoints.map((pt, idx) => {
                const bid = itemKey + ":dp-" + idx;
                const saved = Boolean(findBulletPassage(bid));
                const bLbl = saved ? (ui.saveBulletRemove || "Remove saved passage") : (ui.saveBulletAdd || "Save this passage");
                return '<li class="detail-point">'
                  + '<span class="dp-txt">'
                    + (pt.label ? '<strong class="dp-lbl">' + fmt(pt.label, isRtl, qNorm) + colonSep + "</strong>" : "")
                    + fmt(pt.text, isRtl, qNorm)
                  + "</span>"
                  + '<button class="bullet-save-btn' + (saved ? " is-saved" : "") + '" type="button" data-save-bullet="' + esc(bid) + '" data-b-sec="' + esc(secId) + '" data-b-key="' + esc(itemKey) + '" data-b-lbl="' + esc(pt.label || "") + '" data-b-txt="' + esc(pt.text || "") + '" aria-pressed="' + (saved ? "true" : "false") + '" aria-label="' + esc(bLbl) + '" title="' + esc(bLbl) + '">' + ICO_BM + "</button>"
                + "</li>";
              }).join("")
            + "</ul>";

        return '<div class="detail-collapse"><div class="detail-inner"><div class="detail-body">' + inner + "</div></div></div>";

        const savedCnt = getSavedTotalCount();

              + "</div>"
              + '<span class="iv-meta-acts">'

              ? '<textarea class="iv-answer-ta" dir="auto" data-iv-probe-ans="' + esc(pr.id) + '" data-iv-ta="' + esc(noteId) + '" placeholder="' + esc(ui.answerPh || "Patient response...") + '">' + esc(val) + "</textarea>"

        const savedCards = ALL_ITEM_KEYS.filter((k) => pinnedItems.has(k));

              ["all", (ui.savedTabAll || "All") + " (" + totalAll + ")"],

              ["asks", (ui.savedTabAsks || "To Ask") + " (" + askCards.length + ")"]

              '<button class="lens-pill' + (savedTab === tid ? " is-active" : "") + '" type="button" data-saved-tab="' + tid + '" aria-pressed="' + (savedTab === tid ? "true" : "false") + '">' + esc(lbl) + "</button>"

                  + '<span class="saved-src">'

                  + "</span>"
                  + '<span class="iv-meta-acts">'
                    + '<button class="iv-jump-btn" type="button" data-jump-sec="' + esc(p.secId) + '" data-jump-item="' + esc(p.sourceKey) + '">' + ICO_JUMP + "<span>" + esc(ui.jumpToContext || "Jump") + "</span></button>"

                  + "</span>"
                + "</div>"
                + '<blockquote class="saved-excerpt" dir="auto">' + fmt(p.text, isRtl, "") + "</blockquote>"
                + '<input class="saved-note-in" type="text" dir="auto" data-saved-note="' + esc(p.id) + '" value="' + esc(p.note || "") + '" placeholder="' + esc(ui.savedNotePh || "Quick note...") + '" />'
              + "</article>"

        if (savedTab === "all" || savedTab === "cards") {

              '<article class="saved-quote-card is-card-bm">'

                    + '<button class="iv-jump-btn" type="button" data-jump-sec="' + esc(meta.secId) + '" data-jump-item="' + esc(k) + '">' + ICO_JUMP + "<span>" + esc(ui.jumpToContext || "Jump") + "</span></button>"
                    + '<button class="drawer-mini-btn is-pinned" type="button" data-save-card="' + esc(k) + '" title="' + esc(ui.saveCardRemove || "Remove") + '">' + ICO_BM + "</button>"
                  + "</span>"
                + "</div>"
