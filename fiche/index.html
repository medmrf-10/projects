      place-items: center;
      font-family: var(--font-mono);
      font-size: 0.7rem;
      font-weight: 700;
      color: var(--teal-text);
      font-variant-numeric: tabular-nums;
      flex-shrink: 0;
    }
    .q-body { min-width: 0; }
    .q-lead { margin: 0 0 4px; font-size: 0.92rem; font-weight: 700; color: var(--text); line-height: 1.35; overflow-wrap: break-word; }
    .q-text { margin: 0; font-size: 0.855rem; color: var(--text-2); line-height: 1.54; overflow-wrap: break-word; }
    .q-check {
      width: 24px;
      height: 24px;
      border-radius: 999px;
      border: 1.5px solid var(--border-strong);
      background: var(--bg);
      color: transparent;
      display: inline-grid;
      place-items: center;
      cursor: pointer;
      padding: 0;
      flex-shrink: 0;
      transition: background-color 150ms ease, border-color 150ms ease, color 150ms ease, transform 120ms ease;
    }
    .q-check:hover { border-color: var(--teal); transform: scale(1.06); }
    .q-item.is-done .q-check {
      background: var(--teal-btn);
      border-color: var(--teal-btn);
      color: #FFFFFF;
    }
    .q-foot {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      padding-inline-start: 0;
    }

    /* Editorial End-Cap Footer (Screen-Only) */
    .brief-endcap {
      margin-top: 40px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: flex-end;
    }
    .endcap-actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      flex-wrap: wrap;
      gap: 8px;
      max-width: 100%;
    }
    .endcap-btn {
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-2);
      border-radius: 999px;
      padding: 4px 12px;
      font-size: 0.74rem;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      cursor: pointer;
      transition: border-color 150ms ease, background-color 150ms ease, color 150ms ease;
    }
    .endcap-btn:hover { border-color: var(--teal-border); background: var(--teal-soft); color: var(--teal-text); }

    /* Empty Search State */
    .search-empty {
      padding: 56px 20px;
      text-align: center;
      color: var(--text-2);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    .search-empty-title { margin: 0; font-size: 0.96rem; font-weight: 700; color: var(--text); }
    .search-empty-btn {
      border: 1px solid var(--teal-border);
      background: var(--teal-soft);
      color: var(--teal-text);
      font-size: 0.8rem;
      font-weight: 600;
      padding: 6px 15px;
      border-radius: 999px;
      cursor: pointer;
    }

    /* =========================================================================
       FLOATING NAVIGATION AIDS (BACK-TO-TOP, RETURN-TOAST, MOBILE DOCK, DRAWER, MODAL)
       ========================================================================= */
    .float-top {
      position: fixed;
      bottom: 22px;
      inset-inline-end: 22px;
      z-index: 45;
      width: 40px;
      height: 40px;
      border-radius: 999px;
      border: 1px solid var(--glass-border);
      background: var(--glass-bg);
      backdrop-filter: blur(14px) saturate(160%);
      -webkit-backdrop-filter: blur(14px) saturate(160%);
      color: var(--teal-text);
      box-shadow: var(--shadow-dock);
      display: inline-grid;
      place-items: center;
      cursor: pointer;
      opacity: 0;
      pointer-events: none;
      transform: translateY(10px) scale(0.94);
      transition: opacity 200ms var(--ease), transform 200ms var(--ease), border-color 150ms ease, background-color 150ms ease;
    }
    .float-top.is-visible { opacity: 1; pointer-events: auto; transform: translateY(0) scale(1); }
    .float-top:hover { border-color: var(--teal-border); background: var(--surface); }
    @media (min-width: 1280px) { .float-top { display: none; } }

    .return-toast {
      position: fixed;
      bottom: 22px;
      inset-inline-end: 72px;
      z-index: 50;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 6px 6px 12px;
      border-radius: 999px;
      background: var(--glass-bg);
      backdrop-filter: blur(16px) saturate(170%);
      -webkit-backdrop-filter: blur(16px) saturate(170%);
      border: 1px solid var(--teal-border);
      box-shadow: var(--shadow-dock);
      color: var(--text);
      font-size: 0.76rem;
      font-weight: 600;
      opacity: 0;
      pointer-events: none;
      transform: translateY(12px);
      transition: opacity 200ms var(--ease), transform 200ms var(--ease);
    }
    html[dir="rtl"] .return-toast { padding: 6px 12px 6px 6px; }
    @media (min-width: 1280px) { .return-toast { inset-inline-end: 24px; } }
    .return-toast.is-visible { opacity: 1; pointer-events: auto; transform: translateY(0); }
    .return-go {
      border: 0;
      background: transparent;
      color: var(--teal-text);
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      padding: 2px 4px;
      border-radius: 999px;
    }
    .return-go:hover { text-decoration: underline; }
    .return-x {
      width: 22px;
      height: 22px;
      border-radius: 999px;
      border: 0;
      background: var(--surface-2);
      color: var(--text-3);
      display: inline-grid;
      place-items: center;
      cursor: pointer;
      padding: 0;
    }
    .return-x:hover { color: var(--text); background: var(--surface-3); }

    /* Mobile Floating Bottom Navigation Capsule (<= 639px — Always Fixed & Visible) */
    .mob-dock {
      display: none;
      position: fixed;
      left: 50%;
      bottom: calc(12px + env(safe-area-inset-bottom, 0px));
      z-index: 48;
      width: min(366px, calc(100vw - 24px));
      padding: 5px;
      border-radius: 999px;
      background: var(--glass-bg);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      border: 1px solid var(--glass-border);
      box-shadow: var(--shadow-dock);
      align-items: center;
      justify-content: space-between;

    .mob-dock-btn {
      width: 36px;
      height: 36px;
      border-radius: 999px;
      border: 0;
      background: transparent;
      color: var(--text-2);

      flex-shrink: 0;

    .mob-dock-center {
      flex: 1 1 auto;

      height: 36px;

    /* Mobile Quick-Jump Bottom Sheet Drawer */
    .sheet-backdrop, .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 90;
      background: var(--backdrop);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      display: flex;
      align-items: flex-end;
      justify-content: center;
      animation: fadeBg 180ms ease both;
    }

    .mob-sheet {
      width: 100%;
      max-width: 480px;
      background: var(--surface);
      border-top: 1px solid var(--glass-border);
      border-radius: 20px 20px 0 0;

      justify-content: space-between;
      gap: 8px;
      padding: 7px 10px;
      margin-bottom: 10px;

      border: 1px solid var(--amber-border);
      color: var(--amber-text);
      font-size: 0.76rem;
      font-weight: 600;
    }
    .sheet-filter-clear {
      border: 1px solid var(--amber-border);

      color: var(--amber-text);

      padding: 2px 9px;
      font-size: 0.72rem;
      font-weight: 700;
      cursor: pointer;
      flex-shrink: 0;
    }
    @keyframes sheetUp { from { transform: translateY(28px); opacity: 0.5; } to { transform: translateY(0); opacity: 1; } }
    .sheet-handle {
      width: 36px;
      height: 4px;
      border-radius: 999px;
      background: var(--border-strong);
      margin: 0 auto 12px;
    }
    .sheet-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
      padding: 0 4px;
    }
    .sheet-title { margin: 0; font-size: 0.92rem; font-weight: 700; color: var(--text); }
    .sheet-list {
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-bottom: 14px;
    }
    .sheet-item {
      border: 1px solid transparent;
      background: transparent;
      color: var(--text);

      border-radius: 11px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;

      transition: background-color 140ms ease, border-color 140ms ease;
    }
    .sheet-item:hover { background: var(--surface-2); }
    .sheet-item.is-active {

      border-color: var(--teal-border);
    }
    .sheet-item-l { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .sheet-num {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--teal-text);
      background: var(--surface-2);
      border-radius: 6px;
      padding: 2px 6px;
      flex-shrink: 0;
    }
    .sheet-item.is-active .sheet-num { background: var(--teal-btn); color: #FFFFFF; }
    .sheet-lbl { font-size: 0.87rem; font-weight: 600; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .sheet-quick-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
      padding-top: 12px;
      border-top: 1px solid var(--border);
    }
    .sheet-pill-row { display: inline-flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .sheet-act-btn {
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--text-2);
      border-radius: 8px;
      height: 34px;
      padding: 0 11px;
      font-size: 0.76rem;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }
    .sheet-act-btn.is-active { background: var(--teal-btn); border-color: var(--teal-btn); color: #FFFFFF; }

    /* Keyboard Shortcuts Modal */
    .sc-modal {
      width: 100%;
      max-width: 430px;
      max-height: calc(100vh - 32px);
      max-height: calc(100dvh - 32px);
      overflow-y: auto;
      background: var(--surface);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      padding: 20px 22px 18px;
      box-shadow: var(--shadow-gate);
      animation: popIn 180ms var(--ease) both;
    }
    .sc-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }
    .sc-title { margin: 0; font-size: 0.96rem; font-weight: 700; color: var(--text); }
    .sc-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .sc-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 6px 0;
      border-bottom: 1px solid var(--border-subtle);
      font-size: 0.81rem;
      color: var(--text-2);
    }
    .sc-row:last-child { border-bottom: 0; }
    .sc-keys { display: inline-flex; align-items: center; gap: 4px; flex-shrink: 0; direction: ltr; }
    .sc-k {
      font-family: var(--font-mono);
      font-size: 0.69rem;
      font-weight: 700;
      color: var(--text);
      background: var(--surface-2);
      border: 1px solid var(--border-strong);
      border-bottom-width: 2px;
      border-radius: 5px;
      padding: 1.5px 6px;
      line-height: 1.3;
    }

    /* Interactive SVG Floating Tooltip */
    .viz-tooltip {
      position: fixed;
      top: 0;
      left: 0;
      z-index: 80;
      max-width: 295px;
      padding: 8px 12px;
      border-radius: 9px;
      background: var(--glass-bg);
      backdrop-filter: blur(14px) saturate(160%);
      -webkit-backdrop-filter: blur(14px) saturate(160%);
      border: 1px solid var(--glass-border);
      box-shadow: var(--shadow-tip);
      color: var(--text);
      font-size: 0.76rem;
      line-height: 1.44;
      pointer-events: none;
      opacity: 0;
      transform: translate3d(-9999px, -9999px, 0);
      transition: opacity 110ms ease;
    }
    .viz-tooltip.is-visible { opacity: 1; }
    .viz-tip-title { font-weight: 700; color: var(--text); margin-bottom: 2px; }
    .viz-tip-body { color: var(--text-2); font-variant-numeric: tabular-nums; }

    /* =========================================================================
       SLIDE-OVER / DOCKED CLINICIAN NOTES & ANNOTATIONS DRAWER
       ========================================================================= */
    .notes-backdrop {
      position: fixed;
      inset: 0;
      z-index: 84;
      background: var(--backdrop);
      backdrop-filter: blur(3px);
      -webkit-backdrop-filter: blur(3px);
      animation: fadeBg 180ms ease both;
    }
    .notes-drawer {
      position: fixed;
      top: 0;
      bottom: 0;
      inset-inline-end: 0;
      z-index: 85;
      width: min(392px, 100vw);
      background: var(--surface);
      border-inline-start: 1px solid var(--border-strong);
      box-shadow: var(--shadow-gate);
      display: flex;
      flex-direction: column;
      font-size: 13.5px;
      animation: drawerSlideIn 210ms var(--ease) both;
    }
    @keyframes drawerSlideIn {
      from { transform: translateX(100%); opacity: 0.6; }
      to { transform: translateX(0); opacity: 1; }
    }
    html[dir="rtl"] .notes-drawer { animation-name: drawerSlideInRtl; }
    @keyframes drawerSlideInRtl {
      from { transform: translateX(-100%); opacity: 0.6; }
      to { transform: translateX(0); opacity: 1; }
    }
    @media (min-width: 1180px) {
      .notes-backdrop { display: none !important; }
      .notes-drawer {
        top: 55px;
        width: 372px;
        z-index: 38;
        box-shadow: -8px 0 28px -18px rgba(15, 23, 42, 0.22);
      }
      html[dir="rtl"] .notes-drawer {
        box-shadow: 8px 0 28px -18px rgba(15, 23, 42, 0.22);
      }
      body.notes-open .brief-main {
        margin-inline-start: max(0px, calc((100vw - 372px - min(var(--col-w), 100vw - 372px)) / 2));
        margin-inline-end: 372px;
      }
      body.notes-open .margin-rail {
        opacity: 0;
        pointer-events: none;
      }
      body.notes-open .return-toast { inset-inline-end: 392px; }
      body.notes-open .float-top { inset-inline-end: 392px; }
    }
    @media (min-width: 1180px) and (max-width: 1340px) {
      body.notes-open .triage-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      body.notes-open .goals-list { grid-template-columns: 1fr; }
      body.notes-open .repleted-grid { grid-template-columns: 1fr; }
      body.notes-open .normal-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

    .drawer-head {
      padding: 14px 16px 12px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
      flex-shrink: 0;
    }
    .drawer-title {
      margin: 0;
      font-size: 15px;
      font-weight: 700;
      color: var(--text);
      line-height: 1.25;
    }
    .drawer-sub {
      margin: 3px 0 0;
      font-size: 11.5px;
      color: var(--text-3);
      line-height: 1.38;
    }
    .drawer-body {
      flex: 1 1 auto;
      overflow-y: auto;
      padding: 14px 16px 18px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .drawer-block-lbl {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 6px;
      font-size: 11px;
      font-weight: 750;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-3);
    }
    html[dir="rtl"] .drawer-block-lbl { text-transform: none; letter-spacing: 0; font-size: 12px; }
    .drawer-tpl-row {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin-bottom: 7px;
    }
    .drawer-tpl-btn {
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text-2);
      border-radius: 999px;
      padding: 2.5px 9px;
      font-size: 11.2px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 140ms ease, border-color 140ms ease, color 140ms ease;
    }
    .drawer-tpl-btn:hover {
      background: var(--teal-soft);
      border-color: var(--teal-border);
      color: var(--teal-text);
    }
    .drawer-textarea {
      width: 100%;
      min-height: 74px;
      resize: vertical;
      border: 1px solid var(--border-strong);
      border-radius: 9px;
      background: var(--bg);
      color: var(--text);
      padding: 9px 11px;
      font-size: 13px;
      line-height: 1.54;
      display: block;
    }
    .drawer-textarea:focus {
      outline: none;
      border-color: var(--teal);
      box-shadow: 0 0 0 2.5px var(--teal-soft);
      background: var(--surface);
    }
    .drawer-textarea::placeholder { color: var(--text-3); }

    .drawer-feed {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .drawer-empty {
      margin: 0;
      padding: 14px 12px;
      border-radius: 9px;
      border: 1px dashed var(--border-strong);
      background: var(--bg);
      color: var(--text-3);
      font-size: 12.2px;
      line-height: 1.5;
    }
    .drawer-item {
      padding: 10px 11px;
      border-radius: 9px;
      background: var(--bg);
      border: 1px solid var(--border);
      transition: border-color 140ms ease, background-color 140ms ease;
    }
    .drawer-item.is-pinned { border-inline-start: 2.5px solid var(--amber); }
    .drawer-item:hover { border-color: var(--border-strong); }
    .drawer-item-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 6px;
      margin-bottom: 4px;
    }
    .drawer-item-jump {
      border: 0;
      background: transparent;
      padding: 0;
      text-align: start;
      cursor: pointer;
      display: flex;
      align-items: baseline;
      gap: 6px;
      min-width: 0;
      flex: 1 1 auto;
    }
    .drawer-item-num {
      font-family: var(--font-mono);
      font-size: 10.5px;
      font-weight: 700;
      color: var(--teal-text);
      background: var(--teal-soft);
      border-radius: 5px;
      padding: 1px 5px;
      flex-shrink: 0;
    }
    .drawer-item-title {
      font-size: 12.5px;
      font-weight: 700;
      color: var(--text);
      line-height: 1.32;
    }
    .drawer-item-jump:hover .drawer-item-title { color: var(--teal-text); text-decoration: underline; }
    .drawer-item-acts {
      display: inline-flex;
      align-items: center;
      gap: 2px;
      flex-shrink: 0;
    }
    .drawer-mini-btn {
      width: 22px;
      height: 22px;
      border-radius: 5px;
      border: 0;
      background: transparent;
      color: var(--text-3);
      display: inline-grid;
      place-items: center;
      cursor: pointer;
      padding: 0;
    }
    .drawer-mini-btn:hover { background: var(--surface-2); color: var(--text); }
    .drawer-mini-btn.is-pinned { color: var(--amber-text); }
    .drawer-mini-btn.is-pinned svg { fill: currentColor; }
    .drawer-mini-btn.is-del:hover { color: var(--err); background: var(--err-soft); }
    .drawer-item-note {
      margin: 4px 0 0;
      font-size: 12.2px;
      color: var(--text-2);
      line-height: 1.48;
      white-space: pre-wrap;
      overflow-wrap: break-word;
      unicode-bidi: plaintext;
    }
    .drawer-item-pin-lbl {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      font-weight: 600;
      color: var(--amber-text);
      margin-top: 2px;
    }

    .drawer-foot {
      padding: 12px 16px calc(14px + env(safe-area-inset-bottom, 0px));
      border-top: 1px solid var(--border);
      background: var(--surface);
      display: flex;
      flex-direction: column;
      gap: 10px;
      flex-shrink: 0;
    }
    .drawer-print-toggle {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-2);
    }
    .drawer-acts {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
    }
    .drawer-act-btn {
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--text);
      border-radius: 8px;
      min-height: 33px;
      padding: 6px 9px;
      font-size: 11.4px;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4.5px;
      transition: background-color 140ms ease, border-color 140ms ease, color 140ms ease;
    }
    .drawer-act-btn:hover { background: var(--surface-hover); border-color: var(--border-strong); }
    .drawer-act-btn.is-primary {
      background: var(--teal-btn);
      border-color: var(--teal-btn);
      color: #FFFFFF;
      flex: 1 1 auto;
    }
    .drawer-act-btn.is-primary:hover { background: var(--teal-btn-hover); }
    .drawer-act-btn.is-danger { color: var(--err); border-color: var(--coral-border); background: transparent; }
    .drawer-act-btn.is-danger:hover { background: var(--err-soft); }
    .drawer-act-btn:disabled { opacity: 0.4; pointer-events: none; }

    /* =========================================================================
       V4: ZERO-TYPING 1-TAP CONTROLS, INTERVIEW GUIDE & SAVED ARCHIVE
       ========================================================================= */
    .card-act-btn.is-asked {
      color: var(--info-text);
      background: var(--info-soft);
      border-color: var(--info-border);
      opacity: 1;
    }
    .is-asked-card {
      border-top-color: var(--info-border) !important;
      border-bottom-color: var(--info-border) !important;
      border-inline-end-color: var(--info-border) !important;
    }
    .is-asked-card:not(.safety-card):not(.tone-alert) {
      border-inline-start-color: var(--info-border) !important;
    }
    .card-act-btn.is-saved {
      color: var(--amber-text);
      background: var(--amber-soft);
      border-color: var(--amber-border);
      opacity: 1;
    }
    .card-act-btn.is-saved svg { fill: currentColor; }

    /* Per-Paragraph / Bullet Quiet Save Button */

      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
    }
    .dp-txt { flex: 1 1 auto; min-width: 0; }
    .bullet-save-btn {
      width: 22px;
      height: 22px;
      padding: 0;
      border-radius: 5px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--text-3);
      display: inline-grid;
      place-items: center;
      cursor: pointer;
      flex-shrink: 0;
      opacity: 0.34;
      margin-top: 1px;
      transition: opacity 140ms ease, background-color 140ms ease, color 140ms ease, border-color 140ms ease;

    .bullet-save-btn.is-saved { color: var(--amber-text); background: var(--amber-soft); border-color: var(--amber-border); }
    .bullet-save-btn.is-saved svg { fill: currentColor; }

      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 6px;
    }
    .chief-head .kicker { margin: 0; }

    .lens-sep {
      width: 1px;
      height: 18px;
      background: var(--border-strong);
      margin: 0 2px;
      flex-shrink: 0;
    }
    .lens-pill.is-view {
      border-color: var(--teal-border);
      background: var(--teal-wash);
      color: var(--teal-text);
    }
    .lens-pill.is-view.is-active {
      background: var(--teal-btn);
      border-color: var(--teal-btn);
      color: #FFFFFF;
    }

      border-color: var(--amber-border);
      background: var(--amber-soft);
      color: var(--amber-text);
    }

      border-color: var(--amber-btn);
      color: #FFFFFF;

      font-size: 0.66rem;

      padding: 0 5px;
      border-radius: 999px;
      background: rgba(15, 23, 42, 0.08);
      font-variant-numeric: tabular-nums;
    }
    html[data-theme="dark"] .lens-cnt { background: rgba(248, 250, 252, 0.14); }
    .lens-pill.is-active .lens-cnt { background: rgba(255, 255, 255, 0.24); color: #FFFFFF; }

    /* Dedicated Workspace Views (Entretien / Saved Archive / Mobile Notes) */
    .ws-view {
      display: flex;
      flex-direction: column;
      gap: 18px;
      animation: briefFade 180ms var(--ease) both;
    }
    .ws-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px 16px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--border);
    }
    .ws-title {
      margin: 0 0 4px;
      font-family: var(--font-display);
      font-size: 1.32rem;
      font-weight: 750;
      color: var(--text);
      line-height: 1.25;
    }
    html[dir="rtl"] .ws-title { font-family: var(--font-ar); }
    .ws-sub { margin: 0; font-size: 0.84rem; color: var(--text-3); line-height: 1.5; }
    .ws-block-title {
      margin: 0 0 10px;
      font-size: 0.74rem;
      font-weight: 750;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-3);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    html[dir="rtl"] .ws-block-title { text-transform: none; letter-spacing: 0; font-size: 0.82rem; }

    /* Consultation Timer Pill */
    .timer-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 6px 4px 11px;
      border-radius: 999px;
      background: var(--surface);
      border: 1px solid var(--border);
      box-shadow: var(--shadow-card);
      flex-shrink: 0;
    }
    html[dir="rtl"] .timer-pill { padding: 4px 11px 4px 6px; }
    .timer-val {
      font-family: var(--font-mono);
      font-size: 0.84rem;
      font-weight: 700;
      color: var(--teal-text);
      font-variant-numeric: tabular-nums;
      min-width: 44px;
      text-align: center;
    }
    .timer-btn {
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--text-2);
      border-radius: 999px;
      padding: 3px 9px;
      font-size: 0.7rem;
      font-weight: 700;
      cursor: pointer;
    }
    .timer-btn.is-running { background: var(--teal-btn); border-color: var(--teal-btn); color: #FFFFFF; }
    .timer-btn:hover { border-color: var(--border-strong); color: var(--text); }
    .timer-btn.is-running:hover { color: #FFFFFF; background: var(--teal-btn-hover); }

    /* Live Interview Cards */
    .iv-list { display: flex; flex-direction: column; gap: 10px; }
    .iv-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-inline-start: 3px solid var(--info);
      border-radius: var(--r-md);
      padding: 13px 15px;
      box-shadow: var(--shadow-card);
      display: flex;
      flex-direction: column;
      gap: 8px;
      transition: border-color 150ms ease, background-color 150ms ease;
    }
    .iv-card.is-probe { border-inline-start-color: var(--teal); }
    .iv-card.is-done { background: var(--teal-wash); border-color: var(--teal-border); }
    .iv-card.is-done .iv-title, .iv-card.is-done .iv-prompt { opacity: 0.72; }
    .iv-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 6px 10px;
    }
    .iv-top-l { display: flex; align-items: flex-start; gap: 9px; min-width: 0; flex: 1 1 180px; }
    .iv-check {
      width: 24px;
      height: 24px;
      border-radius: 999px;
      border: 1.5px solid var(--border-strong);
      background: var(--bg);
      color: transparent;
      display: inline-grid;
      place-items: center;
      cursor: pointer;
      flex-shrink: 0;
      margin-top: 1px;
      transition: all 140ms ease;
    }
    .iv-check:hover { border-color: var(--teal); }
    .iv-card.is-done .iv-check { background: var(--teal-btn); border-color: var(--teal-btn); color: #FFFFFF; }
    .iv-title { margin: 0; font-size: 0.91rem; font-weight: 700; color: var(--text); line-height: 1.35; overflow-wrap: break-word; }
    .iv-prompt { margin: 0; padding-inline-start: 33px; font-size: 0.83rem; color: var(--text-2); line-height: 1.52; overflow-wrap: break-word; }
    .saved-quote-card .iv-prompt,
    .iv-card > .saved-quote-head + .iv-prompt { padding-inline-start: 0; }
    .iv-meta-acts { display: inline-flex; align-items: center; gap: 5px; flex-shrink: 0; }
    .iv-jump-btn {
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--teal-text);
      border-radius: 999px;
      padding: 2.5px 9px;
      font-size: 0.7rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      white-space: nowrap;
    }
    .iv-jump-btn:hover { background: var(--teal-soft); border-color: var(--teal-border); }
    .iv-answer-ta {
      width: 100%;
      min-height: 52px;
      resize: vertical;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--bg);
      color: var(--text);
      padding: 7px 10px;
      font-size: 0.82rem;
      line-height: 1.48;
      unicode-bidi: plaintext;
    }
    .iv-answer-ta:focus { outline: none; border-color: var(--teal); background: var(--surface); box-shadow: 0 0 0 2.5px var(--teal-soft); }
    .iv-answer-ta::placeholder { color: var(--text-3); }

    /* Dedicated Saved Archive Cards */
    .saved-tabs {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
    }
    .saved-quote-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-inline-start: 3px solid var(--amber);
      border-radius: var(--r-md);
      padding: 13px 15px;
      box-shadow: var(--shadow-card);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .saved-quote-card.is-card-bm { border-inline-start-color: var(--teal); }
    .saved-quote-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
    }
    .saved-src { display: inline-flex; align-items: center; gap: 6px; min-width: 0; }
    .saved-src-title { font-size: 0.8rem; font-weight: 700; color: var(--text-2); }
    .saved-excerpt {
      margin: 0;
      padding: 8px 11px;
      border-radius: 7px;
      background: var(--bg);
      border: 1px solid var(--border-subtle);
      font-size: 0.85rem;
      color: var(--text);
      line-height: 1.58;
      unicode-bidi: plaintext;
    }
    .saved-note-in {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 7px;
      background: var(--bg);
      color: var(--text);
      padding: 6px 9px;
      font-size: 0.8rem;
      unicode-bidi: plaintext;
    }
    .saved-note-in:focus { outline: none; border-color: var(--teal); background: var(--surface); }

    /* Highlight-to-Save Floating Selection Pill */
    .sel-pop {
      position: fixed;
      top: 0;
      left: 0;
      z-index: 96;
      max-width: calc(100vw - 16px);
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px;
      border-radius: 999px;
      background: #0F172A;
      color: #FFFFFF;
      border: 1px solid rgba(255, 255, 255, 0.14);
      box-shadow: 0 10px 28px -6px rgba(15, 23, 42, 0.42);
      transform: translate3d(-9999px, -9999px, 0);
      opacity: 0;
      pointer-events: none;
      transition: opacity 130ms ease;
    }
    html[data-theme="dark"] .sel-pop { background: #1E293B; border-color: rgba(45, 212, 191, 0.35); }
    .sel-pop.is-visible { opacity: 1; pointer-events: auto; }
    .sel-pop-btn {
      border: 0;
      background: transparent;
      color: #FFFFFF;
      border-radius: 999px;
      padding: 5px 11px;
      font-size: 12px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      cursor: pointer;
      white-space: nowrap;
    }
    .sel-pop-btn:hover { background: rgba(255, 255, 255, 0.14); }
    .sel-pop-btn.is-primary { background: var(--teal-btn); }
    .sel-pop-btn.is-primary:hover { background: var(--teal-btn-hover); }

    /* Subtle Feedback Toast */
    .mini-toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translate(-50%, 14px);
      z-index: 98;
      padding: 8px 15px;
      border-radius: 999px;
      background: #0F172A;
      color: #FFFFFF;
      font-size: 12.5px;
      font-weight: 600;
      box-shadow: var(--shadow-dock);
      opacity: 0;
      pointer-events: none;
      transition: opacity 180ms ease, transform 180ms var(--ease);
      white-space: nowrap;
      max-width: calc(100vw - 28px);
      overflow: hidden;
      text-overflow: ellipsis;
    }
    html[data-theme="dark"] .mini-toast { background: #0F766E; border: 1px solid var(--teal-border); }
    .mini-toast.is-visible { opacity: 1; transform: translate(-50%, 0); }

    /* Quiet 1-Tap Clinical Card Status Stamps (✓ / ? / ✕) */
    .card-stamp-bar {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 5px;
      margin-top: 9px;
      padding-top: 7px;
      border-top: 1px dashed var(--border-subtle);
    }
    .stamp-btn {
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text-3);
      border-radius: 999px;
      padding: 2.5px 8px;
      min-height: 25px;
      font-size: 0.7rem;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      opacity: 0.72;
      transition: opacity 140ms ease, background-color 140ms ease, border-color 140ms ease, color 140ms ease, transform 110ms ease;
    }
    .prose-item:hover .stamp-btn,
    .goal-row:hover .stamp-btn,
    .safety-card:hover .stamp-btn,
    .stamp-btn:focus-visible,
    .stamp-btn.is-active {
      opacity: 1;
    }
    @media (hover: none) {
      .stamp-btn { opacity: 0.92; }
    }
    .stamp-btn:hover {
      background: var(--surface-2);
      border-color: var(--border-strong);
      color: var(--text-2);
    }
    .stamp-btn:active { transform: scale(0.96); }
    .stamp-glyph {
      font-size: 0.72rem;
      font-weight: 800;
      line-height: 1;
    }
    .stamp-btn.is-confirm.is-active {
      background: var(--teal-soft);
      border-color: var(--teal-border);
      color: var(--teal-text);
      font-weight: 700;
    }
    .stamp-btn.is-follow.is-active {
      background: var(--amber-soft);
      border-color: var(--amber-border);
      color: var(--amber-text);
      font-weight: 700;
    }
    .stamp-btn.is-exclude.is-active {
      background: var(--surface-3);
      border-color: var(--border-strong);
      color: var(--text);
      font-weight: 700;
    }
    .is-stamped-exclude .prose-brief,
    .is-stamped-exclude .goal-brief,
    .is-stamped-exclude .safety-brief {
      opacity: 0.66;
    }
    .goal-row .card-stamp-bar { gap: 4px; }
    .goal-row .stamp-btn { padding: 2px 6px; font-size: 0.66rem; gap: 3px; }

    /* Section 06 & Interview: 1-Tap Decision Chips */
    .q-chips-wrap {
      margin-top: 10px;
      padding-top: 9px;
      border-top: 1px dashed var(--border);
    }
    .q-chips-lbl {
      font-size: 0.68rem;
      font-weight: 700;
      color: var(--text-3);
      margin-bottom: 6px;
      letter-spacing: 0.015em;
    }
    .q-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .q-chip {
      border: 1px solid var(--border-strong);
      background: var(--bg);
      color: var(--text-2);
      border-radius: 8px;
      padding: 4.5px 10px;
      min-height: 30px;
      font-size: 0.75rem;
      font-weight: 600;
      line-height: 1.25;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      text-align: start;
      transition: background-color 140ms ease, border-color 140ms ease, color 140ms ease, box-shadow 140ms ease, transform 110ms ease;
    }
    .q-chip:hover {
      border-color: var(--teal-border);
      background: var(--teal-wash);
      color: var(--teal-text);
    }
    .q-chip:active { transform: scale(0.97); }
    .q-chip-mark {
      width: 14px;
      height: 14px;
      border-radius: 4px;
      border: 1.5px solid var(--border-strong);
      background: var(--surface);
      color: transparent;
      display: inline-grid;
      place-items: center;
      font-size: 9.5px;
      font-weight: 800;
      flex-shrink: 0;
      transition: all 130ms ease;
    }
    .q-chip.is-single .q-chip-mark { border-radius: 999px; }
    .q-chip.is-selected {
      background: var(--teal-btn);
      border-color: var(--teal-btn);
      color: #FFFFFF;
      box-shadow: 0 2px 8px -3px rgba(15, 118, 110, 0.45);
    }
    .q-chip.is-selected:hover {
      background: var(--teal-btn-hover);
      border-color: var(--teal-btn-hover);
      color: #FFFFFF;
    }
    .q-chip.is-selected .q-chip-mark {
      border-color: rgba(255, 255, 255, 0.85);
      background: rgba(255, 255, 255, 0.22);
      color: #FFFFFF;
    }

    /* Fast Yes / No / Later Verbal Screening Card */
    .quick-screen-card {
      margin-top: 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r-md);
      padding: 14px 15px;
      box-shadow: var(--shadow-card);
    }
    .ws-view .quick-screen-card { margin-top: 0; }
    .qs-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 11px;
    }
    .qs-title {
      margin: 0 0 2px;
      font-size: 0.88rem;
      font-weight: 750;
      color: var(--text);
      line-height: 1.3;
    }
    .qs-sub {
      margin: 0;
      font-size: 0.75rem;
      color: var(--text-3);
      line-height: 1.4;
    }
    .qs-count {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--teal-text);
      background: var(--teal-soft);
      border: 1px solid var(--teal-border);
      border-radius: 999px;
      padding: 2px 8px;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .qs-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 9px;
    }
    .qs-row {
      padding: 9px 11px;
      border-radius: var(--r-sm);
      background: var(--bg);
      border: 1px solid var(--border-subtle);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 8px;
      transition: border-color 140ms ease, background-color 140ms ease;
    }
    .qs-row.has-verdict { border-color: var(--border-strong); }
    .qs-row-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 7px;
    }
    .qs-q {
      margin: 0;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text);
      line-height: 1.4;
    }
    .qs-sec-pill {
      font-family: var(--font-mono);
      font-size: 0.64rem;
      font-weight: 700;
      color: var(--text-3);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 5px;
      padding: 1px 5px;
      flex-shrink: 0;
      cursor: pointer;
    }
    .qs-sec-pill:hover { border-color: var(--teal-border); color: var(--teal-text); }
    .qs-seg {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 4px;
    }
    .qs-btn {
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-2);
      border-radius: 7px;
      min-height: 30px;
      padding: 4px 6px;
      font-size: 0.73rem;
      font-weight: 650;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      transition: all 130ms ease;
    }
    .qs-btn:hover { border-color: var(--border-strong); color: var(--text); }
    .qs-btn:active { transform: scale(0.97); }
    .qs-btn.is-yes.is-active {
      background: var(--teal-btn);
      border-color: var(--teal-btn);
      color: #FFFFFF;
    }
    .qs-btn.is-no.is-active {
      background: var(--coral-soft);
      border-color: var(--coral-border);
      color: var(--coral-text);
      font-weight: 750;
    }
    .qs-btn.is-later.is-active {
      background: var(--amber-soft);
      border-color: var(--amber-border);
      color: var(--amber-text);
      font-weight: 750;
    }

    /* Section 06 Summary Call-to-Action Bar */
    .q-summary-cta {
      margin-top: 14px;
      padding: 11px 14px;
      border-radius: var(--r-md);
      background: var(--teal-wash);
      border: 1px solid var(--teal-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
    }
    .q-summary-cta-txt {
      font-size: 0.8rem;
      font-weight: 650;
      color: var(--teal-text);
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .q-summary-cta-acts {
      display: inline-flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 7px;
    }

    /* Automatic Consultation Decisions Summary Card (Notes Drawer & Mobile Summary Tab) */
    .auto-summary-card {
      padding: 12px 13px;
      border-radius: 10px;
      background: var(--bg);
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 11px;
    }
    .auto-sum-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 6px;
    }
    .auto-sum-title {
      font-size: 11.4px;
      font-weight: 750;
      text-transform: uppercase;
      letter-spacing: 0.055em;
      color: var(--teal-text);
    }
    html[dir="rtl"] .auto-sum-title { text-transform: none; letter-spacing: 0; font-size: 12.4px; }
    .auto-sum-lock {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 10.6px;
      font-weight: 600;
      color: var(--text-3);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 2px 8px;
    }
    .auto-sum-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding-top: 8px;
      border-top: 1px solid var(--border-subtle);
    }
    .auto-sum-group:first-of-type { padding-top: 2px; border-top: 0; }
    .auto-sum-gtitle {
      font-size: 10.8px;
      font-weight: 750;
      color: var(--text-3);
    }
    .auto-sum-row {
      display: flex;
      flex-direction: column;
      gap: 4px;
      padding: 7px 9px;
      border-radius: 8px;
      background: var(--surface);
      border: 1px solid var(--border);
    }
    .auto-sum-row-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 6px;
    }
    .auto-sum-label {
      border: 0;
      background: transparent;
      padding: 0;
      text-align: start;
      cursor: pointer;
      font-size: 12px;
      font-weight: 650;
      color: var(--text);
      line-height: 1.35;
      flex: 1 1 auto;
    }
    .auto-sum-label:hover { color: var(--teal-text); text-decoration: underline; }
    .auto-sum-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
    }
    .auto-sum-pill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      border-radius: 999px;
      padding: 2px 8px;
      font-size: 11px;
      font-weight: 700;
      background: var(--teal-soft);
      border: 1px solid var(--teal-border);
      color: var(--teal-text);
    }
    .auto-sum-pill.tone-no {
      background: var(--coral-soft);
      border-color: var(--coral-border);
      color: var(--coral-text);
    }
    .auto-sum-pill.tone-later,
    .auto-sum-pill.tone-follow {
      background: var(--amber-soft);
      border-color: var(--amber-border);
      color: var(--amber-text);
    }
    .auto-sum-pill.tone-exclude {
      background: var(--surface-3);
      border-color: var(--border-strong);
      color: var(--text-2);
    }
    .iv-opt-note-btn {
      align-self: flex-start;
      border: 1px dashed var(--border-strong);
      background: transparent;
      color: var(--text-3);
      border-radius: 999px;
      padding: 3px 10px;
      font-size: 0.72rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 130ms ease;
    }
    .iv-opt-note-btn:hover {
      border-color: var(--teal-border);
      background: var(--teal-wash);
      color: var(--teal-text);
    }
    .drawer-acts-sec {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 5px;
    }
    .drawer-acts-sec .drawer-act-btn {
      flex: 1 1 auto;
      padding: 5px 7px;
      font-size: 11px;
    }
    .notes-inline-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r-md);
      padding: 14px;
      box-shadow: var(--shadow-card);
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .ws-empty {
      padding: 24px 16px;
      border-radius: var(--r-md);
      border: 1px dashed var(--border-strong);
      background: var(--surface);
      text-align: center;
      color: var(--text-3);
      font-size: 0.84rem;
      line-height: 1.55;
    }
    .ws-back-btn {
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-2);
      border-radius: 999px;
      padding: 4px 11px;
      font-size: 0.74rem;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      cursor: pointer;
    }
    .ws-back-btn:hover { border-color: var(--teal-border); color: var(--teal-text); background: var(--teal-wash); }


    /* PWA Install Pill Button (Hidden Until Chrome Fires beforeinstallprompt) */
    .install-btn {
      height: 31px;
      padding: 0 10px;
      border-radius: 8px;
      border: 1px solid var(--teal-border);
      background: var(--teal-soft);
      color: var(--teal-text);
      font-size: 11.6px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;

      .lead-prose { font-size: 7.3pt; line-height: 1.23; margin-bottom: 1mm; color: var(--text) !important; }
      .sub-prose { font-size: 6.95pt; line-height: 1.22; margin-bottom: 1mm; }

      .figure-card {
        padding: 1.4mm 2mm 1.2mm;
        margin: 1.2mm 0;
        border-radius: 4.5px;
        box-shadow: none !important;
        break-inside: avoid;
        page-break-inside: avoid;
      }
      .fig-title { font-size: 7pt; }

      /* Clean Page 2 Start at Section 04 for Balanced 2-Page A4 Executive Brief */
      #sec-mood { break-before: page; page-break-before: always; padding-top: 0; margin-top: 0; border-top: 0; }
      #sec-sleep, #sec-safety, #sec-questions { padding-top: 1.5mm; margin-top: 1.5mm; }
      #sec-sleep .sec-head, #sec-mood .sec-head, #sec-safety .sec-head, #sec-questions .sec-head { margin-bottom: 0.8mm; }
      #sec-sleep .lead-prose, #sec-mood .lead-prose { font-size: 7pt; line-height: 1.18; margin-bottom: 0.7mm; }
      #sec-safety .figure-card { padding: 1.1mm 1.8mm 1mm; margin: 1mm 0; }

      .prose-list { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 2.2mm; padding-top: 0.8mm; border-top: 0.5pt solid var(--border); }
      .prose-item { padding: 0 !important; margin: 0; border: 0 !important; border-radius: 0 !important; background: transparent !important; box-shadow: none !important; break-inside: avoid; }
      .prose-item.tone-alert { border-inline-start: 1.5pt solid var(--coral) !important; padding-inline-start: 1.6mm !important; }
      .prose-item-head { display: block !important; margin-bottom: 0.2mm; }

      .prose-lead { font-size: 7.1pt; }
      .prose-brief { font-size: 6.65pt; line-height: 1.2; }

      .life-wrap { margin-top: 1.6mm; padding-top: 1.2mm; border-top: 0.5pt solid var(--border); break-inside: avoid; }
      .life-rail { grid-template-columns: repeat(4, minmax(0, 1fr)) !important; gap: 2mm; padding: 0 !important; }
      .life-rail::before { display: none !important; }
      .life-node { align-items: center !important; text-align: center !important; gap: 0.7mm; padding: 0 !important; background: transparent !important; }
      .life-dot-wrap { position: relative !important; width: 100% !important; height: 13px !important; }
      .life-dot-wrap::before { display: block !important; inset-inline-start: -1mm; inset-inline-end: -1mm; height: 0.75pt; }
      .life-node:first-child .life-dot-wrap::before { inset-inline-start: 50%; }
      .life-node:last-child .life-dot-wrap::before { inset-inline-end: 50%; }
      .life-dot { position: relative !important; inset-inline-start: auto !important; top: auto !important; width: 6px; height: 6px; border-width: 1.5px; box-shadow: 0 0 0 1.8px var(--bg); }

      .life-age { font-size: 6.25pt; line-height: 1.18; }
      .life-stage { font-size: 6.85pt; }
      .life-note { font-size: 6.35pt; line-height: 1.18; }

      .safety-grid { grid-template-columns: repeat(2, minmax(0, 1fr)) !important; gap: 0.9mm; margin-bottom: 0.75mm; }
      .safety-card { padding: 0.7mm 1.4mm; border-radius: 4px; box-shadow: none !important; break-inside: avoid; }
      .safety-top { flex-direction: row !important; align-items: baseline; justify-content: space-between; gap: 1.5mm; margin-bottom: 0.15mm; }
      .safety-bar { order: 2; flex-shrink: 0; }
      .safety-lead { order: 1; flex: 1 1 auto; min-width: 0; font-size: 6.9pt; margin: 0; }
      .sev-badge { font-size: 5.8pt; padding: 0.12mm 1.1mm; }
      .safety-brief { font-size: 6.35pt; line-height: 1.15; }
      .safety-card .detail-point { font-size: 5.95pt !important; line-height: 1.13 !important; }
      .access-note { margin-bottom: 0.75mm; padding: 0.45mm 1.4mm; font-size: 6.4pt; break-inside: avoid; }

      .labs-head-bar { margin-bottom: 0.55mm; }
      .lab-spotlight { padding: 0.75mm 1.5mm 0.55mm; margin-bottom: 0.7mm; break-inside: avoid; }
      .spot-top { margin-bottom: 0.15mm; }
      .spot-lbl { font-size: 6.85pt; }
      .spot-date { font-size: 5.8pt; }
      .spot-badge { font-size: 5.7pt; padding: 0.2mm 1.3mm; }
      .spot-val { font-size: 7.2pt; }
      .spot-val .lab-unit { font-size: 5.8pt; margin-inline-start: 1.5px; }
      .spot-gauge { padding: 2px 3px 0; }
      .spot-track { height: 4.5px; }
      .spot-zone::before, .spot-zone::after { top: -1.5px; bottom: -1.5px; width: 1px; }
      .spot-marker { width: 11px; height: 11px; }
      .spot-marker::before { width: 9px; height: 9px; }
      .spot-marker::after { width: 5.8px; height: 5.8px; border-width: 1.1px; }
      .spot-ticks { height: 9.5px; margin-top: 4px; }
      .spot-tick { font-size: 5.8pt; }
      .spot-note { font-size: 6.1pt; margin-top: 0.15mm; }

      .lab-subblock { margin-top: 0.5mm; }
      .lab-subhead { margin-bottom: 0.35mm; break-after: avoid; }
      .lab-subtitle { font-size: 6.2pt !important; }
      .lab-subnote { font-size: 6.1pt; }
      .repleted-grid { grid-template-columns: repeat(3, minmax(0, 1fr)) !important; gap: 1mm; }
      .rep-item { padding: 0.65mm 1.3mm; background: var(--bg) !important; break-inside: avoid; }
      .rep-lbl { font-size: 6.65pt; }
      .rep-date { font-size: 5.6pt; }
      .rep-val-row { margin-bottom: 0.3mm; }
      .rep-val { font-size: 6.45pt; }
      .rep-unit { font-size: 5.6pt; }
      .rep-meta { font-size: 5.95pt; margin-top: 0.2mm; }

      .normal-grid { grid-template-columns: repeat(3, minmax(0, 1fr)) !important; gap: 0.35mm 1.9mm; padding-top: 0.4mm; }
      .norm-item { padding: 0.3mm 0; margin: 0; background: transparent !important; break-inside: avoid; }
      .norm-top { margin-bottom: 0.2mm; }
      .norm-lbl { font-size: 6.4pt; }
      .norm-date { font-size: 5.8pt; opacity: 0.82; }
      .norm-val { font-size: 6.3pt; }
      .norm-unit { font-size: 5.5pt; }
      .mini-track { height: 3px; }
      .mini-ref { font-size: 5.85pt; }

      #sec-questions { break-inside: avoid; page-break-inside: avoid; }
      #sec-questions .sub-prose { margin-bottom: 0.6mm; font-size: 6.65pt; }
      .q-grid { grid-template-columns: repeat(2, minmax(0, 1fr)) !important; gap: 0.9mm 2.4mm; padding-top: 0.6mm; border-top: 0.5pt solid var(--border); }
      .q-item { border: 0 !important; border-radius: 0 !important; padding: 0 !important; background: transparent !important; box-shadow: none !important; gap: 0; break-inside: avoid; }
      .q-item > div { display: grid; grid-template-columns: 15px minmax(0, 1fr); gap: 1mm; align-items: start; }
      .q-item .card-note-slot { grid-column: 1 / -1; }
      .q-item.is-done .q-lead, .q-item.is-done .q-text { opacity: 1 !important; }
      .q-top { display: block; margin: 0; }
      .q-num { min-width: 0; height: auto; padding: 0.5px 0 0; border: 0; background: transparent; color: var(--teal); font-size: 6.65pt; display: block; }
      .q-lead { font-size: 6.85pt; margin-bottom: 0.12mm; }
      .q-text { font-size: 6.35pt; line-height: 1.15; }
    }
  </style>
</head>

      function b64ToBytes(b64) {
        const bin = atob(String(b64 || "").replace(/\s+/g, ""));
        const arr = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);

        let bin = "";
        const chunk = 0x8000;
        for (let i = 0; i < arr.length; i += chunk) {
          bin += String.fromCharCode.apply(null, arr.subarray(i, i + chunk));
        }
        return btoa(bin);
      }

      async function encryptWithPin(obj, pin, iterations) {
        const clean = String(pin || "").replace(/\s+/g, "");
        if (!clean) throw new Error("Missing session PIN");
        const salt = crypto.getRandomValues(new Uint8Array(16));
        const iv = crypto.getRandomValues(new Uint8Array(12));
        const iter = iterations || 120000;
        const keyMat = await crypto.subtle.importKey("raw", new TextEncoder().encode(clean), { name: "PBKDF2" }, false, ["deriveKey"]);
        const aesKey = await crypto.subtle.deriveKey(
          { name: "PBKDF2", salt, iterations: iter, hash: "SHA-256" },
          keyMat, { name: "AES-GCM", length: 256 }, false, ["encrypt"]
        );
        const ctBuf = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, aesKey, new TextEncoder().encode(JSON.stringify(obj)));
        return {
          v: 1,
          alg: "AES-256-GCM",
          kdf: "PBKDF2-SHA256",
          iter,
          salt: bytesToB64(salt),
          iv: bytesToB64(iv),
          ct: bytesToB64(new Uint8Array(ctBuf))
        };
      }

        const clean = String(pin || "").replace(/\s+/g, "");
        if (!env || !env.salt || !env.iv || !env.ct) throw new Error("Invalid encrypted envelope");
        const keyMat = await crypto.subtle.importKey("raw", new TextEncoder().encode(clean), { name: "PBKDF2" }, false, ["deriveKey"]);
        const aesKey = await crypto.subtle.deriveKey(
          { name: "PBKDF2", salt: b64ToBytes(env.salt), iterations: env.iter || 120000, hash: "SHA-256" },
          keyMat, { name: "AES-GCM", length: 256 }, false, ["decrypt"]
        );
        const buf = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64ToBytes(env.iv) }, aesKey, b64ToBytes(env.ct));
        return JSON.parse(new TextDecoder().decode(buf));
      }

      async function persistEncryptedWorkspaceNow(overridePin, overrideSnap, overrideHasAny) {
        const pin = overridePin || sessionPin;
        if (!pin) return;
        const mySeq = ++wsSaveSeq;
        wsDirty = false;
        clearTimeout(wsSaveTimer);
        wsSaveTimer = 0;
        const hasAny = typeof overrideHasAny === "boolean" ? overrideHasAny : hasAnyWorkspaceData();
        try {
          if (!hasAny) {
            if (mySeq === wsSaveSeq) localStorage.removeItem(WS_STORE_KEY);
            return;
          }
          const snap = overrideSnap || serializeWorkspace();
          const env = await encryptWithPin(snap, pin, 100000);
          if (mySeq !== wsSaveSeq) return;
          localStorage.setItem(WS_STORE_KEY, JSON.stringify(env));
        } catch {}
      }

      function scheduleWorkspaceSave() {
        wsDirty = true;
        clearTimeout(wsSaveTimer);
        wsSaveTimer = window.setTimeout(() => {
          wsSaveTimer = 0;
          persistEncryptedWorkspaceNow();

        try { localStorage.removeItem("fiche_enc_sync_v1"); } catch {}
        try {

      /* =======================================================================
         SEARCH NORMALIZATION & BIDI FORMATTER
         ======================================================================= */
      function normChar(ch) {
        if (/[\u064B-\u065F\u0670\u0640]/.test(ch)) return "";
        if (/[\u0622\u0623\u0625\u0671]/.test(ch)) return "\u0627";
        if (ch === "\u0629") return "\u0647";
        if (ch === "\u0649") return "\u064A";
        return ch.normalize("NFD").replace(/[\u0300-\u036F]/g, "").toLowerCase();
      }

      function normText(str) {
        const raw = String(str ?? "");
        let out = "";
        for (let i = 0; i < raw.length; i++) out += normChar(raw[i]);
        return out;
      }

      function findMatchRanges(raw, qNorm) {
        if (!qNorm) return [];
        const chars = [], starts = [], ends = [];
        for (let i = 0; i < raw.length; i++) {
          const nc = normChar(raw[i]);
          for (let j = 0; j < nc.length; j++) {
            chars.push(nc[j]);
            starts.push(i);
            ends.push(i + 1);
          }
        }
        const hay = chars.join("");
        const ranges = [];
        let pos = 0;
        while (pos <= hay.length - qNorm.length) {
          const idx = hay.indexOf(qNorm, pos);
          if (idx === -1) break;
          let rEnd = ends[idx + qNorm.length - 1];
          while (rEnd < raw.length && normChar(raw[rEnd]) === "" && /[\u0300-\u036F\u064B-\u065F\u0670]/.test(raw[rEnd])) rEnd++;
          ranges.push([starts[idx], rEnd]);
          pos = idx + qNorm.length;
        }
        return ranges;
      }

      function renderSliceWithHighlights(raw, sliceStart, sliceEnd, ranges) {
        if (!ranges.length) return esc(raw.slice(sliceStart, sliceEnd));
        let out = "", cur = sliceStart;
        for (let i = 0; i < ranges.length; i++) {
          const rs = Math.max(sliceStart, ranges[i][0]);
          const re = Math.min(sliceEnd, ranges[i][1]);
          if (re <= rs) continue;
          if (rs > cur) out += esc(raw.slice(cur, rs));
          out += '<mark class="hl">' + esc(raw.slice(rs, re)) + "</mark>";
          cur = re;
        }
        if (cur < sliceEnd) out += esc(raw.slice(cur, sliceEnd));
        return out;
      }

      function fmt(s, isRtl, qNorm) {
        const raw = String(s ?? "");
        const ranges = qNorm ? findMatchRanges(raw, qNorm) : [];
        if (!isRtl) return renderSliceWithHighlights(raw, 0, raw.length, ranges);
        LTR_RE.lastIndex = 0;
        let out = "", last = 0, m;
        while ((m = LTR_RE.exec(raw)) !== null) {
          if (m.index > last) out += renderSliceWithHighlights(raw, last, m.index, ranges);
          const full = m[0];
          const core = full.replace(/(?:\s+[+\-–—·=→/]+|[.,:;–—\-·=→/\s]+)+$/, "");
          const coreEnd = m.index + core.length;
          const fullEnd = m.index + full.length;
          if (core) {
            const cls = core.length <= 13 ? ' class="nowrap-bdi"' : "";
            out += '<bdi dir="ltr"' + cls + ">" + renderSliceWithHighlights(raw, m.index, coreEnd, ranges) + "</bdi>";
            if (fullEnd > coreEnd) out += renderSliceWithHighlights(raw, coreEnd, fullEnd, ranges);
          } else {
            out += renderSliceWithHighlights(raw, m.index, fullEnd, ranges);
          }
          last = fullEnd;
        }
        if (last < raw.length) out += renderSliceWithHighlights(raw, last, raw.length, ranges);
        return out;
      }

        const br = activeBtn.getBoundingClientRect();
        if (!br.width) return;
        const bl = parseFloat(getComputedStyle(parent).borderLeftWidth) || 0;
        const x = br.left - pr.left - bl;
        if (instant) pill.style.transition = "none";
        pill.style.width = br.width.toFixed(2) + "px";
        pill.style.transform = "translate3d(" + x.toFixed(2) + "px, 0, 0)";

      function getItemMeta(key) {
        if (!data || !data[lang]) return null;
        const secs = data[lang].sections || {};
        const [prefix, idxStr] = String(key).split("-");
        const idx = Number(idxStr);
        if (prefix === "p" && secs.priorities && secs.priorities.goals && secs.priorities.goals[idx]) {
          const g = secs.priorities.goals[idx];
          return { key, secId: "priorities", secNum: secs.priorities.num, title: g.title, brief: g.brief || "" };
        }
        if (prefix === "cg" && secs.cognition && secs.cognition.items && secs.cognition.items[idx]) {
          const it = secs.cognition.items[idx];
          return { key, secId: "cognition", secNum: secs.cognition.num, title: it.lead, brief: it.brief || "" };
        }
        if (prefix === "sl" && secs.sleep && secs.sleep.items && secs.sleep.items[idx]) {
          const it = secs.sleep.items[idx];
          return { key, secId: "sleep", secNum: secs.sleep.num, title: it.lead, brief: it.brief || "" };
        }
        if (prefix === "md" && secs.mood && secs.mood.items && secs.mood.items[idx]) {
          const it = secs.mood.items[idx];
          return { key, secId: "mood", secNum: secs.mood.num, title: it.lead, brief: it.brief || "" };

        if (prefix === "sf" && secs.safety && secs.safety.baselineItems && secs.safety.baselineItems[idx]) {
          const b = secs.safety.baselineItems[idx];
          return { key, secId: "safety", secNum: secs.safety.num, title: b.lead, brief: b.brief || "" };
        }
        if (prefix === "q" && secs.questions && secs.questions.items && secs.questions.items[idx]) {
          const q = secs.questions.items[idx];
          return { key, secId: "questions", secNum: secs.questions.num, title: q.lead, brief: q.text || "" };

        return null;
      }

      function findBulletPassage(bulletId) {
        return savedPassages.find((p) => p.bulletId && p.bulletId === bulletId) || null;
      }

      function addSavedPassage(entry) {
        const cleanText = String(entry.text || "").replace(/\s+/g, " ").trim();
        if (!cleanText) return null;
        if (entry.bulletId) {
          const existing = findBulletPassage(entry.bulletId);
          if (existing) return existing;
        }
        const dup = savedPassages.find((p) => p.text === cleanText && p.sourceKey === (entry.sourceKey || ""));
        if (dup) return dup;
        const item = {
          id: "sp-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 6),
          sourceKey: entry.sourceKey || "",
          secId: entry.secId || "priorities",
          secNum: entry.secNum || "01",
          sourceTitle: entry.sourceTitle || "",
          label: entry.label || "",
          text: cleanText,
          note: entry.note || "",
          kind: entry.kind || "excerpt",
          bulletId: entry.bulletId || "",
          createdAt: new Date().toISOString()
        };
        savedPassages.unshift(item);
        scheduleWorkspaceSave();
        syncAllBadges();
        renderNotesFeedInAllTargets();
        return item;
      }

      function removeSavedPassage(id) {
        const idx = savedPassages.findIndex((p) => p.id === id);
        if (idx === -1) return;
        const removed = savedPassages[idx];
        savedPassages.splice(idx, 1);
        if (removed.bulletId) {
          const btn = briefMain.querySelector('.bullet-save-btn[data-save-bullet="' + removed.bulletId + '"]');
          if (btn) {
            btn.classList.remove("is-saved");
            btn.setAttribute("aria-pressed", "false");

        scheduleWorkspaceSave();
        syncAllBadges();
        if (activeView === "saved") renderActiveView(false);
        renderNotesFeedInAllTargets();
      }

        const existing = findBulletPassage(bulletId);
        const btn = briefMain.querySelector('.bullet-save-btn[data-save-bullet="' + bulletId + '"]');
        if (existing) {
          removeSavedPassage(existing.id);

            btn.setAttribute("aria-pressed", "false");
            btn.setAttribute("title", ui.saveBulletAdd || "Save passage");
            btn.setAttribute("aria-label", ui.saveBulletAdd || "Save passage");

          return;
        }
        const meta = sourceKey ? getItemMeta(sourceKey) : null;
        const secObj = secs[secId] || secs.priorities;
        addSavedPassage({
          bulletId,
          sourceKey: sourceKey || "",
          secId: (meta && meta.secId) || secId || "priorities",
          secNum: (meta && meta.secNum) || (secObj && secObj.num) || "01",
          sourceTitle: (meta && meta.title) || (secObj && secObj.title) || "",
          label: label || "",

          + '<button class="card-act-btn' + (noted ? " has-note" : "") + (editing ? " is-editing" : "") + '" type="button" data-comment-key="' + esc(key) + '" aria-expanded="' + (editing ? "true" : "false") + '" aria-label="' + esc(noteLbl) + '" title="' + esc(noteLbl) + '">' + ICO_NOTE + "</button>";

        const val = itemNotes.get(key) || "";

              : "")

            + '<div class="note-ed-foot">'
              + '<span class="note-ed-hint">Ctrl+Enter</span>'
              + '<span class="note-ed-acts">'
                + '<button class="note-ed-btn is-danger" type="button" data-note-del="' + esc(key) + '"' + (trimmed ? "" : " hidden") + ">" + esc(ui.commentDelete || "Delete") + "</button>"
                + '<button class="note-ed-btn is-primary" type="button" data-note-close="' + esc(key) + '">' + esc(ui.commentSave || "Done") + "</button>"

              + '<span class="card-note-badge">' + ICO_NOTE + "<span>" + esc(ui.clinicianNoteBadge || "Clinician note") + "</span></span>"
              + '<span class="card-note-edit-lbl">' + esc(ui.commentEdit || "Edit") + "</span>"
            + "</div>"
            + '<p class="card-note-text" dir="auto">' + esc(trimmed) + "</p>"
          + "</div>";

      function getStampMeta(stampVal, ui) {
        if (stampVal === "confirm") return { glyph: "✓", short: ui.stampConfirm || "Confirmed", full: ui.stampConfirmFull || "Confirmed / important", tone: "confirm" };
        if (stampVal === "follow") return { glyph: "?", short: ui.stampFollow || "Follow-up", full: ui.stampFollowFull || "Follow-up / verify", tone: "follow" };
        if (stampVal === "exclude") return { glyph: "✕", short: ui.stampExclude || "Unlikely", full: ui.stampExcludeFull || "Unlikely / excluded", tone: "exclude" };
        return null;
      }

      function getVerdictMeta(verdictVal, ui) {
        if (verdictVal === "yes") return { label: ui.verdictYes || "Yes", tone: "yes" };
        if (verdictVal === "no") return { label: ui.verdictNo || "No", tone: "no" };
        if (verdictVal === "later") return { label: ui.verdictLater || "Later", tone: "later" };
        return null;
      }

      function getDecisionOptionLabel(qKey, optId) {
        const cfg = data && data[lang] && data[lang].decisionConfig && data[lang].decisionConfig[qKey];
        if (!cfg || !Array.isArray(cfg.options)) return optId;
        const found = cfg.options.find((o) => o.id === optId);
        return found ? found.label : optId;
      }

      function renderCardStampBar(key, ui) {
        const active = cardStamps.get(key) || "";
        const stamps = [
          { id: "confirm", glyph: "✓", short: ui.stampConfirm || "Confirmed", full: ui.stampConfirmFull || "Confirmed / important" },
          { id: "follow", glyph: "?", short: ui.stampFollow || "Follow-up", full: ui.stampFollowFull || "Follow-up / verify" },
          { id: "exclude", glyph: "✕", short: ui.stampExclude || "Unlikely", full: ui.stampExcludeFull || "Unlikely / excluded" }
        ];
        return '<div class="card-stamp-bar" role="group" aria-label="' + esc(ui.summaryStampsTitle || "Quick clinical stamp") + '">'
          + stamps.map((st) => {
              const on = active === st.id;
              return '<button class="stamp-btn is-' + st.id + (on ? " is-active" : "") + '" type="button" data-stamp-key="' + esc(key) + '" data-stamp-val="' + st.id + '" aria-pressed="' + (on ? "true" : "false") + '" title="' + esc(st.full) + '">'
                + '<span class="stamp-glyph" aria-hidden="true">' + st.glyph + "</span>"
                + "<span>" + esc(st.short) + "</span>"
              + "</button>";
            }).join("")
        + "</div>";
      }

      function renderDecisionChips(qKey, ui, isRtl, qNorm) {
        const cfg = data && data[lang] && data[lang].decisionConfig && data[lang].decisionConfig[qKey];
        if (!cfg || !Array.isArray(cfg.options) || !cfg.options.length) return "";
        const selSet = decisionChoices.get(qKey);
        const isSingle = cfg.mode === "single";
        const qn = qNorm || "";
        return '<div class="q-chips-wrap" data-q-chips="' + esc(qKey) + '">'
          + '<div class="q-chips-lbl">' + fmt(cfg.label, isRtl, qn) + "</div>"
          + '<div class="q-chips" role="group" aria-label="' + esc(cfg.label) + '">'
            + cfg.options.map((opt) => {
                const on = Boolean(selSet && selSet.has(opt.id));
                return '<button class="q-chip' + (isSingle ? " is-single" : "") + (on ? " is-selected" : "") + '" type="button" data-dec-q="' + esc(qKey) + '" data-dec-opt="' + esc(opt.id) + '" aria-pressed="' + (on ? "true" : "false") + '">'
                  + '<span class="q-chip-mark" aria-hidden="true">' + (on ? "✓" : "") + "</span>"
                  + "<span>" + fmt(opt.label, isRtl, qn) + "</span>"
                + "</button>";
              }).join("")
          + "</div>"
        + "</div>";
      }

      function renderQuickScreensCard(ui, isRtl, qNorm, filteredList) {
        const allScreens = (data && data[lang] && Array.isArray(data[lang].quickScreens)) ? data[lang].quickScreens : [];
        const screens = Array.isArray(filteredList) ? filteredList : allScreens;
        if (!screens.length) return "";
        const qn = qNorm || "";
        const answeredCount = allScreens.filter((sc) => quickVerdicts.has(sc.id)).length;
        return '<div class="quick-screen-card" data-quick-screens="1">'
          + '<div class="qs-head">'
            + '<div>'
              + '<h3 class="qs-title">' + fmt(ui.quickScreenTitle || "Quick Verbal Checks (1-tap)", isRtl, qn) + "</h3>"
              + '<p class="qs-sub">' + fmt(ui.quickScreenSub || "Tap Yes, No, or Later — zero typing required.", isRtl, qn) + "</p>"
            + "</div>"
            + '<span class="qs-count" data-qs-counter="1"><bdi dir="ltr">' + answeredCount + "/" + allScreens.length + "</bdi></span>"
          + "</div>"
          + '<div class="qs-grid">'
            + screens.map((sc) => {
                const cur = quickVerdicts.get(sc.id) || "";
                const opts = [
                  { val: "yes", lbl: ui.verdictYes || "Yes" },
                  { val: "no", lbl: ui.verdictNo || "No" },
                  { val: "later", lbl: ui.verdictLater || "Later" }

                  + '<div class="qs-row-top">'
                    + '<p class="qs-q">' + fmt(sc.label, isRtl, qn) + "</p>"
                    + '<button class="qs-sec-pill" type="button" data-jump-sec="' + esc(sc.secId) + '" data-jump-item="' + esc(sc.itemKey || "") + '" title="' + esc(ui.jumpToContext || "Jump") + '"><bdi dir="ltr">' + esc(sc.secNum) + "</bdi></button>"
                  + "</div>"
                  + '<div class="qs-seg" role="group" aria-label="' + esc(sc.label) + '">'
                    + opts.map((o) => {
                        const on = cur === o.val;
                        return '<button class="qs-btn is-' + o.val + (on ? " is-active" : "") + '" type="button" data-qs-id="' + esc(sc.id) + '" data-qs-val="' + o.val + '" aria-pressed="' + (on ? "true" : "false") + '">' + esc(o.lbl) + "</button>";

                  + "</div>"
                + "</div>";
