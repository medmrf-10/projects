      function renderSheet(animate) {
        if (!data || !data[lang]) return;
        const d = data[lang];
        const ui = d.ui || {};
        const sb = d.sidebar || { safetyTitle: "", safety: [], labsTitle: "", labs: [] };
        const isRtl = d.dir === "rtl";
        const qNorm = normText(searchQuery.trim());
        const hasQ = Boolean(qNorm);
        let matchCount = 0;

        const matches = (...parts) => !hasQ || parts.some((p) => normText(p).includes(qNorm));

        /* Header Vitals */
        const vitalsHtml = (d.vitals || []).map((v) => {
          if (hasQ && matches(v.label, v.value)) matchCount += 1;
          return '<div class="vital-cell" role="listitem"><span class="vital-lbl">' + fmt(v.label, isRtl, qNorm) + '</span><span class="vital-val">' + fmt(v.value, isRtl, qNorm) + "</span></div>";
        }).join("");

        /* Viz 1: 3-Second Clinical Snapshot Strip */
        const snapCards = (d.snapshot || []).filter((c) => matches(c.label, c.value, c.meta));
        if (hasQ) matchCount += snapCards.length;
        const snapFiltered = hasQ && snapCards.length < (d.snapshot || []).length;
        const snapHtml = snapCards.map((c) =>
          '<div class="snap-card tone-' + esc(c.tone || "neutral") + '">'
            + '<div class="snap-head"><span class="snap-dot" aria-hidden="true"></span><span class="snap-lbl">' + fmt(c.label, isRtl, qNorm) + "</span></div>"
            + '<div class="snap-val">' + fmt(c.value, isRtl, qNorm) + "</div>"
            + '<div class="snap-meta">' + fmt(c.meta, isRtl, qNorm) + "</div>"
          + "</div>"
        ).join("");

        /* Viz 2: Longitudinal Lifespan Timeline */
        const tlNodes = (d.timeline || []).filter((t) => matches(t.age, t.title, t.note));
        if (hasQ) matchCount += tlNodes.length;
        const tlFiltered = hasQ && tlNodes.length < (d.timeline || []).length;
        const tlHtml = tlNodes.map((t) =>
          '<li class="tl-node' + (t.current ? " is-current" : "") + '">'
            + '<span class="tl-age">' + fmt(t.age, isRtl, qNorm) + "</span>"
            + '<span class="tl-dot" aria-hidden="true"></span>'
            + '<span class="tl-title">' + fmt(t.title, isRtl, qNorm) + "</span>"
            + '<span class="tl-note">' + fmt(t.note, isRtl, qNorm) + "</span>"
          + "</li>"
        ).join("");

        const showOverview = snapCards.length > 0 || tlNodes.length > 0;
        const overviewHtml = showOverview
          ? '<section id="sec-overview" class="exec-overview">'
              + (snapCards.length ? '<div><h2 class="micro-kicker"><span>' + fmt(ui.snapshotTitle, isRtl, "") + '</span></h2><div class="snapshot-grid' + (snapFiltered ? " is-filtered" : "") + '">' + snapHtml + "</div></div>" : "")
              + (tlNodes.length ? '<div class="timeline-block"><h2 class="micro-kicker"><span>' + fmt(ui.timelineTitle, isRtl, "") + '</span></h2><ol class="timeline-rail' + (tlFiltered ? " is-filtered" : "") + '">' + tlHtml + "</ol></div>" : "")
            + "</section>"
          : "";

        /* Circadian Sleep Cycle Check (embedded inside Step 03) */
        const sc = d.sleepCycle;
        const scMatches = sc && matches(
          sc.title,
          sc.note,
          ...(sc.blocks || []).flatMap((b) => [b.shortLabel, b.label, b.detail])
        );
        if (hasQ && scMatches) matchCount += 1;

        /* Flow Steps (01 -> 04) */
        const flowStepsHtml = (d.flow || []).map((st, sIdx) => {
          const badge = st && st.step ? String(st.step).trim() : String(sIdx + 1).padStart(2, "0");
          const stepId = st && st.id ? st.id : "step" + badge;
          const allItems = st && Array.isArray(st.items) ? st.items : [];
          const keptItems = [];
          allItems.forEach((it, iIdx) => {
            const tagsText = Array.isArray(it.tags) ? it.tags.join(" ") : "";
            if (matches(it.lead, it.brief, it.detail, tagsText, st.title)) {
              keptItems.push({ it, num: iIdx + 1, key: stepId + "-" + iIdx });
            }
          });
          if (hasQ) matchCount += keptItems.length;
          const attachCirc = stepId === "sleep" && sc && scMatches;
          if (!keptItems.length && !attachCirc) return "";

          const itemsHtml = keptItems.map(({ it, num, key }) => {
            const isOpen = expandedItems.has(key);
            const searchOpen = hasQ && density === "brief";
            const expandedNow = density === "full" || isOpen || searchOpen;
            const tagsHtml = (it.tags || []).map((tg) => '<span class="tag-chip">' + fmt(tg, isRtl, qNorm) + "</span>").join("");
            const toggleBtn = density === "brief"
              ? '<button class="flow-expand-btn" type="button" data-item-key="' + esc(key) + '" aria-expanded="' + (expandedNow ? "true" : "false") + '">'
                  + "<span>" + esc(expandedNow ? (ui.collapseItem || "Hide") : (ui.expandItem || "Details")) + "</span>" + ICO_CHEV
                + "</button>"
              : "";
            return '<li class="flow-item' + (isOpen ? " is-open" : "") + (searchOpen ? " is-search-open" : "") + '">'
              + '<div class="flow-item-top">'
                + '<span class="flow-item-heading"><span class="flow-num"><bdi dir="ltr">' + String(num) + ".</bdi></span><strong class=\"item-lead\">" + fmt(it.lead, isRtl, qNorm) + "</strong></span>"
                + '<span class="flow-item-meta">' + tagsHtml + toggleBtn + "</span>"
              + "</div>"
              + '<p class="flow-brief">' + fmt(it.brief, isRtl, qNorm) + "</p>"
              + (it.detail ? '<p class="flow-detail">' + fmt(it.detail, isRtl, qNorm) + "</p>" : "")
              + "</li>";
          }).join("");

          return '<li id="sec-' + esc(stepId) + '" class="flow-step">'
            + '<span class="flow-badge"><bdi dir="ltr">' + esc(badge) + "</bdi></span>"
            + '<div class="flow-step-head"><h2 class="flow-step-title">' + fmt(st.title, isRtl, qNorm) + "</h2></div>"
            + (itemsHtml ? '<ol class="flow-items">' + itemsHtml + "</ol>" : "")
            + (attachCirc ? renderCircadian(sc, isRtl, qNorm) : "")
            + "</li>";
        }).join("");

        /* Sidebar 1: Safety / Medical Benchmarks */
        const safetyItems = (sb.safety || []).filter((a) => matches(a.badge, a.lead, a.text));
        if (hasQ) matchCount += safetyItems.length;
        const safetyHtml = safetyItems.map((a) => {
          const sev = a.severity || "warn";
          return '<li class="safety-item sev-' + esc(sev) + '">'
            + '<div class="safety-top">'
              + '<strong class="item-lead">' + fmt(a.lead, isRtl, qNorm) + "</strong>"
              + (a.badge ? '<span class="sev-badge sev-' + esc(sev) + '">' + fmt(a.badge, isRtl, qNorm) + "</span>" : "")
            + "</div>"
            + '<div class="item-text">' + fmt(a.text, isRtl, qNorm) + "</div>"
            + "</li>";
        }).join("");

        /* Sidebar 2: Grouped Biomarker Range-Bars */
        const clampPct = (v, lo, hi) => {
          const span = hi - lo;
          if (!span || !Number.isFinite(v)) return 50;
          return Math.max(2, Math.min(98, ((v - lo) / span) * 100));
        };

        const allLabs = sb.labs || [];
        const groupsMeta = sb.labsGroups || {};
        let visibleLabsCount = 0;

        const labsGroupsHtml = LAB_GROUP_ORDER.map((gKey) => {
          const gLabs = allLabs.filter((lb) => lb.group === gKey);
          const gMeta = groupsMeta[gKey] || { title: gKey, note: "" };
          let groupVisibleInScreen = 0;

          const rowsHtml = gLabs.map((lb) => {
            const searchMatch = matches(lb.label, lb.date, lb.currStr, lb.prevStr, lb.unit, lb.ref, lb.note, gMeta.title);
            if (!searchMatch) return "";
            if (hasQ) matchCount += 1;
            const filterHidden = !hasQ && labsFilter === "watch" && !lb.watch;
            if (!filterHidden) {
              groupVisibleInScreen += 1;
              visibleLabsCount += 1;
            }
            const note = lb.note ? String(lb.note).trim() : "";
            const isWarn = lb.status === "warn";
            const hasViz = typeof lb.curr === "number" && typeof lb.min === "number" && typeof lb.max === "number";
            const dateHtml = lb.date ? '<span class="lab-date"><bdi dir="ltr">' + esc(lb.date) + "</bdi></span>" : "";

            let valHtml = "";
            if (hasViz) {
              const prevPart = typeof lb.prev === "number"
                ? '<span class="lab-prev">' + esc(lb.prevStr ?? lb.prev) + '</span><span class="lab-arr">→</span>'
                : "";
              const unitPart = lb.unit ? '<span class="lab-unit">' + esc(lb.unit) + "</span>" : "";
              valHtml = '<span class="lab-val' + (isWarn ? " is-warn" : "") + '"><bdi dir="ltr">' + prevPart + '<span class="lab-curr">' + esc(lb.currStr ?? lb.curr) + "</span>" + unitPart + "</bdi></span>";
            } else {
              valHtml = '<span class="lab-val' + (isWarn ? " is-warn" : "") + '">' + fmt(lb.value, isRtl, qNorm) + "</span>";
            }

            let vizHtml = "";
            if (hasViz) {
              const zL = Math.max(0, Math.min(100, ((lb.rLow - lb.min) / (lb.max - lb.min)) * 100));
              const zR = Math.max(0, Math.min(100, ((lb.rHigh - lb.min) / (lb.max - lb.min)) * 100));
              const cP = clampPct(lb.curr, lb.min, lb.max);
              let prevHtml = "";
              if (typeof lb.prev === "number") {
                const pP = clampPct(lb.prev, lb.min, lb.max);
                const dL = Math.min(pP, cP);
                const dW = Math.abs(cP - pP);
                prevHtml = '<span class="lab-delta" style="left:' + dL.toFixed(1) + "%;width:" + dW.toFixed(1) + '%"></span>'
                  + '<span class="lab-dot-prev" style="left:' + pP.toFixed(1) + '%"></span>';
              }
              vizHtml = '<div class="lab-viz" dir="ltr">'
                + '<div class="lab-track" aria-hidden="true">'
                  + '<span class="lab-zone" style="left:' + zL.toFixed(1) + "%;width:" + Math.max(2, zR - zL).toFixed(1) + '%"></span>'
                  + prevHtml
                  + '<span class="lab-dot-curr' + (isWarn ? " is-warn" : "") + '" style="left:' + cP.toFixed(1) + '%"></span>'
                + "</div>"
                + (lb.ref ? '<span class="lab-ref">' + esc(lb.ref) + "</span>" : "")
                + "</div>";
            }

            return '<div class="lab-row' + (isWarn ? " is-warn-row" : "") + (filterHidden ? " is-filter-hidden" : "") + '">'
              + '<div class="lab-top"><span class="lab-head"><span class="lab-lbl">' + fmt(lb.label, isRtl, qNorm) + "</span>" + dateHtml + "</span>" + valHtml + "</div>"
              + vizHtml
              + (note ? '<div class="lab-note' + (isWarn ? " is-warn" : "") + '">' + fmt(note, isRtl, qNorm) + "</div>" : "")
              + "</div>";
          }).join("");

          if (!rowsHtml) return "";
          const groupHidden = !hasQ && groupVisibleInScreen === 0;
          return '<div class="lab-group' + (groupHidden ? " is-filter-hidden" : "") + '">'
            + '<div class="lab-group-head">'
              + '<span class="lab-group-title">' + fmt(gMeta.title, isRtl, qNorm) + "</span>"
              + (gMeta.note ? '<span class="lab-group-note">' + fmt(gMeta.note, isRtl, qNorm) + "</span>" : "")
            + "</div>"
            + '<div class="labs-list">' + rowsHtml + "</div>"
            + "</div>";
        }).join("");

        const labsLegendHtml = sb.labsLegend
          ? '<div class="lab-legend">'
              + '<span class="lab-leg-item"><span class="lab-leg-zone" aria-hidden="true"></span><span>' + fmt(sb.labsLegend.ref, isRtl, "") + "</span></span>"
              + '<span class="lab-leg-item"><span class="lab-leg-shift" dir="ltr" aria-hidden="true"><span class="lab-leg-dot-prev"></span><span class="lab-leg-line"></span><span class="lab-leg-dot-curr"></span></span><span>' + fmt(sb.labsLegend.shift, isRtl, "") + "</span></span>"
              + (sb.labsLegend.watch ? '<span class="lab-leg-item"><span class="lab-leg-dot-warn" aria-hidden="true"></span><span>' + fmt(sb.labsLegend.watch, isRtl, "") + "</span></span>" : "")
            + "</div>"
          : "";

        const labsFilterHtml = '<div class="labs-filter" role="group" aria-label="Labs filter">'
          + '<button class="labs-fbtn' + (labsFilter === "all" ? " is-active" : "") + '" type="button" data-lab-filter="all" aria-pressed="' + (labsFilter === "all" ? "true" : "false") + '">' + esc(ui.labsFilterAll || "All") + "</button>"
          + '<button class="labs-fbtn' + (labsFilter === "watch" ? " is-active" : "") + '" type="button" data-lab-filter="watch" aria-pressed="' + (labsFilter === "watch" ? "true" : "false") + '">' + esc(ui.labsFilterWatch || "Watch") + "</button>"
          + "</div>";

        /* Sidebar 3: Comparative Benchmark Chart & Trend Slope SVG */
        const cc = d.cognitiveChart;
        let testsPanelHtml = "";
        if (cc) {
          const intactBars = (cc.bars || []).filter((b) => b.group === "intact" && matches(b.label, b.valueStr, b.sub, cc.eyeExam));
          const deficitBars = (cc.bars || []).filter((b) => b.group === "deficit" && matches(b.label, b.valueStr, b.sub));
          const pvtMatch = cc.pvtDecay && matches(cc.pvtDecay.label, cc.pvtDecay.start, cc.pvtDecay.end, cc.pvtDecay.note);
          const famMatch = cc.familyContrast && matches(cc.familyContrast);

          if (hasQ) matchCount += intactBars.length + deficitBars.length + (pvtMatch ? 1 : 0) + (famMatch ? 1 : 0);

          const renderBars = (list) => list.map((b) => {
            const cls = b.metricType === "load" ? " is-load" : (b.metricType === "deficit" ? " is-deficit" : "");
            const w = Math.max(4, Math.min(100, Number(b.value) || 0));
            const valRendered = /\d/.test(String(b.valueStr || ""))
              ? '<bdi dir="ltr">' + fmt(b.valueStr, false, qNorm) + "</bdi>"
              : fmt(b.valueStr, isRtl, qNorm);
            return '<div class="cog-row">'
              + '<div class="cog-row-top"><span class="cog-lbl">' + fmt(b.label, isRtl, qNorm) + '</span><span class="cog-val' + cls + '">' + valRendered + "</span></div>"
              + '<div class="cog-track" dir="ltr" aria-hidden="true"><div class="cog-fill' + cls + '" style="width:' + w + '%"></div></div>'
              + (b.sub ? '<div class="cog-bar-sub">' + fmt(b.sub, isRtl, qNorm) + "</div>" : "")
              + "</div>";
          }).join("");

          const hasAnyCog = intactBars.length || deficitBars.length || pvtMatch || famMatch;
          if (hasAnyCog) {
            testsPanelHtml = '<section id="sec-tests" class="panel panel-tests" role="region">'
              + '<div class="panel-head"><span class="panel-head-left">' + ICO_TESTS + '<h2 class="panel-title">' + fmt(cc.title, isRtl, qNorm) + "</h2></span></div>"
              + (cc.subtitle ? '<p class="cog-sub">' + fmt(cc.subtitle, isRtl, qNorm) + "</p>" : "")
              + (intactBars.length
                ? '<div class="cog-group"><div class="cog-group-head"><span class="cog-group-lbl">' + fmt(cc.intactLabel, isRtl, "") + "</span>"
                    + (cc.eyeExam ? '<span class="cog-eye-chip">' + fmt(cc.eyeExam, isRtl, qNorm) + "</span>" : "")
                    + '</div><div class="cog-bars">' + renderBars(intactBars) + "</div></div>"
                : "")
              + (deficitBars.length
                ? '<div class="cog-group"><div class="cog-group-head"><span class="cog-group-lbl is-deficit">' + fmt(cc.deficitLabel, isRtl, "") + '</span></div><div class="cog-bars">' + renderBars(deficitBars) + "</div></div>"
                : "")
              + (pvtMatch
                ? '<div class="pvt-card"><div class="pvt-top"><span class="pvt-lbl">' + fmt(cc.pvtDecay.label, isRtl, qNorm) + '</span><span class="pvt-metric"><bdi dir="ltr">' + esc(cc.pvtDecay.start) + " → " + esc(cc.pvtDecay.end) + " " + esc(cc.pvtDecay.unit) + "</bdi></span></div>"
                    + '<div class="pvt-svg-wrap">' + renderPvtSvg(cc.pvtDecay) + "</div>"
                    + '<div class="pvt-note">' + fmt(cc.pvtDecay.note, isRtl, qNorm) + "</div></div>"
                : "")
              + (famMatch ? '<div class="family-callout">' + fmt(cc.familyContrast, isRtl, qNorm) + "</div>" : "")
              + "</section>";
          }
        }

        const safetyPanelHtml = safetyItems.length
          ? '<section id="sec-safety" class="panel panel-safety" role="region"><div class="panel-head"><span class="panel-head-left">' + ICO_SAFETY + '<h2 class="panel-title">' + fmt(sb.safetyTitle, isRtl, qNorm) + '</h2></span></div><ol class="safety-list">' + safetyHtml + "</ol></section>"
          : "";

        const labsPanelHtml = labsGroupsHtml
          ? '<section id="sec-labs" class="panel panel-labs" role="region"><div class="panel-head"><span class="panel-head-left">' + ICO_LABS + '<h2 class="panel-title">' + fmt(sb.labsTitle, isRtl, qNorm) + "</h2></span>" + (hasQ ? "" : labsFilterHtml) + "</div>" + labsLegendHtml + '<div class="labs-groups">' + labsGroupsHtml + "</div></section>"
          : "";

        const hasSidebar = Boolean(safetyPanelHtml || labsPanelHtml || testsPanelHtml);
        const hasBody = Boolean(flowStepsHtml || hasSidebar);
        const bodyCls = "dossier-body" + (!flowStepsHtml ? " no-flow" : "") + (!hasSidebar ? " no-sidebar" : "");
        const emptyHtml = hasQ && matchCount === 0
          ? '<div class="search-empty"><p class="search-empty-title">' + esc(ui.searchNoMatch || "No matches") + ' — « ' + esc(searchQuery.trim()) + ' »</p><button id="emptyClearBtn" class="search-empty-btn" type="button">' + esc(ui.searchClear || "Clear") + "</button></div>"
          : "";

        sheet.innerHTML =
          '<article class="dossier-paper' + (density === "brief" ? " is-brief" : "") + '">'
          + '<header class="dossier-header">'
            + '<div class="doc-head-row">'
              + '<div class="doc-title-col"><h1 class="doc-title">' + fmt(d.title, isRtl, qNorm) + '</h1><p class="doc-sub">' + fmt(d.subtitle, isRtl, qNorm) + "</p></div>"
              + '<span class="doc-date">' + fmt(d.date, isRtl, "") + "</span>"
            + "</div>"
            + '<div class="vitals-strip" role="list">' + vitalsHtml + "</div>"
          + "</header>"
          + overviewHtml
          + (hasBody
            ? '<div class="' + bodyCls + '">'
                + (flowStepsHtml ? '<section class="flow-col"><ol class="flow-list">' + flowStepsHtml + "</ol></section>" : "")
                + safetyPanelHtml
                + labsPanelHtml
                + testsPanelHtml
              + "</div>"
            : "")
          + emptyHtml
          + "</article>";

        updateSearchChrome(matchCount, qNorm);
        if (animate) triggerSheetSwap();
      }

      function renderAll(instantPill, animateSheet) {
        renderChrome(instantPill);
        renderSheet(animateSheet);
      }

      function clearSearch(focusBack) {
        searchQuery = "";
        searchInput.value = "";
        renderSheet(false);
        if (focusBack) searchInput.focus();
      }

      /* PIN Gate Events */
      toggleEye.addEventListener("click", () => {
        const show = pinInput.type === "password";
        pinInput.type = show ? "text" : "password";
        setHidden(eyeOpen, show);
        setHidden(eyeClosed, !show);
        toggleEye.setAttribute("aria-label", show ? "Hide code" : "Show code");
        pinInput.focus();
      });

      pinInput.addEventListener("input", () => { if (gateErr.textContent) gateErr.textContent = ""; });

      gateForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        gateErr.textContent = "";
        gateBtn.disabled = true;
        try {
          data = await unlock(pinInput.value);
          lang = "fr";
          density = "full";
          labsFilter = "all";
          searchQuery = "";
          activeNav = "overview";
          expandedItems.clear();
          searchInput.value = "";
          pinInput.value = "";
          gateForm.reset();
          gateScreen.hidden = true;
          appShell.hidden = false;
          renderAll(true, true);
          requestAnimationFrame(() => syncAllPills(true));
          window.scrollTo({ top: 0, behavior: "instant" });
        } catch {
          gateErr.textContent = "Code incorrect · الرمز غير صحيح · Invalid code";
          gateForm.classList.remove("shake");
          void gateForm.offsetWidth;
          gateForm.classList.add("shake");
          pinInput.select();
        } finally {
          gateBtn.disabled = false;
        }
      });

      /* Language & Density Switchers */
      langBtns.forEach((btn) => btn.addEventListener("click", () => {
        const next = btn.dataset.loc;
        if (next && next !== lang && data && data[next]) {
          lang = next;
          renderAll(false, true);
          requestAnimationFrame(() => syncAllPills(false));
        }
      }));

      densBtns.forEach((btn) => btn.addEventListener("click", () => {
        const next = btn.dataset.dens;
        if (next && next !== density && data) {
          density = next;
          expandedItems.clear();
          densBtns.forEach((b) => {
            const active = b.dataset.dens === density;
            b.classList.toggle("is-active", active);
            b.setAttribute("aria-pressed", active ? "true" : "false");
          });
          syncPill(densPill, btn, false);
          renderSheet(false);
        }
      }));

      /* Quick-Jump Nav Delegation */
      navPills.addEventListener("click", (e) => {
        const btn = e.target.closest(".nav-pill[data-target]");
        if (!btn) return;
        jumpToSection(btn.dataset.target);
      });

      /* Live Search Input + Keyboard Shortcuts */
      searchInput.addEventListener("input", () => {
        searchQuery = searchInput.value;
        renderSheet(false);
      });
      searchClear.addEventListener("click", () => clearSearch(true));

      document.addEventListener("keydown", (e) => {
        if (appShell.hidden || !data) return;
        if (e.key === "/" && !e.ctrlKey && !e.metaKey && !e.altKey) {
          const tag = document.activeElement && document.activeElement.tagName;
          if (tag !== "INPUT" && tag !== "TEXTAREA") {
            e.preventDefault();
            searchInput.focus();
            searchInput.select();
          }
        } else if (e.key === "Escape") {
          if (searchQuery) {
            e.preventDefault();
            clearSearch(false);
          } else if (document.activeElement === searchInput) {
            searchInput.blur();
          }
        }
      });

      /* Sheet Event Delegation (Flow Expand + Labs Filter + Empty Search Reset) */
      sheet.addEventListener("click", (e) => {
        const labBtn = e.target.closest(".labs-fbtn[data-lab-filter]");
        if (labBtn) {
          const next = labBtn.dataset.labFilter;
          if (next && next !== labsFilter) {
            labsFilter = next;
            renderSheet(false);
          }
          return;
        }
        const expBtn = e.target.closest(".flow-expand-btn[data-item-key]");
        if (expBtn) {
          const key = expBtn.dataset.itemKey;
          if (expandedItems.has(key)) expandedItems.delete(key);
          else expandedItems.add(key);
          renderSheet(false);
          return;
        }
        if (e.target.closest("#emptyClearBtn")) {
          clearSearch(true);
        }
      });

      /* Scroll-Spy & Resize */
      let scrollRaf = 0;
      window.addEventListener("scroll", () => {
        if (scrollRaf) return;
        scrollRaf = requestAnimationFrame(() => {
          scrollRaf = 0;
          updateScrollSpy();
        });
      }, { passive: true });

      window.addEventListener("resize", () => { if (!appShell.hidden) syncAllPills(true); });

      /* Theme, Print & Lock */
      themeBtn.addEventListener("click", () => {
        root.setAttribute("data-theme", root.getAttribute("data-theme") === "dark" ? "light" : "dark");
        syncThemeControl();
      });

      printBtn.addEventListener("click", () => window.print());

      lockBtn.addEventListener("click", () => {
        data = null;
        lang = "fr";
        density = "full";
        labsFilter = "all";
        searchQuery = "";
        activeNav = "overview";
        expandedItems.clear();
        sheet.innerHTML = "";
        sheet.classList.remove("sheet-anim");
        navPills.innerHTML = "";
        tbTitle.textContent = "";
        tbDate.textContent = "";
        searchInput.value = "";
        if (langPill) langPill.style.opacity = "0";
        if (densPill) densPill.style.opacity = "0";
        appShell.hidden = true;
        gateScreen.hidden = false;
        root.lang = "fr";
        root.dir = "ltr";
        document.title = LOCKED_TITLE;
        pinInput.type = "password";
        setHidden(eyeOpen, false);
        setHidden(eyeClosed, true);
        toggleEye.setAttribute("aria-label", "Show code");
        pinInput.value = "";
        gateErr.textContent = "";
        gateForm.reset();
        pinInput.focus();
      });
    })();
  </script>
</body>
</html>
