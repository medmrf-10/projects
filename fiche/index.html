<!DOCTYPE html>
<html lang="fr" dir="ltr" data-font="md" data-spacing="normal" data-cards="spacious">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet" />
  <meta name="referrer" content="no-referrer" />
  <meta name="theme-color" content="#F5EFE4" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Fiche Clinique" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" type="image/svg+xml" href="./icons/icon.svg" />
  <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png" />
  <title>Fiche clinique · مذكرة سريرية · Clinical Note</title>
  <script>
    (function(){
      try {
        var r = document.documentElement;
        var l = localStorage.getItem('fiche_lang');
        if (l === 'fr' || l === 'ar' || l === 'en') {
          r.lang = l;
          r.dir = l === 'ar' ? 'rtl' : 'ltr';
        }
        var f = localStorage.getItem('fiche_font');
        if (f === 'sm' || f === 'md' || f === 'lg') r.dataset.font = f;
        var s = localStorage.getItem('fiche_spacing');
        if (s === 'compact' || s === 'normal' || s === 'relaxed') r.dataset.spacing = s;
        var c = localStorage.getItem('fiche_cards');
        if (c === 'compact' || c === 'spacious') r.dataset.cards = c;
      } catch (e) {}
    })();
  </script>
  <style>
    :root {
      color-scheme: light;
      --font-sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "Segoe UI", Roboto, system-ui, sans-serif;
      --font-display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", "Segoe UI", Roboto, system-ui, sans-serif;
      --font-ar: "SF Arabic", "IBM Plex Sans Arabic", "Geeza Pro", "Noto Sans Arabic", "Segoe UI", Tahoma, system-ui, sans-serif;
      --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
      --ease: cubic-bezier(0.22, 1, 0.36, 1);

      /* Warm Paper (Exclusive Theme — WCAG AA+ Verified) */
      --bg: #F5EFE4;
      --surface: #FCF9F2;
      --surface-2: #EAE2D3;
      --surface-3: #DFD5C3;
      --seg-active: #FCF9F2;
      --seg-active-text: #1F1A14;
      --seg-shadow: 0 1px 2px rgba(31, 26, 20, 0.10);
      --chrome: rgba(245, 239, 228, 0.92);
      --sheet-bg: #FCF9F2;
      --backdrop: rgba(31, 26, 20, 0.34);

      --border: rgba(31, 26, 20, 0.11);
      --border-subtle: rgba(31, 26, 20, 0.07);
      --border-strong: rgba(31, 26, 20, 0.22);

      --text: #1F1A14;
      --text-2: #3E352B;
      --text-3: #5D5144;

      --teal: #13625A;
      --teal-btn: #13625A;
      --teal-btn-hover: #0E4D47;
      --teal-text: #0E534C;
      --teal-soft: rgba(19, 98, 90, 0.10);
      --teal-wash: rgba(19, 98, 90, 0.055);
      --teal-border: rgba(19, 98, 90, 0.28);

      --coral: #B23B1B;
      --coral-text: #942F16;
      --coral-soft: rgba(178, 59, 27, 0.10);
      --coral-wash: rgba(178, 59, 27, 0.05);
      --coral-border: rgba(178, 59, 27, 0.28);

      --amber: #A1520B;
      --amber-text: #85410B;
      --amber-soft: rgba(161, 82, 11, 0.10);
      --amber-wash: rgba(161, 82, 11, 0.06);
      --amber-border: rgba(161, 82, 11, 0.28);

      --info: #2655B3;
      --info-text: #1E4799;
      --info-soft: rgba(38, 85, 179, 0.10);
      --info-border: rgba(38, 85, 179, 0.26);

      --err: #9E1C1C;

      --card-highlight: 0 0 0 0 transparent;
      --shadow-card: 0 1px 2px rgba(31, 26, 20, 0.04), 0 4px 14px -8px rgba(31, 26, 20, 0.08);
      --shadow-gate: 0 24px 56px -18px rgba(31, 26, 20, 0.15), 0 1px 4px rgba(31, 26, 20, 0.07);
      --shadow-pop: 0 18px 44px -10px rgba(31, 26, 20, 0.22), 0 2px 8px rgba(31, 26, 20, 0.08);

      --r-lg: 14px;
      --r-md: 10px;
      --r-sm: 8px;

      --col-w: 760px;
      --page-px: 20px;

      /* Dynamic Typography & Density */
      --fs-body: 0.95rem;
      --fs-title: 1.05rem;
      --fs-sub: 0.87rem;
      --fs-sm: 0.82rem;
      --lh-body: 1.60;
      --lh-body-rtl: 1.74;
      --card-py: 15px;
      --card-px: 18px;
      --card-gap: 12px;
      --sec-gap: 32px;
    }

    html[data-font="sm"] {
      --fs-body: 0.88rem;
      --fs-title: 0.99rem;
      --fs-sub: 0.82rem;
      --fs-sm: 0.78rem;
    }
    html[data-font="lg"] {
      --fs-body: 1.05rem;
      --fs-title: 1.16rem;
      --fs-sub: 0.94rem;
      --fs-sm: 0.88rem;
    }
    html[data-spacing="compact"] {
      --lh-body: 1.46;
      --lh-body-rtl: 1.60;
    }
    html[data-spacing="relaxed"] {
      --lh-body: 1.82;
      --lh-body-rtl: 1.96;
    }
    html[data-cards="compact"] {
      --card-py: 11px;
      --card-px: 14px;
      --card-gap: 9px;
      --sec-gap: 22px;
    }

    *, *::before, *::after { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
    body {
      margin: 0;
      min-height: 100dvh;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
      font-size: var(--fs-body);
      line-height: var(--lh-body);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      transition: background-color 180ms var(--ease), color 180ms var(--ease);
    }
    html[dir="rtl"] body {
      font-family: var(--font-ar);
      line-height: var(--lh-body-rtl);
    }
    html[dir="rtl"] * {
      letter-spacing: 0 !important;
      text-transform: none !important;
    }
    bdi.ltr-tok {
      unicode-bidi: isolate;
      direction: ltr;
      font-variant-numeric: tabular-nums;
      display: inline;
    }
    button, input { font: inherit; color: inherit; }
    button { -webkit-tap-highlight-color: transparent; }
    button:focus-visible, input:focus-visible {
      outline: 2px solid var(--teal);
      outline-offset: 2px;
    }
    [hidden] { display: none !important; }

    @keyframes sheetUp {
      from { transform: translateY(18px); opacity: 0.7; }
      to { transform: translateY(0); opacity: 1; }
    }
    @keyframes popIn {
      from { transform: scale(0.97) translateY(-4px); opacity: 0; }
      to { transform: scale(1) translateY(0); opacity: 1; }
    }

    /* ================= PIN GATE ================= */
    .gate-wrap {
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 20px 14px;
    }
    .gate-card {
      width: 100%;
      max-width: 388px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 22px 20px 18px;
      box-shadow: var(--card-highlight), var(--shadow-gate);
    }
    .gate-top {
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
    }
    .gate-emblem {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: var(--teal-soft);
      border: 1px solid var(--teal-border);
      color: var(--teal-text);
      display: grid;
      place-items: center;
      margin: 0 auto 12px;
    }
    .gate-title {
      margin: 0;
      text-align: center;
      font-family: var(--font-display);
      font-size: 1.22rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--text);
    }
    html[dir="rtl"] .gate-title { font-family: var(--font-ar); }
    .gate-sub {
      margin: 5px 0 18px;
      text-align: center;
      font-size: 0.86rem;
      color: var(--text-3);
    }
    .pin-field {
      position: relative;
      display: flex;
      align-items: center;
      margin-bottom: 10px;
    }
    .pin-input {
      width: 100%;
      min-height: 48px;
      padding: 10px 48px 10px 14px;
      border-radius: 11px;
      border: 1px solid var(--border-strong);
      background: var(--bg);
      color: var(--text);
      font-size: 16px;
      transition: border-color 140ms var(--ease), box-shadow 140ms var(--ease);
    }
    html[dir="rtl"] .pin-input { padding: 10px 14px 10px 48px; }
    .pin-input:focus {
      outline: none;
      border-color: var(--teal);
      box-shadow: 0 0 0 3px var(--teal-soft);
    }
    .pin-eye {
      position: absolute;
      inset-inline-end: 2px;
      width: 44px;
      height: 44px;
      border: 0;
      background: transparent;
      color: var(--text-3);
      display: grid;
      place-items: center;
      cursor: pointer;
      border-radius: 9px;
    }
    .pin-eye:hover { color: var(--text); }
    .gate-err {
      min-height: 20px;
      margin: 0 0 8px;
      font-size: 0.83rem;
      font-weight: 600;
      color: var(--err);
      text-align: center;
    }
    .gate-submit {
      width: 100%;
      min-height: 48px;
      border: 0;
      border-radius: 11px;
      background: var(--teal-btn);
      color: #FFFFFF;
      font-size: 0.96rem;
      font-weight: 650;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background-color 140ms var(--ease), transform 100ms var(--ease);
    }
    .gate-submit:hover { background: var(--teal-btn-hover); }
    .gate-submit:active { transform: scale(0.985); }
    .gate-submit:disabled { opacity: 0.65; cursor: wait; }
    .gate-install-wrap {
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px solid var(--border-subtle);
      text-align: center;
    }
    .gate-install {
      width: 100%;
      min-height: 44px;
      border: 0;
      border-radius: 9px;
      background: transparent;
      color: var(--teal-text);
      font-size: 0.86rem;
      font-weight: 650;
      cursor: pointer;
      transition: background-color 140ms var(--ease);
    }
    .gate-install:hover { background: var(--teal-wash); }
    .gate-foot {
      margin: 16px 0 0;
      text-align: center;
      font-family: var(--font-mono);
      font-size: 0.70rem;
      color: var(--text-3);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ================= SHARED LANGUAGE PILL ================= */
    .lang-pill {
      display: inline-flex;
      align-items: center;
      padding: 2px;
      border-radius: 10px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      gap: 2px;
    }
    .lang-btn {
      border: 1px solid transparent;
      background: transparent;
      color: var(--text-3);
      min-height: 32px;
      min-width: 36px;
      padding: 0 10px;
      border-radius: 8px;
      font-size: 0.82rem;
      font-weight: 650;
      cursor: pointer;
      transition: background-color 140ms var(--ease), color 140ms var(--ease), transform 100ms var(--ease);
    }
    .lang-btn:hover { color: var(--text); }
    .lang-btn:active { transform: scale(0.97); }
    .lang-btn.is-active {
      background: var(--seg-active);
      color: var(--seg-active-text);
      box-shadow: var(--seg-shadow);
    }

    /* ================= SLEEK ZERO-BLOAT TOP UTILITY STRIP ================= */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 40;
      background: var(--chrome);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid transparent;
      transition: border-color 180ms var(--ease), box-shadow 180ms var(--ease);
    }
    .topbar.is-scrolled {
      border-bottom-color: var(--border);
      box-shadow: 0 4px 16px -12px rgba(12, 22, 34, 0.16);
    }
    .topbar-inner {
      max-width: var(--col-w);
      margin: 0 auto;
      padding: 6px var(--page-px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .prefs-trigger {
      min-height: 36px;
      min-width: 44px;
      padding: 0 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-family: var(--font-display);
      font-size: 0.92rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background-color 140ms var(--ease), border-color 140ms var(--ease), transform 100ms var(--ease);
    }
    .prefs-trigger:hover { background: var(--surface-2); border-color: var(--border-strong); }
    .prefs-trigger:active { transform: scale(0.97); }
    .prefs-trigger[aria-expanded="true"] {
      background: var(--teal-soft);
      border-color: var(--teal-border);
      color: var(--teal-text);
    }

    /* ================= MAIN EDITORIAL COLUMN ================= */
    .main-col {
      max-width: var(--col-w);
      margin: 0 auto;
      padding: 12px var(--page-px) calc(48px + env(safe-area-inset-bottom));
    }
    .block { margin-top: var(--sec-gap); }
    .block:first-of-type { margin-top: 0; }
    .block-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
      flex-wrap: wrap;
    }
    .block-title {
      margin: 0;
      font-size: 0.76rem;
      font-weight: 750;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-3);
    }
    html[dir="rtl"] .block-title { font-size: 0.89rem; font-weight: 700; }

    .ghost-pill {
      min-height: 36px;
      padding: 0 11px;
      border-radius: 9px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text-2);
      font-size: var(--fs-sm);
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: background-color 140ms var(--ease), border-color 140ms var(--ease), transform 100ms var(--ease);
    }
    .ghost-pill:hover { background: var(--surface-2); border-color: var(--border-strong); color: var(--text); }
    .ghost-pill:active { transform: scale(0.98); }

    /* ================= SMOOTH GRID-ROW ACCORDION ================= */
    .acc-wrap {
      display: grid;
      grid-template-rows: 0fr;
      transition: grid-template-rows 220ms var(--ease), opacity 180ms ease;
      opacity: 0;
    }
    .acc-wrap.is-open {
      grid-template-rows: 1fr;
      opacity: 1;
    }
    .acc-inner {
      overflow: hidden;
      min-height: 0;
    }
    @media (prefers-reduced-motion: reduce) {
      .acc-wrap, .chev, .ios-thumb, .prefs-sheet { transition: none !important; animation: none !important; }
    }

    /* ================= BLOCK 1: DE-BOXED 2-IN-1 PROBLEM CARDS ================= */
    .prob-list {
      display: flex;
      flex-direction: column;
      gap: var(--card-gap);
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r-lg);
      box-shadow: var(--card-highlight), var(--shadow-card);
      overflow: hidden;
    }
    .prob-card.is-alert {
      border-inline-start: 3.5px solid var(--coral);
    }
    .prob-body {
      padding: var(--card-py) var(--card-px) calc(var(--card-py) - 3px);
    }
    .prob-head {
      display: flex;
      align-items: baseline;
      gap: 9px;
      margin-bottom: 6px;
    }
    .prob-num {
      flex-shrink: 0;
      font-family: var(--font-mono);
      font-size: 0.78rem;
      font-weight: 750;
      font-variant-numeric: tabular-nums;
      color: var(--teal-text);
      line-height: 1.3;
    }
    .prob-card.is-alert .prob-num { color: var(--coral-text); }
    .prob-eyebrow-row {
      margin-bottom: 5px;
    }
    .prob-alert-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 1.5px 8px;
      border-radius: 6px;
      background: var(--coral-soft);
      border: 1px solid var(--coral-border);
      color: var(--coral-text);
      font-size: 0.72rem;
      font-weight: 750;
    }
    .prob-alert-dot {
      width: 6px;
      height: 6px;
      border-radius: 999px;
      background: var(--coral);
      flex-shrink: 0;
    }
    .prob-title {
      margin: 0;
      font-family: var(--font-display);
      font-size: var(--fs-title);
      font-weight: 700;
      line-height: 1.32;
      letter-spacing: -0.015em;
      color: var(--text);
    }
    html[dir="rtl"] .prob-title { font-family: var(--font-ar); line-height: 1.44; }
    .prob-summary {
      margin: 0;
      color: var(--text-2);
      max-width: 66ch;
    }

    /* Quiet Zero-Tear Disclosure Trigger (sits below summary when closed, below details when open!) */
    .card-disclosure {
      width: 100%;
      min-height: 40px;
      padding: 7px var(--card-px);
      border: 0;
      border-top: 1px solid var(--border-subtle);
      background: transparent;
      color: var(--teal-text);
      font-size: 0.80rem;
      font-weight: 600;
      line-height: 1.35;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      text-align: start;
      transition: background-color 140ms var(--ease), color 140ms var(--ease);
    }
    .card-disclosure:hover { background: var(--surface-2); }
    .prob-card.is-alert .card-disclosure { color: var(--coral-text); }
    .prob-card.is-alert .card-disclosure:hover { background: var(--coral-wash); }
    .chev {
      width: 15px;
      height: 15px;
      flex-shrink: 0;
      transition: transform 200ms var(--ease);
    }
    [aria-expanded="true"] .chev { transform: rotate(180deg); }

    .prob-details {
      padding: 2px var(--card-px) 10px;
      border-top: 1px dashed var(--border);
    }
    .detail-item {
      padding: 10px 0;
      border-bottom: 1px solid var(--border-subtle);
    }
    .detail-item:last-child { border-bottom: 0; padding-bottom: 2px; }
    .detail-label {
      font-size: var(--fs-sub);
      font-weight: 700;
      color: var(--text);
      margin-bottom: 3px;
    }
    .detail-text {
      margin: 0;
      color: var(--text-2);
      font-size: var(--fs-body);
      max-width: 66ch;
    }

    /* ================= BLOCK 2: SAFETY CARDS, TOP-ALIGNED WATCH LAB & UNIFIED A -> B SHEET ================= */
    .safety-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      align-items: start;
      gap: var(--card-gap);
      margin-bottom: 14px;
    }
    .safety-card.is-full { grid-column: 1 / -1; }
    .safety-card.sev-warn { border-inline-start: 3px solid var(--amber); }
    .safety-card.sev-info { border-inline-start: 3px solid var(--info); }
    .safety-body { padding: var(--card-py) var(--card-px) calc(var(--card-py) - 3px); }
    .safety-top {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 5px;
      margin-bottom: 7px;
    }
    .sev-badge {
      display: inline-flex;
      align-items: center;
      padding: 2px 8px;
      border-radius: 6px;
      font-size: 0.72rem;
      font-weight: 750;
      white-space: nowrap;
    }
    .sev-warn .sev-badge {
      background: var(--amber-soft);
      color: var(--amber-text);
      border: 1px solid var(--amber-border);
    }
    .sev-info .sev-badge {
      background: var(--info-soft);
      color: var(--info-text);
      border: 1px solid var(--info-border);
    }
    .safety-title {
      margin: 0;
      font-size: 0.97rem;
      font-weight: 700;
      color: var(--text);
      line-height: 1.34;
    }
    .safety-summary {
      margin: 0;
      color: var(--text-2);
      font-size: var(--fs-sub);
    }
    .safety-detail {
      padding: 10px var(--card-px) 12px;
      border-top: 1px dashed var(--border);
      color: var(--text-2);
      font-size: var(--fs-sub);
    }

    /* Watch Lab — Hero Value in Headline Row */
    .watch-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-inline-start: 3.5px solid var(--amber);
      border-radius: var(--r-lg);
      box-shadow: var(--card-highlight), var(--shadow-card);
      padding: var(--card-py) var(--card-px);
      margin-bottom: 14px;
    }
    .watch-head-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: nowrap;
      margin-bottom: 5px;
    }
    .watch-label {
      font-weight: 700;
      font-size: 0.97rem;
      color: var(--text);
      min-width: 0;
    }
    .watch-sub-row {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px 10px;
      margin-bottom: 7px;
    }
    .watch-badge {
      padding: 1.5px 8px;
      border-radius: 6px;
      font-size: 0.72rem;
      font-weight: 750;
      background: var(--amber-soft);
      color: var(--amber-text);
      border: 1px solid var(--amber-border);
    }
    .watch-val {
      font-family: var(--font-display);
      font-size: 1.36rem;
      font-weight: 800;
      line-height: 1.15;
      color: var(--amber-text);
      font-variant-numeric: tabular-nums;
      direction: ltr;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .watch-unit {
      font-size: 0.80rem;
      font-weight: 700;
      opacity: 1;
    }
    .watch-meta-line {
      font-size: 0.76rem;
      color: var(--text-3);
      font-variant-numeric: tabular-nums;
    }
    .watch-note {
      margin: 0;
      font-size: var(--fs-sm);
      color: var(--text-2);
    }

    /* Unified Borderless-Interior A -> B Lab Transitions Card */
    .trans-sheet {
      margin-bottom: 14px;
    }
    .trans-sheet-head {
      padding: var(--card-py) var(--card-px) 13px;
    }
    .sub-heading {
      margin: 0 0 8px;
      font-size: 0.98rem;
      font-weight: 750;
      color: var(--text);
    }
    .trans-takeaway {
      position: relative;
      overflow: hidden;
      margin: 0;
      padding: 8px 12px;
      padding-inline-start: 14px;
      border-radius: 7px;
      background: var(--teal-wash);
      font-size: var(--fs-sm);
      color: var(--text-2);
    }
    .trans-takeaway::before {
      content: "";
      position: absolute;
      inset-block: 0;
      inset-inline-start: 0;
      width: 3px;
      background: var(--teal);
      pointer-events: none;
    }
    .trans-rows {
      display: flex;
      flex-direction: column;
    }
    .trans-row {
      padding: 13px var(--card-px);
      border-top: 1px solid var(--border-subtle);
    }
    .trans-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 8px;
      flex-wrap: wrap;
    }
    .trans-name {
      font-weight: 700;
      font-size: 0.94rem;
      color: var(--text);
    }
    .trans-ref {
      font-family: var(--font-mono);
      font-size: 0.74rem;
      color: var(--text-3);
      font-variant-numeric: tabular-nums;
    }
    .trans-flow {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
      align-items: center;
      gap: 10px;
    }
    .trans-side {
      border-radius: 9px;
      padding: 8px 11px;
      min-width: 0;
    }
    .trans-side.is-before {
      background: var(--amber-wash);
    }
    .trans-side.is-after {
      position: relative;
      overflow: hidden;
      background: var(--teal-wash);
      padding-inline-start: 13px;
    }
    .trans-side.is-after::before {
      content: "";
      position: absolute;
      inset-block: 0;
      inset-inline-start: 0;
      width: 3px;
      background: var(--teal);
      pointer-events: none;
    }
    .trans-side-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      margin-bottom: 3px;
      flex-wrap: wrap;
    }
    .trans-kicker {
      font-size: 0.70rem;
      font-weight: 750;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--amber-text);
    }
    .trans-side.is-after .trans-kicker { color: var(--teal-text); }
    .trans-date {
      font-family: var(--font-mono);
      font-size: 0.71rem;
      color: var(--text-3);
      font-variant-numeric: tabular-nums;
    }
    .trans-val {
      font-family: var(--font-display);
      font-size: 1.24rem;
      font-weight: 750;
      line-height: 1.16;
      color: var(--amber-text);
      font-variant-numeric: tabular-nums;
      direction: ltr;
      text-align: start;
      margin-bottom: 3px;
    }
    .trans-side.is-after .trans-val {
      font-size: 1.34rem;
      font-weight: 800;
      color: var(--teal-text);
    }
    html[dir="rtl"] .trans-val { text-align: end; }
    .trans-unit {
      font-size: 0.77rem;
      font-weight: 700;
      opacity: 1;
    }
    .trans-status {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 0.74rem;
      font-weight: 700;
      color: var(--amber-text);
    }
    .trans-status.is-after { color: var(--teal-text); }
    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 999px;
      background: var(--amber);
      flex-shrink: 0;
    }
    .trans-arrow {
      display: grid;
      place-items: center;
      flex-shrink: 0;
    }
    .trans-arrow svg { width: 38px; height: 16px; display: block; }
    html[dir="rtl"] .trans-arrow svg { transform: scaleX(-1); }
    .trans-note {
      margin-top: 7px;
      font-size: 0.77rem;
      color: var(--text-3);
    }

    /* Collapsed Disclosure Bars (9 Normal Labs & Patient Baseline) */
    .disclosure-wrap {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r-lg);
      box-shadow: var(--card-highlight), var(--shadow-card);
      overflow: hidden;
    }
    .disclosure-bar {
      width: 100%;
      min-height: 46px;
      padding: 11px var(--card-px);
      border: 0;
      background: transparent;
      color: var(--text);
      font-size: var(--fs-sm);
      font-weight: 650;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      text-align: start;
      transition: background-color 140ms var(--ease);
    }
    .disclosure-bar:hover { background: var(--surface-2); }
    .disclosure-label { display: inline-flex; align-items: center; gap: 9px; }
    .teal-dot {
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: var(--teal);
      flex-shrink: 0;
    }
    .normal-labs-panel {
      border-top: 1px solid var(--border-subtle);
      padding: 4px var(--card-px) 10px;
    }
    .nlab-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0 22px;
    }
    .nlab-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 10px;
      padding: 8px 0;
      border-bottom: 1px solid var(--border-subtle);
    }
    .nlab-row:last-child { border-bottom: 0; }
    @media (min-width: 620px) {
      .nlab-row:nth-last-child(2):nth-child(odd) { border-bottom: 0; }
    }
    .nlab-name { font-size: var(--fs-sm); font-weight: 600; color: var(--text); }
    .nlab-right { text-align: end; flex-shrink: 0; }
    .nlab-val {
      display: block;
      font-size: var(--fs-sm);
      font-weight: 700;
      color: var(--teal-text);
      font-variant-numeric: tabular-nums;
      direction: ltr;
    }
    .nlab-meta {
      display: block;
      font-size: 0.72rem;
      color: var(--text-3);
      font-variant-numeric: tabular-nums;
    }

    /* ================= BLOCK 3: COLLAPSED PATIENT BASELINE ================= */
    .baseline-panel {
      border-top: 1px solid var(--border-subtle);
      padding: 4px var(--card-px) 12px;
    }
    .baseline-list { margin: 0; }
    .baseline-row {
      display: grid;
      grid-template-columns: minmax(140px, 190px) minmax(0, 1fr);
      gap: 4px 16px;
      padding: 9px 0;
      border-bottom: 1px solid var(--border-subtle);
    }
    .baseline-row:last-child { border-bottom: 0; padding-bottom: 2px; }
    .baseline-row dt { font-size: var(--fs-sm); font-weight: 700; color: var(--text-3); }
    .baseline-row dd { margin: 0; font-size: var(--fs-sub); color: var(--text-2); }

    /* ================= UNIFIED Aa PREFERENCES POPOVER / MOBILE SHEET ================= */
    .prefs-backdrop {
      position: fixed;
      inset: 0;
      z-index: 90;
      background: transparent;
    }
    .prefs-sheet {
      position: fixed;
      z-index: 100;
      width: 344px;
      max-width: calc(100vw - 24px);
      max-height: calc(100dvh - 80px);
      overflow-y: auto;
      background: var(--sheet-bg);
      border: 1px solid var(--border-strong);
      border-radius: 16px;
      box-shadow: var(--card-highlight), var(--shadow-pop);
      padding: 15px 15px 13px;
      animation: popIn 160ms var(--ease);
    }
    .prefs-handle { display: none; }
    .prefs-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 13px;
    }
    .prefs-title { margin: 0; font-size: 0.95rem; font-weight: 750; color: var(--text); }
    .prefs-close {
      width: 38px;
      height: 38px;
      border-radius: 9px;
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--text-2);
      font-size: 1.15rem;
      line-height: 1;
      display: grid;
      place-items: center;
      cursor: pointer;
    }
    .prefs-close:hover { background: var(--surface-3); color: var(--text); }
    .pref-group { margin-bottom: 12px; }
    .pref-label {
      display: block;
      margin-bottom: 6px;
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--text-3);
    }
    .seg-row {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 3px;
      padding: 3px;
      border-radius: 10px;
      background: var(--surface-2);
      border: 1px solid var(--border);
    }
    .seg-row.cols-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .seg-btn {
      min-height: 36px;
      padding: 6px;
      border: 0;
      border-radius: 7px;
      background: transparent;
      color: var(--text-3);
      font-size: 0.79rem;
      font-weight: 650;
      line-height: 1.22;
      white-space: normal;
      text-align: center;
      cursor: pointer;
      transition: background-color 140ms var(--ease), color 140ms var(--ease);
    }
    .seg-btn:hover { color: var(--text); }
    .seg-btn.is-active {
      background: var(--seg-active);
      color: var(--seg-active-text);
      box-shadow: var(--seg-shadow);
    }
    .prefs-actions {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 7px;
      padding-top: 11px;
      margin-top: 11px;
      border-top: 1px solid var(--border-subtle);
    }
    .pref-act-btn {
      min-height: 40px;
      padding: 7px 6px;
      border-radius: 9px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-2);
      font-size: 0.77rem;
      font-weight: 650;
      line-height: 1.2;
      text-align: center;
      cursor: pointer;
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      transition: background-color 140ms var(--ease), border-color 140ms var(--ease), color 140ms var(--ease);
    }
    .pref-act-btn:hover { background: var(--surface-2); border-color: var(--border-strong); color: var(--text); }
    .pref-act-btn.is-lock:hover { background: var(--coral-soft); border-color: var(--coral-border); color: var(--coral-text); }
    .prefs-reset {
      display: block;
      width: 100%;
      margin-top: 9px;
      min-height: 36px;
      border: 0;
      background: transparent;
      color: var(--text-3);
      font-size: 0.79rem;
      font-weight: 600;
      cursor: pointer;
      border-radius: 8px;
    }
    .prefs-reset:hover { background: var(--surface-2); color: var(--text); }

    /* ================= MOBILE ERGONOMICS (320px–767px) ================= */
    @media (max-width: 767px) {
      :root {
        --page-px: 13px;
        --card-py: 13px;
        --card-px: 15px;
        --card-gap: 10px;
      }
      .topbar-inner { padding: 3px var(--page-px); }
      .lang-pill { padding: 1px; }
      .lang-btn { border: 0; min-height: 44px; min-width: 44px; padding: 0 9px; font-size: 0.84rem; }
      .prefs-trigger { min-height: 44px; min-width: 46px; }
      .ghost-pill { min-height: 44px; }
      .card-disclosure { min-height: 44px; padding: 8px var(--card-px); }
      .disclosure-bar { min-height: 46px; }
      .prefs-close { width: 44px; height: 44px; }
      .seg-btn { min-height: 44px; }
      .pref-act-btn { min-height: 48px; }
      .prefs-reset { min-height: 44px; }

      .prefs-backdrop { background: var(--backdrop); }
      .prefs-sheet {
        left: 0 !important;
        right: 0 !important;
        top: auto !important;
        bottom: 0;
        width: 100%;
        max-width: 100%;
        max-height: 86dvh;
        border-radius: 20px 20px 0 0;
        border-inline: 0;
        border-bottom: 0;
        padding: 10px 16px calc(18px + env(safe-area-inset-bottom));
        animation: sheetUp 180ms var(--ease);
      }
      .prefs-handle {
        display: block;
        width: 38px;
        height: 4px;
        border-radius: 999px;
        background: var(--border-strong);
        margin: 0 auto 12px;
      }
    }
    @media (max-width: 639px) {
      .safety-grid { grid-template-columns: minmax(0, 1fr); }
      .nlab-grid { grid-template-columns: minmax(0, 1fr); }
      .baseline-row { grid-template-columns: minmax(0, 1fr); gap: 3px; }
    }
    @media (max-width: 400px) {
      :root { --page-px: 11px; --card-px: 13px; }
      .trans-flow { gap: 6px; }
      .trans-side { padding: 7px 8px; }
      .trans-val { font-size: 1.08rem; }
      .trans-side.is-after .trans-val { font-size: 1.15rem; }
      .trans-arrow svg { width: 26px; height: 14px; }
    }

    @media print { body { display: none !important; } }
  </style>
</head>

          <button type="button" class="lang-btn" data-lang="ar">ع</button>
          <button type="button" class="lang-btn" data-lang="en">EN</button>
        </div>
        <button type="button" id="prefsBtn" class="prefs-trigger" aria-haspopup="dialog" aria-expanded="false" aria-controls="prefsSheet">Aa</button>
      </div>
    </header>
    <main id="appMain" class="main-col"></main>

    function readPref(key, allowed, fallback) {
      try {
        const v = localStorage.getItem(key);
        return allowed.includes(v) ? v : fallback;
      } catch { return fallback; }
    }
    function writePref(key, val) {
      try { localStorage.setItem(key, val); } catch {}
    }

    // ================= CRYPTO HELPERS =================
    function fromB64(b64) {
      const bin = atob(b64);
      const out = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
      return out;
    }
    async function deriveAesKey(pin, saltU8, iter) {
      const base = await crypto.subtle.importKey('raw', enc.encode(pin), 'PBKDF2', false, ['deriveKey']);
      return crypto.subtle.deriveKey(
        { name: 'PBKDF2', salt: saltU8, iterations: iter, hash: 'SHA-256' },
        base,
        { name: 'AES-GCM', length: 256 },
        false,
        ['decrypt']
      );
    }
    async function decryptBundle(pin) {
      const key = await deriveAesKey(pin, fromB64(BUNDLE.salt), BUNDLE.iter);
      const buf = await crypto.subtle.decrypt(
        { name: 'AES-GCM', iv: fromB64(BUNDLE.iv) },
        key,
        fromB64(BUNDLE.ct)
      );
      return JSON.parse(dec.decode(buf));
    }

    // ================= HTML, FR TYPOGRAPHY & ARABIC RTL BIDI HELPERS =================
    function esc(str) {
      return String(str == null ? '' : str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }
    function fmt(str) {
      let s = String(str == null ? '' : str);
      if (prefs.lang === 'fr') {
        s = s
          .replace(/« /g, '«\u202F')
          .replace(/ »/g, '\u202F»')
          .replace(/ ([:;?!%])/g, '\u202F$1');
        return esc(s);
      }
      if (prefs.lang !== 'ar') return esc(s);
      // Isolate Latin/numeric runs cleanly without swallowing trailing sentence punctuation
      // Include leading × so multiplier tokens stay one contiguous LTR run
      const re = /([~<>\u00B5\u00D7]?[A-Za-z0-9\u00C0-\u024F](?:[A-Za-z0-9\u00C0-\u024F\u00B5_/%+\u00D7\-\u2013]|(?:[.:](?=[A-Za-z0-9])))*(?:(?:\s+|\s+[\-\u2013\u2014+\u00D7]\s+)[~<>\u00B5\u00D7]?[A-Za-z0-9\u00C0-\u024F](?:[A-Za-z0-9\u00C0-\u024F\u00B5_/%+\u00D7\-\u2013]|(?:[.:](?=[A-Za-z0-9])))*)*)/g;
      let out = '';
      let last = 0;
      let m;
      while ((m = re.exec(s)) !== null) {
        if (m.index > last) out += esc(s.slice(last, m.index));
        out += '<bdi class="ltr-tok" dir="ltr">' + esc(m[0]) + '</bdi>';
        last = re.lastIndex;
      }
      if (last < s.length) out += esc(s.slice(last));
      return out;
    }

    // ================= DISPLAY PREFERENCES =================
    function applyDisplayPrefs() {
      const r = document.documentElement;
      r.dataset.font = prefs.font;
      r.dataset.spacing = prefs.spacing;
      r.dataset.cards = prefs.cards;
      r.lang = prefs.lang;
      r.dir = prefs.lang === 'ar' ? 'rtl' : 'ltr';

      document.querySelectorAll('.lang-btn').forEach(btn => {
        const active = btn.dataset.lang === prefs.lang;
        btn.classList.toggle('is-active', active);
        btn.setAttribute('aria-pressed', active ? 'true' : 'false');
      });

      renderGateText();
      if (DATA) {
        const d = DATA[prefs.lang];
        document.title = d.docTitle;
        const pBtn = $('prefsBtn');
        pBtn.setAttribute('aria-label', d.ui.prefsBtn);
        pBtn.setAttribute('title', d.ui.prefsBtn);
        if (prefsOpen) {
          renderPrefsSheet();
          positionPrefsSheet();
        }
      }
    }

    function setLang(lang) {
      if (lang !== 'fr' && lang !== 'ar' && lang !== 'en') return;
      prefs.lang = lang;
      writePref('fiche_lang', lang);
      applyDisplayPrefs();

      prefs.spacing = spacing;
      writePref('fiche_spacing', spacing);
      applyDisplayPrefs();
    }
    function setCards(cards) {
      if (!['compact', 'spacious'].includes(cards)) return;
      prefs.cards = cards;
      writePref('fiche_cards', cards);
      applyDisplayPrefs();
    }
    function resetDisplayPrefs() {
      prefs.font = 'md';
      prefs.spacing = 'normal';
      prefs.cards = 'spacious';
      writePref('fiche_font', prefs.font);
      writePref('fiche_spacing', prefs.spacing);
      writePref('fiche_cards', prefs.cards);
      applyDisplayPrefs();
    }

    // ================= GATE & SYNCHRONOUS INSTANT LOCK =================
    function renderGateText() {
      const g = GATE_UI[prefs.lang] || GATE_UI.fr;
      $('gateTitle').textContent = g.title;
      $('gateSub').textContent = g.sub;
      $('pinInput').placeholder = g.placeholder;
      if (!$('unlockBtn').disabled) $('unlockBtn').textContent = g.btn;
      $('gateFoot').textContent = g.foot;
      $('installBtn').textContent = g.install;
      const shown = $('pinInput').type === 'text';
      $('pinEyeBtn').setAttribute('aria-label', shown ? g.hidePin : g.showPin);
    }

    async function handleUnlock(e) {
      e.preventDefault();
      const g = GATE_UI[prefs.lang] || GATE_UI.fr;
      if (!window.crypto || !window.crypto.subtle) {
        $('gateErr').textContent = g.badCrypto;
        return;
      }
      const pin = $('pinInput').value.trim();
      if (!pin) return;
      $('gateErr').textContent = '';
      $('unlockBtn').disabled = true;
      $('unlockBtn').textContent = g.busy;
      try {
        const decrypted = await decryptBundle(pin);
        DATA = decrypted;
        $('pinInput').value = '';
        $('pinInput').type = 'password';
        $('pinEyeBtn').setAttribute('aria-pressed', 'false');
        $('gate').hidden = true;
        $('app').hidden = false;
        applyDisplayPrefs();
        renderApp();
        window.scrollTo(0, 0);
      } catch {
        $('gateErr').textContent = g.err;
        $('pinInput').focus();
        $('pinInput').select();
      } finally {
        $('unlockBtn').disabled = false;
        $('unlockBtn').textContent = g.btn;
      }
    }

    function lockApp() {
      closePrefsSheet(false);
      DATA = null;
      openProbs.clear();
      openSafety.clear();
      normalLabsOpen = false;
      baselineOpen = false;
      $('appMain').innerHTML = '';
      $('prefsSheet').innerHTML = '';
      $('app').hidden = true;
      $('gate').hidden = false;
      $('gateErr').textContent = '';
      $('pinInput').value = '';
      $('pinInput').type = 'password';
      $('pinEyeBtn').setAttribute('aria-pressed', 'false');
      document.title = 'Fiche clinique · مذكرة سريرية · Clinical Note';
      renderGateText();
      $('pinInput').focus();
    }

    // ================= PREFERENCES SHEET =================
    function allProblemsExpanded() {
      if (!DATA) return false;
      const probs = DATA[prefs.lang].problems;
      return probs.length > 0 && probs.every(p => openProbs.has(p.id));
    }

    function updateExpandAllButtons() {
      if (!DATA) return;
      const ui = DATA[prefs.lang].ui;
      const lbl = allProblemsExpanded() ? ui.collapseAll : ui.expandAll;
      const mainBtn = $('expandAllBtn');
      if (mainBtn) mainBtn.textContent = lbl;
      const sheetSpan = $('prefsSheet').querySelector('[data-act-expand] span');
      if (sheetSpan) sheetSpan.textContent = lbl;
    }

    function setAccordionState(wrapEl, btnEl, isOpen, closedLabel, openLabel) {
      if (wrapEl) {
        wrapEl.classList.toggle('is-open', isOpen);
        wrapEl.setAttribute('aria-hidden', String(!isOpen));
        const inner = wrapEl.firstElementChild;
        if (inner) inner.inert = !isOpen;
      }
      if (btnEl) {
        btnEl.setAttribute('aria-expanded', String(isOpen));
        if (closedLabel != null && openLabel != null) {
          const sp = btnEl.querySelector('.disc-txt');
          if (sp) sp.textContent = isOpen ? openLabel : closedLabel;
        }
      }
    }

    function toggleExpandAllProblems() {
      if (!DATA) return;
      const d = DATA[prefs.lang];
      const ui = d.ui;
      const expand = !allProblemsExpanded();
      if (expand) d.problems.forEach(p => openProbs.add(p.id));
      else openProbs.clear();
      d.problems.forEach(p => {
        const isOpen = openProbs.has(p.id);
        const btn = $('appMain').querySelector('[data-toggle-prob="' + p.id + '"]');
        const wrap = $('det-' + p.id);
        setAccordionState(wrap, btn, isOpen, p.detailHint, ui.detailsHide);
      });
      updateExpandAllButtons();
    }

    function renderPrefsSheet() {
      if (!DATA) return;
      const ui = DATA[prefs.lang].ui;
      const allOpen = allProblemsExpanded();
      $('prefsSheet').innerHTML = `
        <div class="prefs-handle" aria-hidden="true"></div>
        <div class="prefs-head">
          <h2 id="prefsTitle" class="prefs-title">${esc(ui.prefsTitle)}</h2>
          <button type="button" class="prefs-close" data-prefs-close aria-label="${esc(ui.dismiss)}" title="${esc(ui.dismiss)}">&times;</button>
        </div>
        <div class="pref-group">
          <span class="pref-label">${esc(ui.fontSizeLabel)}</span>
          <div class="seg-row">
            <button type="button" class="seg-btn${prefs.font === 'sm' ? ' is-active' : ''}" data-set-font="sm" aria-pressed="${prefs.font === 'sm'}">${esc(ui.fontSm)}</button>
            <button type="button" class="seg-btn${prefs.font === 'md' ? ' is-active' : ''}" data-set-font="md" aria-pressed="${prefs.font === 'md'}">${esc(ui.fontMd)}</button>
            <button type="button" class="seg-btn${prefs.font === 'lg' ? ' is-active' : ''}" data-set-font="lg" aria-pressed="${prefs.font === 'lg'}">${esc(ui.fontLg)}</button>
          </div>
        </div>
        <div class="pref-group">
          <span class="pref-label">${esc(ui.spacingLabel)}</span>
          <div class="seg-row">
            <button type="button" class="seg-btn${prefs.spacing === 'compact' ? ' is-active' : ''}" data-set-spacing="compact" aria-pressed="${prefs.spacing === 'compact'}">${esc(ui.spacingCompact)}</button>
            <button type="button" class="seg-btn${prefs.spacing === 'normal' ? ' is-active' : ''}" data-set-spacing="normal" aria-pressed="${prefs.spacing === 'normal'}">${esc(ui.spacingNormal)}</button>
            <button type="button" class="seg-btn${prefs.spacing === 'relaxed' ? ' is-active' : ''}" data-set-spacing="relaxed" aria-pressed="${prefs.spacing === 'relaxed'}">${esc(ui.spacingRelaxed)}</button>
          </div>
        </div>
        <div class="pref-group">
          <span class="pref-label">${esc(ui.cardDensityLabel)}</span>
          <div class="seg-row cols-2">
            <button type="button" class="seg-btn${prefs.cards === 'compact' ? ' is-active' : ''}" data-set-cards="compact" aria-pressed="${prefs.cards === 'compact'}">${esc(ui.cardCompact)}</button>
            <button type="button" class="seg-btn${prefs.cards === 'spacious' ? ' is-active' : ''}" data-set-cards="spacious" aria-pressed="${prefs.cards === 'spacious'}">${esc(ui.cardSpacious)}</button>
          </div>
        </div>
        <div class="prefs-actions">
          <button type="button" class="pref-act-btn" data-act-expand>
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m7 15 5 5 5-5"/><path d="m7 9 5-5 5 5"/></svg>
            <span>${esc(allOpen ? ui.collapseAll : ui.expandAll)}</span>
          </button>
          <button type="button" class="pref-act-btn is-lock" data-act-lock>
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            <span>${esc(ui.lockBtn)}</span>
          </button>
        </div>
        <button type="button" class="prefs-reset" data-act-reset>${esc(ui.prefsReset)}</button>
      `;
    }

    function positionPrefsSheet() {
      const sheet = $('prefsSheet');
      if (window.innerWidth <= 767) {
        sheet.style.left = '';
        sheet.style.top = '';
        return;
      }
      const btnRect = $('prefsBtn').getBoundingClientRect();
      const sw = Math.min(344, window.innerWidth - 24);
      const isRtl = document.documentElement.dir === 'rtl';
      let left = isRtl ? btnRect.left : (btnRect.right - sw);
      left = Math.max(12, Math.min(left, window.innerWidth - sw - 12));
      const top = Math.max(12, btnRect.bottom + 8);
      sheet.style.left = left + 'px';
      sheet.style.top = top + 'px';
    }

    function openPrefsSheet() {
      if (!DATA) return;
      prefsOpen = true;
      renderPrefsSheet();
      $('prefsBackdrop').hidden = false;
      $('prefsSheet').hidden = false;
      $('prefsBtn').setAttribute('aria-expanded', 'true');
      positionPrefsSheet();
    }

    function closePrefsSheet(returnFocus = true) {
      if (!prefsOpen) return;
      prefsOpen = false;
      $('prefsBackdrop').hidden = true;
      $('prefsSheet').hidden = true;
      $('prefsBtn').setAttribute('aria-expanded', 'false');
      if (returnFocus && !$('app').hidden) $('prefsBtn').focus();
    }

    // ================= MAIN APP RENDERER (Initial Unlock & Lang Switch Only) =================
    const CHEV_SVG = '<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>';

    function renderArrowSvg(idx) {
      const gid = 'arrGrad' + idx;
      return `<svg viewBox="0 0 40 16" fill="none" aria-hidden="true">
        <defs>
          <linearGradient id="${gid}" x1="0" y1="8" x2="38" y2="8" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="var(--amber)"/>
            <stop offset="100%" stop-color="var(--teal)"/>
          </linearGradient>
        </defs>
        <line x1="2" y1="8" x2="30" y2="8" stroke="url(#${gid})" stroke-width="2.4" stroke-linecap="round"/>
        <path d="M27.5 3L37.5 8L27.5 13Z" fill="var(--teal)"/>
      </svg>`;
    }

    function renderApp() {
      if (!DATA) return;
      const d = DATA[prefs.lang];
      const ui = d.ui;
      const allOpen = allProblemsExpanded();

      // Block 1: 5 De-Boxed 2-in-1 Presenting Problems
      const probsHtml = d.problems.map(p => {
        const isOpen = openProbs.has(p.id);
        const alertPill = p.alertBadge
          ? '<span class="prob-alert-badge"><span class="prob-alert-dot" aria-hidden="true"></span><span>' + esc(p.alertBadge) + '</span></span>'
          : '';
        const detHtml = p.details.map(item => `
          <div class="detail-item">
            <div class="detail-label">${fmt(item.label)}</div>
            <p class="detail-text">${fmt(item.text)}</p>
          </div>`).join('');
        return `
          <article class="card prob-card${p.tone === 'alert' ? ' is-alert' : ''}" data-prob-id="${esc(p.id)}">
            <div class="prob-body">
              ${alertPill ? '<div class="prob-eyebrow-row">' + alertPill + '</div>' : ''}
              <div class="prob-head">
                <span class="prob-num" dir="ltr">${esc(p.num)}</span>
                <h3 class="prob-title">${fmt(p.title)}</h3>
              </div>
              <p class="prob-summary">${fmt(p.summary)}</p>
            </div>
            <div class="acc-wrap${isOpen ? ' is-open' : ''}" id="det-${esc(p.id)}" aria-hidden="${!isOpen}">
              <div class="acc-inner"${isOpen ? '' : ' inert'}>
                <div class="prob-details">${detHtml}</div>
              </div>
            </div>
            <button type="button" class="card-disclosure" data-toggle-prob="${esc(p.id)}" aria-expanded="${isOpen}" aria-controls="det-${esc(p.id)}">
              <span class="disc-txt">${fmt(isOpen ? ui.detailsHide : p.detailHint)}</span>
              ${CHEV_SVG}
            </button>
          </article>`;
      }).join('');

      // Block 2: Uniform Safety Cards + Headline WBC Watch Lab + Unified A -> B Sheet + Collapsed 9 Normal Labs
      const safetyCardsHtml = d.safety.cards.map((c, idx) => {
        const isOpen = openSafety.has(c.id);
        return `
          <article class="card safety-card sev-${esc(c.severity)}${idx === 0 ? ' is-full' : ''}">
            <div class="safety-body">
              <div class="safety-top">
                <span class="sev-badge">${fmt(c.badge)}</span>
                <h3 class="safety-title">${fmt(c.title)}</h3>
              </div>
              <p class="safety-summary">${fmt(c.summary)}</p>
            </div>
            <div class="acc-wrap${isOpen ? ' is-open' : ''}" id="sdet-${esc(c.id)}" aria-hidden="${!isOpen}">
              <div class="acc-inner"${isOpen ? '' : ' inert'}>
                <div class="safety-detail">${fmt(c.detail)}</div>
              </div>
            </div>
            <button type="button" class="card-disclosure" data-toggle-safety="${esc(c.id)}" aria-expanded="${isOpen}" aria-controls="sdet-${esc(c.id)}">
              <span class="disc-txt">${fmt(isOpen ? ui.detailsHide : c.detailHint)}</span>
              ${CHEV_SVG}
            </button>
          </article>`;
      }).join('');

      const w = d.safety.watchLab;
      const watchHtml = `
        <article class="watch-card">
          <div class="watch-head-row">
            <span class="watch-label">${fmt(w.label)}</span>
            <span class="watch-val" dir="ltr">${esc(w.value)} <span class="watch-unit">${esc(w.unit)}</span></span>
          </div>
          <div class="watch-sub-row">
            <span class="watch-badge">${fmt(w.badge)}</span>
            <span class="watch-meta-line"><bdi class="ltr-tok" dir="ltr">${esc(w.date)}</bdi> · ${esc(ui.labRef)} <bdi class="ltr-tok" dir="ltr">${esc(w.ref)} ${esc(w.unit)}</bdi></span>
          </div>
          <p class="watch-note">${fmt(w.note)}</p>
        </article>`;

      const transRowsHtml = d.safety.transitions.map((t, i) => `
        <div class="trans-row">
          <div class="trans-head">
            <span class="trans-name">${fmt(t.label)}</span>
            <span class="trans-ref">${esc(ui.labRef)} <bdi class="ltr-tok" dir="ltr">${esc(t.ref)} ${esc(t.unit)}</bdi></span>
          </div>
          <div class="trans-flow">
            <div class="trans-side is-before">
              <div class="trans-side-top">
                <span class="trans-kicker">${esc(ui.labBefore)}</span>
                <span class="trans-date" dir="ltr">${esc(t.beforeDate)}</span>
              </div>
              <div class="trans-val" dir="ltr">${esc(t.before)} <span class="trans-unit">${esc(t.unit)}</span></div>
              <span class="trans-status"><span class="status-dot" aria-hidden="true"></span><span>${fmt(t.beforeTag)}</span></span>
            </div>
            <div class="trans-arrow" aria-hidden="true">${renderArrowSvg(i)}</div>
            <div class="trans-side is-after">
              <div class="trans-side-top">
                <span class="trans-kicker">${esc(ui.labAfter)}</span>
                <span class="trans-date" dir="ltr">${esc(t.afterDate)}</span>
              </div>
              <div class="trans-val" dir="ltr">${esc(t.after)} <span class="trans-unit">${esc(t.unit)}</span></div>
              <span class="trans-status is-after">${fmt(t.afterTag)}</span>
            </div>
          </div>
          <div class="trans-note">${fmt(t.note)}</div>
        </div>`).join('');

      const normalLabsHtml = d.safety.normalLabs.map(n => `
        <div class="nlab-row">
          <span class="nlab-name">${fmt(n.label)}</span>
          <span class="nlab-right">
            <span class="nlab-val" dir="ltr">${esc(n.value)} ${esc(n.unit)}</span>
            <span class="nlab-meta"><bdi class="ltr-tok" dir="ltr">${esc(n.date)}</bdi> · ${esc(ui.labRef)} <bdi class="ltr-tok" dir="ltr">${esc(n.ref)}</bdi></span>
          </span>
        </div>`).join('');

      // Block 3: Collapsed Patient Baseline
      const baselineRowsHtml = d.baseline.items.map(row => `
        <div class="baseline-row">
          <dt>${fmt(row.label)}</dt>
          <dd>${fmt(row.value)}</dd>
        </div>`).join('');

      $('appMain').innerHTML = `
        <section class="block" id="block-problems" aria-labelledby="h-problems">
          <div class="block-head">
            <h2 id="h-problems" class="block-title">${esc(ui.problemsTitle)}</h2>
            <button type="button" id="expandAllBtn" class="ghost-pill">${esc(allOpen ? ui.collapseAll : ui.expandAll)}</button>
          </div>
          <div class="prob-list">${probsHtml}</div>
        </section>

        <section class="block" id="block-safety" aria-labelledby="h-safety">
          <div class="block-head">
            <h2 id="h-safety" class="block-title">${esc(ui.safetyTitle)}</h2>
          </div>
          <div class="safety-grid">${safetyCardsHtml}</div>
          ${watchHtml}
          <article class="card trans-sheet">
            <div class="trans-sheet-head">
              <h3 class="sub-heading">${fmt(d.safety.transitionsTitle)}</h3>
              <p class="trans-takeaway">${fmt(d.safety.transitionsNote)}</p>
            </div>
            <div class="trans-rows">${transRowsHtml}</div>
          </article>
          <div class="disclosure-wrap">
            <button type="button" class="disclosure-bar" id="normalLabsToggle" aria-expanded="${normalLabsOpen}" aria-controls="normalLabsPanel">
              <span class="disclosure-label"><span class="teal-dot" aria-hidden="true"></span><span>${fmt(ui.normalLabsToggle)}</span></span>
              ${CHEV_SVG}
            </button>
            <div class="acc-wrap${normalLabsOpen ? ' is-open' : ''}" id="normalLabsPanel" aria-hidden="${!normalLabsOpen}">
              <div class="acc-inner"${normalLabsOpen ? '' : ' inert'}>
                <div class="normal-labs-panel">
                  <div class="nlab-grid">${normalLabsHtml}</div>
                </div>
              </div>
            </div>
          </div>
        </section>

        <section class="block" id="block-baseline" aria-labelledby="baselineToggle">
          <div class="disclosure-wrap">
            <button type="button" class="disclosure-bar" id="baselineToggle" aria-expanded="${baselineOpen}" aria-controls="baselinePanel">
              <span class="disclosure-label">${esc(ui.baselineTitle)}</span>
              ${CHEV_SVG}
            </button>
            <div class="acc-wrap${baselineOpen ? ' is-open' : ''}" id="baselinePanel" aria-hidden="${!baselineOpen}">
              <div class="acc-inner"${baselineOpen ? '' : ' inert'}>
                <div class="baseline-panel">
                  <dl class="baseline-list">${baselineRowsHtml}</dl>
                </div>
              </div>
            </div>
          </div>
        </section>

      `;
    }

    // ================= EVENT DELEGATION =================
    document.addEventListener('click', (e) => {
      const langBtn = e.target.closest('.lang-btn');
      if (langBtn) { setLang(langBtn.dataset.lang); return; }
    });

    $('pinEyeBtn').addEventListener('click', () => {
      const inp = $('pinInput');
      const show = inp.type === 'password';
      inp.type = show ? 'text' : 'password';
      $('pinEyeBtn').setAttribute('aria-pressed', show ? 'true' : 'false');
      renderGateText();
      inp.focus();
    });

    $('pinForm').addEventListener('submit', handleUnlock);

    $('prefsBtn').addEventListener('click', () => {
      if (prefsOpen) closePrefsSheet(true);
      else openPrefsSheet();
    });
    $('prefsBackdrop').addEventListener('click', () => closePrefsSheet(true));

    $('prefsSheet').addEventListener('click', (e) => {
      if (e.target.closest('[data-prefs-close]')) { closePrefsSheet(true); return; }
      const fo = e.target.closest('[data-set-font]');
      if (fo) { setFont(fo.dataset.setFont); return; }
      const sp = e.target.closest('[data-set-spacing]');
      if (sp) { setSpacing(sp.dataset.setSpacing); return; }
      const ca = e.target.closest('[data-set-cards]');
      if (ca) { setCards(ca.dataset.setCards); return; }
      if (e.target.closest('[data-act-expand]')) { toggleExpandAllProblems(); return; }
      if (e.target.closest('[data-act-lock]')) { lockApp(); return; }
      if (e.target.closest('[data-act-reset]')) { resetDisplayPrefs(); return; }
    });

    $('appMain').addEventListener('click', (e) => {
      if (e.target.closest('#expandAllBtn')) { toggleExpandAllProblems(); return; }

      const probBtn = e.target.closest('[data-toggle-prob]');
      if (probBtn) {
        const id = probBtn.dataset.toggleProb;
        const d = DATA[prefs.lang];
        const p = d.problems.find(x => x.id === id);
        const isOpen = !openProbs.has(id);
        if (isOpen) openProbs.add(id);
        else openProbs.delete(id);
        setAccordionState($('det-' + id), probBtn, isOpen, p ? p.detailHint : '', d.ui.detailsHide);
        updateExpandAllButtons();
        return;
      }

      const safBtn = e.target.closest('[data-toggle-safety]');
      if (safBtn) {
        const id = safBtn.dataset.toggleSafety;
        const d = DATA[prefs.lang];
        const c = d.safety.cards.find(x => x.id === id);
        const isOpen = !openSafety.has(id);
        if (isOpen) openSafety.add(id);
        else openSafety.delete(id);
        setAccordionState($('sdet-' + id), safBtn, isOpen, c ? c.detailHint : '', d.ui.detailsHide);
        return;
      }

      const nlabBtn = e.target.closest('#normalLabsToggle');
      if (nlabBtn) {
        normalLabsOpen = !normalLabsOpen;
        setAccordionState($('normalLabsPanel'), nlabBtn, normalLabsOpen);
        return;
      }

      const baseBtn = e.target.closest('#baselineToggle');
      if (baseBtn) {
        baselineOpen = !baselineOpen;
        setAccordionState($('baselinePanel'), baseBtn, baselineOpen);
        return;
      }

    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && prefsOpen) {
        e.preventDefault();
        closePrefsSheet(true);
      }
    });

    window.addEventListener('resize', () => {
      if (prefsOpen) positionPrefsSheet();
    });

    window.addEventListener('scroll', () => {
      const bar = $('topbar');
      if (bar) bar.classList.toggle('is-scrolled', window.scrollY > 8);
    }, { passive: true });

    // ================= PWA INSTALL & SERVICE WORKER =================
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredInstall = e;
      $('installWrap').hidden = false;
    });
    $('installBtn').addEventListener('click', async () => {
      if (!deferredInstall) return;
      deferredInstall.prompt();
      try { await deferredInstall.userChoice; } catch {}
      deferredInstall = null;
      $('installWrap').hidden = true;
    });
    window.addEventListener('appinstalled', () => {
      deferredInstall = null;
      $('installWrap').hidden = true;
    });

    if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    }

    // Boot (clean up legacy removed workspace & theme keys)
    try { localStorage.removeItem('fiche_enc_ws_v2'); localStorage.removeItem('fiche_theme'); } catch {}
    applyDisplayPrefs();
    $('pinInput').focus();
  })();
  </script>
</body>
</html>
