      /* Smooth Catmull-Rom to Cubic Bezier SVG Path Helper */
      function buildSpline(pts) {
        if (!pts.length) return "";
        if (pts.length === 1) return "M " + pts[0][0].toFixed(1) + " " + pts[0][1].toFixed(1);
        let d = "M " + pts[0][0].toFixed(1) + " " + pts[0][1].toFixed(1);
        for (let i = 0; i < pts.length - 1; i++) {
          const p0 = pts[Math.max(0, i - 1)];
          const p1 = pts[i];
          const p2 = pts[i + 1];
          const p3 = pts[Math.min(pts.length - 1, i + 2)];
          const c1x = p1[0] + (p2[0] - p0[0]) / 6;
          const c1y = p1[1] + (p2[1] - p0[1]) / 6;
          const c2x = p2[0] - (p3[0] - p1[0]) / 6;
          const c2y = p2[1] - (p3[1] - p1[1]) / 6;
          d += " C " + c1x.toFixed(1) + " " + c1y.toFixed(1) + ", " + c2x.toFixed(1) + " " + c2y.toFixed(1) + ", " + p2[0].toFixed(1) + " " + p2[1].toFixed(1);
        }
        return d;
      }

      /* =======================================================================
         VIZ 1: V3.3 PSYCHOPHYSICAL PROFILE (PATIENT-ONLY PRECISION BARS)
         ======================================================================= */
      function renderV33Profile(vp, isRtl, qNorm) {
        if (!vp || !Array.isArray(vp.metrics) || !vp.metrics.length) return "";
        const padL = 12, padR = 46, W = 380, plotW = W - padL - padR;
        const mapX = (pct) => padL + (Math.max(0, Math.min(100, Number(pct) || 0)) / 100) * plotW;

        const rowsHtml = vp.metrics.map((m) => {
          const val = Number(m.score) || 0;
          const x = mapX(val);
          const isBot = m.tone === "coral";
          const col = isBot ? "var(--coral)" : "var(--teal)";
          const colText = isBot ? "var(--coral-text)" : "var(--teal-text)";
          const tipT = esc(m.label);
          const tipB = esc(m.detail);

          const trackSvg = '<svg class="viz-svg lollipop-svg" viewBox="0 0 ' + W + ' 30" dir="ltr" role="img" aria-label="' + esc(m.label + ": " + m.detail) + '">'
            + '<line x1="' + padL + '" y1="15" x2="' + (W - padR) + '" y2="15" stroke="var(--track-bg)" stroke-width="5" stroke-linecap="round"></line>'
            + '<line x1="' + padL + '" y1="15" x2="' + x.toFixed(1) + '" y2="15" stroke="' + col + '" stroke-width="5" stroke-linecap="round" opacity="0.88"></line>'
            + '<circle cx="' + x.toFixed(1) + '" cy="15" r="5.6" fill="' + col + '" stroke="var(--surface)" stroke-width="1.8"></circle>'
            + '<text x="' + (x + 10).toFixed(1) + '" y="18.8" text-anchor="start" direction="ltr" fill="' + colText + '" font-size="11.2" font-weight="700" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">' + val + '%</text>'
            + '<rect class="svg-hit" tabindex="0" x="0" y="2" width="' + W + '" height="26" fill="transparent" data-tip-title="' + tipT + '" data-tip-body="' + tipB + '"></rect>'
            + "</svg>";

          return '<div class="lollipop-row' + (isBot ? " is-bottleneck" : "") + '">'
            + '<div class="lollipop-meta">'
              + '<span class="lollipop-name">' + fmt(m.label, isRtl, qNorm) + "</span>"
              + '<div class="lollipop-vals">' + fmt(m.detail, isRtl, qNorm) + "</div>"
            + "</div>"
            + '<div class="lollipop-track-wrap" dir="ltr">' + trackSvg + "</div>"
            + "</div>";
        }).join("");

        return '<figure id="fig-01" class="figure-card">'
          + '<div class="fig-head"><h3 class="fig-title">' + fmt(vp.title, isRtl, qNorm) + "</h3></div>"
          + '<div class="lollipop-list">' + rowsHtml + "</div>"
          + (vp.gatesNote ? '<div class="fig-footnotes"><p>' + fmt(vp.gatesNote, isRtl, qNorm) + "</p></div>" : "")
          + "</figure>";
      }

      /* =======================================================================
         VIZ 2: DIRECT-LABELED RESPONSE BREAKDOWN BAR SVG (ZERO SEPARATE LEGEND)
         ======================================================================= */
      function renderErrorAnatomy(da, isRtl, qNorm) {
        if (!da || !Array.isArray(da.rows) || !da.rows.length) return "";
        const segShort = da.segShort || {};
        const segDefs = [
          { key: "hit", color: "var(--bar-hit)", label: segShort.hit || "" },
          { key: "swap", color: "var(--bar-swap)", label: segShort.swap || "" },
          { key: "stale", color: "var(--bar-stale)", label: segShort.stale || "" },
          { key: "guess", color: "var(--bar-guess)", label: segShort.guess || "" }
        ];

        const rowsHtml = da.rows.map((row, rIdx) => {
          const W = 500, H = 36;
          const activeSegs = segDefs.filter((s) => Number(row[s.key]) > 0);
          const gap = 2.5;
          const totalGap = Math.max(0, activeSegs.length - 1) * gap;
          const availW = W - totalGap;
          let curX = 0;
          const clipId = "anatClip" + rIdx;
          const txtDir = isRtl
            ? 'direction="rtl" unicode-bidi="isolate" font-family="var(--font-ar)" font-size="12.5"'
            : 'direction="ltr" font-family="var(--font-sans)" font-size="12"';

          const rects = activeSegs.map((s) => {
            const val = Number(row[s.key]) || 0;
            const segW = (val / 100) * availW;
            const x = curX;
            curX += segW + gap;
            const tipT = esc(row.label + " · " + s.label);
            const tipB = esc(val + "%" + (da.note ? " — " + da.note : ""));
            const inBarTxt = (segW >= 96 && s.label) ? (s.label + " " + val + "%") : (val + "%");
            return '<g class="svg-hit anat-seg" tabindex="0" data-tip-title="' + tipT + '" data-tip-body="' + tipB + '">'
              + '<rect x="' + x.toFixed(1) + '" y="2" width="' + segW.toFixed(1) + '" height="' + (H - 4) + '" fill="' + s.color + '" rx="2"></rect>'
              + (segW >= 42
                ? '<text x="' + (x + segW / 2).toFixed(1) + '" y="' + (H / 2 + 4.4).toFixed(1) + '" text-anchor="middle" ' + txtDir + ' fill="var(--bar-text)" font-weight="700">' + esc(inBarTxt) + '</text>'
                : "")
              + "</g>";
          }).join("");

          const ariaParts = activeSegs.map((s) => s.label + " " + row[s.key] + "%").join(", ");
          const svg = '<svg class="viz-svg anat-svg" viewBox="0 0 ' + W + " " + H + '" dir="ltr" role="img" aria-label="' + esc(row.label + ": " + ariaParts) + '">'
            + '<defs><clipPath id="' + clipId + '"><rect x="0" y="2" width="' + W + '" height="' + (H - 4) + '" rx="8"></rect></clipPath></defs>'
            + '<rect x="0" y="2" width="' + W + '" height="' + (H - 4) + '" rx="8" fill="var(--track-bg)"></rect>'
            + '<g clip-path="url(#' + clipId + ')">' + rects + "</g>"
            + "</svg>";

          return '<div class="anat-row">'
            + '<div class="anat-top">'
              + '<span class="anat-lbl">' + fmt(row.label, isRtl, qNorm) + "</span>"
            + "</div>"
            + '<div dir="ltr">' + svg + "</div>"
            + "</div>";
        }).join("");

        return '<figure id="fig-02" class="figure-card">'
          + '<div class="fig-head"><h3 class="fig-title">' + fmt(da.title, isRtl, qNorm) + "</h3>"
            + (da.note ? '<span class="fig-note">' + fmt(da.note, isRtl, qNorm) + "</span>" : "")
          + "</div>"
          + '<div class="anat-list">' + rowsHtml + "</div>"
          + "</figure>";
      }

      /* =======================================================================
         VIZ 3: DUAL-STATE 5-MIN VIGILANCE SPLINE CHART (DIRECT SERIES LABELS)
         ======================================================================= */
      function renderVigilanceChart(pv, isRtl, qNorm) {
        if (!pv || !pv.alert || !pv.fatigued) return "";
        const aPtsRaw = Array.isArray(pv.alert.points) ? pv.alert.points.map(Number).filter(Number.isFinite) : [];
        const fPtsRaw = Array.isArray(pv.fatigued.points) ? pv.fatigued.points.map(Number).filter(Number.isFinite) : [];
        if (aPtsRaw.length < 2 || fPtsRaw.length < 2) return "";

        const allVals = aPtsRaw.concat(fPtsRaw);
        const yMin = typeof pv.yMin === "number" ? pv.yMin : Math.floor((Math.min(...allVals) - 0.3) * 10) / 10;
        const yMax = typeof pv.yMax === "number" ? pv.yMax : Math.ceil((Math.max(...allVals) + 0.3) * 10) / 10;
        const span = Math.max(0.4, yMax - yMin);

        const W = 680, H = 232;
        const padL = 50, padR = 132, padT = 20, padB = 34;
        const x0 = padL, x1 = W - padR, plotW = x1 - x0;
        const y0 = padT, y1 = H - padB, plotH = y1 - y0;
        const n = Math.max(aPtsRaw.length, fPtsRaw.length);
        const mapX = (i, len) => x0 + (i / Math.max(1, len - 1)) * plotW;
        const mapY = (v) => y0 + ((yMax - v) / span) * plotH;

        const aPts = aPtsRaw.map((v, i) => [mapX(i, aPtsRaw.length), mapY(v)]);
        const fPts = fPtsRaw.map((v, i) => [mapX(i, fPtsRaw.length), mapY(v)]);
        const aPath = buildSpline(aPts);
        const fPath = buildSpline(fPts);

        const fRev = fPts.slice().reverse();
        const fRevSpline = buildSpline(fRev).replace(/^M/, "L");
        const gapPoly = aPath + " " + fRevSpline + " Z";
        const aArea = aPath + " L " + aPts[aPts.length - 1][0].toFixed(1) + " " + y1 + " L " + aPts[0][0].toFixed(1) + " " + y1 + " Z";

        const ySteps = 4;
        let gridSvg = "";
        for (let i = 0; i <= ySteps; i++) {
          const val = yMin + (span * i) / ySteps;
          const gy = mapY(val);
          gridSvg += '<line x1="' + x0 + '" y1="' + gy.toFixed(1) + '" x2="' + x1 + '" y2="' + gy.toFixed(1) + '" stroke="var(--gridline)" stroke-width="1"></line>';
          gridSvg += '<text x="' + (x0 - 8) + '" y="' + (gy + 3.5).toFixed(1) + '" text-anchor="end" direction="ltr" fill="var(--text-3)" font-size="10.2" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">' + val.toFixed(1) + "</text>";
        }

        let labelYA = aPts[aPts.length - 1][1];
        let labelYF = fPts[fPts.length - 1][1];
        if (Math.abs(labelYF - labelYA) < 26) {
          const mid = (labelYA + labelYF) / 2;
          labelYA = mid - 14;
          labelYF = mid + 14;
        }
        const gx = x1 + 14;
        const endLabelsSvg =
          '<g class="svg-hit pvt-series-alert" tabindex="0" data-pvt-hover="alert" data-tip-title="' + esc(pv.alert.label) + '" data-tip-body="' + esc(pv.alert.summary) + '">'
            + '<rect x="' + (gx - 6) + '" y="' + (labelYA - 11).toFixed(1) + '" width="' + (W - gx + 4) + '" height="22" fill="transparent"></rect>'
            + '<circle cx="' + gx + '" cy="' + labelYA.toFixed(1) + '" r="3.6" fill="var(--teal)"></circle>'
            + '<text x="' + (gx + 9) + '" y="' + (labelYA + 3.8).toFixed(1) + '" text-anchor="start" direction="ltr" fill="var(--teal-text)" font-size="11" font-weight="700" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">' + esc(pv.alert.shortTag) + "</text>"
          + "</g>"
          + '<g class="svg-hit pvt-series-fatigued" tabindex="0" data-pvt-hover="fatigued" data-tip-title="' + esc(pv.fatigued.label) + '" data-tip-body="' + esc(pv.fatigued.summary) + '">'
            + '<rect x="' + (gx - 6) + '" y="' + (labelYF - 11).toFixed(1) + '" width="' + (W - gx + 4) + '" height="22" fill="transparent"></rect>'
            + '<circle cx="' + gx + '" cy="' + labelYF.toFixed(1) + '" r="3.6" fill="var(--surface)" stroke="var(--coral)" stroke-width="2"></circle>'
            + '<text x="' + (gx + 9) + '" y="' + (labelYF + 3.8).toFixed(1) + '" text-anchor="start" direction="ltr" fill="var(--coral-text)" font-size="11" font-weight="700" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">' + esc(pv.fatigued.shortTag) + "</text>"
          + "</g>";

        const xTicks = Array.isArray(pv.xTicks) ? pv.xTicks : [];
        const colW = plotW / Math.max(1, n - 1);
        let xAxisSvg = "";
        let interactSvg = "";
        for (let i = 0; i < n; i++) {
          const px = mapX(i, n);
          const tickLbl = xTicks[i] || "";
          const anchor = i === 0 ? "start" : (i === n - 1 ? "end" : "middle");
          xAxisSvg += '<line x1="' + px.toFixed(1) + '" y1="' + y1 + '" x2="' + px.toFixed(1) + '" y2="' + (y1 + 5) + '" stroke="var(--border-strong)" stroke-width="1"></line>';
          xAxisSvg += '<text x="' + px.toFixed(1) + '" y="' + (y1 + 20) + '" text-anchor="' + anchor + '" direction="ltr" fill="var(--text-3)" font-size="10.2" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">' + esc(tickLbl) + "</text>";

          const av = aPtsRaw[Math.min(i, aPtsRaw.length - 1)];
          const fv = fPtsRaw[Math.min(i, fPtsRaw.length - 1)];
          const ay = aPts[Math.min(i, aPts.length - 1)][1];
          const fy = fPts[Math.min(i, fPts.length - 1)][1];
          const hitX = Math.max(x0 - 12, px - colW / 2);
          const hitW = Math.min(x1 + 12, px + colW / 2) - hitX;
          const unitStr = pv.unit ? " " + pv.unit : "";
          const tipTitle = esc(tickLbl);
          const tipBody = esc(pv.alert.label + ": " + av.toFixed(2) + unitStr + "  |  " + pv.fatigued.label + ": " + fv.toFixed(2) + unitStr);
          interactSvg += '<g class="pvt-col-group">'
            + '<line class="pvt-crosshair" x1="' + px.toFixed(1) + '" y1="' + y0 + '" x2="' + px.toFixed(1) + '" y2="' + y1 + '" stroke="var(--border-strong)" stroke-width="1" stroke-dasharray="2 3"></line>'
            + '<circle class="pvt-pt-ring pvt-series-alert" cx="' + px.toFixed(1) + '" cy="' + ay.toFixed(1) + '" r="3.8" fill="var(--teal)" stroke="var(--surface)" stroke-width="1.8"></circle>'
            + '<circle class="pvt-pt-ring pvt-series-fatigued" cx="' + px.toFixed(1) + '" cy="' + fy.toFixed(1) + '" r="3.8" fill="var(--surface)" stroke="var(--coral)" stroke-width="2.1"></circle>'
            + '<rect class="svg-hit pvt-col-hit" tabindex="0" x="' + hitX.toFixed(1) + '" y="' + y0 + '" width="' + Math.max(24, hitW).toFixed(1) + '" height="' + plotH + '" data-tip-title="' + tipTitle + '" data-tip-body="' + tipBody + '"></rect>'
            + "</g>";
        }

        const aria = esc(pv.title + ": " + pv.alert.shortTag + " vs " + pv.fatigued.shortTag);
        const svg = '<svg class="viz-svg pvt-svg" viewBox="0 0 ' + W + " " + H + '" dir="ltr" direction="ltr" role="img" aria-label="' + aria + '">'
          + '<defs>'
            + '<linearGradient id="vigGapGrad" x1="0" y1="0" x2="1" y2="0">'
              + '<stop offset="0%" style="stop-color:var(--coral);stop-opacity:0.04"></stop>'
              + '<stop offset="100%" style="stop-color:var(--coral);stop-opacity:0.15"></stop>'
            + "</linearGradient>"
            + '<linearGradient id="vigAlertGrad" x1="0" y1="0" x2="0" y2="1">'
              + '<stop offset="0%" style="stop-color:var(--teal);stop-opacity:0.08"></stop>'
              + '<stop offset="100%" style="stop-color:var(--teal);stop-opacity:0.0"></stop>'
            + "</linearGradient>"
          + "</defs>"
          + '<text x="' + (x0 - 8) + '" y="12" text-anchor="end" direction="ltr" fill="var(--text-3)" font-size="9.5" font-weight="600" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">' + esc(pv.unit || "") + "</text>"
          + gridSvg
          + '<path class="pvt-series-alert" d="' + aArea + '" fill="url(#vigAlertGrad)"></path>'
          + '<path class="pvt-series-gap" d="' + gapPoly + '" fill="url(#vigGapGrad)"></path>'
          + '<line x1="' + x0 + '" y1="' + y1 + '" x2="' + x1 + '" y2="' + y1 + '" stroke="var(--border-strong)" stroke-width="1"></line>'
          + '<path class="pvt-series-fatigued" d="' + fPath + '" fill="none" stroke="var(--coral)" stroke-width="2.6" stroke-dasharray="7 4.5" stroke-linecap="round" stroke-linejoin="round"></path>'
          + '<path class="pvt-series-alert" d="' + aPath + '" fill="none" stroke="var(--teal)" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"></path>'
          + xAxisSvg
          + endLabelsSvg
          + interactSvg
          + '<path class="pvt-curve-hit" d="' + fPath + '" data-pvt-hover="fatigued" data-tip-title="' + esc(pv.fatigued.label) + '" data-tip-body="' + esc(pv.fatigued.summary) + '"></path>'
          + '<path class="pvt-curve-hit" d="' + aPath + '" data-pvt-hover="alert" data-tip-title="' + esc(pv.alert.label) + '" data-tip-body="' + esc(pv.alert.summary) + '"></path>'
          + "</svg>";

        return '<figure id="fig-03" class="figure-card">'
          + '<div class="fig-head"><h3 class="fig-title">' + fmt(pv.title, isRtl, qNorm) + "</h3></div>"
          + '<div class="pvt-svg-box" dir="ltr">' + svg + "</div>"
          + '<div class="pvt-legend-grid">'
            + '<div class="pvt-leg-card" tabindex="0" data-pvt-hover="alert">'
              + '<div class="pvt-leg-lbl">' + fmt(pv.alert.label, isRtl, qNorm) + '</div><div class="pvt-leg-sum">' + fmt(pv.alert.summary, isRtl, qNorm) + "</div>"
            + "</div>"
            + '<div class="pvt-leg-card" tabindex="0" data-pvt-hover="fatigued">'
              + '<div class="pvt-leg-lbl">' + fmt(pv.fatigued.label, isRtl, qNorm) + '</div><div class="pvt-leg-sum">' + fmt(pv.fatigued.summary, isRtl, qNorm) + "</div>"
            + "</div>"
          + "</div>"
          + "</figure>";
      }

      /* =======================================================================
         VIZ 5A: PRECISION LINEAR GAUGE SVG (SPOTLIGHT WATCH BIOMARKER)
         ======================================================================= */
      function renderSpotlightGauge(lb, refLbl) {
        const W = 860, H = 34;
        const padL = 14, padR = 14, trackW = W - padL - padR;
        const span = Math.max(0.1, lb.max - lb.min);
        const mapX = (v) => padL + Math.max(0, Math.min(1, (v - lb.min) / span)) * trackW;

        const zL = mapX(lb.rLow);
        const zR = mapX(lb.rHigh);
        const cX = mapX(lb.curr);
        const trackY = 9, trackH = 7;

        const tipT = esc(lb.label + " (" + lb.date + ")");
        const tipB = esc(lb.currStr + " " + lb.unit + " · " + (refLbl || "Ref") + " " + lb.ref + (lb.note ? " — " + lb.note : ""));

        return '<svg class="viz-svg spot-svg" viewBox="0 0 ' + W + " " + H + '" dir="ltr" direction="ltr" role="img" aria-label="' + tipT + ": " + tipB + '">'
          + '<rect x="' + padL + '" y="' + trackY + '" width="' + trackW + '" height="' + trackH + '" rx="3.5" fill="var(--track-bg)"></rect>'
          + '<rect x="' + padL + '" y="' + trackY + '" width="' + Math.max(0, zL - padL).toFixed(1) + '" height="' + trackH + '" rx="3.5" fill="var(--caution-bg)"></rect>'
          + '<rect x="' + zL.toFixed(1) + '" y="' + trackY + '" width="' + Math.max(4, zR - zL).toFixed(1) + '" height="' + trackH + '" rx="2" fill="var(--zone-bg)"></rect>'
          + '<line x1="' + zL.toFixed(1) + '" y1="' + (trackY - 3) + '" x2="' + zL.toFixed(1) + '" y2="' + (trackY + trackH + 3.5) + '" stroke="var(--zone-edge)" stroke-width="1.6"></line>'
          + '<line x1="' + zR.toFixed(1) + '" y1="' + (trackY - 3) + '" x2="' + zR.toFixed(1) + '" y2="' + (trackY + trackH + 3.5) + '" stroke="var(--zone-edge)" stroke-width="1.6"></line>'
          + '<text x="' + zL.toFixed(1) + '" y="' + (trackY + trackH + 14.5) + '" text-anchor="middle" direction="ltr" fill="var(--text-3)" font-size="11" font-weight="600" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">' + esc(lb.rLow.toFixed(1)) + "</text>"
          + '<text x="' + zR.toFixed(1) + '" y="' + (trackY + trackH + 14.5) + '" text-anchor="middle" direction="ltr" fill="var(--text-3)" font-size="11" font-weight="600" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">' + esc(lb.rHigh.toFixed(1)) + "</text>"
          + '<g class="svg-hit" tabindex="0" data-tip-title="' + tipT + '" data-tip-body="' + tipB + '">'
            + '<circle cx="' + cX.toFixed(1) + '" cy="' + (trackY + trackH / 2) + '" r="10.5" fill="var(--amber-soft)"></circle>'
            + '<circle cx="' + cX.toFixed(1) + '" cy="' + (trackY + trackH / 2) + '" r="5.2" fill="var(--amber)" stroke="var(--surface)" stroke-width="2"></circle>'
            + '<circle cx="' + cX.toFixed(1) + '" cy="' + (trackY + trackH / 2) + '" r="16" fill="transparent"></circle>'
          + "</g>"
          + "</svg>";
      }

      function renderMiniBar(lb, qNorm) {
        const span = Math.max(0.01, lb.max - lb.min);
        const clamp = (v) => Math.max(2, Math.min(98, ((v - lb.min) / span) * 100));
        const zL = Math.max(0, Math.min(100, ((lb.rLow - lb.min) / span) * 100));
        const zR = Math.max(0, Math.min(100, ((lb.rHigh - lb.min) / span) * 100));
        const cP = clamp(lb.curr);
        let prevHtml = "";
        if (typeof lb.prev === "number") {
          const pP = clamp(lb.prev);
          const dL = Math.min(pP, cP);
          const dW = Math.abs(cP - pP);
          prevHtml = '<span class="mini-delta" style="left:' + dL.toFixed(1) + "%;width:" + dW.toFixed(1) + '%"></span>'
            + '<span class="mini-dot-prev" style="left:' + pP.toFixed(1) + '%"></span>';
        }
        return '<div class="mini-viz" dir="ltr">'
          + '<div class="mini-track" aria-hidden="true">'
            + '<span class="mini-zone" style="left:' + zL.toFixed(1) + "%;width:" + Math.max(3, zR - zL).toFixed(1) + '%"></span>'
            + prevHtml
            + '<span class="mini-dot-curr" style="left:' + cP.toFixed(1) + '%"></span>'
          + "</div>"
          + (lb.ref ? '<span class="mini-ref">' + fmt(lb.ref, false, qNorm) + "</span>" : "")
          + "</div>";
      }

      /* =======================================================================
         CHROME, MARGIN RAIL & SHEET RENDERING
         ======================================================================= */
      function renderChrome(instantPill) {
        if (!data || !data[lang]) return;
        const d = data[lang];
        const ui = d.ui || {};
        const secs = d.sections || {};
        const isRtl = d.dir === "rtl";

        root.lang = d.lang;
        root.dir = d.dir;
        document.title = d.docTitle;

        printBtn.setAttribute("aria-label", ui.printBtn || "Print");
        printBtn.setAttribute("title", ui.printBtn || "Print");
        lockBtn.setAttribute("aria-label", ui.lockBtn || "Lock");
        lockBtn.setAttribute("title", ui.lockBtn || "Lock");
        scBtn.setAttribute("aria-label", ui.shortcutsBtn || "Shortcuts");
        scBtn.setAttribute("title", ui.shortcutsBtn || "Shortcuts");
        floatTopBtn.setAttribute("aria-label", ui.topBtn || "Back to top");
        floatTopBtn.setAttribute("title", ui.topBtn || "Back to top");

        btnBrief.textContent = ui.densityBrief || "Brief";
        btnFull.textContent = ui.densityFull || "Full";
        densityCtrl.setAttribute("aria-label", ui.densityAria || "Display density");

        searchInput.placeholder = ui.searchPlaceholder || "";
        searchInput.setAttribute("aria-label", ui.searchPlaceholder || "Search");
        searchClear.setAttribute("aria-label", ui.searchClear || "Clear");
        searchClear.setAttribute("title", ui.searchClear || "Clear");

        langBtns.forEach((btn) => {
          const active = btn.dataset.loc === lang;
          btn.classList.toggle("is-active", active);
          btn.setAttribute("aria-pressed", active ? "true" : "false");
        });
        densBtns.forEach((btn) => {
          const active = btn.dataset.dens === density;
          btn.classList.toggle("is-active", active);
          btn.setAttribute("aria-pressed", active ? "true" : "false");
        });

        const navMap = ui.nav || {};
        navLinks.innerHTML = NAV_ORDER.filter((k) => navMap[k]).map((k) => {
          const active = k === activeNav;
          const num = (secs[k] && secs[k].num) || "";
          return '<button class="nav-link' + (active ? " is-active" : "") + '" type="button" data-target="' + esc(k) + '"' + (active ? ' aria-current="location"' : "") + '>'
            + (num ? '<span class="nav-num"><bdi dir="ltr">' + esc(num) + "</bdi></span>" : "")
            + "<span>" + fmt(navMap[k], isRtl, "") + "</span></button>";
        }).join("");

        /* Desktop Ambient Margin Rail */
        marginRail.innerHTML =
          '<div class="rail-kicker-row">'
            + '<span class="rail-kicker">' + esc(ui.chaptersLabel || "Contents") + "</span>"
          + "</div>"
          + '<div class="rail-list">'
            + '<span class="rail-progress-track" aria-hidden="true"><span class="rail-progress-fill"></span></span>'
            + NAV_ORDER.filter((k) => navMap[k]).map((k) => {
                const active = k === activeNav;
                const num = (secs[k] && secs[k].num) || "";
                return '<button class="rail-item' + (active ? " is-active" : "") + '" type="button" data-target="' + esc(k) + '"' + (active ? ' aria-current="location"' : "") + '>'
                  + '<span class="rail-num"><bdi dir="ltr">' + esc(num) + "</bdi></span>"
                  + '<span class="rail-lbl">' + fmt(navMap[k], isRtl, "") + "</span>"
                  + "</button>";
              }).join("")
          + "</div>"
          + '<div class="rail-tools">'
            + '<button class="rail-tool-btn rail-top-btn' + ((window.scrollY || 0) < 240 ? " is-dim" : "") + '" type="button" data-rail-act="top" title="' + esc(ui.topBtn || "Top") + '">' + ICO_UP + '<span>' + esc(ui.topBtn || "Top") + "</span></button>"
            + '<button class="rail-tool-btn" type="button" data-rail-act="shortcuts" aria-label="' + esc(ui.shortcutsBtn || "Shortcuts") + '" title="' + esc(ui.shortcutsBtn || "Shortcuts") + '">' + ICO_KBD + "</button>"
          + "</div>";

        syncThemeControl();
        syncMobileDock();
        syncAllPills(Boolean(instantPill));
        requestAnimationFrame(syncNavFade);
      }

      function renderExpandBtn(key, expandedNow, ui, hideForSearch) {
        if (density !== "brief" || hideForSearch) return "";
        const lbl = expandedNow ? (ui.collapseDetail || "Hide detail") : (ui.expandDetail || "Show detail");
        return '<button class="item-expand" type="button" data-item-key="' + esc(key) + '" aria-expanded="' + (expandedNow ? "true" : "false") + '" title="' + esc(lbl) + '"><span>' + esc(lbl) + "</span>" + ICO_CHEV + "</button>";
      }

      function renderSecHead(sec, id, ui, isRtl, qNorm, extraBadgeHtml) {
        return '<div class="sec-head">'
          + '<span class="sec-num"><bdi dir="ltr">' + esc(sec.num) + "</bdi></span>"
          + '<h2 class="sec-title">' + fmt(sec.title, isRtl, qNorm) + "</h2>"
          + '<span class="sec-rule" aria-hidden="true"></span>'
          + (extraBadgeHtml || "")
          + (id !== "priorities"
            ? '<button class="sec-top-mini" type="button" data-scroll-top="1" aria-label="' + esc(ui.topBtn || "Top") + '" title="' + esc(ui.topBtn || "Top") + '">' + ICO_UP + "</button>"
            : "")
          + "</div>";
      }

      function renderXrefs(targets, fromSec, secs, ui, isRtl) {
        if (!targets || !targets.length) return "";
        const navMap = ui.nav || {};
        return '<div class="xref-row">' + targets.filter((t) => secs[t]).map((t) => {
          const num = secs[t].num;
          const lbl = navMap[t] || secs[t].title;
          return '<button class="xref-chip" type="button" data-jump-sec="' + esc(t) + '" data-from-sec="' + esc(fromSec) + '">'
            + ICO_JUMP + '<span><bdi dir="ltr">' + esc(num) + "</bdi> · " + fmt(lbl, isRtl, "") + "</span></button>";
        }).join("") + "</div>";
      }

      function getAllExpandableKeys(secs) {
        const keys = [];
        if (secs.priorities && secs.priorities.goals) {
          secs.priorities.goals.forEach((g, i) => { if (g.detail) keys.push("p-" + i); });
        }
        if (secs.cognition && secs.cognition.detail) keys.push("cog-0");
        if (secs.cognition && secs.cognition.items) {
          secs.cognition.items.forEach((it, i) => { if (it.detail) keys.push("cg-" + i); });
        }
        if (secs.sleep && secs.sleep.items) {
          secs.sleep.items.forEach((it, i) => { if (it.detail) keys.push("sl-" + i); });
        }
        if (secs.mood && secs.mood.items) {
          secs.mood.items.forEach((it, i) => { if (it.detail) keys.push("md-" + i); });
        }
        if (secs.safety && secs.safety.baselineItems) {
          secs.safety.baselineItems.forEach((b, i) => { if (b.detail) keys.push("sf-" + i); });
        }
        return keys;
      }

      function renderBrief(animate, opts) {
        if (!data || !data[lang]) return;
        const ropts = opts || {};
        const d = data[lang];
        const ui = d.ui || {};
        const secs = d.sections || {};
        const isRtl = d.dir === "rtl";
        const qNorm = normText(searchQuery.trim());
        const hasQ = Boolean(qNorm);
        let matchCount = 0;

        const matches = (...parts) => !hasQ || parts.some((p) => normText(p).includes(qNorm));
        const mastheadMatch = hasQ && matches(d.title, d.subtitle, d.profileLine, d.date);
        if (mastheadMatch) matchCount += 1;

        const sectionsHtml = [];

        /* 01 · PRIORITIES */
        const s1 = secs.priorities;
        if (s1) {
          const ccMatch = matches(s1.chiefComplaintLabel, s1.chiefComplaint);
          const keptGoals = (s1.goals || []).map((g, i) => ({ g, i })).filter(({ g }) => matches(g.title, g.brief, g.detail));
          const keptSynth = (s1.synthesis || []).map((s, i) => ({ s, i })).filter(({ s }) => matches(s.lead, s.text));
          if (hasQ) matchCount += (ccMatch ? 1 : 0) + keptGoals.length + keptSynth.length;

          if (ccMatch || keptGoals.length || keptSynth.length) {
            const goalsHtml = keptGoals.map(({ g, i }) => {
              const key = "p-" + i;
              const isOpen = expandedItems.has(key);
              const searchOpen = hasQ && density === "brief";
              const expNow = density === "full" || isOpen || searchOpen;
              return '<li class="goal-row expandable' + (isOpen ? " is-open" : "") + (searchOpen ? " is-search-open" : "") + '">'
                + '<span class="goal-idx"><bdi dir="ltr">' + String(i + 1) + ".</bdi></span>"
                + '<div class="goal-body">'
                  + '<div class="goal-head"><span class="goal-title">' + fmt(g.title, isRtl, qNorm) + "</span>" + (g.detail ? renderExpandBtn(key, expNow, ui, searchOpen) : "") + "</div>"
                  + '<p class="goal-brief">' + fmt(g.brief, isRtl, qNorm) + "</p>"
                  + (g.detail ? '<p class="goal-detail detail-text">' + fmt(g.detail, isRtl, qNorm) + "</p>" : "")
                + "</div>"
                + "</li>";
            }).join("");

            const synthHtml = keptSynth.map(({ s, i }) =>
              '<div class="synth-col">'
                + '<div><h4 class="synth-lead">' + fmt(s.lead, isRtl, qNorm) + '</h4><p class="synth-text">' + fmt(s.text, isRtl, qNorm) + "</p></div>"
                + renderXrefs(SYNTH_TARGETS[i], "priorities", secs, ui, isRtl)
              + "</div>"
            ).join("");

            sectionsHtml.push(
              '<section id="sec-priorities" class="ed-section">'
                + renderSecHead(s1, "priorities", ui, isRtl, qNorm)
                + (ccMatch ? '<div class="chief-block"><div class="kicker">' + fmt(s1.chiefComplaintLabel, isRtl, qNorm) + '</div><p class="chief-text">' + fmt(s1.chiefComplaint, isRtl, qNorm) + "</p></div>" : "")
                + (keptGoals.length ? '<div class="goals-block"><div class="kicker">' + fmt(s1.goalsLabel, isRtl, "") + '</div><ol class="goals-list">' + goalsHtml + "</ol></div>" : "")
                + (keptSynth.length ? '<div><div class="kicker">' + fmt(s1.synthesisLabel, isRtl, "") + '</div><div class="synth-grid">' + synthHtml + "</div></div>" : "")
              + "</section>"
            );
          }
        }

        /* 02 · COGNITION */
        const s2 = secs.cognition;
        if (s2) {
          const proseMatch = matches(s2.takeaway, s2.detail);
          const keptCogItems = (s2.items || []).map((it, i) => ({ it, i })).filter(({ it }) => matches(it.lead, it.brief, it.detail));
          const vp = s2.v33Profile;
          const vpMatch = vp && matches(
            vp.title, vp.gatesNote,
            ...(vp.metrics || []).flatMap((m) => [m.label, m.detail])
          );
          const da = s2.d2Anatomy;
          const daMatch = da && matches(
            da.title, da.note,
            ...(da.rows || []).flatMap((r) => [r.label])
          );
          const pv = s2.pvtDual;
          const pvMatch = pv && matches(
            pv.title,
            pv.alert && pv.alert.label, pv.alert && pv.alert.summary, pv.alert && pv.alert.shortTag,
            pv.fatigued && pv.fatigued.label, pv.fatigued && pv.fatigued.summary, pv.fatigued && pv.fatigued.shortTag
          );
          const sp = s2.spatialNote;
          const spMatch = sp && matches(sp.lead, sp.text);
          if (hasQ) matchCount += (proseMatch ? 1 : 0) + keptCogItems.length + (vpMatch ? 1 : 0) + (daMatch ? 1 : 0) + (pvMatch ? 1 : 0) + (spMatch ? 1 : 0);

          if (proseMatch || keptCogItems.length || vpMatch || daMatch || pvMatch || spMatch) {
            const cogKey = "cog-0";
            const cogOpen = expandedItems.has(cogKey);
            const cogSearchOpen = hasQ && density === "brief";
            const cogExpNow = density === "full" || cogOpen || cogSearchOpen;
            const colonSep = lang === "fr" ? "\u00A0: " : ": ";
            const cogItemsHtml = keptCogItems.map(({ it, i }) => {
              const key = "cg-" + i;
              const isOpen = expandedItems.has(key);
              const searchOpen = hasQ && density === "brief";
              const expNow = density === "full" || isOpen || searchOpen;
              return '<li class="prose-item expandable' + (isOpen ? " is-open" : "") + (searchOpen ? " is-search-open" : "") + '">'
                + '<div class="prose-item-head"><span class="prose-lead">' + fmt(it.lead, isRtl, qNorm) + "</span>" + (it.detail ? renderExpandBtn(key, expNow, ui, searchOpen) : "") + "</div>"
                + '<p class="prose-brief">' + fmt(it.brief, isRtl, qNorm) + "</p>"
                + (it.detail ? '<p class="prose-detail detail-text">' + fmt(it.detail, isRtl, qNorm) + "</p>" : "")
                + "</li>";
            }).join("");
            sectionsHtml.push(
              '<section id="sec-cognition" class="ed-section">'
                + renderSecHead(s2, "cognition", ui, isRtl, qNorm)
                + (proseMatch
                  ? '<div class="expandable' + (cogOpen ? " is-open" : "") + (cogSearchOpen ? " is-search-open" : "") + '">'
                      + '<p class="lead-prose">' + fmt(s2.takeaway, isRtl, qNorm) + "</p>"
                      + (s2.detail && density === "brief" && !cogSearchOpen ? '<div class="cog-prose-bar">' + renderExpandBtn(cogKey, cogExpNow, ui, cogSearchOpen) + "</div>" : "")
                      + (s2.detail ? '<p class="sub-prose detail-text">' + fmt(s2.detail, isRtl, qNorm) + "</p>" : "")
                    + "</div>"
                  : "")
                + (keptCogItems.length ? '<ul class="prose-list">' + cogItemsHtml + "</ul>" : "")
                + (vpMatch ? renderV33Profile(vp, isRtl, qNorm) : "")
                + ((daMatch || pvMatch)
                  ? '<div class="cog-fig-pair">'
                      + (daMatch ? renderErrorAnatomy(da, isRtl, qNorm) : "")
                      + (pvMatch ? renderVigilanceChart(pv, isRtl, qNorm) : "")
                    + "</div>"
                  : "")
                + (spMatch ? '<p class="spatial-note"><span class="spatial-lead">' + fmt(sp.lead, isRtl, qNorm) + colonSep + "</span>" + fmt(sp.text, isRtl, qNorm) + "</p>" : "")
              + "</section>"
            );
          }
        }

        /* 03 · SLEEP & COURSE */
        const s3 = secs.sleep;
        if (s3) {
          const sumMatch = matches(s3.summary);
          const keptItems = (s3.items || []).map((it, i) => ({ it, i })).filter(({ it }) => matches(it.lead, it.brief, it.detail));
          const keptTl = (s3.timeline || []).filter((t) => matches(t.stage, t.age, t.note));
          if (hasQ) matchCount += (sumMatch ? 1 : 0) + keptItems.length + keptTl.length;

          if (sumMatch || keptItems.length || keptTl.length) {
            const itemsHtml = keptItems.map(({ it, i }) => {
              const key = "sl-" + i;
              const isOpen = expandedItems.has(key);
              const searchOpen = hasQ && density === "brief";
              const expNow = density === "full" || isOpen || searchOpen;
              return '<li class="prose-item expandable' + (isOpen ? " is-open" : "") + (searchOpen ? " is-search-open" : "") + '">'
                + '<div class="prose-item-head"><span class="prose-lead">' + fmt(it.lead, isRtl, qNorm) + "</span>" + (it.detail ? renderExpandBtn(key, expNow, ui, searchOpen) : "") + "</div>"
                + '<p class="prose-brief">' + fmt(it.brief, isRtl, qNorm) + "</p>"
                + (it.detail ? '<p class="prose-detail detail-text">' + fmt(it.detail, isRtl, qNorm) + "</p>" : "")
                + "</li>";
            }).join("");

            const tlFiltered = hasQ && keptTl.length < (s3.timeline || []).length;
            const tlHtml = keptTl.map((t) =>
              '<li class="life-node' + (t.current ? " is-current" : "") + '">'
                + '<span class="life-age">' + fmt(t.age, isRtl, qNorm) + "</span>"
                + '<span class="life-dot-wrap" aria-hidden="true"><span class="life-dot"></span></span>'
                + '<span class="life-stage">' + fmt(t.stage, isRtl, qNorm) + "</span>"
                + '<span class="life-note">' + fmt(t.note, isRtl, qNorm) + "</span>"
              + "</li>"
            ).join("");

            sectionsHtml.push(
              '<section id="sec-sleep" class="ed-section">'
                + renderSecHead(s3, "sleep", ui, isRtl, qNorm)
                + (sumMatch ? '<p class="lead-prose">' + fmt(s3.summary, isRtl, qNorm) + "</p>" : "")
                + (keptItems.length ? '<ul class="prose-list">' + itemsHtml + "</ul>" : "")
                + (keptTl.length ? '<div class="life-wrap"><div class="kicker">' + fmt(s3.timelineTitle, isRtl, "") + '</div><ol class="life-rail' + (tlFiltered ? " is-filtered" : "") + '">' + tlHtml + "</ol></div>" : "")
              + "</section>"
            );
          }
        }

        /* 04 · MOOD & BEHAVIOR */
        const s4 = secs.mood;
        if (s4) {
          const sumMatch = matches(s4.summary);
          const keptItems = (s4.items || []).map((it, i) => ({ it, i })).filter(({ it }) => matches(it.lead, it.brief, it.detail));
          if (hasQ) matchCount += (sumMatch ? 1 : 0) + keptItems.length;

          if (sumMatch || keptItems.length) {
            const itemsHtml = keptItems.map(({ it, i }) => {
              const key = "md-" + i;
              const isOpen = expandedItems.has(key);
              const searchOpen = hasQ && density === "brief";
              const expNow = density === "full" || isOpen || searchOpen;
              return '<li class="prose-item expandable' + (isOpen ? " is-open" : "") + (searchOpen ? " is-search-open" : "") + '">'
                + '<div class="prose-item-head"><span class="prose-lead">' + fmt(it.lead, isRtl, qNorm) + "</span>" + (it.detail ? renderExpandBtn(key, expNow, ui, searchOpen) : "") + "</div>"
                + '<p class="prose-brief">' + fmt(it.brief, isRtl, qNorm) + "</p>"
                + (it.detail ? '<p class="prose-detail detail-text">' + fmt(it.detail, isRtl, qNorm) + "</p>" : "")
                + "</li>";
            }).join("");

            sectionsHtml.push(
              '<section id="sec-mood" class="ed-section">'
                + renderSecHead(s4, "mood", ui, isRtl, qNorm)
                + (sumMatch ? '<p class="lead-prose">' + fmt(s4.summary, isRtl, qNorm) + "</p>" : "")
                + (keptItems.length ? '<ul class="prose-list">' + itemsHtml + "</ul>" : "")
              + "</section>"
            );
          }
        }

        /* 05 · SAFETY & SIGNAL-FIRST LABS */
        const s5 = secs.safety;
        if (s5) {
          const keptBase = (s5.baselineItems || []).map((b, i) => ({ b, i })).filter(({ b }) => matches(b.badge, b.lead, b.brief, b.detail));
          const accMatch = s5.accessNote && matches(s5.accessNote);
          const allLabs = s5.labs || [];
          const groups = s5.labsGroups || {};
          const refLbl = ui.refShort || (lang === "fr" ? "Réf." : (lang === "ar" ? "المرجع" : "Ref"));
          const matchLab = (lb) => matches(lb.label, lb.date, lb.currStr, lb.prevStr, lb.unit, lb.ref, lb.note);
          const labsTitleMatch = hasQ && matches(s5.labsTitle);
          const defGroupMatch = hasQ && groups.deficiency && matches(groups.deficiency.title, groups.deficiency.note);
          const normGroupMatch = hasQ && groups.normal && matches(groups.normal.title, groups.normal.note);
          const spotLabs = allLabs.filter((lb) => lb.group === "spotlight" && (labsTitleMatch || matchLab(lb)));
          const repLabs = allLabs.filter((lb) => lb.group === "deficiency" && (labsTitleMatch || defGroupMatch || matchLab(lb)));
          const normLabs = allLabs.filter((lb) => lb.group === "normal" && (labsTitleMatch || normGroupMatch || matchLab(lb)));
          if (hasQ) matchCount += keptBase.length + (accMatch ? 1 : 0) + spotLabs.length + repLabs.length + normLabs.length;

          const hasAnyLabs = spotLabs.length || repLabs.length || normLabs.length;
          if (keptBase.length || accMatch || hasAnyLabs) {
            const baseHtml = keptBase.map(({ b, i }) => {
              const key = "sf-" + i;
              const sev = b.severity || "info";
              const isOpen = expandedItems.has(key);
              const searchOpen = hasQ && density === "brief";
              const expNow = density === "full" || isOpen || searchOpen;
              const ico = SAFE_ICONS[i % SAFE_ICONS.length];
              return '<div class="safety-card sev-' + esc(sev) + ' expandable' + (isOpen ? " is-open" : "") + (searchOpen ? " is-search-open" : "") + '">'
                + '<div class="safety-top">'
                  + '<span class="safety-lead-wrap"><span class="safety-ico sev-' + esc(sev) + '">' + ico + '</span><span class="safety-lead">' + fmt(b.lead, isRtl, qNorm) + "</span></span>"
                  + '<span class="safety-right">'
                    + (b.badge ? '<span class="sev-badge sev-' + esc(sev) + '">' + fmt(b.badge, isRtl, qNorm) + "</span>" : "")
                    + (b.detail ? renderExpandBtn(key, expNow, ui, searchOpen) : "")
                  + "</span>"
                + "</div>"
                + '<p class="safety-brief">' + fmt(b.brief, isRtl, qNorm) + "</p>"
                + (b.detail ? '<p class="safety-detail detail-text">' + fmt(b.detail, isRtl, qNorm) + "</p>" : "")
                + "</div>";
            }).join("");

            let labsHtml = "";
            if (hasAnyLabs) {
              const filterHtml = hasQ ? "" :
                '<div class="labs-filter" role="group" aria-label="Labs filter">'
                  + '<button class="labs-fbtn' + (labsFilter === "watch" ? " is-active" : "") + '" type="button" data-lab-filter="watch" aria-pressed="' + (labsFilter === "watch" ? "true" : "false") + '">' + esc(ui.labsFilterWatch || "Watch") + "</button>"
                  + '<button class="labs-fbtn' + (labsFilter === "all" ? " is-active" : "") + '" type="button" data-lab-filter="all" aria-pressed="' + (labsFilter === "all" ? "true" : "false") + '">' + esc(ui.labsFilterAll || "All") + "</button>"
                + "</div>";

              const spotHtml = spotLabs.map((lb) =>
                '<div class="lab-spotlight">'
                  + '<div class="spot-top">'
                    + '<span class="spot-left">'
                      + '<span class="spot-lbl">' + fmt(lb.label, isRtl, qNorm) + "</span>"
                      + '<span class="spot-date"><bdi dir="ltr">' + fmt(lb.date, false, qNorm) + "</bdi></span>"
                      + (ui.spotlightBadge ? '<span class="spot-badge">' + fmt(ui.spotlightBadge, isRtl, "") + "</span>" : "")
                    + "</span>"
                    + '<span class="spot-val"><bdi dir="ltr">' + fmt(lb.currStr, false, qNorm) + '<span class="lab-unit">' + fmt(lb.unit, false, qNorm) + "</span></bdi></span>"
                  + "</div>"
                  + '<div dir="ltr">' + renderSpotlightGauge(lb, refLbl) + "</div>"
                  + (lb.note ? '<p class="spot-note">' + fmt(lb.note, isRtl, qNorm) + "</p>" : "")
                + "</div>"
              ).join("");

              const repHtml = repLabs.length
                ? '<div class="lab-subblock">'
                    + '<div class="lab-subhead"><span class="lab-subtitle">' + fmt((groups.deficiency && groups.deficiency.title) || "", isRtl, qNorm) + "</span>"
                      + ((groups.deficiency && groups.deficiency.note) ? '<span class="lab-subnote">' + fmt(groups.deficiency.note, isRtl, qNorm) + "</span>" : "")
                    + "</div>"
                    + '<div class="repleted-grid">' + repLabs.map((lb) => {
                        const tipT = esc(lb.label + " (" + lb.date + ")");
                        const valRange = lb.prevStr ? (lb.prevStr + " → " + lb.currStr) : lb.currStr;
                        const tipB = esc(valRange + " " + lb.unit + " · " + refLbl + " " + lb.ref + (lb.note ? " · " + lb.note : ""));
                        return '<div class="rep-item" tabindex="0" data-tip-title="' + tipT + '" data-tip-body="' + tipB + '">'
                          + '<div class="rep-top"><span class="rep-lbl">' + fmt(lb.label, isRtl, qNorm) + '</span><span class="rep-date"><bdi dir="ltr">' + fmt(lb.date, false, qNorm) + "</bdi></span></div>"
                          + '<div class="rep-val-row">'
                            + '<span class="rep-val"><bdi dir="ltr">' + (lb.prevStr ? '<span class="rep-prev">' + fmt(lb.prevStr, false, qNorm) + '</span><span class="rep-arr">\u2192</span>' : "") + fmt(lb.currStr, false, qNorm) + '<span class="rep-unit">' + fmt(lb.unit, false, qNorm) + "</span></bdi></span>"
                          + "</div>"
                          + renderMiniBar(lb, qNorm)
                          + (lb.note ? '<div class="rep-meta"><span>' + fmt(lb.note, isRtl, qNorm) + "</span></div>" : "")
                        + "</div>";
                      }).join("") + "</div>"
                  + "</div>"
                : "";

              const hideNormal = !hasQ && labsFilter === "watch";
              const normHtml = normLabs.length
                ? '<div class="lab-subblock' + (hideNormal ? " is-filter-hidden" : "") + '">'
                    + '<div class="lab-subhead"><span class="lab-subtitle">' + fmt((groups.normal && groups.normal.title) || "", isRtl, qNorm) + "</span></div>"
                    + '<div class="normal-grid">' + normLabs.map((lb) => {
                        const tipT = esc(lb.label + " (" + lb.date + ")");
                        const tipB = esc(lb.currStr + " " + lb.unit + " · " + refLbl + " " + lb.ref);
                        return '<div class="norm-item" tabindex="0" data-tip-title="' + tipT + '" data-tip-body="' + tipB + '">'
                          + '<div class="norm-top">'
                            + '<span class="norm-lbl-wrap"><span class="norm-lbl">' + fmt(lb.label, isRtl, qNorm) + '</span>' + (lb.date ? '<span class="norm-date"><bdi dir="ltr">' + fmt(lb.date, false, qNorm) + "</bdi></span>" : "") + "</span>"
                            + '<span class="norm-val"><bdi dir="ltr">' + fmt(lb.currStr, false, qNorm) + '<span class="norm-unit">' + fmt(lb.unit, false, qNorm) + "</span></bdi></span>"
                          + "</div>"
                          + renderMiniBar(lb, qNorm)
                        + "</div>";
                      }).join("") + "</div>"
                  + "</div>"
                : "";

              labsHtml = '<figure id="fig-05" class="figure-card">'
                + '<div class="labs-head-bar"><h3 class="fig-title">' + fmt(s5.labsTitle, isRtl, qNorm) + "</h3>" + filterHtml + "</div>"
                + spotHtml + repHtml + normHtml
                + "</figure>";
            }

            sectionsHtml.push(
              '<section id="sec-safety" class="ed-section">'
                + renderSecHead(s5, "safety", ui, isRtl, qNorm)
                + (keptBase.length ? '<div class="safety-grid">' + baseHtml + "</div>" : "")
                + (accMatch ? '<p class="access-note">' + ICO_INFO + "<span>" + fmt(s5.accessNote, isRtl, qNorm) + "</span></p>" : "")
                + labsHtml
              + "</section>"
            );
          }
        }

        /* 06 · CONSULTATION QUESTIONS */
        const s6 = secs.questions;
        if (s6) {
          const totalQ = (s6.items || []).length;
          const keptQ = (s6.items || []).map((q, i) => ({ q, i })).filter(({ q }) => matches(q.lead, q.text));
          if (hasQ) matchCount += keptQ.length;
          if (keptQ.length) {
            const doneCount = discussedQuestions.size;
            const qBadge = '<span id="qCountBadge" class="sec-badge"' + (doneCount > 0 ? "" : " hidden") + ">"
              + esc((ui.discussedCount || "{done}/{total}").replace("{done}", String(doneCount)).replace("{total}", String(totalQ)))
              + "</span>";
            const qHtml = keptQ.map(({ q, i }) => {
              const qKey = "q-" + i;
              const isDone = discussedQuestions.has(qKey);
              return '<li class="q-item' + (isDone ? " is-done" : "") + '">'
                + '<div class="q-top">'
                  + '<span class="q-num"><bdi dir="ltr">' + String(i + 1).padStart(2, "0") + "</bdi></span>"
                  + '<div><h3 class="q-lead">' + fmt(q.lead, isRtl, qNorm) + '</h3><p class="q-text">' + fmt(q.text, isRtl, qNorm) + "</p></div>"
                  + '<button class="q-check" type="button" data-q-toggle="' + esc(qKey) + '" aria-pressed="' + (isDone ? "true" : "false") + '" aria-label="' + esc(ui.discussedLabel || "Mark as discussed") + '" title="' + esc(ui.discussedLabel || "Mark as discussed") + '">' + ICO_CHECK + "</button>"
                + "</div>"
                + '<div class="q-foot">' + renderXrefs(QUESTION_TARGETS[i], "questions", secs, ui, isRtl) + "</div>"
              + "</li>";
            }).join("");

            sectionsHtml.push(
              '<section id="sec-questions" class="ed-section">'
                + renderSecHead(s6, "questions", ui, isRtl, qNorm, qBadge)
                + (s6.subtitle ? '<p class="sub-prose">' + fmt(s6.subtitle, isRtl, qNorm) + "</p>" : "")
                + '<ol class="q-grid">' + qHtml + "</ol>"
              + "</section>"
            );
          }
        }

        if (sectionsHtml.length) {
          sectionsHtml[0] = sectionsHtml[0].replace('class="ed-section"', 'class="ed-section is-first"');
        }

        /* Demographic Chips on Screen + Clean Inline Line in Print (no hidden print marks) */
        const profileParts = String(d.profileLine || "").split(/\s*·\s*/).filter(Boolean);
        const profileBarHtml = '<div class="profile-bar">'
          + profileParts.map((part) => '<span class="profile-chip">' + fmt(part, isRtl, qNorm) + "</span>").join("")
          + "</div>"
          + '<p class="profile-line-print">' + fmt(d.profileLine, isRtl, "") + "</p>";

        /* Brief Mode Expand-All / Collapse-All Convenience Bar */
        let briefStripHtml = "";
        if (density === "brief" && !hasQ) {
          const allKeys = getAllExpandableKeys(secs);
          const allOpen = allKeys.length > 0 && allKeys.every((k) => expandedItems.has(k));
          briefStripHtml = '<div class="brief-strip"><button class="brief-toggle-all" type="button" data-toggle-all="' + (allOpen ? "collapse" : "expand") + '">'
            + esc(allOpen ? (ui.collapseAll || "Collapse all") : (ui.expandAll || "Expand all"))
            + "</button></div>";
        }

        const emptyHtml = hasQ && matchCount === 0
          ? '<div class="search-empty"><p class="search-empty-title">' + esc(ui.searchNoMatch || "No matches") + ' — « ' + esc(searchQuery.trim()) + ' »</p><button id="emptyClearBtn" class="search-empty-btn" type="button">' + esc(ui.searchClear || "Clear") + "</button></div>"
          : "";

        const endCapHtml = !emptyHtml
          ? '<footer class="brief-endcap">'
              + '<span class="endcap-actions">'
                + '<button class="endcap-btn" type="button" data-scroll-top="1">' + ICO_UP + "<span>" + esc(ui.topBtn || "Top") + "</span></button>"
              + "</span>"
            + "</footer>"
          : "";

        briefMain.innerHTML =
          '<article class="brief-root' + (density === "brief" ? " is-brief" : "") + '">'
            + '<header class="masthead">'
              + '<div class="masthead-top">'
                + '<h1 class="doc-title">' + fmt(d.title, isRtl, qNorm) + "</h1>"
                + '<span class="doc-date">' + fmt(d.date, isRtl, "") + "</span>"
              + "</div>"
              + '<p class="doc-sub">' + fmt(d.subtitle, isRtl, qNorm) + "</p>"
              + profileBarHtml
            + "</header>"
            + briefStripHtml
            + sectionsHtml.join("")
            + emptyHtml
            + endCapHtml
          + "</article>";

        updateSearchChrome(matchCount, qNorm, Boolean(ropts.preserveMarkIdx));
        syncMobileDock();
        hideTooltip();
        if (ropts.restoreFocusSel) {
          const focusEl = briefMain.querySelector(ropts.restoreFocusSel);
          if (focusEl && typeof focusEl.focus === "function") focusEl.focus({ preventScroll: true });
        }
        if (animate) triggerSwap();
      }

      function renderAll(instantPill, animateSheet) {
        renderChrome(instantPill);
        renderBrief(animateSheet);
        updateScrollUI();
      }

      function clearSearch(focusBack) {
        searchQuery = "";
        searchInput.value = "";
        renderBrief(false);
        if (focusBack) {
          searchInput.focus();
          showQuickPop();
        }
      }

      /* PIN Gate Events */
      gateThemeBtn.addEventListener("click", toggleTheme);
      toggleEye.addEventListener("click", () => {
        const show = pinInput.type === "password";
        pinInput.type = show ? "text" : "password";
        setHidden(eyeOpen, show);
        setHidden(eyeClosed, !show);
        toggleEye.setAttribute("aria-label", show ? "Hide code" : "Show code");
        pinInput.focus();
      });
      pinInput.addEventListener("input", () => { if (gateErr.textContent) gateErr.textContent = ""; });

      gateForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        gateErr.textContent = "";
        gateBtn.disabled = true;
        setHidden(gateSpin, false);
        try {
          data = await unlock(pinInput.value);
          lang = "fr";
          density = "full";
          labsFilter = "all";
          searchQuery = "";
          activeNav = "priorities";
          expandedItems.clear();
          discussedQuestions.clear();
          hideReturnToast();
          searchInput.value = "";
          pinInput.value = "";
          gateForm.reset();
          gateScreen.hidden = true;
          appShell.hidden = false;
          renderAll(true, true);
          requestAnimationFrame(() => {
            syncAllPills(true);
            updateScrollUI();
          });
          window.scrollTo({ top: 0, behavior: "instant" });
        } catch {
          gateErr.textContent = "Code incorrect · الرمز غير صحيح · Invalid code";
          gateForm.classList.remove("shake");
          void gateForm.offsetWidth;
          gateForm.classList.add("shake");
          pinInput.select();
        } finally {
          gateBtn.disabled = false;
          setHidden(gateSpin, true);
        }
      });

      /* Language & Density Switchers */
      function switchLanguage(next) {
        if (next && next !== lang && data && data[next]) {
          lang = next;
          spyLockUntil = 0;
          hideQuickPop();
          hideReturnToast();
          renderAll(false, true);
          requestAnimationFrame(() => syncAllPills(false));
        }
      }

      function switchDensity(next) {
        if (next && next !== density && data) {
          density = next;
          expandedItems.clear();
          densBtns.forEach((b) => {
            const active = b.dataset.dens === density;
            b.classList.toggle("is-active", active);
            b.setAttribute("aria-pressed", active ? "true" : "false");
          });
          const activeBtn = densBtns.find((b) => b.dataset.dens === density);
          syncPill(densPill, activeBtn, false);
          renderBrief(false);
          updateScrollUI();
        }
      }

      langBtns.forEach((btn) => btn.addEventListener("click", () => switchLanguage(btn.dataset.loc)));
      densBtns.forEach((btn) => btn.addEventListener("click", () => switchDensity(btn.dataset.dens)));

      /* Nav Quick-Jump (Top Chrome + Margin Rail) */
      navLinks.addEventListener("scroll", syncNavFade, { passive: true });
      navLinks.addEventListener("click", (e) => {
        const btn = e.target.closest(".nav-link[data-target]");
        if (btn) jumpToSection(btn.dataset.target);
      });
      marginRail.addEventListener("click", (e) => {
        const btn = e.target.closest(".rail-item[data-target]");
        if (btn) { jumpToSection(btn.dataset.target); return; }
        if (e.target.closest('[data-rail-act="top"]')) { scrollToTopSmooth(); return; }
        if (e.target.closest('[data-rail-act="shortcuts"]')) openShortcutsModal();
      });

      /* Floating Back-to-Top, Return Toast & Mobile Dock */
      floatTopBtn.addEventListener("click", scrollToTopSmooth);
      mobTopBtn.addEventListener("click", scrollToTopSmooth);
      mobPrevBtn.addEventListener("click", () => stepSection(-1));
      mobNextBtn.addEventListener("click", () => stepSection(1));
      mobSheetOpenBtn.addEventListener("click", openMobileSheet);

      returnGoBtn.addEventListener("click", () => {
        if (!returnOrigin) return;
        const orig = returnOrigin;
        hideReturnToast();
        spyLockUntil = Date.now() + 750;
        setActiveNav(orig.secId, true);
        window.scrollTo({ top: orig.scrollY, behavior: "smooth" });
        const el = document.getElementById("sec-" + orig.secId);
        if (el) {
          el.classList.remove("is-pulsed");
          void el.offsetWidth;
          el.classList.add("is-pulsed");
        }
      });
      returnDismissBtn.addEventListener("click", hideReturnToast);

      /* Mobile Sheet Events (in-place updates without re-bounce) */
      mobSheetWrap.addEventListener("click", (e) => {
        if (e.target === mobSheetWrap || e.target.closest("[data-close-sheet]")) {
          closeMobileSheet(true);
          return;
        }
        const secBtn = e.target.closest("[data-sheet-sec]");
        if (secBtn) {
          const target = secBtn.dataset.sheetSec;
          closeMobileSheet(false);
          jumpToSection(target);
          return;
        }
        const locBtn = e.target.closest("[data-sheet-loc]");
        if (locBtn) {
          const nextLoc = locBtn.dataset.sheetLoc;
          switchLanguage(nextLoc);
          renderMobileSheetContent('[data-sheet-loc="' + nextLoc + '"]');
          return;
        }
        const actBtn = e.target.closest("[data-sheet-act]");
        if (actBtn) {
          const act = actBtn.dataset.sheetAct;
          if (act === "search") {
            closeMobileSheet(false);
            window.scrollTo({ top: 0, behavior: "smooth" });
            setTimeout(() => { searchInput.focus(); showQuickPop(); }, 220);
          } else if (act === "clear-search") {
            clearSearch(false);
            renderMobileSheetContent("[data-close-sheet]");
          } else if (act === "density") {
            switchDensity(density === "brief" ? "full" : "brief");
            renderMobileSheetContent('[data-sheet-act="density"]');
          } else if (act === "theme") {
            toggleTheme();
            renderMobileSheetContent('[data-sheet-act="theme"]');
          } else if (act === "print") {
            closeMobileSheet(false);
            triggerPrint();
          }
        }
      });

      /* Shortcuts Modal Events */
      scBtn.addEventListener("click", openShortcutsModal);
      scModalWrap.addEventListener("click", (e) => {
        if (e.target === scModalWrap || e.target.closest("[data-close-sc]")) closeShortcutsModal(true);
      });

      /* Live Search + Quick Chips + Match Stepper */
      searchInput.addEventListener("focus", showQuickPop);
      searchInput.addEventListener("click", showQuickPop);
      searchInput.addEventListener("input", () => {
        searchQuery = searchInput.value;
        if (searchQuery.trim()) hideQuickPop();
        else showQuickPop();
        renderBrief(false);
        updateScrollUI();
      });
      searchInput.addEventListener("keydown", (e) => {
        if (e.key === "Enter" && searchMarks.length > 0) {
          e.preventDefault();
          stepSearchMatch(e.shiftKey ? -1 : 1);
        }
      });
      searchPrev.addEventListener("click", () => stepSearchMatch(-1));
      searchNext.addEventListener("click", () => stepSearchMatch(1));
      searchClear.addEventListener("click", () => clearSearch(true));

      quickPop.addEventListener("pointerdown", (e) => {
        if (e.target.closest(".quick-chip")) e.preventDefault();
      });
      quickPop.addEventListener("click", (e) => {
        const chip = e.target.closest(".quick-chip[data-qchip]");
        if (!chip) return;
        const val = chip.dataset.qchip;
        searchInput.value = val;
        searchQuery = val;
        hideQuickPop();
        renderBrief(false);
        updateScrollUI();
        if (searchMarks.length > 0) stepSearchMatch(1);
      });
      document.addEventListener("pointerdown", (e) => {
        if (!quickPop.hidden && !searchShell.contains(e.target)) hideQuickPop();
      });

      /* Rich Keyboard Navigation (Dialog Focus Trap + FR/EN/AR Layout Support) */
      document.addEventListener("keydown", (e) => {
        if (appShell.hidden || !data) return;

        if (!scModalWrap.hidden) {
          if (e.key === "Escape") { e.preventDefault(); closeShortcutsModal(true); return; }
          if (e.key === "Tab") { trapDialogFocus(e, scModal); return; }
          if (e.key === "?" || e.key === "\u061F") { e.preventDefault(); closeShortcutsModal(true); return; }
          return;
        }
        if (!mobSheetWrap.hidden) {
          if (e.key === "Escape") { e.preventDefault(); closeMobileSheet(true); return; }
          if (e.key === "Tab") { trapDialogFocus(e, mobSheet); return; }
          return;
        }

        if ((e.metaKey || e.ctrlKey) && (e.key.toLowerCase() === "k" || e.code === "KeyK")) {
          e.preventDefault();
          searchInput.focus();
          searchInput.select();
          showQuickPop();
          return;
        }

        if (e.key === "Escape") {
          if (!quickPop.hidden) { e.preventDefault(); hideQuickPop(); searchInput.blur(); return; }
          if (searchQuery) { e.preventDefault(); clearSearch(false); return; }
          if (document.activeElement === searchInput) { searchInput.blur(); return; }
          if (returnOrigin) { hideReturnToast(); return; }
        }

        const tag = document.activeElement && document.activeElement.tagName;
        if (tag === "INPUT" || tag === "TEXTAREA" || e.ctrlKey || e.metaKey || e.altKey) return;

        if (e.key === "/" || (e.code === "Slash" && !e.shiftKey)) {
          e.preventDefault();
          searchInput.focus();
          searchInput.select();
          showQuickPop();
        } else if (e.key === "?" || e.key === "\u061F") {
          e.preventDefault();
          openShortcutsModal();
        } else if (e.key >= "1" && e.key <= "6") {
          const targetId = NAV_ORDER[Number(e.key) - 1];
          if (targetId) { e.preventDefault(); jumpToSection(targetId); }
        } else if (e.key === "[" || (!e.shiftKey && e.code === "BracketLeft")) {
          e.preventDefault();
          stepSection(-1);
        } else if (e.key === "]" || (!e.shiftKey && e.code === "BracketRight")) {
          e.preventDefault();
          stepSection(1);
        } else if (e.key === "b" || e.key === "B" || e.code === "KeyB") {
          e.preventDefault();
          switchDensity(density === "brief" ? "full" : "brief");
        } else if (e.key === "d" || e.key === "D" || e.code === "KeyD") {
          e.preventDefault();
          toggleTheme();
        } else if (e.key === "t" || e.key === "T" || e.code === "KeyT") {
          e.preventDefault();
          scrollToTopSmooth();
        }
      });

      /* Main Delegation: Labs Filter, Item Expand, Chapter/Xref Jumps, In-Place Decision Checks */
      briefMain.addEventListener("click", (e) => {
        const jumpEl = e.target.closest("[data-jump-sec]");
        if (jumpEl) {
          jumpToSection(jumpEl.dataset.jumpSec, { fromSec: jumpEl.dataset.fromSec || "" });
          return;
        }
        if (e.target.closest("[data-scroll-top]")) {
          scrollToTopSmooth();
          return;
        }
        const toggleAllBtn = e.target.closest("[data-toggle-all]");
        if (toggleAllBtn && data && data[lang]) {
          const mode = toggleAllBtn.dataset.toggleAll;
          const allKeys = getAllExpandableKeys(data[lang].sections || {});
          if (mode === "expand") allKeys.forEach((k) => expandedItems.add(k));
          else expandedItems.clear();
          renderBrief(false, { preserveMarkIdx: true, restoreFocusSel: "[data-toggle-all]" });
          updateScrollUI();
          return;
        }
        const qToggle = e.target.closest("[data-q-toggle]");
        if (qToggle && data && data[lang]) {
          const qKey = qToggle.dataset.qToggle;
          const isNowDone = !discussedQuestions.has(qKey);
          if (isNowDone) discussedQuestions.add(qKey);
          else discussedQuestions.delete(qKey);
          const item = qToggle.closest(".q-item");
          if (item) item.classList.toggle("is-done", isNowDone);
          qToggle.setAttribute("aria-pressed", isNowDone ? "true" : "false");
          const d = data[lang];
          const ui = d.ui || {};
          const totalQ = (d.sections && d.sections.questions && d.sections.questions.items) ? d.sections.questions.items.length : 4;
          const doneCount = discussedQuestions.size;
          const countTxt = (ui.discussedCount || "{done}/{total}").replace("{done}", String(doneCount)).replace("{total}", String(totalQ));
          const qBadge = document.getElementById("qCountBadge");
          if (qBadge) {
            qBadge.textContent = countTxt;
            setHidden(qBadge, doneCount === 0);
          }
          return;
        }
        const labBtn = e.target.closest(".labs-fbtn[data-lab-filter]");
        if (labBtn) {
          const next = labBtn.dataset.labFilter;
          if (next && next !== labsFilter) {
            labsFilter = next;
            renderBrief(false, { preserveMarkIdx: true, restoreFocusSel: '.labs-fbtn[data-lab-filter="' + next + '"]' });
            updateScrollUI();
          }
          return;
        }
        const expBtn = e.target.closest(".item-expand[data-item-key]");
        if (expBtn) {
          const key = expBtn.dataset.itemKey;
          if (expandedItems.has(key)) expandedItems.delete(key);
          else expandedItems.add(key);
          renderBrief(false, { preserveMarkIdx: true, restoreFocusSel: '.item-expand[data-item-key="' + key + '"]' });
          updateScrollUI();
          return;
        }
        if (e.target.closest("#emptyClearBtn")) {
          clearSearch(true);
        }
      });

      /* Interactive Tooltips + True Bi-Directional Pointer & Keyboard Highlighting */
      function setPvtFocus(fig, series) {
        if (!fig || !series) return;
        fig.setAttribute("data-pvt-focus", series);
        fig.querySelectorAll(".pvt-leg-card").forEach((it) => it.classList.toggle("is-hi", it.dataset.pvtHover === series));
      }
      function clearPvtFocus(fig) {
        if (!fig) return;
        fig.removeAttribute("data-pvt-focus");
        fig.querySelectorAll(".pvt-leg-card").forEach((it) => it.classList.remove("is-hi"));
      }

      briefMain.addEventListener("pointermove", (e) => {
        const hit = e.target.closest("[data-tip-title], [data-tip-body]");
        if (hit) {
          showTooltip(hit.getAttribute("data-tip-title"), hit.getAttribute("data-tip-body"), e.clientX, e.clientY);
        } else {
          hideTooltip();
        }
      });
      briefMain.addEventListener("pointerover", (e) => {
        const pvtEl = e.target.closest("[data-pvt-hover]");
        if (pvtEl) setPvtFocus(pvtEl.closest(".figure-card"), pvtEl.getAttribute("data-pvt-hover"));
      });
      briefMain.addEventListener("pointerout", (e) => {
        const pvtEl = e.target.closest("[data-pvt-hover]");
        if (pvtEl && (!e.relatedTarget || !pvtEl.contains(e.relatedTarget))) {
          const nextPvt = e.relatedTarget && e.relatedTarget.closest && e.relatedTarget.closest("[data-pvt-hover]");
          if (!nextPvt) clearPvtFocus(pvtEl.closest(".figure-card"));
        }
      });
      briefMain.addEventListener("pointerleave", hideTooltip);
      briefMain.addEventListener("focusin", (e) => {
        const hit = e.target.closest("[data-tip-title], [data-tip-body]");
        if (hit) {
          const r = hit.getBoundingClientRect();
          showTooltip(hit.getAttribute("data-tip-title"), hit.getAttribute("data-tip-body"), r.left + r.width / 2, r.top);
        }
        const pvtEl = e.target.closest("[data-pvt-hover]");
        if (pvtEl) setPvtFocus(pvtEl.closest(".figure-card"), pvtEl.getAttribute("data-pvt-hover"));
      });
      briefMain.addEventListener("focusout", (e) => {
        hideTooltip();
        const pvtEl = e.target.closest("[data-pvt-hover]");
        if (pvtEl) {
          const nextPvt = e.relatedTarget && e.relatedTarget.closest && e.relatedTarget.closest("[data-pvt-hover]");
          if (!nextPvt) clearPvtFocus(pvtEl.closest(".figure-card"));
        }
      });

      /* Scroll-Spy, Progress Bar & Resize */
      let scrollRaf = 0;
      window.addEventListener("scroll", () => {
        hideTooltip();
        if (scrollRaf) return;
        scrollRaf = requestAnimationFrame(() => {
          scrollRaf = 0;
          updateScrollUI();
        });
      }, { passive: true });

      window.addEventListener("resize", () => {
        hideTooltip();
        if (!appShell.hidden) {
          syncAllPills(true);
          syncNavFade();
          updateScrollUI();
        }
      });

      /* Print Hygiene: Always Print Complete 2-Page Clinical Brief Even If Search Is Active */
      function prepareForPrint() {
        if (!data || appShell.hidden) return;
        closeMobileSheet(false);
        closeShortcutsModal(false);
        hideQuickPop();
        hideTooltip();
        if (searchQuery.trim() && stashedSearchForPrint === null) {
          stashedSearchForPrint = searchQuery;
          searchQuery = "";
          renderBrief(false);
        }
      }
      function restoreAfterPrint() {
        if (stashedSearchForPrint !== null) {
          searchQuery = stashedSearchForPrint;
          stashedSearchForPrint = null;
          searchInput.value = searchQuery;
          if (data && !appShell.hidden) {
            renderBrief(false);
            updateScrollUI();
          }
        }
      }
      function triggerPrint() {
        prepareForPrint();
        window.print();
      }
      window.addEventListener("beforeprint", prepareForPrint);
      window.addEventListener("afterprint", restoreAfterPrint);

      /* Theme, Print & Complete Lock DOM Scrub */
      themeBtn.addEventListener("click", toggleTheme);
      printBtn.addEventListener("click", triggerPrint);

      lockBtn.addEventListener("click", () => {
        data = null;
        lang = "fr";
        density = "full";
        labsFilter = "all";
        searchQuery = "";
        stashedSearchForPrint = null;
        activeNav = "priorities";
        searchMarks = [];
        activeMarkIdx = -1;
        lastFocusBeforeOverlay = null;
        expandedItems.clear();
        discussedQuestions.clear();
        hideReturnToast();
        closeMobileSheet(false);
        closeShortcutsModal(false);
        hideQuickPop();
        briefMain.innerHTML = "";
        briefMain.classList.remove("is-swapping");
        navLinks.innerHTML = "";
        navLinks.classList.remove("fade-left", "fade-right", "fade-both");
        marginRail.innerHTML = "";
        quickPop.innerHTML = "";
        mobSheet.innerHTML = "";
        scModal.innerHTML = "";
        vizTooltip.innerHTML = "";
        returnGoBtn.innerHTML = "";
        mobDockNum.textContent = "";
        mobDockTitle.textContent = "";
        btnBrief.textContent = "";
        btnFull.textContent = "";
        searchInput.value = "";
        searchInput.placeholder = "";
        searchInput.removeAttribute("aria-label");
        searchCount.textContent = "";
        searchCount.classList.remove("is-zero");
        setHidden(searchCount, true);
        setHidden(searchStepGroup, true);
        setHidden(searchClear, true);
        setHidden(searchKbd, false);
        printBtn.setAttribute("aria-label", "Print");
        printBtn.removeAttribute("title");
        lockBtn.setAttribute("aria-label", "Lock");
        lockBtn.removeAttribute("title");
        scBtn.setAttribute("aria-label", "Shortcuts");
        scBtn.removeAttribute("title");
        floatTopBtn.setAttribute("aria-label", "Back to top");
        floatTopBtn.removeAttribute("title");
        searchClear.setAttribute("aria-label", "Clear");
        searchClear.removeAttribute("title");
        searchPrev.setAttribute("aria-label", "Previous match");
        searchPrev.removeAttribute("title");
        searchNext.setAttribute("aria-label", "Next match");
        searchNext.removeAttribute("title");
        mobPrevBtn.setAttribute("aria-label", "Previous section");
        mobNextBtn.setAttribute("aria-label", "Next section");
        mobTopBtn.setAttribute("aria-label", "Back to top");
        mobSheetOpenBtn.removeAttribute("aria-label");
        mobSheetOpenBtn.removeAttribute("title");
        mobSheetOpenBtn.setAttribute("aria-expanded", "false");
        returnDismissBtn.setAttribute("aria-label", "Close");
        densityCtrl.setAttribute("aria-label", "Display density");
        readProgressFill.style.transform = "scaleX(0)";
        mobProgressFill.style.transform = "scaleX(0)";
        floatTopBtn.classList.remove("is-visible");
        mobTopBtn.disabled = true;
        hideTooltip();
        if (langPill) langPill.style.opacity = "0";
        if (densPill) densPill.style.opacity = "0";
        appShell.hidden = true;
        gateScreen.hidden = false;
        root.lang = "fr";
        root.dir = "ltr";
        document.title = LOCKED_TITLE;
        pinInput.type = "password";
        setHidden(eyeOpen, false);
        setHidden(eyeClosed, true);
        toggleEye.setAttribute("aria-label", "Show code");
        pinInput.value = "";
        gateErr.textContent = "";
        gateForm.reset();
        syncThemeControl();
        pinInput.focus();
      });
    })();
  </script>
</body>
</html>
