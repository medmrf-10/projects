      .nav-link { padding: 4px 8px; font-size: 0.75rem; }

      .brief-main { padding: 20px 14px 88px; }
      .masthead { margin-bottom: 24px; padding-bottom: 18px; }
      .chapter-map { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
      .ed-section { padding-top: 32px; margin-top: 32px; scroll-margin-top: 16px; }
      .figure-card { padding: 14px 13px 13px; border-radius: var(--r-md); }
      .normal-grid { grid-template-columns: 1fr; }

      /* Mobile Vertical Hairline Lifespan Rail */
      .life-rail {
        grid-template-columns: 1fr;
        gap: 10px;
        padding-inline-start: 20px;
      }
      .life-rail::before {
        content: "";
        position: absolute;
        top: 12px;
        bottom: 12px;
        inset-inline-start: 5px;
        inset-inline-end: auto;
        width: 1px;
        background: var(--border-strong);
        z-index: 0;
      }
      .life-rail.is-filtered::before { display: none; }
      .life-node { align-items: flex-start; text-align: start; gap: 2px; padding: 4px 6px; }
      .life-dot-wrap { position: static; width: auto; height: auto; }
      .life-dot-wrap::before { display: none; }
      .life-dot { position: absolute; inset-inline-start: -20px; top: 8px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
    }

    /* =========================================================================
       EXACT 2-PAGE A4 EDITORIAL PRINT ARCHITECTURE (FR / AR / EN)
       ========================================================================= */
    @page { size: A4 portrait; margin: 4.5mm 6.5mm; }
    @media print {
      * {
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
        animation: none !important;
        transition: none !important;
      }
      :root, html[data-theme="dark"] {
        color-scheme: light;
        --bg: #FFFFFF;
        --surface: #FFFFFF;
        --surface-2: #F8FAFC;
        --surface-3: #F1F5F9;

        --border-subtle: #E2E8F0;
        --border-strong: #94A3B8;
        --gridline: #E2E8F0;
        --text: #0F172A;

        --text-3: #475569;
        --teal: #0F766E;

        --teal-wash: #F5FBFA;
        --teal-band: #E7F5F3;
        --teal-border: #99D5CF;
        --coral: #C2410C;
        --coral-text: #9A3412;
        --coral-soft: #FEF2EE;
        --coral-wash: #FFF6F3;
        --coral-border: #F5C2B1;
        --amber: #B45309;
        --amber-text: #92400E;
        --amber-soft: #FDF8EC;
        --amber-border: #E8CF9C;
        --info: #1D4ED8;
        --info-text: #1E40AF;
        --info-soft: #EFF6FF;
        --info-border: #BFDBFE;
        --slate-viz: #64748B;
        --bar-hit: #0F766E;
        --bar-swap: #B45309;
        --bar-stale: #C2410C;
        --bar-guess: #526175;
        --bar-text: #FFFFFF;
        --track-bg: #E2E8F0;
        --zone-bg: #D5EFEA;
        --zone-edge: #6EC0B7;
        --caution-bg: #FBEBD0;
      }

      /* Hide all interactive & screen-only chrome cleanly */
      .sticky-chrome, .gate-wrap, .labs-filter, .item-expand, .viz-tooltip, .search-empty,
      .margin-rail, .mobile-top-progress, .mob-dock, .float-top, .return-toast,
      .sheet-backdrop, .modal-backdrop, .chapter-map, .masthead-eyebrow, .brief-strip,

      }

      /* Print ALWAYS shows Full details and all 13 labs */
      .brief-root.is-brief .detail-text,
      .detail-text,
      .lab-subblock.is-filter-hidden {
        display: block !important;
      }

      html, body {
        height: auto !important;
        min-height: 0 !important;
        background: #FFFFFF !important;
        color: #0F172A !important;
        font-size: 6.8pt;
        line-height: 1.17;
      }
      html[dir="rtl"] body { font-size: 7pt; line-height: 1.24; }

      .brief-main { max-width: 100%; padding: 0; }
      .masthead { padding-bottom: 1.7mm; margin-bottom: 2.1mm; break-inside: avoid; page-break-inside: avoid; }
      .masthead-top { margin-bottom: 0.4mm; }
      .doc-title { font-size: 12.4pt !important; }
      .doc-date { font-size: 6.8pt; border: 0; padding: 0; background: transparent; }
      .doc-sub { font-size: 7.2pt; margin-bottom: 1mm; }
      .profile-bar { display: none !important; }
      .profile-line-print {
        display: block !important;
        margin: 0;
        padding-top: 0.9mm;
        border-top: 0.5pt solid var(--border-subtle);
        font-size: 7.1pt;
        font-weight: 600;
        color: var(--text-2);
        font-variant-numeric: tabular-nums;
      }

      .ed-section { padding-top: 1.6mm; margin-top: 1.6mm; }
      .sec-head { margin-bottom: 1mm; gap: 1.7mm; break-after: avoid; page-break-after: avoid; }
      .sec-num { font-size: 6.9pt; border: 0; padding: 0; background: transparent; color: var(--teal); }
      .sec-title { font-size: 8.85pt !important; }
      .kicker { font-size: 5.6pt !important; margin-bottom: 0.65mm; break-after: avoid; page-break-after: avoid; }

      .chief-block { padding: 0; padding-inline-start: 2.2mm; border-inline-start-width: 1.8pt; background: transparent !important; border-radius: 0 !important; margin-bottom: 1.8mm; break-inside: avoid; }

      .figure-card {

      .lollipop-row { grid-template-columns: minmax(0, 1.15fr) minmax(0, 0.95fr) !important; gap: 2mm; padding: 0.7mm 0; margin: 0; border-radius: 0; background: transparent !important; }

      /* Side-by-side Response Breakdown + Dual-State Vigilance Chart on Print Page 1 */
      .cog-fig-pair {
        display: grid !important;
        grid-template-columns: minmax(0, 0.92fr) minmax(0, 1.38fr);
        gap: 2.2mm;
        align-items: stretch;
        margin-top: 1.4mm;

      .pvt-svg { max-height: none; width: 100%; height: auto; }
      .pvt-legend-grid { grid-template-columns: repeat(2, minmax(0, 1fr)) !important; gap: 0.8mm 2mm; margin-top: 0.9mm; padding-top: 0.9mm; }

      .spatial-note { margin-top: 1.4mm; padding: 0.8mm 1.5mm; font-size: 6.2pt; line-height: 1.16; break-inside: avoid; }

      /* Clean Page 2 Start at Section 03 for Balanced 2-Page A4 Executive Brief */
      #sec-sleep { break-before: page; page-break-before: always; padding-top: 0; margin-top: 0; border-top: 0; }
      #sec-mood, #sec-safety, #sec-questions { padding-top: 1.8mm; margin-top: 1.8mm; }

      #sec-safety .figure-card { padding: 1.4mm 2mm 1.2mm; margin: 1.2mm 0; }

      .prose-list { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 2mm; padding-top: 0.8mm; }

      .prose-lead { font-size: 6.7pt; }
      .prose-brief { font-size: 6.25pt; line-height: 1.15; }

      .life-wrap { margin-top: 1.1mm; break-inside: avoid; }
      .life-rail { grid-template-columns: repeat(4, minmax(0, 1fr)) !important; gap: 1.8mm; padding: 0 !important; }
      .life-rail::before { display: none !important; }
      .life-node { align-items: center !important; text-align: center !important; gap: 0.7mm; padding: 0 !important; background: transparent !important; }
      .life-dot-wrap { position: relative !important; width: 100% !important; height: 14px !important; }
      .life-dot-wrap::before { display: block !important; inset-inline-start: -0.9mm; inset-inline-end: -0.9mm; height: 0.75pt; }
      .life-node:first-child .life-dot-wrap::before { inset-inline-start: 50%; }
      .life-node:last-child .life-dot-wrap::before { inset-inline-end: 50%; }
      .life-dot { position: relative !important; inset-inline-start: auto !important; top: auto !important; width: 6px; height: 6px; border-width: 1.5px; box-shadow: 0 0 0 1.8px var(--bg); }
      .life-node.is-current .life-dot { box-shadow: 0 0 0 1.6px var(--bg), 0 0 0 3.4px var(--teal-soft); }
      .life-age { font-size: 5.55pt; line-height: 1.15; }

      .safety-top { margin-bottom: 0.18mm; }
      .safety-lead { font-size: 6.5pt; }
      .sev-badge { font-size: 5.25pt; padding: 0.1mm 1.15mm; }

      .safety-detail { font-size: 5.7pt; line-height: 1.10; margin-top: 0.18mm; }
      .access-note { margin-bottom: 0.75mm; padding: 0.45mm 1.4mm; font-size: 6pt; break-inside: avoid; }

      .labs-head-bar { margin-bottom: 0.6mm; }
      .lab-spotlight { padding: 0.8mm 1.5mm 0.65mm; margin-bottom: 0.8mm; break-inside: avoid; }

      .spot-lbl { font-size: 6.6pt; }
      .spot-val { font-size: 7.1pt; }
      .spot-svg { max-height: none; width: 100%; height: auto; }
      .spot-note { font-size: 5.75pt; margin-top: 0.15mm; }

      .lab-subblock { margin-top: 0.55mm; }
      .lab-subhead { margin-bottom: 0.3mm; break-after: avoid; }
      .lab-subtitle { font-size: 5.5pt !important; }
      .lab-subnote { font-size: 5.5pt; }
      .repleted-grid { grid-template-columns: repeat(3, minmax(0, 1fr)) !important; gap: 0.9mm; }
      .rep-item { padding: 0.55mm 1.2mm; background: var(--bg) !important; break-inside: avoid; }
      .rep-lbl { font-size: 6.15pt; }
      .rep-val-row { margin-bottom: 0.3mm; }
      .rep-val { font-size: 5.95pt; }
      .rep-meta { font-size: 5.35pt; margin-top: 0.2mm; }

      .normal-grid { grid-template-columns: repeat(3, minmax(0, 1fr)) !important; gap: 0.25mm 1.8mm; padding-top: 0.35mm; }
      .norm-item { padding: 0.26mm 0; margin: 0; background: transparent !important; break-inside: avoid; }
      .norm-top { margin-bottom: 0.2mm; }

      .norm-val { font-size: 5.85pt; }

      #sec-questions { break-inside: avoid; page-break-inside: avoid; }

      .q-grid { grid-template-columns: repeat(2, minmax(0, 1fr)) !important; gap: 0.75mm 2.4mm; padding-top: 0.55mm; border-top: 0.5pt solid var(--border); }

        if (ch === "\u0649") return "\u064A";
        return ch.normalize("NFD").replace(/[\u0300-\u036F]/g, "").toLowerCase();
      }

      function normText(str) {
        const raw = String(str ?? "");
        let out = "";
        for (let i = 0; i < raw.length; i++) out += normChar(raw[i]);
        return out;
      }

      function findMatchRanges(raw, qNorm) {
        if (!qNorm) return [];
        const chars = [], starts = [], ends = [];
        for (let i = 0; i < raw.length; i++) {
          const nc = normChar(raw[i]);
          for (let j = 0; j < nc.length; j++) {
            chars.push(nc[j]);
            starts.push(i);
            ends.push(i + 1);
          }
        }
        const hay = chars.join("");
        const ranges = [];
        let pos = 0;
        while (pos <= hay.length - qNorm.length) {
          const idx = hay.indexOf(qNorm, pos);
          if (idx === -1) break;
          let rEnd = ends[idx + qNorm.length - 1];
          while (rEnd < raw.length && normChar(raw[rEnd]) === "" && /[\u0300-\u036F\u064B-\u065F\u0670]/.test(raw[rEnd])) rEnd++;
          ranges.push([starts[idx], rEnd]);
          pos = idx + qNorm.length;
        }
        return ranges;
      }

      function renderSliceWithHighlights(raw, sliceStart, sliceEnd, ranges) {
        if (!ranges.length) return esc(raw.slice(sliceStart, sliceEnd));
        let out = "", cur = sliceStart;
        for (let i = 0; i < ranges.length; i++) {
          const rs = Math.max(sliceStart, ranges[i][0]);
          const re = Math.min(sliceEnd, ranges[i][1]);
          if (re <= rs) continue;
          if (rs > cur) out += esc(raw.slice(cur, rs));
          out += '<mark class="hl">' + esc(raw.slice(rs, re)) + "</mark>";
          cur = re;
        }
        if (cur < sliceEnd) out += esc(raw.slice(cur, sliceEnd));
        return out;
      }

      function fmt(s, isRtl, qNorm) {
        const raw = String(s ?? "");
        const ranges = qNorm ? findMatchRanges(raw, qNorm) : [];
        if (!isRtl) return renderSliceWithHighlights(raw, 0, raw.length, ranges);
        LTR_RE.lastIndex = 0;
        let out = "", last = 0, m;
        while ((m = LTR_RE.exec(raw)) !== null) {
          if (m.index > last) out += renderSliceWithHighlights(raw, last, m.index, ranges);
          const full = m[0];
          const core = full.replace(/(?:\s+[+\-–—·=→/]+|[.,:;–—\-·=→/\s]+)+$/, "");
          const coreEnd = m.index + core.length;
          const fullEnd = m.index + full.length;
          if (core) {
            const cls = core.length <= 13 ? ' class="nowrap-bdi"' : "";
            out += '<bdi dir="ltr"' + cls + ">" + renderSliceWithHighlights(raw, m.index, coreEnd, ranges) + "</bdi>";
            if (fullEnd > coreEnd) out += renderSliceWithHighlights(raw, coreEnd, fullEnd, ranges);
          } else {
            out += renderSliceWithHighlights(raw, m.index, fullEnd, ranges);
          }
          last = fullEnd;
        }
        if (last < raw.length) out += renderSliceWithHighlights(raw, last, raw.length, ranges);
        return out;
      }

      function b64ToBytes(b64) {
        const bin = atob(b64);
        const arr = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
        return arr;
      }

      async function unlock(rawPin) {
        const clean = String(rawPin || "").replace(/\s+/g, "");
        const keyMat = await crypto.subtle.importKey("raw", new TextEncoder().encode(clean), { name: "PBKDF2" }, false, ["deriveKey"]);
        const aesKey = await crypto.subtle.deriveKey(
          { name: "PBKDF2", salt: b64ToBytes(BUNDLE.salt), iterations: BUNDLE.iter, hash: "SHA-256" },
          keyMat, { name: "AES-GCM", length: 256 }, false, ["decrypt"]
        );
        const buf = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64ToBytes(BUNDLE.iv) }, aesKey, b64ToBytes(BUNDLE.ct));
        return JSON.parse(new TextDecoder().decode(buf));
      }

      function syncPill(pill, activeBtn, instant) {
        if (!pill || !activeBtn) return;
        const parent = pill.parentElement;
        if (!parent) return;
        const pr = parent.getBoundingClientRect();
        const br = activeBtn.getBoundingClientRect();
        if (!br.width) return;
        const bl = parseFloat(getComputedStyle(parent).borderLeftWidth) || 0;
        const x = br.left - pr.left - bl;
        if (instant) pill.style.transition = "none";
        pill.style.width = br.width.toFixed(2) + "px";
        pill.style.transform = "translate3d(" + x.toFixed(2) + "px, 0, 0)";
        pill.style.opacity = "1";
        if (instant) {
          void pill.offsetWidth;
          pill.style.transition = "";

      function syncNavFade() {
        if (!navLinks) return;
        const maxSl = navLinks.scrollWidth - navLinks.clientWidth;
        navLinks.classList.remove("fade-left", "fade-right", "fade-both");
        if (maxSl <= 2) return;
        const r = navLinks.getBoundingClientRect();
        const first = navLinks.firstElementChild;
        const last = navLinks.lastElementChild;
        if (!first || !last) return;
        const fRect = first.getBoundingClientRect();
        const lRect = last.getBoundingClientRect();
        const minL = Math.min(fRect.left, lRect.left);
        const maxR = Math.max(fRect.right, lRect.right);
        const clipL = minL < r.left - 2;
        const clipR = maxR > r.right + 2;
        if (clipL && clipR) navLinks.classList.add("fade-both");
        else if (clipL) navLinks.classList.add("fade-left");
        else if (clipR) navLinks.classList.add("fade-right");
      }

      function scrollNavItemIntoView(btn) {
        if (!btn || !navLinks) return;
        /* Never call Element.scrollIntoView() when header is static (mobile), or it hijacks window.scrollY! */
        if (getComputedStyle(stickyChrome).position === "static") return;
        if (navLinks.scrollWidth <= navLinks.clientWidth + 1) return;
        const cRect = navLinks.getBoundingClientRect();
        const bRect = btn.getBoundingClientRect();
        if (bRect.left >= cRect.left + 8 && bRect.right <= cRect.right - 8) return;
        const delta = (bRect.left - cRect.left) - (cRect.width - bRect.width) / 2;
        navLinks.scrollTo({ left: navLinks.scrollLeft + delta, behavior: "smooth" });
      }

      function jumpToSection(id, opts) {

        spyLockUntil = Date.now() + 750;
        setActiveNav(id, true);
        const top = Math.max(0, el.getBoundingClientRect().top + window.scrollY - getStickyOffset());
        window.scrollTo({ top, behavior: "smooth" });
        el.classList.remove("is-pulsed");
        void el.offsetWidth;

      function stepSection(dir) {
        const vis = getVisibleNavIds();
        if (!vis.length) return;
        let idx = vis.indexOf(activeNav);
        if (idx === -1) idx = 0;
        const nextIdx = Math.max(0, Math.min(vis.length - 1, idx + dir));
        if (nextIdx !== idx || !document.getElementById("sec-" + activeNav)) {
          jumpToSection(vis[nextIdx]);
        }
      }

      function scrollToTopSmooth() {
        spyLockUntil = Date.now() + 650;

      function updateScrollUI() {
        if (!data || appShell.hidden) return;
        const sy = window.scrollY || 0;
        const maxScroll = Math.max(1, document.documentElement.scrollHeight - window.innerHeight);
        const pct = Math.max(0, Math.min(1, sy / maxScroll));
        const tf = "scaleX(" + pct.toFixed(4) + ")";
        readProgressFill.style.transform = tf;
        mobProgressFill.style.transform = tf;

        stickyChrome.classList.toggle("is-scrolled", sy > 10);
        floatTopBtn.classList.toggle("is-visible", sy > 360);
        mobTopBtn.disabled = sy <= 20;

        const railTop = marginRail.querySelector(".rail-top-btn");
        if (railTop) railTop.classList.toggle("is-dim", sy < 240);
        const railFill = marginRail.querySelector(".rail-progress-fill");
        if (railFill) railFill.style.transform = "scaleY(" + pct.toFixed(4) + ")";

        if (Date.now() < spyLockUntil) return;
        const vis = getVisibleNavIds();
        if (!vis.length) return;

        /* Ensure final section highlights reliably when near bottom of document */
        if (sy + window.innerHeight >= document.documentElement.scrollHeight - 28) {
          const lastId = vis[vis.length - 1];
          if (lastId !== activeNav) setActiveNav(lastId, true);
          return;
        }

        const offset = getStickyOffset() + 42;
        let bestId = vis[0];
        let bestTop = -Infinity;
        for (let i = 0; i < vis.length; i++) {
          const id = vis[i];
          const el = document.getElementById("sec-" + id);
          if (!el) continue;
          const top = el.getBoundingClientRect().top;
          if (top <= offset && top > bestTop) {
            bestTop = top;
            bestId = id;
          }
        }
        if (bestId !== activeNav) setActiveNav(bestId, true);
      }

      function trapDialogFocus(e, container) {
        if (e.key !== "Tab") return;
        const focusables = getFocusables(container);
        if (!focusables.length) return;
        const first = focusables[0];
        const last = focusables[focusables.length - 1];
        if (e.shiftKey) {
          if (document.activeElement === first || !container.contains(document.activeElement)) {
            e.preventDefault();
            last.focus();
