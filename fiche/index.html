<!DOCTYPE html>
<html lang="fr" dir="ltr" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet" />
  <meta name="referrer" content="no-referrer" />
  <meta name="theme-color" content="#f2f5f7" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230d6e6e'/%3E%3Cpath d='M16 8v16M8 16h16' stroke='%23ffffff' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E" />
  <title>Fiche Clinique · ملف طبي · Clinical Sheet</title>
  <style>
    :root {
      color-scheme: light;
      --font-ltr: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      --font-ar: "SF Arabic", "Geeza Pro", "Segoe UI", Tahoma, "Noto Sans Arabic", system-ui, -apple-system, sans-serif;
      --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
      --ease-out: cubic-bezier(0.22, 1, 0.36, 1);

      --bg: #f2f5f7;
      --surface: #ffffff;
      --surface-2: #f7f9fb;
      --surface-hover: #edf2f6;
      --topbar: rgba(255, 255, 255, 0.9);
      --border: #e0e7ef;
      --border-subtle: #edf1f6;
      --border-strong: #c6d3e1;
      --rail: #cdd8e3;

      --text: #0f172a;
      --text-2: #334155;
      --text-3: #64748b;

      --accent: #0d6e6e;
      --accent-btn: #0d6e6e;
      --accent-btn-hover: #0a5858;
      --accent-soft: #eef8f7;
      --accent-border: #b8e3df;
      --accent-text: #0b5f5f;

      --safety-bg: #fcf9f3;
      --safety-border: #e6d5b8;
      --safety-bar: #b4741f;
      --safety-title: #7c4d12;
      --safety-lead: #8a5413;
      --safety-item-bg: rgba(255, 255, 255, 0.78);
      --safety-item-border: #ede1cd;

      --err: #b91c1c;
      --shadow-sheet: 0 1px 2px rgba(15, 23, 42, 0.04), 0 12px 32px -12px rgba(15, 23, 42, 0.08);
      --shadow-gate: 0 16px 40px -12px rgba(15, 23, 42, 0.12), 0 2px 6px rgba(15, 23, 42, 0.04);
      --r-lg: 14px;
      --r-md: 10px;
      --r-sm: 7px;
    }

    html[data-theme="dark"] {
      color-scheme: dark;
      --bg: #0b1118;
      --surface: #111924;
      --surface-2: #16202e;
      --surface-hover: #1d2a3c;
      --topbar: rgba(11, 17, 24, 0.88);
      --border: #223044;
      --border-subtle: #1b2738;
      --border-strong: #32455f;
      --rail: #2b3d55;

      --text: #f1f5f9;
      --text-2: #cbd5e1;
      --text-3: #8ea0b8;

      --accent: #2dd4bf;
      --accent-btn: #0d9488;
      --accent-btn-hover: #0f766e;
      --accent-soft: rgba(45, 212, 191, 0.11);
      --accent-border: rgba(45, 212, 191, 0.28);
      --accent-text: #5eead4;

      --safety-bg: rgba(180, 116, 31, 0.1);
      --safety-border: rgba(217, 158, 72, 0.28);
      --safety-bar: #d99b43;
      --safety-title: #f2cb8a;
      --safety-lead: #ebb86a;
      --safety-item-bg: rgba(17, 25, 36, 0.56);
      --safety-item-border: rgba(217, 158, 72, 0.2);

      --err: #f87171;
      --shadow-sheet: 0 1px 2px rgba(0, 0, 0, 0.3), 0 16px 40px -12px rgba(0, 0, 0, 0.5);
      --shadow-gate: 0 20px 48px -12px rgba(0, 0, 0, 0.55);
    }

    *, *::before, *::after { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html { -webkit-text-size-adjust: 100%; overflow-x: clip; }
    body {
      margin: 0;
      min-height: 100vh;
      overflow-x: clip;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-ltr);
      font-size: 15px;
      line-height: 1.52;
      -webkit-font-smoothing: antialiased;
      transition: background-color 220ms var(--ease-out), color 220ms var(--ease-out);
    }
    html[dir="rtl"] body { font-family: var(--font-ar); line-height: 1.66; }
    button, input { font: inherit; color: inherit; }
    button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    /* PIN Gate */
    .gate-wrap { min-height: 100vh; display: grid; place-items: center; padding: 20px 16px; }
    .gate-card {
      width: 100%;
      max-width: 384px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-top: 3px solid var(--accent);
      border-radius: var(--r-lg);
      box-shadow: var(--shadow-gate);
      padding: 28px 24px 24px;
      text-align: center;
      transition: background-color 220ms var(--ease-out), border-color 220ms var(--ease-out), box-shadow 220ms var(--ease-out);
    }
    .gate-card.shake { animation: shake 0.36s ease; }
    .gate-mark {
      width: 46px;
      height: 46px;
      margin: 0 auto 14px;
      border-radius: 12px;
      background: var(--accent-soft);
      border: 1px solid var(--accent-border);
      color: var(--accent-text);
      display: grid;
      place-items: center;
    }
    .gate-title { margin: 0 0 6px; font-size: 1.02rem; font-weight: 700; color: var(--text); letter-spacing: -0.01em; }
    .gate-sub { margin: 0 0 18px; font-size: 0.82rem; color: var(--text-3); }
    .pin-wrap { position: relative; margin-bottom: 12px; }
    .pin-input {
      width: 100%;
      height: 44px;
      padding: 0 42px;
      border-radius: var(--r-sm);
      border: 1px solid var(--border-strong);
      background: var(--surface-2);
      font-family: var(--font-mono);
      font-size: 1.08rem;
      letter-spacing: 0.22em;
      text-align: center;
      outline: none;
      transition: border-color 180ms var(--ease-out), box-shadow 180ms var(--ease-out), background-color 220ms var(--ease-out);
    }
    .pin-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
    .pin-eye {
      position: absolute;
      top: 50%;
      inset-inline-end: 8px;
      transform: translateY(-50%);
      width: 30px;
      height: 30px;
      border: 0;
      border-radius: 6px;
      background: transparent;
      color: var(--text-3);
      display: grid;
      place-items: center;
      cursor: pointer;
      transition: background-color 180ms var(--ease-out), color 180ms var(--ease-out);
    }
    .pin-eye:hover { background: var(--surface-hover); color: var(--text); }
    .gate-btn {
      width: 100%;
      height: 42px;
      border: 0;
      border-radius: var(--r-sm);
      background: var(--accent-btn);
      color: #ffffff;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 180ms var(--ease-out), opacity 180ms var(--ease-out), transform 140ms var(--ease-out);
    }
    .gate-btn:hover { background: var(--accent-btn-hover); }
    .gate-btn:active { transform: scale(0.99); }
    .gate-btn:disabled { opacity: 0.6; cursor: wait; }
    .gate-err { min-height: 1.25rem; margin-top: 10px; font-size: 0.8rem; font-weight: 600; color: var(--err); }
    @keyframes shake { 0%, 100% { transform: translateX(0); } 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }

    /* Sticky Toolbar */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 30;
      background: var(--topbar);
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      transition: background-color 220ms var(--ease-out), border-color 220ms var(--ease-out);
    }
    .topbar-inner {
      max-width: 1040px;
      margin: 0 auto;
      padding: 9px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .tb-brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .tb-mark {
      width: 30px;
      height: 30px;
      border-radius: 8px;
      background: var(--accent-btn);
      color: #ffffff;
      display: grid;
      place-items: center;
      flex-shrink: 0;
      transition: background-color 220ms var(--ease-out);
    }
    .tb-meta { min-width: 0; display: flex; flex-direction: column; }
    .tb-title { font-size: 0.9rem; font-weight: 700; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .tb-date { font-size: 0.72rem; color: var(--text-3); white-space: nowrap; }
    .tb-actions { display: flex; align-items: center; gap: 7px; flex-shrink: 0; }

    /* Segmented Language Switcher with Sliding Active Pill */
    .seg-lang {
      position: relative;
      display: inline-flex;
      align-items: center;
      padding: 3px;
      border-radius: 10px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      transition: background-color 220ms var(--ease-out), border-color 220ms var(--ease-out);
    }
    .seg-pill {
      position: absolute;
      top: 3px;
      bottom: 3px;
      left: 0;
      width: 0;
      border-radius: 7px;
      background: var(--accent-btn);
      box-shadow: 0 1px 3px rgba(15, 23, 42, 0.16);
      opacity: 0;
      pointer-events: none;
      will-change: transform, width;
      transition: transform 200ms var(--ease-out), width 200ms var(--ease-out), background-color 220ms var(--ease-out), opacity 160ms ease;
    }
    .seg-btn {
      position: relative;
      z-index: 1;
      border: 0;
      background: transparent;
      color: var(--text-2);
      padding: 5px 11px;
      border-radius: 7px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      transition: color 200ms var(--ease-out);
    }
    .seg-btn:hover { color: var(--text); }
    .seg-btn.is-active { color: #ffffff; }
    .seg-btn.is-active:hover { color: #ffffff; }

    .act-btn {
      height: 34px;
      padding: 0 11px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-2);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 200ms var(--ease-out), border-color 200ms var(--ease-out), color 200ms var(--ease-out);
    }
    .act-btn:hover { background: var(--surface-hover); border-color: var(--border-strong); color: var(--text); }
    .act-icon { width: 34px; padding: 0; }

    /* Swiss-Editorial Clinical Dossier Sheet */
    .sheet { max-width: 1040px; margin: 0 auto; padding: 20px 18px 40px; }
    @keyframes sheetSwap {
      from { opacity: 0; transform: translateY(5px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .sheet.sheet-anim { animation: sheetSwap 240ms var(--ease-out) both; }

    .dossier-paper {
      background: var(--surface);
      border: 1px solid var(--border);
      border-top: 3px solid var(--accent);
      border-radius: var(--r-lg);
      box-shadow: var(--shadow-sheet);
      overflow: hidden;
      transition: background-color 220ms var(--ease-out), border-color 220ms var(--ease-out), box-shadow 220ms var(--ease-out);
    }

    /* Integrated Header + Vitals Strip */
    .doc-head-row {
      padding: 20px 26px 16px;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px 18px;
    }
    .doc-title-col { min-width: 0; flex: 1 1 320px; }
    .doc-title {
      margin: 0;
      font-size: 1.32rem;
      font-weight: 700;
      color: var(--text);
      letter-spacing: -0.02em;
      line-height: 1.24;
    }
    html[dir="rtl"] .doc-title { letter-spacing: 0; }
    .doc-sub { margin: 4px 0 0; font-size: 0.89rem; color: var(--text-2); line-height: 1.44; }
    .doc-date {
      font-size: 0.77rem;
      font-weight: 600;
      color: var(--accent-text);
      background: var(--accent-soft);
      border: 1px solid var(--accent-border);
      padding: 4px 11px;
      border-radius: 999px;
      white-space: nowrap;
      align-self: center;
      font-variant-numeric: tabular-nums;
      transition: background-color 220ms var(--ease-out), border-color 220ms var(--ease-out), color 220ms var(--ease-out);
    }

    .vitals-strip {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 1px;
      background: var(--border);
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      transition: background-color 220ms var(--ease-out), border-color 220ms var(--ease-out);
    }
    .vital-cell {
      min-width: 0;
      background: var(--surface-2);
      padding: 11px 16px;
      display: flex;
      flex-direction: column;
      gap: 3px;
      transition: background-color 220ms var(--ease-out);
    }
    .vital-lbl {
      font-size: 0.69rem;
      font-weight: 700;
      color: var(--text-3);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    html[dir="rtl"] .vital-lbl { text-transform: none; letter-spacing: 0; font-size: 0.75rem; }
    .vital-val {
      font-size: 0.92rem;
      font-weight: 700;
      color: var(--text);
      line-height: 1.32;
      overflow-wrap: break-word;
      font-variant-numeric: tabular-nums;
    }

    /* 2-Column Asymmetric Clinical Grid */
    .dossier-body {
      padding: 24px 26px 28px;
      display: grid;
      grid-template-columns: minmax(0, 1.7fr) minmax(0, 1fr);
      grid-template-rows: max-content max-content 1fr;
      grid-template-areas:
        "flow safety"
        "flow labs"
        "flow tests";
      column-gap: 24px;
      row-gap: 16px;
      align-items: start;
    }

    /* Primary Column: Connected Logical Step-Flow (01 -> 04) */
    .flow-col {
      grid-area: flow;
      min-width: 0;
      align-self: stretch;
      padding-inline-end: 24px;
      border-inline-end: 1px solid var(--border);
      transition: border-color 220ms var(--ease-out);
    }
    .flow-list { list-style: none; margin: 0; padding: 0; position: relative; }
    .flow-step {
      position: relative;
      padding-inline-start: 42px;
      padding-bottom: 22px;
    }
    .flow-step:last-child { padding-bottom: 0; }
    .flow-step:not(:last-child)::before {
      content: "";
      position: absolute;
      inset-inline-start: 13.25px;
      top: 32px;
      bottom: 4px;
      width: 1.5px;
      background: var(--rail);
      transition: background-color 220ms var(--ease-out);
    }
    .flow-badge {
      position: absolute;
      inset-inline-start: 0;
      top: 0;
      width: 28px;
      height: 28px;
      border-radius: 999px;
      background: var(--accent-soft);
      border: 1.5px solid var(--accent-border);
      color: var(--accent-text);
      font-family: var(--font-mono);
      font-size: 0.72rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      display: grid;
      place-items: center;
      transition: background-color 220ms var(--ease-out), border-color 220ms var(--ease-out), color 220ms var(--ease-out);
    }
    .flow-step-head {
      min-height: 28px;
      display: flex;
      align-items: center;
      padding-bottom: 6px;
      margin-bottom: 9px;
      border-bottom: 1px solid var(--border-subtle);
      transition: border-color 220ms var(--ease-out);
    }
    .flow-step-title {
      margin: 0;
      font-size: 0.99rem;
      font-weight: 700;
      color: var(--text);
      letter-spacing: -0.01em;
      line-height: 1.3;
    }
    html[dir="rtl"] .flow-step-title { letter-spacing: 0; }
    .flow-items {
      margin: 0;
      padding-inline-start: 1.28rem;
      list-style-type: decimal;
      display: flex;
      flex-direction: column;
      gap: 7px;
    }
    .flow-items li {
      font-size: 0.89rem;
      color: var(--text-2);
      line-height: 1.52;
      overflow-wrap: break-word;
      padding-inline-start: 2px;
    }
    .flow-items li::marker {
      color: var(--accent-text);
      font-family: var(--font-mono);
      font-size: 0.77rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }
    .item-lead { color: var(--text); font-weight: 700; }

    /* Reference Sidebar Panels */
    .panel {
      min-width: 0;
      border-radius: var(--r-md);
      padding: 14px 15px;
      transition: background-color 220ms var(--ease-out), border-color 220ms var(--ease-out);
    }
    .panel-head {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 0 0 11px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
      transition: border-color 220ms var(--ease-out);
    }
    .panel-ico { display: inline-flex; align-items: center; flex-shrink: 0; color: var(--accent-text); }
    .panel-title {
      margin: 0;
      font-size: 0.87rem;
      font-weight: 700;
      letter-spacing: 0.01em;
      color: var(--text);
      line-height: 1.28;
    }

    /* 1. Safety / Clinical Highlights (Calm Warm-Amber/Slate) */
    .panel-safety {
      grid-area: safety;
      background: var(--safety-bg);
      border: 1px solid var(--safety-border);
      border-inline-start: 3.5px solid var(--safety-bar);
    }
    .panel-safety .panel-head { border-bottom-color: var(--safety-border); }
    .panel-safety .panel-ico { color: var(--safety-bar); }
    .panel-safety .panel-title { color: var(--safety-title); }
    .safety-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 7px; }
    .safety-item {
      min-width: 0;
      background: var(--safety-item-bg);
      border: 1px solid var(--safety-item-border);
      border-radius: var(--r-sm);
      padding: 8px 10px;
      font-size: 0.84rem;
      line-height: 1.46;
      color: var(--text-2);
      overflow-wrap: break-word;
      transition: background-color 220ms var(--ease-out), border-color 220ms var(--ease-out);
    }
    .safety-item .item-lead { color: var(--safety-lead); }

    /* 2. Labs Readout Blocks (Stacked Key-Value Layout) */
    .panel-labs {
      grid-area: labs;
      background: var(--surface-2);
      border: 1px solid var(--border);
    }
    .labs-list { display: flex; flex-direction: column; }
    .lab-row {
      min-width: 0;
      padding: 8px 0;
      border-bottom: 1px solid var(--border-subtle);
      transition: border-color 220ms var(--ease-out);
    }
    .lab-row:first-child { padding-top: 1px; }
    .lab-row:last-child { padding-bottom: 0; border-bottom: 0; }
    .lab-top {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 4px 10px;
      flex-wrap: wrap;
    }
    .lab-lbl { font-size: 0.83rem; font-weight: 600; color: var(--text); }
    .lab-val {
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--accent-text);
      font-variant-numeric: tabular-nums;
    }
    .lab-note {
      margin-top: 2px;
      font-size: 0.76rem;
      line-height: 1.38;
      color: var(--text-3);
      overflow-wrap: break-word;
    }

    /* 3. Online Screening Metrics */
    .panel-tests {
      grid-area: tests;
      background: var(--surface-2);
      border: 1px solid var(--border);
    }
    .tests-list { display: flex; flex-direction: column; gap: 7px; }
    .test-card {
      min-width: 0;
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 4px 10px;
      flex-wrap: wrap;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r-sm);
      padding: 8px 11px;
      transition: background-color 220ms var(--ease-out), border-color 220ms var(--ease-out);
    }
    .test-lbl { font-size: 0.82rem; font-weight: 600; color: var(--text-2); }
    .test-val {
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--text);
      font-variant-numeric: tabular-nums;
    }
    html[dir="ltr"] .lab-val,
    html[dir="ltr"] .test-val,
    .lab-val bdi,
    .test-val bdi {
      font-family: var(--font-mono);
      font-size: 0.79rem;
    }

    /* Responsive: Tablet & Mobile (Zero Horizontal Overflow Down to 390x844) */
    @media (max-width: 899px) {
      .dossier-body {
        padding: 18px 20px 22px;
        grid-template-columns: 1fr;
        grid-template-rows: auto;
        grid-template-areas:
          "safety"
          "flow"
          "labs"
          "tests";
        row-gap: 18px;
      }
      .flow-col {
        padding-inline-end: 0;
        border-inline-end: 0;
      }
    }

    @media (max-width: 640px) {
      .topbar-inner { padding: 8px 12px; gap: 8px; }
      .tb-mark { width: 28px; height: 28px; }
      .tb-title { font-size: 0.82rem; }
      .tb-date, .act-lbl { display: none; }
      .act-btn { width: 32px; height: 32px; padding: 0; }
      .seg-btn { padding: 4px 8px; font-size: 0.74rem; }
      .sheet { padding: 12px 10px 28px; }
      .dossier-paper { border-radius: var(--r-md); }
      .doc-head-row { padding: 15px 15px 13px; }
      .doc-title { font-size: 1.12rem; }
      .doc-sub { font-size: 0.84rem; }
      .vitals-strip { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .vital-cell { padding: 9px 12px; }
      .vital-val { font-size: 0.86rem; }
      .dossier-body { padding: 15px 14px 18px; row-gap: 16px; }
      .flow-step { padding-inline-start: 36px; padding-bottom: 18px; }
      .flow-badge { width: 25px; height: 25px; font-size: 0.69rem; }
      .flow-step:not(:last-child)::before { inset-inline-start: 11.75px; top: 29px; }
      .flow-step-head { min-height: 25px; }
      .panel { padding: 12px 13px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
    }

    /* Strict 1-Page A4 Print (All 3 Locales: FR, AR, EN) */
    @page { size: A4 portrait; margin: 7mm 7.5mm; }
    @media print {
      * {
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
        animation: none !important;
        transition: none !important;
      }
      :root, html[data-theme="dark"] {
        color-scheme: light;
        --bg: #ffffff;
        --surface: #ffffff;
        --surface-2: #f8fafc;
        --border: #cbd5e1;
        --border-subtle: #e2e8f0;
        --border-strong: #94a3b8;
        --rail: #cbd5e1;
        --text: #0f172a;
        --text-2: #1e293b;
        --text-3: #475569;
        --accent: #0d6e6e;
        --accent-soft: #eef8f7;
        --accent-border: #99d5cf;
        --accent-text: #0b5f5f;
        --safety-bg: #fcf8f0;
        --safety-border: #dfc9a3;
        --safety-bar: #a86a19;
        --safety-title: #744710;
        --safety-lead: #824f12;
        --safety-item-bg: #ffffff;
        --safety-item-border: #e6d7bc;
      }
      .topbar, .gate-wrap { display: none !important; }
      html, body {
        height: auto !important;
        min-height: 0 !important;
        background: #ffffff !important;
        color: #0f172a !important;
        font-size: 8.4pt;
        line-height: 1.26;
      }
      html[dir="rtl"] body { font-size: 8.6pt; line-height: 1.34; }
      .sheet { max-width: 100%; padding: 0; }
      .dossier-paper {
        border: 0;
        border-top: 2pt solid var(--accent);
        border-radius: 0 !important;
        box-shadow: none !important;
        overflow: visible !important;
      }
      .dossier-header { break-inside: avoid; page-break-inside: avoid; }
      .doc-head-row { padding: 2.2mm 0 2mm; gap: 1.5mm 4mm; }
      .doc-title { font-size: 11.8pt; line-height: 1.16; }
      .doc-sub { font-size: 8.1pt; margin-top: 0.6mm; line-height: 1.24; }
      .doc-date { font-size: 7.4pt; padding: 0.6mm 2.3mm; }
      .vitals-strip {
        grid-template-columns: repeat(4, minmax(0, 1fr)) !important;
        border-inline: 0.5pt solid var(--border);
      }
      .vital-cell { padding: 1.5mm 2.3mm; gap: 0.4mm; break-inside: avoid; page-break-inside: avoid; }
      .vital-lbl { font-size: 6.3pt; }
      html[dir="rtl"] .vital-lbl { font-size: 6.7pt; }
      .vital-val { font-size: 8.1pt; line-height: 1.18; }

      .dossier-body {
        padding: 3mm 0 0;
        grid-template-columns: minmax(0, 1.68fr) minmax(0, 1fr) !important;
        grid-template-rows: max-content max-content 1fr !important;
        grid-template-areas:
          "flow safety"
          "flow labs"
          "flow tests" !important;
        column-gap: 3.6mm;
        row-gap: 2.4mm;
      }
      .flow-col {
        padding-inline-end: 3.6mm !important;
        border-inline-end: 0.75pt solid var(--border) !important;
      }
      .flow-step {
        padding-inline-start: 7.4mm;
        padding-bottom: 2.8mm;
        break-inside: avoid;
        page-break-inside: avoid;
      }
      .flow-step:last-child { padding-bottom: 0; }
      .flow-badge { width: 5.4mm; height: 5.4mm; font-size: 6.4pt; border-width: 1pt; }
      .flow-step:not(:last-child)::before { inset-inline-start: 2.55mm; top: 6.2mm; bottom: 0.7mm; width: 0.9pt; }
      .flow-step-head { min-height: 5.4mm; padding-bottom: 0.9mm; margin-bottom: 1.3mm; }
      .flow-step-title { font-size: 8.8pt; line-height: 1.18; }
      .flow-items { padding-inline-start: 3.5mm; gap: 1mm; }
      .flow-items li { font-size: 8.1pt; line-height: 1.24; }
      .flow-items li::marker { font-size: 7pt; }
      html[dir="rtl"] .flow-items li { font-size: 8.3pt; line-height: 1.32; }

      .panel { padding: 2.1mm 2.6mm; border-radius: 5px; break-inside: avoid; page-break-inside: avoid; }
      .panel-head { gap: 1.6mm; margin-bottom: 1.5mm; padding-bottom: 1mm; }
      .panel-ico svg { width: 12px; height: 12px; }
      .panel-title { font-size: 8.3pt; }
      .panel-safety { border-inline-start-width: 2.4pt; }
      .safety-list { gap: 1.1mm; }
      .safety-item { padding: 1.2mm 1.8mm; font-size: 7.7pt; line-height: 1.22; border-radius: 4px; break-inside: avoid; page-break-inside: avoid; }
      html[dir="rtl"] .safety-item { font-size: 8pt; line-height: 1.29; }

      .lab-row { padding: 1.2mm 0; break-inside: avoid; page-break-inside: avoid; }
      .lab-lbl { font-size: 7.7pt; }
      .lab-val { font-size: 7.6pt; }
      .lab-note { font-size: 7pt; line-height: 1.2; margin-top: 0.3mm; }
      html[dir="ltr"] .lab-val,
      html[dir="ltr"] .test-val,
      .lab-val bdi,
      .test-val bdi { font-size: 7.3pt; }

      .tests-list { gap: 1.1mm; }
      .test-card { padding: 1.2mm 1.9mm; border-radius: 4px; break-inside: avoid; page-break-inside: avoid; }
      .test-lbl, .test-val { font-size: 7.7pt; }
    }
  </style>
</head>

      let data = null;

      const esc = (s) => String(s ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");

      function fmt(s, isRtl) {
        const raw = String(s ?? "");
        if (!isRtl) return esc(raw);
        LTR_RE.lastIndex = 0;
        let out = "", last = 0, m;
        while ((m = LTR_RE.exec(raw)) !== null) {
          out += esc(raw.slice(last, m.index));
          const full = m[0];
          const core = full.replace(/(?:\s+[+\-–—·=→/]+|[.,:;–—\-·=→/\s]+)+$/, "");
          const trail = full.slice(core.length);
          out += core ? '<bdi dir="ltr">' + esc(core) + "</bdi>" + esc(trail) : esc(full);
          last = m.index + full.length;
        }
        return out + esc(raw.slice(last));

      function renderLeadText(it, isRtl) {
        const lead = it && it.lead ? String(it.lead).trim() : "";
        const text = it && it.text ? String(it.text).trim() : "";
        if (!lead) return '<span class="item-text">' + fmt(text, isRtl) + "</span>";
        const sep = /[:：—–-]$/.test(lead) ? " " : ": ";
        return '<strong class="item-lead">' + fmt(lead, isRtl) + (text ? sep : "") + "</strong>" + (text ? '<span class="item-text">' + fmt(text, isRtl) + "</span>" : "");
      }

      function b64ToBytes(b64) {
        const bin = atob(b64);
        const arr = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
        return arr;
      }

      async function unlock(rawPin) {
        const clean = String(rawPin || "").replace(/\s+/g, "");
        const keyMat = await crypto.subtle.importKey("raw", new TextEncoder().encode(clean), { name: "PBKDF2" }, false, ["deriveKey"]);
        const aesKey = await crypto.subtle.deriveKey(
          { name: "PBKDF2", salt: b64ToBytes(BUNDLE.salt), iterations: BUNDLE.iter, hash: "SHA-256" },
          keyMat, { name: "AES-GCM", length: 256 }, false, ["decrypt"]
        );
        const buf = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64ToBytes(BUNDLE.iv) }, aesKey, b64ToBytes(BUNDLE.ct));
        return JSON.parse(new TextDecoder().decode(buf));
      }

      function syncThemeControl() {
        const isDark = root.getAttribute("data-theme") === "dark";
        setHidden(icoMoon, isDark);

        const d = data && data[lang];
        const label = d ? (isDark ? d.themeLight : d.themeDark) : (isDark ? "Light mode" : "Dark mode");
        themeBtn.setAttribute("aria-label", label);
        themeBtn.setAttribute("title", label);
        const meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute("content", isDark ? "#0b1118" : "#f2f5f7");
      }

      function syncLangPill(instant) {
        if (!segPill) return;
        const activeBtn = langBtns.find((b) => b.dataset.loc === lang);
        if (!activeBtn) return;
        const parent = segPill.parentElement;
        if (!parent) return;
        const pr = parent.getBoundingClientRect();
        const br = activeBtn.getBoundingClientRect();
        if (!br.width) return;
        const bl = parseFloat(getComputedStyle(parent).borderLeftWidth) || 0;
        const x = br.left - pr.left - bl;
        if (instant) segPill.style.transition = "none";
        segPill.style.width = br.width.toFixed(2) + "px";
        segPill.style.transform = "translate3d(" + x.toFixed(2) + "px, 0, 0)";
        segPill.style.opacity = "1";
        if (instant) {
          void segPill.offsetWidth;
          segPill.style.transition = "";
        }
      }

          + '<header class="dossier-header">'
            + '<div class="doc-head-row">'
              + '<div class="doc-title-col"><h1 class="doc-title">' + fmt(d.title, isRtl) + '</h1><p class="doc-sub">' + fmt(d.subtitle, isRtl) + "</p></div>"
              + '<span class="doc-date">' + fmt(d.date, isRtl) + "</span>"
            + "</div>"
            + '<div class="vitals-strip" role="list">' + vitalsHtml + "</div>"
          + "</header>"
          + '<div class="dossier-body">'
            + '<section class="flow-col"><ol class="flow-list">' + flowHtml + "</ol></section>"
            + '<section class="panel panel-safety" role="region"><div class="panel-head">' + ICO_SAFETY + '<h2 class="panel-title">' + fmt(sb.safetyTitle, isRtl) + '</h2></div><ol class="safety-list">' + safetyHtml + "</ol></section>"
            + '<section class="panel panel-labs" role="region"><div class="panel-head">' + ICO_LABS + '<h2 class="panel-title">' + fmt(sb.labsTitle, isRtl) + '</h2></div><div class="labs-list">' + labsHtml + "</div></section>"
            + '<section class="panel panel-tests" role="region"><div class="panel-head">' + ICO_TESTS + '<h2 class="panel-title">' + fmt(sb.testsTitle, isRtl) + '</h2></div><div class="tests-list">' + testsHtml + "</div></section>"
          + "</div>"
          + "</article>";

        triggerSheetSwap();
      }

      toggleEye.addEventListener("click", () => {
        const show = pinInput.type === "password";
        pinInput.type = show ? "text" : "password";
        setHidden(eyeOpen, show);
        setHidden(eyeClosed, !show);
        toggleEye.setAttribute("aria-label", show ? "Hide code" : "Show code");
        pinInput.focus();
      });

      pinInput.addEventListener("input", () => { if (gateErr.textContent) gateErr.textContent = ""; });

      gateForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        gateErr.textContent = "";
        gateBtn.disabled = true;
        try {
          data = await unlock(pinInput.value);
          lang = "fr";
          pinInput.value = "";
          gateForm.reset();
          gateScreen.hidden = true;
          appShell.hidden = false;
          render(true);
          requestAnimationFrame(() => syncLangPill(true));
          window.scrollTo({ top: 0, behavior: "instant" });
        } catch {
          gateErr.textContent = "Code incorrect · الرمز غير صحيح · Invalid code";
          gateForm.classList.remove("shake");
          void gateForm.offsetWidth;
          gateForm.classList.add("shake");
          pinInput.select();
        } finally {
          gateBtn.disabled = false;
        }
      });

      langBtns.forEach((btn) => btn.addEventListener("click", () => {
        const next = btn.dataset.loc;
        if (next && next !== lang && data && data[next]) {
          lang = next;
          render(false);
        }
      }));

      window.addEventListener("resize", () => { if (!appShell.hidden) syncLangPill(true); });

      themeBtn.addEventListener("click", () => {
        root.setAttribute("data-theme", root.getAttribute("data-theme") === "dark" ? "light" : "dark");
        syncThemeControl();
      });

      printBtn.addEventListener("click", () => window.print());

      lockBtn.addEventListener("click", () => {
        data = null;
        lang = "fr";
        sheet.innerHTML = "";
        sheet.classList.remove("sheet-anim");
        tbTitle.textContent = "";
        tbDate.textContent = "";
        if (segPill) segPill.style.opacity = "0";
        appShell.hidden = true;
        gateScreen.hidden = false;
        root.lang = "fr";
        root.dir = "ltr";
        document.title = LOCKED_TITLE;
        pinInput.type = "password";
        setHidden(eyeOpen, false);
        setHidden(eyeClosed, true);
        toggleEye.setAttribute("aria-label", "Show code");
        pinInput.value = "";
        gateErr.textContent = "";
        gateForm.reset();
        pinInput.focus();
      });
    })();
  </script>
</body>
</html>
