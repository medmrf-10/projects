      /* =======================================================================
         SUMMARY BUILDER + ENCRYPTED GITHUB REPO / WEBHOOK SYNC
         ======================================================================= */
      function buildSummaryText() {
        if (!data || !data[lang]) return "";
        const d = data[lang];
        const ui = d.ui || {};
        const secs = d.sections || {};
        const lines = [];
        lines.push("# " + (ui.notesPrintHeading || "Clinician Notes") + " — " + d.title + " (" + d.date + ")");
        lines.push("Date: " + new Date().toISOString().slice(0, 16).replace("T", " "));
        if (generalNote.trim()) {
          lines.push("");
          lines.push("## " + (ui.notesGeneralLabel || "Consultation summary"));
          lines.push(generalNote.trim());
        }
        if (savedPassages.length) {
          lines.push("");
          lines.push("## " + (ui.savedTitle || "Saved Passages"));
          savedPassages.forEach((p) => {
            lines.push("> [" + p.secNum + "] " + p.sourceTitle + (p.label ? " · " + p.label : ""));
            lines.push("> " + p.text);
            if (p.note && p.note.trim()) lines.push("  → " + p.note.trim());
          });
        }
        if (Array.isArray(d.interviewProbes)) {
          const probeLines = [];
          d.interviewProbes.forEach((pr) => {
            const done = probeDone.has(pr.id);
            const ans = (probeAnswers.get(pr.id) || "").trim();
            if (done || ans) {
              probeLines.push((done ? "- [x] " : "- [ ] ") + "[" + pr.secNum + "] " + pr.title);
              if (ans) probeLines.push("  → " + ans.replace(/\n/g, "\n    "));
            }
          });
          if (probeLines.length) {
            lines.push("");
            lines.push("## " + (ui.interviewProbesTitle || "Clinical Probes"));
            lines.push.apply(lines, probeLines);
          }
        }
        if (discussedQuestions.size && secs.questions && secs.questions.items) {
          lines.push("");
          lines.push("## " + secs.questions.num + " · " + secs.questions.title);
          secs.questions.items.forEach((q, i) => {
            const k = "q-" + i;
            if (discussedQuestions.has(k)) {
              lines.push("- [x] " + String(i + 1).padStart(2, "0") + ". " + q.lead);
            }
          });
        }
        const annotKeys = getAnnotatedItemKeys();
        if (annotKeys.length) {
          lines.push("");
          lines.push("## " + (ui.notesItemsLabel || "Saved, Asked & Commented Items"));
          annotKeys.forEach((k) => {
            const meta = getItemMeta(k);
            if (!meta) return;
            const marks = (pinnedItems.has(k) ? "★ " : "") + (askedItems.has(k) ? (askedDone.has(k) ? "[?✓] " : "[?] ") : "");
            const note = (itemNotes.get(k) || "").trim();
            lines.push("- " + marks + "[" + meta.secNum + "] " + meta.title);
            if (note) lines.push("  → " + note.replace(/\n/g, "\n    "));
          });
        }
        return lines.join("\n");
      }

      function buildConsultationPayload() {
        const d = data && data[lang] ? data[lang] : { title: "Fiche Clinique", date: "" };
        return {
          schema: "fiche-clinique-notes-v3",
          savedAt: new Date().toISOString(),
          lang,
          docTitle: d.title,
          docDate: d.date,
          summaryMarkdown: buildSummaryText(),
          workspace: serializeWorkspace()
        };
      }

      function formatFileTimestamp() {
        const now = new Date();
        const pad = (n) => String(n).padStart(2, "0");
        return now.getFullYear() + pad(now.getMonth() + 1) + pad(now.getDate()) + "-" + pad(now.getHours()) + pad(now.getMinutes()) + pad(now.getSeconds());
      }

      async function pushNotesToRepo() {
        if (!data || !data[lang] || !sessionPin || syncBusy) return;
        const ui = data[lang].ui || {};
        if (!isSyncConfigured()) {
          syncCfgOpen = true;
          renderNotesWorkspaceInAllTargets();
          return;
        }
        syncBusy = true;
        syncMsg = ui.syncPushing || "Uploading encrypted…";
        syncMsgIsErr = false;
        renderNotesWorkspaceInAllTargets();

        try {
          const payload = buildConsultationPayload();
          if (syncCfg.mode === "webhook") {
            const env = await encryptWithPin(payload, sessionPin, 120000);
            const res = await fetch(syncCfg.webhookUrl.trim(), {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(env)
            });
            if (!res.ok) throw new Error("HTTP " + res.status);
            syncMsg = (ui.syncPushOk || "Sent ✓ ({file})").replace("{file}", "webhook");
            syncMsgIsErr = false;
            showMiniToast(syncMsg);
          } else {
            const repo = syncCfg.repo.trim();
            const branch = (syncCfg.branch || "main").trim() || "main";
            const folder = (syncCfg.folder || "fiche-notes").trim().replace(/^\/+|\/+$/g, "") || "fiche-notes";
            const mustEncrypt = isPublicTargetRepo(repo) || Boolean(syncCfg.encrypt);
            const ts = formatFileTimestamp();
            const fileName = "consultation-" + ts + (mustEncrypt ? ".enc.json" : ".md");
            const filePath = folder + "/" + fileName;
            const fileText = mustEncrypt
              ? JSON.stringify(await encryptWithPin(payload, sessionPin, 120000), null, 2)
              : payload.summaryMarkdown;
            const apiUrl = "https://api.github.com/repos/" + repo + "/contents/" + filePath.split("/").map(encodeURIComponent).join("/");
            const res = await fetch(apiUrl, {
              method: "PUT",
              headers: {
                "Authorization": "Bearer " + syncCfg.token.trim(),
                "Accept": "application/vnd.github+json",
                "Content-Type": "application/json"
              },
              body: JSON.stringify({
                message: "Consultation notes (" + ts + ")",
                content: utf8ToB64(fileText),
                branch
              })
            });
            if (!res.ok) {
              let detail = "HTTP " + res.status;
              try {
                const errJson = await res.json();
                if (errJson && errJson.message) detail = errJson.message;
              } catch {}
              throw new Error(detail);
            }
            syncMsg = (ui.syncPushOk || "Sent ✓ ({file})").replace("{file}", fileName);
            syncMsgIsErr = false;
            showMiniToast(syncMsg);
          }
        } catch (err) {
          syncMsg = (ui.syncErr || "Sync error: {msg}").replace("{msg}", (err && err.message) || "network");
          syncMsgIsErr = true;
        } finally {
          syncBusy = false;
          renderNotesWorkspaceInAllTargets();
        }
      }

      async function pullNotesFromRepo() {
        if (!data || !data[lang] || !sessionPin || syncBusy) return;
        const ui = data[lang].ui || {};
        if (syncCfg.mode !== "github" || !isSyncConfigured()) {
          syncCfgOpen = true;
          renderNotesWorkspaceInAllTargets();
          return;
        }
        syncBusy = true;
        syncMsg = ui.syncPulling || "Loading…";
        syncMsgIsErr = false;
        renderNotesWorkspaceInAllTargets();

        try {
          const repo = syncCfg.repo.trim();
          const branch = (syncCfg.branch || "main").trim() || "main";
          const folder = (syncCfg.folder || "fiche-notes").trim().replace(/^\/+|\/+$/g, "") || "fiche-notes";
          const headers = {
            "Authorization": "Bearer " + syncCfg.token.trim(),
            "Accept": "application/vnd.github+json"
          };
          const listUrl = "https://api.github.com/repos/" + repo + "/contents/" + folder.split("/").map(encodeURIComponent).join("/") + "?ref=" + encodeURIComponent(branch);
          const listRes = await fetch(listUrl, { headers });
          if (listRes.status === 404) {
            syncMsg = ui.syncPullEmpty || "No notes found.";
            syncMsgIsErr = false;
            syncBusy = false;
            renderNotesWorkspaceInAllTargets();
            return;
          }
          if (!listRes.ok) throw new Error("HTTP " + listRes.status);
          const files = await listRes.json();
          const encFiles = (Array.isArray(files) ? files : [])
            .filter((f) => f && f.type === "file" && String(f.name || "").endsWith(".enc.json"))
            .sort((a, b) => String(b.name).localeCompare(String(a.name)));
          if (!encFiles.length) {
            syncMsg = ui.syncPullEmpty || "No encrypted note files found.";
            syncMsgIsErr = false;
            syncBusy = false;
            renderNotesWorkspaceInAllTargets();
            return;
          }
          const newest = encFiles[0];
          const fileUrl = "https://api.github.com/repos/" + repo + "/contents/" + String(newest.path).split("/").map(encodeURIComponent).join("/") + "?ref=" + encodeURIComponent(branch);
          const fileRes = await fetch(fileUrl, { headers });
          if (!fileRes.ok) throw new Error("HTTP " + fileRes.status);
          const fileObj = await fileRes.json();
          const envJson = JSON.parse(b64ToUtf8(fileObj.content));
          const dec = await decryptWithPin(envJson, sessionPin);
          if (dec && dec.workspace) applyWorkspaceSnapshot(dec.workspace);
          else applyWorkspaceSnapshot(dec);
          await persistEncryptedWorkspaceNow();
          syncMsg = (ui.syncPullOk || "Loaded ✓") + " (" + newest.name + ")";
          syncMsgIsErr = false;
          showMiniToast(ui.syncPullOk || "Notes loaded ✓");
          syncAllBadges();
          if (activeView !== "notes") renderActiveView(false);
        } catch (err) {
          syncMsg = (ui.syncErr || "Sync error: {msg}").replace("{msg}", (err && err.message) || "decrypt failed");
          syncMsgIsErr = true;
        } finally {
          syncBusy = false;
          renderNotesWorkspaceInAllTargets();
        }
      }

      async function exportEncryptedFile() {
        if (!sessionPin || !data || !data[lang]) return;
        const payload = buildConsultationPayload();
        const env = await encryptWithPin(payload, sessionPin, 120000);
        const blob = new Blob([JSON.stringify(env, null, 2)], { type: "application/json;charset=utf-8" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = "fiche-notes-" + formatFileTimestamp() + ".enc.json";
        document.body.appendChild(a);
        a.click();
        a.remove();
        window.setTimeout(() => URL.revokeObjectURL(url), 1000);
      }

      async function importEncryptedFile(file) {
        if (!file || !sessionPin || !data || !data[lang]) return;
        const ui = data[lang].ui || {};
        try {
          const text = await file.text();
          const env = JSON.parse(text);
          const dec = await decryptWithPin(env, sessionPin);
          if (dec && dec.workspace) applyWorkspaceSnapshot(dec.workspace);
          else applyWorkspaceSnapshot(dec);
          await persistEncryptedWorkspaceNow();
          syncMsg = ui.syncImportOk || "Notes imported ✓";
          syncMsgIsErr = false;
          showMiniToast(syncMsg);

          renderNotesWorkspaceInAllTargets();
        } catch {
          syncMsg = ui.syncImportErr || "Could not decrypt file.";
          syncMsgIsErr = true;
          renderNotesWorkspaceInAllTargets();
        }
      }

              + (p.note ? '<p class="drawer-item-note" dir="auto">' + esc(p.note) + "</p>" : "")
            + "</div>"
          );
        });
        annotKeys.forEach((k) => {
          const meta = getItemMeta(k);
          if (!meta) return;
          const saved = pinnedItems.has(k);

          const note = (itemNotes.get(k) || "").trim();
          parts.push(
            '<div class="drawer-item' + (saved ? " is-pinned" : "") + '">'
              + '<div class="drawer-item-top">'
                + '<button class="drawer-item-jump" type="button" data-drawer-jump="' + esc(k) + '" data-drawer-sec="' + esc(meta.secId) + '">'
                  + '<span class="drawer-item-num"><bdi dir="ltr">' + esc(meta.secNum) + "</bdi></span>"
                  + '<span class="drawer-item-title">' + esc(meta.title) + "</span>"
                + "</button>"
                + '<span class="drawer-item-acts">'
                  + '<button class="drawer-mini-btn' + (saved ? " is-pinned" : "") + '" type="button" data-drawer-pin="' + esc(k) + '" title="' + esc(saved ? (ui.saveCardRemove || "Remove") : (ui.saveCardAdd || "Save")) + '">' + ICO_BM + "</button>"
                  + '<button class="drawer-mini-btn" type="button" data-drawer-edit="' + esc(k) + '" data-drawer-sec="' + esc(meta.secId) + '" title="' + esc(ui.commentEdit || "Edit") + '">' + ICO_NOTE + "</button>"
                  + (note ? '<button class="drawer-mini-btn is-del" type="button" data-drawer-del="' + esc(k) + '" title="' + esc(ui.commentDelete || "Delete") + '">' + ICO_TRASH + "</button>" : "")
                + "</span>"
              + "</div>"
              + (note
                ? '<p class="drawer-item-note" dir="auto">' + esc(note) + "</p>"
                : '<div class="drawer-item-pin-lbl">' + (saved ? "🔖 " + esc(ui.tabSaved || "Saved") : "") + (asked ? (saved ? " · " : "") + "? " + esc(ui.askShort || "Ask") : "") + "</div>")
            + "</div>"
          );
        });
        return parts.join("");
      }

      function renderNotesFeedInAllTargets() {
        if (!data || !data[lang]) return;

        const hasAny = hasAnyWorkspaceData();

      function renderNotesWorkspaceInAllTargets() {

          notesDrawer.innerHTML = renderNotesCoreInnerHtml(ui, false);

      function setNotesOpen(open, restoreFocus) {
        if (!data || !data[lang]) return;
        if (isMobileViewport() && open) {
          switchView("notes", false);
          return;
        }
        const wasOpen = notesOpen;
        notesOpen = Boolean(open);
        clearConfirmArmed = false;
        clearTimeout(clearConfirmTimer);
        if (notesOpen) {
          if (!wasOpen) lastFocusBeforeOverlay = document.activeElement;
          toggleReadPop(false);
          closeMobileSheet(false);
          closeShortcutsModal(false);
          notesDrawer.innerHTML = renderNotesCoreInnerHtml(data[lang].ui || {}, false);
          setHidden(notesDrawer, false);
          setHidden(notesBackdrop, false);
          document.body.classList.add("notes-open");
          notesBtn.setAttribute("aria-expanded", "true");
          syncOverlayBodyLock();
          syncAllBadges();
        } else {
          setHidden(notesDrawer, true);
          setHidden(notesBackdrop, true);
          document.body.classList.remove("notes-open");
          notesBtn.setAttribute("aria-expanded", "false");
          syncOverlayBodyLock();
          syncAllBadges();
          if (restoreFocus && lastFocusBeforeOverlay && typeof lastFocusBeforeOverlay.focus === "function") {
            try { lastFocusBeforeOverlay.focus({ preventScroll: true }); } catch {}
          }
          lastFocusBeforeOverlay = null;
        }
        requestAnimationFrame(() => {
          syncAllPills(true);
          updateScrollUI();
        });

      async function handleNotesContainerClick(e, container) {
        if (!data || !data[lang]) return false;
        const ui = data[lang].ui || {};
        if (e.target.closest("[data-close-notes]")) {
          setNotesOpen(false, true);
          return true;
        }
        const modeBtn = e.target.closest("[data-sync-mode]");
        if (modeBtn) {
          syncCfg.mode = modeBtn.dataset.syncMode;
          renderNotesWorkspaceInAllTargets();
          return true;
        }
        if (e.target.closest("[data-sync-toggle-cfg]")) {
          syncCfgOpen = !syncCfgOpen;
          renderNotesWorkspaceInAllTargets();
          return true;
        }
        if (e.target.closest("[data-sync-enc]")) {
          if (!isPublicTargetRepo(syncCfg.repo)) {
            syncCfg.encrypt = !syncCfg.encrypt;
            renderNotesWorkspaceInAllTargets();
          }
          return true;
        }
        if (e.target.closest("[data-sync-save]")) {
          const repoEl = container.querySelector("#syncRepoIn");
          const brEl = container.querySelector("#syncBranchIn");
          const fldEl = container.querySelector("#syncFolderIn");
          const tokEl = container.querySelector("#syncTokenIn");
          const whEl = container.querySelector("#syncWebhookIn");
          if (repoEl) syncCfg.repo = repoEl.value.trim() || "medmrf-10/zme";
          if (brEl) syncCfg.branch = brEl.value.trim() || "main";
          if (fldEl) syncCfg.folder = fldEl.value.trim() || "fiche-notes";
          if (tokEl) syncCfg.token = tokEl.value.trim();
          if (whEl) syncCfg.webhookUrl = whEl.value.trim();
          if (isPublicTargetRepo(syncCfg.repo)) syncCfg.encrypt = true;
          await persistEncryptedSyncCfg();
          syncCfgOpen = false;
          syncMsg = "";
          showMiniToast(ui.syncLocalSaved || "Saved ✓");
          renderNotesWorkspaceInAllTargets();
          return true;
        }
        if (e.target.closest("[data-sync-clear]")) {
          syncCfg = Object.assign({}, DEFAULT_SYNC_CFG);
          syncCfgOpen = false;
          syncMsg = "";
          try { localStorage.removeItem(SYNC_STORE_KEY); } catch {}
          renderNotesWorkspaceInAllTargets();
          return true;
        }
        if (e.target.closest("[data-sync-push]")) {
          await pushNotesToRepo();
          return true;
        }
        if (e.target.closest("[data-sync-pull]")) {
          await pullNotesFromRepo();
          return true;
        }
        const tplBtn = e.target.closest("[data-drawer-tpl]");
        if (tplBtn) {
          const ta = container.querySelector('[data-general-note="1"]');
          if (ta) {
            const tpl = tplBtn.dataset.drawerTpl;
            const sep = ta.value && !ta.value.endsWith("\n") ? "\n" : "";
            ta.value = ta.value + sep + tpl;
            generalNote = ta.value;
            scheduleWorkspaceSave();
            ta.focus();
            ta.setSelectionRange(ta.value.length, ta.value.length);
            syncAllBadges();
            renderNotesFeedInAllTargets();
          }
          return true;
        }
        const delPass = e.target.closest("[data-del-passage]");
        if (delPass) {
          removeSavedPassage(delPass.dataset.delPassage);
          return true;
        }
        const jumpBtn = e.target.closest("[data-drawer-jump]");
        if (jumpBtn) {
          const k = jumpBtn.dataset.drawerJump;
          const s = jumpBtn.dataset.drawerSec;
          if (window.innerWidth < 1180) setNotesOpen(false, false);
          jumpToSection(s, { itemKey: k });
          return true;
        }
        const pinBtn = e.target.closest("[data-drawer-pin]");
        if (pinBtn) {
          toggleSaveCard(pinBtn.dataset.drawerPin);
          return true;
        }
        const editBtn = e.target.closest("[data-drawer-edit]");
        if (editBtn) {
          const k = editBtn.dataset.drawerEdit;
          const s = editBtn.dataset.drawerSec;
          if (window.innerWidth < 1180) setNotesOpen(false, false);
          jumpToSection(s, { itemKey: k });
          window.setTimeout(() => openInlineComment(k, true), 260);
          return true;
        }
        const delBtn = e.target.closest("[data-drawer-del]");
        if (delBtn) {
          deleteItemNote(delBtn.dataset.drawerDel);
          return true;
        }
        if (e.target.closest("[data-print-toggle-row]") || e.target.closest("[data-print-switch]")) {
          includeNotesInPrint = !includeNotesInPrint;
          document.body.classList.toggle("print-with-notes", includeNotesInPrint);
          document.querySelectorAll("[data-print-switch]").forEach((sw) => {
            sw.setAttribute("aria-checked", includeNotesInPrint ? "true" : "false");
          });
          scheduleWorkspaceSave();
          syncPrintNotesDOM();
          return true;
        }
        const copyBtn = e.target.closest("[data-notes-copy]");
        if (copyBtn) {
          const txt = buildSummaryText();
          if (!txt) return true;
          let ok = false;
          try {
            if (navigator.clipboard && navigator.clipboard.writeText) {
              await navigator.clipboard.writeText(txt);
              ok = true;
            }
          } catch {}
          if (!ok) {
            const tmp = document.createElement("textarea");
            tmp.value = txt;
            tmp.style.position = "fixed";
            tmp.style.opacity = "0";
            document.body.appendChild(tmp);
            tmp.select();
            try { document.execCommand("copy"); } catch {}
            tmp.remove();
          }
          const span = copyBtn.querySelector("span");
          if (span) span.textContent = ui.notesCopied || "Copied ✓";
          showMiniToast(ui.notesCopied || "Copied ✓");
          clearTimeout(copyResetTimer);
          copyResetTimer = window.setTimeout(() => {
            if (span && data && data[lang]) span.textContent = (data[lang].ui && data[lang].ui.notesCopy) || "Copy summary";
          }, 2000);
          return true;
        }
        if (e.target.closest("[data-notes-share]")) {
          const txt = buildSummaryText();
          if (!txt) return true;
          if (navigator.share) {
            try {
              await navigator.share({ title: data[lang].title || "Fiche Clinique", text: txt });
              return true;
            } catch {}
          }
          try {
            if (navigator.clipboard && navigator.clipboard.writeText) await navigator.clipboard.writeText(txt);
          } catch {}
          showMiniToast(ui.notesCopied || "Copied ✓");
          return true;
        }
        if (e.target.closest("[data-notes-exp-txt]")) {
          const txt = buildSummaryText();
          if (!txt) return true;
          const blob = new Blob([txt], { type: "text/plain;charset=utf-8" });
          const url = URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.href = url;
          a.download = "notes-fiche-clinique-" + lang + ".txt";
          document.body.appendChild(a);
          a.click();
          a.remove();
          window.setTimeout(() => URL.revokeObjectURL(url), 1000);
          return true;
        }
        if (e.target.closest("[data-notes-exp-enc]")) {
          await exportEncryptedFile();
          return true;
        }
        if (e.target.closest("[data-notes-imp-enc]")) {
          if (importNotesInput) {
            importNotesInput.value = "";
            importNotesInput.click();
          }
          return true;
        }
        const clrBtn = e.target.closest("[data-notes-clear]");
        if (clrBtn) {
          if (!clearConfirmArmed) {
            clearConfirmArmed = true;
            clrBtn.textContent = ui.notesClearConfirm || "Confirm clear?";
            clearTimeout(clearConfirmTimer);
            clearConfirmTimer = window.setTimeout(() => {
              clearConfirmArmed = false;
              document.querySelectorAll("[data-notes-clear]").forEach((b) => {
                if (data && data[lang]) b.textContent = (data[lang].ui && data[lang].ui.notesClear) || "Clear all";
              });
            }, 4000);
          } else {
            clearConfirmArmed = false;
            clearTimeout(clearConfirmTimer);
            pinnedItems.clear();
            askedItems.clear();
            askedDone.clear();
            probeDone.clear();
            discussedQuestions.clear();
            itemNotes.clear();
            probeAnswers.clear();
            openCommentEditors.clear();
            savedPassages = [];
            generalNote = "";
            includeNotesInPrint = false;
            document.body.classList.remove("print-with-notes");
            if (activeLens === "annotated") activeLens = "all";
            try { localStorage.removeItem(WS_STORE_KEY); } catch {}
            renderActiveView(false);
            renderNotesWorkspaceInAllTargets();
            syncAllBadges();
          }
          return true;
        }
        return false;
      }

      function syncMobileTabBar() {
        if (!data || !data[lang]) return;
        const ui = data[lang].ui || {};
        if (tabLblBrief) tabLblBrief.textContent = ui.tabBrief || "Dossier";
        if (tabLblInterview) tabLblInterview.textContent = ui.tabInterview || "Entretien";
        if (tabLblSaved) tabLblSaved.textContent = ui.tabSaved || "Favoris";
        if (tabLblNotes) tabLblNotes.textContent = ui.tabNotes || "Notes";
        mobTabBtns.forEach((btn) => {
          const active = btn.dataset.tab === activeView;
          btn.classList.toggle("is-active", active);
          btn.setAttribute("aria-selected", active ? "true" : "false");
        });
        syncAllBadges();
      }

      function syncNavFade() {
        if (!navLinks) return;
        const maxSl = navLinks.scrollWidth - navLinks.clientWidth;
        navLinks.classList.remove("fade-left", "fade-right", "fade-both");
        if (maxSl <= 2) return;
        const r = navLinks.getBoundingClientRect();
        const first = navLinks.firstElementChild;
        const last = navLinks.lastElementChild;
        if (!first || !last) return;
        const fRect = first.getBoundingClientRect();
        const lRect = last.getBoundingClientRect();
        const minL = Math.min(fRect.left, lRect.left);
        const maxR = Math.max(fRect.right, lRect.right);
        const clipL = minL < r.left - 2;
        const clipR = maxR > r.right + 2;
        if (clipL && clipR) navLinks.classList.add("fade-both");
        else if (clipL) navLinks.classList.add("fade-left");
        else if (clipR) navLinks.classList.add("fade-right");
      }

      function scrollNavItemIntoView(btn) {
        if (!btn || !navLinks) return;
        if (getComputedStyle(stickyChrome).position === "static") return;
        if (navLinks.scrollWidth <= navLinks.clientWidth + 1) return;
        const cRect = navLinks.getBoundingClientRect();
        const bRect = btn.getBoundingClientRect();
        if (bRect.left >= cRect.left + 8 && bRect.right <= cRect.right - 8) return;
        const delta = (bRect.left - cRect.left) - (cRect.width - bRect.width) / 2;
        navLinks.scrollTo({ left: navLinks.scrollLeft + delta, behavior: "smooth" });
      }

      function syncNavDimming() {
        const visSet = new Set(getVisibleNavIds());
        navLinks.querySelectorAll(".nav-link").forEach((b) => {
          b.classList.toggle("is-dimmed", activeView === "brief" && !visSet.has(b.dataset.target));
        });
        marginRail.querySelectorAll(".rail-item").forEach((b) => {
          b.style.opacity = (activeView !== "brief" || visSet.has(b.dataset.target)) ? "" : "0.45";
        });
      }

      function setActiveNav(id, scrollNavIntoView) {
        activeNav = id;
        navLinks.querySelectorAll(".nav-link").forEach((b) => {
          const active = activeView === "brief" && b.dataset.target === id;
          b.classList.toggle("is-active", active);
          if (active) b.setAttribute("aria-current", "location");
          else b.removeAttribute("aria-current");
          if (active && scrollNavIntoView) scrollNavItemIntoView(b);
        });
        marginRail.querySelectorAll(".rail-item").forEach((b) => {
          const active = activeView === "brief" && b.dataset.target === id;
          b.classList.toggle("is-active", active);
          if (active) b.setAttribute("aria-current", "location");
          else b.removeAttribute("aria-current");
        });
        briefMain.querySelectorAll(".mob-sec-chip[data-jump-sec]").forEach((c) => {
          c.classList.toggle("is-active", c.dataset.jumpSec === id);
        });
      }

      function showReturnToast(fromSecId, prevScrollY) {
        if (!data || !data[lang]) return;
        const d = data[lang];
        const ui = d.ui || {};
        const sec = d.sections && d.sections[fromSecId];
        if (!sec) return;
        const label = sec.num + " " + ((ui.nav && ui.nav[fromSecId]) || sec.title);
        returnOrigin = { secId: fromSecId, scrollY: prevScrollY };
        returnGoBtn.innerHTML = ICO_RETURN + "<span>" + esc((ui.returnTo || "Back to {sec}").replace("{sec}", label)) + "</span>";
        returnDismissBtn.setAttribute("aria-label", ui.dismiss || "Close");
        returnToast.classList.add("is-visible");
        clearTimeout(returnTimer);
        returnTimer = window.setTimeout(hideReturnToast, 12000);
      }

      function hideReturnToast() {
        clearTimeout(returnTimer);
        returnToast.classList.remove("is-visible");
        returnOrigin = null;
      }

      function switchView(nextView, animate) {
        if (!data || !data[lang]) return;
        if (nextView === "notes" && !isMobileViewport()) {
          setNotesOpen(!notesOpen, false);
          return;
        }
        hideSelPop();
        hideQuickPop();
        toggleReadPop(false);
        activeView = nextView;
        renderActiveView(Boolean(animate));
        syncMobileTabBar();
        setActiveNav(activeNav, false);
        syncNavDimming();
        window.scrollTo({ top: 0, behavior: "instant" });
        updateScrollUI();
      }

      function jumpToSection(id, opts) {
        const options = opts || {};
        if (document.activeElement === searchInput) searchInput.blur();
        hideQuickPop();
        toggleReadPop(false);
        hideSelPop();

        if (activeView !== "brief") {
          activeView = "brief";
          renderBrief(false);
          syncMobileTabBar();
        }
        const itemKey = options.itemKey || "";
        let targetEl = itemKey ? document.getElementById("item-" + itemKey) : document.getElementById("sec-" + id);
        if (!targetEl && (searchQuery || activeLens !== "all")) {
          searchQuery = "";
          searchInput.value = "";
          activeLens = "all";
          renderBrief(false);
          targetEl = itemKey ? document.getElementById("item-" + itemKey) : document.getElementById("sec-" + id);
        }
        if (!targetEl) targetEl = document.getElementById("sec-" + id);
        if (!targetEl) return;

        if (options.fromSec && (options.fromSec !== id || window.scrollY < 160)) {
          showReturnToast(options.fromSec, window.scrollY);
        }
        if (itemKey && density === "brief" && targetEl.hasAttribute("data-exp-card")) {
          toggleItemInPlace(itemKey, true);
        }
        spyLockUntil = Date.now() + 780;
        setActiveNav(id, true);
        const extraPad = itemKey ? 8 : 0;
        const top = Math.max(0, targetEl.getBoundingClientRect().top + window.scrollY - getStickyOffset() - extraPad);
        window.scrollTo({ top, behavior: "smooth" });
        targetEl.classList.remove("is-pulsed");
        void targetEl.offsetWidth;
        targetEl.classList.add("is-pulsed");
      }

      function stepSection(dir) {
        if (activeView !== "brief") { switchView("brief", false); return; }
        const vis = getVisibleNavIds();
        if (!vis.length) return;
        let idx = vis.indexOf(activeNav);
        if (idx === -1) idx = 0;
        const nextIdx = Math.max(0, Math.min(vis.length - 1, idx + dir));
        if (nextIdx !== idx || !document.getElementById("sec-" + activeNav)) {
          jumpToSection(vis[nextIdx]);
        }
      }

      function scrollToTopSmooth() {
        spyLockUntil = Date.now() + 650;
        const vis = getVisibleNavIds();
        if (vis.length) setActiveNav(vis[0], true);
        window.scrollTo({ top: 0, behavior: "smooth" });
      }

      function updateScrollUI() {
        if (!data || appShell.hidden) return;
        const sy = window.scrollY || 0;
        const maxScroll = Math.max(1, document.documentElement.scrollHeight - window.innerHeight);
        const pct = Math.max(0, Math.min(1, sy / maxScroll));
        const tf = "scaleX(" + pct.toFixed(4) + ")";
        readProgressFill.style.transform = tf;
        mobProgressFill.style.transform = tf;

        stickyChrome.classList.toggle("is-scrolled", sy > 10);
        floatTopBtn.classList.toggle("is-visible", sy > 360);

        const railTop = marginRail.querySelector(".rail-top-btn");
        if (railTop) railTop.classList.toggle("is-dim", sy < 240);
        const railFill = marginRail.querySelector(".rail-progress-fill");
        if (railFill) railFill.style.transform = "scaleY(" + pct.toFixed(4) + ")";

        if (activeView !== "brief" || Date.now() < spyLockUntil) return;
        const vis = getVisibleNavIds();
        if (!vis.length) return;

        if (sy + window.innerHeight >= document.documentElement.scrollHeight - 28) {
          const lastId = vis[vis.length - 1];
          if (lastId !== activeNav) setActiveNav(lastId, true);
          return;
        }

        const offset = getStickyOffset() + 42;
        let bestId = vis[0];
        let bestTop = -Infinity;
        for (let i = 0; i < vis.length; i++) {
          const id = vis[i];
          const el = document.getElementById("sec-" + id);
          if (!el) continue;
          const top = el.getBoundingClientRect().top;
          if (top <= offset && top > bestTop) {
            bestTop = top;
            bestId = id;
          }
        }
        if (bestId !== activeNav) setActiveNav(bestId, true);
      }

      /* Search Match Stepper & Quick Filters */
      function refreshSearchMarks(preserveIdx) {
        const prevIdx = preserveIdx ? activeMarkIdx : -1;
        searchMarks = Array.from(briefMain.querySelectorAll("mark.hl")).filter((m) => {
          if (m.closest(".brief-root.is-brief .expandable:not(.is-open):not(.is-search-open) .detail-collapse")) return false;
          const rect = m.getBoundingClientRect();
          return rect.width > 0 && rect.height > 0;
        });
        if (prevIdx >= 0 && prevIdx < searchMarks.length) {
          activeMarkIdx = prevIdx;
          searchMarks[activeMarkIdx].classList.add("is-current");
          searchCount.textContent = (activeMarkIdx + 1) + "/" + searchMarks.length;
        } else {
          activeMarkIdx = -1;
        }
        setHidden(searchStepGroup, !searchQuery.trim() || searchMarks.length === 0);
      }

      function stepSearchMatch(dir) {
        if (!searchMarks.length) return;
        if (activeMarkIdx >= 0 && searchMarks[activeMarkIdx]) {
          searchMarks[activeMarkIdx].classList.remove("is-current");
        }
        if (activeMarkIdx === -1) activeMarkIdx = dir >= 0 ? 0 : searchMarks.length - 1;
        else activeMarkIdx = (activeMarkIdx + dir + searchMarks.length) % searchMarks.length;
        const cur = searchMarks[activeMarkIdx];
        cur.classList.add("is-current");
        cur.scrollIntoView({ behavior: "smooth", block: "center" });
        searchCount.textContent = (activeMarkIdx + 1) + "/" + searchMarks.length;
      }

      function updateSearchChrome(matchTotal, qNorm, preserveMarkIdx) {
        const ui = data && data[lang] && data[lang].ui;

      function syncOverlayBodyLock() {
        const mobileDrawerOpen = notesOpen && window.innerWidth < 1180;

        document.body.classList.toggle("has-overlay", open);

      function getFocusables(container) {
        return Array.from(container.querySelectorAll('button:not([disabled]), [href], input:not([disabled]), textarea:not([disabled]), [tabindex]:not([tabindex="-1"])'))
          .filter((el) => el.offsetParent !== null);
      }

      function trapDialogFocus(e, container) {
        if (e.key !== "Tab") return;
        const focusables = getFocusables(container);
        if (!focusables.length) return;
        const first = focusables[0];
        const last = focusables[focusables.length - 1];
        if (e.shiftKey) {
          if (document.activeElement === first || !container.contains(document.activeElement)) {
            e.preventDefault();
            last.focus();
          }
        } else if (document.activeElement === last || !container.contains(document.activeElement)) {
          e.preventDefault();
          first.focus();
        }
      }

      /* Interactive Tooltip Engine (Lab Gauges & Biomarkers) */
      function showTooltip(title, body, clientX, clientY) {
        if (!title && !body) return;
        const isRtlTip = root.dir === "rtl";
        vizTooltip.innerHTML =
          (title ? '<div class="viz-tip-title">' + fmt(title, isRtlTip, "") + "</div>" : "")
          + (body ? '<div class="viz-tip-body">' + fmt(body, isRtlTip, "") + "</div>" : "");
        vizTooltip.classList.add("is-visible");
        vizTooltip.setAttribute("aria-hidden", "false");
        const tw = vizTooltip.offsetWidth || 200;
        const th = vizTooltip.offsetHeight || 46;
        const pad = 12;
        let x = clientX - tw / 2;
        if (x < pad) x = pad;
        if (x + tw > window.innerWidth - pad) x = window.innerWidth - tw - pad;
        let y = clientY - th - 14;
        if (y < pad) y = clientY + 18;
        vizTooltip.style.transform = "translate3d(" + Math.round(x) + "px," + Math.round(y) + "px,0)";
      }

      function hideTooltip() {
        vizTooltip.classList.remove("is-visible");
        vizTooltip.setAttribute("aria-hidden", "true");
      }

      /* =======================================================================
         LAB BIOMARKER GAUGES
         ======================================================================= */
      function renderSpotlightGauge(lb, refLbl) {
        const W = 860, H = 34;
        const padL = 14, padR = 14, trackW = W - padL - padR;
        const span = Math.max(0.1, lb.max - lb.min);
        const mapX = (v) => padL + Math.max(0, Math.min(1, (v - lb.min) / span)) * trackW;

        const zL = mapX(lb.rLow);
        const zR = mapX(lb.rHigh);
        const cX = mapX(lb.curr);
        const trackY = 9, trackH = 7;

        const tipT = esc(lb.label + " (" + lb.date + ")");
        const tipB = esc(lb.currStr + " " + lb.unit + " · " + (refLbl || "Ref") + " " + lb.ref + (lb.note ? " — " + lb.note : ""));

        return '<svg class="viz-svg spot-svg" viewBox="0 0 ' + W + " " + H + '" dir="ltr" direction="ltr" role="img" aria-label="' + tipT + ": " + tipB + '">'
          + '<rect x="' + padL + '" y="' + trackY + '" width="' + trackW + '" height="' + trackH + '" rx="3.5" fill="var(--track-bg)"></rect>'
          + '<rect x="' + padL + '" y="' + trackY + '" width="' + Math.max(0, zL - padL).toFixed(1) + '" height="' + trackH + '" rx="3.5" fill="var(--caution-bg)"></rect>'
          + '<rect x="' + zL.toFixed(1) + '" y="' + trackY + '" width="' + Math.max(4, zR - zL).toFixed(1) + '" height="' + trackH + '" rx="2" fill="var(--zone-bg)"></rect>'
          + '<line x1="' + zL.toFixed(1) + '" y1="' + (trackY - 3) + '" x2="' + zL.toFixed(1) + '" y2="' + (trackY + trackH + 3.5) + '" stroke="var(--zone-edge)" stroke-width="1.6"></line>'
          + '<line x1="' + zR.toFixed(1) + '" y1="' + (trackY - 3) + '" x2="' + zR.toFixed(1) + '" y2="' + (trackY + trackH + 3.5) + '" stroke="var(--zone-edge)" stroke-width="1.6"></line>'
          + '<text x="' + zL.toFixed(1) + '" y="' + (trackY + trackH + 14.5) + '" text-anchor="middle" direction="ltr" fill="var(--text-3)" font-size="11" font-weight="600" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">' + esc(lb.rLow.toFixed(1)) + "</text>"
          + '<text x="' + zR.toFixed(1) + '" y="' + (trackY + trackH + 14.5) + '" text-anchor="middle" direction="ltr" fill="var(--text-3)" font-size="11" font-weight="600" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">' + esc(lb.rHigh.toFixed(1)) + "</text>"
          + '<g class="svg-hit" tabindex="0" data-tip-title="' + tipT + '" data-tip-body="' + tipB + '">'
            + '<circle cx="' + cX.toFixed(1) + '" cy="' + (trackY + trackH / 2) + '" r="10.5" fill="var(--amber-soft)"></circle>'
            + '<circle cx="' + cX.toFixed(1) + '" cy="' + (trackY + trackH / 2) + '" r="5.2" fill="var(--amber)" stroke="var(--surface)" stroke-width="2"></circle>'
            + '<circle cx="' + cX.toFixed(1) + '" cy="' + (trackY + trackH / 2) + '" r="16" fill="transparent"></circle>'
          + "</g>"
          + "</svg>";
      }

      function renderMiniBar(lb, qNorm) {
        const span = Math.max(0.01, lb.max - lb.min);
        const clamp = (v) => Math.max(2, Math.min(98, ((v - lb.min) / span) * 100));
        const zL = Math.max(0, Math.min(100, ((lb.rLow - lb.min) / span) * 100));
        const zR = Math.max(0, Math.min(100, ((lb.rHigh - lb.min) / span) * 100));
        const cP = clamp(lb.curr);
        let prevHtml = "";
        if (typeof lb.prev === "number") {
          const pP = clamp(lb.prev);
          const dL = Math.min(pP, cP);
          const dW = Math.abs(cP - pP);
          prevHtml = '<span class="mini-delta" style="left:' + dL.toFixed(1) + "%;width:" + dW.toFixed(1) + '%"></span>'
            + '<span class="mini-dot-prev" style="left:' + pP.toFixed(1) + '%"></span>';
        }
        return '<div class="mini-viz" dir="ltr">'
          + '<div class="mini-track" aria-hidden="true">'
            + '<span class="mini-zone" style="left:' + zL.toFixed(1) + "%;width:" + Math.max(3, zR - zL).toFixed(1) + '%"></span>'
            + prevHtml
            + '<span class="mini-dot-curr" style="left:' + cP.toFixed(1) + '%"></span>'
          + "</div>"
          + (lb.ref ? '<span class="mini-ref">' + fmt(lb.ref, false, qNorm) + "</span>" : "")
          + "</div>";
      }
