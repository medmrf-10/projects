<!DOCTYPE html>
<html lang="fr" dir="ltr" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet" />
  <meta name="referrer" content="no-referrer" />
  <meta name="theme-color" content="#FAF9F6" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230F766E'/%3E%3Cpath d='M16 9v14M9 16h14' stroke='%23FAF9F6' stroke-width='2.6' stroke-linecap='round'/%3E%3C/svg%3E" />
  <title>Fiche Clinique · ملف طبي · Clinical Brief</title>
  <style>
    :root {
      color-scheme: light;
      --font-sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      --font-display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      --font-ar: "SF Arabic", "Geeza Pro", "Segoe UI", Tahoma, "Noto Sans Arabic", system-ui, -apple-system, sans-serif;
      --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
      --ease: cubic-bezier(0.22, 1, 0.36, 1);

      /* Editorial Clinical Brief — Warm Alabaster Paper */
      --bg: #FAF9F6;
      --surface: #FFFFFF;
      --surface-2: #F3F1EB;
      --surface-3: #ECE9E0;
      --surface-hover: #E7E4DA;
      --chrome: rgba(250, 249, 246, 0.88);

      --border: rgba(15, 23, 42, 0.08);
      --border-subtle: rgba(15, 23, 42, 0.055);
      --border-strong: rgba(15, 23, 42, 0.16);
      --gridline: rgba(15, 23, 42, 0.07);

      --text: #0F172A;
      --text-2: #334155;
      --text-3: #64748B;

      /* Calm Clinical Teal */
      --teal: #0F766E;
      --teal-btn: #0F766E;
      --teal-btn-hover: #115E59;
      --teal-text: #0D5E58;
      --teal-soft: rgba(15, 118, 110, 0.08);
      --teal-band: rgba(15, 118, 110, 0.09);
      --teal-border: rgba(15, 118, 110, 0.22);

      /* Terracotta Coral (Clinical Flags / Fatigue Decay) */
      --coral: #C2410C;
      --coral-text: #9A3412;
      --coral-soft: rgba(194, 65, 12, 0.08);
      --coral-border: rgba(194, 65, 12, 0.24);

      /* Refined Clinical Amber (Watch / Swap / Load) */
      --amber: #B45309;
      --amber-text: #92400E;
      --amber-soft: rgba(180, 83, 9, 0.08);
      --amber-border: rgba(180, 83, 9, 0.25);

      /* Clinical Slate & Info */
      --info: #1D4ED8;
      --info-text: #1E40AF;
      --info-soft: rgba(29, 78, 216, 0.07);
      --info-border: rgba(29, 78, 216, 0.20);
      --slate-viz: #64748B;
      --slate-viz-soft: rgba(100, 116, 139, 0.18);

      /* Sleep Ribbon Palette */
      --sleep-bg: #DCE6F2;
      --sleep-stripe: rgba(30, 64, 115, 0.12);
      --sleep-text: #1E3A5F;
      --trough-bg: #EFECE4;
      --trough-wave: rgba(180, 83, 9, 0.28);
      --trough-text: #57534E;
      --alert-bg: #0F766E;
      --alert-text: #FFFFFF;
      --night-bg: #F5E1C8;
      --night-text: #854D0E;

      /* Lab Range Bar Tokens */
      --track-bg: #E8E5DC;
      --zone-bg: rgba(15, 118, 110, 0.16);
      --zone-edge: rgba(15, 118, 110, 0.42);
      --caution-bg: rgba(180, 83, 9, 0.12);

      /* Search Highlight */
      --hl-bg: #FEF08A;
      --hl-text: #0F172A;

      --err: #B91C1C;
      --shadow-fig: 0 1px 2px rgba(15, 23, 42, 0.03), 0 8px 24px -14px rgba(15, 23, 42, 0.07);
      --shadow-gate: 0 20px 50px -18px rgba(15, 23, 42, 0.12), 0 1px 3px rgba(15, 23, 42, 0.05);
      --shadow-tip: 0 10px 28px -8px rgba(15, 23, 42, 0.18), 0 2px 6px rgba(15, 23, 42, 0.06);
      --r-lg: 14px;
      --r-md: 10px;
      --r-sm: 7px;
      --r-xs: 5px;
    }

    html[data-theme="dark"] {
      color-scheme: dark;
      --bg: #0B0F17;
      --surface: #111722;
      --surface-2: #171F2E;
      --surface-3: #1E283A;
      --surface-hover: #243045;
      --chrome: rgba(11, 15, 23, 0.86);

      --border: rgba(248, 250, 252, 0.085);
      --border-subtle: rgba(248, 250, 252, 0.055);
      --border-strong: rgba(248, 250, 252, 0.18);
      --gridline: rgba(248, 250, 252, 0.075);

      --text: #F8FAFC;
      --text-2: #CBD5E1;
      --text-3: #94A3B8;

      --teal: #2DD4BF;
      --teal-btn: #0D9488;
      --teal-btn-hover: #0F766E;
      --teal-text: #5EEAD4;
      --teal-soft: rgba(45, 212, 191, 0.11);
      --teal-band: rgba(45, 212, 191, 0.10);
      --teal-border: rgba(45, 212, 191, 0.28);

      --coral: #FB7185;
      --coral-text: #FDA4AF;
      --coral-soft: rgba(251, 113, 133, 0.11);
      --coral-border: rgba(251, 113, 133, 0.28);

      --amber: #FBBF24;
      --amber-text: #FCD34D;
      --amber-soft: rgba(251, 191, 36, 0.11);
      --amber-border: rgba(251, 191, 36, 0.28);

      --info: #60A5FA;
      --info-text: #93C5FD;
      --info-soft: rgba(96, 165, 250, 0.11);
      --info-border: rgba(96, 165, 250, 0.26);
      --slate-viz: #94A3B8;
      --slate-viz-soft: rgba(148, 163, 184, 0.22);

      --sleep-bg: rgba(56, 114, 168, 0.28);
      --sleep-stripe: rgba(125, 185, 238, 0.16);
      --sleep-text: #BFDBFE;
      --trough-bg: #182131;
      --trough-wave: rgba(251, 191, 36, 0.34);
      --trough-text: #94A3B8;
      --alert-bg: #0D9488;
      --alert-text: #FFFFFF;
      --night-bg: rgba(251, 191, 36, 0.20);
      --night-text: #FDE68A;

      --track-bg: #202B3D;
      --zone-bg: rgba(45, 212, 191, 0.18);
      --zone-edge: rgba(45, 212, 191, 0.45);
      --caution-bg: rgba(251, 191, 36, 0.14);

      --hl-bg: rgba(250, 204, 21, 0.28);
      --hl-text: #FEF9C3;

      --err: #F87171;
      --shadow-fig: 0 1px 2px rgba(0, 0, 0, 0.35), 0 12px 32px -12px rgba(0, 0, 0, 0.55);
      --shadow-gate: 0 24px 56px -14px rgba(0, 0, 0, 0.65);
      --shadow-tip: 0 12px 30px -6px rgba(0, 0, 0, 0.65);
    }

    *, *::before, *::after { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html { -webkit-text-size-adjust: 100%; overflow-x: clip; scroll-behavior: smooth; }
    body {
      margin: 0;
      min-height: 100vh;
      overflow-x: clip;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
      font-size: 15px;
      line-height: 1.62;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      transition: background-color 220ms var(--ease), color 220ms var(--ease);
    }
    html[dir="rtl"] body {
      font-family: var(--font-ar);
      line-height: 1.74;
    }
    button, input { font: inherit; color: inherit; }
    button:focus-visible, input:focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }
    mark.hl {
      background: var(--hl-bg);
      color: var(--hl-text);
      border-radius: 3px;
      padding: 0 2px;
      font-weight: 600;
    }
    html[dir="rtl"] mark.hl { padding: 0; border-radius: 2px; }

    /* =========================================================================
       PIN GATE
       ========================================================================= */
    .gate-wrap {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px 16px;
      background: radial-gradient(circle at 50% 0%, var(--teal-soft) 0%, transparent 52%), var(--bg);
    }
    .gate-card {
      width: 100%;
      max-width: 386px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-top: 2.5px solid var(--teal);
      border-radius: var(--r-lg);
      box-shadow: var(--shadow-gate);
      padding: 34px 28px 28px;
      text-align: center;
      transition: background-color 220ms var(--ease), border-color 220ms var(--ease), box-shadow 220ms var(--ease);
    }
    .gate-card.shake { animation: shake 0.36s ease; }
    .gate-mark {
      width: 46px;
      height: 46px;
      margin: 0 auto 16px;
      border-radius: 12px;
      background: var(--teal-soft);
      border: 1px solid var(--teal-border);
      color: var(--teal-text);
      display: grid;
      place-items: center;
    }
    .gate-title { margin: 0 0 5px; font-family: var(--font-display); font-size: 1rem; font-weight: 700; color: var(--text); letter-spacing: -0.015em; }
    .gate-sub { margin: 0 0 22px; font-size: 0.8rem; color: var(--text-3); }
    .pin-wrap { position: relative; margin-bottom: 12px; }
    .pin-input {
      width: 100%;
      height: 44px;
      padding: 0 42px;
      border-radius: var(--r-sm);
      border: 1px solid var(--border-strong);
      background: var(--bg);
      font-family: var(--font-mono);
      font-size: 1.06rem;
      letter-spacing: 0.22em;
      text-align: center;
      outline: none;
      transition: border-color 180ms var(--ease), box-shadow 180ms var(--ease), background-color 220ms var(--ease);
    }
    .pin-input:focus { border-color: var(--teal); box-shadow: 0 0 0 3px var(--teal-soft); }
    .pin-eye {
      position: absolute;
      top: 50%;
      inset-inline-end: 7px;
      transform: translateY(-50%);
      width: 30px;
      height: 30px;
      border: 0;
      border-radius: 6px;
      background: transparent;
      color: var(--text-3);
      display: grid;
      place-items: center;
      cursor: pointer;
      transition: background-color 160ms var(--ease), color 160ms var(--ease);
    }
    .pin-eye:hover { background: var(--surface-2); color: var(--text); }
    .gate-btn {
      width: 100%;
      height: 43px;
      border: 0;
      border-radius: var(--r-sm);
      background: var(--teal-btn);
      color: #FFFFFF;
      font-size: 0.89rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 180ms var(--ease), opacity 180ms var(--ease), transform 140ms var(--ease);
    }
    .gate-btn:hover { background: var(--teal-btn-hover); }
    .gate-btn:active { transform: scale(0.99); }
    .gate-btn:disabled { opacity: 0.6; cursor: wait; }
    .gate-err { min-height: 1.25rem; margin-top: 10px; font-size: 0.79rem; font-weight: 600; color: var(--err); }
    @keyframes shake { 0%, 100% { transform: translateX(0); } 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }

    /* =========================================================================
       SLEEK 1-ROW STICKY GLASS HEADER (STRICTLY 1 ROW ON DESKTOP >= 1024px)
       ========================================================================= */
    .sticky-chrome {
      position: sticky;
      top: 0;
      z-index: 40;
      background: var(--chrome);
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(18px) saturate(160%);
      -webkit-backdrop-filter: blur(18px) saturate(160%);
      transition: background-color 220ms var(--ease), border-color 220ms var(--ease);
    }
    .chrome-inner {
      max-width: 1120px;
      margin: 0 auto;
      padding: 0 20px;
      min-height: 54px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .nav-links {
      display: flex;
      align-items: center;
      gap: 2px;
      min-width: 0;
      flex: 1 1 auto;
      overflow-x: auto;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }
    .nav-links::-webkit-scrollbar { display: none; }
    .nav-link {
      border: 1px solid transparent;
      background: transparent;
      color: var(--text-3);
      padding: 5px 9px;
      border-radius: 7px;
      font-size: 0.78rem;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
      flex-shrink: 0;
      transition: background-color 160ms var(--ease), color 160ms var(--ease), border-color 160ms var(--ease);
    }
    .nav-link:hover { background: var(--surface-2); color: var(--text); }
    .nav-link.is-active {
      background: var(--teal-soft);
      border-color: var(--teal-border);
      color: var(--teal-text);
    }

    .chrome-controls {
      display: flex;
      align-items: center;
      gap: 7px;
      flex-shrink: 0;
    }

    /* Compact Inline Live Search */
    .search-box {
      display: flex;
      align-items: center;
      width: 222px;
      flex: 0 1 222px;
      height: 31px;
      padding: 0 7px;
      gap: 5px;
      border-radius: 8px;
      background: var(--surface);
      border: 1px solid var(--border);
      transition: width 180ms var(--ease), border-color 160ms var(--ease), box-shadow 160ms var(--ease), background-color 220ms var(--ease);
    }
    .search-box:focus-within {
      border-color: var(--teal);
      box-shadow: 0 0 0 2.5px var(--teal-soft);
    }
    .search-ico { color: var(--text-3); display: inline-flex; flex-shrink: 0; }
    .search-input {
      border: 0;
      background: transparent;
      outline: none;
      width: 100%;
      min-width: 0;
      font-size: 0.77rem;
      color: var(--text);
      padding: 0;
    }
    .search-input:focus, .search-input:focus-visible { outline: none; box-shadow: none; }
    .search-input::placeholder { color: var(--text-3); }
    .search-input::-webkit-search-cancel-button { -webkit-appearance: none; appearance: none; }
    .search-kbd {
      font-family: var(--font-mono);
      font-size: 0.64rem;
      font-weight: 600;
      color: var(--text-3);
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 0.5px 4.5px;
      line-height: 1.3;
      flex-shrink: 0;
    }
    .search-count {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 700;
      color: var(--teal-text);
      background: var(--teal-soft);
      border: 1px solid var(--teal-border);
      border-radius: 999px;
      padding: 1px 6px;
      white-space: nowrap;
      flex-shrink: 0;
      font-variant-numeric: tabular-nums;
    }
    .search-count.is-zero {
      color: var(--amber-text);
      background: var(--amber-soft);
      border-color: var(--amber-border);
    }
    .search-clear {
      border: 0;
      background: transparent;
      color: var(--text-3);
      width: 20px;
      height: 20px;
      border-radius: 5px;
      display: inline-grid;
      place-items: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: background-color 140ms ease, color 140ms ease;
    }
    .search-clear:hover { background: var(--surface-2); color: var(--text); }

    /* Segmented Controls (Language + Density) */
    .seg-group { display: flex; align-items: center; gap: 6px; }
    .seg-ctrl {
      position: relative;
      display: inline-flex;
      align-items: center;
      padding: 2px;
      border-radius: 8px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      transition: background-color 220ms var(--ease), border-color 220ms var(--ease);
    }
    .seg-pill {
      position: absolute;
      top: 2px;
      bottom: 2px;
      left: 0;
      width: 0;
      border-radius: 6px;
      background: var(--teal-btn);
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.14);
      opacity: 0;
      pointer-events: none;
      will-change: transform, width;
      transition: transform 200ms var(--ease), width 200ms var(--ease), background-color 220ms var(--ease), opacity 140ms ease;
    }
    .seg-density .seg-pill {
      background: var(--surface);
      border: 1px solid var(--border-strong);
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.07);
    }
    .seg-btn {
      position: relative;
      z-index: 1;
      border: 0;
      background: transparent;
      color: var(--text-2);
      padding: 3.5px 8.5px;
      border-radius: 6px;
      font-size: 0.74rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      line-height: 1.35;
      transition: color 160ms var(--ease);
    }
    .seg-btn:hover { color: var(--text); }
    .seg-lang .seg-btn.is-active,
    .seg-lang .seg-btn.is-active:hover { color: #FFFFFF; }
    .seg-density .seg-btn.is-active,
    .seg-density .seg-btn.is-active:hover { color: var(--teal-text); }

    .util-btns { display: flex; align-items: center; gap: 4px; }
    .ico-btn {
      width: 31px;
      height: 31px;
      padding: 0;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-2);
      display: inline-grid;
      place-items: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: background-color 160ms var(--ease), border-color 160ms var(--ease), color 160ms var(--ease);
    }
    .ico-btn:hover { background: var(--surface-2); border-color: var(--border-strong); color: var(--text); }

    /* =========================================================================
       SINGLE CENTERED EDITORIAL COLUMN (MAX-WIDTH: 880px)
       ========================================================================= */
    .brief-main {
      max-width: 880px;
      margin: 0 auto;
      padding: 40px 28px 80px;
    }
    @keyframes briefFade {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .brief-main.is-swapping { animation: briefFade 220ms var(--ease) both; }

    @keyframes secPulse {
      0% { background-color: var(--teal-soft); }
      100% { background-color: transparent; }
    }
    .is-pulsed { animation: secPulse 950ms var(--ease); border-radius: var(--r-md); }

    /* Minimal Editorial Masthead */
    .masthead {
      padding-bottom: 24px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 36px;
    }
    .masthead-top {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px 18px;
      margin-bottom: 6px;
    }
    .doc-title {
      margin: 0;
      font-family: var(--font-display);
      font-size: 1.92rem;
      font-weight: 700;
      letter-spacing: -0.028em;
      line-height: 1.18;
      color: var(--text);
    }
    html[dir="rtl"] .doc-title { font-family: var(--font-ar); letter-spacing: 0; font-size: 1.84rem; }
    .doc-date {
      font-family: var(--font-mono);
      font-size: 0.76rem;
      font-weight: 600;
      color: var(--teal-text);
      letter-spacing: 0.01em;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }
    html[dir="rtl"] .doc-date { font-family: var(--font-ar); letter-spacing: 0; }
    .doc-sub {
      margin: 0 0 16px;
      font-size: 0.96rem;
      color: var(--text-3);
      font-weight: 400;
    }
    .profile-line {
      margin: 0;
      padding-top: 13px;
      border-top: 1px solid var(--border-subtle);
      font-size: 0.87rem;
      font-weight: 600;
      color: var(--text-2);
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.005em;
    }
    html[dir="rtl"] .profile-line { letter-spacing: 0; }

    /* Editorial Sections (01 -> 06) */
    .ed-section {
      padding-top: 48px;
      margin-top: 48px;
      border-top: 1px solid var(--border);
    }
    .ed-section.is-first {
      padding-top: 0;
      margin-top: 0;
      border-top: 0;
    }
    .sec-head {
      display: flex;
      align-items: baseline;
      gap: 12px;
      margin: 0 0 20px;
    }
    .sec-num {
      font-family: var(--font-mono);
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--teal);
      letter-spacing: 0.04em;
      font-variant-numeric: tabular-nums;
      flex-shrink: 0;
    }
    .sec-title {
      margin: 0;
      font-family: var(--font-display);
      font-size: 1.32rem;
      font-weight: 700;
      letter-spacing: -0.022em;
      line-height: 1.25;
      color: var(--text);
    }
    html[dir="rtl"] .sec-title { font-family: var(--font-ar); letter-spacing: 0; font-size: 1.3rem; }

    .kicker {
      margin: 0 0 10px;
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.075em;
      color: var(--text-3);
    }
    html[dir="rtl"] .kicker { text-transform: none; letter-spacing: 0; font-size: 0.79rem; }

    /* Lead Prose & Collapsible Detail (Brief vs Full) */
    .lead-prose {
      margin: 0 0 18px;
      font-size: 0.99rem;
      color: var(--text);
      line-height: 1.66;
    }
    html[dir="rtl"] .lead-prose { line-height: 1.78; }
    .sub-prose {
      margin: 0 0 22px;
      font-size: 0.91rem;
      color: var(--text-2);
      line-height: 1.64;
    }
    html[dir="rtl"] .sub-prose { line-height: 1.76; }

    .brief-root.is-brief .detail-text { display: none; }
    .brief-root.is-brief .expandable.is-open .detail-text,
    .brief-root.is-brief .expandable.is-search-open .detail-text { display: block; }

    .item-expand {
      border: 0;
      background: transparent;
      color: var(--teal-text);
      padding: 1px 6px;
      border-radius: 5px;
      font-size: 0.72rem;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 3px;
      cursor: pointer;
      flex-shrink: 0;
      transition: background-color 140ms ease;
    }
    .item-expand:hover { background: var(--teal-soft); }
    .item-expand svg { transition: transform 180ms var(--ease); }
    .expandable.is-open .item-expand svg { transform: rotate(180deg); }

    /* =========================================================================
       SECTION 01: PRIORITIES
       ========================================================================= */
    .chief-block {
      padding-inline-start: 18px;
      border-inline-start: 2.5px solid var(--teal);
      margin-bottom: 30px;
    }
    .chief-text {
      margin: 0;
      font-size: 1.04rem;
      font-weight: 500;
      color: var(--text);
      line-height: 1.66;
    }
    html[dir="rtl"] .chief-text { line-height: 1.78; }

    .goals-block { margin-bottom: 30px; }
    .goals-list {
      list-style: none;
      margin: 0;
      padding: 0;
      border-top: 1px solid var(--border);
    }
    .goal-row {
      display: grid;
      grid-template-columns: 28px minmax(0, 1fr);
      gap: 12px;
      padding: 14px 0;
      border-bottom: 1px solid var(--border);
      align-items: start;
    }
    .goal-idx {
      font-family: var(--font-mono);
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--teal);
      padding-top: 2px;
      font-variant-numeric: tabular-nums;
    }
    .goal-body { min-width: 0; }
    .goal-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 3px;
    }
    .goal-title { font-size: 0.95rem; font-weight: 700; color: var(--text); line-height: 1.38; }
    .goal-brief { margin: 0; font-size: 0.9rem; color: var(--text-2); line-height: 1.56; }
    .goal-detail { margin: 5px 0 0; font-size: 0.85rem; color: var(--text-3); line-height: 1.54; }

    .synth-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 20px;
      padding-top: 14px;
      border-top: 1px solid var(--border);
    }
    .synth-col { min-width: 0; }
    .synth-lead {
      margin: 0 0 5px;
      font-size: 0.87rem;
      font-weight: 700;
      color: var(--text);
      line-height: 1.36;
    }
    .synth-text {
      margin: 0;
      font-size: 0.83rem;
      color: var(--text-2);
      line-height: 1.54;
    }

    /* =========================================================================
       SECTION 02: COGNITION + BENCHMARK CHIPS + 3 INTERACTIVE FIGURES
       ========================================================================= */
    .bench-wrap { margin: 0 0 26px; }
    .bench-strip {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
    }
    .bench-chip {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 5px 11px;
      border-radius: 999px;
      background: var(--surface);
      border: 1px solid var(--border);
      font-size: 0.8rem;
      line-height: 1.3;
    }
    .bench-chip.tone-intact { border-color: var(--teal-border); background: var(--teal-soft); }
    .bench-chip.tone-load { border-color: var(--amber-border); background: var(--amber-soft); }
    .bench-chip.tone-deficit { border-color: var(--coral-border); background: var(--coral-soft); }
    .bench-lbl { color: var(--text-2); font-weight: 500; }
    .bench-val {
      font-family: var(--font-mono);
      font-weight: 700;
      font-size: 0.78rem;
      font-variant-numeric: tabular-nums;
      color: var(--teal-text);
    }
    .tone-load .bench-val { color: var(--amber-text); }
    .tone-deficit .bench-val { color: var(--coral-text); }
    html[dir="rtl"] .tone-deficit .bench-val { font-family: var(--font-ar); }

    /* Pure Editorial Figure Container (No Card-in-Card Nesting) */
    .figure-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r-lg);
      box-shadow: var(--shadow-fig);
      padding: 20px 22px 18px;
      margin: 22px 0;
      transition: background-color 220ms var(--ease), border-color 220ms var(--ease);
    }
    .figure-card:last-child { margin-bottom: 0; }
    .fig-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 6px 16px;
      margin-bottom: 4px;
    }
    .fig-title {
      margin: 0;
      font-size: 0.94rem;
      font-weight: 700;
      color: var(--text);
      line-height: 1.35;
    }
    .fig-sub {
      margin: 0 0 16px;
      font-size: 0.81rem;
      color: var(--text-3);
      line-height: 1.48;
    }
    .fig-legend {
      display: inline-flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px 14px;
      font-size: 0.75rem;
      color: var(--text-2);
      font-weight: 500;
    }
    .leg-item { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
    .leg-dot { width: 8px; height: 8px; border-radius: 999px; flex-shrink: 0; }
    .leg-dot.is-teal { background: var(--teal); }
    .leg-dot.is-slate-ring { background: var(--surface); border: 2px solid var(--slate-viz); }
    .leg-dot.is-amber { background: var(--amber); }
    .leg-dot.is-coral { background: var(--coral); }
    .leg-dot.is-slate { background: var(--slate-viz); }
    .leg-line { width: 16px; height: 0; border-top: 2.5px solid var(--teal); border-radius: 2px; flex-shrink: 0; }
    .leg-line.is-dashed { border-top-style: dashed; border-top-color: var(--coral); }

    .viz-svg {
      display: block;
      width: 100%;
      height: auto;
      direction: ltr;
      unicode-bidi: isolate;
      overflow: visible;
    }
    .svg-hit { cursor: pointer; outline: none; }
    .svg-hit:focus-visible { outline: none; }
    .pvt-col-hit { fill: transparent; cursor: pointer; }
    .pvt-col-group .pvt-crosshair { opacity: 0; transition: opacity 120ms ease; pointer-events: none; }
    .pvt-col-group:hover .pvt-crosshair,
    .pvt-col-group:focus-within .pvt-crosshair { opacity: 1; }
    .pvt-col-group:hover .pvt-pt-ring,
    .pvt-col-group:focus-within .pvt-pt-ring { r: 6.5; }

    /* Viz 1A: Sibling Lollipop / Dumbbell Comparison */
    .lollipop-axis-row {
      display: grid;
      grid-template-columns: minmax(0, 1.08fr) minmax(0, 1fr);
      gap: 16px;
      align-items: end;
      margin-bottom: 4px;
    }
    .lollipop-list { display: flex; flex-direction: column; }
    .lollipop-row {
      display: grid;
      grid-template-columns: minmax(0, 1.08fr) minmax(0, 1fr);
      gap: 16px;
      align-items: center;
      padding: 10px 0;
      border-top: 1px solid var(--border-subtle);
    }
    .lollipop-meta { min-width: 0; }
    .lollipop-name {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text);
      line-height: 1.32;
      margin-bottom: 2px;
    }
    .lollipop-vals {
      font-size: 0.75rem;
      color: var(--text-3);
      line-height: 1.42;
      font-variant-numeric: tabular-nums;
    }
    .lv-p { color: var(--teal-text); font-weight: 600; }
    .lv-p.is-tie { color: var(--coral-text); }
    .lv-sep { margin: 0 5px; opacity: 0.55; }
    .lollipop-track-wrap { min-width: 0; }

    .fig-footnotes {
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px solid var(--border-subtle);
      display: flex;
      flex-direction: column;
      gap: 5px;
      font-size: 0.77rem;
      color: var(--text-3);
      line-height: 1.5;
    }
    .fig-footnotes p { margin: 0; }
    .fig-footnotes .fn-contrast { color: var(--text-2); }

    /* Viz 1B: Error-Anatomy Stacked Bar */
    .anat-list { display: flex; flex-direction: column; gap: 14px; }
    .anat-row { min-width: 0; }
    .anat-top {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 4px 12px;
      margin-bottom: 6px;
    }
    .anat-lbl { font-size: 0.85rem; font-weight: 700; color: var(--text); }
    .anat-callout { font-size: 0.76rem; color: var(--text-2); font-variant-numeric: tabular-nums; }
    .anat-row.is-patient .anat-callout { color: var(--coral-text); font-weight: 600; }

    /* Viz 2: Dual-State Vigilance Spline Area Chart */
    .pvt-svg-box { width: 100%; overflow: hidden; }
    .pvt-legend-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px 20px;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid var(--border-subtle);
    }
    .pvt-leg-card { display: flex; align-items: flex-start; gap: 9px; min-width: 0; }
    .pvt-leg-swatch { margin-top: 7px; }
    .pvt-leg-body { min-width: 0; }
    .pvt-leg-lbl { font-size: 0.8rem; font-weight: 700; color: var(--text); line-height: 1.3; }
    .pvt-leg-sum { font-size: 0.74rem; color: var(--text-3); line-height: 1.42; font-variant-numeric: tabular-nums; }
    .pvt-conclusion {
      margin: 12px 0 0;
      padding: 8px 12px;
      border-inline-start: 2.5px solid var(--teal);
      background: var(--teal-soft);
      border-radius: 0 var(--r-xs) var(--r-xs) 0;
      font-size: 0.82rem;
      font-weight: 500;
      color: var(--text);
      line-height: 1.48;
    }
    html[dir="rtl"] .pvt-conclusion { border-radius: var(--r-xs) 0 0 var(--r-xs); }

    /* =========================================================================
       SHARED PROSE ITEMS (SECTIONS 03 & 04)
       ========================================================================= */
    .prose-list {
      list-style: none;
      margin: 0;
      padding: 0;
      border-top: 1px solid var(--border);
    }
    .prose-item {
      padding: 15px 0;
      border-bottom: 1px solid var(--border);
    }
    .prose-item-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 4px;
    }
    .prose-lead { font-size: 0.94rem; font-weight: 700; color: var(--text); line-height: 1.36; }
    .prose-brief { margin: 0; font-size: 0.9rem; color: var(--text-2); line-height: 1.58; }
    .prose-detail { margin: 6px 0 0; font-size: 0.85rem; color: var(--text-3); line-height: 1.58; }

    /* =========================================================================
       VIZ 3: 24-HOUR SLEEP & FRAGMENTATION RIBBON + VIZ 4: 4-MILESTONE TIMELINE
       ========================================================================= */
    .arousal-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.74rem;
      font-weight: 600;
      color: var(--amber-text);
      background: var(--amber-soft);
      border: 1px solid var(--amber-border);
      padding: 2px 9px;
      border-radius: 999px;
    }
    .arousal-diamond {
      width: 7px;
      height: 7px;
      background: var(--amber);
      transform: rotate(45deg);
      border-radius: 1px;
      flex-shrink: 0;
    }
    .ribbon-legend {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px 14px;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid var(--border-subtle);
    }
    .rib-leg-item { display: flex; align-items: flex-start; gap: 7px; min-width: 0; }
    .rib-sw {
      width: 10px;
      height: 10px;
      border-radius: 3px;
      margin-top: 4px;
      flex-shrink: 0;
      border: 1px solid var(--border-strong);
    }
    .rib-sw.kind-sleep { background: var(--sleep-bg); }
    .rib-sw.kind-trough { background: var(--trough-bg); }
    .rib-sw.kind-alert { background: var(--alert-bg); border-color: transparent; }
    .rib-sw.kind-hyperfocus { background: var(--night-bg); }
    .rib-leg-lbl { display: block; font-size: 0.77rem; font-weight: 700; color: var(--text); line-height: 1.3; }
    .rib-leg-det { display: block; font-size: 0.72rem; color: var(--text-3); line-height: 1.38; margin-top: 1px; }

    /* Viz 4: Minimal 4-Milestone Lifespan Hairline Timeline */
    .life-wrap { margin-top: 28px; }
    .life-rail {
      position: relative;
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 18px;
      list-style: none;
      margin: 0;
      padding: 4px 0 0;
    }
    .life-node {
      position: relative;
      z-index: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 5px;
    }
    .life-age {
      font-family: var(--font-mono);
      font-size: 0.71rem;
      font-weight: 600;
      color: var(--text-3);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }
    html[dir="rtl"] .life-age { font-family: var(--font-ar); }
    .life-node.is-current .life-age { color: var(--teal-text); font-weight: 700; }
    .life-dot-wrap {
      position: relative;
      width: 100%;
      height: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .life-dot-wrap::before {
      content: "";
      position: absolute;
      top: 50%;
      inset-inline-start: -9px;
      inset-inline-end: -9px;
      height: 1px;
      background: var(--border-strong);
      z-index: 0;
    }
    .life-node:first-child .life-dot-wrap::before { inset-inline-start: 50%; }
    .life-node:last-child .life-dot-wrap::before { inset-inline-end: 50%; }
    .life-rail.is-filtered .life-dot-wrap::before { display: none; }
    .life-dot {
      position: relative;
      z-index: 1;
      width: 10px;
      height: 10px;
      border-radius: 999px;
      background: var(--bg);
      border: 2px solid var(--teal);
      box-shadow: 0 0 0 3px var(--bg);
      flex-shrink: 0;
    }
    .life-node.is-current .life-dot {
      background: var(--teal);
      box-shadow: 0 0 0 3px var(--bg), 0 0 0 6px var(--teal-soft);
    }
    .life-stage { font-size: 0.84rem; font-weight: 700; color: var(--text); line-height: 1.25; }
    .life-note { font-size: 0.76rem; color: var(--text-3); line-height: 1.42; }

    /* =========================================================================
       SECTION 05: SAFETY BASELINE + ACCESS NOTE + SIGNAL-FIRST LABS
       ========================================================================= */
    .safety-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 14px;
    }
    .safety-card {
      min-width: 0;
      background: var(--surface);
      border: 1px solid var(--border);
      border-inline-start: 3px solid var(--teal);
      border-radius: var(--r-md);
      padding: 13px 15px;
      transition: background-color 200ms var(--ease), border-color 200ms var(--ease);
    }
    .safety-card.sev-warn { border-inline-start-color: var(--amber); }
    .safety-card.sev-info { border-inline-start-color: var(--info); }
    .safety-card.sev-ok { border-inline-start-color: var(--teal); }
    .safety-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 5px;
    }
    .safety-lead { font-size: 0.88rem; font-weight: 700; color: var(--text); line-height: 1.3; }
    .safety-right { display: inline-flex; align-items: center; gap: 5px; flex-shrink: 0; }
    .sev-badge {
      font-size: 0.67rem;
      font-weight: 700;
      padding: 1.5px 8px;
      border-radius: 999px;
      white-space: nowrap;
      line-height: 1.35;
    }
    .sev-badge.sev-warn { background: var(--amber-soft); color: var(--amber-text); border: 1px solid var(--amber-border); }
    .sev-badge.sev-info { background: var(--info-soft); color: var(--info-text); border: 1px solid var(--info-border); }
    .sev-badge.sev-ok { background: var(--teal-soft); color: var(--teal-text); border: 1px solid var(--teal-border); }
    .safety-brief { margin: 0; font-size: 0.83rem; color: var(--text-2); line-height: 1.5; }
    .safety-detail { margin: 5px 0 0; font-size: 0.78rem; color: var(--text-3); line-height: 1.48; }

    .access-note {
      margin: 0 0 24px;
      padding: 9px 14px;
      border-radius: var(--r-sm);
      background: var(--surface-2);
      border: 1px solid var(--border);
      font-size: 0.82rem;
      color: var(--text-2);
      display: flex;
      align-items: center;
      gap: 9px;
      line-height: 1.45;
    }
    .access-note svg { color: var(--teal-text); flex-shrink: 0; }

    /* Viz 5: Signal-First Lab Visualization */
    .labs-head-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px 14px;
      margin-bottom: 10px;
    }
    .labs-filter {
      display: inline-flex;
      align-items: center;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 2px;
      gap: 2px;
    }
    .labs-fbtn {
      border: 0;
      background: transparent;
      color: var(--text-3);
      font-size: 0.72rem;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 999px;
      cursor: pointer;
      white-space: nowrap;
      transition: background-color 150ms ease, color 150ms ease;
    }
    .labs-fbtn:hover { color: var(--text); }
    .labs-fbtn.is-active { background: var(--teal-btn); color: #FFFFFF; }

    .labs-legend {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px 14px;
      margin-bottom: 14px;
      font-size: 0.73rem;
      color: var(--text-3);
    }
    .lab-leg-zone {
      width: 15px;
      height: 6px;
      border-radius: 999px;
      background: var(--zone-bg);
      border: 1px solid var(--zone-edge);
      display: inline-block;
    }
    .lab-leg-shift { display: inline-flex; align-items: center; gap: 2px; }
    .lab-leg-prev { width: 6px; height: 6px; border-radius: 999px; background: var(--surface); border: 1.6px solid var(--amber); }
    .lab-leg-bar { width: 11px; height: 2px; background: linear-gradient(90deg, var(--amber), var(--teal)); border-radius: 2px; }
    html[dir="rtl"] .lab-leg-bar { background: linear-gradient(270deg, var(--amber), var(--teal)); }
    .lab-leg-curr { width: 6px; height: 6px; border-radius: 999px; background: var(--teal); }
    .lab-leg-warn { width: 7px; height: 7px; border-radius: 999px; background: var(--amber); }

    /* Spotlight Precision Linear Gauge */
    .lab-spotlight {
      background: var(--amber-soft);
      border: 1px solid var(--amber-border);
      border-radius: var(--r-md);
      padding: 13px 16px 12px;
      margin-bottom: 16px;
    }
    .spot-top {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 6px 12px;
      margin-bottom: 6px;
    }
    .spot-left { display: inline-flex; align-items: center; flex-wrap: wrap; gap: 8px; }
    .spot-lbl { font-size: 0.9rem; font-weight: 700; color: var(--text); }
    .spot-date { font-family: var(--font-mono); font-size: 0.72rem; color: var(--text-3); font-variant-numeric: tabular-nums; }
    .spot-badge {
      font-size: 0.67rem;
      font-weight: 700;
      padding: 1.5px 8px;
      border-radius: 999px;
      background: var(--surface);
      color: var(--amber-text);
      border: 1px solid var(--amber-border);
    }
    .spot-val {
      font-family: var(--font-mono);
      font-size: 1.02rem;
      font-weight: 700;
      color: var(--amber-text);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }
    .spot-val .lab-unit { font-size: 0.74rem; font-weight: 500; color: var(--text-3); margin-inline-start: 3px; }
    .spot-note { margin: 5px 0 0; font-size: 0.76rem; font-weight: 600; color: var(--amber-text); }

    /* Repleted Deficiencies + Compact Normal Clearance */
    .lab-subblock { margin-top: 14px; }
    .lab-subblock.is-filter-hidden { display: none; }
    .lab-subhead {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 4px 10px;
      margin-bottom: 8px;
    }
    .lab-subtitle {
      font-size: 0.71rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-3);
    }
    html[dir="rtl"] .lab-subtitle { text-transform: none; letter-spacing: 0; font-size: 0.77rem; }
    .lab-subnote { font-size: 0.73rem; color: var(--text-3); }

    .repleted-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }
    .rep-item {
      min-width: 0;
      padding: 10px 12px;
      border-radius: var(--r-sm);
      background: var(--bg);
      border: 1px solid var(--border);
    }
    .rep-top { display: flex; align-items: baseline; justify-content: space-between; gap: 6px; margin-bottom: 2px; }
    .rep-lbl { font-size: 0.8rem; font-weight: 700; color: var(--text); }
    .rep-date { font-family: var(--font-mono); font-size: 0.65rem; color: var(--text-3); white-space: nowrap; }
    .rep-val {
      font-family: var(--font-mono);
      font-size: 0.77rem;
      font-weight: 700;
      color: var(--teal-text);
      font-variant-numeric: tabular-nums;
      margin-bottom: 6px;
    }
    .rep-prev { font-weight: 500; color: var(--amber-text); }
    .rep-arr { margin: 0 3px; color: var(--text-3); font-weight: 400; }
    .rep-unit { font-size: 0.67rem; font-weight: 500; color: var(--text-3); margin-inline-start: 2px; }

      function normChar(ch) {
        if (/[\u064B-\u065F\u0670\u0640]/.test(ch)) return "";
        if (/[\u0622\u0623\u0625\u0671]/.test(ch)) return "\u0627";
        if (ch === "\u0629") return "\u0647";
        if (ch === "\u0649") return "\u064A";
        return ch.normalize("NFD").replace(/[\u0300-\u036F]/g, "").toLowerCase();
      }

      function normText(str) {
        const raw = String(str ?? "");
        let out = "";
        for (let i = 0; i < raw.length; i++) out += normChar(raw[i]);
        return out;
      }

      function findMatchRanges(raw, qNorm) {
        if (!qNorm) return [];
        const chars = [], starts = [], ends = [];
        for (let i = 0; i < raw.length; i++) {
          const nc = normChar(raw[i]);
          for (let j = 0; j < nc.length; j++) {
            chars.push(nc[j]);
            starts.push(i);
            ends.push(i + 1);
          }
        }
        const hay = chars.join("");
        const ranges = [];
        let pos = 0;
        while (pos <= hay.length - qNorm.length) {
          const idx = hay.indexOf(qNorm, pos);
          if (idx === -1) break;
          let rEnd = ends[idx + qNorm.length - 1];
          while (rEnd < raw.length && normChar(raw[rEnd]) === "" && /[\u0300-\u036F\u064B-\u065F\u0670]/.test(raw[rEnd])) rEnd++;
          ranges.push([starts[idx], rEnd]);
          pos = idx + qNorm.length;
        }
        return ranges;
      }

      function renderSliceWithHighlights(raw, sliceStart, sliceEnd, ranges) {
        if (!ranges.length) return esc(raw.slice(sliceStart, sliceEnd));
        let out = "", cur = sliceStart;
        for (let i = 0; i < ranges.length; i++) {
          const rs = Math.max(sliceStart, ranges[i][0]);
          const re = Math.min(sliceEnd, ranges[i][1]);
          if (re <= rs) continue;
          if (rs > cur) out += esc(raw.slice(cur, rs));
          out += '<mark class="hl">' + esc(raw.slice(rs, re)) + "</mark>";
          cur = re;
        }
        if (cur < sliceEnd) out += esc(raw.slice(cur, sliceEnd));
        return out;
      }

      function fmt(s, isRtl, qNorm) {
        const raw = String(s ?? "");
        const ranges = qNorm ? findMatchRanges(raw, qNorm) : [];
        if (!isRtl) return renderSliceWithHighlights(raw, 0, raw.length, ranges);
        LTR_RE.lastIndex = 0;
        let out = "", last = 0, m;
        while ((m = LTR_RE.exec(raw)) !== null) {
          if (m.index > last) out += renderSliceWithHighlights(raw, last, m.index, ranges);
          const full = m[0];
          const core = full.replace(/(?:\s+[+\-–—·=→/]+|[.,:;–—\-·=→/\s]+)+$/, "");
          const coreEnd = m.index + core.length;
          const fullEnd = m.index + full.length;
          if (core) {
            out += '<bdi dir="ltr">' + renderSliceWithHighlights(raw, m.index, coreEnd, ranges) + "</bdi>";
            if (fullEnd > coreEnd) out += renderSliceWithHighlights(raw, coreEnd, fullEnd, ranges);
          } else {
            out += renderSliceWithHighlights(raw, m.index, fullEnd, ranges);
          }
          last = fullEnd;
        }
        if (last < raw.length) out += renderSliceWithHighlights(raw, last, raw.length, ranges);
        return out;
      }

      function b64ToBytes(b64) {
        const bin = atob(b64);
        const arr = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
        return arr;
      }

      async function unlock(rawPin) {
        const clean = String(rawPin || "").replace(/\s+/g, "");
        const keyMat = await crypto.subtle.importKey("raw", new TextEncoder().encode(clean), { name: "PBKDF2" }, false, ["deriveKey"]);
        const aesKey = await crypto.subtle.deriveKey(
          { name: "PBKDF2", salt: b64ToBytes(BUNDLE.salt), iterations: BUNDLE.iter, hash: "SHA-256" },
          keyMat, { name: "AES-GCM", length: 256 }, false, ["decrypt"]
        );
        const buf = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64ToBytes(BUNDLE.iv) }, aesKey, b64ToBytes(BUNDLE.ct));
        return JSON.parse(new TextDecoder().decode(buf));
      }

      function syncPill(pill, activeBtn, instant) {
        if (!pill || !activeBtn) return;
        const parent = pill.parentElement;
        if (!parent) return;
        const pr = parent.getBoundingClientRect();
        const br = activeBtn.getBoundingClientRect();
        if (!br.width) return;
        const bl = parseFloat(getComputedStyle(parent).borderLeftWidth) || 0;
        const x = br.left - pr.left - bl;
        if (instant) pill.style.transition = "none";
        pill.style.width = br.width.toFixed(2) + "px";
        pill.style.transform = "translate3d(" + x.toFixed(2) + "px, 0, 0)";
        pill.style.opacity = "1";
        if (instant) {
          void pill.offsetWidth;
          pill.style.transition = "";
        }
      }

        if (!data || appShell.hidden || Date.now() < spyLockUntil) return;
        const offset = getStickyOffset() + 36;
        let bestId = NAV_ORDER[0];

        for (let i = 0; i < NAV_ORDER.length; i++) {
          const id = NAV_ORDER[i];

          if (!el) continue;
          const top = el.getBoundingClientRect().top;
          if (top <= offset && top > bestTop) {

      function showTooltip(title, body, clientX, clientY) {
        if (!title && !body) return;
        vizTooltip.innerHTML =
          (title ? '<div class="viz-tip-title">' + esc(title) + "</div>" : "")
          + (body ? '<div class="viz-tip-body">' + esc(body) + "</div>" : "");

        const pad = 12;
