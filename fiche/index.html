<!DOCTYPE html>
<html lang="fr" dir="ltr" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet" />
  <meta name="referrer" content="no-referrer" />
  <meta name="theme-color" content="#f1f4f7" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230b6b6b'/%3E%3Cpath d='M16 8v16M8 16h16' stroke='%23ffffff' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E" />
  <title>Fiche Clinique · ملف طبي · Clinical Sheet</title>
  <style>
    :root {
      color-scheme: light;
      --font-ltr: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      --font-ar: "SF Arabic", "Geeza Pro", "Segoe UI", Tahoma, "Noto Sans Arabic", system-ui, -apple-system, sans-serif;
      --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
      --ease-out: cubic-bezier(0.22, 1, 0.36, 1);

      /* Swiss-Editorial Clinical Paper Palette */
      --bg: #f1f4f7;
      --surface: #ffffff;
      --surface-2: #f7f9fb;
      --surface-3: #eef3f7;
      --surface-hover: #e9eff5;
      --topbar: rgba(255, 255, 255, 0.92);
      --findbar: rgba(247, 249, 251, 0.94);

      --border: #dde5ee;
      --border-subtle: #eaf0f6;
      --border-strong: #c2d0de;
      --rail: #cbd7e3;

      --text: #0f172a;
      --text-2: #334155;
      --text-3: #5b6b82;

      /* Surgical Teal */
      --accent: #0b6b6b;
      --accent-btn: #0c6e6e;
      --accent-btn-hover: #095656;
      --accent-soft: #edf7f6;
      --accent-border: #b3ded9;
      --accent-text: #095a5a;

      /* Calm Clinical Caution (Warm Amber) */
      --warn-bg: #fdf9f1;
      --warn-border: #e6d3b1;
      --warn-bar: #b4741f;
      --warn-title: #7a4b10;
      --warn-text: #865211;
      --warn-badge-bg: #f8e8cb;
      --warn-item-bg: rgba(255, 255, 255, 0.84);
      --warn-item-border: #ece0cb;

      /* Clinical Info (Steel Blue) */
      --info-bg: #f3f7fc;
      --info-border: #ccdced;
      --info-bar: #25638d;
      --info-text: #1c4e72;
      --info-badge-bg: #e3eff9;

      /* Selective Deficit Accent (Muted Clinical Terracotta) */
      --deficit: #b84a39;
      --deficit-soft: #fdf2f0;
      --deficit-border: #ebcbc5;

      /* Lab Range Visualization Tokens */
      --lab-track: #e3ebf3;
      --lab-zone: rgba(11, 107, 107, 0.16);
      --lab-zone-edge: rgba(11, 107, 107, 0.38);
      --lab-prev: #c47e20;
      --lab-warn: #b4741f;

      /* Circadian Blocks */
      --circ-sleep-bg: #dce6f2;
      --circ-sleep-stripe: rgba(37, 99, 141, 0.14);
      --circ-sleep-border: #9cb6d1;
      --circ-sleep-text: #1c4466;
      --circ-sleep-lbl-bg: rgba(255, 255, 255, 0.8);
      --circ-arousal: #b45309;
      --circ-work-bg: #0c6e6e;
      --circ-work-text: #ffffff;
      --circ-free-bg: #eef2f6;
      --circ-free-border: #cfd9e4;
      --circ-free-text: #475569;
      --circ-night-bg: #f6e1c3;
      --circ-night-border: #d9a760;
      --circ-night-text: #7a4b10;

      /* Search Highlight */
      --hl-bg: #fef08a;
      --hl-text: #0f172a;

      --err: #b91c1c;
      --shadow-sheet: 0 1px 2px rgba(15, 23, 42, 0.04), 0 14px 36px -14px rgba(15, 23, 42, 0.09);
      --shadow-gate: 0 18px 46px -14px rgba(15, 23, 42, 0.13), 0 2px 6px rgba(15, 23, 42, 0.04);
      --r-lg: 14px;
      --r-md: 10px;
      --r-sm: 7px;
      --r-xs: 5px;
    }

    html[data-theme="dark"] {
      color-scheme: dark;
      --bg: #0a1017;
      --surface: #101823;
      --surface-2: #15202e;
      --surface-3: #1b2839;
      --surface-hover: #213146;
      --topbar: rgba(10, 16, 23, 0.9);
      --findbar: rgba(16, 24, 35, 0.92);

      --border: #223146;
      --border-subtle: #1a2637;
      --border-strong: #344865;
      --rail: #2b3d56;

      --text: #f1f5f9;
      --text-2: #cbd5e1;
      --text-3: #94a6be;

      --accent: #2dd4bf;
      --accent-btn: #0d9488;
      --accent-btn-hover: #0f766e;
      --accent-soft: rgba(45, 212, 191, 0.11);
      --accent-border: rgba(45, 212, 191, 0.28);
      --accent-text: #5eead4;

      --warn-bg: rgba(180, 116, 31, 0.11);
      --warn-border: rgba(217, 158, 72, 0.28);
      --warn-bar: #dfa047;
      --warn-title: #f5d190;
      --warn-text: #eebc6e;
      --warn-badge-bg: rgba(217, 158, 72, 0.18);
      --warn-item-bg: rgba(16, 24, 35, 0.62);
      --warn-item-border: rgba(217, 158, 72, 0.22);

      --info-bg: rgba(56, 139, 199, 0.12);
      --info-border: rgba(96, 165, 220, 0.28);
      --info-bar: #5ea8de;
      --info-text: #8ec7f2;
      --info-badge-bg: rgba(94, 168, 222, 0.18);

      --deficit: #e67c6a;
      --deficit-soft: rgba(230, 124, 106, 0.12);
      --deficit-border: rgba(230, 124, 106, 0.3);

      --lab-track: #1f2e42;
      --lab-zone: rgba(45, 212, 191, 0.18);
      --lab-zone-edge: rgba(45, 212, 191, 0.44);
      --lab-prev: #e8a74c;
      --lab-warn: #f0b356;

      --circ-sleep-bg: rgba(56, 114, 168, 0.28);
      --circ-sleep-stripe: rgba(125, 185, 238, 0.16);
      --circ-sleep-border: rgba(114, 173, 226, 0.42);
      --circ-sleep-text: #b7daf8;
      --circ-sleep-lbl-bg: rgba(16, 24, 35, 0.78);
      --circ-arousal: #f5b95b;
      --circ-work-bg: #0d9488;
      --circ-work-text: #ffffff;
      --circ-free-bg: #182434;
      --circ-free-border: #2a3c54;
      --circ-free-text: #9fb1c8;
      --circ-night-bg: rgba(217, 158, 72, 0.24);
      --circ-night-border: rgba(232, 174, 88, 0.44);
      --circ-night-text: #f5d190;

      --hl-bg: rgba(250, 204, 21, 0.28);
      --hl-text: #fef9c3;

      --err: #f87171;
      --shadow-sheet: 0 1px 2px rgba(0, 0, 0, 0.35), 0 18px 44px -12px rgba(0, 0, 0, 0.55);
      --shadow-gate: 0 22px 52px -12px rgba(0, 0, 0, 0.6);
    }

    *, *::before, *::after { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html { -webkit-text-size-adjust: 100%; overflow-x: clip; scroll-behavior: smooth; }
    body {
      margin: 0;
      min-height: 100vh;
      overflow-x: clip;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-ltr);
      font-size: 14.5px;
      line-height: 1.52;
      -webkit-font-smoothing: antialiased;
      transition: background-color 220ms var(--ease-out), color 220ms var(--ease-out);
    }
    html[dir="rtl"] body { font-family: var(--font-ar); line-height: 1.66; }
    button, input { font: inherit; color: inherit; }
    button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    mark.hl {
      background: var(--hl-bg);
      color: var(--hl-text);
      border-radius: 3px;
      padding: 0 2px;
      font-weight: 600;
    }
    html[dir="rtl"] mark.hl {
      padding: 0;
      border-radius: 2px;
    }

    /* =========================================================================
       PIN GATE
       ========================================================================= */
    .gate-wrap {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px 16px;
      background: radial-gradient(circle at 50% 0%, var(--accent-soft) 0%, transparent 55%), var(--bg);
    }
    .gate-card {
      width: 100%;
      max-width: 394px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-top: 3px solid var(--accent);
      border-radius: var(--r-lg);
      box-shadow: var(--shadow-gate);
      padding: 32px 26px 26px;
      text-align: center;
      transition: background-color 220ms var(--ease-out), border-color 220ms var(--ease-out), box-shadow 220ms var(--ease-out);
    }
    .gate-card.shake { animation: shake 0.36s ease; }
    .gate-mark {
      width: 48px;
      height: 48px;
      margin: 0 auto 15px;
      border-radius: 12px;
      background: var(--accent-soft);
      border: 1px solid var(--accent-border);
      color: var(--accent-text);
      display: grid;
      place-items: center;
    }
    .gate-title { margin: 0 0 5px; font-size: 1.02rem; font-weight: 700; color: var(--text); letter-spacing: -0.015em; }
    .gate-sub { margin: 0 0 20px; font-size: 0.8rem; color: var(--text-3); letter-spacing: 0.01em; }
    .pin-wrap { position: relative; margin-bottom: 12px; }
    .pin-input {
      width: 100%;
      height: 45px;
      padding: 0 42px;
      border-radius: var(--r-sm);
      border: 1px solid var(--border-strong);
      background: var(--surface-2);
      font-family: var(--font-mono);
      font-size: 1.08rem;
      letter-spacing: 0.22em;
      text-align: center;
      outline: none;
      transition: border-color 180ms var(--ease-out), box-shadow 180ms var(--ease-out), background-color 220ms var(--ease-out);
    }
    .pin-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
    .pin-eye {
      position: absolute;
      top: 50%;
      inset-inline-end: 8px;
      transform: translateY(-50%);
      width: 30px;
      height: 30px;
      border: 0;
      border-radius: 6px;
      background: transparent;
      color: var(--text-3);
      display: grid;
      place-items: center;
      cursor: pointer;
      transition: background-color 180ms var(--ease-out), color 180ms var(--ease-out);
    }
    .pin-eye:hover { background: var(--surface-hover); color: var(--text); }
    .gate-btn {
      width: 100%;
      height: 43px;
      border: 0;
      border-radius: var(--r-sm);
      background: var(--accent-btn);
      color: #ffffff;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 180ms var(--ease-out), opacity 180ms var(--ease-out), transform 140ms var(--ease-out);
    }
    .gate-btn:hover { background: var(--accent-btn-hover); }
    .gate-btn:active { transform: scale(0.99); }
    .gate-btn:disabled { opacity: 0.6; cursor: wait; }
    .gate-err { min-height: 1.25rem; margin-top: 10px; font-size: 0.8rem; font-weight: 600; color: var(--err); }
    @keyframes shake { 0%, 100% { transform: translateX(0); } 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }

    /* =========================================================================
       STICKY GLASSMORPHIC TOPBAR + DOCTOR INSTANT-FINDABILITY RAIL
       ========================================================================= */
    .sticky-chrome {
      position: sticky;
      top: 0;
      z-index: 40;
    }
    .topbar {
      background: var(--topbar);
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      transition: background-color 220ms var(--ease-out), border-color 220ms var(--ease-out);
    }
    .topbar-inner {
      max-width: 1120px;
      margin: 0 auto;
      padding: 8px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .tb-brand { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1 1 auto; }
    .tb-mark {
      width: 29px;
      height: 29px;
      border-radius: 8px;
      background: var(--accent-btn);
      color: #ffffff;
      display: grid;
      place-items: center;
      flex-shrink: 0;
      transition: background-color 220ms var(--ease-out);
    }
    .tb-meta { min-width: 0; display: flex; flex-direction: column; }
    .tb-title { font-size: 0.88rem; font-weight: 700; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.22; }
    .tb-date { font-size: 0.71rem; color: var(--text-3); white-space: nowrap; }
    .tb-controls { display: flex; align-items: center; gap: 7px; flex-shrink: 0; }
    .tb-segs { display: flex; align-items: center; gap: 7px; }
    .tb-util { display: flex; align-items: center; gap: 6px; }

    /* Segmented Controls (Lang + Density) */
    .seg-ctrl {
      position: relative;
      display: inline-flex;
      align-items: center;
      padding: 2.5px;
      border-radius: 9px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      transition: background-color 220ms var(--ease-out), border-color 220ms var(--ease-out);
    }
    .seg-pill {
      position: absolute;
      top: 2.5px;
      bottom: 2.5px;
      left: 0;
      width: 0;
      border-radius: 6.5px;
      background: var(--accent-btn);
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.16);
      opacity: 0;
      pointer-events: none;
      will-change: transform, width;
      transition: transform 200ms var(--ease-out), width 200ms var(--ease-out), background-color 220ms var(--ease-out), opacity 150ms ease;
    }
    .seg-density .seg-pill {
      background: var(--surface);
      border: 1px solid var(--border-strong);
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.08);
    }
    .seg-btn {
      position: relative;
      z-index: 1;
      border: 0;
      background: transparent;
      color: var(--text-2);
      padding: 4.5px 10px;
      border-radius: 6.5px;
      font-size: 0.76rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: color 180ms var(--ease-out);
    }
    .seg-btn:hover { color: var(--text); }
    .seg-lang .seg-btn.is-active,
    .seg-lang .seg-btn.is-active:hover { color: #ffffff; }
    .seg-density .seg-btn.is-active,
    .seg-density .seg-btn.is-active:hover { color: var(--accent-text); }

    .act-btn {
      height: 32px;
      padding: 0 10px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-2);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      font-size: 0.76rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: background-color 180ms var(--ease-out), border-color 180ms var(--ease-out), color 180ms var(--ease-out);
    }
    .act-btn:hover { background: var(--surface-hover); border-color: var(--border-strong); color: var(--text); }
    .act-icon { width: 32px; padding: 0; }

    /* Doctor Instant-Findability Rail */
    .find-bar {
      background: var(--findbar);
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      transition: background-color 220ms var(--ease-out), border-color 220ms var(--ease-out);
    }
    .find-bar-inner {
      max-width: 1120px;
      margin: 0 auto;
      padding: 6px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .nav-pills {
      display: flex;
      align-items: center;
      gap: 4px;
      min-width: 0;
      flex: 1 1 auto;
      overflow-x: auto;
      scrollbar-width: none;
      -ms-overflow-style: none;
      padding: 1px 0;
    }
    .nav-pills::-webkit-scrollbar { display: none; }
    .nav-pill {
      border: 1px solid transparent;
      background: transparent;
      color: var(--text-2);
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
      flex-shrink: 0;
      transition: background-color 160ms var(--ease-out), color 160ms var(--ease-out), border-color 160ms var(--ease-out);
    }
    .nav-pill:hover { background: var(--surface-hover); color: var(--text); }
    .nav-pill.is-active {
      background: var(--accent-soft);
      border-color: var(--accent-border);
      color: var(--accent-text);
    }

    .search-box {
      position: relative;
      display: flex;
      align-items: center;
      width: 280px;
      flex-shrink: 0;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      height: 31px;
      padding: 0 6px;
      gap: 5px;
      transition: border-color 160ms var(--ease-out), box-shadow 160ms var(--ease-out), background-color 220ms var(--ease-out);
    }
    .search-box:focus-within {
      border-color: var(--accent);
      box-shadow: 0 0 0 2.5px var(--accent-soft);
    }
    .search-ico { color: var(--text-3); display: inline-flex; flex-shrink: 0; }
    .search-input {
      border: 0;
      background: transparent;
      outline: none;
      width: 100%;
      min-width: 0;
      font-size: 0.78rem;
      color: var(--text);
      padding: 0;
    }
    .search-input:focus,
    .search-input:focus-visible { outline: none; box-shadow: none; }
    .search-input::placeholder { color: var(--text-3); }
    .search-input::-webkit-search-cancel-button { -webkit-appearance: none; appearance: none; }
    .search-kbd {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 600;
      color: var(--text-3);
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 1px 5px;
      line-height: 1.25;
      flex-shrink: 0;
    }
    .search-count {
      font-family: var(--font-mono);
      font-size: 0.68rem;
      font-weight: 700;
      color: var(--accent-text);
      background: var(--accent-soft);
      border: 1px solid var(--accent-border);
      border-radius: 999px;
      padding: 1px 7px;
      white-space: nowrap;
      flex-shrink: 0;
      font-variant-numeric: tabular-nums;
    }
    .search-count.is-zero {
      color: var(--warn-text);
      background: var(--warn-bg);
      border-color: var(--warn-border);
    }
    .search-clear {
      border: 0;
      background: transparent;
      color: var(--text-3);
      width: 22px;
      height: 22px;
      border-radius: 5px;
      display: inline-grid;
      place-items: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: background-color 150ms ease, color 150ms ease;
    }
    .search-clear:hover { background: var(--surface-hover); color: var(--text); }

    /* =========================================================================
       SWISS-EDITORIAL DOSSIER SHEET
       ========================================================================= */
    .sheet { max-width: 1120px; margin: 0 auto; padding: 18px 18px 44px; }
    @keyframes sheetSwap {
      from { opacity: 0; transform: translateY(5px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .sheet.sheet-anim { animation: sheetSwap 240ms var(--ease-out) both; }

    @keyframes sectionPulse {
      0% { box-shadow: 0 0 0 0 rgba(11, 107, 107, 0.32); }
      45% { box-shadow: 0 0 0 4px rgba(11, 107, 107, 0.16); }
      100% { box-shadow: 0 0 0 0 rgba(11, 107, 107, 0); }
    }
    .is-pulsed {
      animation: sectionPulse 950ms var(--ease-out);
      border-radius: var(--r-md);
    }

    .dossier-paper {
      background: var(--surface);
      border: 1px solid var(--border);
      border-top: 3px solid var(--accent);
      border-radius: var(--r-lg);
      box-shadow: var(--shadow-sheet);
      overflow: hidden;
      transition: background-color 220ms var(--ease-out), border-color 220ms var(--ease-out), box-shadow 220ms var(--ease-out);
    }

    /* Header + Vitals Strip */
    .doc-head-row {
      padding: 18px 26px 15px;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px 18px;
    }
    .doc-title-col { min-width: 0; flex: 1 1 320px; }
    .doc-title {
      margin: 0;
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--text);
      letter-spacing: -0.02em;
      line-height: 1.24;
    }
    html[dir="rtl"] .doc-title { letter-spacing: 0; }
    .doc-sub { margin: 3px 0 0; font-size: 0.87rem; color: var(--text-2); line-height: 1.42; }
    .doc-date {
      font-size: 0.76rem;
      font-weight: 600;
      color: var(--accent-text);
      background: var(--accent-soft);
      border: 1px solid var(--accent-border);
      padding: 4px 11px;
      border-radius: 999px;
      white-space: nowrap;
      align-self: center;
      font-variant-numeric: tabular-nums;
    }

    .vitals-strip {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 1px;
      background: var(--border);
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
    }
    .vital-cell {
      min-width: 0;
      background: var(--surface-2);
      padding: 10px 16px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .vital-lbl {
      font-size: 0.68rem;
      font-weight: 700;
      color: var(--text-3);
      text-transform: uppercase;
      letter-spacing: 0.055em;
    }
    html[dir="rtl"] .vital-lbl { text-transform: none; letter-spacing: 0; font-size: 0.74rem; }
    .vital-val {
      font-size: 0.88rem;
      font-weight: 700;
      color: var(--text);
      line-height: 1.32;
      overflow-wrap: break-word;
      font-variant-numeric: tabular-nums;
    }

    /* =========================================================================
       VIZ 1 + VIZ 2: EXECUTIVE OVERVIEW (3-SECOND SNAPSHOT + LIFESPAN TIMELINE)
       ========================================================================= */
    .exec-overview {
      padding: 16px 26px 18px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .micro-kicker {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin: 0 0 8px;
      font-size: 0.7rem;
      font-weight: 700;
      color: var(--text-3);
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    html[dir="rtl"] .micro-kicker { text-transform: none; letter-spacing: 0; font-size: 0.76rem; }

    /* Viz 1: 4-Card Clinical Snapshot Strip */
    .snapshot-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
    }
    .snapshot-grid.is-filtered {
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
    }
    .snap-card {
      min-width: 0;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-top: 2.5px solid var(--border-strong);
      border-radius: var(--r-sm);
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      transition: background-color 200ms var(--ease-out), border-color 200ms var(--ease-out);
    }
    .snap-card.tone-warn {
      background: var(--warn-bg);
      border-color: var(--warn-border);
      border-top-color: var(--warn-bar);
    }
    .snap-card.tone-accent {
      background: var(--accent-soft);
      border-color: var(--accent-border);
      border-top-color: var(--accent);
    }
    .snap-card.tone-info {
      background: var(--info-bg);
      border-color: var(--info-border);
      border-top-color: var(--info-bar);
    }
    .snap-head {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .snap-dot {
      width: 6px;
      height: 6px;
      border-radius: 999px;
      background: var(--text-3);
      flex-shrink: 0;
    }
    .tone-warn .snap-dot { background: var(--warn-bar); }
    .tone-accent .snap-dot { background: var(--accent); }
    .tone-info .snap-dot { background: var(--info-bar); }
    .snap-lbl {
      font-size: 0.69rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.045em;
      color: var(--text-3);
    }
    html[dir="rtl"] .snap-lbl { text-transform: none; letter-spacing: 0; font-size: 0.74rem; }
    .tone-warn .snap-lbl { color: var(--warn-title); }
    .tone-accent .snap-lbl { color: var(--accent-text); }
    .tone-info .snap-lbl { color: var(--info-text); }
    .snap-val {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text);
      line-height: 1.3;
      overflow-wrap: break-word;
    }
    .snap-meta {
      font-size: 0.74rem;
      color: var(--text-2);
      line-height: 1.38;
      overflow-wrap: break-word;
    }

    /* Viz 2: Longitudinal Lifespan Timeline (0 -> 26) */
    .timeline-block {
      padding-top: 12px;
      border-top: 1px solid var(--border-subtle);
    }
    .timeline-rail {
      position: relative;
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      gap: 10px;
      list-style: none;
      margin: 0;
      padding: 0;
    }
    .timeline-rail.is-filtered {
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    }
    .timeline-rail.is-filtered::before { display: none; }
    .timeline-rail::before {
      content: "";
      position: absolute;
      top: 29px;
      inset-inline-start: calc(100% / 12);
      inset-inline-end: calc(100% / 12);
      height: 1.5px;
      background: var(--rail);
      z-index: 0;
    }
    .tl-node {
      position: relative;
      z-index: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 5px;
    }
    .tl-age {
      font-family: var(--font-mono);
      font-size: 0.69rem;
      font-weight: 700;
      color: var(--text-2);
      background: var(--surface-2);
      border: 1px solid var(--border);
      padding: 1.5px 8px;
      border-radius: 999px;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }
    html[dir="rtl"] .tl-age { font-family: var(--font-ar); }
    .tl-node.is-current .tl-age {
      background: var(--accent-soft);
      border-color: var(--accent-border);
      color: var(--accent-text);
    }
    .tl-dot {
      width: 11px;
      height: 11px;
      border-radius: 999px;
      background: var(--surface);
      border: 2px solid var(--accent);
      box-shadow: 0 0 0 3px var(--surface);
      flex-shrink: 0;
    }
    .tl-node.is-current .tl-dot {
      background: var(--accent);
      box-shadow: 0 0 0 3px var(--surface), 0 0 0 5.5px var(--accent-soft);
    }
    .tl-title {
      font-size: 0.77rem;
      font-weight: 700;
      color: var(--text);
      line-height: 1.26;
      overflow-wrap: break-word;
    }
    .tl-note {
      font-size: 0.71rem;
      color: var(--text-3);
      line-height: 1.32;
      overflow-wrap: break-word;
    }

    /* =========================================================================
       2-COLUMN ASYMMETRIC CLINICAL GRID
       ========================================================================= */
    .dossier-body {
      padding: 22px 26px 28px;
      display: grid;
      grid-template-columns: minmax(0, 1.56fr) minmax(0, 1fr);
      grid-template-rows: max-content max-content 1fr;
      grid-template-areas:
        "flow safety"
        "flow labs"
        "flow tests";
      column-gap: 26px;
      row-gap: 16px;
      align-items: start;
    }
    .dossier-body.no-flow {
      grid-template-columns: 1fr;
      grid-template-rows: auto;
      grid-template-areas:
        "safety"
        "labs"
        "tests";
    }
    .dossier-body.no-sidebar {
      grid-template-columns: 1fr;
      grid-template-rows: auto;
      grid-template-areas: "flow";
    }
    .dossier-body.no-sidebar .flow-col {
      padding-inline-end: 0;
      border-inline-end: 0;
    }

    /* Primary Column: Connected Step-Flow (01 -> 04) */
    .flow-col {
      grid-area: flow;
      min-width: 0;
      align-self: stretch;
      padding-inline-end: 24px;
      border-inline-end: 1px solid var(--border);
    }
    .flow-list { list-style: none; margin: 0; padding: 0; }
    .flow-step {
      position: relative;
      padding-inline-start: 40px;
      padding-bottom: 22px;
    }
    .flow-step:last-child { padding-bottom: 0; }
    .flow-step:not(:last-child)::before {
      content: "";
      position: absolute;
      inset-inline-start: 13.25px;
      top: 32px;
      bottom: 4px;
      width: 1.5px;
      background: var(--rail);
    }
    .flow-badge {
      position: absolute;
      inset-inline-start: 0;
      top: 0;
      width: 28px;
      height: 28px;
      border-radius: 999px;
      background: var(--accent-soft);
      border: 1.5px solid var(--accent-border);
      color: var(--accent-text);
      font-family: var(--font-mono);
      font-size: 0.72rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      display: grid;
      place-items: center;
    }
    .flow-step-head {
      min-height: 28px;
      display: flex;
      align-items: center;
      padding-bottom: 6px;
      margin-bottom: 10px;
      border-bottom: 1px solid var(--border-subtle);
    }
    .flow-step-title {
      margin: 0;
      font-size: 0.98rem;
      font-weight: 700;
      color: var(--text);
      letter-spacing: -0.01em;
      line-height: 1.3;
    }
    html[dir="rtl"] .flow-step-title { letter-spacing: 0; }

    .flow-items {
      margin: 0;
      padding: 0;
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .dossier-paper.is-brief .flow-items { gap: 7px; }

    .flow-item {
      min-width: 0;
      padding: 9px 12px;
      border-radius: var(--r-sm);
      background: var(--surface-2);
      border: 1px solid var(--border-subtle);
      transition: background-color 180ms var(--ease-out), border-color 180ms var(--ease-out);
    }
    .dossier-paper.is-brief .flow-item { padding: 8px 11px; }
    .flow-item-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 4px 8px;
      margin-bottom: 4px;
    }
    .flow-item-heading {
      display: inline-flex;
      align-items: baseline;
      gap: 6px;
      min-width: 0;
    }
    .flow-num {
      font-family: var(--font-mono);
      font-size: 0.71rem;
      font-weight: 700;
      color: var(--accent-text);
      font-variant-numeric: tabular-nums;
      flex-shrink: 0;
    }
    .item-lead { color: var(--text); font-weight: 700; font-size: 0.89rem; }
    .flow-item-meta {
      display: inline-flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 4px;
    }
    .tag-chip {
      font-size: 0.67rem;
      font-weight: 600;
      color: var(--text-3);
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 1px 6.5px;
      border-radius: 999px;
      white-space: nowrap;
      line-height: 1.4;
    }
    .flow-expand-btn {
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--accent-text);
      border-radius: 999px;
      padding: 1px 8px;
      font-size: 0.68rem;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 3px;
      cursor: pointer;
      white-space: nowrap;
      transition: background-color 160ms ease, border-color 160ms ease;
    }
    .flow-expand-btn:hover { background: var(--accent-soft); border-color: var(--accent-border); }
    .flow-expand-btn svg { transition: transform 180ms var(--ease-out); }
    .flow-item.is-open .flow-expand-btn svg { transform: rotate(180deg); }

    .flow-brief {
      margin: 0;
      font-size: 0.87rem;
      font-weight: 500;
      color: var(--text);
      line-height: 1.46;
      overflow-wrap: break-word;
    }
    .flow-detail {
      margin: 5px 0 0;
      padding-top: 5px;
      border-top: 1px dashed var(--border);
      font-size: 0.82rem;
      color: var(--text-2);
      line-height: 1.48;
      overflow-wrap: break-word;
    }
    .dossier-paper.is-brief .flow-detail { display: none; }
    .dossier-paper.is-brief .flow-item.is-open .flow-detail,
    .dossier-paper.is-brief .flow-item.is-search-open .flow-detail { display: block; }

    /* =========================================================================
       VIZ 3: 24-HOUR SEGMENTED STRIP (STEP 03)
       ========================================================================= */
    .circadian-card {
      margin-top: 12px;
      padding: 11px 13px;
      border-radius: var(--r-sm);
      background: var(--surface);
      border: 1px solid var(--border);
    }
    .circ-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 4px 10px;
      margin-bottom: 8px;
    }
    .circ-title { font-size: 0.8rem; font-weight: 700; color: var(--text); }
    .circ-sub { font-size: 0.72rem; color: var(--text-3); line-height: 1.35; margin: 0 0 9px; }

    .circ-track {
      position: relative;
      height: 26px;
      border-radius: 6px;
      overflow: hidden;
      display: flex;
      background: var(--surface-3);
      border: 1px solid var(--border);
    }
    .circ-seg {
      position: relative;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      min-width: 0;
      border-right: 1px solid rgba(15, 23, 42, 0.12);
    }
    .circ-seg:last-child { border-right: 0; }
    .circ-seg.kind-sleep {
      background: repeating-linear-gradient(
        -55deg,
        var(--circ-sleep-bg),
        var(--circ-sleep-bg) 5px,
        var(--circ-sleep-stripe) 5px,
        var(--circ-sleep-stripe) 10px
      );
      color: var(--circ-sleep-text);
    }
    .circ-seg.kind-work {
      background: var(--circ-work-bg);
      color: var(--circ-work-text);
    }
    .circ-seg.kind-free {
      background: var(--circ-free-bg);
      color: var(--circ-free-text);
    }
    .circ-seg.kind-hyperfocus {
      background: var(--circ-night-bg);
      color: var(--circ-night-text);
    }
    .circ-seg-lbl {
      font-size: 0.67rem;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      padding: 1px 6px;
      border-radius: 4px;
      position: relative;
      z-index: 2;
    }
    .circ-seg.kind-sleep .circ-seg-lbl {
      background: var(--circ-sleep-lbl-bg);
    }
    .circ-arousal {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 1.5px;
      background: var(--circ-arousal);
      opacity: 0.68;
      z-index: 1;
    }
    .circ-arousal::after {
      content: "";
      position: absolute;
      top: 2px;
      left: -2.25px;
      width: 6px;
      height: 6px;
      border-radius: 999px;
      background: var(--circ-arousal);
    }

    .circ-axis {
      position: relative;
      height: 18px;
      margin-top: 4px;
      margin-bottom: 8px;
    }
    .circ-tick {
      position: absolute;
      top: 0;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      font-family: var(--font-mono);
      font-size: 0.64rem;
      font-weight: 600;
      color: var(--text-3);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }
    .circ-tick::before {
      content: "";
      width: 1px;
      height: 4px;
      background: var(--border-strong);
      margin-bottom: 1px;
    }
    .circ-tick.is-start { transform: translateX(0); align-items: flex-start; }
    .circ-tick.is-end { transform: translateX(-100%); align-items: flex-end; }

    .circ-legend {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 6px 10px;
      padding-top: 7px;
      border-top: 1px solid var(--border-subtle);
    }
    .circ-leg-item {
      display: flex;
      align-items: flex-start;
      gap: 7px;
      min-width: 0;
    }
    .circ-swatch {
      width: 10px;
      height: 10px;
      border-radius: 3px;
      margin-top: 3px;
      flex-shrink: 0;
      border: 1px solid transparent;
    }
    .circ-swatch.kind-sleep { background: var(--circ-sleep-bg); border-color: var(--circ-sleep-border); }
    .circ-swatch.kind-work { background: var(--circ-work-bg); }
    .circ-swatch.kind-free { background: var(--circ-free-bg); border-color: var(--circ-free-border); }
    .circ-swatch.kind-hyperfocus { background: var(--circ-night-bg); border-color: var(--circ-night-border); }
    .circ-leg-txt { min-width: 0; display: flex; flex-direction: column; }
    .circ-leg-lbl { font-size: 0.74rem; font-weight: 700; color: var(--text); line-height: 1.28; }
    .circ-leg-det { font-size: 0.7rem; color: var(--text-3); line-height: 1.3; overflow-wrap: break-word; }

    /* =========================================================================
       SIDEBAR REFERENCE PANELS (SAFETY, LABS, COGNITIVE BENCHMARKS)
       ========================================================================= */
    .panel {
      min-width: 0;
      border-radius: var(--r-md);
      padding: 13px 15px;
      transition: background-color 220ms var(--ease-out), border-color 220ms var(--ease-out);
    }
    .panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 6px 8px;
      margin: 0 0 10px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
    }
    .panel-head-left { display: inline-flex; align-items: center; gap: 7px; min-width: 0; }
    .panel-ico { display: inline-flex; align-items: center; flex-shrink: 0; color: var(--accent-text); }
    .panel-title {
      margin: 0;
      font-size: 0.87rem;
      font-weight: 700;
      letter-spacing: 0.005em;
      color: var(--text);
      line-height: 1.28;
    }

    /* 1. Safety / Medical Benchmarks with Severity Badges */
    .panel-safety {
      grid-area: safety;
      background: var(--warn-bg);
      border: 1px solid var(--warn-border);
      border-inline-start: 3.5px solid var(--warn-bar);
    }
    .panel-safety .panel-head { border-bottom-color: var(--warn-border); }
    .panel-safety .panel-ico { color: var(--warn-bar); }
    .panel-safety .panel-title { color: var(--warn-title); }
    .safety-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 7px; }
    .safety-item {
      min-width: 0;
      background: var(--warn-item-bg);
      border: 1px solid var(--warn-item-border);
      border-inline-start: 3px solid var(--warn-bar);
      border-radius: var(--r-sm);
      padding: 8px 10px;
      font-size: 0.82rem;
      line-height: 1.44;
      color: var(--text-2);
      overflow-wrap: break-word;
    }
    .safety-item.sev-info { border-inline-start-color: var(--info-bar); }
    .safety-item.sev-ok { border-inline-start-color: var(--accent); }
    .safety-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 4px 8px;
      margin-bottom: 3px;
    }
    .safety-item .item-lead { font-size: 0.83rem; color: var(--warn-text); }
    .safety-item.sev-info .item-lead { color: var(--info-text); }
    .safety-item.sev-ok .item-lead { color: var(--accent-text); }
    .sev-badge {
      font-size: 0.66rem;
      font-weight: 700;
      padding: 1.5px 7px;
      border-radius: 999px;
      white-space: nowrap;
      line-height: 1.35;
    }
    .sev-badge.sev-warn {
      background: var(--warn-badge-bg);
      color: var(--warn-title);
      border: 1px solid var(--warn-border);
    }
    .sev-badge.sev-info {
      background: var(--info-badge-bg);
      color: var(--info-text);
      border: 1px solid var(--info-border);
    }
    .sev-badge.sev-ok {
      background: var(--accent-soft);
      color: var(--accent-text);
      border: 1px solid var(--accent-border);
    }

    /* 2. Upgraded Grouped Biomarker Range-Bars + All/Watch Filter */
    .panel-labs {
      grid-area: labs;
      background: var(--surface-2);
      border: 1px solid var(--border);
    }
    .labs-filter {
      display: inline-flex;
      align-items: center;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 2px;
      gap: 2px;
    }
    .labs-fbtn {
      border: 0;
      background: transparent;
      color: var(--text-3);
      font-size: 0.69rem;
      font-weight: 700;
      padding: 2.5px 8px;
      border-radius: 999px;
      cursor: pointer;
      white-space: nowrap;
      transition: background-color 160ms ease, color 160ms ease;
    }
    .labs-fbtn:hover { color: var(--text); }
    .labs-fbtn.is-active {
      background: var(--accent-btn);
      color: #ffffff;
    }

    .lab-legend {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 5px 11px;
      margin: -2px 0 9px;
      font-size: 0.69rem;
      color: var(--text-3);
    }
    .lab-leg-item { display: inline-flex; align-items: center; gap: 4.5px; }
    .lab-leg-zone {
      width: 14px;
      height: 6px;
      border-radius: 999px;
      background: var(--lab-zone);
      border: 1px solid var(--lab-zone-edge);
      display: inline-block;
    }
    .lab-leg-shift { display: inline-flex; align-items: center; gap: 2px; }
    .lab-leg-dot-prev {
      width: 6px;
      height: 6px;
      border-radius: 999px;
      background: var(--surface-2);
      border: 1.5px solid var(--lab-prev);
    }
    .lab-leg-line {
      width: 10px;
      height: 2px;
      border-radius: 2px;
      background: linear-gradient(90deg, var(--lab-prev), var(--accent));
    }
    .lab-leg-dot-curr {
      width: 6px;
      height: 6px;
      border-radius: 999px;
      background: var(--accent);
    }
    .lab-leg-dot-warn {
      width: 7px;
      height: 7px;
      border-radius: 999px;
      background: var(--lab-warn);
    }

    .labs-groups { display: flex; flex-direction: column; gap: 11px; }
    .is-filter-hidden { display: none; }
    .lab-group-head {
      display: flex;
      flex-direction: column;
      gap: 1px;
      margin-bottom: 4px;
    }
    .lab-group-title {
      font-size: 0.69rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.055em;
      color: var(--text-3);
    }
    html[dir="rtl"] .lab-group-title { text-transform: none; letter-spacing: 0; font-size: 0.74rem; }
    .lab-group-note { font-size: 0.7rem; color: var(--text-3); line-height: 1.3; }

    .labs-list { display: flex; flex-direction: column; }
    .lab-row {
      min-width: 0;
      padding: 6px 0;
      border-bottom: 1px solid var(--border-subtle);
    }
    .lab-row:first-child { padding-top: 2px; }
    .lab-row:last-child { padding-bottom: 0; border-bottom: 0; }
    .lab-row.is-warn-row {
      background: var(--warn-bg);
      border: 1px solid var(--warn-border);
      border-inline-start: 3px solid var(--warn-bar);
      border-radius: var(--r-xs);
      padding: 6.5px 8px;
      margin: 3px 0;
    }
    .lab-top {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 3px 8px;
      flex-wrap: wrap;
    }
    .lab-head { display: inline-flex; align-items: baseline; gap: 5px; min-width: 0; }
    .lab-lbl { font-size: 0.79rem; font-weight: 600; color: var(--text); }
    .lab-date {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 600;
      color: var(--text-3);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }
    .lab-val {
      font-family: var(--font-mono);
      font-size: 0.76rem;
      font-weight: 700;
      color: var(--accent-text);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }
    .lab-val.is-warn { color: var(--lab-warn); }
    .lab-prev { font-weight: 500; color: var(--lab-prev); opacity: 0.92; }
    .lab-arr { margin: 0 3px; font-weight: 500; color: var(--text-3); }
    .lab-unit { font-weight: 500; font-size: 0.68rem; color: var(--text-3); margin-inline-start: 2px; }
    .lab-viz { margin-top: 4.5px; display: flex; align-items: center; gap: 8px; }
    .lab-track {
      position: relative;
      flex: 1 1 auto;
      min-width: 0;
      height: 6px;
      border-radius: 999px;
      background: var(--lab-track);
    }
    .lab-zone {
      position: absolute;
      top: 0;
      bottom: 0;
      background: var(--lab-zone);
      border-left: 1.5px solid var(--lab-zone-edge);
      border-right: 1.5px solid var(--lab-zone-edge);
      border-radius: 2px;
    }
    .lab-delta {
      position: absolute;
      top: 50%;
      height: 2.5px;
      transform: translateY(-50%);
      border-radius: 999px;
      background: linear-gradient(90deg, var(--lab-prev), var(--accent));
      z-index: 1;
    }
    .lab-dot-prev {
      position: absolute;
      top: 50%;
      width: 7px;
      height: 7px;
      border-radius: 999px;
      transform: translate(-50%, -50%);
      background: var(--surface-2);
      border: 1.8px solid var(--lab-prev);
      z-index: 2;
    }
    .lab-dot-curr {
      position: absolute;
      top: 50%;
      width: 9px;
      height: 9px;
      border-radius: 999px;
      transform: translate(-50%, -50%);
      background: var(--accent);
      box-shadow: 0 0 0 1.8px var(--surface-2);
      z-index: 3;
    }
    .lab-dot-curr.is-warn { background: var(--lab-warn); box-shadow: 0 0 0 1.8px var(--warn-bg); }
    .lab-ref {
      flex-shrink: 0;
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      color: var(--text-3);
      font-variant-numeric: tabular-nums;
      min-width: 50px;
      text-align: right;
    }
    .lab-note { margin-top: 3px; font-size: 0.71rem; line-height: 1.3; color: var(--text-3); overflow-wrap: break-word; }
    .lab-note.is-warn { color: var(--warn-text); font-weight: 600; }

    /* =========================================================================
       VIZ 4: COMPARATIVE BENCHMARK CHART & TREND SLOPE SVG
       ========================================================================= */
    .panel-tests {
      grid-area: tests;
      background: var(--surface-2);
      border: 1px solid var(--border);
    }
    .cog-sub {
      margin: -3px 0 9px;
      font-size: 0.73rem;
      color: var(--text-3);
      line-height: 1.36;
    }
    .cog-group { margin-bottom: 11px; }
    .cog-group-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 6px;
    }
    .cog-group-lbl {
      font-size: 0.68rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--accent-text);
    }
    html[dir="rtl"] .cog-group-lbl { text-transform: none; letter-spacing: 0; font-size: 0.73rem; }
    .cog-group-lbl.is-deficit { color: var(--deficit); }
    .cog-eye-chip {
      font-size: 0.66rem;
      font-weight: 600;
      color: var(--accent-text);
      background: var(--accent-soft);
      border: 1px solid var(--accent-border);
      border-radius: 999px;
      padding: 1px 7px;
      white-space: nowrap;
    }
    .cog-bars { display: flex; flex-direction: column; gap: 7px; }
    .cog-row { min-width: 0; }
    .cog-row-top {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 6px;
      margin-bottom: 3px;
    }
    .cog-lbl { font-size: 0.78rem; font-weight: 600; color: var(--text); }
    .cog-val {
      font-family: var(--font-mono);
      font-size: 0.74rem;
      font-weight: 700;
      color: var(--accent-text);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }
    .cog-val.is-load { color: var(--warn-text); }
    .cog-val.is-deficit { color: var(--deficit); }
    .cog-track {
      height: 7px;
      border-radius: 999px;
      background: var(--lab-track);
      overflow: hidden;
      position: relative;
    }
    .cog-fill {
      height: 100%;
      border-radius: 999px;
      background: var(--accent);
    }
    .cog-fill.is-load { background: var(--warn-bar); }
    .cog-fill.is-deficit { background: var(--deficit); }
    .cog-bar-sub { font-size: 0.68rem; color: var(--text-3); margin-top: 2px; line-height: 1.28; }

    /* Trend Slope Mini-SVG Card */
    .pvt-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r-sm);
      padding: 9px 11px;
      margin-bottom: 9px;
    }
    .pvt-top {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 4px;
    }
    .pvt-lbl { font-size: 0.77rem; font-weight: 700; color: var(--text); }
    .pvt-metric {
      font-family: var(--font-mono);
      font-size: 0.74rem;
      font-weight: 700;
      color: var(--deficit);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }
    .pvt-svg-wrap { width: 100%; overflow: hidden; }
    .pvt-svg { width: 100%; height: 50px; display: block; direction: ltr; unicode-bidi: isolate; }
    .pvt-svg text { direction: ltr; unicode-bidi: isolate; }
    .pvt-note { font-size: 0.69rem; color: var(--text-3); margin-top: 3px; }

    /* Family Contrast Callout */
    .family-callout {
      background: var(--surface);
      border: 1px solid var(--border);
      border-inline-start: 3px solid var(--accent);
      border-radius: var(--r-sm);
      padding: 8px 10px;
      font-size: 0.75rem;
      color: var(--text-2);
      line-height: 1.42;
      overflow-wrap: break-word;
    }

    /* Empty Search State */
    .search-empty {
      padding: 36px 20px;
      text-align: center;
      color: var(--text-2);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }
    .search-empty-title { font-size: 0.94rem; font-weight: 700; color: var(--text); margin: 0; }
    .search-empty-btn {
      border: 1px solid var(--accent-border);
      background: var(--accent-soft);
      color: var(--accent-text);
      font-size: 0.78rem;
      font-weight: 600;
      padding: 6px 14px;
      border-radius: 999px;
      cursor: pointer;
    }

    /* =========================================================================
       RESPONSIVE: TABLET & MOBILE (ZERO HORIZONTAL OVERFLOW DOWN TO 390x844)
       ========================================================================= */
    @media (max-width: 959px) {
      .snapshot-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .timeline-rail { grid-template-columns: repeat(3, minmax(0, 1fr)); row-gap: 14px; }
      .timeline-rail::before { display: none; }
    }

    @media (max-width: 899px) {
      .find-bar-inner { flex-direction: column; align-items: stretch; gap: 6px; padding: 7px 14px; }
      .search-box { width: 100%; order: -1; }
      .search-kbd { display: none; }
      .dossier-body {
        padding: 18px 20px 24px;
        grid-template-columns: 1fr;
        grid-template-rows: auto;
        grid-template-areas:
          "safety"
          "flow"
          "labs"
          "tests";
        row-gap: 18px;
      }
      .flow-col { padding-inline-end: 0; border-inline-end: 0; }
    }

    @media (max-width: 720px) {
      .topbar-inner { flex-wrap: wrap; padding: 7px 12px; gap: 6px 8px; }
      .tb-brand { flex: 1 1 auto; }
      .tb-date, .act-lbl { display: none; }
      .tb-controls { display: contents; }
      .tb-util { order: 2; }
      .tb-segs { order: 3; width: 100%; justify-content: space-between; }
      .act-btn { width: 30px; height: 30px; padding: 0; }
      .seg-btn { padding: 4px 8.5px; font-size: 0.73rem; }
      .sticky-chrome { position: static; }
      .topbar { position: sticky; top: 0; z-index: 40; }
    }

    @media (max-width: 639px) {
      .sheet { padding: 10px 10px 30px; }
      .dossier-paper { border-radius: var(--r-md); }
      .doc-head-row { padding: 14px 14px 12px; }
      .doc-title { font-size: 1.1rem; }
      .doc-sub { font-size: 0.82rem; }
      .vitals-strip { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .vital-cell { padding: 8px 11px; }
      .vital-val { font-size: 0.83rem; }
      .exec-overview { padding: 13px 14px 15px; gap: 13px; }
      .snapshot-grid { grid-template-columns: 1fr; gap: 8px; }

      /* Mobile Vertical Timeline Rail */
      .timeline-rail {
        grid-template-columns: 1fr;
        gap: 10px;
        padding-inline-start: 18px;
      }
      .timeline-rail::before {
        display: block;
        top: 8px;
        bottom: 8px;
        inset-inline-start: 5px;
        inset-inline-end: auto;
        width: 1.5px;
        height: auto;
      }
      .tl-node {
        align-items: flex-start;
        text-align: start;
        gap: 2px;
      }
      .tl-dot {
        position: absolute;
        inset-inline-start: -18px;
        top: 4px;
      }

      .dossier-body { padding: 14px 13px 18px; row-gap: 15px; }
      .flow-step { padding-inline-start: 33px; padding-bottom: 18px; }
      .flow-badge { width: 24px; height: 24px; font-size: 0.67rem; }
      .flow-step:not(:last-child)::before { inset-inline-start: 11.25px; top: 28px; }
      .flow-step-head { min-height: 24px; }
      .flow-item { padding: 8px 10px; }
      .circ-legend { grid-template-columns: 1fr; }
      .circ-tick.is-minor { display: none; }
      .panel { padding: 11px 12px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
    }

    /* =========================================================================
       EXECUTIVE PRINT ARCHITECTURE (FULL EXPANDED DETAILS + COLOR-EXACT CHARTS)
       ========================================================================= */
    @page { size: A4 portrait; margin: 6.5mm 7.5mm; }
    @media print {
      * {

      :root, html[data-theme="dark"] {

  <section id="gateScreen" class="gate-wrap">

        </button>

      }

      function renderSliceWithHighlights(raw, sliceStart, sliceEnd, ranges) {
        if (!ranges.length) return esc(raw.slice(sliceStart, sliceEnd));
        let out = "";
        let cur = sliceStart;
        for (let i = 0; i < ranges.length; i++) {
          const rs = Math.max(sliceStart, ranges[i][0]);
          const re = Math.min(sliceEnd, ranges[i][1]);
          if (re <= rs) continue;
          if (rs > cur) out += esc(raw.slice(cur, rs));
          out += '<mark class="hl">' + esc(raw.slice(rs, re)) + "</mark>";
          cur = re;
        }
        if (cur < sliceEnd) out += esc(raw.slice(cur, sliceEnd));
        return out;
      }

      function fmt(s, isRtl, qNorm) {
        const raw = String(s ?? "");
        const ranges = qNorm ? findMatchRanges(raw, qNorm) : [];
        if (!isRtl) return renderSliceWithHighlights(raw, 0, raw.length, ranges);
        LTR_RE.lastIndex = 0;
        let out = "", last = 0, m;
        while ((m = LTR_RE.exec(raw)) !== null) {
          if (m.index > last) out += renderSliceWithHighlights(raw, last, m.index, ranges);
          const full = m[0];
          const core = full.replace(/(?:\s+[+\-–—·=→/]+|[.,:;–—\-·=→/\s]+)+$/, "");
          const coreEnd = m.index + core.length;
          const fullEnd = m.index + full.length;
          if (core) {
            out += '<bdi dir="ltr">' + renderSliceWithHighlights(raw, m.index, coreEnd, ranges) + "</bdi>";
            if (fullEnd > coreEnd) out += renderSliceWithHighlights(raw, coreEnd, fullEnd, ranges);
          } else {
            out += renderSliceWithHighlights(raw, m.index, fullEnd, ranges);
          }
          last = fullEnd;
        }
        if (last < raw.length) out += renderSliceWithHighlights(raw, last, raw.length, ranges);
        return out;
      }

      function b64ToBytes(b64) {
        const bin = atob(b64);
        const arr = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
        return arr;
      }

      async function unlock(rawPin) {
        const clean = String(rawPin || "").replace(/\s+/g, "");
        const keyMat = await crypto.subtle.importKey("raw", new TextEncoder().encode(clean), { name: "PBKDF2" }, false, ["deriveKey"]);
        const aesKey = await crypto.subtle.deriveKey(
          { name: "PBKDF2", salt: b64ToBytes(BUNDLE.salt), iterations: BUNDLE.iter, hash: "SHA-256" },
          keyMat, { name: "AES-GCM", length: 256 }, false, ["decrypt"]
        );
        const buf = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64ToBytes(BUNDLE.iv) }, aesKey, b64ToBytes(BUNDLE.ct));
        return JSON.parse(new TextDecoder().decode(buf));
      }

      function syncPill(pill, activeBtn, instant) {
        if (!pill || !activeBtn) return;
        const parent = pill.parentElement;
        if (!parent) return;
        const pr = parent.getBoundingClientRect();
        const br = activeBtn.getBoundingClientRect();
        if (!br.width) return;
        const bl = parseFloat(getComputedStyle(parent).borderLeftWidth) || 0;
        const x = br.left - pr.left - bl;
        if (instant) pill.style.transition = "none";
        pill.style.width = br.width.toFixed(2) + "px";
        pill.style.transform = "translate3d(" + x.toFixed(2) + "px, 0, 0)";
        pill.style.opacity = "1";
        if (instant) {
          void pill.offsetWidth;
          pill.style.transition = "";
        }
      }

      function syncAllPills(instant) {
        syncPill(langPill, langBtns.find((b) => b.dataset.loc === lang), instant);

      function getStickyOffset() {
        const chromePos = getComputedStyle(stickyChrome).position;
        if (chromePos === "sticky") return stickyChrome.getBoundingClientRect().height + 12;
        if (getComputedStyle(topbarEl).position === "sticky") return topbarEl.getBoundingClientRect().height + 12;
        return 12;

      function setActiveNavPill(id) {
        activeNav = id;

      function jumpToSection(id) {
        const el = document.getElementById("sec-" + id);
        if (!el) return;
        spyLockUntil = Date.now() + 700;
        setActiveNavPill(id);
        const top = Math.max(0, el.getBoundingClientRect().top + window.scrollY - getStickyOffset());
        window.scrollTo({ top, behavior: "smooth" });
        el.classList.remove("is-pulsed");
        void el.offsetWidth;
        el.classList.add("is-pulsed");
      }

      function updateScrollSpy() {
        if (!data || appShell.hidden || Date.now() < spyLockUntil) return;
        const offset = getStickyOffset() + 26;
        const primarySet = new Set(["overview", "cognition", "history", "sleep"]);
        let bestId = NAV_ORDER[0];
        let bestTop = -Infinity;
        let bestPrimary = false;
        for (let i = 0; i < NAV_ORDER.length; i++) {
          const id = NAV_ORDER[i];
          const el = document.getElementById("sec-" + id);
          if (!el) continue;
          const top = el.getBoundingClientRect().top;
          if (top > offset) continue;
          const isPrimary = primarySet.has(id);
          if (bestTop === -Infinity) {
            bestId = id;
            bestTop = top;
            bestPrimary = isPrimary;
          } else if (Math.abs(top - bestTop) <= 48) {
            if (isPrimary && !bestPrimary) {
              bestId = id;
              bestTop = top;
              bestPrimary = true;
            } else if (isPrimary === bestPrimary && top > bestTop) {
              bestId = id;
              bestTop = top;
            }
          } else if (top > bestTop) {
            bestId = id;
            bestTop = top;
            bestPrimary = isPrimary;
          }
        }
        if (bestId !== activeNav) setActiveNavPill(bestId);
      }

      function renderCircadian(sc, isRtl, qNorm) {
        if (!sc || !Array.isArray(sc.blocks)) return "";
        const segsHtml = sc.blocks.map((blk) => {
          const spanPct = ((blk.end - blk.start) / 24) * 100;
          const showInside = spanPct >= 16;
          const arousalsHtml = (blk.arousals || []).map((hr) => {
            const relPct = ((hr - blk.start) / Math.max(0.5, blk.end - blk.start)) * 100;
            return '<span class="circ-arousal" style="left:' + relPct.toFixed(1) + '%" aria-hidden="true"></span>';
          }).join("");
          return '<div class="circ-seg kind-' + esc(blk.kind) + '" style="width:' + spanPct.toFixed(2) + '%" title="' + esc(blk.label) + '">'
            + arousalsHtml
            + (showInside ? '<span class="circ-seg-lbl">' + fmt(blk.shortLabel, isRtl, qNorm) + "</span>" : "")
            + "</div>";
        }).join("");

        const ticksHtml = (sc.ticks || []).map((tk) => {
          const hr = parseInt(String(tk).split(":")[0], 10);
          const pct = Number.isFinite(hr) ? (hr / 24) * 100 : 0;
          const cls = hr === 0 ? " is-start" : (hr === 24 ? " is-end" : ((hr === 9 || hr === 21) ? " is-minor" : ""));
          return '<span class="circ-tick' + cls + '" style="left:' + pct.toFixed(2) + '%">' + esc(tk) + "</span>";
        }).join("");

        const legHtml = sc.blocks.map((blk) =>
          '<div class="circ-leg-item">'
            + '<span class="circ-swatch kind-' + esc(blk.kind) + '" aria-hidden="true"></span>'
            + '<div class="circ-leg-txt">'
              + '<span class="circ-leg-lbl">' + fmt(blk.label, isRtl, qNorm) + "</span>"
              + '<span class="circ-leg-det">' + fmt(blk.detail, isRtl, qNorm) + "</span>"
            + "</div>"
          + "</div>"
        ).join("");

        return '<div class="circadian-card">'
          + '<div class="circ-head"><span class="circ-title">' + fmt(sc.title, isRtl, qNorm) + "</span></div>"
          + (sc.note ? '<p class="circ-sub">' + fmt(sc.note, isRtl, qNorm) + "</p>" : "")
          + '<div class="circ-track" dir="ltr" role="img" aria-label="' + esc(sc.title) + '">' + segsHtml + "</div>"
          + '<div class="circ-axis" dir="ltr" aria-hidden="true">' + ticksHtml + "</div>"
          + '<div class="circ-legend">' + legHtml + "</div>"
          + "</div>";
      }

      function renderPvtSvg(pvt) {
        if (!pvt || typeof pvt.startNum !== "number" || typeof pvt.endNum !== "number") return "";
        const sVal = pvt.startNum;
        const eVal = pvt.endNum;
        const hi = Math.max(sVal, eVal);
        const lo = Math.min(sVal, eVal);
        const span = Math.max(0.2, hi - lo);
        const yMax = hi + span * 0.45;
        const yMin = lo - span * 0.55;
        const mapY = (v) => 6 + ((yMax - v) / (yMax - yMin)) * 34;
        const y1 = mapY(sVal);
        const y2 = mapY(sVal - (sVal - eVal) * 0.28);
        const y3 = mapY(sVal - (sVal - eVal) * 0.64);
        const y4 = mapY(eVal);
        const pathD = "M 14 " + y1.toFixed(1) + " L 79 " + y2.toFixed(1) + " L 145 " + y3.toFixed(1) + " L 210 " + y4.toFixed(1);
        const areaD = pathD + " L 210 43 L 14 43 Z";
        const aria = esc(pvt.label + ": " + pvt.start + " -> " + pvt.end + " " + pvt.unit);

        return '<svg class="pvt-svg" viewBox="0 0 256 54" dir="ltr" direction="ltr" role="img" aria-label="' + aria + '">'
          + '<defs><linearGradient id="pvtGrad" x1="0" y1="0" x2="0" y2="1">'
            + '<stop offset="0%" style="stop-color:var(--deficit);stop-opacity:0.22"></stop>'
            + '<stop offset="100%" style="stop-color:var(--deficit);stop-opacity:0.01"></stop>'
          + "</linearGradient></defs>"
          + '<line x1="14" y1="' + y1.toFixed(1) + '" x2="210" y2="' + y1.toFixed(1) + '" stroke="var(--border-strong)" stroke-width="1" stroke-dasharray="3 3"></line>'
          + '<line x1="14" y1="43" x2="210" y2="43" stroke="var(--border)" stroke-width="1"></line>'
          + '<path d="' + areaD + '" fill="url(#pvtGrad)"></path>'
          + '<path d="' + pathD + '" fill="none" stroke="var(--deficit)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"></path>'
          + '<circle cx="14" cy="' + y1.toFixed(1) + '" r="3.6" fill="var(--accent)" stroke="var(--surface)" stroke-width="1.5"></circle>'
          + '<circle cx="210" cy="' + y4.toFixed(1) + '" r="3.8" fill="var(--deficit)" stroke="var(--surface)" stroke-width="1.5"></circle>'
          + '<text x="218" y="' + (y1 + 3).toFixed(1) + '" text-anchor="start" direction="ltr" fill="var(--text-3)" font-size="8.5" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">' + esc(pvt.start) + "</text>"
          + '<text x="218" y="' + (y4 + 3.5).toFixed(1) + '" text-anchor="start" direction="ltr" fill="var(--deficit)" font-size="9" font-weight="700" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">' + esc(pvt.end) + "</text>"
          + '<text x="14" y="52.5" text-anchor="start" direction="ltr" fill="var(--text-3)" font-size="7.5" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">0 min</text>'
          + '<text x="210" y="52.5" text-anchor="end" direction="ltr" fill="var(--text-3)" font-size="7.5" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">5 min</text>'
          + "</svg>";
      }
