<!DOCTYPE html>
<html lang="fr" dir="ltr" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet" />
  <meta name="referrer" content="no-referrer" />
  <meta name="theme-color" content="#f4f7f9" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230f766e'/%3E%3Cpath d='M16 8v16M8 16h16' stroke='%23ffffff' stroke-width='3.2' stroke-linecap='round'/%3E%3C/svg%3E" />
  <title>Fiche Clinique · ملف طبي · Clinical Sheet</title>
  <style>
    :root {
      color-scheme: light;
      --font-ltr: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      --font-ar: "SF Arabic", "Geeza Pro", "Segoe UI", Tahoma, "Noto Sans Arabic", system-ui, -apple-system, sans-serif;
      --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
      --bg: #f4f7f9; --surface: #ffffff; --surface-2: #f8fafc; --surface-hover: #eef2f6;
      --topbar: rgba(255, 255, 255, 0.92); --border: #dfe6ee; --border-strong: #c5d1df;
      --text: #0f172a; --text-2: #334155; --text-3: #64748b;
      --accent: #0f766e; --accent-hover: #115e59; --accent-soft: #ecfdf5; --accent-border: #99f6e4; --accent-text: #0f766e;
      --alert-bg: #fff8f6; --alert-border: #f5c2b8; --alert-accent: #be123c; --alert-title: #9f1239; --alert-lead: #9a3412; --alert-item-bg: rgba(255, 255, 255, 0.78);
      --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.04); --shadow-md: 0 10px 28px -8px rgba(15, 23, 42, 0.08), 0 2px 6px rgba(15, 23, 42, 0.04);
      --r-lg: 14px; --r-md: 11px; --r-sm: 8px;
    }
    html[data-theme="dark"] {
      color-scheme: dark;
      --bg: #0b111b; --surface: #121a28; --surface-2: #182336; --surface-hover: #1f2d44;
      --topbar: rgba(11, 17, 27, 0.9); --border: #243247; --border-strong: #354966;
      --text: #f1f5f9; --text-2: #cbd5e1; --text-3: #94a3b8;
      --accent: #14b8a6; --accent-hover: #2dd4bf; --accent-soft: rgba(20, 184, 166, 0.13); --accent-border: rgba(45, 212, 191, 0.3); --accent-text: #5eead4;
      --alert-bg: rgba(190, 18, 60, 0.12); --alert-border: rgba(251, 113, 133, 0.34); --alert-accent: #fb7185; --alert-title: #fda4af; --alert-lead: #fdba74; --alert-item-bg: rgba(15, 23, 42, 0.38);
      --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.25); --shadow-md: 0 14px 36px -8px rgba(0, 0, 0, 0.45);
    }
    *, *::before, *::after { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html { -webkit-text-size-adjust: 100%; overflow-x: clip; }
    body { margin: 0; min-height: 100vh; overflow-x: clip; background: var(--bg); color: var(--text); font-family: var(--font-ltr); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
    html[dir="rtl"] body { font-family: var(--font-ar); line-height: 1.62; }
    button, input { font: inherit; color: inherit; }

    /* PIN Gate */
    .gate-wrap { min-height: 100vh; display: grid; place-items: center; padding: 20px 16px; }
    .gate-card { width: 100%; max-width: 380px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); box-shadow: var(--shadow-md); padding: 28px 24px 24px; text-align: center; }
    .gate-card.shake { animation: shake 0.36s ease; }
    .gate-mark { width: 46px; height: 46px; margin: 0 auto 14px; border-radius: 12px; background: var(--accent-soft); border: 1px solid var(--accent-border); color: var(--accent-text); display: grid; place-items: center; }
    .gate-title { margin: 0 0 6px; font-size: 1.02rem; font-weight: 700; color: var(--text); letter-spacing: -0.01em; }
    .gate-sub { margin: 0 0 18px; font-size: 0.82rem; color: var(--text-3); }
    .pin-wrap { position: relative; margin-bottom: 12px; }
    .pin-input { width: 100%; height: 44px; padding: 0 42px; border-radius: var(--r-sm); border: 1px solid var(--border-strong); background: var(--surface-2); font-family: var(--font-mono); font-size: 1.08rem; letter-spacing: 0.22em; text-align: center; outline: none; transition: border-color 0.16s, box-shadow 0.16s; }
    .pin-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
    .pin-eye { position: absolute; top: 50%; right: 8px; transform: translateY(-50%); width: 30px; height: 30px; border: 0; border-radius: 6px; background: transparent; color: var(--text-3); display: grid; place-items: center; cursor: pointer; }
    .pin-eye:hover { background: var(--surface-hover); color: var(--text); }
    .gate-btn { width: 100%; height: 42px; border: 0; border-radius: var(--r-sm); background: var(--accent); color: #ffffff; font-size: 0.9rem; font-weight: 600; cursor: pointer; transition: background 0.16s, opacity 0.16s; }
    .gate-btn:hover { background: var(--accent-hover); }
    .gate-btn:disabled { opacity: 0.6; cursor: wait; }
    .gate-err { min-height: 1.25rem; margin-top: 10px; font-size: 0.8rem; font-weight: 600; color: var(--alert-accent); }
    @keyframes shake { 0%, 100% { transform: translateX(0); } 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }

    /* Sticky Toolbar */
    .topbar { position: sticky; top: 0; z-index: 30; background: var(--topbar); border-bottom: 1px solid var(--border); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
    .topbar-inner { max-width: 980px; margin: 0 auto; padding: 8px 16px; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .tb-brand { display: flex; align-items: center; gap: 9px; min-width: 0; }
    .tb-mark { width: 30px; height: 30px; border-radius: 8px; background: var(--accent); color: #ffffff; display: grid; place-items: center; flex-shrink: 0; }
    .tb-meta { min-width: 0; display: flex; flex-direction: column; }
    .tb-title { font-size: 0.9rem; font-weight: 700; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .tb-date { font-size: 0.72rem; color: var(--text-3); white-space: nowrap; }
    .tb-actions { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
    .seg-lang { display: inline-flex; padding: 2px; border-radius: 9px; background: var(--surface-2); border: 1px solid var(--border); }
    .seg-btn { border: 0; background: transparent; color: var(--text-2); padding: 5px 10px; border-radius: 7px; font-size: 0.78rem; font-weight: 600; cursor: pointer; transition: background 0.15s, color 0.15s; }
    .seg-btn:hover { color: var(--text); }
    .seg-btn.is-active { background: var(--accent); color: #ffffff; }
    .act-btn { height: 33px; padding: 0 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); color: var(--text-2); display: inline-flex; align-items: center; justify-content: center; gap: 6px; font-size: 0.78rem; font-weight: 600; cursor: pointer; transition: background 0.15s, border-color 0.15s, color 0.15s; }
    .act-btn:hover { background: var(--surface-hover); border-color: var(--border-strong); color: var(--text); }
    .act-icon { width: 33px; padding: 0; }

    /* Doctor-First Clinical Sheet */
    .sheet { max-width: 980px; margin: 0 auto; padding: 18px 16px 36px; display: flex; flex-direction: column; gap: 14px; }
    .sheet-head { background: var(--surface); border: 1px solid var(--border); border-top: 3px solid var(--accent); border-radius: var(--r-md); box-shadow: var(--shadow-sm); padding: 14px 18px; display: flex; align-items: baseline; justify-content: space-between; flex-wrap: wrap; gap: 6px 14px; }
    .sheet-title-col { min-width: 0; flex: 1 1 280px; }
    .sheet-h1 { margin: 0; font-size: 1.24rem; font-weight: 700; color: var(--text); letter-spacing: -0.015em; line-height: 1.28; }
    .sheet-sub { margin: 3px 0 0; font-size: 0.87rem; color: var(--text-2); }
    .sheet-date { font-size: 0.78rem; font-weight: 600; color: var(--accent-text); background: var(--accent-soft); border: 1px solid var(--accent-border); padding: 3px 10px; border-radius: 999px; white-space: nowrap; }

    .snap-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
    .snap-chip { min-width: 0; background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-md); box-shadow: var(--shadow-sm); padding: 10px 12px; display: flex; flex-direction: column; gap: 3px; }
    .snap-lbl { font-size: 0.72rem; font-weight: 600; color: var(--text-3); text-transform: uppercase; letter-spacing: 0.03em; }
    html[dir="rtl"] .snap-lbl { text-transform: none; letter-spacing: 0; font-size: 0.77rem; }
    .snap-val { font-size: 0.92rem; font-weight: 700; color: var(--text); overflow-wrap: break-word; line-height: 1.35; }

    .alerts-box { background: var(--alert-bg); border: 1px solid var(--alert-border); border-inline-start: 4px solid var(--alert-accent); border-radius: var(--r-md); padding: 13px 16px; }
    .alerts-head { display: flex; align-items: center; gap: 8px; margin: 0 0 10px; color: var(--alert-title); font-size: 0.92rem; font-weight: 700; }
    .alerts-list { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
    .alert-item { min-width: 0; background: var(--alert-item-bg); border: 1px solid var(--alert-border); border-radius: var(--r-sm); padding: 8px 11px; font-size: 0.87rem; line-height: 1.46; color: var(--text-2); overflow-wrap: break-word; }
    .alert-item:last-child:nth-child(odd) { grid-column: 1 / -1; }
    .alert-item .item-lead { color: var(--alert-lead); font-weight: 700; }

    .sections-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; align-items: stretch; }
    .sec-card { min-width: 0; background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-md); box-shadow: var(--shadow-sm); padding: 14px 16px; display: flex; flex-direction: column; gap: 9px; }
    .sec-head { display: flex; align-items: center; gap: 9px; padding-bottom: 7px; border-bottom: 1px solid var(--border); }
    .sec-num { font-family: var(--font-mono); font-size: 0.72rem; font-weight: 700; color: var(--accent-text); background: var(--accent-soft); border: 1px solid var(--accent-border); padding: 2px 7px; border-radius: 6px; flex-shrink: 0; }
    .sec-title { margin: 0; font-size: 0.96rem; font-weight: 700; color: var(--text); line-height: 1.3; }
    .sec-list { margin: 0; padding-inline-start: 1.2rem; display: flex; flex-direction: column; gap: 7px; }
    .sec-list li { font-size: 0.88rem; color: var(--text-2); line-height: 1.48; overflow-wrap: break-word; }
    .sec-list li::marker { color: var(--accent); font-weight: 700; }
    .item-lead { color: var(--text); font-weight: 700; }

    /* Responsive (zero horizontal overflow down to 390x844) */
    @media (max-width: 859px) {
      .sections-grid, .alerts-list { grid-template-columns: 1fr; }
      .alert-item:last-child:nth-child(odd) { grid-column: auto; }
    }
    @media (max-width: 640px) {
      .topbar-inner { padding: 7px 10px; gap: 6px; }
      .tb-mark { width: 28px; height: 28px; }
      .tb-title { font-size: 0.82rem; }
      .tb-date, .act-lbl { display: none; }
      .act-btn { width: 32px; height: 32px; padding: 0; }
      .seg-btn { padding: 4px 7px; font-size: 0.74rem; }
      .sheet { padding: 12px 10px 28px; gap: 10px; }
      .sheet-head { padding: 12px 13px; }
      .sheet-h1 { font-size: 1.1rem; }
      .snap-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
      .snap-chip { padding: 8px 10px; }
      .alerts-box, .sec-card { padding: 11px 12px; }
    }

    /* Strict 1-Page A4 Print */
    @page { size: A4 portrait; margin: 6.5mm 7mm; }
    @media print {
      * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
      :root, html[data-theme="dark"] {
        color-scheme: light;
        --bg: #ffffff; --surface: #ffffff; --surface-2: #f8fafc; --border: #cbd5e1; --border-strong: #94a3b8;
        --text: #0f172a; --text-2: #1e293b; --text-3: #475569;
        --accent: #0f766e; --accent-soft: #ecfdf5; --accent-border: #99f6e4; --accent-text: #0f766e;
        --alert-bg: #fff8f6; --alert-border: #f5b7ae; --alert-accent: #be123c; --alert-title: #9f1239; --alert-lead: #9a3412; --alert-item-bg: #ffffff;
      }
      .topbar, .gate-wrap { display: none !important; }
      html, body { height: auto !important; min-height: 0 !important; background: #ffffff !important; color: #0f172a !important; font-size: 8.3pt; line-height: 1.24; }
      html[dir="rtl"] body { font-size: 8.6pt; line-height: 1.34; }
      .sheet { max-width: 100%; padding: 0; gap: 2mm; }
      .sheet-head { box-shadow: none !important; border: 0; border-bottom: 1.5pt solid #0f766e; border-radius: 0; padding: 0 0 1.6mm; break-inside: avoid; }
      .sheet-h1 { font-size: 11.4pt; line-height: 1.18; }
      .sheet-sub { font-size: 8pt; margin-top: 0.6mm; }
      .sheet-date { font-size: 7.4pt; padding: 0.6mm 2.2mm; }
      .snap-grid { grid-template-columns: repeat(4, minmax(0, 1fr)) !important; gap: 1.8mm; }
      .snap-chip { box-shadow: none !important; padding: 1.4mm 2.1mm; border-radius: 5px; gap: 0.4mm; break-inside: avoid; }
      .snap-lbl { font-size: 6.4pt; }
      .snap-val { font-size: 8pt; line-height: 1.18; }
      .alerts-box { padding: 1.9mm 2.5mm; border-radius: 6px; break-inside: avoid; }
      .alerts-head { font-size: 8.4pt; margin-bottom: 1.2mm; }
      .alerts-list { grid-template-columns: repeat(2, minmax(0, 1fr)) !important; gap: 1.4mm; }
      .alert-item { padding: 1.2mm 2mm; font-size: 7.7pt; line-height: 1.22; border-radius: 4px; break-inside: avoid; }
      .alert-item:last-child:nth-child(odd) { grid-column: 1 / -1; }
      .sections-grid { grid-template-columns: repeat(2, minmax(0, 1fr)) !important; gap: 2mm; }
      .sec-card { box-shadow: none !important; padding: 2mm 2.6mm; gap: 1.2mm; border-radius: 6px; break-inside: avoid; }
      .sec-head { padding-bottom: 1mm; gap: 1.8mm; }
      .sec-num { font-size: 6.8pt; padding: 0.3mm 1.4mm; }
      .sec-title { font-size: 8.5pt; }
      .sec-list { padding-inline-start: 3.4mm; gap: 0.9mm; }
      .sec-list li { font-size: 7.8pt; line-height: 1.22; }
      html[dir="rtl"] .alert-item { font-size: 8.1pt; line-height: 1.28; }
      html[dir="rtl"] .sec-list li { font-size: 8.2pt; line-height: 1.3; }
    }
  </style>
</head>
<body>
  <section id="gateScreen" class="gate-wrap">
    <form id="gateForm" class="gate-card" autocomplete="off">
      <div class="gate-mark" aria-hidden="true">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
      </div>
      <h1 class="gate-title">Code d'accès · رمز الدخول · Access Code</h1>
      <p class="gate-sub">Chiffré · مشفّر · Encrypted</p>
      <div class="pin-wrap">
        <input id="pinInput" class="pin-input" type="password" inputmode="numeric" placeholder="••••••••" aria-label="Code d'accès / رمز الدخول / Access Code" spellcheck="false" required autofocus />
        <button id="toggleEye" class="pin-eye" type="button" aria-label="Show code">
          <svg id="eyeOpen" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
          <svg id="eyeClosed" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" hidden><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"></path><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
        </button>
      </div>
      <button id="gateBtn" class="gate-btn" type="submit">Ouvrir · دخول · Unlock</button>
      <div id="gateErr" class="gate-err" role="alert"></div>
    </form>
  </section>

  <div id="appShell" hidden>
    <header class="topbar">
      <div class="topbar-inner">
        <div class="tb-brand">
          <div class="tb-mark" aria-hidden="true">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
          </div>
          <div class="tb-meta">
            <span id="tbTitle" class="tb-title"></span>
            <span id="tbDate" class="tb-date"></span>
          </div>
        </div>
        <div class="tb-actions">
          <div class="seg-lang" dir="ltr" role="group" aria-label="Language">
            <button class="seg-btn is-active" type="button" data-loc="fr" aria-pressed="true">FR</button>
            <button class="seg-btn" type="button" data-loc="ar" aria-pressed="false">العربية</button>
            <button class="seg-btn" type="button" data-loc="en" aria-pressed="false">EN</button>
          </div>
          <button id="themeBtn" class="act-btn act-icon" type="button" aria-label="Dark mode">
            <svg id="icoMoon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
            <svg id="icoSun" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" hidden><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2m0 16v2M4.93 4.93l1.41 1.41m11.32 11.32l1.41 1.41M2 12h2m16 0h2M4.93 19.07l1.41-1.41m11.32-11.32l1.41-1.41"></path></svg>
          </button>
          <button id="printBtn" class="act-btn" type="button">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 6 2 18 2 18 9"></polyline><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path><rect x="6" y="14" width="12" height="8"></rect></svg>
            <span id="printLbl" class="act-lbl"></span>
          </button>
          <button id="lockBtn" class="act-btn" type="button">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
            <span id="lockLbl" class="act-lbl"></span>
          </button>
        </div>
      </div>
    </header>
    <main id="sheet" class="sheet"></main>
  </div>

  <script>

      const setHidden = (el, hide) => hide ? el.setAttribute("hidden", "") : el.removeAttribute("hidden");
      const esc = (s) => String(s ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");

      function fmt(s, isRtl) {
        const raw = String(s ?? "");
        if (!isRtl) return esc(raw);
        LTR_RE.lastIndex = 0;
        let out = "", last = 0, m;
        while ((m = LTR_RE.exec(raw)) !== null) {
          out += esc(raw.slice(last, m.index));
          const full = m[0];
          const core = full.replace(/(?:\s+[+\-–—=→/]+|[.,:;–—\-=→/\s]+)+$/, "");
          const trail = full.slice(core.length);
          out += core ? '<bdi dir="ltr">' + esc(core) + "</bdi>" + esc(trail) : esc(full);
          last = m.index + full.length;
        }
        return out + esc(raw.slice(last));

      function renderLeadText(it, isRtl) {
        const lead = it && it.lead ? String(it.lead).trim() : "";
        const text = it && it.text ? String(it.text).trim() : "";
        if (!lead) return '<span class="item-text">' + fmt(text, isRtl) + "</span>";
        const sep = /[:：—–-]$/.test(lead) ? " " : ": ";
        return '<strong class="item-lead">' + fmt(lead, isRtl) + (text ? sep : "") + "</strong>" + (text ? '<span class="item-text">' + fmt(text, isRtl) + "</span>" : "");

      function b64ToBytes(b64) {
        const bin = atob(b64);
        const arr = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
        return arr;

      async function unlock(rawPin) {
        const clean = String(rawPin || "").replace(/\s+/g, "");
        const keyMat = await crypto.subtle.importKey("raw", new TextEncoder().encode(clean), { name: "PBKDF2" }, false, ["deriveKey"]);
        const aesKey = await crypto.subtle.deriveKey(
          { name: "PBKDF2", salt: b64ToBytes(BUNDLE.salt), iterations: BUNDLE.iter, hash: "SHA-256" },
          keyMat, { name: "AES-GCM", length: 256 }, false, ["decrypt"]
        );
        const buf = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64ToBytes(BUNDLE.iv) }, aesKey, b64ToBytes(BUNDLE.ct));
        return JSON.parse(new TextDecoder().decode(buf));

          '<div class="snap-chip"><span class="snap-lbl">' + fmt(s.label, isRtl) + '</span><span class="snap-val">' + fmt(s.value, isRtl) + "</span></div>"
        ).join("");
        const alertsHtml = d.alerts.map((a) => '<li class="alert-item">' + renderLeadText(a, isRtl) + "</li>").join("");
        const sectionsHtml = d.sections.map((sec, idx) =>
          '<article class="sec-card">'
            + '<div class="sec-head"><span class="sec-num" dir="ltr">' + String(idx + 1).padStart(2, "0") + '</span><h2 class="sec-title">' + fmt(sec.title, isRtl) + "</h2></div>"
            + '<ol class="sec-list">' + (sec.items || []).map((it) => "<li>" + renderLeadText(it, isRtl) + "</li>").join("") + "</ol>"
            + "</article>"
        ).join("");

        sheet.innerHTML =
          '<section class="sheet-head"><div class="sheet-title-col"><h1 class="sheet-h1">' + fmt(d.title, isRtl) + '</h1><p class="sheet-sub">' + fmt(d.subtitle, isRtl) + '</p></div><span class="sheet-date">' + fmt(d.date, isRtl) + "</span></section>"
          + '<section class="snap-grid" aria-label="Snapshot">' + snapHtml + "</section>"
          + '<section class="alerts-box" role="region"><div class="alerts-head">' + ALERT_ICON + "<span>" + fmt(d.alertsTitle, isRtl) + '</span></div><ol class="alerts-list">' + alertsHtml + "</ol></section>"
          + '<section class="sections-grid">' + sectionsHtml + "</section>";
      }

      toggleEye.addEventListener("click", () => {
        const show = pinInput.type === "password";
        pinInput.type = show ? "text" : "password";
        setHidden(eyeOpen, show);
        setHidden(eyeClosed, !show);
        toggleEye.setAttribute("aria-label", show ? "Hide code" : "Show code");
        pinInput.focus();
      });
      pinInput.addEventListener("input", () => { if (gateErr.textContent) gateErr.textContent = ""; });
      gateForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        gateErr.textContent = "";
        gateBtn.disabled = true;
        try {
          data = await unlock(pinInput.value);
          lang = "fr";
          pinInput.value = "";
          gateForm.reset();
          gateScreen.hidden = true;
          appShell.hidden = false;
          render();
          window.scrollTo({ top: 0, behavior: "instant" });
        } catch {
          gateErr.textContent = "Code incorrect · الرمز غير صحيح · Invalid code";
          gateForm.classList.remove("shake");
          void gateForm.offsetWidth;
          gateForm.classList.add("shake");
          pinInput.select();
        } finally {
          gateBtn.disabled = false;
        }
      });
      langBtns.forEach((btn) => btn.addEventListener("click", () => {
        const next = btn.dataset.loc;
        if (next && next !== lang && data && data[next]) { lang = next; render(); }
      }));
      themeBtn.addEventListener("click", () => {
        root.setAttribute("data-theme", root.getAttribute("data-theme") === "dark" ? "light" : "dark");
        syncThemeControl();
      });
      printBtn.addEventListener("click", () => window.print());
      lockBtn.addEventListener("click", () => {
        data = null;
        lang = "fr";
        sheet.innerHTML = "";
        tbTitle.textContent = "";
        tbDate.textContent = "";
        appShell.hidden = true;
        gateScreen.hidden = false;
        root.lang = "fr";
        root.dir = "ltr";
        document.title = LOCKED_TITLE;
        pinInput.type = "password";
        setHidden(eyeOpen, false);
        setHidden(eyeClosed, true);
        toggleEye.setAttribute("aria-label", "Show code");
        pinInput.value = "";
        gateErr.textContent = "";
        gateForm.reset();
        pinInput.focus();
      });
    })();
  </script>
</body>
</html>
