      #sec-mood { break-before: page; page-break-before: always; padding-top: 0; margin-top: 0; border-top: 0; }
      #sec-sleep, #sec-safety, #sec-questions { padding-top: 2.2mm; margin-top: 2.2mm; }
      #sec-sleep .sec-head, #sec-mood .sec-head, #sec-safety .sec-head, #sec-questions .sec-head { margin-bottom: 1.2mm; }
      #sec-sleep .lead-prose, #sec-mood .lead-prose { font-size: 7.4pt; line-height: 1.24; margin-bottom: 1mm; }
      #sec-safety .figure-card { padding: 1.6mm 2.2mm 1.4mm; margin: 1.5mm 0; }

      .prose-list { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 2.4mm; padding-top: 0.9mm; }
      .prose-item { padding: 0; margin: 0; border-bottom: 0; background: transparent !important; break-inside: avoid; }
      .prose-item-head { margin-bottom: 0.25mm; }
      .prose-lead { font-size: 7.25pt; }
      .prose-brief { font-size: 6.85pt; line-height: 1.22; }
      .prose-detail { font-size: 6.55pt; line-height: 1.2; margin-top: 0.3mm; }

      .life-wrap { margin-top: 1.5mm; break-inside: avoid; }
      .life-rail { grid-template-columns: repeat(4, minmax(0, 1fr)) !important; gap: 2mm; padding: 0 !important; }
      .life-rail::before { display: none !important; }
      .life-node { align-items: center !important; text-align: center !important; gap: 0.8mm; padding: 0 !important; background: transparent !important; }
      .life-dot-wrap { position: relative !important; width: 100% !important; height: 14px !important; }
      .life-dot-wrap::before { display: block !important; inset-inline-start: -1mm; inset-inline-end: -1mm; height: 0.75pt; }
      .life-node:first-child .life-dot-wrap::before { inset-inline-start: 50%; }
      .life-node:last-child .life-dot-wrap::before { inset-inline-end: 50%; }
      .life-dot { position: relative !important; inset-inline-start: auto !important; top: auto !important; width: 6px; height: 6px; border-width: 1.5px; box-shadow: 0 0 0 1.8px var(--bg); }
      .life-node.is-current .life-dot { box-shadow: 0 0 0 1.6px var(--bg), 0 0 0 3.4px var(--teal-soft); }
      .life-age { font-size: 6.35pt; line-height: 1.2; }
      .life-stage { font-size: 6.95pt; }
      .life-note { font-size: 6.45pt; line-height: 1.2; }

      .safety-grid { grid-template-columns: repeat(2, minmax(0, 1fr)) !important; gap: 1.2mm; margin-bottom: 1mm; }
      .safety-card { padding: 0.95mm 1.7mm; border-radius: 4px; box-shadow: none !important; break-inside: avoid; }
      .safety-top { margin-bottom: 0.25mm; }
      .safety-lead { font-size: 7.2pt; }
      .sev-badge { font-size: 6pt; padding: 0.15mm 1.3mm; }
      .safety-brief { font-size: 6.8pt; line-height: 1.2; }
      .safety-detail { font-size: 6.45pt; line-height: 1.18; margin-top: 0.22mm; }
      .access-note { margin-bottom: 1mm; padding: 0.6mm 1.6mm; font-size: 6.75pt; break-inside: avoid; }

      .labs-head-bar { margin-bottom: 0.8mm; }
      .lab-spotlight { padding: 1mm 1.7mm 0.8mm; margin-bottom: 1mm; break-inside: avoid; }
      .spot-top { margin-bottom: 0.25mm; }
      .spot-lbl { font-size: 7.2pt; }
      .spot-val { font-size: 7.6pt; }
      .spot-svg { max-height: none; width: 100%; height: auto; }

      .lab-subblock { margin-top: 0.75mm; }
      .lab-subhead { margin-bottom: 0.4mm; break-after: avoid; }
      .lab-subtitle { font-size: 6.3pt !important; }
      .lab-subnote { font-size: 6.2pt; }
      .repleted-grid { grid-template-columns: repeat(3, minmax(0, 1fr)) !important; gap: 1.1mm; }
      .rep-item { padding: 0.7mm 1.4mm; background: var(--bg) !important; break-inside: avoid; }
      .rep-lbl { font-size: 6.8pt; }
      .rep-val-row { margin-bottom: 0.35mm; }
      .rep-val { font-size: 6.6pt; }
      .rep-meta { font-size: 6.1pt; margin-top: 0.25mm; }

      .normal-grid { grid-template-columns: repeat(3, minmax(0, 1fr)) !important; gap: 0.4mm 2mm; padding-top: 0.45mm; }
      .norm-item { padding: 0.35mm 0; margin: 0; background: transparent !important; break-inside: avoid; }
      .norm-top { margin-bottom: 0.22mm; }
      .norm-lbl { font-size: 6.55pt; }
      .norm-date { font-size: 5.9pt; opacity: 0.82; }
      .norm-val { font-size: 6.45pt; }

      #sec-questions { break-inside: avoid; page-break-inside: avoid; }

      function normChar(ch) {
        if (/[\u064B-\u065F\u0670\u0640]/.test(ch)) return "";
        if (/[\u0622\u0623\u0625\u0671]/.test(ch)) return "\u0627";
        if (ch === "\u0629") return "\u0647";
        if (ch === "\u0649") return "\u064A";
        return ch.normalize("NFD").replace(/[\u0300-\u036F]/g, "").toLowerCase();

      function normText(str) {

      function findMatchRanges(raw, qNorm) {
        if (!qNorm) return [];
        const chars = [], starts = [], ends = [];
        for (let i = 0; i < raw.length; i++) {
          const nc = normChar(raw[i]);
          for (let j = 0; j < nc.length; j++) {
            chars.push(nc[j]);
            starts.push(i);
            ends.push(i + 1);
          }
        }
        const hay = chars.join("");
        const ranges = [];
        let pos = 0;
        while (pos <= hay.length - qNorm.length) {
          const idx = hay.indexOf(qNorm, pos);
          if (idx === -1) break;
          let rEnd = ends[idx + qNorm.length - 1];
          while (rEnd < raw.length && normChar(raw[rEnd]) === "" && /[\u0300-\u036F\u064B-\u065F\u0670]/.test(raw[rEnd])) rEnd++;
          ranges.push([starts[idx], rEnd]);
          pos = idx + qNorm.length;
        }
        return ranges;
      }

      function renderSliceWithHighlights(raw, sliceStart, sliceEnd, ranges) {
        if (!ranges.length) return esc(raw.slice(sliceStart, sliceEnd));
        let out = "", cur = sliceStart;
        for (let i = 0; i < ranges.length; i++) {
          const rs = Math.max(sliceStart, ranges[i][0]);
          const re = Math.min(sliceEnd, ranges[i][1]);
          if (re <= rs) continue;
          if (rs > cur) out += esc(raw.slice(cur, rs));
          out += '<mark class="hl">' + esc(raw.slice(rs, re)) + "</mark>";
          cur = re;
        }
        if (cur < sliceEnd) out += esc(raw.slice(cur, sliceEnd));
        return out;
      }

      function fmt(s, isRtl, qNorm) {
        const raw = String(s ?? "");

        LTR_RE.lastIndex = 0;

        while ((m = LTR_RE.exec(raw)) !== null) {

          const full = m[0];
          const core = full.replace(/(?:\s+[+\-–—·=→/]+|[.,:;–—\-·=→/\s]+)+$/, "");
          const coreEnd = m.index + core.length;

            out += '<bdi dir="ltr"' + cls + ">" + renderSliceWithHighlights(raw, m.index, coreEnd, ranges) + "</bdi>";
            if (fullEnd > coreEnd) out += renderSliceWithHighlights(raw, coreEnd, fullEnd, ranges);
          } else {
            out += renderSliceWithHighlights(raw, m.index, fullEnd, ranges);
          }
          last = fullEnd;
        }
        if (last < raw.length) out += renderSliceWithHighlights(raw, last, raw.length, ranges);
        return out;
      }

      async function unlock(rawPin) {
        const clean = String(rawPin || "").replace(/\s+/g, "");
        const keyMat = await crypto.subtle.importKey("raw", new TextEncoder().encode(clean), { name: "PBKDF2" }, false, ["deriveKey"]);
        const aesKey = await crypto.subtle.deriveKey(
          { name: "PBKDF2", salt: b64ToBytes(BUNDLE.salt), iterations: BUNDLE.iter, hash: "SHA-256" },
          keyMat, { name: "AES-GCM", length: 256 }, false, ["decrypt"]

        const buf = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64ToBytes(BUNDLE.iv) }, aesKey, b64ToBytes(BUNDLE.ct));
        return JSON.parse(new TextDecoder().decode(buf));

        const tf = "scaleX(" + pct.toFixed(4) + ")";

            : ui.searchMatches.replace("{n}", String(matchTotal));
          searchCount.classList.toggle("is-zero", matchTotal === 0);
          searchPrev.setAttribute("aria-label", ui.matchPrev || "Previous match");
          searchPrev.setAttribute("title", ui.matchPrev || "Previous match");
          searchNext.setAttribute("aria-label", ui.matchNext || "Next match");
          searchNext.setAttribute("title", ui.matchNext || "Next match");
        }
        refreshSearchMarks(Boolean(preserveMarkIdx));
      }

      /* Mobile Quick-Jump Sheet & Keyboard Shortcuts Modal (Accessible Focus Management) */
      function syncOverlayBodyLock() {
        const open = !mobSheetWrap.hidden || !scModalWrap.hidden;
        document.body.classList.toggle("has-overlay", open);
      }

      function getFocusables(container) {
        return Array.from(container.querySelectorAll('button:not([disabled]), [href], input:not([disabled]), [tabindex]:not([tabindex="-1"])'))
          .filter((el) => el.offsetParent !== null);
      }

      function trapDialogFocus(e, container) {
        if (e.key !== "Tab") return;
        const focusables = getFocusables(container);
        if (!focusables.length) return;
        const first = focusables[0];
        const last = focusables[focusables.length - 1];
        if (e.shiftKey) {
          if (document.activeElement === first || !container.contains(document.activeElement)) {
            e.preventDefault();
            last.focus();
          }
        } else if (document.activeElement === last || !container.contains(document.activeElement)) {
          e.preventDefault();
          first.focus();
        }
      }
