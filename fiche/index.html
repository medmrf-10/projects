    .float-top:hover { border-color: var(--teal-border); background: var(--surface); }
    @media (min-width: 1280px) { .float-top { display: none; } }

    .return-toast {
      position: fixed;
      bottom: 22px;
      inset-inline-end: 72px;
      z-index: 50;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 6px 6px 12px;
      border-radius: 999px;
      background: var(--glass-bg);
      backdrop-filter: blur(16px) saturate(170%);
      -webkit-backdrop-filter: blur(16px) saturate(170%);
      border: 1px solid var(--teal-border);
      box-shadow: var(--shadow-dock);
      color: var(--text);
      font-size: 0.76rem;
      font-weight: 600;
      opacity: 0;
      pointer-events: none;
      transform: translateY(12px);
      transition: opacity 200ms var(--ease), transform 200ms var(--ease);
    }
    html[dir="rtl"] .return-toast { padding: 6px 12px 6px 6px; }
    @media (min-width: 1280px) { .return-toast { inset-inline-end: 24px; } }
    .return-toast.is-visible { opacity: 1; pointer-events: auto; transform: translateY(0); }
    .return-go {
      border: 0;
      background: transparent;
      color: var(--teal-text);
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      padding: 2px 4px;
      border-radius: 999px;
    }
    .return-go:hover { text-decoration: underline; }
    .return-x {
      width: 22px;
      height: 22px;
      border-radius: 999px;
      border: 0;
      background: var(--surface-2);
      color: var(--text-3);
      display: inline-grid;
      place-items: center;
      cursor: pointer;
      padding: 0;
    }
    .return-x:hover { color: var(--text); background: var(--surface-3); }

    /* Mobile Floating Bottom Navigation Capsule (<= 639px — Always Fixed & Visible) */
    .mob-dock {
      display: none;
      position: fixed;
      left: 50%;
      bottom: calc(12px + env(safe-area-inset-bottom, 0px));
      z-index: 48;
      width: min(366px, calc(100vw - 24px));
      padding: 5px;
      border-radius: 999px;
      background: var(--glass-bg);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      border: 1px solid var(--glass-border);
      box-shadow: var(--shadow-dock);
      align-items: center;
      justify-content: space-between;
      gap: 4px;
      opacity: 1;
      pointer-events: auto;
      transform: translate(-50%, 0);
    }
    .mob-dock-btn {
      width: 36px;
      height: 36px;
      border-radius: 999px;
      border: 0;
      background: transparent;
      color: var(--text-2);
      display: inline-grid;
      place-items: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: background-color 140ms ease, color 140ms ease;
    }
    .mob-dock-btn:hover, .mob-dock-btn:active { background: var(--surface-2); color: var(--teal-text); }
    .mob-dock-btn:disabled { opacity: 0.3; pointer-events: none; }
    .mob-dock-center {
      flex: 1 1 auto;
      min-width: 0;
      height: 36px;
      border: 1px solid var(--teal-border);
      background: var(--teal-soft);
      color: var(--teal-text);
      border-radius: 999px;
      padding: 0 12px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      cursor: pointer;
      font-size: 0.78rem;
      font-weight: 700;
    }
    .mob-dock-num {
      font-family: var(--font-mono);
      font-size: 0.69rem;
      font-weight: 700;
      opacity: 0.85;
      font-variant-numeric: tabular-nums;
      flex-shrink: 0;
    }
    .mob-dock-title {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* Mobile Quick-Jump Bottom Sheet Drawer */
    .sheet-backdrop, .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 90;
      background: var(--backdrop);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      display: flex;
      align-items: flex-end;
      justify-content: center;
      animation: fadeBg 180ms ease both;
    }
    .modal-backdrop { align-items: center; padding: 16px; }
    @keyframes fadeBg { from { opacity: 0; } to { opacity: 1; } }

    .mob-sheet {
      width: 100%;
      max-width: 480px;
      background: var(--surface);
      border-top: 1px solid var(--glass-border);
      border-radius: 20px 20px 0 0;
      padding: 10px 16px calc(18px + env(safe-area-inset-bottom, 0px));
      box-shadow: var(--shadow-dock);
      max-height: 85vh;
      overflow-y: auto;
    }
    .mob-sheet.is-entering { animation: sheetUp 220ms var(--ease) both; }
    .sheet-filter-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 7px 10px;
      margin-bottom: 10px;
      border-radius: 10px;
      background: var(--amber-soft);
      border: 1px solid var(--amber-border);
      color: var(--amber-text);
      font-size: 0.76rem;
      font-weight: 600;
    }
    .sheet-filter-clear {
      border: 1px solid var(--amber-border);
      background: var(--surface);
      color: var(--amber-text);
      border-radius: 999px;
      padding: 2px 9px;
      font-size: 0.72rem;
      font-weight: 700;
      cursor: pointer;
      flex-shrink: 0;
    }
    @keyframes sheetUp { from { transform: translateY(28px); opacity: 0.5; } to { transform: translateY(0); opacity: 1; } }
    .sheet-handle {
      width: 36px;
      height: 4px;
      border-radius: 999px;
      background: var(--border-strong);
      margin: 0 auto 12px;
    }
    .sheet-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
      padding: 0 4px;
    }
    .sheet-title { margin: 0; font-size: 0.92rem; font-weight: 700; color: var(--text); }
    .sheet-list {
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-bottom: 14px;
    }
    .sheet-item {
      border: 1px solid transparent;
      background: transparent;
      color: var(--text);
      padding: 10px 12px;
      border-radius: 11px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      cursor: pointer;
      text-align: start;
      transition: background-color 140ms ease, border-color 140ms ease;
    }
    .sheet-item:hover { background: var(--surface-2); }
    .sheet-item.is-active {
      background: var(--teal-soft);
      border-color: var(--teal-border);
    }
    .sheet-item-l { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .sheet-num {

      font-weight: 700;

      padding: 2px 6px;
      flex-shrink: 0;
    }
    .sheet-item.is-active .sheet-num { background: var(--teal-btn); color: #FFFFFF; }
    .sheet-lbl { font-size: 0.87rem; font-weight: 600; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .sheet-quick-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
      padding-top: 12px;

    }
    .sheet-pill-row { display: inline-flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .sheet-act-btn {
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--text-2);
      border-radius: 8px;
      height: 34px;
      padding: 0 11px;
      font-size: 0.76rem;
      font-weight: 600;

      align-items: center;
      gap: 6px;
      cursor: pointer;
    }
    .sheet-act-btn.is-active { background: var(--teal-btn); border-color: var(--teal-btn); color: #FFFFFF; }

    /* Keyboard Shortcuts Modal */
    .sc-modal {
      width: 100%;
      max-width: 430px;
      background: var(--surface);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      padding: 20px 22px 18px;
      box-shadow: var(--shadow-gate);
      animation: popIn 180ms var(--ease) both;
    }
    .sc-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }
    .sc-title { margin: 0; font-size: 0.96rem; font-weight: 700; color: var(--text); }
    .sc-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .sc-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 6px 0;
      border-bottom: 1px solid var(--border-subtle);
      font-size: 0.81rem;
      color: var(--text-2);
    }
    .sc-row:last-child { border-bottom: 0; }
    .sc-keys { display: inline-flex; align-items: center; gap: 4px; flex-shrink: 0; direction: ltr; }
    .sc-k {
      font-family: var(--font-mono);
      font-size: 0.69rem;
      font-weight: 700;
      color: var(--text);
      background: var(--surface-2);
      border: 1px solid var(--border-strong);
      border-bottom-width: 2px;
      border-radius: 5px;
      padding: 1.5px 6px;
      line-height: 1.3;
    }

    /* Interactive SVG Floating Tooltip */
    .viz-tooltip {
      position: fixed;
      top: 0;
      left: 0;
      z-index: 80;
      max-width: 295px;
      padding: 8px 12px;
      border-radius: 9px;
      background: var(--glass-bg);
      backdrop-filter: blur(14px) saturate(160%);
      -webkit-backdrop-filter: blur(14px) saturate(160%);
      border: 1px solid var(--glass-border);
      box-shadow: var(--shadow-tip);
      color: var(--text);
      font-size: 0.76rem;
      line-height: 1.44;
      pointer-events: none;
      opacity: 0;
      transform: translate3d(-9999px, -9999px, 0);
      transition: opacity 110ms ease;
    }
    .viz-tooltip.is-visible { opacity: 1; }
    .viz-tip-title { font-weight: 700; color: var(--text); margin-bottom: 2px; }
    .viz-tip-body { color: var(--text-2); font-variant-numeric: tabular-nums; }

    /* =========================================================================
       SLIDE-OVER / DOCKED CLINICIAN NOTES & ANNOTATIONS DRAWER
       ========================================================================= */
    .notes-backdrop {
      position: fixed;
      inset: 0;
      z-index: 84;
      background: var(--backdrop);
      backdrop-filter: blur(3px);
      -webkit-backdrop-filter: blur(3px);
      animation: fadeBg 180ms ease both;
    }
    .notes-drawer {
      position: fixed;
      top: 0;
      bottom: 0;
      inset-inline-end: 0;
      z-index: 85;
      width: min(392px, 100vw);
      background: var(--surface);
      border-inline-start: 1px solid var(--border-strong);
      box-shadow: var(--shadow-gate);
      display: flex;
      flex-direction: column;
      font-size: 13.5px;
      animation: drawerSlideIn 210ms var(--ease) both;
    }
    @keyframes drawerSlideIn {
      from { transform: translateX(100%); opacity: 0.6; }
      to { transform: translateX(0); opacity: 1; }
    }
    html[dir="rtl"] .notes-drawer { animation-name: drawerSlideInRtl; }
    @keyframes drawerSlideInRtl {
      from { transform: translateX(-100%); opacity: 0.6; }
      to { transform: translateX(0); opacity: 1; }
    }
    @media (min-width: 1180px) {
      .notes-backdrop { display: none !important; }
      .notes-drawer {
        top: 55px;
        width: 372px;
        z-index: 38;
        box-shadow: -8px 0 28px -18px rgba(15, 23, 42, 0.22);
      }
      html[dir="rtl"] .notes-drawer {
        box-shadow: 8px 0 28px -18px rgba(15, 23, 42, 0.22);
      }
      body.notes-open .brief-main {
        margin-inline-start: max(0px, calc((100vw - 372px - min(var(--col-w), 100vw - 372px)) / 2));
        margin-inline-end: 372px;
      }
      body.notes-open .margin-rail {
        opacity: 0;
        pointer-events: none;
      }
      body.notes-open .return-toast { inset-inline-end: 392px; }
      body.notes-open .float-top { inset-inline-end: 392px; }
    }

    .drawer-head {
      padding: 14px 16px 12px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
      flex-shrink: 0;
    }
    .drawer-title {
      margin: 0;
      font-size: 15px;
      font-weight: 700;
      color: var(--text);
      line-height: 1.25;
    }
    .drawer-sub {
      margin: 3px 0 0;
      font-size: 11.5px;
      color: var(--text-3);
      line-height: 1.38;
    }
    .drawer-body {
      flex: 1 1 auto;
      overflow-y: auto;
      padding: 14px 16px 18px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .drawer-block-lbl {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 6px;
      font-size: 11px;
      font-weight: 750;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-3);
    }
    html[dir="rtl"] .drawer-block-lbl { text-transform: none; letter-spacing: 0; font-size: 12px; }
    .drawer-tpl-row {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin-bottom: 7px;
    }
    .drawer-tpl-btn {
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text-2);
      border-radius: 999px;
      padding: 2.5px 9px;
      font-size: 11.2px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 140ms ease, border-color 140ms ease, color 140ms ease;
    }
    .drawer-tpl-btn:hover {
      background: var(--teal-soft);
      border-color: var(--teal-border);
      color: var(--teal-text);
    }
    .drawer-textarea {
      width: 100%;
      min-height: 112px;
      resize: vertical;
      border: 1px solid var(--border-strong);
      border-radius: 9px;
      background: var(--bg);
      color: var(--text);
      padding: 9px 11px;
      font-size: 13px;
      line-height: 1.54;
      display: block;
    }
    .drawer-textarea:focus {
      outline: none;
      border-color: var(--teal);
      box-shadow: 0 0 0 2.5px var(--teal-soft);
      background: var(--surface);
    }
    .drawer-textarea::placeholder { color: var(--text-3); }

    .drawer-feed {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .drawer-empty {
      margin: 0;
      padding: 14px 12px;
      border-radius: 9px;
      border: 1px dashed var(--border-strong);
      background: var(--bg);
      color: var(--text-3);
      font-size: 12.2px;
      line-height: 1.5;
    }
    .drawer-item {
      padding: 10px 11px;
      border-radius: 9px;
      background: var(--bg);
      border: 1px solid var(--border);
      transition: border-color 140ms ease, background-color 140ms ease;
    }
    .drawer-item.is-pinned { border-inline-start: 2.5px solid var(--amber); }
    .drawer-item:hover { border-color: var(--border-strong); }
    .drawer-item-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 6px;
      margin-bottom: 4px;
    }
    .drawer-item-jump {
      border: 0;
      background: transparent;
      padding: 0;
      text-align: start;
      cursor: pointer;
      display: flex;
      align-items: baseline;
      gap: 6px;
      min-width: 0;
      flex: 1 1 auto;
    }
    .drawer-item-num {
      font-family: var(--font-mono);
      font-size: 10.5px;
      font-weight: 700;
      color: var(--teal-text);
      background: var(--teal-soft);
      border-radius: 5px;
      padding: 1px 5px;
      flex-shrink: 0;
    }
    .drawer-item-title {
      font-size: 12.5px;
      font-weight: 700;
      color: var(--text);
      line-height: 1.32;
    }
    .drawer-item-jump:hover .drawer-item-title { color: var(--teal-text); text-decoration: underline; }
    .drawer-item-acts {
      display: inline-flex;
      align-items: center;
      gap: 2px;
      flex-shrink: 0;
    }
    .drawer-mini-btn {
      width: 22px;
      height: 22px;
      border-radius: 5px;

    }
    .drawer-mini-btn:hover { background: var(--surface-2); color: var(--text); }

    .drawer-item-note {
      margin: 4px 0 0;
      font-size: 12.2px;
      color: var(--text-2);
      line-height: 1.48;
      white-space: pre-wrap;
      overflow-wrap: break-word;
      unicode-bidi: plaintext;
    }
    .drawer-item-pin-lbl {
      display: inline-flex;

      font-size: 11px;

      color: var(--amber-text);
      margin-top: 2px;
    }

    .drawer-foot {
      padding: 12px 16px calc(14px + env(safe-area-inset-bottom, 0px));
      border-top: 1px solid var(--border);
      background: var(--surface);
      display: flex;
      flex-direction: column;
      gap: 10px;
      flex-shrink: 0;
    }
    .drawer-print-toggle {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;

      font-size: 12px;
      font-weight: 600;
      color: var(--text-2);
    }
    .drawer-acts {
      display: flex;
      align-items: center;
      flex-wrap: nowrap;
      gap: 5px;
    }
    .drawer-act-btn {
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--text);
      border-radius: 8px;
      padding: 6px 8.5px;
      font-size: 11.4px;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4.5px;
      transition: background-color 140ms ease, border-color 140ms ease, color 140ms ease;
    }
    .drawer-act-btn:hover { background: var(--surface-hover); border-color: var(--border-strong); }
    .drawer-act-btn.is-primary {
      background: var(--teal-btn);
      border-color: var(--teal-btn);
      color: #FFFFFF;
      flex: 1 1 auto;
    }
    .drawer-act-btn.is-primary:hover { background: var(--teal-btn-hover); }
    .drawer-act-btn.is-danger { color: var(--err); border-color: var(--coral-border); background: transparent; }
    .drawer-act-btn.is-danger:hover { background: var(--err-soft); }
    .drawer-act-btn:disabled { opacity: 0.4; pointer-events: none; }

    /* =========================================================================
       V3: INTERVIEW MODE, SAVED ARCHIVE, BULLET SAVE, SELECTION PILL & REPO SYNC
       ========================================================================= */
    .card-act-btn.is-asked {
      color: var(--info-text);
      background: var(--info-soft);
      border-color: var(--info-border);
      opacity: 1;
    }
    .is-asked-card {
      border-color: var(--info-border) !important;
    }
    .card-act-btn.is-saved {
      color: var(--amber-text);
      background: var(--amber-soft);
      border-color: var(--amber-border);
      opacity: 1;
    }
    .card-act-btn.is-saved svg { fill: currentColor; }

    /* Per-Paragraph / Bullet Quiet Save Button */
    .detail-point {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
    }
    .dp-txt { flex: 1 1 auto; min-width: 0; }
    .bullet-save-btn {
      width: 22px;
      height: 22px;
      padding: 0;
      border-radius: 5px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--text-3);
      display: inline-grid;
      place-items: center;
      cursor: pointer;
      flex-shrink: 0;
      opacity: 0.34;
      margin-top: 1px;
      transition: opacity 140ms ease, background-color 140ms ease, color 140ms ease, border-color 140ms ease;
    }
    .detail-point:hover .bullet-save-btn,
    .bullet-save-btn:focus-visible,
    .bullet-save-btn.is-saved { opacity: 1; }
    @media (hover: none) { .bullet-save-btn { opacity: 0.72; } }
    .bullet-save-btn:hover { background: var(--surface-2); border-color: var(--border); color: var(--text); }
    .bullet-save-btn.is-saved { color: var(--amber-text); background: var(--amber-soft); border-color: var(--amber-border); }
    .bullet-save-btn.is-saved svg { fill: currentColor; }

    .chief-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 6px;
    }

    /* Workspace Switcher Pills Inside Lens Bar */
    .lens-sep {
      width: 1px;
      height: 18px;
      background: var(--border-strong);
      margin: 0 2px;
      flex-shrink: 0;
    }
    .lens-pill.is-view {
      border-color: var(--teal-border);
      background: var(--teal-wash);
      color: var(--teal-text);
    }
    .lens-pill.is-view.is-active {
      background: var(--teal-btn);
      border-color: var(--teal-btn);
      color: #FFFFFF;
    }
    .lens-pill.is-saved-view {
      border-color: var(--amber-border);
      background: var(--amber-soft);
      color: var(--amber-text);
    }
    .lens-pill.is-saved-view.is-active {
      background: var(--amber);
      border-color: var(--amber);
      color: #FFFFFF;
    }
    .lens-cnt {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 700;
      padding: 0 5px;
      border-radius: 999px;
      background: rgba(15, 23, 42, 0.08);
      font-variant-numeric: tabular-nums;
    }
    .lens-pill.is-active .lens-cnt { background: rgba(255, 255, 255, 0.24); color: #FFFFFF; }

    /* Dedicated Workspace Views (Entretien / Saved Archive / Mobile Notes) */
    .ws-view {
      display: flex;
      flex-direction: column;
      gap: 18px;
      animation: briefFade 180ms var(--ease) both;
    }
    .ws-head {
      display: flex;

      flex-wrap: wrap;
      gap: 10px 16px;
      padding-bottom: 14px;

    .ws-title {
      margin: 0 0 4px;

      font-weight: 750;
      color: var(--text);
      line-height: 1.25;

    .ws-sub { margin: 0; font-size: 0.84rem; color: var(--text-3); line-height: 1.5; }
    .ws-block-title {
      margin: 0 0 10px;
      font-size: 0.74rem;
      font-weight: 750;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-3);

      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    html[dir="rtl"] .ws-block-title { text-transform: none; letter-spacing: 0; font-size: 0.82rem; }

    /* Consultation Timer Pill */
    .timer-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 6px 4px 11px;
      border-radius: 999px;
      background: var(--surface);
      border: 1px solid var(--border);
      box-shadow: var(--shadow-card);
      flex-shrink: 0;
    }
    html[dir="rtl"] .timer-pill { padding: 4px 11px 4px 6px; }
    .timer-val {
      font-family: var(--font-mono);
      font-size: 0.84rem;
      font-weight: 700;
      color: var(--teal-text);

    .timer-btn {
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--text-2);
      border-radius: 999px;
      padding: 3px 9px;
      font-size: 0.7rem;
      font-weight: 700;
      cursor: pointer;
    }
    .timer-btn.is-running { background: var(--teal-btn); border-color: var(--teal-btn); color: #FFFFFF; }
    .timer-btn:hover { border-color: var(--border-strong); color: var(--text); }
    .timer-btn.is-running:hover { color: #FFFFFF; background: var(--teal-btn-hover); }

    /* Live Interview Cards */
    .iv-list { display: flex; flex-direction: column; gap: 10px; }
    .iv-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-inline-start: 3px solid var(--info);
      border-radius: var(--r-md);

      height: 24px;

      place-items: center;
      cursor: pointer;
      flex-shrink: 0;
      margin-top: 1px;
      transition: all 140ms ease;
    }

    .iv-card.is-done .iv-check { background: var(--teal-btn); border-color: var(--teal-btn); color: #FFFFFF; }
    .iv-title { margin: 0 0 3px; font-size: 0.9rem; font-weight: 700; color: var(--text); line-height: 1.35; }
    .iv-prompt { margin: 0; font-size: 0.82rem; color: var(--text-2); line-height: 1.5; }
    .iv-meta-acts { display: inline-flex; align-items: center; gap: 5px; flex-shrink: 0; }
    .iv-jump-btn {
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--teal-text);
      border-radius: 999px;
      padding: 2.5px 9px;
      font-size: 0.7rem;

      line-height: 1.48;
      unicode-bidi: plaintext;

    .iv-answer-ta:focus { outline: none; border-color: var(--teal); background: var(--surface); box-shadow: 0 0 0 2.5px var(--teal-soft); }
    .iv-answer-ta::placeholder { color: var(--text-3); }

    /* Dedicated Saved Archive Cards */
    .saved-tabs {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
    }
    .saved-quote-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-inline-start: 3px solid var(--amber);
      border-radius: var(--r-md);
      padding: 13px 15px;
      box-shadow: var(--shadow-card);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .saved-quote-card.is-card-bm { border-inline-start-color: var(--teal); }

      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
    }
    .saved-src { display: inline-flex; align-items: center; gap: 6px; min-width: 0; }
    .saved-src-title { font-size: 0.8rem; font-weight: 700; color: var(--text-2); }

      margin: 0;
      padding: 8px 11px;
      border-radius: 7px;
      background: var(--bg);
      border: 1px solid var(--border-subtle);
      font-size: 0.85rem;
      color: var(--text);
      line-height: 1.58;
      unicode-bidi: plaintext;
    }
    .saved-note-in {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 7px;
      background: var(--bg);
      color: var(--text);
      padding: 6px 9px;
      font-size: 0.8rem;
      unicode-bidi: plaintext;
    }
    .saved-note-in:focus { outline: none; border-color: var(--teal); background: var(--surface); }

    /* Highlight-to-Save Floating Selection Pill */
    .sel-pop {
      position: fixed;
      top: 0;
      left: 0;
      z-index: 96;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px;
      border-radius: 999px;
      background: #0F172A;
      color: #FFFFFF;
      border: 1px solid rgba(255, 255, 255, 0.14);
      box-shadow: 0 10px 28px -6px rgba(15, 23, 42, 0.42);
      transform: translate3d(-9999px, -9999px, 0);
      opacity: 0;
      pointer-events: none;
      transition: opacity 130ms ease;
    }
    html[data-theme="dark"] .sel-pop { background: #1E293B; border-color: rgba(45, 212, 191, 0.35); }
    .sel-pop.is-visible { opacity: 1; pointer-events: auto; }
    .sel-pop-btn {
      border: 0;
      background: transparent;
      color: #FFFFFF;
      border-radius: 999px;
      padding: 5px 11px;
      font-size: 12px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      cursor: pointer;
      white-space: nowrap;
    }
    .sel-pop-btn:hover { background: rgba(255, 255, 255, 0.14); }
    .sel-pop-btn.is-primary { background: var(--teal-btn); }
    .sel-pop-btn.is-primary:hover { background: var(--teal-btn-hover); }

    /* Subtle Feedback Toast */
    .mini-toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translate(-50%, 14px);
      z-index: 98;
      padding: 8px 15px;
      border-radius: 999px;
      background: #0F172A;
      color: #FFFFFF;
      font-size: 12.5px;
      font-weight: 600;
      box-shadow: var(--shadow-dock);
      opacity: 0;
      pointer-events: none;
      transition: opacity 180ms ease, transform 180ms var(--ease);
      white-space: nowrap;
      max-width: calc(100vw - 28px);
      overflow: hidden;
      text-overflow: ellipsis;
    }
    html[data-theme="dark"] .mini-toast { background: #0D9488; }
    .mini-toast.is-visible { opacity: 1; transform: translate(-50%, 0); }

    /* Encrypted GitHub Repo Sync Card */
    .sync-card {
      padding: 11px 12px;
      border-radius: 10px;
      background: var(--bg);
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 9px;
    }
    .sync-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 6px 8px;
    }
    .sync-status {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11.4px;
      font-weight: 600;
      color: var(--text-2);
      min-width: 0;
      flex: 1 1 150px;
      line-height: 1.35;
    }
    .sync-dot {
      width: 7px;
      height: 7px;
      border-radius: 999px;
      background: var(--text-3);
      flex-shrink: 0;
    }
    .sync-dot.is-on { background: var(--teal); box-shadow: 0 0 0 3px var(--teal-soft); }
    .sync-cfg-btn {
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-2);
      border-radius: 7px;
      padding: 3px 8px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .sync-cfg-btn:hover { border-color: var(--teal-border); color: var(--teal-text); }
    .sync-btn-row { display: flex; align-items: center; gap: 6px; }
    .sync-form {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding-top: 8px;
      border-top: 1px dashed var(--border);
    }
    .sync-field { display: flex; flex-direction: column; gap: 3px; }
    .sync-field label { font-size: 11px; font-weight: 600; color: var(--text-2); }
    .sync-in {
      width: 100%;
      height: 33px;
      padding: 0 9px;
      border-radius: 7px;
      border: 1px solid var(--border-strong);
      background: var(--surface);
      color: var(--text);
      font-family: var(--font-mono);
      font-size: 11.5px;
    }
    .sync-in:focus { outline: none; border-color: var(--teal); box-shadow: 0 0 0 2px var(--teal-soft); }
    .sync-two { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }
    .sync-hint { margin: 0; font-size: 10.8px; color: var(--text-3); line-height: 1.4; }
    .sync-msg {
      margin: 0;
      font-size: 11.5px;
      font-weight: 600;
      padding: 6px 9px;
      border-radius: 7px;
      background: var(--teal-soft);
      color: var(--teal-text);
      word-break: break-word;
    }
    .sync-msg.is-err { background: var(--err-soft); color: var(--err); }
    .sync-mode-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4px;
      padding: 2.5px;
      border-radius: 8px;
      background: var(--surface-2);
      border: 1px solid var(--border);
    }
    .sync-mode-btn {
      border: 0;
      background: transparent;
      color: var(--text-3);
      border-radius: 6px;
      padding: 5px 8px;
      font-size: 11.2px;
      font-weight: 700;
      cursor: pointer;
    }
    .sync-mode-btn.is-active {
      background: var(--surface);
      color: var(--teal-text);
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.08);
    }
    .sync-enc-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-size: 11.2px;
      font-weight: 600;
      color: var(--text-2);
      padding: 2px 0;
    }
    .drawer-acts-sec {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 5px;
    }
    .drawer-acts-sec .drawer-act-btn {
      flex: 1 1 auto;
      padding: 5px 7px;
      font-size: 11px;
    }
    .notes-inline-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r-md);
      padding: 14px;
      box-shadow: var(--shadow-card);
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .ws-empty {
      padding: 24px 16px;
      border-radius: var(--r-md);
      border: 1px dashed var(--border-strong);
      background: var(--surface);
      text-align: center;
      color: var(--text-3);
      font-size: 0.84rem;
      line-height: 1.55;
    }
    .ws-back-btn {
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-2);
      border-radius: 999px;
      padding: 4px 11px;
      font-size: 0.74rem;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      cursor: pointer;
    }
    .ws-back-btn:hover { border-color: var(--teal-border); color: var(--teal-text); background: var(--teal-wash); }


    /* PWA Install Pill Button (Hidden Until Chrome Fires beforeinstallprompt) */
    .install-btn {
      height: 31px;
      padding: 0 10px;
      border-radius: 8px;
      border: 1px solid var(--teal-border);
      background: var(--teal-soft);
      color: var(--teal-text);
      font-size: 11.6px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
      transition: background-color 150ms ease, color 150ms ease, border-color 150ms ease;
    }
    .install-btn:hover { background: var(--teal-btn); color: #FFFFFF; border-color: var(--teal-btn); }
    .gate-install-btn {
      margin-top: 12px;
      width: 100%;
      height: 38px;
      border-radius: 9px;
      border: 1px solid var(--teal-border);
      background: var(--teal-wash);
      color: var(--teal-text);
      font-size: 0.82rem;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      cursor: pointer;
    }
    .gate-install-btn:hover { background: var(--teal-soft); }

    /* Mobile-First Section Quick-Jump Strip & 4-Tab Bottom App Bar */
    .mob-sec-strip { display: none; }
    .triage-swipe-hint { display: none; font-size: 0.72rem; font-weight: 600; color: var(--teal-text); }
    .mob-search-toggle, .mob-menu-btn { display: none; }

    .mob-tabbar {
      display: none;
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 55;
      background: var(--chrome);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      border-top: 1px solid var(--border-strong);
      padding: 5px 6px calc(6px + env(safe-area-inset-bottom, 0px));
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 3px;
    }
    .mob-tab {
      position: relative;
      border: 0;
      background: transparent;
      color: var(--text-3);
      padding: 4px 2px 3px;
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      cursor: pointer;
      min-height: 48px;
      transition: color 150ms ease, background-color 150ms ease;
    }
    .mob-tab-ico {
      position: relative;
      width: 44px;
      height: 26px;
      border-radius: 999px;
      display: inline-grid;
      place-items: center;
      transition: background-color 160ms var(--ease);
    }
    .mob-tab.is-active { color: var(--teal-text); font-weight: 700; }
    .mob-tab.is-active .mob-tab-ico { background: var(--teal-soft); }
    .mob-tab-lbl { font-size: 10.6px; font-weight: 600; line-height: 1.15; white-space: nowrap; }
    .mob-tab.is-active .mob-tab-lbl { font-weight: 700; }
    .mob-tab-badge {
      position: absolute;
      top: -2px;
      inset-inline-end: 4px;
      min-width: 15px;
      height: 15px;
      padding: 0 4px;
      border-radius: 999px;
      background: var(--teal-btn);
      color: #FFFFFF;
      font-family: var(--font-mono);
      font-size: 9px;
      font-weight: 700;
      line-height: 15px;
      text-align: center;
    }
    .mob-tab[data-tab="saved"] .mob-tab-badge { background: var(--amber); }
    .mob-tab[data-tab="interview"] .mob-tab-badge { background: var(--info); }

    /* =========================================================================
       RESPONSIVE BREAKPOINTS (MOBILE-FIRST <= 767px + ZERO OVERFLOW AT 390px)
       ========================================================================= */
    @media (min-width: 1024px) and (max-width: 1199px) {
      .chrome-inner { padding: 0 12px; gap: 6px; }
      .nav-link { padding: 4.5px 6px; font-size: 11.6px; gap: 3px; }
      .nav-num { display: none; }
      .search-shell { width: 136px; flex: 0 1 136px; }
      .seg-btn { padding: 3.5px 6.5px; font-size: 11.2px; }
      .ico-btn { width: 29px; height: 29px; }
    }

    @media (max-width: 1023px) {
      .chrome-inner {
        flex-wrap: wrap;
        padding: 8px 14px;
        gap: 7px 10px;
      }
      .chrome-controls { order: 1; width: 100%; justify-content: space-between; flex-wrap: wrap; gap: 7px; }
      .nav-links { order: 2; width: 100%; padding-top: 4px; border-top: 1px solid var(--border-subtle); }
      .search-shell { flex: 1 1 180px; width: auto; min-width: 148px; }
      .search-kbd { display: none; }
    }

    @media (max-width: 860px) {
      .triage-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

    @media (max-width: 767px) {
      .mob-tabbar { display: grid; }
      .mob-dock { display: none !important; }
      .float-top { display: none !important; }
      #notesBtn { display: none; }
      .lens-pill.is-view, .lens-pill.is-saved-view, .lens-sep, .ws-back-btn { display: none; }
      .brief-main { padding: 18px 16px calc(86px + env(safe-area-inset-bottom, 0px)); }
      .doc-title { font-size: 1.48rem; }
      html[dir="rtl"] .doc-title { font-size: 1.44rem; }
      .goals-list { grid-template-columns: 1fr; gap: 9px; }
      .safety-grid { grid-template-columns: 1fr; }
      .repleted-grid { grid-template-columns: 1fr; }
      .normal-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .q-grid { grid-template-columns: 1fr; }
      .return-toast, .mini-toast { bottom: calc(70px + env(safe-area-inset-bottom, 0px)); }
    }

    @media (max-width: 639px) {
      /* True Mobile-First Compact Single-Row Sticky App Header */
      .sticky-chrome { position: sticky; top: 0; z-index: 44; }
      .sticky-chrome .nav-links { display: none; }
      .mobile-top-progress { display: none; }
      #scBtn, #readShell, #printBtn, #themeBtn { display: none; }
      .mob-search-toggle, .mob-menu-btn { display: inline-grid; }

      .chrome-inner { padding: 6px 10px; min-height: 44px; gap: 5px; }
      .chrome-controls { gap: 5px; align-items: center; }
      .search-shell { display: none; order: 2; flex: 1 1 100%; width: 100%; }
      .search-shell.is-mob-open { display: block; padding-top: 4px; }
      .seg-group { flex: 0 1 auto; justify-content: flex-start; gap: 4px; }
      .util-btns { gap: 3px; flex-shrink: 0; }
      .ico-btn { width: 30px; height: 30px; border-radius: 7px; }
      .install-btn { width: 30px; height: 30px; padding: 0; justify-content: center; border-radius: 7px; }
      .install-btn span { display: none; }
      .seg-btn { padding: 3.5px 6px; font-size: 11px; }

      /* Mobile Horizontal Section Quick-Jump Strip */
      .mob-sec-strip {
        display: flex;
        align-items: center;
        gap: 6px;
        overflow-x: auto;
        scrollbar-width: none;
        -ms-overflow-style: none;
        padding: 2px 0 10px;
        margin-bottom: 6px;
      }
      .mob-sec-strip::-webkit-scrollbar { display: none; }
      .mob-sec-chip {
        border: 1px solid var(--border);
        background: var(--surface);
        color: var(--text-2);
        border-radius: 999px;
        padding: 4.5px 10px;
        font-size: 0.74rem;
        font-weight: 600;
        white-space: nowrap;
        flex-shrink: 0;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        cursor: pointer;
      }
      .mob-sec-chip.is-active {
        background: var(--teal-soft);
        border-color: var(--teal-border);
        color: var(--teal-text);
        font-weight: 700;
      }

      /* Mobile Swipeable 4-Card Triage Carousel (Keeps Section 01 Above the Fold!) */
      .triage-strip { margin-bottom: 10px; }
      .triage-sub { display: none; }
      .triage-swipe-hint { display: inline; }
      .triage-grid {
        display: flex;
        overflow-x: auto;
        scroll-snap-type: x mandatory;
        gap: 10px;
        padding-bottom: 4px;
        scrollbar-width: none;
        -ms-overflow-style: none;
      }
      .triage-grid::-webkit-scrollbar { display: none; }
      .triage-card {
        flex: 0 0 82%;
        scroll-snap-align: start;
        padding: 11px 13px 10px;
        gap: 5px;
      }

      .brief-main { padding: 12px 14px calc(86px + env(safe-area-inset-bottom, 0px)); }
      .masthead { margin-bottom: 12px; padding-bottom: 11px; }
      .lens-bar { padding: 7px 0 10px; margin-bottom: 10px; gap: 7px; }
      .lens-pills { flex-wrap: nowrap; overflow-x: auto; max-width: 100%; scrollbar-width: none; -ms-overflow-style: none; padding-bottom: 2px; }
      .lens-pills::-webkit-scrollbar { display: none; }
      .ed-section, .brief-root.is-brief .ed-section { padding-top: 22px; margin-top: 22px; scroll-margin-top: 58px; }
      .prose-item { padding: 13px 13px; }
      .card-act-btn { width: 29px; height: 29px; }
      .bullet-save-btn { width: 26px; height: 26px; }
      .figure-card { padding: 14px 13px 13px; border-radius: var(--r-md); }
      .normal-grid { grid-template-columns: 1fr; }
      .drawer-acts { flex-wrap: wrap; }
      .sync-two { grid-template-columns: 1fr; }

      /* Mobile Vertical Hairline Lifespan Rail */
      .life-rail {
        grid-template-columns: 1fr;
        gap: 10px;
        padding-inline-start: 20px;
      }
      .life-rail::before {
        content: "";
        position: absolute;
        top: 12px;
        bottom: 12px;
        inset-inline-start: 5px;
        inset-inline-end: auto;
        width: 1px;
        background: var(--border-strong);
        z-index: 0;
      }
      .life-rail.is-filtered::before { display: none; }
      .life-node { align-items: flex-start; text-align: start; gap: 2px; padding: 4px 6px; }
      .life-dot-wrap { position: static; width: auto; height: auto; }
      .life-dot-wrap::before { display: none; }
      .life-dot { position: absolute; inset-inline-start: -20px; top: 8px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
    }

    /* =========================================================================
       EXACT 2-PAGE A4 EDITORIAL PRINT ARCHITECTURE (FR / AR / EN)
       ========================================================================= */
    @page { size: A4 portrait; margin: 4.5mm 6.5mm; }
    @media print {
      * {
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
        animation: none !important;
        transition: none !important;
      }
      :root, html[data-theme="dark"] {
        color-scheme: light;
        --bg: #FFFFFF;
        --surface: #FFFFFF;
        --surface-2: #F8FAFC;
        --surface-3: #F1F5F9;
        --border: #CBD5E1;
        --border-subtle: #E2E8F0;
        --border-strong: #94A3B8;
        --gridline: #E2E8F0;
        --text: #0F172A;
        --text-2: #1E293B;
        --text-3: #475569;
        --teal: #0F766E;
        --teal-text: #0D5E58;
        --teal-soft: #EDF7F6;
        --teal-wash: #F5FBFA;
        --teal-band: #E7F5F3;
        --teal-border: #99D5CF;
        --coral: #C2410C;
        --coral-text: #9A3412;
        --coral-soft: #FEF2EE;
        --coral-wash: #FFF6F3;
        --coral-border: #F5C2B1;
        --amber: #B45309;
        --amber-text: #92400E;
        --amber-soft: #FDF8EC;
        --amber-border: #E8CF9C;
        --info: #1D4ED8;
        --info-text: #1E40AF;
        --info-soft: #EFF6FF;
        --info-border: #BFDBFE;
        --slate-viz: #64748B;
        --bar-hit: #0F766E;
        --bar-swap: #B45309;
        --bar-stale: #C2410C;
        --bar-guess: #526175;
        --bar-text: #FFFFFF;
        --track-bg: #E2E8F0;
        --zone-bg: #D5EFEA;
        --zone-edge: #6EC0B7;
        --caution-bg: #FBEBD0;
      }

      /* Hide all interactive & screen-only chrome cleanly */
      .sticky-chrome, .gate-wrap, .labs-filter, .labs-reveal-btn, .item-expand, .viz-tooltip, .search-empty,
      .margin-rail, .mobile-top-progress, .mob-dock, .mob-tabbar, .mob-sec-strip, .float-top, .return-toast,
      .sheet-backdrop, .modal-backdrop, .notes-backdrop, .notes-drawer, .read-pop, .sel-pop, .mini-toast,
      .triage-strip, .lens-bar, .brief-mode-bar, .sec-expand-btn, .item-tags, .nav-dot,
      .sec-top-mini, .sec-rule, .sec-badge, .xref-row, .q-check, .q-foot, .brief-endcap, .safety-ico,
      .card-act-btn, .bullet-save-btn, .note-editor, .card-note-edit-lbl, .install-btn, .gate-install-btn {
        display: none !important;
      }
      /* Default Print keeps the exact 2-page A4 medical brief clean; clinician notes print ONLY when opted in */
      body:not(.print-with-notes) .card-note-view,
      body:not(.print-with-notes) .print-notes-section {
        display: none !important;
      }
      body.print-with-notes .card-note-view {
        display: block !important;
        margin-top: 0.7mm !important;
        padding: 0.7mm 1.5mm !important;
        border-radius: 3px !important;
        background: var(--teal-wash) !important;
        border: 0.5pt solid var(--teal-border) !important;
        border-inline-start: 1.5pt solid var(--teal) !important;
      }
      body.print-with-notes .card-note-head { margin-bottom: 0.2mm; }
      body.print-with-notes .card-note-badge { font-size: 5.8pt !important; }
      body.print-with-notes .card-note-text { font-size: 6.4pt !important; line-height: 1.2 !important; }
      body.print-with-notes .print-notes-section {
        display: block !important;
        margin-top: 3mm;
        padding-top: 2mm;
        border-top: 1pt solid var(--teal);
        break-inside: avoid;
      }
      body.print-with-notes .print-notes-title {
        margin: 0 0 1.2mm;
        font-size: 8.4pt;
        font-weight: 700;
        color: var(--teal-text);
      }
      body.print-with-notes .print-notes-gen {
        margin: 0 0 1.4mm;
        font-size: 7pt;
        line-height: 1.28;
        white-space: pre-wrap;
        color: var(--text);
      }
      body.print-with-notes .print-notes-list {
        margin: 0;
        padding-inline-start: 4mm;
        font-size: 6.7pt;
        line-height: 1.26;
        color: var(--text-2);
      }
      body.print-with-notes .print-notes-list li { margin-bottom: 0.8mm; }

      mark.hl, mark.hl.is-current {
        background: transparent !important;
        color: inherit !important;
        box-shadow: none !important;
        padding: 0;
        font-weight: inherit;
      }

      /* Print ALWAYS shows Full details and all 13 labs */

      .labs-head-bar { margin-bottom: 0.7mm; }

      .spot-val { font-size: 7.4pt; }

      .lab-subblock { margin-top: 0.65mm; }

      .lab-subtitle { font-size: 6.2pt !important; }
      .lab-subnote { font-size: 6.1pt; }

      function b64ToBytes(b64) {
        const bin = atob(String(b64 || "").replace(/\s+/g, ""));

        let bin = "";
        const chunk = 0x8000;
        for (let i = 0; i < arr.length; i += chunk) {
          bin += String.fromCharCode.apply(null, arr.subarray(i, i + chunk));
        }
        return btoa(bin);
      }

      async function encryptWithPin(obj, pin, iterations) {
        const clean = String(pin || "").replace(/\s+/g, "");
        if (!clean) throw new Error("Missing session PIN");
        const salt = crypto.getRandomValues(new Uint8Array(16));
        const iv = crypto.getRandomValues(new Uint8Array(12));
        const iter = iterations || 120000;
        const keyMat = await crypto.subtle.importKey("raw", new TextEncoder().encode(clean), { name: "PBKDF2" }, false, ["deriveKey"]);
        const aesKey = await crypto.subtle.deriveKey(
          { name: "PBKDF2", salt, iterations: iter, hash: "SHA-256" },
          keyMat, { name: "AES-GCM", length: 256 }, false, ["encrypt"]
        );
        const ctBuf = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, aesKey, new TextEncoder().encode(JSON.stringify(obj)));
        return {
          v: 1,
          alg: "AES-256-GCM",
          kdf: "PBKDF2-SHA256",
          iter,
          salt: bytesToB64(salt),
          iv: bytesToB64(iv),
          ct: bytesToB64(new Uint8Array(ctBuf))
        };
      }

        const keyMat = await crypto.subtle.importKey("raw", new TextEncoder().encode(clean), { name: "PBKDF2" }, false, ["deriveKey"]);

        const buf = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64ToBytes(env.iv) }, aesKey, b64ToBytes(env.ct));
        return JSON.parse(new TextDecoder().decode(buf));

      /* =======================================================================
         SEARCH NORMALIZATION & BIDI FORMATTER
         ======================================================================= */
      function normChar(ch) {
        if (/[\u064B-\u065F\u0670\u0640]/.test(ch)) return "";
        if (/[\u0622\u0623\u0625\u0671]/.test(ch)) return "\u0627";
        if (ch === "\u0629") return "\u0647";
        if (ch === "\u0649") return "\u064A";
        return ch.normalize("NFD").replace(/[\u0300-\u036F]/g, "").toLowerCase();
      }

      function normText(str) {
        const raw = String(str ?? "");
        let out = "";
        for (let i = 0; i < raw.length; i++) out += normChar(raw[i]);
        return out;
      }

      function findMatchRanges(raw, qNorm) {
        if (!qNorm) return [];
        const chars = [], starts = [], ends = [];
        for (let i = 0; i < raw.length; i++) {
          const nc = normChar(raw[i]);
          for (let j = 0; j < nc.length; j++) {
            chars.push(nc[j]);
            starts.push(i);
            ends.push(i + 1);
          }
        }
        const hay = chars.join("");
        const ranges = [];
        let pos = 0;
        while (pos <= hay.length - qNorm.length) {
          const idx = hay.indexOf(qNorm, pos);
          if (idx === -1) break;
          let rEnd = ends[idx + qNorm.length - 1];
          while (rEnd < raw.length && normChar(raw[rEnd]) === "" && /[\u0300-\u036F\u064B-\u065F\u0670]/.test(raw[rEnd])) rEnd++;
          ranges.push([starts[idx], rEnd]);
          pos = idx + qNorm.length;
        }
        return ranges;
      }

      function renderSliceWithHighlights(raw, sliceStart, sliceEnd, ranges) {
        if (!ranges.length) return esc(raw.slice(sliceStart, sliceEnd));
        let out = "", cur = sliceStart;
        for (let i = 0; i < ranges.length; i++) {
          const rs = Math.max(sliceStart, ranges[i][0]);
          const re = Math.min(sliceEnd, ranges[i][1]);
          if (re <= rs) continue;
          if (rs > cur) out += esc(raw.slice(cur, rs));
          out += '<mark class="hl">' + esc(raw.slice(rs, re)) + "</mark>";
          cur = re;
        }
        if (cur < sliceEnd) out += esc(raw.slice(cur, sliceEnd));
        return out;
      }

      function fmt(s, isRtl, qNorm) {
        const raw = String(s ?? "");
        const ranges = qNorm ? findMatchRanges(raw, qNorm) : [];
        if (!isRtl) return renderSliceWithHighlights(raw, 0, raw.length, ranges);
        LTR_RE.lastIndex = 0;
        let out = "", last = 0, m;
        while ((m = LTR_RE.exec(raw)) !== null) {
          if (m.index > last) out += renderSliceWithHighlights(raw, last, m.index, ranges);
          const full = m[0];
          const core = full.replace(/(?:\s+[+\-–—·=→/]+|[.,:;–—\-·=→/\s]+)+$/, "");
          const coreEnd = m.index + core.length;
          const fullEnd = m.index + full.length;
          if (core) {
            const cls = core.length <= 13 ? ' class="nowrap-bdi"' : "";
            out += '<bdi dir="ltr"' + cls + ">" + renderSliceWithHighlights(raw, m.index, coreEnd, ranges) + "</bdi>";
            if (fullEnd > coreEnd) out += renderSliceWithHighlights(raw, coreEnd, fullEnd, ranges);
          } else {
            out += renderSliceWithHighlights(raw, m.index, fullEnd, ranges);
          }
          last = fullEnd;
        }
        if (last < raw.length) out += renderSliceWithHighlights(raw, last, raw.length, ranges);
        return out;
      }

      function findBulletPassage(bulletId) {

      function addSavedPassage(entry) {
        const cleanText = String(entry.text || "").replace(/\s+/g, " ").trim();
        if (!cleanText) return null;
        if (entry.bulletId) {
          const existing = findBulletPassage(entry.bulletId);
          if (existing) return existing;
        }
        const dup = savedPassages.find((p) => p.text === cleanText && p.sourceKey === (entry.sourceKey || ""));
        if (dup) return dup;
        const item = {
          id: "sp-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 6),
          sourceKey: entry.sourceKey || "",
          secId: entry.secId || "priorities",
          secNum: entry.secNum || "01",
          sourceTitle: entry.sourceTitle || "",
          label: entry.label || "",
          text: cleanText,
          note: entry.note || "",
          kind: entry.kind || "excerpt",
          bulletId: entry.bulletId || "",
          createdAt: new Date().toISOString()
        };
        savedPassages.unshift(item);
        scheduleWorkspaceSave();
        syncAllBadges();
        return item;
      }

      function hideSelPop() {
        pendingSel = null;
        if (selPop) {
          selPop.classList.remove("is-visible");
          selPop.style.transform = "translate3d(-9999px, -9999px, 0)";
        }
      }

      function evaluateTextSelection() {
        if (!data || !data[lang] || appShell.hidden || activeView !== "brief") { hideSelPop(); return; }
        const sel = window.getSelection && window.getSelection();
        if (!sel || sel.isCollapsed || sel.rangeCount === 0) { hideSelPop(); return; }
        const txt = String(sel.toString() || "").replace(/\s+/g, " ").trim();
        if (txt.length < 10) { hideSelPop(); return; }

        const range = sel.getRangeAt(0);
        const anchorNode = range.commonAncestorContainer;
        const anchorEl = anchorNode.nodeType === 1 ? anchorNode : anchorNode.parentElement;
        if (!anchorEl || !briefMain.contains(anchorEl)) { hideSelPop(); return; }
        if (anchorEl.closest("input, textarea, .note-editor, .lens-bar, .mob-sec-strip, .triage-strip")) { hideSelPop(); return; }

        const rect = range.getBoundingClientRect();
        if (!rect || (rect.width === 0 && rect.height === 0)) { hideSelPop(); return; }

        const cardEl = anchorEl.closest("[id^='item-']");
        const secEl = anchorEl.closest("section[id^='sec-']");
        const sourceKey = cardEl ? cardEl.id.replace(/^item-/, "") : "";
        const meta = sourceKey ? getItemMeta(sourceKey) : null;
        const secId = (meta && meta.secId) || (secEl ? secEl.id.replace(/^sec-/, "") : "priorities");
        const secObj = (data[lang].sections && data[lang].sections[secId]) || data[lang].sections.priorities;

        pendingSel = {
          text: txt,
          sourceKey,
          secId,
          secNum: (meta && meta.secNum) || (secObj && secObj.num) || "01",
          sourceTitle: (meta && meta.title) || (secObj && secObj.title) || ""
        };

        const ui = data[lang].ui || {};
        if (selSaveTxt) selSaveTxt.textContent = ui.selSaveBtn || "Save passage";
        if (selNoteTxt) selNoteTxt.textContent = ui.selNoteBtn || "Annotate";

        selPop.classList.add("is-visible");
        const pw = selPop.offsetWidth || 210;
        const ph = selPop.offsetHeight || 38;
        const pad = 10;
        let x = rect.left + rect.width / 2 - pw / 2;
        x = Math.max(pad, Math.min(window.innerWidth - pw - pad, x));
        const minTop = (stickyChrome ? Math.max(0, stickyChrome.getBoundingClientRect().bottom) : 0) + 6;
        const maxBottom = Math.max(minTop, window.innerHeight - ph - (isMobileViewport() ? 72 : 16));
        let y = rect.top - ph - 10;
        if (y < minTop) y = rect.bottom + 10;
        y = Math.max(minTop, Math.min(maxBottom, y));
        selPop.style.transform = "translate3d(" + Math.round(x) + "px," + Math.round(y) + "px,0)";
      }

      document.addEventListener("selectionchange", () => {
        clearTimeout(selDebounce);
        selDebounce = window.setTimeout(evaluateTextSelection, 90);
      });
      document.addEventListener("mouseup", () => {
        clearTimeout(selDebounce);
        selDebounce = window.setTimeout(evaluateTextSelection, 40);
      });
      document.addEventListener("touchend", () => {
        clearTimeout(selDebounce);
        selDebounce = window.setTimeout(evaluateTextSelection, 140);
      });

      if (selPop) {
        selPop.addEventListener("pointerdown", (e) => { e.preventDefault(); });
      }
      if (selSaveBtn) {
        selSaveBtn.addEventListener("click", () => {
          if (!pendingSel || !data || !data[lang]) return;
          const payload = pendingSel;
          addSavedPassage({
            sourceKey: payload.sourceKey,
            secId: payload.secId,
            secNum: payload.secNum,
            sourceTitle: payload.sourceTitle,
            text: payload.text,
            kind: "excerpt"
          });
          const sel = window.getSelection && window.getSelection();
          if (sel) { try { sel.removeAllRanges(); } catch {} }
          hideSelPop();
          showMiniToast((data[lang].ui && data[lang].ui.savedPassageToast) || "Passage saved ✓");
          if (notesOpen) renderNotesFeedInAllTargets();

      /* =======================================================================
         SUMMARY BUILDER + ENCRYPTED GITHUB REPO / WEBHOOK SYNC
         ======================================================================= */
      function buildSummaryText() {
        if (!data || !data[lang]) return "";
        const d = data[lang];
        const ui = d.ui || {};
        const secs = d.sections || {};
        const lines = [];
        lines.push("# " + (ui.notesPrintHeading || "Clinician Notes") + " — " + d.title + " (" + d.date + ")");
        lines.push("Date: " + new Date().toISOString().slice(0, 16).replace("T", " "));
        if (generalNote.trim()) {
          lines.push("");
          lines.push("## " + (ui.notesGeneralLabel || "Consultation summary"));
          lines.push(generalNote.trim());
        }
        if (savedPassages.length) {
          lines.push("");
          lines.push("## " + (ui.savedTitle || "Saved Passages"));
          savedPassages.forEach((p) => {
            lines.push("> [" + p.secNum + "] " + p.sourceTitle + (p.label ? " · " + p.label : ""));
            lines.push("> " + p.text);
            if (p.note && p.note.trim()) lines.push("  → " + p.note.trim());
          });
        }
        if (Array.isArray(d.interviewProbes)) {
          const probeLines = [];
          d.interviewProbes.forEach((pr) => {
            const done = probeDone.has(pr.id);
            const ans = (probeAnswers.get(pr.id) || "").trim();
            if (done || ans) {
              probeLines.push((done ? "- [x] " : "- [ ] ") + "[" + pr.secNum + "] " + pr.title);
              if (ans) probeLines.push("  → " + ans.replace(/\n/g, "\n    "));
            }
          });
          if (probeLines.length) {
            lines.push("");
            lines.push("## " + (ui.interviewProbesTitle || "Clinical Probes"));
            lines.push.apply(lines, probeLines);
          }
        }
        if (discussedQuestions.size && secs.questions && secs.questions.items) {
          lines.push("");
          lines.push("## " + secs.questions.num + " · " + secs.questions.title);
          secs.questions.items.forEach((q, i) => {
            const k = "q-" + i;
            if (discussedQuestions.has(k)) {
              lines.push("- [x] " + String(i + 1).padStart(2, "0") + ". " + q.lead);
            }
          });
        }
        const annotKeys = getAnnotatedItemKeys();
        if (annotKeys.length) {
          lines.push("");
          lines.push("## " + (ui.notesItemsLabel || "Saved, Asked & Commented Items"));
          annotKeys.forEach((k) => {
            const meta = getItemMeta(k);
            if (!meta) return;
            const marks = (pinnedItems.has(k) ? "★ " : "") + (askedItems.has(k) ? (askedDone.has(k) ? "[?✓] " : "[?] ") : "");
            const note = (itemNotes.get(k) || "").trim();
            lines.push("- " + marks + "[" + meta.secNum + "] " + meta.title);
            if (note) lines.push("  → " + note.replace(/\n/g, "\n    "));
          });
        }
        return lines.join("\n");
      }

      function buildConsultationPayload() {
        const d = data && data[lang] ? data[lang] : { title: "Fiche Clinique", date: "" };
        return {
          schema: "fiche-clinique-notes-v3",
          savedAt: new Date().toISOString(),
          lang,
          docTitle: d.title,
          docDate: d.date,
          summaryMarkdown: buildSummaryText(),
          workspace: serializeWorkspace()
        };
      }

      function formatFileTimestamp() {
        const now = new Date();
        const pad = (n) => String(n).padStart(2, "0");
        return now.getFullYear() + pad(now.getMonth() + 1) + pad(now.getDate()) + "-" + pad(now.getHours()) + pad(now.getMinutes()) + pad(now.getSeconds());
      }

      async function pushNotesToRepo() {
        if (!data || !data[lang] || !sessionPin || syncBusy) return;
        const ui = data[lang].ui || {};
        if (!isSyncConfigured()) {
          syncCfgOpen = true;
          renderNotesWorkspaceInAllTargets();
          return;
        }
        syncBusy = true;
        syncMsg = ui.syncPushing || "Uploading encrypted…";
        syncMsgIsErr = false;
        renderNotesWorkspaceInAllTargets();

        try {
          const payload = buildConsultationPayload();
          if (syncCfg.mode === "webhook") {
            const env = await encryptWithPin(payload, sessionPin, 120000);
            const res = await fetch(syncCfg.webhookUrl.trim(), {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(env)
            });
            if (!res.ok) throw new Error("HTTP " + res.status);
            syncMsg = (ui.syncPushOk || "Sent ✓ ({file})").replace("{file}", "webhook");
            syncMsgIsErr = false;
            showMiniToast(syncMsg);
          } else {
            const repo = syncCfg.repo.trim();
            const branch = (syncCfg.branch || "main").trim() || "main";
            const folder = (syncCfg.folder || "fiche-notes").trim().replace(/^\/+|\/+$/g, "") || "fiche-notes";
            const mustEncrypt = isPublicTargetRepo(repo) || Boolean(syncCfg.encrypt);
            const ts = formatFileTimestamp();
            const fileName = "consultation-" + ts + (mustEncrypt ? ".enc.json" : ".md");
            const filePath = folder + "/" + fileName;
            const fileText = mustEncrypt
              ? JSON.stringify(await encryptWithPin(payload, sessionPin, 120000), null, 2)
              : payload.summaryMarkdown;
            const apiUrl = "https://api.github.com/repos/" + repo + "/contents/" + filePath.split("/").map(encodeURIComponent).join("/");
            const res = await fetch(apiUrl, {
              method: "PUT",
              headers: {
                "Authorization": "Bearer " + syncCfg.token.trim(),
                "Accept": "application/vnd.github+json",
                "Content-Type": "application/json"
              },
              body: JSON.stringify({
                message: "Consultation notes (" + ts + ")",
                content: utf8ToB64(fileText),
                branch
              })
            });
            if (!res.ok) {
              let detail = "HTTP " + res.status;
              try {
                const errJson = await res.json();
                if (errJson && errJson.message) detail = errJson.message;
              } catch {}
              throw new Error(detail);
            }
            syncMsg = (ui.syncPushOk || "Sent ✓ ({file})").replace("{file}", fileName);
            syncMsgIsErr = false;
            showMiniToast(syncMsg);
          }
        } catch (err) {
          syncMsg = (ui.syncErr || "Sync error: {msg}").replace("{msg}", (err && err.message) || "network");
          syncMsgIsErr = true;
        } finally {
          syncBusy = false;
          renderNotesWorkspaceInAllTargets();
        }
      }

      async function pullNotesFromRepo() {
        if (!data || !data[lang] || !sessionPin || syncBusy) return;
        const ui = data[lang].ui || {};
        if (syncCfg.mode !== "github" || !isSyncConfigured()) {
          syncCfgOpen = true;
          renderNotesWorkspaceInAllTargets();
          return;
        }
        syncBusy = true;
        syncMsg = ui.syncPulling || "Loading…";
        syncMsgIsErr = false;
        renderNotesWorkspaceInAllTargets();

        try {
          const repo = syncCfg.repo.trim();
          const branch = (syncCfg.branch || "main").trim() || "main";
          const folder = (syncCfg.folder || "fiche-notes").trim().replace(/^\/+|\/+$/g, "") || "fiche-notes";
          const headers = {
            "Authorization": "Bearer " + syncCfg.token.trim(),
            "Accept": "application/vnd.github+json"
          };
          const listUrl = "https://api.github.com/repos/" + repo + "/contents/" + folder.split("/").map(encodeURIComponent).join("/") + "?ref=" + encodeURIComponent(branch);
          const listRes = await fetch(listUrl, { headers });
          if (listRes.status === 404) {
            syncMsg = ui.syncPullEmpty || "No notes found.";
            syncMsgIsErr = false;
            syncBusy = false;
            renderNotesWorkspaceInAllTargets();
            return;
          }
          if (!listRes.ok) throw new Error("HTTP " + listRes.status);
          const files = await listRes.json();
          const encFiles = (Array.isArray(files) ? files : [])
            .filter((f) => f && f.type === "file" && String(f.name || "").endsWith(".enc.json"))
            .sort((a, b) => String(b.name).localeCompare(String(a.name)));
          if (!encFiles.length) {
            syncMsg = ui.syncPullEmpty || "No encrypted note files found.";
            syncMsgIsErr = false;
            syncBusy = false;
            renderNotesWorkspaceInAllTargets();
            return;
          }
          const newest = encFiles[0];
          const fileUrl = "https://api.github.com/repos/" + repo + "/contents/" + String(newest.path).split("/").map(encodeURIComponent).join("/") + "?ref=" + encodeURIComponent(branch);
          const fileRes = await fetch(fileUrl, { headers });
          if (!fileRes.ok) throw new Error("HTTP " + fileRes.status);
          const fileObj = await fileRes.json();
          const envJson = JSON.parse(b64ToUtf8(fileObj.content));
          const dec = await decryptWithPin(envJson, sessionPin);
          if (dec && dec.workspace) applyWorkspaceSnapshot(dec.workspace);
          else applyWorkspaceSnapshot(dec);
          await persistEncryptedWorkspaceNow();
          syncMsg = (ui.syncPullOk || "Loaded ✓") + " (" + newest.name + ")";
          syncMsgIsErr = false;
          showMiniToast(ui.syncPullOk || "Notes loaded ✓");
          syncAllBadges();
          if (activeView !== "notes") renderActiveView(false);
        } catch (err) {
          syncMsg = (ui.syncErr || "Sync error: {msg}").replace("{msg}", (err && err.message) || "decrypt failed");
          syncMsgIsErr = true;
        } finally {
          syncBusy = false;
          renderNotesWorkspaceInAllTargets();
        }
      }

      async function exportEncryptedFile() {
        if (!sessionPin || !data || !data[lang]) return;
        const payload = buildConsultationPayload();
        const env = await encryptWithPin(payload, sessionPin, 120000);
        const blob = new Blob([JSON.stringify(env, null, 2)], { type: "application/json;charset=utf-8" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = "fiche-notes-" + formatFileTimestamp() + ".enc.json";
        document.body.appendChild(a);
        a.click();
        a.remove();
        window.setTimeout(() => URL.revokeObjectURL(url), 1000);
      }

      async function importEncryptedFile(file) {
        if (!file || !sessionPin || !data || !data[lang]) return;
        const ui = data[lang].ui || {};
        try {
          const text = await file.text();
          const env = JSON.parse(text);
          const dec = await decryptWithPin(env, sessionPin);
          if (dec && dec.workspace) applyWorkspaceSnapshot(dec.workspace);
          else applyWorkspaceSnapshot(dec);
          await persistEncryptedWorkspaceNow();
          syncMsg = ui.syncImportOk || "Notes imported ✓";
          syncMsgIsErr = false;
          showMiniToast(syncMsg);
          syncAllBadges();
          renderActiveView(false);
          renderNotesWorkspaceInAllTargets();
        } catch {
          syncMsg = ui.syncImportErr || "Could not decrypt file.";
          syncMsgIsErr = true;
          renderNotesWorkspaceInAllTargets();
        }
      }

      async function handleNotesContainerClick(e, container) {
        if (!data || !data[lang]) return false;
        const ui = data[lang].ui || {};
        if (e.target.closest("[data-close-notes]")) {
          setNotesOpen(false, true);
          return true;
        }
        const modeBtn = e.target.closest("[data-sync-mode]");
        if (modeBtn) {
          syncCfg.mode = modeBtn.dataset.syncMode;
          renderNotesWorkspaceInAllTargets();
          return true;
        }
        if (e.target.closest("[data-sync-toggle-cfg]")) {
          syncCfgOpen = !syncCfgOpen;
          renderNotesWorkspaceInAllTargets();
          return true;
        }
        if (e.target.closest("[data-sync-enc]")) {
          if (!isPublicTargetRepo(syncCfg.repo)) {
            syncCfg.encrypt = !syncCfg.encrypt;
            renderNotesWorkspaceInAllTargets();
          }
          return true;
        }
        if (e.target.closest("[data-sync-save]")) {
          const repoEl = container.querySelector("#syncRepoIn");
          const brEl = container.querySelector("#syncBranchIn");
          const fldEl = container.querySelector("#syncFolderIn");
          const tokEl = container.querySelector("#syncTokenIn");
          const whEl = container.querySelector("#syncWebhookIn");
          if (repoEl) syncCfg.repo = repoEl.value.trim() || "medmrf-10/zme";
          if (brEl) syncCfg.branch = brEl.value.trim() || "main";
          if (fldEl) syncCfg.folder = fldEl.value.trim() || "fiche-notes";
          if (tokEl) syncCfg.token = tokEl.value.trim();
          if (whEl) syncCfg.webhookUrl = whEl.value.trim();
          if (isPublicTargetRepo(syncCfg.repo)) syncCfg.encrypt = true;
          await persistEncryptedSyncCfg();
          syncCfgOpen = false;
          syncMsg = "";
          showMiniToast(ui.syncLocalSaved || "Saved ✓");
          renderNotesWorkspaceInAllTargets();
          return true;
        }
        if (e.target.closest("[data-sync-clear]")) {
          syncCfg = Object.assign({}, DEFAULT_SYNC_CFG);
          syncCfgOpen = false;
          syncMsg = "";
          try { localStorage.removeItem(SYNC_STORE_KEY); } catch {}
          renderNotesWorkspaceInAllTargets();
          return true;
        }
        if (e.target.closest("[data-sync-push]")) {
          await pushNotesToRepo();
          return true;
        }
        if (e.target.closest("[data-sync-pull]")) {
          await pullNotesFromRepo();
          return true;
        }
        const tplBtn = e.target.closest("[data-drawer-tpl]");
        if (tplBtn) {
          const ta = container.querySelector('[data-general-note="1"]');
          if (ta) {
            const tpl = tplBtn.dataset.drawerTpl;
            const sep = ta.value && !ta.value.endsWith("\n") ? "\n" : "";
            ta.value = ta.value + sep + tpl;
            generalNote = ta.value;
            scheduleWorkspaceSave();
            ta.focus();
            ta.setSelectionRange(ta.value.length, ta.value.length);
            syncAllBadges();
            renderNotesFeedInAllTargets();
          }
          return true;
        }
        const delPass = e.target.closest("[data-del-passage]");
        if (delPass) {
          removeSavedPassage(delPass.dataset.delPassage);
          return true;
        }
        const jumpBtn = e.target.closest("[data-drawer-jump]");
        if (jumpBtn) {
          const k = jumpBtn.dataset.drawerJump;
          const s = jumpBtn.dataset.drawerSec;
          if (window.innerWidth < 1180) setNotesOpen(false, false);
          jumpToSection(s, { itemKey: k });
          return true;
        }
        const pinBtn = e.target.closest("[data-drawer-pin]");
        if (pinBtn) {
          toggleSaveCard(pinBtn.dataset.drawerPin);
          return true;
        }
        const editBtn = e.target.closest("[data-drawer-edit]");
        if (editBtn) {
          const k = editBtn.dataset.drawerEdit;
          const s = editBtn.dataset.drawerSec;
          if (window.innerWidth < 1180) setNotesOpen(false, false);
          jumpToSection(s, { itemKey: k });
          window.setTimeout(() => openInlineComment(k, true), 260);
          return true;
        }
        const delBtn = e.target.closest("[data-drawer-del]");
        if (delBtn) {
          deleteItemNote(delBtn.dataset.drawerDel);
          return true;
        }
        if (e.target.closest("[data-print-toggle-row]") || e.target.closest("[data-print-switch]")) {
          includeNotesInPrint = !includeNotesInPrint;
          document.body.classList.toggle("print-with-notes", includeNotesInPrint);
          document.querySelectorAll("[data-print-switch]").forEach((sw) => {
            sw.setAttribute("aria-checked", includeNotesInPrint ? "true" : "false");
          });
          scheduleWorkspaceSave();
          syncPrintNotesDOM();
          return true;
        }
        const copyBtn = e.target.closest("[data-notes-copy]");
        if (copyBtn) {
          const txt = buildSummaryText();
          if (!txt) return true;
          let ok = false;
          try {
            if (navigator.clipboard && navigator.clipboard.writeText) {
              await navigator.clipboard.writeText(txt);
              ok = true;
            }
          } catch {}
          if (!ok) {
            const tmp = document.createElement("textarea");
            tmp.value = txt;
            tmp.style.position = "fixed";
            tmp.style.opacity = "0";
            document.body.appendChild(tmp);
            tmp.select();
            try { document.execCommand("copy"); } catch {}
            tmp.remove();
          }
          const span = copyBtn.querySelector("span");
          if (span) span.textContent = ui.notesCopied || "Copied ✓";
          showMiniToast(ui.notesCopied || "Copied ✓");
          clearTimeout(copyResetTimer);
          copyResetTimer = window.setTimeout(() => {
            if (span && data && data[lang]) span.textContent = (data[lang].ui && data[lang].ui.notesCopy) || "Copy summary";
          }, 2000);
          return true;
        }
        if (e.target.closest("[data-notes-share]")) {
          const txt = buildSummaryText();
          if (!txt) return true;
          if (navigator.share) {
            try {
              await navigator.share({ title: data[lang].title || "Fiche Clinique", text: txt });
              return true;
            } catch {}
          }
          try {
            if (navigator.clipboard && navigator.clipboard.writeText) await navigator.clipboard.writeText(txt);
          } catch {}
          showMiniToast(ui.notesCopied || "Copied ✓");
          return true;
        }
        if (e.target.closest("[data-notes-exp-txt]")) {
          const txt = buildSummaryText();
          if (!txt) return true;
          const blob = new Blob([txt], { type: "text/plain;charset=utf-8" });
          const url = URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.href = url;
          a.download = "notes-fiche-clinique-" + lang + ".txt";
          document.body.appendChild(a);
          a.click();
          a.remove();
          window.setTimeout(() => URL.revokeObjectURL(url), 1000);
          return true;
        }
        if (e.target.closest("[data-notes-exp-enc]")) {
          await exportEncryptedFile();
          return true;
        }
        if (e.target.closest("[data-notes-imp-enc]")) {
          if (importNotesInput) {
            importNotesInput.value = "";
            importNotesInput.click();
          }
          return true;
        }
        const clrBtn = e.target.closest("[data-notes-clear]");
        if (clrBtn) {
          if (!clearConfirmArmed) {
            clearConfirmArmed = true;
            clrBtn.textContent = ui.notesClearConfirm || "Confirm clear?";
            clearTimeout(clearConfirmTimer);
            clearConfirmTimer = window.setTimeout(() => {
              clearConfirmArmed = false;
              document.querySelectorAll("[data-notes-clear]").forEach((b) => {
                if (data && data[lang]) b.textContent = (data[lang].ui && data[lang].ui.notesClear) || "Clear all";
              });
            }, 4000);
          } else {
            clearConfirmArmed = false;
            clearTimeout(clearConfirmTimer);
            pinnedItems.clear();
            askedItems.clear();
            askedDone.clear();
            probeDone.clear();
            discussedQuestions.clear();
            itemNotes.clear();
            probeAnswers.clear();
            openCommentEditors.clear();
            savedPassages = [];
            generalNote = "";
            includeNotesInPrint = false;
            document.body.classList.remove("print-with-notes");
            if (activeLens === "annotated") activeLens = "all";
            try { localStorage.removeItem(WS_STORE_KEY); } catch {}
            renderActiveView(false);
            renderNotesWorkspaceInAllTargets();
            syncAllBadges();
          }
          return true;
        }
        return false;
      }

      /* =======================================================================
