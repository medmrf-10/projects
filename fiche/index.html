      align-items: center;
      gap: 6px;
      padding: 6px 6px 6px 12px;
      border-radius: 999px;
      background: var(--glass-bg);
      backdrop-filter: blur(16px) saturate(170%);
      -webkit-backdrop-filter: blur(16px) saturate(170%);
      border: 1px solid var(--teal-border);
      box-shadow: var(--shadow-dock);
      color: var(--text);
      font-size: 0.76rem;
      font-weight: 600;
      opacity: 0;
      pointer-events: none;
      transform: translateY(12px);
      transition: opacity 200ms var(--ease), transform 200ms var(--ease);
    }
    html[dir="rtl"] .return-toast { padding: 6px 12px 6px 6px; }
    @media (min-width: 1280px) { .return-toast { inset-inline-end: 24px; } }
    .return-toast.is-visible { opacity: 1; pointer-events: auto; transform: translateY(0); }
    .return-go {
      border: 0;
      background: transparent;
      color: var(--teal-text);
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      padding: 2px 4px;
      border-radius: 999px;
    }
    .return-go:hover { text-decoration: underline; }
    .return-x {
      width: 22px;
      height: 22px;
      border-radius: 999px;
      border: 0;
      background: var(--surface-2);
      color: var(--text-3);
      display: inline-grid;
      place-items: center;
      cursor: pointer;
      padding: 0;
    }
    .return-x:hover { color: var(--text); background: var(--surface-3); }

    /* Mobile Floating Bottom Navigation Capsule (<= 639px — Always Fixed & Visible) */
    .mob-dock {
      display: none;
      position: fixed;
      left: 50%;
      bottom: calc(12px + env(safe-area-inset-bottom, 0px));
      z-index: 48;
      width: min(366px, calc(100vw - 24px));
      padding: 5px;
      border-radius: 999px;
      background: var(--glass-bg);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      border: 1px solid var(--glass-border);
      box-shadow: var(--shadow-dock);
      align-items: center;
      justify-content: space-between;
      gap: 4px;
      opacity: 1;
      pointer-events: auto;
      transform: translate(-50%, 0);
    }
    .mob-dock-btn {
      width: 36px;
      height: 36px;
      border-radius: 999px;
      border: 0;
      background: transparent;
      color: var(--text-2);
      display: inline-grid;
      place-items: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: background-color 140ms ease, color 140ms ease;
    }
    .mob-dock-btn:hover, .mob-dock-btn:active { background: var(--surface-2); color: var(--teal-text); }
    .mob-dock-btn:disabled { opacity: 0.3; pointer-events: none; }
    .mob-dock-center {
      flex: 1 1 auto;
      min-width: 0;
      height: 36px;
      border: 1px solid var(--teal-border);
      background: var(--teal-soft);
      color: var(--teal-text);
      border-radius: 999px;
      padding: 0 12px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      cursor: pointer;
      font-size: 0.78rem;
      font-weight: 700;
    }
    .mob-dock-num {
      font-family: var(--font-mono);
      font-size: 0.69rem;
      font-weight: 700;
      opacity: 0.85;
      font-variant-numeric: tabular-nums;
      flex-shrink: 0;
    }
    .mob-dock-title {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* Mobile Quick-Jump Bottom Sheet Drawer */
    .sheet-backdrop, .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 90;
      background: var(--backdrop);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      display: flex;
      align-items: flex-end;
      justify-content: center;
      animation: fadeBg 180ms ease both;
    }
    .modal-backdrop { align-items: center; padding: 16px; }
    @keyframes fadeBg { from { opacity: 0; } to { opacity: 1; } }

    .mob-sheet {
      width: 100%;
      max-width: 480px;
      background: var(--surface);
      border-top: 1px solid var(--glass-border);
      border-radius: 20px 20px 0 0;
      padding: 10px 16px calc(18px + env(safe-area-inset-bottom, 0px));
      box-shadow: var(--shadow-dock);
      max-height: 85vh;
      overflow-y: auto;
    }
    .mob-sheet.is-entering { animation: sheetUp 220ms var(--ease) both; }
    .sheet-filter-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 7px 10px;
      margin-bottom: 10px;
      border-radius: 10px;
      background: var(--amber-soft);
      border: 1px solid var(--amber-border);
      color: var(--amber-text);
      font-size: 0.76rem;
      font-weight: 600;
    }
    .sheet-filter-clear {
      border: 1px solid var(--amber-border);
      background: var(--surface);
      color: var(--amber-text);
      border-radius: 999px;
      padding: 2px 9px;
      font-size: 0.72rem;
      font-weight: 700;
      cursor: pointer;
      flex-shrink: 0;
    }
    @keyframes sheetUp { from { transform: translateY(28px); opacity: 0.5; } to { transform: translateY(0); opacity: 1; } }
    .sheet-handle {
      width: 36px;
      height: 4px;
      border-radius: 999px;
      background: var(--border-strong);
      margin: 0 auto 12px;
    }
    .sheet-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
      padding: 0 4px;
    }
    .sheet-title { margin: 0; font-size: 0.92rem; font-weight: 700; color: var(--text); }
    .sheet-list {
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-bottom: 14px;
    }
    .sheet-item {
      border: 1px solid transparent;
      background: transparent;
      color: var(--text);
      padding: 10px 12px;
      border-radius: 11px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      cursor: pointer;
      text-align: start;
      transition: background-color 140ms ease, border-color 140ms ease;
    }
    .sheet-item:hover { background: var(--surface-2); }
    .sheet-item.is-active {
      background: var(--teal-soft);

    /* Keyboard Shortcuts Modal */
    .sc-modal {
      width: 100%;
      max-width: 430px;
      background: var(--surface);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      padding: 20px 22px 18px;
      box-shadow: var(--shadow-gate);
      animation: popIn 180ms var(--ease) both;
    }
    .sc-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }
    .sc-title { margin: 0; font-size: 0.96rem; font-weight: 700; color: var(--text); }
    .sc-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .sc-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 6px 0;
      border-bottom: 1px solid var(--border-subtle);
      font-size: 0.81rem;
      color: var(--text-2);
    }
    .sc-row:last-child { border-bottom: 0; }
    .sc-keys { display: inline-flex; align-items: center; gap: 4px; flex-shrink: 0; direction: ltr; }
    .sc-k {
      font-family: var(--font-mono);
      font-size: 0.69rem;
      font-weight: 700;
      color: var(--text);
      background: var(--surface-2);

      border-bottom-width: 2px;
      border-radius: 5px;
      padding: 1.5px 6px;
      line-height: 1.3;

    /* Interactive SVG Floating Tooltip */
    .viz-tooltip {
      position: fixed;
      top: 0;
      left: 0;
      z-index: 80;
      max-width: 295px;
      padding: 8px 12px;
      border-radius: 9px;
      background: var(--glass-bg);
      backdrop-filter: blur(14px) saturate(160%);
      -webkit-backdrop-filter: blur(14px) saturate(160%);
      border: 1px solid var(--glass-border);
      box-shadow: var(--shadow-tip);
      color: var(--text);
      font-size: 0.76rem;
      line-height: 1.44;
      pointer-events: none;
      opacity: 0;
      transform: translate3d(-9999px, -9999px, 0);
      transition: opacity 110ms ease;
    }
    .viz-tooltip.is-visible { opacity: 1; }
    .viz-tip-title { font-weight: 700; color: var(--text); margin-bottom: 2px; }
    .viz-tip-body { color: var(--text-2); font-variant-numeric: tabular-nums; }

    /* =========================================================================
       SLIDE-OVER / DOCKED CLINICIAN NOTES & ANNOTATIONS DRAWER
       ========================================================================= */
    .notes-backdrop {
      position: fixed;
      inset: 0;
      z-index: 84;
      background: var(--backdrop);
      backdrop-filter: blur(3px);
      -webkit-backdrop-filter: blur(3px);
      animation: fadeBg 180ms ease both;
    }
    .notes-drawer {
      position: fixed;
      top: 0;
      bottom: 0;
      inset-inline-end: 0;
      z-index: 85;
      width: min(392px, 100vw);
      background: var(--surface);
      border-inline-start: 1px solid var(--border-strong);
      box-shadow: var(--shadow-gate);
      display: flex;
      flex-direction: column;
      font-size: 13.5px;
      animation: drawerSlideIn 210ms var(--ease) both;

    @keyframes drawerSlideIn {
      from { transform: translateX(100%); opacity: 0.6; }
      to { transform: translateX(0); opacity: 1; }
    }
    html[dir="rtl"] .notes-drawer { animation-name: drawerSlideInRtl; }
    @keyframes drawerSlideInRtl {
      from { transform: translateX(-100%); opacity: 0.6; }
      to { transform: translateX(0); opacity: 1; }
    }

        width: 372px;
        z-index: 38;
        box-shadow: -8px 0 28px -18px rgba(15, 23, 42, 0.22);
      }

      }
      body.notes-open .brief-main {

        margin-inline-end: 372px;
      }

        opacity: 0;
        pointer-events: none;
      }
      body.notes-open .return-toast { inset-inline-end: 392px; }
      body.notes-open .float-top { inset-inline-end: 392px; }
    }

    .drawer-head {

    .drawer-tpl-row {

    .drawer-textarea {

      line-height: 1.5;
    }
    .drawer-item {

    .drawer-item.is-pinned { border-inline-start: 2.5px solid var(--amber); }

    .drawer-item-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 6px;
      margin-bottom: 4px;
    }
    .drawer-item-jump {
      border: 0;
      background: transparent;
      padding: 0;
      text-align: start;
      cursor: pointer;
      display: flex;
      align-items: baseline;
      gap: 6px;
      min-width: 0;
      flex: 1 1 auto;
    }
    .drawer-item-num {
      font-family: var(--font-mono);
      font-size: 10.5px;
      font-weight: 700;
      color: var(--teal-text);
      background: var(--teal-soft);
      border-radius: 5px;
      padding: 1px 5px;
      flex-shrink: 0;
    }
    .drawer-item-title {
      font-size: 12.5px;
      font-weight: 700;
      color: var(--text);
      line-height: 1.32;
    }
    .drawer-item-jump:hover .drawer-item-title { color: var(--teal-text); text-decoration: underline; }
    .drawer-item-acts {
      display: inline-flex;
      align-items: center;
      gap: 2px;
      flex-shrink: 0;
    }
    .drawer-mini-btn {
      width: 22px;
      height: 22px;
      border-radius: 5px;
      border: 0;
      background: transparent;
      color: var(--text-3);
      display: inline-grid;
      place-items: center;
      cursor: pointer;
      padding: 0;
    }
    .drawer-mini-btn:hover { background: var(--surface-2); color: var(--text); }
    .drawer-mini-btn.is-pinned { color: var(--amber-text); }
    .drawer-mini-btn.is-pinned svg { fill: currentColor; }
    .drawer-mini-btn.is-del:hover { color: var(--err); background: var(--err-soft); }
    .drawer-item-note {
      margin: 4px 0 0;
      font-size: 12.2px;

      line-height: 1.48;
      white-space: pre-wrap;

    }
    .drawer-item-pin-lbl {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      font-weight: 600;
      color: var(--amber-text);
      margin-top: 2px;
    }

    .drawer-foot {
      padding: 12px 16px calc(14px + env(safe-area-inset-bottom, 0px));
      border-top: 1px solid var(--border);
      background: var(--surface);
      display: flex;
      flex-direction: column;
      gap: 10px;
      flex-shrink: 0;
    }
    .drawer-print-toggle {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-2);
    }

      display: flex;
      align-items: center;
      flex-wrap: nowrap;
      gap: 5px;
    }
    .drawer-act-btn {
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--text);
      border-radius: 8px;
      padding: 6px 8.5px;
      font-size: 11.4px;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4.5px;
      transition: background-color 140ms ease, border-color 140ms ease, color 140ms ease;
    }
    .drawer-act-btn:hover { background: var(--surface-hover); border-color: var(--border-strong); }
    .drawer-act-btn.is-primary {
      background: var(--teal-btn);
      border-color: var(--teal-btn);
      color: #FFFFFF;
      flex: 1 1 auto;
    }
    .drawer-act-btn.is-primary:hover { background: var(--teal-btn-hover); }
    .drawer-act-btn.is-danger { color: var(--err); border-color: var(--coral-border); background: transparent; }
    .drawer-act-btn.is-danger:hover { background: var(--err-soft); }
    .drawer-act-btn:disabled { opacity: 0.4; pointer-events: none; }

    /* =========================================================================
       RESPONSIVE BREAKPOINTS (100% ZERO OVERFLOW DOWN TO 390x844 MOBILE)
       ========================================================================= */
    @media (min-width: 1024px) and (max-width: 1199px) {
      .chrome-inner { padding: 0 12px; gap: 6px; }
      .nav-link { padding: 4.5px 6px; font-size: 11.6px; gap: 3px; }
      .nav-num { display: none; }
      .search-shell { width: 140px; flex: 0 1 140px; }
      .seg-btn { padding: 3.5px 6.5px; font-size: 11.2px; }
      .ico-btn { width: 29px; height: 29px; }
    }

    @media (max-width: 1023px) {
      .chrome-inner {
        flex-wrap: wrap;
        padding: 8px 14px;
        gap: 7px 10px;
      }
      .chrome-controls { order: 1; width: 100%; justify-content: space-between; flex-wrap: wrap; gap: 7px; }
      .nav-links { order: 2; width: 100%; padding-top: 4px; border-top: 1px solid var(--border-subtle); }
      .search-shell { flex: 1 1 180px; width: auto; min-width: 148px; }
      .search-kbd { display: none; }
    }

    @media (max-width: 860px) {
      .triage-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

    @media (max-width: 760px) {
      .brief-main { padding: 22px 18px 72px; }
      .doc-title { font-size: 1.52rem; }
      html[dir="rtl"] .doc-title { font-size: 1.46rem; }
      .goals-list { grid-template-columns: 1fr; gap: 9px; }
      .safety-grid { grid-template-columns: 1fr; }
      .repleted-grid { grid-template-columns: 1fr; }
      .normal-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .q-grid { grid-template-columns: 1fr; }
    }

    @media (max-width: 639px) {
      .sticky-chrome { position: static; }
      .sticky-chrome .read-progress { display: none; }
      .sticky-chrome .nav-links { display: none; }
      .mobile-top-progress { display: block; }
      .mob-dock { display: flex; }
      .float-top { display: none !important; }
      .return-toast {
        bottom: calc(68px + env(safe-area-inset-bottom, 0px));
        inset-inline-end: 12px;
        max-width: calc(100vw - 24px);
      }
      #scBtn, #readShell, #printBtn { display: none; }

      .chrome-inner { padding: 7px 12px; gap: 6px; }
      .chrome-controls { gap: 6px; }
      .search-shell { order: 2; flex: 1 1 100%; width: 100%; }
      .seg-group { flex: 1 1 auto; justify-content: flex-start; gap: 5px; }
      .util-btns { gap: 4px; }
      .ico-btn { width: 29px; height: 29px; }
      .seg-btn { padding: 3.5px 7px; font-size: 11.4px; }

      .brief-main { padding: 16px 14px calc(88px + env(safe-area-inset-bottom, 0px)); }
      .masthead { margin-bottom: 16px; padding-bottom: 14px; }
      .triage-strip { margin-bottom: 12px; }
      .triage-sub { display: none; }
      .lens-bar { padding: 8px 0 11px; margin-bottom: 12px; gap: 7px; }
      .lens-pills { flex-wrap: nowrap; overflow-x: auto; max-width: 100%; scrollbar-width: none; -ms-overflow-style: none; padding-bottom: 2px; }
      .lens-pills::-webkit-scrollbar { display: none; }
      .ed-section, .brief-root.is-brief .ed-section { padding-top: 24px; margin-top: 24px; scroll-margin-top: 16px; }
      .prose-item { padding: 12px 13px; }
      .figure-card { padding: 14px 13px 13px; border-radius: var(--r-md); }
      .normal-grid { grid-template-columns: 1fr; }

      /* Mobile Vertical Hairline Lifespan Rail */
      .life-rail {
        grid-template-columns: 1fr;
        gap: 10px;
        padding-inline-start: 20px;
      }
      .life-rail::before {
        content: "";
        position: absolute;
        top: 12px;
        bottom: 12px;
        inset-inline-start: 5px;
        inset-inline-end: auto;
        width: 1px;
        background: var(--border-strong);
        z-index: 0;
      }
      .life-rail.is-filtered::before { display: none; }
      .life-node { align-items: flex-start; text-align: start; gap: 2px; padding: 4px 6px; }
      .life-dot-wrap { position: static; width: auto; height: auto; }
      .life-dot-wrap::before { display: none; }
      .life-dot { position: absolute; inset-inline-start: -20px; top: 8px; }
    }

    @media (max-width: 519px) {
      .triage-grid { grid-template-columns: 1fr; gap: 8px; }
      .triage-card { padding: 10px 12px 9px; gap: 5px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
    }

    /* =========================================================================
       EXACT 2-PAGE A4 EDITORIAL PRINT ARCHITECTURE (FR / AR / EN)
       ========================================================================= */
    @page { size: A4 portrait; margin: 4.5mm 6.5mm; }
    @media print {
      * {
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
        animation: none !important;
        transition: none !important;
      }
      :root, html[data-theme="dark"] {
        color-scheme: light;
        --bg: #FFFFFF;
        --surface: #FFFFFF;
        --surface-2: #F8FAFC;
        --surface-3: #F1F5F9;
        --border: #CBD5E1;
        --border-subtle: #E2E8F0;
        --border-strong: #94A3B8;
        --gridline: #E2E8F0;
        --text: #0F172A;
        --text-2: #1E293B;
        --text-3: #475569;
        --teal: #0F766E;
        --teal-text: #0D5E58;
        --teal-soft: #EDF7F6;
        --teal-wash: #F5FBFA;
        --teal-band: #E7F5F3;
        --teal-border: #99D5CF;
        --coral: #C2410C;
        --coral-text: #9A3412;
        --coral-soft: #FEF2EE;
        --coral-wash: #FFF6F3;
        --coral-border: #F5C2B1;
        --amber: #B45309;
        --amber-text: #92400E;
        --amber-soft: #FDF8EC;
        --amber-border: #E8CF9C;
        --info: #1D4ED8;
        --info-text: #1E40AF;
        --info-soft: #EFF6FF;
        --info-border: #BFDBFE;
        --slate-viz: #64748B;
        --bar-hit: #0F766E;
        --bar-swap: #B45309;
        --bar-stale: #C2410C;
        --bar-guess: #526175;
        --bar-text: #FFFFFF;
        --track-bg: #E2E8F0;
        --zone-bg: #D5EFEA;
        --zone-edge: #6EC0B7;
        --caution-bg: #FBEBD0;
      }

      /* Hide all interactive & screen-only chrome cleanly */
      .sticky-chrome, .gate-wrap, .labs-filter, .labs-reveal-btn, .item-expand, .viz-tooltip, .search-empty,
      .margin-rail, .mobile-top-progress, .mob-dock, .float-top, .return-toast,
      .sheet-backdrop, .modal-backdrop, .notes-backdrop, .notes-drawer, .read-pop,
      .triage-strip, .lens-bar, .brief-mode-bar, .sec-expand-btn, .item-tags, .nav-dot,
      .sec-top-mini, .sec-rule, .sec-badge, .xref-row, .q-check, .q-foot, .brief-endcap, .safety-ico,
      .card-act-btn, .note-editor, .card-note-edit-lbl {
        display: none !important;
      }
      /* Default Print keeps the exact 2-page A4 medical brief clean; clinician notes print ONLY when opted in */
      body:not(.print-with-notes) .card-note-view,
      body:not(.print-with-notes) .print-notes-section {
        display: none !important;
      }
      body.print-with-notes .card-note-view {
        display: block !important;
        margin-top: 0.7mm !important;
        padding: 0.7mm 1.5mm !important;
        border-radius: 3px !important;
        background: var(--teal-wash) !important;
        border: 0.5pt solid var(--teal-border) !important;
        border-inline-start: 1.5pt solid var(--teal) !important;
      }
      body.print-with-notes .card-note-head { margin-bottom: 0.2mm; }
      body.print-with-notes .card-note-badge { font-size: 5.8pt !important; }
      body.print-with-notes .card-note-text { font-size: 6.4pt !important; line-height: 1.2 !important; }
      body.print-with-notes .print-notes-section {
        display: block !important;
        margin-top: 3mm;
        padding-top: 2mm;
        border-top: 1pt solid var(--teal);
        break-inside: avoid;
      }
      body.print-with-notes .print-notes-title {
        margin: 0 0 1.2mm;
        font-size: 8.4pt;
        font-weight: 700;
        color: var(--teal-text);
      }
      body.print-with-notes .print-notes-gen {
        margin: 0 0 1.4mm;
        font-size: 7pt;
        line-height: 1.28;
        white-space: pre-wrap;
        color: var(--text);
      }
      body.print-with-notes .print-notes-list {
        margin: 0;
        padding-inline-start: 4mm;
        font-size: 6.7pt;
        line-height: 1.26;
        color: var(--text-2);
      }
      body.print-with-notes .print-notes-list li { margin-bottom: 0.8mm; }

      mark.hl, mark.hl.is-current {
        background: transparent !important;
        color: inherit !important;
        box-shadow: none !important;
        padding: 0;
        font-weight: inherit;
      }

      /* Print ALWAYS shows Full details and all 13 labs */
      .brief-root.is-brief .detail-collapse,
      .detail-collapse {
        display: block !important;
        grid-template-rows: none !important;
        opacity: 1 !important;
      }
      .detail-inner { overflow: visible !important; }

      function normChar(ch) {
        if (/[\u064B-\u065F\u0670\u0640]/.test(ch)) return "";
        if (/[\u0622\u0623\u0625\u0671]/.test(ch)) return "\u0627";
        if (ch === "\u0629") return "\u0647";
        if (ch === "\u0649") return "\u064A";
        return ch.normalize("NFD").replace(/[\u0300-\u036F]/g, "").toLowerCase();
      }

      function normText(str) {
        const raw = String(str ?? "");
        let out = "";
        for (let i = 0; i < raw.length; i++) out += normChar(raw[i]);
        return out;
      }

      function findMatchRanges(raw, qNorm) {
        if (!qNorm) return [];
        const chars = [], starts = [], ends = [];
        for (let i = 0; i < raw.length; i++) {
          const nc = normChar(raw[i]);
          for (let j = 0; j < nc.length; j++) {
            chars.push(nc[j]);
            starts.push(i);
            ends.push(i + 1);
          }
        }
        const hay = chars.join("");
        const ranges = [];
        let pos = 0;
        while (pos <= hay.length - qNorm.length) {
          const idx = hay.indexOf(qNorm, pos);
          if (idx === -1) break;
          let rEnd = ends[idx + qNorm.length - 1];
          while (rEnd < raw.length && normChar(raw[rEnd]) === "" && /[\u0300-\u036F\u064B-\u065F\u0670]/.test(raw[rEnd])) rEnd++;
          ranges.push([starts[idx], rEnd]);
          pos = idx + qNorm.length;
        }
        return ranges;
      }

      function renderSliceWithHighlights(raw, sliceStart, sliceEnd, ranges) {
        if (!ranges.length) return esc(raw.slice(sliceStart, sliceEnd));
        let out = "", cur = sliceStart;
        for (let i = 0; i < ranges.length; i++) {
          const rs = Math.max(sliceStart, ranges[i][0]);
          const re = Math.min(sliceEnd, ranges[i][1]);
          if (re <= rs) continue;
          if (rs > cur) out += esc(raw.slice(cur, rs));
          out += '<mark class="hl">' + esc(raw.slice(rs, re)) + "</mark>";
          cur = re;
        }
        if (cur < sliceEnd) out += esc(raw.slice(cur, sliceEnd));
        return out;
      }

      function fmt(s, isRtl, qNorm) {
        const raw = String(s ?? "");
        const ranges = qNorm ? findMatchRanges(raw, qNorm) : [];
        if (!isRtl) return renderSliceWithHighlights(raw, 0, raw.length, ranges);
        LTR_RE.lastIndex = 0;
        let out = "", last = 0, m;
        while ((m = LTR_RE.exec(raw)) !== null) {
          if (m.index > last) out += renderSliceWithHighlights(raw, last, m.index, ranges);
          const full = m[0];
          const core = full.replace(/(?:\s+[+\-–—·=→/]+|[.,:;–—\-·=→/\s]+)+$/, "");
          const coreEnd = m.index + core.length;
          const fullEnd = m.index + full.length;
          if (core) {
            const cls = core.length <= 13 ? ' class="nowrap-bdi"' : "";
            out += '<bdi dir="ltr"' + cls + ">" + renderSliceWithHighlights(raw, m.index, coreEnd, ranges) + "</bdi>";
            if (fullEnd > coreEnd) out += renderSliceWithHighlights(raw, coreEnd, fullEnd, ranges);
          } else {
            out += renderSliceWithHighlights(raw, m.index, fullEnd, ranges);
          }
          last = fullEnd;
        }
        if (last < raw.length) out += renderSliceWithHighlights(raw, last, raw.length, ranges);
        return out;
      }

      function b64ToBytes(b64) {
        const bin = atob(b64);
        const arr = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
        return arr;
      }

      async function unlock(rawPin) {
        const clean = String(rawPin || "").replace(/\s+/g, "");
        const keyMat = await crypto.subtle.importKey("raw", new TextEncoder().encode(clean), { name: "PBKDF2" }, false, ["deriveKey"]);
        const aesKey = await crypto.subtle.deriveKey(
          { name: "PBKDF2", salt: b64ToBytes(BUNDLE.salt), iterations: BUNDLE.iter, hash: "SHA-256" },
          keyMat, { name: "AES-GCM", length: 256 }, false, ["decrypt"]
        );
        const buf = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64ToBytes(BUNDLE.iv) }, aesKey, b64ToBytes(BUNDLE.ct));
        return JSON.parse(new TextDecoder().decode(buf));
      }

        const br = activeBtn.getBoundingClientRect();
        if (!br.width) return;
        const bl = parseFloat(getComputedStyle(parent).borderLeftWidth) || 0;
        const x = br.left - pr.left - bl;
        if (instant) pill.style.transition = "none";
        pill.style.width = br.width.toFixed(2) + "px";
        pill.style.transform = "translate3d(" + x.toFixed(2) + "px, 0, 0)";
        pill.style.opacity = "1";

        if (prefix === "cg" && secs.cognition && secs.cognition.items && secs.cognition.items[idx]) {

          return { key, secId: "mood", secNum: secs.mood.num, title: secs.mood.items[idx].lead };

      function buildSummaryText() {
        if (!data || !data[lang]) return "";
        const d = data[lang];
        const ui = d.ui || {};
        const secs = d.sections || {};
        const lines = [];
        lines.push((ui.notesPrintHeading || "Clinician Notes") + " — " + d.title + " (" + d.date + ")");
        lines.push("=".repeat(54));
        if (generalNote.trim()) {
          lines.push("");
          lines.push("[" + (ui.notesGeneralLabel || "Consultation summary") + "]");
          lines.push(generalNote.trim());
        }
        if (discussedQuestions.size && secs.questions && secs.questions.items) {
          lines.push("");
          lines.push("[" + secs.questions.num + " · " + secs.questions.title + "]");
          secs.questions.items.forEach((q, i) => {
            if (discussedQuestions.has("q-" + i)) {
              lines.push("✓ " + String(i + 1).padStart(2, "0") + ". " + q.lead);
            }
          });
        }
        const annotKeys = getAnnotatedItemKeys();
        if (annotKeys.length) {
          lines.push("");
          lines.push("[" + (ui.notesItemsLabel || "Pinned & commented items") + "]");
          annotKeys.forEach((k) => {
            const meta = getItemMeta(k);
            if (!meta) return;
            const star = pinnedItems.has(k) ? "★ " : "• ";
            const note = (itemNotes.get(k) || "").trim();
            lines.push(star + "[" + meta.secNum + "] " + meta.title);
            if (note) lines.push("   → " + note.replace(/\n/g, "\n     "));
          });
        }
        return lines.join("\n");
      }

        mobNextBtn.setAttribute("aria-label", ui.nextSec || "Next section");
        mobTopBtn.setAttribute("aria-label", ui.topBtn || "Back to top");
      }

      function syncNavFade() {
        if (!navLinks) return;
        const maxSl = navLinks.scrollWidth - navLinks.clientWidth;
        navLinks.classList.remove("fade-left", "fade-right", "fade-both");
        if (maxSl <= 2) return;
        const r = navLinks.getBoundingClientRect();
        const first = navLinks.firstElementChild;
        const last = navLinks.lastElementChild;
        if (!first || !last) return;
        const fRect = first.getBoundingClientRect();
        const lRect = last.getBoundingClientRect();
        const minL = Math.min(fRect.left, lRect.left);
        const maxR = Math.max(fRect.right, lRect.right);
        const clipL = minL < r.left - 2;
        const clipR = maxR > r.right + 2;
        if (clipL && clipR) navLinks.classList.add("fade-both");
        else if (clipL) navLinks.classList.add("fade-left");
        else if (clipR) navLinks.classList.add("fade-right");
      }

      function scrollNavItemIntoView(btn) {
        if (!btn || !navLinks) return;
        if (getComputedStyle(stickyChrome).position === "static") return;
        if (navLinks.scrollWidth <= navLinks.clientWidth + 1) return;
        const cRect = navLinks.getBoundingClientRect();
        const bRect = btn.getBoundingClientRect();
        if (bRect.left >= cRect.left + 8 && bRect.right <= cRect.right - 8) return;
        const delta = (bRect.left - cRect.left) - (cRect.width - bRect.width) / 2;
        navLinks.scrollTo({ left: navLinks.scrollLeft + delta, behavior: "smooth" });
      }

        const visSet = new Set(getVisibleNavIds());
        navLinks.querySelectorAll(".nav-link").forEach((b) => {

        });
        marginRail.querySelectorAll(".rail-item").forEach((b) => {
          b.style.opacity = visSet.has(b.dataset.target) ? "" : "0.45";
        });
      }

        navLinks.querySelectorAll(".nav-link").forEach((b) => {
          const active = b.dataset.target === id;
          b.classList.toggle("is-active", active);
          if (active) b.setAttribute("aria-current", "location");
          else b.removeAttribute("aria-current");
          if (active && scrollNavIntoView) scrollNavItemIntoView(b);
        });
        marginRail.querySelectorAll(".rail-item").forEach((b) => {
          const active = b.dataset.target === id;
          b.classList.toggle("is-active", active);
          if (active) b.setAttribute("aria-current", "location");
          else b.removeAttribute("aria-current");
        });
        syncMobileDock();

      function jumpToSection(id, opts) {
        const options = opts || {};
        if (document.activeElement === searchInput) searchInput.blur();
        hideQuickPop();
        toggleReadPop(false);
        const itemKey = options.itemKey || "";
        let targetEl = itemKey ? document.getElementById("item-" + itemKey) : document.getElementById("sec-" + id);

          searchQuery = "";
          searchInput.value = "";
          activeLens = "all";
          renderBrief(false);
          targetEl = itemKey ? document.getElementById("item-" + itemKey) : document.getElementById("sec-" + id);
        }
        if (!targetEl) targetEl = document.getElementById("sec-" + id);
        if (!targetEl) return;

        if (options.fromSec && (options.fromSec !== id || window.scrollY < 160)) {
          showReturnToast(options.fromSec, window.scrollY);
        }
        if (itemKey && density === "brief" && targetEl.hasAttribute("data-exp-card")) {
          toggleItemInPlace(itemKey, true);
        }
        spyLockUntil = Date.now() + 780;
        setActiveNav(id, true);
        const extraPad = itemKey ? 8 : 0;
        const top = Math.max(0, targetEl.getBoundingClientRect().top + window.scrollY - getStickyOffset() - extraPad);
        window.scrollTo({ top, behavior: "smooth" });
        targetEl.classList.remove("is-pulsed");
        void targetEl.offsetWidth;
        targetEl.classList.add("is-pulsed");
      }

      function stepSection(dir) {
        const vis = getVisibleNavIds();
        if (!vis.length) return;
        let idx = vis.indexOf(activeNav);
        if (idx === -1) idx = 0;
        const nextIdx = Math.max(0, Math.min(vis.length - 1, idx + dir));
        if (nextIdx !== idx || !document.getElementById("sec-" + activeNav)) {
          jumpToSection(vis[nextIdx]);
        }
      }

      function scrollToTopSmooth() {
        spyLockUntil = Date.now() + 650;
        const vis = getVisibleNavIds();
        if (vis.length) setActiveNav(vis[0], true);
        window.scrollTo({ top: 0, behavior: "smooth" });
      }

      function updateScrollUI() {
        if (!data || appShell.hidden) return;
        const sy = window.scrollY || 0;
        const maxScroll = Math.max(1, document.documentElement.scrollHeight - window.innerHeight);
        const pct = Math.max(0, Math.min(1, sy / maxScroll));
        const tf = "scaleX(" + pct.toFixed(4) + ")";
        readProgressFill.style.transform = tf;
        mobProgressFill.style.transform = tf;

        stickyChrome.classList.toggle("is-scrolled", sy > 10);
        floatTopBtn.classList.toggle("is-visible", sy > 360);
        mobTopBtn.disabled = sy <= 20;

        const railTop = marginRail.querySelector(".rail-top-btn");
        if (railTop) railTop.classList.toggle("is-dim", sy < 240);
        const railFill = marginRail.querySelector(".rail-progress-fill");
        if (railFill) railFill.style.transform = "scaleY(" + pct.toFixed(4) + ")";

        if (Date.now() < spyLockUntil) return;
        const vis = getVisibleNavIds();
        if (!vis.length) return;

        if (sy + window.innerHeight >= document.documentElement.scrollHeight - 28) {
          const lastId = vis[vis.length - 1];
          if (lastId !== activeNav) setActiveNav(lastId, true);
          return;
        }

        const offset = getStickyOffset() + 42;
        let bestId = vis[0];
        let bestTop = -Infinity;
        for (let i = 0; i < vis.length; i++) {
          const id = vis[i];
          const el = document.getElementById("sec-" + id);
          if (!el) continue;
          const top = el.getBoundingClientRect().top;
          if (top <= offset && top > bestTop) {
            bestTop = top;
            bestId = id;
          }
        }
        if (bestId !== activeNav) setActiveNav(bestId, true);
      }

      /* Search Match Stepper & Quick Filters */
      function refreshSearchMarks(preserveIdx) {
        const prevIdx = preserveIdx ? activeMarkIdx : -1;
        searchMarks = Array.from(briefMain.querySelectorAll("mark.hl")).filter((m) => {
          if (m.closest(".brief-root.is-brief .expandable:not(.is-open):not(.is-search-open) .detail-collapse")) return false;
          const rect = m.getBoundingClientRect();
          return rect.width > 0 && rect.height > 0;
        });
        if (prevIdx >= 0 && prevIdx < searchMarks.length) {
          activeMarkIdx = prevIdx;
          searchMarks[activeMarkIdx].classList.add("is-current");
          searchCount.textContent = (activeMarkIdx + 1) + "/" + searchMarks.length;
        } else {
          activeMarkIdx = -1;
        }
        setHidden(searchStepGroup, !searchQuery.trim() || searchMarks.length === 0);
      }

      function stepSearchMatch(dir) {
        if (!searchMarks.length) return;
        if (activeMarkIdx >= 0 && searchMarks[activeMarkIdx]) {
          searchMarks[activeMarkIdx].classList.remove("is-current");
        }
        if (activeMarkIdx === -1) activeMarkIdx = dir >= 0 ? 0 : searchMarks.length - 1;
        else activeMarkIdx = (activeMarkIdx + dir + searchMarks.length) % searchMarks.length;
        const cur = searchMarks[activeMarkIdx];
        cur.classList.add("is-current");
        cur.scrollIntoView({ behavior: "smooth", block: "center" });
        searchCount.textContent = (activeMarkIdx + 1) + "/" + searchMarks.length;
      }

      function hideQuickPop() { setHidden(quickPop, true); }

      function updateSearchChrome(matchTotal, qNorm, preserveMarkIdx) {
        const ui = data && data[lang] && data[lang].ui;

        refreshSearchMarks(Boolean(preserveMarkIdx));

      /* Mobile Quick-Jump Sheet & Keyboard Shortcuts Modal */
      function syncOverlayBodyLock() {
        const mobileDrawerOpen = notesOpen && window.innerWidth < 1180;
        const open = !mobSheetWrap.hidden || !scModalWrap.hidden || mobileDrawerOpen;
        document.body.classList.toggle("has-overlay", open);
      }

      function getFocusables(container) {
        return Array.from(container.querySelectorAll('button:not([disabled]), [href], input:not([disabled]), textarea:not([disabled]), [tabindex]:not([tabindex="-1"])'))
          .filter((el) => el.offsetParent !== null);
      }

      function trapDialogFocus(e, container) {
        if (e.key !== "Tab") return;
        const focusables = getFocusables(container);
        if (!focusables.length) return;
        const first = focusables[0];
        const last = focusables[focusables.length - 1];
        if (e.shiftKey) {
          if (document.activeElement === first || !container.contains(document.activeElement)) {
            e.preventDefault();
            last.focus();
          }
        } else if (document.activeElement === last || !container.contains(document.activeElement)) {
          e.preventDefault();
          first.focus();
        }
      }

                ).join("")

            + '<div class="sheet-pill-row">'

              + '<button class="sheet-act-btn" type="button" data-sheet-act="search">' + esc(ui.drawerSearch || "Search") + "</button>"
              + '<button class="sheet-act-btn' + (density === "brief" ? " is-active" : "") + '" type="button" data-sheet-act="density">' + esc(density === "brief" ? ui.densityBrief : ui.densityFull) + "</button>"
              + (density === "brief" && !qTrim
                ? '<button class="sheet-act-btn" type="button" data-sheet-act="expand-all">' + esc(allOpen ? (ui.collapseAll || "Collapse all") : (ui.expandAll || "Expand all")) + "</button>"
                : "")
              + '<button class="sheet-act-btn" type="button" data-sheet-act="theme">' + esc(isDark ? ui.themeLight : ui.themeDark) + "</button>"

      /* Interactive Tooltip Engine (Lab Gauges & Biomarkers) */
      function showTooltip(title, body, clientX, clientY) {
        if (!title && !body) return;
        const isRtlTip = root.dir === "rtl";
        vizTooltip.innerHTML =
          (title ? '<div class="viz-tip-title">' + fmt(title, isRtlTip, "") + "</div>" : "")
          + (body ? '<div class="viz-tip-body">' + fmt(body, isRtlTip, "") + "</div>" : "");
        vizTooltip.classList.add("is-visible");
        vizTooltip.setAttribute("aria-hidden", "false");
        const tw = vizTooltip.offsetWidth || 200;
        const th = vizTooltip.offsetHeight || 46;
        const pad = 12;
        let x = clientX - tw / 2;
        if (x < pad) x = pad;
        if (x + tw > window.innerWidth - pad) x = window.innerWidth - tw - pad;
        let y = clientY - th - 14;
        if (y < pad) y = clientY + 18;
        vizTooltip.style.transform = "translate3d(" + Math.round(x) + "px," + Math.round(y) + "px,0)";
      }

      function hideTooltip() {
        vizTooltip.classList.remove("is-visible");
        vizTooltip.setAttribute("aria-hidden", "true");
      }

      /* =======================================================================
         LAB BIOMARKER GAUGES
         ======================================================================= */
      function renderSpotlightGauge(lb, refLbl) {
        const W = 860, H = 34;
        const padL = 14, padR = 14, trackW = W - padL - padR;
        const span = Math.max(0.1, lb.max - lb.min);
        const mapX = (v) => padL + Math.max(0, Math.min(1, (v - lb.min) / span)) * trackW;

        const zL = mapX(lb.rLow);
        const zR = mapX(lb.rHigh);
        const cX = mapX(lb.curr);
        const trackY = 9, trackH = 7;

        const tipT = esc(lb.label + " (" + lb.date + ")");
        const tipB = esc(lb.currStr + " " + lb.unit + " · " + (refLbl || "Ref") + " " + lb.ref + (lb.note ? " — " + lb.note : ""));

        return '<svg class="viz-svg spot-svg" viewBox="0 0 ' + W + " " + H + '" dir="ltr" direction="ltr" role="img" aria-label="' + tipT + ": " + tipB + '">'
          + '<rect x="' + padL + '" y="' + trackY + '" width="' + trackW + '" height="' + trackH + '" rx="3.5" fill="var(--track-bg)"></rect>'
          + '<rect x="' + padL + '" y="' + trackY + '" width="' + Math.max(0, zL - padL).toFixed(1) + '" height="' + trackH + '" rx="3.5" fill="var(--caution-bg)"></rect>'
          + '<rect x="' + zL.toFixed(1) + '" y="' + trackY + '" width="' + Math.max(4, zR - zL).toFixed(1) + '" height="' + trackH + '" rx="2" fill="var(--zone-bg)"></rect>'
          + '<line x1="' + zL.toFixed(1) + '" y1="' + (trackY - 3) + '" x2="' + zL.toFixed(1) + '" y2="' + (trackY + trackH + 3.5) + '" stroke="var(--zone-edge)" stroke-width="1.6"></line>'
          + '<line x1="' + zR.toFixed(1) + '" y1="' + (trackY - 3) + '" x2="' + zR.toFixed(1) + '" y2="' + (trackY + trackH + 3.5) + '" stroke="var(--zone-edge)" stroke-width="1.6"></line>'
          + '<text x="' + zL.toFixed(1) + '" y="' + (trackY + trackH + 14.5) + '" text-anchor="middle" direction="ltr" fill="var(--text-3)" font-size="11" font-weight="600" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">' + esc(lb.rLow.toFixed(1)) + "</text>"
          + '<text x="' + zR.toFixed(1) + '" y="' + (trackY + trackH + 14.5) + '" text-anchor="middle" direction="ltr" fill="var(--text-3)" font-size="11" font-weight="600" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">' + esc(lb.rHigh.toFixed(1)) + "</text>"
          + '<g class="svg-hit" tabindex="0" data-tip-title="' + tipT + '" data-tip-body="' + tipB + '">'
            + '<circle cx="' + cX.toFixed(1) + '" cy="' + (trackY + trackH / 2) + '" r="10.5" fill="var(--amber-soft)"></circle>'
            + '<circle cx="' + cX.toFixed(1) + '" cy="' + (trackY + trackH / 2) + '" r="5.2" fill="var(--amber)" stroke="var(--surface)" stroke-width="2"></circle>'
            + '<circle cx="' + cX.toFixed(1) + '" cy="' + (trackY + trackH / 2) + '" r="16" fill="transparent"></circle>'
          + "</g>"
          + "</svg>";
      }

      function renderMiniBar(lb, qNorm) {
        const span = Math.max(0.01, lb.max - lb.min);
        const clamp = (v) => Math.max(2, Math.min(98, ((v - lb.min) / span) * 100));
        const zL = Math.max(0, Math.min(100, ((lb.rLow - lb.min) / span) * 100));
        const zR = Math.max(0, Math.min(100, ((lb.rHigh - lb.min) / span) * 100));
        const cP = clamp(lb.curr);
        let prevHtml = "";
        if (typeof lb.prev === "number") {
          const pP = clamp(lb.prev);
          const dL = Math.min(pP, cP);
          const dW = Math.abs(cP - pP);
          prevHtml = '<span class="mini-delta" style="left:' + dL.toFixed(1) + "%;width:" + dW.toFixed(1) + '%"></span>'
            + '<span class="mini-dot-prev" style="left:' + pP.toFixed(1) + '%"></span>';
        }
        return '<div class="mini-viz" dir="ltr">'
          + '<div class="mini-track" aria-hidden="true">'
            + '<span class="mini-zone" style="left:' + zL.toFixed(1) + "%;width:" + Math.max(3, zR - zL).toFixed(1) + '%"></span>'
            + prevHtml
            + '<span class="mini-dot-curr" style="left:' + cP.toFixed(1) + '%"></span>'
          + "</div>"
          + (lb.ref ? '<span class="mini-ref">' + fmt(lb.ref, false, qNorm) + "</span>" : "")
          + "</div>";
      }

          ? '<button id="railExpandBtn" class="rail-tool-btn is-accent" type="button" data-rail-act="' + (allOpen ? "collapse-all" : "expand-all") + '">'
              + esc(allOpen ? (ui.collapseAll || "Collapse all") : (ui.expandAll || "Expand all"))
            + "</button>"
          : "";
        const noteCnt = getTotalAnnotationCount();

        marginRail.innerHTML =
          '<div class="rail-kicker-row">'
            + '<span class="rail-kicker">' + esc(ui.chaptersLabel || "Contents") + "</span>"
          + "</div>"
          + '<div class="rail-list">'
            + '<span class="rail-progress-track" aria-hidden="true"><span class="rail-progress-fill"></span></span>'

                const active = k === activeNav;

                return '<button class="rail-item' + (active ? " is-active" : "") + '" type="button" data-target="' + esc(k) + '"' + (active ? ' aria-current="location"' : "") + ">"
                  + '<span class="rail-num"><bdi dir="ltr">' + esc(num) + "</bdi></span>"
                  + '<span class="rail-lbl">' + fmt(navMap[k], isRtl, "") + "</span>"
                  + dot
                  + "</button>";
              }).join("")
          + "</div>"
          + '<div class="rail-tools">'
            + railExpandHtml
            + '<button id="railNotesBtn" class="rail-tool-btn" style="width:100%;justify-content:center" type="button" data-rail-act="notes">' + esc((ui.notesShort || ui.notesTitle || "Notes") + (noteCnt > 0 ? " (" + noteCnt + ")" : "")) + "</button>"
            + '<button class="rail-tool-btn rail-top-btn' + ((window.scrollY || 0) < 240 ? " is-dim" : "") + '" type="button" data-rail-act="top" title="' + esc(ui.topBtn || "Top") + '">' + ICO_UP + "<span>" + esc(ui.topBtn || "Top") + "</span></button>"

      /* =======================================================================

      function renderExpandBtn(key, expandedNow, ui, hideForSearch) {

      function renderDetailBlock(item, isRtl, qNorm) {
        if (!hasItemDetail(item)) return "";
        const colonSep = lang === "fr" ? "\u00A0: " : ": ";

          inner = '<ul class="detail-points">'
