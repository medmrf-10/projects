      function renderXrefs(targets, fromSec, secs, ui, isRtl) {
        if (!targets || !targets.length) return "";
        const navMap = ui.nav || {};
        return '<div class="xref-row">' + targets.filter((t) => secs[t]).map((t) => {
          const num = secs[t].num;
          const lbl = navMap[t] || secs[t].title;
          return '<button class="xref-chip" type="button" data-jump-sec="' + esc(t) + '" data-from-sec="' + esc(fromSec) + '">'
            + ICO_JUMP + '<span><bdi dir="ltr">' + esc(num) + "</bdi> · " + fmt(lbl, isRtl, "") + "</span></button>";
        }).join("") + "</div>";
      }

      function renderTriageStrip(d, secs, ui, isRtl, hasQ) {
        if (hasQ || !Array.isArray(d.triage) || !d.triage.length) return "";
        let modeBarHtml = "";
        if (density === "brief") {
          const allKeys = getAllExpandableKeys(secs);
          const openCount = allKeys.filter((k) => expandedItems.has(k)).length;
          const allOpen = allKeys.length > 0 && openCount === allKeys.length;
          modeBarHtml = '<div class="brief-mode-bar">'
            + '<span id="briefCounter" class="brief-counter">' + esc((ui.openedCount || "{open}/{total}").replace("{open}", String(openCount)).replace("{total}", String(allKeys.length))) + "</span>"
            + '<button id="briefToggleAll" class="brief-toggle-all" type="button" data-toggle-all="' + (allOpen ? "collapse" : "expand") + '">'
              + esc(allOpen ? (ui.collapseAll || "Collapse all") : (ui.expandAll || "Expand all"))
            + "</button>"
          + "</div>";
        }

        const cardsHtml = d.triage.map((t) =>
          '<button class="triage-card tone-' + esc(t.tone || "teal") + '" type="button" data-jump-sec="' + esc(t.targetSec) + '"'
            + (t.targetItem ? ' data-jump-item="' + esc(t.targetItem) + '"' : "")
            + ' data-from-sec="priorities">'
            + '<div class="triage-top">'
              + '<span class="triage-lbl">' + fmt(t.label, isRtl, "") + "</span>"
              + '<span class="triage-arrow" aria-hidden="true">' + ICO_ARROW + "</span>"
            + "</div>"
            + '<ul class="triage-lines">'
              + (t.lines || []).map((ln) => '<li class="triage-line">' + fmt(ln, isRtl, "") + "</li>").join("")
            + "</ul>"
          + "</button>"
        ).join("");

        return '<section class="triage-strip" aria-label="' + esc(ui.triageLabel || "Clinical signals") + '">'
          + '<div class="triage-head">'
            + '<div class="triage-head-l">'
              + '<span class="kicker">' + esc(ui.triageLabel || "At-a-Glance Signals") + "</span>"
              + '<span class="triage-sub">' + esc(density === "brief" ? (ui.briefHint || ui.triageSub || "") : (ui.triageSub || "")) + "</span>"
            + "</div>"
            + modeBarHtml
          + "</div>"
          + '<div class="triage-grid">' + cardsHtml + "</div>"
        + "</section>";
      }

      /* =======================================================================
         MAIN BRIEF RENDERER
         ======================================================================= */
      function renderBrief(animate, opts) {
        if (!data || !data[lang]) return;
        const ropts = opts || {};
        const d = data[lang];
        const ui = d.ui || {};
        const secs = d.sections || {};
        const isRtl = d.dir === "rtl";
        const qNorm = normText(searchQuery.trim());
        const hasQ = Boolean(qNorm);
        let matchCount = 0;

        const matches = (...parts) => !hasQ || parts.some((p) => normText(p).includes(qNorm));
        const matchesList = (arr) => !hasQ || (Array.isArray(arr) && arr.some((p) => normText(p).includes(qNorm)));
        const mastheadMatch = hasQ && matches(d.title, d.subtitle, d.profileLine, d.date);
        if (mastheadMatch) matchCount += 1;

        const renderProseItems = (items, prefix) => {
          const kept = (items || []).map((it, i) => ({ it, i })).filter(({ it }) =>
            matches(it.lead, it.brief, ...(it.tags || []), ...itemDetailTexts(it))
          );
          if (hasQ) matchCount += kept.length;
          const html = kept.map(({ it, i }) => {
            const key = prefix + "-" + i;
            const hasDet = hasItemDetail(it);
            const isOpen = expandedItems.has(key);
            const detMatch = hasQ && hasDet && matchesList(itemDetailTexts(it));
            const searchOpen = hasQ && density === "brief" && detMatch;
            const expNow = density === "full" || isOpen || searchOpen;
            const toneCls = it.tone ? " tone-" + esc(it.tone) : "";
            return '<li id="item-' + esc(key) + '" class="prose-item' + toneCls + (hasDet ? " expandable" : "") + (isOpen ? " is-open" : "") + (searchOpen ? " is-search-open" : "") + '"' + (hasDet ? ' data-exp-card="' + esc(key) + '"' : "") + ">"
              + '<div class="prose-item-head"><span class="prose-lead">' + fmt(it.lead, isRtl, qNorm) + "</span>" + (hasDet ? renderExpandBtn(key, expNow, ui, searchOpen) : "") + "</div>"
              + renderTags(it.tags, isRtl, qNorm)
              + '<p class="prose-brief">' + fmt(it.brief, isRtl, qNorm) + "</p>"
              + renderDetailBlock(it, isRtl, qNorm)
            + "</li>";
          }).join("");
          return { kept, html };
        };

        const sectionsHtml = [];

        /* 01 · PRIORITIES */
        const s1 = secs.priorities;
        if (s1) {
          const ccMatch = matches(s1.chiefComplaintLabel, s1.chiefComplaint);
          const keptGoals = (s1.goals || []).map((g, i) => ({ g, i })).filter(({ g }) => matches(g.title, g.brief, ...itemDetailTexts(g)));
          const keptSynth = (s1.synthesis || []).map((s, i) => ({ s, i })).filter(({ s }) => matches(s.lead, s.text));
          if (hasQ) matchCount += (ccMatch ? 1 : 0) + keptGoals.length + keptSynth.length;

          if (ccMatch || keptGoals.length || keptSynth.length) {
            const goalsHtml = keptGoals.map(({ g, i }) => {
              const key = "p-" + i;
              const hasDet = hasItemDetail(g);
              const isOpen = expandedItems.has(key);
              const detMatch = hasQ && hasDet && matchesList(itemDetailTexts(g));
              const searchOpen = hasQ && density === "brief" && detMatch;
              const expNow = density === "full" || isOpen || searchOpen;
              return '<li id="item-' + esc(key) + '" class="goal-row' + (hasDet ? " expandable" : "") + (isOpen ? " is-open" : "") + (searchOpen ? " is-search-open" : "") + '"' + (hasDet ? ' data-exp-card="' + esc(key) + '"' : "") + ">"
                + '<div class="goal-top-bar">'
                  + '<span class="goal-idx"><bdi dir="ltr">' + String(i + 1) + ".</bdi></span>"
                  + (hasDet ? renderExpandBtn(key, expNow, ui, searchOpen) : "")
                + "</div>"
                + '<div class="goal-body">'
                  + '<span class="goal-title">' + fmt(g.title, isRtl, qNorm) + "</span>"
                  + '<p class="goal-brief">' + fmt(g.brief, isRtl, qNorm) + "</p>"
                  + renderDetailBlock(g, isRtl, qNorm)
                + "</div>"
              + "</li>";
            }).join("");

            const synthHtml = keptSynth.map(({ s, i }) =>
              '<div class="synth-col">'
                + '<div><h4 class="synth-lead">' + fmt(s.lead, isRtl, qNorm) + '</h4><p class="synth-text">' + fmt(s.text, isRtl, qNorm) + "</p></div>"
                + renderXrefs(SYNTH_TARGETS[i], "priorities", secs, ui, isRtl)
              + "</div>"
            ).join("");

            sectionsHtml.push(
              '<section id="sec-priorities" class="ed-section">'
                + renderSecHead(s1, "priorities", secs, ui, isRtl, qNorm, "", hasQ)
                + (ccMatch ? '<div class="chief-block"><div class="kicker">' + fmt(s1.chiefComplaintLabel, isRtl, qNorm) + '</div><p class="chief-text">' + fmt(s1.chiefComplaint, isRtl, qNorm) + "</p></div>" : "")
                + (keptGoals.length ? '<div class="goals-block"><div class="kicker">' + fmt(s1.goalsLabel, isRtl, "") + '</div><ol class="goals-list">' + goalsHtml + "</ol></div>" : "")
                + (keptSynth.length ? '<div><div class="kicker">' + fmt(s1.synthesisLabel, isRtl, "") + '</div><div class="synth-grid">' + synthHtml + "</div></div>" : "")
              + "</section>"
            );
          }
        }

        /* 02 · COGNITION */
        const s2 = secs.cognition;
        if (s2) {
          const proseMatch = matches(s2.takeaway);
          if (hasQ && proseMatch) matchCount += 1;
          const cog = renderProseItems(s2.items, "cg");
          if (proseMatch || cog.kept.length) {
            sectionsHtml.push(
              '<section id="sec-cognition" class="ed-section">'
                + renderSecHead(s2, "cognition", secs, ui, isRtl, qNorm, "", hasQ)
                + (proseMatch ? '<p class="lead-prose">' + fmt(s2.takeaway, isRtl, qNorm) + "</p>" : "")
                + (cog.kept.length ? '<ul class="prose-list">' + cog.html + "</ul>" : "")
              + "</section>"
            );
          }
        }

        /* 03 · SLEEP & COURSE */
        const s3 = secs.sleep;
        if (s3) {
          const sumMatch = matches(s3.summary);
          const keptTl = (s3.timeline || []).filter((t) => matches(t.stage, t.age, t.note));
          if (hasQ) matchCount += (sumMatch ? 1 : 0) + keptTl.length;
          const sl = renderProseItems(s3.items, "sl");

          if (sumMatch || sl.kept.length || keptTl.length) {
            const tlFiltered = hasQ && keptTl.length < (s3.timeline || []).length;
            const tlHtml = keptTl.map((t) =>
              '<li class="life-node' + (t.current ? " is-current" : "") + '">'
                + '<span class="life-age">' + fmt(t.age, isRtl, qNorm) + "</span>"
                + '<span class="life-dot-wrap" aria-hidden="true"><span class="life-dot"></span></span>'
                + '<span class="life-stage">' + fmt(t.stage, isRtl, qNorm) + "</span>"
                + '<span class="life-note">' + fmt(t.note, isRtl, qNorm) + "</span>"
              + "</li>"
            ).join("");

            sectionsHtml.push(
              '<section id="sec-sleep" class="ed-section">'
                + renderSecHead(s3, "sleep", secs, ui, isRtl, qNorm, "", hasQ)
                + (sumMatch ? '<p class="lead-prose">' + fmt(s3.summary, isRtl, qNorm) + "</p>" : "")
                + (sl.kept.length ? '<ul class="prose-list">' + sl.html + "</ul>" : "")
                + (keptTl.length ? '<div class="life-wrap"><div class="kicker">' + fmt(s3.timelineTitle, isRtl, "") + '</div><ol class="life-rail' + (tlFiltered ? " is-filtered" : "") + '">' + tlHtml + "</ol></div>" : "")
              + "</section>"
            );
          }
        }

        /* 04 · MOOD & BEHAVIOR */
        const s4 = secs.mood;
        if (s4) {
          const sumMatch = matches(s4.summary);
          if (hasQ && sumMatch) matchCount += 1;
          const md = renderProseItems(s4.items, "md");

          if (sumMatch || md.kept.length) {
            sectionsHtml.push(
              '<section id="sec-mood" class="ed-section">'
                + renderSecHead(s4, "mood", secs, ui, isRtl, qNorm, "", hasQ)
                + (sumMatch ? '<p class="lead-prose">' + fmt(s4.summary, isRtl, qNorm) + "</p>" : "")
                + (md.kept.length ? '<ul class="prose-list">' + md.html + "</ul>" : "")
              + "</section>"
            );
          }
        }

        /* 05 · SAFETY & SIGNAL-FIRST LABS */
        const s5 = secs.safety;
        if (s5) {
          const keptBase = (s5.baselineItems || []).map((b, i) => ({ b, i })).filter(({ b }) =>
            matches(b.badge, b.lead, b.brief, ...itemDetailTexts(b))
          );
          const accMatch = s5.accessNote && matches(s5.accessNote);
          const allLabs = s5.labs || [];
          const groups = s5.labsGroups || {};
          const refLbl = ui.refShort || (lang === "fr" ? "Réf." : (lang === "ar" ? "المرجع" : "Ref"));
          const matchLab = (lb) => matches(lb.label, lb.date, lb.currStr, lb.prevStr, lb.unit, lb.ref, lb.note);
          const labsTitleMatch = hasQ && matches(s5.labsTitle);
          const defGroupMatch = hasQ && groups.deficiency && matches(groups.deficiency.title, groups.deficiency.note);
          const normGroupMatch = hasQ && groups.normal && matches(groups.normal.title, groups.normal.note);
          const spotLabs = allLabs.filter((lb) => lb.group === "spotlight" && (labsTitleMatch || matchLab(lb)));
          const repLabs = allLabs.filter((lb) => lb.group === "deficiency" && (labsTitleMatch || defGroupMatch || matchLab(lb)));
          const normLabs = allLabs.filter((lb) => lb.group === "normal" && (labsTitleMatch || normGroupMatch || matchLab(lb)));
          if (hasQ) matchCount += keptBase.length + (accMatch ? 1 : 0) + spotLabs.length + repLabs.length + normLabs.length;

          const hasAnyLabs = spotLabs.length || repLabs.length || normLabs.length;
          if (keptBase.length || accMatch || hasAnyLabs) {
            const baseHtml = keptBase.map(({ b, i }) => {
              const key = "sf-" + i;
              const sev = b.severity || "info";
              const hasDet = hasItemDetail(b);
              const isOpen = expandedItems.has(key);
              const detMatch = hasQ && hasDet && matchesList(itemDetailTexts(b));
              const searchOpen = hasQ && density === "brief" && detMatch;
              const expNow = density === "full" || isOpen || searchOpen;
              const ico = SAFE_ICONS[i % SAFE_ICONS.length];
              return '<div id="item-' + esc(key) + '" class="safety-card sev-' + esc(sev) + (hasDet ? " expandable" : "") + (isOpen ? " is-open" : "") + (searchOpen ? " is-search-open" : "") + '"' + (hasDet ? ' data-exp-card="' + esc(key) + '"' : "") + ">"
                + '<div class="safety-top">'
                  + '<span class="safety-lead-wrap"><span class="safety-ico sev-' + esc(sev) + '">' + ico + '</span><span class="safety-lead">' + fmt(b.lead, isRtl, qNorm) + "</span></span>"
                  + '<span class="safety-right">'
                    + (b.badge ? '<span class="sev-badge sev-' + esc(sev) + '">' + fmt(b.badge, isRtl, qNorm) + "</span>" : "")
                    + (hasDet ? renderExpandBtn(key, expNow, ui, searchOpen) : "")
                  + "</span>"
                + "</div>"
                + '<p class="safety-brief">' + fmt(b.brief, isRtl, qNorm) + "</p>"
                + renderDetailBlock(b, isRtl, qNorm)
              + "</div>";
            }).join("");

            let labsHtml = "";
            if (hasAnyLabs) {
              const filterHtml = hasQ ? "" :
                '<div class="labs-filter" role="group" aria-label="Labs filter">'
                  + '<button class="labs-fbtn' + (labsFilter === "watch" ? " is-active" : "") + '" type="button" data-lab-filter="watch" aria-pressed="' + (labsFilter === "watch" ? "true" : "false") + '">' + esc(ui.labsFilterWatch || "Watch") + "</button>"
                  + '<button class="labs-fbtn' + (labsFilter === "all" ? " is-active" : "") + '" type="button" data-lab-filter="all" aria-pressed="' + (labsFilter === "all" ? "true" : "false") + '">' + esc(ui.labsFilterAll || "All") + "</button>"
                + "</div>";

              const spotHtml = spotLabs.map((lb) =>
                '<div class="lab-spotlight">'
                  + '<div class="spot-top">'
                    + '<span class="spot-left">'
                      + '<span class="spot-lbl">' + fmt(lb.label, isRtl, qNorm) + "</span>"
                      + '<span class="spot-date"><bdi dir="ltr">' + fmt(lb.date, false, qNorm) + "</bdi></span>"
                      + (ui.spotlightBadge ? '<span class="spot-badge">' + fmt(ui.spotlightBadge, isRtl, "") + "</span>" : "")
                    + "</span>"
                    + '<span class="spot-val"><bdi dir="ltr">' + fmt(lb.currStr, false, qNorm) + '<span class="lab-unit">' + fmt(lb.unit, false, qNorm) + "</span></bdi></span>"
                  + "</div>"
                  + '<div dir="ltr">' + renderSpotlightGauge(lb, refLbl) + "</div>"
                  + (lb.note ? '<p class="spot-note">' + fmt(lb.note, isRtl, qNorm) + "</p>" : "")
                + "</div>"
              ).join("");

              const repHtml = repLabs.length
                ? '<div class="lab-subblock">'
                    + '<div class="lab-subhead"><span class="lab-subtitle">' + fmt((groups.deficiency && groups.deficiency.title) || "", isRtl, qNorm) + "</span>"
                      + ((groups.deficiency && groups.deficiency.note) ? '<span class="lab-subnote">' + fmt(groups.deficiency.note, isRtl, qNorm) + "</span>" : "")
                    + "</div>"
                    + '<div class="repleted-grid">' + repLabs.map((lb) => {
                        const tipT = esc(lb.label + " (" + lb.date + ")");
                        const valRange = lb.prevStr ? (lb.prevStr + " → " + lb.currStr) : lb.currStr;
                        const tipB = esc(valRange + " " + lb.unit + " · " + refLbl + " " + lb.ref + (lb.note ? " · " + lb.note : ""));
                        return '<div class="rep-item" tabindex="0" data-tip-title="' + tipT + '" data-tip-body="' + tipB + '">'
                          + '<div class="rep-top"><span class="rep-lbl">' + fmt(lb.label, isRtl, qNorm) + '</span><span class="rep-date"><bdi dir="ltr">' + fmt(lb.date, false, qNorm) + "</bdi></span></div>"
                          + '<div class="rep-val-row">'
                            + '<span class="rep-val"><bdi dir="ltr">' + (lb.prevStr ? '<span class="rep-prev">' + fmt(lb.prevStr, false, qNorm) + '</span><span class="rep-arr">\u2192</span>' : "") + fmt(lb.currStr, false, qNorm) + '<span class="rep-unit">' + fmt(lb.unit, false, qNorm) + "</span></bdi></span>"
                          + "</div>"
                          + renderMiniBar(lb, qNorm)
                          + (lb.note ? '<div class="rep-meta"><span>' + fmt(lb.note, isRtl, qNorm) + "</span></div>" : "")
                        + "</div>";
                      }).join("") + "</div>"
                  + "</div>"
                : "";

              const hideNormal = !hasQ && labsFilter === "watch";
              const revealBtnHtml = hideNormal && normLabs.length
                ? '<button class="labs-reveal-btn" type="button" data-lab-filter="all"><span>' + esc((ui.showNormalLabs || "Show {n} normal parameters").replace("{n}", String(normLabs.length))) + "</span>" + ICO_CHEV + "</button>"
                : "";

              const normHtml = normLabs.length
                ? '<div class="lab-subblock' + (hideNormal ? " is-filter-hidden" : "") + '">'
                    + '<div class="lab-subhead"><span class="lab-subtitle">' + fmt((groups.normal && groups.normal.title) || "", isRtl, qNorm) + "</span></div>"
                    + '<div class="normal-grid">' + normLabs.map((lb) => {
                        const tipT = esc(lb.label + " (" + lb.date + ")");
                        const tipB = esc(lb.currStr + " " + lb.unit + " · " + refLbl + " " + lb.ref);
                        return '<div class="norm-item" tabindex="0" data-tip-title="' + tipT + '" data-tip-body="' + tipB + '">'
                          + '<div class="norm-top">'
                            + '<span class="norm-lbl-wrap"><span class="norm-lbl">' + fmt(lb.label, isRtl, qNorm) + "</span>" + (lb.date ? '<span class="norm-date"><bdi dir="ltr">' + fmt(lb.date, false, qNorm) + "</bdi></span>" : "") + "</span>"
                            + '<span class="norm-val"><bdi dir="ltr">' + fmt(lb.currStr, false, qNorm) + '<span class="norm-unit">' + fmt(lb.unit, false, qNorm) + "</span></bdi></span>"
                          + "</div>"
                          + renderMiniBar(lb, qNorm)
                        + "</div>";
                      }).join("") + "</div>"
                  + "</div>"
                : "";

              labsHtml = '<figure id="fig-05" class="figure-card">'
                + '<div class="labs-head-bar"><h3 class="fig-title">' + fmt(s5.labsTitle, isRtl, qNorm) + "</h3>" + filterHtml + "</div>"
                + spotHtml + repHtml + revealBtnHtml + normHtml
                + "</figure>";
            }

            sectionsHtml.push(
              '<section id="sec-safety" class="ed-section">'
                + renderSecHead(s5, "safety", secs, ui, isRtl, qNorm, "", hasQ)
                + (keptBase.length ? '<div class="safety-grid">' + baseHtml + "</div>" : "")
                + (accMatch ? '<p class="access-note">' + ICO_INFO + "<span>" + fmt(s5.accessNote, isRtl, qNorm) + "</span></p>" : "")
                + labsHtml
              + "</section>"
            );
          }
        }

        /* 06 · CONSULTATION QUESTIONS */
        const s6 = secs.questions;
        if (s6) {
          const totalQ = (s6.items || []).length;
          const keptQ = (s6.items || []).map((q, i) => ({ q, i })).filter(({ q }) => matches(q.lead, q.text));
          if (hasQ) matchCount += keptQ.length;
          if (keptQ.length) {
            const doneCount = discussedQuestions.size;
            const qBadge = '<span id="qCountBadge" class="sec-badge"' + (doneCount > 0 ? "" : " hidden") + ">"
              + esc((ui.discussedCount || "{done}/{total}").replace("{done}", String(doneCount)).replace("{total}", String(totalQ)))
              + "</span>";
            const qHtml = keptQ.map(({ q, i }) => {
              const qKey = "q-" + i;
              const isDone = discussedQuestions.has(qKey);
              return '<li class="q-item' + (isDone ? " is-done" : "") + '">'
                + '<div class="q-top">'
                  + '<span class="q-num"><bdi dir="ltr">' + String(i + 1).padStart(2, "0") + "</bdi></span>"
                  + '<div><h3 class="q-lead">' + fmt(q.lead, isRtl, qNorm) + '</h3><p class="q-text">' + fmt(q.text, isRtl, qNorm) + "</p></div>"
                  + '<button class="q-check" type="button" data-q-toggle="' + esc(qKey) + '" aria-pressed="' + (isDone ? "true" : "false") + '" aria-label="' + esc(ui.discussedLabel || "Mark as discussed") + '" title="' + esc(ui.discussedLabel || "Mark as discussed") + '">' + ICO_CHECK + "</button>"
                + "</div>"
                + '<div class="q-foot">' + renderXrefs(QUESTION_TARGETS[i], "questions", secs, ui, isRtl) + "</div>"
              + "</li>";
            }).join("");

            sectionsHtml.push(
              '<section id="sec-questions" class="ed-section">'
                + renderSecHead(s6, "questions", secs, ui, isRtl, qNorm, qBadge, hasQ)
                + (s6.subtitle ? '<p class="sub-prose">' + fmt(s6.subtitle, isRtl, qNorm) + "</p>" : "")
                + '<ol class="q-grid">' + qHtml + "</ol>"
              + "</section>"
            );
          }
        }

        if (sectionsHtml.length) {
          sectionsHtml[0] = sectionsHtml[0].replace('class="ed-section"', 'class="ed-section is-first"');
        }

        const profileParts = String(d.profileLine || "").split(/\s*·\s*/).filter(Boolean);
        const profileBarHtml = '<div class="profile-bar">'
          + profileParts.map((part) => '<span class="profile-chip">' + fmt(part, isRtl, qNorm) + "</span>").join("")
          + "</div>"
          + '<p class="profile-line-print">' + fmt(d.profileLine, isRtl, "") + "</p>";

        const emptyHtml = hasQ && matchCount === 0
          ? '<div class="search-empty"><p class="search-empty-title">' + esc(ui.searchNoMatch || "No matches") + ' — « ' + esc(searchQuery.trim()) + ' »</p><button id="emptyClearBtn" class="search-empty-btn" type="button">' + esc(ui.searchClear || "Clear") + "</button></div>"
          : "";

        const endCapHtml = !emptyHtml
          ? '<footer class="brief-endcap">'
              + '<span class="endcap-actions">'
                + '<button class="endcap-btn" type="button" data-scroll-top="1">' + ICO_UP + "<span>" + esc(ui.topBtn || "Top") + "</span></button>"
              + "</span>"
            + "</footer>"
          : "";

        briefMain.innerHTML =
          '<article class="brief-root' + (density === "brief" ? " is-brief" : "") + '">'
            + '<header class="masthead">'
              + '<div class="masthead-top">'
                + '<h1 class="doc-title">' + fmt(d.title, isRtl, qNorm) + "</h1>"
                + '<span class="doc-date">' + fmt(d.date, isRtl, "") + "</span>"
              + "</div>"
              + '<p class="doc-sub">' + fmt(d.subtitle, isRtl, qNorm) + "</p>"
              + profileBarHtml
            + "</header>"
            + renderTriageStrip(d, secs, ui, isRtl, hasQ)
            + sectionsHtml.join("")
            + emptyHtml
            + endCapHtml
          + "</article>";

        updateSearchChrome(matchCount, qNorm, Boolean(ropts.preserveMarkIdx));
        syncMobileDock();
        hideTooltip();
        if (ropts.restoreFocusSel) {
          const focusEl = briefMain.querySelector(ropts.restoreFocusSel);
          if (focusEl && typeof focusEl.focus === "function") focusEl.focus({ preventScroll: true });
        }
        if (animate) triggerSwap();
      }

      function renderAll(instantPill, animateSheet) {
        renderChrome(instantPill);
        renderBrief(animateSheet);
        updateScrollUI();
      }

      function clearSearch(focusBack) {
        searchQuery = "";
        searchInput.value = "";
        renderBrief(false);
        if (focusBack) {
          searchInput.focus();
          showQuickPop();
        }
      }

      /* PIN Gate Events */
      gateThemeBtn.addEventListener("click", toggleTheme);
      toggleEye.addEventListener("click", () => {
        const show = pinInput.type === "password";
        pinInput.type = show ? "text" : "password";
        setHidden(eyeOpen, show);
        setHidden(eyeClosed, !show);
        toggleEye.setAttribute("aria-label", show ? "Hide code" : "Show code");
        pinInput.focus();
      });
      pinInput.addEventListener("input", () => { if (gateErr.textContent) gateErr.textContent = ""; });

      gateForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        gateErr.textContent = "";
        gateBtn.disabled = true;
        setHidden(gateSpin, false);
        try {
          data = await unlock(pinInput.value);
          lang = "fr";
          density = "brief";
          labsFilter = "watch";
          searchQuery = "";
          activeNav = "priorities";
          expandedItems.clear();
          discussedQuestions.clear();
          hideReturnToast();
          searchInput.value = "";
          pinInput.value = "";
          gateForm.reset();
          gateScreen.hidden = true;
          appShell.hidden = false;
          renderAll(true, true);
          requestAnimationFrame(() => {
            syncAllPills(true);
            updateScrollUI();
          });
          window.scrollTo({ top: 0, behavior: "instant" });
        } catch {
          gateErr.textContent = "Code incorrect · الرمز غير صحيح · Invalid code";
          gateForm.classList.remove("shake");
          void gateForm.offsetWidth;
          gateForm.classList.add("shake");
          pinInput.select();
        } finally {
          gateBtn.disabled = false;
          setHidden(gateSpin, true);
        }
      });

      /* Language & Density Switchers */
      function switchLanguage(next) {
        if (next && next !== lang && data && data[next]) {
          lang = next;
          spyLockUntil = 0;
          hideQuickPop();
          hideReturnToast();
          renderAll(false, true);
          requestAnimationFrame(() => syncAllPills(false));
        }
      }

      function switchDensity(next) {
        if (next && next !== density && data) {
          density = next;
          labsFilter = next === "full" ? "all" : "watch";
          expandedItems.clear();
          renderChrome(false);
          renderBrief(false);
          requestAnimationFrame(() => {
            syncAllPills(false);
            updateScrollUI();
          });
        }
      }

      langBtns.forEach((btn) => btn.addEventListener("click", () => switchLanguage(btn.dataset.loc)));
      densBtns.forEach((btn) => btn.addEventListener("click", () => switchDensity(btn.dataset.dens)));

      /* Nav Quick-Jump (Top Chrome + Margin Rail) */
      navLinks.addEventListener("scroll", syncNavFade, { passive: true });
      navLinks.addEventListener("click", (e) => {
        const btn = e.target.closest(".nav-link[data-target]");
        if (btn) jumpToSection(btn.dataset.target);
      });
      marginRail.addEventListener("click", (e) => {
        const btn = e.target.closest(".rail-item[data-target]");
        if (btn) { jumpToSection(btn.dataset.target); return; }
        const act = e.target.closest("[data-rail-act]");
        if (!act) return;
        const kind = act.dataset.railAct;
        if (kind === "top") scrollToTopSmooth();
        else if (kind === "shortcuts") openShortcutsModal();
        else if (kind === "expand-all") toggleAllInPlace("expand");
        else if (kind === "collapse-all") toggleAllInPlace("collapse");
      });

      /* Floating Back-to-Top, Return Toast & Mobile Dock */
      floatTopBtn.addEventListener("click", scrollToTopSmooth);
      mobTopBtn.addEventListener("click", scrollToTopSmooth);
      mobPrevBtn.addEventListener("click", () => stepSection(-1));
      mobNextBtn.addEventListener("click", () => stepSection(1));
      mobSheetOpenBtn.addEventListener("click", openMobileSheet);

      returnGoBtn.addEventListener("click", () => {
        if (!returnOrigin) return;
        const orig = returnOrigin;
        hideReturnToast();
        spyLockUntil = Date.now() + 750;
        setActiveNav(orig.secId, true);
        window.scrollTo({ top: orig.scrollY, behavior: "smooth" });
        const el = document.getElementById("sec-" + orig.secId);
        if (el) {
          el.classList.remove("is-pulsed");
          void el.offsetWidth;
          el.classList.add("is-pulsed");
        }
      });
      returnDismissBtn.addEventListener("click", hideReturnToast);

      /* Mobile Sheet Events */
      mobSheetWrap.addEventListener("click", (e) => {
        if (e.target === mobSheetWrap || e.target.closest("[data-close-sheet]")) {
          closeMobileSheet(true);
          return;
        }
        const secBtn = e.target.closest("[data-sheet-sec]");
        if (secBtn) {
          const target = secBtn.dataset.sheetSec;
          closeMobileSheet(false);
          jumpToSection(target);
          return;
        }
        const locBtn = e.target.closest("[data-sheet-loc]");
        if (locBtn) {
          const nextLoc = locBtn.dataset.sheetLoc;
          switchLanguage(nextLoc);
          renderMobileSheetContent('[data-sheet-loc="' + nextLoc + '"]');
          return;
        }
        const actBtn = e.target.closest("[data-sheet-act]");
        if (actBtn) {
          const act = actBtn.dataset.sheetAct;
          if (act === "search") {
            closeMobileSheet(false);
            window.scrollTo({ top: 0, behavior: "smooth" });
            setTimeout(() => { searchInput.focus(); showQuickPop(); }, 220);
          } else if (act === "clear-search") {
            clearSearch(false);
            renderMobileSheetContent("[data-close-sheet]");
          } else if (act === "density") {
            switchDensity(density === "brief" ? "full" : "brief");
            renderMobileSheetContent('[data-sheet-act="density"]');
          } else if (act === "expand-all") {
            toggleAllInPlace();
            renderMobileSheetContent('[data-sheet-act="expand-all"]');
          } else if (act === "theme") {
            toggleTheme();
            renderMobileSheetContent('[data-sheet-act="theme"]');
          } else if (act === "print") {
            closeMobileSheet(false);
            triggerPrint();
          }
        }
      });

      /* Shortcuts Modal Events */
      scBtn.addEventListener("click", openShortcutsModal);
      scModalWrap.addEventListener("click", (e) => {
        if (e.target === scModalWrap || e.target.closest("[data-close-sc]")) closeShortcutsModal(true);
      });

      /* Live Search + Quick Chips + Match Stepper */
      searchInput.addEventListener("focus", showQuickPop);
      searchInput.addEventListener("click", showQuickPop);
      searchInput.addEventListener("input", () => {
        searchQuery = searchInput.value;
        if (searchQuery.trim()) hideQuickPop();
        else showQuickPop();
        renderBrief(false);
        updateScrollUI();
      });
      searchInput.addEventListener("keydown", (e) => {
        if (e.key === "Enter" && searchMarks.length > 0) {
          e.preventDefault();
          stepSearchMatch(e.shiftKey ? -1 : 1);
        }
      });
      searchPrev.addEventListener("click", () => stepSearchMatch(-1));
      searchNext.addEventListener("click", () => stepSearchMatch(1));
      searchClear.addEventListener("click", () => clearSearch(true));

      quickPop.addEventListener("pointerdown", (e) => {
        if (e.target.closest(".quick-chip")) e.preventDefault();
      });
      quickPop.addEventListener("click", (e) => {
        const chip = e.target.closest(".quick-chip[data-qchip]");
        if (!chip) return;
        const val = chip.dataset.qchip;
        searchInput.value = val;
        searchQuery = val;
        hideQuickPop();
        renderBrief(false);
        updateScrollUI();
        if (searchMarks.length > 0) stepSearchMatch(1);
      });
      document.addEventListener("pointerdown", (e) => {
        if (!quickPop.hidden && !searchShell.contains(e.target)) hideQuickPop();
      });

      /* Keyboard Navigation */
      document.addEventListener("keydown", (e) => {
        if (appShell.hidden || !data) return;

        if (!scModalWrap.hidden) {
          if (e.key === "Escape") { e.preventDefault(); closeShortcutsModal(true); return; }
          if (e.key === "Tab") { trapDialogFocus(e, scModal); return; }
          if (e.key === "?" || e.key === "\u061F") { e.preventDefault(); closeShortcutsModal(true); return; }
          return;
        }
        if (!mobSheetWrap.hidden) {
          if (e.key === "Escape") { e.preventDefault(); closeMobileSheet(true); return; }
          if (e.key === "Tab") { trapDialogFocus(e, mobSheet); return; }
          return;
        }

        if ((e.metaKey || e.ctrlKey) && (e.key.toLowerCase() === "k" || e.code === "KeyK")) {
          e.preventDefault();
          searchInput.focus();
          searchInput.select();
          showQuickPop();
          return;
        }

        if (e.key === "Escape") {
          if (!quickPop.hidden) { e.preventDefault(); hideQuickPop(); searchInput.blur(); return; }
          if (searchQuery) { e.preventDefault(); clearSearch(false); return; }
          if (document.activeElement === searchInput) { searchInput.blur(); return; }
          if (returnOrigin) { hideReturnToast(); return; }
        }

        const tag = document.activeElement && document.activeElement.tagName;
        if (tag === "INPUT" || tag === "TEXTAREA" || e.ctrlKey || e.metaKey || e.altKey) return;

        if (e.key === "/" || (e.code === "Slash" && !e.shiftKey)) {
          e.preventDefault();
          searchInput.focus();
          searchInput.select();
          showQuickPop();
        } else if (e.key === "?" || e.key === "\u061F") {
          e.preventDefault();
          openShortcutsModal();
        } else if (e.key >= "1" && e.key <= "6") {
          const targetId = NAV_ORDER[Number(e.key) - 1];
          if (targetId) { e.preventDefault(); jumpToSection(targetId); }
        } else if (e.key === "[" || (!e.shiftKey && e.code === "BracketLeft")) {
          e.preventDefault();
          stepSection(-1);
        } else if (e.key === "]" || (!e.shiftKey && e.code === "BracketRight")) {
          e.preventDefault();
          stepSection(1);
        } else if (e.key === "b" || e.key === "B" || e.code === "KeyB") {
          e.preventDefault();
          switchDensity(density === "brief" ? "full" : "brief");
        } else if ((e.key === "e" || e.key === "E" || e.code === "KeyE") && density === "brief" && !searchQuery.trim()) {
          e.preventDefault();
          toggleAllInPlace();
        } else if (e.key === "d" || e.key === "D" || e.code === "KeyD") {
          e.preventDefault();
          toggleTheme();
        } else if (e.key === "t" || e.key === "T" || e.code === "KeyT") {
          e.preventDefault();
          scrollToTopSmooth();
        }
      });

      /* Main Delegation: Triage Jumps, In-Place Accordions, Section Toggle, Labs Filter, Decision Checks */
      briefMain.addEventListener("click", (e) => {
        const jumpEl = e.target.closest("[data-jump-sec]");
        if (jumpEl) {
          jumpToSection(jumpEl.dataset.jumpSec, {
            fromSec: jumpEl.dataset.fromSec || "",
            itemKey: jumpEl.dataset.jumpItem || ""
          });
          return;
        }
        if (e.target.closest("[data-scroll-top]")) {
          scrollToTopSmooth();
          return;
        }
        const toggleAllBtn = e.target.closest("[data-toggle-all]");
        if (toggleAllBtn) {
          toggleAllInPlace(toggleAllBtn.dataset.toggleAll);
          return;
        }
        const secExpBtn = e.target.closest("[data-sec-expand]");
        if (secExpBtn) {
          toggleSectionInPlace(secExpBtn.dataset.secExpand);
          return;
        }
        const qToggle = e.target.closest("[data-q-toggle]");
        if (qToggle && data && data[lang]) {
          const qKey = qToggle.dataset.qToggle;
          const isNowDone = !discussedQuestions.has(qKey);
          if (isNowDone) discussedQuestions.add(qKey);
          else discussedQuestions.delete(qKey);
          const item = qToggle.closest(".q-item");
          if (item) item.classList.toggle("is-done", isNowDone);
          qToggle.setAttribute("aria-pressed", isNowDone ? "true" : "false");
          const d = data[lang];
          const ui = d.ui || {};
          const totalQ = (d.sections && d.sections.questions && d.sections.questions.items) ? d.sections.questions.items.length : 4;
          const doneCount = discussedQuestions.size;
          const countTxt = (ui.discussedCount || "{done}/{total}").replace("{done}", String(doneCount)).replace("{total}", String(totalQ));
          const qBadge = document.getElementById("qCountBadge");
          if (qBadge) {
            qBadge.textContent = countTxt;
            setHidden(qBadge, doneCount === 0);
          }
          return;
        }
        const labBtn = e.target.closest("[data-lab-filter]");
        if (labBtn) {
          const next = labBtn.dataset.labFilter;
          if (next && next !== labsFilter) {
            labsFilter = next;
            renderBrief(false, { preserveMarkIdx: true, restoreFocusSel: '.labs-fbtn[data-lab-filter="' + next + '"]' });
            updateScrollUI();
          }
          return;
        }
        const expBtn = e.target.closest(".item-expand[data-item-key]");
        if (expBtn) {
          toggleItemInPlace(expBtn.dataset.itemKey);
          return;
        }
        if (e.target.closest("#emptyClearBtn")) {
          clearSearch(true);
          return;
        }
        /* Whole-card smooth click-to-expand in Brief mode (respects text selection) */
        if (density === "brief" && !e.target.closest("button, a, input")) {
          const card = e.target.closest("[data-exp-card]");
          if (card && !card.classList.contains("is-search-open")) {
            const sel = window.getSelection && window.getSelection().toString();
            if (!sel || !sel.trim()) {
              toggleItemInPlace(card.dataset.expCard);
            }
          }
        }
      });

      /* Interactive Lab Gauge & Biomarker Tooltips */
      briefMain.addEventListener("pointermove", (e) => {
        const hit = e.target.closest("[data-tip-title], [data-tip-body]");
        if (hit) {
          showTooltip(hit.getAttribute("data-tip-title"), hit.getAttribute("data-tip-body"), e.clientX, e.clientY);
        } else {
          hideTooltip();
        }
      });
      briefMain.addEventListener("pointerleave", hideTooltip);
      briefMain.addEventListener("focusin", (e) => {
        const hit = e.target.closest("[data-tip-title], [data-tip-body]");
        if (hit) {
          const r = hit.getBoundingClientRect();
          showTooltip(hit.getAttribute("data-tip-title"), hit.getAttribute("data-tip-body"), r.left + r.width / 2, r.top);
        }
      });
      briefMain.addEventListener("focusout", hideTooltip);

      /* Scroll-Spy, Progress Bar & Resize */
      let scrollRaf = 0;
      window.addEventListener("scroll", () => {
        hideTooltip();
        if (scrollRaf) return;
        scrollRaf = requestAnimationFrame(() => {
          scrollRaf = 0;
          updateScrollUI();
        });
      }, { passive: true });

      window.addEventListener("resize", () => {
        hideTooltip();
        if (!appShell.hidden) {
          syncAllPills(true);
          syncNavFade();
          updateScrollUI();
        }
      });

      /* Print Hygiene: Always Print Complete 2-Page Clinical Brief Even If Search Is Active */
      function prepareForPrint() {
        if (!data || appShell.hidden) return;
        closeMobileSheet(false);
        closeShortcutsModal(false);
        hideQuickPop();
        hideTooltip();
        if (searchQuery.trim() && stashedSearchForPrint === null) {
          stashedSearchForPrint = searchQuery;
          searchQuery = "";
          renderBrief(false);
        }
      }
      function restoreAfterPrint() {
        if (stashedSearchForPrint !== null) {
          searchQuery = stashedSearchForPrint;
          stashedSearchForPrint = null;
          searchInput.value = searchQuery;
          if (data && !appShell.hidden) {
            renderBrief(false);
            updateScrollUI();
          }
        }
      }
      function triggerPrint() {
        prepareForPrint();
        window.print();
      }
      window.addEventListener("beforeprint", prepareForPrint);
      window.addEventListener("afterprint", restoreAfterPrint);

      /* Theme, Print & Complete Lock DOM Scrub */
      themeBtn.addEventListener("click", toggleTheme);
      printBtn.addEventListener("click", triggerPrint);

      lockBtn.addEventListener("click", () => {
        data = null;
        lang = "fr";
        density = "brief";
        labsFilter = "watch";
        searchQuery = "";
        stashedSearchForPrint = null;
        activeNav = "priorities";
        searchMarks = [];
        activeMarkIdx = -1;
        lastFocusBeforeOverlay = null;
        expandedItems.clear();
        discussedQuestions.clear();
        hideReturnToast();
        closeMobileSheet(false);
        closeShortcutsModal(false);
        hideQuickPop();
        briefMain.innerHTML = "";
        briefMain.classList.remove("is-swapping");
        navLinks.innerHTML = "";
        navLinks.classList.remove("fade-left", "fade-right", "fade-both");
        marginRail.innerHTML = "";
        quickPop.innerHTML = "";
        mobSheet.innerHTML = "";
        scModal.innerHTML = "";
        vizTooltip.innerHTML = "";
        returnGoBtn.innerHTML = "";
        mobDockNum.textContent = "";
        mobDockTitle.textContent = "";
        btnBrief.textContent = "";
        btnFull.textContent = "";
        searchInput.value = "";
        searchInput.placeholder = "";
        searchInput.removeAttribute("aria-label");
        searchCount.textContent = "";
        searchCount.classList.remove("is-zero");
        setHidden(searchCount, true);
        setHidden(searchStepGroup, true);
        setHidden(searchClear, true);
        setHidden(searchKbd, false);
        printBtn.setAttribute("aria-label", "Print");
        printBtn.removeAttribute("title");
        lockBtn.setAttribute("aria-label", "Lock");
        lockBtn.removeAttribute("title");
        scBtn.setAttribute("aria-label", "Shortcuts");
        scBtn.removeAttribute("title");
        floatTopBtn.setAttribute("aria-label", "Back to top");
        floatTopBtn.removeAttribute("title");
        searchClear.setAttribute("aria-label", "Clear");
        searchClear.removeAttribute("title");
        searchPrev.setAttribute("aria-label", "Previous match");
        searchPrev.removeAttribute("title");
        searchNext.setAttribute("aria-label", "Next match");
        searchNext.removeAttribute("title");
        mobPrevBtn.setAttribute("aria-label", "Previous section");
        mobNextBtn.setAttribute("aria-label", "Next section");
        mobTopBtn.setAttribute("aria-label", "Back to top");
        mobSheetOpenBtn.removeAttribute("aria-label");
        mobSheetOpenBtn.removeAttribute("title");
        mobSheetOpenBtn.setAttribute("aria-expanded", "false");
        returnDismissBtn.setAttribute("aria-label", "Close");
        densityCtrl.setAttribute("aria-label", "Display density");
        readProgressFill.style.transform = "scaleX(0)";
        mobProgressFill.style.transform = "scaleX(0)";
        floatTopBtn.classList.remove("is-visible");
        mobTopBtn.disabled = true;
        hideTooltip();
        if (langPill) langPill.style.opacity = "0";
        if (densPill) densPill.style.opacity = "0";
        appShell.hidden = true;
        gateScreen.hidden = false;
        root.lang = "fr";
        root.dir = "ltr";
        document.title = LOCKED_TITLE;
        pinInput.type = "password";
        setHidden(eyeOpen, false);
        setHidden(eyeClosed, true);
        toggleEye.setAttribute("aria-label", "Show code");
        pinInput.value = "";
        gateErr.textContent = "";
        gateForm.reset();
        syncThemeControl();
        pinInput.focus();
      });
    })();
  </script>
</body>
</html>
