      border-radius: 8px;
      height: 34px;
      padding: 0 11px;
      font-size: 0.76rem;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }
    .sheet-act-btn.is-active { background: var(--teal-btn); border-color: var(--teal-btn); color: #FFFFFF; }

    /* Keyboard Shortcuts Modal */
    .sc-modal {
      width: 100%;
      max-width: 430px;
      background: var(--surface);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      padding: 20px 22px 18px;
      box-shadow: var(--shadow-gate);
      animation: popIn 180ms var(--ease) both;
    }
    .sc-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }
    .sc-title { margin: 0; font-size: 0.96rem; font-weight: 700; color: var(--text); }
    .sc-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .sc-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 6px 0;
      border-bottom: 1px solid var(--border-subtle);
      font-size: 0.81rem;
      color: var(--text-2);
    }
    .sc-row:last-child { border-bottom: 0; }
    .sc-keys { display: inline-flex; align-items: center; gap: 4px; flex-shrink: 0; direction: ltr; }
    .sc-k {
      font-family: var(--font-mono);
      font-size: 0.69rem;
      font-weight: 700;
      color: var(--text);
      background: var(--surface-2);
      border: 1px solid var(--border-strong);
      border-bottom-width: 2px;
      border-radius: 5px;
      padding: 1.5px 6px;
      line-height: 1.3;
    }

    /* Interactive SVG Floating Tooltip */
    .viz-tooltip {
      position: fixed;
      top: 0;
      left: 0;
      z-index: 80;
      max-width: 295px;
      padding: 8px 12px;
      border-radius: 9px;
      background: var(--glass-bg);
      backdrop-filter: blur(14px) saturate(160%);
      -webkit-backdrop-filter: blur(14px) saturate(160%);
      border: 1px solid var(--glass-border);
      box-shadow: var(--shadow-tip);
      color: var(--text);
      font-size: 0.76rem;
      line-height: 1.44;
      pointer-events: none;
      opacity: 0;
      transform: translate3d(-9999px, -9999px, 0);
      transition: opacity 110ms ease;
    }
    .viz-tooltip.is-visible { opacity: 1; }
    .viz-tip-title { font-weight: 700; color: var(--text); margin-bottom: 2px; }
    .viz-tip-body { color: var(--text-2); font-variant-numeric: tabular-nums; }

    /* =========================================================================
       RESPONSIVE BREAKPOINTS (100% ZERO OVERFLOW DOWN TO 390x844 MOBILE)
       ========================================================================= */
    @media (min-width: 1024px) and (max-width: 1199px) {
      .chrome-inner { padding: 0 12px; gap: 6px; }
      .nav-link { padding: 4.5px 6px; font-size: 0.73rem; gap: 3px; }
      .nav-num { display: none; }
      .search-shell { width: 152px; flex: 0 1 152px; }
      .seg-btn { padding: 3.5px 6.5px; font-size: 0.71rem; }
      .ico-btn { width: 29px; height: 29px; }
    }

    @media (max-width: 1023px) {
      .chrome-inner {
        flex-wrap: wrap;
        padding: 8px 14px;
        gap: 7px 10px;
      }
      .chrome-controls { order: 1; width: 100%; justify-content: space-between; flex-wrap: wrap; gap: 7px; }
      .nav-links { order: 2; width: 100%; padding-top: 4px; border-top: 1px solid var(--border-subtle); }
      .search-shell { flex: 1 1 200px; width: auto; min-width: 160px; }
      .search-kbd { display: none; }
      .chapter-map { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    }

    @media (max-width: 760px) {
      .brief-main { padding: 26px 18px 72px; }
      .doc-title { font-size: 1.56rem; }
      html[dir="rtl"] .doc-title { font-size: 1.5rem; }
      .synth-grid { grid-template-columns: 1fr; gap: 12px; }
      .lollipop-axis-row { display: none; }
      .lollipop-row { grid-template-columns: 1fr; gap: 6px; }
      .pvt-legend-grid { grid-template-columns: 1fr; gap: 9px; }
      .ribbon-legend { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .safety-grid { grid-template-columns: 1fr; }
      .repleted-grid { grid-template-columns: 1fr; }
      .normal-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .q-grid { grid-template-columns: 1fr; }
    }

    @media (max-width: 639px) {
      .sticky-chrome { position: static; }
      .sticky-chrome .read-progress { display: none; }
      .mobile-top-progress { display: block; }
      .mob-dock { display: flex; }
      .float-top { display: none !important; }
      .return-toast {
        bottom: calc(68px + env(safe-area-inset-bottom, 0px));
        inset-inline-end: 12px;
        max-width: calc(100vw - 24px);
      }
      #scBtn { display: none; }

      .chrome-inner { padding: 7px 12px; gap: 6px; }
      .chrome-controls { gap: 6px; }
      .search-shell { order: 2; flex: 1 1 100%; width: 100%; }
      .seg-group { flex: 1 1 auto; justify-content: flex-start; gap: 5px; }
      .util-btns { gap: 4px; }
      .ico-btn { width: 29px; height: 29px; }
      .seg-btn { padding: 3.5px 7px; font-size: 0.72rem; }
      .nav-link { padding: 4px 8px; font-size: 0.75rem; }

      .brief-main { padding: 20px 14px 88px; }

      /* Mobile Vertical Hairline Lifespan Rail */
      .life-rail {
        grid-template-columns: 1fr;
        gap: 10px;
        padding-inline-start: 20px;
      }
      .life-rail::before {
        content: "";
        position: absolute;
        top: 12px;
        bottom: 12px;
        inset-inline-start: 5px;
        inset-inline-end: auto;
        width: 1px;
        background: var(--border-strong);
        z-index: 0;

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {

      function normChar(ch) {
        if (/[\u064B-\u065F\u0670\u0640]/.test(ch)) return "";
        if (/[\u0622\u0623\u0625\u0671]/.test(ch)) return "\u0627";
        if (ch === "\u0629") return "\u0647";
        if (ch === "\u0649") return "\u064A";
        return ch.normalize("NFD").replace(/[\u0300-\u036F]/g, "").toLowerCase();
      }

      function normText(str) {
        const raw = String(str ?? "");
        let out = "";
        for (let i = 0; i < raw.length; i++) out += normChar(raw[i]);
        return out;
      }

      function findMatchRanges(raw, qNorm) {
        if (!qNorm) return [];
        const chars = [], starts = [], ends = [];
        for (let i = 0; i < raw.length; i++) {
          const nc = normChar(raw[i]);
          for (let j = 0; j < nc.length; j++) {
            chars.push(nc[j]);
            starts.push(i);
            ends.push(i + 1);
          }
        }
        const hay = chars.join("");
        const ranges = [];
        let pos = 0;
        while (pos <= hay.length - qNorm.length) {
          const idx = hay.indexOf(qNorm, pos);
          if (idx === -1) break;
          let rEnd = ends[idx + qNorm.length - 1];
          while (rEnd < raw.length && normChar(raw[rEnd]) === "" && /[\u0300-\u036F\u064B-\u065F\u0670]/.test(raw[rEnd])) rEnd++;
          ranges.push([starts[idx], rEnd]);
          pos = idx + qNorm.length;
        }
        return ranges;
      }

      function renderSliceWithHighlights(raw, sliceStart, sliceEnd, ranges) {
        if (!ranges.length) return esc(raw.slice(sliceStart, sliceEnd));
        let out = "", cur = sliceStart;
        for (let i = 0; i < ranges.length; i++) {
          const rs = Math.max(sliceStart, ranges[i][0]);
          const re = Math.min(sliceEnd, ranges[i][1]);
          if (re <= rs) continue;
          if (rs > cur) out += esc(raw.slice(cur, rs));
          out += '<mark class="hl">' + esc(raw.slice(rs, re)) + "</mark>";
          cur = re;
        }
        if (cur < sliceEnd) out += esc(raw.slice(cur, sliceEnd));
        return out;
      }

      function fmt(s, isRtl, qNorm) {
        const raw = String(s ?? "");
        const ranges = qNorm ? findMatchRanges(raw, qNorm) : [];
        if (!isRtl) return renderSliceWithHighlights(raw, 0, raw.length, ranges);
        LTR_RE.lastIndex = 0;
        let out = "", last = 0, m;
        while ((m = LTR_RE.exec(raw)) !== null) {
          if (m.index > last) out += renderSliceWithHighlights(raw, last, m.index, ranges);
          const full = m[0];
          const core = full.replace(/(?:\s+[+\-–—·=→/]+|[.,:;–—\-·=→/\s]+)+$/, "");
          const coreEnd = m.index + core.length;
          const fullEnd = m.index + full.length;
          if (core) {
            const cls = core.length <= 13 ? ' class="nowrap-bdi"' : "";
            out += '<bdi dir="ltr"' + cls + ">" + renderSliceWithHighlights(raw, m.index, coreEnd, ranges) + "</bdi>";
            if (fullEnd > coreEnd) out += renderSliceWithHighlights(raw, coreEnd, fullEnd, ranges);
          } else {
            out += renderSliceWithHighlights(raw, m.index, fullEnd, ranges);
          }
          last = fullEnd;
        }
        if (last < raw.length) out += renderSliceWithHighlights(raw, last, raw.length, ranges);
        return out;
      }

      function b64ToBytes(b64) {
        const bin = atob(b64);

        for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
        return arr;

      async function unlock(rawPin) {
        const clean = String(rawPin || "").replace(/\s+/g, "");
        const keyMat = await crypto.subtle.importKey("raw", new TextEncoder().encode(clean), { name: "PBKDF2" }, false, ["deriveKey"]);
        const aesKey = await crypto.subtle.deriveKey(
          { name: "PBKDF2", salt: b64ToBytes(BUNDLE.salt), iterations: BUNDLE.iter, hash: "SHA-256" },
          keyMat, { name: "AES-GCM", length: 256 }, false, ["decrypt"]
        );
        const buf = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64ToBytes(BUNDLE.iv) }, aesKey, b64ToBytes(BUNDLE.ct));
        return JSON.parse(new TextDecoder().decode(buf));
      }

      function updateScrollUI() {
        if (!data || appShell.hidden) return;
        const sy = window.scrollY || 0;
        const maxScroll = Math.max(1, document.documentElement.scrollHeight - window.innerHeight);
        const pct = Math.max(0, Math.min(1, sy / maxScroll));
        const tf = "scaleX(" + pct.toFixed(4) + ")";
        readProgressFill.style.transform = tf;
        mobProgressFill.style.transform = tf;

        stickyChrome.classList.toggle("is-scrolled", sy > 10);
        floatTopBtn.classList.toggle("is-visible", sy > 360);
        mobDock.classList.toggle("is-visible", sy > 120);

        const railTop = marginRail.querySelector(".rail-top-btn");
        if (railTop) railTop.classList.toggle("is-dim", sy < 240);

        if (Date.now() < spyLockUntil) return;
        const vis = getVisibleNavIds();
        if (!vis.length) return;

        /* Ensure final section highlights reliably when near bottom of document */
        if (sy + window.innerHeight >= document.documentElement.scrollHeight - 28) {
          const lastId = vis[vis.length - 1];
          if (lastId !== activeNav) setActiveNav(lastId, true);
          return;
        }

        const offset = getStickyOffset() + 42;
        let bestId = vis[0];
        let bestTop = -Infinity;
        for (let i = 0; i < vis.length; i++) {
          const id = vis[i];
          const el = document.getElementById("sec-" + id);
          if (!el) continue;
          const top = el.getBoundingClientRect().top;
          if (top <= offset && top > bestTop) {
            bestTop = top;
            bestId = id;
          }
        }
        if (bestId !== activeNav) setActiveNav(bestId, true);
      }

      /* Smooth Catmull-Rom to Cubic Bezier SVG Path Helper */
      function buildSpline(pts) {
        if (!pts.length) return "";
        if (pts.length === 1) return "M " + pts[0][0].toFixed(1) + " " + pts[0][1].toFixed(1);
        let d = "M " + pts[0][0].toFixed(1) + " " + pts[0][1].toFixed(1);
        for (let i = 0; i < pts.length - 1; i++) {
          const p0 = pts[Math.max(0, i - 1)];
          const p1 = pts[i];
          const p2 = pts[i + 1];
          const p3 = pts[Math.min(pts.length - 1, i + 2)];
          const c1x = p1[0] + (p2[0] - p0[0]) / 6;
          const c1y = p1[1] + (p2[1] - p0[1]) / 6;
          const c2x = p2[0] - (p3[0] - p1[0]) / 6;
          const c2y = p2[1] - (p3[1] - p1[1]) / 6;
          d += " C " + c1x.toFixed(1) + " " + c1y.toFixed(1) + ", " + c2x.toFixed(1) + " " + c2y.toFixed(1) + ", " + p2[0].toFixed(1) + " " + p2[1].toFixed(1);
        }
        return d;
      }

      function fmtHour(hr) {
        const h = Math.floor(hr);
        const m = Math.round((hr - h) * 60);
        return String(h).padStart(2, "0") + ":" + String(m).padStart(2, "0");
      }

      /* =======================================================================
         VIZ 1A: COGNITIVE PROFILE CONNECTED-DOT / LOLLIPOP COMPARISON SVG
         ======================================================================= */
      function renderSiblingViz(sv, ui, isRtl, qNorm) {
        if (!sv || !Array.isArray(sv.metrics) || !sv.metrics.length) return "";
        const padL = 16, padR = 48, W = 380, plotW = W - padL - padR;
        const mapX = (pct) => padL + (Math.max(0, Math.min(100, Number(pct) || 0)) / 100) * plotW;
        const ticks = [0, 25, 50, 75, 100];

        const axisSvg = '<svg class="viz-svg" viewBox="0 0 ' + W + ' 18" dir="ltr" aria-hidden="true">'
          + ticks.map((t) => {
              const x = mapX(t);
              return '<text x="' + x.toFixed(1) + '" y="13" text-anchor="middle" direction="ltr" fill="var(--text-3)" font-size="9.5" font-weight="600" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">' + t + '%</text>';
            }).join("")
          + "</svg>";

        const rowsHtml = sv.metrics.map((m) => {
          const p = Number(m.patient) || 0;
          const b = Number(m.brother) || 0;
          const xP = mapX(p);
          const xB = mapX(b);
          const isTie = p === b;
          const diff = p - b;
          const deltaTxt = isTie ? "=" : (diff > 0 ? "+" + diff + " pts" : diff + " pts");
          const colP = isTie ? "var(--coral)" : "var(--teal)";
          const colPText = isTie ? "var(--coral-text)" : "var(--teal-text)";
          const gridLines = ticks.map((t) => {
            const gx = mapX(t).toFixed(1);
            return '<line x1="' + gx + '" y1="4" x2="' + gx + '" y2="34" stroke="var(--gridline)" stroke-width="1"></line>';
          }).join("");

          let spanLine = "";
          if (!isTie) {
            const x1 = Math.min(xB, xP), x2 = Math.max(xB, xP);
            spanLine = '<line x1="' + x1.toFixed(1) + '" y1="19" x2="' + x2.toFixed(1) + '" y2="19" stroke="var(--teal)" stroke-width="4" stroke-linecap="round" opacity="0.28"></line>';
          }

          let labelsSvg = "";
          if (isTie) {
            labelsSvg = '<text x="' + (xP + 13).toFixed(1) + '" y="22.5" text-anchor="start" direction="ltr" fill="' + colPText + '" font-size="10.5" font-weight="700" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">' + p + '% = ' + b + '%</text>';
          } else {
            const bRight = xB > xP;
            const bAnchor = bRight ? "start" : (xB < padL + 26 ? "start" : "end");
            const bDx = bAnchor === "start" ? 9 : -9;
            const bY = (bAnchor === "start" && !bRight) ? 10 : 22.5;
            const pAnchor = xP >= xB ? "start" : "end";
            const pDx = pAnchor === "start" ? 10 : -10;
            labelsSvg =
              '<text x="' + (xB + bDx).toFixed(1) + '" y="' + bY + '" text-anchor="' + bAnchor + '" direction="ltr" fill="var(--text-3)" font-size="10" font-weight="600" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">' + b + '%</text>'
              + '<text x="' + (xP + pDx).toFixed(1) + '" y="22.5" text-anchor="' + pAnchor + '" direction="ltr" fill="' + colPText + '" font-size="10.8" font-weight="700" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">' + p + '%</text>';
          }

          const tipP = esc(m.label + " — " + sv.patientLabel);
          const tipPBody = esc(m.patientText);
          const tipB = esc(m.label + " — " + sv.brotherLabel);
          const tipBBody = esc(m.brotherText);

          const trackSvg = '<svg class="viz-svg lollipop-svg" viewBox="0 0 ' + W + ' 38" dir="ltr" role="img" aria-label="' + esc(m.label + ": " + m.patientText + " / " + m.brotherText) + '">'
            + gridLines
            + '<line x1="' + padL + '" y1="19" x2="' + (W - padR) + '" y2="19" stroke="var(--border-strong)" stroke-width="1" opacity="0.5"></line>'
            + spanLine
            + (isTie ? '<circle cx="' + xP.toFixed(1) + '" cy="19" r="9.5" fill="var(--coral-soft)" stroke="var(--coral-border)" stroke-width="1"></circle>' : "")
            + '<circle cx="' + xB.toFixed(1) + '" cy="19" r="4.8" fill="var(--surface)" stroke="var(--slate-viz)" stroke-width="2.1"></circle>'
            + '<circle cx="' + xP.toFixed(1) + '" cy="19" r="5.8" fill="' + colP + '" stroke="var(--surface)" stroke-width="1.8"></circle>'
            + labelsSvg
            + '<circle class="svg-hit" tabindex="0" cx="' + xB.toFixed(1) + '" cy="19" r="13" fill="transparent" data-tip-title="' + tipB + '" data-tip-body="' + tipBBody + '"></circle>'
            + '<circle class="svg-hit" tabindex="0" cx="' + xP.toFixed(1) + '" cy="19" r="13" fill="transparent" data-tip-title="' + tipP + '" data-tip-body="' + tipPBody + '"></circle>'
            + "</svg>";

          return '<div class="lollipop-row' + (isTie ? " is-tie-row" : "") + '">'
            + '<div class="lollipop-meta">'
              + '<div class="lollipop-name-row"><span class="lollipop-name">' + fmt(m.label, isRtl, qNorm) + '</span><span class="delta-pill' + (isTie ? " is-tie" : "") + '"><bdi dir="ltr">' + esc(deltaTxt) + "</bdi></span></div>"
              + '<div class="lollipop-vals"><span class="lv-p' + (isTie ? " is-tie" : "") + '">' + fmt(m.patientText, isRtl, qNorm) + '</span><span class="lv-sep">·</span><span>' + fmt(m.brotherText, isRtl, qNorm) + "</span></div>"
            + "</div>"
            + '<div class="lollipop-track-wrap" dir="ltr">' + trackSvg + "</div>"
            + "</div>";
        }).join("");

        return '<figure id="fig-01" class="figure-card">'
          + '<div class="fig-head">'
            + '<div class="fig-title-wrap">' + renderFigTag(ui, 1) + '<h3 class="fig-title">' + fmt(sv.title, isRtl, qNorm) + "</h3></div>"
            + '<div class="fig-legend">'
              + '<span class="leg-item"><span class="leg-dot is-teal" aria-hidden="true"></span><span>' + fmt(sv.patientLabel, isRtl, "") + "</span></span>"
              + '<span class="leg-item"><span class="leg-dot is-slate-ring" aria-hidden="true"></span><span>' + fmt(sv.brotherLabel, isRtl, "") + "</span></span>"
            + "</div>"
          + "</div>"
          + (sv.subtitle ? '<p class="fig-sub">' + fmt(sv.subtitle, isRtl, qNorm) + "</p>" : "")
          + '<div class="lollipop-axis-row"><div></div><div dir="ltr">' + axisSvg + "</div></div>"
          + '<div class="lollipop-list">' + rowsHtml + "</div>"
          + ((sv.gatesNote || sv.olderBrotherNote)
            ? '<div class="fig-footnotes">'
                + (sv.gatesNote ? "<p>" + fmt(sv.gatesNote, isRtl, qNorm) + "</p>" : "")
                + (sv.olderBrotherNote ? '<p class="fn-contrast">' + fmt(sv.olderBrotherNote, isRtl, qNorm) + "</p>" : "")
              + "</div>"
            : "")
          + "</figure>";
      }

      /* =======================================================================
         VIZ 1B: ERROR-ANATOMY STACKED HORIZONTAL BAR SVG (HIGH-CONTRAST LIGHT+DARK)
         ======================================================================= */
      function renderErrorAnatomy(da, ui, isRtl, qNorm) {
        if (!da || !Array.isArray(da.rows) || !da.rows.length) return "";
        const leg = da.legend || {};
        const segDefs = [
          { key: "hit", color: "var(--bar-hit)", textCol: "var(--bar-text)", label: leg.hit || "" },
          { key: "swap", color: "var(--bar-swap)", textCol: "var(--bar-text)", label: leg.swap || "" },
          { key: "stale", color: "var(--bar-stale)", textCol: "var(--bar-text)", label: leg.stale || "" },
          { key: "guess", color: "var(--bar-guess)", textCol: "var(--bar-text)", label: leg.guess || "" }
        ];

        const rowsHtml = da.rows.map((row, rIdx) => {
          const W = 680, H = 36;
          const activeSegs = segDefs.filter((s) => Number(row[s.key]) > 0);
          const gap = 2.5;
          const totalGap = Math.max(0, activeSegs.length - 1) * gap;
          const availW = W - totalGap;
          let curX = 0;
          const clipId = "anatClip" + rIdx;

          const rects = activeSegs.map((s) => {
            const val = Number(row[s.key]) || 0;
            const segW = (val / 100) * availW;
            const x = curX;
            curX += segW + gap;
            const tipT = esc(row.label + " · " + s.label);
            const tipB = esc(val + "% — " + row.callout);
            return '<g class="svg-hit anat-seg" tabindex="0" data-tip-title="' + tipT + '" data-tip-body="' + tipB + '">'
              + '<rect x="' + x.toFixed(1) + '" y="2" width="' + segW.toFixed(1) + '" height="' + (H - 4) + '" fill="' + s.color + '" rx="2"></rect>'
              + (segW >= 46
                ? '<text x="' + (x + segW / 2).toFixed(1) + '" y="' + (H / 2 + 4.5).toFixed(1) + '" text-anchor="middle" direction="ltr" fill="' + s.textCol + '" font-size="13" font-weight="700" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">' + val + '%</text>'
                : "")
              + "</g>";
          }).join("");

          const svg = '<svg class="viz-svg anat-svg" viewBox="0 0 ' + W + " " + H + '" dir="ltr" role="img" aria-label="' + esc(row.label + ": " + row.callout) + '">'
            + '<defs><clipPath id="' + clipId + '"><rect x="0" y="2" width="' + W + '" height="' + (H - 4) + '" rx="8"></rect></clipPath></defs>'
            + '<rect x="0" y="2" width="' + W + '" height="' + (H - 4) + '" rx="8" fill="var(--track-bg)"></rect>'
            + '<g clip-path="url(#' + clipId + ')">' + rects + "</g>"
            + "</svg>";

          return '<div class="anat-row' + (row.id === "patient" ? " is-patient" : "") + '">'
            + '<div class="anat-top">'
              + '<span class="anat-lbl">' + fmt(row.label, isRtl, qNorm) + "</span>"
              + '<span class="anat-callout">' + fmt(row.callout, isRtl, qNorm) + "</span>"
            + "</div>"
            + '<div dir="ltr">' + svg + "</div>"
            + "</div>";
        }).join("");

        return '<figure id="fig-02" class="figure-card">'
          + '<div class="fig-head">'
            + '<div class="fig-title-wrap">' + renderFigTag(ui, 2) + '<h3 class="fig-title">' + fmt(da.title, isRtl, qNorm) + "</h3></div>"
            + '<div class="fig-legend">'
              + '<span class="leg-item"><span class="leg-dot is-teal" aria-hidden="true"></span><span>' + fmt(leg.hit, isRtl, "") + "</span></span>"
              + '<span class="leg-item"><span class="leg-dot is-amber" aria-hidden="true"></span><span>' + fmt(leg.swap, isRtl, "") + "</span></span>"
              + '<span class="leg-item"><span class="leg-dot is-coral" aria-hidden="true"></span><span>' + fmt(leg.stale, isRtl, "") + "</span></span>"
              + '<span class="leg-item"><span class="leg-dot is-slate" aria-hidden="true"></span><span>' + fmt(leg.guess, isRtl, "") + "</span></span>"
            + "</div>"
          + "</div>"
          + (da.subtitle ? '<p class="fig-sub">' + fmt(da.subtitle, isRtl, qNorm) + "</p>" : "")
          + '<div class="anat-list">' + rowsHtml + "</div>"
          + "</figure>";
      }

      /* =======================================================================
         VIZ 2: DUAL-STATE 5-MIN VIGILANCE SPLINE AREA SVG
         ======================================================================= */
      function renderVigilanceChart(pv, ui, isRtl, qNorm) {
        if (!pv || !pv.alert || !pv.fatigued) return "";
        const aPtsRaw = Array.isArray(pv.alert.points) ? pv.alert.points.map(Number).filter(Number.isFinite) : [];
        const fPtsRaw = Array.isArray(pv.fatigued.points) ? pv.fatigued.points.map(Number).filter(Number.isFinite) : [];
        if (aPtsRaw.length < 2 || fPtsRaw.length < 2) return "";

        const allVals = aPtsRaw.concat(fPtsRaw);
        const yMin = typeof pv.yMin === "number" ? pv.yMin : Math.floor((Math.min(...allVals) - 0.3) * 10) / 10;
        const yMax = typeof pv.yMax === "number" ? pv.yMax : Math.ceil((Math.max(...allVals) + 0.3) * 10) / 10;
        const span = Math.max(0.4, yMax - yMin);

        const W = 680, H = 250;
        const padL = 52, padR = 166, padT = 24, padB = 38;
        const x0 = padL, x1 = W - padR, plotW = x1 - x0;
        const y0 = padT, y1 = H - padB, plotH = y1 - y0;
        const n = Math.max(aPtsRaw.length, fPtsRaw.length);
        const mapX = (i, len) => x0 + (i / Math.max(1, len - 1)) * plotW;
        const mapY = (v) => y0 + ((yMax - v) / span) * plotH;

        const aPts = aPtsRaw.map((v, i) => [mapX(i, aPtsRaw.length), mapY(v)]);
        const fPts = fPtsRaw.map((v, i) => [mapX(i, fPtsRaw.length), mapY(v)]);
        const aPath = buildSpline(aPts);
        const fPath = buildSpline(fPts);

        const fRev = fPts.slice().reverse();
        const fRevSpline = buildSpline(fRev).replace(/^M/, "L");
        const gapPoly = aPath + " " + fRevSpline + " Z";
        const aArea = aPath + " L " + aPts[aPts.length - 1][0].toFixed(1) + " " + y1 + " L " + aPts[0][0].toFixed(1) + " " + y1 + " Z";

        const ySteps = 4;
        let gridSvg = "";
        for (let i = 0; i <= ySteps; i++) {
          const val = yMin + (span * i) / ySteps;
          const gy = mapY(val);
          gridSvg += '<line x1="' + x0 + '" y1="' + gy.toFixed(1) + '" x2="' + x1 + '" y2="' + gy.toFixed(1) + '" stroke="var(--gridline)" stroke-width="1"></line>';
          gridSvg += '<text x="' + (x0 - 8) + '" y="' + (gy + 3.5).toFixed(1) + '" text-anchor="end" direction="ltr" fill="var(--text-3)" font-size="10.2" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">' + val.toFixed(1) + "</text>";
        }

        let bandSvg = "";
        if (typeof pv.alertBandLow === "number" && typeof pv.alertBandHigh === "number") {
          const bTop = mapY(pv.alertBandHigh);
          const bBot = mapY(pv.alertBandLow);
          const bH = Math.max(4, bBot - bTop);
          const bandDir = isRtl ? 'direction="rtl" unicode-bidi="isolate" font-family="var(--font-ar)"' : 'direction="ltr" font-family="var(--font-sans)"';
          const bandX = x0 + 8;
          const bandAnchor = isRtl ? "end" : "start";
          bandSvg =
            '<g class="pvt-series-alert">'
            + '<rect x="' + x0 + '" y="' + bTop.toFixed(1) + '" width="' + plotW + '" height="' + bH.toFixed(1) + '" fill="var(--teal-band)" rx="3"></rect>'
            + '<line x1="' + x0 + '" y1="' + bTop.toFixed(1) + '" x2="' + x1 + '" y2="' + bTop.toFixed(1) + '" stroke="var(--teal-border)" stroke-width="1" stroke-dasharray="3 3"></line>'
            + '<line x1="' + x0 + '" y1="' + bBot.toFixed(1) + '" x2="' + x1 + '" y2="' + bBot.toFixed(1) + '" stroke="var(--teal-border)" stroke-width="1" stroke-dasharray="3 3"></line>'
            + (pv.alertBandLabel
              ? '<text x="' + bandX + '" y="' + (bTop + 13).toFixed(1) + '" text-anchor="' + bandAnchor + '" ' + bandDir + ' fill="var(--teal-text)" font-size="9.5" font-weight="600" opacity="0.82">' + esc(pv.alertBandLabel) + "</text>"
              : "")
            + "</g>";
        }

        const lastIdx = Math.min(aPts.length, fPts.length) - 1;
        const deltaVal = aPtsRaw[lastIdx] - fPtsRaw[lastIdx];
        const bx = x1 - 14;
        const byA = aPts[lastIdx][1] + 7;
        const byF = fPts[lastIdx][1] - 7;
        const bMid = (byA + byF) / 2;
        let deltaSvg = "";
        if (byF - byA > 28) {
          const dDir = isRtl ? 'direction="rtl" unicode-bidi="isolate" font-family="var(--font-ar)"' : 'direction="ltr" font-family="var(--font-sans)"';
          const dAnchor = isRtl ? "start" : "end";
          deltaSvg =
            '<g class="pvt-series-gap">'
            + '<line x1="' + bx.toFixed(1) + '" y1="' + byA.toFixed(1) + '" x2="' + bx.toFixed(1) + '" y2="' + byF.toFixed(1) + '" stroke="var(--coral)" stroke-width="1.2" stroke-dasharray="2.5 2.5" opacity="0.72"></line>'
            + '<line x1="' + (bx - 4).toFixed(1) + '" y1="' + byA.toFixed(1) + '" x2="' + (bx + 4).toFixed(1) + '" y2="' + byA.toFixed(1) + '" stroke="var(--coral)" stroke-width="1.2" opacity="0.72"></line>'
            + '<line x1="' + (bx - 4).toFixed(1) + '" y1="' + byF.toFixed(1) + '" x2="' + (bx + 4).toFixed(1) + '" y2="' + byF.toFixed(1) + '" stroke="var(--coral)" stroke-width="1.2" opacity="0.72"></line>'
            + '<text x="' + (bx - 10).toFixed(1) + '" y="' + (bMid - 2).toFixed(1) + '" text-anchor="' + dAnchor + '" ' + dDir + ' fill="var(--coral-text)" font-size="9.8" font-weight="600">' + esc(pv.deltaLabel || "") + "</text>"
            + '<text x="' + (bx - 10).toFixed(1) + '" y="' + (bMid + 11).toFixed(1) + '" text-anchor="end" direction="ltr" fill="var(--coral-text)" font-size="10.2" font-weight="700" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">\u2212' + Math.abs(deltaVal).toFixed(2) + " " + esc(pv.unit || "") + "</text>"
            + "</g>";
        }

        let labelYA = aPts[aPts.length - 1][1];
        let labelYF = fPts[fPts.length - 1][1];
        if (Math.abs(labelYF - labelYA) < 26) {
          const mid = (labelYA + labelYF) / 2;
          labelYA = mid - 14;
          labelYF = mid + 14;
        }
        const gx = x1 + 14;
        const endLabelsSvg =
          '<g class="pvt-series-alert"><circle cx="' + gx + '" cy="' + labelYA.toFixed(1) + '" r="3.6" fill="var(--teal)"></circle>'
          + '<text x="' + (gx + 9) + '" y="' + (labelYA + 3.8).toFixed(1) + '" text-anchor="start" direction="ltr" fill="var(--teal-text)" font-size="11" font-weight="700" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">' + esc(pv.alert.shortTag) + "</text></g>"
          + '<g class="pvt-series-fatigued"><circle cx="' + gx + '" cy="' + labelYF.toFixed(1) + '" r="3.6" fill="var(--surface)" stroke="var(--coral)" stroke-width="2"></circle>'
          + '<text x="' + (gx + 9) + '" y="' + (labelYF + 3.8).toFixed(1) + '" text-anchor="start" direction="ltr" fill="var(--coral-text)" font-size="11" font-weight="700" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">' + esc(pv.fatigued.shortTag) + "</text></g>";

        const xTicks = Array.isArray(pv.xTicks) ? pv.xTicks : [];
        const colW = plotW / Math.max(1, n - 1);
        let xAxisSvg = "";
        let interactSvg = "";
        for (let i = 0; i < n; i++) {
          const px = mapX(i, n);
          const tickLbl = xTicks[i] || "";
          const anchor = i === 0 ? "start" : (i === n - 1 ? "end" : "middle");
          xAxisSvg += '<line x1="' + px.toFixed(1) + '" y1="' + y1 + '" x2="' + px.toFixed(1) + '" y2="' + (y1 + 5) + '" stroke="var(--border-strong)" stroke-width="1"></line>';
          xAxisSvg += '<text x="' + px.toFixed(1) + '" y="' + (y1 + 21) + '" text-anchor="' + anchor + '" direction="ltr" fill="var(--text-3)" font-size="10.2" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">' + esc(tickLbl) + "</text>";

          const av = aPtsRaw[Math.min(i, aPtsRaw.length - 1)];
          const fv = fPtsRaw[Math.min(i, fPtsRaw.length - 1)];
          const ay = aPts[Math.min(i, aPts.length - 1)][1];
          const fy = fPts[Math.min(i, fPts.length - 1)][1];
          const hitX = Math.max(x0 - 12, px - colW / 2);
          const hitW = Math.min(x1 + 12, px + colW / 2) - hitX;
          const unitStr = pv.unit ? " " + pv.unit : "";
          const tipTitle = esc(tickLbl);
          const tipBody = esc(pv.alert.label + ": " + av.toFixed(2) + unitStr + "  |  " + pv.fatigued.label + ": " + fv.toFixed(2) + unitStr + "  (Δ " + (fv - av).toFixed(2) + ")");
          interactSvg += '<g class="pvt-col-group">'
            + '<line class="pvt-crosshair" x1="' + px.toFixed(1) + '" y1="' + y0 + '" x2="' + px.toFixed(1) + '" y2="' + y1 + '" stroke="var(--border-strong)" stroke-width="1" stroke-dasharray="2 3"></line>'
            + '<circle class="pvt-pt-ring pvt-series-alert" cx="' + px.toFixed(1) + '" cy="' + ay.toFixed(1) + '" r="3.8" fill="var(--teal)" stroke="var(--surface)" stroke-width="1.8"></circle>'
            + '<circle class="pvt-pt-ring pvt-series-fatigued" cx="' + px.toFixed(1) + '" cy="' + fy.toFixed(1) + '" r="3.8" fill="var(--surface)" stroke="var(--coral)" stroke-width="2.1"></circle>'
            + '<rect class="svg-hit pvt-col-hit" tabindex="0" x="' + hitX.toFixed(1) + '" y="' + y0 + '" width="' + Math.max(24, hitW).toFixed(1) + '" height="' + plotH + '" data-tip-title="' + tipTitle + '" data-tip-body="' + tipBody + '"></rect>'
            + "</g>";
        }

        const aria = esc(pv.title + ": " + pv.alert.shortTag + " vs " + pv.fatigued.shortTag);
        const svg = '<svg class="viz-svg pvt-svg" viewBox="0 0 ' + W + " " + H + '" dir="ltr" direction="ltr" role="img" aria-label="' + aria + '">'
          + '<defs>'
            + '<linearGradient id="vigGapGrad" x1="0" y1="0" x2="1" y2="0">'
              + '<stop offset="0%" style="stop-color:var(--coral);stop-opacity:0.04"></stop>'
              + '<stop offset="100%" style="stop-color:var(--coral);stop-opacity:0.17"></stop>'
            + "</linearGradient>"
            + '<linearGradient id="vigAlertGrad" x1="0" y1="0" x2="0" y2="1">'
              + '<stop offset="0%" style="stop-color:var(--teal);stop-opacity:0.09"></stop>'
              + '<stop offset="100%" style="stop-color:var(--teal);stop-opacity:0.0"></stop>'
            + "</linearGradient>"
          + "</defs>"
          + '<text x="' + (x0 - 8) + '" y="14" text-anchor="end" direction="ltr" fill="var(--text-3)" font-size="9.5" font-weight="600" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">' + esc(pv.unit || "") + "</text>"
          + gridSvg
          + bandSvg
          + '<path class="pvt-series-alert" d="' + aArea + '" fill="url(#vigAlertGrad)"></path>'
          + '<path class="pvt-series-gap" d="' + gapPoly + '" fill="url(#vigGapGrad)"></path>'
          + '<line x1="' + x0 + '" y1="' + y1 + '" x2="' + x1 + '" y2="' + y1 + '" stroke="var(--border-strong)" stroke-width="1"></line>'
          + '<path class="pvt-series-fatigued" d="' + fPath + '" fill="none" stroke="var(--coral)" stroke-width="2.6" stroke-dasharray="7 4.5" stroke-linecap="round" stroke-linejoin="round"></path>'
          + '<path class="pvt-series-alert" d="' + aPath + '" fill="none" stroke="var(--teal)" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"></path>'
          + deltaSvg
          + xAxisSvg
          + endLabelsSvg
          + interactSvg
          + "</svg>";

        return '<figure id="fig-03" class="figure-card">'
          + '<div class="fig-head">'
            + '<div class="fig-title-wrap">' + renderFigTag(ui, 3) + '<h3 class="fig-title">' + fmt(pv.title, isRtl, qNorm) + "</h3></div>"
          + "</div>"
          + (pv.subtitle ? '<p class="fig-sub">' + fmt(pv.subtitle, isRtl, qNorm) + "</p>" : "")
          + '<div class="pvt-svg-box" dir="ltr">' + svg + "</div>"
          + '<div class="pvt-legend-grid">'
            + '<div class="pvt-leg-card" data-pvt-hover="alert">'
              + '<span class="leg-line pvt-leg-swatch" aria-hidden="true"></span>'
              + '<div class="pvt-leg-body"><div class="pvt-leg-lbl">' + fmt(pv.alert.label, isRtl, qNorm) + '</div><div class="pvt-leg-sum">' + fmt(pv.alert.summary, isRtl, qNorm) + "</div></div>"
            + "</div>"
            + '<div class="pvt-leg-card" data-pvt-hover="fatigued">'
              + '<span class="leg-line is-dashed pvt-leg-swatch" aria-hidden="true"></span>'
              + '<div class="pvt-leg-body"><div class="pvt-leg-lbl">' + fmt(pv.fatigued.label, isRtl, qNorm) + '</div><div class="pvt-leg-sum">' + fmt(pv.fatigued.summary, isRtl, qNorm) + "</div></div>"
            + "</div>"
          + "</div>"
          + (pv.conclusion ? '<p class="pvt-conclusion">' + fmt(pv.conclusion, isRtl, qNorm) + "</p>" : "")
          + "</figure>";
      }

      /* =======================================================================
         VIZ 3: 24-HOUR SLEEP & FRAGMENTATION RIBBON SVG (BI-DIRECTIONAL HOVER)
         ======================================================================= */
      function renderSleepRibbon(sr, ui, isRtl, qNorm) {
        if (!sr || !Array.isArray(sr.blocks) || !sr.blocks.length) return "";
        const W = 860, H = 76;
        const x0 = 16, x1 = W - 16, trackW = x1 - x0;
        const barY = 18, barH = 31;
        const mapX = (hr) => x0 + (Math.max(0, Math.min(24, Number(hr) || 0)) / 24) * trackW;

        const kindStyle = {
          sleep: { fill: "url(#sleepHatchPat)", txt: "var(--sleep-text)" },
          trough: { fill: "var(--trough-bg)", txt: "var(--trough-text)" },
          alert: { fill: "var(--alert-bg)", txt: "var(--alert-text)" },
          hyperfocus: { fill: "var(--night-bg)", txt: "var(--night-text)" }
        };

        let blocksSvg = "";
        let arousalsSvg = "";
        const lblDir = isRtl ? 'direction="rtl" unicode-bidi="isolate" font-family="var(--font-ar)"' : 'direction="ltr" font-family="var(--font-sans)"';

        sr.blocks.forEach((blk, idx) => {
          const bx = mapX(blk.start);
          const bw = Math.max(4, mapX(blk.end) - bx);
          const st = kindStyle[blk.kind] || kindStyle.trough;
          const tipT = esc(blk.label);
          const tipB = esc(blk.detail);

          let deco = "";
          if (blk.kind === "trough") {
            const cy = barY + barH - 5.5;
            deco = '<path d="M ' + (bx + 6).toFixed(1) + " " + (cy - 4).toFixed(1) + " Q " + (bx + bw * 0.5).toFixed(1) + " " + (cy + 4).toFixed(1) + ", " + (bx + bw - 6).toFixed(1) + " " + (cy - 3.5).toFixed(1) + '" fill="none" stroke="var(--trough-wave)" stroke-width="2" stroke-linecap="round"></path>';
          }

          const showLbl = bw >= 86;
          blocksSvg += '<g class="svg-hit rib-block" tabindex="0" data-rib-id="' + esc(blk.id) + '" data-tip-title="' + tipT + '" data-tip-body="' + tipB + '">'
            + '<rect x="' + bx.toFixed(1) + '" y="' + barY + '" width="' + bw.toFixed(1) + '" height="' + barH + '" fill="' + st.fill + '"></rect>'
            + deco
            + (idx > 0 ? '<line x1="' + bx.toFixed(1) + '" y1="' + barY + '" x2="' + bx.toFixed(1) + '" y2="' + (barY + barH) + '" stroke="var(--surface)" stroke-width="1.5"></line>' : "")
            + (showLbl
              ? '<text x="' + (bx + bw / 2).toFixed(1) + '" y="' + (barY + barH / 2 + 4.2).toFixed(1) + '" text-anchor="middle" ' + lblDir + ' fill="' + st.txt + '" font-size="12.2" font-weight="700">' + esc(blk.shortLabel) + "</text>"
              : "")
            + "</g>";

          (blk.arousals || []).forEach((hr) => {
            const ax = mapX(hr);
            const atipT = esc(sr.arousalLegend || "Arousal");
            const atipB = esc(fmtHour(hr) + " · " + blk.detail);
            arousalsSvg += '<g class="svg-hit" tabindex="0" data-tip-title="' + atipT + '" data-tip-body="' + atipB + '">'
              + '<line x1="' + ax.toFixed(1) + '" y1="10" x2="' + ax.toFixed(1) + '" y2="' + (barY + barH) + '" stroke="var(--amber)" stroke-width="1.6" stroke-dasharray="2.5 2.5" opacity="0.88"></line>'
              + '<rect x="' + (ax - 3.8).toFixed(1) + '" y="5.5" width="7.6" height="7.6" rx="1.2" transform="rotate(45 ' + ax.toFixed(1) + ' 9.3)" fill="var(--amber)" stroke="var(--surface)" stroke-width="1.2"></rect>'
              + '<circle cx="' + ax.toFixed(1) + '" cy="9.3" r="12" fill="transparent"></circle>'
              + "</g>";
          });
        });

        const ticksSvg = (sr.ticks || []).map((tk) => {
          const hr = parseInt(String(tk).split(":")[0], 10);
          const tx = mapX(hr);
          const anchor = hr === 0 ? "start" : (hr === 24 ? "end" : "middle");
          return '<line x1="' + tx.toFixed(1) + '" y1="' + (barY + barH + 2.5) + '" x2="' + tx.toFixed(1) + '" y2="' + (barY + barH + 8) + '" stroke="var(--border-strong)" stroke-width="1"></line>'
            + '<text x="' + tx.toFixed(1) + '" y="' + (barY + barH + 21) + '" text-anchor="' + anchor + '" direction="ltr" fill="var(--text-3)" font-size="11.5" font-weight="600" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">' + esc(tk) + "</text>";
        }).join("");

        const svg = '<svg class="viz-svg ribbon-svg" viewBox="0 0 ' + W + " " + H + '" dir="ltr" direction="ltr" role="img" aria-label="' + esc(sr.title) + '">'
          + '<defs>'
            + '<clipPath id="sleepClip"><rect x="' + x0 + '" y="' + barY + '" width="' + trackW + '" height="' + barH + '" rx="8"></rect></clipPath>'
            + '<pattern id="sleepHatchPat" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">'
              + '<rect width="10" height="10" fill="var(--sleep-bg)"></rect>'
              + '<rect width="4" height="10" fill="var(--sleep-stripe)"></rect>'
            + "</pattern>"
          + "</defs>"
          + '<g clip-path="url(#sleepClip)">' + blocksSvg + "</g>"
          + '<rect x="' + x0 + '" y="' + barY + '" width="' + trackW + '" height="' + barH + '" rx="8" fill="none" stroke="var(--border-strong)" stroke-width="1"></rect>'
          + arousalsSvg
          + ticksSvg
          + "</svg>";

        const legHtml = sr.blocks.map((blk) =>
          '<div class="rib-leg-item" data-rib-hover="' + esc(blk.id) + '">'
            + '<span class="rib-sw kind-' + esc(blk.kind) + '" aria-hidden="true"></span>'
            + '<div><span class="rib-leg-lbl">' + fmt(blk.label, isRtl, qNorm) + '</span><span class="rib-leg-det">' + fmt(blk.detail, isRtl, qNorm) + "</span></div>"
          + "</div>"
        ).join("");

        return '<figure id="fig-04" class="figure-card">'
          + '<div class="fig-head">'
            + '<div class="fig-title-wrap">' + renderFigTag(ui, 4) + '<h3 class="fig-title">' + fmt(sr.title, isRtl, qNorm) + "</h3></div>"
            + (sr.arousalLegend ? '<span class="arousal-pill"><span class="arousal-diamond" aria-hidden="true"></span><span>' + fmt(sr.arousalLegend, isRtl, "") + "</span></span>" : "")
          + "</div>"
          + (sr.subtitle ? '<p class="fig-sub">' + fmt(sr.subtitle, isRtl, qNorm) + "</p>" : "")
          + '<div dir="ltr">' + svg + "</div>"
          + '<div class="ribbon-legend">' + legHtml + "</div>"
          + "</figure>";
      }

      /* =======================================================================
         VIZ 5A: PRECISION LINEAR GAUGE SVG (SPOTLIGHT WATCH BIOMARKER)
         ======================================================================= */
      function renderSpotlightGauge(lb) {
        const W = 860, H = 44;
        const padL = 14, padR = 14, trackW = W - padL - padR;
        const span = Math.max(0.1, lb.max - lb.min);
        const mapX = (v) => padL + Math.max(0, Math.min(1, (v - lb.min) / span)) * trackW;

        const zL = mapX(lb.rLow);
        const zR = mapX(lb.rHigh);
        const cX = mapX(lb.curr);
        const trackY = 19, trackH = 7;

        const tipT = esc(lb.label + " (" + lb.date + ")");
        const tipB = esc(lb.currStr + " " + lb.unit + " · Ref " + lb.ref + " — " + lb.note);

        return '<svg class="viz-svg spot-svg" viewBox="0 0 ' + W + " " + H + '" dir="ltr" direction="ltr" role="img" aria-label="' + tipT + ": " + tipB + '">'
          + '<rect x="' + padL + '" y="' + trackY + '" width="' + trackW + '" height="' + trackH + '" rx="3.5" fill="var(--track-bg)"></rect>'
          + '<rect x="' + padL + '" y="' + trackY + '" width="' + Math.max(0, zL - padL).toFixed(1) + '" height="' + trackH + '" rx="3.5" fill="var(--caution-bg)"></rect>'
          + '<rect x="' + zL.toFixed(1) + '" y="' + trackY + '" width="' + Math.max(4, zR - zL).toFixed(1) + '" height="' + trackH + '" rx="2" fill="var(--zone-bg)"></rect>'
          + '<line x1="' + zL.toFixed(1) + '" y1="' + (trackY - 3) + '" x2="' + zL.toFixed(1) + '" y2="' + (trackY + trackH + 3.5) + '" stroke="var(--zone-edge)" stroke-width="1.6"></line>'
          + '<line x1="' + zR.toFixed(1) + '" y1="' + (trackY - 3) + '" x2="' + zR.toFixed(1) + '" y2="' + (trackY + trackH + 3.5) + '" stroke="var(--zone-edge)" stroke-width="1.6"></line>'
          + '<text x="' + zL.toFixed(1) + '" y="' + (trackY + trackH + 14.5) + '" text-anchor="middle" direction="ltr" fill="var(--text-3)" font-size="11" font-weight="600" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">' + esc(lb.rLow.toFixed(1)) + "</text>"
          + '<text x="' + zR.toFixed(1) + '" y="' + (trackY + trackH + 14.5) + '" text-anchor="middle" direction="ltr" fill="var(--text-3)" font-size="11" font-weight="600" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">' + esc(lb.rHigh.toFixed(1)) + "</text>"
          + '<text x="' + padL + '" y="' + (trackY + trackH + 14.5) + '" text-anchor="start" direction="ltr" fill="var(--text-3)" font-size="10.5" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">' + esc(lb.min) + "</text>"
          + '<text x="' + (W - padR) + '" y="' + (trackY + trackH + 14.5) + '" text-anchor="end" direction="ltr" fill="var(--text-3)" font-size="10.5" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">' + esc(lb.max) + "</text>"
          + '<g class="svg-hit" tabindex="0" data-tip-title="' + tipT + '" data-tip-body="' + tipB + '">'
            + '<circle cx="' + cX.toFixed(1) + '" cy="' + (trackY + trackH / 2) + '" r="10.5" fill="var(--amber-soft)"></circle>'
            + '<circle cx="' + cX.toFixed(1) + '" cy="' + (trackY + trackH / 2) + '" r="5.2" fill="var(--amber)" stroke="var(--surface)" stroke-width="2"></circle>'
            + '<text x="' + cX.toFixed(1) + '" y="11" text-anchor="middle" direction="ltr" fill="var(--amber-text)" font-size="12" font-weight="700" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">' + esc(lb.currStr) + "</text>"
            + '<circle cx="' + cX.toFixed(1) + '" cy="' + (trackY + trackH / 2) + '" r="16" fill="transparent"></circle>'
          + "</g>"
          + "</svg>";
      }

      function renderMiniBar(lb) {
        const span = Math.max(0.01, lb.max - lb.min);
        const clamp = (v) => Math.max(2, Math.min(98, ((v - lb.min) / span) * 100));
        const zL = Math.max(0, Math.min(100, ((lb.rLow - lb.min) / span) * 100));
        const zR = Math.max(0, Math.min(100, ((lb.rHigh - lb.min) / span) * 100));
        const cP = clamp(lb.curr);
        let prevHtml = "";
        if (typeof lb.prev === "number") {
          const pP = clamp(lb.prev);
          const dL = Math.min(pP, cP);
          const dW = Math.abs(cP - pP);
          prevHtml = '<span class="mini-delta" style="left:' + dL.toFixed(1) + "%;width:" + dW.toFixed(1) + '%"></span>'
            + '<span class="mini-dot-prev" style="left:' + pP.toFixed(1) + '%"></span>';
        }
        return '<div class="mini-viz" dir="ltr">'
          + '<div class="mini-track" aria-hidden="true">'
            + '<span class="mini-zone" style="left:' + zL.toFixed(1) + "%;width:" + Math.max(3, zR - zL).toFixed(1) + '%"></span>'
            + prevHtml
            + '<span class="mini-dot-curr" style="left:' + cP.toFixed(1) + '%"></span>'
          + "</div>"
          + (lb.ref ? '<span class="mini-ref">' + esc(lb.ref) + "</span>" : "")
          + "</div>";
      }

      /* =======================================================================
         CHROME, MARGIN RAIL & SHEET RENDERING
         ======================================================================= */
      function renderChrome(instantPill) {
        if (!data || !data[lang]) return;
        const d = data[lang];
        const ui = d.ui || {};
        const secs = d.sections || {};
        const isRtl = d.dir === "rtl";

        root.lang = d.lang;
        root.dir = d.dir;
        document.title = d.docTitle;

        printBtn.setAttribute("aria-label", ui.printBtn || "Print");
        printBtn.setAttribute("title", ui.printBtn || "Print");
        lockBtn.setAttribute("aria-label", ui.lockBtn || "Lock");
        lockBtn.setAttribute("title", ui.lockBtn || "Lock");
        scBtn.setAttribute("aria-label", ui.shortcutsBtn || "Shortcuts");
        scBtn.setAttribute("title", ui.shortcutsBtn || "Shortcuts");
        floatTopBtn.setAttribute("aria-label", ui.topBtn || "Back to top");
        floatTopBtn.setAttribute("title", ui.topBtn || "Back to top");

        btnBrief.textContent = ui.densityBrief || "Brief";
        btnFull.textContent = ui.densityFull || "Full";
        densityCtrl.setAttribute("aria-label", ui.densityAria || "Display density");

        searchInput.placeholder = ui.searchPlaceholder || "";
        searchInput.setAttribute("aria-label", ui.searchPlaceholder || "Search");
        searchClear.setAttribute("aria-label", ui.searchClear || "Clear");
        searchClear.setAttribute("title", ui.searchClear || "Clear");

        langBtns.forEach((btn) => {
          const active = btn.dataset.loc === lang;
          btn.classList.toggle("is-active", active);
          btn.setAttribute("aria-pressed", active ? "true" : "false");
        });
        densBtns.forEach((btn) => {
          const active = btn.dataset.dens === density;
          btn.classList.toggle("is-active", active);
          btn.setAttribute("aria-pressed", active ? "true" : "false");
        });

        const navMap = ui.nav || {};
        navLinks.innerHTML = NAV_ORDER.filter((k) => navMap[k]).map((k) => {
          const active = k === activeNav;
          const num = (secs[k] && secs[k].num) || "";
          return '<button class="nav-link' + (active ? " is-active" : "") + '" type="button" data-target="' + esc(k) + '"' + (active ? ' aria-current="location"' : "") + '>'
            + (num ? '<span class="nav-num"><bdi dir="ltr">' + esc(num) + "</bdi></span>" : "")
            + "<span>" + fmt(navMap[k], isRtl, "") + "</span></button>";
        }).join("");

        /* Desktop Ambient Margin Rail */
        marginRail.innerHTML =
          '<div class="rail-kicker">' + esc(ui.chaptersLabel || "Contents") + "</div>"
          + '<div class="rail-list">'
            + NAV_ORDER.filter((k) => navMap[k]).map((k) => {
                const active = k === activeNav;
                const num = (secs[k] && secs[k].num) || "";
                return '<button class="rail-item' + (active ? " is-active" : "") + '" type="button" data-target="' + esc(k) + '"' + (active ? ' aria-current="location"' : "") + '>'
                  + '<span class="rail-num"><bdi dir="ltr">' + esc(num) + "</bdi></span>"
                  + '<span class="rail-lbl">' + fmt(navMap[k], isRtl, "") + "</span>"
                  + "</button>";
              }).join("")
          + "</div>"
          + '<div class="rail-tools">'
            + '<button class="rail-tool-btn rail-top-btn' + ((window.scrollY || 0) < 240 ? " is-dim" : "") + '" type="button" data-rail-act="top" title="' + esc(ui.topBtn || "Top") + '">' + ICO_UP + '<span>' + esc(ui.topBtn || "Top") + "</span></button>"
          + "</div>";

        syncThemeControl();
        syncMobileDock();
        syncAllPills(Boolean(instantPill));
      }

      function renderExpandBtn(key, expandedNow, ui) {
        if (density !== "brief") return "";
        const lbl = expandedNow ? (ui.collapseDetail || "Hide detail") : (ui.expandDetail || "Show detail");
        return '<button class="item-expand" type="button" data-item-key="' + esc(key) + '" aria-expanded="' + (expandedNow ? "true" : "false") + '" title="' + esc(lbl) + '"><span>' + esc(lbl) + "</span>" + ICO_CHEV + "</button>";
      }

      function renderSecHead(sec, id, ui, isRtl, qNorm, extraBadgeHtml) {
        return '<div class="sec-head">'
          + '<span class="sec-num"><bdi dir="ltr">' + esc(sec.num) + "</bdi></span>"
          + '<h2 class="sec-title">' + fmt(sec.title, isRtl, qNorm) + "</h2>"
          + '<span class="sec-rule" aria-hidden="true"></span>'
          + (extraBadgeHtml || "")
          + (id !== "priorities"
            ? '<button class="sec-top-mini" type="button" data-scroll-top="1" aria-label="' + esc(ui.topBtn || "Top") + '" title="' + esc(ui.topBtn || "Top") + '">' + ICO_UP + "</button>"
            : "")
          + "</div>";
      }

      function renderXrefs(targets, fromSec, secs, ui, isRtl) {
        if (!targets || !targets.length) return "";
        const navMap = ui.nav || {};
        return '<div class="xref-row">' + targets.filter((t) => secs[t]).map((t) => {
          const num = secs[t].num;
          const lbl = navMap[t] || secs[t].title;
          return '<button class="xref-chip" type="button" data-jump-sec="' + esc(t) + '" data-from-sec="' + esc(fromSec) + '">'
            + ICO_JUMP + '<span><bdi dir="ltr">' + esc(num) + "</bdi> · " + fmt(lbl, isRtl, "") + "</span></button>";
        }).join("") + "</div>";
      }

      function getAllExpandableKeys(secs) {
        const keys = [];
        if (secs.priorities && secs.priorities.goals) {
          secs.priorities.goals.forEach((g, i) => { if (g.detail) keys.push("p-" + i); });
        }
        if (secs.cognition && secs.cognition.detail) keys.push("cog-0");
        if (secs.sleep && secs.sleep.items) {
          secs.sleep.items.forEach((it, i) => { if (it.detail) keys.push("sl-" + i); });
        }
        if (secs.mood && secs.mood.items) {
          secs.mood.items.forEach((it, i) => { if (it.detail) keys.push("md-" + i); });
        }
        if (secs.safety && secs.safety.baselineItems) {
          secs.safety.baselineItems.forEach((b, i) => { if (b.detail) keys.push("sf-" + i); });
        }
        return keys;
      }

      function renderBrief(animate) {
        if (!data || !data[lang]) return;
        const d = data[lang];
        const ui = d.ui || {};
        const secs = d.sections || {};
        const isRtl = d.dir === "rtl";
        const qNorm = normText(searchQuery.trim());
        const hasQ = Boolean(qNorm);
        let matchCount = 0;

        const matches = (...parts) => !hasQ || parts.some((p) => normText(p).includes(qNorm));

        const sectionsHtml = [];

        /* 01 · PRIORITIES */
        const s1 = secs.priorities;
        if (s1) {
          const ccMatch = matches(s1.chiefComplaintLabel, s1.chiefComplaint);
          const keptGoals = (s1.goals || []).map((g, i) => ({ g, i })).filter(({ g }) => matches(g.title, g.brief, g.detail));
          const keptSynth = (s1.synthesis || []).map((s, i) => ({ s, i })).filter(({ s }) => matches(s.lead, s.text));
          if (hasQ) matchCount += (ccMatch ? 1 : 0) + keptGoals.length + keptSynth.length;

          if (ccMatch || keptGoals.length || keptSynth.length) {
            const goalsHtml = keptGoals.map(({ g, i }) => {
              const key = "p-" + i;
              const isOpen = expandedItems.has(key);
              const searchOpen = hasQ && density === "brief";
              const expNow = density === "full" || isOpen || searchOpen;
              return '<li class="goal-row expandable' + (isOpen ? " is-open" : "") + (searchOpen ? " is-search-open" : "") + '">'
                + '<span class="goal-idx"><bdi dir="ltr">' + String(i + 1) + ".</bdi></span>"
                + '<div class="goal-body">'
                  + '<div class="goal-head"><span class="goal-title">' + fmt(g.title, isRtl, qNorm) + "</span>" + (g.detail ? renderExpandBtn(key, expNow, ui) : "") + "</div>"
                  + '<p class="goal-brief">' + fmt(g.brief, isRtl, qNorm) + "</p>"
                  + (g.detail ? '<p class="goal-detail detail-text">' + fmt(g.detail, isRtl, qNorm) + "</p>" : "")
                + "</div>"
                + "</li>";
            }).join("");

            const synthHtml = keptSynth.map(({ s, i }) =>
              '<div class="synth-col">'
                + '<div><h4 class="synth-lead">' + fmt(s.lead, isRtl, qNorm) + '</h4><p class="synth-text">' + fmt(s.text, isRtl, qNorm) + "</p></div>"
                + renderXrefs(SYNTH_TARGETS[i], "priorities", secs, ui, isRtl)
              + "</div>"
            ).join("");

            sectionsHtml.push(
              '<section id="sec-priorities" class="ed-section">'
                + renderSecHead(s1, "priorities", ui, isRtl, qNorm)
                + (ccMatch ? '<div class="chief-block"><div class="kicker">' + fmt(s1.chiefComplaintLabel, isRtl, qNorm) + '</div><p class="chief-text">' + fmt(s1.chiefComplaint, isRtl, qNorm) + "</p></div>" : "")
                + (keptGoals.length ? '<div class="goals-block"><div class="kicker">' + fmt(s1.goalsLabel, isRtl, "") + '</div><ol class="goals-list">' + goalsHtml + "</ol></div>" : "")
                + (keptSynth.length ? '<div><div class="kicker">' + fmt(s1.synthesisLabel, isRtl, "") + '</div><div class="synth-grid">' + synthHtml + "</div></div>" : "")
              + "</section>"
            );
          }
        }

        /* 02 · COGNITION */
        const s2 = secs.cognition;
        if (s2) {
          const proseMatch = matches(s2.takeaway, s2.detail);
          const keptBench = (s2.benchmarks || []).filter((b) => matches(b.label, b.value));
          const sv = s2.siblingViz;
          const svMatch = sv && matches(
            sv.title, sv.subtitle, sv.gatesNote, sv.olderBrotherNote,
            ...(sv.metrics || []).flatMap((m) => [m.label, m.patientText, m.brotherText])
          );
          const da = s2.d2Anatomy;
          const daMatch = da && matches(
            da.title, da.subtitle,
            ...(da.rows || []).flatMap((r) => [r.label, r.callout])
          );
          const pv = s2.pvtDual;
          const pvMatch = pv && matches(
            pv.title, pv.subtitle, pv.conclusion,
            pv.alert && pv.alert.label, pv.alert && pv.alert.summary, pv.alert && pv.alert.shortTag,
            pv.fatigued && pv.fatigued.label, pv.fatigued && pv.fatigued.summary, pv.fatigued && pv.fatigued.shortTag
          );
          if (hasQ) matchCount += (proseMatch ? 1 : 0) + keptBench.length + (svMatch ? 1 : 0) + (daMatch ? 1 : 0) + (pvMatch ? 1 : 0);

          if (proseMatch || keptBench.length || svMatch || daMatch || pvMatch) {
            const benchHtml = keptBench.map((b) => {
              const valHtml = /\d/.test(String(b.value || ""))
                ? '<bdi dir="ltr">' + fmt(b.value, false, qNorm) + "</bdi>"
                : fmt(b.value, isRtl, qNorm);
              return '<span class="bench-chip tone-' + esc(b.tone || "intact") + '"><span class="bench-lbl">' + fmt(b.label, isRtl, qNorm) + '</span><span class="bench-val">' + valHtml + "</span></span>";
            }).join("");

            const cogKey = "cog-0";
            const cogOpen = expandedItems.has(cogKey);
            const cogSearchOpen = hasQ && density === "brief";
            const cogExpNow = density === "full" || cogOpen || cogSearchOpen;
            sectionsHtml.push(
              '<section id="sec-cognition" class="ed-section">'
                + renderSecHead(s2, "cognition", ui, isRtl, qNorm)
                + (proseMatch
                  ? '<div class="expandable' + (cogOpen ? " is-open" : "") + (cogSearchOpen ? " is-search-open" : "") + '">'
                      + '<p class="lead-prose">' + fmt(s2.takeaway, isRtl, qNorm) + "</p>"
                      + (s2.detail && density === "brief" ? '<div class="cog-prose-bar">' + renderExpandBtn(cogKey, cogExpNow, ui) + "</div>" : "")
                      + (s2.detail ? '<p class="sub-prose detail-text">' + fmt(s2.detail, isRtl, qNorm) + "</p>" : "")
                    + "</div>"
                  : "")
                + (keptBench.length ? '<div class="bench-wrap"><div class="kicker">' + fmt(s2.benchmarksLabel, isRtl, "") + '</div><div class="bench-strip">' + benchHtml + "</div></div>" : "")
                + (svMatch ? renderSiblingViz(sv, ui, isRtl, qNorm) : "")
                + ((daMatch || pvMatch)
                  ? '<div class="cog-fig-pair">'
                      + (daMatch ? renderErrorAnatomy(da, ui, isRtl, qNorm) : "")
                      + (pvMatch ? renderVigilanceChart(pv, ui, isRtl, qNorm) : "")
                    + "</div>"
                  : "")
              + "</section>"
            );
          }
        }

        /* 03 · SLEEP & COURSE */
        const s3 = secs.sleep;
        if (s3) {
          const sumMatch = matches(s3.summary);
          const keptItems = (s3.items || []).map((it, i) => ({ it, i })).filter(({ it }) => matches(it.lead, it.brief, it.detail));
          const sr = s3.sleepRibbon;
          const srMatch = sr && matches(
            sr.title, sr.subtitle,
            ...(sr.blocks || []).flatMap((b) => [b.shortLabel, b.label, b.detail])
          );
          const keptTl = (s3.timeline || []).filter((t) => matches(t.stage, t.age, t.note));
          if (hasQ) matchCount += (sumMatch ? 1 : 0) + keptItems.length + (srMatch ? 1 : 0) + keptTl.length;

          if (sumMatch || keptItems.length || srMatch || keptTl.length) {
            const itemsHtml = keptItems.map(({ it, i }) => {
              const key = "sl-" + i;
              const isOpen = expandedItems.has(key);
              const searchOpen = hasQ && density === "brief";
              const expNow = density === "full" || isOpen || searchOpen;
              return '<li class="prose-item expandable' + (isOpen ? " is-open" : "") + (searchOpen ? " is-search-open" : "") + '">'
                + '<div class="prose-item-head"><span class="prose-lead">' + fmt(it.lead, isRtl, qNorm) + "</span>" + (it.detail ? renderExpandBtn(key, expNow, ui) : "") + "</div>"
                + '<p class="prose-brief">' + fmt(it.brief, isRtl, qNorm) + "</p>"
                + (it.detail ? '<p class="prose-detail detail-text">' + fmt(it.detail, isRtl, qNorm) + "</p>" : "")
                + "</li>";
            }).join("");

            const tlFiltered = hasQ && keptTl.length < (s3.timeline || []).length;
            const tlHtml = keptTl.map((t) =>
              '<li class="life-node' + (t.current ? " is-current" : "") + '">'
                + '<span class="life-age">' + fmt(t.age, isRtl, qNorm) + "</span>"
                + '<span class="life-dot-wrap" aria-hidden="true"><span class="life-dot"></span></span>'
                + '<span class="life-stage">' + fmt(t.stage, isRtl, qNorm) + "</span>"
                + '<span class="life-note">' + fmt(t.note, isRtl, qNorm) + "</span>"
              + "</li>"
            ).join("");

            sectionsHtml.push(
              '<section id="sec-sleep" class="ed-section">'
                + renderSecHead(s3, "sleep", ui, isRtl, qNorm)
                + (sumMatch ? '<p class="lead-prose">' + fmt(s3.summary, isRtl, qNorm) + "</p>" : "")
                + (keptItems.length ? '<ul class="prose-list">' + itemsHtml + "</ul>" : "")
                + (srMatch ? renderSleepRibbon(sr, ui, isRtl, qNorm) : "")
                + (keptTl.length ? '<div class="life-wrap"><div class="kicker">' + fmt(s3.timelineTitle, isRtl, "") + '</div><ol class="life-rail' + (tlFiltered ? " is-filtered" : "") + '">' + tlHtml + "</ol></div>" : "")
              + "</section>"
            );
          }
        }

        /* 04 · MOOD & BEHAVIOR */
        const s4 = secs.mood;
        if (s4) {
          const sumMatch = matches(s4.summary);
          const keptItems = (s4.items || []).map((it, i) => ({ it, i })).filter(({ it }) => matches(it.lead, it.brief, it.detail));
          if (hasQ) matchCount += (sumMatch ? 1 : 0) + keptItems.length;

          if (sumMatch || keptItems.length) {
            const itemsHtml = keptItems.map(({ it, i }) => {
              const key = "md-" + i;
              const isOpen = expandedItems.has(key);
              const searchOpen = hasQ && density === "brief";
              const expNow = density === "full" || isOpen || searchOpen;
              return '<li class="prose-item expandable' + (isOpen ? " is-open" : "") + (searchOpen ? " is-search-open" : "") + '">'
                + '<div class="prose-item-head"><span class="prose-lead">' + fmt(it.lead, isRtl, qNorm) + "</span>" + (it.detail ? renderExpandBtn(key, expNow, ui) : "") + "</div>"
                + '<p class="prose-brief">' + fmt(it.brief, isRtl, qNorm) + "</p>"
                + (it.detail ? '<p class="prose-detail detail-text">' + fmt(it.detail, isRtl, qNorm) + "</p>" : "")
                + "</li>";
            }).join("");

            sectionsHtml.push(
              '<section id="sec-mood" class="ed-section">'
                + renderSecHead(s4, "mood", ui, isRtl, qNorm)
                + (sumMatch ? '<p class="lead-prose">' + fmt(s4.summary, isRtl, qNorm) + "</p>" : "")
                + (keptItems.length ? '<ul class="prose-list">' + itemsHtml + "</ul>" : "")
              + "</section>"
            );
          }
        }

        /* 05 · SAFETY & SIGNAL-FIRST LABS */
        const s5 = secs.safety;
        if (s5) {
          const keptBase = (s5.baselineItems || []).map((b, i) => ({ b, i })).filter(({ b }) => matches(b.badge, b.lead, b.brief, b.detail));
          const accMatch = s5.accessNote && matches(s5.accessNote);
          const allLabs = s5.labs || [];
          const matchLab = (lb) => matches(lb.label, lb.date, lb.currStr, lb.prevStr, lb.unit, lb.ref, lb.note);
          const spotLabs = allLabs.filter((lb) => lb.group === "spotlight" && matchLab(lb));
          const repLabs = allLabs.filter((lb) => lb.group === "deficiency" && matchLab(lb));
          const normLabs = allLabs.filter((lb) => lb.group === "normal" && matchLab(lb));
          if (hasQ) matchCount += keptBase.length + (accMatch ? 1 : 0) + spotLabs.length + repLabs.length + normLabs.length;

          const hasAnyLabs = spotLabs.length || repLabs.length || normLabs.length;
          if (keptBase.length || accMatch || hasAnyLabs) {
            const baseHtml = keptBase.map(({ b, i }) => {
              const key = "sf-" + i;
              const sev = b.severity || "info";
              const isOpen = expandedItems.has(key);
              const searchOpen = hasQ && density === "brief";
              const expNow = density === "full" || isOpen || searchOpen;
              const ico = SAFE_ICONS[i % SAFE_ICONS.length];
              return '<div class="safety-card sev-' + esc(sev) + ' expandable' + (isOpen ? " is-open" : "") + (searchOpen ? " is-search-open" : "") + '">'
                + '<div class="safety-top">'
                  + '<span class="safety-lead-wrap"><span class="safety-ico sev-' + esc(sev) + '">' + ico + '</span><span class="safety-lead">' + fmt(b.lead, isRtl, qNorm) + "</span></span>"
                  + '<span class="safety-right">'
                    + (b.badge ? '<span class="sev-badge sev-' + esc(sev) + '">' + fmt(b.badge, isRtl, qNorm) + "</span>" : "")
                    + (b.detail ? renderExpandBtn(key, expNow, ui) : "")
                  + "</span>"
                + "</div>"
                + '<p class="safety-brief">' + fmt(b.brief, isRtl, qNorm) + "</p>"
                + (b.detail ? '<p class="safety-detail detail-text">' + fmt(b.detail, isRtl, qNorm) + "</p>" : "")
                + "</div>";
            }).join("");

            let labsHtml = "";
            if (hasAnyLabs) {
              const groups = s5.labsGroups || {};
              const leg = s5.labsLegend || {};
              const filterHtml = hasQ ? "" :
                '<div class="labs-filter" role="group" aria-label="Labs filter">'
                  + '<button class="labs-fbtn' + (labsFilter === "watch" ? " is-active" : "") + '" type="button" data-lab-filter="watch" aria-pressed="' + (labsFilter === "watch" ? "true" : "false") + '">' + esc(ui.labsFilterWatch || "Watch") + "</button>"
                  + '<button class="labs-fbtn' + (labsFilter === "all" ? " is-active" : "") + '" type="button" data-lab-filter="all" aria-pressed="' + (labsFilter === "all" ? "true" : "false") + '">' + esc(ui.labsFilterAll || "All") + "</button>"
                + "</div>";

              const spotHtml = spotLabs.map((lb) =>
                '<div class="lab-spotlight">'
                  + '<div class="spot-top">'
                    + '<span class="spot-left">'
                      + '<span class="spot-lbl">' + fmt(lb.label, isRtl, qNorm) + "</span>"
                      + '<span class="spot-date"><bdi dir="ltr">' + esc(lb.date) + "</bdi></span>"
                      + (ui.spotlightBadge ? '<span class="spot-badge">' + fmt(ui.spotlightBadge, isRtl, "") + "</span>" : "")
                    + "</span>"
                    + '<span class="spot-val"><bdi dir="ltr">' + esc(lb.currStr) + '<span class="lab-unit">' + esc(lb.unit) + "</span></bdi></span>"
                  + "</div>"
                  + '<div dir="ltr">' + renderSpotlightGauge(lb) + "</div>"
                  + (lb.note ? '<p class="spot-note">' + fmt(lb.note, isRtl, qNorm) + "</p>" : "")
                + "</div>"
              ).join("");

              const repHtml = repLabs.length
                ? '<div class="lab-subblock">'
                    + '<div class="lab-subhead"><span class="lab-subtitle">' + fmt((groups.deficiency && groups.deficiency.title) || "", isRtl, qNorm) + "</span>"
                      + ((groups.deficiency && groups.deficiency.note) ? '<span class="lab-subnote">' + fmt(groups.deficiency.note, isRtl, qNorm) + "</span>" : "")
                    + "</div>"
                    + '<div class="repleted-grid">' + repLabs.map((lb) => {
                        const fold = (typeof lb.prev === "number" && lb.prev > 0) ? (lb.curr / lb.prev).toFixed(1) : "";
                        const tipT = esc(lb.label + " (" + lb.date + ")");
                        const tipB = esc(lb.prevStr + " → " + lb.currStr + " " + lb.unit + " · Ref " + lb.ref + (lb.note ? " · " + lb.note : ""));
                        return '<div class="rep-item" data-tip-title="' + tipT + '" data-tip-body="' + tipB + '">'
                          + '<div class="rep-top"><span class="rep-lbl">' + fmt(lb.label, isRtl, qNorm) + '</span><span class="rep-date"><bdi dir="ltr">' + esc(lb.date) + "</bdi></span></div>"
                          + '<div class="rep-val-row">'
                            + '<span class="rep-val"><bdi dir="ltr"><span class="rep-prev">' + esc(lb.prevStr) + '</span><span class="rep-arr">\u2192</span>' + esc(lb.currStr) + '<span class="rep-unit">' + esc(lb.unit) + "</span></bdi></span>"
                            + (fold ? '<span class="rep-fold"><bdi dir="ltr">×' + esc(fold) + "</bdi></span>" : "")
                          + "</div>"
                          + renderMiniBar(lb)
                          + (lb.note ? '<div class="rep-meta"><span>' + fmt(lb.note, isRtl, qNorm) + "</span></div>" : "")
                        + "</div>";
                      }).join("") + "</div>"
                  + "</div>"
                : "";

              const hideNormal = !hasQ && labsFilter === "watch";
              const normHtml = normLabs.length
                ? '<div class="lab-subblock' + (hideNormal ? " is-filter-hidden" : "") + '">'
                    + '<div class="lab-subhead"><span class="lab-subtitle">' + fmt((groups.normal && groups.normal.title) || "", isRtl, qNorm) + "</span></div>"
                    + '<div class="normal-grid">' + normLabs.map((lb) => {
                        const tipT = esc(lb.label + " (" + lb.date + ")");
                        const tipB = esc(lb.currStr + " " + lb.unit + " · Ref " + lb.ref);
                        return '<div class="norm-item" data-tip-title="' + tipT + '" data-tip-body="' + tipB + '">'
                          + '<div class="norm-top">'
                            + '<span class="norm-lbl">' + fmt(lb.label, isRtl, qNorm) + "</span>"
                            + '<span class="norm-val"><bdi dir="ltr">' + esc(lb.currStr) + '<span class="norm-unit">' + esc(lb.unit) + "</span></bdi></span>"
                          + "</div>"
                          + renderMiniBar(lb)
                        + "</div>";
                      }).join("") + "</div>"
                  + "</div>"
                : "";

              labsHtml = '<figure id="fig-05" class="figure-card">'
                + '<div class="labs-head-bar"><div class="fig-title-wrap">' + renderFigTag(ui, 5) + '<h3 class="fig-title">' + fmt(s5.labsTitle, isRtl, qNorm) + "</h3></div>" + filterHtml + "</div>"
                + '<div class="labs-legend">'
                  + '<span class="leg-item"><span class="lab-leg-zone" aria-hidden="true"></span><span>' + fmt(leg.ref, isRtl, "") + "</span></span>"
                  + '<span class="leg-item"><span class="lab-leg-shift" aria-hidden="true"><span class="lab-leg-prev"></span><span class="lab-leg-bar"></span><span class="lab-leg-curr"></span></span><span>' + fmt(leg.shift, isRtl, "") + "</span></span>"
                  + '<span class="leg-item"><span class="lab-leg-warn" aria-hidden="true"></span><span>' + fmt(leg.watch, isRtl, "") + "</span></span>"
                + "</div>"
                + spotHtml + repHtml + normHtml
                + "</figure>";
            }

            sectionsHtml.push(
              '<section id="sec-safety" class="ed-section">'
                + renderSecHead(s5, "safety", ui, isRtl, qNorm)
                + (keptBase.length ? '<div class="safety-grid">' + baseHtml + "</div>" : "")
                + (accMatch ? '<p class="access-note">' + ICO_INFO + "<span>" + fmt(s5.accessNote, isRtl, qNorm) + "</span></p>" : "")
                + labsHtml
              + "</section>"
            );
          }
        }

        /* 06 · CONSULTATION QUESTIONS */
        const s6 = secs.questions;
        if (s6) {
          const totalQ = (s6.items || []).length;
          const keptQ = (s6.items || []).map((q, i) => ({ q, i })).filter(({ q }) => matches(q.lead, q.text));
          if (hasQ) matchCount += keptQ.length;
          if (keptQ.length) {
            const doneCount = discussedQuestions.size;
            const qBadge = doneCount > 0
              ? '<span class="sec-badge">' + esc((ui.discussedCount || "{done}/{total}").replace("{done}", String(doneCount)).replace("{total}", String(totalQ))) + "</span>"
              : "";
            const qHtml = keptQ.map(({ q, i }) => {
              const qKey = "q-" + i;
              const isDone = discussedQuestions.has(qKey);
              return '<li class="q-item' + (isDone ? " is-done" : "") + '">'
                + '<div class="q-top">'
                  + '<span class="q-num"><bdi dir="ltr">' + String(i + 1).padStart(2, "0") + "</bdi></span>"
                  + '<div><h3 class="q-lead">' + fmt(q.lead, isRtl, qNorm) + '</h3><p class="q-text">' + fmt(q.text, isRtl, qNorm) + "</p></div>"
                  + '<button class="q-check" type="button" data-q-toggle="' + esc(qKey) + '" aria-pressed="' + (isDone ? "true" : "false") + '" aria-label="' + esc(ui.discussedLabel || "Mark as discussed") + '" title="' + esc(ui.discussedLabel || "Mark as discussed") + '">' + ICO_CHECK + "</button>"
                + "</div>"
                + '<div class="q-foot">' + renderXrefs(QUESTION_TARGETS[i], "questions", secs, ui, isRtl) + "</div>"
              + "</li>";
            }).join("");

            sectionsHtml.push(
              '<section id="sec-questions" class="ed-section">'
                + renderSecHead(s6, "questions", ui, isRtl, qNorm, qBadge)
                + (s6.subtitle ? '<p class="sub-prose">' + fmt(s6.subtitle, isRtl, qNorm) + "</p>" : "")
                + '<ol class="q-grid">' + qHtml + "</ol>"
              + "</section>"
            );
          }
        }

        if (sectionsHtml.length) {
          sectionsHtml[0] = sectionsHtml[0].replace('class="ed-section"', 'class="ed-section is-first"');
        }

        /* Demographic Chips on Screen + Clean Inline Line in Print */
        const profileParts = String(d.profileLine || "").split(/\s*·\s*/).filter(Boolean);
        const profileBarHtml = '<div class="profile-bar">'
          + profileParts.map((part) => '<span class="profile-chip">' + fmt(part, isRtl, qNorm) + "</span>").join("")
          + "</div>"
          + '<p class="profile-line-print">' + fmt(d.profileLine, isRtl, qNorm) + "</p>";

        /* Quick-Jump 6-Chapter Map (Screen-Only, hidden during active search) */
        const navMap = ui.nav || {};
        const metaMap = ui.secMeta || {};
        const totalQCount = (secs.questions && secs.questions.items) ? secs.questions.items.length : 4;
        const chapterMapHtml = !hasQ
          ? '<nav class="chapter-map" aria-label="' + esc(ui.chapterMapAria || "Quick section index") + '">'
            + NAV_ORDER.filter((k) => secs[k]).map((k) => {
                const s = secs[k];
                const dotCls = k === "safety" ? " is-warn" : (k === "cognition" ? " is-data" : "");
                const metaTxt = (k === "questions" && discussedQuestions.size > 0)
                  ? (ui.discussedCount || "{done}/{total}").replace("{done}", String(discussedQuestions.size)).replace("{total}", String(totalQCount))
                  : (metaMap[k] || "");
                return '<button class="chap-tile" type="button" data-jump-sec="' + esc(k) + '">'
                  + '<span class="chap-tile-top"><span class="chap-num"><bdi dir="ltr">' + esc(s.num) + '</bdi></span><span class="chap-dot' + dotCls + '" aria-hidden="true"></span></span>'
                  + '<span class="chap-name">' + fmt(navMap[k] || s.title, isRtl, "") + "</span>"
                  + (metaTxt ? '<span class="chap-meta">' + fmt(metaTxt, isRtl, "") + "</span>" : "")
                  + "</button>";
              }).join("")
            + "</nav>"
          : "";

        /* Brief Mode Expand-All / Collapse-All Convenience Bar */
        let briefStripHtml = "";
        if (density === "brief" && !hasQ) {
          const allKeys = getAllExpandableKeys(secs);
          const allOpen = allKeys.length > 0 && allKeys.every((k) => expandedItems.has(k));
          briefStripHtml = '<div class="brief-strip"><button class="brief-toggle-all" type="button" data-toggle-all="' + (allOpen ? "collapse" : "expand") + '">'
            + esc(allOpen ? (ui.collapseAll || "Collapse all") : (ui.expandAll || "Expand all"))
            + "</button></div>";
        }

        const emptyHtml = hasQ && matchCount === 0
          ? '<div class="search-empty"><p class="search-empty-title">' + esc(ui.searchNoMatch || "No matches") + ' — « ' + esc(searchQuery.trim()) + ' »</p><button id="emptyClearBtn" class="search-empty-btn" type="button">' + esc(ui.searchClear || "Clear") + "</button></div>"
          : "";

        const endCapHtml = !emptyHtml
          ? '<footer class="brief-endcap">'
              + '<span class="endcap-note"><span class="gate-dot" aria-hidden="true"></span><span>' + esc(ui.endNote || "") + "</span></span>"
              + '<span class="endcap-actions">'
                + '<button class="endcap-btn" type="button" data-scroll-top="1">' + ICO_UP + "<span>" + esc(ui.topBtn || "Top") + "</span></button>"
              + "</span>"
            + "</footer>"
          : "";

        briefMain.innerHTML =
          '<article class="brief-root' + (density === "brief" ? " is-brief" : "") + '">'
            + '<header class="masthead">'
              + '<div class="masthead-eyebrow">'
                + '<span class="dossier-pill"><span class="dossier-pulse" aria-hidden="true"></span><span>' + esc(ui.dossierTag || "") + "</span></span>"
              + "</div>"
