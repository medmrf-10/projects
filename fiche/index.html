      .repleted-grid { grid-template-columns: 1fr; }
      .normal-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .q-grid { grid-template-columns: 1fr; }
    }

    @media (max-width: 639px) {
      .sticky-chrome { position: static; }
      .sticky-chrome .read-progress { display: none; }
      .sticky-chrome .nav-links { display: none; }
      .mobile-top-progress { display: block; }
      .mob-dock { display: flex; }
      .float-top { display: none !important; }
      .return-toast {
        bottom: calc(68px + env(safe-area-inset-bottom, 0px));
        inset-inline-end: 12px;
        max-width: calc(100vw - 24px);
      }
      #scBtn { display: none; }

      .chrome-inner { padding: 7px 12px; gap: 6px; }
      .chrome-controls { gap: 6px; }
      .search-shell { order: 2; flex: 1 1 100%; width: 100%; }
      .seg-group { flex: 1 1 auto; justify-content: flex-start; gap: 5px; }
      .util-btns { gap: 4px; }
      .ico-btn { width: 29px; height: 29px; }
      .seg-btn { padding: 3.5px 7px; font-size: 0.72rem; }

      .brief-main { padding: 16px 14px calc(88px + env(safe-area-inset-bottom, 0px)); }
      .masthead { margin-bottom: 16px; padding-bottom: 14px; }
      .triage-strip { margin-bottom: 20px; }
      .triage-sub { display: none; }
      .ed-section, .brief-root.is-brief .ed-section { padding-top: 24px; margin-top: 24px; scroll-margin-top: 16px; }
      .prose-item { padding: 12px 13px; }
      .figure-card { padding: 14px 13px 13px; border-radius: var(--r-md); }
      .normal-grid { grid-template-columns: 1fr; }

      /* Mobile Vertical Hairline Lifespan Rail */
      .life-rail {
        grid-template-columns: 1fr;
        gap: 10px;
        padding-inline-start: 20px;
      }
      .life-rail::before {
        content: "";
        position: absolute;
        top: 12px;
        bottom: 12px;
        inset-inline-start: 5px;
        inset-inline-end: auto;
        width: 1px;
        background: var(--border-strong);
        z-index: 0;
      }
      .life-rail.is-filtered::before { display: none; }
      .life-node { align-items: flex-start; text-align: start; gap: 2px; padding: 4px 6px; }
      .life-dot-wrap { position: static; width: auto; height: auto; }
      .life-dot-wrap::before { display: none; }
      .life-dot { position: absolute; inset-inline-start: -20px; top: 8px; }
    }

    @media (max-width: 519px) {
      .triage-grid { grid-template-columns: 1fr; gap: 8px; }
      .triage-card { padding: 10px 12px 9px; gap: 5px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
    }

    /* =========================================================================
       EXACT 2-PAGE A4 EDITORIAL PRINT ARCHITECTURE (FR / AR / EN)
       ========================================================================= */
    @page { size: A4 portrait; margin: 4.5mm 6.5mm; }
    @media print {
      * {
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
        animation: none !important;
        transition: none !important;
      }
      :root, html[data-theme="dark"] {
        color-scheme: light;
        --bg: #FFFFFF;
        --surface: #FFFFFF;
        --surface-2: #F8FAFC;
        --surface-3: #F1F5F9;
        --border: #CBD5E1;
        --border-subtle: #E2E8F0;
        --border-strong: #94A3B8;
        --gridline: #E2E8F0;
        --text: #0F172A;
        --text-2: #1E293B;
        --text-3: #475569;
        --teal: #0F766E;
        --teal-text: #0D5E58;
        --teal-soft: #EDF7F6;
        --teal-wash: #F5FBFA;
        --teal-band: #E7F5F3;
        --teal-border: #99D5CF;
        --coral: #C2410C;
        --coral-text: #9A3412;
        --coral-soft: #FEF2EE;
        --coral-wash: #FFF6F3;
        --coral-border: #F5C2B1;
        --amber: #B45309;
        --amber-text: #92400E;
        --amber-soft: #FDF8EC;
        --amber-border: #E8CF9C;
        --info: #1D4ED8;
        --info-text: #1E40AF;
        --info-soft: #EFF6FF;
        --info-border: #BFDBFE;
        --slate-viz: #64748B;
        --bar-hit: #0F766E;
        --bar-swap: #B45309;
        --bar-stale: #C2410C;
        --bar-guess: #526175;
        --bar-text: #FFFFFF;
        --track-bg: #E2E8F0;
        --zone-bg: #D5EFEA;
        --zone-edge: #6EC0B7;
        --caution-bg: #FBEBD0;
      }

      /* Hide all interactive & screen-only chrome cleanly */
      .sticky-chrome, .gate-wrap, .labs-filter, .labs-reveal-btn, .item-expand, .viz-tooltip, .search-empty,
      .margin-rail, .mobile-top-progress, .mob-dock, .float-top, .return-toast,
      .sheet-backdrop, .modal-backdrop, .triage-strip, .brief-mode-bar, .sec-expand-btn, .item-tags, .nav-dot,
      .sec-top-mini, .sec-rule, .sec-badge, .xref-row, .q-check, .q-foot, .brief-endcap, .safety-ico {
        display: none !important;
      }
      mark.hl, mark.hl.is-current {
        background: transparent !important;
        color: inherit !important;
        box-shadow: none !important;
        padding: 0;
        font-weight: inherit;
      }

      /* Print ALWAYS shows Full details and all 13 labs */
      .brief-root.is-brief .detail-collapse,
      .detail-collapse {
        display: block !important;
        grid-template-rows: none !important;
        opacity: 1 !important;
      }
      .detail-inner { overflow: visible !important; }
      .detail-body { margin-top: 0.4mm !important; padding-top: 0 !important; border-top: 0 !important; }
      .detail-points { gap: 0.35mm !important; }
      .detail-point { padding-inline-start: 0 !important; font-size: 6.35pt !important; line-height: 1.18 !important; color: var(--text-3) !important; }
      .detail-point::before { display: none !important; }
      .dp-lbl { color: var(--text-2) !important; font-weight: 700 !important; }
      .lab-subblock.is-filter-hidden { display: block !important; }

      html, body {
        height: auto !important;
        min-height: 0 !important;
        background: #FFFFFF !important;
        color: #0F172A !important;

      .lead-prose { font-size: 7.3pt; line-height: 1.23; margin-bottom: 1mm; color: var(--text) !important; }

      .figure-card {

        break-inside: avoid;
        page-break-inside: avoid;

      /* Clean Page 2 Start at Section 04 for Balanced 2-Page A4 Executive Brief */
      #sec-mood { break-before: page; page-break-before: always; padding-top: 0; margin-top: 0; border-top: 0; }

      .life-dot-wrap { position: relative !important; width: 100% !important; height: 13px !important; }
      .life-dot-wrap::before { display: block !important; inset-inline-start: -1mm; inset-inline-end: -1mm; height: 0.75pt; }
      .life-node:first-child .life-dot-wrap::before { inset-inline-start: 50%; }
      .life-node:last-child .life-dot-wrap::before { inset-inline-end: 50%; }

      .access-note { margin-bottom: 0.9mm; padding: 0.55mm 1.5mm; font-size: 6.6pt; break-inside: avoid; }

      .labs-head-bar { margin-bottom: 0.7mm; }

      .lab-subblock { margin-top: 0.65mm; }

      .norm-item { padding: 0.3mm 0; margin: 0; background: transparent !important; break-inside: avoid; }

      function normChar(ch) {
        if (/[\u064B-\u065F\u0670\u0640]/.test(ch)) return "";
        if (/[\u0622\u0623\u0625\u0671]/.test(ch)) return "\u0627";
        if (ch === "\u0629") return "\u0647";
        if (ch === "\u0649") return "\u064A";
        return ch.normalize("NFD").replace(/[\u0300-\u036F]/g, "").toLowerCase();
      }

      function normText(str) {
        const raw = String(str ?? "");
        let out = "";
        for (let i = 0; i < raw.length; i++) out += normChar(raw[i]);
        return out;
      }

      function findMatchRanges(raw, qNorm) {
        if (!qNorm) return [];
        const chars = [], starts = [], ends = [];
        for (let i = 0; i < raw.length; i++) {
          const nc = normChar(raw[i]);
          for (let j = 0; j < nc.length; j++) {
            chars.push(nc[j]);
            starts.push(i);
            ends.push(i + 1);
          }
        }
        const hay = chars.join("");
        const ranges = [];
        let pos = 0;
        while (pos <= hay.length - qNorm.length) {
          const idx = hay.indexOf(qNorm, pos);
          if (idx === -1) break;
          let rEnd = ends[idx + qNorm.length - 1];
          while (rEnd < raw.length && normChar(raw[rEnd]) === "" && /[\u0300-\u036F\u064B-\u065F\u0670]/.test(raw[rEnd])) rEnd++;
          ranges.push([starts[idx], rEnd]);
          pos = idx + qNorm.length;
        }
        return ranges;
      }

      function renderSliceWithHighlights(raw, sliceStart, sliceEnd, ranges) {
        if (!ranges.length) return esc(raw.slice(sliceStart, sliceEnd));
        let out = "", cur = sliceStart;
        for (let i = 0; i < ranges.length; i++) {
          const rs = Math.max(sliceStart, ranges[i][0]);
          const re = Math.min(sliceEnd, ranges[i][1]);
          if (re <= rs) continue;
          if (rs > cur) out += esc(raw.slice(cur, rs));
          out += '<mark class="hl">' + esc(raw.slice(rs, re)) + "</mark>";
          cur = re;
        }
        if (cur < sliceEnd) out += esc(raw.slice(cur, sliceEnd));
        return out;
      }

      function fmt(s, isRtl, qNorm) {
        const raw = String(s ?? "");
        const ranges = qNorm ? findMatchRanges(raw, qNorm) : [];
        if (!isRtl) return renderSliceWithHighlights(raw, 0, raw.length, ranges);
        LTR_RE.lastIndex = 0;
        let out = "", last = 0, m;
        while ((m = LTR_RE.exec(raw)) !== null) {
          if (m.index > last) out += renderSliceWithHighlights(raw, last, m.index, ranges);
          const full = m[0];
          const core = full.replace(/(?:\s+[+\-–—·=→/]+|[.,:;–—\-·=→/\s]+)+$/, "");
          const coreEnd = m.index + core.length;
          const fullEnd = m.index + full.length;
          if (core) {
            const cls = core.length <= 13 ? ' class="nowrap-bdi"' : "";
            out += '<bdi dir="ltr"' + cls + ">" + renderSliceWithHighlights(raw, m.index, coreEnd, ranges) + "</bdi>";
            if (fullEnd > coreEnd) out += renderSliceWithHighlights(raw, coreEnd, fullEnd, ranges);
          } else {
            out += renderSliceWithHighlights(raw, m.index, fullEnd, ranges);
          }
          last = fullEnd;
        }
        if (last < raw.length) out += renderSliceWithHighlights(raw, last, raw.length, ranges);
        return out;
      }

      function b64ToBytes(b64) {
        const bin = atob(b64);
        const arr = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
        return arr;
      }

      async function unlock(rawPin) {
        const clean = String(rawPin || "").replace(/\s+/g, "");
        const keyMat = await crypto.subtle.importKey("raw", new TextEncoder().encode(clean), { name: "PBKDF2" }, false, ["deriveKey"]);
        const aesKey = await crypto.subtle.deriveKey(
          { name: "PBKDF2", salt: b64ToBytes(BUNDLE.salt), iterations: BUNDLE.iter, hash: "SHA-256" },
          keyMat, { name: "AES-GCM", length: 256 }, false, ["decrypt"]
        );
        const buf = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64ToBytes(BUNDLE.iv) }, aesKey, b64ToBytes(BUNDLE.ct));
        return JSON.parse(new TextDecoder().decode(buf));
      }

      function getSectionExpandableKeys(secs, secId) {

      function syncNavFade() {
        if (!navLinks) return;
        const maxSl = navLinks.scrollWidth - navLinks.clientWidth;
        navLinks.classList.remove("fade-left", "fade-right", "fade-both");
        if (maxSl <= 2) return;
        const r = navLinks.getBoundingClientRect();
        const first = navLinks.firstElementChild;
        const last = navLinks.lastElementChild;
        if (!first || !last) return;
        const fRect = first.getBoundingClientRect();
        const lRect = last.getBoundingClientRect();
        const minL = Math.min(fRect.left, lRect.left);
        const maxR = Math.max(fRect.right, lRect.right);
        const clipL = minL < r.left - 2;
        const clipR = maxR > r.right + 2;
        if (clipL && clipR) navLinks.classList.add("fade-both");
        else if (clipL) navLinks.classList.add("fade-left");
        else if (clipR) navLinks.classList.add("fade-right");
      }

      function scrollNavItemIntoView(btn) {
        if (!btn || !navLinks) return;
        if (getComputedStyle(stickyChrome).position === "static") return;
        if (navLinks.scrollWidth <= navLinks.clientWidth + 1) return;
        const cRect = navLinks.getBoundingClientRect();
        const bRect = btn.getBoundingClientRect();
        if (bRect.left >= cRect.left + 8 && bRect.right <= cRect.right - 8) return;
        const delta = (bRect.left - cRect.left) - (cRect.width - bRect.width) / 2;
        navLinks.scrollTo({ left: navLinks.scrollLeft + delta, behavior: "smooth" });
      }

      function stepSection(dir) {
        const vis = getVisibleNavIds();
        if (!vis.length) return;
        let idx = vis.indexOf(activeNav);
        if (idx === -1) idx = 0;
        const nextIdx = Math.max(0, Math.min(vis.length - 1, idx + dir));

          jumpToSection(vis[nextIdx]);

      function updateScrollUI() {
        if (!data || appShell.hidden) return;
        const sy = window.scrollY || 0;
        const maxScroll = Math.max(1, document.documentElement.scrollHeight - window.innerHeight);
        const pct = Math.max(0, Math.min(1, sy / maxScroll));
        const tf = "scaleX(" + pct.toFixed(4) + ")";
        readProgressFill.style.transform = tf;
        mobProgressFill.style.transform = tf;

        stickyChrome.classList.toggle("is-scrolled", sy > 10);
        floatTopBtn.classList.toggle("is-visible", sy > 360);
        mobTopBtn.disabled = sy <= 20;

        const railTop = marginRail.querySelector(".rail-top-btn");
        if (railTop) railTop.classList.toggle("is-dim", sy < 240);
        const railFill = marginRail.querySelector(".rail-progress-fill");
        if (railFill) railFill.style.transform = "scaleY(" + pct.toFixed(4) + ")";

        if (Date.now() < spyLockUntil) return;
        const vis = getVisibleNavIds();
        if (!vis.length) return;

        if (sy + window.innerHeight >= document.documentElement.scrollHeight - 28) {
          const lastId = vis[vis.length - 1];
          if (lastId !== activeNav) setActiveNav(lastId, true);
          return;
        }

        const offset = getStickyOffset() + 42;
        let bestId = vis[0];
        let bestTop = -Infinity;
        for (let i = 0; i < vis.length; i++) {
          const id = vis[i];
          const el = document.getElementById("sec-" + id);
          if (!el) continue;
          const top = el.getBoundingClientRect().top;
          if (top <= offset && top > bestTop) {
            bestTop = top;
            bestId = id;
          }
        }
        if (bestId !== activeNav) setActiveNav(bestId, true);
      }

      /* Search Match Stepper & Quick Filters */
      function refreshSearchMarks(preserveIdx) {
        const prevIdx = preserveIdx ? activeMarkIdx : -1;
        searchMarks = Array.from(briefMain.querySelectorAll("mark.hl")).filter((m) => {
          if (m.closest(".brief-root.is-brief .expandable:not(.is-open):not(.is-search-open) .detail-collapse")) return false;
          const rect = m.getBoundingClientRect();

          activeMarkIdx = prevIdx;

      function showQuickPop() {

        const ui = data[lang].ui || {};
        const chips = Array.isArray(ui.quickFilters) ? ui.quickFilters : [];
        if (!chips.length || searchInput.value.trim()) {
          setHidden(quickPop, true);
          return;
        }
        quickPop.innerHTML =
          '<div class="quick-pop-lbl">' + esc(ui.quickFilterTitle || "Quick filters") + "</div>"
          + '<div class="quick-chips">'
          + chips.map((c) => '<button class="quick-chip" type="button" data-qchip="' + esc(c) + '">' + esc(c) + "</button>").join("")
          + "</div>";
        setHidden(quickPop, false);
      }

      function hideQuickPop() { setHidden(quickPop, true); }

      function updateSearchChrome(matchTotal, qNorm, preserveMarkIdx) {
        const ui = data && data[lang] && data[lang].ui;
        const hasQ = Boolean(qNorm);
        setHidden(searchKbd, hasQ);
        setHidden(searchClear, !hasQ);
        setHidden(searchCount, !hasQ);
        if (hasQ && ui) {
          searchCount.textContent = matchTotal === 0
            ? ui.searchNoMatch
            : ui.searchMatches.replace("{n}", String(matchTotal));
          searchCount.classList.toggle("is-zero", matchTotal === 0);
          searchPrev.setAttribute("aria-label", ui.matchPrev || "Previous match");
          searchPrev.setAttribute("title", ui.matchPrev || "Previous match");
          searchNext.setAttribute("aria-label", ui.matchNext || "Next match");
          searchNext.setAttribute("title", ui.matchNext || "Next match");
        }
        refreshSearchMarks(Boolean(preserveMarkIdx));
      }

      /* Mobile Quick-Jump Sheet & Keyboard Shortcuts Modal */
      function syncOverlayBodyLock() {
        const open = !mobSheetWrap.hidden || !scModalWrap.hidden;
        document.body.classList.toggle("has-overlay", open);
      }

      function getFocusables(container) {
        return Array.from(container.querySelectorAll('button:not([disabled]), [href], input:not([disabled]), [tabindex]:not([tabindex="-1"])'))
          .filter((el) => el.offsetParent !== null);
      }

      function trapDialogFocus(e, container) {
        if (e.key !== "Tab") return;
        const focusables = getFocusables(container);
        if (!focusables.length) return;
        const first = focusables[0];
        const last = focusables[focusables.length - 1];
        if (e.shiftKey) {
          if (document.activeElement === first || !container.contains(document.activeElement)) {
            e.preventDefault();
            last.focus();
          }
        } else if (document.activeElement === last || !container.contains(document.activeElement)) {
          e.preventDefault();
          first.focus();
        }
      }

      function renderMobileSheetContent(restoreSel) {
        if (!data || !data[lang]) return;
        const d = data[lang];
        const ui = d.ui || {};
        const secs = d.sections || {};
        const isRtl = d.dir === "rtl";
        const isDark = root.getAttribute("data-theme") === "dark";
        const qTrim = searchQuery.trim();
        const allKeys = getAllExpandableKeys(secs);
        const allOpen = allKeys.length > 0 && allKeys.every((k) => expandedItems.has(k));

        const filterBannerHtml = qTrim
          ? '<div class="sheet-filter-bar">'
              + "<span>" + esc((ui.activeFilterLabel || "Active filter: {q}").replace("{q}", qTrim)) + "</span>"
              + '<button class="sheet-filter-clear" type="button" data-sheet-act="clear-search">' + esc(ui.searchClear || "Clear") + "</button>"
            + "</div>"
          : "";

        const itemsHtml = NAV_ORDER.filter((k) => secs[k]).map((k) => {
          const s = secs[k];
          const active = k === activeNav;
          const dot = NAV_DOTS[k] ? '<span class="nav-dot tone-' + NAV_DOTS[k] + '" aria-hidden="true"></span>' : "";
          return '<button class="sheet-item' + (active ? " is-active" : "") + '" type="button" data-sheet-sec="' + esc(k) + '">'
            + '<span class="sheet-item-l">'
              + '<span class="sheet-num"><bdi dir="ltr">' + esc(s.num) + "</bdi></span>"
              + '<span class="sheet-lbl">' + fmt(s.title, isRtl, "") + "</span>"
            + "</span>"
            + dot
            + "</button>";
        }).join("");

        mobSheet.innerHTML =
          '<div class="sheet-handle" aria-hidden="true"></div>'
          + '<div class="sheet-head">'
            + '<h2 id="sheetTitle" class="sheet-title">' + esc(ui.drawerTitle || "Quick Navigation") + "</h2>"
            + '<button class="ico-btn" type="button" data-close-sheet="1" aria-label="' + esc(ui.dismiss || "Close") + '"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg></button>'
          + "</div>"
          + filterBannerHtml
          + '<div class="sheet-list">' + itemsHtml + "</div>"
          + '<div class="sheet-quick-bar">'
            + '<div class="sheet-pill-row" dir="ltr">'
              + ["fr", "ar", "en"].map((lc) =>
                  '<button class="sheet-act-btn' + (lang === lc ? " is-active" : "") + '" type="button" data-sheet-loc="' + lc + '">' + (lc === "ar" ? "ع" : lc.toUpperCase()) + "</button>"
                ).join("")
            + "</div>"
            + '<div class="sheet-pill-row">'
              + '<button class="sheet-act-btn" type="button" data-sheet-act="search">' + esc(ui.drawerSearch || "Search") + "</button>"
              + '<button class="sheet-act-btn' + (density === "brief" ? " is-active" : "") + '" type="button" data-sheet-act="density">' + esc(density === "brief" ? ui.densityBrief : ui.densityFull) + "</button>"
              + (density === "brief" && !qTrim
                ? '<button class="sheet-act-btn" type="button" data-sheet-act="expand-all">' + esc(allOpen ? (ui.collapseAll || "Collapse all") : (ui.expandAll || "Expand all")) + "</button>"
                : "")
              + '<button class="sheet-act-btn" type="button" data-sheet-act="theme">' + esc(isDark ? ui.themeLight : ui.themeDark) + "</button>"
              + '<button class="sheet-act-btn" type="button" data-sheet-act="print">' + esc(ui.printBtn || "Print") + "</button>"
            + "</div>"
          + "</div>";

        if (restoreSel) {
          const target = mobSheet.querySelector(restoreSel);
          if (target) target.focus({ preventScroll: true });
        }
      }

      function openMobileSheet() {
        if (!data || !data[lang]) return;
        const wasHidden = mobSheetWrap.hidden;
        if (wasHidden) lastFocusBeforeOverlay = document.activeElement;
        renderMobileSheetContent();
        if (wasHidden) {
          mobSheet.classList.remove("is-entering");
          void mobSheet.offsetWidth;
          mobSheet.classList.add("is-entering");
          setHidden(mobSheetWrap, false);
          mobSheetOpenBtn.setAttribute("aria-expanded", "true");
          syncOverlayBodyLock();
          const closeBtn = mobSheet.querySelector("[data-close-sheet]");
          if (closeBtn) closeBtn.focus({ preventScroll: true });
        }
      }

      function closeMobileSheet(restoreFocus) {
        if (mobSheetWrap.hidden) return;
        setHidden(mobSheetWrap, true);
        mobSheetOpenBtn.setAttribute("aria-expanded", "false");
        mobSheet.classList.remove("is-entering");
        syncOverlayBodyLock();
        if (restoreFocus && lastFocusBeforeOverlay && typeof lastFocusBeforeOverlay.focus === "function") {
          try { lastFocusBeforeOverlay.focus({ preventScroll: true }); } catch {}
        }
        lastFocusBeforeOverlay = null;
      }

      function openShortcutsModal() {
        if (!data || !data[lang]) return;
        if (scModalWrap.hidden) lastFocusBeforeOverlay = document.activeElement;
        const ui = data[lang].ui || {};
        const rows = [
          [ui.scJump || "Jump to sections", ["1", "…", "6"]],
          [ui.scPrevNext || "Previous / Next section", ["[", "]"]],
          [ui.scSearch || "Live search", ["/", "⌘K"]],
          [ui.scMatchStep || "Next / Prev match", ["Enter", "⇧Enter"]],
          [ui.scDensity || "Brief / Full view", ["B"]],
          [ui.scExpandAll || "Expand / collapse all details", ["E"]],
          [ui.scTheme || "Light / Dark theme", ["D"]],
          [ui.scTop || "Scroll to top", ["T"]],
          [ui.scClose || "Close / clear", ["Esc"]]
        ];
        scModal.innerHTML =
          '<div class="sc-head">'

            + '<button class="ico-btn" type="button" data-close-sc="1" aria-label="' + esc(ui.dismiss || "Close") + '"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg></button>'

        syncOverlayBodyLock();
        const closeBtn = scModal.querySelector("[data-close-sc]");

      }

      function closeShortcutsModal(restoreFocus) {
        if (scModalWrap.hidden) return;
        setHidden(scModalWrap, true);
        syncOverlayBodyLock();
        if (restoreFocus && lastFocusBeforeOverlay && typeof lastFocusBeforeOverlay.focus === "function") {
          try { lastFocusBeforeOverlay.focus({ preventScroll: true }); } catch {}
        }

      /* Interactive Tooltip Engine (Lab Gauges & Biomarkers) */
      function showTooltip(title, body, clientX, clientY) {
        if (!title && !body) return;
        const isRtlTip = root.dir === "rtl";
        vizTooltip.innerHTML =
          (title ? '<div class="viz-tip-title">' + fmt(title, isRtlTip, "") + "</div>" : "")
          + (body ? '<div class="viz-tip-body">' + fmt(body, isRtlTip, "") + "</div>" : "");
        vizTooltip.classList.add("is-visible");
        vizTooltip.setAttribute("aria-hidden", "false");
        const tw = vizTooltip.offsetWidth || 200;
        const th = vizTooltip.offsetHeight || 46;
        const pad = 12;
        let x = clientX - tw / 2;
        if (x < pad) x = pad;
        if (x + tw > window.innerWidth - pad) x = window.innerWidth - tw - pad;
        let y = clientY - th - 14;
        if (y < pad) y = clientY + 18;
        vizTooltip.style.transform = "translate3d(" + Math.round(x) + "px," + Math.round(y) + "px,0)";
      }

      function hideTooltip() {
        vizTooltip.classList.remove("is-visible");
        vizTooltip.setAttribute("aria-hidden", "true");
      }

      /* =======================================================================
         LAB BIOMARKER GAUGES
         ======================================================================= */
      function renderSpotlightGauge(lb, refLbl) {
        const W = 860, H = 34;
        const padL = 14, padR = 14, trackW = W - padL - padR;
        const span = Math.max(0.1, lb.max - lb.min);
        const mapX = (v) => padL + Math.max(0, Math.min(1, (v - lb.min) / span)) * trackW;

        const zL = mapX(lb.rLow);
        const zR = mapX(lb.rHigh);
        const cX = mapX(lb.curr);
        const trackY = 9, trackH = 7;

        const tipT = esc(lb.label + " (" + lb.date + ")");
        const tipB = esc(lb.currStr + " " + lb.unit + " · " + (refLbl || "Ref") + " " + lb.ref + (lb.note ? " — " + lb.note : ""));

        return '<svg class="viz-svg spot-svg" viewBox="0 0 ' + W + " " + H + '" dir="ltr" direction="ltr" role="img" aria-label="' + tipT + ": " + tipB + '">'
          + '<rect x="' + padL + '" y="' + trackY + '" width="' + trackW + '" height="' + trackH + '" rx="3.5" fill="var(--track-bg)"></rect>'
          + '<rect x="' + padL + '" y="' + trackY + '" width="' + Math.max(0, zL - padL).toFixed(1) + '" height="' + trackH + '" rx="3.5" fill="var(--caution-bg)"></rect>'
          + '<rect x="' + zL.toFixed(1) + '" y="' + trackY + '" width="' + Math.max(4, zR - zL).toFixed(1) + '" height="' + trackH + '" rx="2" fill="var(--zone-bg)"></rect>'
          + '<line x1="' + zL.toFixed(1) + '" y1="' + (trackY - 3) + '" x2="' + zL.toFixed(1) + '" y2="' + (trackY + trackH + 3.5) + '" stroke="var(--zone-edge)" stroke-width="1.6"></line>'
          + '<line x1="' + zR.toFixed(1) + '" y1="' + (trackY - 3) + '" x2="' + zR.toFixed(1) + '" y2="' + (trackY + trackH + 3.5) + '" stroke="var(--zone-edge)" stroke-width="1.6"></line>'
          + '<text x="' + zL.toFixed(1) + '" y="' + (trackY + trackH + 14.5) + '" text-anchor="middle" direction="ltr" fill="var(--text-3)" font-size="11" font-weight="600" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">' + esc(lb.rLow.toFixed(1)) + "</text>"
          + '<text x="' + zR.toFixed(1) + '" y="' + (trackY + trackH + 14.5) + '" text-anchor="middle" direction="ltr" fill="var(--text-3)" font-size="11" font-weight="600" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">' + esc(lb.rHigh.toFixed(1)) + "</text>"
          + '<g class="svg-hit" tabindex="0" data-tip-title="' + tipT + '" data-tip-body="' + tipB + '">'
            + '<circle cx="' + cX.toFixed(1) + '" cy="' + (trackY + trackH / 2) + '" r="10.5" fill="var(--amber-soft)"></circle>'
            + '<circle cx="' + cX.toFixed(1) + '" cy="' + (trackY + trackH / 2) + '" r="5.2" fill="var(--amber)" stroke="var(--surface)" stroke-width="2"></circle>'
            + '<circle cx="' + cX.toFixed(1) + '" cy="' + (trackY + trackH / 2) + '" r="16" fill="transparent"></circle>'
          + "</g>"
          + "</svg>";
      }

      function renderMiniBar(lb, qNorm) {
        const span = Math.max(0.01, lb.max - lb.min);
        const clamp = (v) => Math.max(2, Math.min(98, ((v - lb.min) / span) * 100));
        const zL = Math.max(0, Math.min(100, ((lb.rLow - lb.min) / span) * 100));
        const zR = Math.max(0, Math.min(100, ((lb.rHigh - lb.min) / span) * 100));
        const cP = clamp(lb.curr);
        let prevHtml = "";
        if (typeof lb.prev === "number") {
          const pP = clamp(lb.prev);
          const dL = Math.min(pP, cP);
          const dW = Math.abs(cP - pP);
          prevHtml = '<span class="mini-delta" style="left:' + dL.toFixed(1) + "%;width:" + dW.toFixed(1) + '%"></span>'
            + '<span class="mini-dot-prev" style="left:' + pP.toFixed(1) + '%"></span>';
        }
        return '<div class="mini-viz" dir="ltr">'
          + '<div class="mini-track" aria-hidden="true">'
            + '<span class="mini-zone" style="left:' + zL.toFixed(1) + "%;width:" + Math.max(3, zR - zL).toFixed(1) + '%"></span>'
            + prevHtml
            + '<span class="mini-dot-curr" style="left:' + cP.toFixed(1) + '%"></span>'
          + "</div>"
          + (lb.ref ? '<span class="mini-ref">' + fmt(lb.ref, false, qNorm) + "</span>" : "")
          + "</div>";
      }

      /* =======================================================================
         CHROME & AMBIENT MARGIN RAIL RENDERING
         ======================================================================= */
      function renderChrome(instantPill) {
        if (!data || !data[lang]) return;
        const d = data[lang];
        const ui = d.ui || {};
        const secs = d.sections || {};
        const isRtl = d.dir === "rtl";

        root.lang = d.lang;
        root.dir = d.dir;
        document.title = d.docTitle;

        printBtn.setAttribute("aria-label", ui.printBtn || "Print");

        lockBtn.setAttribute("aria-label", ui.lockBtn || "Lock");

        scBtn.setAttribute("aria-label", ui.shortcutsBtn || "Shortcuts");
        scBtn.setAttribute("title", ui.shortcutsBtn || "Shortcuts");
        floatTopBtn.setAttribute("aria-label", ui.topBtn || "Back to top");
        floatTopBtn.setAttribute("title", ui.topBtn || "Back to top");

        btnBrief.textContent = ui.densityBrief || "Brief";
        btnFull.textContent = ui.densityFull || "Full";

        searchInput.placeholder = ui.searchPlaceholder || "";
        searchInput.setAttribute("aria-label", ui.searchPlaceholder || "Search");
        searchClear.setAttribute("aria-label", ui.searchClear || "Clear");
        searchClear.setAttribute("title", ui.searchClear || "Clear");

        langBtns.forEach((btn) => {
          const active = btn.dataset.loc === lang;
          btn.classList.toggle("is-active", active);
          btn.setAttribute("aria-pressed", active ? "true" : "false");
        });
        densBtns.forEach((btn) => {
          const active = btn.dataset.dens === density;
          btn.classList.toggle("is-active", active);
          btn.setAttribute("aria-pressed", active ? "true" : "false");
        });

        const navMap = ui.nav || {};
        navLinks.innerHTML = NAV_ORDER.filter((k) => navMap[k]).map((k) => {
          const active = k === activeNav;
          const num = (secs[k] && secs[k].num) || "";
          const dot = NAV_DOTS[k] ? '<span class="nav-dot tone-' + NAV_DOTS[k] + '" aria-hidden="true"></span>' : "";
          return '<button class="nav-link' + (active ? " is-active" : "") + '" type="button" data-target="' + esc(k) + '"' + (active ? ' aria-current="location"' : "") + ">"
            + (num ? '<span class="nav-num"><bdi dir="ltr">' + esc(num) + "</bdi></span>" : "")
            + "<span>" + fmt(navMap[k], isRtl, "") + "</span>" + dot + "</button>";
        }).join("");

        const allKeys = getAllExpandableKeys(secs);
        const allOpen = allKeys.length > 0 && allKeys.every((k) => expandedItems.has(k));
        const railExpandHtml = density === "brief"
          ? '<button id="railExpandBtn" class="rail-tool-btn is-accent" type="button" data-rail-act="' + (allOpen ? "collapse-all" : "expand-all") + '">'
              + esc(allOpen ? (ui.collapseAll || "Collapse all") : (ui.expandAll || "Expand all"))
            + "</button>"
          : "";

        marginRail.innerHTML =
          '<div class="rail-kicker-row">'
            + '<span class="rail-kicker">' + esc(ui.chaptersLabel || "Contents") + "</span>"
          + "</div>"
          + '<div class="rail-list">'
            + '<span class="rail-progress-track" aria-hidden="true"><span class="rail-progress-fill"></span></span>'
            + NAV_ORDER.filter((k) => navMap[k]).map((k) => {
                const active = k === activeNav;
                const num = (secs[k] && secs[k].num) || "";
                const dot = NAV_DOTS[k] ? '<span class="nav-dot tone-' + NAV_DOTS[k] + '" aria-hidden="true"></span>' : "";
                return '<button class="rail-item' + (active ? " is-active" : "") + '" type="button" data-target="' + esc(k) + '"' + (active ? ' aria-current="location"' : "") + ">"
                  + '<span class="rail-num"><bdi dir="ltr">' + esc(num) + "</bdi></span>"
                  + '<span class="rail-lbl">' + fmt(navMap[k], isRtl, "") + "</span>"
                  + dot
                  + "</button>";
              }).join("")
          + "</div>"
          + '<div class="rail-tools">'
            + railExpandHtml
            + '<button class="rail-tool-btn rail-top-btn' + ((window.scrollY || 0) < 240 ? " is-dim" : "") + '" type="button" data-rail-act="top" title="' + esc(ui.topBtn || "Top") + '">' + ICO_UP + "<span>" + esc(ui.topBtn || "Top") + "</span></button>"
            + '<button class="rail-tool-btn" type="button" data-rail-act="shortcuts" aria-label="' + esc(ui.shortcutsBtn || "Shortcuts") + '" title="' + esc(ui.shortcutsBtn || "Shortcuts") + '">' + ICO_KBD + "</button>"
          + "</div>";

        syncThemeControl();
        syncMobileDock();
        syncAllPills(Boolean(instantPill));
        requestAnimationFrame(syncNavFade);
      }

      /* =======================================================================
         PROGRESSIVE-DISCLOSURE RENDER HELPERS
         ======================================================================= */
      function renderExpandBtn(key, expandedNow, ui, hideForSearch) {
        if (density !== "brief" || hideForSearch) return "";
        const fullLbl = expandedNow ? (ui.collapseDetail || "Hide detail") : (ui.expandDetail || "Show detail");
        const shortLbl = expandedNow ? (ui.collapseShort || "Hide") : (ui.expandShort || "Details");
        return '<button class="item-expand" type="button" data-item-key="' + esc(key) + '" aria-expanded="' + (expandedNow ? "true" : "false") + '" aria-label="' + esc(fullLbl) + '" title="' + esc(fullLbl) + '"><span>' + esc(shortLbl) + "</span>" + ICO_CHEV + "</button>";
      }

      function renderTags(tags, isRtl, qNorm) {
        if (!Array.isArray(tags) || !tags.length) return "";
        return '<div class="item-tags">'
          + tags.map((t) => '<span class="item-tag">' + fmt(t, isRtl, qNorm) + "</span>").join("")
          + "</div>";
      }

      function renderDetailBlock(item, isRtl, qNorm) {
        if (!hasItemDetail(item)) return "";
        const colonSep = lang === "fr" ? "\u00A0: " : ": ";
        let inner = "";
        if (Array.isArray(item.detailPoints) && item.detailPoints.length) {
          inner = '<ul class="detail-points">'
            + item.detailPoints.map((pt) =>
                '<li class="detail-point">'
                + (pt.label ? '<strong class="dp-lbl">' + fmt(pt.label, isRtl, qNorm) + colonSep + "</strong>" : "")
                + fmt(pt.text, isRtl, qNorm)
                + "</li>"
              ).join("")
            + "</ul>";
        } else if (item.detail) {
          inner = '<p class="goal-detail">' + fmt(item.detail, isRtl, qNorm) + "</p>";
        }
        return '<div class="detail-collapse"><div class="detail-inner"><div class="detail-body">' + inner + "</div></div></div>";
      }

      function renderSecExpandBtn(secId, secs, ui, hasQ) {
        if (density !== "brief" || hasQ) return "";
        const keys = getSectionExpandableKeys(secs, secId);
        if (!keys.length) return "";
        const allOpen = keys.every((k) => expandedItems.has(k));
        const lbl = allOpen ? (ui.secCollapse || "Collapse") : (ui.secExpand || "Expand ({n})").replace("{n}", String(keys.length));
        return '<button class="sec-expand-btn' + (allOpen ? " is-all-open" : "") + '" type="button" data-sec-expand="' + esc(secId) + '" aria-expanded="' + (allOpen ? "true" : "false") + '">' + esc(lbl) + "</button>";
      }

      function renderSecHead(sec, id, secs, ui, isRtl, qNorm, extraBadgeHtml, hasQ) {
        return '<div class="sec-head">'
          + '<span class="sec-num"><bdi dir="ltr">' + esc(sec.num) + "</bdi></span>"
          + '<h2 class="sec-title">' + fmt(sec.title, isRtl, qNorm) + "</h2>"
          + '<span class="sec-rule" aria-hidden="true"></span>'
          + (extraBadgeHtml || "")
          + renderSecExpandBtn(id, secs, ui, hasQ)
          + (id !== "priorities"
            ? '<button class="sec-top-mini" type="button" data-scroll-top="1" aria-label="' + esc(ui.topBtn || "Top") + '" title="' + esc(ui.topBtn || "Top") + '">' + ICO_UP + "</button>"
            : "")
          + "</div>";
