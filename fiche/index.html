<!DOCTYPE html>
<html lang="fr" dir="ltr" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet" />
  <meta name="referrer" content="no-referrer" />
  <meta name="theme-color" content="#FAF9F6" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230F766E'/%3E%3Cpath d='M16 9v14M9 16h14' stroke='%23FAF9F6' stroke-width='2.6' stroke-linecap='round'/%3E%3C/svg%3E" />
  <title>Fiche Clinique · ملف طبي · Clinical Brief</title>
  <style>
    :root {
      color-scheme: light;
      --font-sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      --font-display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      --font-ar: "SF Arabic", "Geeza Pro", "Segoe UI", Tahoma, "Noto Sans Arabic", system-ui, -apple-system, sans-serif;
      --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
      --ease: cubic-bezier(0.22, 1, 0.36, 1);

      /* Editorial Clinical Brief — Warm Alabaster Paper */
      --bg: #FAF9F6;
      --bg-dot: rgba(15, 23, 42, 0.045);
      --surface: #FFFFFF;
      --surface-2: #F3F1EB;
      --surface-3: #ECE9E0;
      --surface-hover: #E7E4DA;
      --chrome: rgba(250, 249, 246, 0.88);
      --glass-bg: rgba(255, 255, 255, 0.88);
      --glass-border: rgba(15, 23, 42, 0.11);
      --backdrop: rgba(15, 23, 42, 0.34);

      --border: rgba(15, 23, 42, 0.085);
      --border-subtle: rgba(15, 23, 42, 0.055);
      --border-strong: rgba(15, 23, 42, 0.16);
      --gridline: rgba(15, 23, 42, 0.07);

      --text: #0F172A;
      --text-2: #334155;
      --text-3: #64748B;

      /* Calm Clinical Teal */
      --teal: #0F766E;
      --teal-btn: #0F766E;
      --teal-btn-hover: #115E59;
      --teal-text: #0D5E58;
      --teal-soft: rgba(15, 118, 110, 0.08);
      --teal-wash: rgba(15, 118, 110, 0.045);
      --teal-band: rgba(15, 118, 110, 0.09);
      --teal-border: rgba(15, 118, 110, 0.24);

      /* Terracotta Coral (Clinical Flags / Fatigue Decay) */
      --coral: #C2410C;
      --coral-text: #9A3412;
      --coral-soft: rgba(194, 65, 12, 0.08);
      --coral-wash: rgba(194, 65, 12, 0.045);
      --coral-border: rgba(194, 65, 12, 0.24);

      /* Refined Clinical Amber (Watch / Swap / Load) */
      --amber: #B45309;
      --amber-text: #92400E;
      --amber-soft: rgba(180, 83, 9, 0.08);
      --amber-border: rgba(180, 83, 9, 0.25);

      /* Clinical Slate & Info */
      --info: #1D4ED8;
      --info-text: #1E40AF;
      --info-soft: rgba(29, 78, 216, 0.07);
      --info-border: rgba(29, 78, 216, 0.20);
      --slate-viz: #64748B;
      --slate-viz-soft: rgba(100, 116, 139, 0.18);

      /* High-Contrast Stacked Bar Fills (WCAG AA+ on #FFFFFF in Light & Dark) */
      --bar-hit: #0F766E;
      --bar-swap: #B45309;
      --bar-stale: #C2410C;
      --bar-guess: #526175;
      --bar-text: #FFFFFF;

      /* Sleep Ribbon Palette */
      --sleep-bg: #DCE6F2;
      --sleep-stripe: rgba(30, 64, 115, 0.12);
      --sleep-text: #1E3A5F;
      --trough-bg: #EFECE4;
      --trough-wave: rgba(180, 83, 9, 0.28);
      --trough-text: #57534E;
      --alert-bg: #0F766E;
      --alert-text: #FFFFFF;
      --night-bg: #F5E1C8;
      --night-text: #854D0E;

      /* Lab Range Bar Tokens */
      --track-bg: #E8E5DC;
      --zone-bg: rgba(15, 118, 110, 0.16);
      --zone-edge: rgba(15, 118, 110, 0.42);
      --caution-bg: rgba(180, 83, 9, 0.12);

      /* Search Highlight */
      --hl-bg: #FEF08A;
      --hl-text: #0F172A;
      --hl-curr-bg: #F59E0B;
      --hl-curr-text: #FFFFFF;

      --err: #B91C1C;
      --err-soft: rgba(185, 28, 28, 0.08);
      --shadow-fig: 0 1px 2px rgba(15, 23, 42, 0.03), 0 10px 26px -14px rgba(15, 23, 42, 0.08);
      --shadow-card: 0 1px 2px rgba(15, 23, 42, 0.03), 0 6px 18px -12px rgba(15, 23, 42, 0.08);
      --shadow-gate: 0 24px 56px -18px rgba(15, 23, 42, 0.14), 0 1px 4px rgba(15, 23, 42, 0.06);
      --shadow-tip: 0 12px 30px -8px rgba(15, 23, 42, 0.20), 0 2px 6px rgba(15, 23, 42, 0.06);
      --shadow-dock: 0 12px 34px -8px rgba(15, 23, 42, 0.20), 0 2px 8px rgba(15, 23, 42, 0.08);
      --r-lg: 14px;
      --r-md: 10px;
      --r-sm: 7px;
      --r-xs: 5px;
    }

    html[data-theme="dark"] {
      color-scheme: dark;
      --bg: #0B0F17;
      --bg-dot: rgba(248, 250, 252, 0.045);
      --surface: #111722;
      --surface-2: #171F2E;
      --surface-3: #1E283A;
      --surface-hover: #243045;
      --chrome: rgba(11, 15, 23, 0.86);
      --glass-bg: rgba(17, 23, 34, 0.90);
      --glass-border: rgba(248, 250, 252, 0.13);
      --backdrop: rgba(2, 6, 23, 0.62);

      --border: rgba(248, 250, 252, 0.085);
      --border-subtle: rgba(248, 250, 252, 0.055);
      --border-strong: rgba(248, 250, 252, 0.18);
      --gridline: rgba(248, 250, 252, 0.075);

      --text: #F8FAFC;
      --text-2: #CBD5E1;
      --text-3: #94A3B8;

      --teal: #2DD4BF;
      --teal-btn: #0D9488;
      --teal-btn-hover: #0F766E;
      --teal-text: #5EEAD4;
      --teal-soft: rgba(45, 212, 191, 0.11);
      --teal-wash: rgba(45, 212, 191, 0.055);
      --teal-band: rgba(45, 212, 191, 0.10);
      --teal-border: rgba(45, 212, 191, 0.28);

      --coral: #FB7185;
      --coral-text: #FDA4AF;
      --coral-soft: rgba(251, 113, 133, 0.11);
      --coral-wash: rgba(251, 113, 133, 0.06);
      --coral-border: rgba(251, 113, 133, 0.28);

      --amber: #FBBF24;
      --amber-text: #FCD34D;
      --amber-soft: rgba(251, 191, 36, 0.11);
      --amber-border: rgba(251, 191, 36, 0.28);

      --info: #60A5FA;
      --info-text: #93C5FD;
      --info-soft: rgba(96, 165, 250, 0.11);
      --info-border: rgba(96, 165, 250, 0.26);
      --slate-viz: #94A3B8;
      --slate-viz-soft: rgba(148, 163, 184, 0.22);

      /* Saturated Dark-Mode Stacked Bar Fills with crisp white legibility */
      --bar-hit: #0D9488;
      --bar-swap: #B45309;
      --bar-stale: #BE123C;
      --bar-guess: #475569;
      --bar-text: #FFFFFF;

      --sleep-bg: rgba(56, 114, 168, 0.28);
      --sleep-stripe: rgba(125, 185, 238, 0.16);
      --sleep-text: #BFDBFE;
      --trough-bg: #182131;
      --trough-wave: rgba(251, 191, 36, 0.34);
      --trough-text: #94A3B8;
      --alert-bg: #0D9488;
      --alert-text: #FFFFFF;
      --night-bg: rgba(251, 191, 36, 0.20);
      --night-text: #FDE68A;

      --track-bg: #202B3D;
      --zone-bg: rgba(45, 212, 191, 0.18);
      --zone-edge: rgba(45, 212, 191, 0.45);
      --caution-bg: rgba(251, 191, 36, 0.14);

      --hl-bg: rgba(250, 204, 21, 0.28);
      --hl-text: #FEF9C3;
      --hl-curr-bg: #F59E0B;
      --hl-curr-text: #0B0F17;

      --err: #F87171;
      --err-soft: rgba(248, 113, 113, 0.12);
      --shadow-fig: 0 1px 2px rgba(0, 0, 0, 0.35), 0 12px 32px -12px rgba(0, 0, 0, 0.55);
      --shadow-card: 0 1px 2px rgba(0, 0, 0, 0.30), 0 8px 22px -12px rgba(0, 0, 0, 0.48);
      --shadow-gate: 0 28px 60px -14px rgba(0, 0, 0, 0.72);
      --shadow-tip: 0 12px 30px -6px rgba(0, 0, 0, 0.68);
      --shadow-dock: 0 14px 36px -6px rgba(0, 0, 0, 0.70);
    }

    *, *::before, *::after { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html { -webkit-text-size-adjust: 100%; overflow-x: clip; scroll-behavior: smooth; }
    body {
      margin: 0;
      min-height: 100vh;
      overflow-x: clip;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
      font-size: 15px;
      line-height: 1.62;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      transition: background-color 220ms var(--ease), color 220ms var(--ease);
    }
    html[dir="rtl"] body {
      font-family: var(--font-ar);
      line-height: 1.74;
    }
    body.has-overlay { overflow: hidden; }
    button, input { font: inherit; color: inherit; }
    button:focus-visible, input:focus-visible, a:focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }
    .nowrap-bdi { white-space: nowrap; }

    mark.hl {
      background: var(--hl-bg);
      color: var(--hl-text);
      border-radius: 3px;
      padding: 0 2px;
      font-weight: 600;
      transition: background-color 140ms ease, color 140ms ease, box-shadow 140ms ease;
    }
    mark.hl.is-current {
      background: var(--hl-curr-bg);
      color: var(--hl-curr-text);
      box-shadow: 0 0 0 2.5px var(--amber-soft), 0 0 0 1px var(--amber);
    }
    html[dir="rtl"] mark.hl { padding: 0 1px; border-radius: 2px; }

    /* =========================================================================
       ELEVATED PIN GATE
       ========================================================================= */
    .gate-wrap {
      position: relative;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px 16px;
      background:
        radial-gradient(circle at 50% 0%, var(--teal-soft) 0%, transparent 50%),
        radial-gradient(var(--bg-dot) 1px, transparent 1px),
        var(--bg);
      background-size: 100% 100%, 22px 22px, 100% 100%;
    }
    .gate-theme-btn {
      position: fixed;
      top: 16px;
      inset-inline-end: 16px;
      z-index: 10;
    }
    .gate-card {
      position: relative;
      width: 100%;
      max-width: 404px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-top: 3px solid var(--teal);
      border-radius: 16px;
      box-shadow: var(--shadow-gate);
      padding: 36px 30px 28px;
      text-align: center;
      transition: background-color 220ms var(--ease), border-color 220ms var(--ease), box-shadow 220ms var(--ease);
    }
    .gate-card.shake { animation: shake 0.36s ease; }
    .gate-mark {
      position: relative;
      width: 52px;
      height: 52px;
      margin: 0 auto 18px;
      border-radius: 14px;
      background: linear-gradient(145deg, var(--teal-soft), var(--surface-2));
      border: 1px solid var(--teal-border);
      color: var(--teal-text);
      display: grid;
      place-items: center;
      box-shadow: 0 4px 14px -6px var(--teal-border);
    }
    .gate-title { margin: 0 0 6px; font-family: var(--font-display); font-size: 1.04rem; font-weight: 700; color: var(--text); letter-spacing: -0.015em; }
    .gate-sub { margin: 0 0 22px; font-size: 0.8rem; color: var(--text-3); }
    .pin-wrap { position: relative; margin-bottom: 12px; }
    .pin-input {
      width: 100%;
      height: 46px;
      padding: 0 44px;
      border-radius: 9px;
      border: 1px solid var(--border-strong);
      background: var(--bg);
      font-family: var(--font-mono);
      font-size: 1.08rem;
      letter-spacing: 0.24em;
      text-align: center;
      outline: none;
      transition: border-color 180ms var(--ease), box-shadow 180ms var(--ease), background-color 220ms var(--ease);
    }
    .pin-input:focus { border-color: var(--teal); box-shadow: 0 0 0 3.5px var(--teal-soft); }
    .pin-eye {
      position: absolute;
      top: 50%;
      inset-inline-end: 8px;
      transform: translateY(-50%);
      width: 32px;
      height: 32px;
      border: 0;
      border-radius: 7px;
      background: transparent;
      color: var(--text-3);
      display: grid;
      place-items: center;
      cursor: pointer;
      transition: background-color 160ms var(--ease), color 160ms var(--ease);
    }
    .pin-eye:hover { background: var(--surface-2); color: var(--text); }
    .gate-btn {
      width: 100%;
      height: 45px;
      border: 0;
      border-radius: 9px;
      background: var(--teal-btn);
      color: #FFFFFF;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 14px -6px rgba(15, 118, 110, 0.55);
      transition: background-color 180ms var(--ease), opacity 180ms var(--ease), transform 140ms var(--ease), box-shadow 180ms var(--ease);
    }
    .gate-btn:hover { background: var(--teal-btn-hover); box-shadow: 0 6px 18px -6px rgba(15, 118, 110, 0.65); }
    .gate-btn:active { transform: scale(0.99); }
    .gate-btn:disabled { opacity: 0.72; cursor: wait; }
    .gate-spin {
      width: 15px;
      height: 15px;
      border-radius: 999px;
      border: 2px solid rgba(255, 255, 255, 0.35);
      border-top-color: #FFFFFF;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .gate-err {
      min-height: 1.3rem;
      margin-top: 11px;
      font-size: 0.79rem;
      font-weight: 600;
      color: var(--err);
    }
    .gate-err:not(:empty) {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 999px;
      background: var(--err-soft);
    }
    .gate-foot {
      margin-top: 18px;
      padding-top: 14px;
      border-top: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-family: var(--font-mono);
      font-size: 0.67rem;
      font-weight: 600;
      letter-spacing: 0.03em;
      color: var(--text-3);
    }
    .gate-dot {
      width: 6px;
      height: 6px;
      border-radius: 999px;
      background: var(--teal);
      opacity: 0.85;
    }
    @keyframes shake { 0%, 100% { transform: translateX(0); } 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }

    /* =========================================================================
       READING PROGRESS HAIRLINE (HEADER BOTTOM ON DESKTOP, FIXED TOP ON MOBILE)
       ========================================================================= */
    .read-progress {
      position: absolute;
      left: 0;
      right: 0;
      bottom: -1px;
      height: 2.5px;
      background: transparent;
      overflow: hidden;
      pointer-events: none;
    }
    .read-progress-fill {
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, var(--teal), var(--teal-text));
      transform: scaleX(0);
      transform-origin: left center;
      will-change: transform;
      transition: transform 80ms linear;
    }
    html[dir="rtl"] .read-progress-fill {
      transform-origin: right center;
      background: linear-gradient(270deg, var(--teal), var(--teal-text));
    }
    .mobile-top-progress {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 2.5px;
      z-index: 60;
      pointer-events: none;
      background: transparent;
    }

    /* =========================================================================
       SLEEK 1-ROW STICKY GLASS HEADER (STRICTLY 1 ROW ON DESKTOP >= 1024px)
       ========================================================================= */
    .sticky-chrome {
      position: sticky;
      top: 0;
      z-index: 40;
      background: var(--chrome);
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(18px) saturate(165%);
      -webkit-backdrop-filter: blur(18px) saturate(165%);
      transition: background-color 220ms var(--ease), border-color 220ms var(--ease), box-shadow 220ms var(--ease);
    }
    .sticky-chrome.is-scrolled {
      box-shadow: 0 4px 18px -12px rgba(15, 23, 42, 0.16);
    }
    .chrome-inner {
      max-width: 1280px;
      margin: 0 auto;
      padding: 0 20px;
      min-height: 54px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .nav-links {
      display: flex;
      align-items: center;
      gap: 2px;
      min-width: 0;
      flex: 1 1 auto;
      overflow-x: auto;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }
    .nav-links::-webkit-scrollbar { display: none; }
    .nav-link {
      border: 1px solid transparent;
      background: transparent;
      color: var(--text-3);
      padding: 5px 7px;
      border-radius: 7px;
      font-size: 0.77rem;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: background-color 160ms var(--ease), color 160ms var(--ease), border-color 160ms var(--ease);
    }
    .nav-num {
      font-family: var(--font-mono);
      font-size: 0.65rem;
      font-weight: 700;
      opacity: 0.58;
      font-variant-numeric: tabular-nums;
      transition: opacity 160ms ease, color 160ms ease;
    }
    .nav-link:hover { background: var(--surface-2); color: var(--text); }
    .nav-link:hover .nav-num { opacity: 0.9; }
    .nav-link.is-active {
      background: var(--teal-soft);
      border-color: var(--teal-border);
      color: var(--teal-text);
    }
    .nav-link.is-active .nav-num { opacity: 1; color: var(--teal); }

    .chrome-controls {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    /* Compact Inline Live Search + Quick Filter Popover + Match Stepper */
    .search-shell {
      position: relative;
      flex: 0 1 204px;
      width: 204px;
    }
    .search-box {
      display: flex;
      align-items: center;
      width: 100%;
      height: 31px;
      padding: 0 6px 0 8px;
      gap: 4px;
      border-radius: 8px;
      background: var(--surface);
      border: 1px solid var(--border);
      transition: border-color 160ms var(--ease), box-shadow 160ms var(--ease), background-color 220ms var(--ease);
    }
    html[dir="rtl"] .search-box { padding: 0 8px 0 6px; }
    .search-box:focus-within {
      border-color: var(--teal);
      box-shadow: 0 0 0 2.5px var(--teal-soft);
    }
    .search-ico { color: var(--text-3); display: inline-flex; flex-shrink: 0; }
    .search-input {
      border: 0;
      background: transparent;
      outline: none;
      width: 100%;
      min-width: 0;
      font-size: 0.76rem;
      color: var(--text);
      padding: 0;
    }
    .search-input:focus, .search-input:focus-visible { outline: none; box-shadow: none; }
    .search-input::placeholder { color: var(--text-3); }
    .search-input::-webkit-search-cancel-button { -webkit-appearance: none; appearance: none; }
    .search-kbd {
      font-family: var(--font-mono);
      font-size: 0.63rem;
      font-weight: 600;
      color: var(--text-3);
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 0.5px 4.5px;
      line-height: 1.3;
      flex-shrink: 0;
    }
    .search-count {
      font-family: var(--font-mono);
      font-size: 0.65rem;
      font-weight: 700;
      color: var(--teal-text);
      background: var(--teal-soft);
      border: 1px solid var(--teal-border);
      border-radius: 999px;
      padding: 1px 5.5px;
      white-space: nowrap;
      flex-shrink: 0;
      font-variant-numeric: tabular-nums;
    }
    .search-count.is-zero {
      color: var(--amber-text);
      background: var(--amber-soft);
      border-color: var(--amber-border);
    }
    .search-step-group {
      display: inline-flex;
      align-items: center;
      gap: 1px;
      flex-shrink: 0;
    }
    .search-step, .search-clear {
      border: 0;
      background: transparent;
      color: var(--text-3);
      width: 19px;
      height: 19px;
      border-radius: 5px;
      display: inline-grid;
      place-items: center;
      cursor: pointer;
      flex-shrink: 0;
      padding: 0;
      transition: background-color 140ms ease, color 140ms ease;
    }
    .search-step:hover, .search-clear:hover { background: var(--surface-2); color: var(--text); }

    .quick-pop {
      position: absolute;
      top: calc(100% + 7px);
      inset-inline-start: 0;
      min-width: 248px;
      max-width: min(320px, 92vw);
      padding: 9px 10px 10px;
      border-radius: 10px;
      background: var(--glass-bg);
      backdrop-filter: blur(16px) saturate(160%);
      -webkit-backdrop-filter: blur(16px) saturate(160%);
      border: 1px solid var(--glass-border);
      box-shadow: var(--shadow-tip);
      z-index: 60;
      animation: popIn 140ms var(--ease) both;
    }
    @keyframes popIn {
      from { opacity: 0; transform: translateY(-4px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .quick-pop-lbl {
      font-size: 0.65rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-3);
      margin-bottom: 6px;
    }
    html[dir="rtl"] .quick-pop-lbl { text-transform: none; letter-spacing: 0; font-size: 0.72rem; }
    .quick-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
    }
    .quick-chip {
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-2);
      border-radius: 999px;
      padding: 2.5px 9px;
      font-family: var(--font-mono);
      font-size: 0.7rem;
      font-weight: 600;
      cursor: pointer;
      transition: border-color 140ms ease, background-color 140ms ease, color 140ms ease, transform 120ms ease;
    }
    .quick-chip:hover {
      border-color: var(--teal-border);
      background: var(--teal-soft);
      color: var(--teal-text);
      transform: translateY(-1px);
    }

    /* Segmented Controls (Language + Density) */
    .seg-group { display: flex; align-items: center; gap: 5px; }
    .seg-ctrl {
      position: relative;
      display: inline-flex;
      align-items: center;
      padding: 2px;
      border-radius: 8px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      transition: background-color 220ms var(--ease), border-color 220ms var(--ease);
    }
    .seg-pill {
      position: absolute;
      top: 2px;
      bottom: 2px;
      left: 0;
      width: 0;
      border-radius: 6px;
      background: var(--teal-btn);
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.14);
      opacity: 0;
      pointer-events: none;
      will-change: transform, width;
      transition: transform 200ms var(--ease), width 200ms var(--ease), background-color 220ms var(--ease), opacity 140ms ease;
    }
    .seg-density .seg-pill {
      background: var(--surface);
      border: 1px solid var(--border-strong);
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.07);
    }
    .seg-btn {
      position: relative;
      z-index: 1;
      border: 0;
      background: transparent;
      color: var(--text-2);
      padding: 3.5px 8px;
      border-radius: 6px;
      font-size: 0.73rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      line-height: 1.35;
      transition: color 160ms var(--ease);
    }
    .seg-btn:hover { color: var(--text); }
    .seg-lang .seg-btn.is-active,
    .seg-lang .seg-btn.is-active:hover { color: #FFFFFF; }
    .seg-density .seg-btn.is-active,
    .seg-density .seg-btn.is-active:hover { color: var(--teal-text); }

    .util-btns { display: flex; align-items: center; gap: 4px; }
    .ico-btn {
      width: 31px;
      height: 31px;
      padding: 0;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-2);
      display: inline-grid;
      place-items: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: background-color 160ms var(--ease), border-color 160ms var(--ease), color 160ms var(--ease), transform 120ms ease;
    }
    .ico-btn:hover { background: var(--surface-2); border-color: var(--border-strong); color: var(--text); }
    .ico-btn:active { transform: scale(0.96); }

    /* =========================================================================
       AMBIENT DESKTOP EDITORIAL MARGIN RAIL (>= 1280px)
       ========================================================================= */
    .margin-rail {
      display: none;
      position: fixed;
      top: 96px;
      inset-inline-start: max(16px, calc(50% - 440px - 186px));
      width: 158px;
      z-index: 30;
    }
    @media (min-width: 1280px) {
      .margin-rail { display: flex; flex-direction: column; gap: 10px; }
    }
    .rail-kicker {
      font-size: 0.64rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-3);
      padding-inline-start: 12px;
      opacity: 0.85;
    }
    html[dir="rtl"] .rail-kicker { text-transform: none; letter-spacing: 0; font-size: 0.72rem; }
    .rail-list {
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 2px;
      border-inline-start: 1.5px solid var(--border);
      padding-inline-start: 8px;
    }
    .rail-item {
      position: relative;
      border: 0;
      background: transparent;
      color: var(--text-3);
      text-align: start;
      padding: 5px 8px;
      border-radius: 7px;
      font-size: 0.75rem;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 7px;
      transition: color 160ms var(--ease), background-color 160ms var(--ease);
    }
    .rail-item::before {
      content: "";
      position: absolute;
      inset-inline-start: -9.5px;
      top: 6px;
      bottom: 6px;
      width: 2.5px;
      border-radius: 999px;
      background: var(--teal);
      opacity: 0;
      transform: scaleY(0.4);
      transition: opacity 180ms var(--ease), transform 180ms var(--ease);
    }
    .rail-item:hover { color: var(--text); background: var(--surface-2); }
    .rail-item.is-active {
      color: var(--teal-text);
      font-weight: 700;
      background: var(--teal-soft);
    }
    .rail-item.is-active::before { opacity: 1; transform: scaleY(1); }
    .rail-num {
      font-family: var(--font-mono);
      font-size: 0.65rem;
      font-weight: 700;
      opacity: 0.65;
      font-variant-numeric: tabular-nums;
      flex-shrink: 0;
    }
    .rail-item.is-active .rail-num { opacity: 1; color: var(--teal); }
    .rail-lbl { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .rail-tools {
      display: flex;
      align-items: center;
      gap: 4px;
      padding-top: 8px;
      border-top: 1px solid var(--border-subtle);
      padding-inline-start: 4px;
    }
    .rail-tool-btn {
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-3);
      height: 27px;
      padding: 0 8px;
      border-radius: 7px;
      font-size: 0.69rem;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      transition: color 150ms ease, border-color 150ms ease, background-color 150ms ease, opacity 180ms ease;
    }
    .rail-tool-btn:hover { color: var(--text); border-color: var(--border-strong); background: var(--surface-2); }
    .rail-tool-btn.is-dim { opacity: 0.38; pointer-events: none; }

    /* =========================================================================
       SINGLE CENTERED EDITORIAL COLUMN (MAX-WIDTH: 880px)
       ========================================================================= */
    .brief-main {
      max-width: 880px;
      margin: 0 auto;
      padding: 36px 28px 84px;
    }
    @keyframes briefFade {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .brief-main.is-swapping { animation: briefFade 220ms var(--ease) both; }

    @keyframes secPulse {
      0% { box-shadow: 0 0 0 8px var(--teal-soft); background-color: var(--teal-wash); }
      100% { box-shadow: 0 0 0 0 transparent; background-color: transparent; }
    }
    .is-pulsed { animation: secPulse 950ms var(--ease); border-radius: var(--r-md); }

    /* Minimal Editorial Clinical Dossier Masthead */
    .masthead {
      padding-bottom: 24px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 34px;
    }
    .masthead-eyebrow {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 12px;
    }
    .dossier-pill {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 3px 10px;
      border-radius: 999px;
      background: var(--teal-soft);
      border: 1px solid var(--teal-border);
      color: var(--teal-text);
      font-size: 0.71rem;
      font-weight: 700;
      letter-spacing: 0.02em;
    }
    .dossier-pulse {
      width: 6.5px;
      height: 6.5px;
      border-radius: 999px;
      background: var(--teal);
      box-shadow: 0 0 0 2.5px var(--teal-soft);
    }
    .masthead-top {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px 18px;
      margin-bottom: 6px;
    }
    .doc-title {
      margin: 0;
      font-family: var(--font-display);
      font-size: 2rem;
      font-weight: 750;
      letter-spacing: -0.03em;
      line-height: 1.16;
      color: var(--text);
    }
    html[dir="rtl"] .doc-title { font-family: var(--font-ar); letter-spacing: 0; font-size: 1.9rem; font-weight: 700; }
    .doc-date {
      font-family: var(--font-mono);
      font-size: 0.74rem;
      font-weight: 600;
      color: var(--teal-text);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 3px 10px;
      letter-spacing: 0.01em;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }
    html[dir="rtl"] .doc-date { font-family: var(--font-ar); letter-spacing: 0; }
    .doc-sub {
      margin: 0 0 16px;
      font-size: 0.96rem;
      color: var(--text-3);
      font-weight: 400;
    }
    .profile-bar {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
      padding: 9px 12px;
      border-radius: var(--r-md);
      background: var(--surface);
      border: 1px solid var(--border);
      box-shadow: var(--shadow-card);
    }
    .profile-chip {
      display: inline-block;
      font-size: 0.83rem;
      font-weight: 600;
      color: var(--text-2);
      font-variant-numeric: tabular-nums;
      line-height: 1.35;
    }
    .profile-chip:not(:last-child)::after {
      content: "";
      display: inline-block;
      width: 3px;
      height: 3px;
      border-radius: 999px;
      background: var(--teal);
      opacity: 0.55;
      vertical-align: middle;
      margin-inline-start: 10px;
      margin-inline-end: 4px;
    }
    .profile-line-print { display: none; }

    /* Interactive 6-Chapter Quick-Jump Map (Screen-Only) */
    .chapter-map {
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      gap: 7px;
      margin-top: 14px;
    }
    .chap-tile {
      border: 1px solid var(--border);
      background: var(--surface);
      border-radius: 9px;
      padding: 8px 9px 7px;
      text-align: start;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
      transition: border-color 160ms var(--ease), background-color 160ms var(--ease), transform 160ms var(--ease), box-shadow 160ms var(--ease);
    }
    .chap-tile:hover {
      border-color: var(--teal-border);
      background: var(--teal-wash);
      transform: translateY(-1.5px);
      box-shadow: var(--shadow-card);
    }
    .chap-tile:active { transform: translateY(0); }
    .chap-tile-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 4px;
    }
    .chap-num {
      font-family: var(--font-mono);
      font-size: 0.67rem;
      font-weight: 700;
      color: var(--teal);
      font-variant-numeric: tabular-nums;
    }
    .chap-dot {
      width: 6px;
      height: 6px;
      border-radius: 999px;
      background: var(--teal);
      opacity: 0.45;
      flex-shrink: 0;
    }
    .chap-dot.is-warn { background: var(--amber); opacity: 0.95; }
    .chap-dot.is-data { background: var(--teal); opacity: 0.9; }
    .chap-name {
      font-size: 0.77rem;
      font-weight: 700;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.25;
    }
    .chap-meta {
      font-size: 0.66rem;
      color: var(--text-3);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.25;
      font-variant-numeric: tabular-nums;
    }

    /* Brief Mode Convenience Strip */
    .brief-strip {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      margin: -14px 0 18px;
    }
    .brief-toggle-all {
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--teal-text);
      font-size: 0.73rem;
      font-weight: 600;
      padding: 4px 11px;
      border-radius: 999px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: background-color 150ms ease, border-color 150ms ease;
    }
    .brief-toggle-all:hover { background: var(--teal-soft); border-color: var(--teal-border); }

    /* Editorial Sections (01 -> 06) */
    .ed-section {
      padding-top: 44px;
      margin-top: 44px;
      border-top: 1px solid var(--border);
      scroll-margin-top: 74px;
    }
    .ed-section.is-first {
      padding-top: 0;
      margin-top: 0;
      border-top: 0;
    }
    .sec-head {
      display: flex;
      align-items: center;
      gap: 11px;
      margin: 0 0 20px;
    }
    .sec-num {
      font-family: var(--font-mono);
      font-size: 0.74rem;
      font-weight: 700;
      color: var(--teal-text);
      background: var(--teal-soft);
      border: 1px solid var(--teal-border);
      border-radius: 7px;
      padding: 2.5px 7.5px;
      letter-spacing: 0.04em;
      font-variant-numeric: tabular-nums;
      flex-shrink: 0;
      line-height: 1.3;
    }
    .sec-title {
      margin: 0;
      font-family: var(--font-display);
      font-size: 1.32rem;
      font-weight: 700;
      letter-spacing: -0.022em;
      line-height: 1.25;
      color: var(--text);
    }
    html[dir="rtl"] .sec-title { font-family: var(--font-ar); letter-spacing: 0; font-size: 1.3rem; }
    .sec-rule {
      flex: 1 1 auto;
      height: 1px;
      background: linear-gradient(90deg, var(--border), transparent);
      min-width: 16px;
    }
    html[dir="rtl"] .sec-rule { background: linear-gradient(270deg, var(--border), transparent); }
    .sec-badge {
      font-family: var(--font-mono);
      font-size: 0.68rem;
      font-weight: 700;
      color: var(--teal-text);
      background: var(--teal-soft);
      border: 1px solid var(--teal-border);
      border-radius: 999px;
      padding: 2px 8.5px;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }
    .sec-top-mini {
      border: 0;
      background: transparent;
      color: var(--text-3);
      width: 26px;
      height: 26px;
      border-radius: 6px;
      display: inline-grid;
      place-items: center;
      cursor: pointer;
      opacity: 0.45;
      flex-shrink: 0;
      transition: opacity 150ms ease, background-color 150ms ease, color 150ms ease;
    }
    .ed-section:hover .sec-top-mini,
    .sec-top-mini:focus-visible { opacity: 1; }
    .sec-top-mini:hover { background: var(--surface-2); color: var(--teal-text); }

    .kicker {
      margin: 0 0 10px;
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.075em;
      color: var(--text-3);
    }
    html[dir="rtl"] .kicker { text-transform: none; letter-spacing: 0; font-size: 0.79rem; }

    /* Lead Prose & Collapsible Detail (Brief vs Full) */
    .lead-prose {
      margin: 0 0 16px;
      font-size: 0.99rem;
      color: var(--text);
      line-height: 1.66;
    }
    html[dir="rtl"] .lead-prose { line-height: 1.78; }
    .sub-prose {
      margin: 0 0 22px;
      font-size: 0.91rem;
      color: var(--text-2);
      line-height: 1.64;
    }
    html[dir="rtl"] .sub-prose { line-height: 1.76; }
    .cog-prose-bar {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      margin: -8px 0 14px;
    }

    .brief-root.is-brief .detail-text { display: none; }
    .brief-root.is-brief .expandable.is-open .detail-text,
    .brief-root.is-brief .expandable.is-search-open .detail-text { display: block; }

    .item-expand {
      border: 1px solid var(--teal-border);
      background: var(--teal-soft);
      color: var(--teal-text);
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 0.7rem;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      flex-shrink: 0;
      transition: background-color 140ms ease, border-color 140ms ease;
    }
    .item-expand:hover { background: var(--teal-band); border-color: var(--teal); }
    .item-expand svg { transition: transform 180ms var(--ease); }
    .expandable.is-open .item-expand svg { transform: rotate(180deg); }

    /* =========================================================================
       SECTION 01: PRIORITIES
       ========================================================================= */
    .chief-block {
      padding: 16px 20px;
      border-inline-start: 3px solid var(--teal);
      background: linear-gradient(90deg, var(--teal-wash) 0%, transparent 100%);
      border-radius: 0 var(--r-md) var(--r-md) 0;
      margin-bottom: 30px;
    }
    html[dir="rtl"] .chief-block {
      background: linear-gradient(270deg, var(--teal-wash) 0%, transparent 100%);
      border-radius: var(--r-md) 0 0 var(--r-md);
    }
    .chief-text {
      margin: 0;
      font-size: 1.04rem;
      font-weight: 500;
      color: var(--text);
      line-height: 1.66;
    }
    html[dir="rtl"] .chief-text { line-height: 1.78; }

    .goals-block { margin-bottom: 30px; }
    .goals-list {
      list-style: none;
      margin: 0;
      padding: 0;
      border-top: 1px solid var(--border);
    }
    .goal-row {
      display: grid;
      grid-template-columns: 30px minmax(0, 1fr);
      gap: 12px;
      padding: 14px 8px;
      margin: 0 -8px;
      border-bottom: 1px solid var(--border);
      border-radius: 6px;
      align-items: start;
      transition: background-color 160ms ease;
    }
    .goal-row:hover { background: var(--surface-2); }
    .goal-idx {
      width: 24px;
      height: 24px;
      border-radius: 7px;
      background: var(--teal-soft);
      border: 1px solid var(--teal-border);
      display: inline-grid;
      place-items: center;
      font-family: var(--font-mono);
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--teal-text);
      font-variant-numeric: tabular-nums;
      margin-top: 1px;
    }
    .goal-body { min-width: 0; }
    .goal-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 3px;
    }
    .goal-title { font-size: 0.95rem; font-weight: 700; color: var(--text); line-height: 1.38; }
    .goal-brief { margin: 0; font-size: 0.9rem; color: var(--text-2); line-height: 1.56; }
    .goal-detail { margin: 5px 0 0; font-size: 0.85rem; color: var(--text-3); line-height: 1.54; }

    .synth-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
    }
    .synth-col {
      min-width: 0;
      background: var(--surface);
      border: 1px solid var(--border);
      border-top: 2.5px solid var(--teal);
      border-radius: var(--r-md);
      padding: 14px 15px 12px;
      box-shadow: var(--shadow-card);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 10px;
      transition: border-color 160ms var(--ease), transform 160ms var(--ease);
    }
    .synth-col:nth-child(2) { border-top-color: var(--amber); }
    .synth-col:nth-child(3) { border-top-color: var(--info); }
    .synth-col:hover { border-color: var(--border-strong); transform: translateY(-1px); }
    .synth-lead {
      margin: 0 0 5px;
      font-size: 0.87rem;
      font-weight: 700;
      color: var(--text);
      line-height: 1.36;
    }
    .synth-text {
      margin: 0;
      font-size: 0.83rem;
      color: var(--text-2);
      line-height: 1.54;
    }
    .xref-row {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 5px;
    }
    .xref-chip {
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--teal-text);
      border-radius: 999px;
      padding: 2px 8px;
      font-size: 0.69rem;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      transition: background-color 140ms ease, border-color 140ms ease, transform 120ms ease;
    }
    .xref-chip:hover {
      background: var(--teal-soft);
      border-color: var(--teal-border);
      transform: translateY(-1px);
    }
    .xref-chip svg { opacity: 0.8; }

    /* =========================================================================
       SECTION 02: COGNITION + BENCHMARK CHIPS + 3 INTERACTIVE FIGURES
       ========================================================================= */
    .bench-wrap { margin: 0 0 26px; }
    .bench-strip {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
    }
    .bench-chip {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 5px 11px;
      border-radius: 999px;
      background: var(--surface);
      border: 1px solid var(--border);
      font-size: 0.8rem;
      line-height: 1.3;
      transition: transform 140ms ease, box-shadow 140ms ease;
    }
    .bench-chip:hover { transform: translateY(-1px); box-shadow: var(--shadow-card); }
    .bench-chip.tone-intact { border-color: var(--teal-border); background: var(--teal-soft); }
    .bench-chip.tone-load { border-color: var(--amber-border); background: var(--amber-soft); }
    .bench-chip.tone-deficit { border-color: var(--coral-border); background: var(--coral-soft); }
    .bench-lbl { color: var(--text-2); font-weight: 500; }
    .bench-val {
      font-family: var(--font-mono);
      font-weight: 700;
      font-size: 0.78rem;
      font-variant-numeric: tabular-nums;
      color: var(--teal-text);
    }
    .tone-load .bench-val { color: var(--amber-text); }
    .tone-deficit .bench-val { color: var(--coral-text); }
    html[dir="rtl"] .tone-deficit .bench-val { font-family: var(--font-ar); }

    /* Pure Editorial Figure Container */
    .figure-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r-lg);
      box-shadow: var(--shadow-fig);
      padding: 20px 22px 18px;
      margin: 22px 0;
      scroll-margin-top: 76px;
      transition: background-color 220ms var(--ease), border-color 220ms var(--ease), box-shadow 220ms var(--ease);
    }
    .figure-card:hover { border-color: var(--border-strong); }
    .figure-card:last-child { margin-bottom: 0; }
    .fig-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 6px 16px;
      margin-bottom: 5px;
    }
    .fig-title-wrap {
      display: inline-flex;
      align-items: baseline;
      flex-wrap: wrap;
      gap: 8px;
      min-width: 0;
    }
    .fig-tag {
      font-family: var(--font-mono);
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      color: var(--teal-text);
      background: var(--teal-soft);
      border: 1px solid var(--teal-border);
      border-radius: 5px;
      padding: 1px 6px;
      white-space: nowrap;
      flex-shrink: 0;
    }
    html[dir="rtl"] .fig-tag { font-family: var(--font-ar); letter-spacing: 0; font-size: 0.7rem; }
    .fig-title {
      margin: 0;
      font-size: 0.94rem;
      font-weight: 700;
      color: var(--text);
      line-height: 1.35;
    }
    .fig-sub {
      margin: 0 0 16px;
      font-size: 0.81rem;
      color: var(--text-3);
      line-height: 1.48;
    }
    .fig-legend {
      display: inline-flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px 14px;
      font-size: 0.75rem;
      color: var(--text-2);
      font-weight: 500;
    }
    .leg-item { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
    .leg-dot { width: 8px; height: 8px; border-radius: 999px; flex-shrink: 0; }
    .leg-dot.is-teal { background: var(--bar-hit); }
    .leg-dot.is-slate-ring { background: var(--surface); border: 2px solid var(--slate-viz); }
    .leg-dot.is-amber { background: var(--bar-swap); }
    .leg-dot.is-coral { background: var(--bar-stale); }
    .leg-dot.is-slate { background: var(--bar-guess); }
    .leg-line { width: 16px; height: 0; border-top: 2.5px solid var(--teal); border-radius: 2px; flex-shrink: 0; }
    .leg-line.is-dashed { border-top-style: dashed; border-top-color: var(--coral); }

    .viz-svg {
      display: block;
      width: 100%;
      height: auto;
      direction: ltr;
      unicode-bidi: isolate;
      overflow: visible;
    }
    .svg-hit { cursor: pointer; outline: none; }
    .svg-hit:focus-visible { outline: none; }
    .pvt-col-hit { fill: transparent; cursor: pointer; }
    .pvt-col-group .pvt-crosshair { opacity: 0; transition: opacity 120ms ease; pointer-events: none; }
    .pvt-col-group:hover .pvt-crosshair,
    .pvt-col-group:focus-within .pvt-crosshair { opacity: 1; }
    .pvt-col-group:hover .pvt-pt-ring,
    .pvt-col-group:focus-within .pvt-pt-ring { r: 6.5; }

    /* Interactive Series Highlighting on Vigilance & Sleep Ribbon */
    .pvt-series-alert, .pvt-series-fatigued, .pvt-series-gap { transition: opacity 180ms var(--ease); }
    .figure-card[data-pvt-focus="alert"] .pvt-series-fatigued,
    .figure-card[data-pvt-focus="alert"] .pvt-series-gap { opacity: 0.22; }
    .figure-card[data-pvt-focus="fatigued"] .pvt-series-alert { opacity: 0.25; }

    .anat-seg { transition: opacity 150ms ease, filter 150ms ease; }
    .anat-svg:hover .anat-seg { opacity: 0.72; }
    .anat-svg .anat-seg:hover,
    .anat-svg .anat-seg:focus-visible { opacity: 1; filter: brightness(1.07); }

    /* Viz 1A: Sibling Lollipop / Dumbbell Comparison */
    .lollipop-axis-row {
      display: grid;
      grid-template-columns: minmax(0, 1.08fr) minmax(0, 1fr);
      gap: 16px;
      align-items: end;
      margin-bottom: 4px;
    }
    .lollipop-list { display: flex; flex-direction: column; }
    .lollipop-row {
      display: grid;
      grid-template-columns: minmax(0, 1.08fr) minmax(0, 1fr);
      gap: 16px;
      align-items: center;
      padding: 10px 8px;
      margin: 0 -8px;
      border-top: 1px solid var(--border-subtle);
      border-radius: 8px;
      transition: background-color 150ms ease;
    }
    .lollipop-row:hover { background: var(--surface-2); }
    .lollipop-row.is-tie-row { background: var(--coral-wash); }
    .lollipop-row.is-tie-row:hover { background: var(--coral-soft); }
    .lollipop-meta { min-width: 0; }
    .lollipop-name-row {
      display: flex;
      align-items: center;
      gap: 7px;
      flex-wrap: wrap;
      margin-bottom: 2px;
    }
    .lollipop-name {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text);
      line-height: 1.32;
    }
    .delta-pill {
      font-family: var(--font-mono);
      font-size: 0.65rem;
      font-weight: 700;
      padding: 0.5px 6px;
      border-radius: 999px;
      background: var(--teal-soft);
      color: var(--teal-text);
      border: 1px solid var(--teal-border);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }
    .delta-pill.is-tie {
      background: var(--coral-soft);
      color: var(--coral-text);
      border-color: var(--coral-border);
    }
    .lollipop-vals {
      font-size: 0.75rem;
      color: var(--text-3);
      line-height: 1.42;
      font-variant-numeric: tabular-nums;
    }
    .lv-p { color: var(--teal-text); font-weight: 600; }
    .lv-p.is-tie { color: var(--coral-text); }
    .lv-sep { margin: 0 5px; opacity: 0.55; }
    .lollipop-track-wrap { min-width: 0; }

    .fig-footnotes {
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px solid var(--border-subtle);
      display: flex;
      flex-direction: column;
      gap: 5px;
      font-size: 0.77rem;
      color: var(--text-3);
      line-height: 1.5;
    }
    .fig-footnotes p { margin: 0; }
    .fig-footnotes .fn-contrast { color: var(--text-2); }

    /* Viz 1B: Error-Anatomy Stacked Bar */
    .anat-list { display: flex; flex-direction: column; gap: 14px; }
    .anat-row { min-width: 0; }
    .anat-top {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 4px 12px;
      margin-bottom: 6px;
    }
    .anat-lbl { font-size: 0.85rem; font-weight: 700; color: var(--text); }
    .anat-callout { font-size: 0.76rem; color: var(--text-2); font-variant-numeric: tabular-nums; }
    .anat-row.is-patient .anat-callout { color: var(--coral-text); font-weight: 600; }

    /* Viz 2: Dual-State Vigilance Spline Area Chart */
    .pvt-svg-box { width: 100%; overflow: hidden; }
    .pvt-legend-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px 16px;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid var(--border-subtle);
    }
    .pvt-leg-card {
      display: flex;
      align-items: flex-start;
      gap: 9px;
      min-width: 0;
      padding: 6px 8px;
      margin: -6px -8px;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 150ms ease;
    }
    .pvt-leg-card:hover { background: var(--surface-2); }
    .pvt-leg-swatch { margin-top: 7px; }
    .pvt-leg-body { min-width: 0; }
    .pvt-leg-lbl { font-size: 0.8rem; font-weight: 700; color: var(--text); line-height: 1.3; }
    .pvt-leg-sum { font-size: 0.74rem; color: var(--text-3); line-height: 1.42; font-variant-numeric: tabular-nums; }
    .pvt-conclusion {
      margin: 14px 0 0;
      padding: 9px 13px;
      border-inline-start: 2.5px solid var(--teal);
      background: var(--teal-soft);
      border-radius: 0 var(--r-xs) var(--r-xs) 0;
      font-size: 0.82rem;
      font-weight: 500;
      color: var(--text);
      line-height: 1.48;
    }
    html[dir="rtl"] .pvt-conclusion { border-radius: var(--r-xs) 0 0 var(--r-xs); }

    /* =========================================================================
       SHARED PROSE ITEMS (SECTIONS 03 & 04)
       ========================================================================= */
    .prose-list {
      list-style: none;
      margin: 0;
      padding: 0;
      border-top: 1px solid var(--border);
    }
    .prose-item {
      padding: 15px 8px;
      margin: 0 -8px;
      border-bottom: 1px solid var(--border);
      border-radius: 6px;
      transition: background-color 150ms ease;
    }
    .prose-item:hover { background: var(--surface-2); }
    .prose-item-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 4px;
    }
    .prose-lead { font-size: 0.94rem; font-weight: 700; color: var(--text); line-height: 1.36; }
    .prose-brief { margin: 0; font-size: 0.9rem; color: var(--text-2); line-height: 1.58; }
    .prose-detail { margin: 6px 0 0; font-size: 0.85rem; color: var(--text-3); line-height: 1.58; }

    /* =========================================================================
       VIZ 3: 24-HOUR SLEEP & FRAGMENTATION RIBBON + VIZ 4: 4-MILESTONE TIMELINE
       ========================================================================= */
    .arousal-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.74rem;
      font-weight: 600;
      color: var(--amber-text);
      background: var(--amber-soft);
      border: 1px solid var(--amber-border);
      padding: 2px 9px;
      border-radius: 999px;
    }
    .arousal-diamond {
      width: 7px;
      height: 7px;
      background: var(--amber);
      transform: rotate(45deg);
      border-radius: 1px;
      flex-shrink: 0;
    }
    .rib-block { transition: opacity 150ms ease, filter 150ms ease; }
    .figure-card[data-rib-focus] .rib-block { opacity: 0.45; }
    .figure-card[data-rib-focus="sleep"] .rib-block[data-rib-id="sleep"],
    .figure-card[data-rib-focus="trough"] .rib-block[data-rib-id="trough"],
    .figure-card[data-rib-focus="alert"] .rib-block[data-rib-id="alert"],
    .figure-card[data-rib-focus="night"] .rib-block[data-rib-id="night"] { opacity: 1; filter: saturate(1.1); }

    .ribbon-legend {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px 12px;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid var(--border-subtle);
    }
    .rib-leg-item {
      display: flex;
      align-items: flex-start;
      gap: 7px;
      min-width: 0;
      padding: 6px 7px;
      margin: -6px -7px;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 150ms ease, opacity 150ms ease;
    }
    .rib-leg-item:hover,
    .rib-leg-item.is-hi { background: var(--surface-2); }
    .rib-sw {
      width: 10px;
      height: 10px;
      border-radius: 3px;
      margin-top: 4px;
      flex-shrink: 0;
      border: 1px solid var(--border-strong);
    }
    .rib-sw.kind-sleep { background: var(--sleep-bg); }
    .rib-sw.kind-trough { background: var(--trough-bg); }
    .rib-sw.kind-alert { background: var(--alert-bg); border-color: transparent; }
    .rib-sw.kind-hyperfocus { background: var(--night-bg); }
    .rib-leg-lbl { display: block; font-size: 0.77rem; font-weight: 700; color: var(--text); line-height: 1.3; }
    .rib-leg-det { display: block; font-size: 0.72rem; color: var(--text-3); line-height: 1.38; margin-top: 1px; }

    /* Viz 4: Minimal 4-Milestone Lifespan Hairline Timeline */
    .life-wrap { margin-top: 28px; }
    .life-rail {
      position: relative;
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 16px;
      list-style: none;
      margin: 0;
      padding: 4px 0 0;
    }
    .life-node {
      position: relative;
      z-index: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 5px;
      padding: 6px 6px 8px;
      border-radius: 9px;
      transition: background-color 160ms ease;
    }
    .life-node:hover { background: var(--surface-2); }
    .life-age {
      font-family: var(--font-mono);
      font-size: 0.71rem;
      font-weight: 600;
      color: var(--text-3);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }
    html[dir="rtl"] .life-age { font-family: var(--font-ar); }
    .life-node.is-current .life-age { color: var(--teal-text); font-weight: 700; }
    .life-dot-wrap {
      position: relative;
      width: 100%;
      height: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .life-dot-wrap::before {
      content: "";
      position: absolute;
      top: 50%;
      inset-inline-start: -14px;
      inset-inline-end: -14px;
      height: 1px;
      background: var(--border-strong);
      z-index: 0;
    }
    .life-node:first-child .life-dot-wrap::before { inset-inline-start: 50%; }
    .life-node:last-child .life-dot-wrap::before { inset-inline-end: 50%; }
    .life-rail.is-filtered .life-dot-wrap::before { display: none; }
    .life-dot {
      position: relative;
      z-index: 1;
      width: 10px;
      height: 10px;
      border-radius: 999px;
      background: var(--bg);
      border: 2px solid var(--teal);
      box-shadow: 0 0 0 3px var(--bg);
      flex-shrink: 0;
    }
    .life-node.is-current .life-dot {
      background: var(--teal);
      box-shadow: 0 0 0 3px var(--bg), 0 0 0 6px var(--teal-soft);
    }
    .life-stage { font-size: 0.84rem; font-weight: 700; color: var(--text); line-height: 1.25; }
    .life-note { font-size: 0.76rem; color: var(--text-3); line-height: 1.42; }

    /* =========================================================================
       SECTION 05: SAFETY BASELINE + ACCESS NOTE + SIGNAL-FIRST LABS
       ========================================================================= */
    .safety-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 14px;
    }
    .safety-card {
      min-width: 0;
      background: var(--surface);
      border: 1px solid var(--border);
      border-inline-start: 3px solid var(--teal);
      border-radius: var(--r-md);
      padding: 13px 15px;
      box-shadow: var(--shadow-card);
      transition: background-color 200ms var(--ease), border-color 200ms var(--ease), transform 160ms var(--ease);
    }
    .safety-card:hover { border-color: var(--border-strong); transform: translateY(-1px); }
    .safety-card.sev-warn { border-inline-start-color: var(--amber); }
    .safety-card.sev-info { border-inline-start-color: var(--info); }
    .safety-card.sev-ok { border-inline-start-color: var(--teal); }
    .safety-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 5px;
    }
    .safety-lead-wrap {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      min-width: 0;
    }
    .safety-ico {
      width: 22px;
      height: 22px;
      border-radius: 6px;
      display: inline-grid;
      place-items: center;
      flex-shrink: 0;
    }
    .safety-ico.sev-warn { background: var(--amber-soft); color: var(--amber-text); }
    .safety-ico.sev-info { background: var(--info-soft); color: var(--info-text); }
    .safety-ico.sev-ok { background: var(--teal-soft); color: var(--teal-text); }
    .safety-lead { font-size: 0.88rem; font-weight: 700; color: var(--text); line-height: 1.3; }
    .safety-right { display: inline-flex; align-items: center; gap: 5px; flex-shrink: 0; }
    .sev-badge {
      font-size: 0.67rem;
      font-weight: 700;
      padding: 1.5px 8px;
      border-radius: 999px;
      white-space: nowrap;
      line-height: 1.35;
    }
    .sev-badge.sev-warn { background: var(--amber-soft); color: var(--amber-text); border: 1px solid var(--amber-border); }
    .sev-badge.sev-info { background: var(--info-soft); color: var(--info-text); border: 1px solid var(--info-border); }
    .sev-badge.sev-ok { background: var(--teal-soft); color: var(--teal-text); border: 1px solid var(--teal-border); }
    .safety-brief { margin: 0; font-size: 0.83rem; color: var(--text-2); line-height: 1.5; }
    .safety-detail { margin: 5px 0 0; font-size: 0.78rem; color: var(--text-3); line-height: 1.48; }

    .access-note {
      margin: 0 0 24px;
      padding: 9px 14px;
      border-radius: var(--r-sm);
      background: var(--surface-2);
      border: 1px solid var(--border);
      font-size: 0.82rem;
      color: var(--text-2);
      display: flex;
      align-items: center;
      gap: 9px;
      line-height: 1.45;
    }
    .access-note svg { color: var(--teal-text); flex-shrink: 0; }

    /* Viz 5: Signal-First Lab Visualization */
    .labs-head-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px 14px;
      margin-bottom: 10px;
    }
    .labs-filter {
      position: relative;
      display: inline-flex;
      align-items: center;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 2px;
      gap: 2px;
    }
    .labs-fbtn {
      position: relative;
      z-index: 1;
      border: 0;
      background: transparent;
      color: var(--text-3);
      font-size: 0.72rem;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 999px;
      cursor: pointer;
      white-space: nowrap;
      transition: background-color 150ms ease, color 150ms ease;
    }
    .labs-fbtn:hover { color: var(--text); }
    .labs-fbtn.is-active { background: var(--teal-btn); color: #FFFFFF; }

    .labs-legend {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px 14px;
      margin-bottom: 14px;
      font-size: 0.73rem;
      color: var(--text-3);
    }
    .lab-leg-zone {
      width: 15px;
      height: 6px;
      border-radius: 999px;
      background: var(--zone-bg);
      border: 1px solid var(--zone-edge);
      display: inline-block;
    }
    .lab-leg-shift { display: inline-flex; align-items: center; gap: 2px; }
    .lab-leg-prev { width: 6px; height: 6px; border-radius: 999px; background: var(--surface); border: 1.6px solid var(--amber); }
    .lab-leg-bar { width: 11px; height: 2px; background: linear-gradient(90deg, var(--amber), var(--teal)); border-radius: 2px; }
    html[dir="rtl"] .lab-leg-bar { background: linear-gradient(270deg, var(--amber), var(--teal)); }
    .lab-leg-curr { width: 6px; height: 6px; border-radius: 999px; background: var(--teal); }
    .lab-leg-warn { width: 7px; height: 7px; border-radius: 999px; background: var(--amber); }

    /* Spotlight Precision Linear Gauge */
    .lab-spotlight {
      background: var(--amber-soft);
      border: 1px solid var(--amber-border);
      border-radius: var(--r-md);
      padding: 13px 16px 12px;
      margin-bottom: 16px;
    }
    .spot-top {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 6px 12px;
      margin-bottom: 6px;
    }
    .spot-left { display: inline-flex; align-items: center; flex-wrap: wrap; gap: 8px; }
    .spot-lbl { font-size: 0.9rem; font-weight: 700; color: var(--text); }
    .spot-date { font-family: var(--font-mono); font-size: 0.72rem; color: var(--text-3); font-variant-numeric: tabular-nums; }
    .spot-badge {
      font-size: 0.67rem;
      font-weight: 700;
      padding: 1.5px 8px;
      border-radius: 999px;
      background: var(--surface);
      color: var(--amber-text);
      border: 1px solid var(--amber-border);
    }
    .spot-val {
      font-family: var(--font-mono);
      font-size: 1.02rem;
      font-weight: 700;
      color: var(--amber-text);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }
    .spot-val .lab-unit { font-size: 0.74rem; font-weight: 500; color: var(--text-3); margin-inline-start: 3px; }
    .spot-note { margin: 5px 0 0; font-size: 0.76rem; font-weight: 600; color: var(--amber-text); }

    /* Repleted Deficiencies + Compact Normal Clearance */
    .lab-subblock { margin-top: 14px; }
    .lab-subblock.is-filter-hidden { display: none; }
    .lab-subhead {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 4px 10px;
      margin-bottom: 8px;
    }
    .lab-subtitle {
      font-size: 0.71rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-3);
    }
    html[dir="rtl"] .lab-subtitle { text-transform: none; letter-spacing: 0; font-size: 0.77rem; }
    .lab-subnote { font-size: 0.73rem; color: var(--text-3); }

    .repleted-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }
    .rep-item {
      min-width: 0;
      padding: 10px 12px;
      border-radius: var(--r-sm);
      background: var(--bg);
      border: 1px solid var(--border);
      cursor: default;
      transition: border-color 150ms ease, background-color 150ms ease;
    }
    .rep-item:hover { border-color: var(--teal-border); background: var(--teal-wash); }
    .rep-top { display: flex; align-items: baseline; justify-content: space-between; gap: 6px; margin-bottom: 2px; }
    .rep-lbl { font-size: 0.8rem; font-weight: 700; color: var(--text); }
    .rep-date { font-family: var(--font-mono); font-size: 0.65rem; color: var(--text-3); white-space: nowrap; }
    .rep-val-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      margin-bottom: 6px;
    }
    .rep-val {
      font-family: var(--font-mono);
      font-size: 0.77rem;
      font-weight: 700;
      color: var(--teal-text);
      font-variant-numeric: tabular-nums;
    }
    .rep-fold {
      font-family: var(--font-mono);
      font-size: 0.63rem;
      font-weight: 700;
      color: var(--teal-text);
      background: var(--teal-soft);
      border: 1px solid var(--teal-border);
      border-radius: 999px;
      padding: 0.5px 5.5px;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }
    .rep-prev { font-weight: 500; color: var(--amber-text); }
    .rep-arr { margin: 0 3px; color: var(--text-3); font-weight: 400; }
    .rep-unit { font-size: 0.67rem; font-weight: 500; color: var(--text-3); margin-inline-start: 2px; }
    .rep-meta { display: flex; align-items: center; justify-content: space-between; gap: 6px; margin-top: 5px; font-size: 0.69rem; color: var(--text-3); }

    /* Sleek 3-Column Normal Clearance Grid */
    .normal-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 6px 14px;
      padding-top: 8px;
      border-top: 1px solid var(--border-subtle);
    }
    .norm-item {
      min-width: 0;
      padding: 6px 6px;
      margin: 0 -6px;
      border-bottom: 1px solid var(--border-subtle);
      border-radius: 6px;
      cursor: default;
      transition: background-color 140ms ease;
    }
    .norm-item:hover { background: var(--surface-2); }
    .norm-top {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 6px;
      margin-bottom: 4px;
    }
    .norm-lbl { font-size: 0.78rem; font-weight: 600; color: var(--text); overflow-wrap: break-word; }
    .norm-val {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--teal-text);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }
    .norm-unit { font-size: 0.65rem; font-weight: 500; color: var(--text-3); margin-inline-start: 2px; }
    .mini-viz { display: flex; align-items: center; gap: 7px; }
    .mini-track {
      position: relative;
      flex: 1 1 auto;
      min-width: 0;
      height: 5px;
      border-radius: 999px;
      background: var(--track-bg);
    }
    .mini-zone {
      position: absolute;
      top: 0;
      bottom: 0;
      background: var(--zone-bg);
      border-left: 1px solid var(--zone-edge);
      border-right: 1px solid var(--zone-edge);
      border-radius: 2px;
    }
    .mini-delta {
      position: absolute;
      top: 50%;
      height: 2px;
      transform: translateY(-50%);
      border-radius: 999px;
      background: linear-gradient(90deg, var(--amber), var(--teal));
      z-index: 1;
    }
    .mini-dot-prev {
      position: absolute;
      top: 50%;
      width: 6px;
      height: 6px;
      border-radius: 999px;
      transform: translate(-50%, -50%);
      background: var(--surface);
      border: 1.6px solid var(--amber);
      z-index: 2;
    }
    .mini-dot-curr {
      position: absolute;
      top: 50%;
      width: 7.5px;
      height: 7.5px;
      border-radius: 999px;
      transform: translate(-50%, -50%);
      background: var(--teal);
      box-shadow: 0 0 0 1.5px var(--surface);
      z-index: 3;
    }
    .mini-ref {
      flex-shrink: 0;
      font-family: var(--font-mono);
      font-size: 0.64rem;
      color: var(--text-3);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    /* =========================================================================
       SECTION 06: CONSULTATION DECISIONS (ELEVATED CARDS + DISCUSSION TOGGLE)
       ========================================================================= */
    .q-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
      list-style: none;
      margin: 0;
      padding: 0;
    }
    .q-item {
      min-width: 0;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r-md);
      padding: 15px 16px 13px;
      box-shadow: var(--shadow-card);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 11px;
      transition: border-color 160ms var(--ease), background-color 160ms var(--ease), opacity 180ms ease;
    }
    .q-item:hover { border-color: var(--teal-border); }
    .q-item.is-done {
      background: var(--teal-wash);
      border-color: var(--teal-border);
    }
    .q-item.is-done .q-lead,
    .q-item.is-done .q-text { opacity: 0.72; }
    .q-top {
      display: grid;
      grid-template-columns: 24px minmax(0, 1fr) auto;
      gap: 10px;
      align-items: start;
    }
    .q-num {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--teal);
      padding-top: 2px;
      font-variant-numeric: tabular-nums;
    }
    .q-lead { margin: 0 0 4px; font-size: 0.9rem; font-weight: 700; color: var(--text); line-height: 1.35; }
    .q-text { margin: 0; font-size: 0.85rem; color: var(--text-2); line-height: 1.54; }
    .q-check {
      width: 24px;
      height: 24px;
      border-radius: 999px;
      border: 1.5px solid var(--border-strong);
      background: var(--bg);
      color: transparent;
      display: inline-grid;
      place-items: center;
      cursor: pointer;
      padding: 0;
      flex-shrink: 0;
      transition: background-color 150ms ease, border-color 150ms ease, color 150ms ease, transform 120ms ease;
    }
    .q-check:hover { border-color: var(--teal); transform: scale(1.06); }
    .q-item.is-done .q-check {
      background: var(--teal-btn);
      border-color: var(--teal-btn);
      color: #FFFFFF;
    }
    .q-foot {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      padding-inline-start: 34px;
    }

    /* Editorial End-Cap Footer (Screen-Only) */
    .brief-endcap {
      margin-top: 44px;
      padding-top: 20px;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px 16px;
      font-size: 0.76rem;
      color: var(--text-3);
    }
    .endcap-note {
      display: inline-flex;
      align-items: center;
      gap: 7px;
    }
    .endcap-actions {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .endcap-btn {
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-2);
      border-radius: 999px;
      padding: 4px 12px;
      font-size: 0.74rem;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      cursor: pointer;
      transition: border-color 150ms ease, background-color 150ms ease, color 150ms ease;
    }
    .endcap-btn:hover { border-color: var(--teal-border); background: var(--teal-soft); color: var(--teal-text); }

    /* Empty Search State */
    .search-empty {
      padding: 56px 20px;
      text-align: center;
      color: var(--text-2);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    .search-empty-title { margin: 0; font-size: 0.96rem; font-weight: 700; color: var(--text); }
    .search-empty-btn {
      border: 1px solid var(--teal-border);
      background: var(--teal-soft);
      color: var(--teal-text);
      font-size: 0.8rem;
      font-weight: 600;
      padding: 6px 15px;
      border-radius: 999px;
      cursor: pointer;
    }

    /* =========================================================================
       FLOATING NAVIGATION AIDS (BACK-TO-TOP, RETURN-TOAST, MOBILE DOCK, DRAWER, MODAL)
       ========================================================================= */
    .float-top {
      position: fixed;
      bottom: 22px;
      inset-inline-end: 22px;
      z-index: 45;
      width: 40px;
      height: 40px;
      border-radius: 999px;
      border: 1px solid var(--glass-border);
      background: var(--glass-bg);
      backdrop-filter: blur(14px) saturate(160%);
      -webkit-backdrop-filter: blur(14px) saturate(160%);
      color: var(--teal-text);
      box-shadow: var(--shadow-dock);
      display: inline-grid;
      place-items: center;
      cursor: pointer;
      opacity: 0;
      pointer-events: none;
      transform: translateY(10px) scale(0.94);
      transition: opacity 200ms var(--ease), transform 200ms var(--ease), border-color 150ms ease, background-color 150ms ease;
    }
    .float-top.is-visible { opacity: 1; pointer-events: auto; transform: translateY(0) scale(1); }
    .float-top:hover { border-color: var(--teal-border); background: var(--surface); }
    @media (min-width: 1280px) { .float-top { display: none; } }

    .return-toast {
      position: fixed;
      bottom: 22px;
      inset-inline-end: 72px;
      z-index: 50;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 6px 6px 12px;
      border-radius: 999px;
      background: var(--glass-bg);
      backdrop-filter: blur(16px) saturate(170%);
      -webkit-backdrop-filter: blur(16px) saturate(170%);
      border: 1px solid var(--teal-border);
      box-shadow: var(--shadow-dock);
      color: var(--text);
      font-size: 0.76rem;
      font-weight: 600;
      opacity: 0;
      pointer-events: none;
      transform: translateY(12px);
      transition: opacity 200ms var(--ease), transform 200ms var(--ease);
    }
    html[dir="rtl"] .return-toast { padding: 6px 12px 6px 6px; }
    @media (min-width: 1280px) { .return-toast { inset-inline-end: 24px; } }
    .return-toast.is-visible { opacity: 1; pointer-events: auto; transform: translateY(0); }
    .return-go {
      border: 0;
      background: transparent;
      color: var(--teal-text);
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      padding: 2px 4px;
      border-radius: 999px;
    }
    .return-go:hover { text-decoration: underline; }
    .return-x {
      width: 22px;
      height: 22px;
      border-radius: 999px;
      border: 0;
      background: var(--surface-2);
      color: var(--text-3);
      display: inline-grid;
      place-items: center;
      cursor: pointer;
      padding: 0;
    }
    .return-x:hover { color: var(--text); background: var(--surface-3); }

    /* Mobile Floating Bottom Navigation Capsule (<= 639px) */
    .mob-dock {
      display: none;
      position: fixed;
      left: 50%;
      bottom: calc(12px + env(safe-area-inset-bottom, 0px));
      z-index: 48;
      width: min(366px, calc(100vw - 24px));
      padding: 5px;
      border-radius: 999px;
      background: var(--glass-bg);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      border: 1px solid var(--glass-border);
      box-shadow: var(--shadow-dock);
      align-items: center;
      justify-content: space-between;
      gap: 4px;
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, 16px);
      transition: opacity 220ms var(--ease), transform 220ms var(--ease);
    }
    .mob-dock.is-visible {
      opacity: 1;
      pointer-events: auto;
      transform: translate(-50%, 0);
    }
    .mob-dock-btn {
      width: 36px;
      height: 36px;
      border-radius: 999px;
      border: 0;
      background: transparent;
      color: var(--text-2);
      display: inline-grid;
      place-items: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: background-color 140ms ease, color 140ms ease;
    }
    .mob-dock-btn:hover, .mob-dock-btn:active { background: var(--surface-2); color: var(--teal-text); }
    .mob-dock-btn:disabled { opacity: 0.3; pointer-events: none; }
    .mob-dock-center {
      flex: 1 1 auto;
      min-width: 0;
      height: 36px;
      border: 1px solid var(--teal-border);
      background: var(--teal-soft);
      color: var(--teal-text);
      border-radius: 999px;
      padding: 0 12px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      cursor: pointer;
      font-size: 0.78rem;
      font-weight: 700;
    }
    .mob-dock-num {
      font-family: var(--font-mono);
      font-size: 0.69rem;
      font-weight: 700;
      opacity: 0.85;
      font-variant-numeric: tabular-nums;
      flex-shrink: 0;
    }
    .mob-dock-title {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* Mobile Quick-Jump Bottom Sheet Drawer */
    .sheet-backdrop, .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 90;
      background: var(--backdrop);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      display: flex;
      align-items: flex-end;
      justify-content: center;
      animation: fadeBg 180ms ease both;
    }
    .modal-backdrop { align-items: center; padding: 16px; }
    @keyframes fadeBg { from { opacity: 0; } to { opacity: 1; } }

    .mob-sheet {
      width: 100%;
      max-width: 480px;
      background: var(--surface);
      border-top: 1px solid var(--glass-border);
      border-radius: 20px 20px 0 0;
      padding: 10px 16px calc(18px + env(safe-area-inset-bottom, 0px));
      box-shadow: var(--shadow-dock);
      animation: sheetUp 220ms var(--ease) both;
      max-height: 85vh;
      overflow-y: auto;
    }
    @keyframes sheetUp { from { transform: translateY(28px); opacity: 0.5; } to { transform: translateY(0); opacity: 1; } }
    .sheet-handle {
      width: 36px;
      height: 4px;
      border-radius: 999px;
      background: var(--border-strong);
      margin: 0 auto 12px;
    }
    .sheet-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
      padding: 0 4px;
    }
    .sheet-title { margin: 0; font-size: 0.92rem; font-weight: 700; color: var(--text); }
    .sheet-list {
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-bottom: 14px;
    }
    .sheet-item {
      border: 1px solid transparent;
      background: transparent;
      color: var(--text);
      padding: 10px 12px;
      border-radius: 11px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      cursor: pointer;
      text-align: start;
      transition: background-color 140ms ease, border-color 140ms ease;
    }
    .sheet-item:hover { background: var(--surface-2); }
    .sheet-item.is-active {
      background: var(--teal-soft);
      border-color: var(--teal-border);
    }
    .sheet-item-l { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .sheet-num {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--teal-text);
      background: var(--surface-2);
      border-radius: 6px;
      padding: 2px 6px;
      flex-shrink: 0;
    }
    .sheet-item.is-active .sheet-num { background: var(--teal-btn); color: #FFFFFF; }
    .sheet-lbl { font-size: 0.87rem; font-weight: 600; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .sheet-meta { font-size: 0.71rem; color: var(--text-3); white-space: nowrap; flex-shrink: 0; }
    .sheet-quick-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
      padding-top: 12px;
      border-top: 1px solid var(--border);
    }
    .sheet-pill-row { display: inline-flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .sheet-act-btn {
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--text-2);
