<!DOCTYPE html>
<html lang="fr" dir="ltr" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet" />
  <meta name="referrer" content="no-referrer" />
  <meta name="theme-color" content="#FAF9F6" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230F766E'/%3E%3Cpath d='M16 9v14M9 16h14' stroke='%23FAF9F6' stroke-width='2.6' stroke-linecap='round'/%3E%3C/svg%3E" />
  <title>Fiche Clinique · ملف طبي · Clinical Brief</title>
  <style>
    :root {
      color-scheme: light;
      --font-sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      --font-display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      --font-ar: "SF Arabic", "Geeza Pro", "Segoe UI", Tahoma, "Noto Sans Arabic", system-ui, -apple-system, sans-serif;
      --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
      --ease: cubic-bezier(0.22, 1, 0.36, 1);

      /* Editorial Clinical Brief — Warm Alabaster Paper */
      --bg: #FAF9F6;
      --bg-dot: rgba(15, 23, 42, 0.045);
      --surface: #FFFFFF;
      --surface-2: #F3F1EB;
      --surface-3: #ECE9E0;
      --surface-hover: #E7E4DA;
      --chrome: rgba(250, 249, 246, 0.88);
      --glass-bg: rgba(255, 255, 255, 0.88);
      --glass-border: rgba(15, 23, 42, 0.11);
      --backdrop: rgba(15, 23, 42, 0.34);

      --border: rgba(15, 23, 42, 0.085);
      --border-subtle: rgba(15, 23, 42, 0.055);
      --border-strong: rgba(15, 23, 42, 0.16);
      --gridline: rgba(15, 23, 42, 0.07);

      --text: #0F172A;
      --text-2: #334155;
      --text-3: #64748B;

      /* Calm Clinical Teal */
      --teal: #0F766E;
      --teal-btn: #0F766E;
      --teal-btn-hover: #115E59;
      --teal-text: #0D5E58;
      --teal-soft: rgba(15, 118, 110, 0.08);
      --teal-wash: rgba(15, 118, 110, 0.045);
      --teal-band: rgba(15, 118, 110, 0.09);
      --teal-border: rgba(15, 118, 110, 0.24);

      /* Terracotta Coral (Clinical Flags / Fatigue Decay) */
      --coral: #C2410C;
      --coral-text: #9A3412;
      --coral-soft: rgba(194, 65, 12, 0.08);
      --coral-wash: rgba(194, 65, 12, 0.045);
      --coral-border: rgba(194, 65, 12, 0.24);

      /* Refined Clinical Amber (Watch / Swap / Load) */
      --amber: #B45309;
      --amber-text: #92400E;
      --amber-soft: rgba(180, 83, 9, 0.08);
      --amber-border: rgba(180, 83, 9, 0.25);

      /* Clinical Slate & Info */
      --info: #1D4ED8;
      --info-text: #1E40AF;
      --info-soft: rgba(29, 78, 216, 0.07);
      --info-border: rgba(29, 78, 216, 0.20);
      --slate-viz: #64748B;
      --slate-viz-soft: rgba(100, 116, 139, 0.18);

      /* High-Contrast Stacked Bar Fills (WCAG AA+ on #FFFFFF in Light & Dark) */
      --bar-hit: #0F766E;
      --bar-swap: #B45309;
      --bar-stale: #C2410C;
      --bar-guess: #526175;
      --bar-text: #FFFFFF;

      /* Lab Range Bar Tokens */
      --track-bg: #E8E5DC;
      --zone-bg: rgba(15, 118, 110, 0.16);
      --zone-edge: rgba(15, 118, 110, 0.42);
      --caution-bg: rgba(180, 83, 9, 0.12);

      /* Search Highlight */
      --hl-bg: #FEF08A;
      --hl-text: #0F172A;
      --hl-curr-bg: #F59E0B;
      --hl-curr-text: #FFFFFF;

      --err: #B91C1C;
      --err-soft: rgba(185, 28, 28, 0.08);
      --shadow-fig: 0 1px 2px rgba(15, 23, 42, 0.03), 0 10px 26px -14px rgba(15, 23, 42, 0.08);
      --shadow-card: 0 1px 2px rgba(15, 23, 42, 0.03), 0 6px 18px -12px rgba(15, 23, 42, 0.08);
      --shadow-gate: 0 24px 56px -18px rgba(15, 23, 42, 0.14), 0 1px 4px rgba(15, 23, 42, 0.06);
      --shadow-tip: 0 12px 30px -8px rgba(15, 23, 42, 0.20), 0 2px 6px rgba(15, 23, 42, 0.06);
      --shadow-dock: 0 12px 34px -8px rgba(15, 23, 42, 0.20), 0 2px 8px rgba(15, 23, 42, 0.08);
      --r-lg: 14px;
      --r-md: 10px;
      --r-sm: 7px;
      --r-xs: 5px;
    }

    html[data-theme="dark"] {
      color-scheme: dark;
      --bg: #0B0F17;
      --bg-dot: rgba(248, 250, 252, 0.045);
      --surface: #111722;
      --surface-2: #171F2E;
      --surface-3: #1E283A;
      --surface-hover: #243045;
      --chrome: rgba(11, 15, 23, 0.86);
      --glass-bg: rgba(17, 23, 34, 0.90);
      --glass-border: rgba(248, 250, 252, 0.13);
      --backdrop: rgba(2, 6, 23, 0.62);

      --border: rgba(248, 250, 252, 0.085);
      --border-subtle: rgba(248, 250, 252, 0.055);
      --border-strong: rgba(248, 250, 252, 0.18);
      --gridline: rgba(248, 250, 252, 0.075);

      --text: #F8FAFC;
      --text-2: #CBD5E1;
      --text-3: #94A3B8;

      --teal: #2DD4BF;
      --teal-btn: #0D9488;
      --teal-btn-hover: #0F766E;
      --teal-text: #5EEAD4;
      --teal-soft: rgba(45, 212, 191, 0.11);
      --teal-wash: rgba(45, 212, 191, 0.055);
      --teal-band: rgba(45, 212, 191, 0.10);
      --teal-border: rgba(45, 212, 191, 0.28);

      --coral: #FB7185;
      --coral-text: #FDA4AF;
      --coral-soft: rgba(251, 113, 133, 0.11);
      --coral-wash: rgba(251, 113, 133, 0.06);
      --coral-border: rgba(251, 113, 133, 0.28);

      --amber: #FBBF24;
      --amber-text: #FCD34D;
      --amber-soft: rgba(251, 191, 36, 0.11);
      --amber-border: rgba(251, 191, 36, 0.28);

      --info: #60A5FA;
      --info-text: #93C5FD;
      --info-soft: rgba(96, 165, 250, 0.11);
      --info-border: rgba(96, 165, 250, 0.26);
      --slate-viz: #94A3B8;
      --slate-viz-soft: rgba(148, 163, 184, 0.22);

      /* Saturated Dark-Mode Stacked Bar Fills with crisp white legibility */
      --bar-hit: #0D9488;
      --bar-swap: #B45309;
      --bar-stale: #BE123C;
      --bar-guess: #475569;
      --bar-text: #FFFFFF;

      --track-bg: #202B3D;
      --zone-bg: rgba(45, 212, 191, 0.18);
      --zone-edge: rgba(45, 212, 191, 0.45);
      --caution-bg: rgba(251, 191, 36, 0.14);

      --hl-bg: rgba(250, 204, 21, 0.28);
      --hl-text: #FEF9C3;
      --hl-curr-bg: #F59E0B;
      --hl-curr-text: #0B0F17;

      --err: #F87171;
      --err-soft: rgba(248, 113, 113, 0.12);
      --shadow-fig: 0 1px 2px rgba(0, 0, 0, 0.35), 0 12px 32px -12px rgba(0, 0, 0, 0.55);
      --shadow-card: 0 1px 2px rgba(0, 0, 0, 0.30), 0 8px 22px -12px rgba(0, 0, 0, 0.48);
      --shadow-gate: 0 28px 60px -14px rgba(0, 0, 0, 0.72);
      --shadow-tip: 0 12px 30px -6px rgba(0, 0, 0, 0.68);
      --shadow-dock: 0 14px 36px -6px rgba(0, 0, 0, 0.70);
    }

    *, *::before, *::after { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html { -webkit-text-size-adjust: 100%; overflow-x: clip; scroll-behavior: smooth; --col-w: 880px; }
    html[data-font="sm"] { font-size: 14.5px; }
    html[data-font="md"] { font-size: 16px; }
    html[data-font="lg"] { font-size: 17.8px; }
    html[data-width="wide"] { --col-w: 1040px; }
    html[data-tags="off"] .item-tags { display: none; }
    body {
      margin: 0;
      min-height: 100vh;
      overflow-x: clip;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
      font-size: 0.94rem;
      line-height: 1.62;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      transition: background-color 220ms var(--ease), color 220ms var(--ease);
    }
    html[dir="rtl"] body {
      font-family: var(--font-ar);
      line-height: 1.74;
    }
    body.has-overlay { overflow: hidden; }
    button, input, textarea { font: inherit; color: inherit; }
    button:focus-visible, input:focus-visible, textarea:focus-visible, a:focus-visible, [tabindex="0"]:focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }
    .nowrap-bdi { white-space: nowrap; }
    .ico-rtl-flip { display: inline-block; flex-shrink: 0; }
    html[dir="rtl"] .ico-rtl-flip { transform: scaleX(-1); }

    mark.hl {
      background: var(--hl-bg);
      color: var(--hl-text);
      border-radius: 3px;
      padding: 0 2px;
      font-weight: 600;
      transition: background-color 140ms ease, color 140ms ease, box-shadow 140ms ease;
    }
    mark.hl.is-current {
      background: var(--hl-curr-bg);
      color: var(--hl-curr-text);
      box-shadow: 0 0 0 2.5px var(--amber-soft), 0 0 0 1px var(--amber);
    }
    html[dir="rtl"] mark.hl { padding: 0 1px; border-radius: 2px; }

    /* =========================================================================
       ELEVATED PIN GATE
       ========================================================================= */
    .gate-wrap {
      position: relative;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px 16px;
      background:
        radial-gradient(circle at 50% 0%, var(--teal-soft) 0%, transparent 50%),
        radial-gradient(var(--bg-dot) 1px, transparent 1px),
        var(--bg);
      background-size: 100% 100%, 22px 22px, 100% 100%;
    }
    .gate-theme-btn {
      position: fixed;
      top: 16px;
      inset-inline-end: 16px;
      z-index: 10;
    }
    .gate-card {
      position: relative;
      width: 100%;
      max-width: 404px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-top: 3px solid var(--teal);
      border-radius: 16px;
      box-shadow: var(--shadow-gate);
      padding: 36px 30px 28px;
      text-align: center;
      transition: background-color 220ms var(--ease), border-color 220ms var(--ease), box-shadow 220ms var(--ease);
    }
    .gate-card.shake { animation: shake 0.36s ease; }
    .gate-mark {
      position: relative;
      width: 52px;
      height: 52px;
      margin: 0 auto 18px;
      border-radius: 14px;
      background: linear-gradient(145deg, var(--teal-soft), var(--surface-2));
      border: 1px solid var(--teal-border);
      color: var(--teal-text);
      display: grid;
      place-items: center;
      box-shadow: 0 4px 14px -6px var(--teal-border);
    }
    .gate-title { margin: 0 0 6px; font-family: var(--font-display); font-size: 1.04rem; font-weight: 700; color: var(--text); letter-spacing: -0.015em; }
    .gate-sub { margin: 0 0 22px; font-size: 0.8rem; color: var(--text-3); }
    .pin-wrap { position: relative; margin-bottom: 12px; }
    .pin-input {
      width: 100%;
      height: 46px;
      padding: 0 44px;
      border-radius: 9px;
      border: 1px solid var(--border-strong);
      background: var(--bg);
      font-family: var(--font-mono);
      font-size: 1.08rem;
      letter-spacing: 0.24em;
      text-align: center;
      outline: none;
      transition: border-color 180ms var(--ease), box-shadow 180ms var(--ease), background-color 220ms var(--ease);
    }
    .pin-input:focus { border-color: var(--teal); box-shadow: 0 0 0 3.5px var(--teal-soft); }
    .pin-eye {
      position: absolute;
      top: 50%;
      inset-inline-end: 8px;
      transform: translateY(-50%);
      width: 32px;
      height: 32px;
      border: 0;
      border-radius: 7px;
      background: transparent;
      color: var(--text-3);
      display: grid;
      place-items: center;
      cursor: pointer;
      transition: background-color 160ms var(--ease), color 160ms var(--ease);
    }
    .pin-eye:hover { background: var(--surface-2); color: var(--text); }
    .gate-btn {
      width: 100%;
      height: 45px;
      border: 0;
      border-radius: 9px;
      background: var(--teal-btn);
      color: #FFFFFF;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 14px -6px rgba(15, 118, 110, 0.55);
      transition: background-color 180ms var(--ease), opacity 180ms var(--ease), transform 140ms var(--ease), box-shadow 180ms var(--ease);
    }
    .gate-btn:hover { background: var(--teal-btn-hover); box-shadow: 0 6px 18px -6px rgba(15, 118, 110, 0.65); }
    .gate-btn:active { transform: scale(0.99); }
    .gate-btn:disabled { opacity: 0.72; cursor: wait; }
    .gate-spin {
      width: 15px;
      height: 15px;
      border-radius: 999px;
      border: 2px solid rgba(255, 255, 255, 0.35);
      border-top-color: #FFFFFF;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .gate-err {
      min-height: 1.3rem;
      margin-top: 11px;
      font-size: 0.79rem;
      font-weight: 600;
      color: var(--err);
    }
    .gate-err:not(:empty) {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 999px;
      background: var(--err-soft);
    }
    .gate-foot {
      margin-top: 18px;
      padding-top: 14px;
      border-top: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-family: var(--font-mono);
      font-size: 0.67rem;
      font-weight: 600;
      letter-spacing: 0.03em;
      color: var(--text-3);
    }
    .gate-dot {
      width: 6px;
      height: 6px;
      border-radius: 999px;
      background: var(--teal);
      opacity: 0.85;
    }
    @keyframes shake { 0%, 100% { transform: translateX(0); } 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }

    /* =========================================================================
       READING PROGRESS HAIRLINE (HEADER BOTTOM ON DESKTOP, FIXED TOP ON MOBILE)
       ========================================================================= */
    .read-progress {
      position: absolute;
      left: 0;
      right: 0;
      bottom: -1px;
      height: 2.5px;
      background: transparent;
      overflow: hidden;
      pointer-events: none;
    }
    .read-progress-fill {
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, var(--teal), var(--teal-text));
      transform: scaleX(0);
      transform-origin: left center;
      will-change: transform;
      transition: transform 80ms linear;
    }
    html[dir="rtl"] .read-progress-fill {
      transform-origin: right center;
      background: linear-gradient(270deg, var(--teal), var(--teal-text));
    }
    .mobile-top-progress {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 2.5px;
      z-index: 60;
      pointer-events: none;
      background: transparent;
    }

    /* =========================================================================
       SLEEK 1-ROW STICKY GLASS HEADER (STRICTLY 1 ROW ON DESKTOP >= 1024px)
       ========================================================================= */
    .sticky-chrome {
      position: sticky;
      top: 0;
      z-index: 40;
      background: var(--chrome);
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(18px) saturate(165%);
      -webkit-backdrop-filter: blur(18px) saturate(165%);
      transition: background-color 220ms var(--ease), border-color 220ms var(--ease), box-shadow 220ms var(--ease);
    }
    .sticky-chrome.is-scrolled {
      box-shadow: 0 4px 18px -12px rgba(15, 23, 42, 0.16);
    }
    .chrome-inner {
      max-width: 1280px;
      margin: 0 auto;
      padding: 0 20px;
      min-height: 54px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .nav-links {
      display: flex;
      align-items: center;
      gap: 2px;
      min-width: 0;
      flex: 1 1 auto;
      overflow-x: auto;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }
    .nav-links::-webkit-scrollbar { display: none; }
    .nav-links.fade-right {
      -webkit-mask-image: linear-gradient(to right, #000 0%, #000 calc(100% - 28px), transparent 100%);
      mask-image: linear-gradient(to right, #000 0%, #000 calc(100% - 28px), transparent 100%);
    }
    .nav-links.fade-left {
      -webkit-mask-image: linear-gradient(to right, transparent 0%, #000 28px, #000 100%);
      mask-image: linear-gradient(to right, transparent 0%, #000 28px, #000 100%);
    }
    .nav-links.fade-both {
      -webkit-mask-image: linear-gradient(to right, transparent 0%, #000 24px, #000 calc(100% - 24px), transparent 100%);
      mask-image: linear-gradient(to right, transparent 0%, #000 24px, #000 calc(100% - 24px), transparent 100%);
    }
    .nav-link {
      border: 1px solid transparent;
      background: transparent;
      color: var(--text-3);
      padding: 5px 7px;
      border-radius: 7px;
      font-size: 12.2px;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: background-color 160ms var(--ease), color 160ms var(--ease), border-color 160ms var(--ease);
    }
    .nav-num {
      font-family: var(--font-mono);
      font-size: 10.4px;
      font-weight: 700;
      opacity: 0.58;
      font-variant-numeric: tabular-nums;
      transition: opacity 160ms ease, color 160ms ease;
    }
    .nav-link:hover { background: var(--surface-2); color: var(--text); }
    .nav-link:hover .nav-num { opacity: 0.9; }
    .nav-link.is-active {
      background: var(--teal-soft);
      border-color: var(--teal-border);
      color: var(--teal-text);
    }
    .nav-link.is-active .nav-num { opacity: 1; color: var(--teal); }
    .nav-link.is-dimmed { opacity: 0.48; }
    .nav-dot {
      width: 5px;
      height: 5px;
      border-radius: 999px;
      flex-shrink: 0;
      display: inline-block;
    }
    .nav-dot.tone-alert { background: var(--coral); }
    .nav-dot.tone-warn { background: var(--amber); }

    .chrome-controls {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    /* Compact Inline Live Search + Quick Filter Popover + Match Stepper */
    .search-shell {
      position: relative;
      flex: 0 1 188px;
      width: 188px;
    }
    @media (min-width: 1320px) {
      .search-shell { flex: 0 1 214px; width: 214px; }
    }
    .search-box {
      display: flex;
      align-items: center;
      width: 100%;
      height: 31px;
      padding: 0 6px 0 8px;
      gap: 4px;
      border-radius: 8px;
      background: var(--surface);
      border: 1px solid var(--border);
      transition: border-color 160ms var(--ease), box-shadow 160ms var(--ease), background-color 220ms var(--ease);
    }
    html[dir="rtl"] .search-box { padding: 0 8px 0 6px; }
    .search-box:focus-within {
      border-color: var(--teal);
      box-shadow: 0 0 0 2.5px var(--teal-soft);
    }
    .search-ico { color: var(--text-3); display: inline-flex; flex-shrink: 0; }
    .search-input {
      border: 0;
      background: transparent;
      outline: none;
      width: 100%;
      min-width: 0;
      font-size: 12.2px;
      color: var(--text);
      padding: 0;
    }
    .search-input:focus, .search-input:focus-visible { outline: none; box-shadow: none; }
    .search-input::placeholder { color: var(--text-3); }
    .search-input::-webkit-search-cancel-button { -webkit-appearance: none; appearance: none; }
    .search-kbd {
      font-family: var(--font-mono);
      font-size: 0.63rem;
      font-weight: 600;
      color: var(--text-3);
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 0.5px 4.5px;
      line-height: 1.3;
      flex-shrink: 0;
    }
    .search-count {
      font-family: var(--font-mono);
      font-size: 0.65rem;
      font-weight: 700;
      color: var(--teal-text);
      background: var(--teal-soft);
      border: 1px solid var(--teal-border);
      border-radius: 999px;
      padding: 1px 5.5px;
      white-space: nowrap;
      flex-shrink: 0;
      font-variant-numeric: tabular-nums;
    }
    .search-count.is-zero {
      color: var(--amber-text);
      background: var(--amber-soft);
      border-color: var(--amber-border);
    }
    .search-step-group {
      display: inline-flex;
      align-items: center;
      gap: 1px;
      flex-shrink: 0;
    }
    .search-step, .search-clear {
      border: 0;
      background: transparent;
      color: var(--text-3);
      width: 19px;
      height: 19px;
      border-radius: 5px;
      display: inline-grid;
      place-items: center;
      cursor: pointer;
      flex-shrink: 0;
      padding: 0;
      transition: background-color 140ms ease, color 140ms ease;
    }
    .search-step:hover, .search-clear:hover { background: var(--surface-2); color: var(--text); }

    .quick-pop {
      position: absolute;
      top: calc(100% + 7px);
      inset-inline-start: 0;
      min-width: 248px;
      max-width: min(320px, 92vw);
      padding: 9px 10px 10px;
      border-radius: 10px;
      background: var(--surface);
      border: 1px solid var(--border-strong);
      box-shadow: var(--shadow-tip);
      z-index: 60;
      animation: popIn 140ms var(--ease) both;
    }
    @keyframes popIn {
      from { opacity: 0; transform: translateY(-4px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .quick-pop-lbl {
      font-size: 0.65rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-3);
      margin-bottom: 6px;
    }
    html[dir="rtl"] .quick-pop-lbl { text-transform: none; letter-spacing: 0; font-size: 0.72rem; }
    .quick-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
    }
    .quick-chip {
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-2);
      border-radius: 999px;
      padding: 2.5px 9px;
      font-family: var(--font-mono);
      font-size: 0.7rem;
      font-weight: 600;
      cursor: pointer;
      transition: border-color 140ms ease, background-color 140ms ease, color 140ms ease, transform 120ms ease;
    }
    .quick-chip:hover {
      border-color: var(--teal-border);
      background: var(--teal-soft);
      color: var(--teal-text);
      transform: translateY(-1px);
    }

    /* Segmented Controls (Language + Density) */
    .seg-group { display: flex; align-items: center; gap: 5px; }
    .seg-ctrl {
      position: relative;
      display: inline-flex;
      align-items: center;
      padding: 2px;
      border-radius: 8px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      transition: background-color 220ms var(--ease), border-color 220ms var(--ease);
    }
    .seg-pill {
      position: absolute;
      top: 2px;
      bottom: 2px;
      left: 0;
      width: 0;
      border-radius: 6px;
      background: var(--teal-btn);
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.14);
      opacity: 0;
      pointer-events: none;
      will-change: transform, width;
      transition: transform 200ms var(--ease), width 200ms var(--ease), background-color 220ms var(--ease), opacity 140ms ease;
    }
    .seg-density .seg-pill {
      background: var(--surface);
      border: 1px solid var(--teal-border);
      box-shadow: 0 1px 3px rgba(15, 118, 110, 0.12);
    }
    .seg-btn {
      position: relative;
      z-index: 1;
      border: 0;
      background: transparent;
      color: var(--text-2);
      padding: 3.5px 8px;
      border-radius: 6px;
      font-size: 11.7px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      line-height: 1.35;
      transition: color 160ms var(--ease);
    }
    .seg-btn:hover { color: var(--text); }
    .seg-lang .seg-btn.is-active,
    .seg-lang .seg-btn.is-active:hover { color: #FFFFFF; }
    .seg-density .seg-btn.is-active,
    .seg-density .seg-btn.is-active:hover { color: var(--teal-text); font-weight: 700; }

    .util-btns { display: flex; align-items: center; gap: 4px; }
    .ico-btn {
      position: relative;
      width: 31px;
      height: 31px;
      padding: 0;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-2);
      display: inline-grid;
      place-items: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: background-color 160ms var(--ease), border-color 160ms var(--ease), color 160ms var(--ease), transform 120ms ease;
    }
    .ico-btn:hover { background: var(--surface-2); border-color: var(--border-strong); color: var(--text); }
    .ico-btn:active { transform: scale(0.96); }
    .ico-btn.is-active {
      background: var(--teal-soft);
      border-color: var(--teal-border);
      color: var(--teal-text);
    }

    /* Aa Reading Controls Button & Popover */
    .read-shell { position: relative; }
    .read-btn-lbl {
      font-family: var(--font-display);
      font-size: 12.2px;
      font-weight: 750;
      letter-spacing: -0.03em;
      line-height: 1;
    }
    .read-pop {
      position: absolute;
      top: calc(100% + 8px);
      inset-inline-end: 0;
      width: 264px;
      max-width: calc(100vw - 24px);
      padding: 13px 14px 12px;
      border-radius: 12px;
      background: var(--surface);
      border: 1px solid var(--border-strong);
      box-shadow: var(--shadow-tip);
      z-index: 65;
      animation: popIn 140ms var(--ease) both;
      font-size: 12.5px;
    }
    .read-pop-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }
    .read-pop-title {
      font-size: 11px;
      font-weight: 750;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-3);
    }
    html[dir="rtl"] .read-pop-title { text-transform: none; letter-spacing: 0; font-size: 12px; }
    .read-row { margin-bottom: 10px; }
    .read-row:last-child { margin-bottom: 0; }
    .read-lbl {
      display: block;
      font-size: 11.5px;
      font-weight: 600;
      color: var(--text-2);
      margin-bottom: 5px;
    }
    .read-seg {
      display: grid;
      grid-auto-flow: column;
      grid-auto-columns: 1fr;
      gap: 3px;
      padding: 2.5px;
      border-radius: 8px;
      background: var(--surface-2);
      border: 1px solid var(--border);
    }
    .read-opt {
      border: 1px solid transparent;
      background: transparent;
      color: var(--text-2);
      border-radius: 6px;
      padding: 4px 6px;
      font-size: 11.5px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: background-color 140ms ease, color 140ms ease, border-color 140ms ease;
    }
    .read-opt:hover { color: var(--text); }
    .read-opt.is-active {
      background: var(--surface);
      border-color: var(--teal-border);
      color: var(--teal-text);
      font-weight: 700;
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.08);
    }
    .read-switch-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding-top: 8px;
      border-top: 1px solid var(--border-subtle);
      cursor: pointer;
    }
    .read-switch-lbl { font-size: 11.8px; font-weight: 600; color: var(--text-2); }
    .read-switch {
      position: relative;
      width: 34px;
      height: 19px;
      border-radius: 999px;
      border: 1px solid var(--border-strong);
      background: var(--surface-3);
      padding: 0;
      cursor: pointer;
      flex-shrink: 0;
      transition: background-color 160ms ease, border-color 160ms ease;
    }
    .read-switch::after {
      content: "";
      position: absolute;
      top: 2px;
      left: 2px;
      width: 13px;
      height: 13px;
      border-radius: 999px;
      background: #FFFFFF;
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.25);
      transition: transform 160ms var(--ease);
    }
    .read-switch[aria-checked="true"] {
      background: var(--teal-btn);
      border-color: var(--teal-btn);
    }
    .read-switch[aria-checked="true"]::after { transform: translateX(15px); }

    /* Notes Trigger Button Badge */
    .notes-badge {
      position: absolute;
      top: -5px;
      inset-inline-end: -5px;
      min-width: 16px;
      height: 16px;
      padding: 0 4px;
      border-radius: 999px;
      background: var(--teal-btn);
      color: #FFFFFF;
      font-family: var(--font-mono);
      font-size: 9.5px;
      font-weight: 700;
      line-height: 16px;
      text-align: center;
      border: 1.5px solid var(--bg);
      pointer-events: none;
      font-variant-numeric: tabular-nums;
    }

    /* =========================================================================
       AMBIENT DESKTOP EDITORIAL MARGIN RAIL (>= 1280px)
       ========================================================================= */
    .margin-rail {
      display: none;
      position: fixed;
      top: 96px;
      inset-inline-start: max(16px, calc(50% - 440px - 186px));
      width: 158px;
      z-index: 30;
      transition: opacity 180ms ease;
    }
    @media (min-width: 1280px) {
      .margin-rail { display: flex; flex-direction: column; gap: 10px; }
      html[data-width="wide"] .margin-rail { display: none; }
    }
    @media (min-width: 1460px) {
      html[data-width="wide"] .margin-rail {
        display: flex;
        inset-inline-start: max(14px, calc(50% - 520px - 182px));
      }
    }
    .rail-kicker-row {
      display: flex;
      align-items: center;
      padding-inline: 12px 4px;
    }
    .rail-kicker {
      font-size: 0.64rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-3);
      opacity: 0.85;
    }
    html[dir="rtl"] .rail-kicker { text-transform: none; letter-spacing: 0; font-size: 0.72rem; }
    .rail-list {
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 2px;
      border-inline-start: 1.5px solid var(--border);
      padding-inline-start: 8px;
    }
    .rail-progress-track {
      position: absolute;
      inset-inline-start: -1.5px;
      top: 0;
      bottom: 0;
      width: 1.5px;
      pointer-events: none;
      overflow: hidden;
    }
    .rail-progress-fill {
      width: 100%;
      height: 100%;
      background: var(--teal);
      opacity: 0.45;
      transform: scaleY(0);
      transform-origin: top center;
      will-change: transform;
      transition: transform 100ms linear;
    }
    .rail-item {
      position: relative;
      border: 0;
      background: transparent;
      color: var(--text-3);
      text-align: start;
      padding: 5px 8px;
      border-radius: 7px;
      font-size: 0.75rem;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 7px;
      transition: color 160ms var(--ease), background-color 160ms var(--ease);
    }
    .rail-item::before {
      content: "";
      position: absolute;
      inset-inline-start: -9.5px;
      top: 6px;
      bottom: 6px;
      width: 2.5px;
      border-radius: 999px;
      background: var(--teal);
      opacity: 0;
      transform: scaleY(0.4);
      transition: opacity 180ms var(--ease), transform 180ms var(--ease);
    }
    .rail-item:hover { color: var(--text); background: var(--surface-2); }
    .rail-item.is-active {
      color: var(--teal-text);
      font-weight: 700;
      background: var(--teal-soft);
    }
    .rail-item.is-active::before { opacity: 1; transform: scaleY(1); }
    .rail-num {
      font-family: var(--font-mono);
      font-size: 0.65rem;
      font-weight: 700;
      opacity: 0.65;
      font-variant-numeric: tabular-nums;
      flex-shrink: 0;
    }
    .rail-item.is-active .rail-num { opacity: 1; color: var(--teal); }
    .rail-lbl { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1 1 auto; }
    .rail-tools {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 4px;
      padding-top: 8px;
      border-top: 1px solid var(--border-subtle);
      padding-inline-start: 4px;
    }
    .rail-tool-btn {
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-3);
      min-height: 27px;
      padding: 4px 8px;
      border-radius: 7px;
      font-size: 0.69rem;
      font-weight: 600;
      line-height: 1.25;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      transition: color 150ms ease, border-color 150ms ease, background-color 150ms ease, opacity 180ms ease;
    }
    .rail-tool-btn:hover { color: var(--text); border-color: var(--border-strong); background: var(--surface-2); }
    .rail-tool-btn.is-dim { opacity: 0.38; pointer-events: none; }
    .rail-tool-btn.is-accent {
      width: 100%;
      justify-content: center;
      color: var(--teal-text);
      border-color: var(--teal-border);
      background: var(--teal-wash);
    }
    .rail-tool-btn.is-accent:hover { background: var(--teal-soft); }

    /* =========================================================================
       SINGLE CENTERED EDITORIAL COLUMN (STANDARD 880px / WIDE 1040px)
       ========================================================================= */
    .brief-main {
      max-width: var(--col-w);
      margin: 0 auto;
      padding: 26px 28px 80px;
      transition: max-width 200ms var(--ease), margin 220ms var(--ease);
    }
    @keyframes briefFade {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .brief-main.is-swapping { animation: briefFade 220ms var(--ease) both; }

    @keyframes secPulse {
      0% { box-shadow: 0 0 0 6px var(--teal-soft); }
      100% { box-shadow: 0 0 0 0 transparent; }
    }
    .is-pulsed { animation: secPulse 950ms var(--ease); border-radius: var(--r-md); }

    /* Minimal Editorial Clinical Dossier Masthead */
    .masthead {
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 18px;
    }
    .masthead-top {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 6px 16px;
      margin-bottom: 4px;
    }
    .doc-title {
      margin: 0;
      font-family: var(--font-display);
      font-size: 1.78rem;
      font-weight: 750;
      letter-spacing: -0.028em;
      line-height: 1.16;
      color: var(--text);
    }
    html[dir="rtl"] .doc-title { font-family: var(--font-ar); letter-spacing: 0; font-size: 1.72rem; font-weight: 700; }
    .doc-date {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--teal-text);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 2.5px 10px;
      letter-spacing: 0.01em;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }
    html[dir="rtl"] .doc-date { font-family: var(--font-ar); letter-spacing: 0; }
    .doc-sub {
      margin: 0 0 12px;
      font-size: 0.92rem;
      color: var(--text-3);
      font-weight: 400;
    }
    .profile-bar {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
    }
    .profile-chip {
      display: inline-block;
      padding: 3px 9.5px;
      border-radius: 7px;
      background: var(--surface);
      border: 1px solid var(--border);
      font-size: 0.79rem;
      font-weight: 600;
      color: var(--text-2);
      font-variant-numeric: tabular-nums;
      line-height: 1.35;
    }
    .profile-line-print { display: none; }

    /* =========================================================================
       CLINICAL AT-A-GLANCE TRIAGE STRIP + FOCUS LENS BAR
       ========================================================================= */
    .triage-strip {
      margin-bottom: 14px;
    }
    .triage-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px 14px;
      margin-bottom: 9px;
    }
    .triage-head-l {
      display: flex;
      align-items: baseline;
      flex-wrap: wrap;
      gap: 4px 10px;
    }
    .triage-head-l .kicker { margin: 0; }
    .triage-sub {
      font-size: 0.75rem;
      color: var(--text-3);
    }

    /* Unified Focus Lens & Expand Control Bar */
    .lens-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px 12px;
      padding: 10px 0 14px;
      margin-bottom: 14px;
      border-bottom: 1px solid var(--border);
    }
    .lens-pills {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 5px;
    }
    .lens-pill {
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-2);
      border-radius: 999px;
      padding: 4px 11px;
      font-size: 0.74rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: background-color 150ms ease, border-color 150ms ease, color 150ms ease, transform 120ms ease;
    }
    .lens-pill:hover { border-color: var(--border-strong); color: var(--text); background: var(--surface-2); }
    .lens-pill:active { transform: scale(0.98); }
    .lens-pill.is-active {
      background: var(--teal-btn);
      border-color: var(--teal-btn);
      color: #FFFFFF;
      font-weight: 700;
    }
    .lens-pill.is-safety.is-active {
      background: var(--amber);
      border-color: var(--amber);
      color: #FFFFFF;
    }
    .lens-pill.is-annot {
      border-color: var(--amber-border);
      background: var(--amber-soft);
      color: var(--amber-text);
    }
    .lens-pill.is-annot.is-active {
      background: var(--amber);
      border-color: var(--amber);
      color: #FFFFFF;
    }
    .lens-dot {
      width: 6px;
      height: 6px;
      border-radius: 999px;
      background: var(--amber);
      flex-shrink: 0;
    }
    .lens-pill.is-active .lens-dot { background: #FFFFFF; }
    .brief-mode-bar {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      flex-shrink: 0;
    }
    .brief-counter {
      font-family: var(--font-mono);
      font-size: 0.69rem;
      font-weight: 600;
      color: var(--text-3);
      font-variant-numeric: tabular-nums;
    }
    html[dir="rtl"] .brief-counter { font-family: var(--font-ar); }
    .brief-toggle-all {
      border: 1px solid var(--teal-border);
      background: var(--teal-wash);
      color: var(--teal-text);
      font-size: 0.72rem;
      font-weight: 700;
      padding: 3.5px 10.5px;
      border-radius: 999px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: background-color 150ms ease, border-color 150ms ease, transform 120ms ease;
    }
    .brief-toggle-all:hover { background: var(--teal-soft); border-color: var(--teal); }
    .brief-toggle-all:active { transform: scale(0.98); }

    .triage-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
    }
    .triage-card {
      position: relative;
      text-align: start;
      min-width: 0;
      background: var(--surface);
      border: 1px solid var(--border);
      border-top: 2.5px solid var(--teal);
      border-radius: var(--r-md);
      padding: 11px 12px 10px;
      box-shadow: var(--shadow-card);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      gap: 7px;
      transition: border-color 160ms var(--ease), transform 160ms var(--ease), background-color 160ms var(--ease), box-shadow 160ms var(--ease);
    }
    .triage-card:hover {
      transform: translateY(-1.5px);
      border-color: var(--border-strong);
      box-shadow: var(--shadow-fig);
    }
    .triage-card:active { transform: translateY(0); }
    .triage-card.tone-warn { border-top-color: var(--amber); }
    .triage-card.tone-warn:hover { border-color: var(--amber-border); border-top-color: var(--amber); }
    .triage-card.tone-info { border-top-color: var(--info); }
    .triage-card.tone-info:hover { border-color: var(--info-border); border-top-color: var(--info); }
    .triage-card.tone-alert { border-top-color: var(--coral); background: linear-gradient(180deg, var(--coral-wash) 0%, var(--surface) 44%); }
    .triage-card.tone-alert:hover { border-color: var(--coral-border); border-top-color: var(--coral); }
    .triage-card.tone-teal { border-top-color: var(--teal); }
    .triage-card.tone-teal:hover { border-color: var(--teal-border); border-top-color: var(--teal); }

    .triage-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }
    .triage-lbl {
      font-size: 0.67rem;
      font-weight: 750;
      text-transform: uppercase;
      letter-spacing: 0.055em;
      line-height: 1.25;
    }
    html[dir="rtl"] .triage-lbl { text-transform: none; letter-spacing: 0; font-size: 0.74rem; font-weight: 700; }
    .triage-card.tone-warn .triage-lbl { color: var(--amber-text); }
    .triage-card.tone-info .triage-lbl { color: var(--info-text); }
    .triage-card.tone-alert .triage-lbl { color: var(--coral-text); }
    .triage-card.tone-teal .triage-lbl { color: var(--teal-text); }
    .triage-arrow {
      color: var(--text-3);
      opacity: 0.55;
      display: inline-flex;
      flex-shrink: 0;
      transition: transform 160ms var(--ease), opacity 160ms ease, color 160ms ease;
    }
    .triage-card:hover .triage-arrow { opacity: 1; color: var(--text); transform: translateX(2px); }
    html[dir="rtl"] .triage-card:hover .triage-arrow { transform: translateX(-2px); }

    .triage-lines {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 3.5px;
    }
    .triage-line {
      font-size: 0.74rem;
      line-height: 1.36;
      color: var(--text-2);
      font-variant-numeric: tabular-nums;
    }
    .triage-line:first-child {
      color: var(--text);
      font-weight: 600;
    }

    /* Editorial Sections (01 -> 06) */
    .ed-section {
      padding-top: 30px;
      margin-top: 30px;
      border-top: 1px solid var(--border);
      scroll-margin-top: 72px;
    }
    .brief-root.is-brief .ed-section {
      padding-top: 26px;
      margin-top: 26px;
    }
    .ed-section.is-first {
      padding-top: 0;
      margin-top: 0;
      border-top: 0;
    }
    .sec-head {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 0 0 15px;
    }
    .sec-num {
      font-family: var(--font-mono);
      font-size: 0.73rem;
      font-weight: 700;
      color: var(--teal-text);
      background: var(--teal-soft);
      border: 1px solid var(--teal-border);
      border-radius: 7px;
      padding: 2px 7.5px;
      letter-spacing: 0.04em;
      font-variant-numeric: tabular-nums;
      flex-shrink: 0;
      line-height: 1.3;
    }
    .sec-title {
      margin: 0;
      font-family: var(--font-display);
      font-size: 1.24rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.25;
      color: var(--text);
    }
    html[dir="rtl"] .sec-title { font-family: var(--font-ar); letter-spacing: 0; font-size: 1.22rem; }
    .sec-rule {
      flex: 1 1 auto;
      height: 1px;
      background: linear-gradient(90deg, var(--border), transparent);
      min-width: 14px;
    }
    html[dir="rtl"] .sec-rule { background: linear-gradient(270deg, var(--border), transparent); }
    .sec-badge {
      font-family: var(--font-mono);
      font-size: 0.68rem;
      font-weight: 700;
      color: var(--teal-text);
      background: var(--teal-soft);
      border: 1px solid var(--teal-border);
      border-radius: 999px;
      padding: 2px 8.5px;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }
    .sec-expand-btn {
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-3);
      font-size: 0.7rem;
      font-weight: 600;
      padding: 2.5px 9px;
      border-radius: 999px;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: background-color 140ms ease, border-color 140ms ease, color 140ms ease;
    }
    .sec-expand-btn:hover { background: var(--teal-soft); border-color: var(--teal-border); color: var(--teal-text); }
    .sec-expand-btn.is-all-open { background: var(--teal-wash); border-color: var(--teal-border); color: var(--teal-text); }
    .sec-top-mini {
      border: 0;
      background: transparent;
      color: var(--text-3);
      width: 26px;
      height: 26px;
      border-radius: 6px;
      display: inline-grid;
      place-items: center;
      cursor: pointer;
      opacity: 0.45;
      flex-shrink: 0;
      transition: opacity 150ms ease, background-color 150ms ease, color 150ms ease;
    }
    .ed-section:hover .sec-top-mini,
    .sec-top-mini:focus-visible { opacity: 1; }
    .sec-top-mini:hover { background: var(--surface-2); color: var(--teal-text); }

    .kicker {
      margin: 0 0 9px;
      font-size: 0.71rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.075em;
      color: var(--text-3);
    }
    html[dir="rtl"] .kicker { text-transform: none; letter-spacing: 0; font-size: 0.78rem; }

    /* Lead Prose & Smooth Progressive-Disclosure Accordions */
    .lead-prose {
      margin: 0 0 14px;
      font-size: 0.93rem;
      color: var(--text-2);
      line-height: 1.6;
    }
    html[dir="rtl"] .lead-prose { line-height: 1.72; }
    .sub-prose {
      margin: 0 0 18px;
      font-size: 0.89rem;
      color: var(--text-2);
      line-height: 1.6;
    }
    html[dir="rtl"] .sub-prose { line-height: 1.72; }

    .detail-collapse {
      display: grid;
      grid-template-rows: 1fr;
      opacity: 1;
      transition: grid-template-rows 240ms var(--ease), opacity 200ms var(--ease);
    }
    .detail-inner {
      overflow: hidden;
      min-height: 0;
    }
    .brief-root.is-brief .detail-collapse {
      grid-template-rows: 0fr;
      opacity: 0;
    }
    .brief-root.is-brief .expandable.is-open .detail-collapse,
    .brief-root.is-brief .expandable.is-search-open .detail-collapse {
      grid-template-rows: 1fr;
      opacity: 1;
    }

    .detail-body {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px dashed var(--border);
    }
    .detail-points {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .detail-point {
      position: relative;
      padding-inline-start: 13px;
      font-size: 0.835rem;
      color: var(--text-2);
      line-height: 1.56;
    }
    html[dir="rtl"] .detail-point { line-height: 1.68; }
    .detail-point::before {
      content: "";
      position: absolute;
      inset-inline-start: 0;
      top: 0.62em;
      width: 4.5px;
      height: 4.5px;
      border-radius: 999px;
      background: var(--teal);
      opacity: 0.72;
    }
    .expandable.tone-alert .detail-point::before { background: var(--coral); }
    .safety-card.sev-warn .detail-point::before { background: var(--amber); }
    .safety-card.sev-info .detail-point::before { background: var(--info); }
    .dp-lbl {
      font-weight: 700;
      color: var(--text);
    }

    .brief-root.is-brief .expandable[data-exp-card] {
      cursor: pointer;
    }
    .brief-root.is-brief .expandable.is-open[data-exp-card] {
      border-color: var(--teal-border);
      box-shadow: var(--shadow-fig);
    }
    .brief-root.is-brief .expandable.tone-alert.is-open[data-exp-card] {
      border-color: var(--coral-border);
    }
    .brief-root.is-brief .safety-card.sev-warn.is-open[data-exp-card] {
      border-color: var(--amber-border);
    }

    .item-expand {
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text-3);
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 0.69rem;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 3.5px;
      cursor: pointer;
      flex-shrink: 0;
      white-space: nowrap;
      transition: background-color 140ms ease, border-color 140ms ease, color 140ms ease;
    }
    .expandable:hover .item-expand,
    .item-expand:hover {
      background: var(--teal-soft);
      border-color: var(--teal-border);
      color: var(--teal-text);
    }
    .expandable.is-open .item-expand {
      background: var(--teal-soft);
      border-color: var(--teal-border);
      color: var(--teal-text);
    }
    .expandable.tone-alert:hover .item-expand,
    .expandable.tone-alert.is-open .item-expand {
      background: var(--coral-soft);
      border-color: var(--coral-border);
      color: var(--coral-text);
    }
    .item-expand svg { transition: transform 200ms var(--ease); }
    .expandable.is-open .item-expand svg { transform: rotate(180deg); }

    /* =========================================================================
       SECTION 01: PRIORITIES
       ========================================================================= */
    .chief-block {
      padding: 13px 17px;
      border-inline-start: 3px solid var(--teal);
      background: linear-gradient(90deg, var(--teal-wash) 0%, transparent 100%);
      border-radius: 0 var(--r-md) var(--r-md) 0;
      margin-bottom: 20px;
    }
    html[dir="rtl"] .chief-block {
      background: linear-gradient(270deg, var(--teal-wash) 0%, transparent 100%);
      border-radius: var(--r-md) 0 0 var(--r-md);
    }
    .chief-text {
      margin: 0;
      font-size: 0.97rem;
      font-weight: 500;
      color: var(--text);
      line-height: 1.62;
    }
    html[dir="rtl"] .chief-text { line-height: 1.74; }

    .goals-block { margin-bottom: 20px; }
    .goals-list {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }
    .goal-row {
      display: flex;
      flex-direction: column;
      gap: 5px;
      padding: 12px 13px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r-md);
      box-shadow: var(--shadow-card);
      scroll-margin-top: 78px;
      transition: background-color 160ms var(--ease), border-color 160ms var(--ease), box-shadow 160ms var(--ease);
    }
    .goal-row:hover { border-color: var(--border-strong); }
    .goal-top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 1px;
    }
    .goal-idx {
      width: 21px;
      height: 21px;
      border-radius: 6px;
      background: var(--teal-soft);
      border: 1px solid var(--teal-border);
      display: inline-grid;
      place-items: center;
      font-family: var(--font-mono);
      font-size: 0.69rem;
      font-weight: 700;
      color: var(--teal-text);
      font-variant-numeric: tabular-nums;
      flex-shrink: 0;
    }
    .goal-body { min-width: 0; }
    .goal-title { display: block; font-size: 0.87rem; font-weight: 700; color: var(--text); line-height: 1.34; margin-bottom: 3px; }
    .goal-brief { margin: 0; font-size: 0.82rem; color: var(--text-2); line-height: 1.5; }
    .goal-detail { margin: 0; font-size: 0.8rem; color: var(--text-3); line-height: 1.5; }

    /* =========================================================================
       INLINE CLINICIAN PIN & COMMENT CONTROLS (QUIET AT REST, INSTANT ON FOCUS)
       ========================================================================= */
    .card-tools {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
    }
    .card-act-btn {
      width: 24px;
      height: 24px;
      padding: 0;
      border-radius: 6px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--text-3);
      display: inline-grid;
      place-items: center;
      cursor: pointer;
      opacity: 0.42;
      flex-shrink: 0;
      transition: opacity 150ms ease, background-color 140ms ease, border-color 140ms ease, color 140ms ease, transform 120ms ease;
    }
    .prose-item:hover .card-act-btn,
    .goal-row:hover .card-act-btn,
    .safety-card:hover .card-act-btn,
    .q-item:hover .card-act-btn,
    .card-act-btn:focus-visible,
    .card-act-btn.is-pinned,
    .card-act-btn.has-note,
    .card-act-btn.is-editing {
      opacity: 1;
    }
    @media (hover: none) {
      .card-act-btn { opacity: 0.78; }
    }
    .card-act-btn:hover {
      background: var(--surface-2);
      border-color: var(--border);
      color: var(--text);
    }
    .card-act-btn:active { transform: scale(0.94); }
    .card-act-btn.is-pinned {
      color: var(--amber-text);
      background: var(--amber-soft);
      border-color: var(--amber-border);
    }
    .card-act-btn.is-pinned svg { fill: currentColor; }
    .card-act-btn.has-note,
    .card-act-btn.is-editing {
      color: var(--teal-text);
      background: var(--teal-soft);
      border-color: var(--teal-border);
    }
    .is-pinned-card {
      border-color: var(--amber-border) !important;
      box-shadow: 0 0 0 1px var(--amber-soft), var(--shadow-card);
    }

    /* Inline Saved Clinician Note Callout */
    .card-note-slot { margin-top: 0; }
    .card-note-view {
      margin-top: 9px;
      padding: 8px 11px;
      border-radius: var(--r-sm);
      background: var(--teal-wash);
      border: 1px solid var(--teal-border);
      border-inline-start: 2.5px solid var(--teal);
      cursor: pointer;
      transition: background-color 150ms ease, border-color 150ms ease;
    }
    .card-note-view:hover { background: var(--teal-soft); }
    .card-note-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 3px;
    }
    .card-note-badge {
      font-size: 0.65rem;
      font-weight: 750;
      text-transform: uppercase;
      letter-spacing: 0.055em;
      color: var(--teal-text);
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    html[dir="rtl"] .card-note-badge { text-transform: none; letter-spacing: 0; font-size: 0.72rem; }
    .card-note-edit-lbl {
      font-size: 0.68rem;
      font-weight: 600;
      color: var(--text-3);
    }
    .card-note-view:hover .card-note-edit-lbl { color: var(--teal-text); }
    .card-note-text {
      margin: 0;
      font-size: 0.81rem;
      color: var(--text);
      line-height: 1.5;
      white-space: pre-wrap;
      overflow-wrap: break-word;
      unicode-bidi: plaintext;
    }

    /* Inline Live-Save Note Editor */
    .note-editor {
      margin-top: 9px;
      padding: 10px 11px;
      border-radius: var(--r-sm);
      background: var(--bg);
      border: 1px solid var(--teal-border);
      box-shadow: 0 2px 10px -4px rgba(15, 118, 110, 0.14);
      cursor: default;
    }
    .note-presets {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 5px;
      margin-bottom: 7px;
    }
    .note-preset {
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-2);
      border-radius: 999px;
      padding: 2px 8px;
      font-size: 0.68rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 130ms ease, border-color 130ms ease, color 130ms ease;
    }
    .note-preset:hover {
      background: var(--teal-soft);
      border-color: var(--teal-border);
      color: var(--teal-text);
    }
    .note-textarea {
      width: 100%;
      min-height: 62px;
      resize: vertical;
      border: 1px solid var(--border-strong);
      border-radius: 7px;
      background: var(--surface);
      color: var(--text);
      padding: 7px 9px;
      font-size: 0.82rem;
      line-height: 1.5;
      display: block;
    }
    .note-textarea:focus {
      outline: none;
      border-color: var(--teal);
      box-shadow: 0 0 0 2.5px var(--teal-soft);
    }
    .note-textarea::placeholder { color: var(--text-3); }
    .note-ed-foot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-top: 7px;
    }
    .note-ed-hint {
      font-size: 0.68rem;
      color: var(--text-3);
    }
    .note-ed-acts {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .note-ed-btn {
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-2);
      border-radius: 6px;
      padding: 3px 10px;
      font-size: 0.72rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 130ms ease, border-color 130ms ease, color 130ms ease;
    }
    .note-ed-btn:hover { background: var(--surface-2); color: var(--text); }
    .note-ed-btn.is-primary {
      background: var(--teal-btn);
      border-color: var(--teal-btn);
      color: #FFFFFF;
    }
    .note-ed-btn.is-primary:hover { background: var(--teal-btn-hover); }
    .note-ed-btn.is-danger { color: var(--err); border-color: var(--coral-border); }
    .note-ed-btn.is-danger:hover { background: var(--err-soft); }

    /* Print-Only Clinician Notes Summary Block (hidden on screen & hidden on print unless opted-in) */
    .print-notes-section { display: none; }
    .xref-row {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 5px;
    }
    .xref-chip {
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--teal-text);
      border-radius: 999px;
      padding: 2px 8px;
      font-size: 0.69rem;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      transition: background-color 140ms ease, border-color 140ms ease, transform 120ms ease;
    }
    .xref-chip:hover {
      background: var(--teal-soft);
      border-color: var(--teal-border);
      transform: translateY(-1px);
    }
    .xref-chip svg { opacity: 0.8; }

    /* =========================================================================
       SHARED FIGURE CARD & SVG BASE (LABS SPOTLIGHT)
       ========================================================================= */
    .figure-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r-lg);
      box-shadow: var(--shadow-fig);
      padding: 18px 20px 16px;
      margin: 18px 0;
      scroll-margin-top: 76px;
      transition: background-color 220ms var(--ease), border-color 220ms var(--ease), box-shadow 220ms var(--ease);
    }
    .figure-card:hover { border-color: var(--border-strong); }
    .figure-card:last-child { margin-bottom: 0; }
    .fig-title {
      margin: 0;
      font-size: 0.93rem;
      font-weight: 700;
      color: var(--text);
      line-height: 1.35;
    }
    .viz-svg {
      display: block;
      width: 100%;
      height: auto;
      direction: ltr;
      unicode-bidi: isolate;
      overflow: visible;
    }
    .svg-hit { cursor: pointer; outline: none; }
    .svg-hit:focus-visible { outline: none; }

    /* =========================================================================
       SCANNABLE CLINICAL ITEM CARDS (SECTIONS 02, 03 & 04)
       ========================================================================= */
    .prose-list {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 9px;
    }
    .prose-item {
      padding: 13px 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r-md);
      box-shadow: var(--shadow-card);
      scroll-margin-top: 78px;
      transition: background-color 160ms var(--ease), border-color 160ms var(--ease), box-shadow 160ms var(--ease);
    }
    .prose-item:hover { border-color: var(--border-strong); }
    .prose-item.tone-alert {
      border-inline-start: 3px solid var(--coral);
      background: linear-gradient(90deg, var(--coral-wash) 0%, var(--surface) 28%);
    }
    html[dir="rtl"] .prose-item.tone-alert {
      background: linear-gradient(270deg, var(--coral-wash) 0%, var(--surface) 28%);
    }
    .prose-item-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 5px;
    }
    .prose-lead { font-size: 0.93rem; font-weight: 700; color: var(--text); line-height: 1.34; }
    .item-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin-bottom: 7px;
    }
    .item-tag {
      display: inline-block;
      font-size: 0.69rem;
      font-weight: 600;
      color: var(--text-2);
      background: var(--surface-2);
      border: 1px solid var(--border-subtle);
      border-radius: 5px;
      padding: 1.5px 7.5px;
      line-height: 1.35;
      font-variant-numeric: tabular-nums;
    }
    .prose-item.tone-alert .item-tag:nth-child(2) {
      color: var(--coral-text);
      background: var(--coral-soft);
      border-color: var(--coral-border);
      font-weight: 700;
    }
    .prose-brief { margin: 0; font-size: 0.865rem; color: var(--text-2); line-height: 1.55; }
    html[dir="rtl"] .prose-brief { line-height: 1.66; }

    /* =========================================================================
       4-MILESTONE LIFESPAN TIMELINE
       ========================================================================= */
    .life-wrap { margin-top: 20px; }
    .life-rail {
      position: relative;
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
      list-style: none;
      margin: 0;
      padding: 4px 0 0;
    }
    .life-node {
      position: relative;
      z-index: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 4px;
      padding: 6px 6px 8px;
      border-radius: 9px;
      transition: background-color 160ms ease;
    }
    .life-node:hover { background: var(--surface-2); }
    .life-age {
      font-family: var(--font-mono);
      font-size: 0.7rem;
      font-weight: 600;
      color: var(--text-3);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }
    html[dir="rtl"] .life-age { font-family: var(--font-ar); }
    .life-node.is-current .life-age { color: var(--teal-text); font-weight: 700; }
    .life-dot-wrap {
      position: relative;
      width: 100%;
      height: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .life-dot-wrap::before {
      content: "";
      position: absolute;
      top: 50%;
      inset-inline-start: -12px;
      inset-inline-end: -12px;
      height: 1px;
      background: var(--border-strong);
      z-index: 0;
    }
    .life-node:first-child .life-dot-wrap::before { inset-inline-start: 50%; }
    .life-node:last-child .life-dot-wrap::before { inset-inline-end: 50%; }
    .life-rail.is-filtered .life-dot-wrap::before { display: none; }
    .life-dot {
      position: relative;
      z-index: 1;
      width: 9px;
      height: 9px;
      border-radius: 999px;
      background: var(--bg);
      border: 2px solid var(--teal);
      box-shadow: 0 0 0 3px var(--bg);
      flex-shrink: 0;
    }
    .life-node.is-current .life-dot {
      background: var(--teal);
      box-shadow: 0 0 0 3px var(--bg), 0 0 0 6px var(--teal-soft);
    }
    .life-stage { font-size: 0.83rem; font-weight: 700; color: var(--text); line-height: 1.25; }
    .life-note { font-size: 0.75rem; color: var(--text-3); line-height: 1.42; }

    /* =========================================================================
       SECTION 05: SAFETY BASELINE + ACCESS NOTE + SIGNAL-FIRST LABS
       ========================================================================= */
    .safety-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin-bottom: 12px;
      align-items: start;
    }
    .safety-card {
      min-width: 0;
      background: var(--surface);
      border: 1px solid var(--border);
      border-inline-start: 3px solid var(--teal);
      border-radius: var(--r-md);
      padding: 12px 14px;
      box-shadow: var(--shadow-card);
      scroll-margin-top: 78px;
      transition: background-color 200ms var(--ease), border-color 200ms var(--ease), box-shadow 200ms var(--ease);
    }
    .safety-card:hover { border-color: var(--border-strong); }
    .safety-card.sev-warn { border-inline-start-color: var(--amber); }
    .safety-card.sev-info { border-inline-start-color: var(--info); }
    .safety-card.sev-ok { border-inline-start-color: var(--teal); }
    .safety-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 5px;
    }
    .safety-lead-wrap {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      min-width: 0;
    }
    .safety-ico {
      width: 22px;
      height: 22px;
      border-radius: 6px;
      display: inline-grid;
      place-items: center;
      flex-shrink: 0;
    }
    .safety-ico.sev-warn { background: var(--amber-soft); color: var(--amber-text); }
    .safety-ico.sev-info { background: var(--info-soft); color: var(--info-text); }
    .safety-ico.sev-ok { background: var(--teal-soft); color: var(--teal-text); }
    .safety-lead { font-size: 0.87rem; font-weight: 700; color: var(--text); line-height: 1.3; }
    .safety-right { display: inline-flex; align-items: center; gap: 5px; flex-shrink: 0; }
    .sev-badge {
      font-size: 0.66rem;
      font-weight: 700;
      padding: 1.5px 7.5px;
      border-radius: 999px;
      white-space: nowrap;
      line-height: 1.35;
    }
    .sev-badge.sev-warn { background: var(--amber-soft); color: var(--amber-text); border: 1px solid var(--amber-border); }
    .sev-badge.sev-info { background: var(--info-soft); color: var(--info-text); border: 1px solid var(--info-border); }
    .sev-badge.sev-ok { background: var(--teal-soft); color: var(--teal-text); border: 1px solid var(--teal-border); }
    .safety-brief { margin: 0; font-size: 0.83rem; color: var(--text-2); line-height: 1.5; }
    .safety-card .detail-body { margin-top: 8px; padding-top: 8px; }
    .safety-card .detail-point { font-size: 0.79rem; line-height: 1.5; }

    .access-note {
      margin: 0 0 18px;
      padding: 9px 14px;
      border-radius: var(--r-sm);
      background: var(--surface-2);
      border: 1px solid var(--border);
      font-size: 0.81rem;
      color: var(--text-2);
      display: flex;
      align-items: center;
      gap: 9px;
      line-height: 1.45;
    }
    .access-note svg { color: var(--teal-text); flex-shrink: 0; }

    /* Signal-First Lab Visualization */
    .labs-head-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px 14px;
      margin-bottom: 10px;
    }
    .labs-reveal-btn {
      width: 100%;
      margin-top: 12px;
      padding: 8px 12px;
      border-radius: var(--r-sm);
      border: 1px dashed var(--border-strong);
      background: var(--bg);
      color: var(--text-2);
      font-size: 0.77rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background-color 150ms ease, border-color 150ms ease, color 150ms ease;
    }
    .labs-reveal-btn:hover {
      background: var(--teal-wash);
      border-color: var(--teal-border);
      color: var(--teal-text);
    }
    .labs-filter {
      position: relative;
      display: inline-flex;
      align-items: center;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 2px;
      gap: 2px;
    }
    .labs-fbtn {
      position: relative;
      z-index: 1;
      border: 0;
      background: transparent;
      color: var(--text-3);
      font-size: 0.72rem;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 999px;
      cursor: pointer;
      white-space: nowrap;
      transition: background-color 150ms ease, color 150ms ease;
    }
    .labs-fbtn:hover { color: var(--text); }
    .labs-fbtn.is-active { background: var(--teal-btn); color: #FFFFFF; }

    /* Spotlight Precision Linear Gauge */
    .lab-spotlight {
      background: var(--amber-soft);
      border: 1px solid var(--amber-border);
      border-radius: var(--r-md);
      padding: 13px 16px 12px;
      margin-bottom: 16px;
    }
    .spot-top {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 6px 12px;
      margin-bottom: 6px;
    }
    .spot-left { display: inline-flex; align-items: center; flex-wrap: wrap; gap: 8px; }
    .spot-lbl { font-size: 0.9rem; font-weight: 700; color: var(--text); }
    .spot-date { font-family: var(--font-mono); font-size: 0.72rem; color: var(--text-3); font-variant-numeric: tabular-nums; }
    .spot-badge {
      font-size: 0.67rem;
      font-weight: 700;
      padding: 1.5px 8px;
      border-radius: 999px;
      background: var(--surface);
      color: var(--amber-text);
      border: 1px solid var(--amber-border);
    }
    .spot-val {
      font-family: var(--font-mono);
      font-size: 1.02rem;
      font-weight: 700;
      color: var(--amber-text);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }
    .spot-val .lab-unit { font-size: 0.74rem; font-weight: 500; color: var(--text-3); margin-inline-start: 3px; }
    .spot-note { margin: 5px 0 0; font-size: 0.76rem; font-weight: 600; color: var(--amber-text); }

    /* Repleted Deficiencies + Compact Normal Clearance */
    .lab-subblock { margin-top: 14px; }
    .lab-subblock.is-filter-hidden { display: none; }
    .lab-subhead {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 4px 10px;
      margin-bottom: 8px;
    }
    .lab-subtitle {
      font-size: 0.71rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-3);
    }
    html[dir="rtl"] .lab-subtitle { text-transform: none; letter-spacing: 0; font-size: 0.77rem; }
    .lab-subnote { font-size: 0.73rem; color: var(--text-3); }

    .repleted-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }
    .rep-item {
      min-width: 0;
      padding: 10px 12px;
      border-radius: var(--r-sm);
      background: var(--bg);
      border: 1px solid var(--border);
      cursor: default;
      transition: border-color 150ms ease, background-color 150ms ease;
    }
    .rep-item:hover { border-color: var(--teal-border); background: var(--teal-wash); }
    .rep-top { display: flex; align-items: baseline; justify-content: space-between; gap: 6px; margin-bottom: 2px; }
    .rep-lbl { font-size: 0.8rem; font-weight: 700; color: var(--text); }
    .rep-date { font-family: var(--font-mono); font-size: 0.65rem; color: var(--text-3); white-space: nowrap; }
    .rep-val-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      margin-bottom: 6px;
    }
    .rep-val {
      font-family: var(--font-mono);
      font-size: 0.77rem;
      font-weight: 700;
      color: var(--teal-text);
      font-variant-numeric: tabular-nums;
    }
    .rep-prev { font-weight: 500; color: var(--amber-text); }
    .rep-arr { margin: 0 3px; color: var(--text-3); font-weight: 400; }
    .rep-unit { font-size: 0.67rem; font-weight: 500; color: var(--text-3); margin-inline-start: 2px; }
    .rep-meta { display: flex; align-items: center; justify-content: space-between; gap: 6px; margin-top: 5px; font-size: 0.69rem; color: var(--text-3); }

    /* Sleek 3-Column Normal Clearance Grid */
    .normal-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 6px 14px;
      padding-top: 8px;
      border-top: 1px solid var(--border-subtle);
    }
    .norm-item {
      min-width: 0;
      padding: 6px 6px;
      margin: 0 -6px;
      border-bottom: 1px solid var(--border-subtle);
      border-radius: 6px;
      cursor: default;
      transition: background-color 140ms ease;
    }
    .norm-item:hover { background: var(--surface-2); }
    .norm-top {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 6px;
      margin-bottom: 4px;
    }
    .norm-lbl-wrap { display: inline-flex; align-items: baseline; flex-wrap: wrap; gap: 5px; min-width: 0; }
    .norm-lbl { font-size: 0.78rem; font-weight: 600; color: var(--text); overflow-wrap: break-word; }
    .norm-date { font-family: var(--font-mono); font-size: 0.62rem; color: var(--text-3); opacity: 0.85; white-space: nowrap; font-variant-numeric: tabular-nums; }
    .norm-val {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--teal-text);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }
    .norm-unit { font-size: 0.65rem; font-weight: 500; color: var(--text-3); margin-inline-start: 2px; }
    .mini-viz { display: flex; align-items: center; gap: 7px; }
    .mini-track {
      position: relative;
      flex: 1 1 auto;
      min-width: 0;
      height: 5px;
      border-radius: 999px;
      background: var(--track-bg);
    }
    .mini-zone {
      position: absolute;
      top: 0;
      bottom: 0;
      background: var(--zone-bg);
      border-left: 1px solid var(--zone-edge);
      border-right: 1px solid var(--zone-edge);
      border-radius: 2px;
    }
    .mini-delta {
      position: absolute;
      top: 50%;
      height: 2px;
      transform: translateY(-50%);
      border-radius: 999px;
      background: linear-gradient(90deg, var(--amber), var(--teal));
      z-index: 1;
    }
    .mini-dot-prev {
      position: absolute;
      top: 50%;
      width: 6px;
      height: 6px;
      border-radius: 999px;
      transform: translate(-50%, -50%);
      background: var(--surface);
      border: 1.6px solid var(--amber);
      z-index: 2;
    }
    .mini-dot-curr {
      position: absolute;
      top: 50%;
      width: 7.5px;
      height: 7.5px;
      border-radius: 999px;
      transform: translate(-50%, -50%);
      background: var(--teal);
      box-shadow: 0 0 0 1.5px var(--surface);
      z-index: 3;
    }
    .mini-ref {
      flex-shrink: 0;
      font-family: var(--font-mono);
      font-size: 0.64rem;
      color: var(--text-3);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    /* =========================================================================
       SECTION 06: CONSULTATION DECISIONS (ELEVATED CARDS + DISCUSSION TOGGLE)
       ========================================================================= */
    .q-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
      list-style: none;
      margin: 0;
      padding: 0;
    }
    .q-item {
      min-width: 0;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r-md);
      padding: 15px 16px 13px;
      box-shadow: var(--shadow-card);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 11px;
      transition: border-color 160ms var(--ease), background-color 160ms var(--ease), opacity 180ms ease;
    }
    .q-item:hover { border-color: var(--teal-border); }
    .q-item.is-done {
      background: var(--teal-wash);
      border-color: var(--teal-border);
    }
    .q-item.is-done .q-lead,
    .q-item.is-done .q-text { opacity: 0.72; }
    .q-top {
      display: grid;
      grid-template-columns: 24px minmax(0, 1fr) auto;
      gap: 10px;
      align-items: start;
    }
    .q-num {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--teal);
      padding-top: 2px;
      font-variant-numeric: tabular-nums;
    }
    .q-lead { margin: 0 0 4px; font-size: 0.9rem; font-weight: 700; color: var(--text); line-height: 1.35; }
    .q-text { margin: 0; font-size: 0.85rem; color: var(--text-2); line-height: 1.54; }
    .q-check {
      width: 24px;
      height: 24px;
      border-radius: 999px;
      border: 1.5px solid var(--border-strong);
      background: var(--bg);
      color: transparent;
      display: inline-grid;
      place-items: center;
      cursor: pointer;
      padding: 0;
      flex-shrink: 0;
      transition: background-color 150ms ease, border-color 150ms ease, color 150ms ease, transform 120ms ease;
    }
    .q-check:hover { border-color: var(--teal); transform: scale(1.06); }
    .q-item.is-done .q-check {
      background: var(--teal-btn);
      border-color: var(--teal-btn);
      color: #FFFFFF;
    }
    .q-foot {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      padding-inline-start: 34px;
    }

    /* Editorial End-Cap Footer (Screen-Only) */
    .brief-endcap {
      margin-top: 40px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: flex-end;
    }
    .endcap-actions {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .endcap-btn {
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-2);
      border-radius: 999px;
      padding: 4px 12px;
      font-size: 0.74rem;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      cursor: pointer;
      transition: border-color 150ms ease, background-color 150ms ease, color 150ms ease;
    }
    .endcap-btn:hover { border-color: var(--teal-border); background: var(--teal-soft); color: var(--teal-text); }

    /* Empty Search State */
    .search-empty {
      padding: 56px 20px;
      text-align: center;
      color: var(--text-2);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    .search-empty-title { margin: 0; font-size: 0.96rem; font-weight: 700; color: var(--text); }
    .search-empty-btn {
      border: 1px solid var(--teal-border);
      background: var(--teal-soft);
      color: var(--teal-text);
      font-size: 0.8rem;
      font-weight: 600;
      padding: 6px 15px;
      border-radius: 999px;
      cursor: pointer;
    }

    /* =========================================================================
       FLOATING NAVIGATION AIDS (BACK-TO-TOP, RETURN-TOAST, MOBILE DOCK, DRAWER, MODAL)
       ========================================================================= */
    .float-top {
      position: fixed;
      bottom: 22px;
      inset-inline-end: 22px;
      z-index: 45;
      width: 40px;
      height: 40px;
      border-radius: 999px;
      border: 1px solid var(--glass-border);
      background: var(--glass-bg);
      backdrop-filter: blur(14px) saturate(160%);
      -webkit-backdrop-filter: blur(14px) saturate(160%);
      color: var(--teal-text);
      box-shadow: var(--shadow-dock);
      display: inline-grid;
      place-items: center;
      cursor: pointer;
      opacity: 0;
      pointer-events: none;
      transform: translateY(10px) scale(0.94);
      transition: opacity 200ms var(--ease), transform 200ms var(--ease), border-color 150ms ease, background-color 150ms ease;
    }
    .float-top.is-visible { opacity: 1; pointer-events: auto; transform: translateY(0) scale(1); }
    .float-top:hover { border-color: var(--teal-border); background: var(--surface); }
    @media (min-width: 1280px) { .float-top { display: none; } }

    .return-toast {
      position: fixed;
      bottom: 22px;
      inset-inline-end: 72px;
      z-index: 50;
      display: inline-flex;
