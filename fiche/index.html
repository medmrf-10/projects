    function positionPrefsSheet() {
      const sheet = $('prefsSheet');
      if (window.innerWidth <= 767) {
        sheet.style.left = '';
        sheet.style.top = '';
        return;
      }
      const btnRect = $('prefsBtn').getBoundingClientRect();
      const sw = Math.min(344, window.innerWidth - 24);
      const isRtl = document.documentElement.dir === 'rtl';
      let left = isRtl ? btnRect.left : (btnRect.right - sw);
      left = Math.max(12, Math.min(left, window.innerWidth - sw - 12));
      const top = Math.max(12, btnRect.bottom + 8);
      sheet.style.left = left + 'px';
      sheet.style.top = top + 'px';
    }

    function openPrefsSheet() {
      if (!DATA) return;
      prefsOpen = true;
      renderPrefsSheet();
      $('prefsBackdrop').hidden = false;
      $('prefsSheet').hidden = false;
      $('prefsBtn').setAttribute('aria-expanded', 'true');
      positionPrefsSheet();
    }

    function closePrefsSheet(returnFocus = true) {
      if (!prefsOpen) return;
      prefsOpen = false;
      $('prefsBackdrop').hidden = true;
      $('prefsSheet').hidden = true;
      $('prefsBtn').setAttribute('aria-expanded', 'false');
      if (returnFocus && !$('app').hidden) $('prefsBtn').focus();
    }

    // ================= SUMMARY & EHR EXPORT =================
    function getPrioLabel(prio, ui) {
      if (prio === 'primary') return ui.prioPrimary;
      if (prio === 'secondary') return ui.prioSecondary;
      if (prio === 'ruled_out') return ui.prioRuledOut;
      return '';
    }
    function getPrioPlain(prio, ui) {
      if (prio === 'primary') return ui.prioPrimaryPlain;
      if (prio === 'secondary') return ui.prioSecondaryPlain;
      if (prio === 'ruled_out') return ui.prioRuledOutPlain;
      return '';
    }

    function buildSummaryModel() {
      const d = DATA[prefs.lang];
      const ui = d.ui;
      const allHyps = [...d.workspace.hypotheses, ...ws.customHypotheses];
      const hypsByPrio = { primary: [], secondary: [], ruled_out: [] };
      for (const h of allHyps) {
        const pr = ws.hypPrio[h.id];
        if (pr && hypsByPrio[pr]) hypsByPrio[pr].push(h.label);
      }

      const planLines = [];
      for (const g of d.workspace.planGroups) {
        const selIds = new Set(ws.planSelected[g.id] || []);
        if (!selIds.size) continue;
        const allOpts = [...g.options, ...(ws.customOptions[g.id] || [])];
        const picked = allOpts.filter(o => selIds.has(o.id)).map(o => o.label);
        if (picked.length) planLines.push({ title: g.title, items: picked });
      }

      const note = (ws.freeNote || '').trim();
      const hasHyps = hypsByPrio.primary.length + hypsByPrio.secondary.length + hypsByPrio.ruled_out.length > 0;
      const hasData = hasHyps || planLines.length > 0 || note.length > 0;
      return { ui, hypsByPrio, hasHyps, planLines, note, hasData };
    }

    function formatLocalizedDate() {
      const now = new Date();
      const dd = String(now.getDate()).padStart(2, '0');
      const mm = String(now.getMonth() + 1).padStart(2, '0');
      const yyyy = now.getFullYear();
      return prefs.lang === 'en' ? (yyyy + '-' + mm + '-' + dd) : (dd + '/' + mm + '/' + yyyy);
    }

    function buildSummaryPlainText() {
      const d = DATA[prefs.lang];
      const m = buildSummaryModel();
      if (!m.hasData) return '';
      const out = [
        d.docTitle + ' (' + formatLocalizedDate() + ')',
        d.ehrPatientLine,
        ''
      ];
      if (m.hasHyps) {
        out.push(m.ui.summaryHypotheses + ':');
        for (const pr of ['primary', 'secondary', 'ruled_out']) {
          if (m.hypsByPrio[pr].length) {
            out.push('  - [' + getPrioPlain(pr, m.ui) + '] ' + m.hypsByPrio[pr].join(' ; '));
          }
        }
        out.push('');
      }
      if (m.planLines.length) {
        out.push(m.ui.summaryPlan + ':');
        for (const g of m.planLines) {
          out.push('  - ' + g.title + ': ' + g.items.join(' ; '));
        }
        out.push('');
      }
      if (m.note) {
        out.push(m.ui.summaryNote + ':');
        out.push('  ' + m.note);
        out.push('');
      }
      out.push(d.ehrSafetyFooter);
      return out.join('\n').trim();
    }

    function buildSummaryHtml(m) {
      if (!m.hasData) {
        return '<p class="summary-empty">' + esc(m.ui.summaryEmpty) + '</p>';
      }
      const parts = [];
      if (m.hasHyps) {
        let rows = '';
        for (const pr of ['primary', 'secondary', 'ruled_out']) {
          if (m.hypsByPrio[pr].length) {
            rows += '<p class="sum-line"><strong>' + esc(getPrioLabel(pr, m.ui)) + ':</strong> ' + m.hypsByPrio[pr].map(fmt).join(' · ') + '</p>';
          }
        }
        parts.push('<div class="sum-sec"><div class="sum-k">' + esc(m.ui.summaryHypotheses) + '</div>' + rows + '</div>');
      }
      if (m.planLines.length) {
        const rows = m.planLines.map(g => '<p class="sum-line"><strong>' + fmt(g.title) + ':</strong> ' + g.items.map(fmt).join(' · ') + '</p>').join('');
        parts.push('<div class="sum-sec"><div class="sum-k">' + esc(m.ui.summaryPlan) + '</div>' + rows + '</div>');
      }
      if (m.note) {
        parts.push('<div class="sum-sec"><div class="sum-k">' + esc(m.ui.summaryNote) + '</div><p class="sum-line">' + fmt(m.note).replace(/\n/g, '<br />') + '</p></div>');
      }
      return parts.join('');
    }

    function updateSummaryDOM() {
      if (!DATA) return;
      const m = buildSummaryModel();
      // Auto-default printIncludeSummary to true whenever workspace has data unless user explicitly set it
      if (!ws.printSummaryUserSet) {
        ws.printIncludeSummary = m.hasData;
      }
      document.body.classList.toggle('print-with-notes', Boolean(ws.printIncludeSummary));
      const chk = $('printSummaryChk');
      if (chk) chk.checked = Boolean(ws.printIncludeSummary);

      const box = $('summaryBox');
      const prev = $('summaryPreview');
      const printBox = $('printSummaryBox');
      if (!box || !prev) return;

      box.classList.toggle('has-data', m.hasData);
      prev.innerHTML = buildSummaryHtml(m);
      $('copySummaryBtn').disabled = !m.hasData;
      $('exportTxtBtn').disabled = !m.hasData;
      $('clearWsBtn').disabled = !m.hasData;

      if (!m.hasData && clearConfirmArmed) disarmClearConfirm();

      if (printBox) {
        printBox.classList.toggle('has-data', m.hasData);
        printBox.innerHTML = m.hasData
          ? '<h3 class="summary-title">' + esc(m.ui.summaryTitle) + '</h3>' + buildSummaryHtml(m)
          : '';
      }
    }

    function disarmClearConfirm() {
      clearConfirmArmed = false;
      if (clearConfirmTimer) { clearTimeout(clearConfirmTimer); clearConfirmTimer = null; }
      const btn = $('clearWsBtn');
      if (btn && DATA) {
        btn.classList.remove('is-confirm');
        btn.textContent = DATA[prefs.lang].ui.clearAll;
      }
    }

    // ================= SURGICAL WORKSPACE RENDERERS (NEVER WIPE #appMain!) =================
    function buildHypLegendHtml(d) {
      const ui = d.ui;
      const counts = { primary: 0, secondary: 0, ruled_out: 0 };
      const allIds = new Set([...d.workspace.hypotheses.map(h => h.id), ...ws.customHypotheses.map(h => h.id)]);
      for (const id of allIds) {
        const pr = ws.hypPrio[id];
        if (pr && counts[pr] != null) counts[pr]++;
      }
      return ['primary', 'secondary', 'ruled_out'].map(pr => {
        const c = counts[pr];
        return '<span class="leg-item leg-' + pr + (c ? ' has-count' : '') + '">' + esc(getPrioLabel(pr, ui)) + (c ? ' <span class="leg-cnt">' + c + '</span>' : '') + '</span>';
      }).join('');
    }

    function buildHypChipsHtml(d, highlightId = null) {
      const ui = d.ui;
      const renderChip = (h, isCustom) => {
        const pr = ws.hypPrio[h.id] || '';
        const pTag = pr ? '<span class="prio-tag">' + esc(getPrioLabel(pr, ui)) + '</span>' : '';
        const pop = highlightId === h.id ? ' is-just-added' : '';
        const btn = `<button type="button" class="hyp-pill${pop}" data-hyp-id="${esc(h.id)}" data-prio="${esc(pr)}" aria-pressed="${Boolean(pr)}"><span class="hyp-text">${fmt(h.label)}</span>${pTag}</button>`;
        if (!isCustom) return btn;
        return `<span class="chip-wrap${pop}">${btn}<button type="button" class="chip-del" data-del-hyp="${esc(h.id)}" aria-label="${esc(ui.removeCustomLabel)}" title="${esc(ui.removeCustomLabel)}">&times;</button></span>`;
      };
      return [
        ...d.workspace.hypotheses.map(h => renderChip(h, false)),
        ...ws.customHypotheses.map(h => renderChip(h, true))
      ].join('');
    }

    function buildPlanGroupInnerHtml(g, ui, highlightId = null) {
      const selSet = new Set(ws.planSelected[g.id] || []);
      const isSingle = g.mode === 'single';
      const renderOpt = (opt, isCustom) => {
        const on = selSet.has(opt.id);
        const pop = highlightId === opt.id ? ' is-just-added' : '';
        const ind = `<span class="plan-ind${isSingle ? ' is-radio' : ''}" aria-hidden="true">${on ? (isSingle ? '•' : '✓') : ''}</span>`;
        const btn = `<button type="button" class="plan-chip${on ? ' is-on' : ''}${pop}" data-plan-group="${esc(g.id)}" data-plan-opt="${esc(opt.id)}" data-plan-mode="${esc(g.mode)}" aria-pressed="${on}">${ind}<span>${fmt(opt.label)}</span></button>`;
        if (!isCustom) return btn;
        return `<span class="chip-wrap${pop}">${btn}<button type="button" class="chip-del" data-del-opt-group="${esc(g.id)}" data-del-opt-id="${esc(opt.id)}" aria-label="${esc(ui.removeCustomLabel)}" title="${esc(ui.removeCustomLabel)}">&times;</button></span>`;
      };
      const chips = [
        ...g.options.map(o => renderOpt(o, false)),
        ...(ws.customOptions[g.id] || []).map(o => renderOpt(o, true))
      ].join('');
      const composerOpen = openPlanComposers.has(g.id);
      const addChip = composerOpen ? '' : `<button type="button" class="plan-add-chip" data-open-opt="${esc(g.id)}">${esc(ui.addChipLabel)}</button>`;
      const composerHtml = composerOpen ? `
        <div class="opt-composer">
          <input type="text" class="inline-input" data-opt-input="${esc(g.id)}" placeholder="${esc(g.addPlaceholder)}" maxlength="140" />
          <button type="button" class="add-icon-btn" data-opt-add="${esc(g.id)}" aria-label="${esc(ui.addCustomBtn)}" title="${esc(ui.addCustomBtn)}">+</button>
        </div>` : '';
      return `<div class="chip-list">${chips}${addChip}</div>${composerHtml}`;
    }

    function updateHypothesesDOM(highlightId = null) {
      if (!DATA) return;
      const d = DATA[prefs.lang];
      const leg = $('hypLegend');
      const list = $('hypList');
      if (leg) leg.innerHTML = buildHypLegendHtml(d);
      if (list) list.innerHTML = buildHypChipsHtml(d, highlightId);
      updateSummaryDOM();
    }

    function updatePlanGroupDOM(groupId, highlightId = null) {
      if (!DATA) return;
      const d = DATA[prefs.lang];
      const g = d.workspace.planGroups.find(x => x.id === groupId);
      const container = $('appMain').querySelector('[data-plan-body="' + groupId + '"]');
      if (g && container) {
        container.innerHTML = buildPlanGroupInnerHtml(g, d.ui, highlightId);
      }
      updateSummaryDOM();
    }

    function refreshWorkspaceZones() {
      if (!DATA) return;
      const d = DATA[prefs.lang];
      updateHypothesesDOM();
      d.workspace.planGroups.forEach(g => updatePlanGroupDOM(g.id));
      const noteEl = $('freeNote');
      if (noteEl && noteEl.value !== (ws.freeNote || '')) noteEl.value = ws.freeNote || '';
      updateSummaryDOM();
    }

    function updateNewHypPrioBtn() {
      const btn = $('customHypPrioBtn');
      if (!btn || !DATA) return;
      const ui = DATA[prefs.lang].ui;
      btn.dataset.prio = newHypPrio;
      btn.textContent = PRIO_GLYPHS[newHypPrio] || '★';
      const label = ui.customPrioCycleLabel + ' (' + getPrioLabel(newHypPrio, ui) + ')';
      btn.setAttribute('aria-label', label);
      btn.setAttribute('title', label);
    }

    // ================= MAIN APP RENDERER (Initial Unlock & Lang Switch Only) =================
    const CHEV_SVG = '<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>';
    const LOCK_MINI_SVG = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>';

    function renderArrowSvg(idx) {
      const gid = 'arrGrad' + idx;
      return `<svg viewBox="0 0 40 16" fill="none" aria-hidden="true">
        <defs>
          <linearGradient id="${gid}" x1="0" y1="8" x2="38" y2="8" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="var(--amber)"/>
            <stop offset="100%" stop-color="var(--teal)"/>
          </linearGradient>
        </defs>
        <line x1="2" y1="8" x2="30" y2="8" stroke="url(#${gid})" stroke-width="2.4" stroke-linecap="round"/>
        <path d="M27.5 3L37.5 8L27.5 13Z" fill="var(--teal)"/>
      </svg>`;
    }

    function renderApp() {
      if (!DATA) return;
      const d = DATA[prefs.lang];
      const ui = d.ui;
      const allOpen = allProblemsExpanded();

      // Block 1: 5 De-Boxed 2-in-1 Presenting Problems
      const probsHtml = d.problems.map(p => {

          ? '<span class="prob-alert-badge"><span class="prob-alert-dot" aria-hidden="true"></span><span>' + esc(p.alertBadge) + '</span></span>'

        const detHtml = p.details.map(item => `
          <div class="detail-item">
            <div class="detail-label">${fmt(item.label)}</div>
            <p class="detail-text">${fmt(item.text)}</p>
          </div>`).join('');
        return `
          <article class="card prob-card${p.tone === 'alert' ? ' is-alert' : ''}" data-prob-id="${esc(p.id)}">

              <div class="prob-head">

      // Block 2: Uniform Safety Cards + Headline WBC Watch Lab + Unified A -> B Sheet + Collapsed 9 Normal Labs
      const safetyCardsHtml = d.safety.cards.map((c, idx) => {
        const isOpen = openSafety.has(c.id);

              <span class="disc-txt">${fmt(isOpen ? ui.detailsHide : c.detailHint)}</span>

      const w = d.safety.watchLab;
      const watchHtml = `
        <article class="watch-card">

      // Block 3: Diagnostic Hypotheses & Plan Builder
      const planGroupsHtml = d.workspace.planGroups.map(g => `
        <div class="plan-group" data-plan-group-wrap="${esc(g.id)}">
          <h4 class="plan-group-title">${fmt(g.title)}</h4>
          <div data-plan-body="${esc(g.id)}">${buildPlanGroupInnerHtml(g, ui)}</div>

      $('appMain').innerHTML = `

                <div class="normal-labs-panel">
                  <div class="nlab-grid">${normalLabsHtml}</div>
                </div>
              </div>
            </div>
          </div>
        </section>

        <section class="block" id="block-workspace" aria-labelledby="h-workspace">
          <div class="block-head">
            <div class="block-title-stack">
              <span class="block-eyebrow">${esc(ui.workspaceEyebrow)}</span>
              <h2 id="h-workspace" class="block-title">${esc(ui.workspaceTitle)}</h2>
            </div>
            <span class="saved-badge">${LOCK_MINI_SVG}<span>${esc(ui.localSavedBadge)}</span></span>
          </div>
          <div class="ws-card">
            <div class="ws-zone">
              <h3 class="ws-zone-title">${esc(ui.hypothesesTitle)}</h3>
              <p class="ws-hint">${fmt(ui.hypothesesHint)}</p>
              <div class="hyp-legend" id="hypLegend">${buildHypLegendHtml(d)}</div>
              <div class="chip-list" id="hypList">${buildHypChipsHtml(d)}</div>
              <div class="hyp-composer">
                <input type="text" id="customHypInput" class="inline-input" placeholder="${esc(ui.addHypPlaceholder)}" maxlength="140" />
                <button type="button" id="customHypPrioBtn" class="prio-cycle-btn" data-prio="${esc(newHypPrio)}">${esc(PRIO_GLYPHS[newHypPrio])}</button>
                <button type="button" id="addHypBtn" class="add-icon-btn" aria-label="${esc(ui.addCustomBtn)}" title="${esc(ui.addCustomBtn)}">+</button>
              </div>
            </div>

            <div class="ws-zone">${planGroupsHtml}</div>

            <div class="ws-zone">
              <label class="field-label" for="freeNote">${esc(ui.freeNoteLabel)}</label>
              <textarea id="freeNote" class="note-area" rows="3" placeholder="${esc(ui.freeNotePlaceholder)}"></textarea>
            </div>

            <div class="ws-zone">
              <div id="summaryBox" class="summary-box">
                <div class="summary-head">
                  <h3 class="summary-title">${esc(ui.summaryTitle)}</h3>
                  <button type="button" id="clearWsBtn" class="ghost-clear-btn">${esc(ui.clearAll)}</button>
                </div>
                <div id="summaryPreview"></div>
                <div class="summary-actions">
                  <button type="button" id="copySummaryBtn" class="btn-primary">${esc(ui.copySummary)}</button>
                  <button type="button" id="exportTxtBtn" class="btn-secondary">${esc(ui.exportTxt)}</button>
                </div>
                <div class="print-toggle-row">
                  <label class="switch-row">
                    <span>${esc(ui.printIncludeSummary)}</span>
                    <input type="checkbox" id="printSummaryChk" class="sr-switch-input" />
                    <span class="ios-switch" aria-hidden="true"><span class="ios-thumb"></span></span>
                  </label>
                </div>
              </div>
            </div>
          </div>
        </section>

        <section class="block" id="block-baseline" aria-labelledby="baselineToggle">
          <div class="disclosure-wrap">
            <button type="button" class="disclosure-bar" id="baselineToggle" aria-expanded="${baselineOpen}" aria-controls="baselinePanel">
              <span class="disclosure-label">${esc(ui.baselineTitle)}</span>
              ${CHEV_SVG}
            </button>
            <div class="acc-wrap${baselineOpen ? ' is-open' : ''}" id="baselinePanel" aria-hidden="${!baselineOpen}">
              <div class="acc-inner"${baselineOpen ? '' : ' inert'}>
                <div class="baseline-panel">
                  <dl class="baseline-list">${baselineRowsHtml}</dl>
                </div>
              </div>
            </div>
          </div>
        </section>

        <section id="printSummaryBox" class="print-summary-box" aria-hidden="true"></section>
      `;

      $('freeNote').value = ws.freeNote || '';
      updateNewHypPrioBtn();
      updateSummaryDOM();
    }

    // ================= SURGICAL WORKSPACE MUTATIONS =================
    function cycleHypothesis(id) {
      const cur = ws.hypPrio[id] || null;
      const next = PRIO_CYCLE[(PRIO_CYCLE.indexOf(cur) + 1) % PRIO_CYCLE.length];
      if (next) ws.hypPrio[id] = next;
      else delete ws.hypPrio[id];
      updateHypothesesDOM();
      scheduleWorkspaceSave();
    }

    function addCustomHypothesis() {
      const input = $('customHypInput');
      if (!input) return;
      const label = input.value.trim();
      if (!label) { input.focus(); return; }
      const id = uid('chyp');
      ws.customHypotheses.push({ id, label: label.slice(0, 140) });
      ws.hypPrio[id] = newHypPrio;
      input.value = '';
      updateHypothesesDOM(id);
      scheduleWorkspaceSave();
      input.focus();
    }

    function deleteCustomHypothesis(id) {
      const prevSnap = JSON.stringify(ws);
      ws.customHypotheses = ws.customHypotheses.filter(h => h.id !== id);
      delete ws.hypPrio[id];
      updateHypothesesDOM();
      scheduleWorkspaceSave();
      showUndoToast(DATA[prefs.lang].ui.removedToast, prevSnap);
    }

    function togglePlanOption(groupId, optId, mode) {
      const list = ws.planSelected[groupId] || [];
      if (mode === 'single') {
        ws.planSelected[groupId] = list.includes(optId) ? [] : [optId];
      } else {
        ws.planSelected[groupId] = list.includes(optId) ? list.filter(x => x !== optId) : [...list, optId];
      }
      updatePlanGroupDOM(groupId);
      scheduleWorkspaceSave();
    }

    function openPlanComposer(groupId) {
      openPlanComposers.add(groupId);
      updatePlanGroupDOM(groupId);
      const inp = $('appMain').querySelector('[data-opt-input="' + groupId + '"]');
      if (inp) inp.focus();
    }

    function closePlanComposer(groupId) {
      if (!openPlanComposers.has(groupId)) return;
      openPlanComposers.delete(groupId);
      updatePlanGroupDOM(groupId);
    }

    function addCustomOption(groupId) {
      const input = $('appMain').querySelector('[data-opt-input="' + groupId + '"]');
      if (!input) return;
      const label = input.value.trim();
      if (!label) { input.focus(); return; }
      const id = uid('copt');
      if (!ws.customOptions[groupId]) ws.customOptions[groupId] = [];
      ws.customOptions[groupId].push({ id, label: label.slice(0, 140) });
      const group = DATA[prefs.lang].workspace.planGroups.find(g => g.id === groupId);
      if (group && group.mode === 'single') {
        ws.planSelected[groupId] = [id];
      } else {
        ws.planSelected[groupId] = [...(ws.planSelected[groupId] || []), id];
      }
      openPlanComposers.delete(groupId);
      updatePlanGroupDOM(groupId, id);
      scheduleWorkspaceSave();
    }

    function deleteCustomOption(groupId, optId) {
      const prevSnap = JSON.stringify(ws);
      if (ws.customOptions[groupId]) {
        ws.customOptions[groupId] = ws.customOptions[groupId].filter(o => o.id !== optId);
      }
      if (ws.planSelected[groupId]) {
        ws.planSelected[groupId] = ws.planSelected[groupId].filter(x => x !== optId);
      }
      updatePlanGroupDOM(groupId);
      scheduleWorkspaceSave();
      showUndoToast(DATA[prefs.lang].ui.removedToast, prevSnap);
    }

    async function copySummary() {
      const text = buildSummaryPlainText();
      if (!text) return;
      try {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          await navigator.clipboard.writeText(text);
        } else {
          const ta = document.createElement('textarea');
          ta.value = text;
          ta.style.position = 'fixed';
          ta.style.opacity = '0';
          document.body.appendChild(ta);
          ta.select();
          document.execCommand('copy');
          ta.remove();
        }
        showToast(DATA[prefs.lang].ui.copiedToast);
      } catch {}
    }

    function exportSummaryTxt() {
      const text = buildSummaryPlainText();
      if (!text) return;
      const blob = new Blob([text + '\n'], { type: 'text/plain;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      const stamp = new Date().toISOString().slice(0, 10);
      a.href = url;
      a.download = 'consultation-summary-' + prefs.lang + '-' + stamp + '.txt';
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    function handleClearAllClick() {
      const btn = $('clearWsBtn');
      if (!btn || btn.disabled) return;
      if (!clearConfirmArmed) {
        clearConfirmArmed = true;
        btn.classList.add('is-confirm');
        btn.textContent = DATA[prefs.lang].ui.clearConfirm;
        if (clearConfirmTimer) clearTimeout(clearConfirmTimer);
        clearConfirmTimer = setTimeout(disarmClearConfirm, 4000);
        return;
      }
      const prevSnap = JSON.stringify(ws);
      disarmClearConfirm();
      ws = createEmptyWorkspace();
      openPlanComposers.clear();
      persistWorkspaceNow();
      refreshWorkspaceZones();
      showUndoToast(DATA[prefs.lang].ui.clearedToast, prevSnap);
    }

    // ================= EVENT DELEGATION =================
    document.addEventListener('click', (e) => {
      const langBtn = e.target.closest('.lang-btn');
      if (langBtn) { setLang(langBtn.dataset.lang); return; }
      if (e.target.closest('#toastUndoBtn')) { applyUndo(); return; }
    });

    $('gateThemeBtn').addEventListener('click', () => {
      const next = THEME_ORDER[(THEME_ORDER.indexOf(prefs.theme) + 1) % THEME_ORDER.length];
      setTheme(next);
      const g = GATE_UI[prefs.lang] || GATE_UI.fr;
      showToast(g.themes[next] || next, 1500);
    });

    $('pinEyeBtn').addEventListener('click', () => {
      const inp = $('pinInput');
      const show = inp.type === 'password';
      inp.type = show ? 'text' : 'password';
      $('pinEyeBtn').setAttribute('aria-pressed', show ? 'true' : 'false');
      renderGateText();
      inp.focus();
    });

    $('pinForm').addEventListener('submit', handleUnlock);

    $('prefsBtn').addEventListener('click', () => {
      if (prefsOpen) closePrefsSheet(true);
      else openPrefsSheet();
    });
    $('prefsBackdrop').addEventListener('click', () => closePrefsSheet(true));

    $('prefsSheet').addEventListener('click', (e) => {
      if (e.target.closest('[data-prefs-close]')) { closePrefsSheet(true); return; }
      const th = e.target.closest('[data-set-theme]');
      if (th) { setTheme(th.dataset.setTheme); return; }
      const fo = e.target.closest('[data-set-font]');
      if (fo) { setFont(fo.dataset.setFont); return; }
      const sp = e.target.closest('[data-set-spacing]');
      if (sp) { setSpacing(sp.dataset.setSpacing); return; }
      const ca = e.target.closest('[data-set-cards]');
      if (ca) { setCards(ca.dataset.setCards); return; }
      if (e.target.closest('[data-act-expand]')) { toggleExpandAllProblems(); return; }
      if (e.target.closest('[data-act-print]')) {
        closePrefsSheet(false);
        setTimeout(() => window.print(), 60);
        return;
      }
      if (e.target.closest('[data-act-lock]')) { lockApp(); return; }
      if (e.target.closest('[data-act-reset]')) { resetDisplayPrefs(); return; }
    });

    $('appMain').addEventListener('click', (e) => {
      if (e.target.closest('#expandAllBtn')) { toggleExpandAllProblems(); return; }

      const probBtn = e.target.closest('[data-toggle-prob]');
      if (probBtn) {
        const id = probBtn.dataset.toggleProb;
        const d = DATA[prefs.lang];
        const p = d.problems.find(x => x.id === id);
        const isOpen = !openProbs.has(id);
        if (isOpen) openProbs.add(id);
        else openProbs.delete(id);
        setAccordionState($('det-' + id), probBtn, isOpen, p ? p.detailHint : '', d.ui.detailsHide);
        updateExpandAllButtons();
        return;
      }

      const safBtn = e.target.closest('[data-toggle-safety]');
      if (safBtn) {
        const id = safBtn.dataset.toggleSafety;
        const d = DATA[prefs.lang];
        const c = d.safety.cards.find(x => x.id === id);
        const isOpen = !openSafety.has(id);
        if (isOpen) openSafety.add(id);
        else openSafety.delete(id);
        setAccordionState($('sdet-' + id), safBtn, isOpen, c ? c.detailHint : '', d.ui.detailsHide);
        return;
      }

      const nlabBtn = e.target.closest('#normalLabsToggle');
      if (nlabBtn) {
        normalLabsOpen = !normalLabsOpen;
        setAccordionState($('normalLabsPanel'), nlabBtn, normalLabsOpen);
        return;
      }

      const baseBtn = e.target.closest('#baselineToggle');
      if (baseBtn) {
        baselineOpen = !baselineOpen;
        setAccordionState($('baselinePanel'), baseBtn, baselineOpen);
        return;
      }

      const delHyp = e.target.closest('[data-del-hyp]');
      if (delHyp) { deleteCustomHypothesis(delHyp.dataset.delHyp); return; }

      const hypBtn = e.target.closest('[data-hyp-id]');
      if (hypBtn) { cycleHypothesis(hypBtn.dataset.hypId); return; }

      if (e.target.closest('#customHypPrioBtn')) {
        newHypPrio = NEW_PRIO_ORDER[(NEW_PRIO_ORDER.indexOf(newHypPrio) + 1) % NEW_PRIO_ORDER.length];
        updateNewHypPrioBtn();
        return;
      }

      if (e.target.closest('#addHypBtn')) { addCustomHypothesis(); return; }

      const delOpt = e.target.closest('[data-del-opt-id]');
      if (delOpt) { deleteCustomOption(delOpt.dataset.delOptGroup, delOpt.dataset.delOptId); return; }

      const planBtn = e.target.closest('[data-plan-opt]');
      if (planBtn) {
        togglePlanOption(planBtn.dataset.planGroup, planBtn.dataset.planOpt, planBtn.dataset.planMode);
        return;
      }

      const openOptBtn = e.target.closest('[data-open-opt]');
      if (openOptBtn) { openPlanComposer(openOptBtn.dataset.openOpt); return; }

      const addOptBtn = e.target.closest('[data-opt-add]');
      if (addOptBtn) { addCustomOption(addOptBtn.dataset.optAdd); return; }

      if (e.target.closest('#copySummaryBtn')) { copySummary(); return; }
      if (e.target.closest('#exportTxtBtn')) { exportSummaryTxt(); return; }
      if (e.target.closest('#clearWsBtn')) { handleClearAllClick(); return; }
    });

    $('appMain').addEventListener('input', (e) => {
      if (e.target.id === 'freeNote') {
        ws.freeNote = e.target.value;
        updateSummaryDOM();
        scheduleWorkspaceSave();
      }
    });

    $('appMain').addEventListener('change', (e) => {
      if (e.target.id === 'printSummaryChk') {
        ws.printSummaryUserSet = true;
        ws.printIncludeSummary = e.target.checked;
        document.body.classList.toggle('print-with-notes', ws.printIncludeSummary);
        scheduleWorkspaceSave();
      }
    });

    $('appMain').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        if (e.target.id === 'customHypInput') {
          e.preventDefault();
          addCustomHypothesis();
        } else if (e.target.dataset && e.target.dataset.optInput) {
          e.preventDefault();
          addCustomOption(e.target.dataset.optInput);
        }
      } else if (e.key === 'Escape' && e.target.dataset && e.target.dataset.optInput) {
        e.preventDefault();
        closePlanComposer(e.target.dataset.optInput);
      }
    });

    $('appMain').addEventListener('focusout', (e) => {
      if (e.target.dataset && e.target.dataset.optInput) {
        const gid = e.target.dataset.optInput;
        const val = e.target.value.trim();
        if (!val) {
          setTimeout(() => {
            const active = document.activeElement;
            if (active && active.dataset && (active.dataset.optAdd === gid || active.dataset.optInput === gid)) return;
            const cur = $('appMain').querySelector('[data-opt-input="' + gid + '"]');
            if (cur && !cur.value.trim()) closePlanComposer(gid);
          }, 120);
        }
      }
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && prefsOpen) {
        e.preventDefault();
        closePrefsSheet(true);
      }
    });

    window.addEventListener('resize', () => {
      if (prefsOpen) positionPrefsSheet();
    });

    window.addEventListener('scroll', () => {
      const bar = $('topbar');
      if (bar) bar.classList.toggle('is-scrolled', window.scrollY > 8);
    }, { passive: true });

    // ================= PWA INSTALL & SERVICE WORKER =================
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredInstall = e;
      $('installWrap').hidden = false;
    });
    $('installBtn').addEventListener('click', async () => {
      if (!deferredInstall) return;
      deferredInstall.prompt();
      try { await deferredInstall.userChoice; } catch {}
      deferredInstall = null;
      $('installWrap').hidden = true;
    });
    window.addEventListener('appinstalled', () => {
      deferredInstall = null;
      $('installWrap').hidden = true;
    });

    if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    }

    // Boot
    applyDisplayPrefs();
    $('pinInput').focus();
  })();
  </script>
</body>
</html>
