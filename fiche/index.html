    .float-top:hover { border-color: var(--teal-border); background: var(--surface); }
    @media (min-width: 1280px) { .float-top { display: none; } }

    .return-toast {
      position: fixed;
      bottom: 22px;
      inset-inline-end: 72px;
      z-index: 50;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 6px 6px 12px;
      border-radius: 999px;
      background: var(--glass-bg);
      backdrop-filter: blur(16px) saturate(170%);
      -webkit-backdrop-filter: blur(16px) saturate(170%);
      border: 1px solid var(--teal-border);
      box-shadow: var(--shadow-dock);
      color: var(--text);
      font-size: 0.76rem;
      font-weight: 600;
      opacity: 0;
      pointer-events: none;
      transform: translateY(12px);
      transition: opacity 200ms var(--ease), transform 200ms var(--ease);
    }
    html[dir="rtl"] .return-toast { padding: 6px 12px 6px 6px; }
    @media (min-width: 1280px) { .return-toast { inset-inline-end: 24px; } }
    .return-toast.is-visible { opacity: 1; pointer-events: auto; transform: translateY(0); }
    .return-go {
      border: 0;
      background: transparent;
      color: var(--teal-text);
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      padding: 2px 4px;
      border-radius: 999px;
    }
    .return-go:hover { text-decoration: underline; }
    .return-x {
      width: 22px;
      height: 22px;
      border-radius: 999px;
      border: 0;
      background: var(--surface-2);
      color: var(--text-3);
      display: inline-grid;
      place-items: center;
      cursor: pointer;
      padding: 0;
    }
    .return-x:hover { color: var(--text); background: var(--surface-3); }

    /* Mobile Floating Bottom Navigation Capsule (<= 639px — Always Fixed & Visible) */
    .mob-dock {
      display: none;
      position: fixed;
      left: 50%;
      bottom: calc(12px + env(safe-area-inset-bottom, 0px));
      z-index: 48;
      width: min(366px, calc(100vw - 24px));
      padding: 5px;
      border-radius: 999px;
      background: var(--glass-bg);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      border: 1px solid var(--glass-border);
      box-shadow: var(--shadow-dock);
      align-items: center;
      justify-content: space-between;
      gap: 4px;
      opacity: 1;
      pointer-events: auto;
      transform: translate(-50%, 0);
    }
    .mob-dock-btn {
      width: 36px;
      height: 36px;
      border-radius: 999px;
      border: 0;
      background: transparent;
      color: var(--text-2);
      display: inline-grid;
      place-items: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: background-color 140ms ease, color 140ms ease;
    }
    .mob-dock-btn:hover, .mob-dock-btn:active { background: var(--surface-2); color: var(--teal-text); }
    .mob-dock-btn:disabled { opacity: 0.3; pointer-events: none; }
    .mob-dock-center {
      flex: 1 1 auto;
      min-width: 0;
      height: 36px;
      border: 1px solid var(--teal-border);
      background: var(--teal-soft);
      color: var(--teal-text);
      border-radius: 999px;
      padding: 0 12px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      cursor: pointer;
      font-size: 0.78rem;
      font-weight: 700;
    }
    .mob-dock-num {
      font-family: var(--font-mono);
      font-size: 0.69rem;
      font-weight: 700;
      opacity: 0.85;
      font-variant-numeric: tabular-nums;
      flex-shrink: 0;
    }
    .mob-dock-title {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* Mobile Quick-Jump Bottom Sheet Drawer */
    .sheet-backdrop, .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 90;
      background: var(--backdrop);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      display: flex;
      align-items: flex-end;
      justify-content: center;
      animation: fadeBg 180ms ease both;
    }
    .modal-backdrop { align-items: center; padding: 16px; }
    @keyframes fadeBg { from { opacity: 0; } to { opacity: 1; } }

    .mob-sheet {
      width: 100%;
      max-width: 480px;
      background: var(--surface);
      border-top: 1px solid var(--glass-border);
      border-radius: 20px 20px 0 0;
      padding: 10px 16px calc(18px + env(safe-area-inset-bottom, 0px));
      box-shadow: var(--shadow-dock);
      max-height: 85vh;
      overflow-y: auto;
    }
    .mob-sheet.is-entering { animation: sheetUp 220ms var(--ease) both; }
    .sheet-filter-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 7px 10px;
      margin-bottom: 10px;
      border-radius: 10px;
      background: var(--amber-soft);
      border: 1px solid var(--amber-border);
      color: var(--amber-text);
      font-size: 0.76rem;
      font-weight: 600;
    }
    .sheet-filter-clear {
      border: 1px solid var(--amber-border);
      background: var(--surface);
      color: var(--amber-text);
      border-radius: 999px;
      padding: 2px 9px;
      font-size: 0.72rem;
      font-weight: 700;
      cursor: pointer;
      flex-shrink: 0;
    }
    @keyframes sheetUp { from { transform: translateY(28px); opacity: 0.5; } to { transform: translateY(0); opacity: 1; } }
    .sheet-handle {
      width: 36px;
      height: 4px;
      border-radius: 999px;
      background: var(--border-strong);
      margin: 0 auto 12px;
    }
    .sheet-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
      padding: 0 4px;
    }
    .sheet-title { margin: 0; font-size: 0.92rem; font-weight: 700; color: var(--text); }
    .sheet-list {
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-bottom: 14px;
    }
    .sheet-item {
      border: 1px solid transparent;
      background: transparent;
      color: var(--text);
      padding: 10px 12px;
      border-radius: 11px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      cursor: pointer;
      text-align: start;

    /* Interactive SVG Floating Tooltip */

    .viz-tip-title { font-weight: 700; color: var(--text); margin-bottom: 2px; }

    /* =========================================================================

    .drawer-head {

      margin: 0;
      padding: 8px 11px;
      border-radius: 7px;
      background: var(--bg);
      border: 1px solid var(--border-subtle);
      font-size: 0.85rem;
      color: var(--text);
      line-height: 1.58;
      unicode-bidi: plaintext;
    }
    .saved-note-in {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 7px;
      background: var(--bg);
      color: var(--text);
      padding: 6px 9px;
      font-size: 0.8rem;
      unicode-bidi: plaintext;
    }
    .saved-note-in:focus { outline: none; border-color: var(--teal); background: var(--surface); }

    /* Highlight-to-Save Floating Selection Pill */
    .sel-pop {
      position: fixed;
      top: 0;
      left: 0;
      z-index: 96;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px;
      border-radius: 999px;
      background: #0F172A;
      color: #FFFFFF;
      border: 1px solid rgba(255, 255, 255, 0.14);
      box-shadow: 0 10px 28px -6px rgba(15, 23, 42, 0.42);
      transform: translate3d(-9999px, -9999px, 0);
      opacity: 0;
      pointer-events: none;
      transition: opacity 130ms ease;
    }
    html[data-theme="dark"] .sel-pop { background: #1E293B; border-color: rgba(45, 212, 191, 0.35); }
    .sel-pop.is-visible { opacity: 1; pointer-events: auto; }
    .sel-pop-btn {
      border: 0;
      background: transparent;
      color: #FFFFFF;
      border-radius: 999px;
      padding: 5px 11px;
      font-size: 12px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      cursor: pointer;
      white-space: nowrap;
    }
    .sel-pop-btn:hover { background: rgba(255, 255, 255, 0.14); }
    .sel-pop-btn.is-primary { background: var(--teal-btn); }
    .sel-pop-btn.is-primary:hover { background: var(--teal-btn-hover); }

    /* Subtle Feedback Toast */
    .mini-toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translate(-50%, 14px);
      z-index: 98;
      padding: 8px 15px;
      border-radius: 999px;
      background: #0F172A;
      color: #FFFFFF;
      font-size: 12.5px;
      font-weight: 600;
      box-shadow: var(--shadow-dock);
      opacity: 0;
      pointer-events: none;
      transition: opacity 180ms ease, transform 180ms var(--ease);
      white-space: nowrap;
      max-width: calc(100vw - 28px);
      overflow: hidden;
      text-overflow: ellipsis;
    }
    html[data-theme="dark"] .mini-toast { background: #0D9488; }
    .mini-toast.is-visible { opacity: 1; transform: translate(-50%, 0); }

    /* Quiet 1-Tap Clinical Card Status Stamps (✓ / ? / ✕) */
    .card-stamp-bar {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 5px;
      margin-top: 9px;
      padding-top: 7px;
      border-top: 1px dashed var(--border-subtle);
    }
    .stamp-btn {
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text-3);
      border-radius: 999px;
      padding: 2.5px 8px;
      min-height: 25px;
      font-size: 0.7rem;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      opacity: 0.72;
      transition: opacity 140ms ease, background-color 140ms ease, border-color 140ms ease, color 140ms ease, transform 110ms ease;
    }
    .prose-item:hover .stamp-btn,
    .goal-row:hover .stamp-btn,
    .safety-card:hover .stamp-btn,
    .stamp-btn:focus-visible,
    .stamp-btn.is-active {
      opacity: 1;
    }
    @media (hover: none) {
      .stamp-btn { opacity: 0.92; }
    }
    .stamp-btn:hover {
      background: var(--surface-2);
      border-color: var(--border-strong);
      color: var(--text-2);
    }
    .stamp-btn:active { transform: scale(0.96); }
    .stamp-glyph {
      font-size: 0.72rem;
      font-weight: 800;
      line-height: 1;
    }
    .stamp-btn.is-confirm.is-active {
      background: var(--teal-soft);
      border-color: var(--teal-border);
      color: var(--teal-text);
      font-weight: 700;
    }
    .stamp-btn.is-follow.is-active {
      background: var(--amber-soft);
      border-color: var(--amber-border);
      color: var(--amber-text);
      font-weight: 700;
    }
    .stamp-btn.is-exclude.is-active {
      background: var(--surface-3);
      border-color: var(--border-strong);
      color: var(--text);
      font-weight: 700;
    }
    .is-stamped-exclude .prose-brief,
    .is-stamped-exclude .goal-brief,
    .is-stamped-exclude .safety-brief {
      opacity: 0.66;
    }

    /* Section 06 & Interview: 1-Tap Decision Chips */
    .q-chips-wrap {
      margin-top: 10px;
      padding-top: 9px;
      border-top: 1px dashed var(--border);
    }
    .q-chips-lbl {
      font-size: 0.68rem;
      font-weight: 700;
      color: var(--text-3);
      margin-bottom: 6px;
      letter-spacing: 0.015em;
    }
    .q-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .q-chip {
      border: 1px solid var(--border-strong);
      background: var(--bg);
      color: var(--text-2);
      border-radius: 8px;
      padding: 4.5px 10px;
      min-height: 30px;
      font-size: 0.75rem;
      font-weight: 600;
      line-height: 1.25;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      text-align: start;
      transition: background-color 140ms ease, border-color 140ms ease, color 140ms ease, box-shadow 140ms ease, transform 110ms ease;
    }
    .q-chip:hover {
      border-color: var(--teal-border);
      background: var(--teal-wash);
      color: var(--teal-text);
    }
    .q-chip:active { transform: scale(0.97); }
    .q-chip-mark {
      width: 14px;
      height: 14px;
      border-radius: 4px;
      border: 1.5px solid var(--border-strong);
      background: var(--surface);
      color: transparent;
      display: inline-grid;
      place-items: center;
      font-size: 9.5px;
      font-weight: 800;
      flex-shrink: 0;
      transition: all 130ms ease;
    }
    .q-chip.is-single .q-chip-mark { border-radius: 999px; }
    .q-chip.is-selected {
      background: var(--teal-btn);
      border-color: var(--teal-btn);
      color: #FFFFFF;
      box-shadow: 0 2px 8px -3px rgba(15, 118, 110, 0.45);
    }
    .q-chip.is-selected:hover {
      background: var(--teal-btn-hover);
      border-color: var(--teal-btn-hover);
      color: #FFFFFF;
    }
    .q-chip.is-selected .q-chip-mark {
      border-color: rgba(255, 255, 255, 0.85);
      background: rgba(255, 255, 255, 0.22);
      color: #FFFFFF;
    }

    /* Fast Yes / No / Later Verbal Screening Card */
    .quick-screen-card {
      margin-top: 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r-md);
      padding: 14px 15px;
      box-shadow: var(--shadow-card);
    }
    .ws-view .quick-screen-card { margin-top: 0; }
    .qs-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 11px;
    }
    .qs-title {
      margin: 0 0 2px;
      font-size: 0.88rem;
      font-weight: 750;
      color: var(--text);
      line-height: 1.3;
    }
    .qs-sub {
      margin: 0;
      font-size: 0.75rem;
      color: var(--text-3);
      line-height: 1.4;
    }
    .qs-count {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--teal-text);
      background: var(--teal-soft);
      border: 1px solid var(--teal-border);
      border-radius: 999px;
      padding: 2px 8px;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .qs-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 9px;
    }
    .qs-row {
      padding: 9px 11px;
      border-radius: var(--r-sm);
      background: var(--bg);
      border: 1px solid var(--border-subtle);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 8px;
      transition: border-color 140ms ease, background-color 140ms ease;
    }
    .qs-row.has-verdict { border-color: var(--border-strong); }
    .qs-row-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 7px;
    }
    .qs-q {
      margin: 0;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text);
      line-height: 1.4;
    }
    .qs-sec-pill {
      font-family: var(--font-mono);
      font-size: 0.64rem;
      font-weight: 700;
      color: var(--text-3);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 5px;
      padding: 1px 5px;
      flex-shrink: 0;
      cursor: pointer;
    }
    .qs-sec-pill:hover { border-color: var(--teal-border); color: var(--teal-text); }
    .qs-seg {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 4px;
    }
    .qs-btn {
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-2);
      border-radius: 7px;
      min-height: 30px;
      padding: 4px 6px;
      font-size: 0.73rem;
      font-weight: 650;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      transition: all 130ms ease;
    }
    .qs-btn:hover { border-color: var(--border-strong); color: var(--text); }
    .qs-btn:active { transform: scale(0.97); }
    .qs-btn.is-yes.is-active {
      background: var(--teal-btn);
      border-color: var(--teal-btn);
      color: #FFFFFF;
    }
    .qs-btn.is-no.is-active {
      background: var(--coral-soft);
      border-color: var(--coral-border);
      color: var(--coral-text);
      font-weight: 750;
    }
    .qs-btn.is-later.is-active {
      background: var(--amber-soft);
      border-color: var(--amber-border);
      color: var(--amber-text);
      font-weight: 750;
    }

    /* Section 06 Summary Call-to-Action Bar */
    .q-summary-cta {
      margin-top: 14px;
      padding: 11px 14px;
      border-radius: var(--r-md);
      background: var(--teal-wash);
      border: 1px solid var(--teal-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
    }
    .q-summary-cta-txt {
      font-size: 0.8rem;
      font-weight: 650;
      color: var(--teal-text);
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .q-summary-cta-acts {
      display: inline-flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 7px;
    }

    /* Automatic Consultation Decisions Summary Card (Notes Drawer & Mobile Summary Tab) */
    .auto-summary-card {
      padding: 12px 13px;
      border-radius: 10px;
      background: var(--bg);
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 11px;
    }
    .auto-sum-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 6px;
    }
    .auto-sum-title {
      font-size: 11.4px;
      font-weight: 750;
      text-transform: uppercase;
      letter-spacing: 0.055em;
      color: var(--teal-text);
    }
    html[dir="rtl"] .auto-sum-title { text-transform: none; letter-spacing: 0; font-size: 12.4px; }
    .auto-sum-lock {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 10.6px;
      font-weight: 600;
      color: var(--text-3);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 2px 8px;
    }
    .auto-sum-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding-top: 8px;
      border-top: 1px solid var(--border-subtle);
    }
    .auto-sum-group:first-of-type { padding-top: 2px; border-top: 0; }
    .auto-sum-gtitle {
      font-size: 10.8px;
      font-weight: 750;
      color: var(--text-3);
    }
    .auto-sum-row {
      display: flex;
      flex-direction: column;
      gap: 4px;
      padding: 7px 9px;
      border-radius: 8px;
      background: var(--surface);
      border: 1px solid var(--border);
    }
    .auto-sum-row-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 6px;
    }
    .auto-sum-label {
      border: 0;
      background: transparent;
      padding: 0;
      text-align: start;
      cursor: pointer;
      font-size: 12px;
      font-weight: 650;
      color: var(--text);
      line-height: 1.35;
      flex: 1 1 auto;
    }
    .auto-sum-label:hover { color: var(--teal-text); text-decoration: underline; }
    .auto-sum-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
    }
    .auto-sum-pill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      border-radius: 999px;
      padding: 2px 8px;
      font-size: 11px;
      font-weight: 700;
      background: var(--teal-soft);
      border: 1px solid var(--teal-border);
      color: var(--teal-text);
    }
    .auto-sum-pill.tone-no {
      background: var(--coral-soft);
      border-color: var(--coral-border);
      color: var(--coral-text);
    }
    .auto-sum-pill.tone-later,
    .auto-sum-pill.tone-follow {
      background: var(--amber-soft);
      border-color: var(--amber-border);
      color: var(--amber-text);
    }
    .auto-sum-pill.tone-exclude {
      background: var(--surface-3);
      border-color: var(--border-strong);
      color: var(--text-2);
    }
    .iv-opt-note-btn {
      align-self: flex-start;
      border: 1px dashed var(--border-strong);
      background: transparent;
      color: var(--text-3);
      border-radius: 999px;
      padding: 3px 10px;
      font-size: 0.72rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 130ms ease;
    }
    .iv-opt-note-btn:hover {
      border-color: var(--teal-border);
      background: var(--teal-wash);
      color: var(--teal-text);
    }
    .drawer-acts-sec {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 5px;
    }
    .drawer-acts-sec .drawer-act-btn {
      flex: 1 1 auto;
      padding: 5px 7px;
      font-size: 11px;
    }
    .notes-inline-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r-md);
      padding: 14px;
      box-shadow: var(--shadow-card);
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .ws-empty {
      padding: 24px 16px;
      border-radius: var(--r-md);
      border: 1px dashed var(--border-strong);
      background: var(--surface);
      text-align: center;
      color: var(--text-3);
      font-size: 0.84rem;
      line-height: 1.55;
    }
    .ws-back-btn {
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-2);
      border-radius: 999px;
      padding: 4px 11px;
      font-size: 0.74rem;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      cursor: pointer;
    }
    .ws-back-btn:hover { border-color: var(--teal-border); color: var(--teal-text); background: var(--teal-wash); }


    /* PWA Install Pill Button (Hidden Until Chrome Fires beforeinstallprompt) */
    .install-btn {
      height: 31px;
      padding: 0 10px;
      border-radius: 8px;
      border: 1px solid var(--teal-border);
      background: var(--teal-soft);
      color: var(--teal-text);
      font-size: 11.6px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
      transition: background-color 150ms ease, color 150ms ease, border-color 150ms ease;
    }
    .install-btn:hover { background: var(--teal-btn); color: #FFFFFF; border-color: var(--teal-btn); }
    .gate-install-btn {
      margin-top: 12px;
      width: 100%;
      height: 38px;
      border-radius: 9px;
      border: 1px solid var(--teal-border);
      background: var(--teal-wash);
      color: var(--teal-text);
      font-size: 0.82rem;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      cursor: pointer;
    }
    .gate-install-btn:hover { background: var(--teal-soft); }

    /* Mobile-First Section Quick-Jump Strip & 4-Tab Bottom App Bar */
    .mob-sec-strip { display: none; }
    .triage-swipe-hint { display: none; font-size: 0.72rem; font-weight: 600; color: var(--teal-text); }
    .mob-search-toggle, .mob-menu-btn { display: none; }

    .mob-tabbar {
      display: none;
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 55;
      background: var(--chrome);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      border-top: 1px solid var(--border-strong);
      padding: 5px 6px calc(6px + env(safe-area-inset-bottom, 0px));
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 3px;
    }
    .mob-tab {
      position: relative;
      border: 0;
      background: transparent;
      color: var(--text-3);
      padding: 4px 2px 3px;
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      cursor: pointer;
      min-height: 48px;
      transition: color 150ms ease, background-color 150ms ease;
    }
    .mob-tab-ico {
      position: relative;
      width: 44px;
      height: 26px;
      border-radius: 999px;
      display: inline-grid;
      place-items: center;
      transition: background-color 160ms var(--ease);
    }
    .mob-tab.is-active { color: var(--teal-text); font-weight: 700; }
    .mob-tab.is-active .mob-tab-ico { background: var(--teal-soft); }
    .mob-tab-lbl { font-size: 10.6px; font-weight: 600; line-height: 1.15; white-space: nowrap; }
    .mob-tab.is-active .mob-tab-lbl { font-weight: 700; }
    .mob-tab-badge {
      position: absolute;
      top: -2px;
      inset-inline-end: 4px;
      min-width: 15px;
      height: 15px;
      padding: 0 4px;
      border-radius: 999px;
      background: var(--teal-btn);
      color: #FFFFFF;
      font-family: var(--font-mono);
      font-size: 9px;
      font-weight: 700;
      line-height: 15px;
      text-align: center;
    }
    .mob-tab[data-tab="saved"] .mob-tab-badge { background: var(--amber); }
    .mob-tab[data-tab="interview"] .mob-tab-badge { background: var(--info); }

    /* =========================================================================
       RESPONSIVE BREAKPOINTS (MOBILE-FIRST <= 767px + ZERO OVERFLOW AT 390px)
       ========================================================================= */
    @media (min-width: 1024px) and (max-width: 1199px) {
      .chrome-inner { padding: 0 12px; gap: 6px; }
      .nav-link { padding: 4.5px 6px; font-size: 11.6px; gap: 3px; }
      .nav-num { display: none; }
      .search-shell { width: 136px; flex: 0 1 136px; }
      .seg-btn { padding: 3.5px 6.5px; font-size: 11.2px; }
      .ico-btn { width: 29px; height: 29px; }
    }

    @media (max-width: 1023px) {
      .chrome-inner {
        flex-wrap: wrap;
        padding: 8px 14px;
        gap: 7px 10px;
      }
      .chrome-controls { order: 1; width: 100%; justify-content: space-between; flex-wrap: wrap; gap: 7px; }
      .nav-links { order: 2; width: 100%; padding-top: 4px; border-top: 1px solid var(--border-subtle); }
      .search-shell { flex: 1 1 180px; width: auto; min-width: 148px; }
      .search-kbd { display: none; }
    }

    @media (max-width: 860px) {
      .triage-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .qs-grid { grid-template-columns: 1fr; }
    }

    @media (max-width: 767px) {
      .mob-tabbar { display: grid; }
      .mob-dock { display: none !important; }
      .float-top { display: none !important; }
      #notesBtn { display: none; }
      .lens-pill.is-view, .lens-pill.is-saved-view, .lens-sep, .ws-back-btn { display: none; }
      .brief-main { padding: 18px 16px calc(86px + env(safe-area-inset-bottom, 0px)); }
      .doc-title { font-size: 1.48rem; }
      html[dir="rtl"] .doc-title { font-size: 1.44rem; }
      .goals-list { grid-template-columns: 1fr; gap: 9px; }
      .safety-grid { grid-template-columns: 1fr; }
      .repleted-grid { grid-template-columns: 1fr; }
      .normal-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .q-grid { grid-template-columns: 1fr; }
      .return-toast, .mini-toast { bottom: calc(70px + env(safe-area-inset-bottom, 0px)); }
    }

    @media (max-width: 639px) {
      /* True Mobile-First Compact Single-Row Sticky App Header */
      .sticky-chrome { position: sticky; top: 0; z-index: 44; }
      .sticky-chrome .nav-links { display: none; }
      .mobile-top-progress { display: none; }
      #scBtn, #readShell, #printBtn, #themeBtn { display: none; }
      .mob-search-toggle, .mob-menu-btn { display: inline-grid; }

      .chrome-inner { padding: 6px 10px; min-height: 44px; gap: 5px; }

      function b64ToBytes(b64) {
        const bin = atob(String(b64 || "").replace(/\s+/g, ""));
        const arr = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
        return arr;

      function bytesToB64(bytes) {
        const arr = bytes instanceof Uint8Array ? bytes : new Uint8Array(bytes);
        let bin = "";
        const chunk = 0x8000;
        for (let i = 0; i < arr.length; i += chunk) {
          bin += String.fromCharCode.apply(null, arr.subarray(i, i + chunk));
        }
        return btoa(bin);
      }

      async function encryptWithPin(obj, pin, iterations) {
        const clean = String(pin || "").replace(/\s+/g, "");
        if (!clean) throw new Error("Missing session PIN");
        const salt = crypto.getRandomValues(new Uint8Array(16));
        const iv = crypto.getRandomValues(new Uint8Array(12));
        const iter = iterations || 120000;
        const keyMat = await crypto.subtle.importKey("raw", new TextEncoder().encode(clean), { name: "PBKDF2" }, false, ["deriveKey"]);
        const aesKey = await crypto.subtle.deriveKey(
          { name: "PBKDF2", salt, iterations: iter, hash: "SHA-256" },
          keyMat, { name: "AES-GCM", length: 256 }, false, ["encrypt"]
        );
        const ctBuf = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, aesKey, new TextEncoder().encode(JSON.stringify(obj)));
        return {
          v: 1,
          alg: "AES-256-GCM",
          kdf: "PBKDF2-SHA256",
          iter,
          salt: bytesToB64(salt),
          iv: bytesToB64(iv),
          ct: bytesToB64(new Uint8Array(ctBuf))
        };
      }

      async function decryptWithPin(env, pin) {
        const clean = String(pin || "").replace(/\s+/g, "");
        if (!env || !env.salt || !env.iv || !env.ct) throw new Error("Invalid encrypted envelope");
        const keyMat = await crypto.subtle.importKey("raw", new TextEncoder().encode(clean), { name: "PBKDF2" }, false, ["deriveKey"]);
        const aesKey = await crypto.subtle.deriveKey(
          { name: "PBKDF2", salt: b64ToBytes(env.salt), iterations: env.iter || 120000, hash: "SHA-256" },
          keyMat, { name: "AES-GCM", length: 256 }, false, ["decrypt"]
        );
        const buf = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64ToBytes(env.iv) }, aesKey, b64ToBytes(env.ct));
        return JSON.parse(new TextDecoder().decode(buf));
      }

      /* =======================================================================
         SEARCH NORMALIZATION & BIDI FORMATTER
         ======================================================================= */
      function normChar(ch) {
        if (/[\u064B-\u065F\u0670\u0640]/.test(ch)) return "";
        if (/[\u0622\u0623\u0625\u0671]/.test(ch)) return "\u0627";
        if (ch === "\u0629") return "\u0647";
        if (ch === "\u0649") return "\u064A";
        return ch.normalize("NFD").replace(/[\u0300-\u036F]/g, "").toLowerCase();
      }

      function normText(str) {
        const raw = String(str ?? "");
        let out = "";
        for (let i = 0; i < raw.length; i++) out += normChar(raw[i]);
        return out;
      }

      function findMatchRanges(raw, qNorm) {
        if (!qNorm) return [];
        const chars = [], starts = [], ends = [];
        for (let i = 0; i < raw.length; i++) {
          const nc = normChar(raw[i]);
          for (let j = 0; j < nc.length; j++) {
            chars.push(nc[j]);
            starts.push(i);
            ends.push(i + 1);
          }
        }
        const hay = chars.join("");
        const ranges = [];
        let pos = 0;
        while (pos <= hay.length - qNorm.length) {
          const idx = hay.indexOf(qNorm, pos);
          if (idx === -1) break;
          let rEnd = ends[idx + qNorm.length - 1];
          while (rEnd < raw.length && normChar(raw[rEnd]) === "" && /[\u0300-\u036F\u064B-\u065F\u0670]/.test(raw[rEnd])) rEnd++;
          ranges.push([starts[idx], rEnd]);
          pos = idx + qNorm.length;
        }
        return ranges;
      }

      function renderSliceWithHighlights(raw, sliceStart, sliceEnd, ranges) {
        if (!ranges.length) return esc(raw.slice(sliceStart, sliceEnd));
        let out = "", cur = sliceStart;
        for (let i = 0; i < ranges.length; i++) {
          const rs = Math.max(sliceStart, ranges[i][0]);
          const re = Math.min(sliceEnd, ranges[i][1]);
          if (re <= rs) continue;
          if (rs > cur) out += esc(raw.slice(cur, rs));
          out += '<mark class="hl">' + esc(raw.slice(rs, re)) + "</mark>";
          cur = re;
        }
        if (cur < sliceEnd) out += esc(raw.slice(cur, sliceEnd));
        return out;
      }

      function fmt(s, isRtl, qNorm) {
        const raw = String(s ?? "");
        const ranges = qNorm ? findMatchRanges(raw, qNorm) : [];
        if (!isRtl) return renderSliceWithHighlights(raw, 0, raw.length, ranges);
        LTR_RE.lastIndex = 0;
        let out = "", last = 0, m;
        while ((m = LTR_RE.exec(raw)) !== null) {
          if (m.index > last) out += renderSliceWithHighlights(raw, last, m.index, ranges);
          const full = m[0];
          const core = full.replace(/(?:\s+[+\-–—·=→/]+|[.,:;–—\-·=→/\s]+)+$/, "");
          const coreEnd = m.index + core.length;
          const fullEnd = m.index + full.length;
          if (core) {
            const cls = core.length <= 13 ? ' class="nowrap-bdi"' : "";
            out += '<bdi dir="ltr"' + cls + ">" + renderSliceWithHighlights(raw, m.index, coreEnd, ranges) + "</bdi>";
            if (fullEnd > coreEnd) out += renderSliceWithHighlights(raw, coreEnd, fullEnd, ranges);
          } else {
            out += renderSliceWithHighlights(raw, m.index, fullEnd, ranges);
          }
          last = fullEnd;
        }
        if (last < raw.length) out += renderSliceWithHighlights(raw, last, raw.length, ranges);
        return out;
      }

        setHidden(gateMoon, isDark);
        setHidden(gateSun, !isDark);

        gateThemeBtn.setAttribute("aria-label", label);

      function toggleTheme() {
        const next = root.getAttribute("data-theme") === "dark" ? "light" : "dark";
        root.setAttribute("data-theme", next);
        try { localStorage.setItem("fiche_theme", next); } catch {}
        syncThemeControl();

      function syncPill(pill, activeBtn, instant) {
        if (!pill || !activeBtn) return;
        const parent = pill.parentElement;
        if (!parent) return;
        const pr = parent.getBoundingClientRect();
        const br = activeBtn.getBoundingClientRect();
        if (!br.width) return;
        const bl = parseFloat(getComputedStyle(parent).borderLeftWidth) || 0;
        const x = br.left - pr.left - bl;
        if (instant) pill.style.transition = "none";
        pill.style.width = br.width.toFixed(2) + "px";
        pill.style.transform = "translate3d(" + x.toFixed(2) + "px, 0, 0)";
        pill.style.opacity = "1";
        if (instant) {
          void pill.offsetWidth;
          pill.style.transition = "";
        }
      }

      function syncAllPills(instant) {
        syncPill(langPill, langBtns.find((b) => b.dataset.loc === lang), instant);
        syncPill(densPill, densBtns.find((b) => b.dataset.dens === density), instant);
      }

        const st = getComputedStyle(stickyChrome);
        if (st.position === "sticky" || st.position === "fixed") {

      }

      function hasDecisionSelection(key) {
        const set = decisionChoices.get(key);
        return Boolean(set && set.size > 0);
      }

        return pinnedItems.has(key) || askedItems.has(key) || hasItemNote(key) || cardStamps.has(key) || hasDecisionSelection(key);
      }

      function getAnnotatedItemKeys() {
        return ALL_ITEM_KEYS.filter((k) => isItemAnnotated(k));

        let openAsks = 0;

      function getQuickMarksCount() {
        let cnt = 0;
        decisionChoices.forEach((set) => { if (set && set.size) cnt++; });
        cnt += quickVerdicts.size;

      function getItemMeta(key) {
        if (!data || !data[lang]) return null;
        const secs = data[lang].sections || {};
        const [prefix, idxStr] = String(key).split("-");
        const idx = Number(idxStr);
        if (prefix === "p" && secs.priorities && secs.priorities.goals && secs.priorities.goals[idx]) {
          const g = secs.priorities.goals[idx];
          return { key, secId: "priorities", secNum: secs.priorities.num, title: g.title, brief: g.brief || "" };
        }
        if (prefix === "cg" && secs.cognition && secs.cognition.items && secs.cognition.items[idx]) {
          const it = secs.cognition.items[idx];
          return { key, secId: "cognition", secNum: secs.cognition.num, title: it.lead, brief: it.brief || "" };
        }
        if (prefix === "sl" && secs.sleep && secs.sleep.items && secs.sleep.items[idx]) {
          const it = secs.sleep.items[idx];
          return { key, secId: "sleep", secNum: secs.sleep.num, title: it.lead, brief: it.brief || "" };
        }
        if (prefix === "md" && secs.mood && secs.mood.items && secs.mood.items[idx]) {
          const it = secs.mood.items[idx];
          return { key, secId: "mood", secNum: secs.mood.num, title: it.lead, brief: it.brief || "" };
        }
        if (prefix === "sf" && secs.safety && secs.safety.baselineItems && secs.safety.baselineItems[idx]) {
          const b = secs.safety.baselineItems[idx];
          return { key, secId: "safety", secNum: secs.safety.num, title: b.lead, brief: b.brief || "" };
        }
        if (prefix === "q" && secs.questions && secs.questions.items && secs.questions.items[idx]) {
          const q = secs.questions.items[idx];
          return { key, secId: "questions", secNum: secs.questions.num, title: q.lead, brief: q.text || "" };
        }
        return null;
      }

      function findBulletPassage(bulletId) {
        return savedPassages.find((p) => p.bulletId && p.bulletId === bulletId) || null;
      }

      function addSavedPassage(entry) {
        const cleanText = String(entry.text || "").replace(/\s+/g, " ").trim();
        if (!cleanText) return null;
        if (entry.bulletId) {
          const existing = findBulletPassage(entry.bulletId);
          if (existing) return existing;
        }
        const dup = savedPassages.find((p) => p.text === cleanText && p.sourceKey === (entry.sourceKey || ""));
        if (dup) return dup;
        const item = {
          id: "sp-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 6),
          sourceKey: entry.sourceKey || "",
          secId: entry.secId || "priorities",
          secNum: entry.secNum || "01",
          sourceTitle: entry.sourceTitle || "",
          label: entry.label || "",
          text: cleanText,
          note: entry.note || "",
          kind: entry.kind || "excerpt",
          bulletId: entry.bulletId || "",
          createdAt: new Date().toISOString()
        };
        savedPassages.unshift(item);
        scheduleWorkspaceSave();
        syncAllBadges();
        return item;
      }

      function removeSavedPassage(id) {
        const idx = savedPassages.findIndex((p) => p.id === id);
        if (idx === -1) return;
        const removed = savedPassages[idx];
        savedPassages.splice(idx, 1);
        if (removed.bulletId) {
          const btn = briefMain.querySelector('.bullet-save-btn[data-save-bullet="' + removed.bulletId + '"]');
          if (btn) {
            btn.classList.remove("is-saved");
            btn.setAttribute("aria-pressed", "false");
          }
        }
        scheduleWorkspaceSave();
        syncAllBadges();
        if (activeView === "saved") renderActiveView(false);
        if (notesOpen || activeView === "notes") renderNotesFeedInAllTargets();
      }

      function toggleBulletPassage(bulletId, secId, sourceKey, label, text) {
        if (!data || !data[lang]) return;
        const ui = data[lang].ui || {};
        const secs = data[lang].sections || {};
        const existing = findBulletPassage(bulletId);
        const btn = briefMain.querySelector('.bullet-save-btn[data-save-bullet="' + bulletId + '"]');
        if (existing) {
          removeSavedPassage(existing.id);
          if (btn) {
            btn.classList.remove("is-saved");
            btn.setAttribute("aria-pressed", "false");
            btn.setAttribute("title", ui.saveBulletAdd || "Save passage");
            btn.setAttribute("aria-label", ui.saveBulletAdd || "Save passage");
          }
          return;
        }
        const meta = sourceKey ? getItemMeta(sourceKey) : null;
        const secObj = secs[secId] || secs.priorities;
        addSavedPassage({
          bulletId,
          sourceKey: sourceKey || "",
          secId: (meta && meta.secId) || secId || "priorities",
          secNum: (meta && meta.secNum) || (secObj && secObj.num) || "01",
          sourceTitle: (meta && meta.title) || (secObj && secObj.title) || "",
          label: label || "",
          text,
          kind: bulletId === "chief" ? "chief" : "bullet"
        });
        if (btn) {
          btn.classList.add("is-saved");
          btn.setAttribute("aria-pressed", "true");
          btn.setAttribute("title", ui.saveBulletRemove || "Remove saved passage");
          btn.setAttribute("aria-label", ui.saveBulletRemove || "Remove saved passage");
        }
        showMiniToast(ui.savedPassageToast || "Passage saved ✓");
        if (notesOpen || activeView === "notes") renderNotesFeedInAllTargets();
      }

      /* =======================================================================
         CONSULTATION TIMER
         ======================================================================= */
      function formatTimer(sec) {
        const m = Math.floor(sec / 60);
        const s = sec % 60;
        return String(m).padStart(2, "0") + ":" + String(s).padStart(2, "0");
      }

      function syncTimerDOM() {
        const valEl = document.getElementById("ivTimerVal");
        if (valEl) valEl.textContent = formatTimer(timerSec);
        const btnEl = document.getElementById("ivTimerToggle");
        if (btnEl && data && data[lang]) {
          const ui = data[lang].ui || {};
          btnEl.classList.toggle("is-running", timerRunning);
          btnEl.textContent = timerRunning ? (ui.timerPause || "Pause") : (ui.timerStart || "Start");
        }
      }

      function toggleConsultationTimer() {
        if (timerRunning) {
          timerRunning = false;
          clearInterval(timerInterval);
          timerInterval = 0;
        } else {
          timerRunning = true;
          clearInterval(timerInterval);
          timerInterval = window.setInterval(() => {
            timerSec += 1;
            const valEl = document.getElementById("ivTimerVal");
            if (valEl) valEl.textContent = formatTimer(timerSec);
          }, 1000);
        }
        syncTimerDOM();
      }

      function resetConsultationTimer() {
        timerRunning = false;
        clearInterval(timerInterval);
        timerInterval = 0;
        timerSec = 0;
        syncTimerDOM();
      }

      /* =======================================================================
         LENS & EXPAND HELPERS
         ======================================================================= */
      function lensAllowsSection(secId, lens) {
        if (lens === "all") return true;
        if (lens === "safety") return secId === "mood" || secId === "safety" || secId === "questions";
        if (lens === "clinical") return secId === "priorities" || secId === "cognition" || secId === "sleep" || secId === "mood";
        if (lens === "decisions") return secId === "questions";
        if (lens === "annotated") return true;
        return true;
      }

      function lensAllowsItem(key, secId, lens) {
        if (lens === "all") return true;
        if (lens === "safety") return SAFETY_LENS_KEYS.has(key);
        if (lens === "clinical") return secId === "priorities" || secId === "cognition" || secId === "sleep" || secId === "mood";
        if (lens === "decisions") return secId === "questions";
        if (lens === "annotated") return isItemAnnotated(key);
        return true;
      }

      function getVisibleExpandableKeys() {
        return Array.from(briefMain.querySelectorAll("[data-exp-card]")).map((el) => el.dataset.expCard);
      }

      function getSectionExpandableKeysFromDOM(secId) {
        const secEl = document.getElementById("sec-" + secId);
        if (!secEl) return [];
        return Array.from(secEl.querySelectorAll("[data-exp-card]")).map((el) => el.dataset.expCard);
      }

      function getSectionExpandableKeys(secs, secId) {
        const keys = [];
        if (!secs) return keys;
        if (secId === "priorities" && secs.priorities && secs.priorities.goals) {
          secs.priorities.goals.forEach((g, i) => { if (hasItemDetail(g)) keys.push("p-" + i); });
        } else if (secId === "cognition" && secs.cognition && secs.cognition.items) {
          secs.cognition.items.forEach((it, i) => { if (hasItemDetail(it)) keys.push("cg-" + i); });
        } else if (secId === "sleep" && secs.sleep && secs.sleep.items) {
          secs.sleep.items.forEach((it, i) => { if (hasItemDetail(it)) keys.push("sl-" + i); });
        } else if (secId === "mood" && secs.mood && secs.mood.items) {
          secs.mood.items.forEach((it, i) => { if (hasItemDetail(it)) keys.push("md-" + i); });
        } else if (secId === "safety" && secs.safety && secs.safety.baselineItems) {
          secs.safety.baselineItems.forEach((b, i) => { if (hasItemDetail(b)) keys.push("sf-" + i); });
        }
        return keys;
      }

      function getAllExpandableKeys(secs) {
        return ["priorities", "cognition", "sleep", "mood", "safety"]
          .flatMap((id) => getSectionExpandableKeys(secs, id));
      }

      function applyItemOpenDOM(key, isOpen) {
        if (!data || !data[lang]) return;
        const ui = data[lang].ui || {};
        const card = briefMain.querySelector('[data-exp-card="' + key + '"]');
        if (card) card.classList.toggle("is-open", isOpen);
        const btn = briefMain.querySelector('.item-expand[data-item-key="' + key + '"]');
        if (btn) {
          btn.setAttribute("aria-expanded", isOpen ? "true" : "false");
          const fullLbl = isOpen ? (ui.collapseDetail || "Hide detail") : (ui.expandDetail || "Show detail");
          const shortLbl = isOpen ? (ui.collapseShort || "Hide") : (ui.expandShort || "Details");
          btn.setAttribute("title", fullLbl);
          btn.setAttribute("aria-label", fullLbl);
          const span = btn.querySelector("span");
          if (span) span.textContent = shortLbl;
        }
      }

      function syncExpandStateUI() {
        if (!data || !data[lang]) return;
        const secs = data[lang].sections || {};
        const ui = data[lang].ui || {};
        const visKeys = getVisibleExpandableKeys();
        const allKeys = visKeys.length ? visKeys : getAllExpandableKeys(secs);
        const openCount = allKeys.filter((k) => expandedItems.has(k)).length;
        const allOpen = allKeys.length > 0 && openCount === allKeys.length;

        const counterEl = document.getElementById("briefCounter");
        if (counterEl) {
          counterEl.textContent = (ui.openedCount || "{open}/{total}").replace("{open}", String(openCount)).replace("{total}", String(allKeys.length));
        }
        const globalBtn = document.getElementById("briefToggleAll");
        if (globalBtn) {
          globalBtn.dataset.toggleAll = allOpen ? "collapse" : "expand";
          globalBtn.textContent = allOpen ? (ui.collapseAll || "Collapse all") : (ui.expandAll || "Expand all");
        }
        const railExp = document.getElementById("railExpandBtn");
        if (railExp) {
          railExp.dataset.railAct = allOpen ? "collapse-all" : "expand-all";
          railExp.textContent = allOpen ? (ui.collapseAll || "Collapse all") : (ui.expandAll || "Expand all");
        }
        briefMain.querySelectorAll(".sec-expand-btn[data-sec-expand]").forEach((btn) => {
          const secId = btn.dataset.secExpand;
          const keys = getSectionExpandableKeysFromDOM(secId);
          const secAllOpen = keys.length > 0 && keys.every((k) => expandedItems.has(k));
          btn.classList.toggle("is-all-open", secAllOpen);
          btn.setAttribute("aria-expanded", secAllOpen ? "true" : "false");
          btn.textContent = secAllOpen
            ? (ui.secCollapse || "Collapse")
            : (ui.secExpand || "Expand ({n})").replace("{n}", String(keys.length));
        });
        window.setTimeout(updateScrollUI, 260);
      }

      function toggleItemInPlace(key, forceOpen) {
        if (density !== "brief") return;
        const next = typeof forceOpen === "boolean" ? forceOpen : !expandedItems.has(key);
        if (next) expandedItems.add(key);
        else expandedItems.delete(key);
        applyItemOpenDOM(key, next);
        syncExpandStateUI();
      }

      function toggleSectionInPlace(secId) {
        if (density !== "brief" || !data || !data[lang]) return;
        const keys = getSectionExpandableKeysFromDOM(secId);
        if (!keys.length) return;
        const allOpen = keys.every((k) => expandedItems.has(k));
        const next = !allOpen;
        keys.forEach((k) => {
          if (next) expandedItems.add(k);
          else expandedItems.delete(k);
          applyItemOpenDOM(k, next);
        });
        syncExpandStateUI();
      }

      function toggleAllInPlace(forceMode) {
        if (density !== "brief" || !data || !data[lang]) return;
        const allKeys = getVisibleExpandableKeys();
        if (!allKeys.length) return;
        const allOpen = allKeys.every((k) => expandedItems.has(k));
        const openAll = forceMode ? forceMode === "expand" : !allOpen;
        allKeys.forEach((k) => {
          if (openAll) expandedItems.add(k);
          else expandedItems.delete(k);
          applyItemOpenDOM(k, openAll);
        });
        syncExpandStateUI();
      }

      function getStampMeta(stampVal, ui) {
        if (stampVal === "confirm") return { glyph: "✓", short: ui.stampConfirm || "Confirmed", full: ui.stampConfirmFull || "Confirmed / important", tone: "confirm" };
        if (stampVal === "follow") return { glyph: "?", short: ui.stampFollow || "Follow-up", full: ui.stampFollowFull || "Follow-up / verify", tone: "follow" };
        if (stampVal === "exclude") return { glyph: "✕", short: ui.stampExclude || "Unlikely", full: ui.stampExcludeFull || "Unlikely / excluded", tone: "exclude" };
        return null;
      }

      function getVerdictMeta(verdictVal, ui) {
        if (verdictVal === "yes") return { label: ui.verdictYes || "Yes", tone: "yes" };
        if (verdictVal === "no") return { label: ui.verdictNo || "No", tone: "no" };
        if (verdictVal === "later") return { label: ui.verdictLater || "Later", tone: "later" };
        return null;
      }

      function getDecisionOptionLabel(qKey, optId) {
        const cfg = data && data[lang] && data[lang].decisionConfig && data[lang].decisionConfig[qKey];
        if (!cfg || !Array.isArray(cfg.options)) return optId;
        const found = cfg.options.find((o) => o.id === optId);
        return found ? found.label : optId;

      function renderDecisionChips(qKey, ui, isRtl) {
        const cfg = data && data[lang] && data[lang].decisionConfig && data[lang].decisionConfig[qKey];
        if (!cfg || !Array.isArray(cfg.options) || !cfg.options.length) return "";

      function renderPrintNotesHtml(ui) {
        const isRtl = Boolean(data && data[lang] && data[lang].dir === "rtl");
        const d = data && data[lang];
        const secs = (d && d.sections) || {};
        const qItems = (secs.questions && secs.questions.items) || [];
        const screens = (d && Array.isArray(d.quickScreens)) ? d.quickScreens : [];
        const gen = generalNote.trim();

        const blocks = [];

        // 1. Consultation Decisions (Section 06)
        const decLines = [];
        qItems.forEach((q, i) => {
          const k = "q-" + i;
          const set = decisionChoices.get(k);
          const labels = set ? Array.from(set).map((oid) => getDecisionOptionLabel(k, oid)) : [];
          const note = (itemNotes.get(k) || "").trim();
          if (labels.length || discussedQuestions.has(k) || note) {
            decLines.push(
              "<li><strong>[" + String(i + 1).padStart(2, "0") + "] " + fmt(q.lead, isRtl, "") + "</strong>"
              + (labels.length ? " — " + labels.map((lb) => fmt(lb, isRtl, "")).join(" · ") : "")
              + (note ? " (" + esc(note) + ")" : "")
              + "</li>"
            );
          }
        });
        if (decLines.length) {
          blocks.push('<h4 class="print-notes-subhead">' + esc(ui.summaryDecisionsTitle || "Consultation Decisions") + '</h4><ul class="print-notes-list">' + decLines.join("") + "</ul>");
        }

        // 2. Quick Verbal Screening Verdicts
        const qsLines = [];
        screens.forEach((sc) => {
          const v = quickVerdicts.get(sc.id);
          const vm = getVerdictMeta(v, ui);
          if (vm) {
            qsLines.push("<li><strong>" + esc(vm.label) + "</strong> — " + fmt(sc.label, isRtl, "") + "</li>");
          }
        });
        if (qsLines.length) {
          blocks.push('<h4 class="print-notes-subhead">' + esc(ui.summaryScreensTitle || "Quick Verbal Screening") + '</h4><ul class="print-notes-list">' + qsLines.join("") + "</ul>");
        }

        // 3. Stamped / Annotated Clinical Cards + Saved Passages + Probe Answers
        const otherLines = [];
        ALL_ITEM_KEYS.filter((k) => !k.startsWith("q-")).forEach((k) => {
          const st = cardStamps.get(k);
          const note = (itemNotes.get(k) || "").trim();
          const saved = pinnedItems.has(k);
          const asked = askedItems.has(k);
          if (!st && !note && !saved && !asked) return;
          const meta = getItemMeta(k);
          if (!meta) return;
          const stm = getStampMeta(st, ui);
          const tag = stm ? "[" + stm.glyph + " " + stm.short + "] " : "";
          const marks = (saved ? "★ " : "") + (asked ? "? " : "");
          otherLines.push("<li><strong>" + esc(tag) + marks + "[" + esc(meta.secNum) + "] " + fmt(meta.title, isRtl, "") + "</strong>" + (note ? " — " + esc(note) : "") + "</li>");
        });
        savedPassages.forEach((p) => {
          otherLines.push("<li><strong>[" + esc(p.secNum) + "] « " + esc(p.text.slice(0, 140)) + (p.text.length > 140 ? "…" : "") + " »</strong>" + (p.note ? " — " + esc(p.note) : "") + "</li>");
        });
        if (d && Array.isArray(d.interviewProbes)) {
          d.interviewProbes.forEach((pr) => {
            const ans = (probeAnswers.get(pr.id) || "").trim();
            if (ans) otherLines.push("<li><strong>[" + esc(pr.secNum) + "] " + fmt(pr.title, isRtl, "") + "</strong> — " + esc(ans) + "</li>");
          });
        }
        if (otherLines.length) {
          blocks.push('<h4 class="print-notes-subhead">' + esc(ui.summaryStampsTitle || "Clinical Marks & Notes") + '</h4><ul class="print-notes-list">' + otherLines.join("") + "</ul>");
        }

        if (!gen && !blocks.length) return "";
        return '<section class="print-notes-section" aria-label="' + esc(ui.notesPrintHeading || "Clinician Summary") + '">'
          + '<h3 class="print-notes-title">' + esc(ui.notesPrintHeading || "Consultation Decisions Summary & Notes") + "</h3>"
          + (gen ? '<p class="print-notes-gen" dir="auto">' + esc(gen) + "</p>" : "")
          + blocks.join("")
        + "</section>";
      }

        if (!data || !data[lang]) return;
        const cfg = data[lang].decisionConfig && data[lang].decisionConfig[qKey];
        if (!cfg) return;
        let selSet = decisionChoices.get(qKey);
        if (!selSet) {
          selSet = new Set();
          decisionChoices.set(qKey, selSet);
        }
        if (cfg.mode === "single") {
          if (selSet.has(optId)) selSet.clear();
          else {
            selSet.clear();
            selSet.add(optId);
          }
        } else {
          if (selSet.has(optId)) selSet.delete(optId);
          else selSet.add(optId);
        }
        if (selSet.size === 0) {
          decisionChoices.delete(qKey);
          if (!hasItemNote(qKey)) discussedQuestions.delete(qKey);
        } else {
          discussedQuestions.add(qKey);

        if (activeView === "brief" && activeLens === "annotated" && !isItemAnnotated(qKey)) {
          renderBrief(false);

      function hideSelPop() {
        pendingSel = null;
        if (selPop) {
          selPop.classList.remove("is-visible");
          selPop.style.transform = "translate3d(-9999px, -9999px, 0)";
        }
      }

      function evaluateTextSelection() {
        if (!data || !data[lang] || appShell.hidden || activeView !== "brief") { hideSelPop(); return; }
        const sel = window.getSelection && window.getSelection();
        if (!sel || sel.isCollapsed || sel.rangeCount === 0) { hideSelPop(); return; }
        const txt = String(sel.toString() || "").replace(/\s+/g, " ").trim();
        if (txt.length < 10) { hideSelPop(); return; }

        const range = sel.getRangeAt(0);
        const anchorNode = range.commonAncestorContainer;
        const anchorEl = anchorNode.nodeType === 1 ? anchorNode : anchorNode.parentElement;
        if (!anchorEl || !briefMain.contains(anchorEl)) { hideSelPop(); return; }
        if (anchorEl.closest("input, textarea, .note-editor, .lens-bar, .mob-sec-strip, .triage-strip")) { hideSelPop(); return; }

        const rect = range.getBoundingClientRect();
        if (!rect || (rect.width === 0 && rect.height === 0)) { hideSelPop(); return; }

        const cardEl = anchorEl.closest("[id^='item-']");
        const secEl = anchorEl.closest("section[id^='sec-']");
        const sourceKey = cardEl ? cardEl.id.replace(/^item-/, "") : "";
        const meta = sourceKey ? getItemMeta(sourceKey) : null;
        const secId = (meta && meta.secId) || (secEl ? secEl.id.replace(/^sec-/, "") : "priorities");
        const secObj = (data[lang].sections && data[lang].sections[secId]) || data[lang].sections.priorities;

        pendingSel = {
          text: txt,
          sourceKey,
          secId,
          secNum: (meta && meta.secNum) || (secObj && secObj.num) || "01",
          sourceTitle: (meta && meta.title) || (secObj && secObj.title) || ""
        };

        const ui = data[lang].ui || {};
        if (selSaveTxt) selSaveTxt.textContent = ui.selSaveBtn || "Save passage";
        if (selNoteTxt) selNoteTxt.textContent = ui.selNoteBtn || "Annotate";

        selPop.classList.add("is-visible");
        const pw = selPop.offsetWidth || 210;
        const ph = selPop.offsetHeight || 38;
        const pad = 10;
        let x = rect.left + rect.width / 2 - pw / 2;
        x = Math.max(pad, Math.min(window.innerWidth - pw - pad, x));
        const minTop = (stickyChrome ? Math.max(0, stickyChrome.getBoundingClientRect().bottom) : 0) + 6;
        const maxBottom = Math.max(minTop, window.innerHeight - ph - (isMobileViewport() ? 72 : 16));
        let y = rect.top - ph - 10;
        if (y < minTop) y = rect.bottom + 10;
        y = Math.max(minTop, Math.min(maxBottom, y));
        selPop.style.transform = "translate3d(" + Math.round(x) + "px," + Math.round(y) + "px,0)";
      }

      document.addEventListener("selectionchange", () => {
        clearTimeout(selDebounce);
        selDebounce = window.setTimeout(evaluateTextSelection, 90);
      });
      document.addEventListener("mouseup", () => {
        clearTimeout(selDebounce);
        selDebounce = window.setTimeout(evaluateTextSelection, 40);
      });
      document.addEventListener("touchend", () => {
        clearTimeout(selDebounce);
        selDebounce = window.setTimeout(evaluateTextSelection, 140);
      });

      if (selPop) {
        selPop.addEventListener("pointerdown", (e) => { e.preventDefault(); });
      }
      if (selSaveBtn) {
        selSaveBtn.addEventListener("click", () => {
          if (!pendingSel || !data || !data[lang]) return;
          const payload = pendingSel;
          addSavedPassage({
            sourceKey: payload.sourceKey,

      /* =======================================================================
         AUTOMATIC CONSULTATION DECISIONS SUMMARY & LOCAL ENCRYPTED WORKSPACE
         ======================================================================= */
      function buildSummaryText() {
        if (!data || !data[lang]) return "";
        const d = data[lang];
        const ui = d.ui || {};
        const secs = d.sections || {};
        const qItems = (secs.questions && secs.questions.items) || [];
        const screens = Array.isArray(d.quickScreens) ? d.quickScreens : [];
        const lines = [];

        lines.push("# " + (ui.notesPrintHeading || "Consultation Decisions Summary") + " — " + d.title + " (" + d.date + ")");
        lines.push("Date: " + new Date().toISOString().slice(0, 16).replace("T", " "));

        // 1. Consultation Decisions (Section 06)
        const decLines = [];
        qItems.forEach((q, i) => {
          const k = "q-" + i;
          const set = decisionChoices.get(k);
          const labels = set ? Array.from(set).map((oid) => getDecisionOptionLabel(k, oid)) : [];
          const note = (itemNotes.get(k) || "").trim();
          const done = discussedQuestions.has(k);
          if (labels.length || done || note) {
            decLines.push("- [" + (done || labels.length ? "x" : " ") + "] " + String(i + 1).padStart(2, "0") + ". " + q.lead + (labels.length ? " : " + labels.join(" · ") : ""));
            if (note) decLines.push("  → " + note.replace(/\n/g, "\n    "));
          }
        });
        if (decLines.length) {
          lines.push("");
          lines.push("## " + (ui.summaryDecisionsTitle || (secs.questions ? secs.questions.num + " · " + secs.questions.title : "Consultation Decisions")));
          lines.push.apply(lines, decLines);
        }

        // 2. Quick Verbal Screening Verdicts (Yes / No / Later)
        const qsLines = [];
        screens.forEach((sc) => {
          const v = quickVerdicts.get(sc.id);
          const vm = getVerdictMeta(v, ui);
          if (vm) {
            qsLines.push("- [" + vm.label + "] [" + sc.secNum + "] " + sc.label);
          }
        });
        if (qsLines.length) {
          lines.push("");
          lines.push("## " + (ui.summaryScreensTitle || "Quick Verbal Screening"));
          lines.push.apply(lines, qsLines);
        }

        // 3. Stamped Clinical Cards (✓ / ? / ✕)
        const stampLines = [];
        ALL_ITEM_KEYS.filter((k) => cardStamps.has(k)).forEach((k) => {
          const meta = getItemMeta(k);
          const stm = getStampMeta(cardStamps.get(k), ui);
          if (!meta || !stm) return;
          const note = (itemNotes.get(k) || "").trim();
          stampLines.push("- [" + stm.glyph + " " + stm.short + "] [" + meta.secNum + "] " + meta.title);
          if (note) stampLines.push("  → " + note.replace(/\n/g, "\n    "));
        });
        if (stampLines.length) {
          lines.push("");
          lines.push("## " + (ui.summaryStampsTitle || "Stamped Clinical Items"));
          lines.push.apply(lines, stampLines);
        }

        // 4. Optional Free-Text General Note
        if (generalNote.trim()) {
          lines.push("");
          lines.push("## " + (ui.notesGeneralLabel || "Additional note"));
          lines.push(generalNote.trim());
        }

        // 5. Saved Passages & Excerpts
        if (savedPassages.length) {
          lines.push("");
          lines.push("## " + (ui.savedTitle || "Saved Passages"));
          savedPassages.forEach((p) => {
            lines.push("> [" + p.secNum + "] " + p.sourceTitle + (p.label ? " · " + p.label : ""));
            lines.push("> " + p.text);
            if (p.note && p.note.trim()) lines.push("  → " + p.note.trim());
          });
        }

        // 6. Clinical Probes
        if (Array.isArray(d.interviewProbes)) {
          const probeLines = [];
          d.interviewProbes.forEach((pr) => {
            const done = probeDone.has(pr.id);
            const ans = (probeAnswers.get(pr.id) || "").trim();
            if (done || ans) {
              probeLines.push((done ? "- [x] " : "- [ ] ") + "[" + pr.secNum + "] " + pr.title);
              if (ans) probeLines.push("  → " + ans.replace(/\n/g, "\n    "));
            }
          });
          if (probeLines.length) {
            lines.push("");
            lines.push("## " + (ui.interviewProbesTitle || "Clinical Probes"));
            lines.push.apply(lines, probeLines);
          }
        }

        // 7. Other Saved / Asked / Commented Cards (not already listed under Decisions or Stamps)
        const otherKeys = getAnnotatedItemKeys().filter((k) => !k.startsWith("q-") && !cardStamps.has(k));
        if (otherKeys.length) {
          lines.push("");
          lines.push("## " + (ui.notesItemsLabel || "Saved, Asked & Commented Items"));
          otherKeys.forEach((k) => {
            const meta = getItemMeta(k);
            if (!meta) return;
            const marks = (pinnedItems.has(k) ? "★ " : "") + (askedItems.has(k) ? (askedDone.has(k) ? "[?✓] " : "[?] ") : "");
            const note = (itemNotes.get(k) || "").trim();
            lines.push("- " + marks + "[" + meta.secNum + "] " + meta.title);
            if (note) lines.push("  → " + note.replace(/\n/g, "\n    "));
          });
        }

        return lines.join("\n");
      }

      async function copySummaryToClipboard(btnEl) {
        if (!data || !data[lang]) return;
        const ui = data[lang].ui || {};
        const txt = buildSummaryText();
        if (!txt) return;
        let ok = false;
        try {
          if (navigator.clipboard && navigator.clipboard.writeText) {
            await navigator.clipboard.writeText(txt);
            ok = true;
          }
        } catch {}
        if (!ok) {
          const tmp = document.createElement("textarea");
          tmp.value = txt;
          tmp.style.position = "fixed";
          tmp.style.opacity = "0";
          document.body.appendChild(tmp);
          tmp.select();
          try { document.execCommand("copy"); } catch {}
          tmp.remove();
        }
        const span = btnEl ? btnEl.querySelector("span") : null;
        if (span) span.textContent = ui.notesCopied || "Copied ✓";
        showMiniToast(ui.notesCopied || "Copied ✓");
        clearTimeout(copyResetTimer);
        copyResetTimer = window.setTimeout(() => {
          if (span && data && data[lang]) span.textContent = (data[lang].ui && data[lang].ui.notesCopy) || "Copy summary";
        }, 2000);
      }

      async function handleNotesContainerClick(e, container) {
        if (!data || !data[lang]) return false;

          setNotesOpen(false, true);

          syncDecisionChipsDOM(qKey);
          syncAllBadges();

        }
        const rmQs = e.target.closest("[data-sum-rm-qs]");
        if (rmQs) {

          renderNotesFeedInAllTargets();

        const rmStamp = e.target.closest("[data-sum-rm-stamp]");
        if (rmStamp) {

          renderNotesFeedInAllTargets();

        const tplBtn = e.target.closest("[data-drawer-tpl]");
        if (tplBtn) {

          if (ta) {

            const sep = ta.value && !ta.value.endsWith("\n") ? "\n" : "";
            ta.value = ta.value + sep + tpl;
            generalNote = ta.value;
            scheduleWorkspaceSave();
            ta.focus();
            ta.setSelectionRange(ta.value.length, ta.value.length);
            syncAllBadges();
            renderNotesFeedInAllTargets();
          }
          return true;
        }
        const delPass = e.target.closest("[data-del-passage]");
        if (delPass) {
          removeSavedPassage(delPass.dataset.delPassage);
          return true;
        }
        const jumpBtn = e.target.closest("[data-drawer-jump]");
        if (jumpBtn) {
          const k = jumpBtn.dataset.drawerJump;
          const s = jumpBtn.dataset.drawerSec;
          if (window.innerWidth < 1180) setNotesOpen(false, false);
          jumpToSection(s, { itemKey: k });

        }
        const pinBtn = e.target.closest("[data-drawer-pin]");

          toggleSaveCard(pinBtn.dataset.drawerPin);

        const editBtn = e.target.closest("[data-drawer-edit]");
        if (editBtn) {
          const k = editBtn.dataset.drawerEdit;
          const s = editBtn.dataset.drawerSec;
          if (window.innerWidth < 1180) setNotesOpen(false, false);
          jumpToSection(s, { itemKey: k });
          window.setTimeout(() => openInlineComment(k, true), 260);
          return true;
        }
        const delBtn = e.target.closest("[data-drawer-del]");
        if (delBtn) {
          deleteItemNote(delBtn.dataset.drawerDel);
          return true;
        }
        if (e.target.closest("[data-print-toggle-row]") || e.target.closest("[data-print-switch]")) {
          includeNotesInPrint = !includeNotesInPrint;
          document.body.classList.toggle("print-with-notes", includeNotesInPrint);
          document.querySelectorAll("[data-print-switch]").forEach((sw) => {
            sw.setAttribute("aria-checked", includeNotesInPrint ? "true" : "false");
          });
          scheduleWorkspaceSave();
          syncPrintNotesDOM();
          return true;
        }
        const copyBtn = e.target.closest("[data-notes-copy]");
        if (copyBtn) {
          await copySummaryToClipboard(copyBtn);
          return true;
        }
        if (e.target.closest("[data-notes-share]")) {
          const txt = buildSummaryText();
          if (!txt) return true;
          if (navigator.share) {
            try {
              await navigator.share({ title: data[lang].title || "Fiche Clinique", text: txt });
              return true;
            } catch {}
          }
          await copySummaryToClipboard(null);
          return true;
        }
        if (e.target.closest("[data-notes-exp-txt]")) {
          const txt = buildSummaryText();
          if (!txt) return true;
          const blob = new Blob([txt], { type: "text/plain;charset=utf-8" });
          const url = URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.href = url;
          a.download = "synthese-consultation-" + lang + ".txt";
          document.body.appendChild(a);
          a.click();
          a.remove();
          window.setTimeout(() => URL.revokeObjectURL(url), 1000);
          return true;
        }
        const clrBtn = e.target.closest("[data-notes-clear]");
        if (clrBtn) {
          if (!clearConfirmArmed) {
            clearConfirmArmed = true;
            clrBtn.textContent = ui.notesClearConfirm || "Confirm clear?";

            clearConfirmTimer = window.setTimeout(() => {

            clearTimeout(clearConfirmTimer);
            pinnedItems.clear();
            askedItems.clear();
            askedDone.clear();
            probeDone.clear();
            discussedQuestions.clear();
            decisionChoices.clear();
            cardStamps.clear();
            quickVerdicts.clear();
            openIvNotes.clear();
            itemNotes.clear();
            probeAnswers.clear();
            openCommentEditors.clear();
            savedPassages = [];
            generalNote = "";
            includeNotesInPrint = false;
            document.body.classList.remove("print-with-notes");
            if (activeLens === "annotated") activeLens = "all";
            try { localStorage.removeItem(WS_STORE_KEY); } catch {}
            renderActiveView(false);
            renderNotesWorkspaceInAllTargets();
            syncAllBadges();
          }
          return true;
        }

      function syncMobileTabBar() {

        });

      function syncNavFade() {
        if (!navLinks) return;
        const maxSl = navLinks.scrollWidth - navLinks.clientWidth;
        navLinks.classList.remove("fade-left", "fade-right", "fade-both");
        if (maxSl <= 2) return;
        const r = navLinks.getBoundingClientRect();
        const first = navLinks.firstElementChild;
        const last = navLinks.lastElementChild;
        if (!first || !last) return;
        const fRect = first.getBoundingClientRect();
        const lRect = last.getBoundingClientRect();
        const minL = Math.min(fRect.left, lRect.left);
        const maxR = Math.max(fRect.right, lRect.right);
        const clipL = minL < r.left - 2;
        const clipR = maxR > r.right + 2;
        if (clipL && clipR) navLinks.classList.add("fade-both");
        else if (clipL) navLinks.classList.add("fade-left");
        else if (clipR) navLinks.classList.add("fade-right");
      }

      function scrollNavItemIntoView(btn) {
        if (!btn || !navLinks) return;
        if (getComputedStyle(stickyChrome).position === "static") return;
        if (navLinks.scrollWidth <= navLinks.clientWidth + 1) return;
        const cRect = navLinks.getBoundingClientRect();
        const bRect = btn.getBoundingClientRect();
        if (bRect.left >= cRect.left + 8 && bRect.right <= cRect.right - 8) return;
        const delta = (bRect.left - cRect.left) - (cRect.width - bRect.width) / 2;
        navLinks.scrollTo({ left: navLinks.scrollLeft + delta, behavior: "smooth" });
      }

      function syncNavDimming() {
        const visSet = new Set(getVisibleNavIds());
        navLinks.querySelectorAll(".nav-link").forEach((b) => {
          b.classList.toggle("is-dimmed", activeView === "brief" && !visSet.has(b.dataset.target));
        });
        marginRail.querySelectorAll(".rail-item").forEach((b) => {
          b.style.opacity = (activeView !== "brief" || visSet.has(b.dataset.target)) ? "" : "0.45";
        });
      }

      function setActiveNav(id, scrollNavIntoView) {
        activeNav = id;
        navLinks.querySelectorAll(".nav-link").forEach((b) => {
          const active = activeView === "brief" && b.dataset.target === id;
          b.classList.toggle("is-active", active);
          if (active) b.setAttribute("aria-current", "location");
          else b.removeAttribute("aria-current");
          if (active && scrollNavIntoView) scrollNavItemIntoView(b);
        });
        marginRail.querySelectorAll(".rail-item").forEach((b) => {
          const active = activeView === "brief" && b.dataset.target === id;
          b.classList.toggle("is-active", active);
          if (active) b.setAttribute("aria-current", "location");
          else b.removeAttribute("aria-current");
        });
        briefMain.querySelectorAll(".mob-sec-chip[data-jump-sec]").forEach((c) => {

        });
