         PROGRESSIVE-DISCLOSURE, PER-BULLET SAVE & LENS RENDER HELPERS
         ======================================================================= */
      function renderExpandBtn(key, expandedNow, ui, hideForSearch) {
        if (density !== "brief" || hideForSearch) return "";
        const fullLbl = expandedNow ? (ui.collapseDetail || "Hide detail") : (ui.expandDetail || "Show detail");
        const shortLbl = expandedNow ? (ui.collapseShort || "Hide") : (ui.expandShort || "Details");
        return '<button class="item-expand" type="button" data-item-key="' + esc(key) + '" aria-expanded="' + (expandedNow ? "true" : "false") + '" aria-label="' + esc(fullLbl) + '" title="' + esc(fullLbl) + '"><span>' + esc(shortLbl) + "</span>" + ICO_CHEV + "</button>";
      }

      function renderTags(tags, isRtl, qNorm) {
        if (!Array.isArray(tags) || !tags.length) return "";
        return '<div class="item-tags">'
          + tags.map((t) => '<span class="item-tag">' + fmt(t, isRtl, qNorm) + "</span>").join("")
          + "</div>";
      }

      function renderDetailBlock(item, itemKey, secId, ui, isRtl, qNorm) {
        if (!hasItemDetail(item)) return "";
        const colonSep = lang === "fr" ? "\u00A0: " : ": ";
        let inner = "";
        if (Array.isArray(item.detailPoints) && item.detailPoints.length) {
          inner = '<ul class="detail-points">'
            + item.detailPoints.map((pt, idx) => {
                const bid = itemKey + ":dp-" + idx;
                const saved = Boolean(findBulletPassage(bid));
                const bLbl = saved ? (ui.saveBulletRemove || "Remove saved passage") : (ui.saveBulletAdd || "Save this passage");
                return '<li class="detail-point">'
                  + '<span class="dp-txt">'
                    + (pt.label ? '<strong class="dp-lbl">' + fmt(pt.label, isRtl, qNorm) + colonSep + "</strong>" : "")
                    + fmt(pt.text, isRtl, qNorm)
                  + "</span>"
                  + '<button class="bullet-save-btn' + (saved ? " is-saved" : "") + '" type="button" data-save-bullet="' + esc(bid) + '" data-b-sec="' + esc(secId) + '" data-b-key="' + esc(itemKey) + '" data-b-lbl="' + esc(pt.label || "") + '" data-b-txt="' + esc(pt.text || "") + '" aria-pressed="' + (saved ? "true" : "false") + '" aria-label="' + esc(bLbl) + '" title="' + esc(bLbl) + '">' + ICO_BM + "</button>"
                + "</li>";
              }).join("")
            + "</ul>";
        } else if (item.detail) {
          inner = '<p class="goal-detail">' + fmt(item.detail, isRtl, qNorm) + "</p>";
        }
        return '<div class="detail-collapse"><div class="detail-inner"><div class="detail-body">' + inner + "</div></div></div>";
      }

      function renderSecExpandBtn(secId, visKeysInSec, ui, hasQ) {
        if (density !== "brief" || hasQ || !visKeysInSec.length) return "";
        const allOpen = visKeysInSec.every((k) => expandedItems.has(k));
        const lbl = allOpen ? (ui.secCollapse || "Collapse") : (ui.secExpand || "Expand ({n})").replace("{n}", String(visKeysInSec.length));
        return '<button class="sec-expand-btn' + (allOpen ? " is-all-open" : "") + '" type="button" data-sec-expand="' + esc(secId) + '" aria-expanded="' + (allOpen ? "true" : "false") + '">' + esc(lbl) + "</button>";
      }

      function renderSecHead(sec, id, visKeysInSec, ui, isRtl, qNorm, extraBadgeHtml, hasQ) {
        return '<div class="sec-head">'
          + '<span class="sec-num"><bdi dir="ltr">' + esc(sec.num) + "</bdi></span>"
          + '<h2 class="sec-title">' + fmt(sec.title, isRtl, qNorm) + "</h2>"
          + '<span class="sec-rule" aria-hidden="true"></span>'
          + (extraBadgeHtml || "")
          + renderSecExpandBtn(id, visKeysInSec, ui, hasQ)
          + (id !== "priorities"
            ? '<button class="sec-top-mini" type="button" data-scroll-top="1" aria-label="' + esc(ui.topBtn || "Top") + '" title="' + esc(ui.topBtn || "Top") + '">' + ICO_UP + "</button>"
            : "")
          + "</div>";
      }

      function renderXrefs(targets, fromSec, secs, ui, isRtl) {
        if (!targets || !targets.length) return "";
        const navMap = ui.nav || {};
        return '<div class="xref-row">' + targets.filter((t) => secs[t]).map((t) => {
          const num = secs[t].num;
          const lbl = navMap[t] || secs[t].title;
          return '<button class="xref-chip" type="button" data-jump-sec="' + esc(t) + '" data-from-sec="' + esc(fromSec) + '">'
            + ICO_JUMP + '<span><bdi dir="ltr">' + esc(num) + "</bdi> · " + fmt(lbl, isRtl, "") + "</span></button>";
        }).join("") + "</div>";
      }

      function renderMobileSectionStrip(secs, ui, isRtl) {
        const navMap = ui.nav || {};
        return '<nav class="mob-sec-strip" aria-label="' + esc(ui.sectionsQuick || "Sections") + '">'
          + NAV_ORDER.filter((k) => secs[k]).map((k) => {
              const s = secs[k];
              const act = k === activeNav;
              return '<button class="mob-sec-chip' + (act ? " is-active" : "") + '" type="button" data-jump-sec="' + esc(k) + '">'
                + '<bdi dir="ltr">' + esc(s.num) + "</bdi> " + fmt(navMap[k] || s.title, isRtl, "")
              + "</button>";
            }).join("")
          + "</nav>";
      }

      function renderTriageStrip(d, ui, isRtl, hasQ) {
        if (hasQ || !Array.isArray(d.triage) || !d.triage.length) return "";
        const cardsHtml = d.triage.map((t) =>
          '<button class="triage-card tone-' + esc(t.tone || "teal") + '" type="button" data-jump-sec="' + esc(t.targetSec) + '"'
            + (t.targetItem ? ' data-jump-item="' + esc(t.targetItem) + '"' : "")
            + ' data-from-sec="priorities">'
            + '<div class="triage-top">'
              + '<span class="triage-lbl">' + fmt(t.label, isRtl, "") + "</span>"
              + '<span class="triage-arrow" aria-hidden="true">' + ICO_ARROW + "</span>"
            + "</div>"
            + '<ul class="triage-lines">'
              + (t.lines || []).map((ln) => '<li class="triage-line">' + fmt(ln, isRtl, "") + "</li>").join("")
            + "</ul>"
          + "</button>"
        ).join("");

        return '<section class="triage-strip" aria-label="' + esc(ui.triageLabel || "Clinical signals") + '">'
          + '<div class="triage-head">'
            + '<div class="triage-head-l">'
              + '<span class="kicker">' + esc(ui.triageLabel || "At-a-Glance Signals") + "</span>"
              + '<span class="triage-sub">' + esc(density === "brief" ? (ui.briefHint || ui.triageSub || "") : (ui.triageSub || "")) + "</span>"
            + "</div>"
            + '<span class="triage-swipe-hint">' + esc(ui.triageSwipeHint || "4 signals · swipe →") + "</span>"
          + "</div>"
          + '<div class="triage-grid">' + cardsHtml + "</div>"
        + "</section>";
      }

      function renderLensBar(ui, hasQ, visExpandableKeys) {
        if (hasQ) return "";
        const itemCnt = getAnnotatedItemKeys().length;
        const askCnt = askedItems.size;
        const savedCnt = getSavedTotalCount();
        const pills = [
          { id: "all", label: ui.lensAll || "All", cls: "" },
          { id: "safety", label: ui.lensSafety || "Safety & Rx", cls: " is-safety", dot: true },
          { id: "clinical", label: ui.lensClinical || "Clinical Axes", cls: "" },
          { id: "decisions", label: ui.lensDecisions || "Decisions", cls: "" }
        ];
        if (itemCnt > 0 || activeLens === "annotated") {
          pills.push({
            id: "annotated",
            label: (ui.lensAnnotated || "Annotated ({n})").replace("{n}", String(itemCnt)),
            cls: " is-annot"
          });
        }

        let modeBarHtml = "";
        if (density === "brief" && visExpandableKeys.length) {
          const openCount = visExpandableKeys.filter((k) => expandedItems.has(k)).length;
          const allOpen = openCount === visExpandableKeys.length;
          modeBarHtml = '<div class="brief-mode-bar">'
            + '<span id="briefCounter" class="brief-counter">' + esc((ui.openedCount || "{open}/{total}").replace("{open}", String(openCount)).replace("{total}", String(visExpandableKeys.length))) + "</span>"
            + '<button id="briefToggleAll" class="brief-toggle-all" type="button" data-toggle-all="' + (allOpen ? "collapse" : "expand") + '">'
              + esc(allOpen ? (ui.collapseAll || "Collapse all") : (ui.expandAll || "Expand all"))
            + "</button>"
          + "</div>";
        }

        return '<div class="lens-bar" role="region" aria-label="' + esc(ui.lensAria || "Clinical reading lens") + '">'
          + '<div id="lensPills" class="lens-pills" role="group">'
            + pills.map((p) => {
                const act = activeView === "brief" && activeLens === p.id;
                return '<button class="lens-pill' + p.cls + (act ? " is-active" : "") + '" type="button" data-lens="' + p.id + '" aria-pressed="' + (act ? "true" : "false") + '">'
                  + (p.dot ? '<span class="lens-dot" aria-hidden="true"></span>' : "")
                  + esc(p.label)
                  + "</button>";
              }).join("")
            + '<span class="lens-sep" aria-hidden="true"></span>'
            + '<button class="lens-pill is-view' + (activeView === "interview" ? " is-active" : "") + '" type="button" data-switch-view="interview">'
              + ICO_ASK + "<span>" + esc(ui.tabInterview || "Interview") + "</span>"
              + '<span id="lensIvCnt" class="lens-cnt"' + (askCnt ? "" : " hidden") + ">" + String(askCnt) + "</span>"
            + "</button>"
            + '<button class="lens-pill is-saved-view' + (activeView === "saved" ? " is-active" : "") + '" type="button" data-switch-view="saved">'
              + ICO_BM + "<span>" + esc(ui.tabSaved || "Saved") + "</span>"
              + '<span id="lensSavedCnt" class="lens-cnt"' + (savedCnt ? "" : " hidden") + ">" + String(savedCnt) + "</span>"
            + "</button>"
          + "</div>"
          + modeBarHtml
        + "</div>";
      }

      /* =======================================================================
         DEDICATED LIVE CONSULTATION INTERVIEW VIEW (ENTRETIEN / المقابلة)
         ======================================================================= */
      function renderInterviewView(animate) {
        if (!data || !data[lang]) return;
        const d = data[lang];
        const ui = d.ui || {};
        const secs = d.sections || {};
        const isRtl = d.dir === "rtl";

        const flaggedKeys = ALL_ITEM_KEYS.filter((k) => askedItems.has(k));
        const flaggedHtml = flaggedKeys.length
          ? '<div class="iv-list">' + flaggedKeys.map((k) => {
              const meta = getItemMeta(k);
              if (!meta) return "";
              const done = askedDone.has(k);
              const val = itemNotes.get(k) || "";
              return '<article class="iv-card' + (done ? " is-done" : "") + '">'
                + '<div class="iv-top">'
                  + '<div class="iv-top-l">'
                    + '<button class="iv-check" type="button" data-iv-ask-done="' + esc(k) + '" aria-pressed="' + (done ? "true" : "false") + '" title="' + esc(ui.askedDone || "Asked") + '">' + ICO_CHECK + "</button>"
                    + '<div style="min-width:0">'
                      + '<h3 class="iv-title">' + fmt(meta.title, isRtl, "") + "</h3>"
                      + (meta.brief ? '<p class="iv-prompt">' + fmt(meta.brief, isRtl, "") + "</p>" : "")
                    + "</div>"
                  + "</div>"
                  + '<span class="iv-meta-acts">'
                    + '<button class="iv-jump-btn" type="button" data-jump-sec="' + esc(meta.secId) + '" data-jump-item="' + esc(k) + '"><bdi dir="ltr">' + esc(meta.secNum) + "</bdi> " + ICO_JUMP + "</button>"
                    + '<button class="drawer-mini-btn is-del" type="button" data-ask-key="' + esc(k) + '" title="' + esc(ui.askRemove || "Remove") + '">' + ICO_X + "</button>"
                  + "</span>"
                + "</div>"
                + '<textarea class="iv-answer-ta" dir="auto" data-iv-note="' + esc(k) + '" placeholder="' + esc(ui.answerPh || "Patient response...") + '">' + esc(val) + "</textarea>"
              + "</article>";
            }).join("") + "</div>"
          : '<div class="ws-empty">' + esc(ui.interviewFlaggedEmpty || "No flagged questions yet.") + "</div>";

        const probes = Array.isArray(d.interviewProbes) ? d.interviewProbes : [];
        const probesHtml = '<div class="iv-list">' + probes.map((pr) => {
          const done = probeDone.has(pr.id);
          const val = probeAnswers.get(pr.id) || "";
          return '<article class="iv-card is-probe' + (done ? " is-done" : "") + '">'
            + '<div class="iv-top">'
              + '<div class="iv-top-l">'
                + '<button class="iv-check" type="button" data-iv-probe-done="' + esc(pr.id) + '" aria-pressed="' + (done ? "true" : "false") + '" title="' + esc(ui.askedDone || "Asked") + '">' + ICO_CHECK + "</button>"
                + '<div style="min-width:0">'
                  + '<h3 class="iv-title">' + fmt(pr.title, isRtl, "") + "</h3>"
                  + '<p class="iv-prompt">' + fmt(pr.prompt, isRtl, "") + "</p>"
                + "</div>"
              + "</div>"
              + '<span class="iv-meta-acts">'
                + '<button class="iv-jump-btn" type="button" data-jump-sec="' + esc(pr.secId) + '" data-jump-item="' + esc(pr.itemKey || "") + '"><bdi dir="ltr">' + esc(pr.secNum) + "</bdi> " + ICO_JUMP + "</button>"
              + "</span>"
            + "</div>"
            + '<textarea class="iv-answer-ta" dir="auto" data-iv-probe-ans="' + esc(pr.id) + '" placeholder="' + esc(ui.answerPh || "Patient response...") + '">' + esc(val) + "</textarea>"
          + "</article>";
        }).join("") + "</div>";

        const qItems = (secs.questions && secs.questions.items) || [];
        const decHtml = '<div class="iv-list">' + qItems.map((q, i) => {
          const k = "q-" + i;
          const done = discussedQuestions.has(k);
          const val = itemNotes.get(k) || "";
          return '<article class="iv-card is-probe' + (done ? " is-done" : "") + '">'
            + '<div class="iv-top">'
              + '<div class="iv-top-l">'
                + '<button class="iv-check" type="button" data-q-toggle="' + esc(k) + '" aria-pressed="' + (done ? "true" : "false") + '" title="' + esc(ui.discussedLabel || "Discussed") + '">' + ICO_CHECK + "</button>"
                + '<div style="min-width:0">'
                  + '<h3 class="iv-title"><bdi dir="ltr">' + String(i + 1).padStart(2, "0") + ".</bdi> " + fmt(q.lead, isRtl, "") + "</h3>"
                  + '<p class="iv-prompt">' + fmt(q.text, isRtl, "") + "</p>"
                + "</div>"
              + "</div>"
              + '<span class="iv-meta-acts">'
                + '<button class="iv-jump-btn" type="button" data-jump-sec="questions" data-jump-item="' + esc(k) + '"><bdi dir="ltr">06</bdi> ' + ICO_JUMP + "</button>"
              + "</span>"
            + "</div>"
            + '<textarea class="iv-answer-ta" dir="auto" data-iv-note="' + esc(k) + '" placeholder="' + esc(ui.answerPh || "Decision / patient response...") + '">' + esc(val) + "</textarea>"
          + "</article>";
        }).join("") + "</div>";

        briefMain.innerHTML =
          '<section class="ws-view" aria-label="' + esc(ui.interviewTitle || "Interview") + '">'
            + '<div class="ws-head">'
              + '<div>'
                + '<h1 class="ws-title">' + esc(ui.interviewTitle || "Live Consultation Interview") + "</h1>"
                + '<p class="ws-sub">' + esc(ui.interviewSub || "") + "</p>"
              + "</div>"
              + '<div style="display:flex;align-items:center;gap:7px;flex-wrap:wrap">'
                + '<div class="timer-pill" dir="ltr">'
                  + '<span id="ivTimerVal" class="timer-val">' + esc(formatTimer(timerSec)) + "</span>"
                  + '<button id="ivTimerToggle" class="timer-btn' + (timerRunning ? " is-running" : "") + '" type="button" data-timer-act="toggle">' + esc(timerRunning ? (ui.timerPause || "Pause") : (ui.timerStart || "Start")) + "</button>"
                  + '<button class="timer-btn" type="button" data-timer-act="reset">' + esc(ui.timerReset || "Reset") + "</button>"
                + "</div>"
                + '<button class="ws-back-btn" type="button" data-switch-view="brief">' + ICO_RETURN + "<span>" + esc(ui.tabBrief || "Brief") + "</span></button>"
                + '<button class="lens-pill is-saved-view" type="button" data-switch-view="saved">' + ICO_BM + "<span>" + esc(ui.tabSaved || "Saved") + "</span>" + (getSavedTotalCount() ? '<span class="lens-cnt">' + getSavedTotalCount() + "</span>" : "") + "</button>"
              + "</div>"
            + "</div>"
            + '<div>'
              + '<h2 class="ws-block-title"><span>' + esc(ui.interviewFlaggedTitle || "Flagged to Ask") + " (" + flaggedKeys.length + ")</span></h2>"
              + flaggedHtml
            + "</div>"
            + '<div>'
              + '<h2 class="ws-block-title"><span>' + esc(ui.interviewProbesTitle || "Clinical Probes") + " (" + probes.length + ")</span></h2>"
              + probesHtml
            + "</div>"
            + '<div>'
              + '<h2 class="ws-block-title"><span>' + esc(ui.interviewDecisionsTitle || "Consultation Decisions") + " (" + discussedQuestions.size + "/" + qItems.length + ")</span></h2>"
              + decHtml
            + "</div>"
          + "</section>";

        if (animate) triggerSwap();
      }

      /* =======================================================================
         DEDICATED SAVED PASSAGES & BOOKMARKS ARCHIVE VIEW (المحفوظات / FAVORIS)
         ======================================================================= */
      function renderSavedView(animate) {
        if (!data || !data[lang]) return;
        const d = data[lang];
        const ui = d.ui || {};
        const isRtl = d.dir === "rtl";

        const savedCards = ALL_ITEM_KEYS.filter((k) => pinnedItems.has(k));
        const askCards = ALL_ITEM_KEYS.filter((k) => askedItems.has(k));
        const totalAll = savedPassages.length + savedCards.length + askCards.length;

        const tabsHtml = '<div class="saved-tabs" role="group">'
          + [
              ["all", (ui.savedTabAll || "All") + " (" + totalAll + ")"],
              ["passages", (ui.savedTabPassages || "Passages") + " (" + savedPassages.length + ")"],
              ["cards", (ui.savedTabCards || "Cards") + " (" + savedCards.length + ")"],
              ["asks", (ui.savedTabAsks || "To Ask") + " (" + askCards.length + ")"]
            ].map(([tid, lbl]) =>
              '<button class="lens-pill' + (savedTab === tid ? " is-active" : "") + '" type="button" data-saved-tab="' + tid + '" aria-pressed="' + (savedTab === tid ? "true" : "false") + '">' + esc(lbl) + "</button>"
            ).join("")
          + "</div>";

        const cardsOut = [];

        if (savedTab === "all" || savedTab === "passages") {
          savedPassages.forEach((p) => {
            cardsOut.push(
              '<article class="saved-quote-card">'
                + '<div class="saved-quote-head">'
                  + '<span class="saved-src">'
                    + '<span class="drawer-item-num"><bdi dir="ltr">' + esc(p.secNum) + "</bdi></span>"
                    + '<span class="saved-src-title">' + fmt(p.sourceTitle, isRtl, "") + (p.label ? " · " + fmt(p.label, isRtl, "") : "") + "</span>"
                  + "</span>"
                  + '<span class="iv-meta-acts">'
                    + '<button class="iv-jump-btn" type="button" data-jump-sec="' + esc(p.secId) + '" data-jump-item="' + esc(p.sourceKey) + '">' + ICO_JUMP + "<span>" + esc(ui.jumpToContext || "Jump") + "</span></button>"
                    + '<button class="drawer-mini-btn is-del" type="button" data-del-passage="' + esc(p.id) + '" title="' + esc(ui.commentDelete || "Delete") + '">' + ICO_TRASH + "</button>"
                  + "</span>"
                + "</div>"
                + '<blockquote class="saved-excerpt" dir="auto">' + fmt(p.text, isRtl, "") + "</blockquote>"
                + '<input class="saved-note-in" type="text" dir="auto" data-saved-note="' + esc(p.id) + '" value="' + esc(p.note || "") + '" placeholder="' + esc(ui.savedNotePh || "Quick note...") + '" />'
              + "</article>"
            );
          });
        }

        if (savedTab === "all" || savedTab === "cards") {
          savedCards.forEach((k) => {
            const meta = getItemMeta(k);
            if (!meta) return;
            const note = (itemNotes.get(k) || "").trim();
            cardsOut.push(
              '<article class="saved-quote-card is-card-bm">'
                + '<div class="saved-quote-head">'
                  + '<span class="saved-src">'
                    + '<span class="drawer-item-num"><bdi dir="ltr">' + esc(meta.secNum) + "</bdi></span>"
                    + '<span class="saved-src-title">' + fmt(meta.title, isRtl, "") + "</span>"
                  + "</span>"
                  + '<span class="iv-meta-acts">'
                    + '<button class="iv-jump-btn" type="button" data-jump-sec="' + esc(meta.secId) + '" data-jump-item="' + esc(k) + '">' + ICO_JUMP + "<span>" + esc(ui.jumpToContext || "Jump") + "</span></button>"
                    + '<button class="drawer-mini-btn is-pinned" type="button" data-save-card="' + esc(k) + '" title="' + esc(ui.saveCardRemove || "Remove") + '">' + ICO_BM + "</button>"
                  + "</span>"
                + "</div>"
                + (meta.brief ? '<p class="iv-prompt">' + fmt(meta.brief, isRtl, "") + "</p>" : "")
                + (note ? '<p class="card-note-text" dir="auto">' + esc(note) + "</p>" : "")
              + "</article>"
            );
          });
        }

        if (savedTab === "all" || savedTab === "asks") {
          askCards.forEach((k) => {
            if (savedTab === "all" && pinnedItems.has(k)) return;
            const meta = getItemMeta(k);
            if (!meta) return;
            cardsOut.push(
              '<article class="iv-card">'
                + '<div class="saved-quote-head">'
                  + '<span class="saved-src">'
                    + '<span class="drawer-item-num"><bdi dir="ltr">' + esc(meta.secNum) + "</bdi></span>"
                    + '<span class="saved-src-title">? ' + fmt(meta.title, isRtl, "") + "</span>"
                  + "</span>"
                  + '<span class="iv-meta-acts">'
                    + '<button class="iv-jump-btn" type="button" data-jump-sec="' + esc(meta.secId) + '" data-jump-item="' + esc(k) + '">' + ICO_JUMP + "<span>" + esc(ui.jumpToContext || "Jump") + "</span></button>"
                    + '<button class="drawer-mini-btn is-del" type="button" data-ask-key="' + esc(k) + '" title="' + esc(ui.askRemove || "Remove") + '">' + ICO_X + "</button>"
                  + "</span>"
                + "</div>"
                + (meta.brief ? '<p class="iv-prompt">' + fmt(meta.brief, isRtl, "") + "</p>" : "")
              + "</article>"
            );
          });
        }

        briefMain.innerHTML =
          '<section class="ws-view" aria-label="' + esc(ui.savedTitle || "Saved Passages") + '">'
            + '<div class="ws-head">'
              + '<div>'
                + '<h1 class="ws-title">' + esc(ui.savedTitle || "Saved Passages & Bookmarks") + "</h1>"
                + '<p class="ws-sub">' + esc(ui.savedSub || "") + "</p>"
              + "</div>"
              + '<div style="display:flex;align-items:center;gap:7px;flex-wrap:wrap">'
                + '<button class="ws-back-btn" type="button" data-switch-view="brief">' + ICO_RETURN + "<span>" + esc(ui.tabBrief || "Brief") + "</span></button>"
                + '<button class="lens-pill is-view" type="button" data-switch-view="interview">' + ICO_ASK + "<span>" + esc(ui.tabInterview || "Interview") + "</span>" + (askedItems.size ? '<span class="lens-cnt">' + askedItems.size + "</span>" : "") + "</button>"
              + "</div>"
            + "</div>"
            + tabsHtml
            + (cardsOut.length
              ? '<div class="iv-list">' + cardsOut.join("") + "</div>"
              : '<div class="ws-empty">' + esc(ui.savedEmpty || "No saved passages yet.") + "</div>")
          + "</section>";

        if (animate) triggerSwap();
      }

      /* =======================================================================
         MAIN BRIEF RENDERER (V3 MOBILE-FIRST + PER-BULLET SAVE + ASK FLAG)
         ======================================================================= */
      function renderBrief(animate, opts) {
        if (!data || !data[lang]) return;
        const ropts = opts || {};
        const d = data[lang];
        const ui = d.ui || {};
        const secs = d.sections || {};
        const isRtl = d.dir === "rtl";
        const qNorm = normText(searchQuery.trim());
        const hasQ = Boolean(qNorm);
        const effLens = hasQ ? "all" : activeLens;
        let matchCount = 0;
        const renderedExpandableKeys = [];

        const matches = (...parts) => !hasQ || parts.some((p) => normText(p).includes(qNorm));
        const matchesList = (arr) => !hasQ || (Array.isArray(arr) && arr.some((p) => normText(p).includes(qNorm)));
        const mastheadMatch = hasQ && matches(d.title, d.subtitle, d.profileLine, d.date);
        if (mastheadMatch) matchCount += 1;

        const renderProseItems = (items, prefix, secId) => {
          const kept = (items || []).map((it, i) => ({ it, i, key: prefix + "-" + i })).filter(({ it, key }) =>
            lensAllowsItem(key, secId, effLens) && matches(it.lead, it.brief, ...(it.tags || []), ...itemDetailTexts(it))
          );
          if (hasQ) matchCount += kept.length;
          const secExpKeys = [];
          const html = kept.map(({ it, key }) => {
            const hasDet = hasItemDetail(it);
            if (hasDet) { secExpKeys.push(key); renderedExpandableKeys.push(key); }
            const isOpen = expandedItems.has(key);
            const detMatch = hasQ && hasDet && matchesList(itemDetailTexts(it));
            const searchOpen = hasQ && density === "brief" && detMatch;
            const expNow = density === "full" || isOpen || searchOpen;
            const toneCls = it.tone ? " tone-" + esc(it.tone) : "";
            const pinCls = pinnedItems.has(key) ? " is-pinned-card" : (askedItems.has(key) ? " is-asked-card" : "");
            return '<li id="item-' + esc(key) + '" class="prose-item' + toneCls + pinCls + (hasDet ? " expandable" : "") + (isOpen ? " is-open" : "") + (searchOpen ? " is-search-open" : "") + '"' + (hasDet ? ' data-exp-card="' + esc(key) + '"' : "") + ">"
              + '<div class="prose-item-head">'
                + '<span class="prose-lead">' + fmt(it.lead, isRtl, qNorm) + "</span>"
                + '<span class="card-tools">'
                  + renderCardTools(key, ui)
                  + (hasDet ? renderExpandBtn(key, expNow, ui, searchOpen) : "")
                + "</span>"
              + "</div>"
              + renderTags(it.tags, isRtl, qNorm)
              + '<p class="prose-brief">' + fmt(it.brief, isRtl, qNorm) + "</p>"
              + renderDetailBlock(it, key, secId, ui, isRtl, qNorm)
              + '<div class="card-note-slot">' + renderCardNoteSlotInner(key, ui) + "</div>"
            + "</li>";
          }).join("");
          return { kept, html, secExpKeys };
        };

        const sectionsHtml = [];

        /* 01 · OVERVIEW & LIFESPAN TRAJECTORY */
        const s1 = secs.priorities;
        if (s1 && lensAllowsSection("priorities", effLens)) {
          const showChromeParts = effLens === "all" || effLens === "clinical";
          const ccMatch = showChromeParts && matches(s1.chiefComplaintLabel, s1.chiefComplaint);
          const keptGoals = (s1.goals || []).map((g, i) => ({ g, i, key: "p-" + i })).filter(({ g, key }) =>
            lensAllowsItem(key, "priorities", effLens) && matches(g.title, g.brief, ...itemDetailTexts(g))
          );
          const keptTl = showChromeParts
            ? (s1.timeline || []).filter((t) => matches(t.stage, t.age, t.note))
            : [];
          if (hasQ) matchCount += (ccMatch ? 1 : 0) + keptGoals.length + keptTl.length;

          if (ccMatch || keptGoals.length || keptTl.length) {
            const secExpKeys = [];
            const goalsHtml = keptGoals.map(({ g, i, key }) => {
              const hasDet = hasItemDetail(g);
              if (hasDet) { secExpKeys.push(key); renderedExpandableKeys.push(key); }
              const isOpen = expandedItems.has(key);
              const detMatch = hasQ && hasDet && matchesList(itemDetailTexts(g));
              const searchOpen = hasQ && density === "brief" && detMatch;
              const expNow = density === "full" || isOpen || searchOpen;
              const pinCls = pinnedItems.has(key) ? " is-pinned-card" : (askedItems.has(key) ? " is-asked-card" : "");
              return '<li id="item-' + esc(key) + '" class="goal-row' + pinCls + (hasDet ? " expandable" : "") + (isOpen ? " is-open" : "") + (searchOpen ? " is-search-open" : "") + '"' + (hasDet ? ' data-exp-card="' + esc(key) + '"' : "") + ">"
                + '<div class="goal-top-bar">'
                  + '<span class="goal-idx"><bdi dir="ltr">' + String(i + 1) + ".</bdi></span>"
                  + '<span class="card-tools">'
                    + renderCardTools(key, ui)
                    + (hasDet ? renderExpandBtn(key, expNow, ui, searchOpen) : "")
                  + "</span>"
                + "</div>"
                + '<div class="goal-body">'
                  + '<span class="goal-title">' + fmt(g.title, isRtl, qNorm) + "</span>"
                  + '<p class="goal-brief">' + fmt(g.brief, isRtl, qNorm) + "</p>"
                  + renderDetailBlock(g, key, "priorities", ui, isRtl, qNorm)
                  + '<div class="card-note-slot">' + renderCardNoteSlotInner(key, ui) + "</div>"
                + "</div>"
              + "</li>";
            }).join("");

            const tlFiltered = hasQ && keptTl.length < (s1.timeline || []).length;
            const tlHtml = keptTl.map((t) =>
              '<li class="life-node' + (t.current ? " is-current" : "") + '">'
                + '<span class="life-age">' + fmt(t.age, isRtl, qNorm) + "</span>"
                + '<span class="life-dot-wrap" aria-hidden="true"><span class="life-dot"></span></span>'
                + '<span class="life-stage">' + fmt(t.stage, isRtl, qNorm) + "</span>"
                + '<span class="life-note">' + fmt(t.note, isRtl, qNorm) + "</span>"
              + "</li>"
            ).join("");

            const chiefSaved = Boolean(findBulletPassage("chief"));
            const chiefLbl = chiefSaved ? (ui.saveBulletRemove || "Remove saved passage") : (ui.saveBulletAdd || "Save this passage");

            sectionsHtml.push(
              '<section id="sec-priorities" class="ed-section">'
                + renderSecHead(s1, "priorities", secExpKeys, ui, isRtl, qNorm, "", hasQ)
                + (ccMatch
                  ? '<div class="chief-block">'
                      + '<div class="chief-head">'
                        + '<div class="kicker">' + fmt(s1.chiefComplaintLabel, isRtl, qNorm) + "</div>"
                        + '<button class="bullet-save-btn' + (chiefSaved ? " is-saved" : "") + '" type="button" data-save-bullet="chief" data-b-sec="priorities" data-b-key="" data-b-lbl="' + esc(s1.chiefComplaintLabel || "") + '" data-b-txt="' + esc(s1.chiefComplaint || "") + '" aria-pressed="' + (chiefSaved ? "true" : "false") + '" aria-label="' + esc(chiefLbl) + '" title="' + esc(chiefLbl) + '">' + ICO_BM + "</button>"
                      + "</div>"
                      + '<p class="chief-text">' + fmt(s1.chiefComplaint, isRtl, qNorm) + "</p>"
                    + "</div>"
                  : "")
                + (keptGoals.length ? '<div class="goals-block"><div class="kicker">' + fmt(s1.goalsLabel, isRtl, "") + '</div><ol class="goals-list">' + goalsHtml + "</ol></div>" : "")
                + (keptTl.length ? '<div class="life-wrap"><div class="kicker">' + fmt(s1.timelineTitle, isRtl, "") + '</div><ol class="life-rail' + (tlFiltered ? " is-filtered" : "") + '">' + tlHtml + "</ol></div>" : "")
              + "</section>"
            );
          }
        }

        /* 02 · COGNITION */
        const s2 = secs.cognition;
        if (s2 && lensAllowsSection("cognition", effLens)) {
          const showLead = effLens === "all" || effLens === "clinical";
          const proseMatch = showLead && matches(s2.takeaway);
          if (hasQ && proseMatch) matchCount += 1;
          const cog = renderProseItems(s2.items, "cg", "cognition");
          if (proseMatch || cog.kept.length) {
            sectionsHtml.push(
              '<section id="sec-cognition" class="ed-section">'
                + renderSecHead(s2, "cognition", cog.secExpKeys, ui, isRtl, qNorm, "", hasQ)
                + (proseMatch ? '<p class="lead-prose">' + fmt(s2.takeaway, isRtl, qNorm) + "</p>" : "")
                + (cog.kept.length ? '<ul class="prose-list">' + cog.html + "</ul>" : "")
              + "</section>"
            );
          }
        }

        /* 03 · SLEEP & AIRWAY */
        const s3 = secs.sleep;
        if (s3 && lensAllowsSection("sleep", effLens)) {
          const showLead = effLens === "all" || effLens === "clinical";
          const sumMatch = showLead && matches(s3.summary);
          if (hasQ && sumMatch) matchCount += 1;
          const sl = renderProseItems(s3.items, "sl", "sleep");
          if (sumMatch || sl.kept.length) {
            sectionsHtml.push(
              '<section id="sec-sleep" class="ed-section">'
                + renderSecHead(s3, "sleep", sl.secExpKeys, ui, isRtl, qNorm, "", hasQ)
                + (sumMatch ? '<p class="lead-prose">' + fmt(s3.summary, isRtl, qNorm) + "</p>" : "")
                + (sl.kept.length ? '<ul class="prose-list">' + sl.html + "</ul>" : "")
              + "</section>"
            );
          }
        }

        /* 04 · MOOD, SAFETY & ANXIETY */
        const s4 = secs.mood;
        if (s4 && lensAllowsSection("mood", effLens)) {
          const showLead = effLens === "all" || effLens === "clinical";
          const sumMatch = showLead && matches(s4.summary);
          if (hasQ && sumMatch) matchCount += 1;
          const md = renderProseItems(s4.items, "md", "mood");
          if (sumMatch || md.kept.length) {
            sectionsHtml.push(
              '<section id="sec-mood" class="ed-section">'
                + renderSecHead(s4, "mood", md.secExpKeys, ui, isRtl, qNorm, "", hasQ)
                + (sumMatch ? '<p class="lead-prose">' + fmt(s4.summary, isRtl, qNorm) + "</p>" : "")
                + (md.kept.length ? '<ul class="prose-list">' + md.html + "</ul>" : "")
              + "</section>"
            );
          }
        }

        /* 05 · MEDICAL SAFETY, TREATMENTS & SIGNAL-FIRST LABS */
        const s5 = secs.safety;
        if (s5 && lensAllowsSection("safety", effLens)) {
          const showLabsBlock = effLens === "all" || effLens === "safety";
          const keptBase = (s5.baselineItems || []).map((b, i) => ({ b, i, key: "sf-" + i })).filter(({ b, key }) =>
            lensAllowsItem(key, "safety", effLens) && matches(b.badge, b.lead, b.brief, ...itemDetailTexts(b))
          );
          const accMatch = showLabsBlock && s5.accessNote && matches(s5.accessNote);
          const allLabs = showLabsBlock ? (s5.labs || []) : [];
          const groups = s5.labsGroups || {};
          const refLbl = ui.refShort || (lang === "fr" ? "Réf." : (lang === "ar" ? "المرجع" : "Ref"));
          const matchLab = (lb) => matches(lb.label, lb.date, lb.currStr, lb.prevStr, lb.unit, lb.ref, lb.note);
          const labsTitleMatch = hasQ && matches(s5.labsTitle);
          const defGroupMatch = hasQ && groups.deficiency && matches(groups.deficiency.title, groups.deficiency.note);
          const normGroupMatch = hasQ && groups.normal && matches(groups.normal.title, groups.normal.note);
          const spotLabs = allLabs.filter((lb) => lb.group === "spotlight" && (labsTitleMatch || matchLab(lb)));
          const repLabs = allLabs.filter((lb) => lb.group === "deficiency" && (labsTitleMatch || defGroupMatch || matchLab(lb)));
          const normLabs = allLabs.filter((lb) => lb.group === "normal" && (labsTitleMatch || normGroupMatch || matchLab(lb)));
          if (hasQ) matchCount += keptBase.length + (accMatch ? 1 : 0) + spotLabs.length + repLabs.length + normLabs.length;

          const hasAnyLabs = spotLabs.length || repLabs.length || normLabs.length;
          if (keptBase.length || accMatch || hasAnyLabs) {
            const secExpKeys = [];
            const baseHtml = keptBase.map(({ b, i, key }) => {
              const sev = b.severity || "info";
              const hasDet = hasItemDetail(b);
              if (hasDet) { secExpKeys.push(key); renderedExpandableKeys.push(key); }
              const isOpen = expandedItems.has(key);
              const detMatch = hasQ && hasDet && matchesList(itemDetailTexts(b));
              const searchOpen = hasQ && density === "brief" && detMatch;
              const expNow = density === "full" || isOpen || searchOpen;
              const ico = SAFE_ICONS[i % SAFE_ICONS.length];
              const pinCls = pinnedItems.has(key) ? " is-pinned-card" : (askedItems.has(key) ? " is-asked-card" : "");
              return '<div id="item-' + esc(key) + '" class="safety-card sev-' + esc(sev) + pinCls + (hasDet ? " expandable" : "") + (isOpen ? " is-open" : "") + (searchOpen ? " is-search-open" : "") + '"' + (hasDet ? ' data-exp-card="' + esc(key) + '"' : "") + ">"
                + '<div class="safety-top">'
                  + '<span class="safety-lead-wrap"><span class="safety-ico sev-' + esc(sev) + '">' + ico + '</span><span class="safety-lead">' + fmt(b.lead, isRtl, qNorm) + "</span></span>"
                  + '<span class="safety-right">'
                    + (b.badge ? '<span class="sev-badge sev-' + esc(sev) + '">' + fmt(b.badge, isRtl, qNorm) + "</span>" : "")
                    + renderCardTools(key, ui)
                    + (hasDet ? renderExpandBtn(key, expNow, ui, searchOpen) : "")
                  + "</span>"
                + "</div>"
                + '<p class="safety-brief">' + fmt(b.brief, isRtl, qNorm) + "</p>"
                + renderDetailBlock(b, key, "safety", ui, isRtl, qNorm)
                + '<div class="card-note-slot">' + renderCardNoteSlotInner(key, ui) + "</div>"
              + "</div>";
            }).join("");

            let labsHtml = "";
            if (hasAnyLabs) {
              const filterHtml = hasQ ? "" :
                '<div class="labs-filter" role="group" aria-label="Labs filter">'
                  + '<button class="labs-fbtn' + (labsFilter === "watch" ? " is-active" : "") + '" type="button" data-lab-filter="watch" aria-pressed="' + (labsFilter === "watch" ? "true" : "false") + '">' + esc(ui.labsFilterWatch || "Watch") + "</button>"
                  + '<button class="labs-fbtn' + (labsFilter === "all" ? " is-active" : "") + '" type="button" data-lab-filter="all" aria-pressed="' + (labsFilter === "all" ? "true" : "false") + '">' + esc(ui.labsFilterAll || "All") + "</button>"
                + "</div>";

              const spotHtml = spotLabs.map((lb) =>
                '<div class="lab-spotlight">'
                  + '<div class="spot-top">'
                    + '<span class="spot-left">'
                      + '<span class="spot-lbl">' + fmt(lb.label, isRtl, qNorm) + "</span>"
                      + '<span class="spot-date"><bdi dir="ltr">' + fmt(lb.date, false, qNorm) + "</bdi></span>"
                      + (ui.spotlightBadge ? '<span class="spot-badge">' + fmt(ui.spotlightBadge, isRtl, "") + "</span>" : "")
                    + "</span>"
                    + '<span class="spot-val"><bdi dir="ltr">' + fmt(lb.currStr, false, qNorm) + '<span class="lab-unit">' + fmt(lb.unit, false, qNorm) + "</span></bdi></span>"
                  + "</div>"
                  + '<div dir="ltr">' + renderSpotlightGauge(lb, refLbl) + "</div>"
                  + (lb.note ? '<p class="spot-note">' + fmt(lb.note, isRtl, qNorm) + "</p>" : "")
                + "</div>"
              ).join("");

              const repHtml = repLabs.length
                ? '<div class="lab-subblock">'
                    + '<div class="lab-subhead"><span class="lab-subtitle">' + fmt((groups.deficiency && groups.deficiency.title) || "", isRtl, qNorm) + "</span>"
                      + ((groups.deficiency && groups.deficiency.note) ? '<span class="lab-subnote">' + fmt(groups.deficiency.note, isRtl, qNorm) + "</span>" : "")
                    + "</div>"
                    + '<div class="repleted-grid">' + repLabs.map((lb) => {
                        const tipT = esc(lb.label + " (" + lb.date + ")");
                        const valRange = lb.prevStr ? (lb.prevStr + " → " + lb.currStr) : lb.currStr;
                        const tipB = esc(valRange + " " + lb.unit + " · " + refLbl + " " + lb.ref + (lb.note ? " · " + lb.note : ""));
                        return '<div class="rep-item" tabindex="0" data-tip-title="' + tipT + '" data-tip-body="' + tipB + '">'
                          + '<div class="rep-top"><span class="rep-lbl">' + fmt(lb.label, isRtl, qNorm) + '</span><span class="rep-date"><bdi dir="ltr">' + fmt(lb.date, false, qNorm) + "</bdi></span></div>"
                          + '<div class="rep-val-row">'
                            + '<span class="rep-val"><bdi dir="ltr">' + (lb.prevStr ? '<span class="rep-prev">' + fmt(lb.prevStr, false, qNorm) + '</span><span class="rep-arr">\u2192</span>' : "") + fmt(lb.currStr, false, qNorm) + '<span class="rep-unit">' + fmt(lb.unit, false, qNorm) + "</span></bdi></span>"
                          + "</div>"
                          + renderMiniBar(lb, qNorm)
                          + (lb.note ? '<div class="rep-meta"><span>' + fmt(lb.note, isRtl, qNorm) + "</span></div>" : "")
                        + "</div>";
                      }).join("") + "</div>"
                  + "</div>"
                : "";

              const hideNormal = !hasQ && labsFilter === "watch";
              const revealBtnHtml = hideNormal && normLabs.length
                ? '<button class="labs-reveal-btn" type="button" data-lab-filter="all"><span>' + esc((ui.showNormalLabs || "Show {n} normal parameters").replace("{n}", String(normLabs.length))) + "</span>" + ICO_CHEV + "</button>"
                : "";

              const normHtml = normLabs.length
                ? '<div class="lab-subblock' + (hideNormal ? " is-filter-hidden" : "") + '">'
                    + '<div class="lab-subhead"><span class="lab-subtitle">' + fmt((groups.normal && groups.normal.title) || "", isRtl, qNorm) + "</span></div>"
                    + '<div class="normal-grid">' + normLabs.map((lb) => {
                        const tipT = esc(lb.label + " (" + lb.date + ")");
                        const tipB = esc(lb.currStr + " " + lb.unit + " · " + refLbl + " " + lb.ref);
                        return '<div class="norm-item" tabindex="0" data-tip-title="' + tipT + '" data-tip-body="' + tipB + '">'
                          + '<div class="norm-top">'
                            + '<span class="norm-lbl-wrap"><span class="norm-lbl">' + fmt(lb.label, isRtl, qNorm) + "</span>" + (lb.date ? '<span class="norm-date"><bdi dir="ltr">' + fmt(lb.date, false, qNorm) + "</bdi></span>" : "") + "</span>"
                            + '<span class="norm-val"><bdi dir="ltr">' + fmt(lb.currStr, false, qNorm) + '<span class="norm-unit">' + fmt(lb.unit, false, qNorm) + "</span></bdi></span>"
                          + "</div>"
                          + renderMiniBar(lb, qNorm)
                        + "</div>";
                      }).join("") + "</div>"
                  + "</div>"
                : "";

              labsHtml = '<figure id="fig-05" class="figure-card">'
                + '<div class="labs-head-bar"><h3 class="fig-title">' + fmt(s5.labsTitle, isRtl, qNorm) + "</h3>" + filterHtml + "</div>"
                + spotHtml + repHtml + revealBtnHtml + normHtml
                + "</figure>";
            }

            sectionsHtml.push(
              '<section id="sec-safety" class="ed-section">'
                + renderSecHead(s5, "safety", secExpKeys, ui, isRtl, qNorm, "", hasQ)
                + (keptBase.length ? '<div class="safety-grid">' + baseHtml + "</div>" : "")
                + (accMatch ? '<p class="access-note">' + ICO_INFO + "<span>" + fmt(s5.accessNote, isRtl, qNorm) + "</span></p>" : "")
                + labsHtml
              + "</section>"
            );
          }
        }

        /* 06 · CONSULTATION DECISIONS */
        const s6 = secs.questions;
        if (s6 && lensAllowsSection("questions", effLens)) {
          const totalQ = (s6.items || []).length;
          const keptQ = (s6.items || []).map((q, i) => ({ q, i, key: "q-" + i })).filter(({ q, key }) =>
            lensAllowsItem(key, "questions", effLens) && matches(q.lead, q.text)
          );
          if (hasQ) matchCount += keptQ.length;
          if (keptQ.length) {
            const doneCount = discussedQuestions.size;
            const qBadge = '<span id="qCountBadge" class="sec-badge"' + (doneCount > 0 ? "" : " hidden") + ">"
              + esc((ui.discussedCount || "{done}/{total}").replace("{done}", String(doneCount)).replace("{total}", String(totalQ)))
              + "</span>";
            const qHtml = keptQ.map(({ q, i, key }) => {
              const isDone = discussedQuestions.has(key);
              const pinCls = pinnedItems.has(key) ? " is-pinned-card" : (askedItems.has(key) ? " is-asked-card" : "");
              return '<li id="item-' + esc(key) + '" class="q-item' + (isDone ? " is-done" : "") + pinCls + '">'
                + '<div>'
                  + '<div class="q-top">'
                    + '<span class="q-num"><bdi dir="ltr">' + String(i + 1).padStart(2, "0") + "</bdi></span>"
                    + '<div><h3 class="q-lead">' + fmt(q.lead, isRtl, qNorm) + '</h3><p class="q-text">' + fmt(q.text, isRtl, qNorm) + "</p></div>"
                    + '<span class="card-tools">'
                      + renderCardTools(key, ui)
                      + '<button class="q-check" type="button" data-q-toggle="' + esc(key) + '" aria-pressed="' + (isDone ? "true" : "false") + '" aria-label="' + esc(ui.discussedLabel || "Mark as discussed") + '" title="' + esc(ui.discussedLabel || "Mark as discussed") + '">' + ICO_CHECK + "</button>"
                    + "</span>"
                  + "</div>"
                  + '<div class="card-note-slot">' + renderCardNoteSlotInner(key, ui) + "</div>"
                + "</div>"
                + '<div class="q-foot">' + renderXrefs(QUESTION_TARGETS[i], "questions", secs, ui, isRtl) + "</div>"
              + "</li>";
            }).join("");

            sectionsHtml.push(
              '<section id="sec-questions" class="ed-section">'
                + renderSecHead(s6, "questions", [], ui, isRtl, qNorm, qBadge, hasQ)
                + (s6.subtitle && (effLens === "all" || effLens === "decisions") ? '<p class="sub-prose">' + fmt(s6.subtitle, isRtl, qNorm) + "</p>" : "")
                + '<ol class="q-grid">' + qHtml + "</ol>"
              + "</section>"
            );
          }
        }

        if (sectionsHtml.length) {
          sectionsHtml[0] = sectionsHtml[0].replace('class="ed-section"', 'class="ed-section is-first"');
        }

        const profileParts = String(d.profileLine || "").split(/\s*·\s*/).filter(Boolean);
        const profileBarHtml = '<div class="profile-bar">'
          + profileParts.map((part) => '<span class="profile-chip">' + fmt(part, isRtl, qNorm) + "</span>").join("")
          + "</div>"
          + '<p class="profile-line-print">' + fmt(d.profileLine, isRtl, "") + "</p>";

        let emptyHtml = "";
        if (hasQ && matchCount === 0) {
          emptyHtml = '<div class="search-empty"><p class="search-empty-title">' + esc(ui.searchNoMatch || "No matches") + ' — « ' + esc(searchQuery.trim()) + ' »</p><button id="emptyClearBtn" class="search-empty-btn" type="button">' + esc(ui.searchClear || "Clear") + "</button></div>";
        } else if (!hasQ && sectionsHtml.length === 0) {
          emptyHtml = '<div class="search-empty"><p class="search-empty-title">' + esc(ui.notesEmpty || "No items in this view") + '</p><button class="search-empty-btn" type="button" data-lens="all">' + esc(ui.lensShowAll || "Show all") + "</button></div>";
        }

        const endCapHtml = !emptyHtml
          ? '<footer class="brief-endcap">'
              + '<span class="endcap-actions">'
                + '<button class="endcap-btn" type="button" data-switch-view="interview">' + ICO_ASK + "<span>" + esc(ui.tabInterview || "Interview") + "</span></button>"
                + '<button class="endcap-btn" type="button" data-switch-view="saved">' + ICO_BM + "<span>" + esc(ui.tabSaved || "Saved") + "</span></button>"
                + '<button class="endcap-btn" type="button" data-open-notes="1">' + ICO_NOTE + "<span>" + esc(ui.notesTitle || "Notes") + "</span></button>"
                + '<button class="endcap-btn" type="button" data-scroll-top="1">' + ICO_UP + "<span>" + esc(ui.topBtn || "Top") + "</span></button>"
              + "</span>"
            + "</footer>"
          : "";

        briefMain.innerHTML =
          '<article class="brief-root' + (density === "brief" ? " is-brief" : "") + '">'
            + renderMobileSectionStrip(secs, ui, isRtl)
            + '<header class="masthead">'
              + '<div class="masthead-top">'
                + '<h1 class="doc-title">' + fmt(d.title, isRtl, qNorm) + "</h1>"
                + '<span class="doc-date">' + fmt(d.date, isRtl, "") + "</span>"
              + "</div>"
              + '<p class="doc-sub">' + fmt(d.subtitle, isRtl, qNorm) + "</p>"
              + profileBarHtml
            + "</header>"
            + renderTriageStrip(d, ui, isRtl, hasQ)
            + renderLensBar(ui, hasQ, renderedExpandableKeys)
            + sectionsHtml.join("")
            + emptyHtml
            + '<div id="printNotesHolder">' + renderPrintNotesHtml(ui) + "</div>"
            + endCapHtml
          + "</article>";

        updateSearchChrome(matchCount, qNorm, Boolean(ropts.preserveMarkIdx));
        syncNavDimming();
        hideTooltip();
        if (ropts.restoreFocusSel) {
          const focusEl = briefMain.querySelector(ropts.restoreFocusSel);
          if (focusEl && typeof focusEl.focus === "function") focusEl.focus({ preventScroll: true });

      function renderActiveView(animate, opts) {
        if (!data || !data[lang]) return;
        if (activeView === "interview") renderInterviewView(animate);
        else if (activeView === "saved") renderSavedView(animate);
        else if (activeView === "notes") {
          briefMain.innerHTML = '<div class="ws-view">' + renderNotesCoreInnerHtml(data[lang].ui || {}, true) + "</div>";
          if (animate) triggerSwap();
        } else {
          renderBrief(animate, opts);
        }
      }

      function renderAll(instantPill, animateSheet) {
        renderChrome(instantPill);
        renderActiveView(animateSheet);
        updateScrollUI();
      }

      function clearSearch(focusBack) {
        searchQuery = "";
        searchInput.value = "";
        if (activeView === "brief") renderBrief(false);

          searchInput.focus();
          showQuickPop();
        }
      }

      function switchLens(nextLens) {
        if (!nextLens) return;
        activeView = "brief";
        activeLens = nextLens;
        renderBrief(false);
        syncMobileTabBar();
        const vis = getVisibleNavIds();
        if (vis.length && !vis.includes(activeNav)) setActiveNav(vis[0], true);
        updateScrollUI();
      }

      /* =======================================================================
         PIN GATE EVENTS & UNLOCK
         ======================================================================= */
      gateThemeBtn.addEventListener("click", toggleTheme);
      toggleEye.addEventListener("click", () => {
        const show = pinInput.type === "password";
        pinInput.type = show ? "text" : "password";
        setHidden(eyeOpen, show);
        setHidden(eyeClosed, !show);
        toggleEye.setAttribute("aria-label", show ? "Hide code" : "Show code");
        pinInput.focus();
      });
      pinInput.addEventListener("input", () => { if (gateErr.textContent) gateErr.textContent = ""; });

      gateForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        gateErr.textContent = "";
        gateBtn.disabled = true;
        setHidden(gateSpin, false);
        try {
          data = await unlock(pinInput.value);
          lang = "fr";
          density = "brief";
          labsFilter = "watch";
          activeView = "brief";
          activeLens = "all";
          savedTab = "all";
          searchQuery = "";
          activeNav = "priorities";
          expandedItems.clear();
          discussedQuestions.clear();
          pinnedItems.clear();
          askedItems.clear();
          askedDone.clear();
          probeDone.clear();
          itemNotes.clear();
          probeAnswers.clear();
          openCommentEditors.clear();
          savedPassages = [];
          generalNote = "";
          notesOpen = false;
          includeNotesInPrint = false;
          syncCfg = Object.assign({}, DEFAULT_SYNC_CFG);
          syncCfgOpen = false;
          syncMsg = "";
          resetConsultationTimer();
          document.body.classList.remove("notes-open", "print-with-notes");
          hideReturnToast();
          hideSelPop();
          searchInput.value = "";
          pinInput.value = "";
          gateForm.reset();

          await restoreEncryptedStateOnUnlock();

          /* Honor PWA Manifest App Shortcuts (#interview, #saved, #notes) */
          const h = (location.hash || "").replace(/^#/, "").toLowerCase();
          if (h === "interview" || h === "saved") activeView = h;
          else if (h === "notes") {
            if (isMobileViewport()) activeView = "notes";
            else notesOpen = true;
          }

          gateScreen.hidden = true;
          appShell.hidden = false;
          renderAll(true, true);
          if (notesOpen && !isMobileViewport()) setNotesOpen(true, false);
          requestAnimationFrame(() => {
            syncAllPills(true);
            updateScrollUI();
          });
          window.scrollTo({ top: 0, behavior: "instant" });
        } catch {
          sessionPin = null;
          gateErr.textContent = "Code incorrect · الرمز غير صحيح · Invalid code";
          gateForm.classList.remove("shake");
          void gateForm.offsetWidth;
          gateForm.classList.add("shake");
          pinInput.select();
        } finally {
          gateBtn.disabled = false;
          setHidden(gateSpin, true);
        }
      });

      /* =======================================================================
         LANGUAGE, DENSITY, READING CONTROLS & MOBILE TOP CONTROLS
         ======================================================================= */
      function switchLanguage(next) {
        if (next && next !== lang && data && data[next]) {
          lang = next;
          spyLockUntil = 0;
          hideQuickPop();
          hideReturnToast();
          hideSelPop();
          renderAll(false, true);
          requestAnimationFrame(() => syncAllPills(false));
        }
      }

      function switchDensity(next) {
        if (next && next !== density && data) {
          density = next;
          labsFilter = next === "full" ? "all" : "watch";
          expandedItems.clear();
          renderChrome(false);
          if (activeView === "brief") renderBrief(false);
          requestAnimationFrame(() => {
            syncAllPills(false);
            updateScrollUI();
          });
        }
      }

      langBtns.forEach((btn) => btn.addEventListener("click", () => switchLanguage(btn.dataset.loc)));
      densBtns.forEach((btn) => btn.addEventListener("click", () => switchDensity(btn.dataset.dens)));

      if (mobSearchToggle) {
        mobSearchToggle.addEventListener("click", () => {
          const open = !searchShell.classList.contains("is-mob-open");
          searchShell.classList.toggle("is-mob-open", open);
          mobSearchToggle.classList.toggle("is-active", open);
          mobSearchToggle.setAttribute("aria-expanded", open ? "true" : "false");
          if (open) {

            showQuickPop();
          } else {

          }
        });
      }
      if (mobMenuBtn) {
        mobMenuBtn.addEventListener("click", openMobileSheet);
      }

      mobTabBar.addEventListener("click", (e) => {

        const tab = btn.dataset.tab;
        if (tab === activeView) {
          window.scrollTo({ top: 0, behavior: "smooth" });
          return;
        }
        switchView(tab, true);

      /* Reading Controls Popover Events */
      readBtn.addEventListener("click", () => toggleReadPop());
      readPop.addEventListener("click", (e) => {
        const fBtn = e.target.closest("[data-read-font]");
        if (fBtn) {

          applyReadingPrefs(true);
          renderReadPop();
          requestAnimationFrame(() => { syncAllPills(true); updateScrollUI(); });
          return;

        const wBtn = e.target.closest("[data-read-width]");
        if (wBtn) {
          readWidth = wBtn.dataset.readWidth;
          applyReadingPrefs(true);
          renderReadPop();
          requestAnimationFrame(() => { syncAllPills(true); updateScrollUI(); });
          return;
        }
        if (e.target.closest("[data-read-tags]") || e.target.closest("[data-read-tags-row]")) {
          showTags = !showTags;
          applyReadingPrefs(true);
          renderReadPop();
          return;
        }
      });

      /* Notes Drawer Events (Desktop) + Hidden File Import Input */
      notesBtn.addEventListener("click", () => setNotesOpen(!notesOpen, false));
      notesBackdrop.addEventListener("click", () => setNotesOpen(false, true));
      notesDrawer.addEventListener("input", (e) => {
        if (e.target && e.target.matches('[data-general-note="1"]')) {

          syncAllBadges();
          renderNotesFeedInAllTargets();

        if (e.target && e.target.id === "syncRepoIn") {
