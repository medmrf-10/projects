<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" fill="none">
  <defs>
    <linearGradient id="cobaltBg" x1="12" y1="6" x2="84" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0369A1"/>
      <stop offset="100%" stop-color="#0C4A6E"/>
    </linearGradient>
    <radialGradient id="amberGlow" cx="48" cy="48" r="11" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FBBF24" stop-opacity="0.6"/>
      <stop offset="55%" stop-color="#FBBF24" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#FBBF24" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Cobalt Blueprint Rounded Square -->
  <rect x="2" y="2" width="92" height="92" rx="22" fill="url(#cobaltBg)" stroke="#38BDF8" stroke-opacity="0.34" stroke-width="2"/>

  <!-- Subtle Blueprint Inner Frame -->
  <rect x="10" y="10" width="76" height="76" rx="15" stroke="#E0F2FE" stroke-opacity="0.14" stroke-width="1"/>

  <!-- Subtle Translucent Isometric Cube Faces -->
  <path d="M48 19 L73 33.5 L48 48 L23 33.5 Z" fill="#FFFFFF" fill-opacity="0.16"/>
  <path d="M23 33.5 L48 48 L48 77 L23 62.5 Z" fill="#FFFFFF" fill-opacity="0.08"/>
  <path d="M73 33.5 L48 48 L48 77 L73 62.5 Z" fill="#FFFFFF" fill-opacity="0.03"/>

  <!-- Subtle Hidden Back Projection Edges -->
  <path d="M48 19 L48 48 M23 62.5 L48 48 L73 62.5" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="1.3" stroke-linecap="round" stroke-dasharray="2.5 3.2"/>

  <!-- Crisp White Isometric Cube Wireframe -->
  <polygon points="48,19 73,33.5 73,62.5 48,77 23,62.5 23,33.5" stroke="#FFFFFF" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M23 33.5 L48 48 L73 33.5 M48 48 L48 77" stroke="#FFFFFF" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Glowing Amber Center Vertex -->
  <circle cx="48" cy="48" r="11" fill="url(#amberGlow)"/>
  <circle cx="48" cy="48" r="5" fill="#FBBF24"/>
  <circle cx="46.6" cy="46.4" r="1.6" fill="#FEF3C7"/>
</svg>
