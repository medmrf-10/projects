<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet" />
  <meta name="referrer" content="no-referrer" />
  <title>دخول — Accès</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 1.5rem;
      background: #f4f6f9;
      color: #0f172a;
      font-family: "IBM Plex Sans Arabic", system-ui, -apple-system, sans-serif;
    }
    .gate-card {
      width: 100%;
      max-width: 360px;
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 18px;
      padding: 2rem 1.75rem;
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.06);
      text-align: center;
    }
    .gate-title {
      margin: 0 0 0.25rem;
      font-size: 1.15rem;
      font-weight: 700;
    }
    .gate-sub {
      margin: 0 0 1.25rem;
      font-size: 0.88rem;
      color: #64748b;
    }
    .pin-input {
      width: 100%;
      padding: 0.85rem 1rem;
      border-radius: 12px;
      border: 1.5px solid #cbd5e1;
      background: #f8fafc;
      color: #0f172a;
      font-size: 1.2rem;
      font-weight: 700;
      letter-spacing: 0.2em;
      text-align: center;
      direction: ltr;
      outline: none;
    }
    .pin-input:focus {
      border-color: #0369a1;
      box-shadow: 0 0 0 4px rgba(3, 105, 161, 0.12);
    }
    .open-btn {
      width: 100%;
      margin-top: 0.9rem;
      padding: 0.85rem 1rem;
      border: none;
      border-radius: 12px;
      background: #0369a1;
      color: #ffffff;
      font-size: 0.95rem;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
    }
    .open-btn:disabled { opacity: 0.6; cursor: wait; }
    .err {
      margin-top: 0.75rem;
      font-size: 0.85rem;
      color: #dc2626;
      min-height: 1.3em;
    }
  </style>
</head>
<body>
  <form id="gateForm" class="gate-card" autocomplete="off">
    <h1 class="gate-title">رمز الدخول</h1>
    <p class="gate-sub">Code d'accès</p>
    <input id="pinInput" class="pin-input" type="password" inputmode="numeric" placeholder="••••••••" required autofocus />
    <button id="openBtn" class="open-btn" type="submit">دخول • Ouvrir</button>
    <div id="errBox" class="err" role="alert"></div>
  </form>

      const form = document.getElementById("gateForm");
      const input = document.getElementById("pinInput");
      const btn = document.getElementById("openBtn");
      const errBox = document.getElementById("errBox");

      function b64ToBytes(b64) {
        const bin = atob(b64);
        const out = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
        return out;
      }

      form.addEventListener("submit", async function (e) {
        e.preventDefault();
        errBox.textContent = "";
        btn.disabled = true;
        try {
          const clean = String(input.value || "").replace(/\s+/g, "");
          const keyMat = await crypto.subtle.importKey(
            "raw",
            new TextEncoder().encode(clean),
            { name: "PBKDF2" },
            false,
            ["deriveKey"]
          );
          const aesKey = await crypto.subtle.deriveKey(
            { name: "PBKDF2", salt: b64ToBytes(BUNDLE.salt), iterations: BUNDLE.iter, hash: "SHA-256" },
            keyMat,
            { name: "AES-GCM", length: 256 },
            false,
            ["decrypt"]
          );
          const plainBuf = await crypto.subtle.decrypt(
            { name: "AES-GCM", iv: b64ToBytes(BUNDLE.iv) },
            aesKey,
            b64ToBytes(BUNDLE.ct)
          );
          const htmlText = new TextDecoder().decode(plainBuf);
          document.open();
          document.write(htmlText);
          document.close();
        } catch (err) {
          errBox.textContent = "الرمز غير صحيح • Code incorrect";
          input.select();
        } finally {
          btn.disabled = false;
        }
      });
    })();
  </script>
