/* ==========================================================================
   BULLYING-CINEMA.HTML — V3 PERSISTENT KINEMATIC STAGE & MAGIC-MOVE ENGINE
   A24 / Apple Keynote Magic-Move / Kurzgesagt Atmospheric Art Direction
   Zero Slide-Flipping: Persistent Sets + Articulated Actors + 2.5D Camera Rig
   Strictly Western Arabic Numerals (0-9) • Single-Sentence Micro-Storytelling
   ========================================================================== */

:root {
  color-scheme: dark;
  --font-sans: 'IBM Plex Sans Arabic', 'Readex Pro', system-ui, -apple-system, sans-serif;
  --font-display: 'Readex Pro', 'IBM Plex Sans Arabic', system-ui, sans-serif;
  --font-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;

  /* Obsidian Velvet Cinema Palette */
  --bg-void: #05070e;
  --bg-shell: #080c18;
  --bg-stage: #0b1122;
  --glass-bg: rgba(10, 15, 29, 0.74);
  --glass-bg-strong: rgba(9, 14, 26, 0.90);
  --glass-border: rgba(255, 255, 255, 0.10);
  --glass-highlight: rgba(255, 255, 255, 0.18);
  --text-main: #f8fafc;
  --text-soft: #cbd5e1;
  --text-muted: #94a3b8;

  /* Mood-Driven Dynamic Lighting */
  --accent: #38bdf8;
  --accent-2: #f59e0b;
  --stage-glow-1: rgba(56, 189, 248, 0.18);
  --stage-glow-2: rgba(245, 158, 11, 0.12);
  --vignette-color: rgba(3, 5, 12, 0.68);

  /* Smooth Easing Curves */
  --ease-cinema: cubic-bezier(0.22, 1, 0.36, 1);
  --ease-spring: cubic-bezier(0.34, 1.38, 0.64, 1);
  --ease-soft: cubic-bezier(0.4, 0, 0.2, 1);
}

/* Warm Museum Ivory Studio Theme (Light Mode) */
html[data-theme="light"],
#cinema-app[data-theme="light"] {
  color-scheme: light;
  --bg-void: #eae6dd;
  --bg-shell: #f3f0e8;
  --bg-stage: #ebe6da;
  --glass-bg: rgba(252, 250, 245, 0.84);
  --glass-bg-strong: rgba(252, 250, 245, 0.95);
  --glass-border: rgba(15, 23, 42, 0.12);
  --glass-highlight: rgba(255, 255, 255, 0.85);
  --text-main: #0f172a;
  --text-soft: #334155;
  --text-muted: #64748b;
  --vignette-color: rgba(15, 23, 42, 0.16);
}

/* 14 Atmospheric Story Moods */
[data-mood="morning"]     { --accent: #38bdf8; --accent-2: #fbbf24; --stage-glow-1: rgba(251, 191, 36, 0.20); --stage-glow-2: rgba(56, 189, 248, 0.16); }
[data-mood="shadow"]      { --accent: #f43f5e; --accent-2: #64748b; --stage-glow-1: rgba(244, 63, 94, 0.20);  --stage-glow-2: rgba(30, 41, 59, 0.35); }
[data-mood="tiger"]       { --accent: #f59e0b; --accent-2: #ef4444; --stage-glow-1: rgba(245, 158, 11, 0.24); --stage-glow-2: rgba(220, 38, 38, 0.18); }
[data-mood="scale"]       { --accent: #fb923c; --accent-2: #38bdf8; --stage-glow-1: rgba(251, 146, 60, 0.18); --stage-glow-2: rgba(56, 189, 248, 0.14); }
[data-mood="arena"]       { --accent: #f97316; --accent-2: #10b981; --stage-glow-1: rgba(249, 115, 22, 0.19); --stage-glow-2: rgba(16, 185, 129, 0.14); }
[data-mood="mind"]        { --accent: #a78bfa; --accent-2: #22d3ee; --stage-glow-1: rgba(167, 139, 250, 0.22); --stage-glow-2: rgba(34, 211, 238, 0.14); }
[data-mood="cyber"]       { --accent: #06b6d4; --accent-2: #ec4899; --stage-glow-1: rgba(6, 182, 212, 0.22);  --stage-glow-2: rgba(236, 72, 153, 0.18); }
[data-mood="home"]        { --accent: #fbbf24; --accent-2: #f87171; --stage-glow-1: rgba(251, 191, 36, 0.18); --stage-glow-2: rgba(248, 113, 113, 0.14); }
[data-mood="campus"]      { --accent: #38bdf8; --accent-2: #818cf8; --stage-glow-1: rgba(56, 189, 248, 0.18); --stage-glow-2: rgba(129, 140, 248, 0.15); }
[data-mood="corporate"]   { --accent: #818cf8; --accent-2: #f43f5e; --stage-glow-1: rgba(99, 102, 241, 0.18); --stage-glow-2: rgba(244, 63, 94, 0.14); }
[data-mood="observatory"] { --accent: #2dd4bf; --accent-2: #fbbf24; --stage-glow-1: rgba(45, 212, 191, 0.19); --stage-glow-2: rgba(251, 191, 36, 0.14); }
[data-mood="storm"]       { --accent: #fb7185; --accent-2: #8b5cf6; --stage-glow-1: rgba(244, 63, 94, 0.20);  --stage-glow-2: rgba(139, 92, 246, 0.16); }
[data-mood="emerald"]     { --accent: #10b981; --accent-2: #34d399; --stage-glow-1: rgba(16, 185, 129, 0.24); --stage-glow-2: rgba(56, 189, 248, 0.15); }
[data-mood="sunrise"]     { --accent: #fbbf24; --accent-2: #10b981; --stage-glow-1: rgba(251, 191, 36, 0.28); --stage-glow-2: rgba(16, 185, 129, 0.20); }

*, *::before, *::after {
  box-sizing: border-box;
}

[hidden] {
  display: none !important;
}

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  overscroll-behavior: none;
  direction: rtl;
  font-family: var(--font-sans);
  color: var(--text-main);
  background: var(--bg-void);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  letter-spacing: 0;
  font-variant-numeric: lining-nums tabular-nums;
  font-feature-settings: "lnum" 1, "tnum" 1;
}

button, input {
  font-family: inherit;
  letter-spacing: 0;
  font-variant-numeric: lining-nums tabular-nums;
}

/* ==========================================================================
   1. MASTER THEATER SHELL (100dvh Zero-Overflow Layout)
   ========================================================================== */
#cinema-app {
  position: relative;
  width: 100vw;
  height: 100vh;
  height: 100dvh;
  overflow: hidden;
  display: grid;
  grid-template-rows: 52px minmax(0, 1fr) auto 46px;
  gap: 6px;
  padding: 8px 16px 10px;
  background-color: var(--bg-shell);
  background-image:
    radial-gradient(ellipse 72% 55% at 50% 38%, var(--stage-glow-1) 0%, transparent 72%),
    radial-gradient(ellipse 58% 46% at 50% 72%, var(--stage-glow-2) 0%, transparent 76%);
  transition: background-color 0.65s ease;
  user-select: none;
}

#ambient-canvas {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 1;
}

/* ==========================================================================
   2. SMOKED LIQUID-GLASS TOP HUD & INTRA-SCENE BEAT STRIP
   ========================================================================== */
.cinema-topbar {
  position: relative;
  z-index: 30;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  min-width: 0;
}

.scene-cluster {
  display: flex;
  align-items: center;
  gap: 10px;
  min-width: 0;
  flex-shrink: 1;
}

.scene-pill-btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  min-width: 0;
  max-width: 100%;
  overflow: hidden;
  height: 36px;
  padding: 0 14px;
  border-radius: 999px;
  border: 1px solid var(--glass-border);
  box-shadow: inset 0 1px 0 var(--glass-highlight), 0 8px 24px rgba(0, 0, 0, 0.22);
  background: var(--glass-bg);
  backdrop-filter: blur(18px) saturate(150%);
  -webkit-backdrop-filter: blur(18px) saturate(150%);
  color: var(--text-main);
  font-size: 0.84rem;
  font-weight: 700;
  cursor: pointer;
  white-space: nowrap;
  transition: transform 0.2s var(--ease-cinema), border-color 0.25s ease;
}

#hud-scene-title {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
}

.scene-pill-btn:hover {
  transform: translateY(-1px);
  border-color: var(--accent);
}

.scene-live-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--accent);
  box-shadow: 0 0 12px var(--accent);
  flex-shrink: 0;
  transition: background-color 0.4s ease, box-shadow 0.4s ease;
}

.scene-num-tag {
  font-family: var(--font-mono);
  font-size: 0.74rem;
  font-weight: 700;
  color: var(--accent);
  direction: ltr;
  unicode-bidi: isolate;
}

/* Intra-Scene Choreography Dots: Shows micro-changes inside the SAME scene! */
.intra-scene-strip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  height: 32px;
  padding: 0 12px;
  border-radius: 999px;
  background: var(--glass-bg);
  border: 1px solid var(--glass-border);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
}

.intra-scene-label {
  font-size: 0.75rem;
  font-weight: 600;
  color: var(--text-muted);
  margin-inline-end: 4px;
  white-space: nowrap;
}

.intra-dots-wrap {
  display: inline-flex;
  align-items: center;
  gap: 5px;
}

.intra-dot {
  width: 8px;
  height: 8px;
  padding: 0;
  border-radius: 999px;
  border: none;
  background: rgba(148, 163, 184, 0.34);
  cursor: pointer;
  transition: width 0.32s var(--ease-cinema), background-color 0.3s ease, box-shadow 0.3s ease, transform 0.2s ease;
}

.intra-dot:hover {
  transform: scale(1.25);
  background: rgba(148, 163, 184, 0.72);
}

.intra-dot.is-done {
  background: rgba(56, 189, 248, 0.55);
}

.intra-dot.is-active {
  width: 22px;
  background: var(--accent);
  box-shadow: 0 0 10px var(--accent);
}

.hud-tools {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-shrink: 0;
}

.hud-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  min-width: 34px;
  height: 34px;
  padding: 0 10px;
  border-radius: 999px;
  border: 1px solid var(--glass-border);
  box-shadow: inset 0 1px 0 var(--glass-highlight);
  background: var(--glass-bg);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  color: var(--text-main);
  font-size: 0.82rem;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.2s var(--ease-cinema);
}

.hud-btn:hover {
  border-color: var(--accent);
  transform: translateY(-1px);
}

.hud-btn.is-active {
  border-color: var(--accent);
  color: var(--accent);
  box-shadow: 0 0 14px rgba(56, 189, 248, 0.22);
}

.hud-btn-label {
  font-size: 0.75rem;
}

/* ==========================================================================
   3. WIDESCREEN CINEMA VIEWPORT & 2.5D CAMERA RIG
   ========================================================================== */
#stage-viewport {
  position: relative;
  z-index: 10;
  width: 100%;
  height: 100%;
  min-height: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

#stage-frame {
  position: relative;
  container-type: size;
  width: min(1320px, 100%);
  height: 100%;
  max-height: 640px;
  border-radius: 26px;
  overflow: hidden;
  background: var(--bg-stage);
  border: 1px solid var(--glass-border);
  box-shadow:
    inset 0 1px 0 var(--glass-highlight),
    0 24px 64px rgba(0, 0, 0, 0.48);
  cursor: pointer;
  isolation: isolate;
}

html[data-theme="light"] #stage-frame,
#cinema-app[data-theme="light"] #stage-frame {
  box-shadow:
    inset 0 1px 0 rgba(255, 255, 255, 0.92),
    0 20px 50px rgba(15, 23, 42, 0.14);
}

/* Soft Atmospheric Iris Veil on Major Location Dissolves */
#scene-curtain {
  position: absolute;
  inset: 0;
  z-index: 45;
  pointer-events: none;
  background: radial-gradient(circle at 50% 50%, transparent 30%, rgba(5, 8, 17, 0.42) 100%);
  opacity: 0;
  transition: opacity 420ms var(--ease-soft);
}

html[data-theme="light"] #scene-curtain {
  background: radial-gradient(circle at 50% 50%, transparent 30%, rgba(216, 209, 195, 0.42) 100%);
}

#scene-curtain.is-active {
  opacity: 1;
}

/* Atmospheric Film Vignette + Subtle Rim Glow */
.stage-vignette {
  position: absolute;
  inset: 0;
  z-index: 26;
  pointer-events: none;
  background:
    radial-gradient(ellipse 86% 80% at 50% 48%, transparent 58%, var(--vignette-color) 100%);
}

/* 2.5D Camera Rig: Smooth Dolly, Pan & Zoom inside the persistent scene! */
#camera-rig {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  transform-origin: 50% 60%;
  transform: translate3d(var(--cam-x, 0%), var(--cam-y, 0%), 0) scale(var(--cam-zoom, 1));
  transition: transform 860ms var(--ease-cinema), filter 560ms ease;
  will-change: transform;
}

/* Persistent Environment Backdrop Layer (Parallax Plane 1 — Dual-Buffer Cross-Dissolve) */
#backdrop-host {
  position: absolute;
  inset: -3%;
  width: 106%;
  height: 106%;
  z-index: 2;
  transform: translate3d(calc(var(--cam-x, 0%) * -0.18), calc(var(--cam-y, 0%) * -0.12), 0);
  transition: transform 860ms var(--ease-cinema), filter 650ms ease;
  pointer-events: none;
}

#backdrop-host svg.env-svg {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
  opacity: 1;
  transform: scale(1);
  transition: opacity 580ms var(--ease-soft), transform 720ms var(--ease-cinema);
}

#backdrop-host svg.env-svg.is-entering-init {
  opacity: 0;
  transform: scale(1.022);
}

#backdrop-host svg.env-svg.is-exiting {
  opacity: 0;
  transform: scale(0.988);
  pointer-events: none;
}

/* Environment internal animated elements smooth transitions */
.env-svg .env-morph {
  transition:
    transform 820ms var(--ease-cinema),
    opacity 620ms ease,
    fill 620ms ease,
    stroke 620ms ease,
    filter 620ms ease;
  transform-box: fill-box;
  transform-origin: center;
}

.env-svg .env-scale-beam {
  transition: transform 880ms var(--ease-spring);
  transform-box: view-box;
  transform-origin: 600px 268px;
}

.env-svg .env-panorama-track {
  transition: transform 960ms var(--ease-cinema);
}

/* Mid-Stage Choreographed Props Layer (Parallax Plane 2) */
#stage-props-layer {
  position: absolute;
  inset: 0;
  z-index: 12;
  pointer-events: none;
}

/* ==========================================================================
   4. PERSISTENT ARTICULATED CHARACTER RIGS (#actors-layer)
   ========================================================================== */
#actors-layer {
  position: absolute;
  inset: 0;
  z-index: 18;
  pointer-events: none;
}

.cinema-actor {
  --hud-fit: 1;
  position: absolute;
  left: var(--ax, 50%);
  bottom: var(--ay, 5%);
  width: clamp(70px, min(16.2vw, 31dvh), 212px);
  width: clamp(70px, min(16.6cqw, 48cqh), 212px);
  aspect-ratio: 220 / 340;
  transform-origin: 50% 94%;
  transform: translate3d(-50%, 0, 0) scale(calc(var(--ascale, 1) * var(--hud-fit, 1)));
  opacity: 0;
  visibility: hidden;
  transition:
    left 820ms var(--ease-cinema),
    bottom 820ms var(--ease-cinema),
    transform 760ms var(--ease-cinema),
    opacity 460ms ease,
    filter 540ms ease,
    visibility 0s linear 460ms;
  will-change: left, bottom, transform, opacity;
}

#cinema-app[data-has-top-hud="true"] .cinema-actor {
  --hud-fit: 0.93;
}

.cinema-actor[data-present="true"] {
  opacity: 1;
  visibility: visible;
  transition:
    left 820ms var(--ease-cinema),
    bottom 820ms var(--ease-cinema),
    transform 760ms var(--ease-cinema),
    opacity 460ms ease,
    filter 540ms ease,
    visibility 0s linear 0s;
}

/* Depth-of-Field Planes */
.cinema-actor[data-depth="back"] {
  z-index: 14;
  filter: brightness(0.76) saturate(0.82) blur(0.5px);
}
.cinema-actor[data-depth="mid"] {
  z-index: 17;
  filter: brightness(0.91) saturate(0.95);
}
.cinema-actor[data-depth="fore"] {
  z-index: 21;
  filter: drop-shadow(0 14px 24px rgba(0, 0, 0, 0.36));
}
.cinema-actor[data-depth="ghost"] {
  z-index: 15;
  opacity: 0.46 !important;
  filter: saturate(0.65) drop-shadow(0 0 18px var(--accent));
}

/* Horizontal Facing Mirror (Preserves Speech Whisper Readability!) */
.actor-flip-shell {
  width: 100%;
  height: 100%;
  transform: scaleX(var(--aflip, 1));
  transition: transform 520ms var(--ease-cinema);
}

/* Natural Alternating Leg-Swing + Subtle Stride Arc when Actor Walks! */
.cinema-actor.is-walking .actor-stride-wrap {
  animation: actorWalkStride 390ms ease-in-out 2;
}

.actor-svg .rig-leg-l,
.actor-svg .rig-leg-r {
  transform-box: view-box;
  transition: transform 320ms var(--ease-cinema);
}

.cinema-actor.is-walking .actor-svg .rig-leg-l {
  animation: legSwingLeft 390ms ease-in-out 2;
}

.cinema-actor.is-walking .actor-svg .rig-leg-r {
  animation: legSwingRight 390ms ease-in-out 2;
}

@keyframes actorWalkStride {
  0%, 100% { transform: translateY(0) rotate(0deg); }
  25% { transform: translateY(-5px) rotate(0.9deg); }
  50% { transform: translateY(-1px) rotate(0deg); }
  75% { transform: translateY(-5px) rotate(-0.9deg); }
}

@keyframes legSwingLeft {
  0%, 100% { transform: rotate(0deg); }
  25% { transform: rotate(13deg) translateY(-3px); }
  75% { transform: rotate(-11deg); }
}

@keyframes legSwingRight {
  0%, 100% { transform: rotate(0deg); }
  25% { transform: rotate(-11deg); }
  75% { transform: rotate(13deg) translateY(-3px); }
}

.actor-svg {
  width: 100%;
  height: 100%;
  overflow: visible;
  display: block;
}

/* Articulated Body Posture & Facial Rig Smooth Morphing (Explicit view-box for Safari/WebKit!) */
.actor-svg .rig-breathe {
  transform-box: fill-box;
  transform-origin: 50% 100%;
  animation: rigIdleBreathe 4.2s ease-in-out infinite;
}

@keyframes rigIdleBreathe {
  0%, 100% { transform: translateY(0) scaleY(1); }
  50% { transform: translateY(-2.2px) scaleY(1.011); }
}

.actor-svg .rig-upper-body {
  transform-box: view-box;
  transform-origin: 110px 232px;
  transform: rotate(var(--torso-lean, 0deg)) translateY(var(--torso-sink, 0px));
  transition: transform 620ms var(--ease-cinema);
}

.actor-svg .rig-head-group {
  transform-box: view-box;
  transform-origin: 110px 132px;
  transform: rotate(var(--head-tilt, 0deg)) translateY(var(--head-drop, 0px));
  transition: transform 560ms var(--ease-cinema);
}

.actor-svg .rig-pupils {
  transform: translate(var(--look-x, 0px), var(--look-y, 0px)) scale(var(--pupil-scale, 1));
  transform-box: fill-box;
  transform-origin: center;
  transition: transform 380ms var(--ease-cinema);
}

/* Clean Skin-Matched Upper Eyelid Shutter Blink (Never Squashes Pupils or Creates Dashed Slits!) */
.actor-svg .rig-upper-lid {
  transform-box: fill-box;
  transform-origin: center top;
  transform: scaleY(0);
  opacity: 0;
  animation: rigLidBlink 6.2s ease-in-out infinite;
}

@keyframes rigLidBlink {
  0%, 72%, 76%, 100% { transform: scaleY(0); opacity: 0; }
  74% { transform: scaleY(1); opacity: 1; }
}

.actor-svg .rig-brow-l,
.actor-svg .rig-brow-r {
  transform-box: fill-box;
  transform-origin: center;
  transition: transform 420ms var(--ease-cinema);
}

/* Posture Presets Driven Purely by [data-posture] on .cinema-actor (All 9 Postures Defined!) */
.cinema-actor[data-posture="neutral"]   { --torso-lean: 0deg;    --torso-sink: 0px;  --head-tilt: 0deg;   --head-drop: 0px; }
.cinema-actor[data-posture="confident"] { --torso-lean: -2deg;   --torso-sink: -2px; --head-tilt: -3deg;  --head-drop: -2px; }
.cinema-actor[data-posture="crossed"]   { --torso-lean: -3.5deg; --torso-sink: -1px; --head-tilt: -4deg;  --head-drop: -1px; }
.cinema-actor[data-posture="looming"]   { --torso-lean: 7deg;    --torso-sink: 0px;  --head-tilt: 4deg;   --head-drop: 2px; }
.cinema-actor[data-posture="cowering"]  { --torso-lean: -6deg;   --torso-sink: 7px;  --head-tilt: 9deg;   --head-drop: 6px; }
.cinema-actor[data-posture="slumped"]   { --torso-lean: 3deg;    --torso-sink: 9px;  --head-tilt: 11deg;  --head-drop: 8px; }
.cinema-actor[data-posture="defending"] { --torso-lean: 4deg;    --torso-sink: -2px; --head-tilt: -2deg;  --head-drop: 0px; }
.cinema-actor[data-posture="recoiling"] { --torso-lean: -8deg;   --torso-sink: 4px;  --head-tilt: -5deg;  --head-drop: 2px; }
.cinema-actor[data-posture="phone"]     { --torso-lean: 4deg;    --torso-sink: 3px;  --head-tilt: 10deg;  --head-drop: 5px; }

/* Separate Head vs Torso Micro-Tremor (Preserves Exact Posture Variables Without Spasm!) */
.cinema-actor[data-mood="anxious"] .rig-head-group {
  animation: headFearTremor 2.6s ease-in-out infinite;
}
.cinema-actor[data-mood="broken"] .rig-upper-body {
  animation: torsoBrokenTremor 2.9s ease-in-out infinite;
}
@keyframes headFearTremor {
  0%, 100% { transform: rotate(var(--head-tilt, 0deg)) translate(0px, var(--head-drop, 0px)); }
  45% { transform: rotate(var(--head-tilt, 0deg)) translate(-0.85px, var(--head-drop, 0px)); }
  55% { transform: rotate(var(--head-tilt, 0deg)) translate(0.85px, var(--head-drop, 0px)); }
}
@keyframes torsoBrokenTremor {
  0%, 100% { transform: rotate(var(--torso-lean, 0deg)) translate(0px, var(--torso-sink, 0px)); }
  46% { transform: rotate(var(--torso-lean, 0deg)) translate(-0.75px, calc(var(--torso-sink, 0px) + 0.6px)); }
  54% { transform: rotate(var(--torso-lean, 0deg)) translate(0.75px, calc(var(--torso-sink, 0px) + 0.6px)); }
}

/* Arm Pose Switching (Smooth Opacity + Joint Rotation) */
.actor-svg .arm-variant {
  opacity: 0;
  transform-box: fill-box;
  transform-origin: top center;
  transform: rotate(6deg) scale(0.96);
  transition: opacity 340ms ease, transform 460ms var(--ease-cinema);
  pointer-events: none;
}

.cinema-actor[data-arms="relaxed"]  .arm-variant[data-arm="relaxed"],
.cinema-actor[data-arms="notebook"] .arm-variant[data-arm="notebook"],
.cinema-actor[data-arms="crossed"]  .arm-variant[data-arm="crossed"],
.cinema-actor[data-arms="pointing"] .arm-variant[data-arm="pointing"],
.cinema-actor[data-arms="phone"]    .arm-variant[data-arm="phone"],
.cinema-actor[data-arms="shield"]   .arm-variant[data-arm="shield"],
.cinema-actor[data-arms="distress"] .arm-variant[data-arm="distress"] {
  opacity: 1;
  transform: rotate(0deg) scale(1);
}

/* Facial Expression Switching (12 Nuanced Moods) */
.actor-svg .mouth-variant,
.actor-svg .fx-variant {
  opacity: 0;
  transition: opacity 300ms ease;
}

.cinema-actor[data-mood="serene"]     .mouth-variant[data-m="serene"],
.cinema-actor[data-mood="empathetic"] .mouth-variant[data-m="empathetic"],
.cinema-actor[data-mood="resolute"]   .mouth-variant[data-m="resolute"],
.cinema-actor[data-mood="radiant"]    .mouth-variant[data-m="radiant"],
.cinema-actor[data-mood="neutral"]    .mouth-variant[data-m="neutral"],
.cinema-actor[data-mood="anxious"]    .mouth-variant[data-m="anxious"],
.cinema-actor[data-mood="hurt"]       .mouth-variant[data-m="hurt"],
.cinema-actor[data-mood="broken"]     .mouth-variant[data-m="broken"],
.cinema-actor[data-mood="smirk"]      .mouth-variant[data-m="smirk"],
.cinema-actor[data-mood="furious"]    .mouth-variant[data-m="furious"],
.cinema-actor[data-mood="mocking"]    .mouth-variant[data-m="mocking"],
.cinema-actor[data-mood="stunned"]    .mouth-variant[data-m="stunned"] {
  opacity: 1;
}

.cinema-actor[data-mood="hurt"]     .fx-variant[data-fx="tear"],
.cinema-actor[data-mood="broken"]   .fx-variant[data-fx="tear"],
.cinema-actor[data-mood="anxious"]  .fx-variant[data-fx="sweat"],
.cinema-actor[data-mood="furious"]  .fx-variant[data-fx="anger"],
.cinema-actor[data-mood="resolute"] .fx-variant[data-fx="aura-shield"],
.cinema-actor[data-mood="radiant"]  .fx-variant[data-fx="sparkles"] {
  opacity: 1;
}

/* Eyebrow Choreography per Mood */
.cinema-actor[data-mood="serene"]     .rig-brow-l { transform: translateY(-2px) rotate(-3deg); }
.cinema-actor[data-mood="serene"]     .rig-brow-r { transform: translateY(-2px) rotate(3deg); }
.cinema-actor[data-mood="empathetic"] .rig-brow-l { transform: translateY(-3px) rotate(-7deg); }
.cinema-actor[data-mood="empathetic"] .rig-brow-r { transform: translateY(-3px) rotate(7deg); }
.cinema-actor[data-mood="anxious"]    .rig-brow-l { transform: translateY(-4px) rotate(-12deg); }
.cinema-actor[data-mood="anxious"]    .rig-brow-r { transform: translateY(-4px) rotate(12deg); }
.cinema-actor[data-mood="hurt"]       .rig-brow-l { transform: translateY(-2px) rotate(-15deg); }
.cinema-actor[data-mood="hurt"]       .rig-brow-r { transform: translateY(-2px) rotate(15deg); }
.cinema-actor[data-mood="broken"]     .rig-brow-l { transform: translateY(1px) rotate(-17deg); }
.cinema-actor[data-mood="broken"]     .rig-brow-r { transform: translateY(1px) rotate(17deg); }
.cinema-actor[data-mood="smirk"]      .rig-brow-l { transform: translateY(2px) rotate(9deg); }
.cinema-actor[data-mood="smirk"]      .rig-brow-r { transform: translateY(-4px) rotate(8deg); }
.cinema-actor[data-mood="furious"]    .rig-brow-l { transform: translateY(3px) rotate(18deg); }
.cinema-actor[data-mood="furious"]    .rig-brow-r { transform: translateY(3px) rotate(-18deg); }
.cinema-actor[data-mood="mocking"]    .rig-brow-l { transform: translateY(-3px) rotate(8deg); }
.cinema-actor[data-mood="mocking"]    .rig-brow-r { transform: translateY(-4px) rotate(-8deg); }
.cinema-actor[data-mood="stunned"]    .rig-brow-l { transform: translateY(-6px) rotate(-4deg); }
.cinema-actor[data-mood="stunned"]    .rig-brow-r { transform: translateY(-6px) rotate(4deg); }
.cinema-actor[data-mood="resolute"]   .rig-brow-l { transform: translateY(1px) rotate(8deg); }
.cinema-actor[data-mood="resolute"]   .rig-brow-r { transform: translateY(1px) rotate(-8deg); }
.cinema-actor[data-mood="radiant"]    .rig-brow-l { transform: translateY(-4px) rotate(-5deg); }
.cinema-actor[data-mood="radiant"]    .rig-brow-r { transform: translateY(-4px) rotate(5deg); }

/* Character Whisper Bubble (Balanced Multi-Line + Edge-Aware Alignment — Zero Truncation!) */
.actor-whisper {
  --w-shift: -50%;
  position: absolute;
  bottom: 95%;
  left: 50%;
  transform: translate3d(var(--w-shift), 8px, 0) scale(0.92);
  padding: 5px 12px 6px;
  border-radius: 14px;
  background: var(--glass-bg-strong);
  border: 1px solid var(--glass-border);
  box-shadow: 0 10px 26px rgba(0, 0, 0, 0.32);
  color: var(--text-main);
  font-size: 0.77rem;
  font-weight: 700;
  line-height: 1.36;
  text-align: center;
  white-space: normal;
  text-wrap: balance;
  width: max-content;
  max-width: min(228px, 42cqw);
  opacity: 0;
  pointer-events: none;
  z-index: 25;
  transition: opacity 340ms ease, transform 420ms var(--ease-spring), border-color 300ms ease;
}

.cinema-actor[data-edge="left"] .actor-whisper {
  --w-shift: -16%;
}

.cinema-actor[data-edge="right"] .actor-whisper {
  --w-shift: -84%;
}

.actor-whisper.is-visible {
  opacity: 1;
  transform: translate3d(var(--w-shift), -3px, 0) scale(1);
}

.actor-whisper[data-tone="hostile"] {
  border-color: rgba(244, 63, 94, 0.58);
  background: rgba(69, 10, 20, 0.88);
  color: #ffe4e6;
}

.actor-whisper[data-tone="defender"] {
  border-color: rgba(16, 185, 129, 0.62);
  background: rgba(6, 54, 42, 0.88);
  color: #ecfdf5;
}

.actor-whisper[data-tone="thought"] {
  border-style: dashed;
  border-color: rgba(148, 163, 184, 0.45);
}

html[data-theme="light"] .actor-whisper[data-tone="hostile"] {
  background: #fff1f2;
  color: #881337;
}
html[data-theme="light"] .actor-whisper[data-tone="defender"] {
  background: #ecfdf5;
  color: #064e3b;
}

.actor-nameplate {
  position: absolute;
  bottom: -6px;
  left: 50%;
  transform: translateX(-50%);
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 2px 10px 3px;
  border-radius: 999px;
  background: rgba(8, 12, 24, 0.72);
  border: 1px solid rgba(255, 255, 255, 0.12);
  backdrop-filter: blur(8px);
  white-space: nowrap;
  font-size: 0.75rem;
  line-height: 1.3;
  transition: opacity 320ms ease;
}

html[data-theme="light"] .actor-nameplate {
  background: rgba(255, 255, 255, 0.88);
  border-color: rgba(15, 23, 42, 0.14);
}

.actor-nameplate-name {
  font-weight: 700;
  color: var(--text-main);
}

.actor-nameplate-role {
  font-size: 0.72rem;
  color: var(--accent);
  font-weight: 600;
}

/* ==========================================================================
   5. KINETIC IN-SCENE CALLOUT PROJECTION (#kinetic-hud-layer)
      Stays sharp above camera zoom, never replaces the living stage!
   ========================================================================== */
#kinetic-hud-layer {
  position: absolute;
  top: 14px;
  left: 16px;
  right: 16px;
  z-index: 28;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  pointer-events: none;
}

.kinetic-projection {
  display: inline-flex;
  align-items: center;
  gap: 12px;
  padding: 7px 18px;
  border-radius: 999px;
  background: var(--glass-bg-strong);
  border: 1px solid var(--glass-border);
  box-shadow: inset 0 1px 0 var(--glass-highlight), 0 14px 36px rgba(0, 0, 0, 0.34);
  backdrop-filter: blur(20px) saturate(160%);
  -webkit-backdrop-filter: blur(20px) saturate(160%);
  opacity: 0;
  transform: translateY(-10px) scale(0.95);
  transition: opacity 380ms var(--ease-cinema), transform 440ms var(--ease-cinema), border-color 380ms ease;
}

.kinetic-projection.is-visible {
  opacity: 1;
  transform: translateY(0) scale(1);
}

.kinetic-stat {
  font-family: var(--font-display);
  font-size: clamp(1.15rem, 2vw, 1.65rem);
  font-weight: 700;
  color: var(--accent);
  direction: ltr;
  unicode-bidi: isolate;
  text-shadow: 0 0 22px var(--stage-glow-1);
}

.kinetic-stat.is-arabic {
  direction: rtl;
}

.kinetic-divider {
  width: 1px;
  height: 20px;
  background: var(--glass-border);
}

.kinetic-label {
  font-size: 0.86rem;
  font-weight: 700;
  color: var(--text-main);
}

.kinetic-pills-row {
  display: flex;
  align-items: center;
  justify-content: center;
  flex-wrap: wrap;
  gap: 7px;
  max-width: 92%;
  opacity: 0;
  transform: translateY(-6px);
  transition: opacity 400ms ease, transform 440ms var(--ease-cinema);
}

.kinetic-pills-row.is-visible {
  opacity: 1;
  transform: translateY(0);
}

.k-pill {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 4px 12px;
  border-radius: 999px;
  background: var(--glass-bg-strong);
  border: 1px solid var(--glass-border);
  backdrop-filter: blur(14px);
  font-size: 0.77rem;
  font-weight: 600;
  color: var(--text-soft);
  box-shadow: 0 6px 18px rgba(0, 0, 0, 0.24);
  animation: kPillPop 420ms var(--ease-cinema) both;
}

.k-pill[data-tone="crimson"] { border-color: rgba(244, 63, 94, 0.50); color: #fda4af; }
.k-pill[data-tone="amber"]   { border-color: rgba(245, 158, 11, 0.50); color: #fcd34d; }
.k-pill[data-tone="emerald"] { border-color: rgba(16, 185, 129, 0.52); color: #6ee7b7; }
.k-pill[data-tone="cyan"]    { border-color: rgba(56, 189, 248, 0.50); color: #7dd3fc; }
.k-pill[data-tone="violet"]  { border-color: rgba(167, 139, 250, 0.52); color: #ddd6fe; }

html[data-theme="light"] .k-pill[data-tone="crimson"] { color: #be123c; }
html[data-theme="light"] .k-pill[data-tone="amber"]   { color: #b45309; }
html[data-theme="light"] .k-pill[data-tone="emerald"] { color: #047857; }
html[data-theme="light"] .k-pill[data-tone="cyan"]    { color: #0369a1; }
html[data-theme="light"] .k-pill[data-tone="violet"]  { color: #6d28d9; }

@keyframes kPillPop {
  0% { opacity: 0; transform: translateY(-6px) scale(0.92); }
  100% { opacity: 1; transform: translateY(0) scale(1); }
}

/* ==========================================================================
   6. INTERACTIVE STUDIO OVERLAY (#interactive-layer — Beats 74, 75, 76, 78)
   ========================================================================== */
#interactive-layer {
  position: absolute;
  inset: 0;
  z-index: 32;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: space-between;
  padding: 14px 20px 16px;
  pointer-events: none;
  opacity: 0;
  transition: opacity 380ms ease;
}

#interactive-layer[data-active="true"] {
  opacity: 1;
}

#interactive-layer .ix-panel,
#interactive-layer button {
  pointer-events: auto;
}

.ix-top-card {
  display: flex;
  align-items: center;
  justify-content: center;
  flex-wrap: wrap;
  gap: 10px;
  padding: 8px 16px;
  border-radius: 18px;
  background: var(--glass-bg-strong);
  border: 1px solid var(--glass-border);
  backdrop-filter: blur(18px);
  box-shadow: 0 12px 32px rgba(0, 0, 0, 0.34);
  max-width: 92%;
}

.ix-meter-track {
  width: clamp(130px, 20vw, 220px);
  height: 9px;
  border-radius: 999px;
  background: rgba(148, 163, 184, 0.24);
  overflow: hidden;
}

.ix-meter-fill {
  height: 100%;
  border-radius: 999px;
  background: linear-gradient(90deg, #f43f5e, #f59e0b);
  transition: width 620ms var(--ease-cinema), background 450ms ease;
}

.ix-meter-fill.is-healed {
  background: linear-gradient(90deg, #10b981, #38bdf8);
}

.ix-bottom-dock {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  width: 100%;
  max-width: 860px;
}

.ix-btn-row {
  display: flex;
  align-items: center;
  justify-content: center;
  flex-wrap: wrap;
  gap: 8px;
}

.ix-action-btn {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 8px 16px;
  border-radius: 999px;
  border: 1px solid var(--glass-border);
  background: var(--glass-bg-strong);
  color: var(--text-main);
  font-size: 0.82rem;
  font-weight: 700;
  cursor: pointer;
  backdrop-filter: blur(16px);
  box-shadow: 0 8px 22px rgba(0, 0, 0, 0.28);
  transition: all 0.22s var(--ease-cinema);
}

.ix-action-btn:hover {
  transform: translateY(-2px);
  border-color: var(--accent);
}

.ix-action-btn.is-selected {
  border-color: var(--accent);
  background: rgba(56, 189, 248, 0.20);
  box-shadow: 0 0 20px rgba(56, 189, 248, 0.25);
}

.ix-action-btn.is-correct {
  border-color: #10b981;
  background: rgba(16, 185, 129, 0.24);
  color: #6ee7b7;
}

.ix-action-btn.is-wrong {
  border-color: #f43f5e;
  background: rgba(244, 63, 94, 0.22);
  color: #fda4af;
}

html[data-theme="light"] .ix-action-btn.is-correct { color: #065f46; }
html[data-theme="light"] .ix-action-btn.is-wrong   { color: #9f1239; }

.ix-case-card {
  padding: 10px 18px;
  border-radius: 16px;
  background: var(--glass-bg-strong);
  border: 1px solid var(--glass-border);
  backdrop-filter: blur(18px);
  text-align: center;
  max-width: 660px;
  box-shadow: 0 12px 30px rgba(0, 0, 0, 0.30);
}

.ix-case-title {
  font-size: 0.92rem;
  font-weight: 700;
  line-height: 1.5;
  color: var(--text-main);
}

/* ==========================================================================
   7. CRITERION-STYLE SINGLE-SENTENCE SUBTITLE DOCK
   ========================================================================== */
.subtitle-dock {
  position: relative;
  z-index: 25;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 2px 8px;
}

.subtitle-glass {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  width: min(1060px, 100%);
  min-height: 64px;
  padding: 10px 22px;
  border-radius: 20px;
  background: var(--glass-bg-strong);
  border: 1px solid var(--glass-border);
  box-shadow:
    inset 0 1px 0 var(--glass-highlight),
    0 14px 36px rgba(0, 0, 0, 0.30);
  backdrop-filter: blur(22px) saturate(160%);
  -webkit-backdrop-filter: blur(22px) saturate(160%);
  user-select: text;
}

.subtitle-sentence {
  margin: 0;
  flex: 1 1 auto;
  font-size: clamp(1.06rem, 1.68vw, 1.42rem);
  font-weight: 700;
  line-height: 1.56;
  color: var(--text-main);
  text-align: center;
}

.subtitle-sentence.is-animating {
  animation: subtitleReveal 360ms var(--ease-cinema) both;
}

@keyframes subtitleReveal {
  0% { opacity: 0; transform: translateY(7px); }
  100% { opacity: 1; transform: translateY(0); }
}

.source-cite-btn {
  flex-shrink: 0;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 4px 11px;
  border-radius: 999px;
  border: 1px solid rgba(56, 189, 248, 0.32);
  background: rgba(56, 189, 248, 0.10);
  color: var(--accent);
  font-size: 0.75rem;
  font-weight: 700;
  cursor: pointer;
  white-space: nowrap;
  transition: all 0.2s ease;
}

.source-cite-btn:hover {
  background: rgba(56, 189, 248, 0.20);
  transform: translateY(-1px);
}

/* ==========================================================================
   8. CINEMATIC TIMELINE SCRUBBER & POWERPOINT NAVIGATION FOOTER
   ========================================================================== */
.cinema-bottombar {
  position: relative;
  z-index: 30;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  direction: ltr;
}

#cinema-app[data-rtl-nav="true"] .cinema-bottombar {
  direction: rtl;
}

.step-arrow-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  height: 34px;
  padding: 0 14px;
  border-radius: 999px;
  border: 1px solid var(--glass-border);
  background: var(--glass-bg);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  color: var(--text-main);
  font-size: 0.82rem;
  font-weight: 700;
  cursor: pointer;
  direction: ltr;
  unicode-bidi: isolate;
  transition: all 0.2s var(--ease-cinema);
}

#cinema-app[data-rtl-nav="true"] .step-arrow-btn {
  flex-direction: row-reverse;
}

#cinema-app[data-rtl-nav="true"] .step-arrow-svg {
  transform: scaleX(-1);
}

.step-arrow-svg {
  width: 14px;
  height: 14px;
  flex-shrink: 0;
  transition: transform 0.25s var(--ease-cinema);
}

.step-arrow-btn:hover:not(:disabled) {
  border-color: var(--accent);
  transform: scale(1.04);
}

.step-arrow-btn:disabled {
  opacity: 0.35;
  cursor: not-allowed;
}

.timeline-track {
  position: relative;
  flex: 1 1 auto;
  max-width: 780px;
  height: 8px;
  border-radius: 999px;
  background: rgba(148, 163, 184, 0.22);
  cursor: pointer;
  display: flex;
  align-items: center;
  direction: ltr;
}

#cinema-app[data-rtl-nav="true"] .timeline-track {
  direction: rtl;
}

.timeline-fill {
  height: 100%;
  border-radius: 999px;
  background: linear-gradient(90deg, #38bdf8, #10b981, #fbbf24);
  transition: width 320ms var(--ease-cinema);
  pointer-events: none;
}

#cinema-app[data-rtl-nav="true"] .timeline-fill {
  background: linear-gradient(270deg, #38bdf8, #10b981, #fbbf24);
}

.scene-marker {
  position: absolute;
  top: 50%;
  left: var(--m-pct, 0%);
  transform: translate(-50%, -50%);
  width: 11px;
  height: 11px;
  padding: 0;
  border-radius: 50%;
  border: 2px solid var(--bg-shell);
  background: rgba(203, 213, 225, 0.65);
  cursor: pointer;
  z-index: 3;
  transition: transform 0.2s ease, background-color 0.25s ease;
}

#cinema-app[data-rtl-nav="true"] .scene-marker {
  left: auto;
  right: var(--m-pct, 0%);
  transform: translate(50%, -50%);
}

.scene-marker:hover {
  transform: translate(-50%, -50%) scale(1.4);
}

#cinema-app[data-rtl-nav="true"] .scene-marker:hover {
  transform: translate(50%, -50%) scale(1.4);
}

.scene-marker.is-reached {
  background: var(--accent);
}

.scene-marker.is-current {
  transform: translate(-50%, -50%) scale(1.35);
  background: #fbbf24;
  box-shadow: 0 0 10px rgba(251, 191, 36, 0.8);
}

#cinema-app[data-rtl-nav="true"] .scene-marker.is-current {
  transform: translate(50%, -50%) scale(1.35);
}

.beat-counter-pill {
  font-family: var(--font-mono);
  font-size: 0.78rem;
  font-weight: 700;
  min-width: 68px;
  text-align: center;
  color: var(--text-soft);
  direction: ltr;
  unicode-bidi: isolate;
}

.intra-step-count {
  font-family: var(--font-mono);
  font-size: 0.72rem;
  font-weight: 700;
  color: var(--accent);
  direction: ltr;
  unicode-bidi: isolate;
  margin-inline-start: 4px;

/* ==========================================================================
   9. SCENE INDEX DRAWER & 79-REFERENCE SCHOLARLY VAULT MODALS
   ========================================================================== */
.cinema-modal-backdrop {
  position: fixed;
  inset: 0;
  z-index: 90;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  background: rgba(4, 7, 15, 0.82);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
  transition: opacity 0.24s ease, visibility 0.24s ease;
}

.cinema-modal-backdrop.is-open {
  opacity: 1;
  visibility: visible;
  pointer-events: auto;
}

.cinema-modal-sheet {
  width: min(1100px, 95vw);
  max-height: 85vh;
  display: flex;
  flex-direction: column;
  border-radius: 24px;
  background: var(--glass-bg-strong);
  border: 1px solid var(--glass-border);
  box-shadow: 0 28px 80px rgba(0, 0, 0, 0.65);
  overflow: hidden;
  direction: rtl;
  user-select: text;
}

.modal-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 16px 22px;
  border-bottom: 1px solid var(--glass-border);
}

.modal-title-wrap {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}

.modal-title {
  font-size: 1.05rem;
  font-weight: 700;
  margin: 0;
}

.modal-badge {
  padding: 3px 11px;
  border-radius: 999px;
  font-size: 0.76rem;
  font-weight: 700;
  background: rgba(56, 189, 248, 0.15);
  border: 1px solid rgba(56, 189, 248, 0.36);
  color: var(--accent);
}

.modal-close-btn {
  width: 34px;
  height: 34px;
  border-radius: 50%;
  border: 1px solid var(--glass-border);
  background: rgba(148, 163, 184, 0.10);
  color: var(--text-main);
  font-size: 0.95rem;
  font-weight: 700;
  cursor: pointer;
}

.modal-close-btn:hover {
  border-color: #f43f5e;
  background: rgba(244, 63, 94, 0.18);
}

.modal-scroll-body {
  padding: 18px 22px;
  overflow-y: auto;
  flex: 1 1 auto;
  min-height: 0;
}

.scene-group-block {
  margin-bottom: 18px;
}

.scene-group-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 8px;
  font-size: 0.88rem;
  font-weight: 700;
  color: var(--accent);
}

.beats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 8px;
}

.beat-jump-card {
  display: flex;
  align-items: flex-start;
  gap: 8px;
  padding: 9px 11px;
  border-radius: 13px;
  border: 1px solid var(--glass-border);
  background: rgba(148, 163, 184, 0.06);
  color: var(--text-main);
  text-align: right;
  cursor: pointer;
  transition: all 0.18s ease;
}

.beat-jump-card:hover {
  border-color: var(--accent);
  background: rgba(56, 189, 248, 0.10);
  transform: translateY(-1px);
}

.beat-jump-card.is-current {
  border-color: #fbbf24;
  background: rgba(251, 191, 36, 0.14);
}

.beat-jump-num {
  font-family: var(--font-mono);
  font-size: 0.75rem;
  font-weight: 700;
  padding: 2px 7px;
  border-radius: 7px;
  background: rgba(56, 189, 248, 0.16);
  color: var(--accent);
  direction: ltr;
  flex-shrink: 0;
}

.beat-jump-txt {
  font-size: 0.77rem;
  line-height: 1.42;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

/* References Search & Grid */
.refs-toolbar {
  display: flex;
  flex-direction: column;
  gap: 10px;
  padding: 12px 22px;
  border-bottom: 1px solid var(--glass-border);
}

.refs-search-box {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 7px 14px;
  border-radius: 12px;
  border: 1px solid var(--glass-border);
  background: rgba(15, 23, 42, 0.35);
}

html[data-theme="light"] .refs-search-box {
  background: rgba(15, 23, 42, 0.05);
}

.refs-search-input {
  flex: 1;
  border: none;
  background: transparent;
  color: var(--text-main);
  font-size: 0.86rem;
  outline: none;
}

.refs-cat-bar {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
}

.ref-cat-pill {
  padding: 4px 12px;
  border-radius: 999px;
  border: 1px solid var(--glass-border);
  background: rgba(148, 163, 184, 0.08);
  color: var(--text-soft);
  font-size: 0.76rem;
  font-weight: 700;

}

.ref-cat-pill.is-active {
  border-color: var(--accent);
  background: rgba(56, 189, 248, 0.18);

}

.refs-cards-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  gap: 10px;
}

.ref-item-card {
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  gap: 7px;
  padding: 11px 14px;
  border-radius: 14px;
  border: 1px solid var(--glass-border);
  background: rgba(148, 163, 184, 0.05);
}

.ref-item-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 6px;
}

.ref-item-num {
  font-family: var(--font-mono);
  font-size: 0.75rem;
  font-weight: 700;
  padding: 2px 8px;
  border-radius: 999px;
  background: rgba(16, 185, 129, 0.16);
  color: #34d399;
  direction: ltr;
}

html[data-theme="light"] .ref-item-num { color: #047857; }

.ref-item-cat {
  font-size: 0.75rem;
  color: var(--text-muted);
}

.ref-item-title {
  font-size: 0.82rem;
  font-weight: 600;
  line-height: 1.45;
  unicode-bidi: plaintext;
}

.ref-item-link {
  font-size: 0.76rem;
  font-weight: 700;
  color: var(--accent);
  text-decoration: none;
  align-self: flex-end;
}

.ref-item-link:hover {
  text-decoration: underline;
}

/* Toast Notification (Positioned cleanly below Top HUD, never covering Subtitles!) */
#cinema-toast {
  position: fixed;
  top: 58px;
  left: 50%;
  transform: translateX(-50%) translateY(-8px);
  z-index: 95;
  padding: 7px 18px;
  border-radius: 999px;

  box-shadow: 0 12px 32px rgba(0, 0, 0, 0.45);
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
  white-space: nowrap;
  max-width: 92vw;
  overflow: hidden;
  text-overflow: ellipsis;
  transition: opacity 0.22s ease, transform 0.22s ease, visibility 0.22s ease;
}

#cinema-toast.is-visible {

  transform: translateX(-50%) translateY(0);
}

  global.CinemaSets = {
    applySceneAndState: function (hostEl, sceneId, envState, vars) {
      if (!hostEl) return { sceneChanged: false };
      var currentScene = hostEl.getAttribute("data-scene-id");
      var sceneChanged = currentScene !== sceneId;
      var v = vars || {};

      if (sceneChanged) {
        var builder = SET_BUILDERS[sceneId] || SET_BUILDERS["corridor"];
        hostEl.setAttribute("data-scene-id", sceneId);

        if (!currentScene) {
          // Initial boot: mount directly without exit transition
          hostEl.innerHTML = builder();
        } else {
          // Seamless Dual-Buffer Cross-Dissolve between locations (cap at 1 exiting SVG during rapid jumps)
          var priorExiting = hostEl.querySelectorAll("svg.env-svg.is-exiting");
          for (var p = 0; p < priorExiting.length; p++) {
            if (priorExiting[p].parentNode === hostEl) hostEl.removeChild(priorExiting[p]);
          }
          var oldSvgs = hostEl.querySelectorAll("svg.env-svg:not(.is-exiting)");
          for (var k = 0; k < oldSvgs.length; k++) {
            oldSvgs[k].classList.add("is-exiting");
          }

          var temp = document.createElement("div");
          temp.innerHTML = builder();
          var nextSvg = temp.firstElementChild;
          if (nextSvg) {
            nextSvg.classList.add("is-entering-init", "is-snapping");
            hostEl.appendChild(nextSvg);
          }

          if (_cleanupTimer) clearTimeout(_cleanupTimer);
          _cleanupTimer = setTimeout(function () {
            var stale = hostEl.querySelectorAll("svg.env-svg.is-exiting");
            for (var s = 0; s < stale.length; s++) {
              if (stale[s].parentNode === hostEl) hostEl.removeChild(stale[s]);
            }
          }, 620);
        }
      }

      // Apply continuous CSS custom properties (--scale-tilt, --eco-pan, --tiger-scale)
      hostEl.style.setProperty("--scale-tilt", (v.scaleTilt || 0) + "deg");
      hostEl.style.setProperty("--eco-pan", (v.ecoPan || 0) + "px");
      hostEl.style.setProperty("--tiger-scale", String(v.tigerScale || 1));

      // Activate matching [data-states] groups on the active SVG smoothly in-place!
      hostEl.setAttribute("data-env-state", envState || "");
      var activeSvg = hostEl.querySelector("svg.env-svg:not(.is-exiting)") || hostEl.lastElementChild;
      if (activeSvg) {
        var dynNodes = activeSvg.querySelectorAll("[data-states]");
        for (var i = 0; i < dynNodes.length; i++) {
          var list = (dynNodes[i].getAttribute("data-states") || "").split(/\s+/);
          var active = Boolean(envState && list.indexOf(envState) !== -1);
          dynNodes[i].classList.toggle("is-on", active);
        }

        if (activeSvg.classList.contains("is-entering-init")) {
          void activeSvg.getBoundingClientRect();
          activeSvg.classList.remove("is-entering-init");
          requestAnimationFrame(function () {
            activeSvg.classList.remove("is-snapping");
          });
        }
      }

      return { sceneChanged: sceneChanged };
    }
  };

      if (code >= 0x0660 && code <= 0x0669) {

      } else if (code >= 0x06f0 && code <= 0x06f9) {

  function initAmbientCanvas(canvas) {
    if (!canvas || !canvas.getContext) return { setMood: function () {}, setLight: function () {} };
    var ctx = canvas.getContext("2d");
    if (!ctx) return { setMood: function () {}, setLight: function () {} };

    var w = 1280;
    var h = 720;
    var mood = "morning";
    var isLight = false;
    var pts = [];

    function resize() {
      w = global.innerWidth || 1280;
      h = global.innerHeight || 720;
      canvas.width = w;
      canvas.height = h;
    }

    for (var i = 0; i < 42; i++) {
      pts.push({
        x: Math.random() * 1400,
        y: Math.random() * 900,
        r: 1.1 + Math.random() * 2.1,
        ph: Math.random() * Math.PI * 2,
        alt: i % 2 === 0
      });
    }

    function tick(t) {
      requestAnimationFrame(tick);
      if (document.hidden || document.documentElement.getAttribute("data-project-locked") === "true") return;
      ctx.clearRect(0, 0, w, h);
      var cfg = MOOD_SHADER[mood] || MOOD_SHADER.morning;
      var alphaBase = isLight ? 0.16 : 0.28;

      for (var i = 0; i < pts.length; i++) {
        var p = pts[i];
        p.x += cfg.vx;
        p.y += cfg.vy;
        if (p.x < -10) p.x = w + 10;
        if (p.x > w + 10) p.x = -10;
        if (p.y < -10) p.y = h + 10;
        if (p.y > h + 10) p.y = -10;

        var c = p.alt ? cfg.c1 : cfg.c2;
        var pulse = 0.65 + 0.35 * Math.sin(t * 0.002 + p.ph);
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fillStyle = "rgba(" + c[0] + "," + c[1] + "," + c[2] + "," + (alphaBase * pulse).toFixed(3) + ")";
        ctx.fill();

        if (cfg.links) {
          for (var j = i + 1; j < pts.length; j++) {
            var q = pts[j];
            var dx = p.x - q.x;
            var dy = p.y - q.y;
            var d2 = dx * dx + dy * dy;
            if (d2 < 13500) {
              ctx.beginPath();
              ctx.moveTo(p.x, p.y);
              ctx.lineTo(q.x, q.y);
              ctx.strokeStyle = "rgba(" + cfg.c1[0] + "," + cfg.c1[1] + "," + cfg.c1[2] + "," + ((1 - d2 / 13500) * 0.09).toFixed(3) + ")";
              ctx.lineWidth = 0.75;
              ctx.stroke();
            }
          }
        }
      }
    }

    resize();
    global.addEventListener("resize", resize);
    requestAnimationFrame(tick);

    return {
      setMood: function (m) { mood = m || "morning"; },
      setLight: function (l) { isLight = Boolean(l); }
    };
  }

            slot.whisperEl.classList.remove("is-visible");
          }
          continue;
        }

        var def = global.CinemaActors.CAST_DEFS[id];
        var targetX = typeof cfg.x === "number" ? cfg.x : 50;
        var targetY = typeof cfg.y === "number" ? cfg.y : 5;
        var targetScale = (typeof cfg.scale === "number" ? cfg.scale : 1) * (def.heightScale || 1);
        var isFlipped = Boolean(cfg.flip);

        // If actor wasn't on stage (or scene just changed), place near targetX before enabling transition
        if (!wasPresent || forceEntranceSnap) {
          el.style.transition = "none";
          var entryX = Math.max(8, Math.min(92, targetX + (isFlipped ? 4 : -4)));
          el.style.setProperty("--ax", entryX + "%");
          el.style.setProperty("--ay", targetY + "%");
          el.style.setProperty("--ascale", (targetScale * 0.95).toFixed(3));
          void el.offsetWidth;
          el.style.transition = "";
        } else if (slot.lastX !== null && Math.abs(targetX - slot.lastX) >= 4) {
          // Trigger natural walking stride bob when gliding across the floor!
          el.classList.remove("is-walking");
          void el.offsetWidth;
          el.classList.add("is-walking");
          if (slot.walkTimer) clearTimeout(slot.walkTimer);
          slot.walkTimer = setTimeout((function (node) {
            return function () { node.classList.remove("is-walking"); };
          })(el), 780);
        }

        slot.lastX = targetX;
        el.style.setProperty("--ax", targetX + "%");
        el.style.setProperty("--ay", targetY + "%");
        el.style.setProperty("--ascale", targetScale.toFixed(3));
        el.style.setProperty("--aflip", isFlipped ? "-1" : "1");

        // Eye-gaze tracking (compensating for horizontal mirror flip!)
        var rawLX = cfg.look && typeof cfg.look[0] === "number" ? cfg.look[0] : 0;
        var rawLY = cfg.look && typeof cfg.look[1] === "number" ? cfg.look[1] : 0;
        var compensatedLX = isFlipped ? -rawLX : rawLX;
        el.style.setProperty("--look-x", compensatedLX.toFixed(2) + "px");
        el.style.setProperty("--look-y", rawLY.toFixed(2) + "px");

        el.setAttribute("data-present", "true");
        el.setAttribute("data-depth", cfg.depth || "fore");
        el.setAttribute("data-mood", cfg.mood || "neutral");
        el.setAttribute("data-posture", cfg.posture || "neutral");
        el.setAttribute("data-arms", cfg.arms || "relaxed");
        el.setAttribute("data-edge", targetX < 24 ? "left" : (targetX > 76 ? "right" : "center"));

        // Contextual Nameplate & Role
        slot.nameEl.textContent = toWesternDigits(cfg.label || def.name);
        slot.roleEl.textContent = toWesternDigits(cfg.role || def.role);

        // Speech / Thought Whisper
        if (cfg.whisper) {
          slot.whisperEl.textContent = toWesternDigits(cfg.whisper);
          slot.whisperEl.setAttribute("data-tone", cfg.wTone || "normal");
          slot.whisperEl.setAttribute("data-w-tier", "low");
          slot.whisperEl.classList.add("is-visible");
        } else {
          slot.whisperEl.setAttribute("data-w-tier", "low");
          slot.whisperEl.classList.remove("is-visible");
        }
      }

      // Stagger adjacent visible whispers vertically on narrow portrait viewports so speech bubbles never collide
      var visWhispers = [];
      for (var wIdx = 0; wIdx < ids.length; wIdx++) {
        var wId = ids[wIdx];
        var wCfg = activeMap[wId];
        var wSlot = this.actorPool[wId];
        if (wCfg && wCfg.whisper && wSlot) {
          visWhispers.push({ x: typeof wCfg.x === "number" ? wCfg.x : 50, el: wSlot.whisperEl });
        }
      }
      visWhispers.sort(function (a, b) { return a.x - b.x; });
      for (var v = 1; v < visWhispers.length; v++) {
        var prevTier = visWhispers[v - 1].el.getAttribute("data-w-tier");
        if (visWhispers[v].x - visWhispers[v - 1].x < 40 && prevTier !== "high") {
          visWhispers[v].el.setAttribute("data-w-tier", "high");
        }
      }
    },

    /* ----------------------------------------------------------------------
       HUD, Intra-Scene Dots & Timeline Synchronization
       ---------------------------------------------------------------------- */
    _syncHUD: function (beat, idx) {
      var total = this.beats.length;
      var sIdx = beat.sceneIndex || 1;

      if (this._els.sceneNum) {
        this._els.sceneNum.textContent = sIdx + " / " + this.scenes.length;
      }
      if (this._els.sceneTitle) {
        this._els.sceneTitle.textContent = toWesternDigits(beat.sceneTitle || "");
      }
      if (this._els.counter) {
        this._els.counter.textContent = (idx + 1) + " / " + total;
      }
      if (this._els.timelineFill) {
        var pct = total <= 1 ? 100 : ((idx + 1) / total) * 100;
        this._els.timelineFill.style.width = pct.toFixed(2) + "%";
      }
      if (this._els.btnPrev) this._els.btnPrev.disabled = idx <= 0;
      if (this._els.btnNext) this._els.btnNext.disabled = idx >= total - 1;

      // Render Intra-Scene Choreography Dots (shows exact progress inside current scene!)
      var curSceneObj = null;
      for (var s = 0; s < this.scenes.length; s++) {
        if (this.scenes[s].sceneIndex === sIdx) {
          curSceneObj = this.scenes[s];
          break;
        }
      }
      if (curSceneObj && this._els.intraDots) {
        var activeLocalStep = 1;
        this._els.intraDots.innerHTML = curSceneObj.beatIndices.map(function (bIndex, localStep) {
          var cls = "intra-dot";
          if (bIndex === idx) {
            cls += " is-active";
            activeLocalStep = localStep + 1;
          } else if (bIndex < idx) {
            cls += " is-done";
          }
          return (
            '<button type="button" class="' + cls + '" data-goto="' + bIndex + '" ' +
            'title="التغيير ' + (localStep + 1) + ' من ' + curSceneObj.beatIndices.length + ' داخل هذا المشهد" ' +
            'aria-label="التغيير ' + (localStep + 1) + '"></button>'
          );
        }).join("");
        if (this._els.intraCount) {
          this._els.intraCount.textContent = activeLocalStep + "/" + curSceneObj.beatIndices.length;
        }
      }

      // Update timeline scene markers
      var markers = this._els.timelineMarkers ? this._els.timelineMarkers.querySelectorAll(".scene-marker") : [];
      for (var m = 0; m < markers.length; m++) {
        var mScene = parseInt(markers[m].getAttribute("data-scene-marker"), 10);
        var mStart = parseInt(markers[m].getAttribute("data-goto"), 10);
        markers[m].classList.toggle("is-current", mScene === sIdx);
        markers[m].classList.toggle("is-reached", idx >= mStart);
      }

      // Highlight active card in drawer
      var cards = this._els.drawerBody ? this._els.drawerBody.querySelectorAll(".beat-jump-card") : [];
      for (var c = 0; c < cards.length; c++) {
        cards[c].classList.toggle("is-current", parseInt(cards[c].getAttribute("data-beat-card"), 10) === idx);
      }
    },

    /* ----------------------------------------------------------------------
       Public Navigation & Controls API
       ---------------------------------------------------------------------- */
    goTo: function (targetIdx, opts) {
      var o = opts || {};
      var total = this.beats.length;
      if (!total) return false;
      var clamped = Math.max(0, Math.min(total - 1, targetIdx));
      if (clamped === this.currentIndex && !o.force) return false;

      var prevBeat = this.beats[this.currentIndex] || null;
      this.currentIndex = clamped;
      this._applyBeat(clamped, prevBeat, Boolean(o.silent));

      if (this.autoPlaying) {
        this._scheduleAuto();
      }
      return true;
    },

    next: function () {
      if (this.currentIndex >= this.beats.length - 1) return false;
      return this.goTo(this.currentIndex + 1);
    },

    prev: function () {
      if (this.currentIndex <= 0) {
        this.showToast(
          this.arrowReversed
            ? "💡 أنت في بداية الفيلم — اضغط السهم الأيسر (←) للمتابعة"
            : "💡 أنت في بداية الفيلم — اضغط السهم الأيمن (→) أو المسافة للمتابعة"
        );
        return false;
      }
      return this.goTo(this.currentIndex - 1);
    },

    nextScene: function () {
      var curS = this.beats[this.currentIndex].sceneIndex;
      for (var i = 0; i < this.scenes.length; i++) {
        if (this.scenes[i].sceneIndex > curS) {
          this.goTo(this.scenes[i].firstBeatIdx);
          this.showToast("🎬 المشهد " + this.scenes[i].sceneIndex + ": " + this.scenes[i].title);
          return true;
        }
      }
      return false;
    },

    prevScene: function () {
      var curS = this.beats[this.currentIndex].sceneIndex;
      var curObj = this.scenes[curS - 1];
      if (curObj && this.currentIndex > curObj.firstBeatIdx) {
        this.goTo(curObj.firstBeatIdx);
        return true;
      }
      if (curS > 1) {
        var prevObj = this.scenes[curS - 2];
        this.goTo(prevObj.firstBeatIdx);
        this.showToast("🎬 المشهد " + prevObj.sceneIndex + ": " + prevObj.title);
        return true;
      }
      return false;
    },

    toggleTheme: function () {
      this.theme = this.theme === "dark" ? "light" : "dark";
      this._els.app.setAttribute("data-theme", this.theme);
      document.documentElement.setAttribute("data-theme", this.theme);
      if (this._els.themeIcon) {
        this._els.themeIcon.textContent = this.theme === "light" ? "🌙" : "☀️";
      }
      if (this._shader) this._shader.setLight(this.theme === "light");
      FoleyAudio.play("ping");
      this.showToast(this.theme === "light" ? "☀️ ثيم الاستوديو النهاري العاجي" : "🌙 ثيم السينما الليلي المخملي");
    },

    toggleSound: function () {
      FoleyAudio.enabled = !FoleyAudio.enabled;
      var btn = this._els.app.querySelector('[data-ctrl="sound"]');
      if (btn) {
        btn.classList.toggle("is-active", FoleyAudio.enabled);
        btn.setAttribute("aria-pressed", FoleyAudio.enabled ? "true" : "false");
      }
      if (this._els.soundIcon) {
        this._els.soundIcon.textContent = FoleyAudio.enabled ? "🔊" : "🔇";
      }
      if (FoleyAudio.enabled) FoleyAudio.play("ping");
      this.showToast(FoleyAudio.enabled ? "🔊 المؤثرات الصوتية السينمائية مفعّلة" : "🔇 تم كتم الصوت");
    },

    togglePolarity: function () {
      this.arrowReversed = !this.arrowReversed;
      this._els.app.setAttribute("data-rtl-nav", this.arrowReversed ? "true" : "false");
      var btn = this._els.app.querySelector('[data-ctrl="polarity"]');
      if (btn) {
        btn.classList.toggle("is-active", this.arrowReversed);
        btn.setAttribute("aria-pressed", this.arrowReversed ? "true" : "false");
      }
      FoleyAudio.play("ping");

    (function () {

  /* ------------------------------------------------------------------------

  function escXml(str) {
    return String(str == null ? '' : str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  var autoUidCounter = 0;
  function sanitizeUid(uid) {
    if (uid != null && String(uid).trim() !== '') {
      var cleaned = String(uid).replace(/[^a-zA-Z0-9_-]/g, '');
      if (cleaned.length > 0) return cleaned;
    }
    autoUidCounter = (autoUidCounter + 1) % 999999;
    return 'psv2u' + autoUidCounter;
  }

  function parseHex6(hex, fallback) {
    var fb = fallback || '#888888';
    if (typeof hex !== 'string') return fb;
    var s = hex.trim();
    if (/^#[0-9a-fA-F]{6}$/.test(s)) return s;
    if (/^#[0-9a-fA-F]{3}$/.test(s)) {
      return '#' + s[1] + s[1] + s[2] + s[2] + s[3] + s[3];
    }
    return fb;
  }

  function keepValidColor(val, fallback) {
    if (typeof val === 'string') {
      var t = val.trim();
      if (/^#[0-9a-fA-F]{3,8}$/.test(t) || /^(rgb|hsl)a?\([^)]+\)$/.test(t)) {
        return t;
      }
    }
    return fallback;
  }

  function mixHex(hexA, hexB, weightB) {
    var a = parseHex6(hexA, '#888888');
    var b = parseHex6(hexB, '#221D1A');
    var w = Number(weightB);
    if (isNaN(w)) w = 0.5;
    if (w < 0) w = 0;
    if (w > 1) w = 1;
    var r1 = parseInt(a.slice(1, 3), 16);
    var g1 = parseInt(a.slice(3, 5), 16);
    var b1 = parseInt(a.slice(5, 7), 16);
    var r2 = parseInt(b.slice(1, 3), 16);
    var g2 = parseInt(b.slice(3, 5), 16);
    var b2 = parseInt(b.slice(5, 7), 16);
    var r = Math.round(r1 * (1 - w) + r2 * w);
    var g = Math.round(g1 * (1 - w) + g2 * w);
    var bl = Math.round(b1 * (1 - w) + b2 * w);
    return '#' + ((1 << 24) + (r << 16) + (g << 8) + bl).toString(16).slice(1).toUpperCase();
  }

  function makePaletteContext(charDef, spec) {
    var uid = sanitizeUid(spec && spec.uid);
    var primary = keepValidColor(spec && spec.primary, charDef.defaultPrimary);
    var secondary = keepValidColor(spec && spec.secondary, charDef.defaultSecondary);
    var skin = keepValidColor(spec && spec.skin, charDef.defaultSkin);
    var ink = keepValidColor(spec && spec.ink, '#221D1A');
    var mood = (spec && VALID_MOODS[spec.mood]) ? spec.mood : charDef.defaultMood;
    if (!VALID_MOODS[mood]) mood = 'neutral';

    return {
      uid: uid,
      primary: primary,
      secondary: secondary,
      skin: skin,
      ink: ink,
      mood: mood,
      pDark: mixHex(primary, '#161210', 0.24),
      pDeep: mixHex(primary, '#161210', 0.42),
      pLight: mixHex(primary, '#FFFDF9', 0.34),
      pSoft: mixHex(primary, '#FAF6EE', 0.72),
      sDark: mixHex(secondary, '#221D1A', 0.18),
      sDeep: mixHex(secondary, '#221D1A', 0.36),
      sLight: mixHex(secondary, '#FFFFFF', 0.45),

  }

  }

      }
      var req = global.indexedDB.open("PresentationStudioDB", 1);
      req.onupgradeneeded = function (e) {
        var db = e.target.result;
        if (!db.objectStoreNames.contains("states")) {
          db.createObjectStore("states");
        }
      };
      req.onsuccess = function (e) {
        try {
          var db = e.target.result;
          if (!db.objectStoreNames.contains("states")) {
            callback(null);
            return;
          }
          var getReq = db.transaction("states", "readonly").objectStore("states").get(key);
          getReq.onsuccess = function () {
            callback(getReq.result || null);
          };
          getReq.onerror = function () {
            callback(null);
          };
        } catch (err) {
          callback(null);
        }
      };
      req.onerror = function () {
        callback(null);
      };
    } catch (e) {
      callback(null);
    }
  }

  function idbClear(key) {
    try {
      if (!global.indexedDB) return;
      var req = global.indexedDB.open("PresentationStudioDB", 1);
      req.onsuccess = function (e) {
        var db = e.target.result;
        if (db.objectStoreNames.contains("states")) {
          db.transaction("states", "readwrite").objectStore("states").delete(key);
        }
      };
    } catch (e) {}
  }

  function optimizeUploadedImageFile(file, callback) {
    var reader = new FileReader();
    reader.onload = function () {
      var rawDataUrl = String(reader.result || "");
      if (!rawDataUrl || String(file.type || "").indexOf("svg") !== -1) {
        callback(rawDataUrl);
        return;
      }
      var img = new Image();
      img.onload = function () {
        var maxDim = 1150;
        var w = img.naturalWidth || img.width || 0;
        var h = img.naturalHeight || img.height || 0;
        if (w > 0 && h > 0 && (w > maxDim || h > maxDim || file.size > 340 * 1024)) {
          var ratio = Math.min(1, maxDim / Math.max(w, h));
          var cw = Math.max(1, Math.round(w * ratio));
          var ch = Math.max(1, Math.round(h * ratio));
          try {
            var canvas = document.createElement("canvas");
            canvas.width = cw;
            canvas.height = ch;
            var ctx = canvas.getContext("2d");
            ctx.drawImage(img, 0, 0, cw, ch);
            var webp = canvas.toDataURL("image/webp", 0.86);
            if (webp && webp.indexOf("data:image/webp") === 0 && webp.length < rawDataUrl.length) {
              callback(webp);
              return;
            }
            var png = canvas.toDataURL("image/png");
            if (png && png.length < rawDataUrl.length) {
              callback(png);
              return;
            }
          } catch (err) {}
        }
        callback(rawDataUrl);
      };
      img.onerror = function () {
        callback(rawDataUrl);
      };
      img.src = rawDataUrl;
    };
    reader.readAsDataURL(file);
  }

  /* ==========================================================================

  function createStudio() {
    injectMotionAndStudioStyles();

    var adapter = null;
    var exportScopeId = (BAKED_PAYLOAD && BAKED_PAYLOAD.exportId) ? BAKED_PAYLOAD.exportId : "origin";
    var storageKey = getStorageKeyV2(exportScopeId);
    var legacyStorageKey = getLegacyStorageKeyV1(exportScopeId);

    var studioState = {
      version: 2,
      exportId: exportScopeId,
      readonly: Boolean(BAKED_PAYLOAD && BAKED_PAYLOAD.readonly),
      savedAt: 0,
      globalTheme: {
        paletteId: "",

        googleFont: "",

    var editMode = false;

    var undoStack = [];
    var redoStack = [];

    var activeThemeModalTab = "slide";

    function ensurePageRecord(pageUid) {
      if (!studioState.pages[pageUid]) {
        studioState.pages[pageUid] = {
          background: { presetId: "", customColor: "", customImage: "", patternOpacity: 100 },
          textOverrides: {},
          frames: [],
          shapes: [],
          addedChars: [],
          nativeCharOverrides: {}
        };
      } else {
        var pr = studioState.pages[pageUid];
        if (!pr.background) pr.background = { presetId: "", customColor: "", customImage: "", patternOpacity: 100 };
        if (!pr.textOverrides) pr.textOverrides = {};
        if (!Array.isArray(pr.frames)) pr.frames = [];
        if (!Array.isArray(pr.shapes)) pr.shapes = [];
        if (!Array.isArray(pr.addedChars)) pr.addedChars = [];
        if (!pr.nativeCharOverrides) pr.nativeCharOverrides = {};
      }
      return studioState.pages[pageUid];
    }

    function registerUsedGoogleFont(fontObjOrName) {
      if (!fontObjOrName) return;
      ensureGoogleFontLoaded(fontObjOrName);
      var gfName = typeof fontObjOrName === "object"
        ? (fontObjOrName.googleFamily || fontObjOrName.name || "")
        : String(fontObjOrName).split(",")[0].replace(/['"]/g, "").trim();
      if (gfName && studioState.customFonts.indexOf(gfName) === -1) {
        studioState.customFonts.push(gfName);
      }
    }

    function hydrateSavedGoogleFonts() {
      if (Array.isArray(studioState.customFonts)) {
        for (var i = 0; i < studioState.customFonts.length; i++) {
          ensureGoogleFontLoaded(studioState.customFonts[i]);
        }
      }
      if (studioState.globalTheme && studioState.globalTheme.googleFont) {
        ensureGoogleFontLoaded(studioState.globalTheme.googleFont);
      }
    }

    function captureHistorySnapshot() {
      return deepClone({
        globalTheme: studioState.globalTheme,
        customFonts: studioState.customFonts,
        pageOrder: studioState.pageOrder,
        customPages: studioState.customPages,
        pages: studioState.pages
      });
    }

    function pushUndoSnapshot() {
      undoStack.push(captureHistorySnapshot());
      if (undoStack.length > 50) undoStack.shift();
      redoStack = [];
      syncDockState();
    }

    function restoreFromHistorySnapshot(snap) {
      var curUid = adapter.getCurrentPageUid();
      studioState.globalTheme = snap.globalTheme || { paletteId: "", fontFamily: "", googleFont: "", fontScalePct: 100, transition: "" };
      studioState.customFonts = snap.customFonts || [];
      studioState.pageOrder = snap.pageOrder;
      studioState.customPages = snap.customPages || {};
      studioState.pages = snap.pages || {};
      activeTextUndoKey = null;
      clearSelection();
      hydrateSavedGoogleFonts();
      resetPersistentModifiedElements();
      adapter.hydrateModelTexts(studioState.pages);
      var nextIdx = studioState.pageOrder.indexOf(curUid);
      adapter.rebuildPages(studioState.pageOrder, studioState.customPages, nextIdx >= 0 ? nextIdx : 0);
      applyGlobalThemeOverrides();
      applyAllStageOverrides();
      scheduleAutoSave();
      syncDockState();
    }

    function performUndo() {
      if (!undoStack.length) return;
      redoStack.push(captureHistorySnapshot());
      if (redoStack.length > 50) redoStack.shift();
      var prev = undoStack.pop();
      restoreFromHistorySnapshot(prev);
      showToast("تم التراجع عن الخطوة ↶ (" + undoStack.length + ")");
    }

    function performRedo() {
      if (!redoStack.length) return;
      undoStack.push(captureHistorySnapshot());
      if (undoStack.length > 50) undoStack.shift();
      var next = redoStack.pop();
      restoreFromHistorySnapshot(next);
      showToast("تمت إعادة الخطوة ↷ (" + redoStack.length + ")");
    }

    function applyLoadedStateObject(loaded) {
      if (!loaded || typeof loaded !== "object") return;
      if (Array.isArray(loaded.pageOrder) && loaded.pageOrder.length) {
        studioState.pageOrder = loaded.pageOrder.slice();
      }
      studioState.customPages = loaded.customPages || {};
      studioState.pages = loaded.pages || {};
      if (loaded.globalTheme) {
        studioState.globalTheme = Object.assign({
          paletteId: "", fontFamily: "", googleFont: "", fontScalePct: 100, transition: ""
        }, loaded.globalTheme);
      }
      if (Array.isArray(loaded.customFonts)) {
        studioState.customFonts = loaded.customFonts.slice();
      }
      studioState.savedAt = loaded.savedAt || Date.now();
      hasSavedEdits = true;
      hydrateSavedGoogleFonts();
    }

    function loadInitialState(initialOrder) {
      studioState.pageOrder = initialOrder.slice();
      var loaded = null;

      if (BAKED_PAYLOAD && BAKED_PAYLOAD.state) {
        loaded = deepClone(BAKED_PAYLOAD.state);
      }

      try {
        if (global.localStorage) {
          var rawV2 = global.localStorage.getItem(storageKey);
          var rawV1 = global.localStorage.getItem(legacyStorageKey);
          var candV2 = rawV2 ? JSON.parse(rawV2) : null;
          var candV1 = rawV1 ? JSON.parse(rawV1) : null;
          var bestLocal = candV2;
          if (candV1 && (!bestLocal || (candV1.savedAt || 0) > (bestLocal.savedAt || 0))) {
            bestLocal = candV1;
          }
          if (bestLocal && (!loaded || (bestLocal.savedAt || 0) >= (loaded.savedAt || 0))) {
            loaded = bestLocal;
          }
        }
      } catch (e) {}

      if (loaded) {
        applyLoadedStateObject(loaded);
      }
    }

    function saveNow(showNotification) {
      studioState.savedAt = Date.now();
      hasSavedEdits = true;
      var serialized = JSON.stringify(studioState);
      var savedOk = false;
      try {
        if (global.localStorage) {
          global.localStorage.setItem(storageKey, serialized);
          savedOk = true;
        }
      } catch (e) {}
      idbSave(storageKey, studioState);
      updateEntryBadge();
      if (showNotification) {
        showToast(savedOk ? "تم حفظ جميع التغييرات محلياً ✓" : "تم حفظ التغييرات في قاعدة المتصفح ✓");
      }
      return savedOk;
    }

    function scheduleAutoSave() {
      if (autoSaveTimer) clearTimeout(autoSaveTimer);
      autoSaveTimer = setTimeout(function () {
        saveNow(false);
      }, 320);
    }

    function resetAllChanges() {
      try {
        if (global.localStorage) {
          global.localStorage.removeItem(storageKey);
          global.localStorage.removeItem(legacyStorageKey);
        }
      } catch (e) {}
      idbClear(storageKey);
      idbClear(legacyStorageKey);
      undoStack = [];
      redoStack = [];
      activeTextUndoKey = null;
      studioState.savedAt = 0;
      studioState.globalTheme = { paletteId: "", fontFamily: "", googleFont: "", fontScalePct: 100, transition: "" };
      studioState.customFonts = [];
      studioState.pageOrder = adapter.initialOrder.slice();
      studioState.customPages = {};
      studioState.pages = {};
      hasSavedEdits = false;
      clearSelection();
      resetPersistentModifiedElements();
      adapter.hydrateModelTexts(studioState.pages);
      adapter.rebuildPages(studioState.pageOrder, studioState.customPages, 0);
      applyGlobalThemeOverrides();
      applyAllStageOverrides();
      updateEntryBadge();
      closeModal();
      showToast("تمت استعادة النسخة الأصلية للعرض ✓");
    }

    function copySelectedElement() {
      if (!selection) {
        showToast("حدّد عنصراً أولاً لنسخه");

      }
      var model = getSelectedModel();
      if (!model) return false;

      if (selection.kind === "frame" || selection.kind === "shape" || selection.kind === "addedChar") {

        showToast("تم نسخ العنصر — انتقل لأي شريحة واضغط Ctrl+V للصقه ✓");
        return true;
      }

      if (selection.kind === "text" || selection.kind === "svgText") {
        var txtContent = selection.el ? extractEditableText(selection.el) : (model.text || "");
        var compFs = selection.el ? (parseFloat(getComputedStyle(selection.el).fontSize) || 16) : 16;
        studioClipboard = {
          kind: "frame",
          data: {
            id: genUid("frame"),
            templateId: "editorial",
            style: "editorial",
            bg: model.bgColor || "#FFFDF9",
            fg: model.color || "#231F1D",

            borderWidth: typeof model.borderWidth === "number" ? model.borderWidth : 2,
            borderStyle: "solid",
            radius: 14,
            tail: "none",

            text: txtContent,
            fontFamily: model.fontFamily || "",
            fontSize: clamp(Math.round(compFs), 12, 48),
            fontWeight: model.fontWeight || "700",
            textAlign: model.textAlign || "right",
            x: 50,
            y: 50,
            width: 300,

    function pasteClipboardElement() {
      if (!studioClipboard || !studioClipboard.data) {
        showToast("الحافظة فارغة — انسخ عنصراً أولاً (Ctrl+C)");
        return false;
      }
      pushUndoSnapshot();
      var pageUid = adapter.getCurrentPageUid();
      var pageRec = ensurePageRecord(pageUid);
      var copy = deepClone(studioClipboard.data);
      copy.locked = false;
      copy.x = clamp((typeof copy.x === "number" ? copy.x : 50) + 4, 12, 88);
      copy.y = clamp((typeof copy.y === "number" ? copy.y : 50) + 4, 14, 86);

      if (studioClipboard.kind === "frame") {
        copy.id = genUid("frame");
        copy.z = 50 + pageRec.frames.length;
        pageRec.frames.push(copy);
        applyAllStageOverrides();
        var fEl = document.querySelector('.ps-frame-item[data-ps-frame-id="' + copy.id + '"]');
        if (fEl) selectItem({ kind: "frame", pageUid: pageUid, id: copy.id, el: fEl });
      } else if (studioClipboard.kind === "shape") {
        copy.id = genUid("shape");
        copy.z = 50 + pageRec.shapes.length;
        pageRec.shapes.push(copy);
        applyAllStageOverrides();

        if (sEl) selectItem({ kind: "shape", pageUid: pageUid, id: copy.id, el: sEl });

      showToast("تم لصق العنصر في الشريحة الحالية ✓");
      return true;
