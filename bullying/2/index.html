    /* ----------------------------------------------------------------------
       15. POINTER DRAGGING, ROTATION, RESIZING, INLINE EDITING & SHORTCUTS
       ---------------------------------------------------------------------- */
    var dragSession = null;
    var pinchSession = null;
    var activeTextUndoKey = null;

    function ensureTextUndoSnapshotOnce(sessionKey) {
      if (activeTextUndoKey !== sessionKey) {
        pushUndoSnapshot();
        activeTextUndoKey = sessionKey;
      }
    }

    function startMoveSessionForSelection(clientX, clientY) {
      if (!selection || !selection.el) return;
      var m = getSelectedModel();
      if (!m || m.locked) {
        if (m && m.locked) showToast("🔒 العنصر مقفول — افتح القفل لتحريكه");
        return;
      }
      pushUndoSnapshot();

      if (selection.kind === "frame" || selection.kind === "shape" || selection.kind === "addedChar") {
        var host = (selection.el.parentElement && selection.el.parentElement.parentElement) ? selection.el.parentElement.parentElement : document.body;
        dragSession = {
          mode: "moveOverlayPct",
          startX: clientX,
          startY: clientY,
          origX: typeof m.x === "number" ? m.x : 50,
          origY: typeof m.y === "number" ? m.y : 50,
          hostRect: host.getBoundingClientRect()
        };
        return;
      }

      if (selection.kind === "svgText" || (selection.kind === "nativeChar" && selection.el.getAttribute("data-ps-native-char") === "svg")) {
        var svgEl = selection.el.ownerSVGElement;
        var vb = (svgEl && svgEl.viewBox && svgEl.viewBox.baseVal && svgEl.viewBox.baseVal.width)
          ? svgEl.viewBox.baseVal
          : { width: 500, height: 370 };
        dragSession = {
          mode: selection.kind === "svgText" ? "moveSvgText" : "moveNativeSvg",
          startX: clientX,
          startY: clientY,
          origDx: m.dx || 0,
          origDy: m.dy || 0,
          vbWidth: vb.width,
          vbHeight: vb.height,
          hostRect: (svgEl || document.body).getBoundingClientRect()
        };
        return;
      }

      /* HTML nativeChar or native HTML text */
      var targets = adapter.getStageTargets();
      var refHost = selection.el.offsetParent || document.body;
      for (var t = 0; t < targets.length; t++) {
        if (targets[t].pageUid === selection.pageUid && targets[t].overlayHost) {
          refHost = targets[t].overlayHost;
          break;
        }
      }
      dragSession = {
        mode: selection.kind === "text" ? "moveNativeText" : "moveNativeHtml",
        startX: clientX,
        startY: clientY,
        origDxPct: m.dxPct || 0,
        origDyPct: m.dyPct || 0,
        refHost: refHost,
        hostRect: refHost.getBoundingClientRect()
      };
    }

    function bindGlobalInteractions() {
      var ctxColorUndoArmed = false;

      rootEl.addEventListener("pointerdown", function (e) {
        if (e.target && e.target.getAttribute) {
          var ca = e.target.getAttribute("data-ctx-act");
          var cc = e.target.getAttribute("data-ctx-color");
          if (ca === "scale-slider" || cc) {
            pushUndoSnapshot();
            ctxColorUndoArmed = true;
          }
        }
        if (e.target !== ui.moveHandle && e.target !== ui.rotateKnob && e.target !== ui.resizeKnob) {
          e.stopPropagation();
        }
      });

      rootEl.addEventListener("wheel", function (e) {
        e.stopPropagation();
      }, { passive: true });

      ui.entryPill.addEventListener("click", function (e) {
        e.preventDefault();
        e.stopPropagation();
        setEditMode(true);
      });

      ui.dock.addEventListener("click", function (e) {
        var btn = e.target.closest("[data-ps-act]");
        if (!btn) return;
        e.preventDefault();
        e.stopPropagation();
        var act = btn.getAttribute("data-ps-act");
        if (act === "open-frames") openFramesModal();
        else if (act === "open-chars") renderCharsModal();
        else if (act === "open-motion") openMotionModal();
        else if (act === "open-theme") openThemeModal();
        else if (act === "open-layers") openLayersModal();
        else if (act === "open-pages") renderPagesModal();
        else if (act === "undo") performUndo();
        else if (act === "redo") performRedo();
        else if (act === "paste") pasteClipboardElement();
        else if (act === "save") saveNow(true);
        else if (act === "download") downloadStandaloneHtml({ readonly: false });
        else if (act === "open-more") openMoreModal();
        else if (act === "exit-edit") setEditMode(false);
      });

      ui.ctxBar.addEventListener("click", function (e) {
        var btn = e.target.closest("[data-ctx-act]");
        if (!btn || !selection) return;
        e.preventDefault();
        e.stopPropagation();
        var act = btn.getAttribute("data-ctx-act");
        var model = getSelectedModel();
        if (!model) return;

        if (act === "open-inspector") openInspectorModal();
        else if (act === "open-motion") openMotionModal();
        else if (act === "trigger-native-btn") triggerSelectedInteractiveButton();
        else if (act === "toggle-lock") {
          pushUndoSnapshot();
          model.locked = !model.locked;
          applyAllStageOverrides();
          renderContextBar();
          syncSelectionRing();
          scheduleAutoSave();
        } else if (act === "copy-el") {
          copySelectedElement();
        } else if (act === "z-front") {
          adjustSelectedLayerZ(5);
        } else if (act === "z-back") {
          adjustSelectedLayerZ(-5);
        } else if (act === "scale-up") {
          scaleSelectedItem((model.scale || 1) + 0.15, true);
        } else if (act === "scale-down") {
          scaleSelectedItem((model.scale || 1) - 0.15, true);
        } else if (act === "flip") {
          pushUndoSnapshot();
          if (selection.kind === "shape") model.flipX = !model.flipX;
          else model.flip = !model.flip;
          applyAllStageOverrides();
          scheduleAutoSave();
        } else if (act === "flip-y") {
          pushUndoSnapshot();
          model.flipY = !model.flipY;
          applyAllStageOverrides();
          scheduleAutoSave();
        } else if (act === "reset-native") {
          pushUndoSnapshot();
          var nPage = ensurePageRecord(selection.pageUid);
          delete nPage.nativeCharOverrides[selection.id];
          applyAllStageOverrides();
          renderContextBar();
          scheduleAutoSave();
          showToast("تمت إعادة العنصر الأصلي لوضعه الافتراضي ✓");
        } else if (act === "frame-tail") {
          pushUndoSnapshot();
          var curTail = resolveFrameVisualDefaults(model).tail || "none";
          var tIdx = 0;
          for (var ti = 0; ti < BUBBLE_TAILS.length; ti++) {
            if (BUBBLE_TAILS[ti].id === curTail) { tIdx = ti; break; }
          }
          model.tail = BUBBLE_TAILS[(tIdx + 1) % BUBBLE_TAILS.length].id;
          applyAllStageOverrides();
          scheduleAutoSave();
        } else if (act === "frame-wider") {
          pushUndoSnapshot();
          model.width = clamp((model.width || 290) + 32, 120, 780);
          applyAllStageOverrides();
          scheduleAutoSave();
        } else if (act === "frame-narrower") {
          pushUndoSnapshot();
          model.width = clamp((model.width || 290) - 32, 120, 780);
          applyAllStageOverrides();
          scheduleAutoSave();
        } else if (act === "frame-font-up") {
          pushUndoSnapshot();
          model.fontSize = clamp((model.fontSize || 18) + 2, 10, 72);
          applyAllStageOverrides();
          scheduleAutoSave();
        } else if (act === "frame-font-down") {
          pushUndoSnapshot();
          model.fontSize = clamp((model.fontSize || 18) - 2, 10, 72);
          applyAllStageOverrides();
          scheduleAutoSave();
        } else if (act === "text-bigger" || act === "text-smaller") {
          pushUndoSnapshot();
          var curPx = parseInt(model.fontSize, 10) || (selection.el ? (parseFloat(getComputedStyle(selection.el).fontSize) || 16) : 16);
          var nextPx = clamp(Math.round(curPx + (act === "text-bigger" ? 2 : -2)), 10, 96);
          model.fontSize = nextPx + "px";
          applyAllStageOverrides();
          scheduleAutoSave();
        } else if (act === "text-bold") {
          pushUndoSnapshot();
          model.fontWeight = model.fontWeight === "800" ? "400" : "800";
          applyAllStageOverrides();
          renderContextBar();
          scheduleAutoSave();
        } else if (act === "text-italic") {
          pushUndoSnapshot();
          model.fontStyle = model.fontStyle === "italic" ? "normal" : "italic";
          applyAllStageOverrides();
          renderContextBar();
          scheduleAutoSave();
        } else if (act === "text-underline") {
          pushUndoSnapshot();
          model.textDecoration = model.textDecoration === "underline" ? "none" : "underline";
          applyAllStageOverrides();
          renderContextBar();
          scheduleAutoSave();
        } else if (act === "text-align") {
          pushUndoSnapshot();
          var aligns = ["right", "center", "left"];
          model.textAlign = aligns[(aligns.indexOf(model.textAlign || "right") + 1) % aligns.length];
          applyAllStageOverrides();
          scheduleAutoSave();
        } else if (act === "clone-as-frame") {
          cloneSelectedTextAsFrame();
        } else if (act === "reset-text") {
          pushUndoSnapshot();
          var tPage = ensurePageRecord(selection.pageUid);
          delete tPage.textOverrides[selection.id];
          adapter.hydrateModelTexts(studioState.pages);
          applyAllStageOverrides();
          renderContextBar();
          scheduleAutoSave();
          showToast("تمت استعادة النص الأصلي وتنسيقه ✓");
        } else if (act === "del-item") {
          deleteSelectedItem();
        }
      });

      ui.ctxBar.addEventListener("input", function (e) {
        if (!selection || !e.target) return;
        var model = getSelectedModel();
        if (!model) return;

        if (e.target.id === "ps-ctx-svg-input" && selection.kind === "svgText") {
          ensureTextUndoSnapshotOnce("svgtxt::" + selection.pageUid + "::" + selection.id);
          model.text = e.target.value;
          model.hidden = false;
          if (selection.el) applySvgTextOverride(selection.el, model);
          syncSelectionRing();
          scheduleAutoSave();
          return;
        }

        if (e.target.getAttribute("data-ctx-act") === "scale-slider") {
          var val = parseInt(e.target.value, 10) || 100;
          scaleSelectedItem(val / 100, false);
          return;
        }

        var cKind = e.target.getAttribute("data-ctx-color");
        if (cKind) {
          if (!ctxColorUndoArmed) { pushUndoSnapshot(); ctxColorUndoArmed = true; }
          var hex = e.target.value;
          if (cKind === "char-primary") model.primaryColor = hex;
          else if (cKind === "char-secondary") model.secondaryColor = hex;
          else if (cKind === "char-skin") model.skinColor = hex;
          else if (cKind === "shape-fill") model.fill = hex;
          else if (cKind === "shape-stroke") model.stroke = hex;
          else if (cKind === "frame-bg") model.bg = hex;
          else if (cKind === "frame-fg") model.fg = hex;
          else if (cKind === "frame-bd") model.borderColor = hex;
          else if (cKind === "text-fg") model.color = hex;
          else if (cKind === "text-bg") model.bgColor = hex;
          applyAllStageOverrides();
          scheduleAutoSave();
        }
      });

      ui.ctxBar.addEventListener("change", function (e) {
        ctxColorUndoArmed = false;
        if (e.target && e.target.getAttribute("data-ctx-act") === "char-mood" && selection) {
          var m = getSelectedModel();
          if (m) {
            pushUndoSnapshot();
            m.mood = e.target.value;
            applyAllStageOverrides();
            scheduleAutoSave();
          }
        }
      });

      ui.modalHost.addEventListener("click", function (e) {
        if (e.target === ui.modalHost || e.target.closest("[data-ps-close-modal]")) {
          closeModal();
          return;
        }

        /* Frames & Shapes tabs/items */
        var fTab = e.target.closest("[data-frame-tab]");
        if (fTab) {
          activeFrameModalTab = fTab.getAttribute("data-frame-tab");
          openFramesModal();
          return;
        }
        var addFrameBtn = e.target.closest("[data-add-frame]");
        if (addFrameBtn) {
          addTextFrame(addFrameBtn.getAttribute("data-add-frame"));
          return;
        }
        var addShapeBtn = e.target.closest("[data-add-shape]");
        if (addShapeBtn) {
          addShapeToStage(addShapeBtn.getAttribute("data-add-shape"));
          return;
        }

        /* Character Studio */
        var charTabBtn = e.target.closest("[data-char-tab]");
        if (charTabBtn) {
          activeCharTab = charTabBtn.getAttribute("data-char-tab");
          renderCharsModal();
          return;
        }
        var moodBtn = e.target.closest("[data-set-cast-mood]");
        if (moodBtn) {
          selectedCastMood = moodBtn.getAttribute("data-set-cast-mood");
          renderCharsModal();
          return;
        }
        var pickChar = e.target.closest("[data-pick-char]");
        if (pickChar) {
          addCharacterToStage({
            charId: pickChar.getAttribute("data-pick-char"),
            mood: pickChar.getAttribute("data-pick-mood") || selectedCastMood,
            label: pickChar.getAttribute("data-pick-label") || "شخصية"
          });
          return;
        }
        var onpageBtn = e.target.closest("[data-onpage-act]");
        if (onpageBtn) {
          var opAct = onpageBtn.getAttribute("data-onpage-act");
          var kind = onpageBtn.getAttribute("data-kind");
          var id = onpageBtn.getAttribute("data-id");
          var pUid = adapter.getCurrentPageUid();
          var pRec = ensurePageRecord(pUid);
          pushUndoSnapshot();
          if (kind === "addedChar") {
            if (opAct === "del") pRec.addedChars = pRec.addedChars.filter(function (c) { return c.id !== id; });
            else pRec.addedChars.forEach(function (c) { if (c.id === id) c.scale = clamp((c.scale || 1) + (opAct === "up" ? 0.18 : -0.18), 0.15, 4.0); });
          } else {
            if (!pRec.nativeCharOverrides[id]) pRec.nativeCharOverrides[id] = { scale: 1, dx: 0, dy: 0, dxPct: 0, dyPct: 0, flip: false, hidden: false };
            var ov = pRec.nativeCharOverrides[id];
            if (opAct === "del") ov.hidden = true;
            else if (opAct === "restore") ov.hidden = false;
            else ov.scale = clamp((ov.scale || 1) + (opAct === "up" ? 0.18 : -0.18), 0.15, 4.0);
          }
          applyAllStageOverrides();
          scheduleAutoSave();
          renderCharsModal();
          return;
        }

        /* Inspector Quick Actions */
        var inspMood = e.target.closest("[data-insp-mood]");
        if (inspMood && selection) {
          pushUndoSnapshot();
          getSelectedModel().mood = inspMood.getAttribute("data-insp-mood");
          applyAllStageOverrides();
          scheduleAutoSave();
          openInspectorModal();
          return;
        }
        var inspSkin = e.target.closest("[data-insp-skin]");
        if (inspSkin && selection) {
          pushUndoSnapshot();
          getSelectedModel().skinColor = inspSkin.getAttribute("data-insp-skin");
          applyAllStageOverrides();
          scheduleAutoSave();
          openInspectorModal();
          return;
        }
        var inspCoat = e.target.closest("[data-insp-coat]");
        if (inspCoat && selection) {
          pushUndoSnapshot();
          var cm = getSelectedModel();
          cm.primaryColor = inspCoat.getAttribute("data-insp-coat");
          if (inspCoat.getAttribute("data-insp-sec")) {
            cm.secondaryColor = inspCoat.getAttribute("data-insp-sec");
          }
          applyAllStageOverrides();
          scheduleAutoSave();
          openInspectorModal();
          return;
        }
        var inspQfg = e.target.closest("[data-insp-quick-fg]");
        if (inspQfg && selection) {
          pushUndoSnapshot();
          getSelectedModel().color = inspQfg.getAttribute("data-insp-quick-fg") || "";
          applyAllStageOverrides();
          scheduleAutoSave();
          openInspectorModal();
          return;
        }
        var inspActBtn = e.target.closest("[data-insp-act]");
        if (inspActBtn && selection) {
          var ia = inspActBtn.getAttribute("data-insp-act");
          var im = getSelectedModel();
          if (!im) return;
          if (ia === "open-motion") { openMotionModal(); return; }
          if (ia === "clone-frame") { closeModal(); cloneSelectedTextAsFrame(); return; }
          if (ia === "reset-text") {
            pushUndoSnapshot();
            delete ensurePageRecord(selection.pageUid).textOverrides[selection.id];
            adapter.hydrateModelTexts(studioState.pages);
            closeModal();
            applyAllStageOverrides();
            renderContextBar();
            scheduleAutoSave();
            return;
          }
          pushUndoSnapshot();
          if (ia === "text-bold") im.fontWeight = im.fontWeight === "800" ? "400" : "800";
          else if (ia === "text-italic") im.fontStyle = im.fontStyle === "italic" ? "normal" : "italic";
          else if (ia === "text-underline") im.textDecoration = im.textDecoration === "underline" ? "none" : "underline";
          else if (ia === "text-align-right") im.textAlign = "right";
          else if (ia === "text-align-center") im.textAlign = "center";
          else if (ia === "text-align-left") im.textAlign = "left";
          else if (ia === "clear-text-bg") im.bgColor = "";
          else if (ia === "frame-bg-transparent") im.bg = "transparent";
          else if (ia === "frame-pill-rad") im.radius = 999;
          else if (ia === "flip-x") im.flip = !im.flip;
          else if (ia === "flip-y") im.flipY = !im.flipY;
          else if (ia === "shape-no-fill") im.fill = "none";
          applyAllStageOverrides();
          renderContextBar();
          scheduleAutoSave();
          openInspectorModal();
          return;
        }

        /* Motion Studio Actions */
        var motSet = e.target.closest("[data-mot-set]");
        if (motSet && selection) {
          var prop = motSet.getAttribute("data-mot-set");
          var val = motSet.getAttribute("data-val");
          var mm = getSelectedModel();
          if (mm) {
            pushUndoSnapshot();
            if (!mm.motion) mm.motion = { entrance: "none", loop: "none", interactive: "none", duration: 1.4, delay: 0, intensity: "normal" };
            mm.motion[prop] = val;
            applyAllStageOverrides();
            scheduleAutoSave();
            openMotionModal();
            triggerLiveMotionPreview();
          }
          return;
        }
        var motAct = e.target.closest("[data-mot-act]");
        if (motAct && selection) {
          var ma = motAct.getAttribute("data-mot-act");
          if (ma === "preview") {
            triggerLiveMotionPreview();
          } else if (ma === "clear") {
            pushUndoSnapshot();
            getSelectedModel().motion = null;
            applyAllStageOverrides();
            scheduleAutoSave();
            openMotionModal();
          }
          return;
        }

        /* Theme & Background Modal */
        var thTab = e.target.closest("[data-theme-tab]");
        if (thTab) {
          activeThemeModalTab = thTab.getAttribute("data-theme-tab");
          openThemeModal();
          return;
        }
        var slideBgBtn = e.target.closest("[data-set-slide-bg]");
        if (slideBgBtn) {
          pushUndoSnapshot();
          var curBg = ensurePageRecord(adapter.getCurrentPageUid()).background;
          curBg.presetId = slideBgBtn.getAttribute("data-set-slide-bg") || "";
          curBg.customColor = "";
          curBg.customImage = "";
          applyAllStageOverrides();
          scheduleAutoSave();
          openThemeModal();
          return;
        }
        var thAct = e.target.closest("[data-theme-act]");
        if (thAct) {
          var ta = thAct.getAttribute("data-theme-act");
          pushUndoSnapshot();
          var curUid = adapter.getCurrentPageUid();
          var srcBg = ensurePageRecord(curUid).background;
          if (ta === "clear-slide-bg") {
            ensurePageRecord(curUid).background = { presetId: "", customColor: "", customImage: "", patternOpacity: 100 };
          } else if (ta === "apply-bg-all") {
            var pages = adapter.getPages();
            for (var pi = 0; pi < pages.length; pi++) {
              ensurePageRecord(pages[pi].uid).background = deepClone(srcBg);
            }
            showToast("تم تعميم الخلفية على جميع الشرائح ✓");
          }
          applyAllStageOverrides();
          scheduleAutoSave();
          openThemeModal();
          return;
        }
        var palBtn = e.target.closest("[data-set-global-pal]");
        if (palBtn) {
          pushUndoSnapshot();
          studioState.globalTheme.paletteId = palBtn.getAttribute("data-set-global-pal") || "";
          applyGlobalThemeOverrides();
          scheduleAutoSave();
          openThemeModal();
          return;
        }
        var transBtn = e.target.closest("[data-set-global-trans]");
        if (transBtn) {
          pushUndoSnapshot();
          studioState.globalTheme.transition = transBtn.getAttribute("data-set-global-trans") || "";
          applyGlobalThemeOverrides();
          scheduleAutoSave();
          openThemeModal();
          return;
        }

        /* Layers Manager */
        var layerBtn = e.target.closest("[data-layer-act]");
        if (layerBtn) {
          var lact = layerBtn.getAttribute("data-layer-act");
          var lkind = layerBtn.getAttribute("data-kind");
          var lid = layerBtn.getAttribute("data-id");
          var lPageUid = adapter.getCurrentPageUid();
          var lRec = ensurePageRecord(lPageUid);

          var findLayerEl = function () {
            if (lkind === "frame") return document.querySelector('.ps-frame-item[data-ps-frame-id="' + CSS.escape(lid) + '"]');
            if (lkind === "shape") return document.querySelector('.ps-shape-item[data-ps-shape-id="' + CSS.escape(lid) + '"]');
            if (lkind === "addedChar") return document.querySelector('.ps-char-item[data-ps-added-char-id="' + CSS.escape(lid) + '"]');
            if (lkind === "nativeChar") return document.querySelector('[data-ps-native-char][data-ps-page-uid="' + lPageUid + '"][data-ps-char-key="' + CSS.escape(lid) + '"]');
            return document.querySelector('[data-ps-page-uid="' + lPageUid + '"][data-ps-text-key="' + CSS.escape(lid) + '"]');
          };

          if (lact === "select") {
            var targetEl = findLayerEl();
            closeModal();
            if (targetEl) selectItem({ kind: lkind, pageUid: lPageUid, id: lid, el: targetEl });
            return;
          }

          pushUndoSnapshot();
          if (lact === "show") {
            if (lkind === "nativeChar" && lRec.nativeCharOverrides[lid]) lRec.nativeCharOverrides[lid].hidden = false;
            if ((lkind === "text" || lkind === "svgText") && lRec.textOverrides[lid]) lRec.textOverrides[lid].hidden = false;
          } else if (lact === "lock") {
            var tempSel = selection;
            selection = { kind: lkind, pageUid: lPageUid, id: lid, el: findLayerEl() };
            var lm = getSelectedModel();
            if (lm) lm.locked = !lm.locked;
            selection = tempSel;
          } else if (lact === "front" || lact === "back") {
            var dz = lact === "front" ? 5 : -5;
            var arr = lkind === "frame" ? lRec.frames : (lkind === "shape" ? lRec.shapes : lRec.addedChars);
            arr.forEach(function (it) { if (it.id === lid) it.z = clamp((it.z || 48) + dz, 10, 250); });
          } else if (lact === "del") {
            if (lkind === "frame") lRec.frames = lRec.frames.filter(function (f) { return f.id !== lid; });
            else if (lkind === "shape") lRec.shapes = lRec.shapes.filter(function (s) { return s.id !== lid; });
            else if (lkind === "addedChar") lRec.addedChars = lRec.addedChars.filter(function (c) { return c.id !== lid; });
            else if (lkind === "nativeChar") {
              if (!lRec.nativeCharOverrides[lid]) lRec.nativeCharOverrides[lid] = {};
              lRec.nativeCharOverrides[lid].hidden = true;
            } else {
              if (!lRec.textOverrides[lid]) lRec.textOverrides[lid] = {};
              lRec.textOverrides[lid].hidden = true;
            }
            if (selection && selection.id === lid) clearSelection();
          }
          applyAllStageOverrides();
          scheduleAutoSave();
          openLayersModal();
          return;
        }

        /* Pages Manager */
        var jumpEl = e.target.closest("[data-page-jump]");
        if (jumpEl) {
          var jIdx = parseInt(jumpEl.getAttribute("data-page-jump"), 10);
          closeModal();
          adapter.goTo(jIdx);
          return;
        }
        var upBtn = e.target.closest("[data-page-move-up]");
        if (upBtn) { movePageInOrder(parseInt(upBtn.getAttribute("data-page-move-up"), 10), parseInt(upBtn.getAttribute("data-page-move-up"), 10) - 1); return; }
        var downBtn = e.target.closest("[data-page-move-down]");
        if (downBtn) { movePageInOrder(parseInt(downBtn.getAttribute("data-page-move-down"), 10), parseInt(downBtn.getAttribute("data-page-move-down"), 10) + 1); return; }
        var dupBtn = e.target.closest("[data-page-dup]");
        if (dupBtn) { duplicatePageAtIndex(parseInt(dupBtn.getAttribute("data-page-dup"), 10)); return; }
        var delBtn = e.target.closest("[data-page-del]");
        if (delBtn) { deletePageAtIndex(parseInt(delBtn.getAttribute("data-page-del"), 10)); return; }
        var addTplBtn = e.target.closest("[data-page-add-tpl]");
        if (addTplBtn) { addNewBlankPage(addTplBtn.getAttribute("data-page-add-tpl")); return; }

        /* More Modal */
        var moreBtn = e.target.closest("[data-more-act]");
        if (moreBtn) {
          var mAct = moreBtn.getAttribute("data-more-act");
          if (mAct === "download-editable") { closeModal(); downloadStandaloneHtml({ readonly: false }); }
          else if (mAct === "download-readonly") { closeModal(); downloadStandaloneHtml({ readonly: true }); }
          else if (mAct === "export-json") { exportProjectJson(); }
          else if (mAct === "restore-page-hidden") {
            pushUndoSnapshot();
            var curRec = ensurePageRecord(adapter.getCurrentPageUid());
            Object.keys(curRec.nativeCharOverrides || {}).forEach(function (k) { curRec.nativeCharOverrides[k].hidden = false; });
            Object.keys(curRec.textOverrides || {}).forEach(function (k) { curRec.textOverrides[k].hidden = false; });
            closeModal();
            applyAllStageOverrides();
            scheduleAutoSave();
            showToast("تمت استعادة جميع العناصر المخفية في الشريحة ✓");
          } else if (mAct === "reset-all") {
            resetAllChanges();
          }
        }
      });

      /* Capture-Phase Stage Click Handler (Prevents Accidental Button Jumps + Enables 100% Text Editing) */
      document.addEventListener("click", function (e) {
        if (!editMode || bypassInteractiveClick) return;
        if (e.target.closest("#ps-studio-root")) return;

        var delFrameBtn = e.target.closest("[data-ps-del-frame]");
        if (delFrameBtn) {
          e.preventDefault();
          e.stopPropagation();
          var fid = delFrameBtn.getAttribute("data-ps-del-frame");
          var fEl = delFrameBtn.closest(".ps-frame-item");
          var pUid = fEl ? fEl.getAttribute("data-ps-page-uid") : adapter.getCurrentPageUid();
          selectItem({ kind: "frame", pageUid: pUid, id: fid, el: fEl });
          deleteSelectedItem();
          return;
        }

        var frameEl = e.target.closest(".ps-frame-item");
        if (frameEl) {
          e.stopPropagation();
          selectItem({
            kind: "frame",
            pageUid: frameEl.getAttribute("data-ps-page-uid") || adapter.getCurrentPageUid(),
            id: frameEl.getAttribute("data-ps-frame-id"),
            el: frameEl
          });
          return;
        }

        var shapeEl = e.target.closest(".ps-shape-item");
        if (shapeEl) {
          e.preventDefault();
          e.stopPropagation();
          selectItem({
            kind: "shape",
            pageUid: shapeEl.getAttribute("data-ps-page-uid") || adapter.getCurrentPageUid(),
            id: shapeEl.getAttribute("data-ps-shape-id"),
            el: shapeEl
          });
          return;
        }

        var addedCharEl = e.target.closest(".ps-char-item");
        if (addedCharEl) {
          e.preventDefault();
          e.stopPropagation();
          selectItem({
            kind: "addedChar",
            pageUid: addedCharEl.getAttribute("data-ps-page-uid") || adapter.getCurrentPageUid(),
            id: addedCharEl.getAttribute("data-ps-added-char-id"),
            el: addedCharEl
          });
          return;
        }

        var svgTxt = e.target.closest("[data-ps-svg-text]");
        if (svgTxt) {
          e.preventDefault();
          e.stopPropagation();
          selectItem({
            kind: "svgText",
            pageUid: svgTxt.getAttribute("data-ps-page-uid") || adapter.getCurrentPageUid(),
            id: svgTxt.getAttribute("data-ps-text-key"),
            el: svgTxt
          });
          var inlineSvgInp = document.getElementById("ps-ctx-svg-input");
          if (inlineSvgInp) {
            inlineSvgInp.focus();
            inlineSvgInp.select();
          }
          return;
        }

        var editableEl = e.target.closest("[data-ps-editable]");
        if (editableEl) {
          if (findInteractiveTrigger(editableEl)) {
            e.preventDefault();
            e.stopPropagation();
          } else {
            e.stopPropagation();
          }
          var tPageUid = editableEl.getAttribute("data-ps-page-uid") || adapter.getCurrentPageUid();
          var tKey = editableEl.getAttribute("data-ps-text-key");
          var tRec = ensurePageRecord(tPageUid);
          var tOv = tRec.textOverrides[tKey] || {};

          /* Flatten animated word-mask spans into clean continuous text upon editing so typing/backspacing is seamless */
          if (editableEl.querySelector(".kw-mask, .w-clip") && editableEl.getAttribute("contenteditable") !== "true") {
            if (editableEl.__psOrigHtml === undefined) {
              editableEl.__psOrigHtml = editableEl.innerHTML;
            }
            editableEl.textContent = extractEditableText(editableEl);
          }

          if (!tOv.locked && editableEl.getAttribute("contenteditable") !== "true") {
            editableEl.setAttribute("contenteditable", "true");
            editableEl.focus();
          }
          selectItem({
            kind: "text",
            pageUid: tPageUid,
            id: tKey,
            el: editableEl
          });
          return;
        }

        var nativeCharEl = e.target.closest("[data-ps-native-char]");
        if (nativeCharEl) {
          e.preventDefault();
          e.stopPropagation();
          selectItem({
            kind: "nativeChar",
            pageUid: nativeCharEl.getAttribute("data-ps-page-uid") || adapter.getCurrentPageUid(),
            id: nativeCharEl.getAttribute("data-ps-char-key"),
            el: nativeCharEl
          });
          return;
        }

        if (e.target.closest("#stage-viewport, #stageViewport, #stage-touch-surface, #spatial-stage, #stage-frame")) {
          if (!e.target.closest("button, a, input, select, summary")) {
            e.stopPropagation();
            clearSelection();
          }
        }
      }, true);

      document.addEventListener("focusout", function (e) {
        if (e.target && e.target.closest && e.target.closest(".ps-frame-body, [data-ps-editable], #ps-ctx-svg-input")) {
          activeTextUndoKey = null;
        }
      }, true);

      document.addEventListener("input", function (e) {
        if (!editMode) return;
        var frameBody = e.target.closest && e.target.closest(".ps-frame-body");
        if (frameBody) {
          var frameEl = frameBody.closest(".ps-frame-item");
          if (!frameEl) return;
          var pUid = frameEl.getAttribute("data-ps-page-uid") || adapter.getCurrentPageUid();
          var fId = frameEl.getAttribute("data-ps-frame-id");
          ensureTextUndoSnapshotOnce("frame::" + pUid + "::" + fId);
          var rec = ensurePageRecord(pUid);
          var fText = extractEditableText(frameBody);
          for (var i = 0; i < rec.frames.length; i++) {
            if (rec.frames[i].id === fId) {
              rec.frames[i].text = fText;
              break;
            }
          }
          syncSelectionRing();
          scheduleAutoSave();
          return;
        }

        var editable = e.target.closest && e.target.closest("[data-ps-editable]");
        if (editable) {
          var tPageUid = editable.getAttribute("data-ps-page-uid") || adapter.getCurrentPageUid();
          var tKey = editable.getAttribute("data-ps-text-key");
          if (!tKey) return;
          if (editable.__psOrigHtml === undefined) {
            editable.__psOrigHtml = editable.innerHTML;
          }
          ensureTextUndoSnapshotOnce("text::" + tPageUid + "::" + tKey);
          editable.setAttribute("data-ps-text-modified", "1");
          var tRec = ensurePageRecord(tPageUid);
          var newText = extractEditableText(editable);
          tRec.textOverrides[tKey] = Object.assign(tRec.textOverrides[tKey] || {}, { text: newText, hidden: false });
          if (newText.indexOf("\n") !== -1) {
            editable.style.whiteSpace = "pre-line";
          }
          adapter.syncModelText(tPageUid, editable, newText);
          syncSelectionRing();
          scheduleAutoSave();
        }
      }, true);

      document.addEventListener("pointerdown", function (e) {
        if (!editMode) return;

        /* 1. Selection Ring Handles: Move, Rotate, Resize */
        if (e.target === ui.moveHandle && selection) {
          e.preventDefault();
          e.stopPropagation();
          startMoveSessionForSelection(e.clientX, e.clientY);
          return;
        }

        if (e.target === ui.rotateKnob && selection) {
          e.preventDefault();
          e.stopPropagation();
          var rm = getSelectedModel();
          if (!rm || rm.locked) return;
          var rRect = selection.el.getBoundingClientRect();
          var cx = rRect.left + rRect.width / 2;
          var cy = rRect.top + rRect.height / 2;
          pushUndoSnapshot();
          dragSession = {
            mode: "rotate",
            cx: cx,
            cy: cy,
            startAngle: Math.atan2(e.clientY - cy, e.clientX - cx) * (180 / Math.PI),
            origRotate: rm.rotate || 0
          };
          return;
        }

        if (e.target === ui.resizeKnob && selection) {
          e.preventDefault();
          e.stopPropagation();
          var sm = getSelectedModel();
          if (!sm || sm.locked) return;
          pushUndoSnapshot();
          dragSession = {
            mode: "resize",
            startX: e.clientX,
            startY: e.clientY,
            startScale: sm.scale || 1,
            startWidth: sm.width || 290
          };
          return;
        }

        if (e.target.closest("#ps-studio-root")) return;

        /* 2. Direct Stage Item Dragging */
        var frameDragHandle = e.target.closest("[data-ps-drag-frame]");
        if (frameDragHandle && !e.target.closest("[data-ps-del-frame]")) {
          var frameEl = frameDragHandle.closest(".ps-frame-item");
          if (!frameEl) return;
          e.preventDefault();
          e.stopPropagation();
          selectItem({
            kind: "frame",
            pageUid: frameEl.getAttribute("data-ps-page-uid") || adapter.getCurrentPageUid(),
            id: frameEl.getAttribute("data-ps-frame-id"),
            el: frameEl
          });
          startMoveSessionForSelection(e.clientX, e.clientY);
          return;
        }

        var shapeEl = e.target.closest(".ps-shape-item");
        if (shapeEl) {
          e.preventDefault();
          e.stopPropagation();
          selectItem({
            kind: "shape",
            pageUid: shapeEl.getAttribute("data-ps-page-uid") || adapter.getCurrentPageUid(),
            id: shapeEl.getAttribute("data-ps-shape-id"),
            el: shapeEl
          });
          startMoveSessionForSelection(e.clientX, e.clientY);
          return;
        }

        var addedCharEl = e.target.closest(".ps-char-item");
        if (addedCharEl) {
          e.preventDefault();
          e.stopPropagation();
          selectItem({
            kind: "addedChar",
            pageUid: addedCharEl.getAttribute("data-ps-page-uid") || adapter.getCurrentPageUid(),
            id: addedCharEl.getAttribute("data-ps-added-char-id"),
            el: addedCharEl
          });
          startMoveSessionForSelection(e.clientX, e.clientY);
          return;
        }

        var svgTxtEl = e.target.closest("[data-ps-svg-text]");
        if (svgTxtEl) {
          e.preventDefault();
          e.stopPropagation();
          selectItem({
            kind: "svgText",
            pageUid: svgTxtEl.getAttribute("data-ps-page-uid") || adapter.getCurrentPageUid(),
            id: svgTxtEl.getAttribute("data-ps-text-key"),
            el: svgTxtEl
          });
          startMoveSessionForSelection(e.clientX, e.clientY);
          return;
        }

        var nativeCharEl = e.target.closest("[data-ps-native-char]");
        if (nativeCharEl && !e.target.closest("[data-ps-editable], [data-ps-svg-text]")) {
          e.preventDefault();
          e.stopPropagation();
          selectItem({
            kind: "nativeChar",
            pageUid: nativeCharEl.getAttribute("data-ps-page-uid") || adapter.getCurrentPageUid(),
            id: nativeCharEl.getAttribute("data-ps-char-key"),
            el: nativeCharEl
          });
          startMoveSessionForSelection(e.clientX, e.clientY);
          return;
        }

        if (
          e.target.closest("#spatial-stage, #stage-frame, #stage-touch-surface") &&
          !e.target.closest("#ps-studio-root, [data-ps-overlay-layer], [data-ps-editable], [data-ps-svg-text], button, a, input, select, textarea, summary")
        ) {
          e.stopPropagation();
          clearSelection();
        }
      }, true);

      document.addEventListener("pointermove", function (e) {
        if (!dragSession || !selection) return;
        e.preventDefault();
        var model = getSelectedModel();
        if (!model || model.locked) return;

        if (dragSession.mode === "rotate") {
          var curAngle = Math.atan2(e.clientY - dragSession.cy, e.clientX - dragSession.cx) * (180 / Math.PI);
          var rawRot = Math.round(dragSession.origRotate + (curAngle - dragSession.startAngle));
          while (rawRot > 180) rawRot -= 360;
          while (rawRot < -180) rawRot += 360;
          model.rotate = clamp(rawRot, -180, 180);
          applyAllStageOverrides();
          return;
        }

        var dxPx = e.clientX - dragSession.startX;
        var dyPx = e.clientY - dragSession.startY;

        if (dragSession.mode === "resize") {
          var delta = (-dxPx + dyPx) / 170;
          if (selection.kind === "frame") {
            model.width = clamp(Math.round(dragSession.startWidth - dxPx * 1.4), 120, 780);
          } else {
            model.scale = clamp(Math.round((dragSession.startScale + delta) * 100) / 100, 0.15, 4.0);
          }
          applyAllStageOverrides();
          renderContextBar();
          return;
        }

        var hr = dragSession.hostRect;
        var w = Math.max(1, hr.width);
        var h = Math.max(1, hr.height);

        if (dragSession.mode === "moveOverlayPct") {
          model.x = clamp(dragSession.origX + (dxPx / w) * 100, 4, 96);
          model.y = clamp(dragSession.origY + (dyPx / h) * 100, 4, 96);
          applyAllStageOverrides();
        } else if (dragSession.mode === "moveNativeSvg") {
          model.dx = dragSession.origDx + dxPx * (dragSession.vbWidth / w);
          model.dy = dragSession.origDy + dyPx * (dragSession.vbHeight / h);
          applySvgWrapTransform(selection.el, model);
          syncSelectionRing();
        } else if (dragSession.mode === "moveSvgText") {
          model.dx = dragSession.origDx + dxPx * (dragSession.vbWidth / w);
          model.dy = dragSession.origDy + dyPx * (dragSession.vbHeight / h);
          applySvgTextOverride(selection.el, model);
          syncSelectionRing();
        } else if (dragSession.mode === "moveNativeHtml") {
          model.dxPct = clamp(dragSession.origDxPct + (dxPx / w) * 100, -90, 90);
          model.dyPct = clamp(dragSession.origDyPct + (dyPx / h) * 100, -90, 90);
          applyHtmlCharTransform(selection.el, model, dragSession.refHost);
          syncSelectionRing();
        } else if (dragSession.mode === "moveNativeText") {
          model.dxPct = clamp(dragSession.origDxPct + (dxPx / w) * 100, -90, 90);
          model.dyPct = clamp(dragSession.origDyPct + (dyPx / h) * 100, -90, 90);
          applyTextOverrideToElement(selection.el, model, dragSession.refHost);
          syncSelectionRing();
        }
      }, { passive: false });

      document.addEventListener("pointerup", function () {
        ctxColorUndoArmed = false;
        if (dragSession) {
          dragSession = null;
          scheduleAutoSave();
        }
      }, true);

      document.addEventListener("keydown", function (e) {
        if ((e.ctrlKey || e.metaKey) && (e.key === "s" || e.key === "S" || e.key === "س")) {
          e.preventDefault();
          e.stopPropagation();
          saveNow(true);
          return;
        }

        if (!editMode) return;

        var inEditable = e.target && e.target.closest && e.target.closest('[contenteditable="true"], input, textarea, select');
        if (inEditable) {
          if (e.key === "Escape") {
            e.target.blur();
            e.stopPropagation();
            return;
          }
          if (
            e.key === "Enter" &&
            !e.ctrlKey &&
            !e.metaKey &&
            inEditable.getAttribute &&
            inEditable.getAttribute("contenteditable") === "true"
          ) {
            e.preventDefault();
            e.stopPropagation();
            insertNewlineAtCaret(inEditable);
            inEditable.dispatchEvent(new Event("input", { bubbles: true }));
            return;
          }
          e.stopPropagation();
          return;
        }

        /* Redo: Ctrl+Y or Cmd/Ctrl+Shift+Z */
        if ((e.ctrlKey || e.metaKey) && ((e.shiftKey && (e.key === "z" || e.key === "Z" || e.key === "ئ")) || e.key === "y" || e.key === "Y" || e.key === "غ")) {
          e.preventDefault();
          e.stopPropagation();
          performRedo();
          return;
        }

        /* Undo: Cmd/Ctrl+Z */
        if ((e.ctrlKey || e.metaKey) && !e.shiftKey && (e.key === "z" || e.key === "Z" || e.key === "ئ")) {
          e.preventDefault();
          e.stopPropagation();
          performUndo();
          return;
        }

        /* Copy: Cmd/Ctrl+C */
        if ((e.ctrlKey || e.metaKey) && (e.key === "c" || e.key === "C" || e.key === "ؤ") && selection && !activeModal) {
          e.preventDefault();
          e.stopPropagation();
          copySelectedElement();
          return;
        }

        /* Paste: Cmd/Ctrl+V */
        if ((e.ctrlKey || e.metaKey) && (e.key === "v" || e.key === "V" || e.key === "ر") && studioClipboard && !activeModal) {
          e.preventDefault();
          e.stopPropagation();
          pasteClipboardElement();
          return;
        }

        /* Duplicate: Cmd/Ctrl+D */
        if ((e.ctrlKey || e.metaKey) && (e.key === "d" || e.key === "D" || e.key === "ي") && selection && !activeModal) {
          e.preventDefault();
          e.stopPropagation();
          if (copySelectedElement()) pasteClipboardElement();
          return;
        }

        if (e.key === "Escape") {
          if (activeModal) {
            e.preventDefault();
            e.stopPropagation();
            closeModal();
            return;
          }
          if (selection) {
            e.preventDefault();
            e.stopPropagation();
            clearSelection();
            return;
          }
        }

        if ((e.key === "Delete" || e.key === "Backspace") && selection && selection.kind !== "text" && !activeModal) {
          e.preventDefault();
          e.stopPropagation();
          deleteSelectedItem();
        }
      }, true);

      document.addEventListener("touchstart", function (e) {
        if (!editMode) return;
        if (
          e.touches &&
          e.touches.length === 2 &&
          selection &&
          (selection.kind === "addedChar" || selection.kind === "nativeChar" || selection.kind === "shape")
        ) {
          var m = getSelectedModel();
          if (m && !m.locked) {
            dragSession = null;
            pushUndoSnapshot();
            var d0 = Math.hypot(
              e.touches[1].clientX - e.touches[0].clientX,
              e.touches[1].clientY - e.touches[0].clientY
            );
            pinchSession = {
              startDist: Math.max(12, d0),
              startScale: m.scale || 1
            };
            e.stopPropagation();
            return;
          }
        }
        if (e.target && e.target.closest && e.target.closest(".ps-char-item, .ps-shape-item, .ps-frame-item, [data-ps-drag-frame], [data-ps-native-char], #ps-move-handle, #ps-rotate-knob, #ps-resize-knob, #ps-studio-root")) {
          e.stopPropagation();
        }
      }, { capture: true, passive: true });

      document.addEventListener("touchmove", function (e) {
        if (!editMode || !pinchSession || !e.touches || e.touches.length !== 2 || !selection) return;
        e.preventDefault();
        e.stopPropagation();
        var dist = Math.hypot(
          e.touches[1].clientX - e.touches[0].clientX,
          e.touches[1].clientY - e.touches[0].clientY
        );
        var nextScale = pinchSession.startScale * (dist / pinchSession.startDist);
        scaleSelectedItem(nextScale, false);
      }, { capture: true, passive: false });

      document.addEventListener("touchend", function () {
        if (pinchSession) {
          pinchSession = null;
          scheduleAutoSave();
        }
      }, { capture: true, passive: true });

      var resizeRaf = null;
      global.addEventListener("resize", function () {
        if (resizeRaf) cancelAnimationFrame(resizeRaf);
        resizeRaf = requestAnimationFrame(function () {
          resizeRaf = null;
          applyAllStageOverrides();
        });
      });
      global.addEventListener("scroll", function () {
        if (editMode) syncSelectionRing();
      }, true);
    }

    /* ----------------------------------------------------------------------
       16. INITIALIZATION & PUBLIC API
       ---------------------------------------------------------------------- */
    adapter = detectEngineAdapter(function onEngineRender() {
      applyAllStageOverrides();
    });

    loadInitialState(adapter.initialOrder);
    adapter.hydrateModelTexts(studioState.pages);

    var orderChanged = JSON.stringify(studioState.pageOrder) !== JSON.stringify(adapter.initialOrder) ||
                       Object.keys(studioState.customPages || {}).length > 0;
    if (orderChanged) {
      adapter.rebuildPages(studioState.pageOrder, studioState.customPages, 0);
    }
    applyGlobalThemeOverrides();
    applyAllStageOverrides();
    updateEntryBadge();
    syncDockState();
    bindGlobalInteractions();

    if (String(global.location.hash || "") === "#edit") {
      setEditMode(true);
    }

    document.documentElement.setAttribute("data-ps-ready", "true");

    /* Asynchronously recover newer/oversized state from IndexedDB if localStorage quota was exceeded */
    idbLoad(storageKey, function (idbRec) {
      if (
        idbRec &&
        typeof idbRec === "object" &&
        (idbRec.savedAt || 0) > (studioState.savedAt || 0)
      ) {
        applyLoadedStateObject(idbRec);
        adapter.hydrateModelTexts(studioState.pages);
        var idbOrderChanged = JSON.stringify(studioState.pageOrder) !== JSON.stringify(adapter.initialOrder) ||
                              Object.keys(studioState.customPages || {}).length > 0;
        if (idbOrderChanged) {
          adapter.rebuildPages(studioState.pageOrder, studioState.customPages, adapter.getCurrentIndex());
        }
        applyGlobalThemeOverrides();
        applyAllStageOverrides();
        updateEntryBadge();
        syncDockState();
      }
      document.documentElement.setAttribute("data-ps-idb-ready", "true");
    });

    global.PresentationStudio = {
      version: "2.0.0",
      open: function () { setEditMode(true); },
      close: function () { setEditMode(false); },
      isEditing: function () { return editMode; },
      addTextFrame: addTextFrame,
      addShape: addShapeToStage,
      addCharacter: addCharacterToStage,
      copySelected: copySelectedElement,
      pasteClipboard: pasteClipboardElement,
      undo: performUndo,
      redo: performRedo,
      movePage: movePageInOrder,
      deletePage: deletePageAtIndex,
      duplicatePage: duplicatePageAtIndex,
      addBlankPage: addNewBlankPage,
      save: function () { return saveNow(true); },
      reset: resetAllChanges,
      exportJson: exportProjectJson,
      exportHtmlString: buildStandaloneHtmlString,
      downloadHtml: downloadStandaloneHtml,
      getState: function () { return deepClone(studioState); },
      getAdapterKind: function () { return adapter ? adapter.kind : "none"; }
    };
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", function () {
      setTimeout(createStudio, 0);
    });
  } else {
    setTimeout(createStudio, 0);
  }
})(typeof window !== "undefined" ? window : globalThis);
/* ==================== END part3-studio-core.js ==================== */

  </script>
