:root {
  color-scheme: dark;
  --font-arabic: 'Cairo', 'Tajawal', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;

  /* Dark Cinema Surfaces */
  --bg-base: #070c18;
  --bg-stage-glow: rgba(56, 189, 248, 0.14);
  --bg-stage-glow-2: rgba(245, 158, 11, 0.08);
  --text-primary: #f8fafc;
  --text-secondary: #cbd5e1;
  --text-muted: #94a3b8;
  --mood-accent: #38bdf8;
  --mood-accent-2: #f59e0b;
  --caption-bg: rgba(9, 15, 30, 0.68);
  --caption-border: rgba(148, 163, 184, 0.2);
}

html[data-theme="light"],
#app-shell[data-theme="light"] {
  color-scheme: light;
  --bg-base: #f8fafc;
  --bg-stage-glow: rgba(14, 165, 233, 0.12);
  --bg-stage-glow-2: rgba(245, 158, 11, 0.09);
  --text-primary: #0f172a;
  --text-secondary: #334155;
  --text-muted: #64748b;
  --mood-accent: #0284c7;
  --mood-accent-2: #d97706;
  --caption-bg: rgba(255, 255, 255, 0.88);
  --caption-border: rgba(15, 23, 42, 0.14);
}

[data-mood="dusk"] { --mood-accent: #38bdf8; --mood-accent-2: #f59e0b; --bg-stage-glow: rgba(56, 189, 248, 0.15); --bg-stage-glow-2: rgba(245, 158, 11, 0.10); }
[data-mood="tiger"] { --mood-accent: #f59e0b; --mood-accent-2: #ef4444; --bg-stage-glow: rgba(245, 158, 11, 0.18); --bg-stage-glow-2: rgba(239, 68, 68, 0.14); }
[data-mood="timeline"] { --mood-accent: #22d3ee; --mood-accent-2: #8b5cf6; --bg-stage-glow: rgba(34, 211, 238, 0.15); --bg-stage-glow-2: rgba(139, 92, 246, 0.11); }
[data-mood="tension"] { --mood-accent: #f43f5e; --mood-accent-2: #fb923c; --bg-stage-glow: rgba(244, 63, 94, 0.18); --bg-stage-glow-2: rgba(251, 146, 60, 0.11); }
[data-mood="arena"] { --mood-accent: #fb923c; --mood-accent-2: #10b981; --bg-stage-glow: rgba(251, 146, 60, 0.16); --bg-stage-glow-2: rgba(16, 185, 129, 0.12); }
[data-mood="mind"] { --mood-accent: #a78bfa; --mood-accent-2: #06b6d4; --bg-stage-glow: rgba(167, 139, 250, 0.18); --bg-stage-glow-2: rgba(6, 182, 212, 0.12); }
[data-mood="cyber"] { --mood-accent: #06b6d4; --mood-accent-2: #ec4899; --bg-stage-glow: rgba(6, 182, 212, 0.18); --bg-stage-glow-2: rgba(236, 72, 153, 0.14); }
[data-mood="home"] { --mood-accent: #fbbf24; --mood-accent-2: #a78bfa; --bg-stage-glow: rgba(251, 191, 36, 0.15); --bg-stage-glow-2: rgba(167, 139, 250, 0.12); }
[data-mood="campus"] { --mood-accent: #38bdf8; --mood-accent-2: #818cf8; --bg-stage-glow: rgba(56, 189, 248, 0.16); --bg-stage-glow-2: rgba(129, 140, 248, 0.12); }
[data-mood="lab"] { --mood-accent: #2dd4bf; --mood-accent-2: #38bdf8; --bg-stage-glow: rgba(45, 212, 191, 0.16); --bg-stage-glow-2: rgba(56, 189, 248, 0.12); }

[data-mood="sunrise"] { --mood-accent: #fbbf24; --mood-accent-2: #10b981; --bg-stage-glow: rgba(251, 191, 36, 0.22); --bg-stage-glow-2: rgba(16, 185, 129, 0.16); }

*, *::before, *::after {
  box-sizing: border-box;
}

[hidden] {
  display: none !important;
}

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  overscroll-behavior: none;
  direction: rtl;
  font-family: var(--font-arabic);
  color: var(--text-primary);
  background-color: var(--bg-base);
  -webkit-font-smoothing: antialiased;
  font-variant-numeric: lining-nums tabular-nums;
  font-feature-settings: "lnum" 1, "tnum" 1;
  transition: background-color 0.55s ease, color 0.35s ease;
}

button, input {
  font-family: inherit;
  font-variant-numeric: lining-nums tabular-nums;
}

/* Theatrical Stage Shell */
#app-shell {
  position: relative;
  width: 100vw;
  height: 100vh;
  height: 100dvh;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  background-color: var(--bg-base);
  background-image:
    radial-gradient(ellipse 68% 54% at 50% 42%, var(--bg-stage-glow) 0%, transparent 72%),
    radial-gradient(ellipse 52% 40% at 50% 66%, var(--bg-stage-glow-2) 0%, transparent 76%);
  transition: background-color 0.55s ease, background-image 0.55s ease;
}

/* Spacious Visual Stage (Zero Clutter, Zero Scrollbars) */
#stage-viewport {
  position: relative;
  z-index: 10;
  flex: 1 1 auto;
  min-height: 0;
  width: 100%;
  padding: 0.5rem 2rem;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

.stage-scene {
  width: 100%;
  max-width: 1180px;
  max-height: 66vh;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
}

/* Single-Sentence Cinematic Subtitle Dock */
.caption-dock {
  position: relative;
  z-index: 20;
  flex: 0 0 auto;
  min-height: 106px;
  padding: 0.25rem 1.5rem 0.65rem;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
}

.caption-box {
  display: inline-flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 0.42rem;
  max-width: 920px;
  padding: 0.72rem 1.65rem;
  border-radius: 22px;
  background: var(--caption-bg);
  border: 1px solid var(--caption-border);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  box-shadow: 0 12px 36px rgba(0, 0, 0, 0.22);
}

html[data-theme="light"] .caption-box,
#app-shell[data-theme="light"] .caption-box {
  box-shadow: 0 10px 28px rgba(15, 23, 42, 0.08);
}

.caption-text {
  margin: 0;
  font-size: clamp(1.32rem, 2.15vw, 1.92rem);
  font-weight: 800;
  line-height: 1.52;
  color: var(--text-primary);
  letter-spacing: 0;
}

.source-chip {
  display: inline-flex;
  align-items: center;
  gap: 0.35rem;
  padding: 0.14rem 0.72rem;
  border-radius: 999px;
  font-size: 0.78rem;
  font-weight: 700;
  color: var(--mood-accent);
  background: rgba(56, 189, 248, 0.1);
  border: 1px solid rgba(56, 189, 248, 0.28);
}

html[data-theme="light"] .source-chip,
#app-shell[data-theme="light"] .source-chip {
  background: rgba(2, 132, 199, 0.08);
  border-color: rgba(2, 132, 199, 0.25);
}

/* Character SVG & Stage Keyframe Animations */
.svg-breathe {
  transform-box: fill-box;
  transform-origin: center bottom;
  animation: v2SvgBreathe 3.6s ease-in-out infinite;
}

.svg-blink {
  transform-box: fill-box;
  transform-origin: center center;
  animation: v2SvgBlink 4.3s ease-in-out infinite;
}

.svg-angry-shake,
.enter-shake {
  transform-box: fill-box;
  transform-origin: center bottom;
  animation: v2AngryShake 0.46s ease-in-out 2;
}

.aura-ring {
  transform-box: fill-box;
  transform-origin: center center;
  animation: v2AuraPulse 3s ease-in-out infinite;
}

.tiger-prowl {
  transform-box: fill-box;
  transform-origin: center bottom;
  animation: v2TigerProwl 3.4s ease-in-out infinite;
}

.enter-pop {
  animation: v2EnterPop 420ms cubic-bezier(0.22, 1, 0.36, 1) both;
}

.enter-slide-right {
  animation: v2SlideRight 460ms cubic-bezier(0.22, 1, 0.36, 1) both;
}

.enter-slide-left {
  animation: v2SlideLeft 460ms cubic-bezier(0.22, 1, 0.36, 1) both;
}

.enter-glow {
  animation: v2EnterGlow 520ms cubic-bezier(0.22, 1, 0.36, 1) both;
}

.prop-drop {
  animation: v2PropDrop 480ms cubic-bezier(0.34, 1.56, 0.64, 1) both;
}

@keyframes v2SvgBreathe {
  0%, 100% { transform: translateY(0) scaleY(1); }
  50% { transform: translateY(-3px) scaleY(1.022); }
}

@keyframes v2SvgBlink {
  0%, 44%, 48%, 94%, 98%, 100% { transform: scaleY(1); }
  46%, 96% { transform: scaleY(0.08); }
}

@keyframes v2AngryShake {
  0%, 100% { transform: translateX(0) rotate(0deg); }
  25% { transform: translateX(-4px) rotate(-1.2deg); }
  75% { transform: translateX(4px) rotate(1.2deg); }
}

@keyframes v2AuraPulse {
  0%, 100% { opacity: 0.76; transform: scale(0.97); }
  50% { opacity: 1; transform: scale(1.05); }
}

@keyframes v2TigerProwl {
  0%, 100% { transform: translate3d(0, 0, 0) scale(1); }
  50% { transform: translate3d(-5px, -4px, 0) scale(1.035); }
}

@keyframes v2EnterPop {
  0% { opacity: 0; transform: scale(0.86) translateY(14px); }
  100% { opacity: 1; transform: scale(1) translateY(0); }
}

@keyframes v2SlideRight {
  0% { opacity: 0; transform: translateX(48px) scale(0.95); }
  100% { opacity: 1; transform: translateX(0) scale(1); }
}

@keyframes v2SlideLeft {
  0% { opacity: 0; transform: translateX(-48px) scale(0.95); }
  100% { opacity: 1; transform: translateX(0) scale(1); }
}

@keyframes v2EnterGlow {
  0% { opacity: 0; transform: scale(0.9); filter: brightness(1.4); }
  100% { opacity: 1; transform: scale(1); filter: brightness(1); }
}

@keyframes v2PropDrop {
  0% { opacity: 0; transform: translateY(-38px) scale(0.82); }
  100% { opacity: 1; transform: translateY(0) scale(1); }
}

/* Character Pod Clean Minimalist Framing (No Heavy Boxes!) */
.char-pod {
  position: relative;
  display: inline-flex;
  flex-direction: column;
  align-items: center;
  gap: 0.35rem;
}

.char-meta {
  display: inline-flex;
  align-items: center;
  gap: 0.35rem;
  padding: 0.32rem 0.92rem 0.42rem;
  border-radius: 999px;
  background: rgba(15, 23, 42, 0.68);
  border: 1px solid rgba(148, 163, 184, 0.24);
  font-size: 0.82rem;
  line-height: 1.32;
}

html[data-theme="light"] .char-meta,
#app-shell[data-theme="light"] .char-meta {
  background: rgba(255, 255, 255, 0.92);
  border-color: rgba(15, 23, 42, 0.15);
}

.char-name-tag {
  font-weight: 800;
  color: var(--text-primary);
}

.char-role-tag {
  font-weight: 600;
  color: var(--text-secondary);
  font-size: 0.76rem;
}

.story-scene-svg {
  width: 100%;
  height: auto;
  max-height: 360px;
  display: block;
}

.p3-cast-stage .sp-row-actors {
  gap: clamp(24px, 3.6vw, 48px) !important;
}

.p3-cast-stage .speech-bubble {
  max-width: 192px !important;
}

@media (max-height: 760px) {
  .stage-scene {
    max-height: 60vh;
  }
  .caption-dock {
    min-height: 86px;
    padding-bottom: 0.4rem;
  }
  .caption-text {
    font-size: clamp(1.15rem, 1.9vw, 1.55rem);
  }
}

  function ensureStagePropsCss() {
    if (typeof document === "undefined") return;
    if (document.getElementById("stage-props-css")) return;
    var target = document.head || document.documentElement;
    if (!target) return;
    var style = document.createElement("style");
    style.id = "stage-props-css";
    style.textContent = STAGE_PROPS_CSS;
    target.appendChild(style);
  }

  // Inject immediately on load when DOM is present
  ensureStagePropsCss();

  /* Internal helper: render via StoryArt or graceful SVG fallback */
  function renderStoryChar(charId, mood, charOpts) {
    if (global.StoryArt && typeof global.StoryArt.renderCharacter === "function") {
      return global.StoryArt.renderCharacter(charId, mood, charOpts);
    }
    var sz = (charOpts && charOpts.size) || 225;
    return (
      '<div class="char-pod">' +
      '<svg width="' + sz + '" height="' + sz + '" viewBox="0 0 200 200" role="img" aria-label="' + escapeHtml(charId) + '">' +
      '<circle cx="100" cy="100" r="76" fill="rgba(56,189,248,0.22)" stroke="#38bdf8" stroke-width="3"/>' +
      '<circle cx="100" cy="82" r="28" fill="#f6d5b8" stroke="#0f172a" stroke-width="2.5"/>' +
      '<path d="M52 176 C56 128 74 114 100 114 C126 114 144 128 148 176 Z" fill="#0284c7" stroke="#0f172a" stroke-width="2.5"/>' +
      "</svg>" +
      "</div>"
    );
  }

  /* Normalize HTML-or-characterId argument */
  function resolveActorHtml(htmlOrCharId, defaultMood, defaultSize) {
    if (!htmlOrCharId) return "";
    var str = String(htmlOrCharId).trim();
    if (!str) return "";
    if (str.charAt(0) === "<") return str;
    return char(str, defaultMood || "calm", { size: defaultSize || 220, enter: "pop" });
  }

  /* ========================================================================
   * 1. StageProps.char(id, mood, opts)
   * Large full-stage character with ground shadow, smooth scale & entrance
   * ======================================================================== */
  var VALID_ENTERS = {
    pop: "sp-enter-pop",
    "slide-right": "sp-enter-slide-right",
    "slide-left": "sp-enter-slide-left",
    shake: "sp-enter-shake",
    glow: "sp-enter-glow",
    shrink: "sp-enter-shrink",
    grow: "sp-enter-grow"
  };

  function char(id, mood, opts) {
    ensureStagePropsCss();
    opts = opts || {};

    var sizeNum = 225;
    if (typeof opts.size === "number" && opts.size > 30) {
      sizeNum = opts.size;
    } else if (typeof opts.size === "string" && parseFloat(opts.size) > 30) {
      sizeNum = parseFloat(opts.size);
    }

    var scaleVal = 1;
    if (typeof opts.scale === "number" && !isNaN(opts.scale)) {
      scaleVal = Math.max(0.45, Math.min(1.65, opts.scale));
    }

    var enterKey = opts.enter ? String(opts.enter).toLowerCase().trim() : "pop";
    var enterCls = opts.enter === false ? "" : (VALID_ENTERS[enterKey] || "sp-enter-pop");
    var dimCls = opts.dim ? " is-dim" : "";
    var extraCls = opts.className ? " " + escapeHtml(opts.className) : "";

    var bubbleClean = opts.bubble ? clampWords(opts.bubble, 7) : "";

    var charHtml = renderStoryChar(id || "sami", mood, {
      size: sizeNum,
      flip: Boolean(opts.flip),
      bubble: bubbleClean,
      bubbleType: opts.bubbleType,
      label: opts.label,
      role: opts.role,
      hideLabel: opts.hideLabel
    });

    return [
      '<div class="sp-char-actor' + (enterCls ? " " + enterCls : "") + dimCls + extraCls + '" style="--sp-scale:' + scaleVal + ';">',
      '  <div class="sp-char-scaler">',
      "    " + charHtml,
      "  </div>",
      '  <div class="sp-char-ground-shadow" aria-hidden="true"></div>',
      "</div>"
    ].join("");
  }

  /* ========================================================================
   * 2. StageProps.row(itemsHtmlArray, opts)
   * 1-5 characters/props arranged horizontally on a glowing theatrical floor
   * ======================================================================== */
  function row(itemsHtmlArray, opts) {
    ensureStagePropsCss();
    opts = opts || {};

    var list = Array.isArray(itemsHtmlArray)
      ? itemsHtmlArray
      : (itemsHtmlArray ? [itemsHtmlArray] : []);

    var validItems = [];
    for (var i = 0; i < list.length; i++) {
      if (list[i] !== null && list[i] !== undefined && String(list[i]).trim() !== "") {
        validItems.push(String(list[i]));
      }
    }

    var gapCss = "clamp(18px, 3vw, 44px)";
    if (typeof opts.gap === "number") {
      gapCss = opts.gap + "px";
    } else if (typeof opts.gap === "string" && opts.gap.trim()) {
      gapCss = escapeHtml(opts.gap.trim());
    }

    var toneKey = resolveTone(opts.tone || opts.floorGlow || "cyan");
    var pal = TONE_PALETTE[toneKey];
    var alignMode = opts.align === "center" ? "center" : "end";
    var count = Math.min(5, Math.max(1, validItems.length));

    return [
      '<div class="sp-stage-wrap sp-row-stage" data-count="' + count + '" data-align="' + alignMode + '"',
      '     style="--sp-row-gap:' + gapCss + '; --sp-floor-glow:' + pal.glow + '; --sp-floor-rim:' + pal.border + ';">',
      '  <div class="sp-row-actors">',
      "    " + validItems.join(""),
      "  </div>",
      '  <div class="sp-stage-floor-disc" aria-hidden="true"></div>',
      "</div>"
    ].join("");
  }

  /* ========================================================================
   * 3. StageProps.spotlightHero(centerHtml, floatingBadgesArray, opts)
   * Central hero in volumetric theatrical beam + 1-4 orbiting visual badges
   * ======================================================================== */
  function parseBadgeItem(raw, fallbackTone) {
    if (!raw) return null;
    if (typeof raw === "string") {
      var trimmed = clampWords(raw, 4);
      if (!trimmed) return null;
      return { icon: "✦", text: trimmed, tone: resolveTone(fallbackTone || "cyan") };
    }
    var icon = raw.icon ? toWesternDigits(raw.icon) : "✦";
    var txt = clampWords(raw.text || raw.label || "", 4);
    var tone = resolveTone(raw.tone || raw.color || fallbackTone || "cyan");
    return { icon: icon, text: txt, tone: tone };
  }

  function spotlightHero(centerHtml, floatingBadgesArray, opts) {
    ensureStagePropsCss();
    opts = opts || {};
    var uid = nextPropUid("spot");

    var rawBadges = Array.isArray(floatingBadgesArray) ? floatingBadgesArray : [];
    var badges = [];
    for (var i = 0; i < rawBadges.length && badges.length < 6; i++) {
      var parsed = parseBadgeItem(rawBadges[i], opts.tone);
      if (parsed && (parsed.text || parsed.icon)) {
        badges.push(parsed);
      }
    }

    var beamToneKey = resolveTone(opts.tone || (badges[0] && badges[0].tone) || "cyan");
    var beamPal = TONE_PALETTE[beamToneKey];
    var heroMarkup = resolveActorHtml(centerHtml, "calm", 235);

    var badgesHtml = [];
    for (var b = 0; b < badges.length; b++) {
      var item = badges[b];
      var p = TONE_PALETTE[item.tone] || TONE_PALETTE.cyan;
      badgesHtml.push(
        '<div class="sp-float-badge sp-orbit-pos-' + b + '" style="--badge-bg:' + p.bg + "; --badge-border:" + p.border + "; --badge-glow:" + p.glow + "; --badge-text:" + p.text + ';">' +
        (item.icon ? '<span class="sp-float-badge-icon" aria-hidden="true">' + escapeHtml(item.icon) + "</span>" : "") +
        (item.text ? "<span>" + escapeHtml(item.text) + "</span>" : "") +
        "</div>"
      );
    }

    return [
      '<div class="sp-stage-wrap sp-spotlight-stage">',
      '  <svg class="sp-spotlight-beam-svg" viewBox="0 0 800 440" preserveAspectRatio="xMidYMid meet" aria-hidden="true">',
      "    <defs>",
      '      <linearGradient id="' + uid + '-cone" x1="0.5" y1="0" x2="0.5" y2="1">',
      '        <stop offset="0%" stop-color="' + beamPal.main + '" stop-opacity="0.32"/>',
      '        <stop offset="65%" stop-color="' + beamPal.sub + '" stop-opacity="0.11"/>',
      '        <stop offset="100%" stop-color="' + beamPal.main + '" stop-opacity="0"/>',
      "      </linearGradient>",
      '      <radialGradient id="' + uid + '-pool" cx="50%" cy="50%" r="50%">',
      '        <stop offset="0%" stop-color="' + beamPal.main + '" stop-opacity="0.42"/>',
      '        <stop offset="65%" stop-color="' + beamPal.sub + '" stop-opacity="0.12"/>',
      '        <stop offset="100%" stop-color="' + beamPal.main + '" stop-opacity="0"/>',
      "      </radialGradient>",
      "    </defs>",
      '    <polygon points="345,0 455,0 600,408 200,408" fill="url(#' + uid + '-cone)"/>',
      '    <ellipse cx="400" cy="404" rx="215" ry="26" fill="url(#' + uid + '-pool)"/>',
      '    <ellipse cx="400" cy="225" rx="185" ry="145" fill="none" stroke="' + beamPal.main + '" stroke-width="1.3" stroke-dasharray="6 8" opacity="0.35"/>',
      '    <circle cx="330" cy="128" r="2.6" fill="' + beamPal.main + '" opacity="0.75"><animate attributeName="cy" values="136;108;136" dur="3.8s" repeatCount="indefinite"/></circle>',
      '    <circle cx="472" cy="156" r="2.2" fill="#fde68a" opacity="0.7"><animate attributeName="cy" values="164;134;164" dur="3.2s" repeatCount="indefinite"/></circle>',
      "  </svg>",
      '  <div class="sp-spotlight-center">' + heroMarkup + "</div>",
      badgesHtml.length ? '  <div class="sp-orbit-ring">' + badgesHtml.join("") + "</div>" : "",
      "</div>"
    ].join("");
  }

  /* ========================================================================
   * 4. StageProps.bigStat(numberStr, shortLabel, characterHtml, tone)
   * Giant glowing hero number (clamp(3.8rem, 7vw, 6.2rem)) beside character
   * ======================================================================== */
  function bigStat(numberStr, shortLabel, characterHtml, tone) {
    ensureStagePropsCss();

    // Defensive check if 3rd argument is actually a tone name and 4th is omitted
    if (tone === undefined && typeof characterHtml === "string") {
      var maybeTone = characterHtml.toLowerCase().trim();
      if (TONE_ALIASES[maybeTone]) {
        tone = maybeTone;
        characterHtml = "";
      }
    }

    var toneKey = resolveTone(tone || "amber");
    var pal = TONE_PALETTE[toneKey];
    var cleanNum = toWesternDigits(numberStr || "0").trim();
    var cleanLbl = clampWords(shortLabel || "", 4);

    // Preserve pure numeric/math expressions (> 25%, 85%-88%, 24/7) in LTR isolate so symbols never mirror
    var isPureNumericOrSymbol = /^[\d\s.%+\-\u2013\u2014<>/:x\u00D7~]+$/.test(cleanNum);
    var numDirAttr = isPureNumericOrSymbol ? ' dir="ltr"' : "";

    var actorMarkup = resolveActorHtml(characterHtml, "calm", 220);

    return [
      '<div class="sp-stage-wrap sp-bigstat-stage">',
      '  <div class="sp-bigstat-monument" style="--stat-main:' + pal.main + "; --stat-glow:" + pal.glow + "; --stat-border:" + pal.border + "; --stat-text:" + pal.text + "; --stat-pill-bg:" + pal.bg + ';">',
      '    <svg class="sp-bigstat-ring-svg" viewBox="0 0 320 220" preserveAspectRatio="none" aria-hidden="true">',
      '      <rect x="6" y="6" width="308" height="208" rx="34" fill="none" stroke="' + pal.main + '" stroke-width="1.5" stroke-dasharray="10 8" opacity="0.5"/>',
      "    </svg>",
      '    <div class="sp-bigstat-number"' + numDirAttr + ">" + escapeHtml(cleanNum) + "</div>",
      cleanLbl ? '    <div class="sp-bigstat-label">' + escapeHtml(cleanLbl) + "</div>" : "",
      "  </div>",
      actorMarkup ? '  <div class="sp-bigstat-char">' + actorMarkup + "</div>" : "",
      "</div>"
    ].join("");
  }

  /* ========================================================================
   * 5. StageProps.scaleStage(tiltDeg, rightContentHtml, leftContentHtml, weightsArray)
   * True animated balance scale tilting by tiltDeg with physics-dropped weights
   * ======================================================================== */
  var WEIGHT_ICONS = {
    "جسد": "💪",
    "قوة": "💪",
    "عدد": "👥",
    "شلة": "👥",
    "شعبية": "👑",
    "مكانة": "👑",
    "سلطة": "⚡",
    "نفوذ": "⚡",
    "تقنية": "📱",
    "شاشة": "📱",
    "صمت": "🤐",
    "عمر": "📏"
  };

  function resolveWeightIcon(label) {
    var keys = Object.keys(WEIGHT_ICONS);
    for (var i = 0; i < keys.length; i++) {
      if (label.indexOf(keys[i]) !== -1) return WEIGHT_ICONS[keys[i]];
    }
    return "⚖️";
  }

  function scaleStage(tiltDeg, rightContentHtml, leftContentHtml, weightsArray) {
    ensureStagePropsCss();
    var uid = nextPropUid("scale");

    var deg = typeof tiltDeg === "number" && !isNaN(tiltDeg) ? Math.max(-24, Math.min(24, tiltDeg)) : 0;
    var isBalanced = Math.abs(deg) < 1;
    var rightHeavy = !isBalanced && deg > 0;
    var leftHeavy = !isBalanced && deg < 0;

    var rightMarkup = resolveActorHtml(rightContentHtml, rightHeavy ? "smirk" : "neutral", 190);
    var leftMarkup = resolveActorHtml(leftContentHtml, rightHeavy ? "sad" : "neutral", 185);

    var rawWeights = Array.isArray(weightsArray) ? weightsArray : [];
    var weightBlocks = [];
    for (var i = 0; i < rawWeights.length && weightBlocks.length < 6; i++) {
      var w = rawWeights[i];
      var wText = typeof w === "object" && w !== null ? clampWords(w.text || w.label || "", 2) : clampWords(w, 2);
      var wIcon = typeof w === "object" && w !== null && w.icon ? toWesternDigits(w.icon) : resolveWeightIcon(wText);
      if (!wText && !wIcon) continue;
      var delaySec = (0.1 + weightBlocks.length * 0.11).toFixed(2);
      weightBlocks.push(
        '<span class="prop-drop" style="animation-delay:' + delaySec + 's;">' +
        '<span aria-hidden="true">' + escapeHtml(wIcon) + "</span>" +
        (wText ? "<span>" + escapeHtml(wText) + "</span>" : "") +
        "</span>"
      );
    }

    var weightsHtml = weightBlocks.length
      ? '<div class="sp-scale-weights-rack">' + weightBlocks.join("") + "</div>"
      : "";

    var statusLabel = isBalanced ? "⚖️ كفّتان متكافئتان" : "⚠️ اختلال ميزان القوة";
    var statusPal = isBalanced ? TONE_PALETTE.emerald : TONE_PALETTE.crimson;

    return [
      '<div class="sp-stage-wrap sp-scale-stage ' + (isBalanced ? "is-balanced" : "is-tilted") + '" style="--tilt-deg:' + deg + 'deg;">',
      '  <div class="sp-scale-status-pill" style="background:' + statusPal.bg + "; border:1.5px solid " + statusPal.border + "; color:" + statusPal.text + "; box-shadow:0 6px 20px " + statusPal.glow + ';">',
      "    " + statusLabel,
      "  </div>",
      '  <div class="sp-scale-beam-assembly">',
      // Left Pan (rises when tiltDeg > 0)
      '    <div class="sp-scale-pan-mount sp-scale-pan-left' + (leftHeavy ? " is-heavy" : "") + '">',
      '      <div class="sp-scale-pan-actor">' + leftMarkup + "</div>",
      leftHeavy ? weightsHtml : "",
      '      <div class="sp-scale-pan-dish"></div>',
      '      <div class="sp-scale-stem"></div>',
      "    </div>",
      // Right Pan (drops heavily when tiltDeg > 0)
      '    <div class="sp-scale-pan-mount sp-scale-pan-right' + (rightHeavy ? " is-heavy" : "") + '">',
      '      <div class="sp-scale-pan-actor">' + rightMarkup + "</div>",
      (!leftHeavy && weightBlocks.length) ? weightsHtml : "",
      '      <div class="sp-scale-pan-dish"></div>',
      '      <div class="sp-scale-stem"></div>',
      "    </div>",
      '    <div class="sp-scale-bar"></div>',
      "  </div>",
      // Central Metallic Fulcrum Pillar & Dial SVG
      '  <svg class="sp-scale-fulcrum-svg" viewBox="0 0 200 185" aria-hidden="true">',
      "    <defs>",
      '      <linearGradient id="' + uid + '-gold" x1="0" y1="0" x2="1" y2="1">',
      '        <stop offset="0%" stop-color="#fef08a"/>',
      '        <stop offset="50%" stop-color="#f59e0b"/>',
      '        <stop offset="100%" stop-color="#78350f"/>',
      "      </linearGradient>",
      "    </defs>",
      '    <ellipse cx="100" cy="170" rx="88" ry="12" fill="rgba(2,6,23,0.55)"/>',
      '    <rect x="34" y="150" width="132" height="20" rx="10" fill="url(#' + uid + '-gold)" stroke="#0f172a" stroke-width="2.2"/>',
      '    <polygon points="78,150 122,150 110,18 90,18" fill="#334155" stroke="#94a3b8" stroke-width="2"/>',
      '    <circle cx="100" cy="18" r="22" fill="url(#' + uid + '-gold)" stroke="#0f172a" stroke-width="2.5"/>',
      '    <circle cx="100" cy="18" r="9" fill="' + (isBalanced ? "#10b981" : "#ef4444") + '"/>',
      "  </svg>",
      "</div>"
    ].join("");
  }

   * 7. StageProps.arenaRing(activeRoleIndex, defenderActive)
   * 6-Peer Salmivalli Circle around Sami & Rami + Emerald Defender Wave
   * ======================================================================== */
  var ARENA_ROLES = [
    { idx: 1, key: "ringleader", charId: "rami",  mood: "smirk",     tag: "1 • المتنمّر القائد", tone: "crimson", x: 77, y: 20 },
    { idx: 2, key: "assistant",  charId: "walid", mood: "smirk",     tag: "2 • المساعد التابع",  tone: "amber",   x: 90, y: 52 },
    { idx: 3, key: "reinforcer", charId: "majed", mood: "laugh",     tag: "3 • المعزّز الضاحك",  tone: "amber",   x: 75, y: 82 },
    { idx: 4, key: "victim",     charId: "sami",  mood: "sad",       tag: "4 • المستهدف المعزول", tone: "cyan",    x: 25, y: 82 },
    { idx: 5, key: "defender",   charId: "sara",  mood: "empowered", tag: "5 • المدافعة الشجاعة", tone: "emerald", x: 10, y: 52 },
    { idx: 6, key: "outsider",   charId: "ziad",  mood: "anxious",   tag: "6 • المتفرّج الصامت", tone: "slate",   x: 23, y: 20 }
  ];

  function resolveRoleIndex(raw) {
    if (typeof raw === "number" && raw >= 1 && raw <= 6) return Math.round(raw);
    if (typeof raw === "string") {
      var s = raw.toLowerCase().trim();
      if (/^[1-6]$/.test(s)) return parseInt(s, 10);
      for (var i = 0; i < ARENA_ROLES.length; i++) {
        if (ARENA_ROLES[i].key === s) return ARENA_ROLES[i].idx;
      }
      if (s === "bully") return 1;
      if (s === "target") return 4;
      if (s === "bystander") return 6;
    }
    return 0;
  }

  function arenaRing(activeRoleIndex, defenderActive) {
    ensureStagePropsCss();
    var uid = nextPropUid("arn");

    var isDefenderWave = Boolean(defenderActive);
    var activeIdx = resolveRoleIndex(activeRoleIndex);
    if (isDefenderWave && activeIdx === 0) {
      activeIdx = 5;
    }

    var nodesHtml = [];
    var spokesSvg = [];

    for (var i = 0; i < ARENA_ROLES.length; i++) {
      var r = ARENA_ROLES[i];
      var isSpotlit = activeIdx === r.idx || (isDefenderWave && r.idx === 5);
      var stateCls = activeIdx === 0 && !isDefenderWave
        ? "is-witness-ring"
        : (isSpotlit ? "is-active" : "is-dim");

      var pal = TONE_PALETTE[r.tone] || TONE_PALETTE.cyan;
      var nodeMood = r.mood;
      if (activeIdx === 0 && !isDefenderWave) {
        nodeMood = "neutral";
      } else if (isDefenderWave && r.idx === 1) {
        nodeMood = "shocked";
      } else if (isDefenderWave && r.idx === 4) {
        nodeMood = "empowered";
      }

      var miniChar = renderStoryChar(r.charId, nodeMood, {
        size: isSpotlit ? 92 : 78,
        hideLabel: true
      });

      var pillText = activeIdx === 0 && !isDefenderWave ? "شاهد صامت" : r.tag;

      nodesHtml.push(
        '<div class="sp-arena-node ' + stateCls + '" style="left:' + r.x + "%; top:" + r.y + "%; --node-glow:" + pal.glow + "; --node-bg:" + pal.bg + "; --node-border:" + pal.border + "; --node-text:" + pal.text + ';">' +
        miniChar +
        '<span class="sp-arena-role-pill">' + escapeHtml(pillText) + "</span>" +
        "</div>"
      );

      var sx = Math.round(r.x * 8.8);
      var sy = Math.round(r.y * 4.4);
      spokesSvg.push(
        '<line x1="440" y1="220" x2="' + sx + '" y2="' + sy + '" stroke="' + pal.main + '" stroke-width="' + (isSpotlit ? "3.2" : "1.4") + '" stroke-dasharray="' + (isSpotlit ? "none" : "5 6") + '" opacity="' + (isSpotlit ? "0.85" : "0.24") + '"/>'
      );
    }

    // Center Encounter: Rami & Sami
    var centerRami = renderStoryChar("rami", isDefenderWave ? "shocked" : "smirk", {
      size: 124,
      label: "رامي",
      role: false

    var centerSami = renderStoryChar("sami", isDefenderWave ? "empowered" : "sad", {
      size: 120,
      label: "سامي",
      role: false,
      flip: true
    });

    var centerFxSvg = isDefenderWave
      ? [
          // Sara's Emerald-Gold Shield Explosion Shattering Rami's Red Aura!

          '<circle class="sp-shield-wave-1" cx="440" cy="220" r="40" fill="none" stroke="#10b981"/>',
          '<circle class="sp-shield-wave-2" cx="440" cy="220" r="40" fill="none" stroke="#fbbf24"/>',
          // Protective emerald shield arc between Sara/Sami and Rami
          '<path d="M438 134 Q404 220 438 306" fill="none" stroke="#34d399" stroke-width="5" stroke-linecap="round"/>',
          // Shattered crimson fragments flying off Rami's broken aura
          '<g fill="#ef4444" opacity="0.88">',
          '  <polygon points="515,152 529,144 524,162"><animateTransform attributeName="transform" type="translate" values="0,0; 18,-14; 0,0" dur="1.8s" repeatCount="indefinite"/></polygon>',
          '  <polygon points="536,214 552,208 545,226"><animateTransform attributeName="transform" type="translate" values="0,0; 22,4; 0,0" dur="1.6s" repeatCount="indefinite"/></polygon>',
          '  <polygon points="512,276 528,284 516,294"><animateTransform attributeName="transform" type="translate" values="0,0; 16,16; 0,0" dur="1.9s" repeatCount="indefinite"/></polygon>',
          "</g>"
        ].join("")
      : [
          // Red Dominance Pressure Aura around center before intervention
          '<circle cx="440" cy="220" r="112" fill="url(#' + uid + '-redCore)">',

    return [
      '<div class="sp-stage-wrap sp-arena-stage">',

      "    <defs>",
      '      <radialGradient id="' + uid + '-redCore" cx="50%" cy="50%" r="50%">',
      '        <stop offset="0%" stop-color="#ef4444" stop-opacity="0.34"/>',

      '        <stop offset="100%" stop-color="#ef4444" stop-opacity="0"/>',
      "      </radialGradient>",
      '      <radialGradient id="' + uid + '-emeraldCore" cx="50%" cy="50%" r="50%">',

      "      </radialGradient>",
      "    </defs>",
      '    <ellipse cx="440" cy="220" rx="348" ry="156" fill="none" stroke="' + (isDefenderWave ? "#34d399" : "#38bdf8") + '" stroke-width="2" stroke-dasharray="8 8" opacity="0.42"/>',
      "    " + spokesSvg.join(""),
      "    " + centerFxSvg,
      "  </svg>",

      "  </div>",
      "  " + nodesHtml.join(""),
      "</div>"
    ].join("");
  }

      canvasEl.width = Math.floor(width * dpr);
      canvasEl.height = Math.floor(height * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    function seedParticles() {
      particles = [];
      for (var i = 0; i < PARTICLE_COUNT; i++) {
        particles.push({
          x: Math.random() * width,
          y: Math.random() * height,
          r: 1.3 + Math.random() * 2.6,
          phase: Math.random() * Math.PI * 2,
          alt: i % 2,
          speed: 0.55 + Math.random() * 0.9
        });
      }
    }

    function lerp(a, b, t) {
      return a + (b - a) * t;
    }

    function renderFrame(now) {
      requestAnimationFrame(renderFrame);
      if (document.hidden || document.documentElement.getAttribute("data-project-locked") === "true") return;

      var pal = MOOD_PALETTES[currentMood] || MOOD_PALETTES.dusk;
      for (var k = 0; k < 3; k++) {
        curC1[k] = lerp(curC1[k], pal.c1[k], 0.045);
        curC2[k] = lerp(curC2[k], pal.c2[k], 0.045);
      }
      curGlowY = lerp(curGlowY, pal.glowY, 0.04);

      ctx.clearRect(0, 0, width, height);

      var grad = ctx.createRadialGradient(
        width * 0.5,
        height * curGlowY,
        24,
        width * 0.5,
        height * 0.5,
        Math.max(width, height) * 0.68
      );
      var glowAlpha = isLight ? 0.08 : 0.15;
      grad.addColorStop(
        0,
        "rgba(" +
          Math.round(curC1[0]) +
          "," +
          Math.round(curC1[1]) +
          "," +
          Math.round(curC1[2]) +
          "," +
          glowAlpha +
          ")"
      );
      grad.addColorStop(1, "rgba(0,0,0,0)");
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, width, height);

      var baseAlpha = isLight ? 0.3 : 0.46;
      var t = (now || 0) * 0.001;

      for (var i = 0; i < particles.length; i++) {
        var p = particles[i];
        p.x += pal.vx * p.speed + Math.sin(t + p.phase) * 0.16;
        p.y += pal.vy * p.speed + Math.cos(t * 0.85 + p.phase) * 0.13;

        if (p.x < -14) p.x = width + 14;
        if (p.x > width + 14) p.x = -14;
        if (p.y < -14) p.y = height + 14;
        if (p.y > height + 14) p.y = -14;

        var col = p.alt === 0 ? curC1 : curC2;
        var pulse = 0.62 + 0.38 * Math.sin(t * 1.65 + p.phase);
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fillStyle =
          "rgba(" +
          Math.round(col[0]) +
          "," +
          Math.round(col[1]) +
          "," +
          Math.round(col[2]) +
          "," +
          (baseAlpha * pulse).toFixed(3) +
          ")";
        ctx.fill();

        if (pal.links) {
          for (var j = i + 1; j < particles.length; j++) {
            var q = particles[j];
            var dx = p.x - q.x;
            var dy = p.y - q.y;
            var d2 = dx * dx + dy * dy;
            if (d2 < 12800) {
              var lAlpha = (1 - d2 / 12800) * (isLight ? 0.075 : 0.125);
              ctx.beginPath();
              ctx.moveTo(p.x, p.y);
              ctx.lineTo(q.x, q.y);
              ctx.strokeStyle =
                "rgba(" +
                Math.round(curC1[0]) +
                "," +
                Math.round(curC1[1]) +
                "," +
                Math.round(curC1[2]) +
                "," +
                lAlpha.toFixed(3) +
                ")";
              ctx.lineWidth = 0.75;
              ctx.stroke();
            }
          }
        }
      }
    }

    resize();
    seedParticles();
    window.addEventListener("resize", resize);
    requestAnimationFrame(renderFrame);

    return {
      setMood: function (mood) {
        currentMood = mood || "dusk";
      },
      setTheme: function (theme) {
        isLight = theme === "light";
      }
    };
  }

     6. StoryEngine — Bite-Sized Visual Story Engine (80 Beats)
     ------------------------------------------------------------------------ */
  var AUTOPLAY_INTERVAL_MS = 3800; // Strictly 3.8 seconds per beat

  var StoryEngine = {
    _initialized: false,
    beats: [],
    chapters: [],
    references: [],
    currentIndex: 0,
    theme: "dark",
    arrowReversed: false, // false = PowerPoint default: ArrowRight -> next(), ArrowLeft -> prev()
    autoPlaying: false,
    drawerOpen: false,
    refsOpen: false,
    refCategory: "all",
    refQuery: "",
    _autoTimer: null,
    _animTimer: null,
    _toastTimer: null,
    _canvasCtrl: null,
    _els: {},

    collectBeats: function () {
      var combined = []
        .concat(Array.isArray(window.BEATS_PART1) ? window.BEATS_PART1 : [])
        .concat(Array.isArray(window.BEATS_PART2) ? window.BEATS_PART2 : [])
        .concat(Array.isArray(window.BEATS_PART3) ? window.BEATS_PART3 : []);

      if (!combined.length && Array.isArray(window.STORY_BEATS)) {
        combined = window.STORY_BEATS.slice();
      }

      combined.sort(function (a, b) {
        return (Number(a.num) || 0) - (Number(b.num) || 0);
      });
      return combined;
    },

    _buildChaptersIndex: function () {
      var byChapter = {};
      var list = [];
      var total = this.beats.length || 1;

      for (var i = 0; i < this.beats.length; i++) {
        var b = this.beats[i];
        var chNum = typeof b.chapter === "number" ? b.chapter : 0;
        if (!byChapter[chNum]) {
          var title = toWesternDigits(b.chapterTitle || CHAPTER_NAMES[chNum] || "الفصل " + (chNum + 1));
          byChapter[chNum] = {
            chapter: chNum,
            title: title,
            firstIndex: i,
            lastIndex: i,
            startPct: total <= 1 ? 0 : (i / (total - 1)) * 100,
            items: []
          };
          list.push(byChapter[chNum]);
        }
        byChapter[chNum].lastIndex = i;
        byChapter[chNum].items.push({ beat: b, index: i });
      }
      return list;
    },

    init: function (mountTarget) {
      if (this._initialized) return this;
      this.beats = this.collectBeats();
      if (!this.beats.length) return this;

      this._initialized = true;
      this.chapters = this._buildChaptersIndex();
      this.references = resolveReferencesList();

      injectEngineFallbackStyles();

      var shell = null;
      if (typeof mountTarget === "string") {
        shell = document.querySelector(mountTarget);
      } else if (mountTarget && mountTarget.nodeType === 1) {
        shell = mountTarget;
      } else {
        shell = document.getElementById("app-shell");
      }

      if (!shell) {
        shell = document.createElement("div");
        shell.id = "app-shell";
        document.body.insertBefore(shell, document.body.firstChild);

        '<span class="se-modal-title">📋 خريطة محاور البحث</span>' +

        this.references.length +

      this._els = {

        refsList: shell.querySelector('[data-role="refs-list"]'),

    _cleanupCurrentBeat: function () {
      var sceneEl = this._els.stageScene;
      if (!sceneEl) return;
      if (typeof sceneEl._cleanup === "function") {
        try {
          sceneEl._cleanup();
        } catch (e) {}
        sceneEl._cleanup = null;
      }
      var curBeat = this.beats[this.currentIndex];
      if (curBeat && typeof curBeat.onLeave === "function") {
        try {
          curBeat.onLeave(sceneEl);
        } catch (e) {}
      }
    },

    _renderBeat: function (targetIndex, prevBeat, direction, silent) {
      var beat = this.beats[targetIndex];
      if (!beat) return;

      var sceneEl = this._els.stageScene;
      var sameStage = Boolean(
        prevBeat &&
          prevBeat.stageId &&
          beat.stageId &&
          prevBeat.stageId === beat.stageId
      );

      // 1. Sync mood & ambient particle canvas immediately
      var mood = beat.mood || "dusk";
      this._els.shell.setAttribute("data-mood", mood);
      if (this._canvasCtrl) {
        this._canvasCtrl.setMood(mood);
      }

      // 2. Render visual stage HTML into .stage-scene with smart transition class
      if (this._animTimer) {
        clearTimeout(this._animTimer);
        this._animTimer = null;
      }

      sceneEl.classList.remove("same-stage-morph", "new-stage-enter-next", "new-stage-enter-prev");

      var visualMarkup = "";
      try {
        if (typeof beat.visualHtml === "function") {
          visualMarkup = beat.visualHtml();
        } else if (typeof beat.renderStage === "function") {
          visualMarkup = beat.renderStage();
        } else if (typeof beat.html === "string") {
          visualMarkup = beat.html;
        }
      } catch (err) {
        console.error("Error rendering beat " + (beat.num || targetIndex + 1), err);
        visualMarkup = "";
      }

      sceneEl.innerHTML = toWesternDigits(visualMarkup || "");
      sceneEl.setAttribute("data-stage-id", beat.stageId || "");
      sceneEl.setAttribute("data-beat-num", String(beat.num || targetIndex + 1));
      sceneEl.setAttribute("data-chapter", String(typeof beat.chapter === "number" ? beat.chapter : 0));

      var animClass = sameStage
        ? "same-stage-morph"
        : direction === "prev"
          ? "new-stage-enter-prev"
          : "new-stage-enter-next";

      // Force clean reflow so rapid key presses reliably restart CSS animations
      void sceneEl.offsetWidth;
      sceneEl.classList.add(animClass);

      var animDuration = sameStage ? 360 : 540;
      this._animTimer = setTimeout(function () {
        sceneEl.classList.remove("same-stage-morph", "new-stage-enter-next", "new-stage-enter-prev");
      }, animDuration);

      // 3. Update single-sentence caption (.caption-text + .caption-pop) & optional .source-chip
      var captionEl = this._els.captionText;
      if (captionEl) {
        captionEl.classList.remove("caption-pop");
        captionEl.textContent = toWesternDigits(beat.caption || "");
        void captionEl.offsetWidth;
        captionEl.classList.add("caption-pop");
      }

      var chipEl = this._els.sourceChip;
      var srcTag = toWesternDigits(beat.sourceTag || "").trim();
      if (chipEl) {
        if (srcTag) {
          chipEl.textContent = srcTag;
          chipEl.hidden = false;
          chipEl.classList.add("is-visible");
        } else {
          chipEl.textContent = "";
          chipEl.hidden = true;
          chipEl.classList.remove("is-visible");
        }
      }

      // 4. Sync Topbar & Bottombar HUD
      this._syncHUD(beat, targetIndex);

      // 5. Play beat SFX (or whisper-subtle transition cue)
      if (!silent) {
        if (beat.sfx) {
          SoundSynth.play(beat.sfx);
        } else {
          SoundSynth.play(sameStage ? "morph" : "whoosh");
        }
      }

      // 6. Attach interactive handlers if beat defines onEnter(stageRoot)
      var enterFn = beat.onEnter || beat.onMount;
      if (typeof enterFn === "function") {
        try {
          enterFn.call(beat, sceneEl, this);
        } catch (err) {
          console.error("Error in onEnter for beat " + (beat.num || targetIndex + 1), err);
        }
      }
    },

    _syncHUD: function (beat, idx) {
      var total = this.beats.length;
      var chNum = typeof beat.chapter === "number" ? beat.chapter : 0;
      var chTitle = toWesternDigits(beat.chapterTitle || CHAPTER_NAMES[chNum] || "الفصل " + (chNum + 1));

      if (this._els.chapterTitle) {
        this._els.chapterTitle.textContent = chTitle;
      } else if (this._els.chapterPill) {
        this._els.chapterPill.textContent = chTitle;
      }

      if (this._els.counter) {
        this._els.counter.textContent = (idx + 1) + " / " + total;
      }

      if (this._els.progressFill) {
        var pct = total <= 1 ? 100 : ((idx + 1) / total) * 100;
        this._els.progressFill.style.width = pct.toFixed(2) + "%";
      }

      if (this._els.prevBtn) {
        this._els.prevBtn.disabled = idx <= 0;
      }
      if (this._els.nextBtn) {
        this._els.nextBtn.disabled = idx >= total - 1;
      }

      for (var i = 0; i < this._els.chapterTicks.length; i++) {
        var tick = this._els.chapterTicks[i];
        var tickCh = parseInt(tick.getAttribute("data-chapter-tick"), 10);
        var tickIdx = parseInt(tick.getAttribute("data-goto-index"), 10);
        tick.classList.toggle("is-current", tickCh === chNum);
        tick.classList.toggle("is-reached", idx >= tickIdx);
      }

      for (var c = 0; c < this._els.drawerChips.length; c++) {
        var chip = this._els.drawerChips[c];
        chip.classList.toggle("is-active", parseInt(chip.getAttribute("data-drawer-chapter"), 10) === chNum);
      }

      for (var b = 0; b < this._els.beatTiles.length; b++) {
        this._els.beatTiles[b].classList.toggle("is-current", b === idx);
      }
    },

    goTo: function (targetIndex, opts) {
      var options = opts || {};
      var total = this.beats.length;
      if (!total) return false;

      var clamped = Math.max(0, Math.min(total - 1, targetIndex));
      if (clamped !== targetIndex && !options.clamp) return false;
      if (clamped === this.currentIndex && !options.force) return false;

      var prevBeat = this.beats[this.currentIndex] || null;
      var direction = options.direction || (clamped >= this.currentIndex ? "next" : "prev");

      this._cleanupCurrentBeat();
      this.currentIndex = clamped;
      this._renderBeat(clamped, prevBeat, direction, Boolean(options.silent));

      if (this.autoPlaying) {
        this._scheduleAutoAdvance();
      }
      return true;
    },

    goToBeat: function (beatNum) {
      var n = parseInt(toWesternDigits(beatNum), 10);
      if (isNaN(n)) return false;
      for (var i = 0; i < this.beats.length; i++) {
        if (Number(this.beats[i].num) === n) {
          return this.goTo(i);
        }
      }
      if (n >= 1 && n <= this.beats.length) {
        return this.goTo(n - 1);
      }
      return false;
    },

    goToSceneNum: function (num) {
      return this.goToBeat(num);
    },

    next: function () {
      if (this.currentIndex >= this.beats.length - 1) return false;
      return this.goTo(this.currentIndex + 1, { direction: "next" });
    },

    goNext: function () {
      return this.next();
    },

    prev: function () {
      if (this.currentIndex <= 0) {
        this._showBeatOneArrowHint();
        return false;
      }
      return this.goTo(this.currentIndex - 1, { direction: "prev" });
    },

    goPrev: function () {
      return this.prev();
    },

    nextChapter: function () {
      if (!this.chapters.length) return false;
      var curBeat = this.beats[this.currentIndex];
      var curCh = curBeat && typeof curBeat.chapter === "number" ? curBeat.chapter : 0;

      for (var i = 0; i < this.chapters.length; i++) {
        if (this.chapters[i].chapter > curCh) {
          var target = this.chapters[i];
          this.goTo(target.firstIndex, { direction: "next" });
          this.showToast("⏭ الفصل " + (target.chapter + 1) + ": " + target.title, 2100);
          return true;
        }
      }

      if (this.currentIndex < this.beats.length - 1) {
        return this.goTo(this.beats.length - 1, { direction: "next" });
      }
      this.showToast("✨ أنت في الفصل الختامي", 1800);
      return false;
    },

    prevChapter: function () {
      if (!this.chapters.length) return false;
      var curBeat = this.beats[this.currentIndex];
      var curCh = curBeat && typeof curBeat.chapter === "number" ? curBeat.chapter : 0;

      // Find current chapter entry
      var curChIndex = 0;
      for (var i = 0; i < this.chapters.length; i++) {
        if (this.chapters[i].chapter === curCh) {
          curChIndex = i;
          break;
        }
      }

      var currentChapterObj = this.chapters[curChIndex];
      // If deep inside current chapter, jump to start of current chapter; if already at start, jump to previous chapter
      var targetChapterObj =
        currentChapterObj && this.currentIndex > currentChapterObj.firstIndex
          ? currentChapterObj
          : curChIndex > 0
            ? this.chapters[curChIndex - 1]
            : this.chapters[0];

      if (!targetChapterObj) return false;
      if (this.currentIndex === 0) {
        this._showBeatOneArrowHint();
        return false;
      }

      this.goTo(targetChapterObj.firstIndex, { direction: "prev" });
      this.showToast("⏮ الفصل " + (targetChapterObj.chapter + 1) + ": " + targetChapterObj.title, 2100);
      return true;
    },

    restart: function () {
      this.closeRefs();
      this.closeDrawer();
      if (this.autoPlaying) {
        this.toggleAutoPlay(false);
      }
      SoundSynth.play("chime");
      return this.goTo(0, { direction: "prev", force: true, silent: true });
    },

    _showBeatOneArrowHint: function () {
      SoundSynth.play("ping");
      if (!this.arrowReversed) {
        this.showToast("💡 أنت في اللقطة 1 — اضغط السهم الأيمن (→) للمتابعة، أو ⇄ لعكس اتجاه الأسهم", 3400);
      } else {
        this.showToast("💡 أنت في اللقطة 1 — اضغط السهم الأيسر (←) للمتابعة، أو ⇄ لإعادة وضع PowerPoint", 3400);
      }
    },

    toggleTheme: function () {
      this.theme = this.theme === "dark" ? "light" : "dark";
      this._els.shell.setAttribute("data-theme", this.theme);
      document.documentElement.setAttribute("data-theme", this.theme);
      if (this._els.themeBtn) {
        this._els.themeBtn.textContent = this.theme === "light" ? "🌙" : "☀️";
      }
      if (this._canvasCtrl) {
        this._canvasCtrl.setTheme(this.theme);
      }
      SoundSynth.play("ui");
      this.showToast(
        this.theme === "light" ? "☀️ الوضع النهاري عالي التباين" : "🌙 الوضع الليلي السينمائي",
        2000
      );
    },

    toggleSound: function () {
      SoundSynth.enabled = !SoundSynth.enabled;
      if (this._els.soundBtn) {
        this._els.soundBtn.textContent = SoundSynth.enabled ? "🔊" : "🔇";
        this._els.soundBtn.classList.toggle("is-active", SoundSynth.enabled);
        this._els.soundBtn.setAttribute("aria-pressed", SoundSynth.enabled ? "true" : "false");
      }
      if (SoundSynth.enabled) {
        SoundSynth.play("ui");
      }
      this.showToast(SoundSynth.enabled ? "🔊 المؤثرات الصوتية مفعّلة" : "🔇 تم كتم المؤثرات الصوتية", 1900);
    },

    togglePolarity: function () {
      this.arrowReversed = !this.arrowReversed;
      if (this._els.polarityBtn) {
        this._els.polarityBtn.classList.toggle("is-active", this.arrowReversed);
        this._els.polarityBtn.setAttribute("aria-pressed", this.arrowReversed ? "true" : "false");
      }
      SoundSynth.play("ui");
      this.showToast(
        this.arrowReversed
          ? "⇄ تم عكس الأسهم: (←) للقطة التالية • (→) للقطة السابقة"
          : "⇄ وضع PowerPoint الافتراضي: (→) للقطة التالية • (←) للقطة السابقة",
        2900
      );
    },

    toggleArrowPolarity: function () {
      return this.togglePolarity();
    },

    _scheduleAutoAdvance: function () {

  function getStorageKeyV2(exportId) {
    var pathKey = (global.location && global.location.pathname) ? global.location.pathname : (document.title || "presentation");
    return "ps_studio_state_v2::" + (exportId || "origin") + "::" + pathKey;
  }

  function getLegacyStorageKeyV1(exportId) {
    var pathKey = (global.location && global.location.pathname) ? global.location.pathname : (document.title || "presentation");
    return "ps_studio_state_v1::" + (exportId || "origin") + "::" + pathKey;
  }

  function idbSave(key, payload) {
    try {
      if (!global.indexedDB) return;
      var req = global.indexedDB.open("PresentationStudioDB", 1);
      req.onupgradeneeded = function (e) {
        var db = e.target.result;
        if (!db.objectStoreNames.contains("states")) {
          db.createObjectStore("states");
        }
      };
      req.onsuccess = function (e) {
        var db = e.target.result;
        var tx = db.transaction("states", "readwrite");
        tx.objectStore("states").put(payload, key);
      };
    } catch (e) {}
  }

  function idbLoad(key, callback) {
    try {
      if (!global.indexedDB) {
        callback(null);
        return;
      }
      var req = global.indexedDB.open("PresentationStudioDB", 1);
      req.onupgradeneeded = function (e) {
        var db = e.target.result;
        if (!db.objectStoreNames.contains("states")) {
          db.createObjectStore("states");
        }
      };
      req.onsuccess = function (e) {
        try {
          var db = e.target.result;
          if (!db.objectStoreNames.contains("states")) {
            callback(null);
            return;
          }
          var getReq = db.transaction("states", "readonly").objectStore("states").get(key);
          getReq.onsuccess = function () {
            callback(getReq.result || null);
          };
          getReq.onerror = function () {
            callback(null);
          };
        } catch (err) {
          callback(null);
        }
      };
      req.onerror = function () {
        callback(null);
      };
    } catch (e) {
      callback(null);
    }
  }

  function idbClear(key) {
    try {
      if (!global.indexedDB) return;
      var req = global.indexedDB.open("PresentationStudioDB", 1);
      req.onsuccess = function (e) {
        var db = e.target.result;
        if (db.objectStoreNames.contains("states")) {
          db.transaction("states", "readwrite").objectStore("states").delete(key);
        }
      };
    } catch (e) {}
  }

  function optimizeUploadedImageFile(file, callback) {
    var reader = new FileReader();
    reader.onload = function () {
      var rawDataUrl = String(reader.result || "");
      if (!rawDataUrl || String(file.type || "").indexOf("svg") !== -1) {
        callback(rawDataUrl);
        return;
      }
      var img = new Image();
      img.onload = function () {
        var maxDim = 1150;
        var w = img.naturalWidth || img.width || 0;
        var h = img.naturalHeight || img.height || 0;
        if (w > 0 && h > 0 && (w > maxDim || h > maxDim || file.size > 340 * 1024)) {
          var ratio = Math.min(1, maxDim / Math.max(w, h));
          var cw = Math.max(1, Math.round(w * ratio));
          var ch = Math.max(1, Math.round(h * ratio));
          try {
            var canvas = document.createElement("canvas");
            canvas.width = cw;
            canvas.height = ch;
            var ctx = canvas.getContext("2d");
            ctx.drawImage(img, 0, 0, cw, ch);
            var webp = canvas.toDataURL("image/webp", 0.86);
            if (webp && webp.indexOf("data:image/webp") === 0 && webp.length < rawDataUrl.length) {
              callback(webp);
              return;
            }
            var png = canvas.toDataURL("image/png");
            if (png && png.length < rawDataUrl.length) {
              callback(png);
              return;
            }
          } catch (err) {}
        }
        callback(rawDataUrl);
      };
      img.onerror = function () {
        callback(rawDataUrl);
      };
      img.src = rawDataUrl;
    };
    reader.readAsDataURL(file);
  }

  /* ==========================================================================
     7. MAIN PRESENTATION STUDIO PRO v2 CONTROLLER

  function createStudio() {
    injectMotionAndStudioStyles();

    var adapter = null;
    var exportScopeId = (BAKED_PAYLOAD && BAKED_PAYLOAD.exportId) ? BAKED_PAYLOAD.exportId : "origin";
    var storageKey = getStorageKeyV2(exportScopeId);
    var legacyStorageKey = getLegacyStorageKeyV1(exportScopeId);

    var studioState = {
      version: 2,
      exportId: exportScopeId,
      readonly: Boolean(BAKED_PAYLOAD && BAKED_PAYLOAD.readonly),
      savedAt: 0,
      globalTheme: {
        paletteId: "",
        fontFamily: "",
        googleFont: "",
        fontScalePct: 100,
        transition: ""
      },
      customFonts: [],
      pageOrder: [],
      customPages: {},
      pages: {}
    };

    var editMode = false;
    var hasSavedEdits = false;
    var undoStack = [];
    var redoStack = [];
    var studioClipboard = null;
    var selection = null;
    var activeModal = null;
    var activeFrameModalTab = "frames";
    var activeThemeModalTab = "slide";
    var activeCharTab = "all";
    var charSearchQuery = "";
    var selectedCastMood = "";

    var toastTimer = null;
    var bypassInteractiveClick = false;
    var motionPreviewNonce = 0;

    function ensurePageRecord(pageUid) {
      if (!studioState.pages[pageUid]) {
        studioState.pages[pageUid] = {
          background: { presetId: "", customColor: "", customImage: "", patternOpacity: 100 },
          textOverrides: {},
          frames: [],
          shapes: [],
          addedChars: [],
          nativeCharOverrides: {}
        };
      } else {
        var pr = studioState.pages[pageUid];
        if (!pr.background) pr.background = { presetId: "", customColor: "", customImage: "", patternOpacity: 100 };
        if (!pr.textOverrides) pr.textOverrides = {};
        if (!Array.isArray(pr.frames)) pr.frames = [];
        if (!Array.isArray(pr.shapes)) pr.shapes = [];
        if (!Array.isArray(pr.addedChars)) pr.addedChars = [];
        if (!pr.nativeCharOverrides) pr.nativeCharOverrides = {};
      }
      return studioState.pages[pageUid];
    }

    function registerUsedGoogleFont(fontObjOrName) {
      if (!fontObjOrName) return;
      ensureGoogleFontLoaded(fontObjOrName);
      var gfName = typeof fontObjOrName === "object"
        ? (fontObjOrName.googleFamily || fontObjOrName.name || "")
        : String(fontObjOrName).split(",")[0].replace(/['"]/g, "").trim();
      if (gfName && studioState.customFonts.indexOf(gfName) === -1) {
        studioState.customFonts.push(gfName);
      }
    }

    function hydrateSavedGoogleFonts() {
      if (Array.isArray(studioState.customFonts)) {
        for (var i = 0; i < studioState.customFonts.length; i++) {
          ensureGoogleFontLoaded(studioState.customFonts[i]);
        }
      }
      if (studioState.globalTheme && studioState.globalTheme.googleFont) {
        ensureGoogleFontLoaded(studioState.globalTheme.googleFont);
      }
    }

    function captureHistorySnapshot() {
      return deepClone({
        globalTheme: studioState.globalTheme,
        customFonts: studioState.customFonts,
        pageOrder: studioState.pageOrder,
        customPages: studioState.customPages,
        pages: studioState.pages
      });
    }

    function pushUndoSnapshot() {
      undoStack.push(captureHistorySnapshot());
      if (undoStack.length > 50) undoStack.shift();
      redoStack = [];
      syncDockState();
    }

    function restoreFromHistorySnapshot(snap) {
      var curUid = adapter.getCurrentPageUid();
      studioState.globalTheme = snap.globalTheme || { paletteId: "", fontFamily: "", googleFont: "", fontScalePct: 100, transition: "" };
      studioState.customFonts = snap.customFonts || [];
      studioState.pageOrder = snap.pageOrder;
      studioState.customPages = snap.customPages || {};
      studioState.pages = snap.pages || {};
      activeTextUndoKey = null;
      clearSelection();
      hydrateSavedGoogleFonts();
      resetPersistentModifiedElements();
      adapter.hydrateModelTexts(studioState.pages);
      var nextIdx = studioState.pageOrder.indexOf(curUid);
      adapter.rebuildPages(studioState.pageOrder, studioState.customPages, nextIdx >= 0 ? nextIdx : 0);
      applyGlobalThemeOverrides();
      applyAllStageOverrides();
      scheduleAutoSave();
      syncDockState();
    }

    function performUndo() {
      if (!undoStack.length) return;
      redoStack.push(captureHistorySnapshot());
      if (redoStack.length > 50) redoStack.shift();
      var prev = undoStack.pop();
      restoreFromHistorySnapshot(prev);
      showToast("تم التراجع عن الخطوة ↶ (" + undoStack.length + ")");
    }

    function performRedo() {
      if (!redoStack.length) return;
      undoStack.push(captureHistorySnapshot());
      if (undoStack.length > 50) undoStack.shift();
      var next = redoStack.pop();
      restoreFromHistorySnapshot(next);
      showToast("تمت إعادة الخطوة ↷ (" + redoStack.length + ")");
    }

    function applyLoadedStateObject(loaded) {
      if (!loaded || typeof loaded !== "object") return;
      if (Array.isArray(loaded.pageOrder) && loaded.pageOrder.length) {
        studioState.pageOrder = loaded.pageOrder.slice();
      }
      studioState.customPages = loaded.customPages || {};
      studioState.pages = loaded.pages || {};
      if (loaded.globalTheme) {
        studioState.globalTheme = Object.assign({
          paletteId: "", fontFamily: "", googleFont: "", fontScalePct: 100, transition: ""
        }, loaded.globalTheme);
      }
      if (Array.isArray(loaded.customFonts)) {
        studioState.customFonts = loaded.customFonts.slice();
      }
      studioState.savedAt = loaded.savedAt || Date.now();
      hasSavedEdits = true;
      hydrateSavedGoogleFonts();
    }

    function loadInitialState(initialOrder) {
      studioState.pageOrder = initialOrder.slice();
      var loaded = null;

      if (BAKED_PAYLOAD && BAKED_PAYLOAD.state) {
        loaded = deepClone(BAKED_PAYLOAD.state);
      }

      try {
        if (global.localStorage) {
          var rawV2 = global.localStorage.getItem(storageKey);
          var rawV1 = global.localStorage.getItem(legacyStorageKey);
          var candV2 = rawV2 ? JSON.parse(rawV2) : null;
          var candV1 = rawV1 ? JSON.parse(rawV1) : null;
          var bestLocal = candV2;
          if (candV1 && (!bestLocal || (candV1.savedAt || 0) > (bestLocal.savedAt || 0))) {
            bestLocal = candV1;
          }
          if (bestLocal && (!loaded || (bestLocal.savedAt || 0) >= (loaded.savedAt || 0))) {
            loaded = bestLocal;
          }
        }
      } catch (e) {}

      if (loaded) {
        applyLoadedStateObject(loaded);
      }
    }

    function saveNow(showNotification) {
      studioState.savedAt = Date.now();
      hasSavedEdits = true;
      var serialized = JSON.stringify(studioState);
      var savedOk = false;
      try {
        if (global.localStorage) {
          global.localStorage.setItem(storageKey, serialized);
          savedOk = true;
        }
      } catch (e) {}
      idbSave(storageKey, studioState);
      updateEntryBadge();
      if (showNotification) {
        showToast(savedOk ? "تم حفظ جميع التغييرات محلياً ✓" : "تم حفظ التغييرات في قاعدة المتصفح ✓");
      }
      return savedOk;
    }

    function scheduleAutoSave() {
      if (autoSaveTimer) clearTimeout(autoSaveTimer);
      autoSaveTimer = setTimeout(function () {
        saveNow(false);
      }, 320);
    }

    function resetAllChanges() {
      try {
        if (global.localStorage) {
          global.localStorage.removeItem(storageKey);
          global.localStorage.removeItem(legacyStorageKey);
        }
      } catch (e) {}
      idbClear(storageKey);
      idbClear(legacyStorageKey);
      undoStack = [];
      redoStack = [];
      activeTextUndoKey = null;
      studioState.savedAt = 0;
      studioState.globalTheme = { paletteId: "", fontFamily: "", googleFont: "", fontScalePct: 100, transition: "" };
      studioState.customFonts = [];
      studioState.pageOrder = adapter.initialOrder.slice();
      studioState.customPages = {};
      studioState.pages = {};
      hasSavedEdits = false;
      clearSelection();
      resetPersistentModifiedElements();
      adapter.hydrateModelTexts(studioState.pages);
      adapter.rebuildPages(studioState.pageOrder, studioState.customPages, 0);
      applyGlobalThemeOverrides();
      applyAllStageOverrides();
      updateEntryBadge();
      closeModal();
      showToast("تمت استعادة النسخة الأصلية للعرض ✓");
    }

    /* ----------------------------------------------------------------------
       8. CLIPBOARD (COPY / PASTE ACROSS SLIDES) & JSON PROJECT EXPORT/IMPORT

    function copySelectedElement() {
      if (!selection) {
        showToast("حدّد عنصراً أولاً لنسخه");
        return false;
      }
      var model = getSelectedModel();
      if (!model) return false;

      if (selection.kind === "frame" || selection.kind === "shape" || selection.kind === "addedChar") {
        studioClipboard = { kind: selection.kind, data: deepClone(model) };
        syncDockState();
        showToast("تم نسخ العنصر — انتقل لأي شريحة واضغط Ctrl+V للصقه ✓");
        return true;
      }

      if (selection.kind === "text" || selection.kind === "svgText") {
        var txtContent = selection.el ? extractEditableText(selection.el) : (model.text || "");
        var compFs = selection.el ? (parseFloat(getComputedStyle(selection.el).fontSize) || 16) : 16;
        studioClipboard = {
          kind: "frame",
          data: {
            id: genUid("frame"),
            templateId: "editorial",
            style: "editorial",
            bg: model.bgColor || "#FFFDF9",
            fg: model.color || "#231F1D",
            borderColor: model.borderColor || "#BA4F45",
            borderWidth: typeof model.borderWidth === "number" ? model.borderWidth : 2,
            borderStyle: "solid",
            radius: 14,
            tail: "none",
            shadow: "soft",
            text: txtContent,
            fontFamily: model.fontFamily || "",
            fontSize: clamp(Math.round(compFs), 12, 48),
            fontWeight: model.fontWeight || "700",
            textAlign: model.textAlign || "right",
            x: 50,
            y: 50,
            width: 300,
            scale: 1,
            rotate: model.rotate || 0,
            opacity: model.opacity || 100,
            z: 52,
            motion: model.motion ? deepClone(model.motion) : null
          }
        };
        syncDockState();
        showToast("تم نسخ النص كبطاقة حرة جاهزة للصق في أي شريحة ✓");
        return true;
      }

      return false;
    }

    function pasteClipboardElement() {
      if (!studioClipboard || !studioClipboard.data) {
        showToast("الحافظة فارغة — انسخ عنصراً أولاً (Ctrl+C)");
        return false;
      }
      pushUndoSnapshot();
      var pageUid = adapter.getCurrentPageUid();
      var pageRec = ensurePageRecord(pageUid);
      var copy = deepClone(studioClipboard.data);
      copy.locked = false;
      copy.x = clamp((typeof copy.x === "number" ? copy.x : 50) + 4, 12, 88);
      copy.y = clamp((typeof copy.y === "number" ? copy.y : 50) + 4, 14, 86);

      if (studioClipboard.kind === "frame") {
        copy.id = genUid("frame");
        copy.z = 50 + pageRec.frames.length;
        pageRec.frames.push(copy);
        applyAllStageOverrides();
        var fEl = document.querySelector('.ps-frame-item[data-ps-frame-id="' + copy.id + '"]');
        if (fEl) selectItem({ kind: "frame", pageUid: pageUid, id: copy.id, el: fEl });
      } else if (studioClipboard.kind === "shape") {
        copy.id = genUid("shape");
        copy.z = 50 + pageRec.shapes.length;
        pageRec.shapes.push(copy);
        applyAllStageOverrides();
        var sEl = document.querySelector('.ps-shape-item[data-ps-shape-id="' + copy.id + '"]');
        if (sEl) selectItem({ kind: "shape", pageUid: pageUid, id: copy.id, el: sEl });
      } else if (studioClipboard.kind === "addedChar") {
        copy.id = genUid("char");
        copy.z = 52 + pageRec.addedChars.length;
        pageRec.addedChars.push(copy);
        applyAllStageOverrides();
        var cEl = document.querySelector('.ps-char-item[data-ps-added-char-id="' + copy.id + '"]');
        if (cEl) selectItem({ kind: "addedChar", pageUid: pageUid, id: copy.id, el: cEl });
      }

      scheduleAutoSave();
      showToast("تم لصق العنصر في الشريحة الحالية ✓");
      return true;
    }

    function exportProjectJson() {
      saveNow(false);
      var payload = {
        app: "PresentationStudioProV2",
        exportedAt: Date.now(),
        adapterKind: adapter ? adapter.kind : "generic",
        state: deepClone(studioState)
      };
      var blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json;charset=utf-8" });

      link.download = "presentation-project-v2.json";

    function importProjectJsonFile(file) {
      if (!file) return;
      var reader = new FileReader();
      reader.onload = function () {
        try {
          var parsed = JSON.parse(String(reader.result || ""));
          var nextState = (parsed && parsed.state && parsed.state.pages) ? parsed.state : (parsed && parsed.pages ? parsed : null);
          if (!nextState) {
            showToast("ملف JSON غير صالح لمشروع الاستوديو");
            return;

          pushUndoSnapshot();
          applyLoadedStateObject(nextState);

          resetPersistentModifiedElements();

          adapter.rebuildPages(studioState.pageOrder, studioState.customPages, 0);

          showToast("تعذّرت قراءة ملف JSON المحدّد");
        }
      };
      reader.readAsText(file);

    /* ----------------------------------------------------------------------
       9. EXPORT STANDALONE LOCAL HTML FILE WITH ALL EDITS BAKED IN
       ---------------------------------------------------------------------- */
    function buildStandaloneHtmlString(opts) {
      var options = opts || {};
      saveNow(false);

      var baseHtml = INITIAL_CLEAN_HTML || capturePristineSnapshot();
      var newExportId = "exp_" + Date.now().toString(36);
      var exportPayload = {
        exportId: newExportId,
        readonly: Boolean(options.readonly),
        exportedAt: Date.now(),
        state: deepClone(studioState)
      };

      var safeJson = JSON.stringify(exportPayload).replace(/</g, "\\u003c");
      var bakedTag = "<" + 'script id="ps-baked-state" type="application/json">' + safeJson + "<" + "/script>\n";

      var scriptAnchor = "<" + 'script id="ps-studio-script"';
      var anchorPos = baseHtml.indexOf(scriptAnchor);
      if (anchorPos !== -1) {
        return baseHtml.slice(0, anchorPos) + bakedTag + baseHtml.slice(anchorPos);
      }

      var bodyClose = baseHtml.lastIndexOf("<" + "/body>");
      if (bodyClose !== -1) {
        return baseHtml.slice(0, bodyClose) + bakedTag + baseHtml.slice(bodyClose);
      }
      return baseHtml + "\n" + bakedTag;
    }

    function downloadStandaloneHtml(opts) {
      var options = opts || {};
      var htmlContent = buildStandaloneHtmlString(options);
      var rawBase = "presentation";
      try {
        var rawPath = (global.location && global.location.pathname) ? global.location.pathname : "";
        var segs = rawPath.replace(/\/+$/, "").split("/").filter(Boolean);
        var lastSeg = segs.length ? segs[segs.length - 1] : "";
        if (lastSeg && /\.html?$/i.test(lastSeg) && !/^index\.html?$/i.test(lastSeg)) {
          rawBase = lastSeg.replace(/\.html?$/i, "").replace(/-edited(-\d+)?$/i, "");
        } else if (lastSeg && /^[1-9]\d*$/.test(lastSeg)) {
          var prevSeg = segs.length > 1 ? segs[segs.length - 2] : "presentation";
          rawBase = prevSeg + "-edition-" + lastSeg;
        } else if (segs.length > 1 && /^index\.html?$/i.test(lastSeg) && /^[1-9]\d*$/.test(segs[segs.length - 2])) {
          var projSeg = segs.length > 2 ? segs[segs.length - 3] : "presentation";
          rawBase = projSeg + "-edition-" + segs[segs.length - 2];
        } else if (lastSeg && !/^index\.html?$/i.test(lastSeg)) {
          rawBase = lastSeg;
        } else if (document.title) {
          rawBase = "bullying-presentation";
        }
      } catch (e) {}

      var fileName = options.fileName || (rawBase + "-edited.html");
      if (!/\.html?$/i.test(fileName)) fileName += ".html";

      var blob = new Blob([htmlContent], { type: "text/html;charset=utf-8" });
      var url = URL.createObjectURL(blob);
      var link = document.createElement("a");
      link.href = url;
      link.download = fileName;
      link.setAttribute("data-ps-ignore", "1");
      link.style.display = "none";
      document.body.appendChild(link);
      link.click();
      setTimeout(function () {
        if (link.parentNode) link.parentNode.removeChild(link);
        URL.revokeObjectURL(url);
      }, 1800);

      showToast("تم تنزيل ملف HTML المحلي بكامل تعديلاتك ✓");
      return fileName;
    }

    function normalizeIntensityVal(val) {

      if (val === "strong" || val === "high") return "strong";

    function computeMotionAttrsAndStyles(motionObj) {
      if (!motionObj || typeof motionObj !== "object") {
        return { hasAny: false, enterStyle: "", loopStyle: "", enterAttr: "", loopAttr: "", hoverClass: "", hoverAttr: "" };
      }
      var ent = motionObj.entrance || "none";
      var lp = motionObj.loop || "none";
      var ix = motionObj.interactive || motionObj.hover || "none";
      var dur = typeof motionObj.duration === "number" ? motionObj.duration : 1.2;
      var entDur = typeof motionObj.entranceDur === "number" ? motionObj.entranceDur : clamp(dur, 0.3, 4.0);
      var lpDur = typeof motionObj.loopDur === "number" ? motionObj.loopDur : clamp(dur, 0.3, 8.0);
      var delay = typeof motionObj.delay === "number" ? motionObj.delay : 0;
      var intensity = normalizeIntensityVal(motionObj.intensity);

      if (ent === "none" && lp === "none" && ix === "none") {
        return { hasAny: false, enterStyle: "", loopStyle: "", enterAttr: "", loopAttr: "", hoverClass: "", hoverAttr: "" };
      }

      var reg = getAssetsRegistry();
      if (reg.buildAnimProps) {
        var built = reg.buildAnimProps({
          entrance: ent,
          entranceDur: entDur,
          entranceDelay: delay,
          loop: lp,
          loopDur: lpDur,
          interactive: ix,
          intensity: intensity
        });
        return {
          hasAny: true,
          enterStyle: built.enterStyle || "",
          loopStyle: built.loopStyle || "",
          enterAttr: "",
          loopAttr: "",
          hoverClass: built.interactiveClass || "",
          hoverAttr: ""
        };
      }

      var amp = intensity === "soft" ? 0.55 : (intensity === "strong" ? 1.55 : 1);
      var sharedVars = "--ps-amp:" + amp + ";--ps-enter-dur:" + entDur + "s;--ps-mot-dur:" + lpDur + "s;--ps-mot-delay:" + delay + "s;";
      return {
        hasAny: true,
        enterStyle: ent !== "none" ? sharedVars : "",
        loopStyle: lp !== "none" ? sharedVars : "",
        enterAttr: ent !== "none" ? ent : "",
        loopAttr: lp !== "none" ? lp : "",
        hoverClass: "",
        hoverAttr: ix !== "none" ? ix : ""
      };
    }

    function applyMotionToNativeElement(el, motionObj) {
      if (!el) return;
      /* Clear previous interactive classes */
      if (el.__psAddedIxClass) {
        el.classList.remove(el.__psAddedIxClass);
        el.__psAddedIxClass = "";
      }
      el.removeAttribute("data-ps-mot-enter");
      el.removeAttribute("data-ps-mot-loop");
      el.removeAttribute("data-ps-mot-hover");
      el.style.animation = "";

      var m = computeMotionAttrsAndStyles(motionObj);
      if (!m.hasAny) return;

      el.setAttribute("data-ps-has-motion", "1");
      if (m.hoverClass) {
        el.classList.add(m.hoverClass);
        el.__psAddedIxClass = m.hoverClass;
      } else if (m.hoverAttr) {
        el.setAttribute("data-ps-mot-hover", m.hoverAttr);
      }

      /* Apply loop or entrance directly on native element */
      var animParts = [];
      var extractAnimRule = function (styleStr) {
        var match = styleStr.match(/animation\s*:\s*([^;]+)/i);
        return match ? match[1].trim() : "";
      };
      var intMatch = (m.enterStyle || m.loopStyle).match(/--ps-int\s*:\s*([^;]+)/);
      if (intMatch) el.style.setProperty("--ps-int", intMatch[1].trim());

      var entAnim = extractAnimRule(m.enterStyle);
      var lpAnim = extractAnimRule(m.loopStyle);
      if (entAnim) animParts.push(entAnim);
      if (lpAnim) animParts.push(lpAnim);

      if (animParts.length) {
        el.style.animation = animParts.join(", ");
      } else {
        if (m.enterAttr) el.setAttribute("data-ps-mot-enter", m.enterAttr);
        if (m.loopAttr) el.setAttribute("data-ps-mot-loop", m.loopAttr);
      }
    }

    function computeFilterCss(filterPreset, brightness, hueRotate) {
      var parts = [];
      var br = typeof brightness === "number" ? brightness : 100;
      var hr = typeof hueRotate === "number" ? hueRotate : 0;
      if (br !== 100) parts.push("brightness(" + (br / 100).toFixed(2) + ")");
      if (hr !== 0) parts.push("hue-rotate(" + Math.round(hr) + "deg)");
      if (filterPreset === "shadow") parts.push("drop-shadow(0 10px 18px rgba(15,23,42,0.34))");
      else if (filterPreset === "glow") parts.push("drop-shadow(0 0 14px rgba(56,189,248,0.72))");
      else if (filterPreset === "warm") parts.push("sepia(0.24) saturate(1.18)");
      else if (filterPreset === "cool") parts.push("hue-rotate(14deg) saturate(1.1)");
      return parts.join(" ");
    }

    function indexNativeSvgCharacterGroups(stageTarget) {
      var svgs = stageTarget.charRoot.querySelectorAll(".art-stage-frame svg, .stage-scene svg, #svg-stage-host svg, #backdrop-host svg");
      for (var s = 0; s < svgs.length; s++) {
        var svg = svgs[s];
        if (svg.closest("[data-ps-overlay-layer]")) continue;
        if (svg.closest(".char-pod, .sp-char-actor, .cinema-actor, .motion-actor")) continue;

        var groupContainers = [svg];
        for (var gc = 0; gc < svg.children.length; gc++) {

          if (
            topChild.tagName &&
            topChild.tagName.toLowerCase() === "g" &&
            topChild.hasAttribute("clip-path") &&
            topChild.querySelectorAll(":scope > g").length >= 2

            groupContainers.push(topChild);

        var gIndex = 0;
        for (var pIdx = 0; pIdx < groupContainers.length; pIdx++) {
          var parentNode = groupContainers[pIdx];
          var children = Array.prototype.slice.call(parentNode.children);
          for (var c = 0; c < children.length; c++) {
            var child = children[c];
            var tag = child.tagName ? child.tagName.toLowerCase() : "";

              wrap.appendChild(child);

      var rot = (ov && typeof ov.rotate === "number") ? ov.rotate : 0;

          var ctm = inner.getCTM();

    function applyOverlayItemMotionRigs(itemEl, motionObj) {
