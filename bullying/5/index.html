    function applyOverlayItemMotionRigs(itemEl, motionObj) {
      if (!itemEl) return;
      var enterRig = itemEl.querySelector(":scope > .ps-mot-enter-rig");
      var loopRig = enterRig ? enterRig.querySelector(":scope > .ps-mot-loop-rig") : null;
      if (!enterRig || !loopRig) return;

      if (loopRig.__psAddedIxClass) {
        loopRig.classList.remove(loopRig.__psAddedIxClass);
        loopRig.__psAddedIxClass = "";
      }
      enterRig.style.cssText = "";
      loopRig.style.cssText = "";
      enterRig.removeAttribute("data-ps-mot-enter");
      loopRig.removeAttribute("data-ps-mot-loop");
      loopRig.removeAttribute("data-ps-mot-hover");

      var m = computeMotionAttrsAndStyles(motionObj);
      if (!m.hasAny) return;

      if (m.enterStyle) enterRig.style.cssText = m.enterStyle;
      if (m.loopStyle) loopRig.style.cssText = m.loopStyle;
      if (m.enterAttr) enterRig.setAttribute("data-ps-mot-enter", m.enterAttr);
      if (m.loopAttr) loopRig.setAttribute("data-ps-mot-loop", m.loopAttr);
      if (m.hoverClass) {
        loopRig.classList.add(m.hoverClass);
        loopRig.__psAddedIxClass = m.hoverClass;
      } else if (m.hoverAttr) {
        loopRig.setAttribute("data-ps-mot-hover", m.hoverAttr);
      }
    }

    function triggerLiveMotionPreview() {
      if (!selection || !selection.el) return;
      motionPreviewNonce += 1;
      var el = selection.el;
      var enterRig = el.querySelector && el.querySelector(":scope > .ps-mot-enter-rig");
      if (enterRig) {
        var prevCss = enterRig.style.cssText;
        var prevAttr = enterRig.getAttribute("data-ps-mot-enter");
        enterRig.style.animation = "none";
        enterRig.removeAttribute("data-ps-mot-enter");
        void enterRig.offsetWidth;
        enterRig.style.cssText = prevCss;
        if (prevAttr) enterRig.setAttribute("data-ps-mot-enter", prevAttr);
      } else {
        var prevAnim = el.style.animation;
        var prevEnt = el.getAttribute("data-ps-mot-enter");
        el.style.animation = "none";
        el.removeAttribute("data-ps-mot-enter");
        void el.offsetWidth;
        el.style.animation = prevAnim;
        if (prevEnt) el.setAttribute("data-ps-mot-enter", prevEnt);
        applyAllStageOverrides();
      }
      showToast("▶ تمت معاينة الحركة على العنصر المحدّد");
    }

    function applyAllStageOverrides() {
      if (!adapter) return;
      resetPersistentModifiedElements();
      var targets = adapter.getStageTargets();
      for (var i = 0; i < targets.length; i++) {
        applyStageTarget(targets[i]);
      }
      syncSelectionRing();
      syncDockState();
    }

    /* ----------------------------------------------------------------------
       12. SELECTION RING & RICH CONTEXTUAL INSPECTOR BAR
       ---------------------------------------------------------------------- */
    var INTERACTIVE_TRIGGER_SELECTOR = "button, a, summary, [data-jump], [data-widget], [data-cite], [data-ctrl], [data-action], [data-theater-btn], [role='tab'], [role='button']";

    function findInteractiveTrigger(el) {
      if (!el || !el.closest) return null;
      var trig = el.closest(INTERACTIVE_TRIGGER_SELECTOR);
      if (trig && trig.closest("#ps-studio-root")) return null;
      return trig;
    }

    function clearSelection() {
      selection = null;
      ui.ring.hidden = true;
      ui.ctxBar.hidden = true;
      var selNodes = document.querySelectorAll(".ps-frame-item.is-selected, .ps-shape-item.is-selected, .ps-char-item.is-selected");
      for (var i = 0; i < selNodes.length; i++) selNodes[i].classList.remove("is-selected");
    }

    function syncSelectionRing() {
      if (!editMode || !selection || !selection.el || !document.body.contains(selection.el)) {
        ui.ring.hidden = true;
        if (selection && (!selection.el || !document.body.contains(selection.el))) {
          ui.ctxBar.hidden = true;
          selection = null;
        }
        return;
      }

      var rect = selection.el.getBoundingClientRect();
      if (rect.width < 2 && rect.height < 2) {
        ui.ring.hidden = true;
        return;
      }
      var model = getSelectedModel();
      var isLocked = Boolean(model && model.locked);
      ui.ring.classList.toggle("is-locked", isLocked);
      ui.moveHandle.textContent = isLocked ? "🔒 مقفول" : "⠿ اسحب";

      ui.ring.style.left = Math.round(rect.left - 4) + "px";
      ui.ring.style.top = Math.round(rect.top - 4) + "px";
      ui.ring.style.width = Math.round(rect.width + 8) + "px";
      ui.ring.style.height = Math.round(rect.height + 8) + "px";
      ui.ring.hidden = false;
    }

    function selectItem(selObj) {
      selection = selObj;
      var allSel = document.querySelectorAll(".ps-frame-item.is-selected, .ps-shape-item.is-selected, .ps-char-item.is-selected");
      for (var i = 0; i < allSel.length; i++) allSel[i].classList.remove("is-selected");
      if (selection && selection.el && (selection.kind === "frame" || selection.kind === "shape" || selection.kind === "addedChar")) {
        selection.el.classList.add("is-selected");
      }
      renderContextBar();
      syncSelectionRing();
    }

    function getSelectedModel() {
      if (!selection) return null;
      var pageRec = ensurePageRecord(selection.pageUid);
      if (selection.kind === "frame") {
        for (var i = 0; i < pageRec.frames.length; i++) {
          if (pageRec.frames[i].id === selection.id) return pageRec.frames[i];
        }
      }
      if (selection.kind === "shape") {
        for (var s = 0; s < pageRec.shapes.length; s++) {
          if (pageRec.shapes[s].id === selection.id) return pageRec.shapes[s];
        }
      }
      if (selection.kind === "addedChar") {
        for (var j = 0; j < pageRec.addedChars.length; j++) {
          if (pageRec.addedChars[j].id === selection.id) return pageRec.addedChars[j];
        }
      }
      if (selection.kind === "nativeChar") {
        if (!pageRec.nativeCharOverrides[selection.id]) {
          pageRec.nativeCharOverrides[selection.id] = { scale: 1, dx: 0, dy: 0, dxPct: 0, dyPct: 0, rotate: 0, flip: false, flipY: false, opacity: 100, hidden: false, locked: false };
        }
        return pageRec.nativeCharOverrides[selection.id];
      }
      if (selection.kind === "text" || selection.kind === "svgText") {
        if (!pageRec.textOverrides[selection.id]) {
          pageRec.textOverrides[selection.id] = {};
        }
        return pageRec.textOverrides[selection.id];
      }
      return null;
    }

    function renderContextBar() {
      if (!editMode || !selection) {
        ui.ctxBar.hidden = true;
        return;
      }

      var model = getSelectedModel();
      if (!model) {
        ui.ctxBar.hidden = true;
        return;
      }
      var isLocked = Boolean(model.locked);
      var lockBtn = '<button type="button" class="ps-ctx-btn' + (isLocked ? ' is-active' : '') + '" data-ctx-act="toggle-lock" title="قفل أو فتح قفل الموضع">' + (isLocked ? '🔓 فك القفل' : '🔒 قفل') + '</button>';
      var motionBtn = '<button type="button" class="ps-ctx-btn is-motion" data-ctx-act="open-motion" title="إضافة حركات دخول وحركات مستمرة وتفاعل">🎬 حركة</button>';
      var propsBtn = '<button type="button" class="ps-ctx-btn is-active" data-ctx-act="open-inspector" title="فتح لوحة التخصيص الكامل">⚙ تخصيص</button>';

      if (selection.kind === "addedChar" || selection.kind === "nativeChar") {
        var curScale = Math.round((model.scale || 1) * 100);
        var isAdded = selection.kind === "addedChar";
        var libInfo = getCharacterLibrary();
        var moodSelectHtml = "";
        if (isAdded && !model.customDataUrl) {
          moodSelectHtml = '<select class="ps-ctx-btn" data-ctx-act="char-mood" aria-label="تعبير الوجه">' +
            libInfo.expressions.map(function (m) {
              return '<option value="' + escHtml(m.id) + '"' + (m.id === model.mood ? " selected" : "") + '>' + escHtml(m.label) + '</option>';
            }).join("") +
          '</select>';
        }
        var colorPickersHtml = isAdded && !model.customDataUrl
          ? '<input type="color" class="ps-color-input" data-ctx-color="char-primary" value="' + normalizeColorForPicker(model.primaryColor, "#BA4F45") + '" title="لون الملابس الأساسي" />' +
            '<input type="color" class="ps-color-input" data-ctx-color="char-secondary" value="' + normalizeColorForPicker(model.secondaryColor, "#FAF6EE") + '" title="لون الملابس الثانوي" />' +
            '<input type="color" class="ps-color-input" data-ctx-color="char-skin" value="' + normalizeColorForPicker(model.skinColor, "#F2C2A2") + '" title="لون البشرة" />'
          : '';

        ui.ctxBar.innerHTML =
          propsBtn +
          motionBtn +
          moodSelectHtml +
          colorPickersHtml +
          '<button type="button" class="ps-ctx-btn" data-ctx-act="scale-up" title="تكبير">+</button>' +
          '<span style="font-size:11px;font-weight:800;">' + curScale + '%</span>' +
          '<button type="button" class="ps-ctx-btn" data-ctx-act="scale-down" title="تصغير">−</button>' +
          '<input type="range" class="ps-ctx-slider" data-ctx-act="scale-slider" min="15" max="400" value="' + curScale + '" aria-label="حجم الشخصية" />' +
          '<button type="button" class="ps-ctx-btn" data-ctx-act="flip" title="عكس أفقي">⇄</button>' +
          '<button type="button" class="ps-ctx-btn" data-ctx-act="flip-y" title="عكس رأسي">⇅</button>' +
          (isAdded
            ? '<button type="button" class="ps-ctx-btn" data-ctx-act="z-front" title="تقديم للأمام">أمام ▲</button>' +
              '<button type="button" class="ps-ctx-btn" data-ctx-act="z-back" title="إرسال للخلف">خلف ▼</button>' +
              '<button type="button" class="ps-ctx-btn" data-ctx-act="copy-el" title="نسخ الشخصية">نسخ</button>'
            : '<button type="button" class="ps-ctx-btn" data-ctx-act="reset-native" title="إعادة ضبط العنصر الأصلي">↺ ضبط</button>'
          ) +
          lockBtn +
          '<button type="button" class="ps-ctx-btn is-danger" data-ctx-act="del-item" title="حذف">🗑</button>';
        ui.ctxBar.hidden = false;
        return;
      }

      if (selection.kind === "shape") {
        var shScale = Math.round((model.scale || 1) * 100);
        ui.ctxBar.innerHTML =
          propsBtn +
          motionBtn +
          '<span style="font-size:11px;font-weight:700;">تعبئة:</span>' +
          '<input type="color" class="ps-color-input" data-ctx-color="shape-fill" value="' + normalizeColorForPicker(model.fill, "#BA4F45") + '" title="لون التعبئة" />' +
          '<span style="font-size:11px;font-weight:700;">إطار:</span>' +
          '<input type="color" class="ps-color-input" data-ctx-color="shape-stroke" value="' + normalizeColorForPicker(model.stroke, "#231F1D") + '" title="لون الإطار" />' +
          '<input type="range" class="ps-ctx-slider" data-ctx-act="scale-slider" min="20" max="350" value="' + shScale + '" aria-label="حجم الشكل" />' +
          '<button type="button" class="ps-ctx-btn" data-ctx-act="flip" title="عكس أفقي">⇄</button>' +
          '<button type="button" class="ps-ctx-btn" data-ctx-act="flip-y" title="عكس رأسي">⇅</button>' +
          '<button type="button" class="ps-ctx-btn" data-ctx-act="z-front">أمام ▲</button>' +
          '<button type="button" class="ps-ctx-btn" data-ctx-act="z-back">خلف ▼</button>' +
          '<button type="button" class="ps-ctx-btn" data-ctx-act="copy-el">نسخ</button>' +
          lockBtn +
          '<button type="button" class="ps-ctx-btn is-danger" data-ctx-act="del-item">🗑</button>';
        ui.ctxBar.hidden = false;
        return;
      }

      if (selection.kind === "frame") {
        var fVis = resolveFrameVisualDefaults(model);
        ui.ctxBar.innerHTML =
          propsBtn +
          motionBtn +
          '<input type="color" class="ps-color-input" data-ctx-color="frame-bg" value="' + normalizeColorForPicker(fVis.bg, "#FFFDF9") + '" title="لون خلفية الإطار" />' +
          '<input type="color" class="ps-color-input" data-ctx-color="frame-fg" value="' + normalizeColorForPicker(fVis.fg, "#231F1D") + '" title="لون نص الإطار" />' +
          '<input type="color" class="ps-color-input" data-ctx-color="frame-bd" value="' + normalizeColorForPicker(fVis.borderColor, "#3A322C") + '" title="لون حدود الإطار" />' +
          '<button type="button" class="ps-ctx-btn" data-ctx-act="frame-tail" title="تبديل اتجاه ذيل الفقاعة (8 اتجاهات)">ذيل ▾</button>' +
          '<button type="button" class="ps-ctx-btn" data-ctx-act="frame-wider" title="توسيع العرض">عرض +</button>' +
          '<button type="button" class="ps-ctx-btn" data-ctx-act="frame-narrower" title="تضييق العرض">عرض −</button>' +
          '<button type="button" class="ps-ctx-btn" data-ctx-act="frame-font-up">A+</button>' +
          '<button type="button" class="ps-ctx-btn" data-ctx-act="frame-font-down">A−</button>' +
          '<button type="button" class="ps-ctx-btn" data-ctx-act="z-front">أمام ▲</button>' +
          '<button type="button" class="ps-ctx-btn" data-ctx-act="z-back">خلف ▼</button>' +
          '<button type="button" class="ps-ctx-btn" data-ctx-act="copy-el">نسخ</button>' +
          lockBtn +
          '<button type="button" class="ps-ctx-btn is-danger" data-ctx-act="del-item">🗑</button>';
        ui.ctxBar.hidden = false;
        return;
      }

      if (selection.kind === "text" || selection.kind === "svgText") {
        var isSvgTxt = selection.kind === "svgText";
        var interactiveTrig = !isSvgTxt ? findInteractiveTrigger(selection.el) : null;
        var triggerBtnHtml = interactiveTrig
          ? '<button type="button" class="ps-ctx-btn is-trigger" data-ctx-act="trigger-native-btn" title="تنفيذ نقرة الزر الأصلية (مثل فتح التبويب أو المرجع)">⚡ تشغيل الزر</button>'
          : '';

        var svgInlineInput = isSvgTxt
          ? '<input type="text" id="ps-ctx-svg-input" value="' + escHtml(selection.el ? (selection.el.textContent || "") : (model.text || "")) + '" style="width:140px;height:30px;padding:0 8px;border-radius:8px;border:1px solid rgba(255,255,255,0.35);background:rgba(255,255,255,0.14);color:#FFF;font-size:12px;direction:rtl;flex-shrink:0;" aria-label="نص الرسم" />'
          : '';

        var curColorHex = normalizeColorForPicker(model.color || (selection.el ? getComputedStyle(selection.el).color : ""), "#231F1D");

        ui.ctxBar.innerHTML =
          triggerBtnHtml +
          svgInlineInput +
          propsBtn +
          motionBtn +
          '<button type="button" class="ps-ctx-btn" data-ctx-act="text-bigger" title="تكبير الخط">A+</button>' +
          '<button type="button" class="ps-ctx-btn" data-ctx-act="text-smaller" title="تصغير الخط">A−</button>' +
          '<button type="button" class="ps-ctx-btn' + (model.fontWeight === "800" ? " is-active" : "") + '" data-ctx-act="text-bold" title="خط عريض">B</button>' +
          (!isSvgTxt
            ? '<button type="button" class="ps-ctx-btn' + (model.fontStyle === "italic" ? " is-active" : "") + '" data-ctx-act="text-italic" title="مائل">I</button>' +
              '<button type="button" class="ps-ctx-btn' + (model.textDecoration === "underline" ? " is-active" : "") + '" data-ctx-act="text-underline" title="تسطير">U</button>' +
              '<button type="button" class="ps-ctx-btn" data-ctx-act="text-align" title="محاذاة النص">محاذاة</button>'
            : ''
          ) +
          '<input type="color" class="ps-color-input" data-ctx-color="text-fg" value="' + curColorHex + '" title="لون النص" />' +
          (!isSvgTxt
            ? '<input type="color" class="ps-color-input" data-ctx-color="text-bg" value="' + normalizeColorForPicker(model.bgColor, "#FEF3C7") + '" title="لون خلفية/تظليل النص" />'
            : ''
          ) +
          '<button type="button" class="ps-ctx-btn" data-ctx-act="clone-as-frame" title="استنساخ هذا النص كإطار حر قابل للسحب">⧉ كإطار حر</button>' +
          '<button type="button" class="ps-ctx-btn" data-ctx-act="reset-text" title="إعادة ضبط النص لحالته الأصلية">↺ ضبط</button>' +
          lockBtn +
          '<button type="button" class="ps-ctx-btn is-danger" data-ctx-act="del-item" title="إخفاء النص">🗑</button>';
        ui.ctxBar.hidden = false;
      }
    }

    /* ----------------------------------------------------------------------
       13. ACTIONS: ADD ITEMS, TRIGGER NATIVE BUTTON, CLONE, LAYERS & PAGES
       ---------------------------------------------------------------------- */
    function addTextFrame(templateId) {
      pushUndoSnapshot();
      var reg = getAssetsRegistry();
      var pageUid = adapter.getCurrentPageUid();
      var pageRec = ensurePageRecord(pageUid);
      var count = pageRec.frames.length;
      var tpl = reg.frames[0];
      for (var i = 0; i < reg.frames.length; i++) {
        if (reg.frames[i].id === templateId) { tpl = reg.frames[i]; break; }
      }

      var newFrame = {
        id: genUid("frame"),
        templateId: tpl.id,
        style: tpl.id,
        bg: tpl.defaultBg || tpl.bg || "#FFFDF9",
        fg: tpl.defaultFg || tpl.fg || "#221D1A",
        borderColor: tpl.defaultBorder || tpl.borderColor || "#3A322C",
        borderWidth: tpl.defaultBorderStyle === "none" ? 0 : (tpl.defaultBorderStyle === "double" ? 4 : 2),
        borderStyle: tpl.defaultBorderStyle || tpl.borderStyle || "solid",
        radius: typeof tpl.defaultRadius === "number" ? tpl.defaultRadius : (typeof tpl.radius === "number" ? tpl.radius : 16),
        tail: tpl.hasTail ? (tpl.tail || "bottom-right") : (tpl.tail || "none"),
        shadow: (tpl.defaultBg === "transparent" || tpl.shadow === "none") ? "none" : (tpl.shadow || "soft"),
        glass: Boolean(tpl.glass || tpl.id === "cinema" || tpl.id === "cinema_glass"),
        text: tpl.defaultText || "اكتب النص الجديد هنا...",
        fontFamily: "",
        fontSize: tpl.defaultFontSize || 18,
        fontWeight: "600",
        fontStyle: "normal",
        textDecoration: "none",
        textAlign: (tpl.defaultRadius >= 900 || tpl.radius >= 900) ? "center" : "right",
        x: clamp(46 + (count % 4) * 4, 20, 80),
        y: clamp(44 + (count % 4) * 6, 20, 80),
        width: tpl.defaultWidth || 300,
        scale: 1,
        rotate: 0,
        opacity: 100,
        locked: false,
        z: 48 + count + pageRec.shapes.length + pageRec.addedChars.length,
        motion: null
      };
      pageRec.frames.push(newFrame);
      closeModal();
      applyAllStageOverrides();
      scheduleAutoSave();

      var mounted = document.querySelector('.ps-frame-item[data-ps-frame-id="' + newFrame.id + '"]');
      if (mounted) {
        selectItem({ kind: "frame", pageUid: pageUid, id: newFrame.id, el: mounted });
        var body = mounted.querySelector(".ps-frame-body");
        if (body) {
          body.focus();
          try {
            var range = document.createRange();
            range.selectNodeContents(body);
            var sel = global.getSelection();
            sel.removeAllRanges();
            sel.addRange(range);
          } catch (e) {}
        }
      }
      showToast("تمت إضافة الإطار — اكتب بداخله واسحبه بحرية ✓");
    }

    function addShapeToStage(shapeIdOrSpec) {
      pushUndoSnapshot();
      var specObj = (shapeIdOrSpec && typeof shapeIdOrSpec === "object") ? shapeIdOrSpec : {};
      var shapeId = typeof shapeIdOrSpec === "string" ? shapeIdOrSpec : (specObj.shapeId || specObj.id || "");
      var reg = getAssetsRegistry();
      var pageUid = adapter.getCurrentPageUid();
      var pageRec = ensurePageRecord(pageUid);
      var count = pageRec.shapes.length;
      var tpl = reg.shapes[0];
      for (var i = 0; i < reg.shapes.length; i++) {
        if (reg.shapes[i].id === shapeId) { tpl = reg.shapes[i]; break; }
      }

      var newShape = {
        id: genUid("shape"),
        shapeId: tpl.id,
        label: tpl.label || tpl.name || "شكل متجه",
        x: clamp(45 + (count % 5) * 5, 18, 82),
        y: clamp(48 + (count % 4) * 5, 18, 82),
        width: specObj.width || 125,
        scale: specObj.scale || 1,
        rotate: specObj.rotate || 0,
        flipX: false,
        flipY: false,
        fill: specObj.fill || tpl.defaultFill || "#BA4F45",
        stroke: specObj.stroke || tpl.defaultStroke || "#231F1D",
        strokeWidth: specObj.strokeWidth || tpl.defaultStrokeWidth || 3,
        opacity: 100,
        shadow: specObj.shadow || "none",
        locked: false,
        z: 49 + count + pageRec.frames.length + pageRec.addedChars.length,
        motion: specObj.motion || specObj.anim || null
      };
      pageRec.shapes.push(newShape);
      closeModal();
      applyAllStageOverrides();
      scheduleAutoSave();

      var mounted = document.querySelector('.ps-shape-item[data-ps-shape-id="' + newShape.id + '"]');
      if (mounted) {
        selectItem({ kind: "shape", pageUid: pageUid, id: newShape.id, el: mounted });
      }
      showToast("تمت إضافة الشكل المتجه — يمكنك تحريكه وتلوينه وتدويره ✓");
    }

    function addCharacterToStage(charSpec) {
      pushUndoSnapshot();
      var pageUid = adapter.getCurrentPageUid();
      var pageRec = ensurePageRecord(pageUid);
      var count = pageRec.addedChars.length;
      var defMood = "neutral";
      var libInfo = getCharacterLibrary();
      for (var ci = 0; ci < libInfo.characters.length; ci++) {
        if (libInfo.characters[ci].id === charSpec.charId && libInfo.characters[ci].defaultMood) {
          defMood = libInfo.characters[ci].defaultMood;
          break;
        }
      }
      var newChar = {
        id: genUid("char"),
        charId: charSpec.charId || "ed_crossed_boy",
        mood: charSpec.mood || selectedCastMood || defMood,
        label: charSpec.label || "شخصية",
        primaryColor: charSpec.primaryColor || charSpec.primary || "",
        secondaryColor: charSpec.secondaryColor || charSpec.secondary || "",
        skinColor: charSpec.skinColor || charSpec.skin || "",
        customDataUrl: charSpec.customDataUrl || "",
        x: clamp(34 + (count % 5) * 8, 16, 84),
        y: clamp(54 + (count % 3) * 6, 22, 82),
        scale: typeof charSpec.scale === "number" ? charSpec.scale : 1,
        rotate: charSpec.rotate || 0,
        flip: false,
        flipY: false,
        opacity: 100,
        filterPreset: "none",
        brightness: 100,
        hueRotate: 0,
        locked: false,
        z: 50 + count + pageRec.frames.length + pageRec.shapes.length,
        motion: charSpec.motion || charSpec.anim || null
      };
      pageRec.addedChars.push(newChar);
      closeModal();
      applyAllStageOverrides();
      scheduleAutoSave();

      var mounted = document.querySelector('.ps-char-item[data-ps-added-char-id="' + newChar.id + '"]');
      if (mounted) {
        selectItem({ kind: "addedChar", pageUid: pageUid, id: newChar.id, el: mounted });
      }
      showToast("تمت إضافة الشخصية — خصّص ألوانها وتعبيراتها وحركاتها بحرية ✓");
    }

    function cloneSelectedTextAsFrame() {
      if (!selection || (selection.kind !== "text" && selection.kind !== "svgText")) return;
      var model = getSelectedModel() || {};
      var txt = selection.el ? extractEditableText(selection.el) : (model.text || "");
      var comp = selection.el ? getComputedStyle(selection.el) : null;
      var fs = comp ? (parseFloat(comp.fontSize) || 18) : 18;
      var pageUid = selection.pageUid || adapter.getCurrentPageUid();
      var pageRec = ensurePageRecord(pageUid);

      pushUndoSnapshot();
      var newFrame = {
        id: genUid("frame"),
        templateId: "editorial",
        style: "editorial",
        bg: model.bgColor || "#FFFDF9",
        fg: model.color || (comp ? comp.color : "#231F1D"),
        borderColor: model.borderColor || "#BA4F45",
        borderWidth: 2,
        borderStyle: "solid",
        radius: 14,
        tail: "none",
        shadow: "soft",
        text: txt,
        fontFamily: model.fontFamily || "",
        fontSize: clamp(Math.round(fs), 12, 54),
        fontWeight: model.fontWeight || "700",
        textAlign: model.textAlign || "right",
        x: 52,
        y: 52,
        width: 310,
        scale: 1,
        rotate: model.rotate || 0,
        opacity: 100,
        locked: false,
        z: 54 + pageRec.frames.length,
        motion: model.motion ? deepClone(model.motion) : null
      };
      pageRec.frames.push(newFrame);
      applyAllStageOverrides();
      scheduleAutoSave();
      var fEl = document.querySelector('.ps-frame-item[data-ps-frame-id="' + newFrame.id + '"]');
      if (fEl) selectItem({ kind: "frame", pageUid: pageUid, id: newFrame.id, el: fEl });
      showToast("تم استنساخ النص كإطار حر قابل للسحب ✓");
    }

    function triggerSelectedInteractiveButton() {
      if (!selection || !selection.el) return;
      var trig = findInteractiveTrigger(selection.el);
      if (!trig) return;
      disableAllInlineContentEditable();
      clearSelection();
      if (trig.tagName && trig.tagName.toUpperCase() === "SUMMARY" && trig.parentElement && trig.parentElement.tagName.toUpperCase() === "DETAILS") {
        trig.parentElement.open = !trig.parentElement.open;
      } else {
        bypassInteractiveClick = true;
        try {
          trig.click();
        } finally {
          bypassInteractiveClick = false;
        }
      }
      setTimeout(function () {
        applyAllStageOverrides();
      }, 45);
      showToast("⚡ تم تشغيل الزر وتحديث فهرسة النصوص الجديدة");
    }

    function scaleSelectedItem(nextScale, recordUndo) {
      if (!selection) return;
      var model = getSelectedModel();
      if (!model || model.locked) return;
      if (recordUndo) pushUndoSnapshot();
      model.scale = clamp(Math.round(nextScale * 100) / 100, 0.15, 4.0);
      applyAllStageOverrides();
      renderContextBar();
      scheduleAutoSave();
    }

    function adjustSelectedLayerZ(delta) {
      if (!selection) return;
      var model = getSelectedModel();
      if (!model) return;
      pushUndoSnapshot();
      model.z = clamp((model.z || 48) + delta, 10, 250);
      applyAllStageOverrides();
      scheduleAutoSave();
      showToast(delta > 0 ? "تم تقديم الطبقة للأمام ▲" : "تم إرسال الطبقة للخلف ▼");
    }

    function deleteSelectedItem() {
      if (!selection) return;
      pushUndoSnapshot();
      var pageRec = ensurePageRecord(selection.pageUid);

      if (selection.kind === "frame") {
        pageRec.frames = pageRec.frames.filter(function (f) { return f.id !== selection.id; });
        clearSelection();
        applyAllStageOverrides();
        scheduleAutoSave();
        showToast("تم حذف الإطار ✓");
        return;
      }

      if (selection.kind === "shape") {
        pageRec.shapes = pageRec.shapes.filter(function (s) { return s.id !== selection.id; });
        clearSelection();
        applyAllStageOverrides();
        scheduleAutoSave();
        showToast("تم حذف الشكل ✓");
        return;
      }

      if (selection.kind === "addedChar") {
        pageRec.addedChars = pageRec.addedChars.filter(function (c) { return c.id !== selection.id; });
        clearSelection();
        applyAllStageOverrides();
        scheduleAutoSave();
        showToast("تم حذف الشخصية ✓");
        return;
      }

      if (selection.kind === "nativeChar") {
        var ov = getSelectedModel();
        ov.hidden = true;
        clearSelection();
        applyAllStageOverrides();
        scheduleAutoSave();
        showToast("تم إخفاء العنصر (يمكنك إظهاره من 🗂 الطبقات) ✓");
        return;
      }

      if (selection.kind === "text" || selection.kind === "svgText") {
        var tOv = getSelectedModel();
        tOv.hidden = true;
        clearSelection();
        applyAllStageOverrides();
        scheduleAutoSave();
        showToast("تم إخفاء النص (يمكنك إظهاره بضغطة من 🗂 الطبقات) ✓");
      }
    }

    function movePageInOrder(fromIdx, toIdx) {
      var order = studioState.pageOrder;
      if (fromIdx < 0 || fromIdx >= order.length || toIdx < 0 || toIdx >= order.length || fromIdx === toIdx) return;
      pushUndoSnapshot();
      var activeUid = adapter.getCurrentPageUid();
      var moved = order.splice(fromIdx, 1)[0];
      order.splice(toIdx, 0, moved);
      var newActiveIdx = order.indexOf(activeUid);
      adapter.rebuildPages(order, studioState.customPages, newActiveIdx >= 0 ? newActiveIdx : toIdx);
      scheduleAutoSave();
      syncDockState();
      if (activeModal === "pages") renderPagesModal();
    }

    function deletePageAtIndex(idx) {
      var order = studioState.pageOrder;
      if (order.length <= 1) {
        showToast("لا يمكن حذف الصفحة الوحيدة المتبقية في العرض");
        return;
      }
      if (idx < 0 || idx >= order.length) return;
      pushUndoSnapshot();
      var curIdx = adapter.getCurrentIndex();
      order.splice(idx, 1);
      var nextActiveIdx = curIdx;
      if (idx < curIdx) nextActiveIdx = curIdx - 1;
      else if (nextActiveIdx >= order.length) nextActiveIdx = order.length - 1;

      clearSelection();
      adapter.rebuildPages(order, studioState.customPages, Math.max(0, nextActiveIdx));
      scheduleAutoSave();
      syncDockState();
      if (activeModal === "pages") renderPagesModal();
      showToast("تم حذف الصفحة وتحديث الترقيم ✓");
    }

    function duplicatePageAtIndex(idx) {
      var order = studioState.pageOrder;
      if (idx < 0 || idx >= order.length) return;
      pushUndoSnapshot();
      var srcUid = order[idx];
      var newUid = genUid("custom_page");
      if (studioState.customPages[srcUid]) {
        studioState.customPages[newUid] = deepClone(studioState.customPages[srcUid]);
      } else {
        studioState.customPages[newUid] = { kind: "clone", sourceUid: srcUid };
      }
      if (studioState.pages[srcUid]) {
        studioState.pages[newUid] = deepClone(studioState.pages[srcUid]);
        var pRec = studioState.pages[newUid];
        if (Array.isArray(pRec.frames)) pRec.frames.forEach(function (f) { f.id = genUid("frame"); });
        if (Array.isArray(pRec.shapes)) pRec.shapes.forEach(function (s) { s.id = genUid("shape"); });
        if (Array.isArray(pRec.addedChars)) pRec.addedChars.forEach(function (c) { c.id = genUid("char"); });
      }
      order.splice(idx + 1, 0, newUid);
      adapter.rebuildPages(order, studioState.customPages, idx + 1);
      scheduleAutoSave();
      syncDockState();
      if (activeModal === "pages") renderPagesModal();
      showToast("تم نسخ الصفحة بكامل عناصرها ✓");
    }

    function addNewBlankPage(templateKind) {
      pushUndoSnapshot();
      var tpl = templateKind || "content";
      var curIdx = adapter.getCurrentIndex();
      var newUid = genUid("custom_page");
      var titlesByTpl = {

        quote: "اقتباس وشاهد علمي محوري"
      };
      studioState.customPages[newUid] = {

    /* 14.2 Massive Character Library Modal (Search + 8 Categories + OnPage + Upload) */
    function collectCurrentPageCharactersList() {
      var list = [];
      var pageUid = adapter.getCurrentPageUid();
      var pageRec = ensurePageRecord(pageUid);

      for (var i = 0; i < pageRec.addedChars.length; i++) {
        var ac = pageRec.addedChars[i];
        list.push({
          kind: "addedChar",
          id: ac.id,
          name: ac.label || ("شخصية مضافة " + (i + 1)),
          scale: ac.scale || 1,
          hidden: false
        });
      }

      var targets = adapter.getStageTargets();
      var curTarget = targets[0];
      for (var t = 0; t < targets.length; t++) {
        if (targets[t].pageUid === pageUid) curTarget = targets[t];
      }
      if (curTarget) {
        var nativeNodes = curTarget.charRoot.querySelectorAll("[data-ps-native-char]");
        for (var n = 0; n < nativeNodes.length; n++) {
          var nEl = nativeNodes[n];
          var key = nEl.getAttribute("data-ps-char-key");
          if (!key) continue;
          var ov = pageRec.nativeCharOverrides[key] || {};
          var label = nEl.getAttribute("data-actor-id") || ("عنصر مشهد أصلي #" + (n + 1));
          list.push({
            kind: "nativeChar",
            id: key,
            el: nEl,
            name: toWesternDigits(label),
            scale: ov.scale || 1,
            hidden: Boolean(ov.hidden)
          });
        }
      }
      return list;
    }

    function buildCharGridHtml(libInfo) {
      var q = charSearchQuery.trim().toLowerCase();
      var filtered = libInfo.characters.filter(function (c) {
        if (activeCharTab !== "all" && c.category !== activeCharTab && c.cat !== activeCharTab) return false;
        if (!q) return true;
        var hay = [
          c.name || "", c.label || "", c.role || "", c.subtitle || "", c.desc || "",
          c.category || "", Array.isArray(c.tags) ? c.tags.join(" ") : (c.tags || "")
        ].join(" ").toLowerCase();
        return hay.indexOf(q) !== -1;
      });

      if (!filtered.length) {
        return '<p style="text-align:center;color:#6E6258;padding:20px;">لا توجد نتائج مطابقة لبحثك — جرّب كلمة أخرى أو اختر تبويب «الكل».</p>';
      }

      return '<div class="ps-char-grid">' +
        filtered.map(function (c) {
          var nm = c.name || c.label || c.id;
          var rl = c.role || c.subtitle || c.desc || "";
          var thumb = renderCharacterSvgMarkup({ charId: c.id, mood: selectedCastMood, id: "th_" + c.id });
          return '<button type="button" class="ps-char-card" data-pick-char="' + escHtml(c.id) + '" data-pick-mood="' + escHtml(selectedCastMood) + '" data-pick-label="' + escHtml(nm) + '">' +

            (rl ? '<span class="ps-char-role">' + escHtml(rl) + '</span>' : '') +
          '</button>';
        }).join("") +

    }

    function bindInspectorLiveInputs() {
      var model = getSelectedModel();
      if (!model) return;
      var reg = getAssetsRegistry();
      var undoPushed = false;
      function onceUndo() {
        if (!undoPushed) { pushUndoSnapshot(); undoPushed = true; }
      }

      var bindRangeOrColor = function (id, handler) {
        var el = document.getElementById(id);
        if (!el) return;
        el.addEventListener("input", function (ev) {
          onceUndo();
          handler(ev.target.value);
          applyAllStageOverrides();
          renderContextBar();
          scheduleAutoSave();
        });
      };

      var fontSel = document.getElementById("ps-insp-font");
      if (fontSel) {
        fontSel.addEventListener("change", function (ev) {
          onceUndo();
          var fId = ev.target.value;
          var chosen = null;
          for (var i = 0; i < reg.fonts.length; i++) {
            if (reg.fonts[i].id === fId) { chosen = reg.fonts[i]; break; }
          }
          if (chosen && chosen.family) {
            registerUsedGoogleFont(chosen);
            model.fontFamily = chosen.family;
          } else {
            model.fontFamily = "";
          }
          applyAllStageOverrides();
          scheduleAutoSave();
        });
      }

      bindRangeOrColor("ps-insp-fs", function (v) {
        model.fontSize = parseInt(v, 10) + "px";
        var lbl = document.getElementById("ps-insp-fs-lbl");
        if (lbl) lbl.textContent = v + "px";
      });
      bindRangeOrColor("ps-insp-fg", function (v) { model.color = v; });
      bindRangeOrColor("ps-insp-bg", function (v) { model.bgColor = v; });
      bindRangeOrColor("ps-insp-rad", function (v) { model.bgRadius = parseInt(v, 10); });
      bindRangeOrColor("ps-insp-pad", function (v) { model.bgPad = parseInt(v, 10); });
      bindRangeOrColor("ps-insp-bw", function (v) { model.borderWidth = parseInt(v, 10); });
      bindRangeOrColor("ps-insp-bd", function (v) { model.borderColor = v; });
      bindRangeOrColor("ps-insp-rot", function (v) { model.rotate = parseInt(v, 10); });
      bindRangeOrColor("ps-insp-op", function (v) { model.opacity = parseInt(v, 10); });

      var shdSel = document.getElementById("ps-insp-shd");
      if (shdSel) shdSel.addEventListener("change", function (ev) { onceUndo(); model.shadow = ev.target.value; applyAllStageOverrides(); scheduleAutoSave(); });

      /* Frame specific */
      var ftpl = document.getElementById("ps-insp-ftpl");
      if (ftpl) {
        ftpl.addEventListener("change", function (ev) {
          onceUndo();
          var tid = ev.target.value;
          model.templateId = tid;
          model.style = tid;
          for (var i = 0; i < reg.frames.length; i++) {
            if (reg.frames[i].id === tid) {
              var t = reg.frames[i];
              model.bg = t.defaultBg || t.bg || model.bg;
              model.fg = t.defaultFg || t.fg || model.fg;
              model.borderColor = t.defaultBorder || t.borderColor || model.borderColor;
              model.borderStyle = t.defaultBorderStyle || t.borderStyle || "solid";
              model.radius = typeof t.defaultRadius === "number" ? t.defaultRadius : 16;
              model.tail = t.hasTail ? "bottom-right" : "none";
              break;
            }
          }
          applyAllStageOverrides();
          scheduleAutoSave();
          openInspectorModal();
        });
      }
      var ftail = document.getElementById("ps-insp-ftail");
      if (ftail) ftail.addEventListener("change", function (ev) { onceUndo(); model.tail = ev.target.value; applyAllStageOverrides(); scheduleAutoSave(); });
      bindRangeOrColor("ps-insp-fbg", function (v) { model.bg = v; });
      bindRangeOrColor("ps-insp-ffg", function (v) { model.fg = v; });
      bindRangeOrColor("ps-insp-fbd", function (v) { model.borderColor = v; });
      var fbs = document.getElementById("ps-insp-fbs");
      if (fbs) fbs.addEventListener("change", function (ev) { onceUndo(); model.borderStyle = ev.target.value; applyAllStageOverrides(); scheduleAutoSave(); });
      bindRangeOrColor("ps-insp-fbw", function (v) { model.borderWidth = parseFloat(v); });
      bindRangeOrColor("ps-insp-frad", function (v) { model.radius = parseInt(v, 10); });
      bindRangeOrColor("ps-insp-ffs", function (v) { model.fontSize = parseInt(v, 10); });
      var fshd = document.getElementById("ps-insp-fshd");
      if (fshd) fshd.addEventListener("change", function (ev) { onceUndo(); model.shadow = ev.target.value; applyAllStageOverrides(); scheduleAutoSave(); });

      /* Char specific */
      bindRangeOrColor("ps-insp-cprim", function (v) { model.primaryColor = v; });
      bindRangeOrColor("ps-insp-csec", function (v) { model.secondaryColor = v; });
      bindRangeOrColor("ps-insp-cskin", function (v) { model.skinColor = v; });
      bindRangeOrColor("ps-insp-cscale", function (v) { model.scale = (parseInt(v, 10) || 100) / 100; });
      bindRangeOrColor("ps-insp-cbr", function (v) { model.brightness = parseInt(v, 10); });
      bindRangeOrColor("ps-insp-chr", function (v) { model.hueRotate = parseInt(v, 10); });
      var cflt = document.getElementById("ps-insp-cflt");
      if (cflt) cflt.addEventListener("change", function (ev) { onceUndo(); model.filterPreset = ev.target.value; applyAllStageOverrides(); scheduleAutoSave(); });

      /* Shape specific */
      bindRangeOrColor("ps-insp-sfill", function (v) { model.fill = v; });
      bindRangeOrColor("ps-insp-sstroke", function (v) { model.stroke = v; });
      bindRangeOrColor("ps-insp-ssw", function (v) { model.strokeWidth = parseFloat(v); });
      var sshd = document.getElementById("ps-insp-sshd");
      if (sshd) sshd.addEventListener("change", function (ev) { onceUndo(); model.shadow = ev.target.value; applyAllStageOverrides(); scheduleAutoSave(); });
    }

    /* 14.4 Motion & Effects Studio Modal (14 Entrances + 16 Loops + 6 Interactions) */
    function openMotionModal() {
      if (!selection) {
        showToast("اضغط أولاً على أي شخصية أو نص أو إطار أو شكل لتخصيص حركاته 🎬");
        return;
      }
      activeModal = "motion";
      var model = getSelectedModel();
      if (!model) return;
      var reg = getAssetsRegistry();

          scheduleAutoSave();
        });

    /* 14.6 Layers Manager Modal */
    function collectCurrentSlideLayers() {
      var pageUid = adapter.getCurrentPageUid();
      var pageRec = ensurePageRecord(pageUid);
      var rows = [];

      pageRec.frames.forEach(function (f, idx) {
        rows.push({
          kind: "frame",
          id: f.id,
          typeBadge: "إطار",
          label: (f.text || "إطار كلام " + (idx + 1)).slice(0, 46),
          hidden: false,
          locked: Boolean(f.locked),
          canZ: true,
          z: f.z || 46
        });
      });

      pageRec.shapes.forEach(function (s, idx) {
        rows.push({
          kind: "shape",
          id: s.id,
          typeBadge: "شكل",
          label: s.label || ("شكل متجه " + (idx + 1)),
          hidden: false,
          locked: Boolean(s.locked),
          canZ: true,
          z: s.z || 47
        });
      });

      pageRec.addedChars.forEach(function (c, idx) {
        rows.push({
          kind: "addedChar",
          id: c.id,
          typeBadge: "شخصية+",
          label: c.label || ("شخصية مضافة " + (idx + 1)),
          hidden: false,
          locked: Boolean(c.locked),
          canZ: true,
          z: c.z || 48
        });
      });

      var nativeCharEls = document.querySelectorAll('[data-ps-native-char][data-ps-page-uid="' + pageUid + '"]');
      for (var n = 0; n < nativeCharEls.length; n++) {
        var nEl = nativeCharEls[n];
        var nk = nEl.getAttribute("data-ps-char-key");
        var nov = pageRec.nativeCharOverrides[nk] || {};
        rows.push({
          kind: "nativeChar",
          id: nk,
          typeBadge: "عنصر أصلي",
          label: toWesternDigits(nEl.getAttribute("data-actor-id") || ("شخصية/مجموعة رسم #" + (n + 1))),
          hidden: Boolean(nov.hidden),
          locked: Boolean(nov.locked),
          canZ: false,
          z: 20
        });
      }

      var tOvs = pageRec.textOverrides || {};
      Object.keys(tOvs).forEach(function (tk) {
        var tov = tOvs[tk];
        if (!tov) return;
        var isSvg = tk.indexOf("svg_txt_") === 0;
        var domEl = document.querySelector('[data-ps-page-uid="' + pageUid + '"][data-ps-text-key="' + CSS.escape(tk) + '"]');
        var snippet = tov.text || (domEl ? (domEl.textContent || "").trim() : tk);
        rows.push({
          kind: isSvg ? "svgText" : "text",
          id: tk,
          typeBadge: isSvg ? "نص رسم" : "نص معدّل",
          label: toWesternDigits(snippet).slice(0, 48),
          hidden: Boolean(tov.hidden),
          locked: Boolean(tov.locked),
          canZ: false,
          z: 10
        });
      });

      rows.sort(function (a, b) { return (b.z || 0) - (a.z || 0); });
      return rows;
    }

              '<button type="button" class="ps-action-pill is-secondary" data-page-add-tpl="quote">+ صفحة اقتباس</button>' +

            '</div>' +

      var listEl = document.getElementById("ps-pages-sortable");
      var dragSrcIdx = null;
      if (listEl) {
        listEl.addEventListener("dragstart", function (e) {
          var row = e.target.closest("[data-page-row-idx]");
          if (!row) return;
          dragSrcIdx = parseInt(row.getAttribute("data-page-row-idx"), 10);
          row.classList.add("is-dragging");
          if (e.dataTransfer) e.dataTransfer.effectAllowed = "move";
        });
        listEl.addEventListener("dragend", function (e) {
          var row = e.target.closest("[data-page-row-idx]");
          if (row) row.classList.remove("is-dragging");
        });
        listEl.addEventListener("dragover", function (e) { e.preventDefault(); });
        listEl.addEventListener("drop", function (e) {
          e.preventDefault();
          var targetRow = e.target.closest("[data-page-row-idx]");
          if (!targetRow || dragSrcIdx === null) return;
          var dropIdx = parseInt(targetRow.getAttribute("data-page-row-idx"), 10);
          if (!isNaN(dropIdx) && dropIdx !== dragSrcIdx) {
            movePageInOrder(dragSrcIdx, dropIdx);
          }
          dragSrcIdx = null;
        });

        var ptrSortIdx = null;
        var ptrHoverIdx = null;
        listEl.addEventListener("pointerdown", function (e) {
          if (e.pointerType === "mouse") return;
          var grip = e.target.closest(".ps-drag-grip");
          var row = grip ? grip.closest("[data-page-row-idx]") : null;
          if (!row) return;
          e.preventDefault();
          ptrSortIdx = parseInt(row.getAttribute("data-page-row-idx"), 10);
          ptrHoverIdx = ptrSortIdx;
          row.classList.add("is-dragging");
          if (grip.setPointerCapture) {
            try { grip.setPointerCapture(e.pointerId); } catch (err) {}
          }
        });
        listEl.addEventListener("pointermove", function (e) {
          if (ptrSortIdx === null) return;
          e.preventDefault();
          var hit = document.elementFromPoint(e.clientX, e.clientY);
          var overRow = hit && hit.closest ? hit.closest("[data-page-row-idx]") : null;
          var rows = listEl.querySelectorAll("[data-page-row-idx]");
          for (var r = 0; r < rows.length; r++) rows[r].classList.remove("is-drop-target");
          if (overRow) {
            var overIdx = parseInt(overRow.getAttribute("data-page-row-idx"), 10);
            if (!isNaN(overIdx)) {
              ptrHoverIdx = overIdx;
              if (overIdx !== ptrSortIdx) overRow.classList.add("is-drop-target");
            }
          }
        });
        var finishPtrSort = function () {
          if (ptrSortIdx === null) return;
          var from = ptrSortIdx;
          var to = ptrHoverIdx;
          ptrSortIdx = null;
          ptrHoverIdx = null;
          var rows = listEl.querySelectorAll("[data-page-row-idx]");
          for (var r = 0; r < rows.length; r++) rows[r].classList.remove("is-dragging", "is-drop-target");
          if (typeof to === "number" && to !== from) movePageInOrder(from, to);
        };
        listEl.addEventListener("pointerup", finishPtrSort);
        listEl.addEventListener("pointercancel", finishPtrSort);
      }
    }

    /* ----------------------------------------------------------------------
       15. POINTER DRAGGING, ROTATION, RESIZING, INLINE EDITING & SHORTCUTS
       ---------------------------------------------------------------------- */
    var dragSession = null;
    var pinchSession = null;
    var activeTextUndoKey = null;

    function ensureTextUndoSnapshotOnce(sessionKey) {
      if (activeTextUndoKey !== sessionKey) {
        pushUndoSnapshot();
        activeTextUndoKey = sessionKey;
      }
    }

    function startMoveSessionForSelection(clientX, clientY) {
      if (!selection || !selection.el) return;
      var m = getSelectedModel();
      if (!m || m.locked) {
        if (m && m.locked) showToast("🔒 العنصر مقفول — افتح القفل لتحريكه");
        return;
      }
      pushUndoSnapshot();

      if (selection.kind === "frame" || selection.kind === "shape" || selection.kind === "addedChar") {
        var host = (selection.el.parentElement && selection.el.parentElement.parentElement) ? selection.el.parentElement.parentElement : document.body;
        dragSession = {
          mode: "moveOverlayPct",
          startX: clientX,
          startY: clientY,
          origX: typeof m.x === "number" ? m.x : 50,
          origY: typeof m.y === "number" ? m.y : 50,
          hostRect: host.getBoundingClientRect()
        };
        return;
      }

      if (selection.kind === "svgText" || (selection.kind === "nativeChar" && selection.el.getAttribute("data-ps-native-char") === "svg")) {
        var svgEl = selection.el.ownerSVGElement;
        var vb = (svgEl && svgEl.viewBox && svgEl.viewBox.baseVal && svgEl.viewBox.baseVal.width)
          ? svgEl.viewBox.baseVal
          : { width: 500, height: 370 };
        dragSession = {
          mode: selection.kind === "svgText" ? "moveSvgText" : "moveNativeSvg",
          startX: clientX,
          startY: clientY,
          origDx: m.dx || 0,
          origDy: m.dy || 0,
          vbWidth: vb.width,
          vbHeight: vb.height,
          hostRect: (svgEl || document.body).getBoundingClientRect()
        };
        return;
      }

      /* HTML nativeChar or native HTML text */
      var targets = adapter.getStageTargets();
      var refHost = selection.el.offsetParent || document.body;
      for (var t = 0; t < targets.length; t++) {
        if (targets[t].pageUid === selection.pageUid && targets[t].overlayHost) {
          refHost = targets[t].overlayHost;
          break;
        }
      }
      dragSession = {
        mode: selection.kind === "text" ? "moveNativeText" : "moveNativeHtml",
        startX: clientX,
        startY: clientY,
        origDxPct: m.dxPct || 0,
        origDyPct: m.dyPct || 0,
        refHost: refHost,
        hostRect: refHost.getBoundingClientRect()
      };
    }

    function bindGlobalInteractions() {
      var ctxColorUndoArmed = false;

      rootEl.addEventListener("pointerdown", function (e) {
        if (e.target && e.target.getAttribute) {
          var ca = e.target.getAttribute("data-ctx-act");
          var cc = e.target.getAttribute("data-ctx-color");
          if (ca === "scale-slider" || cc) {
            pushUndoSnapshot();
            ctxColorUndoArmed = true;
          }
        }
        if (e.target !== ui.moveHandle && e.target !== ui.rotateKnob && e.target !== ui.resizeKnob) {
          e.stopPropagation();
        }
      });

      rootEl.addEventListener("wheel", function (e) {
        e.stopPropagation();
      }, { passive: true });

      ui.entryPill.addEventListener("click", function (e) {
        e.preventDefault();
        e.stopPropagation();
        setEditMode(true);
      });

      ui.dock.addEventListener("click", function (e) {
        var btn = e.target.closest("[data-ps-act]");
        if (!btn) return;
        e.preventDefault();
        e.stopPropagation();
        var act = btn.getAttribute("data-ps-act");
        if (act === "open-frames") openFramesModal();
        else if (act === "open-chars") renderCharsModal();
        else if (act === "open-motion") openMotionModal();
        else if (act === "open-theme") openThemeModal();
        else if (act === "open-layers") openLayersModal();
        else if (act === "open-pages") renderPagesModal();
        else if (act === "undo") performUndo();
        else if (act === "redo") performRedo();
        else if (act === "paste") pasteClipboardElement();
        else if (act === "save") saveNow(true);
        else if (act === "download") downloadStandaloneHtml({ readonly: false });
        else if (act === "open-more") openMoreModal();
        else if (act === "exit-edit") setEditMode(false);
      });

      ui.ctxBar.addEventListener("click", function (e) {
        var btn = e.target.closest("[data-ctx-act]");
        if (!btn || !selection) return;
        e.preventDefault();
        e.stopPropagation();
        var act = btn.getAttribute("data-ctx-act");
        var model = getSelectedModel();
        if (!model) return;

        if (act === "open-inspector") openInspectorModal();
        else if (act === "open-motion") openMotionModal();
        else if (act === "trigger-native-btn") triggerSelectedInteractiveButton();
        else if (act === "toggle-lock") {
          pushUndoSnapshot();
          model.locked = !model.locked;
          applyAllStageOverrides();
          renderContextBar();
          syncSelectionRing();
          scheduleAutoSave();
        } else if (act === "copy-el") {
          copySelectedElement();
        } else if (act === "z-front") {
          adjustSelectedLayerZ(5);
        } else if (act === "z-back") {
          adjustSelectedLayerZ(-5);
        } else if (act === "scale-up") {
          scaleSelectedItem((model.scale || 1) + 0.15, true);
        } else if (act === "scale-down") {
          scaleSelectedItem((model.scale || 1) - 0.15, true);
        } else if (act === "flip") {
          pushUndoSnapshot();
          if (selection.kind === "shape") model.flipX = !model.flipX;
          else model.flip = !model.flip;
          applyAllStageOverrides();
          scheduleAutoSave();
        } else if (act === "flip-y") {
          pushUndoSnapshot();
          model.flipY = !model.flipY;
          applyAllStageOverrides();
          scheduleAutoSave();
        } else if (act === "reset-native") {
          pushUndoSnapshot();
          var nPage = ensurePageRecord(selection.pageUid);
          delete nPage.nativeCharOverrides[selection.id];
          applyAllStageOverrides();
          renderContextBar();
          scheduleAutoSave();
          showToast("تمت إعادة العنصر الأصلي لوضعه الافتراضي ✓");
        } else if (act === "frame-tail") {
          pushUndoSnapshot();
          var curTail = resolveFrameVisualDefaults(model).tail || "none";
          var tIdx = 0;
          for (var ti = 0; ti < BUBBLE_TAILS.length; ti++) {
            if (BUBBLE_TAILS[ti].id === curTail) { tIdx = ti; break; }
          }
          model.tail = BUBBLE_TAILS[(tIdx + 1) % BUBBLE_TAILS.length].id;
          applyAllStageOverrides();
          scheduleAutoSave();
        } else if (act === "frame-wider") {
          pushUndoSnapshot();
          model.width = clamp((model.width || 290) + 32, 120, 780);
          applyAllStageOverrides();
          scheduleAutoSave();
        } else if (act === "frame-narrower") {
          pushUndoSnapshot();
          model.width = clamp((model.width || 290) - 32, 120, 780);
          applyAllStageOverrides();
          scheduleAutoSave();
        } else if (act === "frame-font-up") {
          pushUndoSnapshot();
          model.fontSize = clamp((model.fontSize || 18) + 2, 10, 72);
          applyAllStageOverrides();
          scheduleAutoSave();
        } else if (act === "frame-font-down") {
          pushUndoSnapshot();
          model.fontSize = clamp((model.fontSize || 18) - 2, 10, 72);
          applyAllStageOverrides();
          scheduleAutoSave();
        } else if (act === "text-bigger" || act === "text-smaller") {
          pushUndoSnapshot();
          var curPx = parseInt(model.fontSize, 10) || (selection.el ? (parseFloat(getComputedStyle(selection.el).fontSize) || 16) : 16);
          var nextPx = clamp(Math.round(curPx + (act === "text-bigger" ? 2 : -2)), 10, 96);
          model.fontSize = nextPx + "px";
          applyAllStageOverrides();
          scheduleAutoSave();
        } else if (act === "text-bold") {
          pushUndoSnapshot();
          model.fontWeight = model.fontWeight === "800" ? "400" : "800";
          applyAllStageOverrides();
          renderContextBar();
          scheduleAutoSave();
        } else if (act === "text-italic") {
          pushUndoSnapshot();
          model.fontStyle = model.fontStyle === "italic" ? "normal" : "italic";
          applyAllStageOverrides();
          renderContextBar();
          scheduleAutoSave();
        } else if (act === "text-underline") {
          pushUndoSnapshot();
          model.textDecoration = model.textDecoration === "underline" ? "none" : "underline";
          applyAllStageOverrides();
          renderContextBar();
          scheduleAutoSave();
        } else if (act === "text-align") {
          pushUndoSnapshot();
          var aligns = ["right", "center", "left"];
          model.textAlign = aligns[(aligns.indexOf(model.textAlign || "right") + 1) % aligns.length];
          applyAllStageOverrides();
          scheduleAutoSave();
        } else if (act === "clone-as-frame") {
          cloneSelectedTextAsFrame();
        } else if (act === "reset-text") {
          pushUndoSnapshot();
          var tPage = ensurePageRecord(selection.pageUid);
          delete tPage.textOverrides[selection.id];
          adapter.hydrateModelTexts(studioState.pages);
          applyAllStageOverrides();
          renderContextBar();
          scheduleAutoSave();
          showToast("تمت استعادة النص الأصلي وتنسيقه ✓");
        } else if (act === "del-item") {
          deleteSelectedItem();
        }
      });

      ui.ctxBar.addEventListener("input", function (e) {
        if (!selection || !e.target) return;
        var model = getSelectedModel();
        if (!model) return;

        if (e.target.id === "ps-ctx-svg-input" && selection.kind === "svgText") {
          ensureTextUndoSnapshotOnce("svgtxt::" + selection.pageUid + "::" + selection.id);
          model.text = e.target.value;
          model.hidden = false;
          if (selection.el) applySvgTextOverride(selection.el, model);
          syncSelectionRing();
          scheduleAutoSave();
          return;
        }

        if (e.target.getAttribute("data-ctx-act") === "scale-slider") {
          var val = parseInt(e.target.value, 10) || 100;
          scaleSelectedItem(val / 100, false);
          return;
        }

        var cKind = e.target.getAttribute("data-ctx-color");
        if (cKind) {
          if (!ctxColorUndoArmed) { pushUndoSnapshot(); ctxColorUndoArmed = true; }
          var hex = e.target.value;
          if (cKind === "char-primary") model.primaryColor = hex;
          else if (cKind === "char-secondary") model.secondaryColor = hex;
          else if (cKind === "char-skin") model.skinColor = hex;
          else if (cKind === "shape-fill") model.fill = hex;
          else if (cKind === "shape-stroke") model.stroke = hex;
          else if (cKind === "frame-bg") model.bg = hex;
          else if (cKind === "frame-fg") model.fg = hex;
          else if (cKind === "frame-bd") model.borderColor = hex;
          else if (cKind === "text-fg") model.color = hex;
          else if (cKind === "text-bg") model.bgColor = hex;
          applyAllStageOverrides();
          scheduleAutoSave();
        }
      });

      ui.ctxBar.addEventListener("change", function (e) {
        ctxColorUndoArmed = false;
        if (e.target && e.target.getAttribute("data-ctx-act") === "char-mood" && selection) {
          var m = getSelectedModel();

            pushUndoSnapshot();
            m.mood = e.target.value;

      ui.modalHost.addEventListener("click", function (e) {
        if (e.target === ui.modalHost || e.target.closest("[data-ps-close-modal]")) {
          closeModal();
          return;

        /* Frames & Shapes tabs/items */
        var fTab = e.target.closest("[data-frame-tab]");

          activeFrameModalTab = fTab.getAttribute("data-frame-tab");
          openFramesModal();
          return;
