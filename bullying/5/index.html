:root {

  --card-shadow: 0 3px 0 rgba(58, 50, 44, 0.10), 0 12px 28px rgba(34, 29, 26, 0.05);
  --pill-shadow: 0 2px 0 rgba(58, 50, 44, 0.14);

  --art-plate-bg: transparent;

  --ease-editorial: cubic-bezier(0.22, 1, 0.36, 1);

/* The Woven Linen Gingham Slide Sheet (Direct Homage + Luxury Elevation) */
.editorial-sheet {
  position: relative;

  scroll-margin-top: 78px;
  border-radius: 26px;
  border: 1.5px solid var(--ink-border);
  background-color: var(--paper-base);

  box-shadow: var(--sheet-shadow);

  animation: sheetReveal 0.38s var(--ease-editorial) both;
}

.editorial-sheet.anim-next {

}

}

@keyframes sheetReveal {
  from {
    opacity: 0;

  }
  to {

    transform: translateY(0) scale(1);

}

}

@keyframes sheetFromRight {

      bodyBlocks += '<div class="citations-bar">' +
        '<span class="citations-label">توثيق المراجع:</span>' +
        slide.refs.map(function (rNum) {
          return '<button type="button" class="cite-chip" data-cite="' + rNum + '" title="فتح المرجع رقم ' + rNum + '">[' + rNum + ']</button>';
        }).join("") +
      '</div>';
    }

    var headingTag = state.view === "scroll" && index > 0 ? "h2" : "h1";
    return '<div class="sheet-inner">' +
      '<div class="sheet-content-col">' +
        '<div class="sheet-folio-row">' +
          '<span class="sheet-kicker"><span class="sheet-kicker-num">' + pad2(index + 1) + '</span> ' + escapeHtml(slide.kicker) + '</span>' +
          '<span class="sheet-page-stamp">' + pad2(index + 1) + ' / ' + pad2(total) + '</span>' +
        '</div>' +
        '<' + headingTag + ' class="sheet-title">' + escapeHtml(slide.title) + '</' + headingTag + '>' +
        (slide.subtitle ? '<p class="sheet-subtitle">' + escapeHtml(slide.subtitle) + '</p>' : '') +
        bodyBlocks +
      '</div>' +
      '<div class="sheet-art-col">' +
        '<div class="art-stage-frame">' + ART.render(slide.art, uid) + '</div>' +
        (slide.artCaption ? '<div class="art-caption">' + escapeHtml(slide.artCaption) + '</div>' : '') +
      '</div>' +
    '</div>';
  }

  function renderSlideSheetHtml(slide, index, total, animCls) {
    var layoutClass = slide.layout === "cover" ? " is-cover" : (slide.layout === "wide" ? " is-wide" : "");
    var motionClass = animCls ? " " + animCls : "";
    return '<article class="editorial-sheet' + layoutClass + motionClass + '" id="slide-sheet-' + index + '" data-slide-idx="' + index + '">' +
      renderSlideInnerHtml(slide, index, total) +
    '</article>';
  }

  /* Update only a single slide sheet in-place (preserves scroll & avoids 25-slide DOM rebuild) */
  function updateSingleSlideInPlace(slideIdx) {
    var sheetEl = document.getElementById("slide-sheet-" + slideIdx);
    var slide = SLIDES[slideIdx];
    if (!sheetEl || !slide) {
      renderMainStage(true);
      return;
    }
    sheetEl.innerHTML = renderSlideInnerHtml(slide, slideIdx, SLIDES.length);
    updateScrollHint();
  }

  /* Render Canva-upgraded 5-dot sliding indicator (• ▬ • • •) */
  function renderPagerDots() {
    var total = SLIDES.length;
    var cur = state.idx;
    var winSize = 5;
    var start = Math.max(0, Math.min(cur - 2, total - winSize));
    var end = Math.min(total - 1, start + winSize - 1);

    var html = "";
    for (var i = start; i <= end; i++) {
      var cls = "pager-dot";
      if (i === cur) cls += " is-active";
      else if ((i === start && start > 0) || (i === end && end < total - 1)) cls += " is-edge";
      html += '<span class="' + cls + '"></span>';
    }
    els.pagerDots.innerHTML = html;
    els.pagerFraction.textContent = pad2(cur + 1) + " / " + pad2(total);
  }

  function updateScrollHint() {
    if (!els.scrollMoreHint) return;
    if (state.view !== "slides") {
      els.scrollMoreHint.hidden = true;
      return;
    }
    var vp = els.stageViewport;
    var remaining = vp.scrollHeight - vp.scrollTop - vp.clientHeight;
    els.scrollMoreHint.hidden = !(remaining > 26);
  }

  function syncChrome() {
    var total = SLIDES.length;
    var curSlide = SLIDES[state.idx] || SLIDES[0];

    els.axisCrumbText.textContent = curSlide.axisTitle;
    els.btnPrevSlide.disabled = state.idx <= 0;
    els.btnNextSlide.disabled = state.idx >= total - 1;

    if (state.view === "slides") {
      var pct = ((state.idx + 1) / total) * 100;
      els.topProgressBar.style.width = pct.toFixed(2) + "%";
      renderPagerDots();
    }
    updateScrollHint();
  }

  function renderMainStage(preserveScroll) {
    var total = SLIDES.length;
    if (state.view === "slides") {
      var slide = SLIDES[state.idx] || SLIDES[0];
      var animCls = state.navDir === "next" ? "anim-next" : (state.navDir === "prev" ? "anim-prev" : "");
      els.slidesContainer.innerHTML = renderSlideSheetHtml(slide, state.idx, total, animCls);
      state.navDir = "";
      if (!preserveScroll) {
        els.stageViewport.scrollTop = 0;
      }
    } else {
      els.slidesContainer.innerHTML = SLIDES.map(function (s, idx) {
        return renderSlideSheetHtml(s, idx, total, "");
      }).join("");
    }
    syncChrome();
    requestAnimationFrame(updateScrollHint);
  }

  function goToSlide(targetIdx, dirHint) {
    var clamped = Math.max(0, Math.min(SLIDES.length - 1, targetIdx));
    if (dirHint) {
      state.navDir = dirHint;
    } else if (clamped > state.idx) {
      state.navDir = "next";
    } else if (clamped < state.idx) {
      state.navDir = "prev";
    } else {
      state.navDir = "";
    }
    state.idx = clamped;

    if (state.view === "scroll") {
      var targetEl = document.getElementById("slide-sheet-" + clamped);
      if (targetEl) {
        targetEl.scrollIntoView({ behavior: "smooth", block: "start" });
      }
      syncChrome();
      try {
        history.replaceState(null, "", "#slide-" + (clamped + 1));
      } catch (e) {}
      return;
    }

    renderMainStage(false);
    try {
      history.replaceState(null, "", "#slide-" + (clamped + 1));
    } catch (e) {}
  }

  function nextSlide() {
    if (state.idx < SLIDES.length - 1) goToSlide(state.idx + 1, "next");
  }

  function prevSlide() {
    if (state.idx > 0) goToSlide(state.idx - 1, "prev");
  }

  function toggleViewMode() {
    state.view = state.view === "slides" ? "scroll" : "slides";
    els.body.setAttribute("data-view", state.view);
    var isScroll = state.view === "scroll";
    els.btnToggleView.classList.toggle("is-active", isScroll);
    els.lblToggleView.textContent = isScroll ? "عرض الشرائح" : "قراءة متصلة";
    state.navDir = "";
    renderMainStage(false);
    if (isScroll) {
      var curEl = document.getElementById("slide-sheet-" + state.idx);
      if (curEl) curEl.scrollIntoView({ behavior: "instant", block: "start" });
      syncScrollProgressAndSpy();
    } else {
      window.scrollTo(0, 0);
    }
  }

  function applyTheme(theme) {
    state.theme = theme === "espresso" ? "espresso" : "linen";
    els.root.setAttribute("data-theme", state.theme);
    var isDark = state.theme === "espresso";
    els.iconMoon.hidden = isDark;
    els.iconSun.hidden = !isDark;
    if (els.metaTheme) {
      els.metaTheme.setAttribute("content", isDark ? "#191613" : "#FAF6EE");
    }
    try {
      localStorage.setItem("bullying_editorial_theme", state.theme);
    } catch (e) {}
  }

  /* Continuous Scroll Mode: Progress Bar + Live Active Slide & Axis Scrollspy */
  function syncScrollProgressAndSpy() {
    if (state.view !== "scroll") return;
    var docH = document.documentElement.scrollHeight - window.innerHeight;
    var pct = docH > 0 ? Math.min(100, Math.max(4, (window.scrollY / docH) * 100)) : 100;
    els.topProgressBar.style.width = pct.toFixed(2) + "%";

    var sheets = els.slidesContainer.querySelectorAll(".editorial-sheet");
    if (!sheets.length) return;

    var activeIdx = 0;
    if (docH > 0 && window.scrollY >= docH - 24) {
      activeIdx = sheets.length - 1;
    } else {
      var probeY = 128;
      for (var i = 0; i < sheets.length; i++) {
        var r = sheets[i].getBoundingClientRect();
        if (r.top <= probeY) activeIdx = i;
        else break;
      }
    }

    if (activeIdx !== state.idx) {
      state.idx = activeIdx;
      var curSlide = SLIDES[state.idx] || SLIDES[0];
      els.axisCrumbText.textContent = curSlide.axisTitle;
    }
  }

  function syncModalBodyLock() {
    var anyOpen = !els.tocDrawer.hidden || !els.refsDrawer.hidden;
    els.body.classList.toggle("is-modal-open", anyOpen);
  }

  /* Drawers: Table of Contents & 79 References */
  function openTocDrawer(triggerEl) {
    lastModalTrigger = triggerEl || document.activeElement;
    var groups = {};
    var order = [];
    SLIDES.forEach(function (s, idx) {
      if (!groups[s.axisTitle]) {
        groups[s.axisTitle] = [];
        order.push(s.axisTitle);
      }
      groups[s.axisTitle].push({ slide: s, idx: idx });
    });

    els.tocDrawerBody.innerHTML = order.map(function (gTitle) {
      return '<div class="toc-axis-group">' +
        '<h3 class="toc-axis-label">' + escapeHtml(gTitle) + '</h3>' +
        '<div class="toc-slides-grid">' +
          groups[gTitle].map(function (item) {
            var curCls = item.idx === state.idx ? " is-current" : "";
            return '<button type="button" class="toc-slide-card' + curCls + '" data-toc-jump="' + item.idx + '">' +
              '<span class="toc-slide-num">' + pad2(item.idx + 1) + '</span>' +
              '<span class="toc-slide-title">' + escapeHtml(item.slide.title) + '</span>' +
            '</button>';
          }).join("") +
        '</div>' +
      '</div>';
    }).join("");

    els.tocDrawer.hidden = false;
    syncModalBodyLock();
    setTimeout(function () {
      var curBtn = els.tocDrawerBody.querySelector(".toc-slide-card.is-current") || els.tocDrawer.querySelector('[data-close="toc"]');
      if (curBtn) curBtn.focus({ preventScroll: false });
    }, 30);
  }

  function closeTocDrawer(restoreFocus) {
    els.tocDrawer.hidden = true;
    syncModalBodyLock();
    if (restoreFocus !== false && lastModalTrigger && typeof lastModalTrigger.focus === "function") {
      try { lastModalTrigger.focus({ preventScroll: true }); } catch (e) {}
    }
  }

  function renderDrawerRefs() {
    els.drawerRefCats.setAttribute("role", "tablist");
    els.drawerRefCats.setAttribute("aria-label", "تصنيفات أرشيف المراجع");
    els.drawerRefCats.innerHTML = CAT_LABELS.map(function (c) {
      var isSel = c.key === state.drawerRefCat;
      var cls = isSel ? "seg-tab is-active" : "seg-tab";
      return '<button type="button" role="tab" aria-selected="' + (isSel ? "true" : "false") + '" class="' + cls + '" data-drawer-cat="' + c.key + '">' + escapeHtml(c.label) + '</button>';
    }).join("");

    var list = filterRefs(state.drawerRefQuery, state.drawerRefCat);
    els.drawerRefsList.innerHTML = renderRefsGridHtml(list, state.highlightRefNum, "drawer-ref-card-");
  }

  function openRefsDrawer(citeNum, triggerEl) {
    lastModalTrigger = triggerEl || document.activeElement;
    state.highlightRefNum = citeNum || null;
    if (citeNum) {
      state.drawerRefQuery = "";
      state.drawerRefCat = "all";
      els.drawerRefSearch.value = "";
    }
    renderDrawerRefs();
    els.refsDrawer.hidden = false;
    syncModalBodyLock();

    setTimeout(function () {
      if (citeNum) {
        var card = els.drawerRefsList.querySelector("#drawer-ref-card-" + citeNum);
        if (card) {
          card.scrollIntoView({ behavior: "smooth", block: "center" });
          card.focus({ preventScroll: true });
          return;
        }
      }
      if (els.drawerRefSearch) els.drawerRefSearch.focus({ preventScroll: true });
    }, 50);
  }

  function closeRefsDrawer(restoreFocus) {
    els.refsDrawer.hidden = true;
    syncModalBodyLock();
    if (restoreFocus !== false && lastModalTrigger && typeof lastModalTrigger.focus === "function") {
      try { lastModalTrigger.focus({ preventScroll: true }); } catch (e) {}
    }
  }

  function trapModalTab(e, drawerEl) {
    var focusables = drawerEl.querySelectorAll('a[href], button:not(:disabled), input:not(:disabled), [tabindex]:not([tabindex="-1"])');
    if (!focusables.length) return;
    var first = focusables[0];
    var last = focusables[focusables.length - 1];
    if (e.shiftKey && document.activeElement === first) {
      e.preventDefault();
      last.focus();
    } else if (!e.shiftKey && document.activeElement === last) {
      e.preventDefault();
      first.focus();
    }
  }

  /* Event Listeners & Delegation */
  function bindEvents() {
    els.btnPrevSlide.addEventListener("click", prevSlide);
    els.btnNextSlide.addEventListener("click", nextSlide);
    els.btnPagerIndex.addEventListener("click", function () { openTocDrawer(els.btnPagerIndex); });
    els.btnOpenToc.addEventListener("click", function () { openTocDrawer(els.btnOpenToc); });
    els.btnOpenRefs.addEventListener("click", function () { openRefsDrawer(null, els.btnOpenRefs); });
    els.btnToggleView.addEventListener("click", toggleViewMode);
    els.btnToggleTheme.addEventListener("click", function () {
      applyTheme(state.theme === "linen" ? "espresso" : "linen");
    });

    if (els.scrollMoreHint) {
      els.scrollMoreHint.addEventListener("click", function () {
        els.stageViewport.scrollBy({ top: Math.round(els.stageViewport.clientHeight * 0.72), behavior: "smooth" });
      });
    }

    els.stageViewport.addEventListener("scroll", updateScrollHint, { passive: true });
    window.addEventListener("resize", updateScrollHint, { passive: true });

    /* Persist <details class="protocol-details"> open/close state across widget updates */
    els.slidesContainer.addEventListener("toggle", function (e) {
      var det = e.target;
      if (det && det.matches && det.matches("details[data-protocol-slide]")) {
        var sid = det.getAttribute("data-protocol-slide");
        state.protocolOpen[sid] = det.open;
        updateScrollHint();
      }
    }, true);

    /* Delegated clicks inside slidesContainer */
    els.slidesContainer.addEventListener("click", function (e) {
      var jumpBtn = e.target.closest("[data-jump]");
      if (jumpBtn) {
        goToSlide(parseInt(jumpBtn.getAttribute("data-jump"), 10));
        return;
      }

      var citeBtn = e.target.closest("[data-cite]");
      if (citeBtn) {
        openRefsDrawer(parseInt(citeBtn.getAttribute("data-cite"), 10), citeBtn);
        return;
      }

      var wBtn = e.target.closest("[data-widget]");
      if (!wBtn) return;
      var wType = wBtn.getAttribute("data-widget");
      var wVal = wBtn.getAttribute("data-val");
      var parentSheet = wBtn.closest(".editorial-sheet");
      var targetSlideIdx = parentSheet ? parseInt(parentSheet.getAttribute("data-slide-idx"), 10) : state.idx;

      if (wType === "defTab") state.defTab = wVal;
      else if (wType === "roleTab") state.roleId = wVal;
      else if (wType === "banduraTab") state.banduraIdx = parseInt(wVal, 10);
      else if (wType === "diagBehavior") state.diagTab = wVal;
      else if (wType === "diagBehaviorDesk") { state.diagTab = wVal; state.diagDesktopMatrix = false; }
      else if (wType === "diagShowFullTable") state.diagDesktopMatrix = true;
      else if (wType === "w1Select") state.w1Action = wVal;
      else if (wType === "w2Card") { state.w2CardIdx = parseInt(wVal, 10); state.w2Mirror = false; }
      else if (wType === "w2ToggleMirror") state.w2Mirror = !state.w2Mirror;
      else if (wType === "w3Case") state.w3CaseIdx = parseInt(wVal, 10);
      else if (wType === "w3Answer") state.w3Answers[state.w3CaseIdx] = wVal;
      else if (wType === "w3NextCase") {
        var totalCases = (MODELS.workshopQuizCases || []).length;
        if (state.w3CaseIdx < totalCases - 1) state.w3CaseIdx++;
      } else if (wType === "w3Reset") {
        state.w3Answers = {};
        state.w3CaseIdx = 0;
      } else if (wType === "inlineRefCat") state.inlineRefCat = wVal;

      updateSingleSlideInPlace(targetSlideIdx);
    });

    /* Live search inside Slide 25 Inline Reference Library */
    els.slidesContainer.addEventListener("input", function (e) {
      if (e.target && e.target.id === "inlineRefSearchInput") {
        state.inlineRefQuery = e.target.value;
        var grid = document.getElementById("inlineRefsGrid");
        if (grid) {
          grid.innerHTML = renderRefsGridHtml(filterRefs(state.inlineRefQuery, state.inlineRefCat), null, "inline-ref-card-");
        }
        updateScrollHint();
      }
    });

    /* Drawers close & interactions */
    els.tocDrawer.addEventListener("click", function (e) {
      if (e.target === els.tocDrawer || e.target.closest('[data-close="toc"]')) {
        closeTocDrawer(true);
        return;
      }
      var jumpCard = e.target.closest("[data-toc-jump]");
      if (jumpCard) {
        closeTocDrawer(false);
        goToSlide(parseInt(jumpCard.getAttribute("data-toc-jump"), 10));
      }
    });

    els.refsDrawer.addEventListener("click", function (e) {
      if (e.target === els.refsDrawer || e.target.closest('[data-close="refs"]')) {
        closeRefsDrawer(true);
        return;
      }
      var catBtn = e.target.closest("[data-drawer-cat]");
      if (catBtn) {
        state.drawerRefCat = catBtn.getAttribute("data-drawer-cat");
        state.highlightRefNum = null;
        renderDrawerRefs();
      }
    });

    els.drawerRefSearch.addEventListener("input", function () {
      state.drawerRefQuery = els.drawerRefSearch.value;
      state.highlightRefNum = null;
      renderDrawerRefs();
    });

    /* Scroll progress & live Axis scrollspy in Continuous Magazine Mode */
    window.addEventListener("scroll", syncScrollProgressAndSpy, { passive: true });

    /* Mobile Touch Swipe Navigation (RTL-Natural: pull right dx > 0 advances to left-hand next slide) */
    var touchX = 0, touchY = 0, touchActive = false;
    els.stageViewport.addEventListener("touchstart", function (e) {
      if (state.view !== "slides" || !e.touches || e.touches.length !== 1) {
        touchActive = false;
        return;
      }
      if (e.target.closest("input, .matrix-table-wrap, .refs-scroll-box")) {
        touchActive = false;
        return;
      }
      touchActive = true;
      touchX = e.touches[0].clientX;
      touchY = e.touches[0].clientY;
    }, { passive: true });

    els.stageViewport.addEventListener("touchend", function (e) {
      if (!touchActive || state.view !== "slides" || !e.changedTouches || !e.changedTouches.length) return;
      touchActive = false;
      var dx = e.changedTouches[0].clientX - touchX;
      var dy = e.changedTouches[0].clientY - touchY;
      if (Math.abs(dx) > 54 && Math.abs(dx) > Math.abs(dy) * 1.85) {
        if (dx > 0) nextSlide();
        else prevSlide();
      }
    }, { passive: true });

    /* Keyboard Shortcuts (RTL-consistent arrows + Space/Home/End/Escape + Modal Focus Trap) */
    document.addEventListener("keydown", function (e) {
      if (e.key === "Tab") {
        if (!els.refsDrawer.hidden) { trapModalTab(e, els.refsDrawer); return; }
        if (!els.tocDrawer.hidden) { trapModalTab(e, els.tocDrawer); return; }
      }

      if (e.metaKey || e.ctrlKey || e.altKey) return;
      var inInput = e.target && e.target.closest("input, textarea");

      if (e.key === "Escape") {
        if (!els.refsDrawer.hidden) { e.preventDefault(); closeRefsDrawer(true); return; }
        if (!els.tocDrawer.hidden) { e.preventDefault(); closeTocDrawer(true); return; }
        return;
      }
      if (inInput || !els.refsDrawer.hidden || !els.tocDrawer.hidden) return;
      if (state.view !== "slides") return;

      if (e.key === "ArrowLeft" || e.key === "PageDown" || e.key === " ") {
        if (e.key === " " && e.target && e.target.closest("button, summary, a")) return;
        e.preventDefault();
        nextSlide();
      } else if (e.key === "ArrowRight" || e.key === "PageUp") {
        e.preventDefault();
        prevSlide();
      } else if (e.key === "Home") {
        e.preventDefault();
        goToSlide(0);
      } else if (e.key === "End") {
        e.preventDefault();
        goToSlide(SLIDES.length - 1);
      }
    });

    window.addEventListener("hashchange", function () {
      var m = String(window.location.hash || "").match(/^#slide-(\d+)$/);
      if (m) {
        var target = parseInt(m[1], 10) - 1;
        if (target >= 0 && target < SLIDES.length && target !== state.idx) {
          goToSlide(target);
        }
      }
    });
  }

  function init() {
    /* Show Portal Back Link automatically when hosted inside /bullying/5/ */
    if (window.location.pathname.indexOf("/bullying/") !== -1 && window.location.protocol !== "file:" && els.portalBackLink) {
      els.portalBackLink.hidden = false;
    }
    window.addEventListener("project:unlocked", function () {
      requestAnimationFrame(updateScrollHint);
    });

    try {
      var savedTheme = localStorage.getItem("bullying_editorial_theme");
      if (savedTheme === "espresso" || savedTheme === "linen") {
        applyTheme(savedTheme);
      }
    } catch (e) {}

    /* Restore slide from URL hash (#slide-4) */
    var match = String(window.location.hash || "").match(/^#slide-(\d+)$/);
    if (match) {
      var parsed = parseInt(match[1], 10) - 1;
      if (parsed >= 0 && parsed < SLIDES.length) state.idx = parsed;
    }

    bindEvents();
    renderMainStage(false);
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", init);
  } else {
    init();
  }
})();
  </script>

      };
    } catch (e) {
      callback(null);
    }
  }

  function idbClear(key) {
    try {
      if (!global.indexedDB) return;
      var req = global.indexedDB.open("PresentationStudioDB", 1);
      req.onsuccess = function (e) {
        var db = e.target.result;
        if (db.objectStoreNames.contains("states")) {
          db.transaction("states", "readwrite").objectStore("states").delete(key);
        }
      };
    } catch (e) {}
  }

  function optimizeUploadedImageFile(file, callback) {
    var reader = new FileReader();
    reader.onload = function () {
      var rawDataUrl = String(reader.result || "");
      if (!rawDataUrl || String(file.type || "").indexOf("svg") !== -1) {
        callback(rawDataUrl);
        return;
      }
      var img = new Image();
      img.onload = function () {
        var maxDim = 1100;
        var w = img.naturalWidth || img.width || 0;
        var h = img.naturalHeight || img.height || 0;
        if (w > 0 && h > 0 && (w > maxDim || h > maxDim || file.size > 350 * 1024)) {
          var ratio = Math.min(1, maxDim / Math.max(w, h));
          var cw = Math.max(1, Math.round(w * ratio));
          var ch = Math.max(1, Math.round(h * ratio));
          try {
            var canvas = document.createElement("canvas");
            canvas.width = cw;
            canvas.height = ch;
            var ctx = canvas.getContext("2d");
            ctx.drawImage(img, 0, 0, cw, ch);
            var webp = canvas.toDataURL("image/webp", 0.86);
            if (webp && webp.indexOf("data:image/webp") === 0 && webp.length < rawDataUrl.length) {
              callback(webp);
              return;
            }
            var png = canvas.toDataURL("image/png");
            if (png && png.length < rawDataUrl.length) {
              callback(png);
              return;
            }
          } catch (err) {}
        }
        callback(rawDataUrl);
      };
      img.onerror = function () {
        callback(rawDataUrl);
      };
      img.src = rawDataUrl;
    };
    reader.readAsDataURL(file);
  }

  /* ==========================================================================
     8. MAIN PRESENTATION STUDIO CONTROLLER
     ========================================================================== */
  function createStudio() {
    injectStudioStyles();

    var adapter = null;
    var exportScopeId = (BAKED_PAYLOAD && BAKED_PAYLOAD.exportId) ? BAKED_PAYLOAD.exportId : "origin";
    var storageKey = getStorageKey(exportScopeId);

    var studioState = {
      version: 1,
      exportId: exportScopeId,
      readonly: Boolean(BAKED_PAYLOAD && BAKED_PAYLOAD.readonly),
      savedAt: 0,
      pageOrder: [],
      customPages: {},
      pages: {}
    };

    var editMode = false;
    var hasSavedEdits = false;
    var undoStack = [];
    var selection = null;
    var activeModal = null;
    var activeCharTab = "editorial";
    var selectedCastMood = "calm";
    var autoSaveTimer = null;
    var toastTimer = null;

    function ensurePageRecord(pageUid) {
      if (!studioState.pages[pageUid]) {
        studioState.pages[pageUid] = {
          textOverrides: {},
          frames: [],
          addedChars: [],
          nativeCharOverrides: {}
        };
      }
      return studioState.pages[pageUid];
    }

    function pushUndoSnapshot() {
      var snap = deepClone({
        pageOrder: studioState.pageOrder,
        customPages: studioState.customPages,
        pages: studioState.pages
      });
      undoStack.push(snap);
      if (undoStack.length > 25) undoStack.shift();
      syncDockState();
    }

    function performUndo() {
      if (!undoStack.length) return;
      var prev = undoStack.pop();
      var curUid = adapter.getCurrentPageUid();
      studioState.pageOrder = prev.pageOrder;
      studioState.customPages = prev.customPages || {};
      studioState.pages = prev.pages || {};
      activeTextUndoKey = null;
      clearSelection();
      resetPersistentModifiedElements();
      adapter.hydrateModelTexts(studioState.pages);
      var nextIdx = studioState.pageOrder.indexOf(curUid);
      adapter.rebuildPages(studioState.pageOrder, studioState.customPages, nextIdx >= 0 ? nextIdx : 0);
      applyAllStageOverrides();
      scheduleAutoSave();
      syncDockState();
      showToast("تم التراجع عن آخر خطوة ↶");
    }

    function loadInitialState(initialOrder) {
      studioState.pageOrder = initialOrder.slice();
      var loaded = null;

      if (BAKED_PAYLOAD && BAKED_PAYLOAD.state) {
        loaded = deepClone(BAKED_PAYLOAD.state);
      }

      try {
        var raw = global.localStorage ? global.localStorage.getItem(storageKey) : null;
        if (raw) {
          var localParsed = JSON.parse(raw);
          if (localParsed && (!loaded || (localParsed.savedAt || 0) >= (loaded.savedAt || 0))) {
            loaded = localParsed;
          }
        }
      } catch (e) {}

      if (loaded) {
        if (Array.isArray(loaded.pageOrder) && loaded.pageOrder.length) {
          studioState.pageOrder = loaded.pageOrder.slice();
        }
        studioState.customPages = loaded.customPages || {};
        studioState.pages = loaded.pages || {};
        studioState.savedAt = loaded.savedAt || Date.now();
        hasSavedEdits = true;
      }
    }

    function saveNow(showNotification) {
      studioState.savedAt = Date.now();
      hasSavedEdits = true;
      var serialized = JSON.stringify(studioState);
      var savedOk = false;
      try {
        if (global.localStorage) {
          global.localStorage.setItem(storageKey, serialized);
          savedOk = true;
        }
      } catch (e) {}
      idbSave(storageKey, studioState);
      updateEntryBadge();
      if (showNotification) {
        showToast(savedOk ? "تم حفظ جميع التغييرات محلياً ✓" : "تم حفظ التغييرات في قاعدة المتصفح ✓");
      }
      return savedOk;
    }

    function scheduleAutoSave() {
      if (autoSaveTimer) clearTimeout(autoSaveTimer);
      autoSaveTimer = setTimeout(function () {
        saveNow(false);
      }, 350);
    }

    function resetAllChanges() {
      try {
        if (global.localStorage) global.localStorage.removeItem(storageKey);
      } catch (e) {}
      idbClear(storageKey);
      undoStack = [];
      activeTextUndoKey = null;
      studioState.savedAt = 0;
      studioState.pageOrder = adapter.initialOrder.slice();
      studioState.customPages = {};
      studioState.pages = {};

      resetPersistentModifiedElements();

    }

    /* ----------------------------------------------------------------------
       9. EXPORT STANDALONE LOCAL HTML FILE WITH ALL EDITS BAKED IN
       ---------------------------------------------------------------------- */
    function buildStandaloneHtmlString(opts) {
      var options = opts || {};
      saveNow(false);

      var baseHtml = INITIAL_CLEAN_HTML || capturePristineSnapshot();
      var newExportId = "exp_" + Date.now().toString(36);
      var exportPayload = {
        exportId: newExportId,
        readonly: Boolean(options.readonly),
        exportedAt: Date.now(),
        state: deepClone(studioState)
      };

      var safeJson = JSON.stringify(exportPayload).replace(/</g, "\\u003c");
      var bakedTag = "<" + 'script id="ps-baked-state" type="application/json">' + safeJson + "<" + "/script>\n";

      var scriptAnchor = "<" + 'script id="ps-studio-script"';
      var anchorPos = baseHtml.indexOf(scriptAnchor);
      if (anchorPos !== -1) {
        return baseHtml.slice(0, anchorPos) + bakedTag + baseHtml.slice(anchorPos);
      }

      var bodyClose = baseHtml.lastIndexOf("<" + "/body>");
      if (bodyClose !== -1) {
        return baseHtml.slice(0, bodyClose) + bakedTag + baseHtml.slice(bodyClose);
      }
      return baseHtml + "\n" + bakedTag;
    }

    function downloadStandaloneHtml(opts) {
      var options = opts || {};
      var htmlContent = buildStandaloneHtmlString(options);
      var rawBase = "presentation";
      try {
        var rawPath = (global.location && global.location.pathname) ? global.location.pathname : "";
        var segs = rawPath.replace(/\/+$/, "").split("/").filter(Boolean);
        var lastSeg = segs.length ? segs[segs.length - 1] : "";
        if (lastSeg && /\.html?$/i.test(lastSeg) && !/^index\.html?$/i.test(lastSeg)) {
          rawBase = lastSeg.replace(/\.html?$/i, "").replace(/-edited(-\d+)?$/i, "");
        } else if (lastSeg && /^[1-9]\d*$/.test(lastSeg)) {
          var prevSeg = segs.length > 1 ? segs[segs.length - 2] : "presentation";
          rawBase = prevSeg + "-edition-" + lastSeg;
        } else if (segs.length > 1 && /^index\.html?$/i.test(lastSeg) && /^[1-9]\d*$/.test(segs[segs.length - 2])) {
          var projSeg = segs.length > 2 ? segs[segs.length - 3] : "presentation";
          rawBase = projSeg + "-edition-" + segs[segs.length - 2];
        } else if (lastSeg && !/^index\.html?$/i.test(lastSeg)) {
          rawBase = lastSeg;
        } else if (document.title) {
          rawBase = "bullying-presentation";
        }
      } catch (e) {}

      var fileName = options.fileName || (rawBase + "-edited.html");
      if (!/\.html?$/i.test(fileName)) fileName += ".html";

      var blob = new Blob([htmlContent], { type: "text/html;charset=utf-8" });
      var url = URL.createObjectURL(blob);
      var link = document.createElement("a");
      link.href = url;
      link.download = fileName;
      link.setAttribute("data-ps-ignore", "1");
      link.style.display = "none";
      document.body.appendChild(link);
      link.click();
      setTimeout(function () {
        if (link.parentNode) link.parentNode.removeChild(link);
        URL.revokeObjectURL(url);
      }, 1800);

      showToast("تم تنزيل ملف HTML المحلي بكامل تعديلاتك ✓");
      return fileName;
    }

    /* ----------------------------------------------------------------------

    var EDITABLE_TEXT_SELECTOR = [
      "h1", "h2", "h3", "h4",

      ".editorial-points li", ".mini-card p", ".mini-card-head > span",

      ".k-pill > span:last-child", ".tele-chip > span:last-child", ".actor-whisper", ".actor-callout",
      "#ed-mov-title", "#ed-epigraph > span", "#ed-sentence", "#ed-metric-val", "#ed-metric-lbl",

      ".char-pod", ".sp-char-actor", ".sp-bigstat-char", ".sp-shield-char", ".sp-scale-pan-actor",

    ].join(", ");

    function resetPersistentModifiedElements() {
      var modChars = document.querySelectorAll("[data-ps-char-modified='1']");
      for (var i = 0; i < modChars.length; i++) {
        var el = modChars[i];
        el.style.translate = "";
        el.style.scale = "";
        if (el.getAttribute("data-ps-was-hidden") === "1") {
          el.style.display = "";
          el.removeAttribute("data-ps-was-hidden");
        }
        el.removeAttribute("data-ps-char-modified");
      }
      var modTexts = document.querySelectorAll("[data-ps-text-modified='1']");
      for (var j = 0; j < modTexts.length; j++) {
        var tEl = modTexts[j];
        if (tEl.__psOrigHtml !== undefined && document.activeElement !== tEl) {
          tEl.innerHTML = tEl.__psOrigHtml;
        }
        tEl.style.fontSize = "";
        tEl.style.color = "";
        tEl.style.fontWeight = "";
        tEl.style.textAlign = "";
        tEl.style.whiteSpace = "";
        if (tEl.getAttribute("data-ps-was-hidden") === "1") {
          tEl.style.display = "";
          tEl.removeAttribute("data-ps-was-hidden");

        tEl.removeAttribute("data-ps-text-modified");

    function disableAllInlineContentEditable() {
      var nodes = document.querySelectorAll("[data-ps-editable][contenteditable='true']");
      for (var i = 0; i < nodes.length; i++) {
        nodes[i].removeAttribute("contenteditable");
      }
    }

    function indexNativeSvgCharacterGroups(stageTarget) {
      var svgs = stageTarget.charRoot.querySelectorAll(".art-stage-frame svg, .stage-scene svg");
      for (var s = 0; s < svgs.length; s++) {
        var svg = svgs[s];
        if (svg.closest("[data-ps-overlay-layer]")) continue;
        if (svg.closest(".char-pod, .sp-char-actor, .cinema-actor, .motion-actor")) continue;

        var groupContainers = [svg];
        for (var gc = 0; gc < svg.children.length; gc++) {
          var topChild = svg.children[gc];
          if (
            topChild.tagName &&
            topChild.tagName.toLowerCase() === "g" &&
            topChild.hasAttribute("clip-path") &&
            topChild.querySelectorAll(":scope > g").length >= 2
          ) {
            groupContainers.push(topChild);
          }
        }

        var gIndex = 0;
        for (var pIdx = 0; pIdx < groupContainers.length; pIdx++) {
          var parentNode = groupContainers[pIdx];
          var children = Array.prototype.slice.call(parentNode.children);
          for (var c = 0; c < children.length; c++) {
            var child = children[c];
            var tag = child.tagName ? child.tagName.toLowerCase() : "";
            if (tag !== "g") continue;
            if (groupContainers.indexOf(child) !== -1) continue;

            var charKey = child.getAttribute("data-ps-char-key");
            if (!charKey) {
              charKey = "svg_g_" + s + "_" + gIndex;
              var wrap = document.createElementNS("http://www.w3.org/2000/svg", "g");
              wrap.setAttribute("data-ps-svg-wrap", "1");
              wrap.setAttribute("data-ps-char-key", charKey);
              wrap.setAttribute("data-ps-native-char", "svg");
              wrap.setAttribute("data-ps-page-uid", stageTarget.pageUid);
              parentNode.insertBefore(wrap, child);
              wrap.appendChild(child);
              child.setAttribute("data-ps-wrapped-inner", "1");
            }
            gIndex += 1;
          }
        }
      }
    }

    function applySvgWrapTransform(wrapEl, ov) {
      if (!wrapEl) return;
      if (ov && ov.hidden) {
        wrapEl.style.display = "none";
        return;
      }
      wrapEl.style.display = "";
      var dx = (ov && typeof ov.dx === "number") ? ov.dx : 0;
      var dy = (ov && typeof ov.dy === "number") ? ov.dy : 0;
      var sc = (ov && typeof ov.scale === "number") ? ov.scale : 1;
      var flip = Boolean(ov && ov.flip);
      if (dx === 0 && dy === 0 && sc === 1 && !flip) {
        wrapEl.removeAttribute("transform");
        return;
      }

      var cx = typeof ov.cx === "number" ? ov.cx : null;
      var cy = typeof ov.cy === "number" ? ov.cy : null;
      if (cx === null || cy === null) {
        try {
          var inner = wrapEl.firstElementChild || wrapEl;
          var bb = inner.getBBox();
          var ctm = inner.getCTM();
          var svgEl = wrapEl.ownerSVGElement;
          var svgCtm = svgEl ? svgEl.getCTM() : null;
          if (ctm && svgCtm) {
            var rel = svgCtm.inverse().multiply(ctm);
            var rawCx = bb.x + bb.width / 2;
            var rawCy = bb.y + bb.height / 2;
            cx = rel.a * rawCx + rel.c * rawCy + rel.e;
            cy = rel.b * rawCx + rel.d * rawCy + rel.f;
          } else {
            cx = bb.x + bb.width / 2;
            cy = bb.y + bb.height / 2;
          }
          ov.cx = Math.round(cx * 10) / 10;
          ov.cy = Math.round(cy * 10) / 10;
        } catch (e) {
          cx = 250;
          cy = 185;
        }
      }

      var sx = flip ? -sc : sc;
      var sy = sc;
      var xform = "translate(" + dx.toFixed(1) + "," + dy.toFixed(1) + ") " +
                  "translate(" + cx.toFixed(1) + "," + cy.toFixed(1) + ") " +
                  "scale(" + sx.toFixed(3) + "," + sy.toFixed(3) + ") " +
                  "translate(" + (-cx).toFixed(1) + "," + (-cy).toFixed(1) + ")";
      wrapEl.setAttribute("transform", xform);
    }

    function applyHtmlCharTransform(el, ov, hostEl) {
      if (!el) return;
      el.setAttribute("data-ps-char-modified", "1");
      if (ov && ov.hidden) {
        el.style.display = "none";
        el.setAttribute("data-ps-was-hidden", "1");
        return;
      }
      if (el.getAttribute("data-ps-was-hidden") === "1") {
        el.style.display = "";
        el.removeAttribute("data-ps-was-hidden");
      }
      var dxPct = (ov && typeof ov.dxPct === "number") ? ov.dxPct : 0;
      var dyPct = (ov && typeof ov.dyPct === "number") ? ov.dyPct : 0;
      var sc = (ov && typeof ov.scale === "number") ? ov.scale : 1;
      var flip = Boolean(ov && ov.flip);

      var w = (hostEl && hostEl.clientWidth) ? hostEl.clientWidth : global.innerWidth;
      var h = (hostEl && hostEl.clientHeight) ? hostEl.clientHeight : global.innerHeight;
      var pxX = (dxPct / 100) * w;
      var pxY = (dyPct / 100) * h;

      el.style.translate = (dxPct === 0 && dyPct === 0) ? "" : (pxX.toFixed(1) + "px " + pxY.toFixed(1) + "px");
      el.style.scale = (sc === 1 && !flip) ? "" : ((flip ? -sc : sc).toFixed(3) + " " + sc.toFixed(3));
    }

    function applyStageTarget(stageTarget) {
      var pageUid = stageTarget.pageUid;
      var pageRec = studioState.pages[pageUid];

      var textNodes = stageTarget.textRoot.querySelectorAll(EDITABLE_TEXT_SELECTOR);
      for (var i = 0; i < textNodes.length; i++) {
        var tEl = textNodes[i];
        if (tEl.closest("#ps-studio-root, [data-ps-overlay-layer], .toc-drawer, .refs-drawer, #refs-modal, #jump-drawer")) continue;
        var tKey = tEl.getAttribute("data-ps-text-key");
        if (!tKey) {
          tKey = getStableLandmarksSelector(tEl, stageTarget.textRoot);
          tEl.setAttribute("data-ps-text-key", tKey);
        }
        tEl.setAttribute("data-ps-editable", "1");
        tEl.setAttribute("data-ps-page-uid", pageUid);

        var tOv = pageRec && pageRec.textOverrides ? pageRec.textOverrides[tKey] : null;
        if (!tOv && pageRec && pageRec.textOverrides && tKey === ".sheet-title") {
          tOv = pageRec.textOverrides["div:nth-of-type(1) > div:nth-of-type(1) > h1:nth-of-type(1)"] ||
                pageRec.textOverrides["div:nth-of-type(1) > div:nth-of-type(1) > h2:nth-of-type(1)"] || null;
        }
        if (tOv) {
          if (tEl.__psOrigHtml === undefined) {
            tEl.__psOrigHtml = tEl.innerHTML;
          }
          tEl.setAttribute("data-ps-text-modified", "1");
          if (tOv.hidden) {
            tEl.style.display = "none";
            tEl.setAttribute("data-ps-was-hidden", "1");
          } else {
            if (typeof tOv.text === "string" && document.activeElement !== tEl) {
              tEl.textContent = tOv.text;
              if (tOv.text.indexOf("\n") !== -1) {
                tEl.style.whiteSpace = "pre-line";
              }
            }
            if (tOv.fontSize) tEl.style.fontSize = tOv.fontSize;
            if (tOv.color !== undefined) tEl.style.color = tOv.color;
            if (tOv.fontWeight) tEl.style.fontWeight = tOv.fontWeight;
            if (tOv.textAlign) tEl.style.textAlign = tOv.textAlign;
          }
        }
      }

      var svgTexts = stageTarget.textRoot.querySelectorAll(".art-stage-frame svg text, .stage-scene svg text");
      for (var st = 0; st < svgTexts.length; st++) {
        var stEl = svgTexts[st];
        if (stEl.closest("[data-ps-overlay-layer]")) continue;
        var stKey = stEl.getAttribute("data-ps-text-key") || ("svg_txt_" + st);
        stEl.setAttribute("data-ps-text-key", stKey);
        stEl.setAttribute("data-ps-svg-text", "1");
        stEl.setAttribute("data-ps-page-uid", pageUid);
        var stOv = pageRec && pageRec.textOverrides ? pageRec.textOverrides[stKey] : null;
        if (stOv) {
          if (stOv.hidden) stEl.style.display = "none";
          else if (typeof stOv.text === "string") stEl.textContent = stOv.text;
        }
      }

      indexNativeSvgCharacterGroups(stageTarget);
      var svgWraps = stageTarget.charRoot.querySelectorAll("g[data-ps-svg-wrap='1']");
      for (var w = 0; w < svgWraps.length; w++) {
        var wEl = svgWraps[w];
        var cKey = wEl.getAttribute("data-ps-char-key");
        var cOv = pageRec && pageRec.nativeCharOverrides ? pageRec.nativeCharOverrides[cKey] : null;
        if (cOv) applySvgWrapTransform(wEl, cOv);
      }

      var htmlChars = stageTarget.charRoot.querySelectorAll(NATIVE_HTML_CHAR_SELECTOR);
      for (var h = 0; h < htmlChars.length; h++) {
        var hEl = htmlChars[h];
        if (hEl.closest("[data-ps-overlay-layer]")) continue;
        if ((hEl.classList.contains("cinema-actor") || hEl.classList.contains("motion-actor")) && hEl.getAttribute("data-present") !== "true") {
          continue;
        }
        var actorId = hEl.getAttribute("data-actor-id") || hEl.getAttribute("data-char-id");
        var hKey = actorId ? ("actor_" + actorId) : ("html_char_" + h);
        hEl.setAttribute("data-ps-char-key", hKey);
        hEl.setAttribute("data-ps-native-char", "html");
        hEl.setAttribute("data-ps-page-uid", pageUid);
        var hOv = pageRec && pageRec.nativeCharOverrides ? pageRec.nativeCharOverrides[hKey] : null;
        if (hOv) applyHtmlCharTransform(hEl, hOv, stageTarget.overlayHost);
      }

      renderOverlayItems(stageTarget);
    }

    function renderOverlayItems(stageTarget) {
      var host = stageTarget.overlayHost;
      if (!host) return;
      var pageUid = stageTarget.pageUid;
      var pageRec = studioState.pages[pageUid];

      var layer = host.querySelector(":scope > .ps-stage-overlay");
      var hasCustomItems = pageRec && ((pageRec.frames && pageRec.frames.length > 0) || (pageRec.addedChars && pageRec.addedChars.length > 0));

      if (!hasCustomItems && !editMode) {
        if (layer && layer.parentNode) layer.parentNode.removeChild(layer);
        return;
      }

      if (!layer) {
        layer = document.createElement("div");
        layer.className = "ps-stage-overlay";
        layer.setAttribute("data-ps-overlay-layer", "1");
        layer.setAttribute("data-ps-page-uid", pageUid);
        layer.addEventListener("pointerdown", function (ev) {
          if (editMode) ev.stopPropagation();
        });
        layer.addEventListener("wheel", function (ev) {
          if (editMode) ev.stopPropagation();
        }, { passive: true });
        host.appendChild(layer);
      } else {
        layer.setAttribute("data-ps-page-uid", pageUid);
      }

      var frames = (pageRec && pageRec.frames) ? pageRec.frames : [];
      var chars = (pageRec && pageRec.addedChars) ? pageRec.addedChars : [];

      var activeFocusedFrameId = null;
      if (document.activeElement && document.activeElement.closest(".ps-frame-item")) {
        activeFocusedFrameId = document.activeElement.closest(".ps-frame-item").getAttribute("data-ps-frame-id");
      }

      var existingFrames = {};
      var fNodes = layer.querySelectorAll(".ps-frame-item");
      for (var i = 0; i < fNodes.length; i++) {
        existingFrames[fNodes[i].getAttribute("data-ps-frame-id")] = fNodes[i];
      }

      var validFrameIds = {};
      for (var f = 0; f < frames.length; f++) {
        var fm = frames[f];
        validFrameIds[fm.id] = true;
        var fEl = existingFrames[fm.id];
        if (!fEl) {
          fEl = document.createElement("div");
          fEl.className = "ps-frame-item";
          fEl.setAttribute("data-ps-frame-id", fm.id);
          fEl.setAttribute("data-ps-page-uid", pageUid);
          fEl.innerHTML =
            '<div class="ps-frame-drag-bar" data-ps-drag-frame="1">' +
              '<span>⠿ اسحب لتحريك الإطار</span>' +
              '<button type="button" class="ps-mini-btn is-del" style="min-width:22px;height:20px;padding:0 5px;font-size:10px;" data-ps-del-frame="' + escHtml(fm.id) + '" title="حذف الإطار">✕</button>' +
            '</div>' +
            '<div class="ps-frame-body" data-ps-frame-body="1"></div>';
          layer.appendChild(fEl);
        }

        var themeObj = FRAME_THEMES[0];
        for (var th = 0; th < FRAME_THEMES.length; th++) {
          if (FRAME_THEMES[th].id === fm.theme) themeObj = FRAME_THEMES[th];
        }

        fEl.setAttribute("data-fstyle", fm.style || "editorial");
        fEl.setAttribute("data-tail", fm.tail || "bottom-right");
        fEl.style.setProperty("--ps-x", (typeof fm.x === "number" ? fm.x : 50).toFixed(2) + "%");
        fEl.style.setProperty("--ps-y", (typeof fm.y === "number" ? fm.y : 50).toFixed(2) + "%");
        fEl.style.setProperty("--ps-w", (fm.width || 270) + "px");
        fEl.style.setProperty("--ps-scale", String(fm.scale || 1));
        fEl.style.setProperty("--ps-fs", (fm.fontSize || 15) + "px");
        fEl.style.setProperty("--ps-bg", themeObj.bg);
        fEl.style.setProperty("--ps-fg", themeObj.fg);
        fEl.style.setProperty("--ps-bd", themeObj.border);
        fEl.style.setProperty("--ps-z", String(fm.z || 46));
        fEl.classList.toggle("is-selected", Boolean(selection && selection.kind === "frame" && selection.id === fm.id));

        var bodyEl = fEl.querySelector(".ps-frame-body");
        if (bodyEl) {
          if (editMode) bodyEl.setAttribute("contenteditable", "true");
          else bodyEl.removeAttribute("contenteditable");
          if (activeFocusedFrameId !== fm.id) {
            bodyEl.textContent = fm.text || "";
          }
        }
      }

      for (var oldFid in existingFrames) {
        if (!validFrameIds[oldFid] && existingFrames[oldFid].parentNode) {
          existingFrames[oldFid].parentNode.removeChild(existingFrames[oldFid]);
        }
      }

      var existingChars = {};
      var cNodes = layer.querySelectorAll(".ps-char-item");
      for (var k = 0; k < cNodes.length; k++) {
        existingChars[cNodes[k].getAttribute("data-ps-added-char-id")] = cNodes[k];
      }

      var validCharIds = {};
      for (var c = 0; c < chars.length; c++) {
        var ch = chars[c];
        validCharIds[ch.id] = true;
        var cEl = existingChars[ch.id];
        var sig = (ch.charId || "custom") + "::" + (ch.mood || "") + "::" + (ch.customDataUrl ? ch.customDataUrl.length : 0);
        if (!cEl) {
          cEl = document.createElement("div");
          cEl.className = "ps-char-item";
          cEl.setAttribute("data-ps-added-char-id", ch.id);
          cEl.setAttribute("data-ps-page-uid", pageUid);
          layer.appendChild(cEl);
        }
        if (cEl.getAttribute("data-ps-sig") !== sig) {
          cEl.innerHTML = renderGalleryCharacterMarkup(ch);
          cEl.setAttribute("data-ps-sig", sig);
        }
        var sc = typeof ch.scale === "number" ? ch.scale : 1;
        var sx = ch.flip ? -sc : sc;
        cEl.style.setProperty("--ps-x", (typeof ch.x === "number" ? ch.x : 50).toFixed(2) + "%");
        cEl.style.setProperty("--ps-y", (typeof ch.y === "number" ? ch.y : 55).toFixed(2) + "%");
        cEl.style.setProperty("--ps-sx", sx.toFixed(3));
        cEl.style.setProperty("--ps-sy", sc.toFixed(3));
        cEl.style.setProperty("--ps-z", String(ch.z || 47));
        cEl.classList.toggle("is-selected", Boolean(selection && selection.kind === "addedChar" && selection.id === ch.id));
      }

      for (var oldCid in existingChars) {
        if (!validCharIds[oldCid] && existingChars[oldCid].parentNode) {
          existingChars[oldCid].parentNode.removeChild(existingChars[oldCid]);
        }
      }
    }

    function applyAllStageOverrides() {
      if (!adapter) return;
      resetPersistentModifiedElements();
      var targets = adapter.getStageTargets();
      for (var i = 0; i < targets.length; i++) {
        applyStageTarget(targets[i]);
      }
      syncSelectionRing();
      syncDockState();
    }

    /* ----------------------------------------------------------------------
       12. SELECTION RING & CONTEXTUAL INSPECTOR TOOLBAR
       ---------------------------------------------------------------------- */
    function clearSelection() {
      selection = null;
      ui.ring.hidden = true;
      ui.ctxBar.hidden = true;
      var selNodes = document.querySelectorAll(".ps-frame-item.is-selected, .ps-char-item.is-selected");
      for (var i = 0; i < selNodes.length; i++) selNodes[i].classList.remove("is-selected");
    }

    function syncSelectionRing() {
      if (!editMode || !selection || !selection.el || !document.body.contains(selection.el)) {
        ui.ring.hidden = true;
        if (selection && (!selection.el || !document.body.contains(selection.el))) {
          ui.ctxBar.hidden = true;
          selection = null;
        }
        return;
      }

      if (selection.kind === "text") {
        ui.ring.hidden = true;
        return;
      }

      var rect = selection.el.getBoundingClientRect();
      if (rect.width < 2 && rect.height < 2) {
        ui.ring.hidden = true;
        return;
      }
      ui.ring.style.left = (rect.left - 4) + "px";
      ui.ring.style.top = (rect.top - 4) + "px";
      ui.ring.style.width = (rect.width + 8) + "px";
      ui.ring.style.height = (rect.height + 8) + "px";
      ui.ring.hidden = false;
    }

    function selectItem(selObj) {
      selection = selObj;
      var allSel = document.querySelectorAll(".ps-frame-item.is-selected, .ps-char-item.is-selected");
      for (var i = 0; i < allSel.length; i++) allSel[i].classList.remove("is-selected");
      if (selection && selection.el && (selection.kind === "frame" || selection.kind === "addedChar")) {
        selection.el.classList.add("is-selected");
      }
      renderContextBar();
      syncSelectionRing();
    }

    function getSelectedModel() {
      if (!selection) return null;
      var pageRec = ensurePageRecord(selection.pageUid);
      if (selection.kind === "frame") {
        for (var i = 0; i < pageRec.frames.length; i++) {
          if (pageRec.frames[i].id === selection.id) return pageRec.frames[i];
        }
      }
      if (selection.kind === "addedChar") {
        for (var j = 0; j < pageRec.addedChars.length; j++) {
          if (pageRec.addedChars[j].id === selection.id) return pageRec.addedChars[j];
        }
      }
      if (selection.kind === "nativeChar") {
        if (!pageRec.nativeCharOverrides[selection.id]) {
          pageRec.nativeCharOverrides[selection.id] = { scale: 1, dx: 0, dy: 0, dxPct: 0, dyPct: 0, flip: false, hidden: false };
        }
        return pageRec.nativeCharOverrides[selection.id];
      }
      if (selection.kind === "text") {
        if (!pageRec.textOverrides[selection.id]) {
          pageRec.textOverrides[selection.id] = {};
        }
        return pageRec.textOverrides[selection.id];
      }
      return null;
    }

    function renderContextBar() {
      if (!editMode || !selection) {
        ui.ctxBar.hidden = true;
        return;
      }

      var model = getSelectedModel();
      if (!model) {
        ui.ctxBar.hidden = true;
        return;
      }

      if (selection.kind === "addedChar" || selection.kind === "nativeChar") {
        var curScale = Math.round((model.scale || 1) * 100);
        var isAdded = selection.kind === "addedChar";
        var moodSelectHtml = "";
        if (isAdded && model.charId && model.charId.indexOf("ed_") !== 0 && !model.customDataUrl) {
          moodSelectHtml = '<select class="ps-ctx-btn" data-ctx-act="char-mood" aria-label="تغيير تعبير الشخصية">' +
            CAST_MOODS.map(function (m) {
              return '<option value="' + m.id + '"' + (m.id === model.mood ? " selected" : "") + '>' + m.label + '</option>';
            }).join("") +
          '</select>';
        }
        ui.ctxBar.innerHTML =
          '<span style="font-size:12px;font-weight:800;padding:0 4px;">الشخصية (' + curScale + '%)</span>' +
          '<button type="button" class="ps-ctx-btn" data-ctx-act="scale-up" title="تكبير الشخصية">تكبير +</button>' +
          '<button type="button" class="ps-ctx-btn" data-ctx-act="scale-down" title="تصغير الشخصية">تصغير −</button>' +
          '<input type="range" class="ps-ctx-slider" data-ctx-act="scale-slider" min="30" max="260" value="' + curScale + '" aria-label="حجم الشخصية" />' +
          '<button type="button" class="ps-ctx-btn" data-ctx-act="flip" title="عكس اتجاه الشخصية أفقياً">عكس ⇄</button>' +
          moodSelectHtml +
          (isAdded ? '<button type="button" class="ps-ctx-btn" data-ctx-act="dup-char" title="تكرار الشخصية">نسخ</button>' : '') +
          '<button type="button" class="ps-ctx-btn is-danger" data-ctx-act="del-item" title="حذف الشخصية من الصفحة">حذف 🗑</button>';
        ui.ctxBar.hidden = false;
        return;
      }

      if (selection.kind === "frame") {
        var swatches = FRAME_THEMES.map(function (th) {
          return '<button type="button" class="ps-swatch-dot" data-ctx-act="frame-theme" data-val="' + th.id + '" title="' + th.label + '" style="background:' + th.bg + ';border-color:' + (model.theme === th.id ? '#3B82F6' : th.border) + '"></button>';
        }).join("");

        var tailBtn = model.style === "bubble"
          ? '<button type="button" class="ps-ctx-btn" data-ctx-act="frame-tail" title="تغيير اتجاه ذيل فقاعة الكلام">ذيل الفقاعة ▾</button>'
          : '';

        ui.ctxBar.innerHTML =
          '<button type="button" class="ps-ctx-btn" data-ctx-act="frame-style" title="تبديل شكل الإطار">النمط ❖</button>' +
          tailBtn +
          '<button type="button" class="ps-ctx-btn" data-ctx-act="frame-wider" title="توسيع عرض الإطار">عرض +</button>' +
          '<button type="button" class="ps-ctx-btn" data-ctx-act="frame-narrower" title="تضييق عرض الإطار">عرض −</button>' +
          '<button type="button" class="ps-ctx-btn" data-ctx-act="frame-font-up" title="تكبير خط الإطار">A+</button>' +
          '<button type="button" class="ps-ctx-btn" data-ctx-act="frame-font-down" title="تصغير خط الإطار">A−</button>' +
          swatches +
          '<button type="button" class="ps-ctx-btn" data-ctx-act="dup-frame" title="نسخ الإطار">نسخ</button>' +
          '<button type="button" class="ps-ctx-btn is-danger" data-ctx-act="del-item" title="حذف الإطار">حذف 🗑</button>';
        ui.ctxBar.hidden = false;
        return;
      }

      if (selection.kind === "text") {
        var textColorsHtml = TEXT_COLORS.map(function (tc) {
          var bg = tc.val || "linear-gradient(135deg,#231F1D 50%,#FAF6EE 50%)";
          return '<button type="button" class="ps-swatch-dot" data-ctx-act="text-color" data-val="' + tc.val + '" title="لون: ' + tc.label + '" style="background:' + bg + '"></button>';
        }).join("");

        ui.ctxBar.innerHTML =
          '<span style="font-size:11.5px;font-weight:700;">تنسيق النص:</span>' +
          '<button type="button" class="ps-ctx-btn" data-ctx-act="text-bigger">A+</button>' +
          '<button type="button" class="ps-ctx-btn" data-ctx-act="text-smaller">A−</button>' +
          '<button type="button" class="ps-ctx-btn" data-ctx-act="text-bold">عريض B</button>' +
          '<button type="button" class="ps-ctx-btn" data-ctx-act="text-align">محاذاة</button>' +
          textColorsHtml +
          '<button type="button" class="ps-ctx-btn is-danger" data-ctx-act="del-item" title="إخفاء أو حذف هذا النص">حذف النص 🗑</button>';
        ui.ctxBar.hidden = false;
      }
    }

    /* ----------------------------------------------------------------------
       13. ACTIONS: ADD FRAMES, ADD/RESIZE/DELETE CHARACTERS, MANAGE PAGES
       ---------------------------------------------------------------------- */
    function addTextFrame(presetId) {
      pushUndoSnapshot();
      var pageUid = adapter.getCurrentPageUid();
      var pageRec = ensurePageRecord(pageUid);
      var count = pageRec.frames.length;
      var preset = FRAME_STYLES[0];
      for (var i = 0; i < FRAME_STYLES.length; i++) {
        if (FRAME_STYLES[i].id === presetId) preset = FRAME_STYLES[i];
      }

      var defaultTheme = (adapter.kind === "cinema" || adapter.kind === "motion") && preset.id === "cinema" ? "obsidian" : "warm";
      var newFrame = {
        id: genUid("frame"),
        style: preset.id,
        theme: defaultTheme,
        tail: "bottom-right",
        text: preset.defaultText,
        x: clamp(46 + (count % 4) * 4, 22, 78),
        y: clamp(42 + (count % 4) * 6, 22, 78),
        width: preset.id === "pill" ? 290 : 275,
        scale: 1,
        fontSize: 15,
        z: 48 + count
      };
      pageRec.frames.push(newFrame);
      closeModal();
      applyAllStageOverrides();
      scheduleAutoSave();

      var mounted = document.querySelector('.ps-frame-item[data-ps-frame-id="' + newFrame.id + '"]');
      if (mounted) {
        selectItem({ kind: "frame", pageUid: pageUid, id: newFrame.id, el: mounted });
        var body = mounted.querySelector(".ps-frame-body");
        if (body) {
          body.focus();
          try {
            var range = document.createRange();
            range.selectNodeContents(body);
            var sel = global.getSelection();
            sel.removeAllRanges();
            sel.addRange(range);
          } catch (e) {}
        }
      }
      showToast("تمت إضافة إطار الكلام الجديد — اكتب النص واسحبه لأي موضع ✓");
    }

    function addCharacterToStage(charSpec) {
      pushUndoSnapshot();
      var pageUid = adapter.getCurrentPageUid();
      var pageRec = ensurePageRecord(pageUid);
      var count = pageRec.addedChars.length;
      var newChar = {
        id: genUid("char"),
        charId: charSpec.charId || "ed_crossed_boy",
        mood: charSpec.mood || selectedCastMood || "calm",
        label: charSpec.label || "شخصية",
        customDataUrl: charSpec.customDataUrl || "",
        x: clamp(32 + (count % 5) * 9, 18, 82),
        y: clamp(54 + (count % 3) * 6, 24, 80),
        scale: 1,
        flip: false,
        z: 50 + count
      };
      pageRec.addedChars.push(newChar);
      closeModal();
      applyAllStageOverrides();
      scheduleAutoSave();

      var mounted = document.querySelector('.ps-char-item[data-ps-added-char-id="' + newChar.id + '"]');
      if (mounted) {
        selectItem({ kind: "addedChar", pageUid: pageUid, id: newChar.id, el: mounted });
      }
      showToast("تمت إضافة الشخصية — يمكنك تكبيرها وتصغيرها وتحريكها بحرية ✓");
    }

    function scaleSelectedCharacter(nextScale, recordUndo) {
      if (!selection) return;
      var model = getSelectedModel();
      if (!model) return;
      if (recordUndo) pushUndoSnapshot();
      model.scale = clamp(Math.round(nextScale * 100) / 100, 0.25, 3.0);
      applyAllStageOverrides();
      renderContextBar();
      scheduleAutoSave();
    }

    function deleteSelectedItem() {
      if (!selection) return;
      pushUndoSnapshot();
      var pageRec = ensurePageRecord(selection.pageUid);

      if (selection.kind === "frame") {
        pageRec.frames = pageRec.frames.filter(function (f) { return f.id !== selection.id; });
        clearSelection();
        applyAllStageOverrides();
        scheduleAutoSave();
        showToast("تم حذف الإطار ✓");
        return;
      }

      if (selection.kind === "addedChar") {
        pageRec.addedChars = pageRec.addedChars.filter(function (c) { return c.id !== selection.id; });
        clearSelection();
        applyAllStageOverrides();
        scheduleAutoSave();
        showToast("تم حذف الشخصية ✓");
        return;
      }

      if (selection.kind === "nativeChar") {
        var ov = getSelectedModel();
        ov.hidden = true;
        clearSelection();
        applyAllStageOverrides();
        scheduleAutoSave();
        showToast("تم حذف الشخصية من الصفحة ✓");
        return;
      }

      if (selection.kind === "text") {
        var tOv = getSelectedModel();
        tOv.hidden = true;
        clearSelection();
        applyAllStageOverrides();
        scheduleAutoSave();
        showToast("تم إخفاء النص من الصفحة ✓");
      }
    }

    function movePageInOrder(fromIdx, toIdx) {
      var order = studioState.pageOrder;
      if (fromIdx < 0 || fromIdx >= order.length || toIdx < 0 || toIdx >= order.length || fromIdx === toIdx) return;
      pushUndoSnapshot();
      var activeUid = adapter.getCurrentPageUid();
      var moved = order.splice(fromIdx, 1)[0];
      order.splice(toIdx, 0, moved);
      var newActiveIdx = order.indexOf(activeUid);
      adapter.rebuildPages(order, studioState.customPages, newActiveIdx >= 0 ? newActiveIdx : toIdx);
      scheduleAutoSave();
      syncDockState();
      if (activeModal === "pages") renderPagesModal();
    }

    function deletePageAtIndex(idx) {
      var order = studioState.pageOrder;
      if (order.length <= 1) {
        showToast("لا يمكن حذف الصفحة الوحيدة المتبقية في العرض");
        return;
      }
      if (idx < 0 || idx >= order.length) return;
      pushUndoSnapshot();
      var curIdx = adapter.getCurrentIndex();
      order.splice(idx, 1);
      var nextActiveIdx = curIdx;
      if (idx < curIdx) nextActiveIdx = curIdx - 1;
      else if (nextActiveIdx >= order.length) nextActiveIdx = order.length - 1;

      clearSelection();
      adapter.rebuildPages(order, studioState.customPages, Math.max(0, nextActiveIdx));
      scheduleAutoSave();
      syncDockState();
      if (activeModal === "pages") renderPagesModal();
      showToast("تم حذف الصفحة وتحديث الترقيم ✓");
    }

    function duplicatePageAtIndex(idx) {
      var order = studioState.pageOrder;
      if (idx < 0 || idx >= order.length) return;
      pushUndoSnapshot();
      var srcUid = order[idx];

        '</div>';

      var listEl = document.getElementById("ps-pages-sortable");
      var dragSrcIdx = null;
      if (listEl) {
        listEl.addEventListener("dragstart", function (e) {
          var row = e.target.closest("[data-page-row-idx]");
          if (!row) return;
          dragSrcIdx = parseInt(row.getAttribute("data-page-row-idx"), 10);
          row.classList.add("is-dragging");
          if (e.dataTransfer) e.dataTransfer.effectAllowed = "move";
        });
        listEl.addEventListener("dragend", function (e) {
          var row = e.target.closest("[data-page-row-idx]");
          if (row) row.classList.remove("is-dragging");
        });
        listEl.addEventListener("dragover", function (e) {
          e.preventDefault();
        });
        listEl.addEventListener("drop", function (e) {
          e.preventDefault();
          var targetRow = e.target.closest("[data-page-row-idx]");
          if (!targetRow || dragSrcIdx === null) return;
          var dropIdx = parseInt(targetRow.getAttribute("data-page-row-idx"), 10);
          if (!isNaN(dropIdx) && dropIdx !== dragSrcIdx) {
            movePageInOrder(dragSrcIdx, dropIdx);
          }
          dragSrcIdx = null;
        });

        /* Mobile Touch / Pointer Grip Reordering on .ps-drag-grip */
        var ptrSortIdx = null;
        var ptrHoverIdx = null;
        listEl.addEventListener("pointerdown", function (e) {
          if (e.pointerType === "mouse") return;
          var grip = e.target.closest(".ps-drag-grip");
          var row = grip ? grip.closest("[data-page-row-idx]") : null;
          if (!row) return;
          e.preventDefault();
          ptrSortIdx = parseInt(row.getAttribute("data-page-row-idx"), 10);
          ptrHoverIdx = ptrSortIdx;
          row.classList.add("is-dragging");
          if (grip.setPointerCapture) {
            try { grip.setPointerCapture(e.pointerId); } catch (err) {}
          }
        });
        listEl.addEventListener("pointermove", function (e) {
          if (ptrSortIdx === null) return;
          e.preventDefault();
          var hit = document.elementFromPoint(e.clientX, e.clientY);
          var overRow = hit && hit.closest ? hit.closest("[data-page-row-idx]") : null;
          var rows = listEl.querySelectorAll("[data-page-row-idx]");
          for (var r = 0; r < rows.length; r++) rows[r].classList.remove("is-drop-target");
          if (overRow) {
            var overIdx = parseInt(overRow.getAttribute("data-page-row-idx"), 10);
            if (!isNaN(overIdx)) {
              ptrHoverIdx = overIdx;
              if (overIdx !== ptrSortIdx) overRow.classList.add("is-drop-target");
            }
          }
        });
        var finishPtrSort = function () {
          if (ptrSortIdx === null) return;
          var from = ptrSortIdx;
          var to = ptrHoverIdx;
          ptrSortIdx = null;
          ptrHoverIdx = null;
          var rows = listEl.querySelectorAll("[data-page-row-idx]");
          for (var r = 0; r < rows.length; r++) {
            rows[r].classList.remove("is-dragging", "is-drop-target");
          }
          if (typeof to === "number" && to !== from) {
            movePageInOrder(from, to);
          }
        };
        listEl.addEventListener("pointerup", finishPtrSort);
        listEl.addEventListener("pointercancel", finishPtrSort);
      }
    }

    /* ----------------------------------------------------------------------
       15. POINTER DRAGGING, CORNER RESIZING, INLINE EDITING & EVENT SHIELDS
       ---------------------------------------------------------------------- */
    var dragSession = null;
    var pinchSession = null;
    var activeTextUndoKey = null;

    function ensureTextUndoSnapshotOnce(sessionKey) {
      if (activeTextUndoKey !== sessionKey) {
        pushUndoSnapshot();
        activeTextUndoKey = sessionKey;
      }
    }

    function bindGlobalInteractions() {
      rootEl.addEventListener("pointerdown", function (e) {
        if (e.target && e.target.getAttribute && e.target.getAttribute("data-ctx-act") === "scale-slider") {
          pushUndoSnapshot();
        }
        e.stopPropagation();
      });
      rootEl.addEventListener("wheel", function (e) {
        e.stopPropagation();
      }, { passive: true });

      ui.entryPill.addEventListener("click", function (e) {
        e.preventDefault();
        e.stopPropagation();
        setEditMode(true);
      });

      ui.dock.addEventListener("click", function (e) {
        var btn = e.target.closest("[data-ps-act]");
        if (!btn) return;
        e.preventDefault();
        e.stopPropagation();
        var act = btn.getAttribute("data-ps-act");
        if (act === "open-frames") openFramesModal();

        if (!editMode || !pinchSession || !e.touches || e.touches.length !== 2 || !selection) return;
        e.preventDefault();
        e.stopPropagation();
        var dist = Math.hypot(
          e.touches[1].clientX - e.touches[0].clientX,
          e.touches[1].clientY - e.touches[0].clientY
        );
        var nextScale = pinchSession.startScale * (dist / pinchSession.startDist);
        scaleSelectedCharacter(nextScale, false);
      }, { capture: true, passive: false });

      document.addEventListener("touchend", function () {
        if (pinchSession) {
          pinchSession = null;
          scheduleAutoSave();
        }
      }, { capture: true, passive: true });

      var resizeRaf = null;
      global.addEventListener("resize", function () {
        if (resizeRaf) cancelAnimationFrame(resizeRaf);
        resizeRaf = requestAnimationFrame(function () {
          resizeRaf = null;
          applyAllStageOverrides();
        });
      });
      global.addEventListener("scroll", function () {
        if (editMode) syncSelectionRing();
      }, true);
    }

    /* ----------------------------------------------------------------------
       16. INITIALIZATION & PUBLIC API
       ---------------------------------------------------------------------- */
    adapter = detectEngineAdapter(function onEngineRender() {
      applyAllStageOverrides();
    });

    loadInitialState(adapter.initialOrder);
    adapter.hydrateModelTexts(studioState.pages);

    var orderChanged = JSON.stringify(studioState.pageOrder) !== JSON.stringify(adapter.initialOrder) ||
                       Object.keys(studioState.customPages || {}).length > 0;
    if (orderChanged) {
      adapter.rebuildPages(studioState.pageOrder, studioState.customPages, 0);
    }
    applyAllStageOverrides();
    updateEntryBadge();
    syncDockState();
    bindGlobalInteractions();

    if (String(global.location.hash || "") === "#edit") {
      setEditMode(true);
    }

    document.documentElement.setAttribute("data-ps-ready", "true");

    /* Asynchronously recover newer/oversized state from IndexedDB if localStorage quota was exceeded */
    idbLoad(storageKey, function (idbRec) {
      if (
        idbRec &&
        typeof idbRec === "object" &&
        (idbRec.savedAt || 0) > (studioState.savedAt || 0)
      ) {
        if (Array.isArray(idbRec.pageOrder) && idbRec.pageOrder.length) {
          studioState.pageOrder = idbRec.pageOrder.slice();
        }
        studioState.customPages = idbRec.customPages || {};
        studioState.pages = idbRec.pages || {};
        studioState.savedAt = idbRec.savedAt || Date.now();
        hasSavedEdits = true;
        adapter.hydrateModelTexts(studioState.pages);
        var idbOrderChanged = JSON.stringify(studioState.pageOrder) !== JSON.stringify(adapter.initialOrder) ||
                              Object.keys(studioState.customPages || {}).length > 0;
        if (idbOrderChanged) {
          adapter.rebuildPages(studioState.pageOrder, studioState.customPages, adapter.getCurrentIndex());
        }
        applyAllStageOverrides();
        updateEntryBadge();
        syncDockState();
      }
      document.documentElement.setAttribute("data-ps-idb-ready", "true");
    });

    global.PresentationStudio = {
      open: function () { setEditMode(true); },
      close: function () { setEditMode(false); },
      isEditing: function () { return editMode; },
      addTextFrame: addTextFrame,
      addCharacter: addCharacterToStage,
      movePage: movePageInOrder,
      deletePage: deletePageAtIndex,
      duplicatePage: duplicatePageAtIndex,
      addBlankPage: addNewBlankPage,
      save: function () { return saveNow(true); },
      reset: resetAllChanges,
      exportHtmlString: buildStandaloneHtmlString,
      downloadHtml: downloadStandaloneHtml,
      getState: function () { return deepClone(studioState); },
      getAdapterKind: function () { return adapter ? adapter.kind : "none"; }
    };
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", function () {
      setTimeout(createStudio, 0);
    });
  } else {
    setTimeout(createStudio, 0);
  }
})(typeof window !== "undefined" ? window : globalThis);

  </script>
  <!-- === PRESENTATION STUDIO END === -->
</body>
