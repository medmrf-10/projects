              var desc = customPagesMap[u];
              var src = baseAtlasMap[desc.sourceUid] || baseAtlasMap[atlasInitialOrder[0]];
              var clone = deepClone(src);
              delete clone._psOrig;
              if (desc.kind !== "clone") {
                clone.sentence = desc.title || "صفحة مخصّصة جديدة — اضغط هنا لتعديل الكلام المكتوب";
                clone.focus = "";
                clone.lab = null;
              }
              clone._psUid = u;
              snapshotAtlasOrig(clone);
              baseAtlasMap[u] = clone;
              nextBeats.push(clone);
            }
          }
          if (!nextBeats.length && atlasInitialOrder.length) {
            nextBeats.push(baseAtlasMap[atlasInitialOrder[0]]);
          }
          atlas.beats = nextBeats;
          atlas.movFirstBeat = {};
          atlas.movBeatsList = {};
          for (var k = 0; k < nextBeats.length; k++) {
            var mv = nextBeats[k].mov || 1;
            if (atlas.movFirstBeat[mv] === undefined) atlas.movFirstBeat[mv] = k;
            if (!atlas.movBeatsList[mv]) atlas.movBeatsList[mv] = [];
            nextBeats[k]._intraIdx = atlas.movBeatsList[mv].length;
            atlas.movBeatsList[mv].push(k);
          }
          if (typeof atlas._buildSpineAndPips === "function") atlas._buildSpineAndPips();
          if (typeof atlas._buildMatrixModal === "function") atlas._buildMatrixModal();
          this.goTo(typeof targetActiveIdx === "number" ? targetActiveIdx : atlas.idx);
        },
        getStageTargets: function () {
          var root = document.getElementById("atlas-root");
          var stage = document.getElementById("spatial-stage") || root;
          return [{ pageUid: this.getCurrentPageUid(), textRoot: root, extraTextRoots: [], overlayHost: stage, charRoot: stage }];
        },
        syncModelText: function (pageUid, el, plainText) {
          var bt = baseAtlasMap[pageUid];
          if (!bt || !el) return;
          if (el.id === "ed-sentence") {
            bt.sentence = plainText;
            bt.focus = "";
            if (typeof atlas._buildMatrixModal === "function") atlas._buildMatrixModal();
          } else if (el.id === "ed-epigraph" || (el.parentElement && el.parentElement.id === "ed-epigraph")) {
            bt.epigraph = plainText;
          }
        },
        hydrateModelTexts: function (pagesMap) {
          var map = pagesMap || {};
          for (var uid in baseAtlasMap) {
            if (!Object.prototype.hasOwnProperty.call(baseAtlasMap, uid)) continue;
            var bt = baseAtlasMap[uid];
            if (bt._psOrig) {
              bt.sentence = bt._psOrig.sentence;
              bt.focus = bt._psOrig.focus;
              bt.epigraph = bt._psOrig.epigraph;
            }
            var tMap = map[uid] && map[uid].textOverrides ? map[uid].textOverrides : null;
            if (!tMap) continue;
            var sOv = tMap["#ed-sentence"];
            if (sOv && typeof sOv.text === "string" && !sOv.hidden) {
              bt.sentence = sOv.text;
              bt.focus = "";
            }
            var eOv = tMap["#ed-epigraph > span:nth-of-type(1)"] || tMap["#ed-epigraph"];
            if (eOv && typeof eOv.text === "string" && !eOv.hidden) {
              bt.epigraph = eOv.text;
            }
          }
          if (typeof atlas._buildMatrixModal === "function") atlas._buildMatrixModal();
        }
      };
    }

    /* 4. Generic Static HTML Deck Fallback (.slide / section / article / body) */
    var genericNodes = Array.prototype.slice.call(
      document.querySelectorAll(".slide, [data-slide], main > section, main > article")
    );
    if (!genericNodes.length) genericNodes = [document.body];
    var genMap = {};
    var genOrder = [];
    var genCurIdx = 0;
    for (var g = 0; g < genericNodes.length; g++) {
      var gUid = "page-" + g;
      genericNodes[g].setAttribute("data-ps-page-uid", gUid);
      genMap[gUid] = genericNodes[g];
      genOrder.push(gUid);
    }

    return {
      kind: "generic",
      initialOrder: genOrder,
      getCurrentIndex: function () { return genCurIdx; },
      getCurrentPageUid: function () { return genericNodes[genCurIdx] ? genericNodes[genCurIdx].getAttribute("data-ps-page-uid") : genOrder[0]; },
      getPages: function () {
        return genericNodes.map(function (el, idx) {
          var h = el.querySelector("h1, h2, h3, p");
          return {
            uid: el.getAttribute("data-ps-page-uid") || ("page-" + idx),
            index: idx,
            title: toWesternDigits(h ? h.textContent.trim() : ("صفحة " + (idx + 1))).slice(0, 60),
            subtitle: ""
          };
        });
      },
      goTo: function (idx) {
        genCurIdx = clamp(idx, 0, Math.max(0, genericNodes.length - 1));
        if (genericNodes[genCurIdx] && genericNodes[genCurIdx] !== document.body) {
          genericNodes[genCurIdx].scrollIntoView({ behavior: "smooth", block: "start" });
        }
        onAfterRenderCallback();
      },
      rebuildPages: function (orderUids, customPagesMap, targetActiveIdx) {
        var parent = genericNodes[0] ? genericNodes[0].parentNode : null;
        if (!parent || genericNodes[0] === document.body) return;
        var nextList = [];
        for (var i = 0; i < orderUids.length; i++) {
          var u = orderUids[i];
          if (genMap[u]) {
            parent.appendChild(genMap[u]);
            nextList.push(genMap[u]);
          } else if (customPagesMap && customPagesMap[u]) {
            var src = genMap[customPagesMap[u].sourceUid] || genericNodes[0];
            var clone = src.cloneNode(true);
            clone.setAttribute("data-ps-page-uid", u);
            parent.appendChild(clone);
            genMap[u] = clone;
            nextList.push(clone);
          }
        }
        for (var key in genMap) {
          if (nextList.indexOf(genMap[key]) === -1 && genMap[key].parentNode) {
            genMap[key].parentNode.removeChild(genMap[key]);
          }
        }
        genericNodes = nextList;
        this.goTo(typeof targetActiveIdx === "number" ? targetActiveIdx : genCurIdx);
      },
      getStageTargets: function () {
        return genericNodes.map(function (el) {
          if (getComputedStyle(el).position === "static") el.style.position = "relative";
          return {
            pageUid: el.getAttribute("data-ps-page-uid"),
            textRoot: el,
            extraTextRoots: [],
            overlayHost: el,
            charRoot: el
          };
        });
      },
      syncModelText: function () {},
      hydrateModelTexts: function () {}
    };
  }

  /* ==========================================================================
     6. PERSISTENCE ENGINE (LOCALSTORAGE + INDEXEDDB + IMAGE OPTIMIZER)
     ========================================================================== */
  function getStorageKeyV2(exportId) {
    var pathKey = (global.location && global.location.pathname) ? global.location.pathname : (document.title || "presentation");
    return "ps_studio_state_v2::" + (exportId || "origin") + "::" + pathKey;
  }

  function getLegacyStorageKeyV1(exportId) {
    var pathKey = (global.location && global.location.pathname) ? global.location.pathname : (document.title || "presentation");
    return "ps_studio_state_v1::" + (exportId || "origin") + "::" + pathKey;
  }

  function idbSave(key, payload) {
    try {
      if (!global.indexedDB) return;
      var req = global.indexedDB.open("PresentationStudioDB", 1);
      req.onupgradeneeded = function (e) {
        var db = e.target.result;
        if (!db.objectStoreNames.contains("states")) {
          db.createObjectStore("states");
        }
      };
      req.onsuccess = function (e) {
        var db = e.target.result;
        var tx = db.transaction("states", "readwrite");
        tx.objectStore("states").put(payload, key);
      };
    } catch (e) {}
  }

  function idbLoad(key, callback) {
    try {
      if (!global.indexedDB) {
        callback(null);
        return;
      }
      var req = global.indexedDB.open("PresentationStudioDB", 1);
      req.onupgradeneeded = function (e) {
        var db = e.target.result;
        if (!db.objectStoreNames.contains("states")) {
          db.createObjectStore("states");
        }
      };
      req.onsuccess = function (e) {
        try {
          var db = e.target.result;
          if (!db.objectStoreNames.contains("states")) {
            callback(null);
            return;
          }
          var getReq = db.transaction("states", "readonly").objectStore("states").get(key);
          getReq.onsuccess = function () {
            callback(getReq.result || null);
          };
          getReq.onerror = function () {
            callback(null);
          };
        } catch (err) {
          callback(null);
        }
      };
      req.onerror = function () {
        callback(null);
      };
    } catch (e) {
      callback(null);
    }
  }

  function idbClear(key) {
    try {
      if (!global.indexedDB) return;
      var req = global.indexedDB.open("PresentationStudioDB", 1);
      req.onsuccess = function (e) {
        var db = e.target.result;
        if (db.objectStoreNames.contains("states")) {
          db.transaction("states", "readwrite").objectStore("states").delete(key);
        }
      };
    } catch (e) {}
  }

  function optimizeUploadedImageFile(file, callback) {
    var reader = new FileReader();
    reader.onload = function () {
      var rawDataUrl = String(reader.result || "");
      if (!rawDataUrl || String(file.type || "").indexOf("svg") !== -1) {
        callback(rawDataUrl);
        return;
      }
      var img = new Image();
      img.onload = function () {
        var maxDim = 1150;
        var w = img.naturalWidth || img.width || 0;
        var h = img.naturalHeight || img.height || 0;
        if (w > 0 && h > 0 && (w > maxDim || h > maxDim || file.size > 340 * 1024)) {
          var ratio = Math.min(1, maxDim / Math.max(w, h));
          var cw = Math.max(1, Math.round(w * ratio));
          var ch = Math.max(1, Math.round(h * ratio));
          try {
            var canvas = document.createElement("canvas");
            canvas.width = cw;
            canvas.height = ch;
            var ctx = canvas.getContext("2d");
            ctx.drawImage(img, 0, 0, cw, ch);
            var webp = canvas.toDataURL("image/webp", 0.86);
            if (webp && webp.indexOf("data:image/webp") === 0 && webp.length < rawDataUrl.length) {
              callback(webp);
              return;
            }
            var png = canvas.toDataURL("image/png");
            if (png && png.length < rawDataUrl.length) {
              callback(png);
              return;
            }
          } catch (err) {}
        }
        callback(rawDataUrl);
      };
      img.onerror = function () {
        callback(rawDataUrl);
      };
      img.src = rawDataUrl;
    };
    reader.readAsDataURL(file);
  }

  /* ==========================================================================
     7. MAIN PRESENTATION STUDIO PRO v2 CONTROLLER
     ========================================================================== */
  function createStudio() {
    injectMotionAndStudioStyles();

    var adapter = null;
    var exportScopeId = (BAKED_PAYLOAD && BAKED_PAYLOAD.exportId) ? BAKED_PAYLOAD.exportId : "origin";
    var storageKey = getStorageKeyV2(exportScopeId);
    var legacyStorageKey = getLegacyStorageKeyV1(exportScopeId);

    var studioState = {
      version: 2,
      exportId: exportScopeId,
      readonly: Boolean(BAKED_PAYLOAD && BAKED_PAYLOAD.readonly),
      savedAt: 0,
      globalTheme: {
        paletteId: "",
        fontFamily: "",
        googleFont: "",
        fontScalePct: 100,
        transition: ""
      },
      customFonts: [],
      pageOrder: [],
      customPages: {},
      pages: {}
    };

    var editMode = false;
    var hasSavedEdits = false;
    var undoStack = [];
    var redoStack = [];
    var studioClipboard = null;
    var selection = null;
    var activeModal = null;
    var activeFrameModalTab = "frames";
    var activeThemeModalTab = "slide";
    var activeCharTab = "all";
    var charSearchQuery = "";
    var selectedCastMood = "";
    var autoSaveTimer = null;
    var toastTimer = null;
    var bypassInteractiveClick = false;
    var motionPreviewNonce = 0;

    function ensurePageRecord(pageUid) {
      if (!studioState.pages[pageUid]) {
        studioState.pages[pageUid] = {
          background: { presetId: "", customColor: "", customImage: "", patternOpacity: 100 },
          textOverrides: {},
          frames: [],
          shapes: [],
          addedChars: [],
          nativeCharOverrides: {}
        };
      } else {
        var pr = studioState.pages[pageUid];
        if (!pr.background) pr.background = { presetId: "", customColor: "", customImage: "", patternOpacity: 100 };
        if (!pr.textOverrides) pr.textOverrides = {};
        if (!Array.isArray(pr.frames)) pr.frames = [];
        if (!Array.isArray(pr.shapes)) pr.shapes = [];
        if (!Array.isArray(pr.addedChars)) pr.addedChars = [];
        if (!pr.nativeCharOverrides) pr.nativeCharOverrides = {};
      }
      return studioState.pages[pageUid];
    }

    function registerUsedGoogleFont(fontObjOrName) {
      if (!fontObjOrName) return;
      ensureGoogleFontLoaded(fontObjOrName);
      var gfName = typeof fontObjOrName === "object"
        ? (fontObjOrName.googleFamily || fontObjOrName.name || "")
        : String(fontObjOrName).split(",")[0].replace(/['"]/g, "").trim();
      if (gfName && studioState.customFonts.indexOf(gfName) === -1) {
        studioState.customFonts.push(gfName);
      }
    }

    function hydrateSavedGoogleFonts() {
      if (Array.isArray(studioState.customFonts)) {
        for (var i = 0; i < studioState.customFonts.length; i++) {
          ensureGoogleFontLoaded(studioState.customFonts[i]);
        }
      }
      if (studioState.globalTheme && studioState.globalTheme.googleFont) {
        ensureGoogleFontLoaded(studioState.globalTheme.googleFont);
      }
    }

    function captureHistorySnapshot() {
      return deepClone({
        globalTheme: studioState.globalTheme,
        customFonts: studioState.customFonts,
        pageOrder: studioState.pageOrder,
        customPages: studioState.customPages,
        pages: studioState.pages
      });
    }

    function pushUndoSnapshot() {
      undoStack.push(captureHistorySnapshot());
      if (undoStack.length > 50) undoStack.shift();
      redoStack = [];
      syncDockState();
    }

    function restoreFromHistorySnapshot(snap) {
      var curUid = adapter.getCurrentPageUid();
      studioState.globalTheme = snap.globalTheme || { paletteId: "", fontFamily: "", googleFont: "", fontScalePct: 100, transition: "" };
      studioState.customFonts = snap.customFonts || [];
      studioState.pageOrder = snap.pageOrder;
      studioState.customPages = snap.customPages || {};
      studioState.pages = snap.pages || {};
      activeTextUndoKey = null;
      clearSelection();
      hydrateSavedGoogleFonts();
      resetPersistentModifiedElements();
      adapter.hydrateModelTexts(studioState.pages);
      var nextIdx = studioState.pageOrder.indexOf(curUid);
      adapter.rebuildPages(studioState.pageOrder, studioState.customPages, nextIdx >= 0 ? nextIdx : 0);
      applyGlobalThemeOverrides();
      applyAllStageOverrides();
      scheduleAutoSave();
      syncDockState();
    }

    function performUndo() {
      if (!undoStack.length) return;
      redoStack.push(captureHistorySnapshot());
      if (redoStack.length > 50) redoStack.shift();
      var prev = undoStack.pop();
      restoreFromHistorySnapshot(prev);
      showToast("تم التراجع عن الخطوة ↶ (" + undoStack.length + ")");
    }

    function performRedo() {
      if (!redoStack.length) return;
      undoStack.push(captureHistorySnapshot());
      if (undoStack.length > 50) undoStack.shift();
      var next = redoStack.pop();
      restoreFromHistorySnapshot(next);
      showToast("تمت إعادة الخطوة ↷ (" + redoStack.length + ")");
    }

    function applyLoadedStateObject(loaded) {
      if (!loaded || typeof loaded !== "object") return;
      if (Array.isArray(loaded.pageOrder) && loaded.pageOrder.length) {
        studioState.pageOrder = loaded.pageOrder.slice();
      }
      studioState.customPages = loaded.customPages || {};
      studioState.pages = loaded.pages || {};
      if (loaded.globalTheme) {
        studioState.globalTheme = Object.assign({
          paletteId: "", fontFamily: "", googleFont: "", fontScalePct: 100, transition: ""
        }, loaded.globalTheme);
      }
      if (Array.isArray(loaded.customFonts)) {
        studioState.customFonts = loaded.customFonts.slice();
      }
      studioState.savedAt = loaded.savedAt || Date.now();
      hasSavedEdits = true;
      hydrateSavedGoogleFonts();
    }

    function loadInitialState(initialOrder) {
      studioState.pageOrder = initialOrder.slice();
      var loaded = null;

      if (BAKED_PAYLOAD && BAKED_PAYLOAD.state) {
        loaded = deepClone(BAKED_PAYLOAD.state);
      }

      try {
        if (global.localStorage) {
          var rawV2 = global.localStorage.getItem(storageKey);
          var rawV1 = global.localStorage.getItem(legacyStorageKey);
          var candV2 = rawV2 ? JSON.parse(rawV2) : null;
          var candV1 = rawV1 ? JSON.parse(rawV1) : null;
          var bestLocal = candV2;
          if (candV1 && (!bestLocal || (candV1.savedAt || 0) > (bestLocal.savedAt || 0))) {
            bestLocal = candV1;
          }
          if (bestLocal && (!loaded || (bestLocal.savedAt || 0) >= (loaded.savedAt || 0))) {
            loaded = bestLocal;
          }
        }
      } catch (e) {}

      if (loaded) {
        applyLoadedStateObject(loaded);
      }
    }

    function saveNow(showNotification) {
      studioState.savedAt = Date.now();
      hasSavedEdits = true;
      var serialized = JSON.stringify(studioState);
      var savedOk = false;
      try {
        if (global.localStorage) {
          global.localStorage.setItem(storageKey, serialized);
          savedOk = true;
        }
      } catch (e) {}
      idbSave(storageKey, studioState);
      updateEntryBadge();
      if (showNotification) {
        showToast(savedOk ? "تم حفظ جميع التغييرات محلياً ✓" : "تم حفظ التغييرات في قاعدة المتصفح ✓");
      }
      return savedOk;
    }

    function scheduleAutoSave() {
      if (autoSaveTimer) clearTimeout(autoSaveTimer);
      autoSaveTimer = setTimeout(function () {
        saveNow(false);
      }, 320);
    }

    function resetAllChanges() {
      try {
        if (global.localStorage) {
          global.localStorage.removeItem(storageKey);
          global.localStorage.removeItem(legacyStorageKey);
        }
      } catch (e) {}
      idbClear(storageKey);
      idbClear(legacyStorageKey);
      undoStack = [];
      redoStack = [];
      activeTextUndoKey = null;
      studioState.savedAt = 0;
      studioState.globalTheme = { paletteId: "", fontFamily: "", googleFont: "", fontScalePct: 100, transition: "" };
      studioState.customFonts = [];
      studioState.pageOrder = adapter.initialOrder.slice();
      studioState.customPages = {};
      studioState.pages = {};
      hasSavedEdits = false;
      clearSelection();
      resetPersistentModifiedElements();
      adapter.hydrateModelTexts(studioState.pages);
      adapter.rebuildPages(studioState.pageOrder, studioState.customPages, 0);
      applyGlobalThemeOverrides();
      applyAllStageOverrides();
      updateEntryBadge();
      closeModal();
      showToast("تمت استعادة النسخة الأصلية للعرض ✓");
    }

    /* ----------------------------------------------------------------------

        studioClipboard = {
          kind: "frame",

    function pasteClipboardElement() {

        showToast("الحافظة فارغة — انسخ عنصراً أولاً (Ctrl+C)");
        return false;
      }
      pushUndoSnapshot();
      var pageUid = adapter.getCurrentPageUid();
      var pageRec = ensurePageRecord(pageUid);
      var copy = deepClone(studioClipboard.data);
      copy.locked = false;
      copy.x = clamp((typeof copy.x === "number" ? copy.x : 50) + 4, 12, 88);
      copy.y = clamp((typeof copy.y === "number" ? copy.y : 50) + 4, 14, 86);

      if (studioClipboard.kind === "frame") {
        copy.id = genUid("frame");
        copy.z = 50 + pageRec.frames.length;

        applyAllStageOverrides();
        var fEl = document.querySelector('.ps-frame-item[data-ps-frame-id="' + copy.id + '"]');
        if (fEl) selectItem({ kind: "frame", pageUid: pageUid, id: copy.id, el: fEl });
      } else if (studioClipboard.kind === "shape") {
        copy.id = genUid("shape");
        copy.z = 50 + pageRec.shapes.length;
        pageRec.shapes.push(copy);
        applyAllStageOverrides();
        var sEl = document.querySelector('.ps-shape-item[data-ps-shape-id="' + copy.id + '"]');
        if (sEl) selectItem({ kind: "shape", pageUid: pageUid, id: copy.id, el: sEl });
      } else if (studioClipboard.kind === "addedChar") {
        copy.id = genUid("char");

        pageRec.addedChars.push(copy);
        applyAllStageOverrides();
        var cEl = document.querySelector('.ps-char-item[data-ps-added-char-id="' + copy.id + '"]');
        if (cEl) selectItem({ kind: "addedChar", pageUid: pageUid, id: copy.id, el: cEl });

      scheduleAutoSave();
      showToast("تم لصق العنصر في الشريحة الحالية ✓");
      return true;
    }

    function exportProjectJson() {
      saveNow(false);
      var payload = {
        app: "PresentationStudioProV2",
        exportedAt: Date.now(),
        adapterKind: adapter ? adapter.kind : "generic",
        state: deepClone(studioState)
      };
      var blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json;charset=utf-8" });
      var url = URL.createObjectURL(blob);
      var link = document.createElement("a");
      link.href = url;
      link.download = "presentation-project-v2.json";
      link.setAttribute("data-ps-ignore", "1");
      link.style.display = "none";
      document.body.appendChild(link);
      link.click();
      setTimeout(function () {
        if (link.parentNode) link.parentNode.removeChild(link);

      showToast("تم تصدير ملف المشروع JSON بنجاح ✓");

    function importProjectJsonFile(file) {
      if (!file) return;
      var reader = new FileReader();
      reader.onload = function () {
        try {
          var parsed = JSON.parse(String(reader.result || ""));
          var nextState = (parsed && parsed.state && parsed.state.pages) ? parsed.state : (parsed && parsed.pages ? parsed : null);
          if (!nextState) {
            showToast("ملف JSON غير صالح لمشروع الاستوديو");
            return;
          }
          pushUndoSnapshot();
          applyLoadedStateObject(nextState);
          clearSelection();
          resetPersistentModifiedElements();
          adapter.hydrateModelTexts(studioState.pages);
          adapter.rebuildPages(studioState.pageOrder, studioState.customPages, 0);
          applyGlobalThemeOverrides();
          applyAllStageOverrides();
          saveNow(false);
          closeModal();
          showToast("تم استيراد المشروع وتطبيق التعديلات بنجاح ✓");
        } catch (err) {
          showToast("تعذّرت قراءة ملف JSON المحدّد");
        }
      };
      reader.readAsText(file);
    }

    /* ----------------------------------------------------------------------
       9. EXPORT STANDALONE LOCAL HTML FILE WITH ALL EDITS BAKED IN
       ---------------------------------------------------------------------- */
    function buildStandaloneHtmlString(opts) {
      var options = opts || {};
      saveNow(false);

      var baseHtml = INITIAL_CLEAN_HTML || capturePristineSnapshot();
      var newExportId = "exp_" + Date.now().toString(36);
      var exportPayload = {
        exportId: newExportId,
        readonly: Boolean(options.readonly),
        exportedAt: Date.now(),
        state: deepClone(studioState)
      };

      var safeJson = JSON.stringify(exportPayload).replace(/</g, "\\u003c");
      var bakedTag = "<" + 'script id="ps-baked-state" type="application/json">' + safeJson + "<" + "/script>\n";

      var scriptAnchor = "<" + 'script id="ps-studio-script"';
      var anchorPos = baseHtml.indexOf(scriptAnchor);
      if (anchorPos !== -1) {
        return baseHtml.slice(0, anchorPos) + bakedTag + baseHtml.slice(anchorPos);
      }

      var bodyClose = baseHtml.lastIndexOf("<" + "/body>");
      if (bodyClose !== -1) {
        return baseHtml.slice(0, bodyClose) + bakedTag + baseHtml.slice(bodyClose);
      }
      return baseHtml + "\n" + bakedTag;
    }

    function downloadStandaloneHtml(opts) {
      var options = opts || {};
      var htmlContent = buildStandaloneHtmlString(options);
      var rawBase = "presentation";
      try {
        var rawPath = (global.location && global.location.pathname) ? global.location.pathname : "";
        var segs = rawPath.replace(/\/+$/, "").split("/").filter(Boolean);
        var lastSeg = segs.length ? segs[segs.length - 1] : "";
        if (lastSeg && /\.html?$/i.test(lastSeg) && !/^index\.html?$/i.test(lastSeg)) {
          rawBase = lastSeg.replace(/\.html?$/i, "").replace(/-edited(-\d+)?$/i, "");
        } else if (lastSeg && /^[1-9]\d*$/.test(lastSeg)) {
          var prevSeg = segs.length > 1 ? segs[segs.length - 2] : "presentation";
          rawBase = prevSeg + "-edition-" + lastSeg;
        } else if (segs.length > 1 && /^index\.html?$/i.test(lastSeg) && /^[1-9]\d*$/.test(segs[segs.length - 2])) {
          var projSeg = segs.length > 2 ? segs[segs.length - 3] : "presentation";
          rawBase = projSeg + "-edition-" + segs[segs.length - 2];
        } else if (lastSeg && !/^index\.html?$/i.test(lastSeg)) {
          rawBase = lastSeg;
        } else if (document.title) {
          rawBase = "bullying-presentation";
        }
      } catch (e) {}

      var fileName = options.fileName || (rawBase + "-edited.html");
      if (!/\.html?$/i.test(fileName)) fileName += ".html";

      var blob = new Blob([htmlContent], { type: "text/html;charset=utf-8" });
      var url = URL.createObjectURL(blob);
      var link = document.createElement("a");
      link.href = url;
      link.download = fileName;
      link.setAttribute("data-ps-ignore", "1");
      link.style.display = "none";
      document.body.appendChild(link);
      link.click();
      setTimeout(function () {
        if (link.parentNode) link.parentNode.removeChild(link);
        URL.revokeObjectURL(url);
      }, 1800);

      showToast("تم تنزيل ملف HTML المحلي بكامل تعديلاتك ✓");
      return fileName;
    }

    function applyGlobalThemeOverrides() {

      if (gt.paletteId) {

      var hasTrans = Boolean(gt.transition);

      if (gt.googleFont) ensureGoogleFontLoaded(gt.googleFont);

      var rules = [];
      if (pal && pal.id) {
        rules.push(":root, body, [data-theme] {");
        if (pal.primary) {
          rules.push("  --terracotta: " + pal.primary + " !important;");

        }

        rules.push(".sheet-content-col, .subtitle-dock, .subtitle-center-stage, .editorial-column, .caption-bar { zoom: " + ratio + "; }");
      }

      if (hasTrans) {

        } else if (gt.transition === "slide") {

        } else if (gt.transition === "zoom") {

    function normalizeIntensityVal(val) {
      if (val === "soft" || val === "light") return "soft";
      if (val === "strong" || val === "high") return "strong";
      return "normal";
    }

    function computeMotionAttrsAndStyles(motionObj) {
      if (!motionObj || typeof motionObj !== "object") {
        return { hasAny: false, enterStyle: "", loopStyle: "", enterAttr: "", loopAttr: "", hoverClass: "", hoverAttr: "" };
      }
      var ent = motionObj.entrance || "none";
      var lp = motionObj.loop || "none";
      var ix = motionObj.interactive || motionObj.hover || "none";
      var dur = typeof motionObj.duration === "number" ? motionObj.duration : 1.2;
      var entDur = typeof motionObj.entranceDur === "number" ? motionObj.entranceDur : clamp(dur, 0.3, 4.0);
      var lpDur = typeof motionObj.loopDur === "number" ? motionObj.loopDur : clamp(dur, 0.3, 8.0);
      var delay = typeof motionObj.delay === "number" ? motionObj.delay : 0;
      var intensity = normalizeIntensityVal(motionObj.intensity);

      if (ent === "none" && lp === "none" && ix === "none") {
        return { hasAny: false, enterStyle: "", loopStyle: "", enterAttr: "", loopAttr: "", hoverClass: "", hoverAttr: "" };
      }

      var reg = getAssetsRegistry();
      if (reg.buildAnimProps) {
        var built = reg.buildAnimProps({
          entrance: ent,
          entranceDur: entDur,
          entranceDelay: delay,
          loop: lp,
          loopDur: lpDur,
          interactive: ix,
          intensity: intensity
        });
        return {
          hasAny: true,
          enterStyle: built.enterStyle || "",
          loopStyle: built.loopStyle || "",
          enterAttr: "",
          loopAttr: "",
          hoverClass: built.interactiveClass || "",
          hoverAttr: ""
        };
      }

      var amp = intensity === "soft" ? 0.55 : (intensity === "strong" ? 1.55 : 1);
      var sharedVars = "--ps-amp:" + amp + ";--ps-enter-dur:" + entDur + "s;--ps-mot-dur:" + lpDur + "s;--ps-mot-delay:" + delay + "s;";
      return {
        hasAny: true,
        enterStyle: ent !== "none" ? sharedVars : "",
        loopStyle: lp !== "none" ? sharedVars : "",
        enterAttr: ent !== "none" ? ent : "",
        loopAttr: lp !== "none" ? lp : "",
        hoverClass: "",
        hoverAttr: ix !== "none" ? ix : ""
      };
    }

    function applyMotionToNativeElement(el, motionObj) {
      if (!el) return;
      /* Clear previous interactive classes */
      if (el.__psAddedIxClass) {
        el.classList.remove(el.__psAddedIxClass);
        el.__psAddedIxClass = "";
      }
      el.removeAttribute("data-ps-mot-enter");
      el.removeAttribute("data-ps-mot-loop");
      el.removeAttribute("data-ps-mot-hover");
      el.style.animation = "";

      var m = computeMotionAttrsAndStyles(motionObj);
      if (!m.hasAny) return;

      el.setAttribute("data-ps-has-motion", "1");
      if (m.hoverClass) {
        el.classList.add(m.hoverClass);
        el.__psAddedIxClass = m.hoverClass;
      } else if (m.hoverAttr) {
        el.setAttribute("data-ps-mot-hover", m.hoverAttr);
      }

      /* Apply loop or entrance directly on native element */
      var animParts = [];
      var extractAnimRule = function (styleStr) {
        var match = styleStr.match(/animation\s*:\s*([^;]+)/i);
        return match ? match[1].trim() : "";
      };
      var intMatch = (m.enterStyle || m.loopStyle).match(/--ps-int\s*:\s*([^;]+)/);
      if (intMatch) el.style.setProperty("--ps-int", intMatch[1].trim());

      var entAnim = extractAnimRule(m.enterStyle);
      var lpAnim = extractAnimRule(m.loopStyle);
      if (entAnim) animParts.push(entAnim);
      if (lpAnim) animParts.push(lpAnim);

      if (animParts.length) {
        el.style.animation = animParts.join(", ");
      } else {
        if (m.enterAttr) el.setAttribute("data-ps-mot-enter", m.enterAttr);
        if (m.loopAttr) el.setAttribute("data-ps-mot-loop", m.loopAttr);
      }
    }

    function computeFilterCss(filterPreset, brightness, hueRotate) {
      var parts = [];
      var br = typeof brightness === "number" ? brightness : 100;
      var hr = typeof hueRotate === "number" ? hueRotate : 0;
      if (br !== 100) parts.push("brightness(" + (br / 100).toFixed(2) + ")");
      if (hr !== 0) parts.push("hue-rotate(" + Math.round(hr) + "deg)");
      if (filterPreset === "shadow") parts.push("drop-shadow(0 10px 18px rgba(15,23,42,0.34))");
      else if (filterPreset === "glow") parts.push("drop-shadow(0 0 14px rgba(56,189,248,0.72))");
      else if (filterPreset === "warm") parts.push("sepia(0.24) saturate(1.18)");
      else if (filterPreset === "cool") parts.push("hue-rotate(14deg) saturate(1.1)");
      return parts.join(" ");
    }

    function indexNativeSvgCharacterGroups(stageTarget) {
      var svgs = stageTarget.charRoot.querySelectorAll(".art-stage-frame svg, .stage-scene svg, #svg-stage-host svg, #backdrop-host svg");
      for (var s = 0; s < svgs.length; s++) {
        var svg = svgs[s];
        if (svg.closest("[data-ps-overlay-layer]")) continue;
        if (svg.closest(".char-pod, .sp-char-actor, .cinema-actor, .motion-actor")) continue;

        var groupContainers = [svg];
        for (var gc = 0; gc < svg.children.length; gc++) {
          var topChild = svg.children[gc];
          if (
            topChild.tagName &&
            topChild.tagName.toLowerCase() === "g" &&
            topChild.hasAttribute("clip-path") &&
            topChild.querySelectorAll(":scope > g").length >= 2
          ) {
            groupContainers.push(topChild);
          }
        }

        var gIndex = 0;
        for (var pIdx = 0; pIdx < groupContainers.length; pIdx++) {
          var parentNode = groupContainers[pIdx];
          var children = Array.prototype.slice.call(parentNode.children);

        if (bodyEl) {
          if (editMode && !fm.locked) bodyEl.setAttribute("contenteditable", "true");
          else bodyEl.removeAttribute("contenteditable");
          bodyEl.style.fontFamily = fm.fontFamily || "";
          bodyEl.style.fontWeight = fm.fontWeight || "";
          bodyEl.style.fontStyle = fm.fontStyle || "";
          bodyEl.style.textDecoration = fm.textDecoration || "";
          bodyEl.style.textAlign = fm.textAlign || (vis.radius >= 900 ? "center" : "right");
          if (activeFocusedFrameId !== fm.id) {
            bodyEl.textContent = fm.text || "";
          }
        }

        applyOverlayItemMotionRigs(fEl, fm.motion);
      }

      for (var oldFid in existingFrames) {
        if (!validFrameIds[oldFid] && existingFrames[oldFid].parentNode) {
          existingFrames[oldFid].parentNode.removeChild(existingFrames[oldFid]);
        }
      }

      /* --- B. Render Vector Shapes --- */
      var existingShapes = {};
      var sNodes = layer.querySelectorAll(".ps-shape-item");
      for (var si = 0; si < sNodes.length; si++) {
        existingShapes[sNodes[si].getAttribute("data-ps-shape-id")] = sNodes[si];
      }

      var validShapeIds = {};
      for (var sh = 0; sh < shapes.length; sh++) {
        var sp = shapes[sh];
        validShapeIds[sp.id] = true;
        var sEl = existingShapes[sp.id];
        var sSig = [sp.shapeId, sp.fill, sp.stroke, sp.strokeWidth].join("::");
        if (!sEl) {
          sEl = document.createElement("div");
          sEl.className = "ps-shape-item";
          sEl.setAttribute("data-ps-shape-id", sp.id);
          sEl.setAttribute("data-ps-page-uid", pageUid);
          sEl.innerHTML = '<div class="ps-mot-enter-rig"><div class="ps-mot-loop-rig ps-shape-svg-host"></div></div>';
          layer.appendChild(sEl);
        }
        var svgHost = sEl.querySelector(".ps-shape-svg-host");
        if (svgHost && sEl.getAttribute("data-ps-sig") !== sSig) {
          svgHost.innerHTML = renderShapeSvgMarkup(sp);
          sEl.setAttribute("data-ps-sig", sSig);
        }
        var sSc = typeof sp.scale === "number" ? sp.scale : 1;
        sEl.style.setProperty("--ps-x", (typeof sp.x === "number" ? sp.x : 50).toFixed(2) + "%");
        sEl.style.setProperty("--ps-y", (typeof sp.y === "number" ? sp.y : 50).toFixed(2) + "%");
        sEl.style.setProperty("--ps-w", (sp.width || 120) + "px");
        sEl.style.setProperty("--ps-sx", (sp.flipX ? -sSc : sSc).toFixed(3));
        sEl.style.setProperty("--ps-sy", (sp.flipY ? -sSc : sSc).toFixed(3));
        sEl.style.setProperty("--ps-rot", (sp.rotate || 0) + "deg");
        sEl.style.setProperty("--ps-op", String(clamp(typeof sp.opacity === "number" ? sp.opacity : 100, 10, 100) / 100));
        sEl.style.setProperty("--ps-z", String(sp.z || 47));
        sEl.style.filter = sp.shadow === "deep" ? "drop-shadow(0 10px 18px rgba(0,0,0,0.28))" : (sp.shadow === "glow" ? "drop-shadow(0 0 12px rgba(56,189,248,0.7))" : "");
        sEl.classList.toggle("is-selected", Boolean(selection && selection.kind === "shape" && selection.id === sp.id));
        applyOverlayItemMotionRigs(sEl, sp.motion);
      }

      for (var oldSid in existingShapes) {
        if (!validShapeIds[oldSid] && existingShapes[oldSid].parentNode) {
          existingShapes[oldSid].parentNode.removeChild(existingShapes[oldSid]);
        }
      }

      /* --- C. Render Added Characters --- */
      var existingChars = {};
      var cNodes = layer.querySelectorAll(".ps-char-item");
      for (var k = 0; k < cNodes.length; k++) {
        existingChars[cNodes[k].getAttribute("data-ps-added-char-id")] = cNodes[k];
      }

      var validCharIds = {};
      for (var c = 0; c < chars.length; c++) {
        var ch = chars[c];
        validCharIds[ch.id] = true;
        var cEl = existingChars[ch.id];
        var sig = [
          ch.charId || "custom",
          ch.mood || "",
          ch.primaryColor || "",
          ch.secondaryColor || "",
          ch.skinColor || "",
          ch.customDataUrl ? ch.customDataUrl.length : 0
        ].join("::");

        if (!cEl) {
          cEl = document.createElement("div");
          cEl.className = "ps-char-item";
          cEl.setAttribute("data-ps-added-char-id", ch.id);
          cEl.setAttribute("data-ps-page-uid", pageUid);
          cEl.innerHTML = '<div class="ps-mot-enter-rig"><div class="ps-mot-loop-rig ps-char-svg-host"></div></div>';
          layer.appendChild(cEl);
        }
        var charHost = cEl.querySelector(".ps-char-svg-host");
        if (charHost && cEl.getAttribute("data-ps-sig") !== sig) {
          charHost.innerHTML = renderCharacterSvgMarkup(ch);
          cEl.setAttribute("data-ps-sig", sig);
        }
        var sc = typeof ch.scale === "number" ? ch.scale : 1;
        var sx = ch.flip ? -sc : sc;
        var sy = ch.flipY ? -sc : sc;
        cEl.style.setProperty("--ps-x", (typeof ch.x === "number" ? ch.x : 50).toFixed(2) + "%");
        cEl.style.setProperty("--ps-y", (typeof ch.y === "number" ? ch.y : 55).toFixed(2) + "%");
        cEl.style.setProperty("--ps-sx", sx.toFixed(3));
        cEl.style.setProperty("--ps-sy", sy.toFixed(3));
        cEl.style.setProperty("--ps-rot", (ch.rotate || 0) + "deg");
        cEl.style.setProperty("--ps-op", String(clamp(typeof ch.opacity === "number" ? ch.opacity : 100, 10, 100) / 100));
        cEl.style.setProperty("--ps-z", String(ch.z || 48));
        cEl.style.filter = computeFilterCss(ch.filterPreset, ch.brightness, ch.hueRotate);
        cEl.classList.toggle("is-selected", Boolean(selection && selection.kind === "addedChar" && selection.id === ch.id));
        applyOverlayItemMotionRigs(cEl, ch.motion);
      }

      for (var oldCid in existingChars) {
        if (!validCharIds[oldCid] && existingChars[oldCid].parentNode) {
          existingChars[oldCid].parentNode.removeChild(existingChars[oldCid]);
        }
      }
    }

    function applyOverlayItemMotionRigs(itemEl, motionObj) {
      if (!itemEl) return;
      var enterRig = itemEl.querySelector(":scope > .ps-mot-enter-rig");
      var loopRig = enterRig ? enterRig.querySelector(":scope > .ps-mot-loop-rig") : null;
      if (!enterRig || !loopRig) return;

      if (loopRig.__psAddedIxClass) {
        loopRig.classList.remove(loopRig.__psAddedIxClass);
        loopRig.__psAddedIxClass = "";
      }
      enterRig.style.cssText = "";
      loopRig.style.cssText = "";
      enterRig.removeAttribute("data-ps-mot-enter");
      loopRig.removeAttribute("data-ps-mot-loop");
      loopRig.removeAttribute("data-ps-mot-hover");

      var m = computeMotionAttrsAndStyles(motionObj);
      if (!m.hasAny) return;

      if (m.enterStyle) enterRig.style.cssText = m.enterStyle;
      if (m.loopStyle) loopRig.style.cssText = m.loopStyle;
      if (m.enterAttr) enterRig.setAttribute("data-ps-mot-enter", m.enterAttr);
      if (m.loopAttr) loopRig.setAttribute("data-ps-mot-loop", m.loopAttr);
      if (m.hoverClass) {
        loopRig.classList.add(m.hoverClass);
        loopRig.__psAddedIxClass = m.hoverClass;
      } else if (m.hoverAttr) {
        loopRig.setAttribute("data-ps-mot-hover", m.hoverAttr);
      }
    }

    function triggerLiveMotionPreview() {
      if (!selection || !selection.el) return;
      motionPreviewNonce += 1;
      var el = selection.el;
      var enterRig = el.querySelector && el.querySelector(":scope > .ps-mot-enter-rig");
      if (enterRig) {
        var prevCss = enterRig.style.cssText;
        var prevAttr = enterRig.getAttribute("data-ps-mot-enter");
        enterRig.style.animation = "none";
        enterRig.removeAttribute("data-ps-mot-enter");
        void enterRig.offsetWidth;
        enterRig.style.cssText = prevCss;
        if (prevAttr) enterRig.setAttribute("data-ps-mot-enter", prevAttr);
      } else {
        var prevAnim = el.style.animation;
        var prevEnt = el.getAttribute("data-ps-mot-enter");
        el.style.animation = "none";
        el.removeAttribute("data-ps-mot-enter");
        void el.offsetWidth;
        el.style.animation = prevAnim;
        if (prevEnt) el.setAttribute("data-ps-mot-enter", prevEnt);
        applyAllStageOverrides();
      }
      showToast("▶ تمت معاينة الحركة على العنصر المحدّد");
    }

    function applyAllStageOverrides() {
      if (!adapter) return;
      resetPersistentModifiedElements();
      var targets = adapter.getStageTargets();
      for (var i = 0; i < targets.length; i++) {
        applyStageTarget(targets[i]);
      }
      syncSelectionRing();
      syncDockState();
    }

    /* ----------------------------------------------------------------------
       12. SELECTION RING & RICH CONTEXTUAL INSPECTOR BAR
       ---------------------------------------------------------------------- */
    var INTERACTIVE_TRIGGER_SELECTOR = "button, a, summary, [data-jump], [data-widget], [data-cite], [data-ctrl], [data-action], [data-theater-btn], [role='tab'], [role='button']";

    function findInteractiveTrigger(el) {
      if (!el || !el.closest) return null;
      var trig = el.closest(INTERACTIVE_TRIGGER_SELECTOR);
      if (trig && trig.closest("#ps-studio-root")) return null;
      return trig;
    }

    function clearSelection() {
      selection = null;
      ui.ring.hidden = true;
      ui.ctxBar.hidden = true;
      var selNodes = document.querySelectorAll(".ps-frame-item.is-selected, .ps-shape-item.is-selected, .ps-char-item.is-selected");
      for (var i = 0; i < selNodes.length; i++) selNodes[i].classList.remove("is-selected");
    }

    function syncSelectionRing() {
      if (!editMode || !selection || !selection.el || !document.body.contains(selection.el)) {
        ui.ring.hidden = true;
        if (selection && (!selection.el || !document.body.contains(selection.el))) {
          ui.ctxBar.hidden = true;
          selection = null;
        }
        return;
      }

      var rect = selection.el.getBoundingClientRect();
      if (rect.width < 2 && rect.height < 2) {
        ui.ring.hidden = true;
        return;
      }
      var model = getSelectedModel();
      var isLocked = Boolean(model && model.locked);
      ui.ring.classList.toggle("is-locked", isLocked);
      ui.moveHandle.textContent = isLocked ? "🔒 مقفول" : "⠿ اسحب";

      ui.ring.style.left = Math.round(rect.left - 4) + "px";
      ui.ring.style.top = Math.round(rect.top - 4) + "px";
      ui.ring.style.width = Math.round(rect.width + 8) + "px";
      ui.ring.style.height = Math.round(rect.height + 8) + "px";
      ui.ring.hidden = false;
    }

    function selectItem(selObj) {
      selection = selObj;
      var allSel = document.querySelectorAll(".ps-frame-item.is-selected, .ps-shape-item.is-selected, .ps-char-item.is-selected");
      for (var i = 0; i < allSel.length; i++) allSel[i].classList.remove("is-selected");
      if (selection && selection.el && (selection.kind === "frame" || selection.kind === "shape" || selection.kind === "addedChar")) {
        selection.el.classList.add("is-selected");
      }
      renderContextBar();
      syncSelectionRing();
    }

    function getSelectedModel() {
      if (!selection) return null;
      var pageRec = ensurePageRecord(selection.pageUid);
      if (selection.kind === "frame") {
        for (var i = 0; i < pageRec.frames.length; i++) {
          if (pageRec.frames[i].id === selection.id) return pageRec.frames[i];
        }
      }
      if (selection.kind === "shape") {
        for (var s = 0; s < pageRec.shapes.length; s++) {
          if (pageRec.shapes[s].id === selection.id) return pageRec.shapes[s];
        }
      }
      if (selection.kind === "addedChar") {
        for (var j = 0; j < pageRec.addedChars.length; j++) {
          if (pageRec.addedChars[j].id === selection.id) return pageRec.addedChars[j];
        }
      }
      if (selection.kind === "nativeChar") {
        if (!pageRec.nativeCharOverrides[selection.id]) {
          pageRec.nativeCharOverrides[selection.id] = { scale: 1, dx: 0, dy: 0, dxPct: 0, dyPct: 0, rotate: 0, flip: false, flipY: false, opacity: 100, hidden: false, locked: false };
        }
        return pageRec.nativeCharOverrides[selection.id];
      }
      if (selection.kind === "text" || selection.kind === "svgText") {
        if (!pageRec.textOverrides[selection.id]) {
          pageRec.textOverrides[selection.id] = {};
        }
        return pageRec.textOverrides[selection.id];
      }
      return null;
    }

            '<input type="color" class="ps-color-input" data-ctx-color="char-secondary" value="' + normalizeColorForPicker(model.secondaryColor, "#FAF6EE") + '" title="لون الملابس الثانوي" />' +
            '<input type="color" class="ps-color-input" data-ctx-color="char-skin" value="' + normalizeColorForPicker(model.skinColor, "#F2C2A2") + '" title="لون البشرة" />'

          ) +

          '<input type="range" class="ps-ctx-slider" data-ctx-act="scale-slider" min="20" max="350" value="' + shScale + '" aria-label="حجم الشكل" />' +
          '<button type="button" class="ps-ctx-btn" data-ctx-act="flip" title="عكس أفقي">⇄</button>' +
          '<button type="button" class="ps-ctx-btn" data-ctx-act="flip-y" title="عكس رأسي">⇅</button>' +
          '<button type="button" class="ps-ctx-btn" data-ctx-act="z-front">أمام ▲</button>' +
          '<button type="button" class="ps-ctx-btn" data-ctx-act="z-back">خلف ▼</button>' +
          '<button type="button" class="ps-ctx-btn" data-ctx-act="copy-el">نسخ</button>' +
          lockBtn +
          '<button type="button" class="ps-ctx-btn is-danger" data-ctx-act="del-item">🗑</button>';

        ui.ctxBar.innerHTML =

          lockBtn +

          : '';

          '<button type="button" class="ps-ctx-btn' + (model.fontWeight === "800" ? " is-active" : "") + '" data-ctx-act="text-bold" title="خط عريض">B</button>' +
          (!isSvgTxt

              '<button type="button" class="ps-ctx-btn' + (model.textDecoration === "underline" ? " is-active" : "") + '" data-ctx-act="text-underline" title="تسطير">U</button>' +

    /* ----------------------------------------------------------------------
       13. ACTIONS: ADD ITEMS, TRIGGER NATIVE BUTTON, CLONE, LAYERS & PAGES
       ---------------------------------------------------------------------- */
    function addTextFrame(templateId) {
      pushUndoSnapshot();
      var reg = getAssetsRegistry();
      var pageUid = adapter.getCurrentPageUid();
      var pageRec = ensurePageRecord(pageUid);
      var count = pageRec.frames.length;
      var tpl = reg.frames[0];
      for (var i = 0; i < reg.frames.length; i++) {
        if (reg.frames[i].id === templateId) { tpl = reg.frames[i]; break; }
      }

      var newFrame = {

    function addShapeToStage(shapeIdOrSpec) {

        }

        skinColor: charSpec.skinColor || charSpec.skin || "",

        x: clamp(34 + (count % 5) * 8, 16, 84),

      var txt = selection.el ? extractEditableText(selection.el) : (model.text || "");

      var newFrame = {
        id: genUid("frame"),

        borderStyle: "solid",
        radius: 14,
        tail: "none",
        shadow: "soft",

    function triggerSelectedInteractiveButton() {
      if (!selection || !selection.el) return;
      var trig = findInteractiveTrigger(selection.el);
      if (!trig) return;
      disableAllInlineContentEditable();
      clearSelection();
      if (trig.tagName && trig.tagName.toUpperCase() === "SUMMARY" && trig.parentElement && trig.parentElement.tagName.toUpperCase() === "DETAILS") {
        trig.parentElement.open = !trig.parentElement.open;
      } else {
        bypassInteractiveClick = true;
        try {
          trig.click();
        } finally {
          bypassInteractiveClick = false;
        }
      }
      setTimeout(function () {
        applyAllStageOverrides();
      }, 45);
      showToast("⚡ تم تشغيل الزر وتحديث فهرسة النصوص الجديدة");
    }

    function scaleSelectedItem(nextScale, recordUndo) {
      if (!selection) return;
      var model = getSelectedModel();
      if (!model || model.locked) return;
      if (recordUndo) pushUndoSnapshot();
      model.scale = clamp(Math.round(nextScale * 100) / 100, 0.15, 4.0);
      applyAllStageOverrides();
      renderContextBar();
      scheduleAutoSave();
    }

    function adjustSelectedLayerZ(delta) {
      if (!selection) return;
      var model = getSelectedModel();
      if (!model) return;
      pushUndoSnapshot();
      model.z = clamp((model.z || 48) + delta, 10, 250);
      applyAllStageOverrides();
      scheduleAutoSave();
      showToast(delta > 0 ? "تم تقديم الطبقة للأمام ▲" : "تم إرسال الطبقة للخلف ▼");
    }

    function deleteSelectedItem() {
      if (!selection) return;
      pushUndoSnapshot();
      var pageRec = ensurePageRecord(selection.pageUid);

      if (selection.kind === "frame") {
        pageRec.frames = pageRec.frames.filter(function (f) { return f.id !== selection.id; });
        clearSelection();
        applyAllStageOverrides();
        scheduleAutoSave();
        showToast("تم حذف الإطار ✓");
        return;
      }

      if (selection.kind === "shape") {
        pageRec.shapes = pageRec.shapes.filter(function (s) { return s.id !== selection.id; });
        clearSelection();
        applyAllStageOverrides();
        scheduleAutoSave();
        showToast("تم حذف الشكل ✓");
        return;
      }

      if (selection.kind === "addedChar") {
        pageRec.addedChars = pageRec.addedChars.filter(function (c) { return c.id !== selection.id; });
        clearSelection();
        applyAllStageOverrides();
        scheduleAutoSave();
        showToast("تم حذف الشخصية ✓");
        return;
      }

      if (selection.kind === "nativeChar") {
        var ov = getSelectedModel();
        ov.hidden = true;
        clearSelection();
        applyAllStageOverrides();
        scheduleAutoSave();
        showToast("تم إخفاء العنصر (يمكنك إظهاره من 🗂 الطبقات) ✓");
        return;
      }

      if (selection.kind === "text" || selection.kind === "svgText") {
        var tOv = getSelectedModel();
        tOv.hidden = true;
        clearSelection();
        applyAllStageOverrides();
        scheduleAutoSave();
        showToast("تم إخفاء النص (يمكنك إظهاره بضغطة من 🗂 الطبقات) ✓");
      }
    }

    function movePageInOrder(fromIdx, toIdx) {
      var order = studioState.pageOrder;
      if (fromIdx < 0 || fromIdx >= order.length || toIdx < 0 || toIdx >= order.length || fromIdx === toIdx) return;
      pushUndoSnapshot();
      var activeUid = adapter.getCurrentPageUid();
      var moved = order.splice(fromIdx, 1)[0];
      order.splice(toIdx, 0, moved);
      var newActiveIdx = order.indexOf(activeUid);
      adapter.rebuildPages(order, studioState.customPages, newActiveIdx >= 0 ? newActiveIdx : toIdx);
      scheduleAutoSave();
      syncDockState();
      if (activeModal === "pages") renderPagesModal();
    }

    function deletePageAtIndex(idx) {
      var order = studioState.pageOrder;
      if (order.length <= 1) {
        showToast("لا يمكن حذف الصفحة الوحيدة المتبقية في العرض");
        return;
      }
      if (idx < 0 || idx >= order.length) return;
      pushUndoSnapshot();
      var curIdx = adapter.getCurrentIndex();
      order.splice(idx, 1);
      var nextActiveIdx = curIdx;
      if (idx < curIdx) nextActiveIdx = curIdx - 1;
      else if (nextActiveIdx >= order.length) nextActiveIdx = order.length - 1;

      clearSelection();
      adapter.rebuildPages(order, studioState.customPages, Math.max(0, nextActiveIdx));
      scheduleAutoSave();
      syncDockState();
      if (activeModal === "pages") renderPagesModal();
      showToast("تم حذف الصفحة وتحديث الترقيم ✓");
    }

    function duplicatePageAtIndex(idx) {
      var order = studioState.pageOrder;
      if (idx < 0 || idx >= order.length) return;
      pushUndoSnapshot();
      var srcUid = order[idx];
      var newUid = genUid("custom_page");
      if (studioState.customPages[srcUid]) {
        studioState.customPages[newUid] = deepClone(studioState.customPages[srcUid]);
      } else {
        studioState.customPages[newUid] = { kind: "clone", sourceUid: srcUid };
      }
      if (studioState.pages[srcUid]) {
        studioState.pages[newUid] = deepClone(studioState.pages[srcUid]);
        var pRec = studioState.pages[newUid];
        if (Array.isArray(pRec.frames)) pRec.frames.forEach(function (f) { f.id = genUid("frame"); });
        if (Array.isArray(pRec.shapes)) pRec.shapes.forEach(function (s) { s.id = genUid("shape"); });
        if (Array.isArray(pRec.addedChars)) pRec.addedChars.forEach(function (c) { c.id = genUid("char"); });
      }
      order.splice(idx + 1, 0, newUid);
      adapter.rebuildPages(order, studioState.customPages, idx + 1);
      scheduleAutoSave();
      syncDockState();
      if (activeModal === "pages") renderPagesModal();
      showToast("تم نسخ الصفحة بكامل عناصرها ✓");
    }

    function addNewBlankPage(templateKind) {
      pushUndoSnapshot();
      var tpl = templateKind || "content";
      var curIdx = adapter.getCurrentIndex();
      var newUid = genUid("custom_page");
      var titlesByTpl = {
        hero: "عنوان المحور أو الفصل الجديد",
        content: "صفحة محتوى ورسم مخصّصة",
        compare: "مقارنة ثنائية بين مفهومين",
        quote: "اقتباس وشاهد علمي محوري"
      };
      studioState.customPages[newUid] = {
        kind: "blank",
        template: tpl,
        sourceUid: adapter.initialOrder[0],
        title: titlesByTpl[tpl] || "صفحة مخصّصة جديدة",
        subtitle: "اضغط على أي نص لتعديله أو أضف شخصيات وإطارات وأشكالاً بحرية",
        lead: "اكتب الأفكار أو المشاهد التفاعلية الإضافية هنا."
      };
      studioState.pageOrder.splice(curIdx + 1, 0, newUid);
      adapter.rebuildPages(studioState.pageOrder, studioState.customPages, curIdx + 1);
      scheduleAutoSave();
      syncDockState();
      if (activeModal === "pages") renderPagesModal();
      showToast("تمت إضافة الصفحة الجديدة ✓");
    }

                (st.icon ? escHtml(st.icon) + ' ' : '') + escHtml(st.label || st.name) +

    /* 14.2 Massive Character Library Modal (Search + 8 Categories + OnPage + Upload) */
    function collectCurrentPageCharactersList() {
      var list = [];
      var pageUid = adapter.getCurrentPageUid();
      var pageRec = ensurePageRecord(pageUid);

      for (var i = 0; i < pageRec.addedChars.length; i++) {
        var ac = pageRec.addedChars[i];
        list.push({
          kind: "addedChar",
          id: ac.id,
          name: ac.label || ("شخصية مضافة " + (i + 1)),
          scale: ac.scale || 1,
          hidden: false
        });
      }

      var targets = adapter.getStageTargets();
      var curTarget = targets[0];
      for (var t = 0; t < targets.length; t++) {
        if (targets[t].pageUid === pageUid) curTarget = targets[t];
      }
      if (curTarget) {
        var nativeNodes = curTarget.charRoot.querySelectorAll("[data-ps-native-char]");
        for (var n = 0; n < nativeNodes.length; n++) {
          var nEl = nativeNodes[n];
          var key = nEl.getAttribute("data-ps-char-key");
          if (!key) continue;
          var ov = pageRec.nativeCharOverrides[key] || {};
          var label = nEl.getAttribute("data-actor-id") || ("عنصر مشهد أصلي #" + (n + 1));
          list.push({
            kind: "nativeChar",
            id: key,
            el: nEl,
            name: toWesternDigits(label),
            scale: ov.scale || 1,
            hidden: Boolean(ov.hidden)
          });
        }
      }
      return list;
    }

    function buildCharGridHtml(libInfo) {
      var q = charSearchQuery.trim().toLowerCase();
      var filtered = libInfo.characters.filter(function (c) {
        if (activeCharTab !== "all" && c.category !== activeCharTab && c.cat !== activeCharTab) return false;
        if (!q) return true;
        var hay = [
          c.name || "", c.label || "", c.role || "", c.subtitle || "", c.desc || "",
          c.category || "", Array.isArray(c.tags) ? c.tags.join(" ") : (c.tags || "")
        ].join(" ").toLowerCase();
        return hay.indexOf(q) !== -1;
      });

      if (!filtered.length) {
        return '<p style="text-align:center;color:#6E6258;padding:20px;">لا توجد نتائج مطابقة لبحثك — جرّب كلمة أخرى أو اختر تبويب «الكل».</p>';
      }

      return '<div class="ps-char-grid">' +
        filtered.map(function (c) {
          var nm = c.name || c.label || c.id;
          var rl = c.role || c.subtitle || c.desc || "";
          var thumb = renderCharacterSvgMarkup({ charId: c.id, mood: selectedCastMood, id: "th_" + c.id });
          return '<button type="button" class="ps-char-card" data-pick-char="' + escHtml(c.id) + '" data-pick-mood="' + escHtml(selectedCastMood) + '" data-pick-label="' + escHtml(nm) + '">' +
            '<div class="ps-char-thumb">' + thumb + '</div>' +
            '<span class="ps-char-name">' + escHtml(nm) + '</span>' +
            (rl ? '<span class="ps-char-role">' + escHtml(rl) + '</span>' : '') +
          '</button>';
        }).join("") +
      '</div>';
    }

    function renderCharsModal() {
      activeModal = "chars";
      var libInfo = getCharacterLibrary();
      var totalCount = libInfo.characters.length;

      var tabsHtml = '<button type="button" class="ps-tab-btn' + (activeCharTab === "all" ? " is-active" : "") + '" data-char-tab="all">الكل (' + totalCount + ')</button>' +
        libInfo.categories.map(function (cat) {
          var act = activeCharTab === cat.id ? " is-active" : "";
          return '<button type="button" class="ps-tab-btn' + act + '" data-char-tab="' + escHtml(cat.id) + '">' + (cat.icon ? escHtml(cat.icon) + ' ' : '') + escHtml(cat.label) + '</button>';
        }).join("") +
        '<button type="button" class="ps-tab-btn' + (activeCharTab === "onpage" ? " is-active" : "") + '" data-char-tab="onpage">شخصيات الصفحة</button>' +
        '<button type="button" class="ps-tab-btn' + (activeCharTab === "upload" ? " is-active" : "") + '" data-char-tab="upload">رفع صورة / SVG 📁</button>';

      var bodyHtml = "";
      if (activeCharTab === "upload") {

    function bindInspectorLiveInputs() {
      var model = getSelectedModel();
      if (!model) return;
      var reg = getAssetsRegistry();
      var undoPushed = false;
      function onceUndo() {
        if (!undoPushed) { pushUndoSnapshot(); undoPushed = true; }
      }

      var bindRangeOrColor = function (id, handler) {
        var el = document.getElementById(id);
        if (!el) return;
        el.addEventListener("input", function (ev) {
          onceUndo();
          handler(ev.target.value);
          applyAllStageOverrides();
          renderContextBar();
          scheduleAutoSave();
        });
      };

      var fontSel = document.getElementById("ps-insp-font");
      if (fontSel) {
        fontSel.addEventListener("change", function (ev) {
          onceUndo();
          var fId = ev.target.value;
          var chosen = null;
          for (var i = 0; i < reg.fonts.length; i++) {
            if (reg.fonts[i].id === fId) { chosen = reg.fonts[i]; break; }
          }
          if (chosen && chosen.family) {
            registerUsedGoogleFont(chosen);
            model.fontFamily = chosen.family;
          } else {
            model.fontFamily = "";
          }
          applyAllStageOverrides();
          scheduleAutoSave();
        });
      }

      bindRangeOrColor("ps-insp-fs", function (v) {
        model.fontSize = parseInt(v, 10) + "px";
        var lbl = document.getElementById("ps-insp-fs-lbl");
        if (lbl) lbl.textContent = v + "px";
      });
      bindRangeOrColor("ps-insp-fg", function (v) { model.color = v; });
      bindRangeOrColor("ps-insp-bg", function (v) { model.bgColor = v; });
      bindRangeOrColor("ps-insp-rad", function (v) { model.bgRadius = parseInt(v, 10); });
      bindRangeOrColor("ps-insp-pad", function (v) { model.bgPad = parseInt(v, 10); });
      bindRangeOrColor("ps-insp-bw", function (v) { model.borderWidth = parseInt(v, 10); });
      bindRangeOrColor("ps-insp-bd", function (v) { model.borderColor = v; });
      bindRangeOrColor("ps-insp-rot", function (v) { model.rotate = parseInt(v, 10); });
      bindRangeOrColor("ps-insp-op", function (v) { model.opacity = parseInt(v, 10); });

      var shdSel = document.getElementById("ps-insp-shd");
      if (shdSel) shdSel.addEventListener("change", function (ev) { onceUndo(); model.shadow = ev.target.value; applyAllStageOverrides(); scheduleAutoSave(); });

      /* Frame specific */
      var ftpl = document.getElementById("ps-insp-ftpl");
      if (ftpl) {
        ftpl.addEventListener("change", function (ev) {
          onceUndo();
          var tid = ev.target.value;
          model.templateId = tid;
          model.style = tid;
          for (var i = 0; i < reg.frames.length; i++) {
            if (reg.frames[i].id === tid) {
              var t = reg.frames[i];
              model.bg = t.defaultBg || t.bg || model.bg;
              model.fg = t.defaultFg || t.fg || model.fg;
              model.borderColor = t.defaultBorder || t.borderColor || model.borderColor;
              model.borderStyle = t.defaultBorderStyle || t.borderStyle || "solid";
              model.radius = typeof t.defaultRadius === "number" ? t.defaultRadius : 16;
              model.tail = t.hasTail ? "bottom-right" : "none";
              break;
            }
          }
          applyAllStageOverrides();
          scheduleAutoSave();
          openInspectorModal();
        });
      }
      var ftail = document.getElementById("ps-insp-ftail");
      if (ftail) ftail.addEventListener("change", function (ev) { onceUndo(); model.tail = ev.target.value; applyAllStageOverrides(); scheduleAutoSave(); });
      bindRangeOrColor("ps-insp-fbg", function (v) { model.bg = v; });
      bindRangeOrColor("ps-insp-ffg", function (v) { model.fg = v; });
      bindRangeOrColor("ps-insp-fbd", function (v) { model.borderColor = v; });
      var fbs = document.getElementById("ps-insp-fbs");
      if (fbs) fbs.addEventListener("change", function (ev) { onceUndo(); model.borderStyle = ev.target.value; applyAllStageOverrides(); scheduleAutoSave(); });
      bindRangeOrColor("ps-insp-fbw", function (v) { model.borderWidth = parseFloat(v); });
      bindRangeOrColor("ps-insp-frad", function (v) { model.radius = parseInt(v, 10); });
      bindRangeOrColor("ps-insp-ffs", function (v) { model.fontSize = parseInt(v, 10); });
      var fshd = document.getElementById("ps-insp-fshd");
      if (fshd) fshd.addEventListener("change", function (ev) { onceUndo(); model.shadow = ev.target.value; applyAllStageOverrides(); scheduleAutoSave(); });

      /* Char specific */
      bindRangeOrColor("ps-insp-cprim", function (v) { model.primaryColor = v; });
      bindRangeOrColor("ps-insp-csec", function (v) { model.secondaryColor = v; });
      bindRangeOrColor("ps-insp-cskin", function (v) { model.skinColor = v; });
      bindRangeOrColor("ps-insp-cscale", function (v) { model.scale = (parseInt(v, 10) || 100) / 100; });
      bindRangeOrColor("ps-insp-cbr", function (v) { model.brightness = parseInt(v, 10); });
      bindRangeOrColor("ps-insp-chr", function (v) { model.hueRotate = parseInt(v, 10); });
      var cflt = document.getElementById("ps-insp-cflt");
      if (cflt) cflt.addEventListener("change", function (ev) { onceUndo(); model.filterPreset = ev.target.value; applyAllStageOverrides(); scheduleAutoSave(); });

      /* Shape specific */
      bindRangeOrColor("ps-insp-sfill", function (v) { model.fill = v; });
      bindRangeOrColor("ps-insp-sstroke", function (v) { model.stroke = v; });
      bindRangeOrColor("ps-insp-ssw", function (v) { model.strokeWidth = parseFloat(v); });
      var sshd = document.getElementById("ps-insp-sshd");
      if (sshd) sshd.addEventListener("change", function (ev) { onceUndo(); model.shadow = ev.target.value; applyAllStageOverrides(); scheduleAutoSave(); });
    }

    /* 14.4 Motion & Effects Studio Modal (14 Entrances + 16 Loops + 6 Interactions) */

        });

          pushUndoSnapshot();
          optimizeUploadedImageFile(file, function (dataUrl) {
            bg.customImage = dataUrl;
            bg.customColor = "";
            bg.presetId = "";
            applyAllStageOverrides();
            scheduleAutoSave();
            openThemeModal();
          });
        });
      }
      var gFontSel = document.getElementById("ps-global-font-sel");
      if (gFontSel) {
        gFontSel.addEventListener("change", function (ev) {
          pushUndoSnapshot();
          var fid = ev.target.value;
          var chosen = null;
          for (var i = 0; i < reg.fonts.length; i++) {
            if (reg.fonts[i].id === fid) { chosen = reg.fonts[i]; break; }
          }
          if (chosen && chosen.family) {
            registerUsedGoogleFont(chosen);
            studioState.globalTheme.fontFamily = chosen.family;
            studioState.globalTheme.googleFont = chosen.googleFamily || chosen.id;
          } else {
            studioState.globalTheme.fontFamily = "";
            studioState.globalTheme.googleFont = "";
          }
          applyGlobalThemeOverrides();
          scheduleAutoSave();
        });
      }
      var gScale = document.getElementById("ps-global-fscale");
      if (gScale) {
        gScale.addEventListener("input", function (ev) {
          var v = parseInt(ev.target.value, 10) || 100;
          studioState.globalTheme.fontScalePct = v;
          var lbl = document.getElementById("ps-global-fscale-lbl");
          if (lbl) lbl.textContent = v + "%";
          applyGlobalThemeOverrides();
          scheduleAutoSave();
        });
      }
    }

    /* 14.6 Layers Manager Modal */
    function collectCurrentSlideLayers() {
      var pageUid = adapter.getCurrentPageUid();
      var pageRec = ensurePageRecord(pageUid);
      var rows = [];

      pageRec.frames.forEach(function (f, idx) {
        rows.push({
          kind: "frame",
          id: f.id,
          typeBadge: "إطار",
          label: (f.text || "إطار كلام " + (idx + 1)).slice(0, 46),
          hidden: false,
          locked: Boolean(f.locked),
          canZ: true,
          z: f.z || 46
        });
      });

      pageRec.shapes.forEach(function (s, idx) {
        rows.push({
          kind: "shape",
          id: s.id,
          typeBadge: "شكل",
          label: s.label || ("شكل متجه " + (idx + 1)),
          hidden: false,
          locked: Boolean(s.locked),
          canZ: true,
          z: s.z || 47
        });
      });

      pageRec.addedChars.forEach(function (c, idx) {
        rows.push({
          kind: "addedChar",
          id: c.id,
          typeBadge: "شخصية+",
          label: c.label || ("شخصية مضافة " + (idx + 1)),
          hidden: false,
          locked: Boolean(c.locked),
          canZ: true,
          z: c.z || 48
        });
      });

      var nativeCharEls = document.querySelectorAll('[data-ps-native-char][data-ps-page-uid="' + pageUid + '"]');
      for (var n = 0; n < nativeCharEls.length; n++) {
        var nEl = nativeCharEls[n];
        var nk = nEl.getAttribute("data-ps-char-key");
        var nov = pageRec.nativeCharOverrides[nk] || {};
        rows.push({
          kind: "nativeChar",
          id: nk,
          typeBadge: "عنصر أصلي",
          label: toWesternDigits(nEl.getAttribute("data-actor-id") || ("شخصية/مجموعة رسم #" + (n + 1))),
          hidden: Boolean(nov.hidden),
          locked: Boolean(nov.locked),
          canZ: false,
          z: 20
        });
      }

      var tOvs = pageRec.textOverrides || {};
      Object.keys(tOvs).forEach(function (tk) {
        var tov = tOvs[tk];
        if (!tov) return;
        var isSvg = tk.indexOf("svg_txt_") === 0;
        var domEl = document.querySelector('[data-ps-page-uid="' + pageUid + '"][data-ps-text-key="' + CSS.escape(tk) + '"]');
        var snippet = tov.text || (domEl ? (domEl.textContent || "").trim() : tk);
        rows.push({
          kind: isSvg ? "svgText" : "text",
          id: tk,
          typeBadge: isSvg ? "نص رسم" : "نص معدّل",
          label: toWesternDigits(snippet).slice(0, 48),
          hidden: Boolean(tov.hidden),
          locked: Boolean(tov.locked),
          canZ: false,
          z: 10
        });
      });

      rows.sort(function (a, b) { return (b.z || 0) - (a.z || 0); });
      return rows;
    }

            '<button type="button" class="ps-close-btn" data-ps-close-modal="1">✕</button>' +
          '</div>' +
          '<div class="ps-sheet-body">' +
            '<div class="ps-pages-top-actions">' +
              '<button type="button" class="ps-action-pill" data-page-add-tpl="content">+ صفحة محتوى ورسم</button>' +
              '<button type="button" class="ps-action-pill is-secondary" data-page-add-tpl="compare">+ صفحة مقارنة</button>' +
              '<button type="button" class="ps-action-pill is-secondary" data-page-add-tpl="quote">+ صفحة اقتباس</button>' +
              '<button type="button" class="ps-action-pill is-secondary" data-page-dup="' + curIdx + '">نسخ الصفحة الحالية</button>' +
            '</div>' +
            '<div class="ps-pages-list" id="ps-pages-sortable">' + rowsHtml + '</div>' +
          '</div>' +
        '</div>';
      ui.modalHost.hidden = false;

      var listEl = document.getElementById("ps-pages-sortable");
      var dragSrcIdx = null;
      if (listEl) {
        listEl.addEventListener("dragstart", function (e) {
          var row = e.target.closest("[data-page-row-idx]");
          if (!row) return;
          dragSrcIdx = parseInt(row.getAttribute("data-page-row-idx"), 10);
          row.classList.add("is-dragging");
          if (e.dataTransfer) e.dataTransfer.effectAllowed = "move";
        });
        listEl.addEventListener("dragend", function (e) {
          var row = e.target.closest("[data-page-row-idx]");
          if (row) row.classList.remove("is-dragging");
        });
        listEl.addEventListener("dragover", function (e) { e.preventDefault(); });
        listEl.addEventListener("drop", function (e) {
          e.preventDefault();
          var targetRow = e.target.closest("[data-page-row-idx]");
          if (!targetRow || dragSrcIdx === null) return;
          var dropIdx = parseInt(targetRow.getAttribute("data-page-row-idx"), 10);
          if (!isNaN(dropIdx) && dropIdx !== dragSrcIdx) {
            movePageInOrder(dragSrcIdx, dropIdx);
          }
          dragSrcIdx = null;
        });

        var ptrSortIdx = null;
        var ptrHoverIdx = null;
        listEl.addEventListener("pointerdown", function (e) {
          if (e.pointerType === "mouse") return;
          var grip = e.target.closest(".ps-drag-grip");
          var row = grip ? grip.closest("[data-page-row-idx]") : null;
          if (!row) return;
          e.preventDefault();
          ptrSortIdx = parseInt(row.getAttribute("data-page-row-idx"), 10);
          ptrHoverIdx = ptrSortIdx;
          row.classList.add("is-dragging");
          if (grip.setPointerCapture) {
            try { grip.setPointerCapture(e.pointerId); } catch (err) {}
          }
        });
        listEl.addEventListener("pointermove", function (e) {
          if (ptrSortIdx === null) return;
          e.preventDefault();
          var hit = document.elementFromPoint(e.clientX, e.clientY);
          var overRow = hit && hit.closest ? hit.closest("[data-page-row-idx]") : null;
          var rows = listEl.querySelectorAll("[data-page-row-idx]");
          for (var r = 0; r < rows.length; r++) rows[r].classList.remove("is-drop-target");
          if (overRow) {
            var overIdx = parseInt(overRow.getAttribute("data-page-row-idx"), 10);
            if (!isNaN(overIdx)) {
              ptrHoverIdx = overIdx;
              if (overIdx !== ptrSortIdx) overRow.classList.add("is-drop-target");
            }
          }
        });
        var finishPtrSort = function () {
          if (ptrSortIdx === null) return;
          var from = ptrSortIdx;
          var to = ptrHoverIdx;
          ptrSortIdx = null;
          ptrHoverIdx = null;
          var rows = listEl.querySelectorAll("[data-page-row-idx]");
          for (var r = 0; r < rows.length; r++) rows[r].classList.remove("is-dragging", "is-drop-target");
          if (typeof to === "number" && to !== from) movePageInOrder(from, to);
        };
        listEl.addEventListener("pointerup", finishPtrSort);
        listEl.addEventListener("pointercancel", finishPtrSort);
      }
    }
