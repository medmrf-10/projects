  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23050811'/%3E%3Cpolygon points='32,10 52,32 32,54 12,32' fill='none' stroke='%23f59e0b' stroke-width='3'/%3E%3Ccircle cx='32' cy='32' r='7' fill='%2310b981'/%3E%3C/svg%3E" />

  <style>
/* ==========================================================================
   BULLYING-MOTION.HTML — EDITION III: ARCHITECTURAL MOTION-GRAPHICS DOCUMENTARY
   Art Direction: Chiaroscuro Graphic-Novel Anatomy + 60fps Dual-Canvas Physics
   + Spring-Driven Camera & Gyroscope + Trim-Path Vector Splines + Kinetic Type
   Zero Emojis • Strictly Western Numerals (0-9) • Continuous Intra-Scene Morphs
   ========================================================================== */

:root {
  color-scheme: dark;
  --font-sans: 'IBM Plex Sans Arabic', system-ui, -apple-system, sans-serif;
  --font-display: 'Readex Pro', 'IBM Plex Sans Arabic', system-ui, sans-serif;
  --font-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;

  /* Smoked Obsidian Cinema Surfaces */
  --bg-void: #03050a;
  --bg-deep: #060a14;
  --glass-surface: rgba(8, 13, 25, 0.72);
  --glass-strong: rgba(6, 10, 20, 0.88);
  --glass-elevated: rgba(15, 23, 42, 0.78);
  --border-hairline: rgba(255, 255, 255, 0.09);
  --border-specular: rgba(255, 255, 255, 0.18);
  --text-primary: #f8fafc;
  --text-secondary: #cbd5e1;
  --text-muted: #7c8ba1;

  /* Dynamic Scene Lighting Variables (Updated per Mood) */
  --accent: #38bdf8;
  --accent-alt: #f59e0b;
  --glow-soft: rgba(56, 189, 248, 0.18);
  --glow-strong: rgba(56, 189, 248, 0.42);
  --actor-core-1: #0b1120;
  --actor-core-2: #152036;
  --stage-ink: #f8fafc;
  --stage-sub: #94a3b8;
  --stage-line: rgba(148, 163, 184, 0.24);
  --stage-panel: rgba(10, 16, 30, 0.72);
  --vignette: rgba(2, 4, 10, 0.78);

  /* Precision Motion Curves */
  --ease-out-expo: cubic-bezier(0.16, 1, 0.3, 1);
  --ease-cinema: cubic-bezier(0.22, 1, 0.36, 1);
  --ease-spring: cubic-bezier(0.34, 1.42, 0.64, 1);
}

html[data-theme="light"],
#motion-app[data-theme="light"] {
  color-scheme: light;
  --bg-void: #eae6de;
  --bg-deep: #e2ddd2;
  --glass-surface: rgba(252, 250, 246, 0.80);
  --glass-strong: rgba(255, 254, 251, 0.94);
  --glass-elevated: rgba(244, 240, 232, 0.92);
  --border-hairline: rgba(15, 23, 42, 0.11);
  --border-specular: rgba(255, 255, 255, 0.92);
  --text-primary: #090e1a;
  --text-secondary: #283548;
  --text-muted: #5b6b82;
  --actor-core-1: #162033;
  --actor-core-2: #27364f;
  --stage-ink: #0f172a;
  --stage-sub: #475569;
  --stage-line: rgba(15, 23, 42, 0.16);
  --stage-panel: rgba(255, 255, 255, 0.78);
  --vignette: rgba(24, 32, 48, 0.18);
}

/* 14 Dramatic Color-Grading Moods */
[data-mood="morning"]     { --accent: #38bdf8; --accent-alt: #f59e0b; --glow-soft: rgba(245, 158, 11, 0.16); --glow-strong: rgba(56, 189, 248, 0.42); }
[data-mood="shadow"]      { --accent: #f43f5e; --accent-alt: #64748b; --glow-soft: rgba(244, 63, 94, 0.18);  --glow-strong: rgba(244, 63, 94, 0.46); }
[data-mood="tiger"]       { --accent: #f59e0b; --accent-alt: #ef4444; --glow-soft: rgba(245, 158, 11, 0.22); --glow-strong: rgba(245, 158, 11, 0.48); }
[data-mood="scale"]       { --accent: #fb923c; --accent-alt: #38bdf8; --glow-soft: rgba(251, 146, 60, 0.18); --glow-strong: rgba(251, 146, 60, 0.44); }
[data-mood="arena"]       { --accent: #f97316; --accent-alt: #10b981; --glow-soft: rgba(249, 115, 22, 0.18); --glow-strong: rgba(249, 115, 22, 0.44); }
[data-mood="mind"]        { --accent: #a855f7; --accent-alt: #22d3ee; --glow-soft: rgba(168, 85, 247, 0.20); --glow-strong: rgba(168, 85, 247, 0.46); }
[data-mood="cyber"]       { --accent: #06b6d4; --accent-alt: #ec4899; --glow-soft: rgba(6, 182, 212, 0.20);  --glow-strong: rgba(6, 182, 212, 0.48); }
[data-mood="home"]        { --accent: #f59e0b; --accent-alt: #f43f5e; --glow-soft: rgba(245, 158, 11, 0.18); --glow-strong: rgba(245, 158, 11, 0.42); }
[data-mood="campus"]      { --accent: #38bdf8; --accent-alt: #818cf8; --glow-soft: rgba(56, 189, 248, 0.18); --glow-strong: rgba(56, 189, 248, 0.42); }
[data-mood="corporate"]   { --accent: #818cf8; --accent-alt: #f43f5e; --glow-soft: rgba(129, 140, 248, 0.18); --glow-strong: rgba(129, 140, 248, 0.44); }
[data-mood="observatory"] { --accent: #2dd4bf; --accent-alt: #f59e0b; --glow-soft: rgba(45, 212, 191, 0.18); --glow-strong: rgba(45, 212, 191, 0.44); }
[data-mood="storm"]       { --accent: #fb7185; --accent-alt: #8b5cf6; --glow-soft: rgba(244, 63, 94, 0.20);  --glow-strong: rgba(244, 63, 94, 0.46); }
[data-mood="emerald"]     { --accent: #10b981; --accent-alt: #38bdf8; --glow-soft: rgba(16, 185, 129, 0.20); --glow-strong: rgba(16, 185, 129, 0.46); }
[data-mood="sunrise"]     { --accent: #fbbf24; --accent-alt: #10b981; --glow-soft: rgba(251, 191, 36, 0.24); --glow-strong: rgba(251, 191, 36, 0.50); }

html[data-theme="light"] [data-mood="morning"],
#motion-app[data-theme="light"][data-mood="morning"] { --accent: #0284c7; --accent-alt: #d97706; }
html[data-theme="light"] [data-mood="emerald"],
#motion-app[data-theme="light"][data-mood="emerald"] { --accent: #059669; --accent-alt: #0284c7; }
html[data-theme="light"] [data-mood="sunrise"],
#motion-app[data-theme="light"][data-mood="sunrise"] { --accent: #d97706; --accent-alt: #059669; }
html[data-theme="light"] [data-mood="cyber"],
#motion-app[data-theme="light"][data-mood="cyber"]   { --accent: #0891b2; --accent-alt: #db2777; }

*, *::before, *::after {
  box-sizing: border-box;
}

[hidden] {
  display: none !important;
}

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  overscroll-behavior: none;
  direction: rtl;
  font-family: var(--font-sans);
  background: var(--bg-void);
  color: var(--text-primary);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  letter-spacing: 0;
  font-variant-numeric: lining-nums tabular-nums;
  font-feature-settings: "lnum" 1, "tnum" 1;
}

button, input {
  font-family: inherit;
  letter-spacing: 0;
  font-variant-numeric: lining-nums tabular-nums;
}

/* ==========================================================================
   1. FULL-BLEED 100VW x 100DVH ARCHITECTURAL STAGE SHELL
   ========================================================================== */
#motion-app {
  position: relative;
  width: 100vw;
  height: 100vh;
  height: 100dvh;
  overflow: hidden;
  background:
    radial-gradient(ellipse 80% 56% at 50% 34%, var(--glow-soft), transparent 72%),
    var(--bg-void);
  transition: background-color 0.6s ease;
  user-select: none;
  isolation: isolate;
}

/* Layer 1: 60fps Volumetric Atmosphere & 3D Perspective Grid Canvas */
#bg-fx-canvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: 2;
  pointer-events: none;
}

/* Layer 2: Spring-Physics 2.5D Camera World */
#stage-touch-surface {
  position: absolute;
  inset: 0;
  z-index: 10;
  overflow: hidden;
  cursor: pointer;
}

#camera-world {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  transform-origin: 50% 78%;
  will-change: transform;
  pointer-events: none;
}

/* Layer 2A: Precision Self-Drawing SVG Architectural & Data-Sculpture Stage */
#svg-stage-host {
  position: absolute;
  inset: -4%;
  width: 108%;
  height: 108%;
  z-index: 12;
  pointer-events: none;
}

#svg-stage-host svg.stage-svg {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
  opacity: 1;
  transform: scale(1) translateZ(0);
  filter: blur(0px);
  transition:
    opacity 580ms var(--ease-out-expo),
    transform 760ms var(--ease-out-expo),
    filter 560ms var(--ease-out-expo);
}

#svg-stage-host svg.stage-svg.is-entering {
  opacity: 0;
  transform: scale(1.055) translateZ(0);
  filter: blur(8px);
}

#svg-stage-host svg.stage-svg.is-exiting {
  opacity: 0;
  transform: scale(0.955) translateZ(0);
  filter: blur(6px);
}

/* Trim-Path Vector Self-Drawing Splines */
.stage-svg .mg-spline,
.stage-svg [data-draw="1"] {
  stroke-dasharray: 1;
  stroke-dashoffset: 1;
  transition: stroke-dashoffset 980ms var(--ease-out-expo), opacity 520ms ease;
}

.stage-svg .set-layer {
  opacity: 0;
  transform: translateY(14px) scale(0.962);
  filter: blur(5px);
  transform-box: fill-box;
  transform-origin: center;
  transition:
    opacity 540ms var(--ease-out-expo),
    transform 720ms var(--ease-out-expo),
    filter 540ms var(--ease-out-expo);
  pointer-events: none;
}

.stage-svg .set-layer.is-active {
  opacity: 1;
  transform: translateY(0) scale(1);
  filter: blur(0px);
}

.stage-svg .set-layer.is-active [data-draw="1"] {
  stroke-dashoffset: 0;
}

.stage-svg .pulse-soft {
  animation: mgPulseSoft 3.8s ease-in-out infinite;
}

@keyframes mgPulseSoft {
  0%, 100% { opacity: 0.58; }
  50% { opacity: 1; }
}

/* Continuous Orbital & Pulse Keyframes for Stage Geometry */
.orbit-slow {
  transform-box: fill-box;
  transform-origin: center;
  animation: mgSpinSlow 36s linear infinite;
}

.orbit-reverse {
  transform-box: fill-box;
  transform-origin: center;
  animation: mgSpinRev 28s linear infinite;
}

@keyframes mgSpinSlow {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}

@keyframes mgSpinRev {
  from { transform: rotate(360deg); }
  to { transform: rotate(0deg); }
}

/* Layer 2B: Persistent Chiaroscuro Graphic-Novel Silhouettes */
#actors-stage-layer {
  position: absolute;
  inset: 0;
  z-index: 18;
  pointer-events: none;
}

/* Layer 3: 60fps Foreground Motion-Graphics Canvas (Synaptic Beams, Shockwaves, Reticles) */
#mg-fg-canvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: 24;
  pointer-events: none;
}

/* Layer 4: Anamorphic Vignette & Fine Film Grain */
.cinema-atmosphere-veil {
  position: absolute;
  inset: 0;
  z-index: 26;
  pointer-events: none;
  background:
    linear-gradient(180deg, rgba(3, 5, 10, 0.52) 0%, transparent 16%, transparent 78%, rgba(3, 5, 10, 0.72) 100%),
    radial-gradient(ellipse 90% 82% at 50% 48%, transparent 56%, var(--vignette) 100%);
}

html[data-theme="light"] .cinema-atmosphere-veil {
  background:
    linear-gradient(180deg, rgba(234, 230, 222, 0.55) 0%, transparent 14%, transparent 80%, rgba(226, 221, 210, 0.72) 100%),
    radial-gradient(ellipse 92% 84% at 50% 48%, transparent 62%, var(--vignette) 100%);
}

.film-grain-overlay {
  position: absolute;
  inset: 0;
  z-index: 27;
  pointer-events: none;
  opacity: 0.032;
  mix-blend-mode: overlay;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
}

/* One-Way Directional Anamorphic Light-Blade Wipe & Center Act Plate */
#act-wipe-shutter {
  position: absolute;
  inset: -10% -25%;
  z-index: 52;
  pointer-events: none;
  background: linear-gradient(
    108deg,
    transparent 34%,
    var(--glow-soft) 45%,
    var(--glow-strong) 49.5%,
    rgba(255, 255, 255, 0.30) 50%,
    rgba(5, 9, 18, 0.85) 53%,
    transparent 66%
  );
  opacity: 0;
  transform: translateX(110%) skewX(-14deg);
}

#act-wipe-shutter.is-sweeping-fwd {
  animation: actBladeFwd 660ms var(--ease-out-expo) forwards;
}

#act-wipe-shutter.is-sweeping-rev {
  animation: actBladeRev 660ms var(--ease-out-expo) forwards;
}

@keyframes actBladeFwd {
  0%   { opacity: 0; transform: translateX(95%) skewX(-14deg); }
  22%  { opacity: 1; }
  78%  { opacity: 0.92; }
  100% { opacity: 0; transform: translateX(-95%) skewX(-14deg); }
}

@keyframes actBladeRev {
  0%   { opacity: 0; transform: translateX(-95%) skewX(-14deg); }
  22%  { opacity: 1; }
  78%  { opacity: 0.92; }
  100% { opacity: 0; transform: translateX(95%) skewX(-14deg); }
}

#act-super-banner {
  position: absolute;
  top: 66px;
  left: 50%;
  transform: translate(-50%, -8px) scale(0.96);
  z-index: 53;
  pointer-events: none;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  padding: 9px 26px;
  border-radius: 14px;
  background: rgba(4, 8, 18, 0.90);
  border: 1px solid var(--border-hairline);
  border-top: 2px solid var(--accent);
  backdrop-filter: none;
  -webkit-backdrop-filter: none;
  box-shadow: 0 20px 52px rgba(0, 0, 0, 0.56), 0 0 34px var(--glow-soft);
  opacity: 0;
  visibility: hidden;
  transition: opacity 260ms var(--ease-out-expo), transform 380ms var(--ease-out-expo), visibility 260ms;
}

html[data-theme="light"] #act-super-banner {
  background: rgba(252, 250, 246, 0.95);
  box-shadow: 0 20px 48px rgba(15, 23, 42, 0.16);
}

#act-super-banner.is-visible {
  opacity: 1;
  visibility: visible;
  transform: translate(-50%, 0) scale(1);
  backdrop-filter: blur(22px);
  -webkit-backdrop-filter: blur(22px);
}

.act-super-code {
  font-family: var(--font-mono);
  font-size: 0.75rem;
  font-weight: 700;
  letter-spacing: 0.14em;
  color: var(--accent);
  direction: ltr;
  unicode-bidi: isolate;
}

.act-super-title {
  font-family: var(--font-display);
  font-size: clamp(1.15rem, 2.2vw, 1.65rem);
  font-weight: 700;
  color: var(--text-primary);
  white-space: nowrap;
}

/* ==========================================================================
   2. CHIAROSCURO GRAPHIC-NOVEL CHARACTER RIGS (.motion-actor)
      7.5-Head Proportions • Dynamic Rim-Lighting • Editorial Leader Callouts
   ========================================================================== */
.motion-actor {
  --hud-scale: 1;
  --actor-rim: var(--accent);
  position: absolute;
  left: var(--ax, 50%);
  bottom: max(var(--ay, 18.5%), 154px);
  width: clamp(64px, min(12.8vw, 24.5dvh), 172px);
  aspect-ratio: 240 / 520;
  transform-origin: 50% 95%;
  transform: translate3d(-50%, 0, 0) scale(calc(var(--ascale, 1) * var(--hud-scale, 1)));
  opacity: 0;
  visibility: hidden;
  transition:
    left 780ms var(--ease-out-expo),
    bottom 780ms var(--ease-out-expo),
    transform 720ms var(--ease-out-expo),
    opacity 420ms ease,
    filter 480ms ease,
    visibility 0s linear 420ms;
  will-change: left, bottom, transform, opacity;
}

#motion-app[data-has-telemetry="true"] .motion-actor {
  --hud-scale: 0.92;
}

.motion-actor[data-present="true"] {
  opacity: 1;
  visibility: visible;
  transition:
    left 780ms var(--ease-out-expo),
    bottom 780ms var(--ease-out-expo),
    transform 720ms var(--ease-out-expo),
    opacity 420ms ease,
    filter 480ms ease,
    visibility 0s linear 0s;
}

/* Multi-Plane Depth-of-Field */
.motion-actor[data-depth="back"] {
  z-index: 14;
  filter: brightness(0.72) saturate(0.78) blur(0.6px);
}

.motion-actor[data-depth="mid"] {
  z-index: 16;
  filter: brightness(0.88) saturate(0.92);
}

.motion-actor[data-depth="fore"] {
  z-index: 20;
  filter: drop-shadow(0 18px 28px rgba(0, 0, 0, 0.45));
}

.actor-stride-shell {
  width: 100%;
  height: 100%;
}

.actor-mirror-shell {
  width: 100%;
  height: 100%;
  transform: scaleX(var(--aflip, 1));
  transition: transform 520ms var(--ease-out-expo);
}

.actor-figure-svg {
  width: 100%;
  height: 100%;
  overflow: visible;
  display: block;
}

/* Natural Stride Cycle on Lateral Movement */
.motion-actor.is-walking .actor-stride-shell {
  animation: mgStrideBob 400ms ease-in-out 2;
}
.motion-actor.is-walking .rig-leg-l {
  animation: mgLegSwingL 400ms ease-in-out 2;
}
.motion-actor.is-walking .rig-leg-r {
  animation: mgLegSwingR 400ms ease-in-out 2;
}

@keyframes mgStrideBob {
  0%, 100% { transform: translateY(0); }
  25%, 75% { transform: translateY(-6px); }
  50% { transform: translateY(-1px); }
}
@keyframes mgLegSwingL {
  0%, 100% { transform: rotate(0deg); }
  25% { transform: rotate(11deg) translateY(-3px); }
  75% { transform: rotate(-9deg); }
}
@keyframes mgLegSwingR {
  0%, 100% { transform: rotate(0deg); }
  25% { transform: rotate(-9deg); }
  75% { transform: rotate(11deg) translateY(-3px); }
}

.actor-figure-svg .rig-leg-l,
.actor-figure-svg .rig-leg-r {
  transform-box: view-box;
  transition: transform 340ms var(--ease-out-expo);
}

.actor-figure-svg .rig-breathe {
  transform-box: fill-box;
  transform-origin: 50% 100%;
  animation: mgActorBreathe 4.6s ease-in-out infinite;
}

@keyframes mgActorBreathe {
  0%, 100% { transform: translateY(0) scaleY(1); }
  50% { transform: translateY(-2.4px) scaleY(1.008); }
}

.actor-figure-svg .rig-upper {
  transform-box: view-box;
  transform-origin: 120px 312px;
  transform: rotate(var(--torso-lean, 0deg)) translateY(var(--torso-sink, 0px));
  transition: transform 640ms var(--ease-out-expo);
}

.actor-figure-svg .rig-head {
  transform-box: view-box;
  transform-origin: 120px 146px;
  transform: rotate(var(--head-tilt, 0deg)) translateY(var(--head-drop, 0px));
  transition: transform 560ms var(--ease-out-expo);
}

/* Anatomical Posture Choreography */
.motion-actor[data-posture="neutral"]   { --torso-lean: 0deg;    --torso-sink: 0px;  --head-tilt: 0deg;   --head-drop: 0px; }
.motion-actor[data-posture="confident"] { --torso-lean: -2.2deg; --torso-sink: -3px; --head-tilt: -2.5deg;--head-drop: -2px; }
.motion-actor[data-posture="crossed"]   { --torso-lean: -3.5deg; --torso-sink: -1px; --head-tilt: -3.5deg;--head-drop: -1px; }
.motion-actor[data-posture="looming"]   { --torso-lean: 7.5deg;  --torso-sink: 2px;  --head-tilt: 5deg;   --head-drop: 3px; }
.motion-actor[data-posture="cowering"]  { --torso-lean: -6.5deg; --torso-sink: 10px; --head-tilt: 11deg;  --head-drop: 8px; }
.motion-actor[data-posture="slumped"]   { --torso-lean: 4.5deg;  --torso-sink: 12px; --head-tilt: 14deg;  --head-drop: 10px; }
.motion-actor[data-posture="defending"] { --torso-lean: 4.5deg;  --torso-sink: -3px; --head-tilt: -2deg;  --head-drop: -1px; }
.motion-actor[data-posture="recoiling"] { --torso-lean: -9deg;   --torso-sink: 6px;  --head-tilt: -6deg;  --head-drop: 3px; }
.motion-actor[data-posture="phone"]     { --torso-lean: 4deg;    --torso-sink: 4px;  --head-tilt: 12deg;  --head-drop: 6px; }

/* Sculpted Arm Rig Switching */
.actor-figure-svg .arm-pose {
  opacity: 0;
  transform-box: fill-box;
  transform-origin: top center;
  transform: rotate(5deg) scale(0.96);
  transition: opacity 320ms ease, transform 480ms var(--ease-out-expo);
}

.motion-actor[data-arms="relaxed"]  .arm-pose[data-arm="relaxed"],
.motion-actor[data-arms="notebook"] .arm-pose[data-arm="notebook"],
.motion-actor[data-arms="crossed"]  .arm-pose[data-arm="crossed"],
.motion-actor[data-arms="pointing"] .arm-pose[data-arm="pointing"],
.motion-actor[data-arms="phone"]    .arm-pose[data-arm="phone"],
.motion-actor[data-arms="shield"]   .arm-pose[data-arm="shield"],
.motion-actor[data-arms="distress"] .arm-pose[data-arm="distress"] {
  opacity: 1;
  transform: rotate(0deg) scale(1);
}

/* Inner Psychological X-Ray Core Luminescence (Replaces Childish Cartoon FX!) */
.actor-figure-svg .psyche-core {
  opacity: 0;
  transition: opacity 420ms ease;
}

.motion-actor[data-mood="hurt"]     .psyche-core[data-core="fracture"],
.motion-actor[data-mood="broken"]   .psyche-core[data-core="fracture"],
.motion-actor[data-mood="anxious"]  .psyche-core[data-core="pulse-warn"],
.motion-actor[data-mood="stunned"]  .psyche-core[data-core="pulse-warn"],
.motion-actor[data-mood="smirk"]    .psyche-core[data-core="cold-grid"],
.motion-actor[data-mood="mocking"]  .psyche-core[data-core="cold-grid"],
.motion-actor[data-mood="furious"]  .psyche-core[data-core="volatile"],
.motion-actor[data-mood="resolute"] .psyche-core[data-core="harmonic"],
.motion-actor[data-mood="radiant"]  .psyche-core[data-core="harmonic"],
.motion-actor[data-mood="serene"]   .psyche-core[data-core="calm-glow"],
.motion-actor[data-mood="empathetic"] .psyche-core[data-core="calm-glow"] {
  opacity: 1;
}

/* Eye-Slit Gaze & Intensity Choreography */
.actor-figure-svg .eye-gaze-group {
  transform: translate(var(--look-x, 0px), var(--look-y, 0px));
  transition: transform 360ms var(--ease-out-expo);
}

/* Editorial Mouth & Brow Expression Choreography */
.actor-figure-svg .mouth-expr {
  opacity: 0;
  transition: opacity 260ms ease;
}

.motion-actor[data-mood="neutral"]    .mouth-expr[data-m="neutral"],
.motion-actor[data-mood="resolute"]   .mouth-expr[data-m="resolute"],
.motion-actor[data-mood="serene"]     .mouth-expr[data-m="serene"],
.motion-actor[data-mood="empathetic"] .mouth-expr[data-m="serene"],
.motion-actor[data-mood="radiant"]    .mouth-expr[data-m="radiant"],
.motion-actor[data-mood="anxious"]    .mouth-expr[data-m="anxious"],
.motion-actor[data-mood="hurt"]       .mouth-expr[data-m="hurt"],
.motion-actor[data-mood="broken"]     .mouth-expr[data-m="hurt"],
.motion-actor[data-mood="smirk"]      .mouth-expr[data-m="smirk"],
.motion-actor[data-mood="mocking"]    .mouth-expr[data-m="smirk"],
.motion-actor[data-mood="furious"]    .mouth-expr[data-m="furious"],
.motion-actor[data-mood="stunned"]    .mouth-expr[data-m="stunned"] {
  opacity: 1;
}

.actor-figure-svg .brow-l,
.actor-figure-svg .brow-r {
  transform-box: fill-box;
  transform-origin: center;
  transition: transform 380ms var(--ease-out-expo);
}

.motion-actor[data-mood="furious"] .brow-l { transform: translateY(2px) rotate(13deg); }
.motion-actor[data-mood="furious"] .brow-r { transform: translateY(2px) rotate(-13deg); }
.motion-actor[data-mood="smirk"]   .brow-l,
.motion-actor[data-mood="mocking"] .brow-l { transform: translateY(1.5px) rotate(8deg); }
.motion-actor[data-mood="smirk"]   .brow-r,
.motion-actor[data-mood="mocking"] .brow-r { transform: translateY(-2.5px) rotate(6deg); }
.motion-actor[data-mood="anxious"] .brow-l,
.motion-actor[data-mood="hurt"]    .brow-l,
.motion-actor[data-mood="broken"]  .brow-l { transform: translateY(-2px) rotate(-11deg); }
.motion-actor[data-mood="anxious"] .brow-r,
.motion-actor[data-mood="hurt"]    .brow-r,
.motion-actor[data-mood="broken"]  .brow-r { transform: translateY(-2px) rotate(11deg); }
.motion-actor[data-mood="stunned"] .brow-l,
.motion-actor[data-mood="stunned"] .brow-r { transform: translateY(-4px); }
.motion-actor[data-mood="resolute"] .brow-l { transform: translateY(1px) rotate(6deg); }
.motion-actor[data-mood="resolute"] .brow-r { transform: translateY(1px) rotate(-6deg); }

/* Editorial Callout Tag with Deterministic Viewport & Ceiling Clamp */
.actor-callout {
  --c-shift: -50%;
  --c-dx: 0px;
  --c-dy: 0px;
  --tone-col: var(--accent);
  position: absolute;
  bottom: calc(100% + 10px);
  left: 50%;
  transform: translate3d(calc(var(--c-shift) + var(--c-dx)), calc(10px + var(--c-dy)), 0) scale(0.95);
  padding: 6px 12px 7px;
  border-radius: 9px;
  background: var(--glass-strong);
  border: 1px solid var(--border-hairline);
  border-inline-start: 3px solid var(--tone-col);
  box-shadow: 0 14px 34px rgba(0, 0, 0, 0.48);
  color: var(--text-primary);
  font-size: 0.77rem;
  font-weight: 600;
  line-height: 1.42;
  text-align: right;
  white-space: normal;
  text-wrap: balance;
  width: max-content;
  max-width: min(224px, 44vw);
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
  z-index: 28;
  transition: opacity 320ms ease, transform 420ms var(--ease-out-expo), visibility 0s linear 320ms;
}

.actor-callout::after {
  content: "";
  position: absolute;
  top: 100%;
  left: 50%;
  width: 1.5px;
  height: 10px;
  background: linear-gradient(180deg, var(--tone-col), transparent);
}

.motion-actor[data-edge="left"] .actor-callout {
  --c-shift: -18%;
}
.motion-actor[data-edge="left"] .actor-callout::after {
  left: 24%;
}
.motion-actor[data-edge="right"] .actor-callout {
  --c-shift: -82%;
}
.motion-actor[data-edge="right"] .actor-callout::after {
  left: 76%;
}

.actor-callout[data-tier="high"] {
  bottom: calc(100% + 50px);
}
.actor-callout[data-tier="high"]::after {
  height: 48px;
}

.motion-actor[data-present="true"] .actor-callout.is-visible {
  opacity: 1;
  visibility: visible;
  transform: translate3d(calc(var(--c-shift) + var(--c-dx)), var(--c-dy), 0) scale(1);
  transition: opacity 320ms ease, transform 420ms var(--ease-out-expo), visibility 0s linear 0s;
}

/* World-Space Coherent Lighting When Character Faces Opposite Direction */
.motion-actor[data-flipped="true"] .chiaroscuro-half {
  opacity: 0.14;
}

.actor-callout[data-tone="hostile"]  { --tone-col: #f43f5e; }
.actor-callout[data-tone="defender"] { --tone-col: #10b981; }
.actor-callout[data-tone="thought"]  { --tone-col: #a855f7; font-style: normal; opacity: 0.95; }

/* Minimalist Architectural Base Tag */
.actor-plinth-tag {
  position: absolute;
  bottom: -8px;
  left: 50%;
  transform: translateX(-50%);
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 2px 9px 3px;
  border-radius: 6px;
  background: var(--glass-strong);
  border: 1px solid var(--border-hairline);
  backdrop-filter: blur(12px);
  white-space: nowrap;
  font-size: 0.75rem;
  line-height: 1.3;
}

.actor-plinth-dot {
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: var(--actor-rim);
  box-shadow: 0 0 8px var(--actor-rim);
  flex-shrink: 0;
}

.actor-plinth-name {
  font-weight: 700;
  color: var(--text-primary);
}

.actor-plinth-role {
  font-size: 0.72rem;
  color: var(--text-muted);
  font-weight: 500;
}

/* ==========================================================================
   3. FLOATING ARCHITECTURAL TOP HUD (ZERO EMOJIS • PURE VECTOR PRECISION)
   ========================================================================== */
.motion-topbar {
  position: absolute;
  top: 14px;
  left: 18px;
  right: 18px;

}

.chapter-capsule {

  gap: 10px;

  padding: 5px 14px 5px 12px;

  border-radius: 999px;

  backdrop-filter: blur(22px) saturate(170%);

.act-trigger-btn {

.act-code-badge {

#hud-scene-title {

.capsule-divider {

/* Intra-Scene Motion Progress Bars */
.intra-rail {
  display: inline-flex;
  align-items: center;
  gap: 4px;
}

.intra-seg {
  width: 12px;
  height: 4px;
  padding: 0;

.intra-seg.is-active {

.control-dock {

.ctrl-icon-btn {

.ctrl-icon-btn.is-active {

.ctrl-mono-tag {

}

/* ==========================================================================
   4. ARCHITECTURAL TELEMETRY & DATA CALLOUT HEADER (#telemetry-hud)
   ========================================================================== */
#telemetry-hud {
  position: absolute;
  top: 64px;
  left: 20px;
  right: 20px;
  z-index: 44;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  pointer-events: none;
}

.telemetry-hero-card {
  display: inline-flex;
  align-items: center;
  gap: 14px;
  padding: 8px 20px 8px 16px;
  border-radius: 14px;
  background: var(--glass-strong);
  border: 1px solid var(--border-hairline);
  box-shadow: inset 0 1px 0 var(--border-specular), 0 16px 40px rgba(0, 0, 0, 0.40);
  backdrop-filter: blur(22px);
  -webkit-backdrop-filter: blur(22px);
  opacity: 0;
  transform: translateY(-10px) scale(0.97);
  transition: opacity 400ms var(--ease-out-expo), transform 460ms var(--ease-out-expo);
}

.telemetry-hero-card.is-visible {
  opacity: 1;
  transform: translateY(0) scale(1);
}

.tele-ring-svg {
  width: 34px;
  height: 34px;
  flex-shrink: 0;
  transform: rotate(-90deg);
}

.tele-ring-track {
  fill: none;
  stroke: rgba(148, 163, 184, 0.20);
  stroke-width: 3;
}

.tele-ring-arc {
  fill: none;
  stroke: var(--accent);
  stroke-width: 3;
  stroke-linecap: round;
  stroke-dasharray: 88;
  stroke-dashoffset: 22;
  transition: stroke-dashoffset 820ms var(--ease-out-expo), stroke 400ms ease;
}

.tele-metric-val {
  font-family: var(--font-display);
  font-size: clamp(1.15rem, 2.05vw, 1.68rem);
  font-weight: 700;
  color: var(--accent);
  direction: ltr;
  unicode-bidi: isolate;
  line-height: 1.15;
}

.tele-metric-val.is-arabic {
  direction: rtl;
}

.tele-v-sep {
  width: 1px;
  height: 24px;
  background: var(--border-hairline);
}

.tele-metric-lbl {
  font-size: 0.86rem;
  font-weight: 600;
  color: var(--text-primary);
  line-height: 1.35;
}

.telemetry-chips-row {
  display: flex;
  align-items: center;
  justify-content: center;
  flex-wrap: wrap;
  gap: 8px;
  max-width: min(1080px, 94vw);
  opacity: 0;
  transform: translateY(-6px);
  transition: opacity 380ms ease, transform 440ms var(--ease-out-expo);
}

.telemetry-chips-row.is-visible {
  opacity: 1;
  transform: translateY(0);
}

.tele-chip {
  --chip-col: var(--accent);
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 5px 13px 5px 11px;
  border-radius: 8px;
  background: var(--glass-strong);
  border: 1px solid var(--border-hairline);

  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.28);
  backdrop-filter: blur(16px);
  font-size: 0.78rem;
  font-weight: 600;
  color: var(--text-secondary);
  animation: teleChipIn 460ms var(--ease-out-expo) both;
}

.tele-chip-idx {
  font-family: var(--font-mono);
  font-size: 0.72rem;
  font-weight: 700;
  color: var(--chip-col);
  direction: ltr;
  unicode-bidi: isolate;
}

.tele-chip[data-tone="crimson"] { --chip-col: #f43f5e; }
.tele-chip[data-tone="amber"]   { --chip-col: #f59e0b; }
.tele-chip[data-tone="emerald"] { --chip-col: #10b981; }
.tele-chip[data-tone="cyan"]    { --chip-col: #38bdf8; }
.tele-chip[data-tone="violet"]  { --chip-col: #a855f7; }

@keyframes teleChipIn {
  0% { opacity: 0; transform: translateY(-8px) scale(0.95); }
  100% { opacity: 1; transform: translateY(0) scale(1); }
}

/* ==========================================================================
   5. UNIFIED BOTTOM CINEMA CONSOLE (KINETIC SUBTITLE + LASER SCRUBBER)
   ========================================================================== */
.cinema-console-wrap {
  position: absolute;
  bottom: 12px;
  left: 16px;
  right: 16px;
  z-index: 55;
  display: flex;
  justify-content: center;
  pointer-events: none;
}

.cinema-console {
  position: relative;
  pointer-events: auto;
  width: min(1100px, 100%);
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding: 13px 20px 10px;
  border-radius: 20px;
  background: var(--glass-strong);
  border: 1px solid var(--border-hairline);
  box-shadow:
    inset 0 1px 0 var(--border-specular),
    0 24px 60px rgba(0, 0, 0, 0.58),
    0 0 38px rgba(0, 0, 0, 0.25);
  backdrop-filter: blur(28px) saturate(185%);
  -webkit-backdrop-filter: blur(28px) saturate(185%);

}

.cinema-console::before {
  content: "";
  position: absolute;
  top: 0;
  left: 14%;
  right: 14%;
  height: 1.5px;
  background: linear-gradient(90deg, transparent, var(--accent), var(--accent-alt), transparent);
  opacity: 0.82;
  pointer-events: none;
  transition: background 420ms ease;
}

.console-main-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  direction: ltr;
}

#motion-app[data-rtl-nav="true"] .console-main-row {

}

.nav-step-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  height: 36px;
  padding: 0 14px;
  border-radius: 999px;
  border: 1px solid var(--border-hairline);
  background: rgba(148, 163, 184, 0.08);
  color: var(--text-primary);
  font-size: 0.80rem;
  font-weight: 700;
  cursor: pointer;
  flex-shrink: 0;
  direction: ltr;
  unicode-bidi: isolate;
  transition: all 0.2s var(--ease-out-expo);
}

#motion-app[data-rtl-nav="true"] .nav-step-btn {
  flex-direction: row-reverse;
}

#motion-app[data-rtl-nav="true"] .nav-step-btn svg {
  transform: scaleX(-1);
}

.nav-step-btn svg {
  width: 14px;
  height: 14px;
  transition: transform 0.22s var(--ease-out-expo);
}

.nav-step-btn:hover:not(:disabled) {
  border-color: var(--accent);
  background: rgba(56, 189, 248, 0.14);
  transform: translateY(-1px);
}

.nav-step-btn:disabled {
  opacity: 0.30;
  cursor: not-allowed;
}

.subtitle-center-stage {
  flex: 1 1 auto;
  min-width: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  direction: rtl;
  user-select: text;
}

/* Staggered Word-by-Word Kinetic Arabic Typography */
.kinetic-sentence {
  margin: 0;
  font-size: clamp(1.02rem, 1.56vw, 1.34rem);
  font-weight: 600;
  line-height: 1.58;
  color: var(--text-primary);
  text-align: center;
}

.kw-mask {
  display: inline-block;
  overflow: hidden;
  vertical-align: bottom;
  padding-bottom: 2px;
}

.kw-inner {
  display: inline-block;
  animation: kwRise 440ms var(--ease-out-expo) both;
}

.kw-inner.is-key {
  color: var(--accent);
  font-weight: 700;
}

@keyframes kwRise {
  0% { opacity: 0; transform: translateY(105%); }
  100% { opacity: 1; transform: translateY(0); }
}

.cite-tag-btn {
  flex-shrink: 0;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 4px 10px;
  border-radius: 6px;
  border: 1px solid rgba(56, 189, 248, 0.28);
  background: rgba(56, 189, 248, 0.09);
  color: var(--accent);
  font-family: var(--font-sans);
  font-size: 0.75rem;
  font-weight: 600;
  cursor: pointer;
  white-space: nowrap;
  transition: all 0.2s ease;
}

.cite-tag-btn:hover {
  background: rgba(56, 189, 248, 0.20);
  border-color: var(--accent);
}

.cite-tag-btn svg {
  width: 12px;
  height: 12px;
}

/* Integrated Laser Scrubber Rail */
.console-scrubber-row {
  display: flex;
  align-items: center;
  gap: 12px;
  direction: ltr;
}

#motion-app[data-rtl-nav="true"] .console-scrubber-row {
  direction: rtl;
}

.laser-track {
  position: relative;
  flex: 1 1 auto;
  height: 24px;
  border-radius: 999px;
  background: transparent;
  cursor: pointer;
  display: flex;
  align-items: center;
  touch-action: none;
}

.laser-track::before {
  content: "";
  position: absolute;
  left: 0;
  right: 0;
  top: 50%;
  height: 6px;
  transform: translateY(-50%);
  border-radius: 999px;
  background: rgba(148, 163, 184, 0.20);
  pointer-events: none;
}

.laser-fill {
  position: relative;
  height: 6px;
  border-radius: 999px;
  background: linear-gradient(90deg, var(--accent), var(--accent-alt));
  box-shadow: 0 0 14px var(--glow-strong);
  transition: width 260ms var(--ease-out-expo);
  pointer-events: none;
  z-index: 2;
}

.laser-fill::after {
  content: "";
  position: absolute;
  right: -5px;
  top: 50%;
  width: 11px;
  height: 11px;
  border-radius: 50%;
  transform: translateY(-50%);
  background: #ffffff;
  border: 2px solid var(--accent);
  box-shadow: 0 0 12px var(--accent);
}

#motion-app[data-rtl-nav="true"] .laser-fill {
  background: linear-gradient(270deg, var(--accent), var(--accent-alt));
}

#motion-app[data-rtl-nav="true"] .laser-fill::after {
  right: auto;
  left: -5px;
}

.act-node {
  position: absolute;
  top: 50%;
  left: var(--n-pct, 0%);
  transform: translate(-50%, -50%);
  width: 9px;
  height: 9px;
  padding: 0;
  border-radius: 50%;
  border: 1.5px solid var(--bg-void);
  background: rgba(148, 163, 184, 0.55);

    _renderKineticCaption: function (caption, keyWords) {

      var clean = toWesternDigits(caption || "").trim();
      if (!clean) {

      var keys = Array.isArray(keyWords) ? keyWords : [];
      var words = clean.split(/\s+/);
      el.innerHTML = words.map(function (w, i) {
        var isHighlight = false;
        for (var k = 0; k < keys.length; k++) {
          if (keys[k] && w.indexOf(keys[k]) !== -1) {
            isHighlight = true;
            break;
          }
        }
        var cls = isHighlight ? "kw-inner is-key" : "kw-inner";
        var delay = Math.min(i * 18, 320);
        return '<span class="kw-mask"><span class="' + cls + '" style="animation-delay:' + delay + 'ms">' + escapeHtml(w) + '</span></span>';
      }).join(" ");
    },

    _animateTelemetryMetric: function (rawVal, isArabic) {
      var el = this._els.statVal;
      if (!el) return;
      if (this._metricRaf) cancelAnimationFrame(this._metricRaf);

      var finalStr = toWesternDigits(rawVal || "");
      el.classList.toggle("is-arabic", Boolean(isArabic));

      // Check if leading numeric value can roll up kinetically (e.g. "92.2%", "50%", "32%")
      var m = finalStr.match(/^([>~]?\s*)(\d+(?:\.\d+)?)(.*)$/);
      if (!m) {
        el.textContent = finalStr;
        return;
      }

      var prefix = m[1] || "";
      var targetNum = parseFloat(m[2]);
      var suffix = m[3] || "";
      var hasDec = m[2].indexOf(".") !== -1;
      var startTs = performance.now();
      var dur = 480;
      var self = this;

      function tick(now) {
        var p = Math.min(1, (now - startTs) / dur);
        var eased = 1 - Math.pow(1 - p, 3);
        var cur = targetNum * eased;
        el.textContent = prefix + (hasDec ? cur.toFixed(1) : String(Math.round(cur))) + suffix;
        if (p < 1) {
          self._metricRaf = requestAnimationFrame(tick);
        } else {
          el.textContent = finalStr;
        }
      }
      this._metricRaf = requestAnimationFrame(tick);
    },

    _applyCastMap: function (activeMap, snapEntrance, instantSnap) {
      this._activeActorsMap = activeMap || {};

      for (var i = 0; i < ids.length; i++) {
        var id = ids[i];
        var slot = this.actorPool[id];
        if (!slot) continue;

        var cfg = activeMap[id];
        var el = slot.el;

          slot.calloutEl.textContent = "";
          continue;
        }

        var def = global.MotionCast.CAST_DEFS[id];
        var tx = typeof cfg.x === "number" ? cfg.x : 50;
        var ty = typeof cfg.y === "number" ? cfg.y : 16.5;
        var tScale = (typeof cfg.scale === "number" ? cfg.scale : 1) * (def.heightScale || 1);
        var flipped = Boolean(cfg.flip);

        if (instantSnap) {
          el.style.transition = "none";
        } else if (!wasPresent || snapEntrance) {
          el.style.transition = "none";
          var startX = Math.max(8, Math.min(92, tx + (flipped ? 4.5 : -4.5)));
          el.style.setProperty("--ax", startX + "%");
          el.style.setProperty("--ay", ty + "%");
          el.style.setProperty("--ascale", (tScale * 0.94).toFixed(3));
          void el.offsetWidth;
          el.style.transition = "";
        } else if (slot.lastX !== null && Math.abs(tx - slot.lastX) >= 4) {
          el.classList.remove("is-walking");
          void el.offsetWidth;
          el.classList.add("is-walking");
          if (slot.walkTimer) clearTimeout(slot.walkTimer);
          slot.walkTimer = setTimeout((function (node) {
            return function () { node.classList.remove("is-walking"); };
          })(el), 800);
        }

        slot.lastX = tx;
        el.style.setProperty("--ax", tx + "%");
        el.style.setProperty("--ay", ty + "%");
        el.style.setProperty("--ascale", tScale.toFixed(3));
        el.style.setProperty("--aflip", flipped ? "-1" : "1");

        var lx = cfg.look && typeof cfg.look[0] === "number" ? cfg.look[0] : 0;
        var ly = cfg.look && typeof cfg.look[1] === "number" ? cfg.look[1] : 0;
        el.style.setProperty("--look-x", (flipped ? -lx : lx).toFixed(2) + "px");
        el.style.setProperty("--look-y", ly.toFixed(2) + "px");

        el.setAttribute("data-present", "true");
        el.setAttribute("data-flipped", flipped ? "true" : "false");
        el.setAttribute("data-depth", cfg.depth || "fore");
        el.setAttribute("data-mood", cfg.mood || "neutral");
        el.setAttribute("data-posture", cfg.posture || "neutral");
        el.setAttribute("data-arms", cfg.arms || "relaxed");

        slot.nameEl.textContent = toWesternDigits(cfg.label || def.name);
        slot.roleEl.textContent = toWesternDigits(cfg.role || def.role);

        if (cfg.whisper) {
          slot.calloutEl.textContent = toWesternDigits(cfg.whisper);
          slot.calloutEl.setAttribute("data-tone", cfg.wTone || "normal");
          slot.calloutEl.setAttribute("data-tier", "low");
          slot.calloutEl.style.setProperty("--c-dx", "0px");
          slot.calloutEl.style.setProperty("--c-dy", "0px");

          slot.calloutEl.textContent = "";

        if (instantSnap) {
          void el.offsetWidth;
          el.style.transition = "";
        }

    _scheduleCalloutLayout: function (instant) {
      var self = this;
      if (this._calloutTimerA) clearTimeout(this._calloutTimerA);
      if (this._calloutTimerB) clearTimeout(this._calloutTimerB);
      this._resolveCalloutGeometry();

        this._calloutTimerA = setTimeout(function () { self._resolveCalloutGeometry(); }, 180);

    _resolveCalloutGeometry: function () {
      var vw = global.innerWidth || 1280;
      var ids = global.MotionCast.ACTOR_IDS;
      var items = [];

      for (var i = 0; i < ids.length; i++) {
        var slot = this.actorPool[ids[i]];
        if (!slot || !slot.el || slot.el.getAttribute("data-present") !== "true") continue;
        var cel = slot.calloutEl;
        if (!cel || !cel.classList.contains("is-visible")) continue;
        var cs = global.getComputedStyle(cel);
        if (cs.display === "none" || cs.visibility === "hidden") continue;

        cel.style.transition = "none";
        cel.setAttribute("data-tier", "low");
        cel.style.setProperty("--c-dx", "0px");
        cel.style.setProperty("--c-dy", "0px");
        var r = cel.getBoundingClientRect();
        if (r.width > 0 && r.height > 0) {
          items.push({
            el: cel,
            dx: 0,
            dy: 0,
            left: r.left,
            right: r.right,
            top: r.top,
            bottom: r.bottom,
            width: r.width,
            height: r.height
          });
        }
      }

      if (!items.length) return;

      var topbarRect = document.querySelector(".motion-topbar")
        ? document.querySelector(".motion-topbar").getBoundingClientRect()
        : null;
      var statRect = (this._els.statBox && this._els.statBox.classList.contains("is-visible"))
        ? this._els.statBox.getBoundingClientRect()
        : null;
      var pillsRect = (this._els.pillsRow && this._els.pillsRow.classList.contains("is-visible") && this._els.pillsRow.children.length)
        ? this._els.pillsRow.getBoundingClientRect()
        : null;

      // 1. Clamp every callout horizontally inside [8, vw - 8]
      var marginX = 8;
      for (var k = 0; k < items.length; k++) {
        var it = items[k];
        if (it.left < marginX) {
          var addR = marginX - it.left;
          it.dx += addR;
          it.left += addR;
          it.right += addR;
        }
        if (it.right > vw - marginX) {
          var subL = it.right - (vw - marginX);
          it.dx -= subL;
          it.left -= subL;
          it.right -= subL;
        }
      }

      // Helper for 2D rectangle overlap with safety pad
      var boxesHit = function (a, b, padX, padY) {
        if (!b || b.width <= 0 || b.height <= 0) return false;
        var ox = Math.min(a.right + padX, b.right) - Math.max(a.left - padX, b.left);
        var oy = Math.min(a.bottom + padY, b.bottom) - Math.max(a.top - padY, b.top);
        return ox > 0 && oy > 0;
      };

      // 2. Push down below Topbar / StatBox / PillsRow ceiling (+14px buffer for entry transform)
      var applyCeiling = function (it) {
        if (topbarRect && it.top < topbarRect.bottom + 8) {
          var pushT = (topbarRect.bottom + 8) - it.top;
          it.dy += pushT;
          it.top += pushT;
          it.bottom += pushT;
        }
        if (statRect && boxesHit(it, { left: statRect.left, right: statRect.right, top: statRect.top - 12, bottom: statRect.bottom + 14, width: statRect.width, height: statRect.height + 26 }, 4, 2)) {
          var pushS = (statRect.bottom + 14) - it.top;
          if (pushS > 0) {
            it.dy += pushS;
            it.top += pushS;
            it.bottom += pushS;
          }
        }
        if (pillsRect && boxesHit(it, { left: pillsRect.left, right: pillsRect.right, top: pillsRect.top - 10, bottom: pillsRect.bottom + 14, width: pillsRect.width, height: pillsRect.height + 24 }, 4, 2)) {
          var pushP = (pillsRect.bottom + 14) - it.top;
          if (pushP > 0) {
            it.dy += pushP;
            it.top += pushP;
            it.bottom += pushP;
          }
        }
      };

      for (var c0 = 0; c0 < items.length; c0++) {
        applyCeiling(items[c0]);
      }

      // 3. Pairwise Callout-vs-Callout Separation
      items.sort(function (a, b) { return a.left - b.left; });
      for (var p = 1; p < items.length; p++) {
        for (var q = 0; q < p; q++) {
          var prev = items[q];
          var curr = items[p];
          if (boxesHit(curr, prev, 6, 6)) {
            // Try lifting curr above prev first
            var liftUp = (curr.bottom - prev.top) + 10;
            var testTop = curr.top - liftUp;
            var minCeil = topbarRect ? topbarRect.bottom + 8 : 48;
            if (statRect && curr.right > statRect.left - 6 && curr.left < statRect.right + 6) {
              minCeil = Math.max(minCeil, statRect.bottom + 14);
            }
            if (pillsRect && curr.right > pillsRect.left - 6 && curr.left < pillsRect.right + 6) {
              minCeil = Math.max(minCeil, pillsRect.bottom + 14);
            }
            if (testTop >= minCeil) {
              curr.dy -= liftUp;
              curr.top -= liftUp;
              curr.bottom -= liftUp;
            } else {
              var pushDown = (prev.bottom - curr.top) + 10;
              curr.dy += pushDown;
              curr.top += pushDown;
              curr.bottom += pushDown;
            }
          }
        }
      }

      for (var m = 0; m < items.length; m++) {
        items[m].el.style.setProperty("--c-dx", Math.round(items[m].dx) + "px");
        items[m].el.style.setProperty("--c-dy", Math.round(items[m].dy) + "px");
        void items[m].el.offsetWidth;
        items[m].el.style.transition = "";
      }
    },

    _applyTelemetry: function (beat) {

    _mountSimulator: function (beat) {

            : { x: 24, y: 16.5, scale: 0.98, mood: "mocking", posture: "phone", arms: "phone", look: [2.2, 0.5], role: "خلف حاجز الشاشة", whisper: c.darkWhisper, wTone: "hostile" };
          map.sami = faceToFace
            ? { x: 68, y: 16.5, scale: 1.0, flip: true, mood: "radiant", posture: "confident", arms: "notebook", look: [-2.0, 0], role: "كرامة إنسانية مصونة", whisper: "الحضور الإنساني يستعيد الاحترام", wTone: "defender" }
            : { x: 76, y: 16.5, scale: 0.94, flip: true, mood: "hurt", posture: "slumped", arms: "notebook", look: [-2.2, 0.6], role: "يتلقّى الضرر خلف الشاشة", whisper: "الرسالة الرقمية تصيب إنساناً حقيقياً", wTone: "thought" };
          self._applyCastMap(map, false, Boolean(instant));
          self._scheduleCalloutLayout(Boolean(instant));

          var tabs = global.MOTION_LABS.mirrorCases.map(function (mc, idx) {
            return '<button type="button" class="sim-btn' + (idx === curIdx ? ' is-selected' : '') + '" data-mir-idx="' + idx + '">' + escapeHtml(mc.btn) + '</button>';
          }).join("");

          ].join("");
        };

        renderMirror(true);
        sim.onclick = function (e) {
          var tBtn = e.target.closest("[data-mir-idx]");
          if (tBtn) {
            e.stopPropagation();
            self._simState.mirrorIdx = parseInt(tBtn.getAttribute("data-mir-idx"), 10) || 0;
            self._simState.mirrorLit = false;
            renderMirror(false);
            MotionAudio.play("cyberGlitch");
            return;
          }
          if (e.target.closest("[data-mir-flip]")) {
            e.stopPropagation();
            self._simState.mirrorLit = !self._simState.mirrorLit;
            if (self._fx) self._fx.triggerBurst(1, false);
            renderMirror(false);
            MotionAudio.play(self._simState.mirrorLit ? "shieldChord" : "cyberGlitch");
          }
        };
        return;
      }

      if (mode === "scale") {
        var renderScale = function (instant) {
          var sIdx = self._simState.scaleIdx || 0;
          var picked = self._simState.scalePicked || "";
          var solved = self._simState.scaleSolved;
          var item = global.MOTION_LABS.scaleCases[sIdx];
          var isRight = picked === item.answer;
          var tilt = picked ? item.tilt : 0;

          global.MotionSets.applyScene(self._els.svgHost, "interactive-studio", "lab-scale");
          if (self._fx) {
            self._fx.setTargets({ scaleTilt: tilt, subState: "lab-scale" });
          }

          var map = {};
          map[item.leftActor] = {
            x: 20, y: 16.5, scale: 0.96,
            mood: isRight ? "serene" : (item.answer === "bullying" ? "anxious" : "neutral"),
            posture: item.answer === "bullying" && !isRight ? "cowering" : "confident",
            arms: "notebook", look: [2.0, 0], role: item.env
          };
          map[item.rightActor] = {
            x: 80, y: 16.5, scale: 1.02, flip: true,
            mood: item.answer === "bullying" ? "smirk" : "empathetic",
            posture: item.answer === "bullying" ? "looming" : "neutral",
            arms: item.answer === "bullying" ? "crossed" : "relaxed",
            look: [-2.0, 0], role: "الطرف المقابل"
          };
          self._applyCastMap(map, false, Boolean(instant));
          self._scheduleCalloutLayout(Boolean(instant));

          var caseBtns = global.MOTION_LABS.scaleCases.map(function (sc, i) {
            var tag = solved[i] ? (pad2(sc.num) + " • تم") : pad2(sc.num);
            return '<button type="button" class="sim-btn' + (i === sIdx ? ' is-selected' : '') + '" data-sc-idx="' + i + '" style="padding:5px 12px;">' + tag + '</button>';
          }).join("");

          var verdictBtn = function (k, label) {
            var cls = "sim-btn";
            if (picked) {
              if (k === item.answer) cls += " is-correct";
              else if (k === picked) cls += " is-wrong";
            }
            return '<button type="button" class="' + cls + '" data-sc-pick="' + k + '">' + label + '</button>';
          };

          sim.innerHTML = [
            '<div class="sim-card sim-top-bar">',

            '</div>',
            '<div class="sim-card sim-bottom-console">',
            '  <div class="sim-prompt-box">',

            (picked
              ? '<div class="sim-prompt-sub" style="color:' + (isRight ? '#34d399' : '#fda4af') + ';">' +
                escapeHtml(isRight ? item.verdictNote : "راجع القرائن الثلاثة: توازن القوة، والتكرار، والاستجابة لضيق الآخر.") + '</div>'

        renderScale(true);

            renderScale(false);
            MotionAudio.play("stepClick");

          var pBtn = e.target.closest("[data-sc-pick]");

            e.stopPropagation();
            var pick = pBtn.getAttribute("data-sc-pick");

            var item = global.MOTION_LABS.scaleCases[curIdx];

          else if (act === "refs") self.openRefs("");
        };
      }

    /* ----------------------------------------------------------------------
       HUD & Scrubber Synchronization
       ---------------------------------------------------------------------- */
    _syncHudState: function (beat, idx) {
      var total = this.beats.length;
      var sIdx = beat.sceneIndex || 1;

      if (this._els.sceneNum) {
        this._els.sceneNum.textContent = "ACT " + pad2(sIdx) + "/" + pad2(this.scenes.length);
      }
      if (this._els.sceneTitle) {
        this._els.sceneTitle.textContent = toWesternDigits(beat.sceneTitle || "");
      }
      if (this._els.counter) {
        this._els.counter.textContent = pad2(idx + 1) + " / " + pad2(total);
      }
      if (this._els.timelineFill) {
        var pct = total <= 1 ? 100 : ((idx + 1) / total) * 100;
        this._els.timelineFill.style.width = pct.toFixed(2) + "%";
      }
      if (this._els.btnPrev) this._els.btnPrev.disabled = idx <= 0;
      if (this._els.btnNext) this._els.btnNext.disabled = idx >= total - 1;

      var curAct = null;
      for (var s = 0; s < this.scenes.length; s++) {
        if (this.scenes[s].sceneIndex === sIdx) {
          curAct = this.scenes[s];
          break;
        }
      }
      if (curAct && this._els.intraDots) {
        var localNum = 1;
        this._els.intraDots.innerHTML = curAct.beatIndices.map(function (bIndex, stepIdx) {
          var cls = "intra-seg";
          if (bIndex === idx) {
            cls += " is-active";
            localNum = stepIdx + 1;
          } else if (bIndex < idx) {
            cls += " is-done";
          }
          return '<button type="button" class="' + cls + '" data-goto="' + bIndex + '" aria-label="التحوّل ' + (stepIdx + 1) + '"></button>';
        }).join("");
        if (this._els.intraCount) {
          this._els.intraCount.textContent = pad2(localNum) + "/" + pad2(curAct.beatIndices.length);
        }
      }

      var nodes = this._els.timelineMarkers ? this._els.timelineMarkers.querySelectorAll(".act-node") : [];
      for (var n = 0; n < nodes.length; n++) {
        var nAct = parseInt(nodes[n].getAttribute("data-act-node"), 10);
        var nStart = parseInt(nodes[n].getAttribute("data-goto"), 10);
        nodes[n].classList.toggle("is-current", nAct === sIdx);
        nodes[n].classList.toggle("is-reached", idx >= nStart);
      }

      var cards = this._els.drawerBody ? this._els.drawerBody.querySelectorAll(".matrix-beat-btn") : [];
      for (var c = 0; c < cards.length; c++) {
        cards[c].classList.toggle("is-current", parseInt(cards[c].getAttribute("data-beat-card"), 10) === idx);
      }
    },

    /* ----------------------------------------------------------------------
       Public Navigation & Controls API
       ---------------------------------------------------------------------- */
    goTo: function (targetIdx, opts) {
      var o = opts || {};
      var total = this.beats.length;
      if (!total) return false;
      var clamped = Math.max(0, Math.min(total - 1, targetIdx));
      if (clamped === this.currentIndex && !o.force) return false;

      var prevBeat = this.beats[this.currentIndex] || null;
      this.currentIndex = clamped;
      this._applyBeat(clamped, prevBeat, Boolean(o.silent));

      if (this.autoPlaying) this._scheduleAuto();
      return true;
    },

    next: function () {
      if (this.currentIndex >= this.beats.length - 1) return false;
      return this.goTo(this.currentIndex + 1);
    },

    prev: function () {
      if (this.currentIndex <= 0) {
        this.showToast(
          this.arrowReversed
            ? "بداية العرض — استخدم السهم الأيسر (←) للتقدّم"
            : "بداية العرض — استخدم السهم الأيمن (→) أو المسافة للتقدّم"
        );
        return false;
      }
      return this.goTo(this.currentIndex - 1);
    },

    nextScene: function () {
      var curS = this.beats[this.currentIndex].sceneIndex;
      for (var i = 0; i < this.scenes.length; i++) {
        if (this.scenes[i].sceneIndex > curS) {
          return this.goTo(this.scenes[i].firstBeatIdx);
        }
      }
      return false;
    },

    prevScene: function () {
      var curS = this.beats[this.currentIndex].sceneIndex;
      var curObj = this.scenes[curS - 1];
      if (curObj && this.currentIndex > curObj.firstBeatIdx) {
        return this.goTo(curObj.firstBeatIdx);
      }
      if (curS > 1) {
        return this.goTo(this.scenes[curS - 2].firstBeatIdx);
      }
      return false;
    },

    toggleTheme: function () {
      this.theme = this.theme === "dark" ? "light" : "dark";
      this._els.app.setAttribute("data-theme", this.theme);
      document.documentElement.setAttribute("data-theme", this.theme);
      if (this._els.themeSvg) {
        this._els.themeSvg.innerHTML = this.theme === "light" ? SVG_ICONS.moon : SVG_ICONS.sun;
      }
      if (this._fx) this._fx.setLightMode(this.theme === "light");
      MotionAudio.play("glassHarmonic");
      this.showToast(this.theme === "light" ? "الثيم العاجي التحريري مفعّل" : "ثيم الأوبسيديان السينمائي مفعّل");
    },

    toggleSound: function () {
      MotionAudio.enabled = !MotionAudio.enabled;
      var btn = this._els.app.querySelector('[data-ctrl="sound"]');
      if (btn) {
        btn.classList.toggle("is-active", MotionAudio.enabled);
        btn.setAttribute("aria-pressed", MotionAudio.enabled ? "true" : "false");
      }
      if (this._els.soundSvg) {
        this._els.soundSvg.innerHTML = MotionAudio.enabled ? SVG_ICONS.soundOn : SVG_ICONS.soundOff;
      }
      if (MotionAudio.enabled) MotionAudio.play("glassHarmonic");
      this.showToast(MotionAudio.enabled ? "التصميم الصوتي السينمائي مفعّل" : "تم كتم الصوت");
    },

    togglePolarity: function () {
      this.arrowReversed = !this.arrowReversed;
      this._els.app.setAttribute("data-rtl-nav", this.arrowReversed ? "true" : "false");
      var btn = this._els.app.querySelector('[data-ctrl="polarity"]');
      if (btn) {
        btn.classList.toggle("is-active", this.arrowReversed);
        btn.setAttribute("aria-pressed", this.arrowReversed ? "true" : "false");
      }
      MotionAudio.play("cyberGlitch");
      this.showToast(
        this.arrowReversed
          ? "قطبية RTL: (←) للتالي • (→) للسابق"
          : "قطبية العرض القياسية: (→) للتالي • (←) للسابق"
      );
    },

    _scheduleAuto: function () {
      if (this._autoTimer) clearTimeout(this._autoTimer);
      if (!this.autoPlaying) return;
      var self = this;
      this._autoTimer = setTimeout(function () {
        if (!self.autoPlaying) return;
        if (self.currentIndex < self.beats.length - 1) {
          self.next();
        } else {
          self.toggleAutoPlay(false);
          self.showToast("اكتمل التشغيل الوثائقي التلقائي");
        }
      }, AUTOPLAY_DELAY);
    },

    toggleAutoPlay: function (force) {
      this.autoPlaying = typeof force === "boolean" ? force : !this.autoPlaying;
      if (this._autoTimer) clearTimeout(this._autoTimer);
      var btn = this._els.app.querySelector('[data-ctrl="autoplay"]');
      if (btn) {
        btn.classList.toggle("is-active", this.autoPlaying);
        btn.setAttribute("aria-pressed", this.autoPlaying ? "true" : "false");
      }
      if (this._els.playSvg) {
        this._els.playSvg.innerHTML = this.autoPlaying ? SVG_ICONS.pause : SVG_ICONS.play;
      }
      if (this.autoPlaying) {
        if (this.currentIndex >= this.beats.length - 1) this.goTo(0, { force: true, silent: true });
        this.showToast("التشغيل التلقائي مفعّل — اضغط P للإيقاف");
        this._scheduleAuto();
      } else if (force === undefined) {
        this.showToast("تم إيقاف التشغيل التلقائي");
      }
    },

    toggleFullscreen: function () {
      var doc = document;
      var root = doc.documentElement;
      if (!doc.fullscreenElement && !doc.webkitFullscreenElement) {
        var req = root.requestFullscreen || root.webkitRequestFullscreen;
        if (req) {
          try {
            var p = req.call(root);
            if (p && p.catch) p.catch(function () {});
          } catch (e) {}
        }
      } else {
        var ex = doc.exitFullscreen || doc.webkitExitFullscreen;
        if (ex) {
          try {
            var q = ex.call(doc);
            if (q && q.catch) q.catch(function () {});
          } catch (e) {}
        }
      }
    },

    /* ----------------------------------------------------------------------
       Modals: Matrix Drawer & 79-Reference Vault
       ---------------------------------------------------------------------- */
    openDrawer: function () {
      if (this.refsOpen) this.closeRefs();
      this.drawerOpen = true;
      if (this.autoPlaying) this.toggleAutoPlay(false);
      this._els.drawerModal.classList.add("is-open");
      this._els.drawerModal.setAttribute("aria-hidden", "false");
      var cur = this._els.drawerBody.querySelector(".matrix-beat-btn.is-current");
      if (cur && cur.scrollIntoView) {
        setTimeout(function () { cur.scrollIntoView({ block: "nearest", behavior: "smooth" }); }, 40);
      }
    },

    closeDrawer: function () {
      this.drawerOpen = false;
      this._els.drawerModal.classList.remove("is-open");
      this._els.drawerModal.setAttribute("aria-hidden", "true");
    },

    toggleDrawer: function () {
      if (this.drawerOpen) this.closeDrawer();
      else this.openDrawer();
    },

    _renderRefFilters: function () {
      if (!this._els.refsCatBar) return;
      this._els.refsCatBar.innerHTML = REF_CATEGORIES.map(function (c, i) {
        return '<button type="button" class="ref-filter-chip' + (i === 0 ? ' is-active' : '') + '" data-ref-cat="' + c.id + '">' + escapeHtml(c.label) + '</button>';
      }).join("");
    },

    _renderRefsVault: function () {
      if (!this._els.refsGrid) return;
      var q = normSearch(this.refQuery);
      var cat = this.refCat;
      var filtered = this.refs.filter(function (r) {
        if (cat !== "all" && r.cat !== cat) return false;
        if (!q) return true;
        if (String(r.num) === q || "#" + r.num === q) return true;
        return normSearch(r.num + " " + r.title + " " + (CAT_TITLES[r.cat] || "")).indexOf(q) !== -1;
      });

      if (this._els.refsCountBadge) {
        this._els.refsCountBadge.textContent = filtered.length === this.refs.length
          ? (this.refs.length + " مرجعاً")
          : (filtered.length + " من " + this.refs.length);
      }
      if (this._els.refsClearBtn) {
        this._els.refsClearBtn.hidden = !this.refQuery;
      }

      if (!filtered.length) {
        this._els.refsGrid.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:32px;opacity:0.75;">لا توجد مراجع مطابقة لعبارة البحث الحالية.</div>';
        return;
      }

      this._els.refsGrid.innerHTML = filtered.map(function (r) {
        return (
          '<div class="ref-vault-card">' +
          '  <div class="ref-vault-top">' +
          '    <span class="ref-vault-id">REF #' + pad2(r.num) + '</span>' +
          '    <span class="ref-vault-domain">' + escapeHtml(CAT_TITLES[r.cat] || "مرجع محكّم") + '</span>' +
          '  </div>' +
          '  <div class="ref-vault-title">' + escapeHtml(r.title) + '</div>' +
          '  <a class="ref-vault-ext" href="' + escapeHtml(r.url) + '" target="_blank" rel="noopener noreferrer">فتح الوثيقة الأصلية ↗</a>' +
          '</div>'
        );
      }).join("");
    },

    openRefs: function (initialQuery) {
      if (this.drawerOpen) this.closeDrawer();
      this.refsOpen = true;
      if (this.autoPlaying) this.toggleAutoPlay(false);
      if (typeof initialQuery === "string") {
        this.refQuery = initialQuery;
        this.refCat = "all";
        if (this._els.refsSearchInput) this._els.refsSearchInput.value = initialQuery;
        var chips = this._els.refsCatBar.querySelectorAll("[data-ref-cat]");
        for (var i = 0; i < chips.length; i++) {
          chips[i].classList.toggle("is-active", chips[i].getAttribute("data-ref-cat") === "all");
        }
      }
      this._renderRefsVault();
      this._els.refsModal.classList.add("is-open");
      this._els.refsModal.setAttribute("aria-hidden", "false");
    },

    closeRefs: function () {
      this.refsOpen = false;
      this._els.refsModal.classList.remove("is-open");
      this._els.refsModal.setAttribute("aria-hidden", "true");
    },

    showToast: function (msg) {
      var t = this._els.toast;
      if (!t) return;
      if (this._toastTimer) clearTimeout(this._toastTimer);
      t.style.top = this._computeTopClearance() + "px";
      t.textContent = toWesternDigits(msg);
      t.classList.add("is-visible");
      this._toastTimer = setTimeout(function () {
        t.classList.remove("is-visible");
      }, 2400);
    },

    getState: function () {
      var b = this.beats[this.currentIndex] || {};
      return {
        currentIndex: this.currentIndex,
        beatNum: b.num || this.currentIndex + 1,
        totalBeats: this.beats.length,
        sceneIndex: b.sceneIndex || 1,
        sceneId: b.sceneId || "",
        envState: b.envState || "",
        theme: this.theme,
        arrowReversed: this.arrowReversed,
        autoPlaying: this.autoPlaying,
        drawerOpen: this.drawerOpen,
        refsOpen: this.refsOpen
      };
    },

    /* ----------------------------------------------------------------------
       Event Bindings
       ---------------------------------------------------------------------- */
    _bindInteractions: function () {
      var self = this;

      this._els.app.addEventListener("click", function (e) {
        var closeBtn = e.target.closest("[data-close]");
        if (closeBtn) {
          if (closeBtn.getAttribute("data-close") === "drawer") self.closeDrawer();
          else self.closeRefs();
          return;
        }
        if (e.target === self._els.drawerModal) { self.closeDrawer(); return; }
        if (e.target === self._els.refsModal) { self.closeRefs(); return; }

        var gotoEl = e.target.closest("[data-goto]");
        if (gotoEl) {
          e.stopPropagation();
          var idx = parseInt(gotoEl.getAttribute("data-goto"), 10);
          if (self.drawerOpen) self.closeDrawer();
          if (!isNaN(idx)) self.goTo(idx);
          return;
        }

        if (e.target.closest("#subtitle-source")) {
          var q = self._els.subtitleSource.getAttribute("data-cite-query") || "";
          self.openRefs(q);
          return;
        }

        var catChip = e.target.closest("[data-ref-cat]");
        if (catChip) {
          self.refCat = catChip.getAttribute("data-ref-cat") || "all";
          var allChips = self._els.refsCatBar.querySelectorAll("[data-ref-cat]");
          for (var i = 0; i < allChips.length; i++) {
            allChips[i].classList.toggle("is-active", allChips[i] === catChip);
          }
          self._renderRefsVault();
          return;
        }

        if (e.target.closest("#refs-clear-btn")) {
          self.refQuery = "";
          if (self._els.refsSearchInput) {
            self._els.refsSearchInput.value = "";
            self._els.refsSearchInput.focus();
          }
          self._renderRefsVault();
          return;
        }

        var ctrl = e.target.closest("[data-ctrl]");
        if (ctrl) {
          var c = ctrl.getAttribute("data-ctrl");
          if (c === "next") self.next();
          else if (c === "prev") self.prev();
          else if (c === "theme") self.toggleTheme();
          else if (c === "sound") self.toggleSound();
          else if (c === "polarity") self.togglePolarity();
          else if (c === "autoplay") self.toggleAutoPlay();
          else if (c === "drawer") self.toggleDrawer();
          else if (c === "refs") self.openRefs("");
          else if (c === "fullscreen") self.toggleFullscreen();
          if (e.detail > 0 && ctrl.blur) ctrl.blur();
        }
      });

      this._els.touchSurface.addEventListener("click", function (e) {
        if (self.drawerOpen || self.refsOpen) return;
        if (e.target.closest("button, a, input, .sim-card")) return;
        var curBeat = self.beats[self.currentIndex];
        if (curBeat && curBeat.interactive) return;
        if (self.currentIndex < self.beats.length - 1) self.next();
      });

      var scrubbing = false;
      var scrubToClientX = function (clientX, silentDrag) {
        var rect = self._els.timelineTrack.getBoundingClientRect();
        if (!rect.width) return;
        var ratio = self.arrowReversed
          ? (rect.right - clientX) / rect.width
          : (clientX - rect.left) / rect.width;
        ratio = Math.max(0, Math.min(1, ratio));
        self.goTo(Math.round(ratio * (self.beats.length - 1)), { silent: Boolean(silentDrag) });
      };

      this._els.timelineTrack.addEventListener("pointerdown", function (e) {
        if (e.target.closest(".act-node")) return;
        scrubbing = true;
        if (self._els.timelineTrack.setPointerCapture) {
          try { self._els.timelineTrack.setPointerCapture(e.pointerId); } catch (err) {}
        }
        scrubToClientX(e.clientX, false);
      });

      this._els.timelineTrack.addEventListener("pointermove", function (e) {
        if (!scrubbing) return;
        scrubToClientX(e.clientX, true);
      });

      var stopScrub = function () { scrubbing = false; };
      this._els.timelineTrack.addEventListener("pointerup", stopScrub);
      this._els.timelineTrack.addEventListener("pointercancel", stopScrub);

      this._els.timelineTrack.addEventListener("click", function (e) {
        if (e.target.closest(".act-node")) return;
        scrubToClientX(e.clientX, false);
      });

      global.addEventListener("resize", function () {
        self._scheduleCalloutLayout(true);
      });

      if (this._els.refsSearchInput) {
        this._els.refsSearchInput.addEventListener("input", function (e) {
          self.refQuery = e.target.value || "";
          self._renderRefsVault();
        });
      }

      document.addEventListener("keydown", function (e) {
        if (e.metaKey || e.ctrlKey || e.altKey) return;
        var key = e.key;
        var inInput = e.target && e.target.closest && e.target.closest("input, textarea");

        if (key === "Escape") {
          if (self.refsOpen) { e.preventDefault(); self.closeRefs(); return; }
          if (self.drawerOpen) { e.preventDefault(); self.closeDrawer(); return; }
          if (inInput) { e.target.blur(); return; }
          if (self.autoPlaying) self.toggleAutoPlay(false);
          return;
        }

        if (inInput) return;
        if (self.refsOpen) {
          if (key === "r" || key === "R" || key === "ق") { e.preventDefault(); self.closeRefs(); }
          return;
        }
        if (self.drawerOpen) {
          if (key === "m" || key === "M" || key === "ة") { e.preventDefault(); self.closeDrawer(); }
          return;
        }

        if (e.shiftKey && key === "ArrowRight") {
          e.preventDefault();
          if (!self.arrowReversed) self.nextScene();
          else self.prevScene();
          return;
        }
        if (e.shiftKey && key === "ArrowLeft") {
          e.preventDefault();
          if (!self.arrowReversed) self.prevScene();
          else self.nextScene();
          return;
        }
        if (key === "ArrowRight") {
          e.preventDefault();
          if (!self.arrowReversed) self.next();
          else self.prev();
          return;
        }
        if (key === "ArrowLeft") {
          e.preventDefault();
          if (!self.arrowReversed) self.prev();
          else self.next();
          return;
        }
        if (key === " " || key === "Spacebar" || key === "PageDown" || key === "ArrowDown") {
          if (e.target && e.target.closest && e.target.closest("#simulators-layer button")) return;
          e.preventDefault();
          self.next();
          return;
        }
        if (key === "Backspace" || key === "PageUp" || key === "ArrowUp") {
          e.preventDefault();
          self.prev();
          return;
        }
        if (key === "Home") { e.preventDefault(); self.goTo(0); return; }
        if (key === "End") { e.preventDefault(); self.goTo(self.beats.length - 1); return; }
        if (key === "s" || key === "S" || key === "س") { e.preventDefault(); self.toggleSound(); return; }
        if (key === "p" || key === "P" || key === "ح") { e.preventDefault(); self.toggleAutoPlay(); return; }
        if (key === "t" || key === "T" || key === "ف") { e.preventDefault(); self.toggleTheme(); return; }
        if (key === "f" || key === "F" || key === "ب") { e.preventDefault(); self.toggleFullscreen(); return; }
        if (key === "r" || key === "R" || key === "ق") { e.preventDefault(); self.openRefs(""); return; }
        if (key === "m" || key === "M" || key === "ة") { e.preventDefault(); self.toggleDrawer(); }
      });

      var tx = 0;
      var ty = 0;
      var swiping = false;
      this._els.touchSurface.addEventListener("touchstart", function (e) {
        if (self.drawerOpen || self.refsOpen || !e.touches || e.touches.length !== 1) return;
        if (e.target.closest("button, a, .sim-card")) return;
        swiping = true;
        tx = e.touches[0].clientX;
        ty = e.touches[0].clientY;
      }, { passive: true });

      this._els.touchSurface.addEventListener("touchend", function (e) {
        if (!swiping || !e.changedTouches || !e.changedTouches.length) return;
        swiping = false;
        var dx = e.changedTouches[0].clientX - tx;
        var dy = e.changedTouches[0].clientY - ty;
        if (Math.abs(dx) > 44 && Math.abs(dx) > Math.abs(dy) * 1.25) {
          if (dx < 0) {
            if (!self.arrowReversed) self.next();
            else self.prev();
          } else {
            if (!self.arrowReversed) self.prev();
            else self.next();
          }
        }
      }, { passive: true });
    }
  };

  global.MotionEngine = MotionEngine;
  global.CinemaEngine = MotionEngine;
  global.StoryEngine = MotionEngine;

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", function () { MotionEngine.init(); });
  } else {
    MotionEngine.init();
  }
})(window);
  </script>
</body>
</html>
